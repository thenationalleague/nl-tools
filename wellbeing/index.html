<!DOCTYPE html>
<!--
  NL Tools — Wellbeing (RETIRED, redirect only)
  Version: v3.0 (08/10/2026)
  File: /wellbeing/index.html

  THIS IS A REDIRECT STUB. The Wellbeing section that lived here was retired
  on 08/10/2026 and replaced by /wellbeing-hub/, which is now the correct
  version. What it was, what it held, and the decisions worth keeping are
  recorded in system/retired/wellbeing.md. The pages themselves are in git
  history — the last full version is v2.3, 78KB, one file.

  WHY A STUB AND NOT A DELETION
  The old section was reached by its URL and nothing else: no portal card, no
  registry record, no link from any tool. That means every route to it is
  somewhere this repo cannot see — a CMS block on thenationalleague.org.uk, a
  club email, a WhatsApp message, a printed sheet on a wall. Deleting the
  directory turns all of them into a 404, and a dead link is a worse failure
  here than on any other page in the estate: the person following it is
  looking for help with their mental health.

  GitHub Pages serves static files and cannot send a 301, so this is a meta
  refresh plus a canonical pointing at the hub, with a real link in the body
  for anyone whose browser ignores both. It carries no stylesheet and no
  script on purpose — a redirect that waits on an asset is a redirect that
  can fail to happen.

  WHEN THIS CAN GO
  Once the inbound links are updated and the logs are quiet. Nothing measures
  it today: GA4 landed on nl.tools the same day and this page is deliberately
  untagged, because measuring it would mean loading a third-party script on a
  page whose only job is to leave immediately. If it matters later, read the
  hub's ?src=old-wellbeing arrivals instead — the redirect below carries it.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wellbeing Hub — The National League</title>
  <meta http-equiv="refresh" content="0; url=/wellbeing-hub/?src=old-wellbeing">
  <link rel="canonical" href="https://nl.tools/wellbeing-hub/">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32x32.png">
  <style>
    /* Inline and tiny. No /system/ request: this page must redirect even if
       the network is having a bad day. Values are literal rather than brand
       tokens for the same reason — nl-brand.css is not loaded here. */
    body {
      margin: 0; padding: 48px 20px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 17px; line-height: 1.55;
      color: #1a2a44; background: #f4f6f9;
    }
    main { max-width: 34em; margin: 0 auto; }
    a { color: #9e0000; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <h1>The Wellbeing Hub has moved</h1>
    <p><a href="/wellbeing-hub/?src=old-wellbeing">Open the Wellbeing Hub</a></p>
    <p>If you need help right now, call <a href="tel:999">999</a> when there is
      immediate danger, or Samaritans free on <a href="tel:116123">116 123</a>,
      day or night.</p>
  </main>
</body>
</html>
