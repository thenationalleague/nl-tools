<!DOCTYPE html>
<!--
  NL Tools — My pass
  Version: v1.8 (12/11/2026)
  File: /pass/index.html

  Your pass: the card you belong to (League or Club), the keys you hold on
  top of it, and every tool they open, with which part of the pass opened
  it. system/permissions-plan.md, "The pass"; design locked on boards 6–10
  of the "NL Tools – card and key concepts" canvas (12/11/2026).

  Three views, one page, chosen by ?view=:
    (none)      My pass — your own, and only your own.
    ?view=as    View as — anyone else's, real or made up. Skeleton key and
                Tester only. Shows the portal's answer (which tools, which
                level, why); it never opens a tool as them.
    ?view=issue Issue a pass — card, club, keys, job title. Skeleton key
                holders only (and, until the first passes exist, today's
                superadmin role: someone has to issue the first one).

  DISPLAY ONLY (step 3 of the plan). auth-guard still decides who opens
  what, from role and defaults. Nothing on this page grants anything.

  Storage (RTDB):
    users/<uid>/pass    the pass (shape: NL.pass in system/nl-utils.js).
                        Written here by the issue form; read by auth-guard
                        into the session for the menu and findings.
    tools               read: the registry, for each tool's `permissions`.
    users               read for View as and the issue form (League roles
                        can read it today; nothing new is opened up).

  Access: not a tool. auth-guard's OPEN_PAGES lets any signed-in, approved
  account in, because "your pass hasn't been issued yet" is this page's
  answer to someone with nothing — not "this tool isn't available".

  Changelog
  v1.8 (12/11/2026) — Reads each tool's live grants (NL.pass.loadRegistry). Back
    links go to Access (/access/), which replaced People and cards.
  v1.7 (12/11/2026) — Club logins: on a Club card, a tool with a club page
    links there (`clubUrl`), where the pass's club claim opens it.
  v1.6 (12/11/2026) — A strip's colour says its level: Manage in the pass's
    first colour (the club's primary, or League red), Access in its second
    (the club's secondary, or navy). View as and Issue a pass list every
    tool the pass does not open too, as outlines under "Not on this pass";
    the issue form shows that list live, under the form. My pass and the
    form lose their "until the switch" notes.
  v1.5 (12/11/2026) — Passes decide (auth-guard v16.0). Saving a pass also
    writes the per-tool entries the database rules read, worked out from
    the pass (NL.pass.toOld), in the same write; withdrawing one clears
    them, back to the role's defaults.
  v1.4 (12/11/2026) — A club pass's tool strips are all in the club's
    colours: the band colour where the card opened a tool, the key-sticker
    colour where a key did, matching the pass itself. Key strips were
    League navy, so a club's list came out half club, half League.
  v1.3 (12/11/2026) — Issue a pass belongs to People and cards (/people/):
    a way back to it, and ?uid= arrives with the person chosen. Keys take
    an optional end date. League Operations issue Club cards and club keys
    to club people only (NL.pass.issueRights); the Skeleton key everything.
    Until step 6 the database lets only League Admins and the superadmin
    write a pass, so the form is offered to those roles alone.
  v1.2 (12/11/2026) — Issue a pass shows the person in full before you
    issue: name, email, role today (and club), job title on the account,
    the pass they hold now with who issued it and when, and how long the
    account has existed. The search list shows email and role too, so two
    people with similar names can be told apart.
  v1.1 (12/11/2026) — The Skeleton key is a big ACCESS ALL AREAS sticker
    stuck across the holder's own pass, not a second pass hanging behind
    it: on a phone the second pass was almost entirely hidden. The skull
    and the words ACCESS ALL AREAS only, the skull full height on the
    left and the words on two lines to its right.
  v1.0 (12/11/2026) — First build, for the board meeting (~19/11/2026).
-->

<style>
  /* The pass is an illustration of a real lanyard pass (boards 6–10), so a
     few of its values are physical rather than brand: the metal of the clip
     and the drop shadow of a card hanging off the page. They are named here,
     once, and nowhere else. Every colour that MEANS something (League red,
     navy keys, a club's colours) is a token or the club's own data. */
  .pass-page {
    --clip-metal: #9aa3b0;       /* the clip: brushed steel, not a brand grey */
    --clip-metal-dark: #8a93a3;
    --clip-metal-light: #b8c0cc;
    --pass-shadow: 0 18px 40px rgba(17, 33, 74, .22), 0 0 0 5px rgba(255, 255, 255, .55), 0 0 0 6px rgba(17, 33, 74, .12);
    --skeleton: var(--navy-900);
    display: flex;
    flex-wrap: wrap;
    gap: 40px;
    align-items: flex-start;
    max-width: 1240px;
    margin: 0 auto;
  }
  .pass-col {
    flex: 0 0 auto;
    min-width: 380px;
    /* Pulled up under the top bar so the strap hangs from it. Clipped at the
       top only: the strap's end tucks under the bar, and the pass's shadow
       is left whole on the other three sides. */
    margin-top: calc(-1 * clamp(24px, 3vw, 56px));
    clip-path: inset(0 -200px -200px -200px);
    display: flex;
    justify-content: center;
    padding: 0 30px 40px;
    box-sizing: border-box;
    min-height: 700px;
  }
  .list-col { flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 24px; }

  /* ── The lanyards ─────────────────────────────────────────────────────── */
  .lanyards { position: relative; display: flex; }
  .lanyard { display: flex; flex-direction: column; align-items: center; }
  .lanyard--front { position: relative; z-index: 1; }
  .lanyard__swing {
    display: flex; flex-direction: column; align-items: center;
    transform: rotate(var(--sway)); transform-origin: 50% -700px;
  }
  .lanyard__strap {
    width: 36px; height: 110px; background: var(--strap, var(--navy));
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .lanyard__strap span {
    writing-mode: vertical-rl; transform: rotate(180deg);
    font-size: 10px; font-weight: 800; font-variation-settings: 'wght' 800;
    letter-spacing: .3em; color: var(--strap-text, var(--white)); opacity: .75;
  }
  .lanyard__hang { position: relative; padding-top: 34px; }
  .lanyard__clip { position: absolute; top: 0; left: 50%; transform: translateX(-50%); z-index: 2; overflow: visible; }

  .pass {
    width: 320px; border-radius: 16px; background: var(--white);
    box-shadow: var(--pass-shadow); overflow: hidden; color: var(--text);
  }
  .pass__slot { height: 22px; }
  .pass__band {
    background: var(--band); color: var(--band-text);
    padding: 14px 20px; margin-top: 12px; min-height: 44px;
    display: flex; align-items: center; gap: 12px;
  }
  .pass__seat {
    width: 48px; height: 48px; flex: 0 0 48px; border-radius: var(--radius-lg);
    background: var(--white); box-shadow: 0 1px 3px rgba(0, 0, 0, .18);
    display: flex; align-items: center; justify-content: center;
  }
  .pass__seat img { width: 40px; height: 40px; object-fit: contain; }
  .pass__org { font-size: 17px; line-height: 1.12; font-weight: 800; font-variation-settings: 'wght' 800; }
  .pass__who { padding: 16px 20px 2px; display: flex; gap: 12px; align-items: center; }
  .pass__face {
    width: 56px; height: 56px; flex: 0 0 56px; border-radius: var(--radius-lg); background: var(--navy-100);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: 800; font-variation-settings: 'wght' 800; color: var(--navy);
  }
  .pass__name { font-size: 17px; font-weight: 700; font-variation-settings: 'wght' 700; }
  .pass__job { font-size: 13px; color: var(--text-muted); }
  .pass__grid { padding: 16px 18px 22px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .pass__foot { background: var(--band); color: var(--band-text); font-size: 12px; font-weight: 700; font-variation-settings: 'wght' 700; padding: 10px 20px; }

  /* Stickers on the pass. A held key is a stuck-on sticker, slightly askew;
     a key not held is an empty slot with a faint icon and no words. */
  .sticker {
    aspect-ratio: 1 / 1; border: 2px solid var(--white); border-radius: var(--radius-lg);
    box-shadow: 0 1px 1.5px rgba(17, 33, 74, .22), inset 0 0 0 1px rgba(0, 0, 0, .04);
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 8px; box-sizing: border-box; overflow: hidden;
    background: var(--sticker); color: var(--sticker-text);
    transform: rotate(var(--tilt, 0deg));
  }
  .sticker--card { background: var(--band); color: var(--band-text); }
  .sticker__seat { width: 38px; height: 38px; border-radius: 8px; background: var(--white); display: flex; align-items: center; justify-content: center; }
  .sticker__seat img { width: 32px; height: 32px; object-fit: contain; }
  .sticker__code { font-size: 19px; letter-spacing: .03em; font-weight: 800; font-variation-settings: 'wght' 800; }
  .sticker__name { font-size: 11px; line-height: 1.12; font-weight: 700; font-variation-settings: 'wght' 700; }
  .slot-empty {
    aspect-ratio: 1 / 1; border-radius: var(--radius-lg); background: var(--navy-50);
    display: flex; align-items: center; justify-content: center; color: var(--navy-200);
  }

  /* The Skeleton key: a big black ACCESS ALL AREAS sticker slapped across
     the holder's own pass, between their keys and the footer, a little
     askew and overlapping both. v1.0 hung it as a second pass behind the
     first, where on a phone it all but disappeared (Richard, 12/11/2026). */
  .pass__aaa {
    position: relative; z-index: 2;
    margin: -10px 12px -12px; padding: 14px 18px 16px;
    background: var(--skeleton); color: var(--white);
    border: 3px solid var(--white); border-radius: 12px;
    box-shadow: 0 2px 3px rgba(17, 33, 74, .3), 0 8px 18px rgba(17, 33, 74, .22);
    transform: rotate(-3deg);
  }
  .pass__aaa { display: flex; align-items: stretch; gap: 14px; }
  /* The skull runs the full height of the two lines beside it. */
  .pass__aaa-skull { flex: 0 0 auto; display: flex; }
  .pass__aaa-skull svg { height: 100%; width: auto; }
  .pass__aaa-big { align-self: center; font-size: 32px; line-height: .95; white-space: nowrap; font-weight: 800; font-variation-settings: 'wght' 800; }
  .pass__aaa + .pass__foot { padding-top: 20px; }
  /* Stuck on once the pass has dropped: a quick press-down, then still. */
  @keyframes pass-stick {
    0% { opacity: 0; transform: rotate(-9deg) scale(1.25); }
    60% { opacity: 1; transform: rotate(-2deg) scale(.97); }
    100% { opacity: 1; transform: rotate(-3deg) scale(1); }
  }
  .lanyard.is-dropping .pass__aaa { animation: pass-stick .45s cubic-bezier(.3, .7, .4, 1) 1.15s both; }

  /* No pass yet: a blank card saying so, in place of an empty pass. */
  .pass--none .pass__none { padding: 40px 24px 48px; text-align: center; color: var(--text-muted); font-size: var(--text-sm); }
  .pass--none .pass__none strong { display: block; color: var(--text); font-size: var(--text-md); margin-bottom: 6px; font-weight: 700; font-variation-settings: 'wght' 700; }

  /* Motion: falls straight in, catches on the strap with a small wobble,
     then swings gently from a pivot well above the screen. No hover effect.
     Off for people whose device asks for less motion. */
  @keyframes pass-drop {
    0% { transform: translateY(-240px); opacity: 0; animation-timing-function: cubic-bezier(.5, 0, 1, .6); }
    10% { opacity: 1; }
    50% { transform: translateY(0); animation-timing-function: cubic-bezier(.2, .6, .4, 1); }
    60% { transform: translateY(7px); animation-timing-function: ease-in-out; }
    72% { transform: translateY(-2px); animation-timing-function: ease-in-out; }
    84% { transform: translateY(1px); animation-timing-function: ease-in-out; }
    100% { transform: translateY(0); }
  }
  @keyframes pass-settle {
    0% { transform: rotate(var(--sway)); animation-timing-function: cubic-bezier(.33, .66, .6, 1); }
    17% { transform: rotate(calc(var(--sway) + .9deg)); animation-timing-function: cubic-bezier(.37, 0, .63, 1); }
    52% { transform: rotate(calc(var(--sway) - .5deg)); animation-timing-function: cubic-bezier(.37, 0, .63, 1); }
    100% { transform: rotate(calc(var(--sway) + .35deg)); }
  }
  @keyframes pass-idle {
    0% { transform: rotate(calc(var(--sway) + .35deg)); }
    100% { transform: rotate(calc(var(--sway) - .35deg)); }
  }
  .lanyard.is-dropping { animation: pass-drop 1.1s var(--delay, 0s) both; }
  .lanyard.is-dropping .lanyard__swing {
    animation: pass-settle 4.2s linear calc(var(--delay, 0s) + .55s) both,
               pass-idle 3.5s cubic-bezier(.37, 0, .63, 1) calc(var(--delay, 0s) + 4.75s) infinite alternate;
  }
  .lanyard.is-still .lanyard__swing {
    animation: pass-idle 3.5s cubic-bezier(.37, 0, .63, 1) 0s infinite alternate;
  }
  @media (prefers-reduced-motion: reduce) {
    .lanyard, .lanyard__swing { animation: none !important; }
  }

  /* ── The list of tools ────────────────────────────────────────────────── */
  .pass-intro { font-size: var(--text-base); color: var(--text-muted); margin: 0; max-width: 64ch; }
  .pass-intro b { color: var(--text); font-weight: 700; font-variation-settings: 'wght' 700; }
  .pass-note { font-size: var(--text-sm); color: var(--text-muted); margin: -12px 0 0; }
  .issue-tools { display: flex; flex-direction: column; gap: 22px; margin-top: 28px; }
  .strips { display: flex; flex-direction: column; gap: 14px; }
  .strip {
    text-decoration: none; height: 78px; box-sizing: border-box;
    display: flex; align-items: center; gap: 18px; padding: 0 18px 0 22px;
    border-radius: var(--radius-lg);
    background: var(--strip, var(--navy)); color: var(--strip-text, var(--white));
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .16), 0 3px 0 var(--strip-edge, var(--navy-600)), 0 8px 16px rgba(17, 33, 74, .16);
  }
  /* A tool the pass does not open (View as and Issue a pass list every
     tool): an outline, no fill, no stickers, so the gaps read as clearly as
     what is held. */
  .strip--off {
    height: 52px; background: transparent; color: var(--text-muted);
    border: 1.5px solid var(--border); box-shadow: none;
  }
  .strip--off .strip__name { font-size: 15px; font-weight: 600; font-variation-settings: 'wght' 600; }
  .strips-head { font-size: var(--text-xs); text-transform: uppercase; letter-spacing: .08em; color: var(--text-muted); margin: 8px 0 -4px; font-weight: 800; font-variation-settings: 'wght' 800; }
  .strip:focus-visible { outline: none; box-shadow: var(--focus-ring); }
  .strip__text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .strip__name { font-size: 17px; line-height: 1.15; font-weight: 700; font-variation-settings: 'wght' 700; }
  .strip__desc {
    font-size: 14px; line-height: 1.3; opacity: .82;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .strip__stickers {
    display: flex; gap: 14px; align-items: center; height: 50px;
    padding-right: 16px; margin-right: 2px;
    border-right: 1px solid color-mix(in srgb, var(--strip-text, var(--white)) 25%, transparent);
  }
  .mini { position: relative; width: 42px; height: 42px; flex: 0 0 42px; }
  .mini--faded { opacity: .55; }
  .mini__face {
    position: absolute; inset: 0; border-radius: 8px; background: var(--white);
    box-shadow: 0 1px 1.5px rgba(0, 0, 0, .3);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 800; font-variation-settings: 'wght' 800; color: var(--mini-text, var(--navy));
  }
  .mini__face img { width: 28px; height: 28px; object-fit: contain; }
  .mini__face--skeleton { background: var(--skeleton); color: var(--white); }
  .mini__badge {
    position: absolute; right: -7px; bottom: -7px; width: 22px; height: 22px; border-radius: 50%;
    border: 2px solid var(--white); box-sizing: border-box;
    display: flex; align-items: center; justify-content: center;
    background: var(--white); color: var(--badge, var(--navy));
  }
  .mini__badge--manage { background: var(--badge, var(--navy)); color: var(--badge-text, var(--white)); }
  .mini__icon { width: 12px; height: 12px; }
  .strip__result {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    width: 96px; box-sizing: border-box; border-radius: var(--radius); padding: 7px 10px;
    font-size: 13px; font-weight: 700; font-variation-settings: 'wght' 700;
  }
  .strip__icon { width: 15px; height: 15px; }
  .strip__result--manage { background: var(--white); color: var(--strip, var(--navy)); }
  .strip__result--access { border: 1.5px solid color-mix(in srgb, var(--strip-text, var(--white)) 70%, transparent); color: var(--strip-text, var(--white)); }
  .strips-empty { color: var(--text-muted); font-size: var(--text-sm); }

  /* ── View as bar ──────────────────────────────────────────────────────── */
  .viewbar {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    background: var(--white); border: 1px solid var(--border); border-radius: var(--radius-lg);
    padding: 12px 16px;
  }
  .viewbar__who { flex: 1; min-width: 0; font-size: var(--text-sm); color: var(--text-muted); }
  .viewbar__who b { color: var(--text); font-weight: 700; font-variation-settings: 'wght' 700; }

  /* ── Chooser and issue form ───────────────────────────────────────────── */
  .chooser h3 { font-size: var(--text-xs); text-transform: uppercase; letter-spacing: .08em; color: var(--text-muted); margin: 18px 0 8px; font-weight: 800; font-variation-settings: 'wght' 800; }
  .chooser h3:first-child { margin-top: 0; }
  .pick-list { display: flex; flex-direction: column; border: 1px solid var(--border); border-radius: var(--radius); max-height: 260px; overflow-y: auto; }
  .pick-list button {
    display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left;
    padding: 10px 14px; border: 0; border-bottom: 1px solid var(--border); background: var(--white);
    font-family: var(--font); font-size: var(--text-sm); color: var(--text); cursor: pointer;
  }
  .pick-list button:last-child { border-bottom: 0; }
  .pick-list button:hover, .pick-list button[aria-pressed="true"] { background: var(--navy-50); }
  .pick-list button:focus-visible { outline: none; box-shadow: inset var(--focus-ring); }
  .pick-list small { color: var(--text-muted); font-size: var(--text-xs); }
  .pick-search { width: 100%; box-sizing: border-box; padding: 10px 14px; border: 1px solid var(--border); border-radius: var(--radius); font-family: var(--font); font-size: var(--text-sm); margin-bottom: 8px; }
  .pick-search:focus { outline: none; border-color: var(--primary); box-shadow: var(--focus-ring); }
  .choice-row { display: flex; flex-wrap: wrap; gap: 8px 18px; }
  .choice-row input[type="radio"], .choice-row input[type="checkbox"] { width: auto; padding: 0; margin: 0; flex: 0 0 auto; }
  .choice-row label { display: inline-flex; align-items: center; gap: 8px; font-size: var(--text-sm); color: var(--text); text-transform: none; letter-spacing: 0; font-weight: 400; font-variation-settings: 'wght' 400; margin: 0; }
  .issue-fields { display: flex; flex-direction: column; gap: 18px; }
  .issue-fields[hidden] { display: none; }
  .issue-person { border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--navy-50); padding: 16px; }
  .issue-person__top { display: flex; align-items: center; gap: 14px; }
  .issue-person__face {
    width: 48px; height: 48px; flex: 0 0 48px; border-radius: var(--radius-lg); background: var(--white);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: 800; font-variation-settings: 'wght' 800; color: var(--navy);
  }
  .issue-person__id { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .issue-person__name { font-size: var(--text-md); font-weight: 700; font-variation-settings: 'wght' 700; color: var(--text); }
  .issue-person__email { font-size: var(--text-sm); color: var(--text-muted); overflow-wrap: anywhere; }
  .issue-person__facts { display: grid; grid-template-columns: max-content 1fr; gap: 8px 16px; margin: 14px 0 0; padding-top: 14px; border-top: 1px solid var(--border); font-size: var(--text-sm); }
  .issue-person__facts dt { color: var(--text-muted); }
  .issue-person__facts dd { margin: 0; color: var(--text); }
  @media (max-width: 500px) {
    .issue-person__facts { grid-template-columns: 1fr; gap: 2px; }
    .issue-person__facts dd { margin-bottom: 8px; }
  }
  .issue-back { align-self: flex-start; }
  .key-row { display: flex; align-items: center; gap: 8px 16px; flex-wrap: wrap; min-height: 40px; }
  .key-row label { display: inline-flex; align-items: center; gap: 8px; font-size: var(--text-sm); color: var(--text); text-transform: none; letter-spacing: 0; font-weight: 400; font-variation-settings: 'wght' 400; margin: 0; min-width: 160px; }
  .key-row input[type="checkbox"] { width: auto; padding: 0; margin: 0; }
  .key-row__until { display: inline-flex; align-items: center; gap: 8px; font-size: var(--text-xs); color: var(--text-muted); }
  .key-row__until input[type="date"] { width: auto; padding: 6px 10px; }
  .issue-actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .issue-actions .spacer { flex: 1; }

  /* ── Phone: the pass above, stickers along the bottom of each strip ──── */
  @media (max-width: 700px) {
    .pass-page { gap: 20px; }
    .pass-col { min-width: 0; width: 100%; min-height: 0; padding: 0 0 20px; margin-top: -20px; overflow: hidden; clip-path: none; }
    .strip { height: 132px; flex-direction: column; align-items: stretch; justify-content: space-between; padding: 13px 14px 14px 16px; gap: 10px; }
    .strip__foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .strip__stickers { border-right: 0; padding-right: 0; height: auto; gap: 12px; }
    .mini { width: 34px; height: 34px; flex-basis: 34px; }
    .mini__face img { width: 22px; height: 22px; }
    .mini__badge { width: 19px; height: 19px; right: -6px; bottom: -6px; }
  }
  @media (min-width: 701px) {
    .strip__foot { display: contents; }
  }
</style>
</head>
<body>

<div id="nlTopbar"></div>

<div id="pageWrap">
  <div class="page">
    <div class="pass-page">
      <div class="pass-col" id="passCol" aria-live="polite"></div>
      <div class="list-col" id="listCol"></div>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  var P = NL.pass;
  var esc = NL.escHtml;
  var STATE = {
    session: null,
    view: 'mine',
    registry: {},
    users: null,
    subject: null,      /* { name, pass, uid?, made? } — whose pass is drawn */
    dropped: false,     /* the pass falls in once per page view, not on every redraw */
    issue: null         /* the issue form's working state */
  };

  /* Made-up people for View as, so the board sees passes without anyone's
     real account (plan, step 3). Club ones use FALLBACK_CLUB unless clubs-meta
     says otherwise. */
  var FALLBACK_CLUB = 'Forest Green Rovers';
  var MADE_UP = [
    { id: 'league-card',     name: 'League staff',           job: 'Card only',               pass: { base: 'league' } },
    { id: 'league-ops-media', name: 'League Operations and Media', job: 'Operations and Media keys', pass: { base: 'league', keys: ['league-operations', 'league-media'] } },
    { id: 'league-commercial', name: 'League Commercial',    job: 'Commercial key',          pass: { base: 'league', keys: ['league-commercial'] } },
    { id: 'league-senior',   name: 'Senior leadership',      job: 'Senior leadership key',   pass: { base: 'league', keys: ['league-senior'] } },
    { id: 'club-secretary',  name: 'Club secretary',         job: 'Club Secretary',          pass: { base: 'club', keys: ['club-operations'] } },
    { id: 'club-media',      name: 'Club media officer',     job: 'Media Officer',           pass: { base: 'club', keys: ['club-media'] } },
    { id: 'club-finance',    name: 'Club finance director',  job: 'Finance Director',        pass: { base: 'club', keys: ['club-finance', 'club-commercial'] } },
    { id: 'club-card',       name: 'Club staff',             job: 'Card only',               pass: { base: 'club' } }
  ];

  function madeUpPass(m, club) {
    var now = Date.now(), keys = {};
    (m.pass.keys || []).forEach(function (id) { keys[id] = { given: now, by: 'made-up' }; });
    var p = { base: m.pass.base, jobTitle: m.job, keys: keys, issued: now };
    if (m.pass.base === 'club') p.club = club || FALLBACK_CLUB;
    return p;
  }

  /* ── Colours ────────────────────────────────────────────────────────── */
  /* League: red band, navy stickers, navy strap. Club: the club's pair
     (NL.pass.clubColours), strap in the band colour. */
  function colours(pass) {
    var league = { band: 'var(--primary)', bandText: 'var(--white)', sticker: 'var(--navy)', stickerText: 'var(--white)', strap: 'var(--navy)', strapText: 'var(--white)', club: false };
    if (!pass || pass.base !== 'club') return league;
    var c = P.clubColours(NL.clubs.byName(pass.club));
    if (!c) return Object.assign({}, league, { club: true });
    /* Type on the small white stickers in a strip: whichever of the club's
       pair reads on white, else navy. */
    var onWhite = P.contrast(c.band, '#ffffff') >= P.contrast(c.sticker, '#ffffff') ? c.band : c.sticker;
    if (P.contrast(onWhite, '#ffffff') < 3) onWhite = 'var(--navy)';
    return { band: c.band, bandText: c.bandText, sticker: c.sticker, stickerText: c.stickerText, strap: c.band, strapText: c.bandText, miniText: onWhite, club: true };
  }
  function crestFor(pass) {
    return pass && pass.base === 'club' ? NL.clubs.crestUrl(pass.club, 'medium') : NL.clubs.ROSE;
  }
  function orgName(pass) { return pass && pass.base === 'club' ? pass.club : 'The National League'; }

  /* ── Icons ──────────────────────────────────────────────────────────── */
  function icon(name, cls) {
    return '<svg class="icon ' + (cls || '') + '" aria-hidden="true"><use href="/assets/icons/sprites.svg#icon-' + name + '"></use></svg>';
  }
  /* The faint glyph in an empty key slot (boards 6–10). Drawn here: the
     sprite has no clipboard, camera or flask, and these are decoration. */
  var SLOT_ICONS = {
    ops: '<rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9 4h6v3H9z"/><path d="M9 12h6M9 16h4"/>',
    media: '<rect x="3" y="7" width="18" height="13" rx="2"/><circle cx="12" cy="13.5" r="3.5"/><path d="M8 7l1.5-3h5L16 7"/>',
    commercial: '<path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.5"/>',
    finance: '<path d="M4 20h16"/><path d="M7 16v-5M12 16V7M17 16v-8"/>',
    senior: '<path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.4 6.7 19.4l1.2-6L3.4 9.3l6-.7z"/>',
    tester: '<path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 1.8 3h10.4a2 2 0 0 0 1.8-3l-5-9V3"/><path d="M7.5 14h9"/>'
  };
  function slotIcon(name) {
    return '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (SLOT_ICONS[name] || '') + '</svg>';
  }
  var SKULL = '<svg viewBox="0 0 24 24" width="%s" height="%s" aria-hidden="true" fill="currentColor"><path d="M12 2C7 2 3.5 5.6 3.5 10.2c0 2.6 1.1 4.6 2.9 5.9V19a1 1 0 0 0 1 1h1.8v-2h1.6v2h2.4v-2h1.6v2h1.8a1 1 0 0 0 1-1v-2.9c1.8-1.3 2.9-3.3 2.9-5.9C20.5 5.6 17 2 12 2zM8.6 13.6a2 2 0 1 1 0-4 2 2 0 0 1 0 4zm6.8 0a2 2 0 1 1 0-4 2 2 0 0 1 0 4z"/></svg>';
  function skull(size) { return SKULL.replace(/%s/g, size); }
  var CLIP = '<svg class="lanyard__clip" width="60" height="62" viewBox="0 0 60 62" aria-hidden="true">' +
    '<rect x="3" y="46" width="54" height="11" rx="5.5" fill="var(--off-white)"/>' +
    '<rect x="3" y="46" width="54" height="11" rx="5.5" fill="none" stroke="rgba(17,33,74,.18)" stroke-width="1"/>' +
    '<path d="M8.5 47.5h43" stroke="rgba(17,33,74,.14)" stroke-width="2" stroke-linecap="round"/>' +
    '<rect x="12" y="-2" width="36" height="11" rx="2" fill="var(--clip-metal)"/>' +
    '<rect x="12" y="6" width="36" height="3" fill="var(--clip-metal-dark)"/>' +
    '<circle cx="30" cy="16" r="5.5" fill="none" stroke="var(--clip-metal)" stroke-width="3"/>' +
    '<path d="M25 22.5h10v20h-10z" fill="var(--clip-metal-light)" stroke="var(--clip-metal-dark)" stroke-width="1.2"/>' +
    '<path d="M25 42.5h10l13 4.5v4.5h-36v-4.5z" fill="var(--clip-metal-light)" stroke="var(--clip-metal-dark)" stroke-width="1.2" stroke-linejoin="round"/>' +
    '<rect x="12" y="51.5" width="36" height="3" rx="1.5" fill="var(--clip-metal-dark)"/></svg>';

  function initials(name) {
    var parts = String(name || '?').trim().split(/\s+/);
    return parts.length > 1 ? (parts[0][0] + parts[parts.length - 1][0]).toUpperCase() : parts[0].charAt(0).toUpperCase();
  }

  /* ── The pass ───────────────────────────────────────────────────────── */
  var TILTS = [-2.4, 1.8, -1.2, 2.4, -1.8, 1.2];

  function lanyardHtml(kind, inner, c, cls, delay, sway) {
    var style = '--delay:' + delay + 's;--sway:' + sway + 'deg;' +
      (c ? '--strap:' + c.strap + ';--strap-text:' + c.strapText + ';' : '');
    var drop = STATE.dropped ? ' is-still' : ' is-dropping';
    return '<div class="lanyard lanyard--' + kind + ' ' + cls + drop + '" style="' + style + '">' +
      '<div class="lanyard__swing">' +
        '<div class="lanyard__strap"><span>NL TOOLS · NL TOOLS</span></div>' +
        '<div class="lanyard__hang">' + CLIP + inner + '</div>' +
      '</div></div>';
  }

  function cardPassHtml(subject) {
    var pass = subject.pass, c = colours(pass);
    var vars = '--band:' + c.band + ';--band-text:' + c.bandText + ';--sticker:' + c.sticker + ';--sticker-text:' + c.stickerText;
    var grid = '<div class="sticker sticker--card" style="--tilt:' + TILTS[0] + 'deg">' +
      '<span class="sticker__seat"><img src="' + esc(crestFor(pass)) + '" alt="" data-crest="' + esc(pass.base === 'club' ? pass.club : '') + '"></span>' +
      '<span class="sticker__name">Staff</span></div>';
    var t = 1;
    P.slots(pass).forEach(function (k) {
      if (P.holds(pass, k.id)) {
        grid += '<div class="sticker" style="--tilt:' + TILTS[t++ % TILTS.length] + 'deg">' +
          '<span class="sticker__code">' + esc(k.code) + '</span><span class="sticker__name">' + esc(k.name) + '</span></div>';
      } else {
        grid += '<div class="slot-empty" role="img" aria-label="' + esc(k.name) + ' – not held">' + slotIcon(k.icon) + '</div>';
      }
    });
    var foot = (pass.base === 'club' ? 'Club staff' : 'League staff') +
      (pass.issued ? ' · issued ' + P.issuedLabel(pass.issued) : '');
    return '<div class="pass" style="' + vars + '">' +
      '<div class="pass__slot"></div>' +
      '<div class="pass__band"><span class="pass__seat"><img src="' + esc(crestFor(pass)) + '" alt="' + esc(orgName(pass)) + ' crest" data-crest="' + esc(pass.base === 'club' ? pass.club : '') + '"></span>' +
        '<span class="pass__org">' + esc(orgName(pass)) + '</span></div>' +
      '<div class="pass__who"><span class="pass__face" aria-hidden="true">' + esc(initials(subject.name)) + '</span>' +
        '<div><div class="pass__name">' + esc(subject.name || '') + '</div>' +
        (pass.jobTitle ? '<div class="pass__job">' + esc(pass.jobTitle) + '</div>' : '') + '</div></div>' +
      '<div class="pass__grid">' + grid + '</div>' +
      (P.isSkeleton(pass) ? aaaStickerHtml() : '') +
      '<div class="pass__foot">' + esc(foot) + '</div>' +
    '</div>';
  }

  function aaaStickerHtml() {
    return '<div class="pass__aaa" role="img" aria-label="Skeleton key: access all areas, every tool at Manage">' +
      /* The skull's viewBox cropped to the drawing, so "full height" means
         the skull itself, not its padding. */
      '<span class="pass__aaa-skull">' + skull(64).replace('viewBox="0 0 24 24"', 'viewBox="3.5 2 17 18"') + '</span>' +
      '<span class="pass__aaa-big">ACCESS<br>ALL AREAS</span>' +
    '</div>';
  }

  function noPassHtml(subject, mine) {
    var msg = subject.message || (mine ? 'Your pass hasn’t been issued yet' : (subject.name || 'This person') + '’s pass hasn’t been issued yet');
    return '<div class="pass pass--none" style="--band:var(--navy-100);--band-text:var(--text)">' +
      '<div class="pass__slot"></div>' +
      '<div class="pass__band"><span class="pass__seat"><img src="' + esc(NL.clubs.ROSE) + '" alt="The National League crest"></span><span class="pass__org">NL Tools</span></div>' +
      '<div class="pass__none"><strong>' + esc(msg) + '</strong></div>' +
    '</div>';
  }

  function drawPass(subject, mine) {
    var col = document.getElementById('passCol');
    var pass = subject.pass;
    var html;
    if (!P.isIssued(pass)) {
      html = '<div class="lanyards">' + lanyardHtml('card', noPassHtml(subject, mine), null, 'lanyard--front', 0, -0.5) + '</div>';
    } else {
      var c = colours(pass);
      html = '<div class="lanyards">' +
        lanyardHtml('card', cardPassHtml(subject), c, 'lanyard--front', 0, -0.5) +
      '</div>';
    }
    col.innerHTML = html;
    /* Crests: degrade medium → full → rose, like every crest in the estate. */
    col.querySelectorAll('img[data-crest]').forEach(function (img) {
      var name = img.getAttribute('data-crest');
      if (name) NL.clubs.wireCrestImg(img, name);
    });
    STATE.dropped = true;
  }

  /* ── The list ───────────────────────────────────────────────────────── */
  function miniHtml(part, level, faded, pass) {
    var face, title;
    if (part === 'skeleton') {
      face = '<span class="mini__face mini__face--skeleton">' + skull(22) + '</span>';
      title = 'Skeleton key';
    } else if (part === 'card') {
      face = '<span class="mini__face"><img src="' + esc(crestFor(pass)) + '" alt="" data-crest="' + esc(pass.base === 'club' ? pass.club : '') + '"></span>';
      title = 'Everyone at ' + orgName(pass);
    } else {
      face = '<span class="mini__face">' + esc(P.KEY[part].code) + '</span>';
      title = P.KEY[part].name;
    }
    var manage = level === 'manage';
    return '<span class="mini' + (faded ? ' mini--faded' : '') + '" title="' + esc(title + ': ' + (manage ? 'Manage' : 'Access')) + '">' + face +
      '<span class="mini__badge' + (manage ? ' mini__badge--manage' : '') + '">' + icon(manage ? 'edit' : 'eye', 'mini__icon') + '</span></span>';
  }

  function stripHtml(item, pass, columns, c, link) {
    var ex = item.explain, rec = item.record;
    var result = ex.level;
    var cells = columns.map(function (col) {
      var part = ex.parts.filter(function (p) { return p.id === col; })[0];
      if (!part) return '<span class="mini" aria-hidden="true"></span>';
      return miniHtml(col, part.level, P.rank(part.level) < P.rank(result), pass);
    }).join('');
    /* v1.6: a strip's colour says its LEVEL (Richard, 12/11/2026): Manage in
       the pass's first colour (the club's primary, or League red), Access in
       its second (the club's secondary, or navy). Who opened it is what the
       stickers say. (v1.4 coloured by card or key instead.) */
    var manage = result === 'manage';
    var bg = manage ? c.band : c.sticker, fg = manage ? c.bandText : c.stickerText;
    var style = ' style="--strip:' + bg + ';--strip-text:' + fg + ';--strip-edge:color-mix(in srgb, ' + bg + ' 70%, black);' +
      (c.miniText ? '--mini-text:' + c.miniText + ';' : '') + '--badge:' + c.sticker + ';--badge-text:' + c.stickerText + '"';
    var tag = link ? 'a' : 'div';
    /* A Club card goes to the tool's club page where it has one (club logins:
       the pass's club claim opens it, showing that club). */
    var to = (pass.base === 'club' && rec.clubUrl) || rec.url || ('/' + item.key + '/');
    var href = link ? ' href="' + esc(to) + '"' : '';
    return '<' + tag + ' class="strip"' + href + style + '>' +
      '<span class="strip__text"><span class="strip__name">' + esc(item.label) + '</span>' +
        (rec.description ? '<span class="strip__desc">' + esc(rec.description) + '</span>' : '') + '</span>' +
      '<span class="strip__foot">' +
        '<span class="strip__stickers">' + cells + '</span>' +
        '<span class="strip__result strip__result--' + result + '">' + icon(manage ? 'edit' : 'eye', 'strip__icon') + (manage ? 'Manage' : 'Access') + '</span>' +
      '</span>' +
    '</' + tag + '>';
  }

  function listHtml(subject, opts) {
    var pass = subject.pass;
    if (!P.isIssued(pass)) return '';
    var items = P.summary(pass, STATE.registry);
    var columns = P.isSkeleton(pass) ? ['skeleton'] : ['card'].concat(P.keysHeld(pass));
    var c = colours(pass);
    var mark = pass.base === 'club'
      ? 'The crest means everyone at ' + esc(pass.club) + ' has it.'
      : 'The rose means everyone at the League has it.';
    var html = '<p class="pass-intro"><b>Access</b> lets you look. <b>Manage</b> lets you change what other people see. ' + mark + '</p>';
    if (opts.note) html += '<p class="pass-note">' + esc(opts.note) + '</p>';
    html += items.length
      ? '<div class="strips">' + items.map(function (it) { return stripHtml(it, pass, columns, c, opts.links); }).join('') + '</div>'
      : '<p class="strips-empty">This pass opens no tools yet.</p>';
    /* View as and Issue a pass also list every tool the pass does NOT open,
       as outlines, so what someone lacks is as plain as what they hold. */
    if (opts.all) {
      var held = {};
      items.forEach(function (it) { held[it.key] = true; });
      var off = Object.keys(STATE.registry).filter(function (k) {
        var r = STATE.registry[k];
        return r && !r.placeholder && k !== 'welcome' && !held[k];
      }).map(function (k) { return { key: k, label: STATE.registry[k].label || k }; })
        .sort(function (a, b) { return a.label.localeCompare(b.label); });
      if (off.length) {
        html += '<div class="strips"><div class="strips-head">Not on this pass</div>' + off.map(function (o) {
          return '<div class="strip strip--off"><span class="strip__text"><span class="strip__name">' + esc(o.label) + '</span></span></div>';
        }).join('') + '</div>';
      }
    }
    return html;
  }

  function wireCrests(root) {
    root.querySelectorAll('img[data-crest]').forEach(function (img) {
      var name = img.getAttribute('data-crest');
      if (name) NL.clubs.wireCrestImg(img, name);
    });
  }

  /* ── View: mine ─────────────────────────────────────────────────────── */
  function renderMine() {
    var s = STATE.session;
    var subject = { name: s.name || s.email, pass: s.pass };
    drawPass(subject, true);
    var list = document.getElementById('listCol');
    if (!P.isIssued(s.pass)) {
      list.innerHTML = '<p class="pass-intro">Until it is, you open the same tools as before.</p>';
      return;
    }
    list.innerHTML = listHtml(subject, { links: true });
    wireCrests(list);
  }

  /* ── View: as ───────────────────────────────────────────────────────── */
  function renderAs() {
    var subject = STATE.subject;
    drawPass(subject, false);
    var list = document.getElementById('listCol');
    list.innerHTML =
      '<div class="viewbar">' +
        '<span class="viewbar__who">Viewing as <b>' + esc(subject.name) + '</b>' + (subject.made ? ' (made up)' : '') + '</span>' +
        '<button class="btn btn--ghost btn--sm" type="button" id="chooseBtn">' + icon('eye', 'icon--sm') + 'Choose someone</button>' +
        (subject.uid ? '<a class="btn btn--ghost btn--sm" href="/access/">' + icon('back', 'icon--sm') + 'Access</a>'
          : '<a class="btn btn--ghost btn--sm" href="/pass/">' + icon('back', 'icon--sm') + 'My pass</a>') +
      '</div>' +
      listHtml(subject, { links: false, all: true });
    wireCrests(list);
    document.getElementById('chooseBtn').addEventListener('click', openChooser);
  }

  function clubNames() {
    var meta = NL.clubs.meta();
    return ((meta && meta.clubs) || []).filter(function (c) { return c.division; }).map(function (c) { return c.name; }).sort();
  }

  function openChooser() {
    var body = document.createElement('div');
    body.className = 'chooser';
    body.innerHTML =
      '<h3>Made up</h3><div class="pick-list" id="madeList">' +
        MADE_UP.map(function (m) {
          return '<button type="button" data-made="' + esc(m.id) + '">' + esc(m.name) + '<small>' + esc(m.job) + '</small></button>';
        }).join('') + '</div>' +
      '<h3>Build one</h3>' +
      '<div class="form-group"><div class="choice-row" id="buildBase">' +
        '<label><input type="radio" name="buildBase" value="league" checked> League card</label>' +
        '<label><input type="radio" name="buildBase" value="club"> Club card</label></div></div>' +
      '<div class="form-group" id="buildClubWrap" hidden><label>Club</label><div id="buildClub"></div></div>' +
      '<div class="form-group"><label>Keys</label><div class="choice-row" id="buildKeys"></div></div>' +
      '<button class="btn btn--navy btn--sm" type="button" id="buildGo">' + icon('eye', 'icon--sm') + 'View this pass</button>' +
      '<h3>Real people</h3>' +
      '<input class="pick-search" type="search" id="realSearch" placeholder="Search by name" aria-label="Search people">' +
      '<div class="pick-list" id="realList"><button type="button" disabled>Loading…</button></div>';

    var ctrl = NL.modal({ title: 'View as', body: body, width: 'wide' });
    var buildClub = clubNames()[0] || FALLBACK_CLUB;
    if (clubNames().indexOf(FALLBACK_CLUB) >= 0) buildClub = FALLBACK_CLUB;

    body.querySelector('#madeList').addEventListener('click', function (e) {
      var b = e.target.closest('button[data-made]'); if (!b) return;
      var m = MADE_UP.filter(function (x) { return x.id === b.getAttribute('data-made'); })[0];
      setSubject({ name: m.name, pass: madeUpPass(m, buildClub), made: true });
      ctrl.close();
    });

    function drawKeys() {
      var base = body.querySelector('input[name="buildBase"]:checked').value;
      body.querySelector('#buildClubWrap').hidden = base !== 'club';
      body.querySelector('#buildKeys').innerHTML = P.KEYS.filter(function (k) { return k.base === base; }).map(function (k) {
        return '<label><input type="checkbox" value="' + esc(k.id) + '"> ' + esc(k.name) + '</label>';
      }).join('');
    }
    body.querySelector('#buildBase').addEventListener('change', drawKeys);
    drawKeys();
    NL.clubPicker(body.querySelector('#buildClub'), {
      mode: 'select', value: buildClub, clearable: false,
      onSelect: function (sel) { if (sel && sel.name) buildClub = sel.name; }
    });
    body.querySelector('#buildGo').addEventListener('click', function () {
      var base = body.querySelector('input[name="buildBase"]:checked').value;
      var keys = Array.prototype.map.call(body.querySelectorAll('#buildKeys input:checked'), function (i) { return i.value; });
      var m = { pass: { base: base, keys: keys }, job: keys.length ? keys.map(function (id) { return P.KEY[id].name; }).join(', ') : 'Card only' };
      setSubject({ name: base === 'club' ? 'Someone at ' + buildClub : 'Someone at the League', pass: madeUpPass(m, buildClub), made: true });
      ctrl.close();
    });

    loadUsers().then(function (users) {
      var list = body.querySelector('#realList');
      function draw(q) {
        q = String(q || '').toLowerCase();
        var rows = users.filter(function (u) { return !q || (u.name || '').toLowerCase().indexOf(q) >= 0; }).slice(0, 60);
        list.innerHTML = rows.length ? rows.map(function (u) {
          return '<button type="button" data-uid="' + esc(u.uid) + '">' + esc(u.name || '(no name)') +
            '<small>' + esc(passLine(u.pass)) + '</small></button>';
        }).join('') : '<button type="button" disabled>Nobody matches.</button>';
      }
      draw('');
      body.querySelector('#realSearch').addEventListener('input', function (e) { draw(e.target.value); });
      list.addEventListener('click', function (e) {
        var b = e.target.closest('button[data-uid]'); if (!b) return;
        var u = users.filter(function (x) { return x.uid === b.getAttribute('data-uid'); })[0];
        setSubject({ name: u.name, pass: u.pass, uid: u.uid });
        ctrl.close();
      });
    }).catch(function () {
      body.querySelector('#realList').innerHTML = '<button type="button" disabled>People could not be loaded.</button>';
    });
  }

  function passLine(pass) {
    if (!P.isIssued(pass)) return 'No pass yet';
    var bits = [pass.base === 'club' ? pass.club : 'League'];
    if (pass.jobTitle) bits.push(pass.jobTitle);
    var keys = P.keysHeld(pass).map(function (id) { return P.KEY[id].code; });
    if (P.isSkeleton(pass)) keys.unshift('Skeleton');
    if (keys.length) bits.push(keys.join(' '));
    return bits.join(' · ');
  }

  function setSubject(subject) {
    STATE.subject = subject;
    STATE.dropped = false; /* a new person's pass falls in */
    renderAs();
  }

  /* Everyone with an account, A–Z. League roles can read users/ today; the
     page asks for nothing new. Rejected requests are not people. */
  function loadUsers() {
    if (STATE.users) return Promise.resolve(STATE.users);
    return NL.ensureAuth().then(function () { return db.ref('users').once('value'); }).then(function (snap) {
      var all = snap.val() || {};
      STATE.users = Object.keys(all).filter(function (uid) { return all[uid] && !all[uid].rejected; }).map(function (uid) {
        var u = all[uid];
        return { uid: uid, name: u.name || u.email || '', email: u.email || '', role: u.role || '', club: u.club || '',
          jobTitle: u.jobTitle || '', createdAt: u.createdAt || null, pending: !!u.pending, pass: u.pass || null };
      }).sort(function (a, b) { return a.name.localeCompare(b.name); });
      return STATE.users;
    });
  }

  /* ── View: issue ────────────────────────────────────────────────────── */
  /* A basic form so passes can be issued before the people screens of step
     4 exist: card, club, keys, job title. The Skeleton key holder chooses;
     the pass is written to users/<uid>/pass; the audit log records it. */
  /* What this person may give out. The Skeleton key: everything; League
     Operations: Club cards and club keys only (NL.pass.issueRights). Today's
     superadmin role counts as the Skeleton key until step 6, so the first
     pass could be issued. */
  function myRights() {
    var s = STATE.session;
    if (s.role === 'superadmin') return { league: true, club: true, skeleton: true };
    return P.issueRights(s.pass);
  }
  /* Until step 6 the database lets only League Admins and the superadmin
     write a pass, so the form is offered to those roles alone, within
     what their own pass allows. */
  function mayIssueHere() {
    var s = STATE.session, r = myRights();
    return s.role === 'superadmin' || (s.role === 'admin' && (r.league || r.club));
  }
  /* Can I issue to this person? League Operations reach club people only:
     not anyone on a League card, nor a League role waiting for one. */
  function canIssueTo(u) {
    var r = myRights();
    if (r.league) return true;
    if (!r.club) return false;
    if (u.uid === STATE.session.uid) return false;
    if (u.pass && u.pass.base === 'league') return false;
    return NL.roles.realm(u.role) !== 'league';
  }

  function renderIssue() {
    var list = document.getElementById('listCol');
    var rights = myRights();
    var mayGiveSkeleton = rights.skeleton;
    list.innerHTML =
      '<a class="btn btn--ghost btn--sm issue-back" href="/access/">' + icon('back', 'icon--sm') + 'Access</a>' +
      '<div class="form-panel issue-panel">' +
        '<div class="form-panel__head">Issue a pass</div>' +
        '<div class="form-panel__body issue-fields">' +
          '<div class="form-group"><label for="issueSearch">Person</label>' +
            '<div id="issuePerson"></div></div>' +
          '<div id="issueFields" class="issue-fields" hidden>' +
            '<div class="form-group"><label>Card</label><div class="choice-row" id="issueBase">' +
              '<label><input type="radio" name="issueBase" value="league"' + (rights.league ? '' : ' disabled') + '> League card</label>' +
              '<label><input type="radio" name="issueBase" value="club"> Club card</label></div></div>' +
            '<div class="form-group" id="issueClubWrap" hidden><label>Club</label><div id="issueClub"></div></div>' +
            '<div class="form-group"><label for="issueJob">Job title</label>' +
              '<input id="issueJob" type="text" maxlength="80" autocomplete="off"></div>' +
            '<div class="form-group"><label>Keys</label><div id="issueKeys"></div></div>' +
            (mayGiveSkeleton ? '<div class="form-group" id="issueSkelWrap"><label>Skeleton key</label><div class="choice-row">' +
              '<label><input type="checkbox" id="issueSkel"> Opens every tool at Manage</label></div></div>' : '') +
          '</div>' +
        '</div>' +
        '<div class="form-panel__foot issue-actions" id="issueActions" hidden>' +
          '<button class="btn btn--danger btn--sm" type="button" id="issueWithdraw" hidden>' + icon('delete', 'icon--sm') + 'Withdraw pass</button>' +
          '<span class="spacer"></span>' +
          '<button class="btn btn--primary" type="button" id="issueSave">Save pass</button>' +
        '</div>' +
      '</div>' +
      '<div class="issue-tools" id="issueTools"></div>';

    STATE.issue = { user: null, base: rights.league ? 'league' : 'club', club: FALLBACK_CLUB, jobTitle: '', keys: [], until: {}, skeleton: false };
    if (clubNames().indexOf(FALLBACK_CLUB) < 0) STATE.issue.club = clubNames()[0] || FALLBACK_CLUB;
    drawPersonPicker();
    drawIssuePreview();

    list.querySelector('#issueBase').addEventListener('change', function (e) {
      STATE.issue.base = e.target.value;
      STATE.issue.keys = [];
      drawIssueKeys(); drawIssuePreview();
    });
    list.querySelector('#issueJob').addEventListener('input', function (e) { STATE.issue.jobTitle = e.target.value; drawIssuePreview(); });
    list.querySelector('#issueKeys').addEventListener('change', function (e) {
      var iss = STATE.issue;
      if (e.target.matches('input[type="date"]')) {
        var id = e.target.getAttribute('data-until');
        if (e.target.value) {
          var d = e.target.value.split('-');
          iss.until[id] = new Date(+d[0], +d[1] - 1, +d[2]).getTime(); /* gone from the start of that day */
        } else delete iss.until[id];
      } else {
        iss.keys = Array.prototype.map.call(list.querySelectorAll('#issueKeys input[type="checkbox"]:checked'), function (i) { return i.value; });
        drawIssueKeys();
      }
      drawIssuePreview();
    });
    var skel = list.querySelector('#issueSkel');
    if (skel) skel.addEventListener('change', function () { STATE.issue.skeleton = skel.checked; drawIssuePreview(); });
    NL.clubPicker(list.querySelector('#issueClub'), {
      mode: 'select', value: STATE.issue.club, clearable: false,
      onSelect: function (sel) { if (sel && sel.name) { STATE.issue.club = sel.name; drawIssuePreview(); } }
    });
    list.querySelector('#issueSave').addEventListener('click', saveIssue);
    list.querySelector('#issueWithdraw').addEventListener('click', withdrawIssue);
  }

  function drawPersonPicker() {
    var mount = document.getElementById('issuePerson');
    var u = STATE.issue.user;
    if (u) {
      mount.innerHTML = personCardHtml(u);
      mount.querySelector('#issueChange').addEventListener('click', function () { STATE.issue.user = null; drawPersonPicker(); showFields(false); drawIssuePreview(); });
      return;
    }
    mount.innerHTML = '<input class="pick-search" type="search" id="issueSearch" placeholder="Search by name or email">' +
      '<div class="pick-list" id="issueList"><button type="button" disabled>Loading…</button></div>';
    loadUsers().then(function (users) {
      var list = mount.querySelector('#issueList');
      function draw(q) {
        q = String(q || '').toLowerCase();
        var rows = users.filter(function (x) {
          if (!canIssueTo(x)) return false;
          return !q || (x.name || '').toLowerCase().indexOf(q) >= 0 || (x.email || '').toLowerCase().indexOf(q) >= 0;
        }).slice(0, 60);
        list.innerHTML = rows.length ? rows.map(function (x) {
          return '<button type="button" data-uid="' + esc(x.uid) + '">' + esc(x.name || '(no name)') +
            '<small>' + esc([x.email, roleToday(x)].filter(Boolean).join(' · ')) + '</small>' +
            '<small>' + esc(passLine(x.pass)) + '</small></button>';
        }).join('') : '<button type="button" disabled>Nobody matches.</button>';
      }
      draw('');
      mount.querySelector('#issueSearch').addEventListener('input', function (e) { draw(e.target.value); });
      list.addEventListener('click', function (e) {
        var b = e.target.closest('button[data-uid]'); if (!b) return;
        choosePerson(users.filter(function (x) { return x.uid === b.getAttribute('data-uid'); })[0]);
      });
    }).catch(function () {
      mount.querySelector('#issueList').innerHTML = '<button type="button" disabled>People could not be loaded.</button>';
    });
  }

  /* What the person is today, in the old model: role, and club for club
     roles. The pass replaces this at step 6; until then it is the thing to
     check the new pass against. */
  function roleToday(u) {
    var r = NL.roles.label(u.role) || 'No role';
    if (u.pending) r += ' (waiting for approval)';
    return NL.isClubUser(u.role) && u.club ? r + ', ' + u.club : r;
  }
  function nameOf(uid) {
    var x = (STATE.users || []).filter(function (y) { return y.uid === uid; })[0];
    return x ? x.name : '';
  }

  /* The chosen person, in full: who they are, what they are today, and the
     pass they hold now, so the one you are about to save is issued against
     what you can see. */
  function personCardHtml(u) {
    var p = u.pass, passText;
    if (!P.isIssued(p)) {
      passText = 'Not issued yet';
    } else {
      var keys = P.keysHeld(p).map(function (id) {
        var until = p.keys[id].until;
        return P.KEY[id].name + (until ? ' (until ' + NL.formatDate(until) + ')' : '');
      });
      if (P.isSkeleton(p)) keys.unshift('Skeleton key');
      passText = (p.base === 'club' ? 'Club card, ' + p.club : 'League card') +
        (keys.length ? ' · ' + keys.join(', ') : ' · no keys') +
        (p.issued ? ' · issued ' + NL.formatDate(p.issued) + (nameOf(p.issuedBy) ? ' by ' + nameOf(p.issuedBy) : '') : '');
    }
    var rows = [
      ['Role today', roleToday(u)],
      ['Job title on account', u.jobTitle || '—'],
      ['Pass now', passText]
    ];
    if (u.createdAt) rows.push(['Account since', NL.formatDate(u.createdAt)]);
    return '<div class="issue-person">' +
      '<div class="issue-person__top">' +
        '<span class="issue-person__face" aria-hidden="true">' + esc(initials(u.name)) + '</span>' +
        '<span class="issue-person__id"><span class="issue-person__name">' + esc(u.name) + '</span>' +
          '<span class="issue-person__email">' + esc(u.email) + '</span></span>' +
        '<button class="btn btn--ghost btn--sm" type="button" id="issueChange">Change</button>' +
      '</div>' +
      '<dl class="issue-person__facts">' + rows.map(function (r) {
        return '<dt>' + esc(r[0]) + '</dt><dd>' + esc(r[1]) + '</dd>';
      }).join('') + '</dl>' +
    '</div>';
  }

  function choosePerson(u) {
    var p = u.pass, iss = STATE.issue;
    iss.user = u;
    iss.base = (p && p.base) || (NL.isClubUser(u.role) ? 'club' : 'league');
    if (p && p.club) iss.club = p.club;
    iss.jobTitle = (p && p.jobTitle) || u.jobTitle || '';
    if (!myRights().league) iss.base = 'club';
    iss.keys = p ? P.keysHeld(p) : [];
    iss.until = {};
    iss.keys.forEach(function (id) { var u0 = p.keys[id] && p.keys[id].until; if (typeof u0 === 'number') iss.until[id] = u0; });
    iss.skeleton = P.isSkeleton(p);
    var root = document.getElementById('listCol');
    root.querySelector('input[name="issueBase"][value="' + iss.base + '"]').checked = true;
    root.querySelector('#issueJob').value = iss.jobTitle;
    var skel = root.querySelector('#issueSkel'); if (skel) skel.checked = iss.skeleton;
    root.querySelector('#issueWithdraw').hidden = !P.isIssued(p);
    drawPersonPicker(); drawIssueKeys(); showFields(true); drawIssuePreview();
  }

  function showFields(on) {
    var root = document.getElementById('listCol');
    root.querySelector('#issueFields').hidden = !on;
    root.querySelector('#issueActions').hidden = !on;
  }

  function drawIssueKeys() {
    var root = document.getElementById('listCol'), iss = STATE.issue;
    root.querySelector('#issueClubWrap').hidden = iss.base !== 'club';
    var sw = root.querySelector('#issueSkelWrap'); if (sw) sw.hidden = iss.base !== 'league';
    /* One row per key: tick to give it; once ticked, an optional end date
       (holiday cover, a short project). The key goes on that date. */
    root.querySelector('#issueKeys').innerHTML = P.KEYS.filter(function (k) { return k.base === iss.base; }).map(function (k) {
      var on = iss.keys.indexOf(k.id) >= 0;
      var until = iss.until[k.id];
      return '<div class="key-row"><label><input type="checkbox" value="' + esc(k.id) + '"' + (on ? ' checked' : '') + '> ' + esc(k.name) + '</label>' +
        (on ? '<span class="key-row__until"><span>Ends</span><input type="date" data-until="' + esc(k.id) + '" aria-label="' + esc(k.name) + ' key ends"' +
          (until ? ' value="' + isoDay(until) + '"' : '') + '></span>' : '') + '</div>';
    }).join('');
  }

  function isoDay(ms) {
    var d = new Date(ms);
    return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
  }

  function issuedPass() {
    var iss = STATE.issue;
    return P.build({ base: iss.base, club: iss.club, jobTitle: iss.jobTitle, keys: iss.keys, until: iss.until, skeleton: iss.skeleton },
      STATE.session.uid, Date.now(), iss.user && iss.user.pass);
  }

  function drawIssuePreview() {
    var iss = STATE.issue, tools = document.getElementById('issueTools');
    if (!iss.user) {
      drawPass({ name: '', pass: null, message: 'Choose who the pass is for' }, false);
      if (tools) tools.innerHTML = '';
      return;
    }
    var subject = { name: iss.user.name, pass: issuedPass() };
    drawPass(subject, false);
    /* What this pass opens, and what it does not, as it stands in the form. */
    if (tools) { tools.innerHTML = listHtml(subject, { links: false, all: true }); wireCrests(tools); }
  }

  function saveIssue() {
    var iss = STATE.issue; if (!iss.user) return;
    if (iss.base === 'club' && !iss.club) { NL.toast('Choose the club first', 'error'); return; }
    var pass = issuedPass();
    var btn = document.getElementById('issueSave'); btn.disabled = true;
    /* v1.5: the pass and the per-tool entries the database reads go in one
       write, so both locks agree the moment it saves (NL.pass.toOld). */
    var updates = {}, base = 'users/' + iss.user.uid + '/';
    updates[base + 'pass'] = pass;
    var old = P.toOld(pass, STATE.registry, iss.user.role);
    Object.keys(old).forEach(function (k) { updates[base + 'tools/' + k] = old[k]; });
    NL.ensureAuth().then(function () {
      return db.ref().update(updates);
    }).then(function () {
      NL.writeAudit('pass_issued', iss.user.name + ': ' + passLine(pass));
      iss.user.pass = pass;
      if (iss.user.uid === STATE.session.uid) STATE.session.pass = pass;
      document.getElementById('issueWithdraw').hidden = false;
      drawPersonPicker();
      NL.toast('Pass saved for ' + iss.user.name, 'success');
    }).catch(function (e) {
      NL.toast('The pass could not be saved: ' + (e && e.message || e), 'error');
    }).then(function () { btn.disabled = false; });
  }

  function withdrawIssue() {
    var iss = STATE.issue; if (!iss.user) return;
    NL.confirm('Withdraw ' + iss.user.name + '’s pass? They go back to having no card and no keys.', { title: 'Withdraw pass', confirmText: 'Withdraw', variant: 'danger' }).then(function (ok) {
      if (!ok) return;
      /* The entries written to match the pass go with it: no pass means the
         role's defaults, as for anyone never given one. */
      var updates = {}, base = 'users/' + iss.user.uid + '/';
      updates[base + 'pass'] = null;
      Object.keys(STATE.registry).forEach(function (k) { if (k !== 'welcome') updates[base + 'tools/' + k] = null; });
      return NL.ensureAuth().then(function () { return db.ref().update(updates); }).then(function () {
        NL.writeAudit('pass_withdrawn', iss.user.name);
        iss.user.pass = null;
        if (iss.user.uid === STATE.session.uid) STATE.session.pass = null;
        document.getElementById('issueWithdraw').hidden = true;
        drawPersonPicker(); drawIssuePreview();
        NL.toast('Pass withdrawn', 'success');
      });
    }).catch(function (e) { NL.toast('Could not withdraw: ' + (e && e.message || e), 'error'); });
  }

  /* ── Not allowed ────────────────────────────────────────────────────── */
  function renderRefusal(what) {
    renderMine();
    var list = document.getElementById('listCol');
    list.insertAdjacentHTML('afterbegin', '<div class="banner banner--info">' + esc(what) + '</div>');
  }

  /* ── Boot ───────────────────────────────────────────────────────────── */
  window.TOOL = window.TOOL || {};
  window.TOOL.boot = function (session) {
    STATE.session = session;
    var v = new URLSearchParams(location.search).get('view');
    STATE.view = (v === 'as' || v === 'issue') ? v : 'mine';

    NL.ensureAuth().then(function () {
      return Promise.all([
        P.loadRegistry(db),
        NL.clubs.load().catch(function () { return null; })
      ]);
    }).then(function (res) {
      STATE.registry = res[0] || {};
      if (STATE.view === 'as') {
        if (!P.canViewAs(session.pass)) return renderRefusal('View as is for testers and the Skeleton key.');
        var m = MADE_UP[1];
        STATE.subject = { name: m.name, pass: madeUpPass(m, clubNames().indexOf(FALLBACK_CLUB) >= 0 ? FALLBACK_CLUB : clubNames()[0]), made: true };
        /* Arrived from People and cards: that person, not a made-up one. */
        var asUid = new URLSearchParams(location.search).get('uid');
        if (!asUid) return renderAs();
        return loadUsers().then(function (users) {
          var u = users.filter(function (x) { return x.uid === asUid; })[0];
          if (u) STATE.subject = { name: u.name, pass: u.pass, uid: u.uid };
          renderAs();
        });
      } else if (STATE.view === 'issue') {
        if (!mayIssueHere()) return renderRefusal('Issuing passes is for the Skeleton key and League Operations.');
        renderIssue();
        /* Arrived from People and cards with someone chosen. */
        var uid = new URLSearchParams(location.search).get('uid');
        if (uid) loadUsers().then(function (users) {
          var u = users.filter(function (x) { return x.uid === uid; })[0];
          if (u && canIssueTo(u)) choosePerson(u);
        });
      } else {
        renderMine();
      }
    }).catch(function (e) {
      document.getElementById('listCol').innerHTML = '<div class="banner banner--error">The page could not load: ' + esc(e && e.message || String(e)) + '</div>';
    });
  };

  if (window._toolDeferredSession) {
    window.TOOL.boot(window._toolDeferredSession);
    delete window._toolDeferredSession;
  }
})();
</script>

</body>
</html>
