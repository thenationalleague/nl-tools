  function startExport() {
    var seen = false;
    try { seen = localStorage.getItem(PREFLIGHT_KEY) === '1'; } catch (e) {}
    if (seen) doPrint(); else showPreflight(true);
  }
  /* Ctrl+P / browser menu print should also produce the document, not the UI */
  window.addEventListener('beforeprint', function () {
    populatePrintRoot();
    document.title = exportDocTitle();
  });
  window.addEventListener('afterprint', function () {
    document.getElementById('nlxPrintRoot').innerHTML = '';
    document.title = PAGE_TITLE;
  });

  /* ══════════════════════════════════════════════════════════════════════
     Views
     ══════════════════════════════════════════════════════════════════════ */
  function renderList() {
    S.ed = null;
    _pending = {};
    document.body.classList.remove('nlx-editing');
    main.innerHTML = '';

    /* .section-head, not .page-header: the topbar already says "Newsletter",
       so an h1 repeating it (with a sub describing what the user is looking
       at) was the anti-pattern lint bans — it only survived here because
       this header is built in JS, where lint cannot see it. */
    var head = el('div', 'section-head');
    head.appendChild(el('h2', null, 'Editions'));
    var newBtn = el('button', 'btn btn--primary', 'New edition');
    newBtn.type = 'button';
    newBtn.addEventListener('click', promptNewEdition);
    head.appendChild(newBtn);
    main.appendChild(head);

    var ids = Object.keys(S.editions);
    if (!ids.length) {
      var empty = el('div', 'empty-state');
      empty.appendChild(el('div', 'empty-state__icon', '📰'));
      empty.appendChild(el('div', 'empty-state__title', 'No editions yet'));
      empty.appendChild(el('div', 'empty-state__text', 'Create the first monthly edition to get started.'));
      main.appendChild(empty);
      return;
    }

    ids.sort(function (a, b) {
      return (S.editions[b].month || '').localeCompare(S.editions[a].month || '');
    });
    var grid = el('div', 'nlx-ed-list');
    ids.forEach(function (id) {
      var meta = S.editions[id];
      var card = el('div', 'nlx-ed-card');
      card.appendChild(el('div', 'nlx-ed-card__title', (meta.title || CONFIG.defaultTitle) +
        (meta.subtitle ? ' – ' + meta.subtitle : '')));
      var count = meta._articleCount || 0;
      card.appendChild(el('div', 'nlx-ed-card__meta',
        count + ' article' + (count === 1 ? '' : 's') +
        (meta.updatedAt ? ' · updated ' + NL.timeAgo(meta.updatedAt) : '')));
      var row = el('div', 'nlx-ed-card__row');
      var pill = el('span', 'pill ' + (meta.status === 'published' ? 'pill--approved' : 'pill--pending'),
        meta.status === 'published' ? 'Published' : 'Draft');
      var open = el('button', 'btn btn--navy btn--sm', 'Open');
      open.type = 'button';
      open.addEventListener('click', function () { gotoEdition(id); });
      var del = el('button', 'btn btn--ghost btn--sm', 'Delete');
      del.type = 'button';
      del.addEventListener('click', function () {
        NL.confirm('Delete "' + (meta.title || '') + (meta.subtitle ? ' – ' + meta.subtitle : '') +
          '"?\nThis removes the edition and all its articles.', { title: 'Delete edition', confirmText: 'Delete', variant: 'danger' })
          .then(function (ok) {
            if (!ok) return;
            NL.ensureAuth()
              .then(function () { return db.ref(ROOT + '/editions/' + id).remove(); })
              .then(function () {
                delete S.editions[id];
                NL.toast('Edition deleted', 'success');
                renderList();
              })
              .catch(function (err) { NL.toast(err.message, 'error'); });
          });
      });
      row.appendChild(open);
      row.appendChild(pill);
      row.appendChild(del);
      card.appendChild(row);
      grid.appendChild(card);
    });
    main.appendChild(grid);
  }

  function promptNewEdition() {
    var wrap = el('div');
    var p = el('p', 'confirm-text', 'Which month is this edition for?');
    wrap.appendChild(p);
    var input = el('input', 'modal__input');
    input.type = 'month';
    input.value = currentMonth();
    wrap.appendChild(input);
    NL.modal({
      title: 'New edition',
      size: 'sm',
      body: wrap,
      buttons: [
        { label: 'Cancel', className: 'btn--ghost', onClick: function (c) { c.close(); } },
        { label: 'Create', className: 'btn--primary', onClick: function (c) {
            var month = input.value || currentMonth();
            c.close();
            createEdition(month)
              .then(function (id) { NL.toast('Edition created', 'success'); gotoEdition(id); })
              .catch(function (err) { NL.toast(err.message, 'error'); });
          } }
      ]
    });
  }

  function gotoEdition(id) { location.hash = '#edition/' + id; route(); }
  function gotoList() { location.hash = ''; route(); }

  /* ── Editor view ──────────────────────────────────────────────────────── */
  function renderEditor() {
    main.innerHTML = '';
    var meta = S.ed.meta;

    /* Compact bar: title + gauge + save + actions in one row */
    document.body.classList.add('nlx-editing');
    var head = el('div', 'nlx-bar');
    head.appendChild(el('div', 'nlx-bar__title',
      (meta.title || CONFIG.defaultTitle) + (meta.subtitle ? ' – ' + meta.subtitle : '')));

    /* Draft/Published lives in the bar, not buried in a panel head */
    var statusWrap = el('span');
    renderStatusControl(statusWrap);
    head.appendChild(statusWrap);

    var gauge = el('div', 'nlx-gauge');
    gauge.id = 'nlxGauge';
    gauge.appendChild(el('div', 'nlx-gauge__pages'));
    var gtext = el('div', 'nlx-gauge__text');
    gtext.appendChild(el('div', 'nlx-gauge__headline', 'Measuring…'));
    gtext.appendChild(el('div', 'nlx-gauge__detail', ''));
    gauge.appendChild(gtext);
    head.appendChild(gauge);

    var actions = el('div', 'nlx-bar__actions');
    _saveEl = el('span', 'nlx-save', 'All changes saved');
    actions.appendChild(_saveEl);
    var back = el('button', 'btn btn--ghost btn--sm', 'All editions');
    back.type = 'button';
    back.addEventListener('click', function () { flushSaves(); gotoList(); });
    actions.appendChild(back);
    var tips = el('button', 'btn btn--ghost btn--sm', 'Print tips');
    tips.type = 'button';
    tips.addEventListener('click', function () { showPreflight(false); });
    actions.appendChild(tips);
    var exp = el('button', 'btn btn--primary btn--sm', 'Export PDF');
    exp.type = 'button';
    exp.addEventListener('click', exportPdf);
    actions.appendChild(exp);
    head.appendChild(actions);
    main.appendChild(head);

    /* Warning strip — full gauge detail appears here only when something
       needs attention; otherwise the bar stays one slim row */
    var strip = el('div', 'nlx-warnstrip');
    strip.id = 'nlxWarnStrip';
    main.appendChild(strip);

    /* Two-pane shell */
    var shell = el('div', 'nlx-shell');
    shell.id = 'nlxShell';
    var editor = el('div', 'nlx-pane--editor');
    var preview = el('div', 'nlx-pane--preview');
    shell.appendChild(editor);
    shell.appendChild(preview);
    main.appendChild(shell);

    /* Floating jump-to-article navigation (view only, never reorders) */
    var artnav = el('div', 'nlx-artnav');
    var artnavInner = el('div', 'nlx-artnav__inner');
    function scrollerInfo() {
      if (window.innerWidth > 1100) {
        var r = editor.getBoundingClientRect();
        return {
          pos: editor.scrollTop,
          topOf: function (elm) { return elm.getBoundingClientRect().top - r.top + editor.scrollTop; },
          go: function (t) { editor.scrollTo({ top: t, behavior: 'smooth' }); }
        };
      }
      return {
        pos: window.scrollY || window.pageYOffset || 0,
        topOf: function (elm) { return elm.getBoundingClientRect().top + (window.scrollY || 0); },
        go: function (t) { window.scrollTo({ top: t, behavior: 'smooth' }); }
      };
    }
    function jumpArticle(dir) {
      var s = scrollerInfo();
      var cards = editor.querySelectorAll('.nlx-art');
      if (!cards.length) return;
      var tops = Array.prototype.map.call(cards, function (c) { return s.topOf(c) - 10; });
      var target = null;
      if (dir > 0) {
        for (var i = 0; i < tops.length; i++) { if (tops[i] > s.pos + 12) { target = tops[i]; break; } }
      } else {
        for (var j = tops.length - 1; j >= 0; j--) { if (tops[j] < s.pos - 12) { target = tops[j]; break; } }
        if (target === null) target = 0;
      }
      if (target !== null) s.go(Math.max(0, target));
    }
    function navBtn(icon, label, dir) {
      var b = el('button', 'btn btn--navy');
      b.type = 'button';
      b.title = label;
      b.setAttribute('aria-label', label);
      b.appendChild(NL.icon(icon, 'sm'));
      b.addEventListener('click', function () { jumpArticle(dir); });
      return b;
    }
    artnavInner.appendChild(navBtn('up', 'Previous article', -1));
    artnavInner.appendChild(navBtn('down', 'Next article', 1));
    var addNewArticle;                      /* defined once artsWrap exists */
    var navAdd = el('button', 'btn btn--primary');
    navAdd.type = 'button';
    navAdd.title = 'Add article';
    navAdd.setAttribute('aria-label', 'Add article');
    navAdd.appendChild(NL.icon('add', 'sm'));
    navAdd.addEventListener('click', function () { if (addNewArticle) addNewArticle(); });
    artnavInner.appendChild(navAdd);
    artnav.appendChild(artnavInner);
    editor.appendChild(artnav);

    /* Edition fields — no panel head needed, the fields explain themselves */
    var edPanel = el('div', 'form-panel');
    var edBody = el('div', 'form-panel__body');

    edBody.appendChild(fieldGroup('Title', textInput(meta.title || '', function (v) {
      meta.title = v; queueSave('meta/title', v); schedulePreview();
    })));
    edBody.appendChild(fieldGroup('Subtitle', textInput(meta.subtitle || '', function (v) {
      meta.subtitle = v; queueSave('meta/subtitle', v); schedulePreview();
    })));
    var monthInput = textInput(meta.month || '', function (v) {
      meta.month = v; queueSave('meta/month', v);
      var sub = subtitleFromMonth(v);
      if (sub) {
        meta.subtitle = sub; queueSave('meta/subtitle', sub);
        var subField = edBody.querySelectorAll('input')[1];
        if (subField) subField.value = sub;
      }
      schedulePreview();
    });
    monthInput.type = 'month';
    edBody.appendChild(fieldGroup('Month', monthInput));
    edPanel.appendChild(edBody);
    editor.appendChild(edPanel);

    /* Articles */
    var artsWrap = el('div');
    artsWrap.id = 'nlxArticles';
    editor.appendChild(artsWrap);
    renderArticles(artsWrap);

    addNewArticle = function () {
      addArticle()
        .then(function () {
          renderArticles(artsWrap);
          schedulePreview();
          /* Take the writer to the new article, cursor in the headline */
          var cards = artsWrap.querySelectorAll('.nlx-art');
          var last = cards[cards.length - 1];
          if (last) {
            last.scrollIntoView({ behavior: 'smooth', block: 'center' });
            var headInput = last.querySelector('input[placeholder="Headline"]');
            if (headInput) headInput.focus();
          }
        })
        .catch(function (err) { NL.toast(err.message, 'error'); });
    };
    var addBtn = el('button', 'btn btn--navy', 'Add article');
    addBtn.type = 'button';
    addBtn.addEventListener('click', addNewArticle);
    editor.appendChild(addBtn);

    /* Preview pane */
    var ptools = el('div', 'toolbar');
    var pleft = el('div', 'toolbar__left');
    pleft.appendChild(el('span', 'text-label', 'Preview'));
    ptools.appendChild(pleft);
    var pright = el('div', 'toolbar__right');
    var ptoggle = el('button', 'btn btn--ghost btn--sm nlx-preview-toggle', 'Hide preview');
    ptoggle.type = 'button';
    ptoggle.addEventListener('click', function () {
      var hidden = shell.classList.toggle('nlx-shell--preview-hidden');
      ptoggle.textContent = hidden ? 'Show preview' : 'Hide preview';
      if (!hidden) applyPreviewScale();
    });
    pright.appendChild(ptoggle);
    ptools.appendChild(pright);
    preview.appendChild(ptools);

    var frame = el('div', 'nlx-preview-frame');
    frame.id = 'nlxPreviewFrame';
    var scale = el('div');
    scale.id = 'nlxDocScale';
    /* Tap an article in the preview → jump the editor to its card.
       Links inside the preview don't navigate — the preview is for
       orientation, not reading. */
    scale.addEventListener('click', function (e) {
      if (e.target.closest && e.target.closest('a')) e.preventDefault();
      var blk = e.target.closest ? e.target.closest('.nlx-blk-art') : null;
      var aid = blk && blk.getAttribute('data-art-id');
      if (aid) scrollToArticleCard(aid);
    });
    frame.appendChild(scale);
    preview.appendChild(frame);

    sizeShell();
    refreshPreview();
  }

  function renderStatusControl(wrap) {
    wrap.innerHTML = '';
    var meta = S.ed.meta;
    var published = meta.status === 'published';
    var pill = el('span', 'pill ' + (published ? 'pill--approved' : 'pill--pending'),
      published ? 'Published' : 'Draft');
    wrap.appendChild(pill);
    var btn = el('button', 'btn btn--ghost btn--sm', published ? 'Back to draft' : 'Mark published');
    btn.type = 'button';
    btn.style.marginLeft = '8px';
    btn.addEventListener('click', function () {
      meta.status = published ? 'draft' : 'published';
      queueSave('meta/status', meta.status);
      renderStatusControl(wrap);
    });
    wrap.appendChild(btn);
  }

  function fieldGroup(label, input) {
    var g = el('div', 'form-group');
    var l = el('label', null, label);
    g.appendChild(l);
    g.appendChild(input);
    return g;
  }
  function textInput(value, onChange) {
    var i = el('input');
    i.type = 'text';
    i.value = value;
    i.addEventListener('input', function () { onChange(i.value); });
    return i;
  }

  function renderArticles(wrap) {
    /* Rebuilding empties the container, which momentarily collapses the
       pane's scroll height and clamps the scroll to the top — capture and
       restore it so add/delete/reorder/photo changes don't jump the view */
    var pane = wrap.closest ? wrap.closest('.nlx-pane--editor') : null;
    var st = pane ? pane.scrollTop : (window.scrollY || window.pageYOffset || 0);
    wrap.innerHTML = '';
    var arts = sortedArticles();
    function restoreScroll() {
      if (pane) pane.scrollTop = st; else window.scrollTo(0, st);
    }
    if (!arts.length) {
      var empty = el('div', 'empty-state');
      empty.appendChild(el('div', 'empty-state__title', 'No articles yet'));
      empty.appendChild(el('div', 'empty-state__text', 'Add the first article – four to six is about right for two pages.'));
      wrap.appendChild(empty);
      restoreScroll();
      return;
    }
    arts.forEach(function (art, idx) {
      wrap.appendChild(buildArticleCard(art, idx, arts.length, wrap));
    });
    restoreScroll();
  }

  /* Scroll the editor to an article's card (pane on desktop, window on
     mobile — scrollIntoView finds the right scroller) with a brief flash */
  function scrollToArticleCard(id) {
    var card = document.querySelector('.nlx-art[data-art-id="' + id + '"]');
    if (!card) return;
    card.scrollIntoView({ behavior: 'smooth', block: 'center' });
    card.classList.add('nlx-art--flash');
    setTimeout(function () { card.classList.remove('nlx-art--flash'); }, 1200);
  }

  function buildArticleCard(art, idx, total, listWrap) {
    var id = art._id;
    var panel = el('div', 'form-panel nlx-art');
    panel.setAttribute('data-art-id', id);

    var head = el('div', 'form-panel__head');
    var row = el('div', 'nlx-art__head-row');
    row.appendChild(el('span', 'nlx-art__num', String(idx + 1)));
    var headTitle = el('span', 'nlx-art__head-title', art.headline || 'Untitled article');
    row.appendChild(headTitle);

    var up = el('button', 'btn btn--ghost btn--sm');
    up.type = 'button';
    up.title = 'Move up';
    up.setAttribute('aria-label', 'Move up');
    up.appendChild(NL.icon('up', 'sm'));
    up.disabled = idx === 0;
    up.addEventListener('click', function () { moveArticle(id, -1); renderArticles(listWrap); schedulePreview(); scrollToArticleCard(id); });
    var down = el('button', 'btn btn--ghost btn--sm');
    down.type = 'button';
    down.title = 'Move down';
    down.setAttribute('aria-label', 'Move down');
    down.appendChild(NL.icon('down', 'sm'));
    down.disabled = idx === total - 1;
    down.addEventListener('click', function () { moveArticle(id, 1); renderArticles(listWrap); schedulePreview(); scrollToArticleCard(id); });
    var del = el('button', 'btn btn--danger btn--sm', 'Delete');
    del.type = 'button';
    del.addEventListener('click', function () {
      NL.confirm('Delete "' + (art.headline || 'Untitled article') + '"?',
        { title: 'Delete article', confirmText: 'Delete', variant: 'danger' })
        .then(function (ok) {
          if (!ok) return;
          deleteArticle(id)
            .then(function () { renderArticles(listWrap); schedulePreview(); })
            .catch(function (err) { NL.toast(err.message, 'error'); });
        });
    });
    row.appendChild(up);
    row.appendChild(down);
    row.appendChild(del);
    head.appendChild(row);
    panel.appendChild(head);

    var body = el('div', 'form-panel__body');

    /* Pickers sit abreast in a grid. The photo is independent of the
       article type — choose the image, then its placement, separately. */
    var grid = el('div', 'nlx-field-grid');
    body.appendChild(grid);

    /* Type */
    var layoutSel = el('select');
    LAYOUTS.forEach(function (l) {
      var o = el('option', null, l.label);
      o.value = l.key;
      if ((art.layout || 'text-only') === l.key) o.selected = true;
      layoutSel.appendChild(o);
    });
    layoutSel.addEventListener('change', function () {
      art.layout = layoutSel.value;
      queueSave('articles/' + id + '/layout', art.layout);
      schedulePreview();
    });
    grid.appendChild(fieldGroup('Type', layoutSel));

    /* Style — print-safe tints and accents */
    var styleSel = el('select');
    STYLES.forEach(function (s) {
      var o = el('option', null, s.label);
      o.value = s.key;
      if ((art.style || 'plain') === s.key) o.selected = true;
      styleSel.appendChild(o);
    });
    styleSel.addEventListener('change', function () {
      art.style = styleSel.value;
      queueSave('articles/' + id + '/style', art.style);
      schedulePreview();
    });
    grid.appendChild(fieldGroup('Style', styleSel));

    /* Width — fractional widths pack side by side in order */
    var widthSel = el('select');
    WIDTHS.forEach(function (w) {
      var o = el('option', null, w.label);
      o.value = w.key;
      if ((art.width || 'full') === w.key) o.selected = true;
      widthSel.appendChild(o);
    });
    widthSel.addEventListener('change', function () {
      art.width = widthSel.value;
      queueSave('articles/' + id + '/width', art.width);
      schedulePreview();
    });
    grid.appendChild(fieldGroup('Width', widthSel));

    /* Columns */
    var colsSel = el('select');
    [{ v: 1, label: 'Single column' }, { v: 2, label: 'Two columns' }].forEach(function (c) {
      var o = el('option', null, c.label);
      o.value = String(c.v);
      if ((art.columns || 1) === c.v) o.selected = true;
      colsSel.appendChild(o);
    });
    colsSel.addEventListener('change', function () {
      art.columns = parseInt(colsSel.value, 10) || 1;
      queueSave('articles/' + id + '/columns', art.columns);
      schedulePreview();
    });
    grid.appendChild(fieldGroup('Columns', colsSel));

    /* Photo position — enabled once a photo is chosen */
    var posSel = el('select');
    POSITIONS.forEach(function (p) {
      var o = el('option', null, p.label);
      o.value = p.key;
      if ((art.imagePos || 'above') === p.key) o.selected = true;
      posSel.appendChild(o);
    });
    posSel.disabled = !art.imageId;
    if (!art.imageId) posSel.title = 'Choose a photo first';
    posSel.addEventListener('change', function () {
      art.imagePos = posSel.value;
      queueSave('articles/' + id + '/imagePos', art.imagePos);
      schedulePreview();
    });
    grid.appendChild(fieldGroup('Photo position', posSel));

    /* Line spacing nudge — ±0.1 steps off the 1.5 base, with reset. For
       visually balancing neighbouring articles that are nearly level. */
    var leadGroup = el('div', 'form-group');
    leadGroup.appendChild(el('label', null, 'Line spacing nudge'));
    var leadRow = el('div', 'nlx-leading-row');
    var leadInput = el('input');
    leadInput.type = 'number';
    leadInput.step = '0.1';
    leadInput.min = '-0.4';
    leadInput.max = '0.6';
    leadInput.value = typeof art.leading === 'number' ? art.leading : 0;
    function setLeading(v) {
      v = Math.max(-0.4, Math.min(0.6, Math.round(v * 10) / 10)) || 0;
      art.leading = v;
      leadInput.value = v;
      queueSave('articles/' + id + '/leading', v);
      schedulePreview();
    }
    leadInput.addEventListener('input', function () { setLeading(parseFloat(leadInput.value)); });
    leadRow.appendChild(leadInput);
    var leadReset = el('button', 'btn btn--ghost btn--sm', 'Reset');
    leadReset.type = 'button';
    leadReset.addEventListener('click', function () { setLeading(0); });
    leadRow.appendChild(leadReset);
    leadGroup.appendChild(leadRow);
    leadGroup.appendChild(el('div', 'form-hint', '0 is normal. Nudge by 0.1 to level up columns.'));
    grid.appendChild(leadGroup);

    /* Photo — always available, independent of type */
    var imgGroup = el('div', 'form-group');
    imgGroup.appendChild(el('label', null, 'Photo'));
    var imgRow = el('div', 'nlx-img-row');
    var thumb = el('img', 'nlx-img-thumb');
    var recNow = art.imageId && S.library ? S.library[art.imageId] : null;
    if (recNow && recNow.downloadUrl) thumb.src = recNow.downloadUrl;
    thumb.alt = '';
    thumb.onerror = function () { this.onerror = null; this.removeAttribute('src'); };
    imgRow.appendChild(thumb);
    var choose = el('button', 'btn btn--ghost btn--sm', art.imageId ? 'Change photo' : 'Choose photo');
    choose.type = 'button';
    choose.addEventListener('click', function () {
      openImagePicker(function (lid) {
        art.imageId = lid;
        art.crop = null;                       /* new photo, fresh crop */
        queueSave('articles/' + id + '/imageId', lid);
        queueSave('articles/' + id + '/crop', null);
        renderArticles(listWrap);
        schedulePreview();
      });
    });
    imgRow.appendChild(choose);
    if (art.imageId) {
      /* Tap the photo (or the button) to crop — non-destructive */
      thumb.style.cursor = 'pointer';
      thumb.title = 'Crop photo';
      function cropNow() {
        openCropTool(art, id, function () { renderArticles(listWrap); schedulePreview(); });
      }
      thumb.addEventListener('click', cropNow);
      var cropBtn = el('button', 'btn btn--ghost btn--sm', 'Crop');
      cropBtn.type = 'button';
      cropBtn.addEventListener('click', cropNow);
      imgRow.appendChild(cropBtn);
      if (art.crop) imgRow.appendChild(el('span', 'pill pill--info', 'Cropped'));
      var removeImg = el('button', 'btn btn--ghost btn--sm', 'Remove');
      removeImg.type = 'button';
      removeImg.addEventListener('click', function () {
        art.imageId = null;
        art.crop = null;
        queueSave('articles/' + id + '/imageId', null);
        queueSave('articles/' + id + '/crop', null);
        renderArticles(listWrap);
        schedulePreview();
      });
      imgRow.appendChild(removeImg);
    }
    var capInput = textInput(art.imageCaption || '', function (v) {
      art.imageCaption = v;
      queueSave('articles/' + id + '/imageCaption', v);
      schedulePreview();
    });
    capInput.placeholder = 'Optional caption';
    capInput.style.flex = '1';
    capInput.style.minWidth = '140px';
    imgRow.appendChild(capInput);
    imgGroup.appendChild(imgRow);
    body.appendChild(imgGroup);

    /* Headline */
    var headlineInput = textInput(art.headline || '', function (v) {
      art.headline = v;
      headTitle.textContent = v || 'Untitled article';
      queueSave('articles/' + id + '/headline', v);
      schedulePreview();
    });
    headlineInput.placeholder = 'Headline';
    body.appendChild(fieldGroup('Headline', headlineInput));

    /* Standfirst */
    var standInput = textInput(art.standfirst || '', function (v) {
      art.standfirst = v;
      queueSave('articles/' + id + '/standfirst', v);
      schedulePreview();
    });
    standInput.placeholder = 'Optional one-line intro';
    body.appendChild(fieldGroup('Standfirst', standInput));

    /* Body editor — canon rich text (NL.richText: forced plain-text paste,
       whitelist sanitiser, Enter = paragraph / Shift+Enter = line break) */
    var bodyGroup = el('div', 'form-group');
    bodyGroup.appendChild(el('label', null, 'Body'));
    NL.richText(bodyGroup, {
      value: art.body || '',
      placeholder: 'Write the article…',
      compact: true,
      onChange: function (clean) {
        art.body = clean;
        queueSave('articles/' + id + '/body', clean);
        schedulePreview();
      }
    });
    var hint = el('div', 'form-hint', 'Paste always arrives as plain text. Enter starts a new paragraph; Shift+Enter a line break.');
    bodyGroup.appendChild(hint);
    body.appendChild(bodyGroup);

    panel.appendChild(body);
    return panel;
  }

  /* ── Routing ──────────────────────────────────────────────────────────── */
  function route() {
    var m = /^#edition\/([\w-]+)$/.exec(location.hash || '');
    if (m) {
      openEdition(m[1]).then(function (ed) {
        if (ed) renderEditor(); else { location.hash = ''; renderList(); }
      }).catch(function (err) {
        NL.toast(err.message, 'error');
        location.hash = '';
        renderList();
      });
    } else {
      loadEditions()
        .then(renderList)
        .catch(function (err) { NL.toast(err.message, 'error'); });
    }
  }
  window.addEventListener('hashchange', route);

  /* Flush any pending autosave before the tab goes away */
  window.addEventListener('beforeunload', function () {
    if (Object.keys(_pending).length) flushSaves();
  });

  /* ── Boot ─────────────────────────────────────────────────────────────── */
  window.TOOL = window.TOOL || {};
  window.TOOL.boot = function (session) {
    S.session = session;
    main = document.getElementById('mainContent');
    route();
  };

  /* If auth-guard fired before this script loaded, replay the session. */
  if (window._toolDeferredSession) {
    window.TOOL.boot(window._toolDeferredSession);
    delete window._toolDeferredSession;
  }
})();
</script>

</body>
</html>
