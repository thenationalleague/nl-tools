<!DOCTYPE html>
<!--
  NL Tools — Newsletter
  Version: v1.19 (16/08/2026)

  v1.19 (16/08/2026) — the editions list header no longer repeats the tool's
  name: the JS-built .page-header (<h1>Newsletter</h1> + a sentence
  describing the tool — the anti-pattern lint bans, invisible to its static
  check) becomes a canon .section-head reading "Editions" with the New
  edition button beside it. Orphaned .page-header media-query rules
  deleted.
  File: /newsletter/index.html

  Monthly staff newsletter builder. Editors write a title, month and a handful
  of articles; the tool renders a live A4 preview and exports a PDF via the
  browser print dialog (window.print + print stylesheet — "Path A" from the
  build handover). The preview and the printed document are THE SAME DOM,
  paginated by the same code (renderDocument), so they cannot drift.

  Technical changelog:
    v1.18 (16/08/2026)
      - Autosave timestamp uses NL.formatTime (nl-utils v1.31) instead of
        an inline slice(-2) pad — one of the three hand-rolled time
        formatters that prompted the promotion.
    v1.17 (24/07/2026)
      - Draft/Published moved into the top bar; the "Edition details"
        panel head removed (Title/Subtitle/Month explain themselves).
      - Exported PDF is named from the edition: document.title is set to
        "title – subtitle" for the duration of printing (Chrome names
        Save-as-PDF files after the tab title) and restored on afterprint.
        Covers both Export PDF and Ctrl+P.
    v1.16 (24/07/2026)
      - Packing generalised from same-width masonry to column TRACKS: a
        fractional run opens tracks across the page in order (third +
        two-thirds etc.); once the width is spoken for, each next article
        stacks into the shortest existing track of its own width. Fixes
        mixed-width case where a second two-thirds article started a new
        band under a taller one-third neighbour instead of slotting under
        the first two-thirds. Subsumes and replaces the v1.14 special
        case.
      - Reorder follows the article: after ↑/↓ the editor smooth-scrolls to
        the moved card (data-art-id lookup) with a brief blue flash.
      - Preview→editor navigation: tapping an article in the preview
        scrolls the editor to its card (delegated click on #nlxDocScale;
        links in the preview no longer navigate).
    v1.15 (24/07/2026)
      - Page ceiling removed: CONFIG.pageLimit = 0 means no limit — the
        newsletter runs to as many pages as required, and the gauge simply
        reports "N pages · page N is X% full". Warnings remain only for
        real faults (article taller than a page, empty page 1). Setting
        pageLimit to a number restores the over-length warning and export
        confirm at that count.
    v1.14 (24/07/2026)
      - Masonry packing for same-width runs: when consecutive articles
        share a fractional width and outnumber the columns (3+ halves,
        4+ thirds), they pack into .nlx-rowcol columns shortest-first —
        article 3 slots under the shorter of the first two instead of
        starting a new row below the taller one. Requires pre-measuring
        fractional blocks at target width (incl. side-fig solving) before
        packing. Mixed-width sequences and short runs keep plain row
        packing. Area gauge unchanged (column heights are content
        heights).
    v1.13 (24/07/2026)
      - Article nav de-intruded: the editor pane reserves a 52px right
        gutter on desktop and the buttons sit inside it (negative margin
        into the padding), clear of card controls; buttons down to 32px.
      - Floating + (btn--primary, canon add icon) added to the nav stack —
        shares the Add article handler (add, scroll to card, focus
        headline).
    v1.12 (24/07/2026)
      - Floating article navigation: sticky round up/down buttons at the
        editor pane's right edge (fixed bottom-right on stacked/mobile)
        that smooth-scroll the view to the previous/next article card.
        View-only — never reorders. Scroller-aware (pane on desktop,
        window on mobile).
    v1.11 (24/07/2026)
      - Fill gauge measures AREA, not height: each unit contributes its
        width-fraction × height (rows sum their members individually), so
        a page-tall half-width article reads ~50%, not 99% — the empty
        half-column is honestly reported as available. Page COUNT stays
        height-based, matching real pagination.
      - Bar layout: title takes the flexible space (truncates only when
        genuinely out of room), gauge moved right beside the actions, and
        the % detail is inline again (small muted text after the headline)
        rather than hover-only.
      - Footer replicates the masthead (title – subtitle); the separate
        CONFIG.footerText string is gone.
    v1.10 (24/07/2026)
      - Editor no longer jumps to the top on add/delete/reorder/photo
        changes: renderArticles rebuilds empty the container, momentarily
        collapsing the pane's scroll height (browser clamps scrollTop to
        0). Scroll position is now captured and restored across every
        rebuild. Add article additionally scrolls the new card into view
        and focuses its headline.
    v1.9 (24/07/2026)
      - Image sizing rebuilt to the intended model: 'above' is ALWAYS the
        full article width (no 85mm cap, no centring — height comes purely
        from the crop; the editor manages proportions by cropping).
        Left/right are now full-height image COLUMNS beside the text (like
        the old editions), not floats with wrap-under: a fixed-point solver
        (solveSideFigs) sizes the column in the measuring pass so the
        image height matches the text height, width from the crop aspect,
        clamped 15–60% of the article. Solved sizes are written inline, so
        preview and print stay identical.
      - Standfirst restyled to the house look: dark (--text), wght 700,
        11pt — was muted 600 at 10.5pt.
    v1.8 (24/07/2026)
      - Enter-still-a-line-break fix, in canon (nl-utils v1.25, ?v=26):
        multi-line pastes were inserted via insertText, which emits <br>s —
        and inside <br>-structured content the browser keeps answering
        Enter with more line breaks. Paste now builds real <p> paragraphs
        (blank line = paragraph, single newline = <br>) from escaped text,
        and NL.sanitiseHtml normalises top-level structure (loose runs
        wrapped in <p>, double-<br> → paragraph break) so existing bodies
        self-heal on next open. No newsletter-local code changes.
    v1.7 (24/07/2026)
      - Rich-text editing promoted to canon: the body editor is now
        NL.richText (nl-utils v1.24) on .fmt-toolbar--compact/.fmt-edit
        (nl-brand v2.27); local toolbar/editor CSS and sanitiser removed
        (local sanitiseHtml delegates to NL.sanitiseHtml). Lockstep
        cache-bust nl-brand + nl-utils ?v=24 -> ?v=25.
      - Bold/italic fix (v1.6 bug): the inherited body-level
        font-variation-settings:'wght' 400 pins the variable font's weight,
        so <b> applied but rendered identically. Explicit b/strong/i/em
        rules added in canon .fmt-edit and in the document body styles.
    v1.6 (24/07/2026)
      - Non-destructive crop tool. Tap the photo thumb (or Crop) → modal
        shows the WHOLE image with cropped-out regions dimmed (MS Word
        style), 8 drag handles + move, Reset. Crop stored per article as
        fractions {x,y,w,h} of the original; the library image is never
        modified, so re-opening shows dimmed areas and they can be
        reinstated. Rendered via an aspect-ratio wrapper with an
        oversized/offset img (percent maths), so pagination measurement
        stays synchronous. Replaces the v1.5 85mm object-fit stopgap.
      - Image sizing follows the crop: 'above' spans article width (height
        from crop aspect, 85mm cap); left/right figures derive their column
        width from the crop aspect at 45mm height (60% cap), so the text
        column adapts to the crop shape.
      - Headline now optional: an empty headline renders nothing (body
        reclaims the space) instead of "Untitled article". Editor cards
        keep the placeholder label.
      - Choosing a different photo resets the crop.
      - defaultParagraphSeparator forced to 'p': Enter = paragraph break
        (visible spacing in the editor, matching the rendered document),
        Shift+Enter = <br> line break.
    v1.5 (24/07/2026)
      - Photo decoupled from article type: `imagePos` ('above'|'left'|
        'right') is its own field, layout collapses to 'text-only'|'hero',
        legacy 'image-*' layout values normalised on load. The Photo row is
        always visible (choose → then position); the position select is
        disabled until a photo is chosen.
      - Editor pickers (Type/Style/Width/Columns/Photo position/Nudge) sit
        abreast in a responsive .nlx-field-grid; caption moved inline into
        the photo row.
      - Blank-page-1 fix: photos are height-capped at 85mm (object-fit
        cover centre-crop, pending the crop tool) so a tall portrait image
        cannot balloon an article past page 1's banner capacity; and when a
        first article still cannot fit beneath the banner, the fill gauge
        now says so explicitly ("page 1 is empty below the banner")
        instead of silently plonking everything onto page 2.
      - Desktop app layout: compact .nlx-bar (title + gauge + save +
        actions in one row, warn detail in a strip below only when needed);
        the shell is sized to the viewport (--nlx-shell-h via sizeShell())
        so editor and preview are two independent scrollers and the page
        itself does not scroll.
    v1.4 (24/07/2026)
      - Banner fix: the negative-margin full-bleed approach was clipped by
        the content inner's overflow:hidden (title cut off, rose half-out).
        The band is now a SHEET-level absolutely-positioned element,
        measured in a 210mm off-canvas box; page 1's content inner starts
        below it and page 1's capacity accounts for the band height. A unit
        that fits a full page but not the shorter banner page moves to
        page 2 instead of being flagged as overflow.
      - True Carbona Slanted cuts (self-hosted from assets/fonts/, licensed)
        for article headlines (ExtraBoldSlanted) and the running footer
        (RegularSlanted) — replaces the synthetic browser oblique. Preview
        re-measures on document.fonts 'loadingdone' so pagination is correct
        once the real cuts arrive.
      - Panels: more top padding (5mm), and the in-row padding reset no
        longer flattens panel padding (headlines were touching panel tops
        on half/third-width panels).
      - Editor head row contrast fixed (white number/headline on the navy
        form-panel head) and reorder buttons now use the canon up/down
        sprite icons via NL.icon instead of unicode arrows.
      - Per-article line-spacing nudge (`leading`, ±0.1 steps off the 1.5
        base, clamped to [-0.4, 0.6], reset button) for levelling
        neighbouring columns.
    v1.3 (24/07/2026)
      - Masthead rebuilt to the Board Update house style: full-bleed NL red
        banner with white title/month and the white rose lockup. The red is
        an absolutely-positioned <img> (inline SVG data URI) rather than a
        CSS background, so the banner PRINTS even with Chrome's
        "Background graphics" off — white text can never end up on a white
        page. Pagination credits back the @page top margin the banner
        swallows with its negative margin.
      - Per-article WIDTH (full / two thirds / half / third) with greedy
        row packing in renderDocument — fractional articles pack into flex
        rows, a row paginates as one unit, order + width gives placement.
      - Headlines italic (synthetic oblique — the house style's slanted
        cut), soft red panel style added (--primary-50), matching the old
        editions' pink blocks.
      - Desktop: preview pane scrolls independently (sticky, capped to the
        viewport). Mobile: header/actions, article button rows and the
        formatting toolbar wrap instead of forcing horizontal spill.
    v1.2 (24/07/2026)
      - Image pipeline (handover step 6). Firebase Storage confirmed in use
        (footage tool precedent) — compat SDK added to the head. Device
        upload and URL paste are both INGEST routes into one shared library:
        whatever arrives is downscaled client-side (canvas, 1,600px long
        edge, JPEG 0.85), written once to Storage at
        newsletter/library/{libraryId}.jpg, recorded in RTDB library/, and
        selected from the library thereafter. URL ingest COPIES the image —
        never hot-links — and fails loudly on CORS with save-and-upload
        advice. Non-raster files rejected; upload progress shown.
      - Image layouts (above/left/right) enabled in the picker; article
        cards gain a photo row (choose/remove + caption) when an image
        layout is selected. Rendering uses stored width/height so pagination
        measurement is correct before the image loads.
      - Library records are never deleted by the tool (past editions may
        reference them).
      - Storage rules snapshot added at system/storage/rules.snapshot.rules.
    v1.1 (24/07/2026)
      - Per-article presentation controls: `columns` (1|2 — CSS multicol on
        the body, headline/standfirst stay full width) and `style`
        ('plain'|'panel-blue'|'panel-grey'|'accent-bar'). Panels are light
        tints with dark text only — deliberately print-safe when Chrome's
        "Background graphics" is off (tint degrades to white, text stays
        legible); the accent bar is a border so it always prints. Style keys
        whitelisted at render so stored values can never inject classes.
    v1.0 (24/07/2026)
      - Initial build to handover spec (steps 1-5 + 7 of the build order).
      - RTDB data layer: editions as keyed records, articles as child nodes
        (per-article writes, integer `order` field), debounced 1s autosave
        with a visible saving/saved indicator.
      - Editor: edition meta, article add/delete/reorder (up/down buttons),
        layout picker, contenteditable body with bold/italic/link/bullets
        toolbar, forced plain-text paste, whitelist sanitiser on save.
      - Preview: manual pagination into fixed A4 sheets, visible page
        boundaries, live fill gauge with a hard warning when page 3 appears
        and per-article too-long-for-one-page warnings.
      - Export: window.print() over a dedicated print root (clone of the
        preview sheets, unscaled), one-time pre-flight modal covering the
        Chrome print settings (A4 / margins None / background graphics).
      - Image pipeline (Firebase Storage) NOT yet built — image layouts are
        present in the data model but disabled in the picker. See handover §5:
        Storage must be confirmed enabled + rules deployed first.

  Storage (RTDB):
    app-data/staff-newsletter/editions/{id}/meta/...       edition metadata
    app-data/staff-newsletter/editions/{id}/articles/{id}  article child nodes
    app-data/staff-newsletter/library/...                  image library (future)
    tools/staff-newsletter                                 tool registration

  Access (auth-guard registry — see system/auth-guard.js):
    staff access/admin → full editor. Club roles default off.
-->

  /* #pageWrap default hide is in nl-brand.css; auth-guard reveals with
     style.display = 'block'. Don't clear with '' — would re-trigger the
     brand rule and re-hide the page. */

  /* ── Editor shell ─────────────────────────────────────────────────────── */
  .nlx-shell {
    display: grid;
    grid-template-columns: minmax(400px, 5fr) minmax(340px, 6fr);
    gap: clamp(16px, 2vw, 28px);
    align-items: start;
  }
  .nlx-pane--editor { min-width: 0; }
  .nlx-pane--preview { min-width: 0; position: sticky; top: 12px; }
  .nlx-preview-toggle { display: none; }
  @media (min-width: 1101px) {
    /* App layout: the page itself doesn't scroll — the editor and the
       preview are two independent scrollers under the compact bar */
    body.nlx-editing .page { padding-bottom: 12px; }
    .nlx-shell { height: var(--nlx-shell-h, auto); }
    /* Right padding is the reserved gutter for the floating article nav */
    .nlx-pane--editor { height: 100%; overflow-y: auto; padding-right: 52px; }
    .nlx-pane--preview { position: static; height: 100%; overflow-y: auto; }
  }
  @media (max-width: 1100px) {
    .nlx-shell { grid-template-columns: 1fr; }
    .nlx-pane--preview { position: static; }
    .nlx-preview-toggle { display: inline-flex; }
    .nlx-shell.nlx-shell--preview-hidden .nlx-pane--preview { display: none; }
  }
  @media (max-width: 700px) {
    /* Narrow screens: wrap button rows rather than spilling sideways */
    .nlx-art__head-row, .nlx-img-row { flex-wrap: wrap; }
    .nlx-art__head-row { row-gap: 6px; }
  }

  /* ── Editions list ────────────────────────────────────────────────────── */
  .nlx-ed-list { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
  .nlx-ed-card {
    background: var(--white); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px 18px; display: flex; flex-direction: column; gap: 6px; box-shadow: var(--shadow);
  }
  .nlx-ed-card__title { font-size: var(--text-base, 1em); font-variation-settings: 'wght' 800; color: var(--navy); }
  .nlx-ed-card__meta { font-size: var(--text-sm); color: var(--text-muted); }
  .nlx-ed-card__row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .nlx-ed-card__row .btn:first-child { margin-right: auto; }

  /* ── Save indicator ───────────────────────────────────────────────────── */
  .nlx-save {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: var(--text-sm); color: var(--text-muted); white-space: nowrap;
  }
  .nlx-save--saving { color: var(--amber); }
  .nlx-save--saved  { color: var(--green); }
  .nlx-save--error  { color: var(--red); }

  /* ── Compact top bar: title + gauge + save + actions in one row ──────── */
  .nlx-bar {
    position: sticky; top: 0; z-index: 5;
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    background: var(--white); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 8px 14px; margin-bottom: 10px;
  }
  .nlx-bar__title {
    font-variation-settings: 'wght' 900; color: var(--navy);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    flex: 1 1 auto; min-width: 0;
  }
  .nlx-bar__actions { display: flex; align-items: center; gap: 8px; margin-left: auto; flex-wrap: wrap; }
  .nlx-warnstrip {
    display: none; background: var(--red-light); border: 1px solid var(--red);
    border-radius: var(--radius); padding: 8px 14px; margin-bottom: 10px;
    font-size: var(--text-sm); color: var(--text);
  }

  /* ── Fill gauge — the tool's core guard rail (compact, lives in the bar) */
  .nlx-gauge { display: flex; align-items: center; gap: 10px; flex: 0 1 auto; min-width: 0; }
  .nlx-gauge__pages { display: flex; gap: 4px; }
  .nlx-gauge__page {
    width: 20px; height: 28px; border: 1.5px solid var(--border); border-radius: 2px;
    position: relative; overflow: hidden; background: var(--off-white);
  }
  .nlx-gauge__page-fill {
    position: absolute; left: 0; right: 0; top: 0;
    background: var(--navy-100); border-bottom: 1.5px solid var(--navy-300);
  }
  .nlx-gauge__page--over { border-color: var(--red); background: var(--red-light); }
  .nlx-gauge__page--over .nlx-gauge__page-fill { background: var(--red-light); border-bottom-color: var(--red); }
  .nlx-gauge__text { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
  .nlx-gauge__headline {
    font-variation-settings: 'wght' 800; font-size: var(--text-sm); color: var(--text);
    white-space: nowrap;
  }
  .nlx-gauge--warn .nlx-gauge__headline { color: var(--red); }
  .nlx-gauge__detail {
    font-size: var(--text-xs); color: var(--text-muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* ── Article cards ────────────────────────────────────────────────────── */
  .nlx-art { margin-bottom: 14px; }
  .nlx-art--flash { outline: 2px solid var(--blue); outline-offset: 2px; transition: outline-color 0.4s; }
  /* Preview articles are tap targets — clicking one jumps the editor there */
  #nlxDocScale .nlx-blk-art { cursor: pointer; }
  .nlx-art__head-row { display: flex; align-items: center; gap: 8px; width: 100%; }
  /* The form-panel head is navy — white text, not brand red/navy, or it
     disappears against the bar */
  .nlx-art__num {
    font-variation-settings: 'wght' 900; color: var(--white);
    font-size: var(--text-sm); min-width: 20px;
  }
  .nlx-art__head-title {
    flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-variation-settings: 'wght' 800; font-size: var(--text-sm); color: var(--white);
  }
  .nlx-leading-row { display: flex; align-items: center; gap: 8px; }
  .nlx-leading-row input { width: 90px; }

  /* Floating article navigation — jumps the view between article cards
     (never reorders). Sticky inside the editor pane on desktop; a fixed
     bottom-right pair on stacked/mobile layout. */
  .nlx-artnav { position: sticky; top: 42%; height: 0; z-index: 4; text-align: right; pointer-events: none; }
  .nlx-artnav__inner { display: inline-flex; flex-direction: column; gap: 6px; pointer-events: auto; }
  /* Round floating variant of the canon navy button (shape-only override) */
  .nlx-artnav .btn { width: 32px; height: 32px; padding: 0; justify-content: center; border-radius: 50%; box-shadow: var(--shadow); }
  @media (min-width: 1101px) {
    /* The buttons live in a reserved gutter to the right of the cards —
       never on top of card controls */
    .nlx-artnav__inner { margin-right: -46px; }
  }
  @media (max-width: 1100px) {
    .nlx-artnav { position: fixed; top: auto; right: 14px; bottom: 76px; height: auto; }
  }
  /* Pickers abreast — wraps to fewer columns as the pane narrows */
  .nlx-field-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 2px 14px;
    align-items: start;
  }
  .nlx-art__head-row .btn--sm { flex-shrink: 0; }

  /* Body editor: canon .fmt-toolbar--compact + .fmt-edit via NL.richText —
     no local editor CSS (promoted to nl-brand v2.27 / nl-utils v1.24) */

  /* Article photo row + library picker */
  .nlx-img-row { display: flex; align-items: center; gap: 10px; }
  .nlx-img-thumb {
    width: 64px; height: 48px; object-fit: cover; border-radius: 4px;
    border: 1px solid var(--border); background: var(--off-white); flex-shrink: 0;
  }
  .nlx-lib-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 10px; max-height: 50vh; overflow: auto; margin-top: 12px;
  }
  .nlx-lib-item {
    border: 2px solid transparent; border-radius: var(--radius);
    padding: 0; background: none; cursor: pointer; text-align: left;
  }
  .nlx-lib-item:hover, .nlx-lib-item:focus { border-color: var(--navy-300); }
  .nlx-lib-item img { width: 100%; height: 90px; object-fit: cover; border-radius: 4px; display: block; }
  .nlx-lib-item__name {
    font-size: var(--text-xs); color: var(--text-muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 3px 2px 0;
  }
  .nlx-progress { height: 6px; background: var(--off-white); border-radius: 3px; overflow: hidden; margin-top: 10px; }
  .nlx-progress__bar { height: 100%; width: 0; background: var(--green); transition: width 0.15s; }

  /* ── Preview pane ─────────────────────────────────────────────────────── */
  .nlx-preview-frame {
    background: var(--navy-100); border: 1px solid var(--border); border-radius: var(--radius);
    padding: clamp(10px, 1.5vw, 22px); overflow: hidden;
  }
  #nlxDocScale { transform-origin: 0 0; }

  /* ════════════════════════════════════════════════════════════════════════
     DOCUMENT STYLES — the printed page. This block is the ONE place in the
     tool where physical units (mm/pt) and fixed values are correct and
     unavoidable (print stylesheet exception, handover §6). Colours still
     come from brand tokens. Design rule: no load-bearing solid fills —
     rules, borders and weight instead — so output survives Chrome's
     "Background graphics: off" default.
     ════════════════════════════════════════════════════════════════════════ */
  /* True Carbona Slanted cuts — self-hosted licensed statics from
     assets/fonts/ (same files the handbook PDF renderer embeds). The
     variable webfont has no italic axis, so these replace synthetic
     oblique for headlines and the running footer. */
  @font-face {
    font-family: 'carbona-slanted';
    src: url('/assets/fonts/CarbonaRegularSlanted.otf') format('opentype');
    font-weight: 400; font-style: normal; font-display: swap;
  }
  @font-face {
    font-family: 'carbona-slanted';
    src: url('/assets/fonts/CarbonaExtraBoldSlanted.otf') format('opentype');
    font-weight: 800; font-style: normal; font-display: swap;
  }

  .nlx-sheet {
    width: 210mm; height: 297mm;
    background: var(--white);
    position: relative; overflow: hidden;
    font-family: var(--font); color: var(--text);
    print-color-adjust: exact; -webkit-print-color-adjust: exact;
  }
  @media screen {
    .nlx-sheet { margin: 0 0 18px; box-shadow: var(--shadow); }
    .nlx-sheet:last-child { margin-bottom: 0; }
  }
  .nlx-sheet__inner {
    position: absolute; top: 14mm; left: 16mm; right: 16mm; bottom: 16mm;
    overflow: hidden;
  }
  .nlx-sheet__foot {
    position: absolute; left: 0; right: 0; bottom: 6mm;
    text-align: center; font-size: 7.5pt; color: var(--text-muted);
    font-family: 'carbona-slanted', var(--font); font-weight: 400; font-style: normal;
  }
  .nlx-sheet--overflow .nlx-sheet__inner { outline: 1.5px dashed var(--red); }

  /* Masthead — 'rule' variant: text, rules and weight only */
  .nlx-mast { position: relative; padding: 2mm 0 5mm; margin-bottom: 6mm; border-bottom: 1.1mm solid var(--primary); }
  .nlx-mast__kicker { font-size: 9pt; letter-spacing: 0.28em; color: var(--primary); font-variation-settings: 'wght' 800; text-transform: uppercase; }
  .nlx-mast__title { margin: 1.5mm 0 0; font-size: 27pt; line-height: 1.05; color: var(--navy); font-variation-settings: 'wght' 900; text-transform: uppercase; }
  .nlx-mast__sub { margin-top: 2mm; font-size: 12.5pt; color: var(--text-muted); font-variation-settings: 'wght' 600; }
  .nlx-mast__rose { position: absolute; right: 0; top: 1mm; width: 15mm; height: auto; }

  /* Masthead — 'band' variant (Board Update house style): full-bleed red
     banner. The red is an <img> (SVG data URI), NOT a CSS background, so
     the banner prints even with "Background graphics" off and the white
     text can never land on a white page. Negative margins pull it to the
     page edges; pagination credits back the swallowed top margin. */
  .nlx-mast--band { margin: 0; padding: 6.5mm 16mm 7mm; border-bottom: none; }
  /* In a sheet the band sits at page level, above the clipped content
     inner — never inside it (its edges were being clipped off there) */
  .nlx-sheet > .nlx-mast--band { position: absolute; top: 0; left: 0; right: 0; }
  .nlx-mast--band .nlx-mast__bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: block; }
  .nlx-mast__bandcontent { position: relative; padding-right: 30mm; }
  .nlx-mast--band .nlx-mast__title { margin: 0; font-size: 22pt; color: var(--white); }
  .nlx-mast--band .nlx-mast__sub { margin-top: 1mm; font-size: 10.5pt; color: var(--white); text-transform: uppercase; letter-spacing: 0.08em; font-variation-settings: 'wght' 800; }
  .nlx-mast__rose--band { position: absolute; right: 8mm; top: 50%; transform: translateY(-50%); width: 19mm; height: auto; }

  /* Article rows — fractional-width articles pack side by side. A row is
     one pagination unit; heights are top-aligned like the old editions. */
  .nlx-row { display: flex; gap: 5mm; align-items: flex-start; }
  /* Descendant (not child) — blocks may sit directly in the row or inside
     a masonry column */
  .nlx-row .nlx-blk-art { border-top: none; padding-top: 0; min-width: 0; }
  .nlx-row > .nlx-blk-art { flex: 0 0 auto; }
  .nlx-row .nlx-blk-art--accent-bar { padding-top: 1mm; }
  /* The row padding reset must not flatten panels — their headlines were
     touching the panel top when panels sat side by side */
  .nlx-row .nlx-blk-art--panel-blue,
  .nlx-row .nlx-blk-art--panel-grey,
  .nlx-row .nlx-blk-art--panel-red { padding: 5mm 5mm 4.5mm; }
  /* Masonry columns for same-width runs — articles stack inside a column,
     the packer sends each next article to the shortest column */
  .nlx-rowcol { flex: 0 0 auto; min-width: 0; }
  .nlx-rowcol > .nlx-blk-art + .nlx-blk-art { margin-top: 5mm; }
  .nlx-w-half       { width: calc((100% - 5mm) / 2); }
  .nlx-w-third      { width: calc((100% - 10mm) / 3); }
  .nlx-w-two-thirds { width: calc((100% - 10mm) / 3 * 2 + 5mm); }

  /* Article blocks */
  .nlx-blk-art { padding-top: 4.5mm; border-top: 0.3mm solid var(--border); }
  .nlx-blk-art--hero { border-top: none; padding-top: 0; }

  /* Per-article styles. Panels are LIGHT tints with dark text only — if
     "Background graphics" is off in the print dialog, the tint degrades to
     white and the text stays legible. The accent bar is a border, so it
     prints regardless. Never a dark fill with white text here. */
  .nlx-blk-art--panel-blue,
  .nlx-blk-art--panel-grey,
  .nlx-blk-art--panel-red { border-top: none; border-radius: 2mm; padding: 5mm 5mm 4.5mm; }
  .nlx-blk-art--panel-blue { background: var(--blue-light); }
  .nlx-blk-art--panel-grey { background: var(--navy-50); }
  .nlx-blk-art--panel-red { background: var(--primary-50); }
  .nlx-blk-art--accent-bar { border-top: none; padding-top: 1mm; border-left: 1.1mm solid var(--primary); padding-left: 4.5mm; }

  /* Two-column body text — headline and standfirst stay full width */
  .nlx-blk-art--cols2 .nlx-blk-art__body { column-count: 2; column-gap: 6mm; }

  /* Article images. width/height attrs are set from the library record so
     the box height is known before the image loads — pagination measurement
     stays correct. Floated figures are cleared by the body's ::after so
     measured block height always includes them. */
  .nlx-blk-art__fig { margin: 0 0 2.5mm; }
  /* Cropped rendering: the wrapper carries the crop's aspect ratio and
     clips; the img inside is oversized/offset in % so exactly the crop
     window shows. Sizing is set inline per figure (width follows the
     crop aspect so the text column adapts). */
  .nlx-blk-art__imgwrap { position: relative; overflow: hidden; border-radius: 1.5mm; margin: 0 auto; }
  .nlx-blk-art__imgwrap .nlx-blk-art__img { position: absolute; height: auto; display: block; }
  .nlx-blk-art__cap { margin-top: 1.2mm; font-size: 7.5pt; font-style: italic; color: var(--text-muted); }
  /* Side placement = a full-height image COLUMN beside the text (like the
     old editions), not a float with wrap-under. The image column's width
     is solved in JS so image height matches the text height, with the
     shape coming entirely from the crop. */
  .nlx-blk-art__cols { display: flex; gap: 4.5mm; align-items: flex-start; }
  .nlx-blk-art__cols--right { flex-direction: row-reverse; }
  .nlx-blk-art__cols .nlx-blk-art__fig { flex: 0 0 auto; margin: 0; }
  .nlx-blk-art__cols .nlx-blk-art__body { flex: 1 1 auto; min-width: 0; }
  .nlx-blk-art__body::after { content: ''; display: block; clear: both; }

  /* ── Crop tool (editor UI) ───────────────────────────────────────────── */
  .nlx-crop-wrap { text-align: center; }
  .nlx-crop-stage { position: relative; display: inline-block; user-select: none; touch-action: none; }
  .nlx-crop-stage > img { display: block; max-width: 100%; max-height: 58vh; width: auto; height: auto; pointer-events: none; }
  .nlx-crop-veil { position: absolute; background: var(--navy); opacity: 0.5; pointer-events: none; }
  .nlx-crop-rect { position: absolute; border: 2px solid var(--white); outline: 1px solid var(--navy); cursor: move; box-sizing: border-box; }
  .nlx-crop-handle {
    position: absolute; width: 14px; height: 14px; box-sizing: border-box;
    background: var(--white); border: 2px solid var(--navy); border-radius: 50%;
    transform: translate(-50%, -50%);
  }
  .nlx-blk-art__head {
    margin: 0 0 1.6mm; font-size: 13.5pt; line-height: 1.15; color: var(--navy);
    font-family: 'carbona-slanted', var(--font); font-weight: 800;
    font-variation-settings: normal;
  }
  .nlx-blk-art--hero .nlx-blk-art__head { font-size: 19pt; }
  .nlx-blk-art--hero .nlx-blk-art__rule { width: 22mm; height: 0.9mm; background: var(--primary); border-radius: 0.5mm; margin: 0 0 2.5mm; }
  .nlx-blk-art__stand { margin: 0 0 2mm; font-size: 11pt; line-height: 1.35; color: var(--text); font-variation-settings: 'wght' 700; }
  .nlx-blk-art__body { font-size: 9.5pt; line-height: 1.5; }
  .nlx-blk-art__body p { margin: 0 0 2mm; }
  .nlx-blk-art__body p:last-child { margin-bottom: 0; }
  .nlx-blk-art__body ul { margin: 0 0 2mm; padding-left: 5mm; }
  .nlx-blk-art__body a { color: var(--blue); text-decoration: underline; }
  /* Explicit variation settings — the inherited body-level 'wght' 400 pins
     the variable font, silently defeating <b> (same fix as canon .fmt-edit) */
  .nlx-blk-art__body b, .nlx-blk-art__body strong { font-weight: 700; font-variation-settings: 'wght' 700; }
  .nlx-blk-art__body i, .nlx-blk-art__body em { font-style: italic; }

  /* Measuring container — off-canvas, same content width as a sheet inner */
  #nlxMeasure {
    position: absolute; left: -10000px; top: 0; width: 178mm;
    font-family: var(--font); color: var(--text);
  }

  /* Print root — hidden on screen, the only thing visible in print */
  #nlxPrintRoot { display: none; }

  @media print {
    @page { size: A4; margin: 0; }
    #nlTopbar, #pageWrap, #nlxMeasure, .modal-backdrop, .toast { display: none !important; }
    #nlxPrintRoot { display: block !important; }
    /* Fractionally under 297mm so rounding can never push a blank page */
    #nlxPrintRoot .nlx-sheet { width: 210mm; height: 296.6mm; margin: 0; box-shadow: none; page-break-after: always; }
    #nlxPrintRoot .nlx-sheet:last-child { page-break-after: auto; }
    #nlxPrintRoot .nlx-sheet--overflow .nlx-sheet__inner { outline: none; }
  }
</style>
</head>
<body>

<!-- Topbar — auto-rendered by /system/nl-topbar.js from window.NL_TOOL -->
<div id="nlTopbar"></div>

<div id="pageWrap">
  <div class="page">
    <div id="mainContent"><!-- rendered by JS via nlAuthReady --></div>
  </div>
</div>

<!-- Off-canvas measuring container for pagination (outside pageWrap so it is
     measurable regardless of the auth reveal) -->
<div id="nlxMeasure" aria-hidden="true"></div>

<!-- Print root — populated with a clone of the current sheets on export -->
<div id="nlxPrintRoot" aria-hidden="true"></div>

<!-- Main app -->
<script>
(function () {
  'use strict';

  /* ══════════════════════════════════════════════════════════════════════
     CONFIG — masthead text, page geometry and limits live here, not
     scattered through the CSS (handover §2). Bleed is a variable so a bled
     variant is a one-line change later.
     ══════════════════════════════════════════════════════════════════════ */
  var CONFIG = {
    mastheadStyle:  'band',     /* 'band' = red banner (Board Update house
                                   style) | 'rule' = white with red rule */
    mastheadKicker: 'The National League',
    defaultTitle:   'The National League Newsletter',
    roseUrl:        '/assets/crests/' + encodeURIComponent('National League rose.png'),
    roseWhiteUrl:   '/assets/crests/' + encodeURIComponent('National League rose white.png'),
    pageLimit:      0,          /* 0 = no page ceiling — as many pages as
                                   required. Set a number to restore the
                                   over-length warning at that page count. */
    bleedMM:        0,          /* 0 for office print; config var per handover */
    page: { wMM: 210, hMM: 297, topMM: 14, sideMM: 16, bottomMM: 16, gapMM: 5 }
  };

  /* Banner red as a standalone SVG image asset — an <img> prints even with
     "Background graphics" off, which a CSS background does not. The hex
     mirrors var(--primary); CSS variables cannot reach inside a data URI. */
  var BAND_BG = 'data:image/svg+xml;utf8,' + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" preserveAspectRatio="none">' +
    '<rect width="10" height="10" fill="#9e0000"/></svg>');

  var ROOT = 'app-data/staff-newsletter';
  var STYLES = [
    { key: 'plain',      label: 'Plain' },
    { key: 'panel-blue', label: 'Soft blue panel' },
    { key: 'panel-grey', label: 'Soft grey panel' },
    { key: 'panel-red',  label: 'Soft red panel' },
    { key: 'accent-bar', label: 'Red accent bar' }
  ];
  /* Article type and photo placement are SEPARATE controls — choose the
     image, then where it sits. Legacy 'image-*' layout values from earlier
     versions are normalised into imagePos on load. */
  var LAYOUTS = [
    { key: 'text-only', label: 'Standard' },
    { key: 'hero',      label: 'Hero (lead item)' }
  ];
  var POSITIONS = [
    { key: 'above', label: 'Above the text' },
    { key: 'left',  label: 'Left of the text' },
    { key: 'right', label: 'Right of the text' }
  ];
  var IMAGE_LAYOUTS = { 'image-above': 'above', 'image-left': 'left', 'image-right': 'right' };
  function normaliseArticle(a) {
    if (IMAGE_LAYOUTS[a.layout]) {
      a.imagePos = a.imagePos || IMAGE_LAYOUTS[a.layout];
      a.layout = 'text-only';
    }
    if (!a.imagePos) a.imagePos = 'above';
    return a;
  }
  var MAX_EDGE_PX = 1600;   /* long-edge cap before upload (handover §5) */
  var WIDTHS = [
    { key: 'full',       label: 'Full width', frac: 1 },
    { key: 'two-thirds', label: 'Two thirds', frac: 2 / 3 },
    { key: 'half',       label: 'Half width', frac: 1 / 2 },
    { key: 'third',      label: 'One third',  frac: 1 / 3 }
  ];
  function widthFrac(key) {
    for (var i = 0; i < WIDTHS.length; i++) if (WIDTHS[i].key === key) return WIDTHS[i].frac;
    return 1;
  }

  /* ── State ─────────────────────────────────────────────────────────────── */
  var S = {
    session: null,
    editions: {},        /* id -> meta (list view) */
    ed: null,            /* { id, meta:{}, articles:{} } while editing */
    library: null        /* id -> record; loaded with the edition so the
                            renderer can resolve images synchronously */
  };

  var main = null;       /* #mainContent, resolved at boot */

  /* ══════════════════════════════════════════════════════════════════════
     Helpers
     ══════════════════════════════════════════════════════════════════════ */
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function subtitleFromMonth(month) {
    /* 'YYYY-MM' -> 'July 2026' */
    var m = /^(\d{4})-(\d{2})$/.exec(month || '');
    if (!m) return '';
    var names = ['January','February','March','April','May','June','July',
                 'August','September','October','November','December'];
    var idx = parseInt(m[2], 10) - 1;
    return (names[idx] || '') + ' ' + m[1];
  }
  function currentMonth() {
    var d = new Date();
    return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2);
  }
  function sortedArticles() {
    if (!S.ed) return [];
    var arr = Object.keys(S.ed.articles || {}).map(function (id) {
      var a = S.ed.articles[id]; a._id = id; return a;
    });
    arr.sort(function (a, b) { return (a.order || 0) - (b.order || 0); });
    return arr;
  }

  var _pxmm = 0;
  function pxPerMM() {
    if (_pxmm) return _pxmm;
    var probe = el('div');
    probe.style.cssText = 'position:absolute;left:-10000px;height:100mm;width:1px;';
    document.body.appendChild(probe);
    _pxmm = probe.getBoundingClientRect().height / 100;
    probe.parentNode.removeChild(probe);
    return _pxmm || 3.7795;
  }

  /* HTML sanitising is canon — NL.sanitiseHtml (nl-utils v1.24). Local
     alias kept for the renderer's sanitise-again-on-render calls. */
  function sanitiseHtml(html) { return NL.sanitiseHtml(html); }

  /* ══════════════════════════════════════════════════════════════════════
     Data layer — debounced autosave with multi-path updates
     ══════════════════════════════════════════════════════════════════════ */
  var _pending = {};
  var _saveTimer = null;
  var _saveEl = null;

  function setSaveState(state, text) {
    if (!_saveEl) return;
    _saveEl.className = 'nlx-save nlx-save--' + state;
    _saveEl.textContent = text;
  }
  function queueSave(path, value) {
    if (!S.ed) return;
    _pending[path] = value;
    setSaveState('saving', 'Saving…');
    clearTimeout(_saveTimer);
    _saveTimer = setTimeout(flushSaves, 1000);
  }
  function dropPending(prefix) {
    Object.keys(_pending).forEach(function (k) {
      if (k.indexOf(prefix) === 0) delete _pending[k];
    });
  }
  function flushSaves() {
    if (!S.ed) { _pending = {}; return; }
    var keys = Object.keys(_pending);
    if (!keys.length) return;
    var batch = _pending; _pending = {};
    batch['meta/updatedAt'] = firebase.database.ServerValue.TIMESTAMP;
    var edId = S.ed.id;
    NL.ensureAuth()
      .then(function () { return db.ref(ROOT + '/editions/' + edId).update(batch); })
      .then(function () {
        var t = new Date();
        setSaveState('saved', 'Saved ' + NL.formatTime(t));
      })
      .catch(function (err) {
        setSaveState('error', 'Not saved – ' + err.message);
        NL.toast('Autosave failed: ' + err.message, 'error');
      });
  }

  function loadEditions() {
    return NL.ensureAuth()
      .then(function () { return db.ref(ROOT + '/editions').once('value'); })
      .then(function (snap) {
        var val = snap.val() || {};
        S.editions = {};
        Object.keys(val).forEach(function (id) {
          S.editions[id] = (val[id] && val[id].meta) || {};
          S.editions[id]._articleCount = val[id] && val[id].articles
            ? Object.keys(val[id].articles).length : 0;
        });
      });
  }

  function createEdition(month) {
    var meta = {
      title: CONFIG.defaultTitle,
      subtitle: subtitleFromMonth(month),
      month: month,
      status: 'draft',
      createdBy: S.session && S.session.uid || null,
      createdAt: firebase.database.ServerValue.TIMESTAMP,
      updatedAt: firebase.database.ServerValue.TIMESTAMP
    };
    return NL.ensureAuth().then(function () {
      var ref = db.ref(ROOT + '/editions').push();
      return ref.child('meta').set(meta).then(function () { return ref.key; });
    });
  }

  function openEdition(id) {
    return NL.ensureAuth()
      .then(function () {
        return Promise.all([
          db.ref(ROOT + '/editions/' + id).once('value'),
          db.ref(ROOT + '/library').once('value')
        ]);
      })
      .then(function (snaps) {
        var val = snaps[0].val();
        if (!val) { NL.toast('That edition no longer exists.', 'error'); return null; }
        S.library = snaps[1].val() || {};
        S.ed = { id: id, meta: val.meta || {}, articles: val.articles || {} };
        Object.keys(S.ed.articles).forEach(function (aid) { normaliseArticle(S.ed.articles[aid]); });
        return S.ed;
      });
  }

  /* ══════════════════════════════════════════════════════════════════════
     Image pipeline — device upload and URL paste are both INGEST routes
     into one shared library (handover §2/§5). Everything is downscaled
     client-side and written to Storage once; URL ingest copies the image,
     never hot-links it, and fails loudly on CORS. Library records are
     never deleted by the tool — past editions may reference them.
     ══════════════════════════════════════════════════════════════════════ */
  function ingestBlob(blob, filename) {
    return new Promise(function (resolve, reject) {
      if (!blob.type || blob.type.indexOf('image/') !== 0 || blob.type === 'image/svg+xml') {
        reject(new Error('That file is not a photo — please choose a JPEG or PNG image.'));
        return;
      }
      var url = URL.createObjectURL(blob);
      var img = new Image();
      img.onload = function () {
        URL.revokeObjectURL(url);
        var w = img.naturalWidth, h = img.naturalHeight;
        if (!w || !h) { reject(new Error('Could not read that image.')); return; }
        var scale = Math.min(1, MAX_EDGE_PX / Math.max(w, h));
        var cw = Math.round(w * scale), ch = Math.round(h * scale);
        var canvas = document.createElement('canvas');
        canvas.width = cw; canvas.height = ch;
        canvas.getContext('2d').drawImage(img, 0, 0, cw, ch);
        canvas.toBlob(function (out) {
          if (!out) { reject(new Error('Could not process that image.')); return; }
          resolve({ blob: out, width: cw, height: ch, filename: filename || '' });
        }, 'image/jpeg', 0.85);
      };
      img.onerror = function () {
        URL.revokeObjectURL(url);
        reject(new Error('Could not read that image.'));
      };
      img.src = url;
    });
  }

  function ingestFromUrl(url) {
    return fetch(url)
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.blob();
      })
      .catch(function () {
        /* Fail loudly per the handover — a silent empty box in the PDF is
           the failure mode this copy-on-ingest rule exists to prevent. */
        throw new Error('Could not fetch that image — the site may block cross-site requests (CORS). ' +
          'Save the image to your device and upload it instead.');
      })
      .then(function (blob) {
        var name = (url.split('/').pop() || 'image').split('?')[0];
        return ingestBlob(blob, name);
      });
  }

  function uploadToLibrary(processed, source, sourceUrl, onProgress) {
    return NL.ensureAuth().then(function () {
      var libRef = db.ref(ROOT + '/library').push();
      var path = 'newsletter/library/' + libRef.key + '.jpg';
      var task = firebase.storage().ref(path).put(processed.blob, { contentType: 'image/jpeg' });
      return new Promise(function (resolve, reject) {
        task.on('state_changed',
          function (snap) {
            if (onProgress && snap.totalBytes) onProgress(snap.bytesTransferred / snap.totalBytes);
          },
          reject,
          function () {
            task.snapshot.ref.getDownloadURL().then(function (dl) {
              var rec = {
                storagePath: path,
                downloadUrl: dl,
                width: processed.width,
                height: processed.height,
                filename: processed.filename,
                source: source,
                sourceUrl: sourceUrl || null,
                uploadedBy: (S.session && S.session.uid) || null,
                uploadedAt: firebase.database.ServerValue.TIMESTAMP
              };
              return libRef.set(rec).then(function () {
                if (S.library) {
                  var cached = {};
                  Object.keys(rec).forEach(function (k) { cached[k] = rec[k]; });
                  cached.uploadedAt = Date.now();
                  S.library[libRef.key] = cached;
                }
                resolve(libRef.key);
              });
            }).catch(reject);
          });
      });
    });
  }

  /* Library picker modal — grid of existing images plus the two ingest
     routes. onPicked(libraryId) fires when an image is chosen or a new
     ingest completes. */
  function openImagePicker(onPicked) {
    var wrap = el('div');

    var bar = el('div', 'toolbar');
    var left = el('div', 'toolbar__left');
    var upBtn = el('button', 'btn btn--navy btn--sm', 'Upload a photo');
    upBtn.type = 'button';
    var urlBtn = el('button', 'btn btn--ghost btn--sm', 'From a web address');
    urlBtn.type = 'button';
    left.appendChild(upBtn);
    left.appendChild(urlBtn);
    bar.appendChild(left);
    wrap.appendChild(bar);

    var file = el('input');
    file.type = 'file';
    file.accept = 'image/*';
    file.style.display = 'none';
    wrap.appendChild(file);

    var progress = el('div', 'nlx-progress');
    progress.style.display = 'none';
    var progressBar = el('div', 'nlx-progress__bar');
    progress.appendChild(progressBar);
    wrap.appendChild(progress);

    var grid = el('div', 'nlx-lib-grid');
    wrap.appendChild(grid);

    var ctrl = NL.modal({
      title: 'Photo library',
      width: 'wide',
      body: wrap,
      buttons: [{ label: 'Cancel', className: 'btn--ghost', onClick: function (c) { c.close(); } }]
    });

    function renderGrid() {
      grid.innerHTML = '';
      var ids = Object.keys(S.library || {});
      if (!ids.length) {
        var empty = el('div', 'empty-state');
        empty.appendChild(el('div', 'empty-state__title', 'The library is empty'));
        empty.appendChild(el('div', 'empty-state__text', 'Upload a photo or bring one in from a web address.'));
        grid.appendChild(empty);
        return;
      }
      ids.sort(function (a, b) { return (S.library[b].uploadedAt || 0) - (S.library[a].uploadedAt || 0); });
      ids.forEach(function (lid) {
        var rec = S.library[lid];
        var item = el('button', 'nlx-lib-item');
        item.type = 'button';
        var im = el('img');
        im.src = rec.downloadUrl;
        im.alt = rec.filename || '';
        im.onerror = function () { this.onerror = null; this.style.display = 'none'; };
        item.appendChild(im);
        item.appendChild(el('div', 'nlx-lib-item__name', rec.filename || 'Photo'));
        item.addEventListener('click', function () { ctrl.close(); onPicked(lid); });
        grid.appendChild(item);
      });
    }
    renderGrid();

    function runIngest(promise, source, sourceUrl) {
      progress.style.display = 'block';
      progressBar.style.width = '0%';
      upBtn.disabled = true; urlBtn.disabled = true;
      promise
        .then(function (processed) {
          return uploadToLibrary(processed, source, sourceUrl, function (p) {
            progressBar.style.width = Math.round(p * 100) + '%';
          });
        })
        .then(function (lid) {
          NL.toast('Photo added to the library', 'success');
          ctrl.close();
          onPicked(lid);
        })
        .catch(function (err) {
          progress.style.display = 'none';
          upBtn.disabled = false; urlBtn.disabled = false;
          NL.alert(err.message, { title: 'Could not add that photo' });
        });
    }

    upBtn.addEventListener('click', function () { file.click(); });
    file.addEventListener('change', function () {
      if (!file.files || !file.files[0]) return;
      var f = file.files[0];
      runIngest(ingestBlob(f, f.name), 'upload', null);
    });
    urlBtn.addEventListener('click', function () {
      NL.prompt('Paste the image address', { title: 'Photo from a web address', placeholder: 'https://…' })
        .then(function (url) {
          if (!url) return;
          runIngest(ingestFromUrl(url), 'url', url);
        });
    });
  }

  /* ── Crop tool — non-destructive, per-article ─────────────────────────
     Shows the WHOLE image with the cropped-out regions dimmed; drag the
     frame to move it, the handles to resize. The crop is stored as
     fractions ({x,y,w,h} of the original) on the article — the library
     original is never modified, so re-opening shows the dimmed areas and
     they can be brought back. */
  function openCropTool(art, id, onApplied) {
    var rec = art.imageId && S.library ? S.library[art.imageId] : null;
    if (!rec || !rec.downloadUrl) return;
    var c = art.crop ? { x: art.crop.x, y: art.crop.y, w: art.crop.w, h: art.crop.h }
                     : { x: 0, y: 0, w: 1, h: 1 };
    function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
    var MIN = 0.08;

    var outer = el('div', 'nlx-crop-wrap');
    var stage = el('div', 'nlx-crop-stage');
    var img = el('img');
    img.src = rec.downloadUrl;
    img.alt = '';
    stage.appendChild(img);
    var veils = {};
    ['t', 'b', 'l', 'r'].forEach(function (k) {
      veils[k] = el('div', 'nlx-crop-veil');
      stage.appendChild(veils[k]);
    });
    var rect = el('div', 'nlx-crop-rect');
    stage.appendChild(rect);
    var HANDLE_POS = {
      nw: ['0%', '0%'], n: ['50%', '0%'], ne: ['100%', '0%'], e: ['100%', '50%'],
      se: ['100%', '100%'], s: ['50%', '100%'], sw: ['0%', '100%'], w: ['0%', '50%']
    };
    Object.keys(HANDLE_POS).forEach(function (d) {
      var h = el('div', 'nlx-crop-handle');
      h.dataset.dir = d;
      h.style.left = HANDLE_POS[d][0];
      h.style.top = HANDLE_POS[d][1];
      h.style.cursor = d + '-resize';
      rect.appendChild(h);
    });
    outer.appendChild(stage);
    outer.appendChild(el('div', 'form-hint',
      'Drag the frame to move it, or the handles to resize. Dimmed areas are cropped out – nothing is deleted, re-open to bring them back.'));

    function layout() {
      rect.style.left = (c.x * 100) + '%';
      rect.style.top = (c.y * 100) + '%';
      rect.style.width = (c.w * 100) + '%';
      rect.style.height = (c.h * 100) + '%';
      veils.t.style.cssText += ';left:0;top:0;width:100%;height:' + (c.y * 100) + '%';
      veils.b.style.cssText += ';left:0;top:' + ((c.y + c.h) * 100) + '%;width:100%;height:' + ((1 - c.y - c.h) * 100) + '%';
      veils.l.style.cssText += ';left:0;top:' + (c.y * 100) + '%;width:' + (c.x * 100) + '%;height:' + (c.h * 100) + '%';
      veils.r.style.cssText += ';left:' + ((c.x + c.w) * 100) + '%;top:' + (c.y * 100) + '%;width:' + ((1 - c.x - c.w) * 100) + '%;height:' + (c.h * 100) + '%';
    }
    layout();

    var drag = null;
    function onDown(e) {
      var dir = e.target && e.target.dataset ? e.target.dataset.dir : null;
      if (!dir && e.target !== rect) return;
      e.preventDefault();
      drag = { mode: dir || 'move', sx: e.clientX, sy: e.clientY, start: { x: c.x, y: c.y, w: c.w, h: c.h } };
    }
    function onMove(e) {
      if (!drag) return;
      var b = stage.getBoundingClientRect();
      if (!b.width || !b.height) return;
      var dx = (e.clientX - drag.sx) / b.width;
      var dy = (e.clientY - drag.sy) / b.height;
      var s = drag.start;
      var x = s.x, y = s.y, w = s.w, h = s.h;
      if (drag.mode === 'move') {
        x = clamp(s.x + dx, 0, 1 - s.w);
        y = clamp(s.y + dy, 0, 1 - s.h);
      } else {
        if (drag.mode.indexOf('w') > -1) { var nx = clamp(s.x + dx, 0, s.x + s.w - MIN); w = s.w - (nx - s.x); x = nx; }
        if (drag.mode.indexOf('e') > -1) { w = clamp(s.w + dx, MIN, 1 - s.x); }
        if (drag.mode.indexOf('n') > -1) { var ny = clamp(s.y + dy, 0, s.y + s.h - MIN); h = s.h - (ny - s.y); y = ny; }
        if (drag.mode.indexOf('s') > -1) { h = clamp(s.h + dy, MIN, 1 - s.y); }
      }
      c = { x: x, y: y, w: w, h: h };
      layout();
    }
    function onUp() { drag = null; }
    stage.addEventListener('pointerdown', onDown);
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
    function unhook() {
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
    }

    function r3(v) { return Math.round(v * 1000) / 1000; }
    NL.modal({
      title: 'Crop photo',
      width: 'wide',
      body: outer,
      onClose: unhook,
      buttons: [
        { label: 'Reset crop', className: 'btn--ghost',
          onClick: function () { c = { x: 0, y: 0, w: 1, h: 1 }; layout(); } },
        { label: 'Cancel', className: 'btn--ghost', onClick: function (cm) { cm.close(); } },
        { label: 'Apply', className: 'btn--primary',
          onClick: function (cm) {
            var full = c.x < 0.005 && c.y < 0.005 && c.w > 0.995 && c.h > 0.995;
            art.crop = full ? null : { x: r3(c.x), y: r3(c.y), w: r3(c.w), h: r3(c.h) };
            queueSave('articles/' + id + '/crop', art.crop);
            cm.close();
            if (onApplied) onApplied();
          } }
      ]
    });
  }

  function addArticle() {
    var arts = sortedArticles();
    var order = arts.length ? (arts[arts.length - 1].order || 0) + 1 : 0;
    var art = { order: order, layout: 'text-only', style: 'plain', columns: 1, width: 'full', leading: 0, imagePos: 'above', headline: '', standfirst: '', body: '', imageId: null, imageCaption: '' };
    return NL.ensureAuth().then(function () {
      var ref = db.ref(ROOT + '/editions/' + S.ed.id + '/articles').push();
      return ref.set(art).then(function () {
        S.ed.articles[ref.key] = art;
        return ref.key;
      });
    });
  }

  function deleteArticle(id) {
    dropPending('articles/' + id);
    delete S.ed.articles[id];
    return NL.ensureAuth().then(function () {
      return db.ref(ROOT + '/editions/' + S.ed.id + '/articles/' + id).remove();
    });
  }

  function moveArticle(id, dir) {
    var arts = sortedArticles();
    var idx = -1;
    arts.forEach(function (a, i) { if (a._id === id) idx = i; });
    var swapIdx = idx + dir;
    if (idx < 0 || swapIdx < 0 || swapIdx >= arts.length) return;
    var a = arts[idx], b = arts[swapIdx];
    var tmp = a.order; a.order = b.order; b.order = tmp;
    queueSave('articles/' + a._id + '/order', a.order);
    queueSave('articles/' + b._id + '/order', b.order);
  }

  /* ══════════════════════════════════════════════════════════════════════
     renderDocument(edition) — the single render boundary (handover §3).
     Builds article blocks, measures them off-canvas, paginates greedily
     into fixed A4 sheets. The preview shows these sheets scaled; print
     shows a clone of the very same sheets unscaled. Nothing else in the
     tool knows how the document is produced.
     ══════════════════════════════════════════════════════════════════════ */
  function buildMasthead(meta) {
    if (CONFIG.mastheadStyle === 'band') {
      var band = el('div', 'nlx-mast nlx-mast--band');
      var bg = el('img', 'nlx-mast__bg');
      bg.src = BAND_BG;
      bg.alt = '';
      band.appendChild(bg);
      var rose = el('img', 'nlx-mast__rose--band');
      rose.src = CONFIG.roseWhiteUrl;
      rose.alt = '';
      rose.onerror = function () { this.onerror = null; this.style.display = 'none'; };
      band.appendChild(rose);
      var content = el('div', 'nlx-mast__bandcontent');
      content.appendChild(el('h1', 'nlx-mast__title', meta.title || CONFIG.defaultTitle));
      if (meta.subtitle) content.appendChild(el('div', 'nlx-mast__sub', meta.subtitle));
      band.appendChild(content);
      return band;
    }
    var m = el('div', 'nlx-mast');
    var r = el('img', 'nlx-mast__rose');
    r.src = CONFIG.roseUrl;
    r.alt = '';
    r.onerror = function () { this.onerror = null; this.style.display = 'none'; };
    m.appendChild(r);
    m.appendChild(el('div', 'nlx-mast__kicker', CONFIG.mastheadKicker));
    m.appendChild(el('h1', 'nlx-mast__title', meta.title || CONFIG.defaultTitle));
    if (meta.subtitle) m.appendChild(el('div', 'nlx-mast__sub', meta.subtitle));
    return m;
  }

  function buildArticleBlock(art) {
    var isHero = art.layout === 'hero';
    var cls = 'nlx-blk-art' + (isHero ? ' nlx-blk-art--hero' : '');
    /* Style keys are whitelisted — stored values can never inject classes */
    var styleOk = STYLES.some(function (s) { return s.key === art.style; });
    if (styleOk && art.style !== 'plain') cls += ' nlx-blk-art--' + art.style;
    if (art.columns === 2) cls += ' nlx-blk-art--cols2';
    var b = el('div', cls);
    b.setAttribute('data-art-id', art._id || '');

    /* Resolve the article image from the library cache — synchronous, so
       pagination measurement works before the image file has loaded. */
    var pos = IMAGE_LAYOUTS[art.layout] || art.imagePos || 'above';
    var rec = art.imageId && S.library ? S.library[art.imageId] : null;
    var fig = null;
    if (rec && rec.downloadUrl && rec.width && rec.height) {
      var c = (art.crop && art.crop.w > 0.05 && art.crop.h > 0.05)
        ? art.crop : { x: 0, y: 0, w: 1, h: 1 };
      var A = ((c.w * rec.width) / (c.h * rec.height)).toFixed(4);
      fig = el('div', 'nlx-blk-art__fig' + (pos !== 'above' ? ' nlx-blk-art__fig--' + pos : ''));
      var wrap = el('div', 'nlx-blk-art__imgwrap');
      wrap.style.aspectRatio = A;
      if (pos === 'above') {
        /* Always the full article width — height comes purely from the
           crop shape. The editor manages proportions by cropping. */
        wrap.style.width = '100%';
      } else {
        /* Side column: provisional width; solveSideFigs() sets the real
           width so the image height matches the text height */
        wrap.style.width = '35%';
      }
      var im = el('img', 'nlx-blk-art__img');
      im.src = rec.downloadUrl;
      im.alt = '';
      im.onerror = function () { this.onerror = null; this.style.display = 'none'; };
      im.style.width = (100 / c.w).toFixed(3) + '%';
      im.style.left = (-100 * c.x / c.w).toFixed(3) + '%';
      im.style.top = (-100 * c.y / c.h).toFixed(3) + '%';
      wrap.appendChild(im);
      fig.appendChild(wrap);
      if ((art.imageCaption || '').trim()) fig.appendChild(el('div', 'nlx-blk-art__cap', art.imageCaption));
    }

    if (fig && pos === 'above') b.appendChild(fig);
    /* Headline is optional — with none, the body copy reclaims the space */
    if ((art.headline || '').trim()) {
      b.appendChild(el('h2', 'nlx-blk-art__head', art.headline));
      if (isHero) b.appendChild(el('div', 'nlx-blk-art__rule'));
    }
    if ((art.standfirst || '').trim()) b.appendChild(el('p', 'nlx-blk-art__stand', art.standfirst));
    var body = el('div', 'nlx-blk-art__body');
    body.innerHTML = sanitiseHtml(art.body);   /* stored sanitised; sanitise again on render */
    if (typeof art.leading === 'number' && art.leading) {
      var lead = Math.max(-0.4, Math.min(0.6, art.leading));
      body.style.lineHeight = (1.5 + lead).toFixed(2);
    }
    if (fig && pos !== 'above') {
      var cols = el('div', 'nlx-blk-art__cols' + (pos === 'right' ? ' nlx-blk-art__cols--right' : ''));
      cols.setAttribute('data-nlx-sidefig', '1');
      cols.setAttribute('data-aspect', A);
      cols.appendChild(fig);
      cols.appendChild(body);
      b.appendChild(cols);
    } else {
      b.appendChild(body);
    }
    return b;
  }

  /* Size side-image columns so the image runs the full height of the
     article text. Circular on paper (image width ↔ text width ↔ text
     height ↔ image height), so solved by short fixed-point iteration in
     the measuring container; the result is written inline before
     pagination measures, so preview and print see identical sizes. */
  function solveSideFigs(scope) {
    var colsList = scope.querySelectorAll('[data-nlx-sidefig]');
    Array.prototype.forEach.call(colsList, function (cols) {
      var A = parseFloat(cols.getAttribute('data-aspect')) || 1;
      var wrap = cols.querySelector('.nlx-blk-art__imgwrap');
      var bodyEl = cols.querySelector('.nlx-blk-art__body');
      if (!wrap || !bodyEl) return;
      var W = cols.clientWidth;
      if (!W) return;
      var w = 0.35 * W;
      for (var k = 0; k < 3; k++) {
        wrap.style.width = w + 'px';
        var hTxt = bodyEl.getBoundingClientRect().height;
        var target = Math.max(0.15 * W, Math.min(0.6 * W, hTxt * A));
        w = (w + target) / 2;
      }
      wrap.style.width = Math.round(w) + 'px';
    });
  }

  function renderDocument(edition) {
    var mm = pxPerMM();
    var P = CONFIG.page;
    var contentH = (P.hMM - P.topMM - P.bottomMM) * mm;
    var gap = P.gapMM * mm;

    /* Build + measure pagination units off-canvas. A unit is the masthead,
       a full-width article, or a flex ROW of fractional-width articles
       (greedy packing by width, in order — order + width is placement). */
    var measure = document.getElementById('nlxMeasure');
    measure.innerHTML = '';

    /* Band masthead lives at SHEET level (absolute, full-bleed) — inside
       the clipped content inner its edges were cut off. Measure it in a
       full-width (210mm) off-canvas box; page 1's content starts below it.
       The 'rule' masthead stays in-flow as an ordinary unit. */
    var isBand = CONFIG.mastheadStyle === 'band';
    var bandNode = null, bandHmm = 0;
    if (isBand) {
      bandNode = buildMasthead(edition.meta);
      var bandBox = el('div');
      bandBox.style.cssText = 'position:absolute;left:-10000px;top:0;width:210mm;';
      bandBox.appendChild(bandNode);
      document.body.appendChild(bandBox);
      bandHmm = bandNode.getBoundingClientRect().height / mm;
      document.body.removeChild(bandBox);
    }

    var units = [];
    if (!isBand) units.push({ node: buildMasthead(edition.meta), arts: [] });
    var arts = [];
    Object.keys(edition.articles || {}).forEach(function (id) {
      var a = edition.articles[id]; a._id = id; arts.push(a);
    });
    arts.sort(function (a, b) { return (a.order || 0) - (b.order || 0); });

    /* Build every article node, then PRE-MEASURE the fractional ones at
       their target width so same-width runs can pack masonry-style: each
       next article drops into the currently shortest column, so a third
       half-width article slots under the shorter of the first two. */
    var nodes = {}, preH = {};
    arts.forEach(function (a) { nodes[a._id] = buildArticleBlock(a); });
    var pre = el('div');
    arts.forEach(function (a) {
      if (widthFrac(a.width) >= 1) return;
      var w = el('div', 'nlx-w-' + (WIDTHS.some(function (x) { return x.key === a.width; }) ? a.width : 'half'));
      w.appendChild(nodes[a._id]);
      pre.appendChild(w);
    });
    measure.appendChild(pre);
    solveSideFigs(pre);
    arts.forEach(function (a) {
      if (widthFrac(a.width) < 1) preH[a._id] = nodes[a._id].getBoundingClientRect().height;
    });
    measure.removeChild(pre);
    arts.forEach(function (a) {
      var n = nodes[a._id];
      if (n.parentNode) n.parentNode.removeChild(n);
    });

    /* Column-TRACK packing (generalises the same-width masonry): a run of
       fractional articles opens tracks across the page in order (e.g. a
       third track then a two-thirds track); once the page width is spoken
       for, each next article drops into the shortest existing track of
       ITS width. So a second two-thirds article slots beneath the first
       one rather than starting a new band under a taller neighbour. */
    var idx = 0, tracks = null, trackRow = null, trackSum = 0, trackUnit = null;
    function closeTracks() { tracks = null; trackRow = null; trackSum = 0; trackUnit = null; }
    while (idx < arts.length) {
      var a = arts[idx];
      var frac = widthFrac(a.width);
      var node = nodes[a._id];
      if (frac >= 1) {
        closeTracks();
        units.push({ node: node, arts: [a] });
        idx++;
        continue;
      }
      var placed = false;
      if (tracks) {
        var best = null;
        tracks.forEach(function (t) {
          if (t.key === a.width && (!best || t.h < best.h - 0.5)) best = t;
        });
        /* While there is still room across the page, prefer opening a new
           track — natural "fill across first, then stack" reading order */
        if (trackSum + frac <= 1.001) best = null;
        if (best) {
          best.el.appendChild(node);
          best.h += (preH[a._id] || 0) + 5 * mm;
          trackUnit.arts.push(a);
          placed = true;
        } else if (trackSum + frac > 1.001) {
          closeTracks();
        }
      }
      if (!placed) {
        if (!tracks) {
          trackRow = el('div', 'nlx-row');
          trackUnit = { node: trackRow, arts: [] };
          units.push(trackUnit);
          tracks = [];
          trackSum = 0;
        }
        var colEl = el('div', 'nlx-rowcol nlx-w-' +
          (WIDTHS.some(function (w) { return w.key === a.width; }) ? a.width : 'half'));
        trackRow.appendChild(colEl);
        colEl.appendChild(node);
        tracks.push({ key: a.width, el: colEl, h: (preH[a._id] || 0) + 5 * mm });
        trackSum += frac;
        trackUnit.arts.push(a);
      }
      idx++;
    }

    units.forEach(function (u) { measure.appendChild(u.node); });
    solveSideFigs(measure);
    var heights = units.map(function (u) { return u.node.getBoundingClientRect().height; });
    /* AREA per unit, not just height: a page-tall half-width article fills
       the page's height but only half its usable space — the fill gauge
       must report the honest figure. Rows sum each member's width-fraction
       × height; full-width units are height × 1. Measured here while the
       nodes are still attached (sheets are built detached). */
    var areas = units.map(function (u, i) {
      if (u.node.classList && u.node.classList.contains('nlx-row')) {
        var rowW = u.node.getBoundingClientRect().width || 1;
        var sum = 0;
        Array.prototype.forEach.call(u.node.children, function (ch) {
          var r = ch.getBoundingClientRect();
          sum += r.height * (r.width / rowW);
        });
        return sum;
      }
      return heights[i];
    });

    /* Greedy pagination */
    var sheets = [];
    var used = 0;
    var current = null;
    var overflowArticles = [];
    var movedOffFirst = null;

    var cap = 0;                 /* capacity of the current sheet */
    var fullCap = contentH;      /* capacity of a bannerless sheet */
    function newSheet() {
      var s = el('div', 'nlx-sheet');
      var topMM = P.topMM;
      if (!sheets.length && isBand && bandNode) {
        s.appendChild(bandNode);           /* page-level, above the inner */
        topMM = bandHmm + 5;
      }
      var inner = el('div', 'nlx-sheet__inner');
      if (topMM !== P.topMM) inner.style.top = topMM + 'mm';
      s.appendChild(inner);
      /* Footer replicates the masthead: title – subtitle */
      var foot = el('div', 'nlx-sheet__foot',
        (edition.meta.title || CONFIG.defaultTitle) +
        (edition.meta.subtitle ? ' – ' + edition.meta.subtitle : ''));
      s.appendChild(foot);
      sheets.push(s);
      current = inner;
      used = 0;
      areaUsed = 0;
      cap = (P.hMM - topMM - P.bottomMM) * mm;
      return s;
    }
    var areaUsed = 0;
    newSheet();

    units.forEach(function (u, i) {
      var h = heights[i];
      var need = used > 0 ? h + gap : h;
      if (used > 0 && used + need > cap) {
        newSheet();
        need = h;
      }
      if (used === 0 && need > cap && need <= fullCap) {
        /* Doesn't fit the shorter banner page but fits a full one. Record
           it — leaving page 1 with only the banner looks broken unless the
           gauge explains why. */
        if (sheets.length === 1 && !movedOffFirst && u.arts.length) {
          movedOffFirst = u.arts[0].headline || 'Untitled article';
        }
        newSheet();
      }
      if (need > fullCap && u.arts.length) {
        /* A unit taller than a whole page: place alone, flag loudly.
           Never let break-inside logic produce a silent blank page. */
        if (used > 0) newSheet();
        u.arts.forEach(function (a) { overflowArticles.push(a.headline || 'Untitled article'); });
        sheets[sheets.length - 1].classList.add('nlx-sheet--overflow');
      }
      if (used > 0) u.node.style.marginTop = CONFIG.page.gapMM + 'mm';
      current.appendChild(u.node);
      areaUsed += areas[i] + (used > 0 ? gap : 0);
      used += need;
    });

    measure.innerHTML = '';
    return {
      sheets: sheets,
      pages: sheets.length,
      lastPageFill: Math.min(1, areaUsed / cap),
      overflowArticles: overflowArticles,
      movedOffFirst: movedOffFirst
    };
  }

  /* ── Preview + gauge ──────────────────────────────────────────────────── */
  var _previewTimer = null;
  function schedulePreview() {
    clearTimeout(_previewTimer);
    _previewTimer = setTimeout(refreshPreview, 300);
  }
  var _lastDoc = null;

  function refreshPreview() {
    if (!S.ed) return;
    var scale = document.getElementById('nlxDocScale');
    if (!scale) return;
    _lastDoc = renderDocument(S.ed);
    scale.innerHTML = '';
    _lastDoc.sheets.forEach(function (s) { scale.appendChild(s); });
    applyPreviewScale();
    updateGauge(_lastDoc);
  }

  function applyPreviewScale() {
    var frame = document.getElementById('nlxPreviewFrame');
    var scale = document.getElementById('nlxDocScale');
    if (!frame || !scale || !_lastDoc) return;
    var mm = pxPerMM();
    var cs = getComputedStyle(frame);
    var padX = parseFloat(cs.paddingLeft || '0') + parseFloat(cs.paddingRight || '0');
    var padY = parseFloat(cs.paddingTop || '0') + parseFloat(cs.paddingBottom || '0');
    var sheetW = CONFIG.page.wMM * mm;
    var avail = frame.clientWidth - padX;
    if (avail <= 0) return;
    var s = Math.min(1, avail / sheetW);
    scale.style.transform = 'scale(' + s + ')';
    var fullH = scale.scrollHeight;
    frame.style.height = Math.ceil(fullH * s + padY) + 'px';
  }
  /* Desktop app layout — the shell fills the viewport below the bar so the
     editor and preview scroll independently and the page itself does not */
  function sizeShell() {
    var shell = document.getElementById('nlxShell');
    if (!shell) return;
    if (window.innerWidth <= 1100) { shell.style.removeProperty('--nlx-shell-h'); return; }
    var top = shell.getBoundingClientRect().top + (window.scrollY || 0);
    shell.style.setProperty('--nlx-shell-h', Math.max(320, window.innerHeight - top - 12) + 'px');
  }
  window.addEventListener('resize', function () { sizeShell(); applyPreviewScale(); });
  /* Re-measure once the real Carbona Slanted cuts arrive — pagination
     measured against a fallback face would otherwise be slightly off */
  if (document.fonts && document.fonts.addEventListener) {
    document.fonts.addEventListener('loadingdone', function () { schedulePreview(); });
  }
  /* Enter = paragraph / Shift+Enter = line break is handled inside
     NL.richText (defaultParagraphSeparator 'p'). */

  function updateGauge(doc) {
    var g = document.getElementById('nlxGauge');
    if (!g) return;
    var limit = CONFIG.pageLimit || 0;
    var over = (limit && doc.pages > limit) || doc.overflowArticles.length > 0 || !!doc.movedOffFirst;
    g.className = 'nlx-gauge' + (over ? ' nlx-gauge--warn' : '');
    var pagesWrap = g.querySelector('.nlx-gauge__pages');
    pagesWrap.innerHTML = '';
    var slots = Math.max(limit || 1, doc.pages);
    for (var i = 0; i < slots; i++) {
      var pg = el('div', 'nlx-gauge__page' + (limit && i >= limit ? ' nlx-gauge__page--over' : ''));
      var fill = el('div', 'nlx-gauge__page-fill');
      var pct = i < doc.pages - 1 ? 100 : (i === doc.pages - 1 ? Math.round(doc.lastPageFill * 100) : 0);
      fill.style.height = pct + '%';
      pg.appendChild(fill);
      pagesWrap.appendChild(pg);
    }
    var headline = g.querySelector('.nlx-gauge__headline');
    var detail = g.querySelector('.nlx-gauge__detail');
    if (doc.overflowArticles.length) {
      headline.textContent = 'An article is too long for a single page';
      detail.textContent = '“' + doc.overflowArticles.join('”, “') +
        '” will be cut off in the PDF – shorten it before exporting.';
    } else if (doc.movedOffFirst) {
      headline.textContent = 'Page 1 is empty below the banner';
      detail.textContent = '“' + doc.movedOffFirst +
        '” is too tall to fit beneath the banner, so it has moved to page 2. ' +
        'Shorten it, or put a shorter article first.';
    } else if (limit && doc.pages > limit) {
      headline.textContent = doc.pages + ' pages – past the ' + limit + '-page target';
      detail.textContent = 'About ' + Math.round(doc.lastPageFill * 100) +
        '% of a page over. Trim until page ' + (limit + 1) + ' disappears.';
    } else {
      headline.textContent = doc.pages + ' page' + (doc.pages === 1 ? '' : 's');
      detail.textContent = 'Page ' + doc.pages + ' is ' + Math.round(doc.lastPageFill * 100) + '% full.';
    }
    /* Compact bar: full detail lives in the warning strip (warn states
       only) and as a hover title the rest of the time */
    g.title = detail.textContent;
    var strip = document.getElementById('nlxWarnStrip');
    if (strip) {
      strip.textContent = detail.textContent;
      strip.style.display = over ? 'block' : 'none';
    }
    sizeShell();
  }

  /* ── Export (Path A — browser print) ──────────────────────────────────── */
  var PREFLIGHT_KEY = 'nl-newsletter-preflight-seen';

  function preflightHtml() {
    return '' +
      '<p class="confirm-text">The PDF is produced through your browser’s print dialog. ' +
      'Check these three settings the first time – they are remembered afterwards:</p>' +
      '<ul style="margin:10px 0 0;padding-left:20px;font-size:var(--text-sm);line-height:1.7;">' +
      '<li><strong>Destination</strong> – “Save as PDF”</li>' +
      '<li><strong>Paper size</strong> – A4, <strong>Margins</strong> – None (or Default)</li>' +
      '<li><strong>Options → Background graphics</strong> – ticked on. Chrome leaves this ' +
      'off by default and solid colours print white without it.</li>' +
      '</ul>';
  }

  function showPreflight(thenPrint) {
    NL.modal({
      title: 'Before you export',
      body: preflightHtml(),
      buttons: [
        { label: 'Cancel', className: 'btn--ghost', onClick: function (c) { c.close(); } },
        { label: 'Open print dialog', className: 'btn--primary', autofocus: true,
          onClick: function (c) {
            try { localStorage.setItem(PREFLIGHT_KEY, '1'); } catch (e) {}
            c.close();
            if (thenPrint) setTimeout(doPrint, 150);
          } }
      ]
    });
  }

  function populatePrintRoot() {
    if (!S.ed) return;
    if (!_lastDoc) _lastDoc = renderDocument(S.ed);
    var root = document.getElementById('nlxPrintRoot');
    root.innerHTML = '';
    _lastDoc.sheets.forEach(function (s) { root.appendChild(s.cloneNode(true)); });
  }
  var PAGE_TITLE = document.title;
  function exportDocTitle() {
    if (!S.ed) return PAGE_TITLE;
    return (S.ed.meta.title || CONFIG.defaultTitle) +
      (S.ed.meta.subtitle ? ' – ' + S.ed.meta.subtitle : '');
  }
  function doPrint() {
    populatePrintRoot();
    /* Chrome names Save-as-PDF files after document.title — use the
       edition's own title/subtitle, restored on afterprint */
    document.title = exportDocTitle();
    NL.writeAudit('newsletter_export', 'Exported "' + exportDocTitle() + '"');
    window.print();
  }
  function exportPdf() {
    if (_lastDoc && _lastDoc.overflowArticles.length) {
      NL.confirm('An article is too long for a single page and will be cut off. Export anyway?',
        { title: 'Content will be cut off', confirmText: 'Export anyway', variant: 'danger' })
        .then(function (ok) { if (ok) startExport(); });
    } else if (_lastDoc && CONFIG.pageLimit && _lastDoc.pages > CONFIG.pageLimit) {
      NL.confirm('The newsletter is currently over its ' + CONFIG.pageLimit +
        '-page target. Export anyway?', { title: 'Over length', confirmText: 'Export anyway', variant: 'danger' })
        .then(function (ok) { if (ok) startExport(); });
    } else {
      startExport();
    }
  }
