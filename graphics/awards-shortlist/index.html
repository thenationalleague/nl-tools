<!DOCTYPE html>
<!--
  NL Tools — Monthly Awards Shortlist (Graphics sub-tool)
  Version: v1.0 (05/11/2026)
  File: /graphics/awards-shortlist/index.html

  One graphic with all four nominees, 1080 × 1350: NOMINATED headline,
  award and month, then a 2 × 2 grid of photo windows, each with the
  player's name and club, and the division lockup at the foot. No cut-out
  and no fades: each photo fills its window, dragged and zoomed to frame.
  The single-player card with the cut-out is /graphics/monthly-awards/.

  Storage: none. Access: toolKey 'staff-graphics', the Graphics gate.
  Assets (same-origin, so the canvas can export them):
    /assets/divisions/{National,North,South}.png   (official Enterprise lockups)
    /assets/crests/…                               (via NL.clubPicker)
    /graphics/_shared/fonts/Carbona-*.otf          (local cuts for the canvas)

  CHANGELOG
    v1.0 (05/11/2026) — First build.
-->
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monthly Awards Shortlist — NL Tools</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/favicon-16x16.png">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">

  <!-- Brand stylesheet (lint canonical: ?v=73) -->
  <link rel="stylesheet" href="/system/nl-brand.css?v=74">

  <!-- Firebase 10.12.0 SDK (compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

  <!-- Firebase init -->
  <script>
    firebase.initializeApp({
      apiKey:            "AIzaSyC3az3OMnU7TdqlaWp8yrO_EjgZ36l-mXU",
      authDomain:        "nl-tools.firebaseapp.com",
      databaseURL:       "https://nl-tools-default-rtdb.europe-west1.firebasedatabase.app",
      projectId:         "nl-tools",
      storageBucket:     "nl-tools.firebasestorage.app",
      messagingSenderId: "801354670005",
      appId:             "1:801354670005:web:05d8ebad3e7e63610d03fc"
    });
    var db = firebase.database();
  </script>

  <!-- Tool identity + changelog. Keep window.NL_TOOL and var NL_TOOL_KEY
       in sync — auth-guard reads NL_TOOL_KEY, nl-topbar reads window.NL_TOOL. -->
  <script>
    window.NL_TOOL = {
      title: 'Monthly Awards Shortlist',
      toolKey: 'staff-graphics'
    };
    var NL_TOOL_KEY = 'staff-graphics';

    window.NL_CHANGELOG = [
      {
        date: '05/11/2026',
        version: 'v1.0',
        items: [
          'First build: all four nominees in one graphic, each in their own photo window.'
        ]
      }
    ];

    window.nlAuthReady = function (userData) {
      window.NL = window.NL || {};
      window.NL.session = userData;
      if (window.TOOL && window.TOOL.boot) {
        window.TOOL.boot(userData);
      } else {
        window._toolDeferredSession = userData;
      }
    };
  </script>

  <!-- NL system scripts (lint canonical: ?v=49 / ?v=1 / ?v=10 / ?v=17) -->
  <script src="/system/nl-utils.js?v=60"></script>
  <!-- GA4, one property for all of nl.tools. Cookieless, so no consent
       banner on any page; page views by path, no identity. Tool events go
       through NL.track(). See system/nl-analytics.js. -->
  <script src="/system/nl-analytics.js?v=1"></script>
  <script src="/system/nl-topbar.js?v=14"></script>
  <script src="/system/auth-guard.js?v=21"></script>

<style>
  /* The canvas needs the LOCAL Carbona cuts, not the portal's variable font:
     a canvas drawn before a font resolves falls back to sans-serif without
     saying so. Registered under names nothing else uses. */
  @font-face { font-family: 'MASCarbonaRegular';   src: url('/graphics/_shared/fonts/Carbona-Regular.otf') format('opentype'); }
  @font-face { font-family: 'MASCarbonaBold';      src: url('/graphics/_shared/fonts/Carbona-Bold.otf') format('opentype'); }
  @font-face { font-family: 'MASCarbonaExtraBold'; src: url('/graphics/_shared/fonts/Carbona-ExtraBold.otf') format('opentype'); }

  .mas-layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
  .mas-panel { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 16px; }
  .mas-field { margin-bottom: 12px; }
  .mas-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .mas-grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .mas-nom { border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; }
  .mas-nom h2 {
    margin: 0 0 10px; font-size: var(--text-xs); font-weight: 800; font-variation-settings: 'wght' 800;
    letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-muted);
  }
  .mas-nom .mas-field { margin-bottom: 8px; }
  .mas-ctl { display: grid; grid-template-columns: 44px 1fr; align-items: center; gap: 8px; font-size: var(--text-sm); }
  .mas-ctl input { width: 100%; accent-color: var(--navy); }
  .mas-full { width: 100%; justify-content: center; }
  .mas-hint { margin: 8px 0 12px; }
  .mas-panel input[type="color"] { width: 44px; height: 34px; padding: 2px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--white); }
  .hidden { display: none !important; }
  .mas-pane {
    display: flex; flex-direction: column; min-width: 0;
    background: var(--white); border: 1px solid var(--border); border-radius: var(--radius-lg);
    height: max(420px, calc(100vh - 150px)); position: sticky; top: 16px; overflow: hidden;
  }
  #prevWrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 14px; min-height: 0; background: var(--off-white); }
  #preview { max-width: 100%; max-height: 100%; aspect-ratio: 1080 / 1350; box-shadow: var(--shadow); cursor: grab; touch-action: none; }
  #preview.dragging { cursor: grabbing; }

  /* Phones and narrow windows: the graphic pins under the topbar and only
     the controls scroll, so a swipe never lands on the canvas by accident. */
  @media (max-width: 1100px) {
    .mas-layout { display: flex; flex-direction: column; align-items: stretch; gap: 12px; }
    .mas-pane { order: -1; top: var(--mas-top, 79px); z-index: 5; height: 42dvh; }
    #prevWrap { padding: 8px; }
    .mas-panel { padding: 12px; }
  }
  @media (max-width: 560px) { .mas-grid2 { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<div id="nlTopbar"></div>

<div id="pageWrap">
  <div class="page">
  <div class="mas-layout">
    <aside class="mas-panel">
      <div class="mas-grid2" id="noms"></div>
      <p class="form-hint mas-hint">Drag a photo on the graphic to frame it.</p>

      <div class="mas-grid2">
        <div class="form-group mas-field"><label for="tHead">Headline</label><input type="text" id="tHead" value="NOMINATED"></div>
        <div class="form-group mas-field"><label for="tMonth">Month</label><input type="text" id="tMonth" value=""></div>
        <div class="form-group mas-field"><label for="tKicker">Award</label><input type="text" id="tKicker" value="PLAYER OF THE MONTH"></div>
        <div class="form-group mas-field"><label>Division</label><div class="mas-row"><div id="divPick"></div><input type="color" id="accent" value="#fff700" aria-label="Accent colour"></div></div>
      </div>
      <button type="button" class="btn btn--primary mas-full" id="btnExport">Download PNG</button>
    </aside>

    <div class="mas-pane">
      <div id="prevWrap"><canvas id="preview" width="1080" height="1350" aria-label="Finished graphic preview"></canvas></div>
    </div>
  </div>
  </div>
</div>

<script type="module">
const ROSE_URL = '/assets/crests/National%20League%20rose%20white.png';
const LOCKUP_URL = (d) => '/assets/divisions/' + d + '.png';
const W = 1080, H = 1350, N = 4;
const CUT = { 400: 'MASCarbonaRegular', 700: 'MASCarbonaBold', 800: 'MASCarbonaExtraBold' };
/* Brand colours for the canvas, read from nl-brand.css so they track the canon. */
const C = (() => {
  const cs = getComputedStyle(document.documentElement), t = (n) => cs.getPropertyValue(n).trim();
  return { primary: t('--primary'), navy: t('--navy'), navy200: t('--navy-200'), navy400: t('--navy-400'), navy700: t('--navy-700'), navy800: t('--navy-800'), navy900: t('--navy-900') };
})();
const $ = (id) => document.getElementById(id);
const S = { div: 'National', lockups: {}, rose: null, noms: [] };
for (let i = 0; i < N; i++) S.noms.push({ img: null, zoom: 1, ox: 0, oy: 0, crest: null, club: '' });

function loadImg(src, cors) {
  return new Promise((res, rej) => {
    const im = new Image(); if (cors) im.crossOrigin = 'anonymous';
    im.onload = () => res(im); im.onerror = () => rej(new Error('Image failed: ' + src)); im.src = src;
  });
}
function slug(s) { return (s || 'graphic').trim().replace(/[^A-Za-z0-9]+/g, '_').replace(/^_|_$/g, ''); }
function lum(hex) {
  const n = parseInt(hex.slice(1), 16), f = (v) => (v /= 255) <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
  return 0.2126 * f(n >> 16) + 0.7152 * f((n >> 8) & 255) + 0.0722 * f(n & 255);
}
function setFont(c, weight, size) { c.font = `${size}px "${CUT[weight >= 800 ? 800 : weight >= 600 ? 700 : 400]}", sans-serif`; }
function spaced(c, em, size) { if ('letterSpacing' in c) c.letterSpacing = `${em * size}px`; }
function fitSize(c, text, weight, max, width, em) { setFont(c, weight, max); spaced(c, em || 0, max); const w = c.measureText(text).width; return w > width ? Math.floor(max * width / w) : max; }
function rr(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
function drawContain(c, im, x, y, w, h) { const k = Math.min(w / im.width, h / im.height), dw = im.width * k, dh = im.height * k; c.drawImage(im, x + (w - dw) / 2, y + (h - dh) / 2, dw, dh); }

/* ---------------- nominee controls ---------------- */
const nomsEl = $('noms');
for (let i = 0; i < N; i++) {
  const d = document.createElement('div'); d.className = 'mas-nom';
  d.innerHTML = `<h2>Nominee ${i + 1}</h2>
    <label class="btn btn--ghost btn--sm mas-full" for="photo${i}">Choose photo</label>
    <input type="file" id="photo${i}" accept="image/*" class="hidden">
    <div class="form-group mas-field" style="margin-top:8px"><label for="name${i}">Name</label><input type="text" id="name${i}"></div>
    <div class="form-group mas-field"><label>Club</label><div id="club${i}"></div></div>
    <div class="mas-ctl"><span>Zoom</span><input type="range" id="zoom${i}" min="100" max="300" value="100"></div>`;
  nomsEl.appendChild(d);
  $('photo' + i).addEventListener('change', async (e) => {
    const f = e.target.files[0]; if (!f) return;
    const n = S.noms[i]; n.img = await loadImg(URL.createObjectURL(f), false); n.zoom = 1; n.ox = 0; n.oy = 0; $('zoom' + i).value = 100;
    e.target.previousElementSibling.textContent = 'Change photo'; render();
  });
  $('name' + i).addEventListener('input', render);
  $('zoom' + i).addEventListener('input', (e) => { S.noms[i].zoom = e.target.value / 100; render(); });
}

/* ---------------- layout ---------------- */
function layout() {
  const c = pv.getContext('2d');
  const head = ($('tHead').value.trim() || 'NOMINATED').toUpperCase();
  const hs = Math.min(170, fitSize(c, head, 800, 170, W - 128, -0.015));
  const base = 64 + Math.round(hs * 0.74);
  const award = $('tKicker').value.trim().toUpperCase(), month = $('tMonth').value.trim().toUpperCase();
  let ss = 28, aw = 0, mw = 0;
  for (;;) {
    setFont(c, 800, ss); spaced(c, 0.12, ss); aw = award ? c.measureText(award).width + 36 : 0;
    setFont(c, 700, ss); spaced(c, 0.12, ss); mw = month ? c.measureText(month).width : 0;
    if (aw + 22 + mw <= W - 128 || ss <= 18) break; ss--;
  }
  const pillTop = base + 24, pillH = Math.round(ss * 1.75);
  const gx = 64, gw = W - 128, gap = 16, top = pillTop + pillH + 36, foot = 150;
  const gh = H - foot - top, cw = (gw - gap) / 2, ch = (gh - gap) / 2;
  const cells = [];
  for (let r = 0; r < 2; r++) for (let k = 0; k < 2; k++) cells.push({ x: gx + k * (cw + gap), y: top + r * (ch + gap), w: cw, h: ch - 84 });
  return { head, hs, base, award, month, ss, aw, mw, pillTop, pillH, cells, cw, ch };
}
/* Cover-fit, then zoom, then the dragged offset, clamped so the window never shows a gap. */
function photoRect(n, cell) {
  const k = Math.max(cell.w / n.img.width, cell.h / n.img.height) * n.zoom;
  const dw = n.img.width * k, dh = n.img.height * k;
  const mx = (dw - cell.w) / 2, my = (dh - cell.h) / 2;
  n.ox = Math.max(-mx, Math.min(mx, n.ox)); n.oy = Math.max(-my, Math.min(my, n.oy));
  return { x: cell.x + (cell.w - dw) / 2 + n.ox, y: cell.y + (cell.h - dh) / 2 + n.oy, w: dw, h: dh };
}

function render() {
  const c = pv.getContext('2d'), L = layout(), accent = $('accent').value;
  c.save(); c.clearRect(0, 0, W, H);
  c.fillStyle = C.navy800; c.fillRect(0, 0, W, H);
  c.fillStyle = C.primary; c.fillRect(0, 0, W, 22); c.fillRect(0, H - 22, W, 22);

  c.textAlign = 'left'; c.textBaseline = 'alphabetic'; c.fillStyle = '#fff';
  setFont(c, 800, L.hs); spaced(c, -0.015, L.hs); c.fillText(L.head, 64, L.base);
  c.textBaseline = 'middle';
  if (L.award) {
    setFont(c, 800, L.ss); spaced(c, 0.12, L.ss);
    c.fillStyle = accent; rr(c, 64, L.pillTop, L.aw, L.pillH, 4); c.fill();
    c.fillStyle = lum(accent) > 0.35 ? '#000' : '#fff'; c.fillText(L.award, 82, L.pillTop + L.pillH / 2 + 1);
  }
  if (L.month) {
    setFont(c, 700, L.ss); spaced(c, 0.12, L.ss); c.fillStyle = '#fff';
    c.fillText(L.month, 64 + L.aw + (L.award ? 22 : 0), L.pillTop + L.pillH / 2 + 1);
  }

  L.cells.forEach((cell, i) => {
    const n = S.noms[i];
    c.save(); rr(c, cell.x, cell.y, cell.w, cell.h + 84, 8); c.clip();
    c.fillStyle = C.navy900; c.fillRect(cell.x, cell.y, cell.w, cell.h);
    if (n.img) { const p = photoRect(n, cell); c.imageSmoothingQuality = 'high'; c.drawImage(n.img, p.x, p.y, p.w, p.h); }
    else { setFont(c, 700, 22); spaced(c, 0.04, 22); c.fillStyle = C.navy400; c.textAlign = 'center'; c.fillText('Photo ' + (i + 1), cell.x + cell.w / 2, cell.y + cell.h / 2); }
    // name strip: solid, no fade
    const sy = cell.y + cell.h; c.fillStyle = C.navy; c.fillRect(cell.x, sy, cell.w, 84);
    c.fillStyle = accent; c.fillRect(cell.x, sy, cell.w, 5);
    const name = $('name' + i).value.trim(), hasCrest = !!n.crest, tx = cell.x + (hasCrest ? 80 : 18), tw = cell.x + cell.w - 16 - tx;
    if (hasCrest) drawContain(c, n.crest, cell.x + 16, sy + 16, 52, 52);
    c.textAlign = 'left'; c.fillStyle = '#fff';
    if (name) { const ns = fitSize(c, name, 800, 32, tw, -0.01); setFont(c, 800, ns); spaced(c, -0.01, ns); c.fillText(name, tx, sy + (n.club ? 34 : 45)); }
    if (n.club) { const cs = fitSize(c, n.club, 400, 21, tw, 0); setFont(c, 400, cs); spaced(c, 0, cs); c.fillStyle = C.navy200; c.fillText(n.club, tx, sy + 62); }
    c.restore();
  });

  const lock = S.lockups[S.div], fy = H - 22 - 64;
  if (lock) { const lh = 100, lw = Math.min(300, lock.width * lh / lock.height); drawContain(c, lock, W - 64 - lw, fy - lh / 2, lw, lh); }
  else if (S.rose) drawContain(c, S.rose, W - 64 - 72, fy - 36, 72, 72);
  c.restore();
}

/* Drag on the graphic frames the photo in the window under the pointer. */
const pv = $('preview'); let drag = null;
function cellAt(e) {
  const r = pv.getBoundingClientRect(), k = W / r.width, x = (e.clientX - r.left) * k, y = (e.clientY - r.top) * k;
  return { i: layout().cells.findIndex((c) => x >= c.x && x <= c.x + c.w && y >= c.y && y <= c.y + c.h), k };
}
pv.addEventListener('pointerdown', (e) => {
  const { i, k } = cellAt(e); if (i < 0 || !S.noms[i].img) return;
  drag = { i, k, x: e.clientX, y: e.clientY, ox: S.noms[i].ox, oy: S.noms[i].oy };
  pv.classList.add('dragging'); pv.setPointerCapture(e.pointerId);
});
pv.addEventListener('pointermove', (e) => {
  if (!drag) return; const n = S.noms[drag.i];
  n.ox = drag.ox + (e.clientX - drag.x) * drag.k; n.oy = drag.oy + (e.clientY - drag.y) * drag.k; render();
});
const end = () => { drag = null; pv.classList.remove('dragging'); };
pv.addEventListener('pointerup', end); pv.addEventListener('pointercancel', end);
pv.addEventListener('wheel', (e) => {
  const { i } = cellAt(e); if (i < 0 || !S.noms[i].img) return; e.preventDefault();
  const n = S.noms[i]; n.zoom = Math.max(1, Math.min(3, n.zoom * (e.deltaY < 0 ? 1.06 : 1 / 1.06))); $('zoom' + i).value = Math.round(n.zoom * 100); render();
}, { passive: false });

['tHead', 'tKicker', 'tMonth', 'accent'].forEach((id) => $(id).addEventListener('input', render));
const tb = $('nlTopbar');
new ResizeObserver(() => document.documentElement.style.setProperty('--mas-top', tb.offsetHeight + 'px')).observe(tb);
$('btnExport').addEventListener('click', () => {
  render();
  pv.toBlob((b) => { if (b) NL.download(`${slug($('tKicker').value)}_${slug($('tMonth').value)}_shortlist_${S.div}.png`, b, 'image/png'); else NL.toast('The PNG couldn\u2019t be made. Try again.', 'error'); }, 'image/png');
});

/* Club chosen: crest and name follow it; the first club sets the division. */
async function setClub(i, sel) {
  const n = S.noms[i];
  if (!sel || !sel.name) { n.crest = null; n.club = ''; render(); return; }
  n.club = sel.name;
  const div = sel.division || (sel.club && sel.club.division);
  if (i === 0 && ['National', 'North', 'South'].includes(div)) { S.div = div; divPick.set(div); }
  try { n.crest = await loadImg(sel.crestUrl, true); } catch { n.crest = S.rose; }
  render();
}
const divPick = NL.filterButton('#divPick', {
  label: 'Division', multiple: false, value: 'National', allLabel: 'National',
  options: [{ value: 'National', label: 'National' }, { value: 'North', label: 'North' }, { value: 'South', label: 'South' }],
  onChange: (v) => { S.div = v || 'National'; render(); },
});

let booted = false;
window.TOOL = window.TOOL || {};
window.TOOL.boot = async function () {
  if (booted) return; booted = true;
  const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - 1);   // awards are for the month just gone
  $('tMonth').value = d.toLocaleString('en-GB', { month: 'long', year: 'numeric' }).toUpperCase();
  try { await Promise.all([800, 700, 400].map((w) => document.fonts.load(`40px "${CUT[w]}"`))); } catch {}
  try { S.rose = await loadImg(ROSE_URL, true); } catch {}
  await Promise.all(['National', 'North', 'South'].map(async (dv) => {
    try { S.lockups[dv] = await loadImg(LOCKUP_URL(dv), true); } catch (e) { console.warn('[awards-shortlist] lockup failed', dv, e); }
  }));
  for (let i = 0; i < N; i++) {
    try { NL.clubPicker('#club' + i, { mode: 'search', divisions: ['National', 'North', 'South'], onSelect: (sel) => setClub(i, sel) }); }
    catch (e) { console.error('[awards-shortlist] club picker', e); }
  }
  render();
};
if (window._toolDeferredSession) { window.TOOL.boot(window._toolDeferredSession); delete window._toolDeferredSession; }
</script>

</body>
</html>
