<script>
(function(){
  "use strict";

  const VERSION = "v2.0";
  const STORAGE_KEY = "top-scorers-builder-v2.0";
  const CANVAS_SIZE = 1347;

  /* ===== Asset URLs ===== */
  const REPO_ASSETS = "https://raw.githubusercontent.com/thenationalleague/tools/refs/heads/main/assets/";

  const BG_URL = REPO_ASSETS + "backgrounds/fixtures-1x1.png";

  const CREST_BASE_URL = "https://raw.githubusercontent.com/thenationalleague/tools/refs/heads/main/assets/crests/";

  function crestUrlForName(teamName){
    var t = (teamName || "").replace(/\s+/g," ").trim();
    if(!t) return "";
    return encodeURI(CREST_BASE_URL + t + ".png");
  }

  const DIV_BADGE = {
    National: encodeURI(REPO_ASSETS + "divisions/National.png"),
    North:    encodeURI(REPO_ASSETS + "divisions/North.png"),
    South:    encodeURI(REPO_ASSETS + "divisions/South.png")
  };
  const DIV_BADGE_POS = { x: 750, y: 1258, scale: 0.075 };

  /* ===== Clubs metadata (fetched) ===== */
  var CLUBS_META_URL = "https://raw.githubusercontent.com/thenationalleague/tools/refs/heads/main/assets/data/clubs-meta.json";
  var TEAM_NAMES = [];
  var TEAM_NAME_SET = new Set();

  /* ===== Canvas font helper ===== */
  const FONT_FAMILY = '"carbona-variable",sans-serif';

  function setCanvasFont(c, sizePx, weight){
    var w = weight || 800;
    c.font = w + " " + sizePx + "px " + FONT_FAMILY;
    if('fontVariationSettings' in c){
      c.fontVariationSettings = "'wght' " + w;
    } else {
      try { c.canvas.style.fontVariationSettings = "'wght' " + w; } catch(e){}
    }
  }

  function setTextStyle(c, sizePx, colorHex, weight){
    c.fillStyle = colorHex;
    setCanvasFont(c, sizePx, weight);
    c.textBaseline = "alphabetic";
  }

  function safeUpper(s){ return (s || "").replace(/\s+/g," ").trim().toUpperCase(); }
  function clamp(n, a, b){ return Math.max(a, Math.min(b, n)); }

  /* ===== Layout constants ===== */
  // cssVar() resolves a brand token to its computed hex/rgb value, so any
  // colour passed to canvas drawing tracks nl-brand.css as the source of truth.
  function cssVar(name){return getComputedStyle(document.documentElement).getPropertyValue(name).trim();}
  const COLORS = { red: cssVar('--primary'), blue: cssVar('--navy'), white: cssVar('--white') };

  const TITLE = { x: 774, topY: 60, size: 60, color: COLORS.red, weight: 800, align: "center" };
  const SUBTITLE = { x: 774, topY: 120, size: 36, color: COLORS.blue, weight: 800, align: "center" };
  const SUBTITLE_TEXT_CASE = { National: "National League", North: "National League North", South: "National League South" };

  const PHOTO_RECT = { x: 280, y: 180, w: 930, h: 320 };

  const ROWS_COUNT = 8;
  const ROW_H = 60;
  const ROW_GAP = 18;
  const ROW_Y0 = 550;
  const LEFT_X = 280;
  const RIGHT_EDGE_X = 1210;

  const LEFT_BOX = { w: 60, h: 60, color: COLORS.white };
  const RIGHT_BOX = { w: 60, h: 60, color: COLORS.blue };
  const MID_BAR = { color: COLORS.red };
  const CREST_MAX = 50;

  const NAME_TEXT = { size: 44, color: COLORS.white, weight: 800, xPad: 40 };
  const GOALS_TEXT = { size: 40, color: COLORS.white, weight: 800 };

  /* ================= ELEMENTS ================= */

  const canvas = document.getElementById("preview");
  const ctx = canvas.getContext("2d");

  const divisionSel = document.getElementById("division");
  const downloadBtn = document.getElementById("download");
  const resetAllBtn = document.getElementById("resetAll");
  const statusTextEl = document.getElementById("statusText");
  const photoInput = document.getElementById("photo");
  const resetPhotoBtn = document.getElementById("resetPhoto");
  const rowsEl = document.getElementById("rows");

  /* ================= STATE ================= */

  const imgCache = new Map();
  let bgImg = null;
  let divBadgeImg = null;

  const rowsState = Array.from({length: ROWS_COUNT}, ()=>({ team:"", name:"", goals:"" }));
  const DIVISIONS = ["National","North","South"];

  let photoImg = null;
  let photo = { scale: 1, ox: 0, oy: 0, dragging: false, dragStartX: 0, dragStartY: 0, dragStartOX: 0, dragStartOY: 0 };

  /* ================= HELPERS ================= */

  function setStatus(msg){
    statusTextEl.textContent = msg;
    window.clearTimeout(setStatus._t);
    setStatus._t = window.setTimeout(()=> statusTextEl.textContent = "Ready", 900);
  }

  function loadImage(url){
    if(!url) return Promise.reject(new Error("Empty URL"));
    if(imgCache.has(url)) return imgCache.get(url);
    const p = new Promise((resolve,reject)=>{
      const img = new Image();
      img.crossOrigin = "anonymous";
      img.onload = ()=> resolve(img);
      img.onerror = ()=> reject(new Error("Failed to load: " + url));
      img.src = url;
    });
    imgCache.set(url, p);
    return p;
  }

  function drawContainedImage(c, img, centerX, centerY, maxW, maxH){
    const iw = img.naturalWidth || img.width;
    const ih = img.naturalHeight || img.height;
    if(!iw || !ih) return;
    const s = Math.min(maxW / iw, maxH / ih);
    const dw = iw * s;
    const dh = ih * s;
    c.imageSmoothingEnabled = true;
    c.imageSmoothingQuality = "high";
    c.drawImage(img, centerX - dw/2, centerY - dh/2, dw, dh);
  }

  function fillRect(c, x, y, w, h, color){
    c.fillStyle = color;
    c.fillRect(x, y, w, h);
  }

  /* ===== Photo helpers ===== */
  function getMinCoverScale(){
    if(!photoImg) return 0.15;
    const iw = photoImg.naturalWidth || photoImg.width;
    const ih = photoImg.naturalHeight || photoImg.height;
    if(!iw || !ih) return 0.15;
    return Math.max(PHOTO_RECT.w / iw, PHOTO_RECT.h / ih);
  }

  function constrainPhotoToRect(){
    if(!photoImg) return;
    const iw = photoImg.naturalWidth || photoImg.width;
    const ih = photoImg.naturalHeight || photoImg.height;
    if(!iw || !ih) return;
    const minS = getMinCoverScale();
    if(photo.scale < minS) photo.scale = minS;
    const dw = iw * photo.scale;
    const dh = ih * photo.scale;
    const minOX = PHOTO_RECT.w - dw;
    const minOY = PHOTO_RECT.h - dh;
    if(dw <= PHOTO_RECT.w){ photo.ox = (PHOTO_RECT.w - dw) / 2; }
    else { photo.ox = clamp(photo.ox, minOX, 0); }
    if(dh <= PHOTO_RECT.h){ photo.oy = (PHOTO_RECT.h - dh) / 2; }
    else { photo.oy = clamp(photo.oy, minOY, 0); }
  }

  function resetPhotoTransform(){ photo.scale = 1; photo.ox = 0; photo.oy = 0; }

  function fitPhotoToRect(){
    if(!photoImg) return;
    const iw = photoImg.naturalWidth || photoImg.width;
    const ih = photoImg.naturalHeight || photoImg.height;
    if(!iw || !ih) return;
    const s = Math.max(PHOTO_RECT.w / iw, PHOTO_RECT.h / ih);
    photo.scale = s;
    const dw = iw * s;
    const dh = ih * s;
    photo.ox = (PHOTO_RECT.w - dw) / 2;
    photo.oy = (PHOTO_RECT.h - dh) / 2;
    constrainPhotoToRect();
  }

  function canvasPointFromEvent(e){
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    return { x: (e.clientX - rect.left) * scaleX, y: (e.clientY - rect.top) * scaleY };
  }

  function isPointInPhotoRect(px, py){
    return px >= PHOTO_RECT.x && px <= PHOTO_RECT.x + PHOTO_RECT.w && py >= PHOTO_RECT.y && py <= PHOTO_RECT.y + PHOTO_RECT.h;
  }

  function zoomPhotoAt(cursorX, cursorY, delta){
    if(!photoImg) return;
    const rx = cursorX - PHOTO_RECT.x;
    const ry = cursorY - PHOTO_RECT.y;
    const iw = photoImg.naturalWidth || photoImg.width;
    const ih = photoImg.naturalHeight || photoImg.height;
    if(!iw || !ih) return;
    const prevScale = photo.scale;
    const imgX = (rx - photo.ox) / prevScale;
    const imgY = (ry - photo.oy) / prevScale;
    const zoomFactor = (delta < 0) ? 1.08 : 0.92;
    let nextScale = clamp(prevScale * zoomFactor, getMinCoverScale(), 12);
    photo.scale = nextScale;
    photo.ox = rx - imgX * nextScale;
    photo.oy = ry - imgY * nextScale;
    constrainPhotoToRect();
  }

  /* ===== Per-division storage ===== */
  function getStoredPayload(){
    try{ var raw = localStorage.getItem(STORAGE_KEY); if(!raw) return {}; var d = JSON.parse(raw); return (d && typeof d === "object") ? d : {}; }catch(e){ return {}; }
  }
  function setStoredPayload(obj){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(obj)); }catch{}
  }
  function cloneRows(src){
    var out = [];
    for(var i=0;i<ROWS_COUNT;i++){
      var r = (src && src[i] && typeof src[i] === "object") ? src[i] : {};
      out.push({ team: typeof r.team === "string" ? r.team : "", name: typeof r.name === "string" ? r.name : "", goals: typeof r.goals === "string" ? r.goals : "" });
    }
    return out;
  }
  function saveActiveDivisionRows(div){
    var payload = getStoredPayload();
    payload.v = VERSION;
    payload.division = divisionSel.value;
    payload.byDivision = payload.byDivision && typeof payload.byDivision === "object" ? payload.byDivision : {};
    payload.byDivision[div] = cloneRows(rowsState);
    setStoredPayload(payload);
  }
  function loadDivisionRowsOrBlank(div){
    var payload = getStoredPayload();
    var by = payload.byDivision && typeof payload.byDivision === "object" ? payload.byDivision : {};
    var loaded = cloneRows(by[div]);
    for(var i=0;i<ROWS_COUNT;i++){
      rowsState[i].team = loaded[i].team;
      rowsState[i].name = loaded[i].name;
      rowsState[i].goals = loaded[i].goals;
    }
  }
  function autosave(){ saveActiveDivisionRows(divisionSel.value); }
  function autoload(){
    var d = getStoredPayload();
    if(!d || typeof d !== "object") return;
    if(typeof d.division === "string" && DIVISIONS.indexOf(d.division) !== -1) divisionSel.value = d.division;
    if((!d.byDivision || typeof d.byDivision !== "object") && Array.isArray(d.rowsState)){
      d.byDivision = d.byDivision && typeof d.byDivision === "object" ? d.byDivision : {};
      d.byDivision.National = cloneRows(d.rowsState);
      setStoredPayload(d);
    }
    loadDivisionRowsOrBlank(divisionSel.value);
  }
  function applyRowsToUI(){
    for(var i=0;i<ROWS_COUNT;i++){
      var r = rowsState[i];
      var teamSel = document.getElementById("team_" + i);
      var nameInp = document.getElementById("name_" + i);
      var goalsInp = document.getElementById("goals_" + i);
      if(teamSel) teamSel.value = r.team || "";
      if(nameInp) nameInp.value = r.name || "";
      if(goalsInp) goalsInp.value = r.goals || "";
    }
  }

  /* ================= UI BUILD ================= */

  function buildTeamSelect(){
    var s = document.createElement("select");
    var none = document.createElement("option");
    none.value = "";
    none.textContent = "Select team";
    s.appendChild(none);
    for(var j=0;j<TEAM_NAMES.length;j++){
      var o = document.createElement("option");
      o.value = TEAM_NAMES[j];
      o.textContent = TEAM_NAMES[j];
      s.appendChild(o);
    }
    return s;
  }

  function buildRowsUI(){
    rowsEl.innerHTML = "";
    for(let i=0;i<ROWS_COUNT;i++){
      const wrap = document.createElement("div");
      wrap.className = "row-grid";

      const teamSel = buildTeamSelect();
      teamSel.id = "team_" + i;

      const nameInp = document.createElement("input");
      nameInp.id = "name_" + i;
      nameInp.type = "text";
      nameInp.placeholder = "Player name";
      nameInp.autocomplete = "off";
      nameInp.maxLength = 40;

      const goalsInp = document.createElement("input");
      goalsInp.id = "goals_" + i;
      goalsInp.type = "text";
      goalsInp.inputMode = "numeric";
      goalsInp.placeholder = "0";
      goalsInp.autocomplete = "off";
      goalsInp.className = "goals";
      goalsInp.maxLength = 2;

      teamSel.addEventListener("change", ()=>{
        rowsState[i].team = teamSel.value || "";
        autosave(); scheduleRender();
      });
      nameInp.addEventListener("input", ()=>{
        rowsState[i].name = (nameInp.value || "").replace(/\r?\n/g," ");
        autosave(); scheduleRender();
      });
      goalsInp.addEventListener("input", ()=>{
        const v = (goalsInp.value || "").replace(/[^\d]/g,"").slice(0,2);
        if(v !== goalsInp.value) goalsInp.value = v;
        rowsState[i].goals = v;
        autosave(); scheduleRender();
      });

      wrap.appendChild(teamSel);
      wrap.appendChild(nameInp);
      wrap.appendChild(goalsInp);
      rowsEl.appendChild(wrap);
    }
  }

  /* ================= RENDER ================= */

  async function ensureBaseImages(){
    if(!bgImg) bgImg = await loadImage(BG_URL);
    var divUrl = DIV_BADGE[divisionSel.value] || DIV_BADGE.National;
    divBadgeImg = await loadImage(divUrl);
  }

  async function preloadRowCrests(){
    var urls = new Set();
    for(var i=0;i<ROWS_COUNT;i++){
      var t = rowsState[i].team;
      if(t && TEAM_NAME_SET.has(t)) urls.add(crestUrlForName(t));
    }
    await Promise.all([...urls].map(function(u){ return loadImage(u).catch(function(){return null;}); }));
  }

  function drawDivisionBadge(c){
    if(!divBadgeImg) return;
    var iw = divBadgeImg.naturalWidth || divBadgeImg.width;
    var ih = divBadgeImg.naturalHeight || divBadgeImg.height;
    var dw = iw * DIV_BADGE_POS.scale;
    var dh = ih * DIV_BADGE_POS.scale;
    c.drawImage(divBadgeImg, DIV_BADGE_POS.x - dw/2, DIV_BADGE_POS.y - dh/2, dw, dh);
  }

  function drawHeaders(c){
    c.textAlign = TITLE.align;
    setTextStyle(c, TITLE.size, TITLE.color, TITLE.weight);
    c.fillText("TOP GOALSCORERS", TITLE.x, TITLE.topY + TITLE.size);

    var subtitle = (SUBTITLE_TEXT_CASE[divisionSel.value] || "National League").toUpperCase();
    c.textAlign = SUBTITLE.align;
    setTextStyle(c, SUBTITLE.size, SUBTITLE.color, SUBTITLE.weight);
    c.fillText(subtitle, SUBTITLE.x, SUBTITLE.topY + SUBTITLE.size);
  }

  function drawPhoto(c){
    c.save();
    c.beginPath();
    c.rect(PHOTO_RECT.x, PHOTO_RECT.y, PHOTO_RECT.w, PHOTO_RECT.h);
    c.clip();
    fillRect(c, PHOTO_RECT.x, PHOTO_RECT.y, PHOTO_RECT.w, PHOTO_RECT.h, COLORS.blue);
    if(photoImg){
      var iw = photoImg.naturalWidth || photoImg.width;
      var ih = photoImg.naturalHeight || photoImg.height;
      var dw = iw * photo.scale;
      var dh = ih * photo.scale;
      c.imageSmoothingEnabled = true;
      c.imageSmoothingQuality = "high";
      c.drawImage(photoImg, PHOTO_RECT.x + photo.ox, PHOTO_RECT.y + photo.oy, dw, dh);
    }
    c.restore();
  }

  async function drawRows(c){
    for(let i=0;i<ROWS_COUNT;i++){
      const y = ROW_Y0 + i*(ROW_H + ROW_GAP);
      const leftX = LEFT_X;
      const rightX = RIGHT_EDGE_X - RIGHT_BOX.w;
      const redX = leftX + LEFT_BOX.w;
      const redW = rightX - redX;

      fillRect(c, leftX, y, LEFT_BOX.w, LEFT_BOX.h, LEFT_BOX.color);
      fillRect(c, redX, y, redW, ROW_H, MID_BAR.color);
      fillRect(c, rightX, y, RIGHT_BOX.w, RIGHT_BOX.h, RIGHT_BOX.color);

      const teamName = rowsState[i].team || "";
      if(teamName && TEAM_NAME_SET.has(teamName)){
        const url = crestUrlForName(teamName);
        const img = await loadImage(url).catch(()=>null);
        if(img) drawContainedImage(c, img, leftX + LEFT_BOX.w/2, y + LEFT_BOX.h/2, CREST_MAX, CREST_MAX);
      }

      const name = safeUpper(rowsState[i].name || "");
      if(name){
        c.textAlign = "left";
        setTextStyle(c, NAME_TEXT.size, NAME_TEXT.color, NAME_TEXT.weight);
        c.fillText(name, redX + NAME_TEXT.xPad, y + (ROW_H/2) + (NAME_TEXT.size * 0.35));
      }

      const goals = (rowsState[i].goals || "").trim();
      if(goals){
        c.textAlign = "center";
        setTextStyle(c, GOALS_TEXT.size, GOALS_TEXT.color, GOALS_TEXT.weight);
        c.fillText(goals, rightX + RIGHT_BOX.w/2, y + (ROW_H/2) + (GOALS_TEXT.size * 0.35));
      }
    }
  }

  async function renderToContext(c){
    await ensureBaseImages();
    await preloadRowCrests();
    c.setTransform(1,0,0,1,0,0);
    c.clearRect(0,0,CANVAS_SIZE,CANVAS_SIZE);
    c.imageSmoothingEnabled = true;
    c.imageSmoothingQuality = "high";
    c.drawImage(bgImg, 0, 0, CANVAS_SIZE, CANVAS_SIZE);
    drawHeaders(c);
    drawPhoto(c);
    await drawRows(c);
    drawDivisionBadge(c);
  }

  let renderQueued = false;
  function scheduleRender(){
    if(renderQueued) return;
    renderQueued = true;
    requestAnimationFrame(async ()=>{
      renderQueued = false;
      try{
        if(document.fonts && document.fonts.ready) await document.fonts.ready;
        await renderToContext(ctx);
        autosave();
      }catch(e){ console.error(e); setStatus("Render error"); }
    });
  }

  async function renderNow(){
    if(document.fonts && document.fonts.ready) await document.fonts.ready;
    await renderToContext(ctx);
    autosave();
  }

  /* ================= DOWNLOAD ================= */

  async function downloadPNG_1x1(){
    try{
      await ensureBaseImages();
      if(document.fonts && document.fonts.ready) await document.fonts.ready;
      var out = document.createElement("canvas");
      out.width = CANVAS_SIZE; out.height = CANVAS_SIZE;
      await renderToContext(out.getContext("2d"));
      var blob = await new Promise(function(res){ out.toBlob(res, "image/png"); });
      if(!blob){ setStatus("Export failed"); return; }
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = ("Top goalscorers - " + divisionSel.value + ".png").replace(/\s+/g," ").trim();
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(a.href);
      setStatus("Downloaded");
      if (window.NL && NL.writeAudit) NL.writeAudit('top-scorers_download', a.download);
    }catch(e){ console.error(e); setStatus("Export error"); }
  }

  /* ================= RESET ================= */

  function resetAll(){
    for(var i=0;i<ROWS_COUNT;i++){ rowsState[i].team = ""; rowsState[i].name = ""; rowsState[i].goals = ""; }
    applyRowsToUI();
    autosave(); scheduleRender();
    setStatus("Reset");
  }

  function resetPhoto(){
    photoImg = null;
    resetPhotoTransform();
    if(photoInput) photoInput.value = "";
    scheduleRender();
    setStatus("Photo reset");
  }

  /* ================= EVENTS ================= */

  function bindUI(){
    divisionSel.addEventListener("change", ()=>{
      var prev = divisionSel._prevDivision || "National";
      saveActiveDivisionRows(prev);
      divBadgeImg = null;
      loadDivisionRowsOrBlank(divisionSel.value);
      applyRowsToUI();
      divisionSel._prevDivision = divisionSel.value;
      autosave(); scheduleRender();
    });

    downloadBtn.addEventListener("click", downloadPNG_1x1);
    resetAllBtn.addEventListener("click", resetAll);
    resetPhotoBtn.addEventListener("click", resetPhoto);

    photoInput.addEventListener("change", async (e)=>{
      var f = e.target.files && e.target.files[0] ? e.target.files[0] : null;
      if(!f) return;
      try{
        var url = URL.createObjectURL(f);
        var img = await new Promise((resolve,reject)=>{
          var im = new Image();
          im.onload = ()=> resolve(im);
          im.onerror = ()=> reject(new Error("Failed to read image"));
          im.src = url;
        });
        try{ URL.revokeObjectURL(url); }catch{}
        photoImg = img;
        resetPhotoTransform();
        fitPhotoToRect();
        constrainPhotoToRect();
        scheduleRender();
        setStatus("Photo loaded");
      }catch(err){ console.error(err); setStatus("Photo load failed"); }
    });

    canvas.addEventListener("wheel", (e)=>{
      if(!photoImg) return;
      var p = canvasPointFromEvent(e);
      if(!isPointInPhotoRect(p.x, p.y)) return;
      e.preventDefault();
      zoomPhotoAt(p.x, p.y, e.deltaY);
      scheduleRender();
    }, { passive:false });

    canvas.addEventListener("pointerdown", (e)=>{
      if(!photoImg) return;
      var p = canvasPointFromEvent(e);
      if(!isPointInPhotoRect(p.x, p.y)) return;
      canvas.setPointerCapture(e.pointerId);
      photo.dragging = true;
      photo.dragStartX = p.x; photo.dragStartY = p.y;
      photo.dragStartOX = photo.ox; photo.dragStartOY = photo.oy;
    });

    canvas.addEventListener("pointermove", (e)=>{
      if(!photoImg || !photo.dragging) return;
      var p = canvasPointFromEvent(e);
      photo.ox = photo.dragStartOX + (p.x - photo.dragStartX);
      photo.oy = photo.dragStartOY + (p.y - photo.dragStartY);
      constrainPhotoToRect();
      scheduleRender();
    });

    function endDrag(){ photo.dragging = false; }
    canvas.addEventListener("pointerup", endDrag);
    canvas.addEventListener("pointercancel", endDrag);
    canvas.addEventListener("lostpointercapture", endDrag);
  }

  /* ================= INIT ================= */

  async function start(){
    try {
      var resp = await fetch(CLUBS_META_URL);
      var data = await resp.json();
      var clubs = data.clubs || [];
      clubs.sort(function(a, b){ return a.name.localeCompare(b.name); });
      TEAM_NAMES = clubs.map(function(c){ return c.name; });
      TEAM_NAME_SET = new Set(TEAM_NAMES);
    } catch(e) {
      console.warn("[top-scorers] Could not load clubs-meta.json:", e);
    }

    buildRowsUI();
    autoload();
    applyRowsToUI();
    divisionSel._prevDivision = divisionSel.value;
    bindUI();

    try{
      var warm = document.getElementById("fontWarmup");
      if(warm) void warm.offsetWidth;
      if(document.fonts && document.fonts.ready) await document.fonts.ready;
      await new Promise(function(r){ setTimeout(r, 300); });
      await ensureBaseImages();
      await renderNow();
      setStatus("Loaded");
    }catch(e){ console.error(e); setStatus("Image load error"); }
  }

  start();
})();
</script>
</body>
</html>
