<!DOCTYPE html>
<!--
  Fixtures & Results Graphic — NL Tools (Graphics sub-tool)
  Version: v2.0 (09/10/2026)
  File: /graphics/fixtures-graphic/index.html

  On-brand fixtures/results social graphic. Pick a competition and date;
  the games load from National League Services, the title fills in from
  the rounds file, untick any game to leave it off, download 1:1, 4:5 and
  9:16 in one go. "Edit by hand" keeps the paste box and full editor.

  THE TOOL IS fixtures-app.js. This page is only the gated door to it: the
  public edition at /public/fixtures-graphic/ loads the same script, which
  builds its own controls into #fxTool. Change the tool there, not here.

  Storage:
    localStorage nl-fixtures-gfx-v2   (competition, size, long names — no RTDB)
  Data:
    NLS matches API (public, no auth) — the fixture/result card itself.
      Clubs are matched on clubs-meta optaID, which is the NLS teamID, so
      the crest and canonical name never depend on string-matching a name.
    NL.clubs (canon) → /assets/data/clubs-meta.json  (club list / short names)
    /assets/crests|divisions/*              (crests, Enterprise lockups)
  Access (auth-guard):
    toolKey 'staff-graphics' — same gate as the other graphics sub-tools.

  NOTE: this redesigned graphic sits ALONGSIDE the existing
  graphics/fixtures-results tool, and on 15/08/2026 it did: Richard
  confirmed fixtures-results was the older build and it was deleted.
-->
