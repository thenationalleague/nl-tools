<!--
  League Tables — NL Tools (Graphics & Media sub-tool)
  Version: 3.0
  Date: 26/04/2026
  File: /tools/graphics/league-tables/index.html

  CHANGELOG
  v3.0 (26/04/2026) — Portal integration + brand consistency
    Shell:
      - Added Firebase compat SDKs + config + initializeApp
      - Added auth-guard integration under NL_TOOL_KEY = 'staff-graphics'
      - Added NL_TOOL, NL_CHANGELOG, nlAuthReady callback
      - Wrapped all content in #pageWrap
      - Added #nlTopbar for standard topbar
    CSS:
      - Loaded nl-brand.css — all brand tokens available
      - Stripped custom :root tokens (--border, --bg, --fg, --muted)
        and replaced with brand equivalents
      - Buttons use brand .btn classes
      - Form controls use brand tokens for borders, radius, font
      - Removed Typekit CSS/JS loader (nl-brand.css provides @font-face)
      - border-radius values changed from 10-14px to var(--radius)
      - Body background changed from #fff to brand off-white
      - .page container uses brand fluid padding (no override)
    Data:
      - Team list now fetched from clubs-meta.json instead of hardcoded
      - Crest URLs, backgrounds, division badges, and partner logos all
        served from thenationalleague/tools repo
    Engine:
      - All canvas rendering code preserved unchanged
      - const/let kept in engine (converting 200+ declarations is
        high-risk for zero functional gain)
      - Font warmup span kept — needed for canvas text measurement
      - var used in all new code

  v2.4 — Previous standalone version (pre-portal)
-->

<script>
(function(){
  "use strict";

  /* ================= CONFIG ================= */

  const VERSION = "v3.0";
  const STORAGE_KEY = "table-builder-v3.0";

  const EXPORT_SIZE = 1347;

  const GLOBAL_DX = 0;
  const GLOBAL_DY = -10;

  /* ===== Asset URLs ===== */
  const REPO_ASSETS = "https://raw.githubusercontent.com/thenationalleague/tools/refs/heads/main/assets/";

  const BG_URL = REPO_ASSETS + "backgrounds/league-table-bg.png";

  const DIVISION_BASE_URL = REPO_ASSETS + "divisions/";

  function getDivisionBadgeUrl(div){
    const d = safeText(div);
    if(!d) return null;
    return encodeURI(DIVISION_BASE_URL + d + ".png");
  }

  const TIC_URL = encodeURI(REPO_ASSETS + "partners/TIC Health.png");
  const TIC_SCALE = 0.30;
  const TIC_ROT_DEG = -90;

  const BADGE_MID = { x:180, y:120, scale:0.08 };

  /* ===== Clubs metadata (fetched from clubs-meta.json) ===== */
  var CLUBS_META_URL = "https://raw.githubusercontent.com/thenationalleague/tools/refs/heads/main/assets/data/clubs-meta.json";
  var TEAMS_DROPDOWN = []; // populated on load from clubs-meta.json
  var TEAM_SET = new Set();

  function safeText(s){ return (s || "").replace(/\s+/g," ").trim(); }
  function toAllCaps(s){ return safeText(s).toUpperCase(); }

  /* ===== CRESTS ===== */
  const CREST_BASE_URL = "https://raw.githubusercontent.com/thenationalleague/tools/refs/heads/main/assets/crests/";

  function crestUrlForTeam(teamName){
    const t = safeText(teamName);
    if(!t) return null;
    return encodeURI(CREST_BASE_URL + t + ".png");
  }

  function getCrestUrlForTeamExact(teamName){
    const key = safeText(teamName).toLowerCase();
    if(!key) return null;
    if(!TEAM_SET.has(key)) return null;
    return crestUrlForTeam(teamName);
  }

  /* ===== Rendered team text ===== */
  function teamTextForGraphic(teamName){
    const t = safeText(teamName);
    if(!t) return "";
    if(t.toLowerCase() === "hampton & richmond borough") return "HAMPTON & RICHMOND";
    return toAllCaps(t);
  }

  // cssVar() resolves a brand token to its computed hex/rgb value, so any
  // colour passed to canvas drawing tracks nl-brand.css as the source of truth.
  function cssVar(name){return getComputedStyle(document.documentElement).getPropertyValue(name).trim();}
  const NL_RED   = cssVar('--primary');
  const NL_NAVY  = cssVar('--navy');
  const NL_WHITE = cssVar('--white');
  // Position-tier identity palette — graded blues for champion / playoff /
  // relegation rows. Distinct from --navy because the grid needs four
  // visually-separable tones; widget-internal palette under the brand-CSS
  // canvas-output exception. Pure black/white kept literal for max
  // print/canvas contrast on the special champion / relegation rows.

  // Crest square
  const CREST_BOX_W = 42;
  const CREST_BOX_H = 42;
  const CREST_BOX_COLOR = NL_RED;
  const CREST_MAX = 36;

  // Title
  const TITLE_Y = 70;
  const TITLE_COLOR = NL_RED;
  const TITLE_SIZE = 36;

  // Matchday
  const MATCHDAY_Y = 115;
  const MATCHDAY_COLOR = NL_NAVY;
  const MATCHDAY_SIZE = 28;

  // Rows layout
  const ROWS = 24;
  const ROW_H = 42;
  const ROW_GAP = 8;

  const ROW_START_X = 450;
  const ROW_START_Y = 145;

  const BLUE_BOX_W = 42;
  const BLUE_BOX_H = 42;

  const BASE_POS_COLOR = NL_NAVY;

  const RED_BOX_W = 420;
  const RED_BOX_H = 42;
  const RED_BOX_COLOR = NL_RED;

  // Numeric position zone colours — NL competition position-band palette,
  // promoted to canon in nl-utils.js (NL.positionBands) and nl-brand.css
  // (--pos-*) in v2.19. Read literal hex from NL.positionBands so the
  // canvas exports stay in lockstep with brand.
  const POS_CHAMP_COLOR = NL.positionBands.champ;
  const POS_SF_COLOR    = NL.positionBands.sf;
  const POS_QF_COLOR    = NL.positionBands.qf;
  const POS_RELEG_COLOR = NL.positionBands.releg;

  // Override tokens (grid flag)
  const OVERRIDE_NONE = "-";
  const OVERRIDE_C    = "C";
  const OVERRIDE_SF   = "SF";
  const OVERRIDE_QF   = "QF";
  const OVERRIDE_R    = "R";

  // Special visuals — gold/silver are medal identity colours, tool-local.
  // The shades below mirror NL.positionBands for the play-off and relegated
  // rows.
  const POS_C_BG = "gold";
  const POS_C_FG = NL.positionBands.cFg;

  const POS_PO_QF_BG = "silver";
  const POS_PO_SF_BG = NL.positionBands.poSfBg;
  const POS_PO_FG    = NL.positionBands.poFg;

  const POS_R_BG = NL.positionBands.rBg;
  const POS_R_FG = NL.positionBands.rFg;

  // Text
  const POS_TEXT_SIZE = 24;
  const TEAM_TEXT_SIZE = 24;
  const TEAM_TEXT_LEFT_PAD = 30;

  const POS_TEXT_COLOR_DEFAULT = NL_WHITE;
  const TEAM_TEXT_COLOR = NL_WHITE;

  // Stat columns
  const COL_P_X   = 960;
  const COL_GD_X  = 1010;
  const COL_PTS_X = 1060;

  const COL_HEADER_Y = 135;
  const COL_HEADER_SIZE = 20;
  const COL_HEADER_COLOR = "#000000";

  const COL_VALUE_SIZE = 24;
  const COL_VALUE_COLOR = NL_NAVY;

  // Separator lines
  const DOTTED_AFTER_ROWS = [1, 3, 7, 20];

  const SEP_DASH_W = 12;
  const SEP_DASH_H = 2;
  const SEP_GAP    = 4;
  const SEP_Y_NUDGE = -1;
  const SEP_RIGHT_TRIM = 10;

  function drawDottedSeparator(c, y){
    const x1 = (ROW_START_X + GLOBAL_DX) - CREST_BOX_W;
    const x2 = (COL_PTS_X + GLOBAL_DX) + 24 - SEP_RIGHT_TRIM;
    const step = SEP_DASH_W + SEP_GAP;
    c.save();
    c.fillStyle = NL_NAVY;
    const yTop = y + SEP_Y_NUDGE;
    for(let x = x1; x <= x2; x += step){
      const w = Math.min(SEP_DASH_W, (x2 - x));
      if(w > 0) c.fillRect(x, yTop, w, SEP_DASH_H);
    }
    c.restore();
  }

  // Fonts — canvas rendering uses these stacks
  const FONT_ALL_STACK = '"carbona-variable",sans-serif';
  const CANVAS_FALLBACK_STACK = 'Arial,sans-serif';

  /* Canvas 2D doesn't reliably apply variable font weight from the
     font shorthand alone. This helper sets both ctx.font AND
     ctx.fontVariationSettings (where supported) to ensure the
     weight axis is honoured. Falls back gracefully. */
  function setCanvasFont(c, size){
    c.font = "800 " + size + "px " + FONT_ALL_STACK;
    /* Modern browsers support fontVariationSettings on CanvasRenderingContext2D */
    if('fontVariationSettings' in c){
      c.fontVariationSettings = "'wght' 800";
    } else {
      /* Fallback: apply via the canvas element's style — some browsers
         inherit this into the 2d context */
      try { c.canvas.style.fontVariationSettings = "'wght' 800"; } catch(e){}
    }
  }

  /* ================= ELEMENTS ================= */

  const canvas = document.getElementById("preview");
  const ctx = canvas.getContext("2d");

  const divisionSel = document.getElementById("division");
  const matchdaySel = document.getElementById("matchday");
  const pasteEl = document.getElementById("pasteIn");
  const gridBody = document.getElementById("gridBody");

  const download1x1Btn = document.getElementById("download1x1");
  const download4x5Btn = document.getElementById("download4x5");
  const resetAllBtn = document.getElementById("resetAll");
  const statusEl = document.getElementById("status");
  const fontStatusEl = document.getElementById("fontStatus");

  /* ================= STATE ================= */

  let rows = Array.from({length: ROWS}, () => ({ team:"", p:"", gd:"", pts:"", flag: OVERRIDE_NONE }));

  let bgImg = null;
  let badgeImg = null;
  let ticImg = null;

  const imgCache = new Map();
  const imgObjCache = new Map();

  let isUpdatingFromGrid = false;
  let isUpdatingFromPaste = false;

  /* ================= HELPERS ================= */

  function setStatus(msg){
    statusEl.textContent = msg;
    window.clearTimeout(setStatus._t);
    setStatus._t = window.setTimeout(()=> statusEl.textContent = "Ready", 900);
  }

  function loadImage(url){
    if(imgCache.has(url)) return imgCache.get(url);
    const p = new Promise((resolve,reject)=>{
      const img = new Image();
      img.crossOrigin = "anonymous";
      img.onload = ()=> { imgObjCache.set(url, img); resolve(img); };
      img.onerror = ()=> { reject(new Error("IMAGE LOAD FAILED: " + url)); };
      img.src = url;
    });
    imgCache.set(url, p);
    return p;
  }

  function clamp3(s){ return String(s || "").slice(0, 3); }

  function digitsOnly3(s){
    const v = String(s || "").replace(/[^\d]/g, "");
    return clamp3(v);
  }

  function gdOnly3(s){
    let v = String(s || "").toUpperCase().replace(/[^0-9+\-]/g, "");
    if(v.length >= 2){
      const first = v[0];
      if(first === "+" || first === "-"){
        v = first + v.slice(1).replace(/[+\-]/g, "");
      }else{
        v = v.replace(/[+\-]/g, "");
      }
    }
    return clamp3(v);
  }

  function isProbablyHeader(cells){
    const joined = cells.map(c=>String(c||"")).join(" ").toLowerCase();
    return joined.includes("team") && (joined.includes("pts") || joined.includes("points"));
  }

  function splitLine(line){
    if(line.includes("\t")) return line.split("\t").map(s=>s.trim());
    if(line.includes(",")) return line.split(",").map(s=>s.trim());
    return line.trim().split(/\s{2,}|\s+\|\s+|\s+/).map(s=>s.trim());
  }

  function isNumLike(s){
    const v = String(s||"").trim();
    return /^[-+]?(\d+)$/.test(v) || /^[-+]?(\d+)\.(\d+)$/.test(v);
  }

  function normalizeGD(s){
    const v = safeText(s);
    if(!v) return "";
    return v.replace(/^(\+)?0$/, "0");
  }

  function titleForDivision(div){
    if(div === "North") return "ENTERPRISE NATIONAL LEAGUE NORTH";
    if(div === "South") return "ENTERPRISE NATIONAL LEAGUE SOUTH";
    return "ENTERPRISE NATIONAL LEAGUE";
  }

  function refreshFontStatus(){
    if(!fontStatusEl) return;
    const t = document.createElement("canvas");
    const c = t.getContext("2d");
    const sample = "FONT-WARMUP-0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz";
    c.font = "800 " + TITLE_SIZE + "px " + CANVAS_FALLBACK_STACK;
    const wFallback = c.measureText(sample).width;
    c.font = "800 " + TITLE_SIZE + "px " + FONT_ALL_STACK;
    const wTest = c.measureText(sample).width;
    const active = Math.abs(wFallback - wTest) >= 2;
    fontStatusEl.textContent = "Font: " + (active ? "CARBONA ACTIVE" : "FALLBACK");
  }

  async function ensureFontsLoaded(){
    try{
      const warm = document.getElementById("fontWarmup");
      if(warm){ void warm.offsetWidth; }
      if(document.fonts && document.fonts.load){
        await Promise.all([
          document.fonts.load('800 ' + TITLE_SIZE + 'px "carbona-variable"').catch(()=>[]),
          document.fonts.load('800 ' + TEAM_TEXT_SIZE + 'px "carbona-variable"').catch(()=>[]),
          document.fonts.load('800 ' + COL_VALUE_SIZE + 'px "carbona-variable"').catch(()=>[]),
          document.fonts.load('800 ' + MATCHDAY_SIZE + 'px "carbona-variable"').catch(()=>[])
        ]);
        if(document.fonts.ready) await document.fonts.ready;
      }
      /* Give the browser extra time to rasterise at the right weight.
         Without this, canvas may paint before the 800 weight is
         interpolated, falling back to the default 400. */
      await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
      await new Promise(r => setTimeout(r, 300));
      /* Force a layout pass to confirm the font is active */
      if(warm){ void warm.getBoundingClientRect(); }
    }catch{}
  }

  function formatDate_DDMMMyy(d){
    const parts = new Intl.DateTimeFormat("en-GB", {
      day: "2-digit", month: "short", year: "2-digit"
    }).formatToParts(d);
    const dd = (parts.find(p => p.type === "day") || {value:""}).value;
    const mmm = (parts.find(p => p.type === "month") || {value:""}).value;
    const yy = (parts.find(p => p.type === "year") || {value:""}).value;
    const mmmNorm = mmm ? (mmm[0].toUpperCase() + mmm.slice(1).toLowerCase()) : "";
    return dd + mmmNorm + yy;
  }

  function buildFilename(sizeTag){
    const div = (divisionSel.value || "National").trim();
    const dateStr = formatDate_DDMMMyy(new Date());
    const sizeSuffix = sizeTag ? (" - " + sizeTag) : "";
    return "Table " + div + " " + dateStr + sizeSuffix + ".png";
  }

  function drawContainedImage(c, img, x, y, w, h, maxSize){
    const iw = img.naturalWidth || img.width;
    const ih = img.naturalHeight || img.height;
    if(!iw || !ih) return;
    const s = Math.min(maxSize / iw, maxSize / ih);
    const dw = iw * s;
    const dh = ih * s;
    const cx = x + w/2;
    const cy = y + h/2;
    c.imageSmoothingEnabled = true;
    c.imageSmoothingQuality = "high";
    c.drawImage(img, cx - dw/2, cy - dh/2, dw, dh);
  }

  async function preloadCrests(){
    const urls = new Set();
    for(const r of rows){
      const teamName = safeText(r.team);
      if(!teamName) continue;
      const u = getCrestUrlForTeamExact(teamName);
      if(u) urls.add(u);
    }
    await Promise.all([...urls].map(u => loadImage(u).catch(()=>null)));
  }

  /* ================= PARSING / SERIALISING ================= */

  function parsePastedTable(raw){
    const text = (raw || "").replace(/\r/g, "\n");
    const lines = text.split("\n").map(l=>l.trim()).filter(l=>l.length>0);
    if(lines.length === 0){
      return Array.from({length: ROWS}, () => ({ team:"", p:"", gd:"", pts:"", flag: OVERRIDE_NONE }));
    }

    let startIdx = 0;
    const firstCells = splitLine(lines[0]);
    if(firstCells.length && isProbablyHeader(firstCells)) startIdx = 1;

    const out = [];
    const validFlags = new Set([OVERRIDE_NONE, OVERRIDE_C, OVERRIDE_SF, OVERRIDE_QF, OVERRIDE_R]);

    for(let i = startIdx; i < lines.length; i++){
      const cells = splitLine(lines[i]).filter(s => String(s||"").trim().length > 0);
      if(cells.length === 0) continue;
      if(isProbablyHeader(cells)) continue;

      const first = safeText(cells[0] || "").toUpperCase();
      const firstIsNumeric = /^\d+$/.test(first);
      const firstIsFlag = validFlags.has(first);

      let teamIdx = 0;
      let flag = OVERRIDE_NONE;

      if(firstIsNumeric){
        teamIdx = 1;
      }else if(firstIsFlag){
        teamIdx = 1;
        flag = first;
      }

      const teamRaw = safeText(cells[teamIdx] || "");
      const teamOk = TEAM_SET.has(teamRaw.toLowerCase());
      const team = teamOk ? teamRaw : "";

      const rest = cells.slice(teamIdx + 1);
      const nums = rest.filter(isNumLike).map(s=>String(s).trim());

      const p = nums.length >= 1 ? nums[0] : "";
      const pts = nums.length >= 1 ? nums[nums.length - 1] : "";
      const gd = nums.length >= 2 ? nums[nums.length - 2] : "";

      out.push({ team, p: digitsOnly3(p), gd: gdOnly3(normalizeGD(gd)), pts: digitsOnly3(pts), flag });
      if(out.length >= ROWS) break;
    }

    while(out.length < ROWS) out.push({ team:"", p:"", gd:"", pts:"", flag: OVERRIDE_NONE });
    return out.slice(0, ROWS);
  }

  function rowsToTSV(){
    const head = ["Pos","Team","P","GD","Pts"].join("\t");
    const lines = [head];
    for(let i=0;i<ROWS;i++){
      const r = rows[i] || {};
      const flag = safeText(r.flag || OVERRIDE_NONE).toUpperCase();
      const posOut = (flag && flag !== OVERRIDE_NONE) ? flag : String(i + 1);
      lines.push([posOut, safeText(r.team), safeText(r.p), safeText(r.gd), safeText(r.pts)].join("\t"));
    }
    return lines.join("\n");
  }

  /* ================= GRID UI ================= */

  function buildTeamOptions(selectEl){
    var opt0 = document.createElement("option");
    opt0.value = "";
    opt0.textContent = "";
    selectEl.appendChild(opt0);
    for(var i = 0; i < TEAMS_DROPDOWN.length; i++){
      var o = document.createElement("option");
      o.value = TEAMS_DROPDOWN[i];
      o.textContent = TEAMS_DROPDOWN[i];
      selectEl.appendChild(o);
    }
  }

  function buildFlagOptions(selectEl){
    var opts = [
      {v: OVERRIDE_NONE, t: "-"},
      {v: OVERRIDE_C,    t: "C"},
      {v: OVERRIDE_SF,   t: "SF"},
      {v: OVERRIDE_QF,   t: "QF"},
      {v: OVERRIDE_R,    t: "R"}
    ];
    for(var i = 0; i < opts.length; i++){
      var o = document.createElement("option");
      o.value = opts[i].v;
      o.textContent = opts[i].t;
      selectEl.appendChild(o);
    }
  }

  function makeCellPos(i){
    var td = document.createElement("td");
    td.className = "cell-pos";
    td.textContent = String(i + 1);
    return td;
  }

  function makeFlagCell(i){
    var td = document.createElement("td");
    var sel = document.createElement("select");
    sel.className = "override";
    buildFlagOptions(sel);
    sel.addEventListener("change", function(){
      rows[i].flag = sel.value;
      autosave();
      syncPasteFromGrid();
      render();
    });
    td.appendChild(sel);
    return {td: td, el: sel};
  }

  function makeTeamCell(i){
    var td = document.createElement("td");
    var sel = document.createElement("select");
    sel.className = "team";
    buildTeamOptions(sel);
    sel.addEventListener("change", function(){
      rows[i].team = sel.value;
      autosave();
      syncPasteFromGrid();
      render();
    });
    td.appendChild(sel);
    return {td: td, el: sel};
  }

  function makeSmallInputCell(i, key, kind){
    var td = document.createElement("td");
    var inp = document.createElement("input");
    inp.className = "small";
    inp.inputMode = "numeric";
    inp.autocomplete = "off";
    inp.spellcheck = false;
    inp.maxLength = 3;
    inp.addEventListener("input", function(){
      var v = inp.value;
      if(kind === "digits") v = digitsOnly3(v);
      if(kind === "gd") v = gdOnly3(v);
      inp.value = v;
      rows[i][key] = v;
      autosave();
      syncPasteFromGrid();
      render();
    });
    td.appendChild(inp);
    return {td: td, el: inp};
  }

  const gridEls = [];

  function buildGrid(){
    gridBody.innerHTML = "";
    gridEls.length = 0;

    for(let i=0;i<ROWS;i++){
      const tr = document.createElement("tr");
      tr.appendChild(makeCellPos(i));

      const f = makeFlagCell(i);
      tr.appendChild(f.td);
      const t = makeTeamCell(i);
      tr.appendChild(t.td);
      const p = makeSmallInputCell(i, "p", "digits");
      tr.appendChild(p.td);
      const gd = makeSmallInputCell(i, "gd", "gd");
      tr.appendChild(gd.td);
      const pts = makeSmallInputCell(i, "pts", "digits");
      tr.appendChild(pts.td);

      gridBody.appendChild(tr);
      gridEls.push({ flagSel: f.el, teamSel: t.el, pInp: p.el, gdInp: gd.el, ptsInp: pts.el });
    }
  }

  function syncGridFromRows(){
    for(let i=0;i<ROWS;i++){
      const r = rows[i] || {team:"", p:"", gd:"", pts:"", flag: OVERRIDE_NONE};
      const els = gridEls[i];
      if(!els) continue;
      els.flagSel.value = r.flag || OVERRIDE_NONE;
      els.teamSel.value = r.team || "";
      els.pInp.value = safeText(r.p);
      els.gdInp.value = safeText(r.gd);
      els.ptsInp.value = safeText(r.pts);
    }
  }

  function syncPasteFromGrid(){
    if(isUpdatingFromPaste) return;
    isUpdatingFromGrid = true;
    try{ pasteEl.value = rowsToTSV(); }
    finally{ isUpdatingFromGrid = false; }
  }

  function syncRowsFromPaste(){
    if(isUpdatingFromGrid) return;
    isUpdatingFromPaste = true;
    try{
      rows = parsePastedTable(pasteEl.value);
      syncGridFromRows();
      autosave();
      render();
    }finally{ isUpdatingFromPaste = false; }
  }

  /* ================= RENDER ================= */

  async function ensureBaseImages(){
    if(!bgImg) bgImg = await loadImage(BG_URL);
    const divUrl = getDivisionBadgeUrl(divisionSel.value) || getDivisionBadgeUrl("National");
    badgeImg = await loadImage(divUrl);
    if(!ticImg) ticImg = await loadImage(TIC_URL);
  }

  function drawTitleAndMatchday(c){
    const div = divisionSel.value || "National";
    const title = titleForDivision(div);
    c.save();
    c.textAlign = "left";
    c.textBaseline = "alphabetic";
    const titleX = (ROW_START_X - CREST_BOX_W) + GLOBAL_DX;
    c.fillStyle = TITLE_COLOR;
    setCanvasFont(c, TITLE_SIZE);
    c.fillText(title, titleX, TITLE_Y + GLOBAL_DY);
    const md = matchdaySel.value;
    if(md){
      c.fillStyle = MATCHDAY_COLOR;
      setCanvasFont(c, MATCHDAY_SIZE);
      c.fillText("MATCHDAY " + md, titleX, MATCHDAY_Y + GLOBAL_DY);
    }
    c.restore();
  }

  function drawBadge(c){
    if(!badgeImg) return;
    const iw = badgeImg.naturalWidth || badgeImg.width;
    const ih = badgeImg.naturalHeight || badgeImg.height;
    const dw = iw * BADGE_MID.scale;
    const dh = ih * BADGE_MID.scale;
    c.drawImage(badgeImg, (BADGE_MID.x + GLOBAL_DX) - dw/2, (BADGE_MID.y + GLOBAL_DY) - dh/2, dw, dh);
  }

  function drawTicHealth(c){
    if(!ticImg) return;
    const iw = ticImg.naturalWidth || ticImg.width;
    const ih = ticImg.naturalHeight || ticImg.height;
    const dw = iw * TIC_SCALE;
    const dh = ih * TIC_SCALE;
    const cx = (BADGE_MID.x + GLOBAL_DX);
    const cy = (EXPORT_SIZE / 2) + GLOBAL_DY;
    const rad = (TIC_ROT_DEG * Math.PI) / 180;
    c.save();
    c.translate(cx, cy);
    c.rotate(rad);
    c.drawImage(ticImg, -dw/2, -dh/2, dw, dh);
    c.restore();
  }

  function drawColumnHeaders(c){
    c.save();
    c.textAlign = "center";
    c.textBaseline = "alphabetic";
    c.fillStyle = COL_HEADER_COLOR;
    setCanvasFont(c, COL_HEADER_SIZE);
    c.fillText("P",   COL_P_X + GLOBAL_DX,   COL_HEADER_Y + GLOBAL_DY);
    c.fillText("GD",  COL_GD_X + GLOBAL_DX,  COL_HEADER_Y + GLOBAL_DY);
    c.fillText("PTS", COL_PTS_X + GLOBAL_DX, COL_HEADER_Y + GLOBAL_DY);
    c.restore();
  }

  function numericPosBoxColor(n){
    if(n === 1) return POS_CHAMP_COLOR;
    if(n >= 2 && n <= 3) return POS_SF_COLOR;
    if(n >= 4 && n <= 7) return POS_QF_COLOR;
    if(n >= 21 && n <= 24) return POS_RELEG_COLOR;
    return BASE_POS_COLOR;
  }

  function drawRows(c){
    for(let i=0; i<ROWS; i++){
      const y = (ROW_START_Y + i * (ROW_H + ROW_GAP)) + GLOBAL_DY;
      const blueX = ROW_START_X + GLOBAL_DX;
      const crestX = blueX - CREST_BOX_W;
      const r = rows[i] || {team:"", p:"", gd:"", pts:"", flag: OVERRIDE_NONE};

      c.fillStyle = CREST_BOX_COLOR;
      c.fillRect(crestX, y, CREST_BOX_W, CREST_BOX_H);

      const crestUrl = safeText(r.team) ? getCrestUrlForTeamExact(r.team) : null;
      const crestImg = crestUrl ? imgObjCache.get(crestUrl) : null;
      if(crestImg) drawContainedImage(c, crestImg, crestX, y, CREST_BOX_W, CREST_BOX_H, CREST_MAX);

      const numericPos = i + 1;
      let posLabel = String(numericPos);
      let posBoxColor = numericPosBoxColor(numericPos);
      let posTextColor = POS_TEXT_COLOR_DEFAULT;

      const flag = safeText(r.flag || OVERRIDE_NONE).toUpperCase();
      if(flag === OVERRIDE_C){ posLabel = "C"; posBoxColor = POS_C_BG; posTextColor = POS_C_FG; }
      else if(flag === OVERRIDE_SF){ posLabel = "PO"; posBoxColor = POS_PO_SF_BG; posTextColor = POS_PO_FG; }
      else if(flag === OVERRIDE_QF){ posLabel = "PO"; posBoxColor = POS_PO_QF_BG; posTextColor = POS_PO_FG; }
      else if(flag === OVERRIDE_R){ posLabel = "R"; posBoxColor = POS_R_BG; posTextColor = POS_R_FG; }

      c.fillStyle = posBoxColor;
      c.fillRect(blueX, y, BLUE_BOX_W, BLUE_BOX_H);

      const redX = blueX + BLUE_BOX_W;
      c.fillStyle = RED_BOX_COLOR;
      c.fillRect(redX, y, RED_BOX_W, RED_BOX_H);

      c.save();
      c.textBaseline = "middle";

      c.textAlign = "center";
      c.fillStyle = posTextColor;
      setCanvasFont(c, POS_TEXT_SIZE);
      c.fillText(posLabel, blueX + BLUE_BOX_W/2, y + BLUE_BOX_H/2 + 2);

      const teamGraphic = safeText(r.team) ? teamTextForGraphic(r.team) : "";
      c.textAlign = "left";
      c.fillStyle = TEAM_TEXT_COLOR;
      setCanvasFont(c, TEAM_TEXT_SIZE);
      c.fillText(teamGraphic, redX + TEAM_TEXT_LEFT_PAD, y + RED_BOX_H/2 + 2);

      c.textAlign = "center";
      c.fillStyle = COL_VALUE_COLOR;
      setCanvasFont(c, COL_VALUE_SIZE);
      c.fillText(String(r.p || ""),   COL_P_X + GLOBAL_DX,   y + ROW_H/2 + 2);
      c.fillText(String(r.gd || ""),  COL_GD_X + GLOBAL_DX,  y + ROW_H/2 + 2);
      c.fillText(String(r.pts || ""), COL_PTS_X + GLOBAL_DX, y + ROW_H/2 + 2);

      c.restore();

      if(DOTTED_AFTER_ROWS.includes(i + 1)){
        drawDottedSeparator(c, y + ROW_H + Math.floor(ROW_GAP / 2));
      }
    }
  }

  async function render(){
    try{
      await ensureBaseImages();
      ctx.setTransform(1,0,0,1,0,0);
      ctx.clearRect(0,0,EXPORT_SIZE,EXPORT_SIZE);
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = "high";
      ctx.drawImage(bgImg, 0, 0, EXPORT_SIZE, EXPORT_SIZE);
      await preloadCrests();
      drawBadge(ctx);
      drawTitleAndMatchday(ctx);
      drawColumnHeaders(ctx);
      drawRows(ctx);
      drawTicHealth(ctx);
      refreshFontStatus();
      setStatus("Rendered");
    }catch(e){
      console.error(e);
      setStatus(String(e && e.message ? e.message : e));
    }
  }

  async function renderToFullCanvas(){
    await ensureBaseImages();
    const full = document.createElement("canvas");
    full.width = EXPORT_SIZE;
    full.height = EXPORT_SIZE;
    const c = full.getContext("2d");
    c.setTransform(1,0,0,1,0,0);
    c.clearRect(0,0,EXPORT_SIZE,EXPORT_SIZE);
    c.imageSmoothingEnabled = true;
    c.imageSmoothingQuality = "high";
    c.drawImage(bgImg, 0, 0, EXPORT_SIZE, EXPORT_SIZE);
    await preloadCrests();
    drawBadge(c);
    drawTitleAndMatchday(c);
    drawColumnHeaders(c);
    drawRows(c);
    drawTicHealth(c);
    return full;
  }

  async function downloadPNG_1x1(){
    try{
      const full = await renderToFullCanvas();
      const blob = await new Promise(res => full.toBlob(res, "image/png"));
      if(!blob){ setStatus("EXPORT BLOCKED (CORS)"); return; }
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = buildFilename("1x1");
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(a.href);
      setStatus("Downloaded 1x1");
      if (window.NL && NL.writeAudit) NL.writeAudit('league-tables_download', a.download);
    }catch(e){ console.error(e); setStatus(String(e && e.message ? e.message : e)); }
  }

  async function downloadPNG_4x5(){
    const OUT_W = 1080, OUT_H = 1347;
    const CROP_X = 54, CROP_Y = 0, CROP_W = 1080, CROP_H = 1347;
    try{
      const full = await renderToFullCanvas();
      const out = document.createElement("canvas");
      out.width = OUT_W;
      out.height = OUT_H;
      const c = out.getContext("2d");
      c.setTransform(1,0,0,1,0,0);
      c.clearRect(0,0,OUT_W,OUT_H);
      c.imageSmoothingEnabled = true;
      c.imageSmoothingQuality = "high";
      c.drawImage(full, CROP_X, CROP_Y, CROP_W, CROP_H, 0, 0, OUT_W, OUT_H);
      const blob = await new Promise(res => out.toBlob(res, "image/png"));
      if(!blob){ setStatus("EXPORT BLOCKED (CORS)"); return; }
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = buildFilename("4x5");
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(a.href);
      setStatus("Downloaded 4x5");
      if (window.NL && NL.writeAudit) NL.writeAudit('league-tables_download', a.download);
    }catch(e){ console.error(e); setStatus(String(e && e.message ? e.message : e)); }
  }

  /* ================= AUTOSAVE ================= */

  function autosave(){
    var payload = {
      v: VERSION,
      division: divisionSel.value,
      matchday: matchdaySel.value,
      pasteIn: pasteEl.value,
      rows: rows
    };
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(payload)); }catch{}
  }

  function autoload(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return;
      var d = JSON.parse(raw);
      if(!d || typeof d !== "object") return;
      if(d.division) divisionSel.value = d.division;
      if(typeof d.matchday === "string") matchdaySel.value = d.matchday;
      if(typeof d.pasteIn === "string") pasteEl.value = d.pasteIn;
      if(Array.isArray(d.rows) && d.rows.length){
        rows = d.rows.slice(0, ROWS);
        while(rows.length < ROWS) rows.push({ team:"", p:"", gd:"", pts:"", flag: OVERRIDE_NONE });
      }
    }catch{}
  }

  /* ================= UI ================= */

  function populateMatchday(){
    for(var i=1;i<=46;i++){
      var o = document.createElement("option");
      o.value = String(i);
      o.textContent = String(i);
      matchdaySel.appendChild(o);
    }
  }

  function resetAll(){
    try{ localStorage.removeItem(STORAGE_KEY); }catch{}
    divisionSel.value = "National";
    matchdaySel.value = "";
    pasteEl.value = "";
    rows = Array.from({length: ROWS}, () => ({ team:"", p:"", gd:"", pts:"", flag: OVERRIDE_NONE }));
    syncGridFromRows();
    syncPasteFromGrid();
    bgImg = null;
    badgeImg = null;
    ticImg = null;
    autosave();
    render();
    setStatus("Reset all");
  }

  function bindUI(){
    divisionSel.addEventListener("change", function(){
      badgeImg = null;
      autosave();
      render();
    });
    matchdaySel.addEventListener("change", function(){
      autosave();
      render();
    });
    pasteEl.addEventListener("input", function(){
      autosave();
      window.clearTimeout(bindUI._pt);
      bindUI._pt = window.setTimeout(function(){ syncRowsFromPaste(); }, 80);
    });
    download1x1Btn.addEventListener("click", downloadPNG_1x1);
    download4x5Btn.addEventListener("click", downloadPNG_4x5);
    resetAllBtn.addEventListener("click", resetAll);
  }

  /* ================= INIT ================= */

  async function start(){
    /* Fetch clubs-meta.json for team dropdown */
    try {
      var resp = await fetch(CLUBS_META_URL);
      var data = await resp.json();
      var clubs = data.clubs || [];
      TEAMS_DROPDOWN = clubs.map(function(c){ return c.name; }).sort();
      TEAM_SET = new Set(TEAMS_DROPDOWN.map(function(t){ return t.toLowerCase(); }));
    } catch(e) {
      console.warn("[league-tables] Could not load clubs-meta.json:", e);
      TEAMS_DROPDOWN = [];
      TEAM_SET = new Set();
    }

    populateMatchday();
    buildGrid();
    autoload();
    bindUI();

    await ensureFontsLoaded();

    if(safeText(pasteEl.value)){
      syncRowsFromPaste();
    }else{
      syncGridFromRows();
      syncPasteFromGrid();
    }

    await render();
  }

  start();

})();
</script>
