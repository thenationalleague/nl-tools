<!DOCTYPE html>
<!--
  NL Tools — Match Graphic
  Version: v1.4 (16/08/2026)
  File: /graphics/match-graphic/index.html

  Builds a single match graphic for any two clubs, in the four delivery
  formats, and downloads it. The bulk season set is produced by
  scripts/build-match-graphics.js; this page is for one-offs — a rearranged
  fixture, a cup tie not yet in the data, a friendly.

  Artwork comes from /graphics/_shared/match-graphic.js, the same module the
  batch build calls, so a graphic made here is pixel-identical to one in a
  delivered folder. Design rules and the reasoning behind them live in
  /graphics/match-graphic/README.md — they were set with the brand owner and
  are decisions, not defaults.

  Storage (RTDB): none. This tool reads clubs-meta / competitions-meta over
  HTTP and writes nothing.

  Access (auth-guard registry): shares toolKey 'staff-graphics' with the other
  Graphics & Media sub-tools, so anyone who can reach /graphics/ gets this.

  CHANGELOG
  v1.4 (16/08/2026) — colour-panel crest repointed to the canon string helper
    NL.clubs.crestImgHtml + wireCrestImgs (nl-utils v1.32). The crest URL is
    now escHtml-escaped in the markup (it was interpolated raw); fallback
    chain unchanged. Preview panel only — canvas export crests untouched.

  v1.3 (13/08/2026) — FIX: exports came out with no crests
    - v1.2 stopped the canvas being tainted by opting the crest request into
      CORS. That fixed the dead button but swapped it for a quieter fault:
      raw.githubusercontent.com does not Vary on Origin and sits behind a
      5-minute CDN cache, so once a crest URL is cached from a plain <img>
      (wireCrestImg's full-res fallback does exactly that) the CORS request
      reuses the non-CORS entry and fails. Result: the PNG downloaded happily
      with the badges missing — publishable, and wrong.
    - Canvas crests now load same-origin from /assets/crests/. No CORS, no
      taint, no cache-mode mismatch, no third-party dependency on the one
      asset the artwork cannot do without. Matches fixtures-graphic.
    - A missing crest or logo now shows a persistent "Do not publish this"
      strip naming what is absent, not just a toast that scrolls away.
    - toBlob is wrapped: an export that cannot be produced says so instead of
      throwing out of the click handler and looking like a dead button.
    - Boot fetches retry twice with backoff, and a boot that still fails shows
      a persistent notice with a Reload button. Previously one dropped request
      on a weak connection left the page looking ready with every control
      inert — reproduced in a headless browser.

  v1.2 (10/08/2026) — FIX: downloads did nothing
    - Crests are fetched from raw.githubusercontent.com (NL.clubs.crestUrl),
      and drawing a cross-origin image into a canvas taints it, so every
      toBlob() threw SecurityError out of the download click handler — no
      file, no error, nothing. Broken for every club since 07/08/2026, when
      the canon crest base moved off same-origin (5de3c8a); not related to
      the NL Cup work in v1.1. Fixed by opting the image request into CORS
      (crossOrigin before src); the host already sends the header.

  v1.1 (10/08/2026) — NL Cup guest sides
    - Selecting the NL Cup adds the 16 PL2 representative sides to both
      pickers; every other competition shows the NL roster alone, so a PL2
      side cannot be picked for a National League graphic by accident.
    - Entrants are read per season from competitions-meta.json rather than
      hardcoded, so next season's 16 need no code change. Colours and codes
      come from cup-clubs-meta.json; crests resolve through `crestName` to
      the parent club's badge, so nothing is duplicated.
    - Leaving the NL Cup while a guest is selected falls back to the first
      NL club rather than drawing a graphic for a side not in that comp.

  v1.0 (30/07/2026) — Initial build
    - Two NL.clubPicker selects (home/away) with a swap control between them
    - Competition select from competitions-meta.json
    - Four formats: 16x9, 1x1, 4x5, 9x16
    - Live canvas preview; NL.download for single and all-four export
    - Colour readout showing the resolved code colour, its basis and the
      contrast ratio, so the tertiary fallbacks explain themselves
    - Per-club colour override behind an explicit unlock; session-only,
      never written back to clubs-meta
-->

<style>

  /* The canvas needs the LOCAL Carbona ExtraBold, not the carbona-variable

  @font-face {

  .mg-fmt {

  .mg-previewhead { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .mg-previewhead h2 { margin: 0; font-size: var(--text-base); }
  .mg-dims { font-size: var(--text-sm); color: var(--text-muted); font-variant-numeric: tabular-nums; }

  .mg-club h3 { margin: 0 0 9px; font-size: var(--text-sm); display: flex; align-items: center; gap: 8px; }
  .mg-club h3 img { width: 22px; height: 22px; object-fit: contain; }
  .mg-club h3 span { color: var(--text-muted); font-weight: 400; }

  .mg-crow {
    display: grid; grid-template-columns: 74px 30px minmax(0, 1fr);
    gap: 8px; align-items: center; margin-bottom: 6px;
  }
  .mg-crow > span:first-child {
    font-size: var(--text-xs); color: var(--text-muted);
    text-transform: uppercase; letter-spacing: .05em;
  }
  .mg-sw {
    display: inline-block; width: 26px; height: 20px;
    border: 1px solid var(--border); border-radius: var(--radius-sm);
  }
  .mg-sw--sm { width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; }
  .mg-hexval { font-size: var(--text-sm); font-variant-numeric: tabular-nums; }
  .mg-crow input[type="color"] {
    width: 30px; height: 26px; padding: 0; cursor: pointer;
    background: none; border: 1px solid var(--border); border-radius: var(--radius-sm);
  }
  .mg-crow input[type="text"] {
    width: 100%; padding: 4px 7px; font: inherit; font-size: var(--text-sm);
    font-variant-numeric: tabular-nums; text-transform: uppercase;
    color: var(--text); background: var(--white);
    border: 1px solid var(--border); border-radius: var(--radius-sm);
  }
  .mg-crow input[type="text"][aria-invalid="true"] { border-color: var(--primary); }

  .mg-derived {
    display: flex; gap: 7px; align-items: center; flex-wrap: wrap;
    margin: 9px 0 0; font-size: var(--text-sm); color: var(--text-muted);
  }
  .mg-derived b { color: var(--text); font-variant-numeric: tabular-nums; }

  .mg-strip {
    display: flex; gap: 9px; padding: 10px 16px;
    font-size: var(--text-sm); border-top: 1px solid var(--border);

  /* [hidden] is only a UA display:none, so any rule setting display beats it.

  .mg-note { margin: 0; font-size: var(--text-sm); color: var(--text-muted); font-variant-numeric: tabular-nums; }

<!-- Main app -->
<script>
(function () {
  'use strict';

  var MG = window.NL_MATCH_GRAPHIC;
  var FMT_ORDER = ['16x9', '1x1', '4x5', '9x16'];
  var FMT_META = {
    '16x9': { label: 'Landscape', note: 'side by side' },
    '1x1':  { label: 'Square',    note: 'side by side' },
    '4x5':  { label: 'Portrait',  note: 'stacked' },
    '9x16': { label: 'Story',     note: 'stacked' }
  };
  var KEYS = ['primary', 'secondary', 'tertiary'];

  var el = function (id) { return document.getElementById(id); };

  /* "a, b and c" — reads as a sentence in both the toast and the warning. */
  function listOf(items) {
    if (items.length < 2) return items[0] || '';
    return items.slice(0, -1).join(', ') + ' and ' + items[items.length - 1];
  }
  function cap(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }

  /* The one competition non-member sides enter. Must match the `competition`
     string in competitions-meta.json. */
  var CUP = 'NL Cup';

  var state = { home: null, away: null, comp: 'National', format: '16x9' };
  var badges = {};              /* competition -> logo path */
  var overrides = {};           /* club name -> partial colours (session only) */
  var unlocked = false;
  var images = {};              /* url -> Promise<Image|null> */
  var homePicker, awayPicker;
  var missingAssets = [];       /* crest/logo names that failed this draw */
  var members = [];             /* NL roster for the current season */
  var guestList = [];           /* THIS season's cup guests, name-sorted */
  var guestByName = {};         /* name -> guest record, same set */

  /* ---------- club records: members + cup guests ----------
     Guests are deliberately absent from NL.clubs.byName (they are not and
     never were NL members — see the note on NL.clubs.guests). Everything
     downstream of selection treats the two the same, so resolve in one
     place rather than branching at each call site. */

  function recordFor(name) {
    return NL.clubs.byName(name) || guestByName[name] || null;
  }

  /* Guest records point at the parent club's badge ("Fulham PL2" ->
     Fulham.png) so no crest is duplicated under a suffixed name. */
  function crestKeyFor(name) {
    var c = recordFor(name);
    return (c && c.crestName) || name;
  }

  function isGuest(name) { return !!guestByName[name]; }

  /* ---------- assets ---------- */

  /* Crests for the CANVAS are loaded same-origin, and that is load-bearing.

     NL.clubs.crestUrl points at raw.githubusercontent.com. Drawing a
     cross-origin image into a canvas taints it and toBlob() then throws, so
     v1.2 opted the request into CORS with crossOrigin='anonymous'. That fixed
     the dead button but traded it for a subtler failure: the host replies
     `vary: Authorization,Accept-Encoding` — no `Origin` — behind a 5-minute
     CDN cache. Once the browser has that URL cached from a PLAIN <img> (which
     NL.clubs.wireCrestImg issues on its full-res fallback), the CORS request
     can reuse the non-CORS cache entry and fail. The export then succeeds with
     the crests missing, which is worse than failing outright because a graphic
     with no badges can be published without anyone noticing.

     Same-origin removes the whole class of problem: no CORS, no taint, no
     cache-mode mismatch, no third-party dependency on the one asset the
     artwork cannot do without — and on a slow connection it reuses the
     connection the page already has. _headers caches /assets/crests/* for a
     week. graphics/fixtures-graphic reached the same conclusion independently.

     Deliberately NOT setting crossOrigin: on a same-origin request it does
     nothing, and leaving it off means a future cross-origin URL trips the
     loud guard in save() rather than silently tainting.

     Third tool to meet this trap — a shared crest-image loader on NL.clubs is
     a canon candidate, noted rather than done here. */
  var CANVAS_CREST_BASE = '/assets/crests/';

  function canvasCrestUrl(name) {
    return name ? CANVAS_CREST_BASE + encodeURIComponent(name) + '.png' : '';
  }

  function loadImage(src) {
    if (!images[src]) {
      images[src] = new Promise(function (res) {
        var i = new Image();
        i.onload = function () { res(i); };
        i.onerror = function () { res(null); };
        i.src = src;
      });
    }
    return images[src];
  }

  /* ---------- colours ---------- */

  function colorsFor(name) {
    var club = recordFor(name);
    var base = club && club.colors ? club.colors : {};
    var ov = overrides[name];
    if (!ov) return base;
    var out = {};
    KEYS.forEach(function (k) { out[k] = ov[k] || base[k]; });
    return out;
  }

  function isOverridden(name) {
    var ov = overrides[name];
    if (!ov) return false;
    var club = recordFor(name);
    var base = (club && club.colors) || {};
    return KEYS.some(function (k) {
      return ov[k] && base[k] && ov[k].toLowerCase() !== base[k].toLowerCase();
    });
  }

  /* Canon .pill state variants — green for the normal path, blue for the
     tertiary fallback, amber for a club with no legible option. */
  function pillClass(basis) {
    return basis === 'secondary' ? 'pill--approved'
         : basis === 'tertiary'  ? 'pill--info'
         : 'pill--soon';
  }

  /* ---------- colour panel: readout, editable only once unlocked ---------- */

  function buildClubCol(mount, name, side) {
    var cols = colorsFor(name);
    var r = MG.resolveColours(cols);
    var ratio = MG.contrast(r.panel, r.text);
    var rows = KEYS.map(function (k) {
      if (unlocked) {
        return '<div class="mg-crow">' +
          '<span>' + k + '</span>' +
          '<input type="color" data-k="' + k + '" value="' + cols[k] + '" ' +
            'aria-label="' + NL.escHtml(name) + ' ' + k + ' colour">' +
          '<input type="text" data-k="' + k + '" value="' + cols[k] + '" ' +
            'maxlength="7" spellcheck="false" ' +
            'aria-label="' + NL.escHtml(name) + ' ' + k + ' hex">' +
        '</div>';
      }
      return '<div class="mg-crow">' +
        '<span>' + k + '</span>' +
        '<span class="mg-sw" style="background:' + cols[k] + '"></span>' +
        '<span class="mg-hexval">' + String(cols[k]).toUpperCase() + '</span>' +
      '</div>';
    }).join('');

    mount.innerHTML =
      '<h3>' + NL.clubs.crestImgHtml(crestKeyFor(name), 'thumb') +
        NL.escHtml(name) + ' <span>' + side + '</span></h3>' +
      rows +
      '<p class="mg-derived">Code <span class="mg-sw mg-sw--sm" style="background:' +
        r.text + '"></span><b>' + r.text.toUpperCase() + '</b>' +
        '<span class="pill ' + pillClass(r.textBasis) + '">' + r.textBasis + '</span>' +
        '<b>' + ratio.toFixed(2) + ':1</b></p>';

    NL.clubs.wireCrestImgs(mount);
    if (!unlocked) return;

    mount.querySelectorAll('input[type="color"]').forEach(function (inp) {
      inp.addEventListener('input', function () {
        applyOverride(name, inp.dataset.k, inp.value);
      });
    });
    mount.querySelectorAll('input[type="text"]').forEach(function (inp) {
      inp.addEventListener('change', function () {
        var v = inp.value.trim();
        if (v && v.charAt(0) !== '#') v = '#' + v;
        if (/^#[0-9a-f]{6}$/i.test(v)) {
          inp.removeAttribute('aria-invalid');
          applyOverride(name, inp.dataset.k, v);
        } else {
          /* Say what is wrong rather than silently reverting. */
          inp.setAttribute('aria-invalid', 'true');
          NL.toast('Enter a six-digit hex colour, e.g. #9E0000', 'error');
          inp.value = colorsFor(name)[inp.dataset.k];
          setTimeout(function () { inp.removeAttribute('aria-invalid'); }, 1200);
        }
      });
    });
  }

  function applyOverride(name, key, hex) {
    overrides[name] = overrides[name] || {};
    overrides[name][key] = hex;
    draw();
  }

  /* ---------- naming: mirrors scripts/build-match-graphics.js ---------- */

  function filename(homeName, awayName, fmt) {
    var h = recordFor(homeName), a = recordFor(awayName);
    return (h ? h.code : '???') + '-' + (a ? a.code : '???') + '-' + fmt + '.png';
  }

  /* ---------- draw ---------- */

  function draw() {
    if (!state.home || !state.away) return Promise.resolve();

    var homeClub = recordFor(state.home);
    var awayClub = recordFor(state.away);
    if (!homeClub || !awayClub) return Promise.resolve();
    var home = { name: state.home, code: homeClub.code, colors: colorsFor(state.home) };
    var away = { name: state.away, code: awayClub.code, colors: colorsFor(state.away) };

    el('mgMatchup').textContent = state.home + ' v ' + state.away;
    Array.prototype.forEach.call(el('mgFormats').children, function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.fmt === state.format));
    });

    var fmt = MG.FORMATS[state.format];
    el('mgDims').textContent = fmt.w + ' × ' + fmt.h;
    el('mgFname').textContent = filename(state.home, state.away, state.format);

    var canvas = el('mgCanvas');
    canvas.width = fmt.w;
    canvas.height = fmt.h;
    /* alpha:false — the artwork is full-bleed and opaque, so an alpha channel
       is about 27% of the file for nothing. Take the context AFTER sizing;
       resizing resets it. */
    var ctx = canvas.getContext('2d', { alpha: false });

    return Promise.all([
      loadImage(canvasCrestUrl(crestKeyFor(state.home))),
      loadImage(canvasCrestUrl(crestKeyFor(state.away))),
      loadImage(badges[state.comp])
    ]).then(function (a) {
      /* A toast disappears. A graphic delivered with a missing badge does
         not, so record the gap and say so permanently in the panel below. */
      missingAssets = [];
      if (!a[0]) missingAssets.push(state.home + '’s crest');
      if (!a[1]) missingAssets.push(state.away + '’s crest');
      if (!a[2]) missingAssets.push('the ' + state.comp + ' logo');
      if (missingAssets.length) NL.toast(cap(listOf(missingAssets)) + ' failed to load', 'error');

      MG.render(ctx, { home: home, away: away, competition: state.comp },
                { homeCrest: a[0], awayCrest: a[1], badge: a[2] },
                { format: state.format });

      buildClubCol(el('mgHomeCol'), state.home, 'home');
      buildClubCol(el('mgAwayCol'), state.away, 'away');

      var hc = MG.resolveColours(home.colors), ac = MG.resolveColours(away.colors);
      var notes = [];
      [[state.home, hc], [state.away, ac]].forEach(function (pair) {
        if (pair[1].textBasis === 'tertiary') {
          notes.push(pair[0] + ' uses its tertiary because the secondary is not ' +
            'legible on the panel — either under 2.5:1, or both colours are dark.');
        } else if (pair[1].textBasis === 'best-effort') {
          notes.push(pair[0] + ' has no legible option, so the better of the two is used.');
        }
      });
      el('mgExplain').textContent = notes.length ? notes.join(' ')
        : 'Both clubs use their secondary colour for the code, which is the usual case.';

      /* A missing asset outranks the similar-primaries note: one is a defect
         in what you are about to publish, the other is a judgement call. */
      var warn = el('mgWarn');
      if (missingAssets.length) {
        warn.hidden = false;
        warn.innerHTML = '<span><b>Do not publish this.</b> ' +
          NL.escHtml(cap(listOf(missingAssets))) + ' did not load, so the graphic ' +
          'below is incomplete. Check your connection and reload.</span>';
      } else if (MG.readsAsSameField(hc.panel, ac.panel)) {
        warn.hidden = false;
        warn.innerHTML = '<span><b>Similar primaries.</b> These panels read as ' +
          'close to one flat field; the seam bands do the separating.</span>';
      } else {
        warn.hidden = true;
      }

      var anyEdit = isOverridden(state.home) || isOverridden(state.away);
      el('mgUnlock').hidden = unlocked;
      el('mgReset').hidden = !unlocked;
      el('mgOvNote').hidden = !unlocked;
      if (anyEdit) el('mgOvNote').hidden = false;
    });
  }

  /* ---------- export ---------- */

  /* toBlob throws on a tainted canvas, and that throw used to escape the click
     handler — the button appeared to do nothing at all, which cost a fortnight
     of nobody realising exports were broken. Catch it and say so. */
  function save(fmt) {
    var name = filename(state.home, state.away, fmt);
    try {
      el('mgCanvas').toBlob(function (blob) {
        if (!blob) { NL.toast('The export produced no image — try reloading', 'error'); return; }
        NL.download(name, blob, 'image/png');
      }, 'image/png');
    } catch (err) {
      console.error('[match-graphic] export failed', err);
      NL.toast('Could not export this graphic — reload the page and try again', 'error');
    }
  }

  function downloadAll() {
    var keep = state.format;
    var chain = Promise.resolve();
    FMT_ORDER.forEach(function (f) {
      chain = chain.then(function () {
        state.format = f;
        return draw();
      }).then(function () {
        save(f);
        /* Browsers drop rapid successive downloads, so space them out. */
        return new Promise(function (r) { setTimeout(r, 400); });
      });
    });
    return chain.then(function () {
      state.format = keep;
      return draw();
    });
  }

  /* ---------- cup guests ---------- */

  /* WHICH guests entered is a property of the season, not of the club, so it
     lives on the competition record. Reading it per season means next year's
     16 arrive with a data edit and no code change. An unrecorded season
     (null) yields none, which is the honest answer rather than last year's. */
  function guestsForSeason(comps, all, seasonKey) {
    var cup = (comps.competitions || []).filter(function (c) {
      return c.competition === CUP;
    })[0];
    var entry = cup && cup.entrants && cup.entrants[seasonKey];
    var codes = entry && entry.guests;
    if (!codes || !codes.length) return [];
    var want = {};
    codes.forEach(function (c) { want[c] = true; });
    return all.filter(function (g) { return want[g.code]; });
  }

  function firstMemberBut(avoid) {
    for (var i = 0; i < members.length; i++) {
      if (members[i].name !== avoid) return members[i].name;
    }
    return members.length ? members[0].name : null;
  }

  /* The guests belong to ONE competition, so they are only offered there —
     otherwise nothing stops a PL2 side being drawn onto a National League
     graphic. Leaving the cup with one selected falls back to an NL club
     rather than silently rendering a side that isn't in the competition. */
  function syncGuests() {
    var on = state.comp === CUP && guestList.length > 0;
    if (!on) {
      if (isGuest(state.home)) {
        state.home = firstMemberBut(state.away);
        homePicker.setValue(state.home);
      }
      if (isGuest(state.away)) {
        state.away = firstMemberBut(state.home);
        awayPicker.setValue(state.away);
      }
    }
    var list = on ? guestList : [];
    return Promise.all([
      homePicker.setExtraClubs(list),
      awayPicker.setExtraClubs(list)
    ]).then(draw);
  }

  /* ---------- wiring ---------- */

  function buildFormatButtons() {
    FMT_ORDER.forEach(function (f) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'mg-fmt';
      b.dataset.fmt = f;
      b.innerHTML = '<b>' + FMT_META[f].label + '</b>' +
        '<span>' + MG.FORMATS[f].w + ' × ' + MG.FORMATS[f].h + '</span>' +
        '<em>' + FMT_META[f].note + '</em>';
      b.addEventListener('click', function () { state.format = f; draw(); });
      el('mgFormats').appendChild(b);
    });
  }

  /* One dropped request on a weak connection used to be terminal: every click
     handler is attached inside the boot chain, so a single failed fetch left a
     page that LOOKED ready with permanently dead buttons and one toast that
     scrolled away. Two retries with backoff cover the usual wobble. */
  function retry(fn, tries, wait) {
    tries = tries == null ? 2 : tries;
    wait = wait || 700;
    return fn().catch(function (err) {
      if (tries <= 0) throw err;
      console.warn('[match-graphic] retrying after', err && err.message);
      return new Promise(function (r) { setTimeout(r, wait); })
        .then(function () { return retry(fn, tries - 1, wait * 2); });
    });
  }

  window.TOOL = window.TOOL || {};
  window.TOOL.boot = function () {
    if (!MG) {
      NL.toast('The graphic renderer failed to load', 'error');
      return;
    }
    buildFormatButtons();

    /* The canvas must not draw a glyph before Carbona resolves — a silent
       fallback to sans-serif is the worst failure mode available here, so the
       font is awaited before the first render rather than alongside it. */
    var fontReady = document.fonts && document.fonts.load
      ? document.fonts.load('800 202px "NLCarbonaExtraBold"')
          .then(function () { return document.fonts.ready; })
          .catch(function () { /* draw anyway rather than showing nothing */ })
      : Promise.resolve();

    Promise.all([
      retry(function () { return NL.clubs.forSeason('current'); }),
      retry(function () {
        return fetch('/assets/data/competitions-meta.json').then(function (r) {
          if (!r.ok) throw new Error('competitions-meta ' + r.status);
          return r.json();
        });
      }),
      /* Guests are a bonus, not a dependency — a failure here must not cost
         the tool its 72 NL clubs, so it resolves to none rather than reject. */
      NL.clubs.guests().catch(function (err) {
        console.warn('[match-graphic] cup guests unavailable', err);
        return [];
      }),
      fontReady
    ]).then(function (res) {
      var clubs = res[0].filter(function (c) { return c.code && c.colors; });
      if (!clubs.length) throw new Error('no clubs with a code and colours');
      members = clubs;

      var seasonKey = NL.season.current(NL.clubs.meta());
      guestList = guestsForSeason(res[1], res[2], seasonKey).filter(function (g) {
        return g.code && g.colors;
      });
      guestByName = {};
      guestList.forEach(function (g) { guestByName[g.name] = g; });

      (res[1].competitions || []).forEach(function (c) {
        if (c.logo) badges[c.competition] = c.logo;
      });
      Object.keys(badges).forEach(function (k) {
        var o = document.createElement('option');
        o.value = k;
        o.textContent = (res[1].competitions.filter(function (c) {
          return c.competition === k;
        })[0] || {}).shortName || k;
        el('mgComp').appendChild(o);
      });
      if (!badges[state.comp]) state.comp = Object.keys(badges)[0];
      el('mgComp').value = state.comp;

      state.home = clubs[0].name;
      state.away = clubs.length > 1 ? clubs[1].name : clubs[0].name;

      /* A guest has no division, so the dropdown's secondary line would be
         blank for the 16. Label them instead — it is also the plainest way
         to show why they only appear under the cup. */
      function sideLabel(c) { return c.division || 'PL2 · NL Cup'; }

      homePicker = NL.clubPicker('#mgHomePicker', {
        mode: 'select', season: 'current', value: state.home,
        secondary: sideLabel,
        onSelect: function (sel) { state.home = sel.name; draw(); }
      });
      awayPicker = NL.clubPicker('#mgAwayPicker', {
        mode: 'select', season: 'current', value: state.away,
        secondary: sideLabel,
        onSelect: function (sel) { state.away = sel.name; draw(); }
      });

      el('mgComp').addEventListener('change', function (e) {
        state.comp = e.target.value;
        syncGuests();
      });
      el('mgSwap').addEventListener('click', function () {
        var h = state.home;
        state.home = state.away;
        state.away = h;
        homePicker.setValue(state.home);
        awayPicker.setValue(state.away);
        draw();
      });
      el('mgUnlock').addEventListener('click', function () { unlocked = true; draw(); });
      el('mgReset').addEventListener('click', function () {
        overrides = {};
        unlocked = false;
        draw();
      });
      el('mgDownload').addEventListener('click', function () { save(state.format); });
      el('mgDownloadAll').addEventListener('click', downloadAll);

      /* Not draw() — syncGuests settles the pickers' rosters for whatever
         competition we opened on, then draws. */
      return syncGuests();
    }).catch(function (err) {
      console.error('[match-graphic]', err);
      NL.toast('Could not load club data', 'error');
      /* The toast goes; this does not. Without it the page sits there looking
         usable while every control is inert, which is indistinguishable from
         the tool being broken. */
      var warn = el('mgWarn');
      if (warn) {
        warn.hidden = false;
        warn.innerHTML = '<span><b>The tool did not finish loading.</b> Club data ' +
          'could not be fetched, so the controls below will not respond. This is ' +
          'usually a dropped connection. <button type="button" class="btn btn--ghost btn--sm" ' +
          'id="mgRetryBoot">Reload</button></span>';
        var again = el('mgRetryBoot');
        if (again) again.addEventListener('click', function () { location.reload(); });
      }
    });
  };

  /* auth-guard may have fired before this script parsed. */
  if (window._toolDeferredSession) {
    window.TOOL.boot(window._toolDeferredSession);
  }
})();
</script>

</body>
</html>
