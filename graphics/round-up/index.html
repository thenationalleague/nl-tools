<!--
  NL Tools — Round Up Graphic (Graphics sub-tool)
  Version: v1.5 (24/10/2026)
  File: /graphics/round-up/index.html

  The Round Up card, powered by Dyno-Rod, in four sizes: 16:9 at 1920×1080
  (navy panel left, photo right) and 1:1, 4:5 and 9:16 (photo on top,
  navy panel below). The panel carries the title, the sponsor lockup and
  strapline, and the Enterprise National League badge. The only input is the
  photo: drop or choose it, then drag, pinch or slide to crop. Each size keeps
  its own crop. Drawn on a canvas: exports at each size's standard pixels,
  the preview at twice that so a retina screen doesn't stretch it.

  Storage: none. The photo never leaves the browser.
  Assets:
    /assets/crests/National League rose white.png   (watermark)
    /assets/partners/Dyno-Rod lockup white.png      (sponsor lockup, official)
    /assets/divisions/National.png                  (Enterprise NL badge)
    /graphics/_shared/fonts/Carbona-*.otf           (local, so the canvas has them)
  Access (auth-guard):
    toolKey 'staff-graphics' — same gate as the other graphics sub-tools.

  Changelog:
    v1.5 (24/10/2026) — 16:9 at 1920×1080 replaces the 1200×630 link card:
      the same layout scaled by 1080/630, so it matches the original.
    v1.4 (24/10/2026) — Sharp at the standard sizes. Large images (badge,
      logo, watermark, photo) are shrunk in halving steps to the exact pixel
      size they're drawn at, then placed on whole pixels; one 22-fold step
      at low quality was what made the badge rough. The preview draws at 2x
      so a retina screen no longer stretches it. Warns when the photo has
      fewer pixels than its crop needs. (v1.3, a 2x export, never shipped.)
    v1.2 (23/10/2026) — 9:16 centres its content in the panel again, with no
      gap held back at the bottom, and the photo takes more of the height.
    v1.1 (23/10/2026) — 1:1, 4:5 and 9:16 alongside the link card, each with
      its own layout and its own crop; download one or all four. Pinch and
      trackpad zoom. Official Dyno-Rod lockup replaces the one cut from the
      old JPG; the strapline is now set in type.
    v1.0 (23/10/2026) — first build.
-->

<div id="nlTopbar"></div>

<div id="pageWrap">
  <div class="page">

<script>
(function () {
  'use strict';

  /* Each size is a split: 'x' puts the panel on the left and the photo on the
     right (16:9); 'y' puts the photo on top and the panel below.
     `cut` is where the split falls, `band` the red band at the top of the
     panel, `s` the scale of the panel's content against the original
     1200×630 artwork it was measured from. 16:9 is that artwork scaled by
     1080/630, so it matches the original exactly. */
  var FORMATS = {
    '16x9':{ label: '16:9',     w: 1920, h: 1080, split: 'x', cut: 960,  band: 123, s: 1.714 },
    '1x1': { label: '1:1',      w: 1080, h: 1080, split: 'y', cut: 520,  band: 56, s: 1.05 },
    '4x5': { label: '4:5',      w: 1080, h: 1350, split: 'y', cut: 700,  band: 60, s: 1.25 },
    '9x16':{ label: '9:16',     w: 1080, h: 1920, split: 'y', cut: 1060, band: 70, s: 1.6 }
  };
  var ORDER = ['16x9', '1x1', '4x5', '9x16'];
  var ZOOM_MAX = 3;

  /* Layout is in each size's own pixels and exports at exactly that. The
     on-screen preview alone draws at twice, or a retina screen stretches it
     and it looks softer than the file you download. */
  var PREVIEW_SCALE = 2;

  /* The panel's content, as one stack measured at s = 1 from its top edge.
     Taken off the original 1200×630 artwork. */
  var STACK = {
    titleSize: 68, titleBase: 49,
    poweredSize: 32, poweredBase: 128,
    logoTop: 144, logoW: 436,
    strapBase: 288, strapW: 325,     /* strapline width matches the original */
    badgeTop: 336, badgeW: 110,
    height: 412
  };

  /* Dyno-Rod's own orange, from their logo file. A partner identity colour,
     not a brand token — it appears nowhere else in NL work. */
  var DYNO_ORANGE = '#e85527';

  var ASSETS = {
    rose:  '/assets/crests/National%20League%20rose%20white.png',
    dyno:  '/assets/partners/Dyno-Rod%20lockup%20white.png',
    badge: '/assets/divisions/National.png'
  };

  var state = { photo: null, fmt: '16x9', crops: {} };
  var art = {};
  var canvas, ctx;

  function el(id) { return document.getElementById(id); }

  /* Canvas can't read CSS variables, so take the brand tokens' resolved
     values rather than writing the hex out again here. */
  function token(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }

  function loadImage(src) {
    return new Promise(function (res) {
      var i = new Image();
      i.onload = function () { res(i); };
      i.onerror = function () { res(null); };
      i.src = src;
    });
  }

  /* True when the crop stretches the photo past its own pixels at 1x. Up
     to 2x it is only being drawn finer than it was taken, which is fine. */
  function isSoft(f) {
    if (!state.photo) return false;
    var r = photoRect(f, regions(f).photo);
    return state.photo.naturalWidth < r.w;
  }

  function resetCrops() {
    ORDER.forEach(function (f) { state.crops[f] = { zoom: 1, dx: 0, dy: 0 }; });
  }

  /* Where the photo and the panel sit in a given size. */
  function regions(f) {
    var F = FORMATS[f];
    if (F.split === 'x') {
      return { photo: { x: F.cut, y: 0, w: F.w - F.cut, h: F.h },
               panel: { x: 0, y: 0, w: F.cut, h: F.h } };
    }
    return { photo: { x: 0, y: 0, w: F.w, h: F.cut },
             panel: { x: 0, y: F.cut, w: F.w, h: F.h - F.cut } };
  }

  /* Cover-fit the photo into its region, then apply that size's zoom and
     drag offset. The offset is clamped so the region is never left bare. */
  function photoRect(f, box) {
    var p = state.photo, c = state.crops[f];
    var k = Math.max(box.w / p.naturalWidth, box.h / p.naturalHeight) * c.zoom;
    var dw = p.naturalWidth * k, dh = p.naturalHeight * k;
    var mx = (dw - box.w) / 2, my = (dh - box.h) / 2;
    c.dx = Math.max(-mx, Math.min(mx, c.dx));
    c.dy = Math.max(-my, Math.min(my, c.dy));
    return { x: box.x - mx + c.dx, y: box.y - my + c.dy, w: dw, h: dh };
  }

  /* Draw a large image small without losing it. One big drawImage step at
     the default ("low") quality is what crunched the badge: 2,400px straight
     to 110. Halve it until it's within 2x of the size it lands at, finish
     with one high-quality step, and place it on whole pixels so the canvas
     doesn't resample it again. Each size is kept, so dragging is cheap. */
  function drawArt(g, img, x, y, w, h, k) {
    var tw = Math.max(1, Math.round(w * k)), th = Math.max(1, Math.round(h * k));
    var cache = img._ruSized || (img._ruSized = {});
    var key = tw + 'x' + th;
    if (!cache[key]) {
      var keys = Object.keys(cache);
      if (keys.length > 12) delete cache[keys[0]];
      var src = img, sw = img.naturalWidth, sh = img.naturalHeight;
      while (sw / 2 >= tw && sh / 2 >= th) {
        var half = document.createElement('canvas');
        half.width = Math.round(sw / 2); half.height = Math.round(sh / 2);
        var hg = half.getContext('2d');
        hg.imageSmoothingQuality = 'high';
        hg.drawImage(src, 0, 0, half.width, half.height);
        src = half; sw = half.width; sh = half.height;
      }
      var out = document.createElement('canvas');
      out.width = tw; out.height = th;
      var og = out.getContext('2d');
      og.imageSmoothingQuality = 'high';
      og.drawImage(src, 0, 0, tw, th);
      cache[key] = out;
    }
    g.drawImage(cache[key], Math.round(x * k) / k, Math.round(y * k) / k, tw / k, th / k);
  }

  function render(g, f, k) {
    var F = FORMATS[f], R = regions(f), s = F.s, P = R.panel;
    var white = token('--white');
    g.setTransform(k, 0, 0, k, 0, 0);
    g.imageSmoothingEnabled = true;
    g.imageSmoothingQuality = 'high';

    /* Photo */
    g.fillStyle = token('--navy-100');
    g.fillRect(R.photo.x, R.photo.y, R.photo.w, R.photo.h);
    if (state.photo) {
      var r = photoRect(f, R.photo);
      g.save();
      g.beginPath(); g.rect(R.photo.x, R.photo.y, R.photo.w, R.photo.h); g.clip();
      drawArt(g, state.photo, r.x, r.y, r.w, r.h, k);
      g.restore();
    } else {
      g.fillStyle = token('--text-muted');
      g.font = (30 * s) + 'px RUCarbonaBold, sans-serif';
      g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText('Add a photo', R.photo.x + R.photo.w / 2, R.photo.y + R.photo.h / 2);
    }

    /* Navy panel and rose watermark below the red band */
    var body = { x: P.x, y: P.y + F.band, w: P.w, h: P.h - F.band };
    g.fillStyle = token('--navy');
    g.fillRect(body.x, body.y, body.w, body.h);
    if (art.rose) {
      g.save();
      g.beginPath(); g.rect(body.x, body.y, body.w, body.h); g.clip();
      g.globalAlpha = 0.06;
      var rh = Math.max(body.h * 1.18, 660 * s);
      var rw = rh * art.rose.naturalWidth / art.rose.naturalHeight;
      drawArt(g, art.rose, body.x + body.w / 2 - rw / 2 - 20 * s, body.y + body.h / 2 - rh / 2 + 15 * s, rw, rh, k);
      g.restore();
    }
    g.fillStyle = token('--primary');
    g.fillRect(P.x, P.y, P.w, F.band);

    /* Content stack, centred in the panel body */
    var cx = body.x + body.w / 2;
    var top = body.y + (body.h - STACK.height * s) / 2;
    g.fillStyle = white;
    g.textAlign = 'center'; g.textBaseline = 'alphabetic';
    g.font = (STACK.titleSize * s) + 'px RUCarbonaExtraBold, sans-serif';
    g.fillText('The Round Up', cx, top + STACK.titleBase * s);
    g.font = (STACK.poweredSize * s) + 'px RUCarbonaBold, sans-serif';
    g.fillText('Powered by', cx, top + STACK.poweredBase * s);

    if (art.dyno) {
      var lw = STACK.logoW * s, lh = lw * art.dyno.naturalHeight / art.dyno.naturalWidth;
      drawArt(g, art.dyno, cx - lw / 2, top + STACK.logoTop * s, lw, lh, k);
    }
    drawStrap(g, cx, top + STACK.strapBase * s, STACK.strapW * s);

    if (art.badge) {
      var bw = STACK.badgeW * s, bh = bw * art.badge.naturalHeight / art.badge.naturalWidth;
      drawArt(g, art.badge, cx - bw / 2, top + STACK.badgeTop * s, bw, bh, k);
    }
  }

  /* "Driven by Passion" is set in type, slanted to sit with the logo's
     italic, and sized to a fixed width so it stays in proportion. */
  function drawStrap(g, cx, base, width) {
    var text = 'Driven by Passion';
    g.save();
    g.font = '100px RUCarbonaExtraBold, sans-serif';
    var size = 100 * width / g.measureText(text).width;
    g.font = size + 'px RUCarbonaExtraBold, sans-serif';
    g.fillStyle = DYNO_ORANGE;
    g.textAlign = 'center'; g.textBaseline = 'alphabetic';
    g.translate(cx, base);
    g.transform(1, 0, -0.2, 1, 0, 0);
    g.fillText(text, 0, 0);
    g.restore();
  }

  function draw() {
    var F = FORMATS[state.fmt];
    if (canvas.width !== F.w * PREVIEW_SCALE) canvas.width = F.w * PREVIEW_SCALE;
    if (canvas.height !== F.h * PREVIEW_SCALE) canvas.height = F.h * PREVIEW_SCALE;
    render(ctx, state.fmt, PREVIEW_SCALE);
    el('ruSoft').hidden = !isSoft(state.fmt);
    el('ruZoom').value = state.crops[state.fmt].zoom;
    [].forEach.call(el('ruFormats').children, function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.fmt === state.fmt));
    });
  }

  function setZoom(z) {
    state.crops[state.fmt].zoom = Math.max(1, Math.min(ZOOM_MAX, z));
    draw();
  }

  function setPhoto(file) {
    if (!file || !/^image\//.test(file.type)) {
      NL.toast('That file isn’t an image.', 'error');
      return;
    }
    var url = URL.createObjectURL(file);
    loadImage(url).then(function (img) {
      URL.revokeObjectURL(url);
      if (!img) { NL.toast('That image couldn’t be opened.', 'error'); return; }
      state.photo = img;
      resetCrops();
      ['ruZoom', 'ruReset', 'ruDownload', 'ruDownloadAll'].forEach(function (id) { el(id).disabled = false; });
      canvas.classList.add('has-photo');
      draw();
    });
  }

  /* One finger or the mouse drags; two fingers pinch. Pointer events cover
     mouse, touch and pen alike. */
  function wireGestures() {
    var pts = {}, drag = null, pinch = null;

    /* Screen pixels to the size's own units, which the crop offsets are in. */
    function scale() { return FORMATS[state.fmt].w / canvas.getBoundingClientRect().width; }
    function two() {
      var ids = Object.keys(pts);
      return ids.length === 2 ? [pts[ids[0]], pts[ids[1]]] : null;
    }
    function dist(p) { return Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y); }

    canvas.addEventListener('pointerdown', function (e) {
      if (!state.photo) return;
      canvas.setPointerCapture(e.pointerId);
      pts[e.pointerId] = { x: e.clientX, y: e.clientY };
      var c = state.crops[state.fmt], p = two();
      if (p) { drag = null; pinch = { d: dist(p), zoom: c.zoom }; }
      else { drag = { x: e.clientX, y: e.clientY, dx: c.dx, dy: c.dy }; }
      canvas.classList.add('is-dragging');
    });
    canvas.addEventListener('pointermove', function (e) {
      if (!pts[e.pointerId]) return;
      pts[e.pointerId] = { x: e.clientX, y: e.clientY };
      var c = state.crops[state.fmt], p = two();
      if (pinch && p) { setZoom(pinch.zoom * dist(p) / pinch.d); return; }
      if (drag) {
        var k = scale();
        c.dx = drag.dx + (e.clientX - drag.x) * k;
        c.dy = drag.dy + (e.clientY - drag.y) * k;
        draw();
      }
    });
    function end(e) {
      delete pts[e.pointerId];
      pinch = null;
      /* Lifting one finger of a pinch carries on as a drag from where it is. */
      var ids = Object.keys(pts), c = state.crops[state.fmt];
      drag = ids.length === 1 ? { x: pts[ids[0]].x, y: pts[ids[0]].y, dx: c.dx, dy: c.dy } : null;
      if (!ids.length) canvas.classList.remove('is-dragging');
    }
    canvas.addEventListener('pointerup', end);
    canvas.addEventListener('pointercancel', end);

    /* A trackpad pinch arrives as a wheel event with ctrlKey set; a mouse
       wheel without it. Both zoom. */
    canvas.addEventListener('wheel', function (e) {
      if (!state.photo) return;
      e.preventDefault();
      setZoom(state.crops[state.fmt].zoom * Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0015)));
    }, { passive: false });
  }

  function wireDrop() {
    var box = el('ruDrop');
    ['dragenter', 'dragover'].forEach(function (t) {
      box.addEventListener(t, function (e) { e.preventDefault(); box.classList.add('is-over'); });
    });
    ['dragleave', 'drop'].forEach(function (t) {
      box.addEventListener(t, function (e) { e.preventDefault(); box.classList.remove('is-over'); });
    });
    box.addEventListener('drop', function (e) {
      var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      if (f) setPhoto(f);
    });
  }

  function buildFormatButtons() {
    ORDER.forEach(function (f) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'ru-fmt';
      b.dataset.fmt = f;
      b.innerHTML = '<b>' + FORMATS[f].label + '</b><span>' + FORMATS[f].w + ' × ' + FORMATS[f].h + '</span>';
      b.addEventListener('click', function () { state.fmt = f; draw(); });
      el('ruFormats').appendChild(b);
    });
  }

  function fileName(f) {
    var d = new Date();
    function p(n) { return (n < 10 ? '0' : '') + n; }
    return 'Round Up - ' + FORMATS[f].label.replace(':', 'x') + ' - ' +
      p(d.getDate()) + '-' + p(d.getMonth() + 1) + '-' + d.getFullYear() + '.png';
  }

  /* Each size is drawn on its own off-screen canvas, so downloading all four
     never flickers the preview. */
  function save(f) {
    return new Promise(function (resolve) {
      var c = document.createElement('canvas');
      c.width = FORMATS[f].w; c.height = FORMATS[f].h;
      render(c.getContext('2d'), f, 1);
      try {
        c.toBlob(function (blob) {
          if (blob) NL.download(fileName(f), blob, 'image/png');
          else NL.toast('The ' + FORMATS[f].label + ' PNG couldn’t be made. Try again.', 'error');
          resolve();
        }, 'image/png');
      } catch (err) {
        NL.toast('The PNG couldn’t be made: ' + err.message, 'error');
        resolve();
      }
    });
  }

  function saveAll() {
    return ORDER.reduce(function (chain, f) {
      return chain.then(function () { return save(f); }).then(function () {
        /* Browsers drop downloads that arrive too close together. */
        return new Promise(function (r) { setTimeout(r, 400); });
      });
    }, Promise.resolve());
  }

  window.TOOL = window.TOOL || {};
  window.TOOL.boot = function () {
    canvas = el('ruCanvas');
    ctx = canvas.getContext('2d');
    resetCrops();
    buildFormatButtons();

    el('ruFile').addEventListener('change', function () { setPhoto(this.files[0]); this.value = ''; });
    el('ruZoom').addEventListener('input', function () { setZoom(+this.value); });
    el('ruReset').addEventListener('click', function () {
      state.crops[state.fmt] = { zoom: 1, dx: 0, dy: 0 }; draw();
    });
    el('ruDownload').addEventListener('click', function () { save(state.fmt); });
    el('ruDownloadAll').addEventListener('click', saveAll);
    wireGestures();
    wireDrop();

    /* No glyph or logo is drawn until the fonts and art have arrived, so the
       first frame is already the finished card. */
    var fonts = document.fonts ? Promise.all([
      document.fonts.load('68px "RUCarbonaExtraBold"'),
      document.fonts.load('32px "RUCarbonaBold"')
    ]).catch(function () {}) : Promise.resolve();
    var images = Object.keys(ASSETS).map(function (k) {
      return loadImage(ASSETS[k]).then(function (img) { art[k] = img; });
    });
    Promise.all([fonts].concat(images)).then(draw);
  };

  if (window._toolDeferredSession) {
    window.TOOL.boot(window._toolDeferredSession);
    delete window._toolDeferredSession;
  }
})();
</script>

</body>
</html>
