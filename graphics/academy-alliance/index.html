<!DOCTYPE html>
<!--
  Academy & Alliance Graphic — NL Tools (Graphics sub-tool)
  Version: v1.4 (11/09/2026)
  File: /graphics/academy-alliance/index.html

  Fixtures, results and league-table graphics for the National League
  Football Academy (2 divisions) and the U19 Alliance (9 divisions). No
  feed: rows are copied off FA Full-Time (or anywhere) and pasted — the
  paste box understands Full-Time's table, fixtures and results layouts as
  they copy. A feed was built and retired on 11/09/2026; see
  system/retired/academy-alliance-fulltime-feed.md before proposing one. Either way the names are reduced to the sides
  the Divisional Constitution lists, and the card exports as a 1:1 / 4:5 /
  9:16 PNG. Crests are a toggle — many of these sides have no badge on file.

  Storage:
    localStorage nl-academy-alliance-gfx-v1   (tool state only — no RTDB)
  Data:
    Divisional Constitution 2026-27 → the eleven team lists in app.js
    NL.clubs (canon) → /assets/data/clubs-meta.json  (crest records)
    /assets/crests/medium/*                          (crests, by printed name)
    /assets/divisions/medium/NL Football Academy.png, NL U19 Alliance.png
  Access (auth-guard):
    toolKey 'staff-graphics' — same gate as the other graphics sub-tools.

  Changelog:
    v1.4 (11/09/2026) — Portrait and story tables use three stat columns
      (P, GD, Pts) so rows grow tall with big type and a short table fills
      the card instead of floating in white. Burgess Hill Town.
    v1.3 (11/09/2026) — Feed removed; paste only. A table copied off the
      Full-Time table page (home / away / overall columns) reads the overall
      figures.
    v1.2 (11/09/2026) — Sync bookmarklet replaces the Cloud Function: run
      on any Full-Time page it fetches all eleven divisions and hands them
      to this page in a popup, which parses and saves them. Refresh is gone.
    v1.1 (10/09/2026) — Full-Time feed: Load a division's table, results or
      fixtures from RTDB, date pickers for results/fixtures, Refresh asks the
      function to fetch now. Paste stays as the other source.
    v1.0 (10/09/2026) — first build.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Academy &amp; Alliance Graphic — NL Tools</title>
<meta name="robots" content="noindex,nofollow">

<!-- Firebase compat SDK — must load + init BEFORE auth-guard.js -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

    authDomain:        "nl-tools.firebaseapp.com",
    databaseURL:       "https://nl-tools-default-rtdb.europe-west1.firebasedatabase.app",
    projectId:         "nl-tools",
    storageBucket:     "nl-tools.firebasestorage.app",

<!-- Portal brand + graphic tokens/fonts + the graphic artwork CSS -->
<link rel="stylesheet" href="/system/nl-brand.css?v=65">
<link rel="stylesheet" href="/graphics/_shared/brand-graphic.css">
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js"></script>

<!-- Tool identity + changelog. Keep window.NL_TOOL and NL_TOOL_KEY in sync. -->
<script>
  window.NL_TOOL = {
    title: 'Academy & Alliance Graphic',
    toolKey: 'staff-graphics'
  };
  var NL_TOOL_KEY = 'staff-graphics';

  window.NL_CHANGELOG = [
    {
      date: '11/09/2026',
      version: 'v1.4',
      items: [
        'Tables at 4:5 and 9:16 now print P, GD and Pts only, so the rows grow tall with big type and a nine-team table fills the card rather than sitting in a band of white. 1:1 keeps all eight columns.',
        'Burgess Hill Town is named in full and picks up its crest.'
      ]
    },
    {
      date: '11/09/2026',
      version: 'v1.3',
      items: [
        'The feed is gone. Copy the table, fixtures or results off Full-Time and paste them — the box understands all three layouts as they copy, including a table with its Home, Away and Overall columns.'
      ]
    },
    {
      date: '11/09/2026',
      version: 'v1.2',
      items: [
        'The feed now comes from a bookmark. Drag "Sync Full-Time" from the Load from Full-Time card to your bookmarks bar; on any Full-Time page, click it and every division\'s table, results and fixtures arrive here within about half a minute. Full-Time refuses requests from servers, so this runs in your browser instead.',
        'Refresh is gone — the bookmark is the refresh. The line under Load still says when the copy was made and what, if anything, is missing.'
      ]
    },
    {
      date: '10/09/2026',
      version: 'v1.1',
      items: [
        'Rows can now come from FA Full-Time. A switch at the top chooses The feed or Typed in; with the feed, pick the division, pick a date (or a run of dates) for fixtures and results, and press Load. The table loads whole.',
        'Refresh asks for that division to be fetched from Full-Time straight away, rather than waiting for the hourly update. The line under the buttons says when the stored copy was last fetched.',
        'Postponed matches are left out of a loaded fixtures card, and the status line says how many.'
      ]
    },
    {
      date: '10/09/2026',
      version: 'v1.0',
      items: [
        'Fixtures, results and table graphics for the Football Academy (North and South) and the U19 Alliance (Divisions A to I) — one dropdown picks the division, which sets the badge and the title line.',
        'Everything is pasted: a fixture list (Home v Away, or Home 2-1 Away, one per line — a line on its own becomes a heading) or a table copied straight from the published standings.',
        'Pasted names are reduced to the side the Divisional Constitution lists, so "Hartlepool United FC U19 Hartlepool Unit" prints as Hartlepool United. Any printed name can still be overridden in the grid.',
        'Crests are a toggle. A side with a club record draws that crest; any other side draws a crest named after it from the crests folder, if one exists.',
        'An asterisk on a points total in the paste marks the row as adjusted and adds a footnote, which can be reworded.',
        '1:1, 4:5 and 9:16 PNG export, as the other graphics.'
      ]
    }
  ];

  /* auth-guard fires this once the session is verified and #pageWrap is
     revealed — boot the app here so the preview measures a visible stage. */
  window.nlAuthReady = function (userData) {
    window.NL = window.NL || {};
    window.NL.session = userData;
    if (window.TOOL && window.TOOL.boot) window.TOOL.boot(userData);
    else window._toolDeferredSession = userData;
  };
</script>

<script src="/system/nl-utils.js?v=47"></script>
<script src="/system/nl-topbar.js?v=10"></script>
<script src="/system/auth-guard.js?v=16"></script>

<style>
  html, body { background: var(--nl-grey-100); color: var(--nl-ink); }
  body { font-family: var(--font-regular); }

  .seg { display: flex; width: 100%; border: 1px solid var(--nl-grey-300); border-radius: var(--radius-sm); overflow: hidden; }
  .seg button {
    flex: 1 1 0; text-align: center;
    border: none; background: var(--nl-white); color: var(--nl-grey-700);
    font-family: var(--font-bold); font-size: var(--text-sm); letter-spacing: var(--tracking-wide);
    text-transform: uppercase; padding: 8px 12px; cursor: pointer;
    transition: background var(--dur-fast) var(--ease-standard);
  }
  .seg button + button { border-left: 1px solid var(--nl-grey-300); }
  .seg button:hover { background: var(--nl-grey-100); }
  .seg button.active { background: var(--nl-rose-red); color: #fff; }

  .tool {
    display: grid; grid-template-columns: minmax(0, 1fr) 500px;
    gap: 24px; align-items: start; max-width: 1680px; margin: 0 auto; padding: 24px;
  }
  @media (max-width: 1100px) { .tool { grid-template-columns: minmax(0, 1fr); } }

  .preview {
    min-width: 0;
    position: sticky; top: 84px; background: var(--nl-white);
    border: 2px solid var(--nl-ink); border-radius: var(--radius-lg);
    padding: 20px; box-shadow: var(--shadow-md);
  }
  /* single column stacks the preview above the controls; pinned there it
     would paint over everything scrolling beneath it */
  @media (max-width: 1100px) { .preview { position: static; } }

  .preview-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .preview-head .eyebrow { color: var(--nl-league-navy); font-family: var(--font-bold);
    font-size: var(--text-xs); letter-spacing: var(--tracking-wider); text-transform: uppercase; }
  .stage-wrap { width: 100%; display: flex; justify-content: center; }
  #gfxHost { position: relative; box-shadow: 0 12px 44px rgba(0,0,0,0.20), 0 2px 8px rgba(0,0,0,0.12); }

  .panel { display: flex; flex-direction: column; gap: 16px; }
  .card { background: var(--nl-white); border: 1px solid var(--nl-grey-200); border-radius: var(--radius-md); padding: 16px; }
  .card h2 { font-family: var(--font-bold); font-size: var(--text-sm); letter-spacing: var(--tracking-wider);
    text-transform: uppercase; color: var(--nl-grey-500); margin: 0 0 12px; }

  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
  .field:last-child { margin-bottom: 0; }
  .field label { font-family: var(--font-bold); font-size: var(--text-xs); letter-spacing: var(--tracking-wide);
    text-transform: uppercase; color: var(--nl-grey-700); }
  .field.check { flex-direction: row; align-items: center; gap: 8px; }
  .field.check input { width: 16px; height: 16px; margin: 0; accent-color: var(--nl-rose-red); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 560px) { .row2 { grid-template-columns: 1fr; } }
  select, input[type="text"], textarea {
    width: 100%; padding: 9px 11px; border: 1px solid var(--nl-grey-300); border-radius: var(--radius-sm);
    background: var(--nl-white); font-family: var(--font-regular); font-size: var(--text-sm); color: var(--nl-ink);
  }
  select:focus, input:focus, textarea:focus { outline: none; border-color: var(--nl-rose-red); box-shadow: 0 0 0 3px var(--nl-red-100); }
  textarea { resize: vertical; line-height: 1.4; font-size: var(--text-xs); }

  /* Buttons are the canon .btn / .btn--primary / .btn--ghost from nl-brand.css */
  .btns { display: flex; gap: 8px; }
  #downloadBtn { flex: 1; }

  /* ---- editor grids ---- */
  .grid-scroller { max-height: 460px; overflow: auto; border: 1px solid var(--nl-grey-200); border-radius: var(--radius-sm); }
  table.grid { width: 100%; border-collapse: collapse; font-size: var(--text-sm); }
  .grid thead th { position: sticky; top: 0; z-index: 2; background: var(--nl-navy-900); color: #fff;
    font-family: var(--font-bold); font-size: var(--text-xs); letter-spacing: var(--tracking-wide);
    text-transform: uppercase; text-align: left; padding: 8px 6px; white-space: nowrap; }
  .grid tbody td { border-bottom: 1px solid var(--nl-grey-100); padding: 4px 5px; vertical-align: top; }
  .grid .g-idx { text-align: center; font-family: var(--font-bold); color: var(--nl-grey-500); padding-top: 10px; }
  .grid input { padding: 6px 7px; font-size: var(--text-sm); min-width: 0; width: 100%;
    border: 1px solid var(--nl-grey-300); border-radius: var(--radius-sm); font-family: var(--font-regular); }
  .grid .g-team { min-width: 150px; }
  .grid .g-label { min-width: 120px; }
  .grid .g-sc, .grid .g-num { width: 40px; text-align: center; }
  .grid .g-ko { width: 56px; text-align: center; }
  .grid .g-adj { text-align: center; padding-top: 10px; }
  .grid .g-adj input { width: 15px; height: 15px; accent-color: var(--nl-rose-red); }
  /* what the graphic will print for this row, under the pasted name */
  .grid .hint { display: block; margin-top: 3px; font-size: var(--text-xs); color: var(--nl-grey-500);
    font-family: var(--font-bold); text-transform: uppercase; letter-spacing: var(--tracking-wide); white-space: nowrap; }
  .grid .hint.ok { color: var(--nl-league-navy); }
  .grid .g-del, .grid .g-ins { border: none; background: var(--nl-grey-100); color: var(--nl-grey-700);
    width: 24px; height: 24px; border-radius: var(--radius-sm); cursor: pointer; font-size: var(--text-sm); line-height: 1; margin-top: 4px; }
  .grid .g-ins { color: var(--nl-navy-500); width: 22px; }
  .grid .g-del:hover, .grid .g-ins:hover { background: var(--nl-red-100); color: var(--nl-rose-red); }
  .grid .divider-row td { background: var(--nl-red-100); }
  .grid .g-div { font-family: var(--font-bold); text-transform: uppercase; letter-spacing: var(--tracking-wide); color: var(--nl-rose-red); }
  table#fxGrid { min-width: 560px; }
  table#tbGrid { min-width: 820px; }

  /* one editor at a time; scores only make sense for results */
  body[data-type="table"] #fxEditor, body[data-type="table"] #fxHeadings { display: none; }
  body:not([data-type="table"]) #tbEditor, body:not([data-type="table"]) #footnoteField { display: none; }
  body[data-type="fixtures"] .col-score { display: none; }
  body[data-type="results"] .col-ko { display: none; }

  footer.status { display: flex; justify-content: space-between; align-items: center;
    font-family: var(--font-bold); font-size: var(--text-xs); letter-spacing: var(--tracking-wide);
    text-transform: uppercase; color: var(--nl-grey-500); padding-top: 4px; }
</style>
</head>
<body data-type="fixtures">

<div id="pageWrap">

<!-- Standard NL topbar — auto-rendered by /system/nl-topbar.js -->
<div id="nlTopbar"></div>

<div class="tool">

  <!-- PREVIEW -->
  <div class="preview">
    <div class="preview-head">
      <span class="eyebrow">Live preview</span>
    </div>
    <div class="stage-wrap" id="stageWrap">
      <div id="gfxHost"></div>
    </div>
  </div>

  <!-- CONTROLS -->
  <div class="panel">

    <div class="card">
      <h2>Setup</h2>
      <div class="field">
        <label for="divisionSel">Division</label>
        <select id="divisionSel"></select>
      </div>
      <div class="row2">
        <div class="field">
          <label>Type</label>
          <div class="seg" id="typeSeg">
            <button type="button" class="type-btn active" data-type="fixtures">Fixtures</button>
            <button type="button" class="type-btn" data-type="results">Results</button>
            <button type="button" class="type-btn" data-type="table">Table</button>
          </div>
        </div>
        <div class="field">
          <label>Size</label>
          <div class="seg" id="sizeSeg">
            <button type="button" class="size-btn active" data-fmt="1x1">1:1</button>
            <button type="button" class="size-btn" data-fmt="4x5">4:5</button>
            <button type="button" class="size-btn" data-fmt="9x16">9:16</button>
          </div>
        </div>
      </div>
      <div class="row2">
        <div class="field">
          <label for="titleInput">Title</label>
          <input type="text" id="titleInput" placeholder="Fixtures — or a matchday number">
        </div>
        <div class="field">
          <label for="seasonInput">Season</label>
          <input type="text" id="seasonInput" placeholder="2026-27">
        </div>
      </div>
      <div class="field" id="footnoteField">
        <label for="footnoteInput">Footnote</label>
        <input type="text" id="footnoteInput" placeholder="* Points adjusted">
      </div>
      <div class="field check">
        <input type="checkbox" id="crestToggle" checked>
        <label for="crestToggle">Crests</label>
      </div>
    </div>

    <div class="card">
      <h2>Paste</h2>
      <textarea id="pasteIn" rows="8"></textarea>
    </div>

    <div class="card">
      <h2>Editor</h2>
      <div class="grid-scroller" id="fxEditor">
        <table class="grid" id="fxGrid">
          <thead><tr>
            <th style="width:24px"></th>
            <th>Home</th>
            <th class="col-score">H</th><th class="col-score">A</th>
            <th>Away</th><th class="col-ko">KO</th><th style="width:30px"></th>
          </tr></thead>
          <tbody id="fxBody"></tbody>
        </table>
      </div>
      <div class="grid-scroller" id="tbEditor">
        <table class="grid" id="tbGrid">
          <thead><tr>
            <th style="width:24px">#</th>
            <th>Team as pasted</th>
            <th>Prints as</th>
            <th>P</th><th>W</th><th>D</th><th>L</th><th>F</th><th>A</th><th>GD</th><th>Pts</th>
            <th title="Points adjusted">*</th>
            <th style="width:30px"></th>
          </tr></thead>
          <tbody id="tbBody"></tbody>
        </table>
      </div>
      <datalist id="teamList"></datalist>
    </div>

    <div class="btns">
      <button type="button" class="btn btn--primary" id="downloadBtn">Download PNG</button>
      <button type="button" class="btn btn--ghost" id="resetBtn">Reset</button>
    </div>

    <footer class="status">
      <span id="status">Ready</span>
    </footer>

  </div>
</div>

</div><!-- /#pageWrap -->

<script src="app.js"></script>

</body>
</html>
