<!DOCTYPE html>
<!--
  League Table Graphic — NL Tools (Graphics sub-tool)
  Version: v1.6 (28/08/2026)
  File: /graphics/table-graphic/index.html

  On-brand league-table social graphic (Broadsheet design). The table comes
  either from National League Services or from a pasted CSV/TSV → live
  preview → 1:1 / 4:5 / 9:16 PNG export. Gated to NL Staff via the shared
  graphics tool key.

  NLS carries no qualification zones, so champion / play-off / relegation
  marks stay the operator's call — per row in the grid, or filled from the
  standings in one press.

  Storage:
    localStorage nl-table-gfx-v1   (tool state only — no RTDB)
  Data:
    NLS league-tables API (public, no auth) — the standings themselves.
      Clubs match on clubs-meta optaID, which is the NLS teamID.
    /assets/data/clubs-meta.json           (live club list / short names)
    /assets/crests|divisions|partners/*     (crests, Enterprise lockups, TIC Health)
  Access (auth-guard):
    toolKey 'staff-graphics' — same gate as the other graphics sub-tools.

  This replaced graphics/league-tables, retired 28/08/2026 once this tool
  covered everything it did and more — see system/retired/league-tables.md.
  Its Broadsheet zone palette is now the canon one (NL.positionBands).
-->

<style>
  html, body { background: var(--nl-grey-100); color: var(--nl-ink); }
  body { font-family: var(--font-regular); }

  /* ---- segmented control (Size / Type) — lives in the right-hand panel ---- */
  .seg { display: flex; width: 100%; border: 1px solid var(--nl-grey-300); border-radius: var(--radius-sm); overflow: hidden; }
  .seg button {
    flex: 1 1 0; text-align: center;
    border: none; background: var(--nl-white); color: var(--nl-grey-700);
    font-family: var(--font-bold); font-size: var(--text-sm); letter-spacing: var(--tracking-wide);
    text-transform: uppercase; padding: 8px 12px; cursor: pointer;
    transition: background var(--dur-fast) var(--ease-standard);
  }
  .seg button + button { border-left: 1px solid var(--nl-grey-300); }
  .seg button:hover { background: var(--nl-grey-100); }
  .seg button.active { background: var(--nl-rose-red); color: var(--nl-white); }

  .tool {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 460px;
    gap: 24px;
    align-items: start;
    max-width: 1640px;
    margin: 0 auto;
    padding: 24px;
  }
  @media (max-width: 1100px) { .tool { grid-template-columns: minmax(0, 1fr); } }

  /* preview */
  .preview {
    min-width: 0;
    position: sticky; top: 84px;
    background: var(--nl-white);
    border: 2px solid var(--nl-ink);
    border-radius: var(--radius-lg);
    padding: 20px;
    box-shadow: var(--shadow-md);
  }
  /* Must stay BELOW the .preview rule above: same specificity, so source order
     decides. Single column stacks the preview on top of the controls, and a
     pinned preview then paints over whatever scrolls beneath it. */
  @media (max-width: 1100px) { .preview { position: static; } }

  .preview-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 14px;
  }
  .preview-head .eyebrow { color: var(--nl-league-navy); }
  .preview-head .fmt-pills { display: flex; gap: 6px; }
  .stage-wrap { width: 100%; display: flex; justify-content: center; }
  #gfxHost { position: relative; box-shadow: 0 12px 44px rgba(0,0,0,0.20), 0 2px 8px rgba(0,0,0,0.12); }

  /* control panel */
  .panel { display: flex; flex-direction: column; gap: 16px; }
  .card {
    background: var(--nl-white);
    border: 1px solid var(--nl-grey-200);
    border-radius: var(--radius-md);
    padding: 16px;
  }
  .card h2 {
    font-family: var(--font-bold); font-size: var(--text-sm); letter-spacing: var(--tracking-wider);
    text-transform: uppercase; color: var(--nl-grey-500); margin: 0 0 12px;
  }

  .dir-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .dir-btn {
    border: 1.5px solid var(--nl-grey-300); background: var(--nl-white);
    border-radius: var(--radius-sm); padding: 12px 8px; cursor: pointer;
    font-family: var(--font-bold); text-align: left; transition: all var(--dur-fast) var(--ease-standard);
  }
  .dir-btn .n { display:block; font-size: var(--text-xs); color: var(--nl-grey-500); letter-spacing: var(--tracking-wide); }
  .dir-btn .t { display:block; font-size: var(--text-sm); color: var(--nl-ink); margin-top: 3px; }
  .dir-btn:hover { border-color: var(--nl-league-navy); }
  .dir-btn.active { border-color: var(--nl-rose-red); border-width: 2px; box-shadow: 0 0 0 3px var(--nl-red-100); }

  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
  .field:last-child { margin-bottom: 0; }
  .field label {
    font-family: var(--font-bold); font-size: var(--text-xs); letter-spacing: var(--tracking-wide);
    text-transform: uppercase; color: var(--nl-grey-700);
  }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  select, input[type="text"], textarea {
    width: 100%; padding: 9px 11px; border: 1px solid var(--nl-grey-300);
    border-radius: var(--radius-sm); background: var(--nl-white);
    font-family: var(--font-regular); font-size: var(--text-sm); color: var(--nl-ink);
  }
  select:focus, input:focus, textarea:focus {
    outline: none; border-color: var(--nl-rose-red); box-shadow: 0 0 0 3px var(--nl-red-100);
  }
  textarea { resize: vertical; line-height: 1.4; font-size: var(--text-xs); }

  .btns { display: flex; gap: 8px; }
  .btn {
    border: none; border-radius: var(--radius-sm); padding: 11px 16px; cursor: pointer;
    font-family: var(--font-bold); font-size: var(--text-sm); letter-spacing: var(--tracking-wide);
    transition: filter var(--dur-fast) var(--ease-standard);
  }
  .btn:hover { filter: brightness(0.93); }
  .btn--primary { background: var(--nl-rose-red); color: var(--nl-white); flex: 1; }
  .btn--navy { background: var(--nl-league-navy); color: var(--nl-white); }
  .btn--ghost { background: var(--nl-grey-100); color: var(--nl-grey-700); }

  .fmt-pills .btn { padding: 6px 10px; font-size: var(--text-xs); }

  /* grid editor */
  .grid-scroller { max-height: 460px; overflow: auto; border: 1px solid var(--nl-grey-200); border-radius: var(--radius-sm); }
  /* Fixed layout: without it the intrinsic widths pushed the table to 527px
     inside a 424px panel, so the editor scrolled sideways even on a full
     desktop. The header cells below carry the column widths. */
  table.grid { width: 100%; table-layout: fixed; border-collapse: collapse; font-size: var(--text-sm); }
  .grid thead th {
    position: sticky; top: 0; z-index: 2; background: var(--nl-navy-900); color: var(--nl-white);
    font-family: var(--font-bold); font-size: var(--text-xs); letter-spacing: var(--tracking-wide);
    text-transform: uppercase; text-align: left; padding: 8px; white-space: nowrap;
  }
  .grid tbody td { border-bottom: 1px solid var(--nl-grey-100); padding: 4px 5px; overflow: hidden; }
  .grid .g-pos { text-align: center; font-family: var(--font-bold); color: var(--nl-grey-500); }
  .grid input { padding: 6px 7px; font-size: var(--text-sm); }
  /* .nl-select sets everything but width — the canon leaves that to the tool. */
  .grid select, .grid input { width: 100%; min-width: 0; max-width: 100%; }
  .grid .g-num { text-align: center; }
  /* Below the breakpoint the panel is ~306px wide, which would squeeze the
     club column to nothing. Hold a readable width and let the scroller carry
     it sideways there — where a sideways nudge is expected — rather than on
     the desktop, where it is not. */
  @media (max-width: 560px) { table.grid { min-width: 470px; } }

  footer.status {
    display: flex; justify-content: space-between; align-items: center;
    font-family: var(--font-bold); font-size: var(--text-xs); letter-spacing: var(--tracking-wide);
    text-transform: uppercase; color: var(--nl-grey-500); padding-top: 4px;
  }
  .note { font-size: var(--text-xs); color: var(--nl-grey-500); line-height: 1.5; font-family: var(--font-regular); }
  /* one source at a time — the grid editor below is shared by both */
  body[data-source="manual"] #nlsCard { display: none; }
  body[data-source="feed"] #pasteCard { display: none; }
</style>
</head>
<body data-source="feed">

<div id="pageWrap">

<!-- Standard NL topbar — auto-rendered by /system/nl-topbar.js -->
<div id="nlTopbar"></div>

<div class="tool">

  <!-- PREVIEW -->
  <div class="preview">
    <div class="preview-head">
      <span class="eyebrow">Live preview</span>
    </div>
    <div class="stage-wrap" id="stageWrap">
      <div id="gfxHost"></div>
    </div>
  </div>

  <!-- CONTROLS -->
  <div class="panel">

    <div class="card">
      <h2>Setup</h2>
      <div class="field">
        <label>Table from</label>
        <div class="seg" id="sourceSeg">
          <button type="button" class="src-btn active" data-src="feed">The feed</button>
          <button type="button" class="src-btn" data-src="manual">Typed in</button>
        </div>
      </div>
      <div class="row2">
        <div class="field">
          <label for="divisionSel">Division</label>
          <select id="divisionSel">
            <option value="National">National League</option>
            <option value="North">National League North</option>
            <option value="South">National League South</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label for="matchdaySel">Matchday</label>
        <select id="matchdaySel"></select>
      </div>
      <div class="field">
        <label for="subIn">Season</label>
        <input type="text" id="subIn" maxlength="48">
      </div>
    </div>

    <div class="card">
      <h2>Format</h2>
      <div class="field">
        <label>Size</label>
        <div class="seg" id="sizeSeg">
          <button type="button" class="size-btn active" data-fmt="1x1">1:1</button>
          <button type="button" class="size-btn" data-fmt="4x5">4:5</button>
          <button type="button" class="size-btn" data-fmt="9x16">9:16</button>
        </div>
      </div>
    </div>

    <div class="card" id="nlsCard">
      <h2>Load from National League Services</h2>
      <div class="btns">
        <button type="button" class="btn btn--primary" id="nlsLoadBtn">Load current table</button>
      </div>
    </div>

    <div class="card" id="pasteCard">
      <h2>Paste table (CSV / TSV)</h2>
      <textarea id="pasteIn" rows="7" placeholder="Paste columns: flag/pos · team · P · W · D · L · F · A · GD · Pts"></textarea>
      <p class="note" style="margin:8px 0 0;">Column 1 accepts <b>C</b> (champion), <b>SF</b>/<b>QF</b> (play-offs), <b>R</b> (relegation) or a plain position number. P, GD and Pts are shown.</p>
    </div>

    <div class="card">
      <h2>Grid editor</h2>
      <div class="grid-scroller">
        <table class="grid">
          <thead><tr>
            <th style="width:26px">#</th><th style="width:78px">Zone</th><th>Club</th>
            <th style="width:40px">P</th><th style="width:52px">GD</th><th style="width:52px">Pts</th>
          </tr></thead>
          <tbody id="gridBody"></tbody>
        </table>
      </div>
      <div class="btns" style="margin-top:10px">
        <button type="button" class="btn btn--ghost" id="zoneFillBtn">Mark by position</button>
        <button type="button" class="btn btn--ghost" id="zoneClearBtn">Clear marks</button>
      </div>
    </div>

    <div class="btns">
      <button type="button" class="btn btn--primary" id="downloadBtn">Download PNG</button>
      <button type="button" class="btn btn--ghost" id="resetBtn">Reset</button>
    </div>

    <footer class="status">
      <span id="status">Ready</span>
    </footer>

  </div>
</div>

</div><!-- /#pageWrap -->

<script src="engine.js"></script>
<script src="app.js"></script>

</body>
</html>
