<script>
(function(){
  "use strict";

  /* ================= CONFIG ================= */

  const VERSION = "v2.0";
  const STORAGE_KEY = "single-fixture-builder-v2.0";

  const CANVAS_SIZE = 1347;

  /* ===== Asset URLs ===== */
  const REPO_ASSETS = "https://raw.githubusercontent.com/thenationalleague/tools/refs/heads/main/assets/";

  const BG_URL = REPO_ASSETS + "backgrounds/fixtures-1x1.png";

  const DIV_BADGE = {
    National: encodeURI(REPO_ASSETS + "divisions/National.png"),
    North:    encodeURI(REPO_ASSETS + "divisions/North.png"),
    South:    encodeURI(REPO_ASSETS + "divisions/South.png")
  };
  const DIV_BADGE_POS = { x: 750, y: 200, scale: 0.075 };

  const CREST_BASE_URL = "https://raw.githubusercontent.com/thenationalleague/tools/refs/heads/main/assets/crests/";
  const CREST_HOME_POS = { x: 550, y: 600 };
  const CREST_AWAY_POS = { x: 950, y: 600 };
  const CREST_MAX_W = 300;
  const CREST_MAX_H = 300;

  // cssVar() resolves a brand token to its computed hex/rgb value, so any
  // colour passed to canvas drawing tracks nl-brand.css as the source of truth.
  function cssVar(name){return getComputedStyle(document.documentElement).getPropertyValue(name).trim();}

  const FIXTURE_TEXT = {
    x: 750, y: 1000, size: 48, weight: 800, lineGap: 42,
    blue: cssVar('--navy'), red: cssVar('--primary')
  };

  const KICKOFF_TEXT = {
    x: 750, size: 24, weight: 800, color: cssVar('--primary'), offsetBelowAwayLine: 100
  };

  /* ===== Clubs metadata (fetched from clubs-meta.json) ===== */
  var CLUBS_META_URL = "https://raw.githubusercontent.com/thenationalleague/tools/refs/heads/main/assets/data/clubs-meta.json";
  var TEAM_NAMES = [];
  var TEAM_NAME_SET = new Set();
  var NAME_TO_SHORT = new Map();

  function safeUpper(s){ return (s || "").replace(/\s+/g," ").trim().toUpperCase(); }

  function crestUrlForName(teamName){
    var t = (teamName || "").replace(/\s+/g," ").trim();
    if(!t) return "";
    return encodeURI(CREST_BASE_URL + t + ".png");
  }

  function normalizeName(v){
    var t = (v || "").replace(/\s+/g," ").trim();
    if(!t) return "";
    if(TEAM_NAME_SET.has(t)) return t;
    return "";
  }

  /* ===== Canvas font helper ===== */
  const FONT_FAMILY = '"carbona-variable",sans-serif';

  function setCanvasFont(c, sizePx, weight){
    var w = weight || 800;
    c.font = w + " " + sizePx + "px " + FONT_FAMILY;
    if('fontVariationSettings' in c){
      c.fontVariationSettings = "'wght' " + w;
    } else {
      try { c.canvas.style.fontVariationSettings = "'wght' " + w; } catch(e){}
    }
  }

  function setTextStyle(c, sizePx, colorHex, weight){
    c.fillStyle = colorHex;
    setCanvasFont(c, sizePx, weight);
    c.textBaseline = "middle";
  }

  /* ================= ELEMENTS ================= */

  const canvas = document.getElementById("preview");
  const ctx = canvas.getContext("2d");

  const divisionSel = document.getElementById("division");
  const homeSel = document.getElementById("homeTeam");
  const awaySel = document.getElementById("awayTeam");
  const downloadBtn = document.getElementById("download");
  const download45Btn = document.getElementById("download45");
  const resetAllBtn = document.getElementById("resetAll");
  const kickoffEl = document.getElementById("kickoff");
  const statusTextEl = document.getElementById("statusText");

  /* ================= STATE ================= */

  const imgCache = new Map();
  let bgImg = null;
  let divBadgeImg = null;

  const state = { home:"", away:"", kickoff:"" };

  /* ================= HELPERS ================= */

  function setStatus(msg){
    statusTextEl.textContent = msg;
    window.clearTimeout(setStatus._t);
    setStatus._t = window.setTimeout(()=> statusTextEl.textContent = "Ready", 900);
  }

  function loadImage(url){
    if(!url) return Promise.reject(new Error("Empty URL"));
    if(imgCache.has(url)) return imgCache.get(url);
    const p = new Promise((resolve,reject)=>{
      const img = new Image();
      img.crossOrigin = "anonymous";
      img.onload = ()=> resolve(img);
      img.onerror = ()=> reject(new Error("Failed to load: " + url));
      img.src = url;
    });
    imgCache.set(url, p);
    return p;
  }

  function drawContainedImage(c, img, centerX, centerY, maxW, maxH){
    const iw = img.naturalWidth || img.width;
    const ih = img.naturalHeight || img.height;
    if(!iw || !ih) return;
    const s = Math.min(maxW / iw, maxH / ih);
    const dw = iw * s;
    const dh = ih * s;
    c.imageSmoothingEnabled = true;
    c.imageSmoothingQuality = "high";
    c.drawImage(img, centerX - dw/2, centerY - dh/2, dw, dh);
  }

  function drawMixedCenteredLine(c, parts, centerX, y){
    let totalW = 0;
    for(const p of parts) totalW += c.measureText(p.text).width;
    let x = centerX - (totalW / 2);
    for(const p of parts){
      c.fillStyle = p.color;
      c.fillText(p.text, x, y);
      x += c.measureText(p.text).width;
    }
  }

  async function ensureBaseImages(){
    if(!bgImg) bgImg = await loadImage(BG_URL);
    const divUrl = DIV_BADGE[divisionSel.value] || DIV_BADGE.National;
    divBadgeImg = await loadImage(divUrl);
  }

  async function preloadNeededCrests(){
    const urls = new Set();
    const h = normalizeName(state.home);
    const a = normalizeName(state.away);
    if(h) urls.add(crestUrlForName(h));
    if(a) urls.add(crestUrlForName(a));
    await Promise.all([...urls].map(u => loadImage(u).catch(()=>null)));
  }

  function dateStamp(d){
    const day = String(d.getDate());
    const mon = d.toLocaleString("en-GB", { month: "short" });
    const yy = String(d.getFullYear()).slice(-2);
    return day + mon + yy;
  }

  function formatKickoff(datetimeLocal){
    if(!datetimeLocal) return "";
    const d = new Date(datetimeLocal);
    if(Number.isNaN(d.getTime())) return "";
    const parts = new Intl.DateTimeFormat("en-GB", {
      weekday: "short", day: "numeric", month: "short", year: "numeric",
      hour: "2-digit", minute: "2-digit", hourCycle: "h23"
    }).formatToParts(d);
    const get = (type) => (parts.find(p => p.type === type) || {}).value || "";
    return get("weekday") + " " + get("day") + " " + get("month") + " " + get("year") + ", " + get("hour") + ":" + get("minute");
  }

  function buildFilename(kind){
    const div = divisionSel.value;
    const suffix = (kind === "4x5") ? "4x5" : "1x1";
    const hName = normalizeName(state.home) || "Home";
    const aName = normalizeName(state.away) || "Away";
    const stamp = dateStamp(new Date());
    return ("Fixture " + div + " - " + hName + " v " + aName + " " + stamp + " - " + suffix + ".png").replace(/\s+/g," ").trim();
  }

  /* ===== Responsive select labels ===== */
  const MQ_COMPACT = window.matchMedia("(max-width: 640px)");

  function updateSelectOptionLabels(sel){
    if(!sel) return;
    var opts = sel.options;
    for(var i=0;i<opts.length;i++){
      var opt = opts[i];
      var name = opt.value || "";
      if(name === ""){ opt.textContent = "None"; continue; }
      opt.textContent = MQ_COMPACT.matches ? (NAME_TO_SHORT.get(name) || name) : name;
    }
  }

  function updateAllSelectLabels(){
    updateSelectOptionLabels(homeSel);
    updateSelectOptionLabels(awaySel);
  }

  try{ MQ_COMPACT.addEventListener("change", function(){ updateAllSelectLabels(); }); }
  catch(e){ MQ_COMPACT.addListener(function(){ updateAllSelectLabels(); }); }

  function buildClubSelectOptions(sel){
    sel.innerHTML = "";
    var none = document.createElement("option");
    none.value = "";
    none.textContent = "None";
    sel.appendChild(none);
    for(var i = 0; i < TEAM_NAMES.length; i++){
      var name = TEAM_NAMES[i];
      var o = document.createElement("option");
      o.value = name;
      o.textContent = MQ_COMPACT.matches ? (NAME_TO_SHORT.get(name) || name) : name;
      o.title = name;
      sel.appendChild(o);
    }
  }

  /* ================= AUTOSAVE ================= */

  function autosave(){
    var payload = {
      v: VERSION,
      division: divisionSel.value,
      home: state.home,
      away: state.away,
      kickoff: state.kickoff
    };
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(payload)); }catch{}
  }

  function autoload(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return;
      var d = JSON.parse(raw);
      if(!d || typeof d !== "object") return;
      if(typeof d.division === "string") divisionSel.value = d.division;
      if(typeof d.home === "string") state.home = normalizeName(d.home);
      if(typeof d.away === "string") state.away = normalizeName(d.away);
      if(typeof d.kickoff === "string") state.kickoff = d.kickoff.trim();
    }catch{}
  }

  /* ================= RENDER ================= */

  async function renderToContext(c){
    await ensureBaseImages();
    await preloadNeededCrests();

    c.setTransform(1,0,0,1,0,0);
    c.clearRect(0,0,CANVAS_SIZE,CANVAS_SIZE);
    c.imageSmoothingEnabled = true;
    c.imageSmoothingQuality = "high";
    c.drawImage(bgImg, 0, 0, CANVAS_SIZE, CANVAS_SIZE);

    // Division badge
    if(divBadgeImg){
      const iw = divBadgeImg.naturalWidth || divBadgeImg.width;
      const ih = divBadgeImg.naturalHeight || divBadgeImg.height;
      const dw = iw * DIV_BADGE_POS.scale;
      const dh = ih * DIV_BADGE_POS.scale;
      c.drawImage(divBadgeImg, DIV_BADGE_POS.x - dw/2, DIV_BADGE_POS.y - dh/2, dw, dh);
    }

    // Crests
    const hName = normalizeName(state.home);
    const aName = normalizeName(state.away);
    const hUrl = hName ? crestUrlForName(hName) : "";
    const aUrl = aName ? crestUrlForName(aName) : "";

    if(hUrl){
      const img = await loadImage(hUrl).catch(()=>null);
      if(img) drawContainedImage(c, img, CREST_HOME_POS.x, CREST_HOME_POS.y, CREST_MAX_W, CREST_MAX_H);
    }
    if(aUrl){
      const img = await loadImage(aUrl).catch(()=>null);
      if(img) drawContainedImage(c, img, CREST_AWAY_POS.x, CREST_AWAY_POS.y, CREST_MAX_W, CREST_MAX_H);
    }

    // Fixture text
    const homeLine = safeUpper(hName ? (hName === "Hampton & Richmond Borough" ? "Hampton & Richmond" : hName) : "");
    const awayLine = safeUpper(aName ? (aName === "Hampton & Richmond Borough" ? "Hampton & Richmond" : aName) : "");

    c.textAlign = "center";
    setTextStyle(c, FIXTURE_TEXT.size, FIXTURE_TEXT.blue, FIXTURE_TEXT.weight);

    if(homeLine){
      c.fillStyle = FIXTURE_TEXT.blue;
      c.fillText(homeLine, FIXTURE_TEXT.x, FIXTURE_TEXT.y);
    }

    if(awayLine){
      setTextStyle(c, FIXTURE_TEXT.size, FIXTURE_TEXT.blue, FIXTURE_TEXT.weight);
      c.textAlign = "left";
      drawMixedCenteredLine(c,
        [{ text: "v ", color: FIXTURE_TEXT.red }, { text: awayLine, color: FIXTURE_TEXT.blue }],
        FIXTURE_TEXT.x, FIXTURE_TEXT.y + FIXTURE_TEXT.lineGap
      );
    }

    // Kick-off text
    const koText = formatKickoff(state.kickoff);
    if(koText){
      const koY = (FIXTURE_TEXT.y + FIXTURE_TEXT.lineGap) + KICKOFF_TEXT.offsetBelowAwayLine;
      c.textAlign = "center";
      setTextStyle(c, KICKOFF_TEXT.size, KICKOFF_TEXT.color, KICKOFF_TEXT.weight);
      c.fillText(koText, KICKOFF_TEXT.x, koY);
    }
  }

  let renderQueued = false;
  function scheduleRender(){
    if(renderQueued) return;
    renderQueued = true;
    requestAnimationFrame(async ()=>{
      renderQueued = false;
      try{
        if(document.fonts && document.fonts.ready) await document.fonts.ready;
        await renderToContext(ctx);
        autosave();
      }catch(e){
        console.error(e);
        setStatus("Render error");
      }
    });
  }

  async function renderNow(){
    if(document.fonts && document.fonts.ready) await document.fonts.ready;
    await renderToContext(ctx);
    autosave();
  }

  /* ================= DOWNLOAD ================= */

  async function downloadPNG_1x1(){
    try{
      await ensureBaseImages();
      if(document.fonts && document.fonts.ready) await document.fonts.ready;
      const out = document.createElement("canvas");
      out.width = CANVAS_SIZE;
      out.height = CANVAS_SIZE;
      await renderToContext(out.getContext("2d"));
      const blob = await new Promise(res => out.toBlob(res, "image/png"));
      if(!blob){ setStatus("Export failed"); return; }
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = buildFilename("1x1");
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(a.href);
      setStatus("Downloaded");
      if (window.NL && NL.writeAudit) NL.writeAudit('single-fixture_download', a.download);
    }catch(e){ console.error(e); setStatus("Export error"); }
  }

  async function downloadPNG_4x5(){
    try{
      await ensureBaseImages();
      if(document.fonts && document.fonts.ready) await document.fonts.ready;
      const full = document.createElement("canvas");
      full.width = CANVAS_SIZE;
      full.height = CANVAS_SIZE;
      await renderToContext(full.getContext("2d"));

      const OUT_W = 1080, OUT_H = 1347;
      const SRC_X = 190, SRC_Y = 0;
      const out = document.createElement("canvas");
      out.width = OUT_W;
      out.height = OUT_H;
      const oc = out.getContext("2d");
      oc.imageSmoothingEnabled = true;
      oc.imageSmoothingQuality = "high";
      oc.drawImage(full, SRC_X, SRC_Y, OUT_W, OUT_H, 0, 0, OUT_W, OUT_H);

      const blob = await new Promise(res => out.toBlob(res, "image/png"));
      if(!blob){ setStatus("Export failed"); return; }
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = buildFilename("4x5");
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(a.href);
      setStatus("Downloaded");
      if (window.NL && NL.writeAudit) NL.writeAudit('single-fixture_download', a.download);
    }catch(e){ console.error(e); setStatus("Export error"); }
  }

  /* ================= RESET ================= */

  function resetAll(){
    divisionSel.value = "National";
    state.home = "";
    state.away = "";
    state.kickoff = "";
    homeSel.value = "";
    awaySel.value = "";
    kickoffEl.value = "";
    divBadgeImg = null;
    autosave();
    scheduleRender();
    setStatus("Reset");
  }

  /* ================= UI ================= */

  function bindUI(){
    divisionSel.addEventListener("change", function(){
      divBadgeImg = null;
      autosave();
      scheduleRender();
    });
    homeSel.addEventListener("change", function(){
      state.home = homeSel.value || "";
      autosave();
      scheduleRender();
    });
    awaySel.addEventListener("change", function(){
      state.away = awaySel.value || "";
      autosave();
      scheduleRender();
    });
    kickoffEl.addEventListener("change", function(){
      state.kickoff = (kickoffEl.value || "").trim();
      autosave();
      scheduleRender();
    });
    downloadBtn.addEventListener("click", downloadPNG_1x1);
    download45Btn.addEventListener("click", downloadPNG_4x5);
    resetAllBtn.addEventListener("click", resetAll);
  }

  /* ================= INIT ================= */

  async function start(){
    /* Fetch clubs-meta.json for team dropdowns */
    try {
      var resp = await fetch(CLUBS_META_URL);
      var data = await resp.json();
      var clubs = data.clubs || [];
      clubs.sort(function(a, b){ return a.name.localeCompare(b.name); });
      TEAM_NAMES = clubs.map(function(c){ return c.name; });
      TEAM_NAME_SET = new Set(TEAM_NAMES);
      NAME_TO_SHORT = new Map();
      for(var i = 0; i < clubs.length; i++){
        var name = clubs[i].name;
        var short = clubs[i].short || clubs[i].code || name;
        if(name) NAME_TO_SHORT.set(name, short);
      }
    } catch(e) {
      console.warn("[single-fixture] Could not load clubs-meta.json:", e);
    }

    buildClubSelectOptions(homeSel);
    buildClubSelectOptions(awaySel);

    autoload();

    homeSel.value = normalizeName(state.home) || "";
    awaySel.value = normalizeName(state.away) || "";
    kickoffEl.value = state.kickoff || "";

    updateAllSelectLabels();
    bindUI();

    try{
      /* Ensure fonts loaded before first render */
      var warm = document.getElementById("fontWarmup");
      if(warm) void warm.offsetWidth;
      if(document.fonts && document.fonts.ready) await document.fonts.ready;
      await new Promise(function(r){ setTimeout(r, 300); });

      await ensureBaseImages();
      await renderNow();
      setStatus("Loaded");
    }catch(e){
      console.error(e);
      setStatus("Image load error");
    }
  }

  start();

})();
</script>
</body>
</html>
