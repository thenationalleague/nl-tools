ubCount }} clubs loaded<\u002Fdiv>\n  <div style=\"flex:1;\"><\u002Fdiv>\n  <button onclick=\"{{ openPanel }}\" style=\"cursor:pointer; font-family:'Carbona-Bold'; font-size:11px; letter-spacing:.05em; text-transform:uppercase; padding:6px 11px; border-radius:4px; border:1px solid rgba(255,255,255,.28); background:transparent; color:#fff;\">Paste data<\u002Fbutton>\n  <button onclick=\"{{ doExport }}\" style=\"cursor:pointer; font-family:'Carbona-Bold'; font-size:11px; letter-spacing:.05em; text-transform:uppercase; padding:6px 12px; border-radius:4px; border:none; background:#9e0000; color:#fff;\">{{ exportLabel }}<\u002Fbutton>\n<\u002Fdiv>\n\n<sc-if value=\"{{ panelOpen }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"position:fixed; inset:0; z-index:60; background:rgba(10,16,40,.6); display:flex; align-items:center; justify-content:center; padding:24px;\">\n  <div class=\"nlw-scroll\" style=\"width:min(720px,100%); max-height:88vh; overflow:auto; background:#fff; border-radius:14px; box-shadow:0 18px 40px rgba(10,16,40,.4); padding:22px 24px;\">\n    <div style=\"display:flex; align-items:baseline; gap:12px; margin-bottom:4px;\">\n      <div style=\"font-family:'Carbona-ExtraBold'; font-size:19px; letter-spacing:-.02em; text-transform:uppercase; color:#0a0a0a;\">Paste fixture data<\u002Fdiv>\n      <div style=\"flex:1;\"><\u002Fdiv>\n      <button onclick=\"{{ closePanel }}\" style=\"cursor:pointer; font-family:'Carbona-Bold'; font-size:13px; border:none; background:none; color:#4a4a4a;\">Close ✕<\u002Fbutton>\n    <\u002Fdiv>\n    <div style=\"font-size:12.5px; line-height:1.5; color:#4a4a4a; margin-bottom:12px;\">One fixture per line, tab-separated, with the header row included. Each match is listed once (home first) — the away club's fixtures are generated automatically. This widget shows league fixtures only — no cup dates.<\u002Fdiv>\n    <div style=\"font-family:ui-monospace,Menlo,Consolas,monospace; font-size:11px; background:#f2f2f2; border:1px solid #e6e6e6; border-radius:6px; padding:8px 10px; margin-bottom:14px; color:#222; white-space:pre; overflow-x:auto;\">Date ⇥ Division ⇥ Home ⇥ Away ⇥ Kick-Off\nSat 08/08/2026 ⇥ National ⇥ AFC Fylde ⇥ Wealdstone ⇥ 15:00<\u002Fdiv>\n\n    <textarea ref=\"{{ dataRef }}\" oninput=\"{{ onDraft }}\" style=\"width:100%; height:190px; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:11.5px; line-height:1.5; padding:12px; border:1px solid #cfcfcf; border-radius:8px; resize:vertical;\">{{ rawData }}<\u002Ftextarea>\n\n    <div style=\"margin-top:14px; border:1px solid #e6e6e6; border-radius:10px; overflow:hidden;\">\n      <button onclick=\"{{ toggleMap }}\" style=\"cursor:pointer; width:100%; display:flex; align-items:center; gap:10px; text-align:left; padding:11px 13px; border:none; background:{{ mapBtnBg }}; color:{{ mapTextColor }};\">\n        <span style=\"font-family:'Carbona-Bold'; font-size:12px; letter-spacing:.08em; text-transform:uppercase;\">Column mapping override<\u002Fspan>\n        <span style=\"flex:1;\"><\u002Fspan>\n        <span style=\"font-family:'Carbona-Bold'; font-size:11px; padding:3px 9px; border-radius:999px; background:{{ mapPillBg }}; color:#223b7c;\">{{ mapLabel }}<\u002Fspan>\n      <\u002Fbutton>\n      <sc-if value=\"{{ mapEnabled }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"padding:14px; background:#fafbfe; border-top:1px solid #e6e6e6;\">\n        <div style=\"font-size:12px; line-height:1.5; color:#4a4a4a; margin-bottom:12px;\">Enter which column number (1 = first) holds each detail. Leave <strong>K/O<\u002Fstrong> at 0 if the kick-off time sits inside the Date column — it will be split out automatically.<\u002Fdiv>\n        <div style=\"display:grid; grid-template-columns:repeat(3,1fr); gap:10px 14px;\">\n          <label style=\"font-family:'Carbona-Bold'; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:#223b7c;\">Date<input type=\"number\" min=\"0\" value=\"{{ map.date }}\" onchange=\"{{ onMapDate }}\" style=\"display:block; margin-top:4px; width:100%; font-size:14px; padding:7px 9px; border:1px solid #cfcfcf; border-radius:6px;\"><\u002Flabel>\n          <label style=\"font-family:'Carbona-Bold'; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:#223b7c;\">K/O (time)<input type=\"number\" min=\"0\" value=\"{{ map.time }}\" onchange=\"{{ onMapTime }}\" style=\"display:block; margin-top:4px; width:100%; font-size:14px; padding:7px 9px; border:1px solid #cfcfcf; border-radius:6px;\"><\u002Flabel>\n          <label style=\"font-family:'Carbona-Bold'; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:#223b7c;\">Division<input type=\"number\" min=\"0\" value=\"{{ map.div }}\" onchange=\"{{ onMapDiv }}\" style=\"display:block; margin-top:4px; width:100%; font-size:14px; padding:7px 9px; border:1px solid #cfcfcf; border-radius:6px;\"><\u002Flabel>\n          <label style=\"font-family:'Carbona-Bold'; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:#223b7c;\">Home<input type=\"number\" min=\"0\" value=\"{{ map.home }}\" onchange=\"{{ onMapHome }}\" style=\"display:block; margin-top:4px; width:100%; font-size:14px; padding:7px 9px; border:1px solid #cfcfcf; border-radius:6px;\"><\u002Flabel>\n          <label style=\"font-family:'Carbona-Bold'; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:#223b7c;\">Away<input type=\"number\" min=\"0\" value=\"{{ map.away }}\" onchange=\"{{ onMapAway }}\" style=\"display:block; margin-top:4px; width:100%; font-size:14px; padding:7px 9px; border:1px solid #cfcfcf; border-radius:6px;\"><\u002Flabel>\n          <label style=\"font-family:'Carbona-Bold'; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:#223b7c;\">DAZN <span style=\"color:#8a8a8a; font-weight:normal;\">· 0 = none<\u002Fspan><input type=\"number\" min=\"0\" value=\"{{ map.dazn }}\" onchange=\"{{ onMapDazn }}\" style=\"display:block; margin-top:4px; width:100%; font-size:14px; padding:7px 9px; border:1px solid #cfcfcf; border-radius:6px;\"><\u002Flabel>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n      <div style=\"padding:12px 14px; border-top:1px solid #e6e6e6; background:#fff;\">\n        <div style=\"font-family:'Carbona-Bold'; font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:#8a8a8a; margin-bottom:8px;\">Preview · first two rows<\u002Fdiv>\n        <sc-for list=\"{{ previewLines }}\" as=\"pv\" hint-placeholder-count=\"2\">\n          <div style=\"display:flex; flex-wrap:wrap; align-items:baseline; gap:8px; padding:6px 0; border-bottom:1px solid #f0f0f0; font-size:12.5px;\">\n            <span style=\"font-family:'Carbona-Bold'; color:#0a0a0a; min-width:96px;\">{{ pv.date }}<\u002Fspan>\n            <span style=\"color:{{ pv.timeColor }}; font-family:'Carbona-Bold'; min-width:56px;\">{{ pv.time }}<\u002Fspan>\n            <span style=\"font-family:'Carbona-Bold'; color:#0a0a0a;\">{{ pv.home }}<\u002Fspan>\n            <span style=\"color:#8a8a8a;\">v<\u002Fspan>\n            <span style=\"color:#333;\">{{ pv.away }}<\u002Fspan>\n            <span style=\"flex:1;\"><\u002Fspan>\n            <span style=\"font-size:11px; color:#8a8a8a;\">{{ pv.div }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex; align-items:center; gap:12px; margin-top:20px;\">\n      <button onclick=\"{{ applyData }}\" style=\"cursor:pointer; font-family:'Carbona-Bold'; font-size:13px; letter-spacing:.04em; text-transform:uppercase; padding:11px 20px; border:none; border-radius:4px; background:#9e0000; color:#fff;\">Apply &amp; build<\u002Fbutton>\n      <div style=\"font-size:12.5px; color:#8a8a8a;\">Then use Export to save the standalone embed.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<div style=\"max-width:{{ maxW }}; width:100%; margin:0 auto; border:1px solid #e6e6e6; border-radius:12px; overflow:hidden; background:#fff; box-shadow:0 1px 2px rgba(10,16,40,.06); container-type:inline-size; container-name:nlw;\">\n\n  <div style=\"display:flex; align-items:center; flex-wrap:wrap; gap:10px 12px; padding:14px 16px; background:#14234a;\">\n    <img src=\"{{ headerLockup }}\" alt=\"The National League\" style=\"height:44px; width:auto; flex:none;\">\n    <div style=\"min-width:0; flex:1;\">\n      <div style=\"font-family:'Carbona-Bold'; font-size:9.5px; letter-spacing:.16em; text-transform:uppercase; color:#8fa2d4;\">{{ headerDivision }}<\u002Fdiv>\n      <div style=\"font-family:'Carbona-ExtraBold'; font-size:19px; line-height:1.05; letter-spacing:-.02em; text-transform:uppercase; color:#fff;\">{{ headerClub }}<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"position:relative; flex:none;\">\n      <sc-raw-select value=\"{{ selectedClub }}\" onchange=\"{{ onSelectClub }}\" style=\"appearance:none; cursor:pointer; font-family:'Carbona-Bold'; font-size:12.5px; letter-spacing:.02em; padding:9px 30px 9px 12px; border-radius:6px; border:1px solid rgba(255,255,255,.28); background:#0e1d40; color:#fff; max-width:170px;\">\n        <sc-for list=\"{{ clubOptions }}\" as=\"opt\" hint-placeholder-count=\"4\"><option value=\"{{ opt.value }}\">{{ opt.label }}<\u002Foption><\u002Fsc-for>\n      <\u002Fsc-raw-select>\n      <span style=\"position:absolute; right:11px; top:50%; transform:translateY(-50%); pointer-events:none; color:#8fa2d4; font-size:10px;\">▼<\u002Fspan>\n    <\u002Fdiv>\n    <img src=\"{{ headerCrest }}\" alt=\"\" style=\"display:{{ headerCrestDisplay }}; height:34px; width:34px; object-fit:contain; flex:none;\">\n  <\u002Fdiv>\n\n  <div class=\"nlw-grid\" style=\"display:grid; grid-template-columns:84px 1fr 40px 48px 58px; align-items:center; gap:0 10px; padding:10px 16px; background:#f5f7fc; border-bottom:1px solid #e6e6e6; font-family:'Carbona-Bold'; font-size:10px; letter-spacing:.11em; text-transform:uppercase; color:#5a6a86;\">\n    <div>Date<\u002Fdiv>\n    <div>Opponent<\u002Fdiv>\n    <div><\u002Fdiv>\n    <div style=\"text-align:center;\">H/A<\u002Fdiv>\n    <div style=\"text-align:right;\">K.O.<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div>\n    <sc-for list=\"{{ fixtures }}\" as=\"fx\" hint-placeholder-count=\"12\">\n      <div class=\"nlw-grid\" style=\"display:grid; grid-template-columns:84px 1fr 40px 48px 58px; align-items:center; gap:0 10px; padding:11px 16px; border-bottom:1px solid #f0f2f7; background:{{ fx.rowBg }};\">\n        <div class=\"nlw-date\" style=\"font-size:12.5px; line-height:1.2;\">\n          <div style=\"font-family:'Carbona-Bold'; color:#223b7c;\">{{ fx.dayMon }}<\u002Fdiv>\n          <div style=\"color:#8a8a8a; font-size:11px;\">{{ fx.year }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex; align-items:center; gap:11px; min-width:0; padding-right:6px;\">\n          <img class=\"nlw-crest\" src=\"{{ fx.crest }}\" alt=\"\" style=\"height:30px; width:30px; object-fit:contain; flex:none;\">\n          <span class=\"nlw-op\" style=\"font-family:{{ fx.oppFont }}; font-size:15.5px; line-height:1.15; letter-spacing:-.01em;\">{{ fx.opponent }}<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex; align-items:center; justify-content:center;\">\n          <a href=\"https://www.dazn.com/en-GB/welcome/nltv\" target=\"_blank\" rel=\"noopener\" style=\"display:{{ fx.daznDisplay }}; line-height:0;\">\n            <img class=\"nlw-dazn\" src=\"e8679de1-d0c3-4459-815b-1d2ae4ed965d\" alt=\"DAZN\" title=\"Watch live on DAZN\" style=\"height:23px; width:auto; object-fit:contain;\">\n          <\u002Fa>\n        <\u002Fdiv>\n        <div style=\"text-align:center;\">\n          <span style=\"display:inline-block; min-width:24px; padding:4px 7px; border-radius:4px; font-family:'Carbona-Bold'; font-size:12.5px; background:{{ fx.haBg }}; color:{{ fx.haColor }};\">{{ fx.ha }}<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"nlw-ko\" style=\"text-align:right; font-family:'Carbona-Bold'; font-size:14px; color:{{ fx.timeColor }};\">{{ fx.time }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n    <sc-if value=\"{{ isEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"padding:26px 16px; text-align:center; color:#8a8a8a; font-size:13px;\">No fixtures loaded. Paste data to begin.<\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:720,&quot;height&quot;:560},&quot;locked&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Embed&quot;},&quot;maxWidth&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:680,&quot;min&quot;:420,&quot;max&quot;:900,&quot;step&quot;:10,&quot;unit&quot;:&quot;px&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Embed&quot;}}\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.wd = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];\n    this.mo = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];\n    this.crestBase = 'https://raw.githubusercontent.com/thenationalleague/tools/main/assets/crests/';\n    this.lockupBase = 'https://raw.githubusercontent.com/thenationalleague/tools/main/assets/divisions/';\n    this.nameFixes = { \"kings lynn town\": \"King's Lynn Town\" };\n    let saved = '';\n    try { saved = localStorage.getItem('nlw_selected') || ''; } catch (e) {}\n    const initial = this.initialData();\n    this.bakedLockups = this.initialLockups();\n    this.state = {\n      rawData: initial,\n      rawDraft: initial,\n      selectedClub: saved || 'AUTO',\n      panelOpen: false,\n      locked: !!props.locked || this.seedLocked(),\n      mapEnabled: false,\n      // New default: Date | Division | Home | Away | Kick-Off\n      map: { date: 1, div: 2, home: 3, away: 4, time: 5, dazn: 6 },\n    };\n    this.dataRef = React.createRef();\n  }\n\n  // The locked export sets window.__NLW_SEED (survives the bundler's unpack).\n  readSeed() {\n    try { if (window.__NLW_SEED && window.__NLW_SEED.rawData) return window.__NLW_SEED; } catch (e) {}\n    try {\n      const el = document.getElementById('nlw-seed');\n      if (el && el.textContent.trim()) return JSON.parse(el.textContent);\n    } catch (e) {}\n    return null;\n  }\n  // Priority: baked-in seed (locked export) > saved paste (localStorage) > sample seed.\n  initialData() {\n    const s = this.readSeed();\n    if (s && s.rawData) return s.rawData;\n    try {\n      const ls = localStorage.getItem('nlw_data');\n      if (ls) return ls;\n    } catch (e) {}\n    return this.seed();\n  }\n  seedLocked() {\n    const s = this.readSeed();\n    return !!(s && s.locked);\n  }\n  initialLockups() {\n    try {\n      const el = document.getElementById('nlw-seed');\n      if (el && el.textContent.trim()) {\n        const j = JSON.parse(el.textContent);\n        if (j && j.lockups) return j.lockups;\n      }\n    } catch (e) {}\n    return null;\n  }\n  seed() {\n    return [\n      'Date\\tDivision\\tHome\\tAway\\tKick-Off',\n      'Sat 08/08/2026\\tNational\\tAFC Fylde\\tWealdstone\\t15:00\\t',\n      'Sat 08/08/2026\\tNational\\tAldershot Town\\tGateshead\\t15:00\\t',\n      'Sat 15/08/2026\\tNational\\tWealdstone\\tAldershot Town\\t15:00\\tDAZN',\n      'Tue 18/08/2026\\tNational\\tAFC Fylde\\tGateshead\\t19:45\\t',\n      'Sat 22/08/2026\\tNational\\tGateshead\\tWealdstone\\t15:00\\tDAZN',\n      'Sat 29/08/2026\\tNational\\tAldershot Town\\tAFC Fylde\\t15:00\\t',\n    ].join('\\n');\n  }\n\n  fixName(n) {\n    if (!n) return n;\n    const key = n.toLowerCase().replace(/['’`]/g, '').replace(/\\s+/g, ' ').trim();\n    return this.nameFixes[key] || n;\n  }\n  normTime(t) {\n    if (!t) return '';\n    const m = String(t).match(/(\\d{1,2})[:.](\\d{2})/);\n    return m ? String(m[1]).padStart(2, '0') + ':' + m[2] : '';\n  }
