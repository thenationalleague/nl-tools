<!DOCTYPE html>
<!--
  station-distance/one.html  v1.0
  STANDALONE single-club station-distance helper (no auth, out of lint scope).

  For awkward one-offs (e.g. Radcliffe, where the geocoder kept matching the wrong
  town). You give it the club's coordinates + a search term; it lists the geocode
  CANDIDATES sorted by how near they are to the club, so you can eyeball and click
  the right one — then it computes the by-road distance (OSRM) and a paste line.

  Runs in the browser (needs Nominatim + OSRM, which the Claude sandbox blocks).
  Prefilled for Radcliffe. Does not save anything.
-->
<html lang="en-GB">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Single-club station distance — NL Tools</title>
<style>
  :root { --navy:#223b7c; --red:#9e0000; --green:#1f7a43; --border:#d8dde6; --muted:#5b6472; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; color:#1b2430; background:#f4f6f9; line-height:1.5; }
  .wrap { max-width:760px; margin:0 auto; padding:24px 20px 60px; }
  h1 { color:var(--navy); font-size:21px; margin:0 0 4px; }
  p.sub { color:var(--muted); margin:0 0 18px; font-size:14px; }
  .card { background:#fff; border:1px solid var(--border); border-top:3px solid var(--red); border-radius:10px; padding:18px 20px; margin-bottom:16px; }
  label { display:block; font-size:12px; text-transform:uppercase; letter-spacing:.06em; font-weight:800; color:var(--muted); margin:0 0 4px; }
  input { width:100%; font:inherit; font-size:14px; border:1px solid var(--border); border-radius:6px; padding:9px 11px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .grid .full { grid-column:1 / -1; }
  button { font:inherit; cursor:pointer; border-radius:8px; border:none; padding:11px 16px; font-weight:700; }
  .btn-go { background:var(--navy); color:#fff; margin-top:14px; }
  .cand { width:100%; text-align:left; background:#fff; border:1px solid var(--border); border-radius:8px; padding:10px 12px; margin:6px 0; cursor:pointer; }
  .cand:hover { border-color:var(--navy); }
  .cand b { color:var(--navy); }
  .cand .away { color:var(--muted); font-size:12px; }
  .res { font-size:18px; font-weight:800; color:var(--green); margin:6px 0; }
  .paste { font-family:ui-monospace,Menlo,Consolas,monospace; background:#eef1f6; border-radius:6px; padding:8px 10px; font-size:13px; }
  .prog { font-size:13px; color:var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Single-club station distance</h1>
  <p class="sub">For awkward one-offs. Enter the club’s coordinates and a search term, click <b>Find candidates</b>, then click the correct match — it’ll give you the by-road distance. Prefilled for Radcliffe.</p>

  <div class="card">
    <div class="grid">
      <div class="full"><label>Club</label><input id="club" value="Radcliffe"></div>
      <div><label>Club latitude</label><input id="lat" value="53.56760703955618"></div>
      <div><label>Club longitude</label><input id="lng" value="-2.340707061051373"></div>
      <div class="full"><label>Station search term</label><input id="q" value="Radcliffe tram stop"></div>
    </div>
    <button class="btn-go" id="go">Find candidates</button>
    <p class="prog" id="prog" style="margin-bottom:0;"></p>
  </div>

  <div class="card" id="candCard" style="display:none;">
    <label>Candidates — nearest the club first; click the right one</label>
    <div id="cands"></div>
  </div>

  <div class="card" id="resCard" style="display:none;">
    <div class="res" id="res"></div>
    <div class="paste" id="paste"></div>
  </div>
</div>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function haversine(aLat,aLng,bLat,bLng){ var R=6371,t=Math.PI/180,dLa=(bLat-aLat)*t,dLo=(bLng-aLng)*t; var s=Math.sin(dLa/2)*Math.sin(dLa/2)+Math.cos(aLat*t)*Math.cos(bLat*t)*Math.sin(dLo/2)*Math.sin(dLo/2); return 2*R*Math.asin(Math.sqrt(s)); }
  async function getJSON(u){ var r=await fetch(u,{headers:{Accept:'application/json'}}); if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); }

  $('go').addEventListener('click', async function () {
    var club=$('club').value.trim(), lat=parseFloat($('lat').value), lng=parseFloat($('lng').value), q=$('q').value.trim();
    if (isNaN(lat) || isNaN(lng) || !q) { $('prog').textContent='Need valid club coordinates and a search term.'; return; }
    $('prog').textContent='Searching…'; $('candCard').style.display='none'; $('resCard').style.display='none'; $('cands').innerHTML='';
    try {
      var arr = await getJSON('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=10&countrycodes=gb&q=' + encodeURIComponent(q));
      if (!arr || !arr.length) { $('prog').textContent='No candidates for “'+q+'”. Try another term (e.g. just “Radcliffe”).'; return; }
      arr.forEach(function (r) { r._km = Math.round(haversine(lat, lng, parseFloat(r.lat), parseFloat(r.lon)) * 10) / 10; });
      arr.sort(function (a, b) { return a._km - b._km; });
      $('prog').textContent = arr.length + ' candidate(s).';
      $('candCard').style.display = 'block';
      arr.forEach(function (r) {
        var b = document.createElement('button');
        b.className = 'cand';
        b.innerHTML = '<b>' + esc(r.display_name) + '</b><br><span class="away">~' + r._km + ' km from the ground (straight line)</span>';
        b.addEventListener('click', async function () {
          $('prog').textContent = 'Routing…';
          try {
            var j = await getJSON('https://router.project-osrm.org/route/v1/driving/' + lng + ',' + lat + ';' + r.lon + ',' + r.lat + '?overview=false');
            if (!j || j.code !== 'Ok' || !j.routes.length) { $('prog').textContent='No road route to that point.'; return; }
            var mi = Math.round((j.routes[0].distance / 1609.344) * 10) / 10;
            $('res').textContent = club + ' → ' + mi + ' miles by road';
            $('paste').textContent = JSON.stringify({ name: club, station_distance_mi: mi, station_geocoded: r.display_name });
            $('resCard').style.display = 'block';
            $('prog').textContent = 'Done — paste the line below to Claude (or just tell me the number).';
          } catch (e) { $('prog').textContent = 'Routing error: ' + e.message; }
        });
        $('cands').appendChild(b);
      });
    } catch (e) { $('prog').textContent = 'Search error: ' + e.message; }
  });
})();
</script>
</body>
</html>
