  /* Matchday strip — many items, horizontal scroll. */
  #pageWrap .totw-mdrow {
    display: flex; gap: 6px; overflow-x: auto;
    padding: 0 4px 6px; margin: 0 -4px;
    scrollbar-width: thin;
  }
  #pageWrap .totw-mdrow::-webkit-scrollbar { height: 6px; }
  #pageWrap .totw-mdrow::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  #pageWrap .totw-mdpill {
    -webkit-appearance: none; appearance: none;
    font: inherit; font-size: var(--text-xs); font-weight: 800;
    padding: 6px 12px; border-radius: var(--radius-pill);
    background: var(--white); color: var(--text);
    border: 1px solid var(--border); cursor: pointer;
    flex: none; white-space: nowrap;
    text-transform: uppercase; letter-spacing: var(--tracking-tight);
  }
  #pageWrap .totw-mdpill:hover { background: var(--off-white); }
  #pageWrap .totw-mdpill.is-active { background: var(--navy); color: var(--white); border-color: var(--navy); }
  #pageWrap .totw-mdpill.is-today { box-shadow: inset 0 0 0 2px var(--primary); }
  /* ----- Inline empty state (smaller than brand .empty-state) ----- */
  #pageWrap .totw-noresults {
    padding: 18px 14px; text-align: center;
    background: var(--off-white); border: 1px dashed var(--border); border-radius: var(--radius-sm);
    color: var(--text-muted); font-size: var(--text-sm);
  }

  /* ----- Flat list: one row per voted player, sorted by votes desc ----- */
  #pageWrap .totw-list {
    background: var(--white); border: 1px solid var(--border); border-radius: var(--radius);
    overflow: hidden; box-shadow: var(--shadow);
  }
  #pageWrap .totw-listrow {
    display: grid;
    grid-template-columns: 28px 1.6fr 1.4fr 70px 90px 60px 36px;
    align-items: center; gap: 10px;
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
    font-size: var(--text-sm);
  }
  #pageWrap .totw-listrow:last-child { border-bottom: none; }
  #pageWrap .totw-listrow.is-head {
    background: var(--navy); color: var(--white);
    font-size: var(--text-xs); text-transform: uppercase; letter-spacing: var(--tracking-wide);
    font-weight: 800; padding: 6px 12px;
  }
  #pageWrap .totw-listrow:not(.is-head):hover { background: var(--off-white); }
  #pageWrap .totw-listrow__pos { font-size: var(--text-xs); font-weight: 800; color: var(--text-muted); text-align: center; }
  #pageWrap .totw-listrow.is-head .totw-listrow__pos { color: var(--white); }
  #pageWrap .totw-listrow__player { min-width: 0; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #pageWrap .totw-listrow__player small {

  #pageWrap .totw-listrow__player .totw-pos {

  #pageWrap .totw-listrow__match .totw-ha {

  #pageWrap .totw-listrow__bar {
    background: var(--off-white); border-radius: 4px; height: 8px; overflow: hidden;
    box-shadow: inset 0 0 0 1px var(--border);
  }
  #pageWrap .totw-listrow__bar > span { display: block; height: 100%; background: var(--bar, var(--navy)); border-radius: 4px; }
  #pageWrap .totw-listrow__count { font-weight: 900; font-variation-settings: 'wght' 900; font-size: var(--text-sm); color: var(--text); text-align: right; }
  #pageWrap .totw-listrow__notes { text-align: right; }
  #pageWrap .totw-listrow__notes span {
    display: inline-block; min-width: 22px; padding: 2px 6px;
    background: var(--amber-light); color: var(--amber-deep);
    font-size: var(--text-xs); font-weight: 800; border-radius: var(--radius-pill);
  }
  #pageWrap .totw-listrow__notes span.is-empty { background: transparent; color: var(--text-muted); font-weight: 400; }

  /* Tap-to-expand: rows with notes get a subtle hover + a clickable
     cursor; the expanded state tints background to flag which row
     is open. Rows without notes don't react. */
  #pageWrap .totw-listrow.is-expandable { cursor: pointer; }
  #pageWrap .totw-listrow.is-expanded {
    background: color-mix(in srgb, var(--primary) 6%, var(--white));
    border-bottom-color: color-mix(in srgb, var(--primary) 14%, var(--border));
  }

  /* Inline notes panel — spans the full width under an expanded row.
     Uses grid-column: 1 / -1 to break out of the row's column grid. */
  #pageWrap .totw-listnotes {
    grid-column: 1 / -1;
    background: var(--white);
    border-top: 1px dashed var(--border);
    padding: 10px 14px 12px;
    margin: 8px -12px -8px;
    display: grid; gap: 8px;
  }
  #pageWrap .totw-listnote {
    border-left: 3px solid var(--primary);
    background: var(--off-white);
    padding: 8px 12px;
    border-radius: var(--radius-sm);
    display: grid; row-gap: 4px;
    font-size: var(--text-sm);
  }
  #pageWrap .totw-listnote__quote { line-height: 1.45; color: var(--text); font-style: italic; }
  #pageWrap .totw-listnote__attrib { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: var(--text-xs); color: var(--text-muted); }
  #pageWrap .totw-listnote__attrib b { color: var(--navy); font-weight: 800; }
  #pageWrap .totw-listnote__copy {
    margin-left: auto; font: inherit;
    font-size: var(--text-xs); font-weight: 700;
    text-transform: uppercase; letter-spacing: var(--tracking-tight);
    background: none; border: none; color: var(--primary); cursor: pointer;
    padding: 2px 0; text-decoration: underline; text-underline-offset: 3px;
  }

  /* On narrow viewports, collapse the score and bar columns; keep player+match prominent. */
  @media (max-width: 640px) {
    #pageWrap .totw-listrow { grid-template-columns: 22px 1.6fr 1fr 50px 28px; gap: 8px; padding: 8px 10px; }
    #pageWrap .totw-listrow__score { display: none; }
    #pageWrap .totw-listrow__bar { display: none; }
  }

  /* ----- Page footer (export actions) ----- */
  #pageWrap .totw-actions { margin-top: 22px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
</style>

  /* ============================================================
     UTIL
     ============================================================ */
  function h(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function showBanner(msg, cls) {
    $banner.hidden = false;
    $banner.className = 'totw-banner' + (cls ? ' is-' + cls : '');
    $banner.textContent = msg;
  }
  function hideBanner() { $banner.hidden = true; }
  function copy(text) {
    if (!text) return;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        if (window.NL && NL.toast) NL.toast('Copied', 'success');
      });
    } else {
      var ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta);
      if (window.NL && NL.toast) NL.toast('Copied', 'success');
    }
  }
  function koOf(m) {
    var ks = m && m.attributes && m.attributes.kickOffDateUTC;
    if (!ks) return null;
    return new Date(String(ks).replace(' ', 'T') + 'Z');
  }
  function bstDateOf(d) {
    return d ? d.toLocaleDateString('en-CA', { timeZone: 'Europe/London' }) : '';
  }
  function bstDayLabel(d) {
    if (!d) return '';
    var parts = d.toLocaleDateString('en-GB', { timeZone: 'Europe/London', weekday: 'short', day: 'numeric', month: 'short' }).split(' ');
    return parts.join(' ').toUpperCase();
  }
  function fmtMatchTime(d) {
    if (!d) return '';
    return d.toLocaleString('en-GB', { timeZone: 'Europe/London', weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
  }
  function matchStateOf(m) {
    var period = m.attributes && m.attributes.matchPeriod;
    if (period === 'Postponed') return 'postponed';
    if (period === 'Abandoned') return 'abandoned';
    var ko = koOf(m);
    if (!ko) return 'pre';
    var now = Date.now();
    if (now < ko.getTime()) return 'pre';
    if (period === 'FullTime' || period === 'PostMatch') return 'post';
    if (now < ko.getTime() + 105 * 60000) return 'live';
    return 'post';
  }
  function paletteForTeam(teamId) {
    var c = state.clubsByOpta[teamId];
    var cols = c && c.colors;
    return {
      primary:   (cols && cols.primary)   || '#223b7c',
      secondary: (cols && cols.secondary) || '#ffffff'
    };
  }
  function teamNameFor(teamId) {
    var c = state.clubsByOpta[teamId];
    if (c && (c.short || c.name)) return c.short || c.name;
    for (var i = 0; i < state.allMatches.length; i++) {
      var a = state.allMatches[i].attributes;
      if (a.homeTeam.teamID === teamId) return a.homeTeam.shortName || a.homeTeam.name;
      if (a.awayTeam.teamID === teamId) return a.awayTeam.shortName || a.awayTeam.name;
    }
    return teamId;
  }

  /* ============================================================
     LEVEL RESOLUTION
     ============================================================ */
  function resolveLevel(session) {
    /* Superadmin always sees the top tier regardless of any per-tool
       grant — matches the portal's own convention. */
    if (session && session.role === 'superadmin') return 'admin';

    var raw = session && session.tools && session.tools[NL_TOOL_KEY];
    if (typeof raw === 'string') return raw;
    if (raw && typeof raw === 'object') {
      if (raw.admin)  return 'admin';
      if (raw.access) return 'access';
      return 'off';
    }
    var role = session && session.role;
    if (role === 'admin') return 'admin';
    if (role === 'staff') return 'access';
    return 'hidden';
  }

  /* ============================================================
     DATA: clubs meta
     ============================================================ */
  function loadClubsMeta() {
    return fetch(CLUBS_META_URL, { credentials: 'omit', cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('clubs-meta ' + r.status); return r.json(); })
      .then(function (json) {
        var clubs = (json && json.clubs) || [];
        var map = {};
        clubs.forEach(function (c) { if (c && c.optaID) map[c.optaID] = c; });
        state.clubsByOpta = map;
      })
      .catch(function () { state.clubsByOpta = {}; });
  }

  /* ============================================================
     DATA: fixtures
     ============================================================ */
  function fetchAllFixtures() {
    return Promise.all(COMP_IDS.map(fetchOneComp))
      .then(function (results) { return [].concat.apply([], results); });
  }
  function fetchOneComp(compId) {
    var all = [];
    function page(n) {
      var url = API_BASE + '/matches/?competitionID=' + compId +
                '&seasonID=' + SEASON_ID +
                '&sort=kickOffDateUTC&page.number=' + n + '&page.size=100';
      return fetch(url, { credentials: 'omit' })
        .then(function (r) { if (!r.ok) throw new Error('fixtures ' + compId + ' ' + r.status); return r.json(); })
        .then(function (json) {
          var d = (json && json.data) || [];
          all = all.concat(d);
          var total = json && json.meta && json.meta.totalCount;
          if (d.length === 100 && (total == null || all.length < total) && n < MAX_PAGES) return page(n + 1);
        });
    }
    return page(1).then(function () { return all; });
  }

  /* ============================================================
     DATA: nl-widgets (users + votes)
     ============================================================ */
  function initWidgetsApp() {
    var existing = firebase.apps && firebase.apps.filter(function (a) { return a.name === WIDGETS_APP_NAME; })[0];
    var fb = existing || firebase.initializeApp(WIDGETS_CONFIG, WIDGETS_APP_NAME);
    state.widgetsDb = firebase.database(fb);
    return firebase.auth(fb).signInAnonymously();
  }
  function loadFanData() {
    return Promise.all([
      state.widgetsDb.ref('users').once('value').then(function (s) { state.allUsers = s.val() || {}; }),
      new Promise(function (resolve) {
        // Live subscription so the staff dashboard ticks during the
        // voting window. First snapshot resolves the boot.
        var first = true;
        state.widgetsDb.ref('motm').on('value', function (s) {
          state.allVotes = s.val() || {};
          if (first) { first = false; resolve(); }
          else if (state.loaded) { render(); }
        });
      })
    ]);
  }

  /* ============================================================
     PREFS (nl-tools, default app)
     ============================================================ */
  var prefsTimer = null;
  function savePrefsSoon() {
    if (prefsTimer) clearTimeout(prefsTimer);
    prefsTimer = setTimeout(function () {
      var uid = state.session && state.session.uid;
      if (!uid) return;
      db.ref('app-data/staff-team-of-the-week/prefs/' + uid).update({
        activeTab: state.activeTab,
        compId: state.selectedComp,
        matchday: state.selectedMatchday,
        selectedClub: state.selectedClub || null,
        updatedAt: firebase.database.ServerValue.TIMESTAMP
      }).catch(function () { /* non-critical */ });
    }, PREFS_DEBOUNCE_MS);
  }
  function loadPrefs() {
    var uid = state.session && state.session.uid;
    if (!uid) return Promise.resolve(null);
    return db.ref('app-data/staff-team-of-the-week/prefs/' + uid).once('value')
      .then(function (s) { return s.val() || null; })
      .catch(function () { return null; });
  }

  /* ============================================================
     DERIVED: matchday keys for the selected comp
     ============================================================ */
  function matchInComp(m) {
    if (state.selectedComp === 'all') return true;
    return m.attributes.competitionID === state.selectedComp;
  }
  /* Human label for the active comp filter. Centralises the lookup so
     'all' never crashes against COMPS — used by audit, exports, and
     anywhere we want to print the active scope. */
  function compLabel(short) {
    if (state.selectedComp === 'all') return short ? 'All' : 'All divisions';
    var c = COMPS[state.selectedComp];
    if (!c) return short ? '?' : 'Unknown';
    return short ? c.shortName : c.name;
  }
  function matchdayKeys() {
    var seen = {};
    state.allMatches.forEach(function (m) {
      if (!matchInComp(m)) return;
      var k = bstDateOf(koOf(m));
      if (k) seen[k] = true;
    });
    return Object.keys(seen).sort();
  }
  /* For the All filter, surface which divisions a particular matchday
     covers (so the matchday pill can show a division code prefix). */
  function defaultMatchday() {
    var keys = matchdayKeys();
    if (!keys.length) return null;
    var todayKey = bstDateOf(new Date());
    var past = keys.filter(function (k) { return k <= todayKey; });
    return past.length ? past[past.length - 1] : keys[0];
  }
  function matchesForSelected() {
    return state.allMatches.filter(function (m) {
      if (!matchInComp(m)) return false;
      return bstDateOf(koOf(m)) === state.selectedMatchday;
    }).sort(function (a, b) {
      return (a.attributes.kickOffDateUTC || '').localeCompare(b.attributes.kickOffDateUTC || '');
    });
  }

  /* ============================================================
     DERIVED: votes per match (with optional voter-club filter)
     ============================================================ */
  function votesForMatch(matchId, clubFilter) {
    var voters = state.allVotes;
    var rows = [];
    Object.keys(voters).forEach(function (jwtId) {
      var v = voters[jwtId] && voters[jwtId][matchId];
      if (!v || !v.playerId) return;
      var u = state.allUsers[jwtId];
      var voterTeamName = (u && u.teamName) || '— (unregistered) —';
      if (clubFilter && voterTeamName !== clubFilter) return;
      rows.push({
        jwtId: jwtId,
        playerId: v.playerId,
        playerName: v.playerName || v.playerId,
        teamId: v.teamId,
        note: v.note || '',
        submittedAt: v.submittedAt || 0,
        voter: u || null,
        voterTeamName: voterTeamName
      });
    });
    return rows;
  }
  function rankPlayers(votes) {
    var by = {};
    votes.forEach(function (v) {
      var k = v.playerId;
      if (!by[k]) by[k] = { playerId: v.playerId, name: v.playerName, teamId: v.teamId, votes: 0, notes: 0, voterClubs: {}, notesList: [] };
      by[k].votes += 1;
      if (v.note) { by[k].notes += 1; by[k].notesList.push(v); }
      by[k].voterClubs[v.voterTeamName] = (by[k].voterClubs[v.voterTeamName] || 0) + 1;
    });
    return Object.keys(by).map(function (k) { return by[k]; }).sort(function (a, b) {
      return b.votes - a.votes || a.name.localeCompare(b.name);
    });
  }
  /* ============================================================
     LAZY LINEUP FETCH (for player position in the list view)
     ============================================================ */
  /* Match endpoint provides per-player position from the NLS feed:
     attributes.matchTeams[].players.{Start,Sub}[] each carry
     playerID, playerName.{knownName,customKnownName,firstName,lastName},
     shirtNumber, playerPosition, playerSubPosition (when starter pos
     is 'Substitute'), playerStatus ('Start' | 'Sub' | …).
     We cache by matchId and re-render the list view when the fetch
     resolves, so the page renders immediately and positions appear
     once the lineup data lands. */
  function ensurePlayers(matchId) {
    var entry = state.players[matchId];
    if (entry && (entry.loading || entry.list)) return;
    state.players[matchId] = { loading: true };
    fetch(API_BASE + '/matches/' + matchId, { credentials: 'omit' })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (json) {
        var teams = (json && json.data && json.data.attributes && json.data.attributes.matchTeams) || [];
        var list = [];
        teams.forEach(function (team) {
          var teamID = team.teamID;
          var all = (team.players && team.players.Start || []).concat(team.players && team.players.Sub || []);
          all.forEach(function (p) {
            var pn = p.playerName || {};
            var name = pn.knownName || pn.customKnownName || ((pn.firstName || '') + ' ' + (pn.lastName || '')).trim();
            list.push({
              playerId: p.playerID,
              name:     name || ('Player ' + p.playerID),
              shirt:    p.shirtNumber,
              position: (p.playerPosition === 'Substitute' && p.playerSubPosition) ? p.playerSubPosition : p.playerPosition,
              status:   p.playerStatus,
              teamId:   teamID
            });
          });
        });
        state.players[matchId] = { list: list };
        /* Caller (renderMatches / renderByClub) handles a single
           deferred re-render once all pending lineup fetches have
           settled. We don't re-render here because firing one render
           per resolved fetch was thrashing the page on busy days. */
      })
      .catch(function (err) {
        state.players[matchId] = { error: err && err.message ? err.message : String(err) };
      });
  }
  function findPlayerInfo(matchId, playerId) {
    var entry = state.players[matchId];
    if (!entry || !entry.list) return null;
    for (var i = 0; i < entry.list.length; i++) {
      if (entry.list[i].playerId === playerId) return entry.list[i];
    }
    return null;
  }
  /* Compact position code — feeds tend to be wordy ("Goalkeeper",
     "Defender", "Midfielder", "Forward"). Compress to GK/DEF/MID/FWD
     so the list row stays scannable. Pass through anything we
     don't recognise. */
  function shortPos(p) {
    if (!p) return '';
    var s = String(p).toLowerCase();
    if (s === 'goalkeeper') return 'GK';
    if (s === 'defender')   return 'DEF';
    if (s === 'midfielder') return 'MID';
    if (s === 'forward' || s === 'attacker' || s === 'striker') return 'FWD';
    if (s === 'substitute') return 'SUB';
    return String(p).substring(0, 4).toUpperCase();
  }

  /* ============================================================
     RENDER: main tabs (Matchday / By Club / Season)
     ============================================================ */
  var TABS = [
    { id: 'matchday', label: 'Matchday' },
    { id: 'byclub',   label: 'By Club' },
    { id: 'season',   label: 'Season' }
  ];
  function renderMaintabs() {
    $maintabs.innerHTML = TABS.map(function (t) {
      /* Brand .tab modifier is `.active` (not `.is-active`). */
      var active = (t.id === state.activeTab) ? ' active' : '';
      return '<button type="button" class="tab' + active + '" data-tab="' + h(t.id) + '">' + h(t.label) + '</button>';
    }).join('');
    Array.prototype.forEach.call($maintabs.querySelectorAll('[data-tab]'), function (b) {
      b.addEventListener('click', function () {
        state.activeTab = b.getAttribute('data-tab');
        savePrefsSoon();
        render();
      });
    });
  }

  /* ============================================================
     RENDER: filter row (division tabs only — Notes-only toggle gone)
     ============================================================ */
  function renderFilters() {
    /* Division filter — National / North / South.
       Hidden on the By Club tab (the picked club implies a division). */
    if (state.activeTab === 'byclub') { $filters.innerHTML = ''; return; }
    $filters.innerHTML = '<div class="tabs totw-divtabs">' +
      COMP_IDS.map(function (id) {
        var active = (String(state.selectedComp) === String(id)) ? ' active' : '';
        return '<button type="button" class="tab' + active + '" data-comp="' + h(String(id)) + '">' + h(COMPS[id].shortName) + '</button>';
      }).join('') +
    '</div>';

    Array.prototype.forEach.call($filters.querySelectorAll('[data-comp]'), function (b) {
      b.addEventListener('click', function () {
        state.selectedComp = Number(b.getAttribute('data-comp'));
        state.selectedMatchday = defaultMatchday();
        state.expandedRow = null;
        savePrefsSoon();
        render();
      });
    });
  }

  /* ============================================================
     RENDER: matchday strip
     ============================================================ */
  function renderMatchdayStrip() {
    var keys = matchdayKeys();
    var todayKey = bstDateOf(new Date());
    if (!keys.length) {
      $mdrow.innerHTML = '<div class="totw-mdrow"><span class="text-secondary" style="padding:6px 0;">No fixtures in this division yet.</span></div>';
      return;
    }
    $mdrow.innerHTML =
      '<div class="totw-mdrow">' +
        keys.map(function (k) {
          var active = (k === state.selectedMatchday) ? ' is-active' : '';
          var today  = (k === todayKey) ? ' is-today' : '';
          var d = new Date(k + 'T12:00:00Z');
          return '<button type="button" class="totw-mdpill' + active + today + '" data-md="' + h(k) + '">' +
            h(bstDayLabel(d)) +
          '</button>';
        }).join('') +
      '</div>';

    Array.prototype.forEach.call($mdrow.querySelectorAll('[data-md]'), function (b) {
      b.addEventListener('click', function () {
        state.selectedMatchday = b.getAttribute('data-md');
        state.expandedRow = null;
        savePrefsSoon();
        render();
      });
    });
    var activePill = $mdrow.querySelector('.totw-mdpill.is-active');
    if (activePill && activePill.scrollIntoView) activePill.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'auto' });
  }

  /* ============================================================
     RENDER: matchday flat list — the heart of the tool.
     One row per player who got at least one MOTM vote in the
     matchday, sorted by vote count descending. Match details are
     inline as reference (opp + H/A + score). Admin tier: tap a row
     to expand the voter notes inline underneath that row.
     ============================================================ */
  function renderMatches() {
    var matches = matchesForSelected();
    if (!matches.length) {
      $matches.innerHTML =
        '<div class="empty-state">' +
          '<div class="empty-state__icon">📭</div>' +
          '<div class="empty-state__title">No ' + h(compLabel(true)) + ' fixtures on this matchday</div>' +
          '<div class="empty-state__text">Pick a different date above, or switch division.</div>' +
        '</div>';
      return;
    }

    /* Lazy lineup fetches (for player position). Single deferred
       re-render after 1.5s once any are pending — never one per fetch. */
    var needsFetch = matches.filter(function (m) { return !state.players[m.id]; });
    needsFetch.forEach(function (m) { ensurePlayers(m.id); });
    if (needsFetch.length && !state._lineupRerenderTimer) {
      state._lineupRerenderTimer = setTimeout(function () {
        state._lineupRerenderTimer = null;
        if (state.activeTab === 'matchday') renderMatches();
      }, 1500);
    }

    /* Pre-compute teamId → palette so the per-row lookup is O(1). */
    var palByTeamId = {};
    matches.forEach(function (m) {
      var a = m.attributes;
      if (a.homeTeam && a.homeTeam.teamID && !palByTeamId[a.homeTeam.teamID]) {
        palByTeamId[a.homeTeam.teamID] = paletteForTeam(a.homeTeam.teamID);
      }
      if (a.awayTeam && a.awayTeam.teamID && !palByTeamId[a.awayTeam.teamID]) {
        palByTeamId[a.awayTeam.teamID] = paletteForTeam(a.awayTeam.teamID);
      }
    });

    /* Flatten: every voted player across every fixture, with match
       context attached. Sorted by votes desc. */
    var rows = [];
    matches.forEach(function (m) {
      var a = m.attributes;
      var ms = matchStateOf(m);
      var hs = (a.homeTeam.score != null) ? a.homeTeam.score : null;
      var as = (a.awayTeam.score != null) ? a.awayTeam.score : null;
      var scoreText, scoreFuture = false;
      if (ms === 'pre') { scoreText = fmtMatchTime(koOf(m)); scoreFuture = true; }
      else if (ms === 'postponed') { scoreText = 'P-P'; scoreFuture = true; }
      else if (ms === 'abandoned') { scoreText = 'ABD'; scoreFuture = true; }
      else if (hs != null && as != null) { scoreText = hs + '–' + as; }
      else { scoreText = '?–?'; }

      var votes = votesForMatch(m.id, null);
      var ranked = rankPlayers(votes);
      ranked.forEach(function (p) {
        var isHome = (p.teamId === a.homeTeam.teamID);
        var ownTeam = isHome ? a.homeTeam : a.awayTeam;
        var oppTeam = isHome ? a.awayTeam : a.homeTeam;
        var info = findPlayerInfo(m.id, p.playerId);
        var noteVotes = votes.filter(function (v) { return v.playerId === p.playerId && !!v.note; });
        rows.push({
          rowKey: m.id + ':' + p.playerId,
          playerId: p.playerId,
          name: p.name,
          teamId: p.teamId,
          teamName: teamNameFor(p.teamId),
          ownTeamShort: ownTeam.shortName || ownTeam.name || '',
          oppShort: oppTeam.shortName || oppTeam.name || '',
          ha: isHome ? 'H' : 'A',
          scoreText: scoreText,
          scoreFuture: scoreFuture,
          votes: p.votes,
          notes: p.notes,
          noteVotes: noteVotes,
          position: info && info.position ? shortPos(info.position) : '',
          shirtNumber: info ? info.shirt : null
        });
      });
    });

    rows.sort(function (a, b) { return b.votes - a.votes || a.name.localeCompare(b.name); });

    if (!rows.length) {
      $matches.innerHTML =
        '<div class="empty-state">' +
          '<div class="empty-state__icon">📭</div>' +
          '<div class="empty-state__title">No votes recorded yet</div>' +
          '<div class="empty-state__text">Wait for the voting window to open.</div>' +
        '</div>';
      return;
    }

    var maxVotes = rows[0].votes || 1;
    var rowsHtml = rows.map(function (r, i) { return renderListRow(r, i, maxVotes, palByTeamId); }).join('');
    $matches.innerHTML = '<div class="totw-list">' + rowsHtml + '</div>';
    wireListRows($matches);
  }

  /* Build a single row of the flat list. Player rows with notes are
     tap-targets that expand the notes inline beneath. */
  function renderListRow(r, i, maxVotes, palByTeamId) {
    var teamPal = palByTeamId[r.teamId] || { primary: 'var(--navy)' };
    var barPct = Math.round(r.votes / maxVotes * 100);
    var pos = r.position ? '<span class="totw-pos">' + h(r.position) + '</span>' : '';
    var shirt = (r.shirtNumber != null) ? '<span class="totw-shirt">#' + h(r.shirtNumber) + '</span>' : '';
    var notesBadge = r.notes
      ? '<span>' + r.notes + '</span>'
      : '<span class="is-empty">·</span>';
    var scoreCls = r.scoreFuture ? ' is-future' : '';
    var expanded   = (state.expandedRow === r.rowKey);
    var expandable = state.canSeeNotes && r.notes > 0;
    var rowCls = 'totw-listrow' +
      (expanded ? ' is-expanded' : '') +
      (expandable ? ' is-expandable' : '');
    var dataAttr = expandable ? ' data-row="' + h(r.rowKey) + '"' : '';

    var notesPanel = '';
    if (expanded && state.canSeeNotes && r.noteVotes.length) {
      notesPanel = '<div class="totw-listnotes">' +
        r.noteVotes
          .sort(function (a, b) { return (b.submittedAt || 0) - (a.submittedAt || 0); })
          .map(renderInlineNote).join('') +
      '</div>';
    }

    return '<div class="' + rowCls + '"' + dataAttr + '>' +
      '<div class="totw-listrow__pos">' + (i + 1) + '</div>' +
      '<div class="totw-listrow__player">' + shirt + h(r.name) + pos +
        '<small>' + h(r.teamName) + '</small>' +
      '</div>' +
      '<div class="totw-listrow__match"><strong>' + h(r.ownTeamShort) + '</strong> v ' + h(r.oppShort) +
        '<span class="totw-ha">' + h(r.ha) + '</span>' +
      '</div>' +
      '<div class="totw-listrow__score' + scoreCls + '">' + h(r.scoreText) + '</div>' +
      '<div class="totw-listrow__bar" style="--bar:' + h(teamPal.primary) + ';"><span style="width:' + barPct + '%;"></span></div>' +
      '<div class="totw-listrow__count">' + r.votes + '</div>' +
      '<div class="totw-listrow__notes">' + notesBadge + '</div>' +
      notesPanel +
    '</div>';
  }

  /* A single inline-expanded note inside an expanded list row. */
  function renderInlineNote(v) {
    var voter = v.voter || {};
    var name = ((voter.forename || '') + ' ' + (voter.surnameInitial || '')).trim();
    if (voter.surnameInitial) name += '.';
    if (!name) name = 'fan';
    var club = v.voterTeamName || '';
    var stamp = v.submittedAt ? new Date(v.submittedAt).toLocaleString('en-GB', { timeZone: 'Europe/London', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';
    return '<div class="totw-listnote">' +
      '<div class="totw-listnote__quote">"' + h(v.note) + '"</div>' +
      '<div class="totw-listnote__attrib">' +
        '<b>' + h(name) + '</b>' +
        '<span>· ' + h(club) + ' fan</span>' +
        (voter.email ? '<span>· ' + h(voter.email) + '</span>' : '') +
        (stamp ? '<span>· ' + h(stamp) + '</span>' : '') +
        '<button type="button" class="totw-listnote__copy" data-copy-note="' + h(encodeURIComponent(v.note + ' — ' + name + ' (' + club + ' fan)')) + '">Copy</button>' +
      '</div>' +
    '</div>';
  }

  /* Click handlers — scoped to whichever container the list is
     rendered in (works for both matchday + by club views). */
  function wireListRows(root) {
    Array.prototype.forEach.call(root.querySelectorAll('[data-row]'), function (el) {
      el.addEventListener('click', function (e) {
        if (e.target.closest('.totw-listnotes')) return; /* clicks inside notes don't toggle */
        var key = el.getAttribute('data-row');
        state.expandedRow = (state.expandedRow === key) ? null : key;
        render();
      });
    });
    Array.prototype.forEach.call(root.querySelectorAll('[data-copy-note]'), function (b) {
      b.addEventListener('click', function (e) {
        e.stopPropagation();
        try { copy(decodeURIComponent(b.getAttribute('data-copy-note'))); } catch (err) {}
      });
    });
  }

  /* ============================================================
     RENDER: page footer actions
     ============================================================ */
  function renderActions() {
    /* Only on the Matchday tab — the only place an "export this
       matchday for an article" action makes sense. */
    if (state.activeTab !== 'matchday') { $actions.innerHTML = ''; return; }
    var matches = matchesForSelected();
    if (!matches.length) { $actions.innerHTML = ''; return; }
    $actions.innerHTML =
      '<button type="button" class="btn btn--ghost btn--sm" id="totw-copy-md">Copy for article (Markdown)</button>';
    document.getElementById('totw-copy-md').addEventListener('click', function () { copy(buildRoundupMarkdown()); });
  }

  /* ============================================================
     EXPORT BUILDERS
     ============================================================ */
  function buildRoundupMarkdown() {
    var matches = matchesForSelected();
    var lines = [];
    lines.push('## ' + compLabel(true) + ' — ' + state.selectedMatchday);
    lines.push('');
    matches.forEach(function (m) {
      var a = m.attributes;
      var rows = votesForMatch(m.id, null);
      var ranked = rankPlayers(rows);
      var score = (a.homeTeam.score != null && a.awayTeam.score != null) ? (a.homeTeam.score + '-' + a.awayTeam.score) : 'vs';
      lines.push('**' + a.homeTeam.name + ' ' + score + ' ' + a.awayTeam.name + '**');
      if (!ranked.length) { lines.push('- No votes.'); lines.push(''); return; }
      ranked.slice(0, 3).forEach(function (p, i) {
        var pct = rows.length ? Math.round(p.votes / rows.length * 100) : 0;
        lines.push('- ' + (i + 1) + '. **' + p.name + '** (' + teamNameFor(p.teamId) + ') — ' + p.votes + ' votes (' + pct + '%)');
      });
      if (state.canSeeNotes) {
        var notes = rows.filter(function (r) { return r.note; });
        if (notes.length) {
          lines.push('  - Notes:');
          notes.slice(0, 5).forEach(function (v) {
            var voter = v.voter || {};
            var name = ((voter.forename || '') + ' ' + (voter.surnameInitial || '')).trim();
            if (voter.surnameInitial) name += '.';
            lines.push('    - "' + v.note + '" — ' + name + ' (' + v.voterTeamName + ' fan)');
          });
        }
      }
      lines.push('');
    });
    return lines.join('\n');
  }

  /* ============================================================
     MAIN RENDER
     ============================================================ */
  function render() {
    renderMaintabs();
    renderFilters();
    /* Show/hide the three tab containers and render only the active one. */
    $tabMatchday.hidden = (state.activeTab !== 'matchday');
    $tabByClub.hidden   = (state.activeTab !== 'byclub');
    $tabSeason.hidden   = (state.activeTab !== 'season');
    if (state.activeTab === 'matchday') {
      renderMatchdayStrip();
      renderMatches();
      renderActions();
    } else if (state.activeTab === 'byclub') {
      renderByClub();
    } else if (state.activeTab === 'season') {
      renderSeason();
    }
  }

  /* ============================================================
     DERIVED helpers for By Club + Season tabs
     ============================================================ */
  /* All clubs that have played a fixture this season, grouped by
     division. Source of truth is the fixtures list (not clubs-meta)
     so the picker always matches the real season set. */
  function allClubsCatalogue() {
    var seen = {};
    state.allMatches.forEach(function (m) {
      var a = m.attributes;
      [a.homeTeam, a.awayTeam].forEach(function (t) {
        if (!t || !t.teamID) return;
        if (!seen[t.teamID]) {
          /* Resolve crest from clubs-meta first (most reliable), then
             fall back to the API-provided crest URL on the fixture. */
          var meta = state.clubsByOpta[t.teamID];
          seen[t.teamID] = {
            teamId: t.teamID,
            name: t.name || t.shortName || t.teamID,
            shortName: t.shortName,
            divisionId: a.competitionID,
            divisionShort: COMPS[a.competitionID] ? COMPS[a.competitionID].shortName : '?',
            crest: (meta && meta.crest) || t.crest || ''
          };
        }
      });
    });
    return Object.keys(seen).map(function (k) { return seen[k]; })
      .sort(function (a, b) {
        var di = (a.divisionId || 0) - (b.divisionId || 0);
        if (di) return di;
        return a.name.localeCompare(b.name);
      });
  }
  /* Every match where the given club played, sorted most-recent first. */
  function matchesForClub(teamId) {
    return state.allMatches.filter(function (m) {
      var a = m.attributes;
      return (a.homeTeam && a.homeTeam.teamID === teamId) ||
             (a.awayTeam && a.awayTeam.teamID === teamId);
    }).sort(function (a, b) {
      return (b.attributes.kickOffDateUTC || '').localeCompare(a.attributes.kickOffDateUTC || '');
    });
  }
  /* Season-wide player aggregation, filtered by comp (or 'all'). */
  function seasonPlayerRanks() {
    var byPlayer = {};
    state.allMatches.forEach(function (m) {
      if (!matchInComp(m)) return;
      var mid = m.id;
      var voters = state.allVotes || {};
      Object.keys(voters).forEach(function (jwtId) {
        var v = voters[jwtId] && voters[jwtId][mid];
        if (!v || !v.playerId) return;
        var k = v.playerId;
        if (!byPlayer[k]) byPlayer[k] = { playerId: k, name: v.playerName || k, teamId: v.teamId, votes: 0, notes: 0, matches: {} };
        byPlayer[k].votes += 1;
        if (v.note) byPlayer[k].notes += 1;
        byPlayer[k].matches[mid] = true;
      });
    });
    return Object.keys(byPlayer).map(function (k) {
      var p = byPlayer[k];
      p.matchCount = Object.keys(p.matches).length;
      return p;
    }).sort(function (a, b) {
      return b.votes - a.votes || b.notes - a.notes || a.name.localeCompare(b.name);
    });
  }

  /* ============================================================
     RENDER: By Club tab
     ============================================================ */
  function renderByClub() {
    var catalogue = allClubsCatalogue();
    if (!catalogue.length) {
      $tabByClub.innerHTML = '<div class="empty-state"><div class="empty-state__icon">⏳</div><div class="empty-state__title">No fixtures loaded yet</div></div>';
      return;
    }

    /* Picker — brand .club-picker typeahead with crest. Native <select>
       looks systemy on every browser and can't show crests; the brand
       component is the right call for clubs (same as Vacancies /
       Judgements). */
    var selected = state.selectedClub ? catalogue.filter(function (c) { return c.teamId === state.selectedClub; })[0] : null;
    var pickerCrest = (selected && selected.crest) || NL_FALLBACK_CREST;
    var pickerValue = selected ? selected.name : '';
    var picker =
      '<div class="form-group" style="max-width: 380px; margin-bottom: 18px;">' +
        '<label for="totw-club-input">Pick a club</label>' +
        '<div class="club-picker" id="totw-club-picker">' +
          '<div class="club-picker__wrap">' +
            '<img class="club-picker__crest" id="totw-club-crest" src="' + h(pickerCrest) + '" alt="" ' +
              'onerror="this.onerror=null;this.src=\'' + h(NL_FALLBACK_CREST) + '\';">' +
            '<input class="club-picker__input" id="totw-club-input" type="text" autocomplete="off" ' +
              'placeholder="Type or pick a club…" value="' + h(pickerValue) + '">' +
          '</div>' +
          '<div class="club-picker__dropdown" id="totw-club-drop"></div>' +
        '</div>' +
      '</div>';

    var body = '';
    if (!state.selectedClub) {
      body =
        '<div class="empty-state">' +
          '<div class="empty-state__icon">🏟️</div>' +
          '<div class="empty-state__title">Pick a club above</div>' +
          '<div class="empty-state__text">You\'ll see every player who got fan MOTM votes across this club\'s matches this season — ranked.</div>' +
        '</div>';
    } else {
      var club = catalogue.filter(function (c) { return c.teamId === state.selectedClub; })[0];
      var clubName = club ? club.name : state.selectedClub;
      var ms = matchesForClub(state.selectedClub);

      /* Build flat list across all this club's matches — every player
         who got at least one vote, ranked. Same row idiom as the
         matchday view. */
      var palByTeamId = {};
      ms.forEach(function (m) {
        var a = m.attributes;
        if (a.homeTeam && a.homeTeam.teamID && !palByTeamId[a.homeTeam.teamID]) palByTeamId[a.homeTeam.teamID] = paletteForTeam(a.homeTeam.teamID);
        if (a.awayTeam && a.awayTeam.teamID && !palByTeamId[a.awayTeam.teamID]) palByTeamId[a.awayTeam.teamID] = paletteForTeam(a.awayTeam.teamID);
      });
      /* Trigger lazy lineup fetches for positions. */
      var needsFetch = ms.filter(function (m) { return !state.players[m.id]; });
      needsFetch.forEach(function (m) { ensurePlayers(m.id); });
      if (needsFetch.length && !state._lineupRerenderTimer) {
        state._lineupRerenderTimer = setTimeout(function () {
          state._lineupRerenderTimer = null;
          if (state.activeTab === 'byclub') renderByClub();
        }, 1500);
      }

      var rows = [];
      ms.forEach(function (m) {
        var a = m.attributes;
        var mState = matchStateOf(m);
        var hs = (a.homeTeam.score != null) ? a.homeTeam.score : null;
        var as = (a.awayTeam.score != null) ? a.awayTeam.score : null;
        var scoreText, scoreFuture = false;
        if (mState === 'pre') { scoreText = fmtMatchTime(koOf(m)); scoreFuture = true; }
        else if (mState === 'postponed') { scoreText = 'P-P'; scoreFuture = true; }
        else if (mState === 'abandoned') { scoreText = 'ABD'; scoreFuture = true; }
        else if (hs != null && as != null) { scoreText = hs + '–' + as; }
        else { scoreText = '?–?'; }
        var votes = votesForMatch(m.id, null);
        var ranked = rankPlayers(votes);
        ranked.forEach(function (p) {
          var isHome = (p.teamId === a.homeTeam.teamID);
          var ownTeam = isHome ? a.homeTeam : a.awayTeam;
          var oppTeam = isHome ? a.awayTeam : a.homeTeam;
          var info = findPlayerInfo(m.id, p.playerId);
          var noteVotes = votes.filter(function (v) { return v.playerId === p.playerId && !!v.note; });
          rows.push({
            rowKey: m.id + ':' + p.playerId,
            playerId: p.playerId, name: p.name,
            teamId: p.teamId, teamName: teamNameFor(p.teamId),
            ownTeamShort: ownTeam.shortName || ownTeam.name || '',
            oppShort: oppTeam.shortName || oppTeam.name || '',
            ha: isHome ? 'H' : 'A',
            scoreText: scoreText, scoreFuture: scoreFuture,
            votes: p.votes, notes: p.notes, noteVotes: noteVotes,
            position: info && info.position ? shortPos(info.position) : '',
            shirtNumber: info ? info.shirt : null
          });
        });
      });

      rows.sort(function (a, b) { return b.votes - a.votes || a.name.localeCompare(b.name); });

      var heading =
        '<h2 class="text-heading" style="margin: 0 0 6px;">' + h(clubName) + '</h2>' +
        '<p class="text-secondary" style="margin: 0 0 14px;">Every player ranked by MOTM votes across ' + ms.length + ' fixture' + (ms.length === 1 ? '' : 's') + ' this season.</p>';

      var listHtml;
      if (!rows.length) {
        listHtml =
          '<div class="empty-state">' +
            '<div class="empty-state__icon">📭</div>' +
            '<div class="empty-state__title">No votes for this club\'s matches yet</div>' +
          '</div>';
      } else {
        var maxVotes = rows[0].votes || 1;
        var rowsHtml = rows.map(function (r, i) { return renderListRow(r, i, maxVotes, palByTeamId); }).join('');
        listHtml = '<div class="totw-list">' + rowsHtml + '</div>';
      }

      body = heading + listHtml;
    }

    $tabByClub.innerHTML = picker + body;

    wireClubPicker(catalogue);
    wireListRows($tabByClub);
  }

  /* Brand .club-picker typeahead wiring. Single instance scoped to
     the By Club tab. */
  function wireClubPicker(catalogue) {
    var input = document.getElementById('totw-club-input');
    var drop  = document.getElementById('totw-club-drop');
    var crest = document.getElementById('totw-club-crest');
    if (!input || !drop) return;

    function buildOptions(q) {
      var needle = (q || '').trim().toLowerCase();
      var matches = needle
        ? catalogue.filter(function (c) { return c.name.toLowerCase().indexOf(needle) !== -1; })
        : catalogue.slice();
      if (!matches.length) {
        return '<div class="club-picker__freetext">No clubs match "' + h(q || '') + '"</div>';
      }
      /* Cap to 60 visible — entire NL is ~70 clubs so this only matters
         briefly while typing. */
      return matches.slice(0, 60).map(function (c) {
        var cr = c.crest || NL_FALLBACK_CREST;
        return '<div class="club-picker__option" data-teamid="' + h(c.teamId) + '">' +
          '<img src="' + h(cr) + '" alt="" onerror="this.onerror=null;this.src=\'' + h(NL_FALLBACK_CREST) + '\';">' +
          '<span class="club-picker__option-name">' + h(c.name) + '</span>' +
          '<span class="club-picker__option-div">' + h(c.divisionShort) + '</span>' +
        '</div>';
      }).join('');
    }
    function open() {
      drop.innerHTML = buildOptions(input.value);
      drop.classList.add('open');
    }
    function close() { drop.classList.remove('open'); }

    input.addEventListener('focus', open);
    input.addEventListener('input', open);
    input.addEventListener('blur', function () {
      /* Delay close so a click on a .club-picker__option lands first. */
      setTimeout(close, 150);
    });
    drop.addEventListener('mousedown', function (e) {
      var opt = e.target.closest('.club-picker__option');
      if (!opt) return;
      e.preventDefault();
      var teamId = opt.getAttribute('data-teamid');
      var club = catalogue.filter(function (c) { return c.teamId === teamId; })[0];
      if (!club) return;
      state.selectedClub = teamId;
      state.expandedRow  = null;
      input.value = club.name;
      if (crest) crest.src = club.crest || NL_FALLBACK_CREST;
      close();
      savePrefsSoon();
      render();
    });
  }

  /* ============================================================
     RENDER: Season tab
     ============================================================ */
  function renderSeason() {
    var ranked = seasonPlayerRanks();
    var divLbl = (state.selectedComp === 'all') ? 'all three divisions' : (COMPS[state.selectedComp] ? COMPS[state.selectedComp].name : '');

    if (!ranked.length) {
      $tabSeason.innerHTML =
        '<p class="text-secondary" style="margin: 0 0 14px;">' + h(divLbl[0].toUpperCase() + divLbl.slice(1)) + '.</p>' +
        '<div class="empty-state">' +
          '<div class="empty-state__icon">📈</div>' +
          '<div class="empty-state__title">No votes in this division yet</div>' +
          '<div class="empty-state__text">Switch division or wait for matches to be voted on.</div>' +
        '</div>';
      return;
    }

    /* Flat list — same row idiom as the matchday + by club views.
       Cap at 50 so the page stays scannable; the rest collapse to a
       footnote. */
    var TOP_N = 50;
    var top = ranked.slice(0, TOP_N);
    var rest = ranked.slice(TOP_N);
    var maxVotes = top[0].votes || 1;

    /* Pre-compute teamId → palette. */
    var palByTeamId = {};
    top.forEach(function (p) {
      if (!palByTeamId[p.teamId]) palByTeamId[p.teamId] = paletteForTeam(p.teamId);
    });

    /* For inline note expansion we need the voter notes for each player
       across every match they got votes on. Resolved lazily here. */
    function noteVotesForPlayer(playerId) {
      var out = [];
      var voters = state.allVotes || {};
      Object.keys(voters).forEach(function (jwtId) {
        var byMatch = voters[jwtId] || {};
        Object.keys(byMatch).forEach(function (mid) {
          var v = byMatch[mid];
          if (!v || v.playerId !== playerId || !v.note) return;
          var u = state.allUsers[jwtId] || null;
          out.push({
            playerId: playerId, note: v.note, submittedAt: v.submittedAt || 0,
            voter: u, voterTeamName: (u && u.teamName) || '— (unregistered) —'
          });
        });
      });
      return out;
    }

    var rowsHtml = top.map(function (p, i) {
      var r = {
        rowKey: 'season:' + p.playerId,
        playerId: p.playerId, name: p.name,
        teamId: p.teamId, teamName: teamNameFor(p.teamId),
        ownTeamShort: teamNameFor(p.teamId),
        oppShort: '— ' + p.matchCount + ' matches —',
        ha: '',
        scoreText: '',
        scoreFuture: true,
        votes: p.votes, notes: p.notes,
        noteVotes: (state.expandedRow === ('season:' + p.playerId)) ? noteVotesForPlayer(p.playerId) : [],
        position: '', shirtNumber: null
      };
      return renderListRow(r, i, maxVotes, palByTeamId);
    }).join('');

    var footnote = rest.length
      ? '<p class="text-secondary" style="margin: 10px 0 0;">Plus ' + rest.length + ' more player' + (rest.length === 1 ? '' : 's') + ' with fewer votes (not shown).</p>'
      : '';

    var heading =
      '<h2 class="text-heading" style="margin: 0 0 6px;">Season leaderboard</h2>' +
      '<p class="text-secondary" style="margin: 0 0 14px;">Top voted players across ' + h(divLbl) + ' this season.</p>';

    $tabSeason.innerHTML = heading + '<div class="totw-list">' + rowsHtml + '</div>' + footnote;
    wireListRows($tabSeason);
  }

  /* ============================================================
     BOOT
     ============================================================ */
  /* Render an inline loader (brand .loading-row + .spinner) while the
     boot fetches resolve. Replaces any previous content of $matches. */
  function showLoading(msg) {
    if (!$matches) return;
    $matches.innerHTML =
      '<div class="loading-row" style="padding: 32px 16px; justify-content: center;">' +
        '<span class="spinner"></span>' +
        '<span>' + h(msg || 'Loading fan votes…') + '</span>' +
      '</div>';
  }

  window.TOOL = window.TOOL || {};
  window.TOOL.boot = function (session) {
    state.session = session;
    state.canSeeNotes = (resolveLevel(session) === 'admin');

    /* Render the shell (tabs + filter row + matchday strip) IMMEDIATELY
       so the page feels responsive while fetches run. Put a spinner in
       the matches slot. Full render() runs once data is in. */
    renderMaintabs();
    renderFilters();
    showLoading('Loading fan votes…');

    var ensure = (window.NL && NL.ensureAuth) ? NL.ensureAuth() : Promise.resolve();
    ensure
      .then(function () { return initWidgetsApp(); })
      .then(function () {
        return Promise.all([
          fetchAllFixtures().then(function (ms) { state.allMatches = ms; }),
          loadClubsMeta(),
          loadFanData(),
          loadPrefs()
        ]).then(function (results) {
          var prefs = results[3];
          if (prefs) {
            if (prefs.activeTab && (prefs.activeTab === 'matchday' || prefs.activeTab === 'byclub' || prefs.activeTab === 'season')) {
              state.activeTab = prefs.activeTab;
            }
            /* Normalise compId to a NUMBER. Anything that came back
               from Firebase as a stringified number would otherwise
               break === comparisons against COMP_IDS (which are
               numbers) and against m.attributes.competitionID (also
               a number). Manifests as "no division active" and
               an empty matchday list. */
            if (prefs.compId != null) {
              var n = Number(prefs.compId);
              if (!isNaN(n) && COMPS[n]) state.selectedComp = n;
            }
            if (prefs.selectedClub) state.selectedClub = prefs.selectedClub;
          }
          state.selectedMatchday = (prefs && prefs.matchday) || defaultMatchday();
          if (!state.selectedMatchday) state.selectedMatchday = defaultMatchday();
        });
      })
      .then(function () {
        state.loaded = true;
        hideBanner();
        render();
        if (window.NL && NL.writeAudit) {
          NL.writeAudit('totw_opened', compLabel(true) + ' / ' + (state.selectedMatchday || '—'));
        }
      })
      .catch(function (err) {
        showBanner('Could not load fan data: ' + (err && err.message ? err.message : err), 'err');
        // eslint-disable-next-line no-console
        console.error('[team-of-the-week] boot failed', err);
      });
  };

  if (window._toolDeferredSession) {
    window.TOOL.boot(window._toolDeferredSession);
    delete window._toolDeferredSession;
  }
})();
</script>
