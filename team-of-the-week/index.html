<!DOCTYPE html>
<!--
  NL Tools — Team of the Week
  Version: v0.2 (15/05/2026)
  File: /tools/team-of-the-week/index.html

  Browse fan MOTM votes and notes — pick your Team of the Week.

  Storage (RTDB):
    app-data/staff-team-of-the-week/prefs/{uid}    per-user prefs (last division/matchday)
    tools/staff-team-of-the-week                   tool registration (label, defaults)

  Reads fan data from a second Firebase project (nl-widgets) via a named
  app (`nlTotwRead`) with anonymous auth — same model the embed widgets
  use. No data is mirrored into nl-tools; this tool is a window onto the
  fan database.

  Access tiers (resolved via auth-guard / session.tools[toolKey] or role
  fallback):
    admin       → full access incl. note text
    access      → counts, charts, drills, voter clubs — but no note text
-->

<style>
  /* Tool-specific styles only. All foundational components (buttons,
     pills, tables, stats, tabs, modals, empty-state, typography
     utilities, banners) come from /tools/system/nl-brand.css — see
     /tools/style-guide/ for live previews and system/_template/
     BRAND_GUIDE.md for the rules. Any new style added below should
     have no equivalent utility class, and should reference tokens
     (var(--*)), never hardcoded values. */

  /* ----- Header rolebar ----- */
  #pageWrap .totw-rolebar { display: flex; gap: 8px; align-items: center; margin: 8px 0 18px; font-size: var(--text-xs); color: var(--text-muted); }

  /* ----- Top toolbar: main tabs + filter row ----- */
  #pageWrap .totw-toolbar { display: grid; row-gap: 10px; margin-bottom: 18px; }
  /* Main tabs (Matchday / By Club / Season) use brand .tabs / .tab. */
  #pageWrap .totw-maintabs { max-width: 520px; }
  #pageWrap .totw-filterrow {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  }
  #pageWrap .totw-filterrow .tabs { margin-bottom: 0; }
  #pageWrap .totw-divtabs { display: inline-flex; background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); padding: 3px; gap: 2px; }
  #pageWrap .totw-divtabs .tab { padding: 6px 14px; font-size: var(--text-xs); flex: none; }
  /* "Notes only" toggle — looks like a togglable .pill */
  #pageWrap .totw-toggle {
    -webkit-appearance: none; appearance: none;
    font: inherit; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 12px;
    background: var(--white); color: var(--text-muted);
    border: 1px solid var(--border); border-radius: var(--radius-pill);
    font-size: var(--text-xs); font-weight: 800;
    text-transform: uppercase; letter-spacing: var(--tracking-wide);
  }
  #pageWrap .totw-toggle:hover { background: var(--off-white); color: var(--text); }
  #pageWrap .totw-toggle.is-on { background: var(--amber); color: var(--white); border-color: var(--amber); }
  #pageWrap .totw-toggle .totw-toggle__dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--border); transition: background .15s;
  }
  #pageWrap .totw-toggle.is-on .totw-toggle__dot { background: var(--white); }

  /* Matchday strip — many items, horizontal scroll. */
  #pageWrap .totw-mdrow {
    display: flex; gap: 6px; overflow-x: auto;
    padding: 0 4px 6px; margin: 0 -4px;
    scrollbar-width: thin;
  }
  #pageWrap .totw-mdrow::-webkit-scrollbar { height: 6px; }
  #pageWrap .totw-mdrow::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  #pageWrap .totw-mdpill {
    -webkit-appearance: none; appearance: none;
    font: inherit; font-size: var(--text-xs); font-weight: 800;
    padding: 6px 12px; border-radius: var(--radius-pill);
    background: var(--white); color: var(--text);
    border: 1px solid var(--border); cursor: pointer;
    flex: none; white-space: nowrap;
    text-transform: uppercase; letter-spacing: var(--tracking-tight);
  }
  #pageWrap .totw-mdpill:hover { background: var(--off-white); }
  #pageWrap .totw-mdpill.is-active { background: var(--navy); color: var(--white); border-color: var(--navy); }
  #pageWrap .totw-mdpill.is-today { box-shadow: inset 0 0 0 2px var(--primary); }
  #pageWrap .totw-mdpill__div {
    display: inline-block; margin-right: 4px;
    padding: 0 5px; border-radius: 3px;
    background: var(--off-white); color: var(--text-muted);
    /* 9px is intentionally below --text-xs (10px min) — this is a tiny
       annotation badge meant to read as secondary metadata. No brand
       token at this scale; hardcoded is the right call here. */
    font-size: 9px; font-weight: 900; letter-spacing: var(--tracking-wide);
  }
  #pageWrap .totw-mdpill.is-active .totw-mdpill__div { background: rgba(255,255,255,.15); color: var(--white); }

  /* ----- Stats summary tiles (brand .stats / .stat) ----- */
  #pageWrap .totw-toppick { font-size: var(--text-md); font-weight: 900; font-variation-settings: 'wght' 900; line-height: 1.2; color: var(--navy); }
  #pageWrap .totw-toppick small { display: block; font-size: var(--text-xs); color: var(--text-muted); font-weight: 600; margin-top: 4px; }
  #pageWrap .stat .stat__sub { font-size: var(--text-xs); color: var(--text-muted); margin-top: 4px; line-height: 1.3; }

  /* ----- Match cards — collapsed-by-default. ----- */
  #pageWrap .totw-matches { display: grid; gap: 8px; }
  #pageWrap .totw-card {
    background: var(--white); border: 1px solid var(--border); border-radius: var(--radius);

  }
  #pageWrap .totw-card.is-void { opacity: .6; }
  /* Compact one-line summary always rendered; serves as the click target. */

    display: grid; grid-template-columns: auto 1fr auto auto auto; gap: 10px;

  #pageWrap .totw-card__summary:hover { background: var(--off-white); border-radius: var(--radius); }

    font-weight: 800; font-variation-settings: 'wght' 800;
    font-size: var(--text-sm); color: var(--text);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    min-width: 0;

  #pageWrap .totw-card__match small { display: block; font-size: var(--text-xs); font-weight: 600; color: var(--text-muted); margin-top: 2px; }

  #pageWrap .totw-card__topline { font-size: var(--text-xs); color: var(--text-muted); display: flex; align-items: center; gap: 6px; }
  #pageWrap .totw-card__topline strong { font-weight: 800; color: var(--navy); font-size: var(--text-sm); }
  #pageWrap .totw-card__counts { font-size: var(--text-xs); font-weight: 700; color: var(--text-muted); white-space: nowrap; }
  #pageWrap .totw-card__counts em { font-style: normal; color: var(--amber-deep); }
  #pageWrap .totw-card__chev {
    width: 22px; height: 22px;
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--text-muted);

  }
  #pageWrap .totw-card.is-expanded .totw-card__chev { transform: rotate(180deg); color: var(--primary); }
  #pageWrap .totw-card__details {
    padding: 4px 14px 14px;
    border-top: 1px solid var(--border);
    margin-top: -1px;
    animation: totw-slidedown .18s ease;

    from { opacity: 0; transform: translateY(-4px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 540px) {
    #pageWrap .totw-card__summary { grid-template-columns: 1fr auto auto; row-gap: 4px; }
    #pageWrap .totw-card__topline { grid-column: 1 / -1; padding-top: 4px; border-top: 1px dashed var(--border); margin-top: 4px; }
  }

  /* ----- Voter-club filter chips (no brand equivalent) ----- */
  #pageWrap .totw-clubchips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  #pageWrap .totw-clubchip {
    -webkit-appearance: none; appearance: none;
    font: inherit; font-size: var(--text-xs); font-weight: 700;
    padding: 4px 10px; border-radius: var(--radius-pill);
    background: var(--off-white); color: var(--text-muted);
    border: 1px solid var(--border); cursor: pointer;
    display: inline-flex; align-items: center; gap: 5px;
  }
  #pageWrap .totw-clubchip .totw-swatch { width: 8px; height: 8px; border-radius: 50%; background: var(--swatch, var(--navy)); }
  #pageWrap .totw-clubchip:hover { background: var(--white); color: var(--text); }
  #pageWrap .totw-clubchip.is-active { background: var(--primary); color: var(--white); border-color: var(--primary); }
  #pageWrap .totw-clubchip.is-active .totw-swatch { box-shadow: 0 0 0 2px rgba(255,255,255,.5); }
  #pageWrap .totw-clearfilter { margin-left: auto; font-size: var(--text-xs); color: var(--primary); background: none; border: none; cursor: pointer; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; padding: 4px 0; }

  /* ----- Bars/Donut toggle — uses brand .tabs / .tab in a compact form ----- */
  #pageWrap .totw-charttabs { display: inline-flex; margin-left: auto; margin-bottom: 8px; padding: 2px; }
  #pageWrap .totw-charttabs .tab { flex: none; padding: 5px 12px; font-size: var(--text-xs); }
  #pageWrap .totw-charttabs-row { display: flex; }

  /* ----- Vote rows (per-player ranked rows with bar) ----- */
  #pageWrap .totw-votes { display: grid; gap: 4px; }
  #pageWrap .totw-row {
    display: grid; grid-template-columns: 22px 1fr 60px 50px 32px;
    align-items: center; gap: 10px;
    padding: 8px 10px; border-radius: var(--radius-sm);
    background: var(--off-white); cursor: pointer;
    transition: background .12s;
  }
  #pageWrap .totw-row:hover { background: color-mix(in srgb, var(--navy) 4%, var(--off-white)); }
  #pageWrap .totw-row.is-expanded { background: color-mix(in srgb, var(--primary) 6%, var(--off-white)); }
  #pageWrap .totw-row__pos { font-size: var(--text-xs); font-weight: 800; color: var(--text-muted); text-align: center; }
  #pageWrap .totw-row__name { min-width: 0; font-weight: 700; font-size: var(--text-sm); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #pageWrap .totw-row__team { display: block; font-size: var(--text-xs); color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: var(--tracking-tight); margin-top: 1px; }
  #pageWrap .totw-row__bar { background: var(--off-white); border-radius: 4px; height: 8px; overflow: hidden; box-shadow: inset 0 0 0 1px var(--border); }
  #pageWrap .totw-row__bar > span { display: block; height: 100%; background: var(--bar, var(--navy)); border-radius: 4px; }
  #pageWrap .totw-row__count { font-weight: 900; font-variation-settings: 'wght' 900; font-size: var(--text-sm); color: var(--text); text-align: right; }
  #pageWrap .totw-row__count em { font-style: normal; font-weight: 700; font-size: var(--text-xs); color: var(--text-muted); display: block; margin-top: -1px; }
  #pageWrap .totw-row__notebadge { text-align: right; }
  #pageWrap .totw-row__notebadge span {
    display: inline-block; min-width: 22px; padding: 2px 6px;
    background: var(--amber-light); color: var(--amber-deep);
    font-size: var(--text-xs); font-weight: 800; border-radius: var(--radius-pill);
  }
  #pageWrap .totw-row__notebadge span.is-empty { background: transparent; color: var(--text-muted); font-weight: 400; }

  /* ----- Donut view (custom SVG chart) ----- */
  #pageWrap .totw-donutwrap {
    display: grid; grid-template-columns: 180px 1fr; gap: 18px; align-items: center;

  #pageWrap .totw-legend__item { display: grid; grid-template-columns: 14px 1fr auto auto; gap: 8px; align-items: center; padding: 4px 8px; border-radius: var(--radius-sm); cursor: pointer; }
  #pageWrap .totw-legend__item:hover { background: var(--off-white); }
  #pageWrap .totw-legend__item.is-expanded { background: color-mix(in srgb, var(--primary) 6%, var(--off-white)); }
  #pageWrap .totw-legend__swatch { width: 12px; height: 12px; border-radius: 2px; background: var(--seg); }
  #pageWrap .totw-legend__name { font-weight: 700; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #pageWrap .totw-legend__count { font-weight: 900; font-size: var(--text-sm); }
  #pageWrap .totw-legend__pct   { font-size: var(--text-xs); color: var(--text-muted); }

  /* ----- Drill drawer (player-click expansion) ----- */
  #pageWrap .totw-drawer {
    margin: 4px 0 8px; padding: 14px;
    background: color-mix(in srgb, var(--navy) 3%, var(--white));
    border: 1px solid var(--border); border-radius: var(--radius);
  }
  #pageWrap .totw-drawer__title { font-size: var(--text-xs); font-weight: 800; text-transform: uppercase; letter-spacing: var(--tracking-wide); color: var(--text-muted); margin: 0 0 8px; }
  #pageWrap .totw-drillbars { display: grid; gap: 4px; margin-bottom: 12px; }
  #pageWrap .totw-drillrow { display: grid; grid-template-columns: 12px 1fr 50px 40px; align-items: center; gap: 8px; font-size: var(--text-sm); }
  #pageWrap .totw-drillrow__sw { width: 10px; height: 10px; border-radius: 2px; background: var(--seg); }
  #pageWrap .totw-drillrow__name { font-weight: 700; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #pageWrap .totw-drillrow__bar { background: var(--off-white); border-radius: 3px; height: 6px; overflow: hidden; box-shadow: inset 0 0 0 1px var(--border); }
  #pageWrap .totw-drillrow__bar > span { display: block; height: 100%; background: var(--seg); border-radius: 3px; }
  #pageWrap .totw-drillrow__count { text-align: right; font-weight: 800; font-size: var(--text-sm); }
  #pageWrap .totw-notes { display: grid; gap: 8px; }
  #pageWrap .totw-noteshead { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  #pageWrap .totw-noteshead h4 { margin: 0; font-size: var(--text-xs); text-transform: uppercase; letter-spacing: var(--tracking-wide); color: var(--navy); font-weight: 800; }
  #pageWrap .totw-note {
    background: var(--white); border: 1px solid var(--border); border-left: 3px solid var(--primary);
    border-radius: var(--radius-sm); padding: 10px 12px;
    display: grid; row-gap: 4px; font-size: var(--text-sm);
  }
  #pageWrap .totw-note__quote { line-height: 1.45; color: var(--text); font-style: italic; }
  #pageWrap .totw-note__attrib { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: var(--text-xs); color: var(--text-muted); }
  #pageWrap .totw-note__attrib b { color: var(--navy); font-weight: 800; }
  #pageWrap .totw-note__copy { margin-left: auto; font: inherit; font-size: var(--text-xs); font-weight: 700; text-transform: uppercase; letter-spacing: var(--tracking-tight); background: none; border: none; color: var(--primary); cursor: pointer; padding: 2px 0; text-decoration: underline; text-underline-offset: 3px; }
  #pageWrap .totw-notes--locked {
    padding: 12px; text-align: center; font-size: var(--text-xs); color: var(--text-muted);
    background: var(--off-white); border: 1px dashed var(--border); border-radius: var(--radius-sm);
  }

  /* ----- Inline empty state (smaller than brand .empty-state) ----- */
  #pageWrap .totw-noresults {
    padding: 18px 14px; text-align: center;
    background: var(--off-white); border: 1px dashed var(--border); border-radius: var(--radius-sm);
    color: var(--text-muted); font-size: var(--text-sm);
  }

  /* ----- Page footer (export actions) ----- */
  #pageWrap .totw-actions { margin-top: 22px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
</style>

  </div>
</div>

  var CLUBS_META_URL = 'https://raw.githubusercontent.com/thenationalleague/tools/main/assets/data/clubs-meta.json';
  var MAX_PAGES = 10;
  var PREFS_DEBOUNCE_MS = 600;

  /* ============================================================
     STATE
     ============================================================ */
  var state = {
    session: null,
    canSeeNotes: false,
    widgetsDb: null,
    allMatches: [],
    allUsers: {},
    allVotes: {},
    clubsByOpta: {},
    activeTab: 'matchday',     // 'matchday' | 'byclub' | 'season'
    selectedComp: DEFAULT_COMP_ID,  // numeric comp id, or 'all'
    selectedMatchday: null,
    selectedClub: null,        // teamId — for By Club tab
    notesOnly: false,          // notes-only filter
    chartMode: {},             // matchId -> 'bars' | 'donut'
    activeClub: {},            // matchId -> voter-club filter
    expandedMatch: {},         // matchId -> true (one-line card → expanded)
    expanded: {},              // matchId -> playerId (player drawer)
    loaded: false
  };

  /* ============================================================
     DOM
     ============================================================ */
  var $banner    = document.getElementById('totw-banner');
  var $rolebar   = document.getElementById('totw-rolebar');
  var $maintabs  = document.getElementById('totw-maintabs');
  var $filters   = document.getElementById('totw-filters');
  var $mdrow     = document.getElementById('totw-mdrow');
  var $summary   = document.getElementById('totw-summary');
  var $matches   = document.getElementById('totw-matches');
  var $actions   = document.getElementById('totw-actions');
  var $tabMatchday = document.getElementById('totw-tab-matchday');
  var $tabByClub   = document.getElementById('totw-tab-byclub');
  var $tabSeason   = document.getElementById('totw-tab-season');

  /* ============================================================
     UTIL
     ============================================================ */
  function h(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function showBanner(msg, cls) {
    $banner.hidden = false;
    $banner.className = 'totw-banner' + (cls ? ' is-' + cls : '');
    $banner.textContent = msg;
  }
  function hideBanner() { $banner.hidden = true; }
  function copy(text) {
    if (!text) return;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        if (window.NL && NL.toast) NL.toast('Copied', 'success');
      });
    } else {
      var ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta);
      if (window.NL && NL.toast) NL.toast('Copied', 'success');
    }
  }
  function koOf(m) {
    var ks = m && m.attributes && m.attributes.kickOffDateUTC;
    if (!ks) return null;
    return new Date(String(ks).replace(' ', 'T') + 'Z');
  }
  function bstDateOf(d) {
    return d ? d.toLocaleDateString('en-CA', { timeZone: 'Europe/London' }) : '';
  }
  function bstDayLabel(d) {
    if (!d) return '';
    var parts = d.toLocaleDateString('en-GB', { timeZone: 'Europe/London', weekday: 'short', day: 'numeric', month: 'short' }).split(' ');
    return parts.join(' ').toUpperCase();
  }
  function fmtMatchTime(d) {
    if (!d) return '';
    return d.toLocaleString('en-GB', { timeZone: 'Europe/London', weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
  }
  function matchStateOf(m) {
    var period = m.attributes && m.attributes.matchPeriod;
    if (period === 'Postponed') return 'postponed';
    if (period === 'Abandoned') return 'abandoned';
    var ko = koOf(m);
    if (!ko) return 'pre';
    var now = Date.now();
    if (now < ko.getTime()) return 'pre';
    if (period === 'FullTime' || period === 'PostMatch') return 'post';
    if (now < ko.getTime() + 105 * 60000) return 'live';
    return 'post';
  }
  function paletteForTeam(teamId) {
    var c = state.clubsByOpta[teamId];
    var cols = c && c.colors;
    return {
      primary:   (cols && cols.primary)   || '#223b7c',
      secondary: (cols && cols.secondary) || '#ffffff'
    };
  }
  function teamNameFor(teamId) {
    var c = state.clubsByOpta[teamId];
    if (c && (c.short || c.name)) return c.short || c.name;
    for (var i = 0; i < state.allMatches.length; i++) {
      var a = state.allMatches[i].attributes;
      if (a.homeTeam.teamID === teamId) return a.homeTeam.shortName || a.homeTeam.name;
      if (a.awayTeam.teamID === teamId) return a.awayTeam.shortName || a.awayTeam.name;
    }
    return teamId;
  }

  /* ============================================================
     LEVEL RESOLUTION
     ============================================================ */
  function resolveLevel(session) {
    /* Superadmin always sees the top tier regardless of any per-tool
       grant — matches the portal's own convention. */
    if (session && session.role === 'superadmin') return 'admin';

    var raw = session && session.tools && session.tools[NL_TOOL_KEY];
    if (typeof raw === 'string') return raw;
    if (raw && typeof raw === 'object') {
      if (raw.admin)  return 'admin';
      if (raw.access) return 'access';
      return 'off';
    }
    var role = session && session.role;
    if (role === 'admin') return 'admin';
    if (role === 'staff') return 'access';
    return 'hidden';
  }

  /* ============================================================
     DATA: clubs meta
     ============================================================ */
  function loadClubsMeta() {
    return fetch(CLUBS_META_URL, { credentials: 'omit', cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('clubs-meta ' + r.status); return r.json(); })
      .then(function (json) {
        var clubs = (json && json.clubs) || [];
        var map = {};
        clubs.forEach(function (c) { if (c && c.optaID) map[c.optaID] = c; });
        state.clubsByOpta = map;
      })
      .catch(function () { state.clubsByOpta = {}; });
  }

  /* ============================================================
     DATA: fixtures
     ============================================================ */
  function fetchAllFixtures() {
    return Promise.all(COMP_IDS.map(fetchOneComp))
      .then(function (results) { return [].concat.apply([], results); });
  }
  function fetchOneComp(compId) {
    var all = [];
    function page(n) {
      var url = API_BASE + '/matches/?competitionID=' + compId +
                '&seasonID=' + SEASON_ID +
                '&sort=kickOffDateUTC&page.number=' + n + '&page.size=100';
      return fetch(url, { credentials: 'omit' })
        .then(function (r) { if (!r.ok) throw new Error('fixtures ' + compId + ' ' + r.status); return r.json(); })
        .then(function (json) {
          var d = (json && json.data) || [];
          all = all.concat(d);
          var total = json && json.meta && json.meta.totalCount;
          if (d.length === 100 && (total == null || all.length < total) && n < MAX_PAGES) return page(n + 1);
        });
    }
    return page(1).then(function () { return all; });
  }

  /* ============================================================
     DATA: nl-widgets (users + votes)
     ============================================================ */
  function initWidgetsApp() {
    var existing = firebase.apps && firebase.apps.filter(function (a) { return a.name === WIDGETS_APP_NAME; })[0];
    var fb = existing || firebase.initializeApp(WIDGETS_CONFIG, WIDGETS_APP_NAME);
    state.widgetsDb = firebase.database(fb);
    return firebase.auth(fb).signInAnonymously();
  }
  function loadFanData() {
    return Promise.all([
      state.widgetsDb.ref('users').once('value').then(function (s) { state.allUsers = s.val() || {}; }),
      new Promise(function (resolve) {
        // Live subscription so the staff dashboard ticks during the
        // voting window. First snapshot resolves the boot.
        var first = true;
        state.widgetsDb.ref('motm').on('value', function (s) {
          state.allVotes = s.val() || {};
          if (first) { first = false; resolve(); }
          else if (state.loaded) { render(); }
        });
      })
    ]);
  }

  /* ============================================================
     PREFS (nl-tools, default app)
     ============================================================ */
  var prefsTimer = null;
  function savePrefsSoon() {
    if (prefsTimer) clearTimeout(prefsTimer);
    prefsTimer = setTimeout(function () {
      var uid = state.session && state.session.uid;
      if (!uid) return;
      db.ref('app-data/staff-team-of-the-week/prefs/' + uid).update({
        activeTab: state.activeTab,
        compId: state.selectedComp,
        matchday: state.selectedMatchday,
        selectedClub: state.selectedClub || null,
        notesOnly: !!state.notesOnly,
        updatedAt: firebase.database.ServerValue.TIMESTAMP
      }).catch(function () { /* non-critical */ });
    }, PREFS_DEBOUNCE_MS);
  }
  function loadPrefs() {
    var uid = state.session && state.session.uid;
    if (!uid) return Promise.resolve(null);
    return db.ref('app-data/staff-team-of-the-week/prefs/' + uid).once('value')
      .then(function (s) { return s.val() || null; })
      .catch(function () { return null; });
  }

  /* ============================================================
     DERIVED: matchday keys for the selected comp
     ============================================================ */
  function matchInComp(m) {
    if (state.selectedComp === 'all') return true;
    return m.attributes.competitionID === state.selectedComp;
  }
  function matchdayKeys() {
    var seen = {};
    state.allMatches.forEach(function (m) {
      if (!matchInComp(m)) return;
      var k = bstDateOf(koOf(m));
      if (k) seen[k] = true;
    });
    return Object.keys(seen).sort();
  }
  /* For the All filter, surface which divisions a particular matchday
     covers (so the matchday pill can show a division code prefix). */
  function matchdayDivisions(matchdayKey) {
    var seen = {};
    state.allMatches.forEach(function (m) {
      if (bstDateOf(koOf(m)) !== matchdayKey) return;
      var c = COMPS[m.attributes.competitionID];
      if (c) seen[c.shortName] = true;
    });
    return Object.keys(seen);
  }
  function defaultMatchday() {
    var keys = matchdayKeys();
    if (!keys.length) return null;
    var todayKey = bstDateOf(new Date());
    var past = keys.filter(function (k) { return k <= todayKey; });
    return past.length ? past[past.length - 1] : keys[0];
  }
  function matchesForSelected() {
    return state.allMatches.filter(function (m) {
      if (!matchInComp(m)) return false;
      return bstDateOf(koOf(m)) === state.selectedMatchday;
    }).sort(function (a, b) {
      return (a.attributes.kickOffDateUTC || '').localeCompare(b.attributes.kickOffDateUTC || '');
    });
  }

  /* ============================================================
     DERIVED: votes per match (with optional voter-club filter)
     ============================================================ */
  function votesForMatch(matchId, clubFilter) {
    var voters = state.allVotes;
    var rows = [];
    Object.keys(voters).forEach(function (jwtId) {
      var v = voters[jwtId] && voters[jwtId][matchId];
      if (!v || !v.playerId) return;
      var u = state.allUsers[jwtId];
      var voterTeamName = (u && u.teamName) || '— (unregistered) —';
      if (clubFilter && voterTeamName !== clubFilter) return;
      rows.push({
        jwtId: jwtId,
        playerId: v.playerId,
        playerName: v.playerName || v.playerId,
        teamId: v.teamId,
        note: v.note || '',
        submittedAt: v.submittedAt || 0,
        voter: u || null,
        voterTeamName: voterTeamName
      });
    });
    return rows;
  }
  function rankPlayers(votes) {
    var by = {};
    votes.forEach(function (v) {
      var k = v.playerId;
      if (!by[k]) by[k] = { playerId: v.playerId, name: v.playerName, teamId: v.teamId, votes: 0, notes: 0, voterClubs: {}, notesList: [] };
      by[k].votes += 1;
      if (v.note) { by[k].notes += 1; by[k].notesList.push(v); }
      by[k].voterClubs[v.voterTeamName] = (by[k].voterClubs[v.voterTeamName] || 0) + 1;
    });
    return Object.keys(by).map(function (k) { return by[k]; }).sort(function (a, b) {
      return b.votes - a.votes || a.name.localeCompare(b.name);
    });
  }
  function clubBreakdown(votes) {
    var by = {};
    votes.forEach(function (v) {
      by[v.voterTeamName] = (by[v.voterTeamName] || 0) + 1;
    });
    return Object.keys(by).map(function (k) {
      return { name: k, count: by[k] };
    }).sort(function (a, b) { return b.count - a.count || a.name.localeCompare(b.name); });
  }

  /* ============================================================
     RENDER: role bar
     ============================================================ */
  function renderRolebar() {
    /* Brand role pills: .role-admin (info-light bg) for the admin tier,
       .role-staff (green-light bg) for the access tier. Visually
       distinct, semantically aligned with the tool's two-tier model. */
    var pillCls = state.canSeeNotes ? 'role-admin' : 'role-staff';
    var pillLbl = state.canSeeNotes ? 'Admin tier' : 'Access tier';
    var detail  = state.canSeeNotes
      ? 'Counts, charts, drills, and voter notes are visible to you.'
      : 'You see counts, charts, and voter-club drills. Note text is admin-only.';
    $rolebar.innerHTML =
      '<span class="pill ' + pillCls + '">' + h(pillLbl) + '</span>' +
      '<span>' + h(detail) + '</span>';
  }

  /* ============================================================
     RENDER: main tabs (Matchday / By Club / Season)
     ============================================================ */
  var TABS = [
    { id: 'matchday', label: 'Matchday' },
    { id: 'byclub',   label: 'By Club' },
    { id: 'season',   label: 'Season' }
  ];
  function renderMaintabs() {
    $maintabs.innerHTML = TABS.map(function (t) {
      var active = (t.id === state.activeTab) ? ' is-active' : '';
      return '<button type="button" class="tab' + active + '" data-tab="' + h(t.id) + '">' + h(t.label) + '</button>';
    }).join('');
    Array.prototype.forEach.call($maintabs.querySelectorAll('[data-tab]'), function (b) {
      b.addEventListener('click', function () {
        state.activeTab = b.getAttribute('data-tab');
        savePrefsSoon();
        render();
      });
    });
  }

  /* ============================================================
     RENDER: filter row (division tabs + notes-only toggle)
     ============================================================ */
  function renderFilters() {
    /* Division filter — used by Matchday + Season tabs.
       Includes an "All" option that pools matchdays / votes across
       the three divisions. Hidden on the By Club tab (a club already
       implies its division). */
    var divs = '';
    if (state.activeTab !== 'byclub') {
      var divItems = [{ id: 'all', label: 'All' }].concat(
        COMP_IDS.map(function (id) { return { id: id, label: COMPS[id].shortName }; })
      );
      divs = '<div class="tabs totw-divtabs">' +
        divItems.map(function (item) {
          var active = (state.selectedComp === item.id) ? ' is-active' : '';
          return '<button type="button" class="tab' + active + '" data-comp="' + h(String(item.id)) + '">' + h(item.label) + '</button>';
        }).join('') +
      '</div>';
    }

    /* Notes-only toggle — used by Matchday + Season tabs (where it
       filters matches/players that have at least one note). */
    var notesToggle = '';
    if (state.activeTab !== 'byclub') {
      notesToggle =
        '<button type="button" class="totw-toggle' + (state.notesOnly ? ' is-on' : '') + '" id="totw-notesonly">' +
          '<span class="totw-toggle__dot"></span>' +
          'Notes only' +
        '</button>';
    }

    $filters.innerHTML = divs + notesToggle;

    Array.prototype.forEach.call($filters.querySelectorAll('[data-comp]'), function (b) {
      b.addEventListener('click', function () {
        var v = b.getAttribute('data-comp');
        state.selectedComp = (v === 'all') ? 'all' : Number(v);
        state.selectedMatchday = defaultMatchday();
        state.expanded = {}; state.expandedMatch = {}; state.activeClub = {}; state.chartMode = {};
        savePrefsSoon();
        render();
      });
    });
    var toggle = document.getElementById('totw-notesonly');
    if (toggle) toggle.addEventListener('click', function () {
      state.notesOnly = !state.notesOnly;
      savePrefsSoon();
      render();
    });
  }

  /* ============================================================
     RENDER: matchday strip
     ============================================================ */
  function renderMatchdayStrip() {
    var keys = matchdayKeys();
    var todayKey = bstDateOf(new Date());
    if (!keys.length) {
      $mdrow.innerHTML = '<div class="totw-mdrow"><span class="text-secondary" style="padding:6px 0;">No fixtures in this division yet.</span></div>';
      return;
    }
    $mdrow.innerHTML =
      '<div class="totw-mdrow">' +
        keys.map(function (k) {
          var active = (k === state.selectedMatchday) ? ' is-active' : '';
          var today  = (k === todayKey) ? ' is-today' : '';
          var d = new Date(k + 'T12:00:00Z');
          /* When the All filter is on, prefix with division code so
             the user knows which division a matchday belongs to. */
          var divPrefix = '';
          if (state.selectedComp === 'all') {
            var divs = matchdayDivisions(k);
            if (divs.length === 1) divPrefix = '<span class="totw-mdpill__div">' + h(divs[0]) + '</span>';
            /* If multiple divisions share the day, no prefix (it's a true cross-league date). */
          }
          return '<button type="button" class="totw-mdpill' + active + today + '" data-md="' + h(k) + '">' +
            divPrefix + h(bstDayLabel(d)) +
          '</button>';
        }).join('') +
      '</div>';

    Array.prototype.forEach.call($mdrow.querySelectorAll('[data-md]'), function (b) {
      b.addEventListener('click', function () {
        state.selectedMatchday = b.getAttribute('data-md');
        state.expanded = {}; state.expandedMatch = {}; state.activeClub = {};
        savePrefsSoon();
        render();
      });
    });
    var activePill = $mdrow.querySelector('.totw-mdpill.is-active');
    if (activePill && activePill.scrollIntoView) activePill.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'auto' });
  }

  function renderSummary() {
    var matches = matchesForSelected();
    if (!matches.length) { $summary.innerHTML = ''; return; }
    var totalVotes = 0, totalNotes = 0, topPlayer = null;
    matches.forEach(function (m) {
      var rows = votesForMatch(m.id, null);
      totalVotes += rows.length;
      rows.forEach(function (v) { if (v.note) totalNotes++; });
      var ranked = rankPlayers(rows);
      if (ranked.length && (!topPlayer || ranked[0].votes > topPlayer.votes)) {
        topPlayer = { name: ranked[0].name, teamId: ranked[0].teamId, votes: ranked[0].votes };
      }
    });
    /* Own-team voting rule: each fan votes at most once per matchday,
       so "votes cast" === "distinct voters". One tile, not two. */
    var topInner = topPlayer
      ? '<div class="totw-toppick">' + h(topPlayer.name) +
          '<small>' + h(teamNameFor(topPlayer.teamId)) + ' · ' + topPlayer.votes + ' vote' + (topPlayer.votes === 1 ? '' : 's') + '</small>' +
        '</div>'
      : '<div class="totw-toppick" style="color:var(--text-muted);">No votes yet</div>';
    $summary.innerHTML =
      tile('Fixtures', matches.length, matches.length === 1 ? 'match in this round' : 'matches in this round') +
      tile('Votes cast', totalVotes, totalVotes ? 'one per fan (own-team only)' : '') +
      tile('Notes left', totalNotes, totalVotes ? Math.round(totalNotes / Math.max(totalVotes, 1) * 100) + '% of votes had a note' : 'no fan left a note') +
      '<div class="stat">' +
        '<div class="stat__label">Matchday top pick</div>' +
        topInner +
      '</div>';

    function tile(label, value, sub) {
      return '<div class="stat">' +
        '<div class="stat__num">' + h(value) + '</div>' +
        '<div class="stat__label">' + h(label) + '</div>' +
        (sub ? '<div class="stat__sub">' + h(sub) + '</div>' : '') +
      '</div>';
    }
  }

  /* ============================================================
     RENDER: per-match cards
     ============================================================ */
  function renderMatches() {
    var matches = matchesForSelected();
    if (!matches.length) {
      var divLbl = (state.selectedComp === 'all') ? 'NL' : (COMPS[state.selectedComp] ? COMPS[state.selectedComp].shortName : '');
      $matches.innerHTML =
        '<div class="empty-state">' +
          '<div class="empty-state__icon">📭</div>' +
          '<div class="empty-state__title">No ' + h(divLbl) + ' fixtures on this matchday</div>' +
          '<div class="empty-state__text">Pick a different date above, or switch division.</div>' +
        '</div>';
      return;
    }
    /* Notes-only filter: drop matches with zero notes. */
    var shown = state.notesOnly
      ? matches.filter(function (m) {
          var rows = votesForMatch(m.id, null);
          return rows.some(function (v) { return !!v.note; });
        })
      : matches;
    if (state.notesOnly && !shown.length) {
      $matches.innerHTML =
        '<div class="empty-state">' +
          '<div class="empty-state__icon">📝</div>' +
          '<div class="empty-state__title">No notes on this matchday</div>' +
          '<div class="empty-state__text">No fan left a quotable note on any match yet. Untoggle "Notes only" to see everything.</div>' +
        '</div>';
      return;
    }
    $matches.innerHTML = shown.map(renderCard).join('');
    wireCards();
  }

  function renderCard(m) {
    var a = m.attributes;
    var ms = matchStateOf(m);
    var clubFilter = state.activeClub[m.id] || null;
    var votes = votesForMatch(m.id, clubFilter);
    var allVotes = clubFilter ? votesForMatch(m.id, null) : votes;
    var ranked = rankPlayers(votes);
    var totalForPct = votes.length || 1;

    var homePal = paletteForTeam(a.homeTeam.teamID);
    var awayPal = paletteForTeam(a.awayTeam.teamID);

    /* One-line summary: match label, score, top pick, vote/note counts.
       Click anywhere on it to expand the full detail panel beneath. */
    var match = (a.homeTeam.shortName || a.homeTeam.name || '') + ' v ' + (a.awayTeam.shortName || a.awayTeam.name || '');
    var divCode = COMPS[a.competitionID] ? COMPS[a.competitionID].shortName : '';

    var scoreHtml;
    if (ms === 'pre') {
      scoreHtml = '<div class="totw-card__score is-future">' + h(fmtMatchTime(koOf(m))) + '</div>';
    } else if (ms === 'postponed') {
      scoreHtml = '<div class="totw-card__score is-future">P-P</div>';
    } else if (ms === 'abandoned') {
      scoreHtml = '<div class="totw-card__score is-future">ABD</div>';
    } else {
      var hs = (a.homeTeam.score != null) ? a.homeTeam.score : '?';
      var as = (a.awayTeam.score != null) ? a.awayTeam.score : '?';
      scoreHtml = '<div class="totw-card__score">' + h(hs) + ' – ' + h(as) + '</div>';
    }

    var topLine;
    if (allVotes.length && ranked[0]) {
      topLine =
        '<div class="totw-card__topline">' +
          'Top pick: <strong>' + h(ranked[0].name) + '</strong>' +
          ' <span style="color:var(--text-muted);">(' + h(teamNameFor(ranked[0].teamId)) + ')</span>' +
        '</div>';
    } else if (ms === 'pre') {
      topLine = '<div class="totw-card__topline" style="color:var(--text-muted);">Voting opens KO + 2.5h</div>';
    } else {
      topLine = '<div class="totw-card__topline" style="color:var(--text-muted);">No votes</div>';
    }

    var notesCount = ranked.reduce(function (n, p) { return n + p.notes; }, 0);
    var counts =
      '<div class="totw-card__counts">' +
        allVotes.length + ' vote' + (allVotes.length === 1 ? '' : 's') +
        (notesCount ? ' · <em>' + notesCount + ' note' + (notesCount === 1 ? '' : 's') + '</em>' : '') +
      '</div>';

    var chev = '<div class="totw-card__chev">▾</div>';

    var summary =
      '<div class="totw-card__summary" data-expand-card="' + h(m.id) + '">' +
        '<div class="totw-card__match">' + h(match) + (divCode ? '<small>' + h(divCode) + '</small>' : '') + '</div>' +
        scoreHtml +
        topLine +
        counts +
        chev +
      '</div>';

    /* Details panel: rendered only if the card is expanded. */
    var details = '';
    var isExpanded = !!state.expandedMatch[m.id];
    if (isExpanded) {
      var body = '';
      if (!allVotes.length && (ms === 'voting' || ms === 'post' || ms === 'live')) {
        body = '<div class="totw-noresults">No votes recorded for this match.</div>';
      } else if (!allVotes.length) {
        body = '<div class="totw-noresults">Voting opens 2.5 hours after kick-off.</div>';
      } else {
        body = renderCardBody(m, votes, allVotes, ranked, totalForPct, clubFilter, homePal, awayPal);
      }
      details = '<div class="totw-card__details">' + body + '</div>';
    }

    var voidCls = (ms === 'postponed' || ms === 'abandoned') ? ' is-void' : '';
    var expCls  = isExpanded ? ' is-expanded' : '';
    return '<div class="totw-card' + voidCls + expCls + '" data-match="' + h(m.id) + '">' +
      summary + details + '</div>';
  }

  function renderCardBody(m, votes, allVotes, ranked, totalForPct, clubFilter, homePal, awayPal) {
    // Voter-club chip strip (top 6 clubs based on ALL votes, not filtered)
    var fullBreakdown = clubBreakdown(allVotes);
    var topClubs = fullBreakdown.slice(0, 6);
    var palForClub = function (name) {
      // find a matching teamId by name to colour the swatch
      for (var i = 0; i < state.allMatches.length; i++) {
        var a = state.allMatches[i].attributes;
        if ((a.homeTeam.name === name) || (a.homeTeam.shortName === name)) return paletteForTeam(a.homeTeam.teamID);
        if ((a.awayTeam.name === name) || (a.awayTeam.shortName === name)) return paletteForTeam(a.awayTeam.teamID);
      }
      return { primary: 'var(--navy)' };
    };
    var chips = topClubs.map(function (c) {
      var pal = palForClub(c.name);
      var active = (clubFilter === c.name) ? ' is-active' : '';
      return '<button type="button" class="totw-clubchip' + active + '" data-club="' + h(c.name) + '" style="--swatch:' + h(pal.primary) + ';">' +
        '<span class="totw-swatch"></span>' +
        h(c.name) + ' · ' + c.count +
      '</button>';
    }).join('');
    if (clubFilter) chips += '<button type="button" class="totw-clearfilter" data-clear-club="1">Clear filter</button>';
    var clubchipsHtml = chips ? '<div class="totw-clubchips">' + chips + '</div>' : '';

    /* Chart-mode toggle uses brand .tabs / .tab in a compact form
       (.totw-charttabs sets it inline + right-aligned). */
    var mode = state.chartMode[m.id] || 'bars';
    var vctrls =
      '<div class="totw-charttabs-row">' +
        '<div class="tabs totw-charttabs">' +
          '<button type="button" class="tab' + (mode === 'bars' ? ' is-active' : '') + '" data-mode="bars">Bars</button>' +
          '<button type="button" class="tab' + (mode === 'donut' ? ' is-active' : '') + '" data-mode="donut">Donut</button>' +
        '</div>' +
      '</div>';

    var votesView = (mode === 'donut')
      ? renderDonutView(m, ranked, votes.length, homePal, awayPal)
      : renderBarsView(m, ranked, totalForPct, homePal, awayPal);

    return clubchipsHtml + vctrls + votesView;
  }

  function teamPal(teamId, homePal, awayPal, homeId, awayId) {
    if (teamId === homeId) return homePal;
    if (teamId === awayId) return awayPal;
    return paletteForTeam(teamId);
  }

  function renderBarsView(m, ranked, totalForPct, homePal, awayPal) {
    var a = m.attributes;
    var homeId = a.homeTeam.teamID, awayId = a.awayTeam.teamID;
    var maxVotes = ranked.length ? ranked[0].votes : 0;
    var rowsHtml = ranked.slice(0, 12).map(function (p, i) {
      var pal = teamPal(p.teamId, homePal, awayPal, homeId, awayId);
      var pct = totalForPct ? Math.round(p.votes / totalForPct * 100) : 0;
      var barPct = maxVotes ? Math.round(p.votes / maxVotes * 100) : 0;
      var expanded = (state.expanded[m.id] === p.playerId);
      var notesBadge = p.notes
        ? '<span>' + p.notes + '</span>'
        : '<span class="is-empty">·</span>';
      var row =
        '<div class="totw-row' + (expanded ? ' is-expanded' : '') + '" data-player="' + h(p.playerId) + '" style="--bar:' + h(pal.primary) + ';">' +
          '<div class="totw-row__pos">' + (i + 1) + '</div>' +
          '<div class="totw-row__name">' +
            h(p.name) +
            '<span class="totw-row__team">' + h(teamNameFor(p.teamId)) + '</span>' +
          '</div>' +
          '<div class="totw-row__bar"><span style="width:' + barPct + '%;"></span></div>' +
          '<div class="totw-row__count">' + p.votes + '<em>' + pct + '%</em></div>' +
          '<div class="totw-row__notebadge">' + notesBadge + '</div>' +
        '</div>';
      var drawer = expanded ? renderDrawer(p, homePal, awayPal, homeId, awayId) : '';
      return row + drawer;
    }).join('');
    return '<div class="totw-votes">' + rowsHtml + '</div>';
  }

  function renderDonutView(m, ranked, total, homePal, awayPal) {
    var a = m.attributes;
    var homeId = a.homeTeam.teamID, awayId = a.awayTeam.teamID;
    if (!total) return '<div class="totw-empty" style="padding:16px;">No votes yet.</div>';
    // Top 6 explicit, rest grouped "Other"
    var top = ranked.slice(0, 6);
    var rest = ranked.slice(6);
    var restVotes = rest.reduce(function (a, b) { return a + b.votes; }, 0);
    var segs = top.map(function (p) {
      return { id: p.playerId, name: p.name, teamId: p.teamId, votes: p.votes, colour: teamPal(p.teamId, homePal, awayPal, homeId, awayId).primary };
    });
    if (restVotes) segs.push({ id: '__other', name: 'Other (' + rest.length + ')', votes: restVotes, colour: 'var(--text-muted)' });

    var cx = 90, cy = 90, r = 70, ir = 44;
    var start = -Math.PI / 2;
    var paths = segs.map(function (s) {
      var sweep = s.votes / total * Math.PI * 2;
      var end = start + sweep;
      var p = donutPath(cx, cy, r, ir, start, end);
      start = end;
      return '<path d="' + p + '" fill="' + s.colour + '"></path>';
    }).join('');

    var legend = segs.map(function (s) {
      var pct = Math.round(s.votes / total * 100);
      var expanded = (state.expanded[m.id] === s.id);
      var clickable = s.id !== '__other';
      return '<div class="totw-legend__item' + (expanded ? ' is-expanded' : '') + '"' +
        (clickable ? ' data-player="' + h(s.id) + '"' : ' style="cursor:default;"') +
        ' style="--seg:' + h(s.colour) + ';">' +
        '<span class="totw-legend__swatch"></span>' +
        '<span class="totw-legend__name">' + h(s.name) + '</span>' +
        '<span class="totw-legend__count">' + s.votes + '</span>' +
        '<span class="totw-legend__pct">' + pct + '%</span>' +
      '</div>';
    }).join('');

    var expandedDrawer = '';
    var expandedPid = state.expanded[m.id];
    if (expandedPid && expandedPid !== '__other') {
      var p = ranked.filter(function (r) { return r.playerId === expandedPid; })[0];
      if (p) expandedDrawer = renderDrawer(p, homePal, awayPal, homeId, awayId);
    }

    return '<div class="totw-donutwrap">' +
      '<svg class="totw-donut" viewBox="0 0 180 180">' +
        paths +
        '<text x="90" y="92" text-anchor="middle" class="totw-donut__centre">' + total + '</text>' +
        '<text x="90" y="106" text-anchor="middle" class="totw-donut__centre-sub">votes</text>' +
      '</svg>' +
      '<div class="totw-legend">' + legend + '</div>' +
    '</div>' + expandedDrawer;
  }

  function donutPath(cx, cy, r, ir, startAngle, endAngle) {
    var sweep = endAngle - startAngle;
    if (sweep <= 0) return '';
    var x1 = cx + r * Math.cos(startAngle), y1 = cy + r * Math.sin(startAngle);
    var x2 = cx + r * Math.cos(endAngle),   y2 = cy + r * Math.sin(endAngle);
    var ix1 = cx + ir * Math.cos(startAngle), iy1 = cy + ir * Math.sin(startAngle);
    var ix2 = cx + ir * Math.cos(endAngle),   iy2 = cy + ir * Math.sin(endAngle);
    var large = sweep > Math.PI ? 1 : 0;
    // Tiny near-full-circle guard: SVG arcs render as 0-length when start==end.
    if (sweep > Math.PI * 2 - 0.0001) {
      // render as a near-full ring by splitting in two
      return 'M ' + (cx + r) + ' ' + cy +
        ' A ' + r + ' ' + r + ' 0 1 1 ' + (cx - r) + ' ' + cy +
        ' A ' + r + ' ' + r + ' 0 1 1 ' + (cx + r) + ' ' + cy +
        ' M ' + (cx + ir) + ' ' + cy +
        ' A ' + ir + ' ' + ir + ' 0 1 0 ' + (cx - ir) + ' ' + cy +
        ' A ' + ir + ' ' + ir + ' 0 1 0 ' + (cx + ir) + ' ' + cy + ' Z';
    }
    return 'M ' + x1 + ' ' + y1 +
      ' A ' + r + ' ' + r + ' 0 ' + large + ' 1 ' + x2 + ' ' + y2 +
      ' L ' + ix2 + ' ' + iy2 +
      ' A ' + ir + ' ' + ir + ' 0 ' + large + ' 0 ' + ix1 + ' ' + iy1 +
      ' Z';
  }

  /* ============================================================
     RENDER: player drawer (voter-club drill + notes)
     ============================================================ */
  function renderDrawer(player, homePal, awayPal, homeId, awayId) {
    var clubsArr = Object.keys(player.voterClubs).map(function (k) {
      return { name: k, count: player.voterClubs[k] };
    }).sort(function (a, b) { return b.count - a.count || a.name.localeCompare(b.name); });
    var maxC = clubsArr.length ? clubsArr[0].count : 0;
    var drillHtml = clubsArr.map(function (c) {
      var pal = palForClub(c.name);
      var pct = maxC ? Math.round(c.count / maxC * 100) : 0;
      return '<div class="totw-drillrow" style="--seg:' + h(pal.primary) + ';">' +
        '<span class="totw-drillrow__sw"></span>' +
        '<span class="totw-drillrow__name">' + h(c.name) + '</span>' +
        '<div class="totw-drillrow__bar"><span style="width:' + pct + '%;"></span></div>' +
        '<div class="totw-drillrow__count">' + c.count + '</div>' +
      '</div>';
    }).join('');

    var notesHtml = '';
    if (state.canSeeNotes) {
      if (player.notesList.length) {
        var items = player.notesList.sort(function (a, b) { return (b.submittedAt || 0) - (a.submittedAt || 0); })
          .map(renderNote).join('');
        notesHtml =
          '<div class="totw-notes">' +
            '<div class="totw-noteshead"><h4>Notes (' + player.notesList.length + ')</h4>' +
              '<span class="pill pill--info">Admin tier</span>' +
            '</div>' +
            items +
          '</div>';
      } else {
        notesHtml =
          '<div class="totw-notes">' +
            '<div class="totw-noteshead"><h4>Notes</h4></div>' +
            '<div class="totw-notes--locked" style="border-style:solid;">No fan left a note for this player.</div>' +
          '</div>';
      }
    } else if (player.notesList.length) {
      notesHtml =
        '<div class="totw-notes">' +
          '<div class="totw-noteshead"><h4>Notes (' + player.notesList.length + ')</h4></div>' +
          '<div class="totw-notes--locked">Notes are visible to <b>admin tier</b> only.</div>' +
        '</div>';
    }

    return '<div class="totw-drawer">' +
      '<h5 class="totw-drawer__title">Picked by</h5>' +
      '<div class="totw-drillbars">' + drillHtml + '</div>' +
      notesHtml +
    '</div>';

    function palForClub(name) {
      for (var i = 0; i < state.allMatches.length; i++) {
        var a = state.allMatches[i].attributes;
        if (a.homeTeam.name === name || a.homeTeam.shortName === name) return paletteForTeam(a.homeTeam.teamID);
        if (a.awayTeam.name === name || a.awayTeam.shortName === name) return paletteForTeam(a.awayTeam.teamID);
      }
      return { primary: 'var(--navy)' };
    }
  }

  function renderNote(v) {
    var voter = v.voter || {};
    var name = ((voter.forename || '') + ' ' + (voter.surnameInitial || '')).trim();
    if (voter.surnameInitial) name += '.';
    if (!name) name = '(name not on record)';
    var email = voter.email || '';
    var club = v.voterTeamName || '';
    var stamp = v.submittedAt ? new Date(v.submittedAt).toLocaleString('en-GB', { timeZone: 'Europe/London', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';
    return '<div class="totw-note">' +
      '<div class="totw-note__quote">"' + h(v.note) + '"</div>' +
      '<div class="totw-note__attrib">' +
        '<b>' + h(name) + '</b>' +
        '<span>· ' + h(club) + ' fan</span>' +
        (email ? '<span>· ' + h(email) + '</span>' : '') +
        (stamp ? '<span>· ' + h(stamp) + '</span>' : '') +
        '<button type="button" class="totw-note__copy" data-copy-note="' + h(encodeURIComponent(v.note + ' — ' + name + ' (' + club + ' fan)')) + '">Copy</button>' +
      '</div>' +
    '</div>';
  }

  /* ============================================================
     EVENT WIRING
     ============================================================ */
  function wireCards() {
    Array.prototype.forEach.call($matches.querySelectorAll('[data-mode]'), function (b) {
      b.addEventListener('click', function () {
        var card = b.closest('.totw-card');
        var mid = card && card.getAttribute('data-match'); if (!mid) return;
        state.chartMode[mid] = b.getAttribute('data-mode');
        state.expanded[mid] = null;
        renderMatches();
      });
    });
    Array.prototype.forEach.call($matches.querySelectorAll('[data-club]'), function (b) {
      b.addEventListener('click', function () {
        var card = b.closest('.totw-card');
        var mid = card && card.getAttribute('data-match'); if (!mid) return;
        var c = b.getAttribute('data-club');
        state.activeClub[mid] = (state.activeClub[mid] === c) ? null : c;
        state.expanded[mid] = null;
        renderMatches();
      });
    });
    Array.prototype.forEach.call($matches.querySelectorAll('[data-clear-club]'), function (b) {
      b.addEventListener('click', function () {
        var card = b.closest('.totw-card');
        var mid = card && card.getAttribute('data-match'); if (!mid) return;
        state.activeClub[mid] = null;
        state.expanded[mid] = null;
        renderMatches();
      });
    });
    Array.prototype.forEach.call($matches.querySelectorAll('[data-player]'), function (b) {
      b.addEventListener('click', function () {
        var card = b.closest('.totw-card');
        var mid = card && card.getAttribute('data-match'); if (!mid) return;
        var pid = b.getAttribute('data-player');
        state.expanded[mid] = (state.expanded[mid] === pid) ? null : pid;
        renderMatches();
      });
    });
    Array.prototype.forEach.call($matches.querySelectorAll('[data-copy-note]'), function (b) {
      b.addEventListener('click', function (e) {
        e.stopPropagation();
        try { copy(decodeURIComponent(b.getAttribute('data-copy-note'))); } catch (err) {}
      });
    });
    /* Card summary click → toggle the expanded details panel. */
    Array.prototype.forEach.call($matches.querySelectorAll('[data-expand-card]'), function (b) {
      b.addEventListener('click', function (e) {
        /* Don't toggle if the click landed on a control inside the
           details (chips, player rows, etc) — those have their own
           handlers and stopPropagation. */
        if (e.target.closest('.totw-card__details')) return;
        var mid = b.getAttribute('data-expand-card');
        state.expandedMatch[mid] = !state.expandedMatch[mid];
        if (!state.expandedMatch[mid]) {
          state.expanded[mid] = null;
          state.activeClub[mid] = null;
        }
        renderMatches();
      });
    });
  }

  /* ============================================================
     RENDER: page footer actions
     ============================================================ */
  function renderActions() {
    var matches = matchesForSelected();
    if (!matches.length) { $actions.innerHTML = ''; return; }
    $actions.innerHTML =
      '<button type="button" class="btn btn--ghost btn--sm" id="totw-copy-md">Copy for article (Markdown)</button>' +
      '<button type="button" class="btn btn--navy btn--sm" id="totw-export-csv">Export CSV</button>';
    document.getElementById('totw-copy-md').addEventListener('click', function () { copy(buildRoundupMarkdown()); });
    document.getElementById('totw-export-csv').addEventListener('click', function () { downloadCsv(); });
  }

  /* ============================================================
     EXPORT BUILDERS
     ============================================================ */
  function buildRoundupMarkdown() {
    var matches = matchesForSelected();
    var lines = [];
    lines.push('## ' + COMPS[state.selectedComp].shortName + ' — ' + state.selectedMatchday);
    lines.push('');
    matches.forEach(function (m) {
      var a = m.attributes;
      var rows = votesForMatch(m.id, null);
      var ranked = rankPlayers(rows);
      var score = (a.homeTeam.score != null && a.awayTeam.score != null) ? (a.homeTeam.score + '-' + a.awayTeam.score) : 'vs';
      lines.push('**' + a.homeTeam.name + ' ' + score + ' ' + a.awayTeam.name + '**');
      if (!ranked.length) { lines.push('- No votes.'); lines.push(''); return; }
      ranked.slice(0, 3).forEach(function (p, i) {
        var pct = rows.length ? Math.round(p.votes / rows.length * 100) : 0;
        lines.push('- ' + (i + 1) + '. **' + p.name + '** (' + teamNameFor(p.teamId) + ') — ' + p.votes + ' votes (' + pct + '%)');
      });
      if (state.canSeeNotes) {
        var notes = rows.filter(function (r) { return r.note; });
        if (notes.length) {
          lines.push('  - Notes:');
          notes.slice(0, 5).forEach(function (v) {
            var voter = v.voter || {};
            var name = ((voter.forename || '') + ' ' + (voter.surnameInitial || '')).trim();
            if (voter.surnameInitial) name += '.';
            lines.push('    - "' + v.note + '" — ' + name + ' (' + v.voterTeamName + ' fan)');
          });
        }
      }
      lines.push('');
    });
    return lines.join('\n');
  }
  function csvCell(v) {
    var s = String(v == null ? '' : v);
    if (s.indexOf(',') !== -1 || s.indexOf('"') !== -1 || s.indexOf('\n') !== -1) {
      return '"' + s.replace(/"/g, '""') + '"';
    }
    return s;
  }
  function downloadCsv() {
    var matches = matchesForSelected();
    var headers = ['matchId', 'match', 'player', 'playerTeam', 'voterName', 'voterEmail', 'voterClub', 'note', 'submittedAt'];
    var lines = [headers.join(',')];
    matches.forEach(function (m) {
      var a = m.attributes;
      var score = (a.homeTeam.score != null && a.awayTeam.score != null) ? (a.homeTeam.score + '-' + a.awayTeam.score) : 'vs';
      var label = a.homeTeam.shortName + ' ' + score + ' ' + a.awayTeam.shortName;
      var rows = votesForMatch(m.id, null);
      rows.forEach(function (v) {
        var voter = v.voter || {};
        var name = ((voter.forename || '') + ' ' + (voter.surnameInitial || '')).trim();
        if (voter.surnameInitial) name += '.';
        var note = state.canSeeNotes ? v.note : (v.note ? '[admin-only]' : '');
        var stamp = v.submittedAt ? new Date(v.submittedAt).toISOString() : '';
        lines.push([
          csvCell(m.id), csvCell(label), csvCell(v.playerName),
          csvCell(teamNameFor(v.teamId)), csvCell(name),
          csvCell(state.canSeeNotes ? (voter.email || '') : ''),
          csvCell(v.voterTeamName), csvCell(note), csvCell(stamp)
        ].join(','));
      });
    });
    var csv = lines.join('\n');
    var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'totw-' + COMPS[state.selectedComp].shortName.toLowerCase() + '-' + state.selectedMatchday + '.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  /* ============================================================
     MAIN RENDER
     ============================================================ */
  function render() {
    renderMaintabs();
    renderFilters();
    /* Show/hide the three tab containers and render only the active one. */
    $tabMatchday.hidden = (state.activeTab !== 'matchday');
    $tabByClub.hidden   = (state.activeTab !== 'byclub');
    $tabSeason.hidden   = (state.activeTab !== 'season');
    if (state.activeTab === 'matchday') {
      renderMatchdayStrip();
      renderSummary();
      renderMatches();
      renderActions();
    } else if (state.activeTab === 'byclub') {
      renderByClub();
    } else if (state.activeTab === 'season') {
      renderSeason();
    }
  }

  /* By Club + Season are stubs in this commit; the next commit adds the
     real implementations. Showing a friendly placeholder so the tabs
     are wired and clickable but flag what's coming. */
  function renderByClub() {
    $tabByClub.innerHTML =
      '<div class="empty-state">' +
        '<div class="empty-state__icon">🏟️</div>' +
        '<div class="empty-state__title">By Club view — coming in the next commit</div>' +
        '<div class="empty-state__text">Pick a club to see every match they\'ve played this season with the vote totals for each.</div>' +
      '</div>';
  }
  function renderSeason() {
    $tabSeason.innerHTML =
      '<div class="empty-state">' +
        '<div class="empty-state__icon">📈</div>' +
        '<div class="empty-state__title">Season leaderboard — coming in the next commit</div>' +
        '<div class="empty-state__text">Top voted players across the whole season in the selected division.</div>' +
      '</div>';
  }

  /* ============================================================
     BOOT
     ============================================================ */
  window.TOOL = window.TOOL || {};
  window.TOOL.boot = function (session) {
    state.session = session;
    state.canSeeNotes = (resolveLevel(session) === 'admin');
    renderRolebar();
    showBanner('Loading fan votes…');

    // 1. Ensure nl-tools auth (for prefs writes). Then 2. init nl-widgets app
    // and anonymous-auth. Then 3. parallel: fetch fixtures + clubs meta +
    // fan data. Then 4. apply prefs → render.
    var ensure = (window.NL && NL.ensureAuth) ? NL.ensureAuth() : Promise.resolve();
    ensure
      .then(function () { return initWidgetsApp(); })
      .then(function () {
        return Promise.all([
          fetchAllFixtures().then(function (ms) { state.allMatches = ms; }),
          loadClubsMeta(),
          loadFanData(),
          loadPrefs()
        ]).then(function (results) {
          var prefs = results[3];
          if (prefs) {
            if (prefs.activeTab && (prefs.activeTab === 'matchday' || prefs.activeTab === 'byclub' || prefs.activeTab === 'season')) {
              state.activeTab = prefs.activeTab;
            }
            if (prefs.compId === 'all') state.selectedComp = 'all';
            else if (prefs.compId && COMPS[prefs.compId]) state.selectedComp = prefs.compId;
            if (prefs.selectedClub) state.selectedClub = prefs.selectedClub;
            if (typeof prefs.notesOnly === 'boolean') state.notesOnly = prefs.notesOnly;
          }
          state.selectedMatchday = (prefs && prefs.matchday) || defaultMatchday();
          if (!state.selectedMatchday) state.selectedMatchday = defaultMatchday();
        });
      })
      .then(function () {
        state.loaded = true;
        hideBanner();
        render();
        if (window.NL && NL.writeAudit) {
          NL.writeAudit('totw_opened', COMPS[state.selectedComp].shortName + ' / ' + (state.selectedMatchday || '—'));
        }
      })
      .catch(function (err) {
        showBanner('Could not load fan data: ' + (err && err.message ? err.message : err), 'err');
        // eslint-disable-next-line no-console
        console.error('[team-of-the-week] boot failed', err);
      });
  };

  if (window._toolDeferredSession) {
    window.TOOL.boot(window._toolDeferredSession);
    delete window._toolDeferredSession;
  }
})();
</script>
