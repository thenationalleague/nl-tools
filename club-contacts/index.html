  }

  /* ---- Lead contacts step (#7) — nominate >=1 named contact per League area;
     pick from people already entered, or add a new person. Replaces mailing lists. ---- */
  function leadNominees(key) { return (data.leads[key] || []).map(findPerson).filter(Boolean); }
  function functionMembers(rec) { return rec ? data.people.filter(function (p) { return personName(p) && hasRole(p, rec); }) : []; }
  function renderLeadsStep(host) {
    // Pre-tick everyone in each area's function. We keep tracking the function
    // members until the club first curates an area (data.leadsTouched[key]); after
    // that we respect their explicit ticks. This way late-added people still get
    // auto-suggested, and unticks/extra picks are never re-overwritten.
    LEAD_AREAS.forEach(function (a) {
      if (!data.leadsTouched[a.key]) data.leads[a.key] = functionMembers(a.rec).map(function (p) { return p.id; });
      else data.leads[a.key] = (data.leads[a.key] || []).filter(function (id) { return findPerson(id); });
    });
    host.innerHTML =
      '<h2 class="ri-stephead">Lead contacts</h2>' +
      '<p class="ri-stepsub">For each area, the person who will be nominated to receive the National League’s emails on that function. Everyone you put in that function is ticked by default — untick anyone who shouldn’t receive them, tick others, or add a new person (e.g. a dedicated SLO).</p>' +
      LEAD_AREAS.map(function (a) {
        var nominated = data.leads[a.key] || [];
        var members = functionMembers(a.rec);
        var memberIds = members.map(function (p) { return p.id; });
        var extras = nominated.filter(function (id) { return memberIds.indexOf(id) === -1; }).map(findPerson).filter(Boolean);
        var candidates = members.concat(extras);
        var others = data.people.filter(function (p) { return personName(p) && candidates.indexOf(p) === -1; });
        return '<div class="ri-card" data-area="' + a.key + '"><h2>' + esc(a.label) + '</h2>' +
          (candidates.length
            ? candidates.map(function (p) {
                var on = nominated.indexOf(p.id) !== -1;
                return '<label class="ri-listmember"><input type="checkbox" data-leadck="' + a.key + '|' + p.id + '"' + (on ? ' checked' : '') + '> ' +
                  '<span>' + esc(personName(p)) + ' <span class="muted">' + esc(rolesText(p)) + '</span></span></label>';
              }).join('')
            : '<p class="ri-listempty">No one yet' + (a.rec ? ' — add someone on the ' + esc(a.rec) + ' page, or add one here.' : '.') + '</p>') +
          (others.length
            ? '<select class="ri-leadpick" data-leadpick="' + a.key + '"><option value="">+ Add someone from another area…</option>' +
                others.map(function (p) { return '<option value="' + p.id + '">' + esc(personName(p)) + ' — ' + esc(rolesText(p)) + '</option>'; }).join('') + '</select>'
            : '') +
          '<button type="button" class="ri-addmore" data-leadnew="' + a.key + '">+ Add a new person</button>' +
          '<div class="ri-leadform" data-leadform="' + a.key + '" style="display:none;">' +
            '<div class="ri-grid">' +
              '<div><label>First name</label><input type="text" data-lf="firstName"></div>' +
              '<div><label>Surname</label><input type="text" data-lf="lastName"></div>' +
            '</div>' +
            '<div class="ri-grid" style="margin-top:8px;">' +
              '<div><label>Email</label><input type="email" data-lf="email"><p class="ri-err">Not a valid email address.</p></div>' +
              '<div><label>Phone</label><input type="tel" data-lf="phone"><p class="ri-err">Doesn’t look like a UK phone number.</p></div>' +
            '</div>' +
            '<button type="button" class="btn-confirm" data-leadadd="' + a.key + '">Add &amp; tick</button>' +
          '</div>' +
        '</div>';
      }).join('');
    wireValidation(host);
    // Listeners bound to the FRESH per-render elements (never to the persistent
    // host) so they can't accumulate and multiply nominations.
    function touch(key) { data.leadsTouched[key] = true; data.leads[key] = data.leads[key] || []; return data.leads[key]; }
    Array.prototype.forEach.call(host.querySelectorAll('[data-leadck]'), function (cb) {
      cb.addEventListener('change', function () {
        var parts = cb.getAttribute('data-leadck').split('|'), arr = touch(parts[0]), i = arr.indexOf(parts[1]);
        if (cb.checked && i === -1) arr.push(parts[1]);
        else if (!cb.checked && i !== -1) arr.splice(i, 1);
        saveDraft(true); renderSteps();
      });
    });
    Array.prototype.forEach.call(host.querySelectorAll('[data-leadpick]'), function (sel) {
      pinSelect(sel);
      sel.addEventListener('change', function () {
        if (!sel.value) return; var arr = touch(sel.getAttribute('data-leadpick'));
        if (arr.indexOf(sel.value) === -1) arr.push(sel.value);
        saveDraft(true); renderStep(); renderSteps();
      });
    });
    Array.prototype.forEach.call(host.querySelectorAll('[data-leadnew]'), function (btn) {
      btn.addEventListener('click', function () {
        var f = host.querySelector('[data-leadform="' + btn.getAttribute('data-leadnew') + '"]');
        if (f) { f.style.display = 'block'; var n = f.querySelector('[data-lf="firstName"]'); if (n) n.focus(); }
      });
    });
    Array.prototype.forEach.call(host.querySelectorAll('[data-leadadd]'), function (btn) {
      btn.addEventListener('click', function () {
        var key = btn.getAttribute('data-leadadd'), f = host.querySelector('[data-leadform="' + key + '"]');
        var g = function (k) { var x = f.querySelector('[data-lf="' + k + '"]'); return x ? x.value.trim() : ''; };
        if (!g('firstName') && !g('lastName')) { el('riStatus').textContent = 'Please enter a name for the new person.'; return; }
        var a = leadArea(key);
        var np = { id: uid(), firstName: g('firstName'), lastName: g('lastName'), emails: g('email') ? [g('email')] : [], phones: g('phone') ? [{ number: g('phone'), ext: '' }] : [], roles: [{ section: a.rec || 'Other', title: a.label }] };
        data.people.push(np); touch(key).push(np.id);
        saveDraft(true); renderStep(); renderSteps();
      });
    });
  }

  /* ---- Inline validation ---- */
  function wireValidation(scope) {
    Array.prototype.forEach.call(scope.querySelectorAll('input[type=email],input[type=tel]'), function (inp) {
      if (inp.getAttribute('data-ext') !== null) return;
      inp.addEventListener('blur', function () { checkField(inp); });
      inp.addEventListener('input', function () { if (inp.classList.contains('is-bad')) checkField(inp); });
    });
  }
  function checkField(inp) {
    var v = inp.value.trim();
    var ok = !v || (inp.type === 'email' ? validEmail(v) : validPhone(v));
    inp.classList.toggle('is-bad', !ok);
    var err = inp.parentNode.querySelector('.ri-err'); if (err) err.classList.toggle('show', !ok);
    return ok;
  }

  /* ---- Read DOM into `data` ---- */
  function syncEditCards() {
    Array.prototype.forEach.call(el('riStep').querySelectorAll('[data-pedit]'), function (card) {
      var p = findPerson(card.getAttribute('data-pid')); if (!p) return;
      var section = card.getAttribute('data-section');
      var g = function (k) { var n = card.querySelector('[data-p="' + k + '"]'); return n ? n.value.trim() : ''; };
      // A linked person's card has NO name inputs (read-only header), so only
      // overwrite the shared name when the fields are present — otherwise we'd wipe it.
      var fn = card.querySelector('[data-p="firstName"]'), ln = card.querySelector('[data-p="lastName"]');
      if (fn) p.firstName = fn.value.trim();
      if (ln) p.lastName = ln.value.trim();
      var hon = card.querySelector('[data-honorific]'); if (hon) p.title = hon.value;
      var pnm = card.querySelector('[data-postnoms]'); if (pnm) p.postNominals = pnm.value.trim();
      p.emails = readEmails(card.querySelector('[data-emails]'));
      p.phones = readPhones(card.querySelector('[data-phones]'));
      var role = roleFor(p, section); if (role) role.title = g('title');
      var hc = card.querySelector('[data-hidecontact]'); if (hc) p.hideContact = hc.checked;
      var ql = card.querySelector('[data-qual]'); if (ql) p.qualification = ql.value.trim();
    });
  }
  function pruneEmpty() {
    data.people = data.people.filter(function (p) { return personName(p) || (p.emails && p.emails.length) || (p.phones && p.phones.length); });
  }
  function syncStep() {
    var step = STEPS[cur];
    if (step.kind === 'you') {
      if (el('f_yourName')) data.yourName = el('f_yourName').value.trim();
      if (el('f_yourEmail')) data.yourEmail = el('f_yourEmail').value.trim();
    } else if (step.kind === 'info') {
      INFO_KEYS.forEach(function (k) { var n = el('riStep').querySelector('[data-info="' + k + '"]'); if (n) data.info[k] = n.value.trim(); });
      var ns = el('riStep').querySelector('[data-info-nosponsor]'); if (ns) data.info.noSponsor = ns.checked;
    } else if (step.kind === 'inboxes') {
      data.inboxes = {};
      Array.prototype.forEach.call(el('riStep').querySelectorAll('.ri-person'), function (row) {
        var g = function (k) { var n = row.querySelector('[data-ib="' + k + '"]'); return n ? n.value.trim() : ''; };
        var sel = g('key'); if (!sel) return;
        var ib = { email: g('email'), phone: g('phone'), ext: g('ext') };
        if (!ib.email && !ib.phone) return;
        if (sel === '__other') {
          var label = g('otherlabel'); if (!label) return;
          ib.dept = label;
          data.inboxes['other-' + (deptSlug(label) || Object.keys(data.inboxes).length)] = ib;
        } else { ib.dept = sel; data.inboxes[deptSlug(sel)] = ib; }
      });
      if (Object.keys(data.inboxes).length) data.noInboxes = false;
    } else if (step.kind === 'depts') {
      syncEditCards();
    }
    // 'leads' needs no DOM sweep — nominations are mutated straight into data.leads
    // by the lead-step handlers (and the inline "add new" form commits on click).
  }

  /* ---- Validation sweep (submit) ---- */
  function findProblems() {
    var probs = [];
    if (!validEmail(data.yourEmail)) probs.push({ step: stepIndexById('you'), msg: 'Your email address looks invalid.' });
    if (data.info) {
      if (data.info.mainEmail && !validEmail(data.info.mainEmail)) probs.push({ step: stepIndexById('info'), msg: 'Club main contact email looks invalid.' });
      if (data.info.phone && !validPhone(data.info.phone)) probs.push({ step: stepIndexById('info'), msg: 'Club switchboard phone looks invalid.' });
    }
    Object.keys(data.inboxes).forEach(function (k) {
      var ib = data.inboxes[k], nm = ib.dept || ib.label || k;
      if (ib.email && !validEmail(ib.email)) probs.push({ step: stepIndexById('inboxes'), msg: 'Shared “' + nm + '” email looks invalid.' });
      if (ib.phone && !validPhone(ib.phone)) probs.push({ step: stepIndexById('inboxes'), msg: 'Shared “' + nm + '” phone looks invalid.' });
    });
    data.people.forEach(function (p) {
      var st = stepForSection((p.roles[0] || {}).section);
      var who = (personName(p) || rolesText(p) || 'someone');
      (p.emails || []).forEach(function (e) { if (!validEmail(e)) probs.push({ step: st, msg: who + ': email “' + e + '” looks invalid.' }); });
      (p.phones || []).forEach(function (ph) { if (ph.number && !validPhone(ph.number)) probs.push({ step: st, msg: who + ': phone “' + ph.number + '” looks invalid.' }); });
    });
    return probs;
  }

  /* ---- Coverage / review ---- */
  function leadState(key) { return (data.leads[key] || []).some(findPerson) ? 'ok' : 'gap'; }
  function renderReview(host) {
    var states = LEAD_AREAS.map(function (a) { return [a, leadState(a.key)]; });
    var covered = states.filter(function (s) { return s[1] === 'ok'; }).length;
    var nPeople = data.people.length, nInbox = Object.keys(data.inboxes).length;
    var probs = findProblems();

    // duplicate-email safety net
    var emailMap = {};
    data.people.forEach(function (p) {
      (p.emails || []).forEach(function (e) {
        var k = e.trim().toLowerCase(); if (!k) return;
        emailMap[k] = emailMap[k] || []; if (emailMap[k].indexOf(p) === -1) emailMap[k].push(p);
      });
    });
    var dups = Object.keys(emailMap).filter(function (k) { return emailMap[k].length > 1; }).map(function (k) {
      return { email: k, who: emailMap[k].map(function (p) { return personName(p) || rolesText(p); }) };
    });

    // people, ordered by their first role's department
    var secOrder = []; STEPS.forEach(function (s) { if (s.sections) s.sections.forEach(function (x) { secOrder.push(x); }); });
    var ordered = data.people.slice().sort(function (a, b) {
      return secOrder.indexOf((a.roles[0] || {}).section) - secOrder.indexOf((b.roles[0] || {}).section);
    });
    var rosterHtml = ordered.length ? ordered.map(function (p) {
      var roles = (p.roles || []).map(function (r) { return esc(r.section) + (r.title ? ' (' + esc(r.title) + ')' : ''); }).join(', ');
      var meta = (p.qualification ? ' · ' + esc(p.qualification) : '') + (p.hideContact ? ' · hidden from directory' : '');
      return '<div class="ri-rev__p"><b>' + esc(personName(p) || '(unnamed)') + '</b> <span class="muted">— ' + roles + '</span>' +
        '<br><span class="muted">' + esc(contactLine(p)) + meta + '</span></div>';
    }).join('') : '<p class="muted" style="color:var(--text-muted);font-size:13px;">No people added yet.</p>';

    var info = data.info || {};
    var infoRows = INFO_GROUPS.map(function (g) {
      var rows = g[1].filter(function (f) { return (info[f[0]] != null ? String(info[f[0]]) : '').trim(); })
        .map(function (f) { return '<div class="ri-rev__p"><span class="muted">' + esc(f[1].replace(/\s*\(.*\)$/, '')) + ':</span> ' + esc(info[f[0]]) + '</div>'; }).join('');
      return rows ? '<div style="margin-bottom:10px;"><div style="font-size:12px;text-transform:uppercase;letter-spacing:.06em;font-variation-settings:\'wght\' 800;color:var(--navy);margin-bottom:2px;">' + esc(g[0]) + '</div>' + rows + '</div>' : '';
    }).join('');
    var infoCard = '<div class="ri-card"><h2>Club information</h2>' + (infoRows || '<p class="ri-card__sub">Nothing entered yet.</p>') + '</div>';

    host.innerHTML =
      '<h2 class="ri-stephead">Check &amp; submit</h2>' +
      '<p class="ri-stepsub">You’ve added <b>' + nPeople + '</b> ' + (nPeople === 1 ? 'person' : 'people') + ' and <b>' + nInbox + '</b> shared ' + (nInbox === 1 ? 'address' : 'addresses') + '. Please check the details below before submitting.</p>' +
      (probs.length ? '<div class="ri-prob"><b>' + probs.length + ' thing' + (probs.length > 1 ? 's' : '') + ' to fix before you can submit:</b>' +
        probs.slice(0, 8).map(function (p) { return '<div>• ' + esc(p.msg) + ' <a data-fix="' + p.step + '">Fix</a></div>'; }).join('') +
        (probs.length > 8 ? '<div>…and ' + (probs.length - 8) + ' more.</div>' : '') + '</div>' : '') +
      (dups.length ? '<div class="ri-dupnote"><b>The same email appears on more than one person:</b>' +
        dups.map(function (d) { return '<div>• ' + esc(d.email) + ' — ' + esc(d.who.join(', ')) + '</div>'; }).join('') +
        '<div style="margin-top:6px;">If that’s one person, enter them once and use <b>“add someone already listed”</b> on the other department so they stay a single record.</div></div>' : '') +
      infoCard +
      '<div class="ri-card"><h2>Lead-contact coverage</h2><p class="ri-card__sub">' + covered + ' of ' + LEAD_AREAS.length + ' areas have a nominated lead. Tap an amber one to jump back. Gaps are fine if that role genuinely doesn’t apply.</p>' +
      '<div class="ri-cov">' + states.map(function (s) {
        var ok = s[1] === 'ok';
        return '<div class="ri-cov__cell is-' + (ok ? 'ok' : 'gap') + '" data-coverarea="' + s[0].key + '">' +
          '<div class="ri-cov__list">' + esc(s[0].label) + '</div><div class="ri-cov__st">' + (ok ? '✓ ' + esc(personName(leadNominees(s[0].key)[0] || {}) || 'nominated') : '— no one yet') + '</div></div>';
      }).join('') + '</div></div>' +
      '<div class="ri-card"><h2>Your contacts</h2><p class="ri-card__sub">Everyone you’ve entered, with their roles.</p>' + rosterHtml + '</div>';

    Array.prototype.forEach.call(host.querySelectorAll('[data-coverarea]'), function (c) {
      c.addEventListener('click', function () { goTo(stepIndexById('leads')); });
    });
    Array.prototype.forEach.call(host.querySelectorAll('[data-fix]'), function (a) {
      a.addEventListener('click', function () { goTo(parseInt(a.getAttribute('data-fix'), 10)); });
    });
  }

  /* ---- Navigation ---- */
  function bindNav() {
    el('riNext').addEventListener('click', function () {
      if (cur === STEPS.length - 1) { submit(); return; }
      if (cur === 0) { syncStep(); if (!data.yourName || !validEmail(data.yourEmail)) { el('riStatus').textContent = 'Please add your name and a valid email.'; if (el('f_yourEmail')) checkField(el('f_yourEmail')); return; } }
      goTo(cur + 1);
    });
    el('riBack').addEventListener('click', function () { if (cur > 0) goTo(cur - 1); });
    el('riJumpBtn').addEventListener('click', function (e) { e.stopPropagation(); openJump(el('riJumpMenu').hidden); });
    el('riJumpBtn').addEventListener('keydown', function (e) { if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && el('riJumpMenu').hidden) { e.preventDefault(); openJump(true); } });
    el('riJumpMenu').addEventListener('click', function (e) {
      var b = e.target.closest('[data-jump]'); if (!b) return;
      openJump(false); goTo(parseInt(b.getAttribute('data-jump'), 10));
    });
    document.addEventListener('click', function (e) {
      if (!el('riJumpMenu').hidden && !e.target.closest('.ri-jumpwrap')) openJump(false);
    });
    el('riJumpMenu').addEventListener('keydown', jumpKeydown);
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') openJump(false); });
    el('riStep').addEventListener('input', markSaved);
    el('riStep').addEventListener('change', markSaved);
  }
  function goTo(idx) {
    syncStep(); pruneEmpty();
    // Leaving a page commits any open person card just as "Save this person" would:
    // syncStep() has already read the fields into data, so here we collapse cards
    // for anyone with a name to a tidy summary row (and drop edit state for cards
    // pruneEmpty removed) — so a half-filled card is never silently lost or left
    // looking unsaved when the club returns.
    Object.keys(editing).forEach(function (id) {
      var p = findPerson(id);
      if (!p || personName(p)) { delete editing[id]; delete unlockedShared[id]; }
    });
    saveDraft(); cur = idx; renderSteps(); renderStep(); window.scrollTo(0, 0);
  }

  /* ---- Draft persistence ---- */
  var saveTimer = null;
  function markSaved() { clearTimeout(saveTimer); saveTimer = setTimeout(function () { syncStep(); renderSteps(); saveDraft(true); }, 500); }
  function saveDraft(flash) {
    try { localStorage.setItem(LS_KEY, JSON.stringify(data)); if (flash) { var s = el('riSaved'); s.classList.add('show'); setTimeout(function () { s.classList.remove('show'); }, 1000); } } catch (e) {}
  }
  function loadDraft() { try { var r = localStorage.getItem(LS_KEY); return r ? JSON.parse(r) : null; } catch (e) { return null; } }

  /* ---- Submit (write-once, validated) ---- */
  function submit() {
    syncStep(); pruneEmpty();
    if (!data.yourName || !validEmail(data.yourEmail)) { goTo(stepIndexById('you')); el('riStatus').textContent = 'Please add your name and a valid email.'; return; }
    if (!data.people.length && !Object.keys(data.inboxes).length) { el('riStatus').textContent = 'Please add at least one person or shared address before submitting.'; return; }
    var probs = findProblems();
    if (probs.length) { renderReview(el('riStep')); el('riStatus').textContent = 'Please fix ' + probs.length + ' highlighted ' + (probs.length === 1 ? 'item' : 'items') + '.'; return; }
    data.people.forEach(function (p) { p.name = personName(p); });   // derived full name, handy for export/import
    var rec = { club: clubName, yourName: data.yourName, yourEmail: data.yourEmail, info: data.info, inboxes: data.inboxes, people: data.people, leads: data.leads, submittedAt: Date.now() };
    var btn = el('riNext'); btn.disabled = true; btn.textContent = 'Submitting…';
    db.ref('app-data/ops-club-contacts/submissions/' + token).set(rec).then(function () {
      try { localStorage.removeItem(LS_KEY); } catch (e) {}
      renderLocked(rec);
    }).catch(function (e) {
      btn.disabled = false; btn.textContent = 'Submit to the League';
      el('riStatus').textContent = 'Submission failed: ' + (e.message || e);
    });
  }

  /* ---- Locked read-only view ---- */
  function renderLocked(rec) {
    el('riApp').querySelector('.ri-stepper').style.display = 'none';
    el('riApp').querySelector('.ri-nav').style.display = 'none';
    var inboxKeys = Object.keys(rec.inboxes || {});
    var when = rec.submittedAt ? new Date(rec.submittedAt).toLocaleString('en-GB', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' }) : '';
    var ri = rec.info || {};
    var infoHtml = INFO_GROUPS.map(function (g) {
      var rows = g[1].filter(function (f) { return (ri[f[0]] != null ? String(ri[f[0]]) : '').trim(); })
        .map(function (f) { return '<div style="font-size:13px;padding:2px 0;"><span style="color:var(--text-muted);">' + esc(f[1].replace(/\s*\(.*\)$/, '')) + ':</span> ' + esc(ri[f[0]]) + '</div>'; }).join('');
      return rows ? '<div style="margin-bottom:8px;"><b style="color:var(--navy);font-size:12px;text-transform:uppercase;letter-spacing:.05em;">' + esc(g[0]) + '</b>' + rows + '</div>' : '';
    }).join('');
    var peopleHtml = (rec.people || []).map(function (p) {
      var roles = (p.roles || []).map(function (r) { return esc(r.section) + (r.title ? ' (' + esc(r.title) + ')' : ''); }).join(', ');
      var meta = (p.qualification ? ' · ' + esc(p.qualification) : '') + (p.hideContact ? ' · hidden from directory' : '');
      return '<div style="padding:6px 0;font-size:13px;border-bottom:1px solid var(--border);"><b>' + esc(personName(p) || '(unnamed)') + '</b> <span style="color:var(--text-muted);">— ' + roles + '</span>' +
        '<br><span style="color:var(--text-muted);">' + esc(contactLine(p)) + meta + '</span></div>';
    }).join('');
    function lockedName(id) { var p = (rec.people || []).filter(function (x) { return x.id === id; })[0]; return p ? (personName(p) || '(unnamed)') : ''; }
    var leadsHtml = LEAD_AREAS.map(function (a) {
      var names = (rec.leads && rec.leads[a.key] || []).map(lockedName).filter(Boolean).join(', ');
      return names ? '<div style="font-size:13px;padding:3px 0;"><span style="color:var(--text-muted);">' + esc(a.label) + ':</span> <b>' + esc(names) + '</b></div>' : '';
    }).join('');
    el('riStep').innerHTML =
      '<div class="ri-card" style="border-top-color:var(--green);">' +
        '<h2 style="color:var(--green);">✓ Submitted &amp; locked</h2>' +
        '<p class="ri-card__sub">Received by the League' + (when ? ' on ' + esc(when) : '') + '. Your submission is shown below for reference. To change anything, please contact the League and we’ll re-open your form.</p></div>' +
      (infoHtml ? '<div class="ri-card"><h2>Club information</h2>' + infoHtml + '</div>' : '') +
      (inboxKeys.length ? '<div class="ri-card"><h2>Department inboxes</h2>' + inboxKeys.map(function (k) {
        var ib = rec.inboxes[k];
        return '<div style="font-size:13px;padding:3px 0;"><b style="color:var(--navy);">' + esc(ib.dept || ib.label || k) + '</b> — ' + esc([ib.email, ib.phone].filter(Boolean).join(' · ')) + '</div>';
      }).join('') + '</div>' : '') +
      (leadsHtml ? '<div class="ri-card"><h2>Lead contacts</h2>' + leadsHtml + '</div>' : '') +
      (peopleHtml ? '<div class="ri-card"><h2>People</h2>' + peopleHtml + '</div>' : '');
  }

  // CSS.escape fallback for attribute selectors with spaces/ampersands.
  function cssesc(s) { return (window.CSS && CSS.escape) ? CSS.escape(s) : String(s).replace(/["\\\]#.:&\s]/g, '\\$&'); }
})();
</script>
</body>
</html>
