<!DOCTYPE html>
<!--
  NL Tools — Save of the Month (League console)
  Version: v20.0 (21/10/2026)
  File: /save-of-the-month/admin/index.html

  CHANGELOG
    v20.0 (21/10/2026) — One Play per nomination ("Play (2)" when it has
      two clips; the player steps through them), and the file size moves
      to its own Size column (the nomination's total) instead of stacking
      under each button.
    v18.0 (21/10/2026) — Clips play in the page: Play opens a player with
      the nomination's details and context, ‹ › between its clips, a
      Shortlist toggle and a download link, instead of opening the Storage
      URL in a new tab. A format the browser cannot play says so and
      offers the download.
    v16.0 (21/10/2026) — "Changed by the club" (was "Typed by the club":
      the flag is also set when a club picks a different keeper from the
      dropdown); Clips, plural, in the table and CSV.
    v14.0 (21/10/2026) — Several clips per nomination (Play 1, Play 2…;
      CSV lists every clip; Delete clips clears them all). No cap per club,
      so rows sort by when they were sent, not by slot. Fixed Delete clips
      never enabling (it checked the row, not its record).
    v8.0 (19/10/2026) — Canon pass: crests through NL.clubs.crestImgHtml +
      wireCrestImgs and .nl-crest, plain btn--danger, the shortlist highlight
      survives row hover, one restated line cut. Both month choices are the
      canon month picker (NL.monthPicker); the list's has ‹ › to step.
    v4.0 (19/10/2026) — First build. Opens one month at a time for
      nominations, with an optional closing date, and closes it by hand.
      Lists what clubs have nominated for any month, plays the clips, marks
      a shortlist (never shown to clubs), exports the view as CSV, and
      deletes a finished month's clips from Storage. Version is the
      session's turn number.

  Clubs nominate at /save-of-the-month/ with their access code: a league
  match from the open month, the minute, their goalkeeper, optional context
  and optional clips. No cap per club; each nomination is a push key.

  Storage (RTDB):
    app-data/media-save-of-the-month/config
        { month: 'YYYY-MM', closesAt?: ms }      absent = nothing open
    app-data/media-save-of-the-month/nominations/<YYYY-MM>/<CODE>/<nid>
        { matchId, match, date, minute, keeper, keeperEdited?, context?, clips?, at }
        (clips: { c00: {path,url,name,size,type}, … }; records before v14.0
        carry a single `clip` — SOTM.clipsOf reads both)
    app-data/media-save-of-the-month/shortlist/<YYYY-MM>/<CODE>/<nid>: true
        League-only: clubs have no read on this node.
    tools/media-save-of-the-month                tool registration
  Storage (bucket):
    save-of-the-month/<CODE>/<YYYY-MM>/*         club clips, video, <250MB

  Access (auth-guard registry): league roles, levels off/access. Access is
  the whole console; nothing reads an admin level.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Save of the Month — NL Tools</title>
  <!-- Favicons. Static, not injected: nl-topbar.js adds these too, but a
       standalone page never loads it, and an icon that arrives with the JS
       leaves the tab blank until it does. /favicon.ico at the root is the
       backstop every browser asks for without being told. -->
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/favicon-16x16.png">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">

  <!-- Brand stylesheet (lint canonical: ?v=67) -->
  <link rel="stylesheet" href="/system/nl-brand.css?v=69">

  <!-- Firebase 10.12.0 SDK (compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>

  <!-- Firebase init -->
  <script>
    firebase.initializeApp({
      apiKey:            "AIzaSyC3az3OMnU7TdqlaWp8yrO_EjgZ36l-mXU",
      authDomain:        "nl-tools.firebaseapp.com",
      databaseURL:       "https://nl-tools-default-rtdb.europe-west1.firebasedatabase.app",
      projectId:         "nl-tools",
      storageBucket:     "nl-tools.firebasestorage.app",
      messagingSenderId: "801354670005",
      appId:             "1:801354670005:web:05d8ebad3e7e63610d03fc"
    });
    var db = firebase.database();
  </script>

  <!-- Tool identity + changelog. Keep window.NL_TOOL and var NL_TOOL_KEY
       in sync — auth-guard reads NL_TOOL_KEY, nl-topbar reads window.NL_TOOL. -->
  <script>
    window.NL_TOOL = {
      title: 'Save of the Month',
      toolKey: 'media-save-of-the-month'
    };
    var NL_TOOL_KEY = 'media-save-of-the-month';

    window.NL_CHANGELOG = [
      {
        date: '19/10/2026',
        version: 'v20.0',
        items: ['One Play button per nomination, and file size in its own column.']
      },
      {
        date: '21/10/2026',
        version: 'v18.0',
        items: ['Clips play right here, with the nomination details, Shortlist and Download beside them.']
      },
      {
        date: '21/10/2026',
        version: 'v16.0',
        items: ['A keeper the club changed from the team sheet is marked "Changed by the club".']
      },
      {
        date: '21/10/2026',
        version: 'v14.0',
        items: ['A nomination can carry several clips; each gets its own Play link.', 'Delete clips now works (it stayed greyed out).']
      },
      {
        date: '19/10/2026',
        version: 'v8.0',
        items: ['Months are chosen with the brand month picker; the list has ‹ › to step between months with nominations.', 'Shortlisted rows stay highlighted under the pointer.']
      },
      {
        date: '19/10/2026',
        version: 'v4.0',
        items: [
          'First build. Open a month for nominations with an optional closing date, and close it by hand.',
          'See every club’s nominations for a month, play the clips, and mark a shortlist that clubs never see.',
          'Export the list as CSV, and delete a finished month’s clips.'
        ]
      }
    ];

    /* auth-guard fires this once the session is verified + pageWrap is
       revealed. Boot the main app from here so RTDB reads happen with a
       live auth token. Do NOT read RTDB before this fires. */
    window.nlAuthReady = function (userData) {
      window.NL = window.NL || {};
      window.NL.session = userData;
      if (window.TOOL && window.TOOL.boot) {
        window.TOOL.boot(userData);
      } else {
        window._toolDeferredSession = userData;
      }
    };
  </script>

  <!-- NL system scripts (lint canonical: ?v=48 / ?v=1 / ?v=10 / ?v=16) -->
  <script src="/system/nl-utils.js?v=50"></script>
  <!-- GA4, one property for all of nl.tools. Cookieless, so no consent
       banner on any page; page views by path, no identity. Tool events go
       through NL.track(). See system/nl-analytics.js. -->
  <script src="/system/nl-analytics.js?v=1"></script>
  <script src="/system/nl-topbar.js?v=10"></script>
  <script src="/system/auth-guard.js?v=17"></script>
  <script src="/save-of-the-month/_shared.js?v=4"></script>

<style>
  /* #pageWrap default hide is in nl-brand.css; auth-guard reveals with
     style.display = 'block'. Don't clear with '' — would re-trigger the
     brand rule and re-hide the page. */

  .sm-open { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
  .sm-open > div { margin: 0; }
  .sm-state { margin-bottom: 12px; font-size: var(--text-sm); }
  .sm-club { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .sm-play { white-space: nowrap; }
  .sm-sub { display: block; font-size: var(--text-xs); color: var(--text-muted); }
  .sm-player video { display: block; width: 100%; max-height: 62vh; background: var(--navy-900); border-radius: var(--radius); }
  .sm-player__err { margin-top: 10px; }
  .sm-player__meta { margin-top: 12px; font-size: var(--text-sm); }
  .sm-player__ctx { margin-top: 6px; font-size: var(--text-sm); color: var(--text-muted); white-space: pre-wrap; overflow-wrap: anywhere; }
  .sm-player__bar { margin-top: 12px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .sm-player__bar [data-dl] { margin-left: auto; }
  .sm-context { max-width: 320px; font-size: var(--text-sm); white-space: pre-wrap; overflow-wrap: anywhere; }
  .sm-section { margin-top: 24px; }
  /* !important + the extra :hover to outrank .table tr:hover td. */
  tr.is-short td, tr.is-short:hover td { background: var(--amber-light) !important; }
</style>
</head>
<body>

<!-- Topbar — auto-rendered by /system/nl-topbar.js from window.NL_TOOL -->
<div id="nlTopbar"></div>

<div id="pageWrap">
  <div class="page">

    <section class="form-panel">
      <div class="form-panel__head">Collecting</div>
      <div class="form-panel__body">
        <div class="sm-state" id="smState">Loading…</div>
        <div class="sm-open">
          <div class="form-group">
            <label for="smMonthBtn">Month</label>
            <div id="smMonth"></div>
          </div>
          <div class="form-group">
            <label for="smCloses">Closes</label>
            <input id="smCloses" type="date">
          </div>
          <button type="button" class="btn btn--primary" id="smOpenBtn">Open month</button>
          <button type="button" class="btn btn--danger" id="smCloseBtn" hidden>Close now</button>
        </div>
      </div>
    </section>

    <section class="sm-section">
      <div class="section-head"><h2>Nominations</h2></div>
      <div class="toolbar">
        <div class="toolbar__left">
          <div id="smView"></div>
          <div class="chip-group" id="smFilter">
            <button type="button" class="chip active" data-f="all">All</button>
            <button type="button" class="chip" data-f="short">Shortlisted</button>
          </div>
        </div>
        <div class="toolbar__right">
          <button type="button" class="btn btn--ghost btn--sm" id="smCsv">Export CSV</button>
          <button type="button" class="btn btn--danger btn--sm" id="smWipe">Delete clips</button>
        </div>
      </div>
      <div class="stats" id="smStats"></div>
      <div id="smList"></div>
    </section>

  </div>
</div>

<!-- Main app -->
<script>
(function () {
  'use strict';

  var BASE = 'app-data/media-save-of-the-month/';
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return NL.escHtml(s); };
  var S = { config: null, noms: {}, short: {}, view: null, filter: 'all', loaded: 0, touched: false };

  /* Which month to open: up to this one. Usually last month — October's
     saves are collected in November. */
  var openPick = NL.monthPicker($('smMonth'), {
    id: 'smMonthBtn', max: NL.month.key(), value: NL.month.prev(NL.month.key()),
    onChange: function () { S.touched = true; }
  });
  /* Which month's nominations to list: only months that have any, plus the
     open one. */
  var viewPick = NL.monthPicker($('smView'), {
    ariaLabel: 'Month', step: true, months: [], placeholder: 'No months yet',
    onChange: function (k) { S.view = k; render(); }
  });

  function clubName(code) {
    var c = NL.clubs.byCode(code);
    return (c && c.name) || code;
  }

  /* ── the open month ─────────────────────────────────────────────────── */

  function renderState() {
    var c = S.config, open = SOTM.isOpen(c, Date.now());
    if (!c) {
      $('smState').innerHTML = '<span class="pill">Closed</span>';
    } else {
      $('smState').innerHTML = (open
        ? '<span class="pill pill--live">Open</span> '
        : '<span class="pill pill--expired">Past closing date</span> ') +
        '<strong>' + esc(NL.month.label(c.month)) + '</strong>' +
        (c.closesAt ? ' · closes ' + esc(NL.formatDate(c.closesAt)) : ' · no closing date');
    }
    $('smCloseBtn').hidden = !c;
    $('smOpenBtn').textContent = c ? 'Update' : 'Open month';
    if (c && !S.touched) {
      openPick.set(c.month);
      $('smCloses').value = c.closesAt ? SOTM.ymd(new Date(c.closesAt)) : '';
    }
  }

  $('smCloses').addEventListener('input', function () { S.touched = true; });

  $('smOpenBtn').addEventListener('click', function () {
    var month = openPick.get(), closes = $('smCloses').value;
    if (!month) { NL.toast('Pick a month', 'error'); return; }
    var rec = { month: month };
    if (closes) {
      rec.closesAt = SOTM.endOfDay(closes);
      if (rec.closesAt < Date.now()) { NL.toast('That closing date has passed', 'error'); return; }
    }
    var cur = S.config;
    var ask = (cur && cur.month !== month)
      ? NL.confirm('This closes ' + NL.month.label(cur.month) + ' and opens ' + NL.month.label(month) + '.',
          { title: 'Switch month', confirmText: 'Switch' })
      : Promise.resolve(true);
    ask.then(function (ok) {
      if (!ok) return;
      return db.ref(BASE + 'config').set(rec).then(function () {
        S.touched = false;
        NL.toast(NL.month.label(month) + ' is open', 'success');
      });
    }).catch(function (e) { NL.toast('Could not save: ' + (e && e.message), 'error'); });
  });

  $('smCloseBtn').addEventListener('click', function () {
    var cur = S.config;
    if (!cur) return;
    NL.confirm('Clubs can no longer add or change nominations for ' + NL.month.label(cur.month) + '.',
      { title: 'Close nominations', confirmText: 'Close', variant: 'danger' })
      .then(function (ok) {
        if (!ok) return;
        return db.ref(BASE + 'config').remove().then(function () { NL.toast('Closed', 'success'); });
      }).catch(function (e) { NL.toast('Could not close: ' + (e && e.message), 'error'); });
  });

  /* ── the list ────────────────────────────────────────────────────────── */

  /* Months to offer: every month anything was nominated for, plus the open
     one. Defaults to the open month, else the newest. */
  function renderMonths() {
    var keys = Object.keys(S.noms);
    if (S.config && keys.indexOf(S.config.month) < 0) keys.push(S.config.month);
    keys.sort().reverse();
    if (!S.view || keys.indexOf(S.view) < 0) S.view = (S.config && S.config.month) || keys[0] || null;
    viewPick.setRange({ months: keys });
    viewPick.set(S.view);
  }

  function rowsFor(month) {
    var rows = SOTM.flatten(S.noms[month] || {}, S.short[month] || {});
    rows.forEach(function (r) { r.clubName = clubName(r.club); });
    rows.sort(function (a, b) { return a.clubName.localeCompare(b.clubName) || (a.rec.at || 0) - (b.rec.at || 0); });
    return rows;
  }

  function render() {
    if (S.loaded < 3) return;
    renderState();
    renderMonths();
    var all = S.view ? rowsFor(S.view) : [];
    var rows = S.filter === 'short' ? all.filter(function (r) { return r.short; }) : all;
    var clubs = {};
    all.forEach(function (r) { clubs[r.club] = 1; });
    $('smStats').innerHTML =
      '<div class="stat"><div class="stat__num">' + all.length + '</div><div class="stat__label">Nominations</div></div>' +
      '<div class="stat"><div class="stat__num">' + Object.keys(clubs).length + '</div><div class="stat__label">Clubs</div></div>' +
      '<div class="stat"><div class="stat__num">' + all.filter(function (r) { return r.short; }).length + '</div><div class="stat__label">Shortlisted</div></div>';

    var isOpenMonth = S.config && S.config.month === S.view;
    $('smWipe').disabled = isOpenMonth || !all.some(function (r) { return SOTM.clipsOf(r.rec).length; });
    $('smWipe').title = isOpenMonth ? 'Close the month first' : '';
    $('smCsv').disabled = !rows.length;

    if (!rows.length) {
      $('smList').innerHTML = '<div class="empty-state"><div class="empty-state__title">' +
        (S.filter === 'short' && all.length ? 'Nothing shortlisted yet' : 'No nominations') + '</div></div>';
      return;
    }
    $('smList').innerHTML = '<div class="table-wrap"><table class="table">' +
      '<thead><tr><th>Club</th><th>Match</th><th class="ta-right">Min</th><th>Goalkeeper</th><th>Context</th><th>Clips</th><th class="ta-right">Size</th><th></th></tr></thead><tbody>' +
      rows.map(function (r) {
        var n = r.rec, clips = SOTM.clipsOf(n);
        return '<tr' + (r.short ? ' class="is-short"' : '') + '>' +
          '<td><span class="sm-club">' + NL.clubs.crestImgHtml(r.clubName, 'thumb', { className: 'nl-crest' }) + esc(r.clubName) + '</span></td>' +
          '<td>' + esc(n.match) + '<span class="sm-sub">' + esc(n.date ? NL.formatDateShort(n.date) : '') + '</span></td>' +
          '<td class="ta-right">' + esc(n.minute) + '′</td>' +
          '<td>' + esc(n.keeper) + (n.keeperEdited ? '<span class="sm-sub">Changed by the club</span>' : '') + '</td>' +
          '<td><div class="sm-context">' + esc(n.context || '') + '</div></td>' +
          '<td>' + (clips.length
            /* One button: the player walks the rest with ‹ ›. */
            ? '<button type="button" class="btn btn--ghost btn--sm sm-play" data-play="0" data-club="' + esc(r.club) + '" data-nid="' + esc(r.slot) + '">Play' + (clips.length > 1 ? ' (' + clips.length + ')' : '') + '</button>'
            : '<span class="sm-sub">None</span>') + '</td>' +
          '<td class="ta-right">' + (clips.length ? esc(SOTM.mb(clips.reduce(function (t, cl) { return t + (cl.size || 0); }, 0))) : '') + '</td>' +
          '<td><button type="button" class="btn btn--sm ' + (r.short ? 'btn--primary' : 'btn--ghost') + '" data-club="' +
            esc(r.club) + '" data-slot="' + esc(r.slot) + '">' + (r.short ? 'Shortlisted' : 'Shortlist') + '</button></td>' +
        '</tr>';
      }).join('') + '</tbody></table></div>';
    NL.clubs.wireCrestImgs($('smList'));
  }

  $('smList').addEventListener('click', function (e) {
    var p = e.target.closest('button[data-play]');
    if (p) { openPlayer(S.view, p.getAttribute('data-club'), p.getAttribute('data-nid'), +p.getAttribute('data-play')); return; }
    var b = e.target.closest('button[data-slot]');
    if (!b || !S.view) return;
    var club = b.getAttribute('data-club'), slot = b.getAttribute('data-slot');
    var on = !(S.short[S.view] && S.short[S.view][club] && S.short[S.view][club][slot]);
    var ref = db.ref(BASE + 'shortlist/' + S.view + '/' + club + '/' + slot);
    (on ? ref.set(true) : ref.remove()).catch(function (err) {
      NL.toast('Could not save: ' + (err && err.message), 'error');
    });
  });


  $('smFilter').addEventListener('click', function (e) {
    var b = e.target.closest('[data-f]');
    if (!b) return;
    S.filter = b.getAttribute('data-f');
    Array.prototype.forEach.call(this.querySelectorAll('.chip'), function (c) { c.classList.toggle('active', c === b); });
    render();
  });

  $('smCsv').addEventListener('click', function () {
    var rows = rowsFor(S.view).filter(function (r) { return S.filter !== 'short' || r.short; });
    var out = [['Club', 'Match', 'Date', 'Minute', 'Goalkeeper', 'Goalkeeper changed by club', 'Context', 'Clips', 'Shortlisted']];
    rows.forEach(function (r) {
      var n = r.rec;
      out.push([r.clubName, n.match, n.date ? NL.formatDate(n.date) : '', n.minute, n.keeper,
        n.keeperEdited ? 'Yes' : '', n.context || '', SOTM.clipsOf(n).map(function (cl) { return cl.url; }).join(' '), r.short ? 'Yes' : '']);
    });
    NL.download('save-of-the-month-' + S.view + (S.filter === 'short' ? '-shortlist' : '') + '.csv',
      NL.csv(out, { bom: true }), 'text/csv;charset=utf-8');
  });

  /* ── the player ─────────────────────────────────────────────────────
     Plays a clip in the page rather than opening the Storage URL in a new
     tab, with what is needed to judge it alongside: who, which match, the
     minute and keeper, the club's context, and the Shortlist toggle. */
  function isShort(month, club, nid) {
    return !!(S.short[month] && S.short[month][club] && S.short[month][club][nid]);
  }

  function openPlayer(month, club, nid, start) {
    var n = S.noms[month] && S.noms[month][club] && S.noms[month][club][nid];
    var clips = SOTM.clipsOf(n);
    if (!clips.length) return;
    var i = Math.max(0, Math.min(start, clips.length - 1));

    var body = document.createElement('div');
    body.className = 'sm-player';
    body.innerHTML =
      '<video controls autoplay playsinline preload="metadata"></video>' +
      '<div class="banner banner--amber sm-player__err" data-err hidden>This clip will not play in this browser. Download it to watch.</div>' +
      '<div class="sm-player__meta">' +
        '<strong>' + esc(clubName(club)) + '</strong> · ' + esc(n.match) + ' · ' + esc(n.minute) + '′ · ' + esc(n.keeper) +
        (n.keeperEdited ? ' <span class="sm-sub">Changed by the club</span>' : '') +
      '</div>' +
      (n.context ? '<div class="sm-player__ctx">' + esc(n.context) + '</div>' : '') +
      '<div class="sm-player__bar">' +
        (clips.length > 1 ? '<button type="button" class="btn btn--ghost btn--sm" data-step="-1" aria-label="Previous clip">‹</button>' +
          '<span class="sm-sub" data-count></span>' +
          '<button type="button" class="btn btn--ghost btn--sm" data-step="1" aria-label="Next clip">›</button>' : '') +
        '<button type="button" class="btn btn--ghost btn--sm" data-dl>Download</button>' +
      '</div>';
    var video = body.querySelector('video'), err = body.querySelector('[data-err]');

    function show() {
      var cl = clips[i];
      err.hidden = true;
      video.src = cl.url;
      var count = body.querySelector('[data-count]');
      if (count) count.textContent = 'Clip ' + (i + 1) + ' of ' + clips.length;
      Array.prototype.forEach.call(body.querySelectorAll('[data-step]'), function (b) {
        var to = i + +b.getAttribute('data-step');
        b.disabled = to < 0 || to >= clips.length;
      });
    }
    /* A .mov in HEVC, say, which Chrome will not decode. */
    video.addEventListener('error', function () { err.hidden = false; });
    body.addEventListener('click', function (e) {
      var b = e.target.closest('[data-step]');
      if (b && !b.disabled) { i += +b.getAttribute('data-step'); show(); return; }
      /* Fetched, then saved through NL.download: a download attribute is
         ignored on a cross-origin Storage URL, which would just open it.
         The bucket's CORS (system/storage/cors.json) allows GET from nl.tools,
         and a clip already watched comes from the browser cache. */
      var d = e.target.closest('[data-dl]');
      if (!d) return;
      var cl = clips[i];
      d.disabled = true;
      fetch(cl.url).then(function (res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.blob();
      }).then(function (blob) {
        NL.download(cl.name || 'clip', blob);
      }).catch(function (e2) {
        NL.toast('Could not download: ' + (e2 && e2.message), 'error');
      }).then(function () { d.disabled = false; });
    });

    function shortLabel() { return isShort(month, club, nid) ? 'Shortlisted' : 'Shortlist'; }
    var ctrl = NL.modal({
      title: clubName(club) + ' · ' + n.minute + '′',
      width: 'wide',
      body: body,
      buttons: [
        { label: shortLabel(), className: isShort(month, club, nid) ? 'btn--primary' : 'btn--ghost', onClick: function (c) {
          var on = !isShort(month, club, nid);
          var ref = db.ref(BASE + 'shortlist/' + month + '/' + club + '/' + nid);
          (on ? ref.set(true) : ref.remove()).then(function () {
            var btn = c.el.querySelector('.modal__footer button');
            btn.textContent = on ? 'Shortlisted' : 'Shortlist';
            btn.className = 'btn ' + (on ? 'btn--primary' : 'btn--ghost');
          }, function (e2) { NL.toast('Could not save: ' + (e2 && e2.message), 'error'); });
        } },
        { label: 'Close', className: 'btn--ghost', onClick: function (c) { c.close(); } }
      ]
    });
    show();
    return ctrl;
  }

  /* Clips are the only thing here that costs money to keep. The records
     stay (the list still shows what was nominated); the files go. */
  $('smWipe').addEventListener('click', function () {
    var month = S.view;
    /* One entry per clip, carrying where its record lives. */
    var withClip = [];
    rowsFor(month).forEach(function (r) {
      SOTM.clipsOf(r.rec).forEach(function (cl) {
        withClip.push({ path: cl.path, ref: BASE + 'nominations/' + month + '/' + r.club + '/' + r.slot + '/' + (cl.key === 'clip' ? 'clip' : 'clips/' + cl.key) });
      });
    });
    if (!withClip.length) return;
    NL.confirm('Deletes ' + withClip.length + ' clip' + (withClip.length === 1 ? '' : 's') + ' for ' +
      NL.month.label(month) + '. The nominations stay. This cannot be undone.',
      { title: 'Delete clips', confirmText: 'Delete', variant: 'danger' })
      .then(function (ok) {
        if (!ok) return;
        var failed = 0;
        return Promise.all(withClip.map(function (r) {
          return firebase.storage().ref(r.path).delete()
            .catch(function (err) { if (!err || err.code !== 'storage/object-not-found') throw err; })
            .then(function () { return db.ref(r.ref).remove(); })
            .catch(function (err) { failed++; console.error('[save-of-the-month]', err); });
        })).then(function () {
          if (failed) NL.toast(failed + ' clip' + (failed === 1 ? '' : 's') + ' could not be deleted', 'error');
          else NL.toast('Clips deleted', 'success');
        });
      });
  });

  /* ── boot ────────────────────────────────────────────────────────────── */

  window.TOOL = window.TOOL || {};
  window.TOOL.boot = function () {
    NL.ensureAuth().then(function () { return NL.clubs.load(); }).then(function () {
      function listen(path, key) {
        db.ref(BASE + path).on('value', function (snap) {
          S[key] = snap.val() || (key === 'config' ? null : {});
          if (!S['_' + key]) { S['_' + key] = 1; S.loaded++; }
          render();
        }, function (err) {
          console.error('[save-of-the-month]', path, err);
          $('smList').innerHTML = '<div class="banner banner--error">Could not load ' + esc(path) + '. Reload to try again.</div>';
        });
      }
      listen('config', 'config');
      listen('nominations', 'noms');
      listen('shortlist', 'short');
    }).catch(function (e) {
      console.error('[save-of-the-month]', e);
      $('smList').innerHTML = '<div class="banner banner--error">Could not load. Reload to try again.</div>';
    });
  };

  if (window._toolDeferredSession) {
    window.TOOL.boot(window._toolDeferredSession);
    delete window._toolDeferredSession;
  }
})();
</script>

</body>
</html>
