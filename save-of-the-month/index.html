<!DOCTYPE html>
<!--
  NL Tools — Save of the Month (club page)
  Version: v18.0 (21/10/2026)
  File: /save-of-the-month/index.html

  CHANGELOG
    v18.0 (21/10/2026) — Clips upload with a year-long, immutable cache
      header, so a clip watched twice in one browser downloads once.
    v16.0 (21/10/2026) — The partnership is named, not worn: the gate keeps
      the National League rose and is titled "Utility Warehouse Save of the
      Month"; the header bar is back to the club's crest under the same
      name; no UW wordmark. One "Nominate a save" for the page (in the
      Your matches heading); each match card is itself the shortcut, so
      the cards lose their buttons. Cards stack crest over name, at most
      three abreast, so club names wrap instead of truncating. How it works
      is always shown (no disclosure) and asks for clips — club or
      broadcast — to help the shortlist; the form says the same. The hero
      kicker is just the month: the header already names the competition.
      The form sits on .form-grid, which owns the spacing between fields
      (labels were jammed under the field above); Minute and Goalkeeper
      share a row on wider screens. Context is marked optional, with
      examples as its placeholder. Canon pass: hero title is the page's
      <h1> on .text-display, labels on .text-label, tokened transition,
      paired font-weight, NL.formatTime, fuller card aria-label, labelled
      keeper text box. Clips may be up to 250MB (was 100MB):
      a phone's 1080p runs ~100–130MB a minute.
    v14.0 (21/10/2026) — A bold "Nominations are open until 23:59 on …"
      header; the club's played league matches that month as cards (crests,
      score, Nominate a save); no cap on nominations (push keys, not five
      slots); several clips per nomination, with a nudge towards the club's
      own footage; Minute (approx.). The goalkeeper is a dropdown of every
      keeper who played, set to whoever was in goal at the minute, with
      "Someone else" for a typed name (straight to a text box when the team
      sheet has none). A refused save now says "closed" only if the month
      really is closed — v12.0 reported every refusal that way.
    v12.0 (21/10/2026) — Utility Warehouse branding: the UW wordmark on the
      code gate (NL.codeGate `lockup`) and in the header bar
      (.nl-idbar__lockup) in place of the crest; the club's name stays on
      the sub-line. A "How it works" disclosure above the nominations, open
      until the club has nominated, then folded.
    v8.0 (19/10/2026) — Canon pass: the code gate mounts in a plain div
      (NL.codeGate renders its own .gate), plain btn--danger, the form has
      no close X mid-upload, clip hint trimmed.
    v4.0 (19/10/2026) — First build. A club enters its access code and, while
      the League has a month open, nominates up to five saves by its own
      goalkeeper: a league match from that month (National League, North or
      South, never a cup), the minute, the keeper (filled from the lineup,
      changeable), optional context and an optional video clip up to 100MB.
      Nominations can be edited or removed until the month closes. Version
      is the session's turn number.

  THE GATE. The one club access code (system/club-code-plan.md), checked
  server-side by NL.codeGate.viaFunction, which mints a token carrying
  `club: '<CODE>'`. The RTDB rules on app-data/media-save-of-the-month open,
  to that claim:
    · config                               read (which month is open)
    · nominations/<YYYY-MM>/<CODE>         read; write any push key while
                                           that month is open and before
                                           its closing date (server clock)
  Storage: save-of-the-month/<CODE>/<YYYY-MM>/..., video under 250MB.
  The League's shortlist is not readable here, by rule.

  MATCHES AND KEEPERS come from NLS, browser-direct (CORS is open). One list
  call for the club's month, one detail call when a match is picked. The
  parsing lives in _shared.js (SOTM.leagueMatches, SOTM.keeperAt), tested.

  No auth-guard: that gates NL accounts, and this page is entered by code.
-->

  <style>
    .sm-nom {
      display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center;
      padding: 12px 0; border-top: 1px solid var(--border);
    }
    .sm-nom:first-child { border-top: none; }
    .sm-nom strong { display: block; font-size: var(--text-sm); }
    .sm-nom__meta { font-size: var(--text-xs); color: var(--text-muted); }
    .sm-nom__acts { display: flex; gap: 6px; }
    .sm-how { margin-bottom: 24px; }
    .sm-how ol { margin: 0; padding-left: 20px; font-size: var(--text-sm); line-height: 1.6; }
    /* The open-window statement: the first thing a press officer reads. */
    .sm-hero {
      background: var(--navy); color: var(--white);
      border-radius: var(--radius); border-bottom: 4px solid var(--primary);

    .sm-hero__kicker { color: var(--navy-100); }

    .sm-hero__until { font-size: var(--text-lg); font-weight: 700; font-variation-settings: 'wght' 700; }
    /* One card per played league match: crest over name, score between.
       At most three abreast, so a long club name wraps instead of being

    .sm-matches { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-bottom: 24px; }

    #smKeeper:not([hidden]) { margin-top: 8px; }
    #smKeeperSel[hidden] + #smKeeper { margin-top: 0; }

<body>
  <!-- White bar: no NL account is behind this page (nl-brand v2.51). -->
  <header class="nl-idbar">
    <img class="nl-idbar__crest" id="smCrest" src="/assets/crests/National%20League%20rose.png" alt="" width="42" height="42">
    <div class="nl-idbar__id">
      <div class="nl-idbar__title">Utility Warehouse Save of the Month</div>
      <div class="nl-idbar__sub" id="smClub">The National League</div>
    </div>
    <div class="nl-idbar__actions">
      <button class="nl-idbar__btn" id="smOut" type="button" hidden>Sign out</button>
    </div>
  </header>

  <div id="smGate"></div>

  <main class="page" id="smShell" hidden>
    <div id="smBody"></div>
  </main>

<script>
(function () {
  'use strict';

  var BASE = 'app-data/media-save-of-the-month/';
  /* CANON CANDIDATE (19/10/2026): the NLS base URL is hand-written in six
     gated pages (dazn/admin, travel-planner, content-plan, fan-widgets,
     brand-exposure, this); NL.endpoints.nls is the obvious home. */
  var NLS = 'https://multi-club-matches.football.web.gc.nationalleagueservices.co.uk/v2';
  var db = firebase.database();
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return NL.escHtml(s); };
  var S = { code: null, teamID: null, config: null, mine: {}, matches: null, matchesFor: null, matchesError: false, details: {} };

  function message(title, html) {
    $('smBody').innerHTML = '<div class="empty-state"><div class="empty-state__title">' + esc(title) + '</div>' +
      (html ? '<div class="empty-state__text">' + html + '</div>' : '') + '</div>';
  }

  /* ── NLS ─────────────────────────────────────────────────────────────── */

  /* The club's played league matches in the month. An empty window is a
     404 from NLS, not an empty list. */
  function loadMatches(month) {
    if (S.matchesFor === month && S.matches) return Promise.resolve(S.matches);
    var r = SOTM.monthRange(month);
    var url = NLS + '/matches/?teamID=' + encodeURIComponent(S.teamID) +
      '&from=' + encodeURIComponent(r.from) + '&to=' + encodeURIComponent(r.to) + '&page.size=100';
    return fetch(url).then(function (res) {
      if (res.status === 404) return { data: [] };
      if (!res.ok) throw new Error('NLS ' + res.status);
      return res.json();
    }).then(function (j) {
      S.matches = SOTM.leagueMatches(j.data);
      S.matchesFor = month;
      return S.matches;
    });
  }

  /* This club's matchTeams[] entry from the match detail, or null. */
  function loadTeam(matchId) {
    if (S.details[matchId] !== undefined) return Promise.resolve(S.details[matchId]);
    return fetch(NLS + '/matches/' + encodeURIComponent(matchId)).then(function (res) {
      if (!res.ok) return null;
      return res.json().then(function (j) {
        var teams = (j && j.data && j.data.attributes && j.data.attributes.matchTeams) || [];
        return teams.filter(function (t) { return t.teamID === S.teamID; })[0] || null;
      });
    }).catch(function () { return null; }).then(function (t) { S.details[matchId] = t; return t; });
  }

  /* ── the page ────────────────────────────────────────────────────────── */

  /* Match order, then minute — stable when a nomination is edited. */
  function byAt(a, b) {
    var x = S.mine[a], y = S.mine[b];
    return String(x.date).localeCompare(String(y.date)) || (x.minute - y.minute);
  }

  /* "until 23:59 on Monday 10 November 2026" — the closing moment as the
     rules see it (endOfDay), in the words a press officer reads. */
  function untilText(ms) {
    /* CANON CANDIDATE (21/10/2026): a long weekday ("Monday 10 November
       2026") is hand-built here and in content-plan; NL.formatDate(x,
       {weekday:true}) is its home. */
    return 'until ' + NL.formatTime(ms) + ' on ' +
      new Date(ms).toLocaleDateString('en-GB', { weekday: 'long' }) + ' ' + NL.formatDate(ms);
  }

  function clubNameFor(team) {
    var c = team && team.id && NL.clubs.byOpta(team.id);
    return (c && c.name) || (team && team.name) || '';
  }

  /* The whole card is the shortcut into the form for that match: one
     "Nominate a save" per page, not one per card. */
  function matchCard(m, count) {
    var h = clubNameFor(m.home), w = clubNameFor(m.away);
    var name = 'Nominate a save from ' + h + ' ' + m.home.score + '–' + m.away.score + ' ' + w + ', ' +
      NL.formatDateShort(m.date) + (count ? ', ' + count + ' nominated' : '');
    return '<button type="button" class="sm-match" data-new="' + esc(m.id) + '" aria-label="' + esc(name) + '">' +
      '<span class="text-label">' + esc(NL.formatDateShort(m.date)) + '</span>' +
      '<span class="sm-match__teams">' +
        '<span class="sm-match__team">' + NL.clubs.crestImgHtml(h, 'thumb', { className: 'nl-crest' }) + '<span>' + esc(h) + '</span></span>' +
        '<span class="sm-match__score">' + esc(m.home.score) + '–' + esc(m.away.score) + '</span>' +
        '<span class="sm-match__team">' + NL.clubs.crestImgHtml(w, 'thumb', { className: 'nl-crest' }) + '<span>' + esc(w) + '</span></span>' +
      '</span>' +
      (count ? '<span class="sm-match__foot text-label">' + count + ' nominated</span>' : '') +
    '</button>';
  }

  function render() {
    var c = S.config;
    if (!SOTM.isOpen(c, Date.now())) {
      message('Nominations are closed', 'The League will open the next month here.');
      return;
    }
    var month = NL.month.label(c.month);
    var nids = Object.keys(S.mine).sort(byAt);
    var perMatch = {};
    nids.forEach(function (k) { perMatch[S.mine[k].matchId] = (perMatch[S.mine[k].matchId] || 0) + 1; });

    var matches;
    if (S.matchesFor !== c.month) matches = '<div class="form-hint">Loading your matches…</div>';
    else if (S.matchesError) matches = '<div class="banner banner--error">Could not load your matches. Reload to try again.</div>';
    else if (!S.matches.length) matches = '<div class="form-hint">No league matches played in ' + esc(month) + ' yet.</div>';
    else matches = '<div class="sm-matches">' + S.matches.map(function (m) { return matchCard(m, perMatch[m.id]); }).join('') + '</div>';

    var list = nids.map(function (k) {
      var n = S.mine[k], clips = SOTM.clipsOf(n).length;
      return '<div class="sm-nom">' +
        '<div><strong>' + esc(n.match) + '</strong>' +
          '<span class="sm-nom__meta">' + esc(n.minute) + '′ (approx.) · ' + esc(n.keeper) +
          (clips ? ' · ' + clips + (clips === 1 ? ' clip' : ' clips') : '') + '</span></div>' +
        '<div class="sm-nom__acts">' +
          '<button type="button" class="btn btn--ghost btn--sm" data-edit="' + esc(k) + '">Edit</button>' +
          '<button type="button" class="btn btn--danger btn--sm" data-drop="' + esc(k) + '">Remove</button>' +
        '</div></div>';
    }).join('');

    $('smBody').innerHTML =
      '<section class="sm-hero">' +
        '<div class="sm-hero__kicker text-label">' + esc(month) + '</div>' +
        '<h1 class="sm-hero__title text-display">Nominations are open</h1>' +
        (c.closesAt ? '<div class="sm-hero__until">' + esc(untilText(c.closesAt)) + '</div>' : '') +
      '</section>' +
      howItWorks() +
      '<div class="section-head"><h2>Your matches</h2>' +
        (S.matches && S.matches.length && S.matchesFor === c.month ? '<button type="button" class="btn btn--primary" data-new="">Nominate a save</button>' : '') +
      '</div>' + matches +
      (nids.length ? '<div class="section-head"><h2>Your nominations</h2></div>' +
        '<section class="form-panel"><div class="form-panel__body">' + list + '</div></section>' : '');
    NL.clubs.wireCrestImgs($('smBody'));
  }

  function howItWorks() {
    return '<div class="section-head"><h2>How it works</h2></div>' +
      '<section class="form-panel sm-how"><div class="form-panel__body"><ol>' +
        '<li>Choose the match and roughly when the save happened.</li>' +
        '<li>Check the goalkeeper. We pick whoever was in goal at that minute; change it if it’s wrong.</li>' +
        '<li>Upload one or more clips of the save to help us shortlist. Club-recorded and broadcast footage are both welcome.</li>' +
      '</ol></div></section>';
  }

  $('smBody').addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    if (b.hasAttribute('data-new')) openForm(null, b.getAttribute('data-new') || null);
    else if (b.hasAttribute('data-edit')) openForm(b.getAttribute('data-edit'));
    else if (b.hasAttribute('data-drop')) drop(b.getAttribute('data-drop'));
  });

  function drop(nid) {
    var n = S.mine[nid];
    if (!n) return;
    NL.confirm('Remove the nomination for ' + n.match + ', ' + n.minute + '′?',
      { title: 'Remove nomination', confirmText: 'Remove', variant: 'danger' })
      .then(function (ok) {
        if (!ok) return;
        return db.ref(nomPath(nid)).remove().then(function () {
          SOTM.clipsOf(n).forEach(function (cl) { deleteClip(cl.path); });
          NL.toast('Removed', 'success');
        });
      }).catch(function (err) { saveFailed(err, 'Could not remove'); });
  }

  function nomPath(nid) { return BASE + 'nominations/' + S.config.month + '/' + S.code + '/' + nid; }

  function deleteClip(path) {
    return firebase.storage().ref(path).delete().catch(function (err) { console.warn('[save-of-the-month]', err); });
  }

  /* A refused write is "closed" only if the month really is closed. Anything
     else is a fault to report, not a deadline: v12.0 called every refusal
     "closed", which is how a broken save looked like a shut window. */
  function saveFailed(err, what) {
    console.error('[save-of-the-month]', what, err);
    if (!(err && /permission/i.test(String(err.code || err.message || '')))) {
      NL.toast(what + ': ' + ((err && err.message) || err), 'error');
      return;
    }
    db.ref(BASE + 'config').once('value').then(function (snap) {
      NL.toast(SOTM.isOpen(snap.val(), Date.now())
        ? what + '. Please tell the League (permission refused).'
        : 'Nominations for ' + NL.month.label(S.config.month) + ' have closed', 'error');
    }, function () { NL.toast(what + '. Please tell the League.', 'error'); });
  }

  /* ── the form ────────────────────────────────────────────────────────── */

  var OTHER = '__other';

  function openForm(nid, presetMatch) {
    var month = S.config.month;
    var prev = (nid && S.mine[nid]) || null;
    if (!nid) nid = db.ref(BASE + 'nominations').push().key;
    var kept = SOTM.clipsOf(prev);   /* existing clips still attached */
    var dropped = [];                /* existing clips the user removed */
    var auto = null;                 /* the keeper the team sheet gave, if any */
    var picked = !!(prev && prev.keeperEdited);

    var body = document.createElement('div');
    /* .form-grid owns the spacing between fields (.form-group sets none). */
    body.className = 'form-grid';
    body.innerHTML =
      '<div class="form-group span2"><label for="smMatch">Match<span class="req">*</span></label>' +
        '<select id="smMatch" disabled><option value="">Loading matches…</option></select></div>' +
      '<div class="form-group"><label for="smMin">Minute (approx.)<span class="req">*</span></label>' +
        '<input id="smMin" type="number" inputmode="numeric" min="1" max="130" value="' + esc(prev ? prev.minute : '') + '"></div>' +
      '<div class="form-group"><label for="smKeeperSel">Goalkeeper<span class="req">*</span></label>' +
        '<select id="smKeeperSel" hidden></select>' +
        '<input id="smKeeper" maxlength="80" autocomplete="off" placeholder="Goalkeeper’s name" aria-label="Goalkeeper’s name" value="' + esc(prev ? prev.keeper : '') + '">' +
        '<div class="form-hint" id="smKeeperHint"></div></div>' +
      '<div class="form-group span2"><label for="smCtx">Context (optional)</label>' +
        '<textarea id="smCtx" maxlength="1000" placeholder="e.g. 93rd-minute stop to rescue a point; the save that won the derby">' + esc(prev && prev.context || '') + '</textarea></div>' +
      '<div class="form-group span2"><label for="smFile">Clips</label>' +
        '<div id="smKept"></div>' +
        '<input id="smFile" type="file" accept="video/*" multiple>' +
        '<div class="form-hint">One or more clips of the save help us shortlist: club-recorded or broadcast. Video, up to 250MB each.</div></div>';

    var sel = body.querySelector('#smMatch'), min = body.querySelector('#smMin');
    var ksel = body.querySelector('#smKeeperSel'), kin = body.querySelector('#smKeeper');
    var khint = body.querySelector('#smKeeperHint');

    function drawKept() {
      body.querySelector('#smKept').innerHTML = kept.map(function (cl, i) {
        return '<div class="sm-clip"><a href="' + esc(cl.url) + '" target="_blank" rel="noopener">' + esc(cl.name) + '</a>' +
          '<button type="button" class="btn btn--ghost btn--sm" data-unclip="' + i + '">Remove</button></div>';
      }).join('');
    }
    drawKept();
    body.addEventListener('click', function (e) {
      var b = e.target.closest('[data-unclip]');
      if (b) { dropped.push(kept.splice(+b.getAttribute('data-unclip'), 1)[0]); drawKept(); }
    });

    /* The keeper: a dropdown of every goalkeeper who played, set to whoever
       was in goal at the minute; "Someone else" opens a text box. No keeper
       on the team sheet at all: just the text box. A choice the club made
       is never overwritten by a later minute change. */
    function showOther(on) { kin.hidden = !on; if (on && !kin.value) kin.focus(); }
    ksel.addEventListener('change', function () {
      picked = true;
      showOther(ksel.value === OTHER);
      khint.textContent = '';
    });
    kin.addEventListener('input', function () { picked = true; });

    function resolveKeeper() {
      var id = sel.value, m = parseInt(min.value, 10);
      if (!id) return;
      loadTeam(id).then(function (team) {
        if (sel.value !== id) return;
        var keepers = SOTM.keepersInMatch(team);
        var k = m >= 1 ? SOTM.keeperAt(team, m) : null;
        auto = k && k.name ? k : null;
        if (!keepers.length) {
          ksel.hidden = true; showOther(true);
          khint.textContent = 'No goalkeeper on the team sheet. Type the name.';
          return;
        }
        var current = picked ? (ksel.value || (prev && prev.keeper)) : null;
        ksel.innerHTML = (auto ? '' : '<option value="">Choose the goalkeeper</option>') +
          keepers.map(function (g) { return '<option value="' + esc(g.id) + '">' + esc(g.name) + '</option>'; }).join('') +
          '<option value="' + OTHER + '">Someone else…</option>';
        ksel.hidden = false;
        var byName = keepers.filter(function (g) { return g.name === (prev && prev.keeper); })[0];
        if (picked && current) {
          /* Keep the club's own choice: an id still in the list, a name
             matching one, or their typed name under "Someone else". */
          var keepId = keepers.some(function (g) { return g.id === current; }) ? current : (byName ? byName.id : OTHER);
          ksel.value = keepId;
        } else {
          ksel.value = auto ? auto.id : '';
        }
        showOther(ksel.value === OTHER);
        khint.textContent = picked ? '' : auto
          ? 'In goal at that minute, from the team sheet.'
          : keepers.length > 1 ? 'More than one goalkeeper played. Choose who made the save.' : '';
      });
    }
    sel.addEventListener('change', resolveKeeper);
    min.addEventListener('change', resolveKeeper);
    showOther(true);

    loadMatches(month).then(function (ms) {
      if (!ms.length) {
        sel.innerHTML = '<option value="">No league matches played in ' + esc(NL.month.label(month)) + '</option>';
        return;
      }
      var want = (prev && prev.matchId) || presetMatch;
      sel.innerHTML = '<option value="">Choose a match</option>' + ms.map(function (m) {
        return '<option value="' + esc(m.id) + '"' + (want === m.id ? ' selected' : '') + '>' +
          esc(NL.formatDateShort(m.date) + ' · ' + m.label) + '</option>';
      }).join('');
      sel.disabled = false;
      if (sel.value) resolveKeeper();
    }).catch(function (err) {
      console.error('[save-of-the-month]', err);
      sel.innerHTML = '<option value="">Could not load matches. Close and try again.</option>';
    });

    NL.modal({
      title: prev ? 'Edit nomination' : 'Nominate a save',
      body: body,
      dismissable: false,
      closeButton: false,
      buttons: [
        { label: 'Cancel', className: 'btn--ghost', onClick: function (c) { c.close(); } },
        { label: prev ? 'Save' : 'Nominate', className: 'btn--primary', onClick: function (c) { send(c); } }
      ]
    });

    function keeperValue() {
      if (!ksel.hidden && ksel.value && ksel.value !== OTHER) return ksel.options[ksel.selectedIndex].text;
      return kin.hidden ? '' : kin.value.trim();
    }

    function send(c) {
      var match = S.matches && S.matches.filter(function (m) { return m.id === sel.value; })[0];
      var minute = parseInt(min.value, 10);
      var keeper = keeperValue();
      var context = body.querySelector('#smCtx').value.trim();
      var files = Array.prototype.slice.call(body.querySelector('#smFile').files || []);
      if (!match) { NL.toast('Choose a match', 'error'); return; }
      if (!(minute >= 1 && minute <= 130)) { NL.toast('Enter the minute, 1 to 130', 'error'); return; }
      if (!keeper) { NL.toast('Choose the goalkeeper', 'error'); return; }
      for (var i = 0; i < files.length; i++) {
        if (!SOTM.clipType(files[i].name, files[i].type)) { NL.toast(files[i].name + ' is not a video', 'error'); return; }
        if (files[i].size >= SOTM.MAX_CLIP_BYTES) { NL.toast(files[i].name + ' is over 250MB', 'error'); return; }
      }

      var btns = c.el.querySelectorAll('.modal__footer button');
      Array.prototype.forEach.call(btns, function (b) { b.disabled = true; });
      var go = btns[btns.length - 1], go0 = go.textContent;

      /* One at a time, so the button can say which clip is going up.
         CANON CANDIDATE (19/10/2026): a club page uploading into its own
         Storage folder with progress and a named refusal. This is the third
         (Programme Packs, Commercial Compliance), which is the count the
         Compliance flag set for promotion. */
      var uploaded = [];
      function upload(i) {
        if (i >= files.length) return Promise.resolve();
        var f = files[i], type = SOTM.clipType(f.name, f.type);
        var path = 'save-of-the-month/' + S.code + '/' + month + '/' + Date.now().toString(36) + i + '-' + SOTM.safeName(f.name);
        var ref = firebase.storage().ref(path);
        return new Promise(function (resolve, reject) {
          /* Every clip path is unique (timestamped), so the file never
             changes: let the browser keep it, and a re-watch while
             shortlisting is not a second download. */
          var task = ref.put(f, { contentType: type, cacheControl: 'private, max-age=31536000, immutable' });
          task.on('state_changed', function (snap) {
            var pct = snap.totalBytes ? Math.floor(100 * snap.bytesTransferred / snap.totalBytes) : 0;
            go.textContent = (files.length > 1 ? 'Clip ' + (i + 1) + ' of ' + files.length + ' · ' : 'Uploading ') + pct + '%';
          }, function (err) {
            reject(new Error(err && err.code === 'storage/unauthorized'
              ? f.name + ' was refused (video only, under 250MB)'
              : 'Upload failed: ' + ((err && err.message) || err)));
          }, function () {
            ref.getDownloadURL().then(function (url) {
              uploaded.push({ path: path, url: url, name: f.name.slice(0, 160), size: f.size, type: type.slice(0, 100) });
              resolve(upload(i + 1));
            }, reject);
          });
        });
      }

      upload(0).then(function () {
        go.textContent = 'Saving…';
        var rec = {
          matchId: match.id, match: match.label, date: match.date, minute: minute, keeper: keeper,
          at: firebase.database.ServerValue.TIMESTAMP
        };
        if (!auto || keeper !== auto.name) rec.keeperEdited = true;
        if (context) rec.context = context;
        var clips = {};
        kept.concat(uploaded).forEach(function (cl, j) {
          clips['c' + (j < 10 ? '0' : '') + j] = { path: cl.path, url: cl.url, name: cl.name, size: cl.size || 0, type: cl.type || 'video/mp4' };
        });
        if (Object.keys(clips).length) rec.clips = clips;
        return db.ref(nomPath(nid)).set(rec);
      }).then(function () {
        /* Files go once the record no longer points at them. */
        dropped.forEach(function (cl) { deleteClip(cl.path); });
        c.close();
        NL.toast(prev ? 'Saved' : 'Nominated', 'success');
      }).catch(function (err) {
        uploaded.forEach(function (cl) { deleteClip(cl.path); });   /* nothing points at them */
        Array.prototype.forEach.call(btns, function (b) { b.disabled = false; });
        go.textContent = go0;
        saveFailed(err, 'Could not save');
      });
    }
  }

  /* ── sign-in ─────────────────────────────────────────────────────────── */

  var mineRef = null;
  function watchMine() {
    if (mineRef) mineRef.off();
    S.mine = {};
    if (!S.config) { render(); return; }
    mineRef = db.ref(BASE + 'nominations/' + S.config.month + '/' + S.code);
    mineRef.on('value', function (snap) { S.mine = snap.val() || {}; render(); }, function (e) {
      console.error('[save-of-the-month]', e);
      message('Could not load your nominations', 'Reload the page to try again.');
    });
  }

  function start(session) {
    $('smGate').hidden = true;
    $('smShell').hidden = false;
    $('smOut').hidden = false;

    var code = session && session.role;
    if (!code || code === '*' || code === 'NL') {
      message('This page is for clubs',
        'League staff: nominations are on <a href="/save-of-the-month/admin/">the console</a>.');
      return;
    }
    S.code = code;
    message('Loading…');

    NL.clubs.load().then(function () {
      var me = NL.clubs.byCode(code);
      var name = (me && me.name) || (session && session.name) || code;
      S.teamID = me && me.optaID;
      $('smClub').textContent = name;
      var crest = $('smCrest');
      crest.src = NL.clubs.crestUrl(name, 'thumb');
      NL.clubs.wireCrestImg(crest, name);
      if (!S.teamID) { message('Your club is not set up for this yet', 'Contact the League.'); return; }
      /* Live: the League opening or closing a month shows without a reload. */
      db.ref(BASE + 'config').on('value', function (snap) {
        var next = snap.val();
        var changed = !S.config || !next || next.month !== S.config.month;
        S.config = next;
        if (changed) watchMine(); else render();
        /* The match cards: this club's played league matches that month. */
        if (next && SOTM.isOpen(next, Date.now()) && S.matchesFor !== next.month) {
          S.matchesError = false;
          loadMatches(next.month).then(render, function (err) {
            console.error('[save-of-the-month]', err);
            S.matchesFor = next.month; S.matchesError = true; render();
          });
        }
      }, function (e) {
        console.error('[save-of-the-month]', e);
        message('Could not load', 'Reload the page to try again.');
      });
    }).catch(function (e) {
      console.error('[save-of-the-month]', e);
      message('Could not load', 'Reload the page to try again.');
    });
  }

  $('smOut').addEventListener('click', function () {
    NL.codeGate.signOut().then(function () { location.reload(); });
  });

  NL.codeGate.ensure({
    mount: $('smGate'),
    title: 'Utility Warehouse Save of the Month',
    sub: 'Enter your access code.',
    numeric: false,
    verify: NL.codeGate.viaFunction('app-data/club-codes', { tool: 'save-of-the-month' }),
    claim: 'club'
  }).then(start);
})();
</script>
</body>
</html>
