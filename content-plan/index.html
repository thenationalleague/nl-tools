<!DOCTYPE html>
<!--
  NL Tools — Content Plan
  Version: v3.6 (28/10/2026)
  File: /content-plan/index.html

  Plans and records everything the media team publishes: website stories,
  social-first posts, club obligations and (later) CRM. Replaces the
  "Content plan" Google Sheet.

  Storage (RTDB):
    app-data/media-content-plan/items/{id}      one record per planned/published item
                                                 (indexed on date; queried by visible range)
    app-data/media-content-plan/days/{date}     notes + manualMatches {faCup, faTrophy}
    app-data/media-content-plan/cupFixtures/{key}  FA Cup / FA Trophy fixtures pasted from a
                                                 spreadsheet: date, time, round, comp
                                                 (facup | fatrophy), home, away. Key =
                                                 comp_round_home_v_away, so a re-paste updates.
    app-data/media-content-plan/ideas/{id}      undated ideas: title, notes, kind, category,
                                                 addedBy/addedByName, archived. Scheduling one
                                                 creates an item and deletes the idea.
    app-data/media-content-plan/config/         categories {key: {label, colour (#hex) | token, order}}, authors
                                                 (kinds, platforms and statuses are fixed in code below)

  Kind: one label per item — Web article, Social video, Social graphic, Email
  (CRM). Club obligation is a flag on any kind (item.clubObligation); the
  older lane 'club' reads as a web article with the flag. Where it goes
  (website + social platforms) is separate: item.platforms.
  Stored as lane (web | social | club | crm) + format (vid | gfx | ad | otd)
  so the sheet's AD / OTD detail survives; the UI only shows the kind.
    tools/media-content-plan                    tool registration (label, defaults)

  Access (auth-guard → session.toolLevel):
    admin  → add, edit, drag, mark published, settings
    access → read-only calendar and list
    superadmin also gets Settings → Import (one-off load of the sheet export).
  Rules mirror this in system/rtdb/rules.snapshot.json.

  Match counts: National / North / South / NL Cup are counted from the NLS
  feed per season and held in memory only. FA Cup and FA Trophy are not in
  that feed, so they are typed per day (days/{date}/manualMatches).

  Technical changelog
    v1.0 (16/10/2026) – First build (phase 1 of the content-plan spec v1.1).
                        Calendar (month + week), list view with
                        inline and bulk edit, filters, add/edit/delete, drag and
                        drop, mark published, settings for categories and
                        authors, superadmin JSON import, NLS match counts.
                        No campaign highlight and no per-platform tracking, by
                        decision (16/10/2026): kind says enough.
    v1.1 (16/10/2026) – Week view is an hourly timeline (06:00–23:00) instead of
                        five slots: dropping on an hour sets HH:00, an item already
                        in that hour keeps its minutes. Empty hours hide until a
                        drag starts. Time inputs step in 5 minutes.
                        Social items without a category get their own colour group
                        (--cp-social, slate); category is optional for social and
                        the add form no longer carries a remembered web category onto them.
    v1.2 (16/10/2026) – No strikethrough: published = faded + green tick (the tick
                        toggles for editors). Summary line keeps only counts that
                        ask for action; per-author tallies wait for Reports.
                        Ideas tab: undated ideas with Schedule / Edit / Archive.
    v1.3 (16/10/2026) – Chip carries one signal per thing: category = colour,
                        kind = glyph (sprite v1.3: article, play, image, shield,
                        email), published = green tick at full colour (no fade,
                        no strike). Planned items show the tick on hover for
                        editors. Initials only. Routine/original is recorded in
                        the item only: no star, no fade, no type filters. Needs
                        review removed from the UI; saving an item clears the
                        flag the importer set.
    v1.4 (16/10/2026) – Platforms back: platforms {x, facebook, instagram,
                        tiktok, linkedin, youtube} as booleans. Grey logo row on the
                        chip (sprite's filled brand marks), icon toggles in the add
                        form / editor / list, a platform filter and a "Posted on"
                        CSV column. New items default to X + Facebook, then the
                        last-used set per user. Sheet imports carry none.
    v1.5 (16/10/2026) – The website is a platform, not a kind: kind = what it is
                        (Article, Video, Graphic, Club, CRM; key 'web' kept for
                        Article so no data moves), platforms gain 'website'
                        (sprite icon-website). Defaults follow the kind: Article →
                        Website, social → X + Facebook; each user's last set is
                        remembered per kind. Match counts are pills in the
                        division colours (--div-*); FA Cup / Trophy pills are
                        outlined because they are typed in, not fed.
    v1.6 (16/10/2026) – Cup fixtures: paste FA Cup / FA Trophy rows from a spreadsheet
                        (date & time, round, competition, home, blank, away), with a
                        preview that says new / moved / unchanged / skipped and why.
                        Saved fixtures can be edited or deleted one by one. FAC / FAT
                        pills count them per day; the day window lists the ties.
                        Typed-in counts from the sheet import still show where a
                        day has no pasted fixtures. Day window loses its count boxes.
    v1.7 (16/10/2026) – Three-letter competition codes everywhere: NAT, NOR,
                        SOU, NLC, FAC, FAT. The paste also accepts FAC / FAT as the
                        competition.
    v1.8 (16/10/2026) – Colour groups revised: NL Cup joins Football (the
                        Cups group goes; a stored 'cups' reads as football). League
                        and Statements split. Two solid groups with white ink:
                        Statements (--navy) and 3UP (--navy-900, effectively black).
                        Trust is yellow (--yellow / --yellow-light, amber ink for
                        contrast); U19 keeps the red as "Youth". Chip and idea text
                        take --g-fg / --g-muted / --g-ink so solid groups invert.
    v1.9 (16/10/2026) – Match pills recoloured to the team's spreadsheet, in pastels:
                        NAT orange, NOR yellow, SOU blue, NLC purple, FAC pink-red,
                        FAT grey. The --div-* division tokens no longer apply here.
    v2.0 (16/10/2026) – Categories are the tool's own list, not the CMS's:
                        Football, Awards, League, Statements, Trust, U19, 3UP, each
                        with its own colour. Admins add, rename, recolour (colour
                        picker) and remove them in Settings. Any item, any kind, can
                        take any category. Every categorised item is a solid fill;
                        ink flips white/dark by the fill's luminance. Items store the
                        category KEY; older values (labels, and the sheet's National /
                        North / South / NL Cup) resolve to Football. Colour groups and
                        the colour filter are gone: the category is the colour.
    v2.1 (16/10/2026) – Cup fixtures move into Settings as a tab (paste at the top,
                        saved fixtures below) and off the calendar toolbar.
    v2.2 (16/10/2026) – Canon review (tidy-tim) fixes: pills at --text-xs (12px floor);
                        inputs keep the 16px phone floor (no !important); FAT pill ink
                        --text-muted (not --proj-8); chip is a plain container with an
                        inner <button> to open it, so the tick button is no longer
                        nested in a role=button; .toolbar / .filter-bar / .form-hint /
                        .btn--icon replace local look-alikes; selects inside .form-group
                        drop .nl-select; on-screen dates via NL.formatDateShort and
                        NL.parseDate; ink picked by contrast against --text and
                        --white; sortable headers hold a button; Settings tabs carry
                        tablist / tab / aria-selected; icons on the 16px ladder; no
                        invisible spinner; waffle trimmed; changelog corrected.
    v2.3 (16/10/2026) – Author picker: one dropdown plus a + that adds another (the new
                        one leaves out anyone already picked), × to remove; "Other…"
                        for a guest writer stays on the first. Used in the add form and
                        the editor; replaces the co-author tick boxes.
    v2.4 (16/10/2026) – Each author box is a typeahead on the canon .club-picker look:
                        type to filter by name or initials, pick, or "Use … as
                        entered" for a guest (replaces "Other…"). Picked authors are
                        stored by key; typed names as written (co-authors too).
    v2.5 (16/10/2026) – Days and Agenda scroll endlessly, like Google Calendar: open on
                        today, load four more weeks as you near either end, and keep
                        your place when earlier weeks load above. Each month has a
                        heading that sticks under the topbar. Agenda shows only days
                        with items or notes (and today); six empty loads in a row
                        stop that end. The calendar scrolls in its own panel so tabs,
                        toolbar and filters stay put. Data loads per four-week chunk,
                        never refetching what is on screen. Arrows jump a month; a
                        day's date opens its week. Week view is unchanged.
    v2.6 (17/10/2026) – Three views, one job each. Day: one day as an hourly timeline of
                        big cards (full title, time, category, every platform, name,
                        notes, a large Published button); arrows or a swipe change day.
                        Week: seven columns with the hours down the side. Agenda: the
                        endless list, one line per item. Each has an "Any time" home for
                        items without a time, which stay optional. All seven platforms
                        show on Day and Agenda with unused ones faded; editors click to
                        toggle. The List tab goes: Agenda's Select mode sets author,
                        status, category or type on many items, and exports CSV. The
                        Days view and the combined / split toggle go with it.
    v2.7 (17/10/2026) – Quieter and aligned. Day and Agenda items are one row of fixed
                        columns (time, symbol, title, category, platforms, initials,
                        tick) so every column lines up down the page. Agenda dates sit
                        in their own gutter. Day rows are filled in the category colour;
                        the kind and type labels, notes and full names leave the row
                        (all still in the item). Only the platforms an item is posted
                        on show, not all seven.
    v2.8 (23/10/2026) – Adding an item now jumps to its date and highlights it (an item
                        added for a date outside the day / week on screen used to save
                        out of sight, so "Added" looked like nothing happened), and says
                        so if the filters hide it. Search box: titles, notes, authors and
                        categories across the whole plan, newest first; a date opens it.
    v2.9 (23/10/2026) – Settings → Authors lists every set of initials used on items,
                        not only saved authors (the import brought initials but no
                        author records, so the list was empty). The view switch stays
                        put: Agenda's Select and CSV sit on the left of the toolbar.
    v3.0 (23/10/2026) – Week / Month / List replace Day / Week / Agenda; no hourly grid
                        anywhere. Week: seven columns, each day's items stacked in time
                        order, two lines each so titles keep the full column width.
                        Month: a calendar grid, four items a day then "+N more"; on a
                        phone, a dot per item and the chosen day listed below. List: the
                        aligned endless rows (was Agenda). A date opens that day in a
                        dialog. First visit opens on Week (computer) or List (phone),
                        then the last view used. "Colour by" (category, kind, author,
                        type) recolours every view with a key and counts; it always
                        starts on category. Authors get a palette colour, changeable in
                        Settings → Authors.
    v3.1 (23/10/2026) – Month: a + on every day (on hover; always on touch). Settings →
                        Authors: Remove, and how many items each author is on. A name
                        typed as free text that matches an author counts as that author
                        (initials, colour, counts, filters). List with a filter on shows
                        only days with a matching item, not every day with matches or
                        notes.
    v3.2 (24/10/2026) – New items no longer pre-tick social platforms (an article starts
                        on Website only; other kinds on nothing), and the form no
                        longer copies the last item's platforms. "Club" is now
                        "Club obligation".
    v3.3 (24/10/2026) – Week is laid out like the sheet: a row per day, Web and
                        Social lanes, tiles left to right in time order (untimed
                        last); match pills and notes in the date column, in List
                        too. Football split by competition (National, North,
                        South, NL Cup, FA Cup, FA Trophy, Football) in the match
                        pill colours; Awards green, Trust slate, U19 red. Tiles
                        are pale with a strong left edge. Kinds: Web article,
                        Social video, Social graphic, Email (CRM). Club obligation
                        becomes a tick on any item, with a shield badge and a
                        filter. Status is Due or Published (Dropped retired).
                        Settings → Import gains "Clear the plan" for a re-import.
    v3.4 (24/10/2026) – Match pills open a fixture card (hover, or tap on a phone):
                        kick-off, home v away and the score once played. League
                        games come from the NLS feed (now kept per game, not just
                        counted); cup ties from the pasted fixtures, whose score
                        column is now kept.
    v3.5 (28/10/2026) – Calmer controls. Toolbar is ‹ Today › and the date range,
                        then Week / Month / List, Settings (icon) and Add, all one
                        height. Search and a Filters button (with a count of
                        filters on) sit under it; the dropdowns, colour and List's
                        Select / Export CSV open in a panel, remembered per browser.
                        Week on a phone: each day is a card under a banner, pills
                        beside the date, today's banner in red, weekends darker,
                        two tiles a row. Today's date cell is tinted on desktop too.
    v3.6 (28/10/2026) – Phone Week banners are solid (navy; darker navy at the
                        weekend; brand red for today) with white text, because the
                        pale ones blended into the page background.
-->

<style>
  /* #pageWrap default hide is in nl-brand.css; auth-guard reveals with
     style.display = 'block'. Don't clear with '' — would re-trigger the
     brand rule and re-hide the page. */

  /* ── Category colour ─────────────────────────────────────────────────
     Each category carries its own colour (Settings → Categories). The chip
     gets it inline as --g and a cp-on-dark / cp-on-light class chosen from
     the colour's luminance, so any picked colour stays readable.
     Defaults are brand tokens; a picked colour is stored as #hex in RTDB. */
  :root {
    --cp-none:         var(--navy-300); --cp-none-bg:     var(--white);
  }

  .cp-period { font-size: var(--text-md); font-variation-settings: 'wght' 800; color: var(--navy); white-space: nowrap; }
  /* Toolbar: two segmented groups and two buttons, one height. */
  #cpBar { margin-bottom: 12px; }
  /* One control height (38px) across the groups, the Filters and Settings buttons and search. */
  .cp-nav, .cp-modes { flex: none; background: var(--white); border: 1px solid var(--border); padding: 2px; height: 38px; box-sizing: border-box; }
  .cp-ctl { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 38px; min-width: 38px; padding: 0 12px; box-sizing: border-box;
    background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); font-family: var(--font); font-size: var(--text-sm);
    font-variation-settings: 'wght' 700; color: var(--navy); cursor: pointer; flex: none; }
  .cp-ctl:hover { border-color: var(--navy-300); }
  .cp-ctl:focus-visible { outline: none; box-shadow: var(--focus-ring); }
  .cp-ctl--icon { padding: 0; }
  #cpFilters .cp-search { height: 38px; box-sizing: border-box; }
  .cp-seg { display: inline-flex; align-items: center; justify-content: center; min-width: 34px; }
  .cp-nav > .cp-seg { color: var(--navy); }
  .cp-seg:not(.active):hover { background: var(--white); }
  .cp-seg:focus-visible { outline: none; box-shadow: var(--focus-ring); }
  .cp-addbtn { gap: 4px; }
  /* Filters row: search and one Filters button; the selects live in a panel.
     Canon candidate (28/10/2026): a search + "Filters (n)" toggle + Clear,
     with the selects in a collapsible panel. Any tool with more than two or
     three filters would want it; promote to nl-brand.css + an NL helper. */
  #cpFilters { display: grid; gap: 8px; margin-bottom: 12px; }
  .cp-frow { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .cp-ftoggle.has-on { border-color: var(--navy); }
  .cp-fcount { display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px; padding: 0 5px; border-radius: var(--radius-pill); background: var(--navy); color: var(--white); font-size: var(--text-xs); letter-spacing: 0; }
  .cp-linkbtn { background: none; border: none; padding: 4px; font-family: var(--font); font-size: var(--text-sm); color: var(--navy); text-decoration: underline; cursor: pointer; flex: none; }
  .cp-linkbtn:focus-visible { outline: none; box-shadow: var(--focus-ring); border-radius: var(--radius-sm); }
  .cp-fpanel { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; padding: 10px; background: var(--off-white); border: 1px solid var(--border); border-radius: var(--radius); }
  .cp-fpanel[hidden] { display: none; }
  .cp-fpanel select { width: 100%; min-width: 0; }
  .cp-ftools { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; }
  .cp-check { display: inline-flex; align-items: center; gap: 6px; font-size: var(--text-sm); color: var(--text-muted); cursor: pointer; }
  .cp-summary { font-size: var(--text-xs); color: var(--text-muted); margin-bottom: 10px; display: flex; flex-wrap: wrap; gap: 4px 14px; }
  .cp-summary b { color: var(--text); font-variation-settings: 'wght' 700; }

  /* Agenda: an endless list, one line per item, days with something on. */
  .cp-cal { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); }
  .cp-day { padding: 4px 0 6px; border-top: 1px solid var(--navy-100); min-width: 0; }
  .cp-day.is-today { box-shadow: inset 3px 0 0 var(--primary); }
  .cp-month { position: sticky; top: 0; z-index: 2; margin: 0; padding: 8px 12px; background: var(--navy-50); border-top: 1px solid var(--navy-100); border-bottom: 1px solid var(--navy-100); font-size: var(--text-md); font-variation-settings: 'wght' 800; color: var(--navy); }
  .cp-cal > .cp-mblock:nth-child(2) .cp-month { border-top: none; }
  .cp-month + .cp-day { border-top: none; }
  .cp-edge { height: 1px; }
  .cp-search { flex: 1 1 auto; min-width: 0; max-width: 28rem; }
  .cp-flash { box-shadow: 0 0 0 3px var(--amber); transition: box-shadow .3s; }
  @media (prefers-reduced-motion: reduce) { .cp-flash { transition: none; } }
  .cp-end { margin: 0; padding: 12px; text-align: center; font-size: var(--text-sm); color: var(--text-muted); }
  /* Agenda scrolls inside its own panel, as Google Calendar does, so the
     tabs, toolbar and filters above stay where they are. */
  #cpMain.cp-scroller { overflow-y: auto; overscroll-behavior: contain; border: 1px solid var(--border); border-radius: var(--radius); background: var(--white); }
  #cpMain.cp-scroller .cp-cal { border: none; border-radius: 0; }
  .cp-ag-date, .cp-wk-date { background: none; border: 0; padding: 0; font: inherit; color: inherit; cursor: pointer; text-align: left; display: inline-flex; align-items: baseline; gap: 6px; border-radius: var(--radius-sm); }
  .cp-ag-date:hover .cp-ag-num, .cp-wk-date:hover .cp-wk-num { text-decoration: underline; }
  .cp-ag-dow, .cp-wk-dow { font-size: var(--text-xs); text-transform: uppercase; letter-spacing: var(--tracking-wide); color: var(--text-muted); }
  .cp-daybtns { display: inline-flex; gap: 2px; }

  /* Agenda day: a fixed date gutter, then the rows. */
  .cp-day { display: grid; grid-template-columns: 160px minmax(0, 1fr); }
  .cp-ag-gutter { display: grid; grid-template-columns: 1fr auto; gap: 5px; align-content: start; align-items: center; padding: 8px 10px; border-right: 1px solid var(--navy-50); min-width: 0; }
  .cp-ag-date { display: inline-flex; align-items: baseline; gap: 6px; }
  .cp-ag-gutter .cp-ag-ctx { grid-column: 1 / -1; }
  .cp-ag-num { font-size: var(--text-lg); line-height: 1.1; color: var(--navy); font-variation-settings: 'wght' 800; font-variant-numeric: tabular-nums; }
  .cp-day.is-today .cp-ag-num, .cp-day.is-today .cp-ag-dow { color: var(--primary); }
  .cp-ag-body { display: grid; align-content: start; min-width: 0; padding: 4px 0; }
  .cp-ag-ctx { display: grid; gap: 4px; justify-items: start; }
  .cp-ag-notes { font-size: var(--text-xs); color: var(--text-muted); overflow-wrap: anywhere; }

  /* An item row. Fixed columns: [tick box] time · kind · title · category ·
     platforms · initials · published. Empty cells keep their width. */
  .cp-row { --rc: 48px 20px minmax(0, 1fr) 104px 132px 52px 30px; display: grid; grid-template-columns: var(--rc); column-gap: 10px; align-items: center; padding: 5px 12px; min-width: 0; border-top: 1px solid var(--navy-50); }
  .cp-ag-body > .cp-row:first-child { border-top: none; }
  .cp-agenda.is-selecting .cp-row { --rc: 20px 48px 20px minmax(0, 1fr) 104px 132px 52px 30px; }
  .cp-row:hover { background: var(--navy-50); }
  .cp-row[draggable="true"] { cursor: grab; }
  .cp-row.is-dragging { opacity: .4; }
  .cp-row.is-dropped { opacity: .5; }
  .cp-row.is-dropped .cp-row__t { text-decoration: none; font-style: italic; }
  .cp-row__check { width: 18px; height: 18px; margin: 0; }
  .cp-row__time { font-size: var(--text-sm); color: var(--text-muted); font-variant-numeric: tabular-nums; }
  .cp-row__kind { display: inline-flex; color: var(--navy-400); }
  .cp-row__title { display: flex; gap: 6px; align-items: center; min-width: 0; background: none; border: 0; padding: 0; margin: 0; font-family: var(--font); font-size: var(--text-sm); color: var(--text); text-align: left; cursor: pointer; border-radius: var(--radius-sm); }
  .cp-row__t { min-width: 0; overflow-wrap: anywhere; }   /* full titles; long ones wrap inside their column */
  .cp-row__title:hover .cp-row__t { text-decoration: underline; }
  .cp-row.is-published .cp-row__t { color: var(--text-muted); }
  .cp-row__cat { min-width: 0; display: flex; }
  .cp-catpill { display: inline-flex; padding: 1px 8px; border-radius: var(--radius-pill); background: var(--g); color: var(--g-fg); font-size: var(--text-xs); font-variation-settings: 'wght' 700; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
  .cp-catpill--none { display: none; }
  .cp-pl { display: flex; gap: 4px; align-items: center; color: var(--navy); min-width: 0; overflow: hidden; }
  .cp-ini { font-size: var(--text-xs); font-variation-settings: 'wght' 800; color: var(--text); text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cp-ini--none { color: var(--primary); }
  .cp-pubtick { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--white); color: var(--navy-300); justify-self: end; }
  button.cp-pubtick { cursor: pointer; padding: 0; }
  button.cp-pubtick:hover { border-color: var(--green); color: var(--green); }
  .cp-pubtick.is-on { background: var(--green); border-color: var(--green); color: var(--white); }
  button.cp-pubtick.is-on:hover { color: var(--white); }
  .cp-pubtick.is-blank { border-color: transparent; background: none; }
  .cp-pubtick--dropped { color: var(--text-muted); }
  .cp-row__title:focus-visible, .cp-ag-date:focus-visible, .cp-wk-date:focus-visible, .cp-pubtick:focus-visible { outline: none; box-shadow: var(--focus-ring); }

  /* Week: seven columns, each day's items stacked in time order. */
  /* Week sheet: date column · Web lane · Social lane. */
  .cp-sh-hd, .cp-sh-day { display: grid; grid-template-columns: 160px minmax(0, 6fr) minmax(0, 4fr); }
  .cp-sh-hd { border-bottom: 1px solid var(--navy-100); }
  .cp-sh-hd span { padding: 6px 10px; font-size: var(--text-xs); text-transform: uppercase; letter-spacing: var(--tracking-wide); color: var(--text-muted); }
  .cp-sh-hd span + span { border-left: 1px solid var(--navy-100); }
  .cp-sh-day { border-top: 1px solid var(--navy-100); min-height: 56px; }
  .cp-sh-hd + .cp-sh-day { border-top: none; }
  .cp-sh-day.is-weekend { background: var(--navy-50); }
  .cp-sh-day.is-today .cp-sh-date { background: var(--primary-50); box-shadow: inset 4px 0 0 var(--primary); }
  .cp-sh-date { display: grid; gap: 5px; align-content: start; padding: 8px 10px; border-right: 1px solid var(--navy-100); min-width: 0; }
  .cp-sh-notes { font-size: var(--text-xs); color: var(--text-muted); overflow-wrap: anywhere; }
  .cp-sh-lane { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; align-content: start; padding: 6px; min-width: 0; }
  .cp-sh-lane--social { border-left: 1px solid var(--navy-100); }
  .cp-wk-headtop { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 5px 4px; }
  .cp-sh-date .cp-daybtns { order: 2; }
  .cp-sh-date .cp-mpills { order: 3; flex-basis: 100%; }
  .cp-wk-date { display: inline-flex; align-items: baseline; gap: 6px; }
  .cp-wk-num { font-size: var(--text-lg); color: var(--navy); font-variation-settings: 'wght' 800; line-height: 1; font-variant-numeric: tabular-nums; }
  .is-today .cp-wk-num, .is-today .cp-wk-dow { color: var(--primary); }
  /* Week chip: time, symbol, initials and tick on top; the title gets the full width below. */
  .cp-item--two { align-items: flex-start; padding: 5px 7px; }
  .cp-item--two { height: 100%; }
  .cp-item--two .cp-item__open { display: grid; grid-template-columns: auto 16px minmax(0, 1fr) auto; grid-template-areas: "tm g cl ini" "t t t t"; row-gap: 2px; column-gap: 5px; align-content: start; align-self: stretch; }
  .cp-item--two .cp-club { grid-area: cl; }
  .cp-item--two .cp-item__time { grid-area: tm; } .cp-item--two .cp-glyph { grid-area: g; } .cp-item--two .cp-item__ini { grid-area: ini; }
  .cp-item--two .cp-item__time:empty { display: none; }
  .cp-item--two .cp-item__t { grid-area: t; white-space: normal; overflow: hidden; overflow-wrap: break-word; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
  .cp-item--two .cp-tick { margin-top: 1px; }

  /* Month: a calendar grid; up to four items a day, then "+N more". */
  .cp-mo-dows, .cp-mo-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
  .cp-mo-dows span { padding: 6px 8px; font-size: var(--text-xs); text-transform: uppercase; letter-spacing: var(--tracking-wide); color: var(--text-muted); border-bottom: 1px solid var(--navy-100); }
  .cp-mo-cell { display: grid; grid-template-rows: auto auto auto 1fr auto; gap: 3px; align-content: start; min-height: 132px; min-width: 0; padding: 4px; border-left: 1px solid var(--navy-100); border-bottom: 1px solid var(--navy-100); }
  .cp-mo-cell:nth-child(7n+1) { border-left: none; }
  .cp-mo-cell.is-weekend { background: var(--navy-50); }
  .cp-mo-cell.is-out { background: var(--off-white); }
  .cp-mo-cell.is-out .cp-mo-num { color: var(--navy-200); }
  .cp-mo-num { justify-self: start; background: none; border: 0; padding: 0 4px; font-family: var(--font); font-size: var(--text-sm); font-variation-settings: 'wght' 800; color: var(--navy); cursor: pointer; border-radius: var(--radius-pill); font-variant-numeric: tabular-nums; }
  .cp-mo-num:hover { text-decoration: underline; }
  .cp-mo-num:focus-visible, .cp-mo-more:focus-visible { outline: none; box-shadow: var(--focus-ring); }
  .cp-mo-cell.is-today .cp-mo-num { background: var(--primary); color: var(--white); padding: 0 7px; }
  .cp-mo-pills .cp-mpill { font-size: 11px; padding: 0 4px; }
  .cp-mo-list { display: grid; gap: 2px; align-content: start; min-width: 0; }
  .cp-mo-more { justify-self: start; background: none; border: 0; padding: 0 2px; font-family: var(--font); font-size: var(--text-xs); font-variation-settings: 'wght' 700; color: var(--navy); cursor: pointer; }
  .cp-mo-top { display: flex; justify-content: space-between; align-items: center; gap: 4px; min-width: 0; }
  /* The + shows on hover or keyboard focus; on touch screens it always shows. */
  .cp-mo-add { opacity: 0; }
  .cp-mo-cell:hover .cp-mo-add, .cp-mo-add:focus-visible { opacity: 1; }
  @media (hover: none) { .cp-mo-add { opacity: 1; } }
  .cp-mo-dots, .cp-mo-day { display: none; }
  .cp-mo-dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--navy-300); }
  .cp-mo-dots i.is-none { background: var(--white); box-shadow: inset 0 0 0 1px var(--navy-300); }
  .cp-mo-dots b { font-size: 9px; line-height: 6px; color: var(--navy); }
  .cp-mo-dayhead { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .cp-mo-dayhead h3 { margin: 0; font-size: var(--text-md); color: var(--navy); }

  /* Colour key in the summary line, with counts. */
  .cp-key { display: inline-flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
  .cp-key__lead { color: var(--text-muted); }
  .cp-key__item { display: inline-flex; align-items: center; gap: 5px; color: var(--text); }
  .cp-key__sw { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
  .cp-key__sw.is-none { background: var(--white); box-shadow: inset 0 0 0 1px var(--navy-300); }
  #cpColourBy { width: auto; }

  /* A day, opened in a dialog: rows in their two-line phone form. */
  .cp-panel { display: grid; gap: 0; }
  .cp-panel .cp-row { grid-template-columns: 44px 18px minmax(0, 1fr) auto auto 30px; grid-template-areas: "t k ti ti ti tk" ". . ca pl in ."; row-gap: 4px; column-gap: 8px; padding: 8px 0; }
  .cp-panel .cp-row__time { grid-area: t; } .cp-panel .cp-row__kind { grid-area: k; } .cp-panel .cp-row__title { grid-area: ti; }
  .cp-panel .cp-row__cat { grid-area: ca; } .cp-panel .cp-pl { grid-area: pl; } .cp-panel .cp-ini { grid-area: in; } .cp-panel .cp-pubtick { grid-area: tk; }
  .cp-panel .cp-ag-ctx { padding: 0 0 8px; }

  .cp-item--compact { padding: 2px 6px; font-size: var(--text-xs); gap: 4px; }
  .cp-item--compact .cp-item__open { gap: 4px; }
  .cp-sh-day.is-drop, .cp-mo-cell.is-drop, .cp-day.is-drop { outline: 2px dashed var(--navy-300); outline-offset: -2px; }
  .cp-dh__btn { background: none; border: none; padding: 2px; cursor: pointer; color: var(--text-muted); border-radius: var(--radius-sm); display: inline-flex; }
  .cp-dh__btn:hover { color: var(--primary); background: var(--off-white); }
  .cp-dh__btn:focus-visible { outline: none; box-shadow: var(--focus-ring); }
  .cp-dh__btn svg { width: 16px; height: 16px; }
  .cp-empty-day { font-size: var(--text-xs); color: var(--navy-300); }

  /* Match pills: one pastel per competition (NAT orange, NOR yellow, SOU blue,
     NLC purple, FAC pink-red, FAT grey), matching the team's spreadsheet. */
  .cp-mpills { display: flex; flex-wrap: wrap; gap: 3px; }
  .cp-mpill { font-family: var(--font); cursor: pointer; }
  .cp-mpill:hover { border-color: var(--mp-fg); }
  .cp-mpill:focus-visible { outline: none; box-shadow: var(--focus-ring); }
  /* Fixture card: fixed, on the open-popover rung (150) of the brand stacking scale. */
  .cp-gcard { position: fixed; z-index: 150; max-width: min(460px, calc(100vw - 16px)); max-height: 60vh; overflow: auto;
    background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 8px 10px; font-size: var(--text-sm); }
  .cp-gcard[hidden] { display: none; }
  .cp-gcard__head { font-size: var(--text-xs); text-transform: uppercase; letter-spacing: var(--tracking-wide); color: var(--text-muted); font-variation-settings: 'wght' 700; padding-bottom: 6px; border-bottom: 1px solid var(--navy-50); margin-bottom: 4px; }
  .cp-gcard__list { border-collapse: collapse; width: 100%; }
  .cp-gcard__list td { padding: 3px 4px; vertical-align: baseline; }
  .cp-gcard__tm, .cp-gcard__sc { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .cp-gcard__tm, .cp-gcard__rd { color: var(--text-muted); font-size: var(--text-xs); }
  .cp-gcard__h { text-align: right; }
  .cp-gcard__sc { text-align: center; font-variation-settings: 'wght' 700; color: var(--navy); }
  .cp-gcard__none { margin: 4px 0; color: var(--text-muted); }
  @media (min-width: 761px) { .cp-gcard { max-width: min(640px, calc(100vw - 16px)); } .cp-gcard__list td { white-space: nowrap; } }
  .cp-mpill { display: inline-flex; align-items: center; gap: 3px; padding: 1px 6px; border-radius: var(--radius-pill);
    font-size: var(--text-xs); font-variation-settings: 'wght' 700; font-variant-numeric: tabular-nums; line-height: 1.5; white-space: nowrap;
    background: var(--mp-bg); color: var(--mp-fg); border: 1px solid var(--mp-edge); }
  /* Pastel pills in the competition colours from the media team's sheet. */
  .cp-mpill--nl  { --mp-bg: var(--amber-light);  --mp-edge: var(--amber);    --mp-fg: var(--amber-deep); }
  .cp-mpill--n   { --mp-bg: var(--yellow-light); --mp-edge: var(--yellow);   --mp-fg: var(--text); }
  .cp-mpill--s   { --mp-bg: var(--blue-light);   --mp-edge: var(--blue);     --mp-fg: var(--blue); }
  .cp-mpill--cup { --mp-bg: var(--purple-light); --mp-edge: var(--purple);   --mp-fg: var(--purple); }
  .cp-mpill--fac { --mp-bg: var(--primary-50);   --mp-edge: var(--primary-400); --mp-fg: var(--primary); }
  .cp-mpill--fat { --mp-bg: var(--off-white);    --mp-edge: var(--navy-300); --mp-fg: var(--text-muted); }
  /* Item chip. Fill = category colour, glyph = kind, tick = published.
     --g edge, --g-bg fill, --g-fg text, --g-muted secondary, --g-ink glyph, --g-tick done.
     Uncategorised chips stay white; categorised ones are solid (see paint()). */
  .cp-item, .cp-idea { --g: var(--cp-none); --g-bg: var(--cp-none-bg); --g-fg: var(--text); --g-muted: var(--text-muted); --g-ink: var(--g); --g-tick: var(--green); }
  .cp-item {
    display: flex; align-items: center; gap: 6px; padding: 4px 8px; border-radius: var(--radius-sm);
    background: var(--g-bg); border: 1px solid var(--navy-100); border-left: 3px solid var(--g);
    font-size: var(--text-sm); color: var(--g-fg); cursor: pointer; min-width: 0; text-align: left; width: 100%; font-family: var(--font); }
  .cp-item:hover { border-color: var(--g); }
  .cp-item:focus-visible { outline: none; box-shadow: var(--focus-ring); }
  .cp-item[draggable="true"] { cursor: grab; }
  .cp-item.is-dragging { opacity: .4; }
  .cp-item__t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cp-item__time { font-size: var(--text-xs); font-variant-numeric: tabular-nums; color: var(--g-muted); flex: none; }
  .cp-plats { display: inline-flex; gap: 3px; flex: none; color: var(--g-muted, var(--text-muted)); }
  .cp-plat-toggles { display: flex; flex-wrap: wrap; gap: 4px; }
  .cp-plat { color: var(--navy-300); }
  .cp-plat[aria-pressed="true"] { background: var(--navy); border-color: var(--navy); color: var(--white); }
  .cp-item__ini { min-width: 3.2ch; text-align: right; font-size: var(--text-xs); font-variation-settings: 'wght' 800; color: var(--g-muted); flex: none; max-width: 9ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* The chip is a plain container (draggable); this button opens the item. */
  .cp-item__open { display: flex; align-items: center; gap: 6px; flex: 1; min-width: 0; padding: 0; margin: 0;
    background: none; border: none; color: inherit; text-align: left; cursor: pointer;
    font-family: var(--font); font-size: inherit; }
  .cp-item__open:focus-visible { outline: none; box-shadow: var(--focus-ring); border-radius: var(--radius-sm); }
  .cp-item svg { flex: none; }
  /* Done = a green tick, at full colour. No fade, no strike (decided 16/10/2026).
     Planned items show the tick only on hover/focus, for editors; always on touch. */
  .cp-item.is-dropped { opacity: .45; }
  .cp-item.is-dropped .cp-item__t { font-style: italic; }
  .cp-tick { opacity: 0; }
  .cp-item:hover .cp-tick, .cp-item:focus-within .cp-tick, .cp-item.is-published .cp-tick { opacity: 1; }
  @media (hover: none) { .cp-tick { opacity: 1; } }
  .cp-item.is-published .cp-tick, .cp-done { color: var(--g-tick, var(--green)); }
  .cp-done { display: inline-flex; flex: none; }
  .cp-tick { background: none; border: none; padding: 0; color: var(--g-muted); cursor: pointer; display: inline-flex; flex: none; }
  .cp-tick:hover { color: var(--green); }
  .cp-tick:focus-visible { outline: none; box-shadow: var(--focus-ring); border-radius: var(--radius-sm); }

  .cp-glyph { flex: none; color: var(--g-ink, var(--g, var(--navy))); }

  /* Pale tile, strong edge: the fill is a tint of the colour and text stays dark,
     so any picked colour reads. Specificity beats .cp-on-dark/.cp-on-light. */
  .cp-cat.cp-item, .cp-cat.cp-idea { --g-bg: color-mix(in srgb, var(--g) 14%, var(--white)); --g-fg: var(--text); --g-ink: color-mix(in srgb, var(--g) 75%, var(--text)); --g-tick: var(--green); --g-muted: var(--text-muted);
    border-color: color-mix(in srgb, var(--g) 35%, var(--white)); border-left: 4px solid var(--g); }
  .cp-club { display: inline-flex; flex: none; color: var(--green); }
  .cp-flag { display: inline-flex; align-items: center; gap: 6px; font-size: var(--text-sm); cursor: pointer; }
  .cp-flag svg { color: var(--green); }
  .cp-on-dark  { --g-fg: var(--white); --g-ink: var(--white); --g-tick: var(--white); --g-muted: color-mix(in srgb, var(--white) 78%, var(--g)); }
  .cp-on-light { --g-fg: var(--text);  --g-ink: var(--text);  --g-tick: var(--text);  --g-muted: color-mix(in srgb, var(--text) 72%, var(--g)); }
  .cp-swatch { width: 40px; height: 32px; padding: 2px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--white); cursor: pointer; }

  /* Inline add form inside a day. */
  .cp-add { display: grid; gap: 8px; padding: 10px; background: var(--white); border: 1px solid var(--navy-200); border-radius: var(--radius); min-width: 0; }
  .cp-add__row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; min-width: 0; }
  .cp-add input[type="text"], .cp-add input[type="time"], .cp-in {
    font-family: var(--font); font-size: var(--text-sm); color: var(--text);
    border: 1px solid var(--border); border-radius: var(--radius); padding: .45rem .6rem; background: var(--white); min-width: 0; }
  .cp-add input[type="text"]:focus, .cp-in:focus { outline: none; border-color: var(--primary); box-shadow: var(--focus-ring); }
  .cp-add__title { width: 100%; }
  .cp-grow { flex: 1; }
  /* Canon's 16px phone floor, so iOS doesn't zoom on focus. */
  @media (max-width: 700px) { .cp-in, .cp-add input { font-size: 16px; } }

  /* Modals */
  .cp-link-results { display: grid; gap: 2px; max-height: 180px; overflow-y: auto; margin-top: 6px; }
  .cp-link-results button { text-align: left; background: var(--off-white); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 4px 8px; font-family: var(--font); font-size: var(--text-sm); cursor: pointer; }
  .cp-link-results button:hover { border-color: var(--navy-300); }
  .cp-readonly dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; margin: 0; font-size: var(--text-sm); }
  .cp-readonly dt { color: var(--text-muted); }
  .cp-readonly dd { margin: 0; overflow-wrap: anywhere; }
  .cp-settings-row { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; align-items: center; padding: 6px 0; border-top: 1px solid var(--navy-100); }
  .cp-settings-row--authors { grid-template-columns: auto 70px 1fr auto auto 5.5rem auto; }
  .cp-auth-n { font-size: var(--text-xs); color: var(--text-muted); white-space: nowrap; }
  .cp-settings-row--cat { grid-template-columns: auto 1fr 70px auto; }
  .cp-settings-row .cp-in, .cp-settings-row select { width: 100%; }

  .cp-bulk { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 12px; margin-bottom: 10px; background: var(--navy-50); border: 1px solid var(--navy-100); border-radius: var(--radius); font-size: var(--text-sm); }
  /* Ideas */
  .cp-ideas { display: grid; gap: 12px; }
  .cp-idea-list { display: grid; gap: 6px; }
  .cp-idea {
    display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: start; padding: 10px 12px;
    background: var(--g-bg); border: 1px solid var(--navy-100); border-left: 3px solid var(--g); border-radius: var(--radius-sm); min-width: 0; }
  .cp-idea.is-archived { opacity: .55; }
  .cp-idea__main { display: grid; gap: 4px; min-width: 0; }

  @media (max-width: 760px) {

    .cp-agenda.is-selecting .cp-row { grid-template-columns: 20px 44px 18px minmax(0, 1fr) auto auto 30px; grid-template-areas: "c t k ti ti ti tk" ". . . ca pl in ."; }
    .cp-row__check { grid-area: c; } .cp-row__time { grid-area: t; } .cp-row__kind { grid-area: k; } .cp-row__title { grid-area: ti; }

    .cp-cal.cp-sheet { background: none; border: none; display: grid; gap: 10px; }
    .cp-sh-hd { display: none; }
    .cp-sh-day, .cp-sh-day.is-weekend { grid-template-columns: 1fr; background: var(--white); border: 1px solid var(--navy-100); border-radius: var(--radius); overflow: hidden; }
    /* Solid banners: a pale one vanished into the page's off-white (28/10/2026). */

    .cp-mo-day { display: grid; gap: 4px; padding: 10px 12px; border-top: 1px solid var(--navy-100); }
    .cp-mo-day .cp-row { padding-left: 0; padding-right: 0; }
  }
  @media (max-width: 640px) {
    .cp-idea { grid-template-columns: 1fr; }
    .cp-idea__actions { justify-content: flex-start; }
    .cp-settings-row, .cp-settings-row--authors { grid-template-columns: 1fr 1fr; }
  }

<body>

<!-- Topbar — auto-rendered by /system/nl-topbar.js from window.NL_TOOL -->
<div id="nlTopbar"></div>

<div id="pageWrap">
  <div class="page">

    <div class="tabs" role="tablist" id="cpTabs">
      <button class="tab active" type="button" role="tab" data-view="calendar" aria-selected="true">Calendar</button>
      <button class="tab" type="button" role="tab" data-view="ideas" aria-selected="false">Ideas</button>
    </div>

    <div class="toolbar" id="cpBar"></div>
    <div class="filter-bar" id="cpFilters"></div>
    <div class="cp-summary" id="cpSummary"></div>
    <div id="cpBulk"></div>
    <div id="cpMain"><div class="cp-loading">Loading the plan…</div></div>

  </div>
</div>

<!-- Main app -->
<script>
(function () {
  'use strict';

  var TOOL_KEY = 'media-content-plan';
  var ROOT = 'app-data/' + TOOL_KEY;

  /* ── Fixed vocab (code, not config) ───────────────────────────────────
     Kinds, platforms and statuses are fixed here. Categories are config. */
  /* Starting categories. token = a brand colour used until someone picks one. */
  /* Football is split by competition, in the match pills' colours, so a
     week of mostly football still reads at a glance. */
  var DEFAULT_CATEGORIES = {
    national:   { label: 'National',   token: '--amber',    order: 1 },
    north:      { label: 'North',      token: '--yellow',   order: 2 },
    south:      { label: 'South',      token: '--blue',     order: 3 },
    nlcup:      { label: 'NL Cup',     token: '--purple',   order: 4 },
    facup:      { label: 'FA Cup',     token: '--primary',  order: 5 },
    fatrophy:   { label: 'FA Trophy',  token: '--navy-300', order: 6 },
    football:   { label: 'Football',   token: '--navy-600', order: 7 },
    awards:     { label: 'Awards',     token: '--green',    order: 8 },
    league:     { label: 'League',     token: '--navy-400', order: 9 },
    statements: { label: 'Statements', token: '--navy',     order: 10 },
    trust:      { label: 'Trust',      token: '--proj-7',   order: 11 },
    u19:        { label: 'U19',        token: '--red',      order: 12 },
    '3up':      { label: '3UP',        token: '--navy-900', order: 13 }
  };
  /* Older spellings of the same categories. */
  var LEGACY_CATEGORY = { 'nl cup': 'nlcup', 'fa cup': 'facup', 'fa trophy': 'fatrophy' };
  /* Kind = what the item is. One label, shown as the chip's badge. */
  /* A club obligation is a flag on any kind (clubObligation), not a kind:
     sometimes it is an article, sometimes a post. */
  var KINDS = [
    { key: 'web',     label: 'Web article',    glyph: 'article' },
    { key: 'video',   label: 'Social video',   glyph: 'play' },
    { key: 'graphic', label: 'Social graphic', glyph: 'image' },
    { key: 'crm',     label: 'Email (CRM)',    glyph: 'email' }
  ];
  var CLUB_FILTER = 'club';  // the Kind filter's extra option: club obligations of any kind
  /* A few sheet items were social with no video/graphic marker. */
  var KIND_UNSET = { key: 'social', label: 'Social (video or graphic?)', glyph: 'chat' };  // a few sheet items
  /* Where an item is posted. Icons are the sprite's brand marks. */
  var PLATFORMS = [
    { key: 'website',   label: 'Website' },
    { key: 'x',         label: 'X' },
    { key: 'facebook',  label: 'Facebook' },
    { key: 'instagram', label: 'Instagram' },
    { key: 'tiktok',    label: 'TikTok' },
    { key: 'linkedin',  label: 'LinkedIn' },
    { key: 'youtube',   label: 'YouTube' }
  ];
  /* Starting set for a new item, by kind, until the user's own last set for that kind exists. */
  /* A new item starts with only the website ticked for an article, and
     nothing else for any kind: socials are always a choice, never a guess. */
  function defaultPlatforms(kind) {
    return kind === 'web' ? { website: true } : {};
  }
  function platformsOn(it) { return PLATFORMS.filter(function (p) { return it.platforms && it.platforms[p.key]; }); }
  function platformsObj(on) { var o = {}; PLATFORMS.forEach(function (p) { o[p.key] = !!(on && on[p.key]); }); return o; }
  /* A row of logo toggles. Returns the node; node.value() gives {key: bool}. */
  function platformToggles(initial, onChange) {
    var state = platformsObj(initial);
    var box = el('div', 'cp-plat-toggles');
    box.setAttribute('role', 'group'); box.setAttribute('aria-label', 'Posted on');
    PLATFORMS.forEach(function (p) {
      var b = el('button', 'btn btn--icon btn--ghost cp-plat'); b.type = 'button'; b.title = p.label;
      b.setAttribute('aria-label', p.label);
      b.setAttribute('aria-pressed', state[p.key] ? 'true' : 'false');
      b.appendChild(NL.icon(p.key, 'sm'));
      b.addEventListener('click', function () {
        state[p.key] = !state[p.key];
        b.setAttribute('aria-pressed', state[p.key] ? 'true' : 'false');
        if (onChange) onChange(p.key, state[p.key]);
      });
      box.appendChild(b);
    });
    box.value = function () { return platformsObj(state); };
    box.set = function (on) {
      state = platformsObj(on);
      Array.prototype.forEach.call(box.children, function (b, i) { b.setAttribute('aria-pressed', state[PLATFORMS[i].key] ? 'true' : 'false'); });
    };
    return box;
  }
  var TYPES = [
    { key: 'routine',  label: 'Routine' },
    { key: 'reactive', label: 'Reactive' },
    { key: 'original', label: 'Original' }
  ];
  var STATUSES = [
    { key: 'planned', label: 'Due' },
    { key: 'published', label: 'Published' }
  ];
  /* "Colour by": what the fill of each item means. Category is the default
     and the page always opens on it; the others are for a quick look. */
  var COLOUR_BY = [
    { key: 'category', label: 'Colour: category' },
    { key: 'kind',     label: 'Colour: kind' },
    { key: 'author',   label: 'Colour: author' },
    { key: 'type',     label: 'Colour: type' }
  ];
  var KIND_TOKEN = { web: '--navy', video: '--purple', graphic: '--blue', crm: '--amber', social: '--navy-300' };
  var TYPE_TOKEN = { routine: '--navy-400', reactive: '--amber', original: '--green' };
  /* Authors without a picked colour take one from the canon project palette. */
  var AUTHOR_TOKENS = ['--proj-1', '--proj-2', '--proj-3', '--proj-4', '--proj-5', '--proj-6', '--proj-7', '--proj-8'];
  var ANY_TIME = { from: null };

  var NLS_BASE = 'https://multi-club-matches.football.web.gc.nationalleagueservices.co.uk/v2';
  var NLS_COMPS = [
    { id: 89,   key: 'nl',  label: 'NAT' },
    { id: 373,  key: 'n',   label: 'NOR' },
    { id: 372,  key: 's',   label: 'SOU' },
    { id: 1275, key: 'cup', label: 'NLC' }
  ];

  /* ── State ─────────────────────────────────────────────────────────── */
  var S = {
    session: null,
    canEdit: false,
    isSuper: false,
    view: 'calendar',         // calendar | ideas
    cup: {}, cupRef: null,
    ideas: {}, ideasRef: null, showArchived: false, ideaForm: null,
    mode: 'week',             // week (7 columns) | month (grid) | list (endless rows)
    colourBy: 'category',     // never saved: every visit starts on category
    monthSel: null,           // phone month: the day listed under the grid
    from: '', to: '',         // loaded span in the endless modes; grows as you scroll
    scrollTo: null,           // date to bring to the top after the next calendar render
    chunks: [], cov: null,    // live listeners per date span, and the span they cover
    extending: false,
    emptyRun: { top: 0, bottom: 0 }, extDir: null, rowsBefore: 0,
    cursor: null,             // Date inside the visible period
    selecting: false, selected: {},   // Agenda's Select mode
    items: {},                // id → item for the visible range
    days: {},                 // date → day record
    config: { categories: {}, authors: {} },
    filters: { kind: '', category: '', author: '', platform: '', status: '' },
    itemsRef: null, daysRef: null,
    addingOn: null,           // date with the inline add form open
    addForm: null,            // that form's node, reused across live re-renders so typing survives
    matches: {},              // date → {nl, n, s, cup}
    games: {},                // date → {nl: [{time, home, away, hs, as, note}], …} for the pill cards
    seasonsLoading: {},
    filtersOpen: lsGet('cp:filtersOpen') === true   // per-browser: is the filter panel open
  };

  /* ── Small helpers ─────────────────────────────────────────────────── */
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function ymd(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
  function fromYmd(s) { return NL.parseDate(s); }   // canon: ISO date → local midnight
  function addDays(d, n) { var x = new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); return x; }
  function todayYmd() { return ymd(new Date()); }
  var WD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  var MON = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  var WDL = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  function longDay(s) { var d = fromYmd(s); return WDL[d.getDay()] + ' ' + d.getDate() + ' ' + MON[d.getMonth()] + ' ' + d.getFullYear(); }
  function dayLabel(s) { var d = fromYmd(s); return WD[d.getDay()] + ' ' + d.getDate() + ' ' + MON[d.getMonth()].slice(0, 3); }
  function uk(s) { if (!s) return ''; var p = s.split('-'); return p[2] + '/' + p[1] + '/' + p[0]; }   // CSV only
  function shortDate(s) { return s ? NL.formatDateShort(s) : ''; }
  function lookup(list, key) { for (var i = 0; i < list.length; i++) if (list[i].key === key) return list[i]; return null; }
  function sel(options, value, placeholder, cls) {
    var s = el('select', cls || 'nl-select');
    if (placeholder != null) { var o0 = el('option', null, placeholder); o0.value = ''; s.appendChild(o0); }
    options.forEach(function (o) {
      var op = el('option', null, o.label); op.value = o.key;
      if (o.disabled) op.disabled = true;
      s.appendChild(op);
    });
    s.value = value == null ? '' : value;
    return s;
  }
  function icon(name) { return NL.icon(name, 'sm'); }
  function lsGet(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function stamp() { return { updatedBy: S.session.uid, updatedAt: firebase.database.ServerValue.TIMESTAMP }; }
  function fail(err) { NL.toast((err && err.message) || 'Something went wrong', 'error'); }

  /* ── Config lookups ────────────────────────────────────────────────── */
  function cssVar(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }
  function toHex(c) {
    c = String(c || '').trim();
    if (/^#[0-9a-f]{6}$/i.test(c)) return c.toLowerCase();
    if (/^#[0-9a-f]{3}$/i.test(c)) return ('#' + c[1] + c[1] + c[2] + c[2] + c[3] + c[3]).toLowerCase();
    var m = /rgba?\((\d+)\D+(\d+)\D+(\d+)/.exec(c);
    if (m) return '#' + [m[1], m[2], m[3]].map(function (v) { return ('0' + (+v).toString(16)).slice(-2); }).join('');
    return toHex(cssVar('--navy-300') || '#000');
  }
  function categoryColour(c) { return toHex(c.colour || (c.token ? cssVar(c.token) : '')); }
  /* Light fill → dark ink: pick whichever of --text / --white contrasts more (WCAG). */
  function luminance(hex) {
    var v = [1, 3, 5].map(function (i) {
      var x = parseInt(hex.substr(i, 2), 16) / 255;
      return x <= 0.03928 ? x / 12.92 : Math.pow((x + 0.055) / 1.055, 2.4);
    });
    return 0.2126 * v[0] + 0.7152 * v[1] + 0.0722 * v[2];
  }
  function contrast(a, b) { var x = luminance(a), y = luminance(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); }
  function isLight(hex) { return contrast(hex, toHex(cssVar('--text'))) > contrast(hex, toHex(cssVar('--white'))); }
  function categoryList() {
    var c = S.config.categories || {};
    return Object.keys(c).map(function (k) { return { key: k, label: c[k].label, colour: categoryColour(c[k]), order: c[k].order || 99 }; })
      .sort(function (a, b) { return a.order - b.order || a.label.localeCompare(b.label); });
  }
  /* A stored category may be a key (now), a label (older) or a CMS name (the sheet). */
  function categoryOf(value) {
    if (!value) return null;
    var list = categoryList(), v = String(value), low = v.toLowerCase(), i;
    for (i = 0; i < list.length; i++) if (list[i].key === v) return list[i];
    for (i = 0; i < list.length; i++) if (list[i].label.toLowerCase() === low) return list[i];
    var legacy = LEGACY_CATEGORY[low];
    if (legacy) for (i = 0; i < list.length; i++) if (list[i].key === legacy) return list[i];
    return null;
  }
  function categoryLabel(value) { var c = categoryOf(value); return c ? c.label : (value || ''); }
  function categoryOptions(current) {
    var opts = categoryList().map(function (c) { return { key: c.key, label: c.label }; });
    if (current && !categoryOf(current)) opts.push({ key: current, label: current + ' (removed)' });
    return opts;
  }
  /* Paint a chip or card in its category's colour. */
  function paint(node, value) {
    var c = categoryOf(value);
    if (!c) return;
    node.classList.add('cp-cat', isLight(c.colour) ? 'cp-on-light' : 'cp-on-dark');
    node.style.setProperty('--g', c.colour);
  }
  function tokenHex(t) { return toHex(cssVar(t)); }
  function authorColour(key) {
    var a = (S.config.authors || {})[key];
    if (a && a.colour) return a.colour;
    var keys = Object.keys(S.config.authors || {}).sort(), i = keys.indexOf(key);
    if (i < 0) { i = 0; for (var n = 0; n < key.length; n++) i += key.charCodeAt(n); }
    return tokenHex(AUTHOR_TOKENS[i % AUTHOR_TOKENS.length]);
  }
  /* What an item is coloured as under the current "Colour by": a key for the
     key, a label, and a hex (null = no fill). */
  function colourOf(it) {
    var by = S.colourBy, k;
    if (by === 'kind') { k = kindOf(it); return { key: k, label: kindInfo(k).label, hex: tokenHex(KIND_TOKEN[k] || '--navy-300') }; }
    if (by === 'author') {
      if (it.author) return { key: it.author, label: authorName(it.author), hex: authorColour(it.author) };
      if (it.authorOther) return { key: '_guest', label: 'Guest writers', hex: tokenHex('--navy-300') };
      return { key: '_none', label: 'Unassigned', hex: null };
    }
    if (by === 'type') {
      if (it.type && TYPE_TOKEN[it.type]) return { key: it.type, label: (lookup(TYPES, it.type) || {}).label, hex: tokenHex(TYPE_TOKEN[it.type]) };
      return { key: '_none', label: 'Type not set', hex: null };
    }
    var c = categoryOf(it.category);
    return c ? { key: c.key, label: c.label, hex: c.colour } : { key: '_none', label: 'No category', hex: null };
  }
  function paintItem(node, it) {
    var c = colourOf(it);
    if (!c.hex) return c;
    node.classList.add('cp-cat', isLight(c.hex) ? 'cp-on-light' : 'cp-on-dark');
    node.style.setProperty('--g', c.hex);
    return c;
  }
  /* An item saved with an author's name typed as free text (before Settings
     had the name, say) counts as that author everywhere. In memory only; the
     next save of the item stores the initials. */
  function authorKeyFor(text) {
    var t = String(text || '').trim().toLowerCase(), a = S.config.authors || {};
    if (!t) return null;
    for (var k in a) if (k.toLowerCase() === t || (a[k] && a[k].name && a[k].name.trim().toLowerCase() === t)) return k;
    return null;

  /* ── Top bar (period nav / list range / actions) ───────────────────── */

  function periodLabel() {
    var y = new Date().getFullYear();
    if (S.mode === 'month') return MON[S.cursor.getMonth()] + ' ' + S.cursor.getFullYear();
    if (S.mode !== 'week') return '';
    var r = currentRange(), a = fromYmd(r.from), b = addDays(a, 6);
    var m = function (d) { return MON[d.getMonth()].slice(0, 3); };
    var t = a.getMonth() === b.getMonth() ? a.getDate() + '–' + b.getDate() + ' ' + m(b)
      : a.getDate() + ' ' + m(a) + ' – ' + b.getDate() + ' ' + m(b);
    return b.getFullYear() !== y ? t + ' ' + b.getFullYear() : t;
  }
  function segButton(label, active, onClick, aria) {
    var b = el('button', 'chip cp-seg' + (active ? ' active' : ''), label); b.type = 'button';
    if (aria) b.setAttribute('aria-label', aria);
    if (active != null) b.setAttribute('aria-pressed', active ? 'true' : 'false');
    b.addEventListener('click', onClick);
    return b;
  }
  function renderBar() {
    var bar = document.getElementById('cpBar');

    var left = el('div', 'toolbar__left'), right = el('div', 'toolbar__right cp-bar-right');

      var nav = el('div', 'chip-group cp-nav');

      var today = segButton('Today', null, function () {
        S.cursor = new Date(); S.monthSel = null;
        if (endless()) goTo(todayYmd()); else { listen(); renderBar(); }
      });
      var next = segButton('', null, function () { step(1); }, 'Next ' + unit); next.appendChild(icon('forward'));
      [prev, today, next].forEach(function (x) { x.removeAttribute('aria-pressed'); nav.appendChild(x); });
      left.appendChild(nav);
      var pl = periodLabel();
      if (pl) left.appendChild(el('span', 'cp-period', pl));

      var modes = el('div', 'chip-group cp-modes');
      [['week', 'Week'], ['month', 'Month'], ['list', 'List']].forEach(function (m) {
        modes.appendChild(segButton(m[1], S.mode === m[0], function () { setMode(m[0]); }));
      });
      right.appendChild(modes);
    } else if (S.view === 'ideas') {
      var arch = el('div', 'chip-group');
      [[false, 'Open'], [true, 'Archived']].forEach(function (m) {

        add.appendChild(icon('add')); add.appendChild(el('span', null, 'Add'));
        add.setAttribute('aria-label', 'Add item');
        add.addEventListener('click', function () { openEditor(null, defaultAddDate()); });
        right.appendChild(add);

  }
  function defaultAddDate() {
    var r = currentRange(), t = todayYmd();
    if (S.mode === 'month') { var m = monthOf(S.cursor); r = m; }
    return (t >= r.from && t <= r.to) ? t : r.from;
  }
  function step(n) {
    if (endless()) {
      var t = fromYmd(topVisibleDate());
      /* Back from mid-month goes to the 1st of this month first, as a calendar would. */
      var target = n < 0 && t.getDate() > 1 ? new Date(t.getFullYear(), t.getMonth(), 1) : new Date(t.getFullYear(), t.getMonth() + n, 1);
      goTo(ymd(target));
      return;
    }
    var c = S.cursor;
    S.cursor = S.mode === 'month' ? new Date(c.getFullYear(), c.getMonth() + n, 1) : addDays(c, 7 * n);
    S.monthSel = null; S.addingOn = null; S.addForm = null;

  /* Switching view keeps your place: the date at the top of the List, or

  function setMode(mode, date) {
    if (S.mode === mode && !date) return;

    var at = date || (wasEndless ? topVisibleDate() : ymd(S.cursor));
    S.mode = mode; S.addingOn = null; S.addForm = null; S.monthSel = null;
    S.selecting = false; S.selected = {};
    S.emptyRun = { top: 0, bottom: 0 };
    savePrefs(); renderBar(); renderFilters();

      if (wasEndless) { S.scrollTo = at; render(); return; }
      if (at < S.from || at > S.to || !S.from) { startAround(at); S.scrollTo = at; listen(); }
      else { S.scrollTo = at; listen(true); }
    } else {

  /* ── Summary line ──────────────────────────────────────────────────── */
  function renderSummary(all) {
    var box = document.getElementById('cpSummary');
    box.innerHTML = '';
    /* Only counts that ask for action. Who-wrote-what belongs in Reports. */
    /* The endless views load more as you scroll, so a total there would just
       grow; they count only the unassigned stories from today on. */
    var scrolling = endless(), today = todayYmd();
    var unassigned = 0;
    all.forEach(function (it) {
      if (scrolling && it.date < today) return;
      if (!it.author && !it.authorOther && it.lane === 'web' && it.status === 'planned') unassigned++;
    });
    function part(label, n) { var s = el('span'); s.appendChild(el('b', null, String(n))); s.appendChild(document.createTextNode(' ' + label)); box.appendChild(s); }
    if (!scrolling) part(all.length === 1 ? 'item' : 'items', all.length);
    if (unassigned) part(scrolling ? 'unassigned from today' : 'unassigned', unassigned);
    renderKey(all);
  }
  /* The colour key, with how many of each. Month counts the month itself,
     not the neighbouring days at the grid's edges. */
  function renderKey(all) {
    if (S.colourBy === 'category') return;
    var box = document.getElementById('cpSummary');
    var scope = all;
    if (S.mode === 'month') { var m = monthOf(S.cursor); scope = all.filter(function (it) { return it.date >= m.from && it.date <= m.to; }); }
    var groups = {}, order = [];
    scope.forEach(function (it) {
      var c = colourOf(it);
      if (!groups[c.key]) { groups[c.key] = { c: c, n: 0 }; order.push(c.key); }
      groups[c.key].n++;
    });
    order.sort(function (a, b) { return groups[b].n - groups[a].n; });
    var key = el('span', 'cp-key');
    key.appendChild(el('span', 'cp-key__lead', S.mode === 'week' ? 'This week:' : S.mode === 'month' ? MON[S.cursor.getMonth()] + ':' : 'Loaded:'));
    order.forEach(function (k) {
      var g = groups[k], it = el('span', 'cp-key__item');
      var sw = el('i', 'cp-key__sw'); if (g.c.hex) sw.style.background = g.c.hex; else sw.classList.add('is-none');
      it.appendChild(sw); it.appendChild(document.createTextNode(g.c.label + ' '));
      it.appendChild(el('b', null, String(g.n)));
      key.appendChild(it);
    });
    box.appendChild(key);
  }

  /* ── Item chip ─────────────────────────────────────────────────────── */

        else if (!(cur && cur >= slot.from && cur < slot.to)) time = slot.from;
      }
      moveItem(id, date, time);

  function isSocial(it) { var k = kindOf(it); return k === 'video' || k === 'graphic' || k === 'social'; }
  function renderWeek(byDate) {

      var x = el('button', 'btn btn--ghost btn--sm', 'Remove'); x.type = 'button';

      var act = el('label', 'cp-check'); var ac = el('input'); ac.type = 'checkbox'; ac.checked = a.active !== false;
      act.appendChild(ac); act.appendChild(document.createTextNode('Active'));

    authorList(true).forEach(function (a) { authList.appendChild(authRow(a.key, a)); });
    ap.appendChild(authList);
    /* Initials on items (the import, or typed before Settings had them) that

    loadAll(function (all) {

      authRows.forEach(function (r) { if (r.key) have[r.key] = true; });

      all.forEach(function (it) { [it.author].concat(asArray(it.coAuthors)).forEach(function (k) { if (k) used[k] = (used[k] || 0) + 1; }); });

      });

      NL.ensureAuth().then(function () {
        NL.writeAudit('content_plan_config', 'Settings saved');
        return db.ref(ROOT + '/config').update({ categories: cats, authors: auths });

  /* One-off load of the sheet export (scripts/content-plan-import.py).
     Takes upload-items.json or upload-days.json; merges, never replaces. */
  function buildImportPane(pane) {
    /* A fresh start before a full re-import: removes every item and day note
       and resets the categories. Authors, ideas and cup fixtures stay. */
    var wipe = el('button', 'btn btn--danger btn--sm', 'Clear the plan'); wipe.type = 'button';
    wipe.addEventListener('click', function () {
      NL.prompt('This deletes every item and day note, and resets the categories. Authors, ideas and cup fixtures stay. Type clear to go ahead.', { title: 'Clear the plan', placeholder: 'clear' }).then(function (v) {
        if (String(v || '').trim().toLowerCase() !== 'clear') return;
        return NL.ensureAuth().then(function () {
          NL.writeAudit('content_plan_clear', 'Items, days and categories cleared before re-import');
          var u = {}; u.items = null; u.days = null; u['config/categories'] = DEFAULT_CATEGORIES;
          return db.ref(ROOT).update(u);
        }).then(function () { S.items = {}; S.days = {}; S.allItems = null; NL.toast('Plan cleared'); listen(); });
      }).catch(fail);
    });
    pane.appendChild(field('Start again', wipe, true, 'Before a full re-import.'));
    pane.appendChild(el('p', 'form-hint', 'Load upload-items.json, then upload-days.json, from the import script. Records merge by id.'));
    var file = el('input'); file.type = 'file'; file.accept = '.json,application/json'; file.id = 'cpImportFile';
    pane.appendChild(field('Import file', file, true));
    var status = el('div', 'form-hint'); pane.appendChild(status);
    file.addEventListener('change', function () {
      var f = file.files && file.files[0]; if (!f) return;
      var reader = new FileReader();
      reader.onload = function () {
        var data;
        try { data = JSON.parse(reader.result); } catch (e) { NL.toast('That file isn’t valid JSON', 'error'); return; }
        var keys = Object.keys(data || {});
        if (!keys.length) { NL.toast('The file is empty', 'error'); return; }
        var kind = keys.every(function (k) { return /^\d{4}-\d{2}-\d{2}$/.test(k); }) ? 'days'
          : keys.every(function (k) { return data[k] && data[k].date && data[k].lane; }) ? 'items' : null;
        if (!kind) { NL.toast('That isn’t an items or days file from the import script', 'error'); return; }
        NL.confirm('Load ' + keys.length + ' ' + kind + ' into the plan?', { title: 'Import', confirmText: 'Import' }).then(function (ok) {
          if (!ok) return;
          var chunks = [];
          for (var i = 0; i < keys.length; i += 200) chunks.push(keys.slice(i, i + 200));

  /* ── FA Cup / FA Trophy fixtures: pasted from a spreadsheet ───────────
     There is no feed for these (NLS carries 89/372/373/1275 only). Six
     pasted columns: date & time, round, competition, home, (score, blank),
     away. A fixture's key is competition + round + home + away, so pasting
     a moved tie again updates its date instead of adding a second copy. */
  var CUP_COMPS = [
    { key: 'facup',    label: 'FA Cup',    short: 'FAC' },
    { key: 'fatrophy', label: 'FA Trophy', short: 'FAT' }
  ];
  var MONTHS3 = MON.map(function (m) { return m.slice(0, 3).toLowerCase(); });
  function slugKey(s) { return String(s || '').toLowerCase().replace(/&/g, 'and').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40); }
  function cupKey(f) { return [f.comp, slugKey(f.round) || 'r', slugKey(f.home), 'v', slugKey(f.away)].join('_'); }
  /* "17/10/2026 15:00", "Sat 17/10/26 12:30", "2026-10-17 15:00", "17 Oct 2026 3:00" */
  function parseWhen(s) {
    s = String(s || '').trim();
    var time = null, tm = /(\d{1,2}):(\d{2})\s*(am|pm)?/i.exec(s);
    if (tm && +tm[1] < 24 && +tm[2] < 60) {
      var hh = +tm[1], ap = (tm[3] || '').toLowerCase();
      /* No football kicks off between 1am and 10am: "3:00" means 15:00. */
      if (ap === 'pm' && hh < 12) hh += 12;
      else if (ap !== 'am' && hh >= 1 && hh <= 9) hh += 12;
      time = pad2(hh) + ':' + tm[2]; s = s.replace(tm[0], ' ');
    }
    var y, m, d, x;
    if ((x = /(\d{4})-(\d{1,2})-(\d{1,2})/.exec(s))) { y = +x[1]; m = +x[2]; d = +x[3]; }
    else if ((x = /(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/.exec(s))) { d = +x[1]; m = +x[2]; y = +x[3]; }
    else if ((x = /(\d{1,2})(?:st|nd|rd|th)?\s+([a-z]{3,})\.?\s+(\d{2,4})/i.exec(s))) {
      d = +x[1]; m = MONTHS3.indexOf(x[2].slice(0, 3).toLowerCase()) + 1; y = +x[3];
    }
    if (!y || !m || !d) return null;
    if (y < 100) y += 2000;
    var dt = new Date(y, m - 1, d);
    if (dt.getMonth() !== m - 1 || dt.getDate() !== d) return null;
    return { date: ymd(dt), time: time };
  }
  function parseComp(s) {
    var t = String(s || '').toLowerCase().trim();
    if (t === 'fat') return 'fatrophy';
    if (t === 'fac') return 'facup';
    if (t.indexOf('trophy') >= 0) return 'fatrophy';
    if (t.indexOf('cup') >= 0) return 'facup';
    return null;
  }
  /* Returns [{ok, row, fixture|reason}] */
  function parseCupPaste(text) {
    var lines = String(text || '').replace(/\r/g, '').split('\n');
    var out = [];
    lines.forEach(function (line, i) {
      if (!line.trim()) return;
      var c = line.indexOf('\t') >= 0 ? line.split('\t') : (NL.csvParse(line)[0] || []);
      c = c.map(function (v) { return String(v == null ? '' : v).trim(); });
      var when = parseWhen(c[0]);
      if (!when) { out.push({ ok: false, row: i + 1, raw: line, reason: i === 0 ? 'Header row, skipped' : 'Can’t read the date' }); return; }
      var comp = parseComp(c[2]);
      if (!comp) { out.push({ ok: false, row: i + 1, raw: line, reason: 'Competition isn’t FA Cup or FA Trophy' }); return; }
      var home = c[3] || '', away = c.length >= 6 ? c[5] : (c[4] || '');
      if (!home || !away) { out.push({ ok: false, row: i + 1, raw: line, reason: 'Missing a team' }); return; }
      if (home.length > 80 || away.length > 80) { out.push({ ok: false, row: i + 1, raw: line, reason: 'A team name is over 80 characters' }); return; }
      var score = c.length >= 6 ? c[4].replace(/\s+/g, ' ').slice(0, 30) : '';
      out.push({ ok: true, row: i + 1, fixture: { date: when.date, time: when.time, round: c[1] || '', comp: comp, home: home, away: away, score: score } });
    });
    return out;
  }
  function cupCounts(date) {
    var out = {};
    Object.keys(S.cup || {}).forEach(function (k) {
      var f = S.cup[k];
      if (f && f.date === date) out[f.comp] = (out[f.comp] || 0) + 1;
    });
    return out;
  }
  function cupOnDate(date) {
    return Object.keys(S.cup || {}).map(function (k) { var f = Object.assign({}, S.cup[k]); f.id = k; return f; })
      .filter(function (f) { return f.date === date; })
      .sort(function (a, b) { return (a.comp + (a.time || '') + a.home).localeCompare(b.comp + (b.time || '') + b.home); });
  }
  function cupLine(f) {
    var c = lookup(CUP_COMPS, f.comp) || { short: '?' };
    return (f.time ? f.time + ' ' : '') + c.short + (f.round ? ' ' + f.round : '') + ' – ' + f.home + ' v ' + f.away;
  }
