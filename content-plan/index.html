<!DOCTYPE html>
<!--
  NL Tools — Content Plan
  Version: v2.4 (16/10/2026)
  File: /content-plan/index.html

  Plans and records everything the media team publishes: website stories,
  social-first posts, club obligations and (later) CRM. Replaces the
  "Content plan" Google Sheet.

  Storage (RTDB):
    app-data/media-content-plan/items/{id}      one record per planned/published item
                                                 (indexed on date; queried by visible range)
    app-data/media-content-plan/days/{date}     notes + manualMatches {faCup, faTrophy}
    app-data/media-content-plan/cupFixtures/{key}  FA Cup / FA Trophy fixtures pasted from a
                                                 spreadsheet: date, time, round, comp
                                                 (facup | fatrophy), home, away. Key =
                                                 comp_round_home_v_away, so a re-paste updates.
    app-data/media-content-plan/ideas/{id}      undated ideas: title, notes, kind, category,
                                                 addedBy/addedByName, archived. Scheduling one
                                                 creates an item and deletes the idea.
    app-data/media-content-plan/config/         categories {key: {label, colour (#hex) | token, order}}, authors
                                                 (kinds, platforms and statuses are fixed in code below)

  Kind: one label per item — Article, Video, Graphic, Club, CRM. Where it goes
  (website + social platforms) is separate: item.platforms.
  Stored as lane (web | social | club | crm) + format (vid | gfx | ad | otd)
  so the sheet's AD / OTD detail survives; the UI only shows the kind.
    tools/media-content-plan                    tool registration (label, defaults)

  Access (auth-guard → session.toolLevel):
    admin  → add, edit, drag, mark published, settings
    access → read-only calendar and list
    superadmin also gets Settings → Import (one-off load of the sheet export).
  Rules mirror this in system/rtdb/rules.snapshot.json.

  Match counts: National / North / South / NL Cup are counted from the NLS
  feed per season and held in memory only. FA Cup and FA Trophy are not in
  that feed, so they are typed per day (days/{date}/manualMatches).

  Technical changelog
    v1.0 (16/10/2026) – First build (phase 1 of the content-plan spec v1.1).
                        Calendar (month + week), list view with
                        inline and bulk edit, filters, add/edit/delete, drag and
                        drop, mark published, settings for categories and
                        authors, superadmin JSON import, NLS match counts.
                        No campaign highlight and no per-platform tracking, by
                        decision (16/10/2026): kind says enough.
    v1.1 (16/10/2026) – Week view is an hourly timeline (06:00–23:00) instead of
                        five slots: dropping on an hour sets HH:00, an item already
                        in that hour keeps its minutes. Empty hours hide until a
                        drag starts. Time inputs step in 5 minutes.
                        Social items without a category get their own colour group
                        (--cp-social, slate); category is optional for social and
                        the add form no longer carries a remembered web category onto them.
    v1.2 (16/10/2026) – No strikethrough: published = faded + green tick (the tick
                        toggles for editors). Summary line keeps only counts that
                        ask for action; per-author tallies wait for Reports.
                        Ideas tab: undated ideas with Schedule / Edit / Archive.
    v1.3 (16/10/2026) – Chip carries one signal per thing: category = colour,
                        kind = glyph (sprite v1.3: article, play, image, shield,
                        email), published = green tick at full colour (no fade,
                        no strike). Planned items show the tick on hover for
                        editors. Initials only. Routine/original is recorded in
                        the item only: no star, no fade, no type filters. Needs
                        review removed from the UI; saving an item clears the
                        flag the importer set.
    v1.4 (16/10/2026) – Platforms back: platforms {x, facebook, instagram,
                        tiktok, linkedin, youtube} as booleans. Grey logo row on the
                        chip (sprite's filled brand marks), icon toggles in the add
                        form / editor / list, a platform filter and a "Posted on"
                        CSV column. New items default to X + Facebook, then the
                        last-used set per user. Sheet imports carry none.
    v1.5 (16/10/2026) – The website is a platform, not a kind: kind = what it is
                        (Article, Video, Graphic, Club, CRM; key 'web' kept for
                        Article so no data moves), platforms gain 'website'
                        (sprite icon-website). Defaults follow the kind: Article →
                        Website, social → X + Facebook; each user's last set is
                        remembered per kind. Match counts are pills in the
                        division colours (--div-*); FA Cup / Trophy pills are
                        outlined because they are typed in, not fed.
    v1.6 (16/10/2026) – Cup fixtures: paste FA Cup / FA Trophy rows from a spreadsheet
                        (date & time, round, competition, home, blank, away), with a
                        preview that says new / moved / unchanged / skipped and why.
                        Saved fixtures can be edited or deleted one by one. FAC / FAT
                        pills count them per day; the day window lists the ties.
                        Typed-in counts from the sheet import still show where a
                        day has no pasted fixtures. Day window loses its count boxes.
    v1.7 (16/10/2026) – Three-letter competition codes everywhere: NAT, NOR,
                        SOU, NLC, FAC, FAT. The paste also accepts FAC / FAT as the
                        competition.
    v1.8 (16/10/2026) – Colour groups revised: NL Cup joins Football (the
                        Cups group goes; a stored 'cups' reads as football). League
                        and Statements split. Two solid groups with white ink:
                        Statements (--navy) and 3UP (--navy-900, effectively black).
                        Trust is yellow (--yellow / --yellow-light, amber ink for
                        contrast); U19 keeps the red as "Youth". Chip and idea text
                        take --g-fg / --g-muted / --g-ink so solid groups invert.
    v1.9 (16/10/2026) – Match pills recoloured to the team's spreadsheet, in pastels:
                        NAT orange, NOR yellow, SOU blue, NLC purple, FAC pink-red,
                        FAT grey. The --div-* division tokens no longer apply here.
    v2.0 (16/10/2026) – Categories are the tool's own list, not the CMS's:
                        Football, Awards, League, Statements, Trust, U19, 3UP, each
                        with its own colour. Admins add, rename, recolour (colour
                        picker) and remove them in Settings. Any item, any kind, can
                        take any category. Every categorised item is a solid fill;
                        ink flips white/dark by the fill's luminance. Items store the
                        category KEY; older values (labels, and the sheet's National /
                        North / South / NL Cup) resolve to Football. Colour groups and
                        the colour filter are gone: the category is the colour.
    v2.1 (16/10/2026) – Cup fixtures move into Settings as a tab (paste at the top,
                        saved fixtures below) and off the calendar toolbar.
    v2.2 (16/10/2026) – Canon review (tidy-tim) fixes: pills at --text-xs (12px floor);
                        inputs keep the 16px phone floor (no !important); FAT pill ink
                        --text-muted (not --proj-8); chip is a plain container with an
                        inner <button> to open it, so the tick button is no longer
                        nested in a role=button; .toolbar / .filter-bar / .form-hint /
                        .btn--icon replace local look-alikes; selects inside .form-group
                        drop .nl-select; on-screen dates via NL.formatDateShort and
                        NL.parseDate; ink picked by contrast against --text and
                        --white; sortable headers hold a button; Settings tabs carry
                        tablist / tab / aria-selected; icons on the 16px ladder; no
                        invisible spinner; waffle trimmed; changelog corrected.
    v2.3 (16/10/2026) – Author picker: one dropdown plus a + that adds another (the new
                        one leaves out anyone already picked), × to remove; "Other…"
                        for a guest writer stays on the first. Used in the add form and
                        the editor; replaces the co-author tick boxes.
    v2.4 (16/10/2026) – Each author box is a typeahead on the canon .club-picker look:
                        type to filter by name or initials, pick, or "Use … as
                        entered" for a guest (replaces "Other…"). Picked authors are
                        stored by key; typed names as written (co-authors too).
-->

<style>
  /* #pageWrap default hide is in nl-brand.css; auth-guard reveals with
     style.display = 'block'. Don't clear with '' — would re-trigger the
     brand rule and re-hide the page. */

  /* ── Category colour ─────────────────────────────────────────────────
     Each category carries its own colour (Settings → Categories). The chip
     gets it inline as --g and a cp-on-dark / cp-on-light class chosen from
     the colour's luminance, so any picked colour stays readable.
     Defaults are brand tokens; a picked colour is stored as #hex in RTDB. */
  :root {
    --cp-none:         var(--navy-300); --cp-none-bg:     var(--white);
  }

  .cp-period { font-size: var(--text-md); font-variation-settings: 'wght' 800; color: var(--navy); min-width: 10ch; }
  #cpFilters select { max-width: 100%; }
  .cp-check { display: inline-flex; align-items: center; gap: 6px; font-size: var(--text-sm); color: var(--text-muted); cursor: pointer; }
  .cp-summary { font-size: var(--text-xs); color: var(--text-muted); margin-bottom: 10px; display: flex; flex-wrap: wrap; gap: 4px 14px; }
  .cp-summary b { color: var(--text); font-variation-settings: 'wght' 700; }

  /* Calendar: one row per day, a single stack of items. */
  .cp-cal { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); }
  .cp-day { display: grid; grid-template-columns: minmax(96px, 150px) 1fr; gap: 10px; padding: 8px 12px; border-top: 1px solid var(--navy-100); min-width: 0; }
  .cp-day:first-child { border-top: none; }
  .cp-day.is-weekend { background: var(--navy-50); }
  .cp-day.is-today { box-shadow: inset 3px 0 0 var(--primary); }
  .cp-day.is-drop, .cp-slot.is-drop { outline: 2px dashed var(--navy-300); outline-offset: -2px; }
  .cp-dh { display: grid; gap: 2px; align-content: start; font-size: var(--text-xs); color: var(--text-muted); min-width: 0; }
  .cp-dh__top { display: flex; align-items: center; gap: 6px; }
  .cp-dh__date { font-size: var(--text-sm); color: var(--text); font-variation-settings: 'wght' 800; font-variant-numeric: tabular-nums; }
  .cp-day.is-today .cp-dh__date { color: var(--primary); }
  /* Match pills: one pastel per competition (NAT orange, NOR yellow, SOU blue,
     NLC purple, FAC pink-red, FAT grey), matching the team's spreadsheet. */
  .cp-mpills { display: flex; flex-wrap: wrap; gap: 3px; }
  .cp-mpill { display: inline-flex; align-items: center; gap: 3px; padding: 1px 6px; border-radius: var(--radius-pill);
    font-size: var(--text-xs); font-variation-settings: 'wght' 700; font-variant-numeric: tabular-nums; line-height: 1.5; white-space: nowrap;
    background: var(--mp-bg); color: var(--mp-fg); border: 1px solid var(--mp-edge); }
  /* Pastel pills in the competition colours from the media team's sheet. */
  .cp-mpill--nl  { --mp-bg: var(--amber-light);  --mp-edge: var(--amber);    --mp-fg: var(--amber-deep); }
  .cp-mpill--n   { --mp-bg: var(--yellow-light); --mp-edge: var(--yellow);   --mp-fg: var(--text); }
  .cp-mpill--s   { --mp-bg: var(--blue-light);   --mp-edge: var(--blue);     --mp-fg: var(--blue); }
  .cp-mpill--cup { --mp-bg: var(--purple-light); --mp-edge: var(--purple);   --mp-fg: var(--purple); }
  .cp-mpill--fac { --mp-bg: var(--primary-50);   --mp-edge: var(--primary-400); --mp-fg: var(--primary); }
  .cp-mpill--fat { --mp-bg: var(--off-white);    --mp-edge: var(--navy-300); --mp-fg: var(--text-muted); }
  .cp-dh__notes { color: var(--text); overflow-wrap: anywhere; }
  .cp-dh__btn { background: none; border: none; padding: 2px; cursor: pointer; color: var(--text-muted); border-radius: var(--radius-sm); display: inline-flex; }
  .cp-dh__btn:hover { color: var(--primary); background: var(--off-white); }
  .cp-dh__btn:focus-visible { outline: none; box-shadow: var(--focus-ring); }
  .cp-dh__btn svg { width: 16px; height: 16px; }
  .cp-stack { display: grid; gap: 4px; align-content: start; min-width: 0; min-height: 26px; }
  .cp-split { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; min-width: 0; }
  .cp-split__col { display: grid; gap: 4px; align-content: start; min-width: 0; }
  .cp-split__head { font-size: var(--text-xs); color: var(--text-muted); text-transform: uppercase; letter-spacing: var(--tracking-wide); }
  .cp-empty-day { font-size: var(--text-xs); color: var(--navy-300); }

  /* Week view: an hourly timeline inside each day. */
  .cp-slots { display: grid; gap: 4px; min-width: 0; }
  .cp-slot { display: grid; grid-template-columns: 64px 1fr; gap: 8px; align-items: start; padding: 3px 0; border-top: 1px dotted var(--navy-100); min-width: 0; }
  .cp-slot:first-child { border-top: none; }
  /* Empty hours only appear while something is being dragged, as drop targets. */
  .cp-slot.is-empty { display: none; }
  .cp-cal.is-dragging .cp-slot.is-empty { display: grid; }
  .cp-slot__label { font-size: var(--text-xs); color: var(--text-muted); font-variant-numeric: tabular-nums; padding-top: 4px; }

  /* Item chip. Fill = category colour, glyph = kind, tick = published.
     --g edge, --g-bg fill, --g-fg text, --g-muted secondary, --g-ink glyph, --g-tick done.
     Uncategorised chips stay white; categorised ones are solid (see paint()). */
  .cp-item, .cp-idea { --g: var(--cp-none); --g-bg: var(--cp-none-bg); --g-fg: var(--text); --g-muted: var(--text-muted); --g-ink: var(--g); --g-tick: var(--green); }
  .cp-item {
    display: flex; align-items: center; gap: 6px; padding: 4px 8px; border-radius: var(--radius-sm);
    background: var(--g-bg); border: 1px solid var(--navy-100); border-left: 3px solid var(--g);
    font-size: var(--text-sm); color: var(--g-fg); cursor: pointer; min-width: 0; text-align: left; width: 100%; font-family: var(--font); }
  .cp-item:hover { border-color: var(--g); }
  .cp-item:focus-visible { outline: none; box-shadow: var(--focus-ring); }
  .cp-item[draggable="true"] { cursor: grab; }
  .cp-item.is-dragging { opacity: .4; }
  .cp-item__t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cp-item__time { font-size: var(--text-xs); font-variant-numeric: tabular-nums; color: var(--g-muted); flex: none; }
  .cp-plats { display: inline-flex; gap: 3px; flex: none; color: var(--g-muted, var(--text-muted)); }
  .cp-plat-toggles { display: flex; flex-wrap: wrap; gap: 4px; }
  .cp-plat { color: var(--navy-300); }
  .cp-plat[aria-pressed="true"] { background: var(--navy); border-color: var(--navy); color: var(--white); }
  .cp-item__ini { min-width: 3.2ch; text-align: right; font-size: var(--text-xs); font-variation-settings: 'wght' 800; color: var(--g-muted); flex: none; max-width: 9ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* The chip is a plain container (draggable); this button opens the item. */
  .cp-item__open { display: flex; align-items: center; gap: 6px; flex: 1; min-width: 0; padding: 0; margin: 0;
    background: none; border: none; color: inherit; text-align: left; cursor: pointer;
    font-family: var(--font); font-size: inherit; }
  .cp-item__open:focus-visible { outline: none; box-shadow: var(--focus-ring); border-radius: var(--radius-sm); }
  .cp-item svg { flex: none; }
  /* Done = a green tick, at full colour. No fade, no strike (decided 16/10/2026).
     Planned items show the tick only on hover/focus, for editors; always on touch. */
  .cp-item.is-dropped { opacity: .45; }
  .cp-item.is-dropped .cp-item__t { font-style: italic; }
  .cp-tick { opacity: 0; }
  .cp-item:hover .cp-tick, .cp-item:focus-within .cp-tick, .cp-item.is-published .cp-tick { opacity: 1; }
  @media (hover: none) { .cp-tick { opacity: 1; } }
  .cp-item.is-published .cp-tick, .cp-done { color: var(--g-tick, var(--green)); }
  .cp-done { display: inline-flex; flex: none; }
  .cp-tick { background: none; border: none; padding: 0; color: var(--g-muted); cursor: pointer; display: inline-flex; flex: none; }
  .cp-tick:hover { color: var(--green); }
  .cp-tick:focus-visible { outline: none; box-shadow: var(--focus-ring); border-radius: var(--radius-sm); }

  .cp-glyph { flex: none; color: var(--g-ink, var(--g, var(--navy))); }

  .cp-cat.cp-item, .cp-cat.cp-idea { --g-bg: var(--g); border-color: var(--g); }
  .cp-on-dark  { --g-fg: var(--white); --g-ink: var(--white); --g-tick: var(--white); --g-muted: color-mix(in srgb, var(--white) 78%, var(--g)); }
  .cp-on-light { --g-fg: var(--text);  --g-ink: var(--text);  --g-tick: var(--text);  --g-muted: color-mix(in srgb, var(--text) 72%, var(--g)); }
  .cp-swatch { width: 40px; height: 32px; padding: 2px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--white); cursor: pointer; }

  /* Inline add form inside a day. */
  .cp-add { display: grid; gap: 8px; padding: 10px; background: var(--white); border: 1px solid var(--navy-200); border-radius: var(--radius); min-width: 0; }
  .cp-add__row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; min-width: 0; }
  .cp-add input[type="text"], .cp-add input[type="time"], .cp-in {
    font-family: var(--font); font-size: var(--text-sm); color: var(--text);
    border: 1px solid var(--border); border-radius: var(--radius); padding: .45rem .6rem; background: var(--white); min-width: 0; }
  .cp-add input[type="text"]:focus, .cp-in:focus { outline: none; border-color: var(--primary); box-shadow: var(--focus-ring); }
  .cp-add__title { width: 100%; }
  .cp-grow { flex: 1; }
  /* Canon's 16px phone floor, so iOS doesn't zoom on focus. */
  @media (max-width: 700px) { .cp-in, .cp-add input { font-size: 16px; } }

  /* Modals */
  .cp-link-results { display: grid; gap: 2px; max-height: 180px; overflow-y: auto; margin-top: 6px; }
  .cp-link-results button { text-align: left; background: var(--off-white); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 4px 8px; font-family: var(--font); font-size: var(--text-sm); cursor: pointer; }
  .cp-link-results button:hover { border-color: var(--navy-300); }
  .cp-readonly dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; margin: 0; font-size: var(--text-sm); }
  .cp-readonly dt { color: var(--text-muted); }
  .cp-readonly dd { margin: 0; overflow-wrap: anywhere; }
  .cp-settings-row { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; align-items: center; padding: 6px 0; border-top: 1px solid var(--navy-100); }
  .cp-settings-row--authors { grid-template-columns: 70px 1fr auto auto; }
  .cp-settings-row--cat { grid-template-columns: auto 1fr 70px auto; }
  .cp-settings-row .cp-in, .cp-settings-row select { width: 100%; }

  /* List view */
  .cp-list-range { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .cp-bulk { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 12px; margin-bottom: 10px; background: var(--navy-50); border: 1px solid var(--navy-100); border-radius: var(--radius); font-size: var(--text-sm); }
  th.cp-sort button { background: none; border: none; padding: 0; cursor: pointer; color: inherit;
    font-family: inherit; font-size: inherit; font-variation-settings: inherit; letter-spacing: inherit; text-transform: inherit; }
  th.cp-sort button:focus-visible { outline: none; box-shadow: var(--focus-ring); }
  th.cp-sort { cursor: pointer; white-space: nowrap; }
  th.cp-sort[aria-sort="ascending"]::after { content: ' ▲'; }
  th.cp-sort[aria-sort="descending"]::after { content: ' ▼'; }
  .cp-list-title { min-width: 220px; }
  .cp-list-title button { background: none; border: none; padding: 0; text-align: left; font-family: var(--font); font-size: var(--text-sm); color: var(--navy); cursor: pointer; }
  .cp-list-title button:hover { text-decoration: underline; }
  .cp-listwrap select { padding-top: .25rem; padding-bottom: .25rem; }
  /* Ideas */
  .cp-ideas { display: grid; gap: 12px; }
  .cp-idea-list { display: grid; gap: 6px; }
  .cp-idea {
    display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: start; padding: 10px 12px;
    background: var(--g-bg); border: 1px solid var(--navy-100); border-left: 3px solid var(--g); border-radius: var(--radius-sm); min-width: 0; }
  .cp-idea.is-archived { opacity: .55; }
  .cp-idea__main { display: grid; gap: 4px; min-width: 0; }
  .cp-idea__title { display: flex; gap: 6px; align-items: center; font-size: var(--text-sm); font-variation-settings: 'wght' 700; color: var(--g-fg); min-width: 0; overflow-wrap: anywhere; }
  .cp-idea__notes { font-size: var(--text-sm); color: var(--g-muted); white-space: pre-line; overflow-wrap: anywhere; }
  .cp-idea__meta { font-size: var(--text-xs); color: var(--g-muted); }
  .cp-idea__actions { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
  .cp-span { grid-column: 1 / -1; }
  .cp-authors { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-width: 0; }
  .cp-authors__row { display: flex; gap: 4px; align-items: center; min-width: 0; }
  .cp-author-combo { width: 14rem; max-width: 100%; }
  .cp-flush { margin-bottom: 6px; }
  .cp-nowrap { white-space: nowrap; }
  .cp-ties { display: grid; gap: 2px; margin-top: 8px; font-size: var(--text-sm); }
  .cp-tie { padding: 3px 0; border-top: 1px solid var(--navy-100); overflow-wrap: anywhere; }
  .cp-cup__paste { width: 100%; white-space: pre; overflow-wrap: normal; overflow-x: auto; }
  #cpCupPaste { font-family: var(--font-mono); }   /* id beats .form-group textarea */
  .cp-cup__preview { display: grid; gap: 6px; margin-top: 10px; }
  .cp-cup__saved { margin-top: 24px; }
  .cp-loading { padding: 20px; color: var(--text-muted); display: flex; gap: 8px; align-items: center; }

  @media (max-width: 640px) {
    .cp-day { grid-template-columns: 1fr; gap: 6px; }
    .cp-idea { grid-template-columns: 1fr; }
    .cp-idea__actions { justify-content: flex-start; }
    .cp-dh { grid-template-columns: 1fr; }
    .cp-split { grid-template-columns: 1fr; }
    .cp-slot { grid-template-columns: 52px 1fr; }

  }
</style>
</head>
<body>

<!-- Topbar — auto-rendered by /system/nl-topbar.js from window.NL_TOOL -->
<div id="nlTopbar"></div>

<div id="pageWrap">
  <div class="page">

    <div class="tabs" role="tablist" id="cpTabs">
      <button class="tab active" type="button" role="tab" data-view="calendar" aria-selected="true">Calendar</button>
      <button class="tab" type="button" role="tab" data-view="list" aria-selected="false">List</button>
      <button class="tab" type="button" role="tab" data-view="ideas" aria-selected="false">Ideas</button>
    </div>

    <div class="toolbar" id="cpBar"></div>
    <div class="filter-bar" id="cpFilters"></div>
    <div class="cp-summary" id="cpSummary"></div>
    <div id="cpBulk"></div>
    <div id="cpMain"><div class="cp-loading">Loading the plan…</div></div>

  </div>
</div>

<!-- Main app -->
<script>
(function () {
  'use strict';

  var TOOL_KEY = 'media-content-plan';
  var ROOT = 'app-data/' + TOOL_KEY;

  /* ── Fixed vocab (code, not config) ───────────────────────────────────
     Kinds, platforms and statuses are fixed here. Categories are config. */
  /* Starting categories. token = a brand colour used until someone picks one. */
  var DEFAULT_CATEGORIES = {
    football:   { label: 'Football',   token: '--blue',     order: 1 },
    awards:     { label: 'Awards',     token: '--purple',   order: 2 },
    league:     { label: 'League',     token: '--navy-400', order: 3 },
    statements: { label: 'Statements', token: '--navy',     order: 4 },
    trust:      { label: 'Trust',      token: '--yellow',   order: 5 },
    u19:        { label: 'U19',        token: '--primary',  order: 6 },
    '3up':      { label: '3UP',        token: '--navy-900', order: 7 }
  };
  /* What older values mean now: the sheet's CMS categories fold into Football. */
  var LEGACY_CATEGORY = { national: 'football', north: 'football', south: 'football', 'nl cup': 'football', nlcup: 'football' };
  /* Kind = what the item is. One label, shown as the chip's badge. */
  var KINDS = [
    { key: 'web',     label: 'Article',        glyph: 'article' },
    { key: 'video',   label: 'Video',          glyph: 'play' },
    { key: 'graphic', label: 'Graphic',        glyph: 'image' },
    { key: 'club',    label: 'Club',           glyph: 'shield' },
    { key: 'crm',     label: 'CRM',            glyph: 'email' }
  ];
  /* A few sheet items were social with no video/graphic marker. */
  var KIND_UNSET = { key: 'social', label: 'Social (video or graphic?)', glyph: 'chat' };  // a few sheet items
  /* Where an item is posted. Icons are the sprite's brand marks. */
  var PLATFORMS = [
    { key: 'website',   label: 'Website' },
    { key: 'x',         label: 'X' },
    { key: 'facebook',  label: 'Facebook' },
    { key: 'instagram', label: 'Instagram' },
    { key: 'tiktok',    label: 'TikTok' },
    { key: 'linkedin',  label: 'LinkedIn' },
    { key: 'youtube',   label: 'YouTube' }
  ];
  /* Starting set for a new item, by kind, until the user's own last set for that kind exists. */
  function defaultPlatforms(kind, last) {
    var mine = last && last.platformsByKind && last.platformsByKind[kind];
    if (mine) return mine;
    if (kind === 'web') return { website: true };
    if (kind === 'video' || kind === 'graphic') return { x: true, facebook: true };
    return {};
  }
  function platformsOn(it) { return PLATFORMS.filter(function (p) { return it.platforms && it.platforms[p.key]; }); }
  function platformsObj(on) { var o = {}; PLATFORMS.forEach(function (p) { o[p.key] = !!(on && on[p.key]); }); return o; }
  /* A row of logo toggles. Returns the node; node.value() gives {key: bool}. */
  function platformToggles(initial, onChange) {
    var state = platformsObj(initial);
    var box = el('div', 'cp-plat-toggles');
    box.setAttribute('role', 'group'); box.setAttribute('aria-label', 'Posted on');
    PLATFORMS.forEach(function (p) {
      var b = el('button', 'btn btn--icon btn--ghost cp-plat'); b.type = 'button'; b.title = p.label;
      b.setAttribute('aria-label', p.label);
      b.setAttribute('aria-pressed', state[p.key] ? 'true' : 'false');
      b.appendChild(NL.icon(p.key, 'sm'));
      b.addEventListener('click', function () {
        state[p.key] = !state[p.key];
        b.setAttribute('aria-pressed', state[p.key] ? 'true' : 'false');
        if (onChange) onChange(p.key, state[p.key]);
      });
      box.appendChild(b);
    });
    box.value = function () { return platformsObj(state); };
    box.set = function (on) {
      state = platformsObj(on);
      Array.prototype.forEach.call(box.children, function (b, i) { b.setAttribute('aria-pressed', state[PLATFORMS[i].key] ? 'true' : 'false'); });
    };
    return box;
  }
  var TYPES = [
    { key: 'routine',  label: 'Routine' },
    { key: 'reactive', label: 'Reactive' },
    { key: 'original', label: 'Original' }
  ];
  var STATUSES = [
    { key: 'planned', label: 'Planned' },
    { key: 'published', label: 'Published' },
    { key: 'dropped', label: 'Dropped' }
  ];
  /* Week-view rows: "No time", then one per hour. Dropping on an hour sets
     HH:00; a time outside 06–23 still shows, in the row for its hour. */
  var SLOTS = [{ key: 'none', label: 'No time', from: null }];
  for (var h = 0; h < 24; h++) {
    SLOTS.push({ key: 'h' + h, label: pad2(h) + ':00', from: pad2(h) + ':00', to: h === 23 ? '24:00' : pad2(h + 1) + ':00', offHours: h < 6 });
  }
  /* NLS competitions counted in day headers. FA Cup / Trophy aren't in the feed. */
  var NLS_BASE = 'https://multi-club-matches.football.web.gc.nationalleagueservices.co.uk/v2';
  var NLS_COMPS = [
    { id: 89,   key: 'nl',  label: 'NAT' },
    { id: 373,  key: 'n',   label: 'NOR' },
    { id: 372,  key: 's',   label: 'SOU' },
    { id: 1275, key: 'cup', label: 'NLC' }
  ];

  /* ── State ─────────────────────────────────────────────────────────── */
  var S = {
    session: null,
    canEdit: false,
    isSuper: false,
    view: 'calendar',         // calendar | list | ideas
    cup: {}, cupRef: null,
    ideas: {}, ideasRef: null, showArchived: false, ideaForm: null,
    mode: 'month',            // month | week
    split: false,
    cursor: null,             // Date inside the visible period
    listFrom: '', listTo: '',
    sort: { key: 'date', dir: 1 },
    selected: {},             // list view bulk selection
    items: {},                // id → item for the visible range
    days: {},                 // date → day record
    config: { categories: {}, authors: {} },
    filters: { kind: '', category: '', author: '', platform: '', status: '' },
    itemsRef: null, daysRef: null,
    addingOn: null,           // date with the inline add form open
    addForm: null,            // that form's node, reused across live re-renders so typing survives
    matches: {},              // date → {nl, n, s, cup}
    seasonsLoading: {}
  };

  /* ── Small helpers ─────────────────────────────────────────────────── */
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function ymd(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
  function fromYmd(s) { return NL.parseDate(s); }   // canon: ISO date → local midnight
  function addDays(d, n) { var x = new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); return x; }
  function todayYmd() { return ymd(new Date()); }
  var WD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  var MON = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  function dayLabel(s) { var d = fromYmd(s); return WD[d.getDay()] + ' ' + d.getDate() + ' ' + MON[d.getMonth()].slice(0, 3); }
  function uk(s) { if (!s) return ''; var p = s.split('-'); return p[2] + '/' + p[1] + '/' + p[0]; }   // CSV only
  function shortDate(s) { return s ? NL.formatDateShort(s) : ''; }
  function lookup(list, key) { for (var i = 0; i < list.length; i++) if (list[i].key === key) return list[i]; return null; }
  function sel(options, value, placeholder, cls) {
    var s = el('select', cls || 'nl-select');
    if (placeholder != null) { var o0 = el('option', null, placeholder); o0.value = ''; s.appendChild(o0); }
    options.forEach(function (o) {
      var op = el('option', null, o.label); op.value = o.key;
      if (o.disabled) op.disabled = true;
      s.appendChild(op);
    });
    s.value = value == null ? '' : value;
    return s;
  }
  function icon(name) { return NL.icon(name, 'sm'); }
  function lsGet(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function stamp() { return { updatedBy: S.session.uid, updatedAt: firebase.database.ServerValue.TIMESTAMP }; }
  function fail(err) { NL.toast((err && err.message) || 'Something went wrong', 'error'); }

  /* ── Config lookups ────────────────────────────────────────────────── */
  function cssVar(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }
  function toHex(c) {
    c = String(c || '').trim();
    if (/^#[0-9a-f]{6}$/i.test(c)) return c.toLowerCase();
    if (/^#[0-9a-f]{3}$/i.test(c)) return ('#' + c[1] + c[1] + c[2] + c[2] + c[3] + c[3]).toLowerCase();
    var m = /rgba?\((\d+)\D+(\d+)\D+(\d+)/.exec(c);
    if (m) return '#' + [m[1], m[2], m[3]].map(function (v) { return ('0' + (+v).toString(16)).slice(-2); }).join('');
    return toHex(cssVar('--navy-300') || '#000');
  }
  function categoryColour(c) { return toHex(c.colour || (c.token ? cssVar(c.token) : '')); }
  /* Light fill → dark ink: pick whichever of --text / --white contrasts more (WCAG). */
  function luminance(hex) {
    var v = [1, 3, 5].map(function (i) {
      var x = parseInt(hex.substr(i, 2), 16) / 255;
      return x <= 0.03928 ? x / 12.92 : Math.pow((x + 0.055) / 1.055, 2.4);
    });
    return 0.2126 * v[0] + 0.7152 * v[1] + 0.0722 * v[2];
  }
  function contrast(a, b) { var x = luminance(a), y = luminance(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); }
  function isLight(hex) { return contrast(hex, toHex(cssVar('--text'))) > contrast(hex, toHex(cssVar('--white'))); }
  function categoryList() {
    var c = S.config.categories || {};
    return Object.keys(c).map(function (k) { return { key: k, label: c[k].label, colour: categoryColour(c[k]), order: c[k].order || 99 }; })
      .sort(function (a, b) { return a.order - b.order || a.label.localeCompare(b.label); });
  }
  /* A stored category may be a key (now), a label (older) or a CMS name (the sheet). */
  function categoryOf(value) {
    if (!value) return null;
    var list = categoryList(), v = String(value), low = v.toLowerCase(), i;
    for (i = 0; i < list.length; i++) if (list[i].key === v) return list[i];
    for (i = 0; i < list.length; i++) if (list[i].label.toLowerCase() === low) return list[i];
    var legacy = LEGACY_CATEGORY[low];
    if (legacy) for (i = 0; i < list.length; i++) if (list[i].key === legacy) return list[i];
    return null;
  }
  function categoryLabel(value) { var c = categoryOf(value); return c ? c.label : (value || ''); }
  function categoryOptions(current) {
    var opts = categoryList().map(function (c) { return { key: c.key, label: c.label }; });
    if (current && !categoryOf(current)) opts.push({ key: current, label: current + ' (removed)' });
    return opts;
  }
  /* Paint a chip or card in its category's colour. */
  function paint(node, value) {
    var c = categoryOf(value);
    if (!c) return;
    node.classList.add('cp-cat', isLight(c.colour) ? 'cp-on-light' : 'cp-on-dark');
    node.style.setProperty('--g', c.colour);
  }
  function authorList(includeRetired) {
    var a = S.config.authors || {};
    return Object.keys(a).filter(function (k) { return includeRetired || a[k].active !== false; })
      .sort().map(function (k) { return { key: k, label: a[k].name || k, name: a[k].name || '', uid: a[k].uid || null, active: a[k].active !== false }; });
  }
  function myInitials() {
    var a = S.config.authors || {};
    for (var k in a) if (a[k] && a[k].uid === S.session.uid) return k;
    return null;
  }
  function kindOf(it) {
    if (it.lane === 'social') return it.format === 'vid' ? 'video' : (it.format ? 'graphic' : 'social');
    return it.lane || 'web';
  }
  function kindInfo(k) { return lookup(KINDS, k) || KIND_UNSET; }
  /* Kind → stored lane + format. Choosing "graphic" keeps an AD / OTD format. */
  function kindPatch(k, it) {
    if (k === 'video') return { lane: 'social', format: 'vid' };
    if (k === 'graphic') return { lane: 'social', format: it && it.format && it.format !== 'vid' ? it.format : 'gfx' };
    if (k === 'social') return { lane: 'social', format: null };
    return { lane: k || 'web', format: null };
  }
  function kindOptions(current) {
    return current === 'social' ? KINDS.concat([KIND_UNSET]) : KINDS;
  }
  /* Initials → full name from config/authors; falls back to the initials. */
  function authorName(ini) {
    var a = (S.config.authors || {})[ini];
    return (a && a.name) || ini;
  }
  function authorText(it) {
    if (it.author) return it.author + (it.coAuthors && it.coAuthors.length ? '/' + it.coAuthors.join('/') : '');
    if (it.authorOther) return it.authorOther;
    return '';
  }
  function authorFull(it) {
    if (it.author) return [it.author].concat(asArray(it.coAuthors)).map(authorName).join(' / ');
    return it.authorOther || '';
  }
  function asArray(v) { if (!v) return []; if (Array.isArray(v)) return v.filter(Boolean); return Object.keys(v).map(function (k) { return v[k]; }); }

  /* ── Filtering ─────────────────────────────────────────────────────── */
  function passes(it) {
    var f = S.filters;
    if (f.kind && kindOf(it) !== f.kind) return false;
    if (f.category && (categoryOf(it.category) || {}).key !== f.category) return false;
    if (f.author === '_me') { var me = myInitials(); if (!me || (it.author !== me && asArray(it.coAuthors).indexOf(me) < 0)) return false; }
    else if (f.author === '_none') { if (it.author || it.authorOther) return false; }
    else if (f.author === '_guest') { if (!it.authorOther) return false; }
    else if (f.author && it.author !== f.author && asArray(it.coAuthors).indexOf(f.author) < 0) return false;
    if (f.platform && !(it.platforms && it.platforms[f.platform])) return false;
    if (f.status && it.status !== f.status) return false;
    return true;
  }
  function sortItems(a, b) {
    var ta = a.time || '99:99', tb = b.time || '99:99';
    if (ta !== tb) return ta < tb ? -1 : 1;
    var la = kindOrder(kindOf(a)), lb = kindOrder(kindOf(b));
    if (la !== lb) return la - lb;
    return (a.createdAt || 0) - (b.createdAt || 0);
  }
  function kindOrder(k) { for (var i = 0; i < KINDS.length; i++) if (KINDS[i].key === k) return i; return 9; }
  /* ── Range + listeners ─────────────────────────────────────────────── */
  function currentRange() {
    if (S.view === 'list') return { from: S.listFrom, to: S.listTo };
    var c = S.cursor;
    if (S.mode === 'week') {
      var dow = (c.getDay() + 6) % 7;              // Monday start
      var start = addDays(c, -dow);
      return { from: ymd(start), to: ymd(addDays(start, 6)) };
    }
    return { from: ymd(new Date(c.getFullYear(), c.getMonth(), 1)), to: ymd(new Date(c.getFullYear(), c.getMonth() + 1, 0)) };
  }
  var _renderQueued = false;
  function queueRender() {
    if (_renderQueued) return;
    _renderQueued = true;
    requestAnimationFrame(function () { _renderQueued = false; render(); });
  }
  function listen() {
    var r = currentRange();
    if (S.itemsRef) S.itemsRef.off();
    if (S.daysRef) S.daysRef.off();
    if (S.cupRef) { S.cupRef.off(); S.cupRef = null; }
    if (S.ideasRef) { S.ideasRef.off(); S.ideasRef = null; }
    if (S.view === 'ideas') {
      S.itemsRef = null; S.daysRef = null;
      S.ideasRef = db.ref(ROOT + '/ideas');
      S.ideasRef.on('value', function (snap) {
        var out = {};
        snap.forEach(function (ch) { var v = ch.val(); if (v && v.title) { v.id = ch.key; out[ch.key] = v; } });
        S.ideas = out; queueRender();
      }, fail);
      return;
    }
    S.items = {}; S.days = {};
    var loaded = { items: false, days: false };
    S.itemsRef = db.ref(ROOT + '/items').orderByChild('date').startAt(r.from).endAt(r.to);
    S.itemsRef.on('value', function (snap) {
      var out = {};
      snap.forEach(function (ch) { var v = ch.val(); if (v && v.date) { v.id = ch.key; out[ch.key] = v; } });
      S.items = out; loaded.items = true;
      if (loaded.days) queueRender();
    }, fail);
    S.daysRef = db.ref(ROOT + '/days').orderByKey().startAt(r.from).endAt(r.to);
    S.daysRef.on('value', function (snap) {
      S.days = snap.val() || {}; loaded.days = true;
      if (loaded.items) queueRender();
    }, fail);
    if (S.view === 'calendar') {
      loadMatches(r.from, r.to);
      S.cup = {};
      S.cupRef = db.ref(ROOT + '/cupFixtures').orderByChild('date').startAt(r.from).endAt(r.to);
      S.cupRef.on('value', function (snap) { S.cup = snap.val() || {}; queueRender(); }, fail);
    }
  }

  /* ── Match counts from NLS (memory cache per season) ───────────────── */
  function seasonOf(s) { return NL.season.fromDate(fromYmd(s)); }
  function londonDay(iso) {
    if (!iso) return '';
    var d = new Date(iso.indexOf('T') >= 0 ? iso : iso.replace(' ', 'T') + 'Z');
    if (isNaN(d.getTime())) return '';
    return d.toLocaleDateString('en-CA', { timeZone: 'Europe/London' });
  }
  function fetchComp(comp, season) {
    var all = [];
    function page(n) {
      var url = NLS_BASE + '/matches/?competitionID=' + comp.id + '&seasonID=' + season +
        '&sort=kickOffDateUTC&page.number=' + n + '&page.size=100';
      return fetch(url).then(function (r) { if (!r.ok) throw new Error('NLS ' + r.status); return r.json(); })
        .then(function (j) {
          var rows = (j && j.data) || [];
          all = all.concat(rows);
          var total = j && j.meta && j.meta.totalCount;
          if (rows.length < 100 || (total != null && all.length >= total) || n >= 20) return all;
          return page(n + 1);
        });
    }
    return page(1).then(function (rows) {
      rows.forEach(function (m) {
        var a = (m && m.attributes) || {};
        var day = londonDay(a.kickOffDateUTC || a.kickoffDateUTC || a.kickOffDate || a.kickoffDate || a.date || '');
        if (!day) return;
        var bucket = S.matches[day] = S.matches[day] || {};
        bucket[comp.key] = (bucket[comp.key] || 0) + 1;
      });
    });
  }
  function loadMatches(from, to) {
    [seasonOf(from), seasonOf(to)].forEach(function (season) {
      if (S.seasonsLoading[season]) return;
      S.seasonsLoading[season] = true;
      Promise.all(NLS_COMPS.map(function (c) {
        return fetchComp(c, season).catch(function (e) { console.warn('[content-plan] match counts', c.label, e && e.message); });
      })).then(queueRender);
    });
  }
  function matchPills(date) {
    var m = S.matches[date] || {}, d = S.days[date] || {}, mm = d.manualMatches || {};
    var box = el('div', 'cp-mpills'), n = 0;

  function dropTarget(node, date, slot) {

    node.addEventListener('dragleave', function (e) { if (!node.contains(e.relatedTarget)) node.classList.remove('is-drop'); });

      var time;

        var body;

            sr.appendChild(el('span', 'cp-slot__label', slot.label));
            var st = el('div', 'cp-stack');
            var inSlot = items.filter(function (it) {

            });
            inSlot.forEach(function (it) { st.appendChild(chip(it)); });
            if (!inSlot.length) {

        dropTarget(row, date, null);

  /* Author typeahead, on the canon .club-picker look: type to filter the
     authors (name or initials), pick one, or keep what was typed for a guest
     writer ("Use … as entered"). value is an author key (initials) when one
     was picked, otherwise the typed name.
     Canon candidate (16/10/2026): NL.clubPicker is club-specific; a generic
     NL.combobox would serve this and any other "pick or type" field. */
  function authorCombo(value, exclude, onChange, label) {
    var authors = S.config.authors || {};
    var root = el('div', 'club-picker cp-author-combo');
    var wrap = el('div', 'club-picker__wrap');
    var input = el('input', 'club-picker__input'); input.type = 'text'; input.autocomplete = 'off';
    input.placeholder = 'Author'; input.setAttribute('aria-label', label || 'Author');
    input.setAttribute('role', 'combobox'); input.setAttribute('aria-autocomplete', 'list'); input.setAttribute('aria-expanded', 'false');
    var listId = 'cpac-' + Math.random().toString(36).slice(2, 8);
    input.setAttribute('aria-controls', listId);
    var dd = el('div', 'club-picker__dropdown'); dd.id = listId; dd.setAttribute('role', 'listbox');
    wrap.appendChild(input); root.appendChild(wrap); root.appendChild(dd);
    var current = value || '', rows = [], active = -1;
    function show(v) { return authors[v] ? (authors[v].name || v) : (v || ''); }
    input.value = show(current);
    function matches(q) {
      q = q.toLowerCase().trim();
      return authorList(false).filter(function (a) {
        if (exclude.indexOf(a.key) >= 0 && a.key !== current) return false;
        return !q || a.key.toLowerCase().indexOf(q) === 0 || (a.name || '').toLowerCase().indexOf(q) >= 0;
      });
    }
    function exact(q) {
      q = q.toLowerCase().trim();
      var hit = null;
      authorList(true).forEach(function (a) { if (a.key.toLowerCase() === q || (a.name || '').toLowerCase() === q) hit = a.key; });
      return hit;
    }
    function render() {
      var q = input.value;
      rows = matches(q).map(function (a) { return { key: a.key, label: a.name || a.key, sub: a.key }; });
      var typed = q.trim();
      if (typed && !exact(typed)) rows.push({ free: typed });
      dd.innerHTML = '';
      rows.forEach(function (r, i) {
        var o = el('div', 'club-picker__option' + (r.free ? ' club-picker__option--freetext' : ''));
        o.id = listId + '-' + i; o.setAttribute('role', 'option');
        o.appendChild(el('span', 'club-picker__option-name', r.free ? 'Use “' + r.free + '” as entered' : r.label));
        if (!r.free) o.appendChild(el('span', 'club-picker__option-div', r.sub));
        o.addEventListener('mousedown', function (e) { e.preventDefault(); pick(i); });
        dd.appendChild(o);
      });
      active = rows.length ? 0 : -1; paint();
      dd.classList.toggle('open', rows.length > 0); input.setAttribute('aria-expanded', rows.length ? 'true' : 'false');
    }
    function paint() {
      Array.prototype.forEach.call(dd.children, function (o, i) {

        if (on) input.setAttribute('aria-activedescendant', o.id);

  /* Authors: one typeahead, a + to add another (each new one leaves out the
     authors already picked), × to remove an extra one.
     value() → { author, authorOther, coAuthors } in the stored item shape:
     a picked author is stored by key; a typed name is kept as written. */
  function authorPicker(init) {
    var state = { lead: init.authorOther || init.author || '', co: asArray(init.coAuthors).slice() };
    var box = el('div', 'cp-authors');
    box.setAttribute('role', 'group'); box.setAttribute('aria-label', 'Authors');
    function isKey(v) { return !!(S.config.authors || {})[v]; }
    function taken(except) {
      var t = [];
      if (isKey(state.lead) && except !== -1) t.push(state.lead);
      state.co.forEach(function (k, i) { if (isKey(k) && i !== except) t.push(k); });
      return t;
    }
    function draw(focusIdx) {
      box.innerHTML = '';
      var combos = [];
      var lead = authorCombo(state.lead, taken(-1), function (v) { state.lead = v; draw(null); }, 'Author');
      box.appendChild(lead); combos.push(lead);
      state.co.forEach(function (k, i) {
        var r = el('div', 'cp-authors__row');
        var c = authorCombo(k, taken(i), function (v) { state.co[i] = v; draw(null); }, 'Author ' + (i + 2));
        var x = el('button', 'btn btn--icon btn--ghost'); x.type = 'button';
        x.setAttribute('aria-label', 'Remove this author'); x.title = 'Remove';
        x.appendChild(NL.icon('close', 'sm'));
        x.addEventListener('click', function () { state.co.splice(i, 1); draw(null); });
        r.appendChild(c); r.appendChild(x); box.appendChild(r); combos.push(c);
      });
      /* + sits after the last author, once the first is filled in. */
      if (state.lead) {
        var plus = el('button', 'btn btn--icon btn--ghost'); plus.type = 'button';
        plus.setAttribute('aria-label', 'Add another author'); plus.title = 'Add another author';
        plus.appendChild(NL.icon('add', 'sm'));
        plus.addEventListener('click', function () { state.co.push(''); draw(state.co.length); });
        box.appendChild(plus);
      }
      if (focusIdx != null && combos[focusIdx]) setTimeout(function () { combos[focusIdx].focusInput(); }, 0);
    }
    draw(null);
    box.value = function () {
      var lead = state.lead.trim();
      var co = state.co.map(function (v) { return v.trim(); })
        .filter(function (v, i, a) { return v && v !== lead && a.indexOf(v) === i; });
      return {
        author: isKey(lead) ? lead : null,
        authorOther: lead && !isKey(lead) ? lead.slice(0, 80) : null,
        coAuthors: co.length ? co.map(function (v) { return isKey(v) ? v : v.slice(0, 80); }) : null

    };
    return box;
  }

        var keys = Object.keys(data || {});

        var kind = keys.every(function (k) { return /^\d{4}-\d{2}-\d{2}$/.test(k); }) ? 'days'
          : keys.every(function (k) { return data[k] && data[k].date && data[k].lane; }) ? 'items' : null;
        if (!kind) { NL.toast('That isn’t an items or days file from the import script', 'error'); return; }

          if (!ok) return;

          var done = 0;
          return NL.ensureAuth().then(function () {
            NL.writeAudit('content_plan_import', { kind: kind, count: keys.length });
            return chunks.reduce(function (p, ch) {

          }).then(function () { status.textContent = 'Loaded ' + keys.length + ' ' + kind + '.'; NL.toast('Import complete'); listen(); });
        }).catch(fail);
      };

  /* ── FA Cup / FA Trophy fixtures: pasted from a spreadsheet ───────────
     There is no feed for these (NLS carries 89/372/373/1275 only). Six
     pasted columns: date & time, round, competition, home, (score, blank),
     away. A fixture's key is competition + round + home + away, so pasting
     a moved tie again updates its date instead of adding a second copy. */
  var CUP_COMPS = [
    { key: 'facup',    label: 'FA Cup',    short: 'FAC' },
    { key: 'fatrophy', label: 'FA Trophy', short: 'FAT' }
  ];
  var MONTHS3 = MON.map(function (m) { return m.slice(0, 3).toLowerCase(); });
  function slugKey(s) { return String(s || '').toLowerCase().replace(/&/g, 'and').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40); }
  function cupKey(f) { return [f.comp, slugKey(f.round) || 'r', slugKey(f.home), 'v', slugKey(f.away)].join('_'); }
  /* "17/10/2026 15:00", "Sat 17/10/26 12:30", "2026-10-17 15:00", "17 Oct 2026 3:00" */
  function parseWhen(s) {
    s = String(s || '').trim();
    var time = null, tm = /(\d{1,2}):(\d{2})\s*(am|pm)?/i.exec(s);
    if (tm && +tm[1] < 24 && +tm[2] < 60) {
      var hh = +tm[1], ap = (tm[3] || '').toLowerCase();
      /* No football kicks off between 1am and 10am: "3:00" means 15:00. */
      if (ap === 'pm' && hh < 12) hh += 12;
      else if (ap !== 'am' && hh >= 1 && hh <= 9) hh += 12;
      time = pad2(hh) + ':' + tm[2]; s = s.replace(tm[0], ' ');
    }
    var y, m, d, x;
    if ((x = /(\d{4})-(\d{1,2})-(\d{1,2})/.exec(s))) { y = +x[1]; m = +x[2]; d = +x[3]; }
    else if ((x = /(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/.exec(s))) { d = +x[1]; m = +x[2]; y = +x[3]; }
    else if ((x = /(\d{1,2})(?:st|nd|rd|th)?\s+([a-z]{3,})\.?\s+(\d{2,4})/i.exec(s))) {
      d = +x[1]; m = MONTHS3.indexOf(x[2].slice(0, 3).toLowerCase()) + 1; y = +x[3];
    }
    if (!y || !m || !d) return null;
    if (y < 100) y += 2000;
    var dt = new Date(y, m - 1, d);
    if (dt.getMonth() !== m - 1 || dt.getDate() !== d) return null;
    return { date: ymd(dt), time: time };
  }
  function parseComp(s) {
    var t = String(s || '').toLowerCase().trim();
    if (t === 'fat') return 'fatrophy';
    if (t === 'fac') return 'facup';
    if (t.indexOf('trophy') >= 0) return 'fatrophy';
    if (t.indexOf('cup') >= 0) return 'facup';
    return null;
  }
  /* Returns [{ok, row, fixture|reason}] */
  function parseCupPaste(text) {
    var lines = String(text || '').replace(/\r/g, '').split('\n');
    var out = [];
    lines.forEach(function (line, i) {
      if (!line.trim()) return;
      var c = line.indexOf('\t') >= 0 ? line.split('\t') : (NL.csvParse(line)[0] || []);
      c = c.map(function (v) { return String(v == null ? '' : v).trim(); });
      var when = parseWhen(c[0]);
      if (!when) { out.push({ ok: false, row: i + 1, raw: line, reason: i === 0 ? 'Header row, skipped' : 'Can’t read the date' }); return; }
      var comp = parseComp(c[2]);
      if (!comp) { out.push({ ok: false, row: i + 1, raw: line, reason: 'Competition isn’t FA Cup or FA Trophy' }); return; }
      var home = c[3] || '', away = c.length >= 6 ? c[5] : (c[4] || '');
      if (!home || !away) { out.push({ ok: false, row: i + 1, raw: line, reason: 'Missing a team' }); return; }
      if (home.length > 80 || away.length > 80) { out.push({ ok: false, row: i + 1, raw: line, reason: 'A team name is over 80 characters' }); return; }
      out.push({ ok: true, row: i + 1, fixture: { date: when.date, time: when.time, round: c[1] || '', comp: comp, home: home, away: away } });
    });
    return out;
  }
  function cupCounts(date) {
    var out = {};
    Object.keys(S.cup || {}).forEach(function (k) {
      var f = S.cup[k];
      if (f && f.date === date) out[f.comp] = (out[f.comp] || 0) + 1;
    });
    return out;
  }
  function cupOnDate(date) {
    return Object.keys(S.cup || {}).map(function (k) { var f = Object.assign({}, S.cup[k]); f.id = k; return f; })
      .filter(function (f) { return f.date === date; })
      .sort(function (a, b) { return (a.comp + (a.time || '') + a.home).localeCompare(b.comp + (b.time || '') + b.home); });
  }
  function cupLine(f) {
    var c = lookup(CUP_COMPS, f.comp) || { short: '?' };
    return (f.time ? f.time + ' ' : '') + c.short + (f.round ? ' ' + f.round : '') + ' – ' + f.home + ' v ' + f.away;
  }

    var row = el('div', 'cp-add__row');
    var notes = el('input'); notes.type = 'text'; notes.placeholder = 'Notes (optional)'; notes.maxLength = 1000; notes.classList.add('cp-grow'); notes.setAttribute('aria-label', 'Notes');
    var kind = sel(KINDS, '', 'Any kind'); kind.setAttribute('aria-label', 'Kind');
    var cat = sel(categoryOptions(), '', 'Category'); cat.setAttribute('aria-label', 'Category');
    var save = el('button', 'btn btn--primary btn--sm', 'Add idea'); save.type = 'submit';
    [notes, kind, cat, save].forEach(function (x) { row.appendChild(x); });
    form.appendChild(row);
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var t = title.value.trim();
      if (!t) { title.focus(); NL.toast('Add a title', 'error'); return; }
      save.disabled = true;
      NL.ensureAuth().then(function () {
        var ref = db.ref(ROOT + '/ideas').push();
        NL.writeAudit('content_plan_idea_add', { id: ref.key, title: t });
        return ref.set({
          title: t, notes: notes.value.trim(), kind: kind.value || null, category: cat.value || null,
          addedBy: S.session.uid, addedByName: S.session.name || '', archived: false,
          createdAt: firebase.database.ServerValue.TIMESTAMP
        });
      }).then(function () {
        title.value = ''; notes.value = ''; kind.value = ''; cat.value = ''; save.disabled = false; title.focus();
        NL.toast('Idea added');
      }).catch(function (err) { save.disabled = false; fail(err); });
    });
    S.ideaForm = form;
    return form;
  }
  function renderIdeas() {
    var main = document.getElementById('cpMain');
    var wrap = el('div', 'cp-ideas');
    if (S.canEdit && !S.showArchived) wrap.appendChild(ideaForm());
    var list = Object.keys(S.ideas).map(function (k) { return S.ideas[k]; })
      .filter(function (i) { return !!i.archived === S.showArchived; })
      .sort(function (a, b) { return (b.createdAt || 0) - (a.createdAt || 0); });
    if (!list.length) {
      var es = el('div', 'empty-state');
      es.appendChild(el('div', 'empty-state__title', S.showArchived ? 'Nothing archived' : 'No ideas yet'));
      wrap.appendChild(es);
    }
    var box = el('div', 'cp-idea-list');
    list.forEach(function (idea) {
      var card = el('div', 'cp-idea' + (idea.archived ? ' is-archived' : ''));
      paint(card, idea.category);
      var m = el('div', 'cp-idea__main');
      var t = el('div', 'cp-idea__title');
      if (idea.kind) t.appendChild(glyph(kindInfo(idea.kind)));
      t.appendChild(el('span', null, idea.title));
      m.appendChild(t);
      if (idea.notes) m.appendChild(el('div', 'cp-idea__notes', idea.notes));
      m.appendChild(el('div', 'cp-idea__meta', [categoryLabel(idea.category), idea.addedByName ? 'Added by ' + idea.addedByName : '', idea.createdAt ? NL.timeAgo(idea.createdAt) : ''].filter(Boolean).join(' · ')));
      card.appendChild(m);
      if (S.canEdit) {
        var acts = el('div', 'cp-idea__actions');
        var btn = function (label, cls, fn) { var b = el('button', 'btn btn--sm ' + cls, label); b.type = 'button'; b.addEventListener('click', fn); acts.appendChild(b); };
        if (!idea.archived) {
          btn('Schedule', 'btn--primary', function () { scheduleIdea(idea); });
          btn('Edit', 'btn--ghost', function () { editIdea(idea); });
          btn('Archive', 'btn--ghost', function () { setIdeaArchived(idea, true); });
        } else {
          btn('Restore', 'btn--restore', function () { setIdeaArchived(idea, false); });
          btn('Delete', 'btn--danger', function () { deleteIdea(idea); });
        }
        card.appendChild(acts);
      }
      box.appendChild(card);
    });
    wrap.appendChild(box);
    main.innerHTML = '';
    main.appendChild(wrap);
  }
  function setIdeaArchived(idea, on) {
    NL.ensureAuth().then(function () { return db.ref(ROOT + '/ideas/' + idea.id).update({ archived: on }); })
      .then(function () { NL.toast(on ? 'Archived' : 'Restored'); }).catch(fail);
  }
  function deleteIdea(idea) {
    NL.confirm('Delete "' + idea.title + '" for good?', { title: 'Delete idea', confirmText: 'Delete', variant: 'danger' }).then(function (ok) {
      if (!ok) return;
      return NL.ensureAuth().then(function () {
        NL.writeAudit('content_plan_idea_delete', { id: idea.id, title: idea.title });
        return db.ref(ROOT + '/ideas/' + idea.id).remove();
      }).then(function () { NL.toast('Deleted'); });
    }).catch(fail);
  }
  function editIdea(idea) {
    var form = el('div', 'form-grid');
    var title = el('input'); title.type = 'text'; title.value = idea.title; title.maxLength = 300;
    form.appendChild(field('Title', title, true));
    var kind = sel(KINDS, idea.kind || '', 'Any kind');
    form.appendChild(field('Kind', kind));
    var cat = sel(categoryOptions(idea.category), (categoryOf(idea.category) || {}).key || idea.category || '', 'None');
    form.appendChild(field('Category', cat));
    var notes = el('textarea'); notes.rows = 4; notes.maxLength = 1000; notes.value = idea.notes || '';
    form.appendChild(field('Notes', notes, true));
    NL.modal({ title: 'Edit idea', body: form, buttons: [
      { label: 'Cancel', className: 'btn--ghost', onClick: function (c) { c.close(); } },
      { label: 'Save', className: 'btn--primary', onClick: function (c) {
        var t = title.value.trim();
        if (!t) { title.focus(); NL.toast('Add a title', 'error'); return; }
        NL.ensureAuth().then(function () {
          return db.ref(ROOT + '/ideas/' + idea.id).update({ title: t, kind: kind.value || null, category: cat.value || null, notes: notes.value.trim() });
        }).then(function () { NL.toast('Saved'); c.close(); }).catch(fail);
      } }
    ] });
  }
  /* Scheduling writes the item and removes the idea in one update, so the
     idea never exists in both places. */
  function scheduleIdea(idea) {
    var form = el('div', 'form-grid');
    var dateIn = el('input'); dateIn.type = 'date'; dateIn.value = todayYmd();
    form.appendChild(field('Date', dateIn));
    var timeIn = el('input'); timeIn.type = 'time'; timeIn.step = 300;
    form.appendChild(field('Time', timeIn, false, 'Optional'));
    var kind = sel(KINDS, idea.kind || 'web');
    form.appendChild(field('Kind', kind));
    var auth = sel(authorList(false).map(function (a) { return { key: a.key, label: a.label }; }), '', 'Unassigned');
    form.appendChild(field('Author', auth));
    NL.modal({ title: 'Schedule: ' + idea.title, body: form, buttons: [
      { label: 'Cancel', className: 'btn--ghost', onClick: function (c) { c.close(); } },
      { label: 'Schedule', className: 'btn--primary', onClick: function (c) {
        if (!dateIn.value) { dateIn.focus(); NL.toast('Pick a date', 'error'); return; }
        var item = blankItem(dateIn.value);
        var kp = kindPatch(kind.value || 'web');
        item.title = idea.title; item.notes = idea.notes || ''; item.category = idea.category || null;
        item.lane = kp.lane; item.format = kp.format; item.time = timeIn.value || null;
        item.author = auth.value || null; item.type = 'original';
        item.platforms = platformsObj(defaultPlatforms(kind.value || 'web', lsGet(prefsKey())));
        item.createdBy = S.session.uid; item.createdAt = firebase.database.ServerValue.TIMESTAMP;
        item.updatedBy = S.session.uid; item.updatedAt = firebase.database.ServerValue.TIMESTAMP;
        NL.ensureAuth().then(function () {
          var key = db.ref(ROOT + '/items').push().key;
          var u = {};
          u['items/' + key] = item;
          u['ideas/' + idea.id] = null;
          NL.writeAudit('content_plan_idea_scheduled', { idea: idea.id, item: key, date: item.date, title: item.title });
          return db.ref(ROOT).update(u);
        }).then(function () { NL.toast('Scheduled for ' + dayLabel(dateIn.value)); c.close(); }).catch(fail);
      } }
    ] });
  }

  /* ── Render ────────────────────────────────────────────────────────── */
  function render() {
    var ideas = S.view === 'ideas';
    document.getElementById('cpFilters').hidden = ideas;
    document.getElementById('cpSummary').hidden = ideas;
    if (ideas) { document.getElementById('cpBulk').innerHTML = ''; renderIdeas(); return; }
    var all = Object.keys(S.items).map(function (k) { return S.items[k]; }).filter(passes);
    renderSummary(all);
    if (S.view === 'calendar') {
      document.getElementById('cpBulk').innerHTML = '';
      var by = {};
      all.forEach(function (it) { (by[it.date] = by[it.date] || []).push(it); });
      Object.keys(by).forEach(function (d) { by[d].sort(sortItems); });
      renderCalendar(by);
    } else {
      renderList(all);
    }
  }
  function setView(v) {
    S.view = v;
    document.querySelectorAll('#cpTabs .tab').forEach(function (t) {
      var on = t.getAttribute('data-view') === v;
      t.classList.toggle('active', on); t.setAttribute('aria-selected', on ? 'true' : 'false');
    });
    if (v === 'list' && !S.listFrom) {
      var r = currentRangeFor('calendar');
      S.listFrom = r.from; S.listTo = r.to;
    }
    S.addingOn = null; S.addForm = null; S.ideaForm = null; S.selected = {};
    savePrefs(); renderBar(); listen();
  }
  function currentRangeFor(view) { var v = S.view; S.view = view; var r = currentRange(); S.view = v; return r; }

  function prefsStoreKey() { return 'cp:prefs:' + S.session.uid; }
  function savePrefs() { lsSet(prefsStoreKey(), { view: S.view, mode: S.mode, split: S.split, filters: S.filters }); }
  function loadPrefs() {
    var p = lsGet(prefsStoreKey());
    if (!p) return;
    if (p.mode === 'week' || p.mode === 'month') S.mode = p.mode;
    S.split = !!p.split;
    if (p.view === 'list' || p.view === 'ideas') S.view = p.view;
    if (p.filters) Object.keys(S.filters).forEach(function (k) { if (p.filters[k] != null) S.filters[k] = p.filters[k]; });
  }

  /* ── Boot ──────────────────────────────────────────────────────────── */
  window.TOOL = window.TOOL || {};
  window.TOOL.boot = function (session) {
    S.session = session;
    S.isSuper = session.role === 'superadmin';
    S.canEdit = S.isSuper || session.toolLevel === 'admin';
    S.cursor = new Date();
    loadPrefs();

    document.querySelectorAll('#cpTabs .tab').forEach(function (t) {
      t.addEventListener('click', function () { setView(t.getAttribute('data-view')); });
    });

    NL.ensureAuth().then(function () {
      db.ref(ROOT + '/config').on('value', function (snap) {
        var c = snap.val() || {};
        var firstLoad = !S._configLoaded;
        S._configLoaded = true;
        S.config = { categories: c.categories || {}, authors: c.authors || {} };
        /* First run: no categories yet. Use the starting set on screen, and
           write them once if this user can edit, so Settings starts populated. */
        if (!c.categories) {
          S.config.categories = DEFAULT_CATEGORIES;
          if (S.canEdit && firstLoad) {
            NL.writeAudit('content_plan_config', 'Default categories seeded');
            db.ref(ROOT + '/config/categories').set(DEFAULT_CATEGORIES).catch(fail);
          }
        }
        renderFilters();
        if (firstLoad) {
          if (S.view === 'list') { var r = currentRangeFor('calendar'); S.listFrom = r.from; S.listTo = r.to; setView('list'); }
          else setView(S.view === 'ideas' ? 'ideas' : 'calendar');
        } else queueRender();
      }, fail);
    }).catch(fail);
  };

  /* If auth-guard fired before this script loaded, replay the session. */
  if (window._toolDeferredSession) {
    window.TOOL.boot(window._toolDeferredSession);
    delete window._toolDeferredSession;
  }
})();
</script>
