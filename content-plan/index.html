          u['items/' + key] = item;
          u['ideas/' + idea.id] = null;
          NL.writeAudit('content_plan_idea_scheduled', { idea: idea.id, item: key, date: item.date, title: item.title });
          return db.ref(ROOT).update(u);
        }).then(function () { NL.toast('Scheduled for ' + dayLabel(dateIn.value)); c.close(); }).catch(fail);
      } }
    ] });
  }

  /* ── Search: every item, not just the dates loaded on screen ─────── */
  /* Every item, not just the loaded dates. Fetched once, stale after a
     minute so a long session still sees new items. */
  function loadAll(done) {
    if (S.allItems) { if (done) done(S.allItems); return; }
    S.allWaiters = (S.allWaiters || []).concat(done ? [done] : []);
    if (S.allLoading) return;
    S.allLoading = true;
    NL.ensureAuth().then(function () { return db.ref(ROOT + '/items').once('value'); }).then(function (snap) {
      var out = [];
      snap.forEach(function (ch) { var x = ch.val(); if (x && x.date) { x.id = ch.key; out.push(normAuthors(x)); } });
      S.allItems = out; S.allLoading = false;
      setTimeout(function () { S.allItems = null; }, 60000);
      var w = S.allWaiters; S.allWaiters = [];
      w.forEach(function (f) { f(out); });
    }).catch(function (e) { S.allLoading = false; S.allWaiters = []; fail(e); });
  }
  function setSearch(v) {
    S.q = (v || '').trim();
    if (S.q) loadAll(function () { if (S.q) render(); });
    render();
  }
  function matchesSearch(it) {
    var words = S.q.toLowerCase().split(/\s+/).filter(Boolean);
    var hay = [it.title, it.notes, it.authorOther, authorFull(it), authorText(it), categoryLabel(it.category), kindInfo(kindOf(it)).label]
      .join(' ').toLowerCase();
    return words.every(function (w) { return hay.indexOf(w) >= 0; });
  }
  function renderSearch() {
    var main = document.getElementById('cpMain');
    var box = el('div', 'cp-cal cp-agenda');
    main.innerHTML = '';
    if (!S.allItems) { box.appendChild(el('p', 'cp-end', 'Searching…')); main.appendChild(box); return; }
    /* Live edits to loaded items win over the snapshot taken for the search. */
    var seen = {};
    var res = S.allItems.map(function (x) { seen[x.id] = true; return S.items[x.id] || x; })
      .concat(Object.keys(S.items).filter(function (k) { return !seen[k]; }).map(function (k) { return S.items[k]; }))
      .filter(function (x) { return passes(x) && matchesSearch(x); })
      .sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : sortItems(a, b); });
    document.getElementById('cpSummary').innerHTML = '';
    var sum = el('span'); sum.appendChild(el('b', null, String(res.length))); sum.appendChild(document.createTextNode(res.length === 1 ? ' match' : ' matches'));
    document.getElementById('cpSummary').appendChild(sum);
    if (!res.length) { box.appendChild(el('p', 'cp-end', 'Nothing matches “' + S.q + '”.')); main.appendChild(box); return; }
    var byDate = {}, order = [];
    res.slice(0, 300).forEach(function (it) { if (!byDate[it.date]) { byDate[it.date] = []; order.push(it.date); } byDate[it.date].push(it); });
    order.forEach(function (date) {
      var dt = fromYmd(date);
      var row = el('div', 'cp-day');
      var gut = el('div', 'cp-ag-gutter');
      var dl = el('button', 'cp-ag-date'); dl.type = 'button';
      dl.setAttribute('aria-label', 'Open ' + longDay(date));
      dl.appendChild(el('span', 'cp-ag-num', String(dt.getDate())));
      dl.appendChild(el('span', 'cp-ag-dow', MON[dt.getMonth()].slice(0, 3) + ' ' + String(dt.getFullYear()).slice(2)));
      dl.addEventListener('click', function () { S.q = ''; var qi = document.getElementById('cpSearch'); if (qi) qi.value = ''; setMode('week', date); render(); });
      gut.appendChild(dl);
      row.appendChild(gut);
      var body = el('div', 'cp-ag-body');
      byDate[date].forEach(function (it) { body.appendChild(itemRow(it, false)); });
      row.appendChild(body);
      box.appendChild(row);
    });
    if (res.length > 300) box.appendChild(el('p', 'cp-end', 'Showing the 300 most recent. Add a word to narrow it.'));
    main.appendChild(box);
  }

  /* ── Render ────────────────────────────────────────────────────────── */
  function render() {
    closeCard();
    sizeScroller();
    var ideas = S.view === 'ideas';
    document.getElementById('cpFilters').hidden = ideas;
    document.getElementById('cpSummary').hidden = ideas;
    if (ideas) { document.getElementById('cpBulk').innerHTML = ''; renderIdeas(); return; }
    if (S.q) { document.getElementById('cpBulk').innerHTML = ''; renderSearch(); return; }
    var all = Object.keys(S.items).map(function (k) { return S.items[k]; }).filter(passes);
    renderSummary(all);
    var by = {};
    all.forEach(function (it) { (by[it.date] = by[it.date] || []).push(it); });
    Object.keys(by).forEach(function (d) { by[d].sort(sortItems); });
    all.sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : sortItems(a, b); });
    S._all = all;
    renderBulk(all);
    if (S.mode === 'week') renderWeek(by);
    else if (S.mode === 'month') renderMonth(by);
    else renderList(by);
    if (S.panel) S.panel.fill();
    flashItem();
  }
  function setView(v) {
    S.view = v;
    document.querySelectorAll('#cpTabs .tab').forEach(function (t) {
      var on = t.getAttribute('data-view') === v;
      t.classList.toggle('active', on); t.setAttribute('aria-selected', on ? 'true' : 'false');
    });
    if (v === 'calendar' && S.mode === 'list') { S.from = ''; S.scrollTo = todayYmd(); }
    S.addingOn = null; S.addForm = null; S.ideaForm = null; S.selected = {}; S.selecting = false;
    savePrefs(); renderBar(); renderFilters(); listen();
  }

  function prefsStoreKey() { return 'cp:prefs:' + S.session.uid; }
  function savePrefs() { lsSet(prefsStoreKey(), { view: S.view, mode: S.mode, filters: S.filters }); }
  function loadPrefs() {
    var p = lsGet(prefsStoreKey());
    if (!p) return;
    /* Earlier views map onto these three: Day → Week; Agenda, Days and the
       old List tab → List. */
    var map = { week: 'week', month: 'month', list: 'list', day: 'week', agenda: 'list' };
    if (map[p.mode]) { S.mode = map[p.mode]; S._modeSaved = true; }
    if (p.view === 'list') { S.mode = 'list'; S._modeSaved = true; }
    if (p.view === 'ideas') S.view = 'ideas';
    if (p.filters) Object.keys(S.filters).forEach(function (k) { if (p.filters[k] != null) S.filters[k] = p.filters[k]; });
  }

  /* ── Boot ──────────────────────────────────────────────────────────── */
  window.TOOL = window.TOOL || {};
  window.TOOL.boot = function (session) {
    S.session = session;
    S.isSuper = session.role === 'superadmin';
    S.canEdit = S.isSuper || session.toolLevel === 'admin';
    S.cursor = new Date();
    loadPrefs();
    /* First visit: Week on a computer, List on a phone. After that, the last view used. */
    if (!S._modeSaved) S.mode = PHONE.matches ? 'list' : 'week';

    document.querySelectorAll('#cpTabs .tab').forEach(function (t) {
      t.addEventListener('click', function () { setView(t.getAttribute('data-view')); });
    });
    /* Week and Month: a sideways swipe steps, as the arrows do. */
    var sx = null, sy = null, main = document.getElementById('cpMain');
    main.addEventListener('touchstart', function (e) { if (e.touches.length === 1) { sx = e.touches[0].clientX; sy = e.touches[0].clientY; } }, { passive: true });
    main.addEventListener('touchend', function (e) {
      if (sx === null || S.view !== 'calendar' || S.mode === 'list') { sx = null; return; }
      var dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
      sx = null;
      if (Math.abs(dx) > 70 && Math.abs(dy) < 50) step(dx < 0 ? 1 : -1);
    }, { passive: true });

    NL.ensureAuth().then(function () {
      db.ref(ROOT + '/config').on('value', function (snap) {
        var c = snap.val() || {};
        var firstLoad = !S._configLoaded;
        S._configLoaded = true;
        S.config = { categories: c.categories || {}, authors: c.authors || {} };
        /* First run: no categories yet. Use the starting set on screen, and
           write them once if this user can edit, so Settings starts populated. */
        if (!c.categories) {
          S.config.categories = DEFAULT_CATEGORIES;
          if (S.canEdit && firstLoad) {
            NL.writeAudit('content_plan_config', 'Default categories seeded');
            db.ref(ROOT + '/config/categories').set(DEFAULT_CATEGORIES).catch(fail);
          }
        }
        renderFilters();
        if (firstLoad) {
          setView(S.view === 'ideas' ? 'ideas' : 'calendar');
        } else queueRender();
      }, fail);
    }).catch(fail);
  };

  /* If auth-guard fired before this script loaded, replay the session. */
  if (window._toolDeferredSession) {
    window.TOOL.boot(window._toolDeferredSession);
    delete window._toolDeferredSession;
  }
})();
</script>
