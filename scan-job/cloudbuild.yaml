# Build config for the Brand Exposure scan container.
#
# This exists because `gcloud builds submit --tag` only ever looks for a
# Dockerfile at the root of the build context, and there is no --file flag to
# point it elsewhere (the first deploy attempt failed on exactly that).
#
# The context has to be the whole repo, because the image copies scripts/ — the
# detector, the report builder and the uploader all live there and are shared
# with the local route. So: context is `.`, and this config names the Dockerfile
# inside it.
steps:
  - name: gcr.io/cloud-builders/docker
    args: ['build', '-f', 'scan-job/Dockerfile', '-t', '${_IMG}', '.']

images: ['${_IMG}']

options:
  # The default machine spends most of the build waiting on pip resolving
  # opencv and numpy wheels; a bigger one halves it for a few pence.
  machineType: E2_HIGHCPU_8

timeout: 1800s
