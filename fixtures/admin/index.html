<!DOCTYPE html>
<!--
  NL Tools — Fixture Management
  Version: v2.3 (28/10/2026)
  File: /fixtures/admin/index.html

  The League's master fixture record: every game in every competition, with
  the dates each one has lost. Staff console. The plan, and every decision
  behind it, is system/fixture-management-plan.md.

  CHANGELOG
    v2.3 (28/10/2026) — Rearrangements, fourth pass. Three columns (games
      waiting, calendar, best dates) at a fixed size, checked at 1920×1080
      and 1280×600 (CLAUDE.md, Two screens). The match as a big header:
      date and kick-off left, competition and broadcast right. Five sharp
      weeks with half a week blurred either side, snapping a week at a time.
      Each club's half is a strip with the opponent's name, H or A,
      competition and miles beside its crest. Ops team's rules: within 48h,
      two long away trips in a row (limit adjustable, default 200 miles
      round trip), international windows (a globe on the day). Mondays,
      Thursdays, Fridays and Sundays are options, folded away. A run flag
      lists its games and dates.
    v2.2 (28/10/2026) — Rearrangements, third pass. One calendar for both
      clubs: every day split, home club's game on top, away club's below,
      each with the opponent's crest large on the right and a band with the
      name, H or A, the competition and the miles travelled. It is a
      continuous run of weeks, opening on the original date, the middle
      weeks sharp and the rest fading, with a heavy line and "1 Nov" where
      a month starts. A free day is itself the button. Wednesday is a slot
      as well as Tuesday; Mondays and Thursdays are switches.
    v2.1 (28/10/2026) — Rearrangements, second pass (Richard's review). The
      to-do list is a table in the Fixtures tab's columns. Each calendar day
      is the same size and shows the opponent's crest and full name, H or A
      and the competition. Days outside the 35-day window fade, and the
      window now runs both ways, so a game can be brought forward. Canon
      dates (Sat 24 Oct 2026), NL.monthPicker, slots in a panel beside
      the calendars, and shorter flags with club codes.
    v2.0 (28/10/2026) — Rearrangements tab. Every game awaiting a date,
      oldest original date first, with a badge when a club has more than one
      waiting. For the chosen game, the date finder (fixtures/_finder.js)
      lists every free Saturday and Tuesday (Thursdays on a switch) up to
      the midweek before the final matchday, the 35 days after the original
      date first and cleanest first within them, each with its flags; both
      clubs' months below, home on top. A slot is pencilled or confirmed,
      with a confirm step for a UK-shown game going into the blocked hours.
    v1.9 (28/10/2026) — Tabs: Fixtures, Broadcast, Settings. Broadcast lists
      every league and NL Cup game with its availability, Enhanced, moved by
      DAZN (count against the 120) and AMI (worldwide games only), changed in
      place; a broadcast game given a new date waits on a review list.
      Settings holds Results, Add cup tie and the imports. The season is a
      dropdown above the tabs and no longer repeated in a heading. Clearing
      the club filter (× or an emptied box) now clears it.
    v1.8 (28/10/2026) — Import works out a sheet's season from its own dates
      (1 July to 30 June) and imports into that season whatever is on screen,
      leaving out and counting rows dated outside it — on 28/10/2026 last
      season's sheet replaced this season's. A game's dialog takes its crowd
      (total and away), saved as the Attendance submission for that match ID.
      The import's list of crowds that differ from the sheet can be copied.
    v1.6 (28/10/2026) — Play-offs sit in their division (National, North,
      South) marked PO before the round, not in a competition of their own;
      a play-off tie is added as "North play-off" and so on. Attendance
      reads them as their division's games, as NLS files them.
    v1.5 (28/10/2026) — Import workbook on a past season: the sheet is
      keyed to the Attendance archive (fixtures/_core.js keyToAttendance),
      so every game keeps the ID its crowd is filed under — Opta IDs for
      league, NL Cup and play-offs, Attendance's own for FA ties. The check
      lists anything unmatched and any crowd more than 10% from the sheet's.
      NLS results now agree with an extra-time score held as full time + aet.
    v1.4 (28/10/2026) — A grey shield stands in for a club with no crest.
    v1.3 (28/10/2026) — Seasons: a switcher, and a past season brought in
      from the Attendance tool's archive (its match IDs stay the keys, so
      club-submitted crowds stay joined). Each game shows its crowd, read
      from Attendance — never copied — and a No crowd card lists played home
      games of League clubs with none. Neutral venue (and its name) is set
      in a game's dialog; Attendance reads it from here.
    v1.2 (28/10/2026) — A fixture can be postponed or abandoned from its
      dialog (reason, and the minute for an abandonment), and a mistaken
      lost date removed. Results: imported from the workbook, edited in the
      dialog (90 minutes, extra time, penalties), and filled a day at a time
      from NLS or by pasting rows. The list reads from a centre line — home
      name and crest right-aligned, score in the middle, away crest and name
      left — in fixed columns, so every table lines up; each day runs
      National, North, South, then the cups. Broadcast labels are coloured.
      Crests come from assets/crests/manifest.json as well as the club
      files, so EFL and other outside clubs with a crest show one.
    v1.1 (28/10/2026) — Crests only for clubs we hold one for, by crestName.
      Outside FA Cup/Trophy clubs drew a crest <img> that 404'd twice per row
      per render, uncached: a request storm that hit Pages rate limits. PL2
      guests were missing too (they wear their parent club's crest). The
      list also draws 200 rows at a time.
    v1.0 (28/10/2026) — First build: the Fixtures tab. Imports the working
      workbook once (Fixtures + Rearrangements tabs, pasted), lists every
      game with filters for competition, club and what needs attention,
      adds and edits cup ties (NL Cup knockouts, play-offs, FA Cup, FA
      Trophy), takes Opta IDs and FA results. Rearrangements, Broadcast and
      AMI arrive as their own tabs in later PRs.

  Storage (RTDB):
    app-data/ops-fixture-management/seasons/<season>/fixtures/<key>
        the full record — staff only (fixtures/_core.js has the shape)
    app-data/ops-fixture-management/seasons/<season>/public/<key>
        the projection every signed-in user may read: current date and
        kick-off, teams, Worldwide/Overseas only, nothing awaiting a date
    app-data/ops-fixture-management/seasons/<season>/meta
        { importedAt, importedBy, counts }
    Both fixture nodes are written in one update, so they cannot disagree.

  Access (auth-guard registry — see system/auth-guard.js):
    toolLevel admin → edit and import. access → read only. Club roles are
    off until the public page ships.
-->

  /* One month calendar for both clubs. Each day is split: the home club's

     one where both halves are empty. Every day the same size.
     Canon candidate (28/10/2026): the plan wants a canon month calendar. */
  .fm-cal { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .fm-cal__head { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }

  .fm-cal__scroll { position: relative; height: calc(var(--wk) * 6); overflow-y: auto; overscroll-behavior: contain;
    scroll-snap-type: y mandatory; scroll-padding-top: calc(var(--wk) / 2); }
  .fm-cal__week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); height: var(--wk); scroll-snap-align: start; }
  .fm-cal__edge { position: absolute; left: 0; right: 0; height: calc(var(--wk) / 2); pointer-events: none; z-index: 2;
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
  .fm-cal__edge--top { top: 0; -webkit-mask-image: linear-gradient(to bottom, #000 10%, transparent); mask-image: linear-gradient(to bottom, #000 10%, transparent);
    background: linear-gradient(to bottom, var(--white) 0%, transparent 100%); }
  .fm-cal__edge--bot { bottom: 0; -webkit-mask-image: linear-gradient(to top, #000 10%, transparent); mask-image: linear-gradient(to top, #000 10%, transparent);
    background: linear-gradient(to top, var(--white) 0%, transparent 100%); }
  .fm-globe { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 1.4; vertical-align: -2px; margin-right: 3px; }
  .fm-cal__intl { color: var(--blue); display: inline-flex; }
  .fm-cal__intl .fm-globe { margin: 0; width: 13px; height: 13px; }

  /* The match being rearranged: its name big, date left, tags right. */
  .fm-match { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px;
    padding: 0 0 8px; border-bottom: 1px solid var(--navy-100); }
  .fm-match__main { flex: 1; min-width: 0; }
  .fm-match__side { display: grid; justify-items: end; gap: 4px; position: relative; flex: 0 0 auto; }
  .fm-match__pencil { display: flex; gap: 8px; align-items: center; margin: 6px 0 0; }
  .fm-match__title { margin: 0 0 4px; font-size: clamp(var(--text-lg), 2.2vw, var(--text-xl)); line-height: 1.15; color: var(--navy);
    font-weight: 800; font-variation-settings: 'wght' 800; text-transform: none; letter-spacing: 0; }
  .fm-match__title span { color: var(--text-muted); font-weight: 400; font-variation-settings: 'wght' 400; }
  .fm-match__when { display: flex; gap: 2px 16px; flex-wrap: wrap; margin: 0; font-size: var(--text-base); font-weight: 700; color: var(--navy); }
  .fm-match__when span { font-weight: 400; color: var(--text-muted); font-size: var(--text-sm); align-self: center; }
  .fm-match__tags { display: flex; gap: 8px; align-items: center; }
  .fm-more { font-size: var(--text-sm); }
  .fm-more > summary { padding: 2px 6px; }
  .fm-more__body { position: absolute; right: 0; top: 100%; z-index: 5; width: 280px; display: flex; gap: 8px 14px; flex-wrap: wrap; align-items: center;
    padding: 10px 12px; background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-lg); }
  .fm-more__label { width: 100%; font-size: var(--text-xs); color: var(--text-muted); text-transform: uppercase; letter-spacing: var(--tracking-wide); }
  .fm-more__long { width: 100%; }
  .fm-more__body label { display: flex; gap: 6px; align-items: center; }
  .fm-more__body input[type=number] { width: 72px; }
  .fm-flag-group { display: grid; gap: 3px; width: 100%; }
  .fm-flag-items { display: grid; gap: 1px; padding-left: 12px; border-left: 2px solid var(--border); font-size: var(--text-xs); color: var(--text-muted); }
  .fm-flag-items b { color: var(--text); font-weight: 700; font-variation-settings: 'wght' 700; margin-right: 4px; }
  .fm-cal__day.is-alt { background: var(--navy-50); }
  .fm-cal__day.is-mtop { border-top: 3px solid var(--navy); }
  .fm-cal__day.is-mfirst { border-left: 3px solid var(--navy); }
  .fm-cal__mon { color: var(--primary); text-transform: uppercase; letter-spacing: .03em; }
  .fm-cal__dow { padding: 6px 0; text-align: center; font-size: var(--text-xs); text-transform: uppercase;
    letter-spacing: var(--tracking-wide); color: var(--text-muted); }
  .fm-cal__day { position: relative; display: grid; grid-template-rows: 1fr 1fr; min-width: 0; overflow: hidden;
    border-right: 1px solid var(--navy-100); border-bottom: 1px solid var(--navy-100); font-size: var(--text-xs); }
  .fm-cal__day:nth-child(7n) { border-right: none; }
  .fm-cal__n { position: absolute; top: 4px; left: 6px; z-index: 1; display: flex; gap: 5px; align-items: baseline;
    font-size: var(--text-sm); font-weight: 800; font-variation-settings: 'wght' 800; color: var(--navy); font-variant-numeric: tabular-nums; }
  .fm-cal__cup { font-size: 10px; color: var(--purple); letter-spacing: .02em; }
  /* A club's half with a game in it is a tinted strip: name, H/A,
     competition and miles on the left, the opponent's crest on the right,
     side by side so neither covers the other at any height. The top half
     leaves room for the day number. */
  .fm-half { position: relative; min-width: 0; }
  .fm-half + .fm-half { border-top: 1px dashed var(--navy-100); }
  .fm-half.has-game { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: end; gap: 4px; padding: 2px 4px 3px 6px; }
  .fm-half--top.has-game { background: var(--navy-100); padding-top: 18px; }
  .fm-half--bot.has-game { background: var(--primary-100); }
  .fm-half__crest { grid-column: 2; grid-row: 1; align-self: center; }
  .fm-half__crest img, .fm-half__crest .fm-crest-none { width: 34px; height: 34px; object-fit: contain; display: block; }
  .fm-half--top .fm-half__crest img, .fm-half--top .fm-half__crest .fm-crest-none { width: 30px; height: 30px; }
  .fm-half__band { grid-column: 1; grid-row: 1; display: grid; gap: 2px; min-width: 0; }
  .fm-half__opp { font-weight: 800; font-variation-settings: 'wght' 800; color: var(--navy); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fm-half__meta { display: flex; gap: 4px; align-items: center; white-space: nowrap; overflow: hidden; }
  .fm-half__mi { font-weight: 700; color: var(--navy); font-variant-numeric: tabular-nums; }
  .fm-half.is-pencil { opacity: .6; }
  .fm-half.has-game.is-pencil { background: var(--amber-light); }
  .fm-cal__comp { font-size: 10px; font-weight: 800; font-variation-settings: 'wght' 800; letter-spacing: .04em; white-space: nowrap;
    padding: 1px 5px; border-radius: var(--radius-pill); background: var(--comp-pill-bg, var(--off-white));
    color: var(--comp-pill-ink, var(--text-muted)); box-shadow: inset 0 0 0 1px var(--comp-pill-edge, var(--border)); }
  .fm-ha { display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; border-radius: var(--radius-sm);
    font-size: 11px; font-weight: 800; font-variation-settings: 'wght' 800; }
  .fm-ha--h { background: var(--navy); color: var(--white); }
  .fm-ha--a { background: var(--white); color: var(--navy); box-shadow: inset 0 0 0 1.5px var(--navy); }

  /* A free day: the whole cell is the button. Green when clean, amber with
     flags, red with a red flag; faded outside the 35 days. */
  .fm-free { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    border: 0; padding: 0; font: inherit; cursor: pointer; background: var(--green-light); color: var(--green);
    box-shadow: inset 0 0 0 2px var(--green); }
  .fm-free strong { font-size: var(--text-sm); text-transform: uppercase; letter-spacing: var(--tracking-wide); font-weight: 800; font-variation-settings: 'wght' 800; }
  .fm-free--amber { background: var(--amber-light); color: var(--amber-deep); box-shadow: inset 0 0 0 2px var(--amber); }
  .fm-free--red { background: var(--red-light); color: var(--red); box-shadow: inset 0 0 0 2px var(--red); }
  .fm-free:hover, .fm-free:focus-visible { outline: none; box-shadow: inset 0 0 0 3px var(--navy); }
  .fm-cal__day.is-on .fm-free { box-shadow: inset 0 0 0 3px var(--navy); }
  .fm-cal__day.is-out .fm-free { opacity: .55; }
  .fm-cal__day.is-out { background: var(--off-white); }
  .fm-cal__day.is-out .fm-half { opacity: .55; }
  .fm-cal__day.is-past { background: var(--off-white); }
  .fm-cal__day.is-past > * { opacity: .35; }
  .fm-cal__day.is-orig::after { content: ''; position: absolute; inset: 0; box-shadow: inset 0 0 0 3px var(--primary); pointer-events: none; }
  .fm-cal__day.is-today .fm-cal__n { color: var(--primary); }
  .fm-cal__key { display: flex; gap: 14px; flex-wrap: wrap; font-size: var(--text-xs); color: var(--text-muted); padding: 8px 12px; border-top: 1px solid var(--navy-100); }
  .fm-cal__key span::before { content: ''; display: inline-block; width: 12px; height: 12px; margin-right: 5px; vertical-align: -2px; border-radius: 2px; }
  .fm-cal__key .k-free::before { background: var(--green-light); box-shadow: inset 0 0 0 2px var(--green); }
  .fm-cal__key .k-flag::before { background: var(--amber-light); box-shadow: inset 0 0 0 2px var(--amber); }
  .fm-cal__key .k-out::before { background: var(--green-light); box-shadow: inset 0 0 0 2px var(--green); opacity: .5; }
  .fm-cal__key .k-pencil::before { background: var(--amber-light); }
  .fm-cal__key .k-orig::before { box-shadow: inset 0 0 0 2px var(--primary); }
  .fm-problems { max-height: 260px; overflow: auto; margin: 8px 0 0; padding-left: 18px; font-size: var(--text-sm); }
</style>
</head>
<body>

<!-- Topbar — auto-rendered by /system/nl-topbar.js from window.NL_TOOL -->
<div id="nlTopbar"></div>

<div id="pageWrap">
  <div class="page">

    <div class="fm-top">
      <select class="nl-select fm-season" id="fmSeasonSel" aria-label="Season"></select>
      <div class="tabs fm-tabs" id="fmTabs" role="tablist">
        <button class="tab active" type="button" role="tab" data-tab="fixtures">Fixtures</button>
        <button class="tab" type="button" role="tab" data-tab="rearrange">Rearrangements</button>
        <button class="tab" type="button" role="tab" data-tab="broadcast">Broadcast</button>
        <button class="tab" type="button" role="tab" data-tab="settings" id="fmSettingsTab" hidden>Settings</button>
      </div>
    </div>

    <section data-panel="fixtures">
      <div class="stats" id="fmStats"></div>
      <div class="filter-bar">
        <div class="chip-group" id="fmComps" role="group" aria-label="Competition"></div>
        <div class="fm-picker" id="fmClub"></div>
        <div class="chip-group" id="fmWhen" role="group" aria-label="Dates">
          <button class="chip active" type="button" data-when="upcoming">Upcoming</button>
          <button class="chip" type="button" data-when="all">All</button>
        </div>
      </div>
      <div id="fmBody"></div>
    </section>

    <section data-panel="rearrange" hidden>
      <div id="fmRrBody"></div>
    </section>

    <section data-panel="broadcast" hidden>
      <div class="filter-bar">
        <div class="chip-group" id="fmBcComps" role="group" aria-label="Competition"></div>
        <div class="chip-group" id="fmBcStatus" role="group" aria-label="Status"></div>
        <div class="chip-group" id="fmBcWhen" role="group" aria-label="Dates">
          <button class="chip active" type="button" data-when="upcoming">Upcoming</button>
          <button class="chip" type="button" data-when="all">All</button>
        </div>
      </div>
      <p class="fm-bc-tally" id="fmBcTally"></p>
      <div id="fmBcBody"></div>
    </section>

    <section data-panel="settings" hidden>
      <div class="fm-settings">
        <div class="fm-setting">
          <button class="btn btn--navy btn--sm fm-setting__btn" type="button" id="fmResults">Results</button>
          <span>Fill a day’s results from NLS, or paste rows.</span>
        </div>
        <div class="fm-setting" id="fmAddRow">
          <button class="btn btn--primary btn--sm fm-setting__btn" type="button" id="fmAdd">Add cup tie</button>
          <span>NL Cup knockouts, play-offs, FA Cup and FA Trophy.</span>
        </div>
        <div class="fm-setting">
          <button class="btn btn--ghost btn--sm fm-setting__btn" type="button" id="fmImport">Import workbook</button>
          <span>Replaces every fixture in the sheet’s season.</span>
        </div>
        <div class="fm-setting" id="fmFromAttRow" hidden>
          <button class="btn btn--ghost btn--sm fm-setting__btn" type="button" id="fmFromAtt">Bring in from Attendance</button>
          <span>A past season from Attendance’s own record, when there is no sheet.</span>
        </div>
      </div>
    </section>

  </div>
</div>

<!-- Main app -->
<script>
(function () {
  'use strict';

  var F = window.FixturesCore;
  var esc = NL.escHtml;
  var BASE = 'app-data/ops-fixture-management/seasons/';
  var SEED_URL = '/assets/data/fixtures-2026-27.json';
  var REASONS_URL = '/assets/data/postponement-reasons.json';
  var CRESTS_URL = '/assets/crests/manifest.json';
  /* Rows drawn at once. A season is ~1,900 games; drawing them all is
     ~3,800 crest images and a slow page for a list read from the top. */
  var PAGE = 200;

  var S = {
    session: null,
    canEdit: false,
    meta: null,
    guests: [],
    crests: {},          /* name → true, from the crest manifest */
    reasons: [],
    season: null,
    fixtures: {},
    comp: 'all',
    club: null,
    when: 'upcoming',
    need: null,          /* 'awaiting' | 'noOpta' | 'cupDue' — a stat card filter */
    picker: null,
    limit: PAGE,
    tab: 'fixtures',
    bc: { comp: 'all', status: 'all', when: 'upcoming', limit: PAGE },
    rr: { key: null, mondays: false, thursdays: false, fridays: false, sundays: false, longTrip: 200, moreOpen: false, anchor: null, scroll: null, drawn: null, slot: null, data: {} },
    current: null,       /* the current season key */
    listen: null,        /* the live fixtures ref for the viewed season */
    crowds: {}           /* matchID → { total, away } from Attendance */
  };

  function today() { return F.ymdOf(new Date()); }
  function ref(path) { return db.ref(BASE + S.season + (path ? '/' + path : '')); }
  function now() { return new Date().toISOString(); }

  /* Firebase rejects undefined anywhere in a write; a JSON round trip drops it. */
  function clean(o) { return JSON.parse(JSON.stringify(o)); }

  function clubOf(name) {
    if (!name) return null;
    var c = NL.clubs.byName(name) || NL.clubs.guestByName(name);
    return c ? { name: c.name, code: c.code || null } : null;
  }

  function getJson(url) {
    return fetch(url, { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; });
  }

  /* ── Boot ─────────────────────────────────────────────────────────── */
  window.TOOL = window.TOOL || {};
  window.TOOL.boot = function (session) {
    S.session = session;
    S.canEdit = session.toolLevel === 'admin';
    document.getElementById('fmSettingsTab').hidden = !S.canEdit;
    renderComps();
    wireStatic();

    NL.ensureAuth()
      .then(function () {
        return Promise.all([
          NL.clubs.load(),
          NL.clubs.guests().catch(function () { return []; }),
          getJson(CRESTS_URL),
          getJson(REASONS_URL)
        ]);
      })
      .then(function (r) {
        S.meta = r[0];
        S.guests = r[1] || [];
        ((r[2] && r[2].names) || []).forEach(function (n) { S.crests[n] = true; });
        S.reasons = ((r[3] && r[3].reasons) || []).map(function (x) { return x.label; });
        S.current = NL.season.current(S.meta) || String(NL.season.fromDate());
        S.picker = NL.clubPicker('#fmClub', {
          mode: 'search', season: 'all', clearable: true, extraClubs: S.guests,
          placeholder: 'Any club',
          onSelect: function (sel) { S.club = sel ? sel.name : null; S.limit = PAGE; render(); }
        });
        renderSeasons();
        openSeason(S.current);
      })
      .catch(function (err) {
        document.getElementById('fmBody').innerHTML =
          '<div class="banner banner--error">Could not load club data: ' + esc(err.message) + '</div>';
      });
  };

  /* ── Seasons ──────────────────────────────────────────────────────────
     A closed set: the seasons clubs-meta knows. The workbook import is for
     the current one; a past one comes in from Attendance. */
  function renderSeasons() {
    document.getElementById('fmSeasonSel').innerHTML = NL.season.keys(S.meta).map(function (k) {
      return '<option value="' + esc(k) + '"' + (k === S.current ? ' selected' : '') + '>' + esc(NL.season.label(S.meta, k)) + '</option>';
    }).join('');
  }

  function openSeason(key) {
    if (S.listen) S.listen.off();
    S.season = key;
    S.fixtures = {};
    S.crowds = {};
    S.limit = PAGE;
    var past = key !== S.current;
    document.getElementById('fmSeasonSel').value = key;
    document.getElementById('fmFromAttRow').hidden = !past;
    document.getElementById('fmAddRow').hidden = past;
    loadCrowds(key);
    S.listen = ref('fixtures');
    S.listen.on('value', function (snap) {
      S.fixtures = snap.val() || {};
      render();
    }, function (err) {
      document.getElementById('fmBody').innerHTML =
        '<div class="banner banner--error">Could not read fixtures: ' + esc(err.message) + '</div>';
    });
  }

  /* Crowds are club submissions in the Attendance tool, filed under the
     match ID. Read, never copied: a figure lives in one place. */
  function attPath(key, node) {
    return 'app-data/ops-attendance/' + (key === S.current ? '' : 'archive/' + key + '/') + node;
  }
  function crowdsOf(subs) {
    var out = {};
    Object.keys(subs || {}).forEach(function (id) {
      var x = subs[id] || {};
      if (x.total != null) out[id] = { total: +x.total, away: x.awayRecorded !== false && x.away != null ? +x.away : null };
    });
    return out;
  }
  function loadCrowds(key) {
    NL.ensureAuth()
      .then(function () { return db.ref(attPath(key, 'submissions')).once('value'); })
      .then(function (snap) {
        if (S.season !== key) return;
        S.crowds = crowdsOf(snap.val());
        render();
      })
      .catch(function () { /* no crowds is not an error: the column stays empty */ });
  }

  /* A crowd is expected for a game a League club hosted (or a neutral
     one), once it has a result or its date has passed. */
  function crowdDue(r, t) {
    if (!r.date || S.crowds[r.key]) return false;
    if (!(r.result || r.date < t)) return false;
    return !!(r.home.code || r.neutral);
  }

  function wireStatic() {
    document.getElementById('fmSeasonSel').addEventListener('change', function (e) {
      if (e.target.value !== S.season) openSeason(e.target.value);
    });
    document.getElementById('fmTabs').addEventListener('click', function (e) {
      var b = e.target.closest('[data-tab]');
      if (!b) return;
      S.tab = b.getAttribute('data-tab');
      setActive('fmTabs', b);
      Array.prototype.forEach.call(document.querySelectorAll('[data-panel]'), function (p) {
        p.hidden = p.getAttribute('data-panel') !== S.tab;
      });
      render();
    });
    /* NL.clubPicker's × and an emptied box clear the picker without calling
       onSelect, so the filter would stay on. Watch for both here.
       Canon candidate (28/10/2026): the picker should tell its caller. */
    var club = document.getElementById('fmClub');
    /* Capture phase: the × stops its click from bubbling. */
    club.addEventListener('click', function (e) {
      if (!e.target.closest('.club-picker__clear')) return;
      S.club = null; S.limit = PAGE; render();
    }, true);
    club.addEventListener('input', function (e) {
      if (e.target.value === '' && S.club) { S.club = null; S.limit = PAGE; render(); }
    });
    wireBroadcast();
    wireRearrange();
    document.getElementById('fmFromAtt').addEventListener('click', openFromAttendance);
    document.getElementById('fmImport').addEventListener('click', openImport);
    document.getElementById('fmResults').addEventListener('click', openResults);
    document.getElementById('fmAdd').addEventListener('click', function () { openEdit(null); });
    document.getElementById('fmWhen').addEventListener('click', function (e) {
      var b = e.target.closest('[data-when]');
      if (!b) return;
      S.when = b.getAttribute('data-when');
      S.limit = PAGE;
      setActive('fmWhen', b);
      render();
    });
    document.getElementById('fmComps').addEventListener('click', function (e) {
      var b = e.target.closest('[data-comp]');
      if (!b) return;
      S.comp = b.getAttribute('data-comp');
      S.limit = PAGE;
      setActive('fmComps', b);
      render();
    });
    document.getElementById('fmStats').addEventListener('click', function (e) {
      var s = e.target.closest('[data-need]');
      if (!s) return;
      var n = s.getAttribute('data-need');
      S.need = (S.need === n || n === 'all') ? null : n;
      S.limit = PAGE;
      render();
    });
    document.getElementById('fmBody').addEventListener('click', function (e) {
      if (e.target.closest('[data-more]')) { S.limit += PAGE; render(); return; }
      var tr = e.target.closest('[data-key]');
      if (tr) openEdit(S.fixtures[tr.getAttribute('data-key')] || null);
    });
  }

  function setActive(groupId, btn) {
    Array.prototype.forEach.call(document.getElementById(groupId).children, function (c) {
      c.classList.toggle('active', c === btn);
    });
  }

  function renderComps() {
    var html = '<button class="chip active" type="button" data-comp="all">All</button>';
    F.COMPS.forEach(function (c) {
      html += '<button class="chip" type="button" data-comp="' + c.key + '">' + esc(c.label) + '</button>';
    });
    document.getElementById('fmComps').innerHTML = html;
  }

  /* ── List ─────────────────────────────────────────────────────────── */
  function passes(r, t) {
    if (S.comp !== 'all' && r.comp !== S.comp) return false;
    if (S.club && r.home.name !== S.club && r.away.name !== S.club) return false;
    if (S.need === 'awaiting' && !F.awaiting(r)) return false;
    if (S.need === 'noOpta' && (r.optaID || F.COMP_BY_KEY[r.comp].fa)) return false;
    if (S.need === 'cupDue' && !F.cupResultDue(r, t)) return false;
    if (S.need === 'noCrowd' && !crowdDue(r, t)) return false;
    if (!S.need && S.when === 'upcoming' && r.date && r.date < t) return false;
    return true;
  }

  function render() {
    if (S.tab === 'broadcast') { renderBroadcast(); return; }
    if (S.tab === 'rearrange') { renderRearrange(); return; }
    var t = today();
    var all = Object.keys(S.fixtures).map(function (k) { return S.fixtures[k]; });
    renderStats(F.counts(S.fixtures, t));

    var body = document.getElementById('fmBody');
    if (!all.length) {
      body.innerHTML = '<div class="empty-state"><div class="empty-state__title">No fixtures for ' +
        esc(NL.season.label(S.meta, S.season)) + ' yet</div>' +
        (S.canEdit ? '<div class="empty-state__text">Import the workbook to start.</div>' : '') + '</div>';
      return;
    }

    var list = all.filter(function (r) { return passes(r, t); });
    var waiting = list.filter(F.awaiting).sort(function (a, b) {
      var x = lastLost(a), y = lastLost(b);
      return x !== y ? (x < y ? -1 : 1) : F.compare(a, b);
    });
    var dated = list.filter(function (r) { return !F.awaiting(r); }).sort(F.compare);

    var html = '';
    if (waiting.length) {
      html += '<div class="section-head"><h2>Awaiting a date</h2></div>' + tableOf(waiting, true);
    }
    if (dated.length) {
      if (waiting.length) html += '<div class="section-head fm-gap"><h2>Dated</h2></div>';
      html += tableOf(dated.slice(0, S.limit), false);
      if (dated.length > S.limit) {
        html += '<div class="filter-bar fm-gap"><button class="btn btn--ghost btn--sm" type="button" data-more>' +
          'Show ' + Math.min(PAGE, dated.length - S.limit) + ' more of ' + (dated.length - S.limit) + '</button></div>';
      }
    }
    if (!waiting.length && !dated.length) {
      html = '<div class="empty-state"><div class="empty-state__title">Nothing matches</div></div>';
    }
    body.innerHTML = html;
    NL.clubs.wireCrestImgs(body);
  }

  function lastLost(r) {
    var a = r.attempts || [];
    return a.length ? a[a.length - 1].date : '';
  }

  function renderStats(c) {
    var t = today(), noCrowd = 0;
    Object.keys(S.fixtures).forEach(function (k) { if (crowdDue(S.fixtures[k], t)) noCrowd++; });
    var cards = [
      ['all', c.total, 'Fixtures'],
      ['awaiting', c.awaiting, 'Awaiting a date'],
      ['noOpta', c.noOpta, 'No Opta ID'],
      ['cupDue', c.cupDue, 'FA results due'],
      ['noCrowd', noCrowd, 'No crowd']
    ];
    document.getElementById('fmStats').innerHTML = cards.map(function (x) {
      return '<div class="stat fm-card' + (S.need === x[0] ? ' is-on' : '') + '" data-need="' + x[0] + '" role="button" tabindex="0">' +
        '<div class="stat__num">' + x[1] + '</div><div class="stat__label">' + esc(x[2]) + '</div></div>';
    }).join('');
  }

  /* A crest is requested only when we know the file exists: the roster
     and cup guests by crestName ("Fulham PL2" wears Fulham's), then any
     other club named in assets/crests/manifest.json — the EFL sides met in
     the FA Cup, say. Never probe: a crest <img> for a club with no file
     404s twice per row per render, uncached, and a list of FA ties did
     that ~1,500 times and hit Pages rate limits (28/10/2026). */
  function crestOf(name) {
    var c = NL.clubs.byName(name) || NL.clubs.guestByName(name);
    if (c) return c.crestName || c.name;
    return S.crests[name] ? name : null;
  }

  /* A plain grey shield for a club we hold no crest for: an inline SVG, so
     it costs no request. */
  var NO_CREST = '<svg class="fm-crest-none" viewBox="0 0 24 24" aria-hidden="true">' +
    '<path d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5l-8-3z"/></svg>';

  function crest(name) {
    var c = crestOf(name);
    return c ? NL.clubs.crestImgHtml(c, 'thumb') : NO_CREST;
  }

  /* Home: name then crest, right-aligned to the centre line. Away: crest
     then name, left-aligned from it. */
  function team(side, home) {
    var name = '<span class="fm-name">' + esc(side.name) + '</span>';
    return '<div class="fm-team' + (home ? ' fm-team--home' : '') + '">' +
      (home ? name + crest(side.name) : crest(side.name) + name) + '</div>';
  }

  function compPill(key) {
    var c = F.COMP_BY_KEY[key];
    return '<span class="comp-pill' + (c && c.pill ? ' comp-pill--' + c.pill : '') + '">' + esc(c ? c.label : key) + '</span>';
  }

  function broadcastPill(r) {
    var a = F.AVAIL_BY_KEY[r.broadcast && r.broadcast.availability];
    return a ? '<span class="pill fm-bc--' + a.key + '">' + esc(a.label) + '</span>' : '';
  }

  function flags(r, t) {
    var out = [];
    var lost = (r.attempts || []).length;
    if (F.awaiting(r)) out.push('<span class="pill pill--postponed">' + esc(r.state === 'abandoned' ? 'Abandoned' : 'Postponed') + '</span>');
    else if (lost) out.push('<span class="pill pill--info">Moved' + (lost > 1 ? ' ×' + lost : '') + '</span>');
    if (!r.optaID && !F.COMP_BY_KEY[r.comp].fa) out.push('<span class="pill pill--pending">No Opta ID</span>');
    if (F.cupResultDue(r, t)) out.push('<span class="pill pill--pending">Result due</span>');
    return '<div class="fm-flags">' + out.join('') + '</div>';
  }

  function middle(r, t) {
    if (r.result) return '<td class="fm-mid">' + esc(F.resultText(r.result)) + '</td>';
    return '<td class="fm-mid fm-mid--v">' + (r.date && r.date < t ? '–' : 'v') + '</td>';
  }

  function crowdCell(r, t) {
    var c = S.crowds[r.key];
    if (c) return '<td class="fm-crowd" title="' + (c.away != null ? esc(c.away.toLocaleString('en-GB') + ' away') : '') + '">' +
      esc(c.total.toLocaleString('en-GB')) + '</td>';
    return '<td class="fm-crowd fm-crowd--none">' + (crowdDue(r, t) ? '–' : '') + '</td>';
  }

  var COLS = '<colgroup><col class="c-ko"><col class="c-comp"><col class="c-rd"><col>' +
    '<col class="c-mid"><col><col class="c-crowd"><col class="c-bc"><col class="c-flag"></colgroup>';

  function tableOf(rows, waiting) {
    var t = today();
    var html = '<div class="table-wrap"><table class="table table--compact fm-table">' + COLS + '<thead><tr>' +
      '<th>' + (waiting ? 'Lost' : 'KO') + '</th><th>Comp</th><th>Rd</th><th class="ta-right">Home</th>' +
      '<th class="ta-center"></th><th>Away</th><th class="ta-right">Crowd</th><th>Broadcast</th><th></th></tr></thead><tbody>';
    var day = null;
    rows.forEach(function (r) {
      if (!waiting && r.date !== day) {
        day = r.date;
        html += '<tr class="fm-day"><td colspan="9">' + esc(NL.formatDate(r.date)) + '</td></tr>';
      }
      var last = waiting ? r.attempts[r.attempts.length - 1] : null;
      html += '<tr class="fm-row" data-key="' + esc(r.key) + '">' +
        '<td class="fm-ko">' + esc(waiting ? (last ? F.fmt(last.date) : '—') : (r.ko || '—')) + '</td>' +
        '<td>' + compPill(r.comp) + '</td>' +
        '<td>' + esc((r.playoff ? 'PO ' : '') + (r.round || '')) + '</td>' +
        '<td>' + team(r.home, true) + '</td>' +
        middle(r, t) +
        '<td>' + team(r.away, false) + '</td>' +
        crowdCell(r, t) +
        '<td>' + broadcastPill(r) + '</td>' +
        '<td>' + flags(r, t) + '</td></tr>';
    });
    return html + '</tbody></table></div>';
  }

  /* ── Broadcast ───────────────────────────────────────────────────────
     Every game's availability, Enhanced, moved at DAZN's request and AMI,
     changed in place and saved at once. A broadcast game given a new date
     is flagged for review until confirmed here. FA ties are not ours to
     show, so they are not listed. */
  var BC_COMPS = ['national', 'north', 'south', 'nl-cup'];
  var BC_STATUS = [['all', 'All'], ['tbc', 'TBC'], ['worldwide', 'Worldwide'], ['overseas', 'Overseas'],
    ['not-selected', 'Not selected'], ['unavailable', 'Unavailable'], ['review', 'Review']];

  function wireBroadcast() {
    var comps = document.getElementById('fmBcComps');
    comps.innerHTML = '<button class="chip active" type="button" data-v="all">All</button>' + BC_COMPS.map(function (k) {
      return '<button class="chip" type="button" data-v="' + k + '">' + esc(F.COMP_BY_KEY[k].label) + '</button>';
    }).join('');
    var status = document.getElementById('fmBcStatus');
    status.innerHTML = BC_STATUS.map(function (x, i) {
      return '<button class="chip' + (i ? '' : ' active') + '" type="button" data-v="' + x[0] + '">' + esc(x[1]) + '</button>';
    }).join('');
    [['fmBcComps', 'comp'], ['fmBcStatus', 'status'], ['fmBcWhen', 'when']].forEach(function (g) {
      document.getElementById(g[0]).addEventListener('click', function (e) {
        var b = e.target.closest('[data-v],[data-when]');
        if (!b) return;
        S.bc[g[1]] = b.getAttribute('data-v') || b.getAttribute('data-when');
        S.bc.limit = PAGE;
        setActive(g[0], b);
        renderBroadcast();
      });
    });
    var body = document.getElementById('fmBcBody');
    body.addEventListener('change', function (e) {
      var tr = e.target.closest('[data-key]');
      if (!tr || !S.canEdit) return;
      var rec = S.fixtures[tr.getAttribute('data-key')];
      if (!rec) return;
      var n = clean(rec), field = e.target.getAttribute('data-f');
      n.broadcast = n.broadcast || {};
      if (field === 'availability') n.broadcast.availability = e.target.value;
      else n.broadcast[field] = e.target.checked;
      /* AMI takes only games shown in the UK (plan, AMI). */
      if (n.broadcast.availability !== 'worldwide') n.broadcast.ami = false;
      delete n.broadcast.review;
      save(n).catch(function (err) { NL.toast('Save failed: ' + err.message, 'error'); renderBroadcast(); });
    });
    body.addEventListener('click', function (e) {
      if (e.target.closest('[data-more]')) { S.bc.limit += PAGE; renderBroadcast(); return; }
      var ok = e.target.closest('[data-reviewed]');
      if (!ok || !S.canEdit) return;
      var rec = S.fixtures[ok.closest('[data-key]').getAttribute('data-key')];
      var n = clean(rec);
      delete n.broadcast.review;
      save(n).catch(function (err) { NL.toast('Save failed: ' + err.message, 'error'); });
    });
  }

  function renderBroadcast() {
    var t = today(), f = S.bc;
    var all = Object.keys(S.fixtures).map(function (k) { return S.fixtures[k]; })
      .filter(function (r) { return BC_COMPS.indexOf(r.comp) !== -1; });
    var moves = all.filter(function (r) { return r.broadcast && r.broadcast.daznMove; }).length;
    var ami = all.filter(function (r) { return r.broadcast && r.broadcast.ami; }).length;
    var review = all.filter(function (r) { return r.broadcast && r.broadcast.review; }).length;
    document.getElementById('fmBcTally').innerHTML = 'Moved by DAZN <strong>' + moves + ' / ' + F.DAZN_MOVES + '</strong> · AMI <strong>' +
      ami + '</strong>' + (review ? ' · <strong>' + review + '</strong> to review' : '');

    var list = all.filter(function (r) {
      var b = r.broadcast || {};
      if (!r.date) return false;
      if (f.comp !== 'all' && r.comp !== f.comp) return false;
      if (f.status === 'review') { if (!b.review) return false; }
      else if (f.status !== 'all' && b.availability !== f.status) return false;
      if (f.when === 'upcoming' && f.status !== 'review' && r.date < t) return false;
      return true;
    }).sort(F.compare);

    var body = document.getElementById('fmBcBody');
    if (!list.length) { body.innerHTML = '<div class="empty-state"><div class="empty-state__title">Nothing matches</div></div>'; return; }
    var dis = S.canEdit ? '' : ' disabled';
    var html = '<div class="table-wrap"><table class="table table--compact fm-table fm-bc-table"><colgroup>' +
      '<col class="c-ko"><col class="c-comp"><col><col class="c-mid"><col><col class="c-av"><col class="c-tick"><col class="c-tick"><col class="c-tick"></colgroup>' +
      '<thead><tr><th>KO</th><th>Comp</th><th class="ta-right">Home</th><th class="ta-center"></th><th>Away</th>' +
      '<th>Availability</th><th class="ta-center">Enhanced</th><th class="ta-center">DAZN move</th><th class="ta-center">AMI</th></tr></thead><tbody>';
    var day = null;
    list.slice(0, f.limit).forEach(function (r) {
      var b = r.broadcast || {};
      if (r.date !== day) { day = r.date; html += '<tr class="fm-day"><td colspan="9">' + esc(NL.formatDate(r.date)) + '</td></tr>'; }
      var opts = F.AVAILABILITY.filter(function (a) { return a.key !== 'cup'; }).map(function (a) {
        return '<option value="' + a.key + '"' + (b.availability === a.key ? ' selected' : '') + '>' + esc(a.label) + '</option>';
      }).join('');
      html += '<tr data-key="' + esc(r.key) + '">' +
        '<td class="fm-ko">' + esc(r.ko || '—') + '</td>' +
        '<td>' + compPill(r.comp) + '</td>' +
        '<td>' + team(r.home, true) + '</td>' + middle(r, t) + '<td>' + team(r.away, false) + '</td>' +
        '<td>' + (b.review ? '<div class="fm-flags"><span class="pill pill--pending">Moved: review</span>' +
          (S.canEdit ? '<button class="btn btn--ghost btn--sm" type="button" data-reviewed>Still right</button>' : '') + '</div>' : '') +
          '<select class="nl-select fm-bc-av" data-f="availability"' + dis + '>' + opts + '</select></td>' +
        '<td class="ta-center"><input type="checkbox" data-f="enhanced"' + (b.enhanced ? ' checked' : '') + dis + ' aria-label="Enhanced"></td>' +
        '<td class="ta-center"><input type="checkbox" data-f="daznMove"' + (b.daznMove ? ' checked' : '') + dis + ' aria-label="Moved by DAZN"></td>' +
        '<td class="ta-center"><input type="checkbox" data-f="ami"' + (b.ami ? ' checked' : '') +
          (b.availability === 'worldwide' ? dis : ' disabled') + ' aria-label="AMI"></td></tr>';
    });
    html += '</tbody></table></div>';
    if (list.length > f.limit) {
      html += '<div class="filter-bar fm-gap"><button class="btn btn--ghost btn--sm" type="button" data-more>Show ' +
        Math.min(PAGE, list.length - f.limit) + ' more of ' + (list.length - f.limit) + '</button></div>';
    }
    body.innerHTML = html;
    NL.clubs.wireCrestImgs(body);
  }

  /* ── Rearrangements ──────────────────────────────────────────────────
     Every game awaiting a date, oldest original date first, and for the
     chosen one the slots the date finder (fixtures/_finder.js) offers,
     with both clubs' months beside them. A slot is pencilled (staff only,
     a soft block on the clubs' other games) or confirmed, which gives the
     game its new date and puts it back on the public list. */
  var X = window.FixturesFinder;
  var DOW_MON = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
  var DOW_SUN = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  /* A competition in a calendar cell: the comp pill's own short form. */
  var COMP_SHORT = { national: 'NAT', north: 'NOR', south: 'SOU', 'nl-cup': 'NLC', 'fa-cup': 'FAC', 'fa-trophy': 'FAT' };

  function dayOf(d) { return DOW_SUN[new Date(d + 'T12:00:00Z').getUTCDay()]; }
  /* 'Sat 24 Oct 2026', the canon short date with its weekday. */
  function day(d) { return d ? dayOf(d) + ' ' + NL.formatDateShort(d) : '—'; }
  function dayKo(d, ko) { return day(d) + (d && ko ? ', ' + ko : ''); }

  /* The season's calendar, rounds and distances, fetched once a season.
     A season with no calendar file has nothing to rearrange into. */
  function rrData(cb) {
    var label = NL.season.label(S.meta, S.season);
    var held = S.rr.data[label];
    if (held) return held.ready ? held : null;
    S.rr.data[label] = { ready: false };
    Promise.all([
      getJson('/assets/data/calendar-' + label + '.json'),
      getJson('/assets/data/rounds-' + label + '.json'),
      getJson('/assets/data/club-distances.json')
    ]).then(function (r) {
      S.rr.data[label] = { ready: true, calendar: r[0], rounds: r[1] || {}, distances: r[2] || { pairs: {} } };
      cb();
    });
    return null;
  }

  function wireRearrange() {
    var body = document.getElementById('fmRrBody');
    body.addEventListener('click', function (e) {
      var item = e.target.closest('[data-rr]');
      if (item) { S.rr.key = item.getAttribute('data-rr'); S.rr.slot = null; renderRearrange(); return; }
      var pick = e.target.closest('[data-slot]');
      if (pick) {
        S.rr.slot = pick.getAttribute('data-slot');
        /* From the list, bring the day into view on the calendar. */
        var cell = e.target.closest('.fm-slots') && document.querySelector('#fmRrWeeks [data-week="' + mondayOf(S.rr.slot) + '"]');
        if (cell) { var box = document.getElementById('fmRrWeeks'); box.scrollTop = Math.max(0, cell.offsetTop - cell.offsetHeight / 2); }
        if (S.canEdit && e.target.closest('[data-choose]')) openChoose(S.fixtures[S.rr.key], S.rr.slot);
        else renderRearrange();
        return;
      }
      if (e.target.closest('[data-unpencil]')) {
        save(X.unpencil(S.fixtures[S.rr.key])).then(function () { NL.toast('Pencil cleared', 'success'); })
          .catch(function (err) { NL.toast('Save failed: ' + err.message, 'error'); });
        return;
      }
      if (e.target.closest('[data-confirm-pencil]')) {
        var rec = S.fixtures[S.rr.key];
        confirmDate(rec, rec.pencil.date, rec.pencil.ko);
      }
    });
    /* toggle does not bubble: capture it to remember the fold. */
    body.addEventListener('toggle', function (e) {
      if (e.target.id === 'fmRrMore') S.rr.moreOpen = e.target.open;
    }, true);
    body.addEventListener('change', function (e) {
      var dayBox = e.target.getAttribute && e.target.getAttribute('data-day');
      if (dayBox) { S.rr[dayBox] = e.target.checked; renderRearrange(); }
      if (e.target.id === 'fmRrLong' && +e.target.value > 0) { S.rr.longTrip = Math.round(+e.target.value); renderRearrange(); }
    });
  }

  function renderRearrange() {
    var body = document.getElementById('fmRrBody');
    var data = rrData(renderRearrange);
    if (!data) { body.innerHTML = '<div class="empty-state"><div class="empty-state__title">Loading…</div></div>'; return; }
    if (!data.calendar) {
      body.innerHTML = '<div class="empty-state"><div class="empty-state__title">No season calendar for ' +
        esc(NL.season.label(S.meta, S.season)) + '</div></div>';
      return;
    }
    var list = X.todo(S.fixtures);
    if (!list.length) {
      body.innerHTML = '<div class="empty-state"><div class="empty-state__title">Nothing awaiting a date</div></div>';
      return;
    }
    if (!S.rr.key || !S.fixtures[S.rr.key] || S.fixtures[S.rr.key].date) S.rr.key = list[0].rec.key;
    var same = S.rr.drawn === S.rr.key;
    body.innerHTML = '<div class="fm-rr-app"><div class="fm-rr-todo" id="fmRrTodo">' + todoList(list) + '</div>' +
      gameOf(S.fixtures[S.rr.key], list, data) + '</div>';
    wireWeeks(same ? S.rr.scroll : null);
    S.rr.drawn = S.rr.key;
    NL.clubs.wireCrestImgs(body);
  }

  /* The to-do list: a column of games, oldest original date first. */
  function todoList(list) {
    return '<div class="fm-panel__head">Awaiting a date · ' + list.length + '</div>' + list.map(function (x) {
      var r = x.rec, lost = r.attempts || [], last = lost[lost.length - 1];
      var orig = r.original || {};
      var tags = [[r.home, x.backlog.home], [r.away, x.backlog.away]].filter(function (p) { return p[1] > 0; }).map(function (p) {
        return '<span class="pill pill--pending" title="' + esc(p[0].name) + ' has ' + p[1] + ' more awaiting a date">' +
          esc((p[0].code || p[0].name) + ' +' + p[1]) + '</span>';
      });
      if (r.pencil) tags.unshift('<span class="pill pill--info">Pencilled ' + esc(day(r.pencil.date)) + '</span>');
      return '<button type="button" class="fm-todo' + (r.key === S.rr.key ? ' is-on' : '') + '" data-rr="' + esc(r.key) + '">' +
        '<span class="fm-todo__when">' + esc(dayKo(x.original, orig.date === x.original ? orig.ko : null)) + compPill(r.comp) + '</span>' +
        '<span class="fm-todo__side">' + crest(r.home.name) + '<span>' + esc(r.home.name) + '</span></span>' +
        '<span class="fm-todo__side">' + crest(r.away.name) + '<span>' + esc(r.away.name) + '</span></span>' +
        (last && last.reason ? '<span class="fm-todo__why">' + esc(last.reason) + '</span>' : '') +
        (tags.length ? '<span class="fm-flags">' + tags.join('') + '</span>' : '') + '</button>';
    }).join('');
  }


  function gameOf(rec, list, data) {
    var res = X.slots(rec, {
      fixtures: S.fixtures, calendar: data.calendar, rounds: data.rounds,
      distances: data.distances, today: today()
    }, { mondays: S.rr.mondays, thursdays: S.rr.thursdays, fridays: S.rr.fridays, sundays: S.rr.sundays, longTrip: S.rr.longTrip });
    var lost = rec.attempts || [], last = lost[lost.length - 1];
    var journey = milesOf(data.distances, rec.home, rec.away, true);
    var orig = rec.original || {};
    var focus = S.rr.slot || (rec.pencil && rec.pencil.date) || null;
    S.rr.anchor = focus || res.original || res.from;

    /* The rarer days and the long-trip limit, folded away in the header;
       open, it floats rather than pushing the calendar down. */
    var extra = [['mondays', 'Mon'], ['thursdays', 'Thu'], ['fridays', 'Fri'], ['sundays', 'Sun']];
    var on = extra.filter(function (x) { return S.rr[x[0]]; }).map(function (x) { return x[1]; });
    var more = '<details class="disclosure fm-more" id="fmRrMore"' + (S.rr.moreOpen ? ' open' : '') + '>' +
      '<summary>Options<span class="disclosure__meta">' + esc((on.length ? '+' + on.join(', ') + ' · ' : '') + S.rr.longTrip + ' mi') +
        '</span></summary><div class="fm-more__body">' +
      '<span class="fm-more__label">Also offer</span>' +
      extra.map(function (x) {
        return '<label><input type="checkbox" data-day="' + x[0] + '"' + (S.rr[x[0]] ? ' checked' : '') + '> ' + x[1] + '</label>';
      }).join('') +
      '<label class="fm-more__long">Long trip: round trip over <input type="number" id="fmRrLong" min="50" max="600" step="10" value="' + S.rr.longTrip + '"> mi</label>' +
      '</div></details>';

    var pencilLine = rec.pencil ? '<p class="fm-match__pencil"><span class="pill pill--info">Pencilled ' + esc(dayKo(rec.pencil.date, rec.pencil.ko)) + '</span>' +
      (S.canEdit ? '<button class="btn btn--primary btn--sm" type="button" data-confirm-pencil>Confirm</button>' +
        '<button class="btn btn--ghost btn--sm" type="button" data-unpencil>Clear</button>' : '') + '</p>' : '';

    var html = '<div class="fm-rr-game"><div class="fm-match"><div class="fm-match__main">' +
      '<h2 class="fm-match__title">' + esc(rec.home.name) + ' <span>v</span> ' + esc(rec.away.name) + '</h2>' +
      '<p class="fm-match__when">' + esc(dayKo(res.original, orig.date === res.original ? orig.ko : null)) +
        (last ? '<span>' + esc((last.outcome === 'abandoned' ? 'Abandoned' : 'Postponed') +
          (last.date !== res.original ? ' ' + day(last.date) : '') + (last.reason ? ': ' + last.reason : '')) + '</span>' : '') +
        (journey ? '<span>' + esc(rec.away.name) + ' travel ' + esc(journey) + '</span>' : '') + '</p>' + pencilLine + '</div>' +
      '<div class="fm-match__side"><div class="fm-match__tags">' + compPill(rec.comp) + broadcastPill(rec) + '</div>' + more + '</div></div>';

    html += '<div class="fm-rr-cal">' + calendar(rec, res, data, focus) + '</div>' +
      '<div class="fm-rr-dates" id="fmRrSlots">' + slotList(res, focus) + '</div></div>';
    return html;
  }

  /* The away side's journey for a game between two League clubs, from
     the distances table: '237 mi', or with time '237 mi · 4h06'. Null for
     an outside club, which has no coordinates. */
  function milesOf(distances, home, away, withTime) {
    var p = home.code && away.code ? (distances.pairs || {})[home.code + '|' + away.code] : null;
    if (!p) return null;
    var m = Math.round(p[1]);
    return Math.round(p[0]) + ' mi' + (withTime ? ' · ' + Math.floor(m / 60) + 'h' + ('0' + (m % 60)).slice(-2) : '');
  }

  function slotLevel(s) {
    return s.flags.some(function (f) { return f.level === 'red'; }) ? 'red'
      : s.flags.some(function (f) { return f.level === 'amber'; }) ? 'amber' : 'green';
  }

  var KEY = '<div class="fm-cal__key"><span class="k-free">Free, clear</span><span class="k-flag">Free, with flags</span>' +
    '<span class="k-out">35+ days out</span><span class="k-pencil">Pencilled</span><span class="k-orig">Original date</span></div>';

  function slotList(res, focus) {
    if (!res.slots.length) return '<div class="banner banner--amber">No date free for both clubs before ' + esc(day(res.to)) + '.</div>';
    var html = '<div class="fm-slots"><div class="fm-slots__head">Best dates</div>', divided = false;
    res.slots.forEach(function (s) {
      if (!s.within35 && !divided) {
        divided = true;
        html += '<div class="fm-slot-div">More than 35 days from the original date</div>';
      }
      html += '<button type="button" class="fm-slot' + (s.date === focus ? ' is-on' : '') + '" data-slot="' + s.date + '" data-choose>' +
        '<span class="fm-slot__date">' + esc(day(s.date)) + '</span>' +
        (s.flags.length ? '<span class="fm-flags">' + s.flags.map(flagPill).join('') + '</span>'
          : '<span class="fm-flags"><span class="pill pill--approved">Clear</span></span>') + '</button>';
    });
    return html + '</div>' + KEY;
  }

  /* A flag, and under it the games behind it, one a line, so a run's
     spacing can be judged. */
  function flagPill(f) {
    var cls = f.level === 'red' ? 'pill--rejected' : f.level === 'amber' ? 'pill--pending' : 'pill--info';
    var pill = '<span class="pill fm-flag ' + cls + '">' + (f.text === 'International window' ? GLOBE : '') + esc(f.text) + '</span>';
    if (!f.items || !f.items.length) return pill;
    return '<span class="fm-flag-group">' + pill + '<span class="fm-flag-items">' + f.items.map(function (x) {
      return '<span><b>' + esc(day(x.date)) + '</b> ' + esc(x.text) + '</span>';
    }).join('') + '</span></span>';
  }
  function flagText(f) {
    return f.text + (f.items ? f.items.map(function (x) { return '\n   ' + day(x.date) + '  ' + x.text; }).join('') : '');
  }
  /* A small globe for international windows: no canon icon has one. */
  var GLOBE = '<svg class="fm-globe" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5"/>' +
    '<path d="M1.5 8h13M8 1.5c2 2 2.8 4.2 2.8 6.5S10 12.5 8 14.5M8 1.5C6 3.5 5.2 5.7 5.2 8S6 12.5 8 14.5"/></svg>';

  /* Both clubs in one calendar, as a continuous run of weeks rather than
     month pages: a postponed game sits where months meet, and the days
     either side of it matter (Richard, 28/10/2026). The home club is in
     the top half of every day, the away club in the bottom. It opens on
     the original date; the weeks in the middle of the view are sharp and
     those above and below fade (wireWeeks). */
  function mondayOf(d) {
    var w = new Date(d + 'T12:00:00Z').getUTCDay();
    return new Date(Date.parse(d + 'T12:00:00Z') - ((w + 6) % 7) * 864e5).toISOString().slice(0, 10);
  }
  function plusDays(d, n) { return new Date(Date.parse(d + 'T12:00:00Z') + n * 864e5).toISOString().slice(0, 10); }
  var MON3 = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

  function calendar(rec, res, data, focus) {
    var slotOf = {};
    res.slots.forEach(function (s) { slotOf[s.date] = s; });
    var cups = {};
    (data.calendar.cups || []).forEach(function (c) {
      var name = COMP_SHORT[c.comp] + ' ' + c.round;
      cups[c.date] = (cups[c.date] ? cups[c.date] + ' · ' : '') + name;
      if (c.replay) cups[c.replay] = (cups[c.replay] ? cups[c.replay] + ' · ' : '') + name + ' replay';
    });
    var byDay = {};
    Object.keys(S.fixtures).forEach(function (k) {
      var r = S.fixtures[k];
      if (r.key === rec.key) return;
      if (r.date) (byDay[r.date] = byDay[r.date] || []).push({ r: r, pencil: false });
      if (r.pencil && r.pencil.date) (byDay[r.pencil.date] = byDay[r.pencil.date] || []).push({ r: r, pencil: true });
    });
    var c = { rec: rec, res: res, slotOf: slotOf, cups: cups, byDay: byDay, focus: focus, t: today(),
      distances: data.distances, windows: data.calendar.internationalWindows || [] };
    /* From two weeks before the earlier of today and the original date, to
       the week of the last usable date. */
    var t = c.t, start = res.original && res.original < t ? res.original : t;
    var first = plusDays(mondayOf(start), -14), last = mondayOf(res.to);
    var html = '<div class="fm-cal"><div class="fm-cal__head">' + DOW_MON.map(function (d) { return '<div class="fm-cal__dow">' + d + '</div>'; }).join('') + '</div>' +
      '<div class="fm-cal__view"><div class="fm-cal__scroll" id="fmRrWeeks">';
    for (var wk = first; wk <= last; wk = plusDays(wk, 7)) {
      html += '<div class="fm-cal__week" data-week="' + wk + '">';
      for (var i = 0; i < 7; i++) html += calDay(plusDays(wk, i), c);
      html += '</div>';
    }
    return html + '</div><div class="fm-cal__edge fm-cal__edge--top"></div><div class="fm-cal__edge fm-cal__edge--bot"></div></div></div>';
  }

  /* Five sharp weeks show, and half a week either side under a blur that
     thickens towards the edge (.fm-cal__edge). Scrolling snaps a week at
     a time, so the five always line up. Opens with the anchor's week as
     the first sharp one. */
  function wireWeeks(keepTop) {
    var box = document.getElementById('fmRrWeeks');
    if (!box) return;
    box.addEventListener('scroll', function () { S.rr.scroll = box.scrollTop; });
    if (keepTop != null) { box.scrollTop = keepTop; return; }
    var at = box.querySelector('[data-week="' + mondayOf(S.rr.anchor) + '"]');
    if (at) box.scrollTop = Math.max(0, at.offsetTop - at.offsetHeight / 2);
  }

  /* One day: its number and any cup round; then each club's half, or, on a
     free day, the whole cell as the button that pencils or confirms it. */
  function calDay(d, c) {
    var cls = ['fm-cal__day'];
    if (d <= c.t) cls.push('is-past');
    else if (c.res.windowFrom && (d < c.res.windowFrom || d > c.res.windowTo)) cls.push('is-out');
    if (d === c.t) cls.push('is-today');
    if (d === c.focus) cls.push('is-on');
    if (d === c.res.original) cls.push('is-orig');
    /* The month boundary: a heavy line above the month's first seven days
       and left of the 1st, and every other month shaded. */
    var dn = +d.slice(8), mo = +d.slice(5, 7);
    if (mo % 2) cls.push('is-alt');
    if (dn <= 7) cls.push('is-mtop');
    if (dn === 1) cls.push('is-mfirst');
    var halves = [half(c.rec.home.name, d, c, 'top'), half(c.rec.away.name, d, c, 'bot')];
    var s = c.slotOf[d], body;
    if (s) {
      var lv = slotLevel(s);
      body = '<button type="button" class="fm-free' + (lv !== 'green' ? ' fm-free--' + lv : '') + '" data-slot="' + d + '" data-choose' +
        ' title="' + esc(s.flags.map(flagText).join('\n') || 'Clear') + '">' +
        '<strong>Free</strong>' + (s.flags.length ? '<span>' + s.flags.length + ' flag' + (s.flags.length > 1 ? 's' : '') + '</span>' : '') + '</button>';
    } else {
      body = halves.join('');
    }
    var cup = c.cups[d] && !halves.some(function (h) { return h.indexOf('data-cup') !== -1; }) ? '<span class="fm-cal__cup">' + esc(c.cups[d]) + '</span>' : '';
    var intl = (c.windows || []).some(function (w) { return d >= w.from && d <= w.to; });
    var num = dn === 1 ? '<span class="fm-cal__mon">1 ' + MON3[mo - 1] + '</span>' : String(dn);
    return '<div class="' + cls.join(' ') + '"><span class="fm-cal__n">' + num +
      (intl ? '<span class="fm-cal__intl" title="International window">' + GLOBE + '</span>' : '') + cup + '</span>' + body + '</div>';
  }

  /* A club's game on a day: the opponent's crest large on the right, the
     opponent's name in a band along the bottom with H or A, the
     competition, and the miles when the club travels. */
  function half(club, d, c, pos) {
    var games = (c.byDay[d] || []).filter(function (g) { return g.r.home.name === club || g.r.away.name === club; });
    var g = games[0];
    if (!g) return '<div class="fm-half fm-half--' + pos + '"></div>';
    var r = g.r, home = r.home.name === club, opp = home ? r.away : r.home;
    var comp = F.COMP_BY_KEY[r.comp];
    var label = COMP_SHORT[r.comp] + (r.playoff ? ' PO' : '') + (comp.league || !r.round ? '' : ' ' + r.round);
    var mi = home ? null : milesOf(c.distances, r.home, r.away, false);
    var title = games.map(function (x) {
      return x.r.home.name + ' v ' + x.r.away.name + ', ' + F.COMP_BY_KEY[x.r.comp].label + (x.r.round ? ' ' + x.r.round : '') +
        (x.pencil ? ' (pencilled)' : x.r.ko ? ', ' + x.r.ko : '');
    }).join('\n');
    return '<div class="fm-half fm-half--' + pos + ' has-game' + (g.pencil ? ' is-pencil' : '') + '" title="' + esc(title) + '"' + (comp.league ? '' : ' data-cup') + '>' +
      '<span class="fm-half__crest">' + crest(opp.name) + '</span>' +
      '<span class="fm-half__band"><span class="fm-half__opp">' + esc(opp.name) + '</span>' +
        '<span class="fm-half__meta"><span class="fm-ha fm-ha--' + (home ? 'h' : 'a') + '">' + (home ? 'H' : 'A') + '</span>' +
        '<span class="fm-cal__comp comp-pill--' + comp.pill + '">' + esc(label) + '</span>' +
        (mi ? '<span class="fm-half__mi">' + esc(mi) + '</span>' : '') +
        (games.length > 1 ? '<span>+' + (games.length - 1) + '</span>' : '') + '</span></span></div>';
  }

  /* Pencil or confirm a slot. The kick-off can be changed; a game shown in
     the UK going into the blocked hours asks first (Article 48, plan). */
  function openChoose(rec, date) {
    var wrap = document.createElement('div');
    var ko = dayOf(date) === 'Sat' ? '15:00' : '19:45';
    wrap.innerHTML =
      '<div class="form-group"><label for="fmcKo">Kick-off</label><input id="fmcKo" type="time" value="' + ko + '"></div>' +
      '<div id="fmcWarn"></div>';
    function warn() {
      var k = wrap.querySelector('#fmcKo').value;
      wrap.querySelector('#fmcWarn').innerHTML = X.ukShown(rec) && X.overlapsBlocked(rrCal(), date, k)
        ? '<div class="banner banner--amber">Blocked hours: at ' + esc(k) + ' this game loses UK availability. 12:30 or 17:30 keeps it.</div>' : '';
    }
    wrap.querySelector('#fmcKo').addEventListener('input', warn);
    warn();
    NL.modal({
      title: rec.home.name + ' v ' + rec.away.name + ', ' + day(date),
      body: wrap,
      size: 'sm',
      buttons: [
        { label: 'Cancel', className: 'btn--ghost', onClick: function (m) { m.close(); } },
        { label: 'Pencil', className: 'btn--ghost', onClick: function (m) {
          var k = wrap.querySelector('#fmcKo').value || null;
          article48(rec, date, k).then(function (ok) {
            if (!ok) return;
            save(X.pencil(rec, date, k, now())).then(function () {
              NL.toast('Pencilled for ' + day(date), 'success'); m.close();
            }).catch(function (e) { NL.toast('Save failed: ' + e.message, 'error'); });
          });
        }},
        { label: 'Confirm date', className: 'btn--primary', onClick: function (m) {
          confirmDate(rec, date, wrap.querySelector('#fmcKo').value || null, m);
        }}
      ]
    });
  }

  function rrCal() {
    var d = S.rr.data[NL.season.label(S.meta, S.season)];
    return (d && d.calendar) || {};
  }

  function article48(rec, date, ko) {
    if (!(X.ukShown(rec) && X.overlapsBlocked(rrCal(), date, ko))) return Promise.resolve(true);
    return NL.confirm('A ' + ko + ' kick-off on ' + day(date) + ' is in the blocked hours, so this game loses UK availability.', {
      title: 'Blocked hours', confirmText: 'Use ' + ko + ' anyway'
    });
  }

  function confirmDate(rec, date, ko, modal) {
    article48(rec, date, ko).then(function (ok) {
      if (!ok) return;
      var next = X.unpencil(F.setDate(rec, date, ko, now()));
      save(next).then(function () {
        NL.toast('Rescheduled for ' + dayKo(date, ko), 'success');
        S.rr.key = null; S.rr.slot = null;
        if (modal) modal.close();
      }).catch(function (e) { NL.toast('Save failed: ' + e.message, 'error'); });
    });
  }

  /* ── Save ─────────────────────────────────────────────────────────── */
  function patch(up, rec) {
    rec.updatedAt = now();
    up['fixtures/' + rec.key] = clean(rec);
    up['public/' + rec.key] = F.publicView(rec) ? clean(F.publicView(rec)) : null;
  }
  function saveAll(recs) {
    var up = {};
    recs.forEach(function (r) { patch(up, r); });
    return NL.ensureAuth().then(function () { return ref().update(up); });
  }
  function save(rec) { return saveAll([rec]); }

  /* ── Add / edit ──────────────────────────────────────────────────────
     League fixtures come from the import and keep their teams and
     competition. Cup ties are entered here. A changed date keeps the old
     one as a lost date ('moved'). */
  /* What can be added by hand. A play-off belongs to its division. */
  var HAND = [
    { v: 'nl-cup', comp: 'nl-cup', label: 'NL Cup' },
    { v: 'national-po', comp: 'national', playoff: true, label: 'National play-off' },
    { v: 'north-po', comp: 'north', playoff: true, label: 'North play-off' },
    { v: 'south-po', comp: 'south', playoff: true, label: 'South play-off' },
    { v: 'fa-cup', comp: 'fa-cup', label: 'FA Cup' },
    { v: 'fa-trophy', comp: 'fa-trophy', label: 'FA Trophy' }
  ];
  function handOf(v) { return HAND.filter(function (h) { return h.v === v; })[0] || HAND[0]; }

  function numIn(id, v, dis) {
    return '<input id="' + id + '" type="number" min="0" inputmode="numeric" value="' + (v == null ? '' : v) + '"' + dis + '>';
  }

  function openEdit(rec) {
    var isNew = !rec;
    var comp = rec ? F.COMP_BY_KEY[rec.comp] : F.COMP_BY_KEY['fa-cup'];
    var fixedTeams = !isNew && (comp.league || rec.source === 'import');
    var ro = !S.canEdit;
    var dis = ro ? ' disabled' : '';
    var res = (rec && rec.result) || {};

    var wrap = document.createElement('div');
    if (rec) wrap.setAttribute('data-key', rec.key);
    var compOpts = HAND.map(function (h) {
      return '<option value="' + h.v + '"' + (h.v === 'fa-cup' ? ' selected' : '') + '>' + esc(h.label) + '</option>';
    }).join('');
    var hist = rec && rec.attempts && rec.attempts.length
      ? '<ol class="fm-history">' + rec.attempts.map(function (a, i) {
          return '<li><span>' + esc(F.fmt(a.date) + (a.ko ? ' ' + a.ko : '')) + ' · ' + esc(a.outcome) +
            (a.minute ? ' (' + a.minute + 'm)' : '') + (a.reason ? ' · ' + esc(a.reason) : '') + '</span>' +
            (ro ? '' : '<button class="btn btn--ghost btn--sm" type="button" data-drop="' + i + '">Remove</button>') + '</li>';
        }).join('') + '</ol>'
      : '';

    wrap.innerHTML =
      '<div class="form-grid">' +
        '<div class="form-group"><label for="fmeComp">Competition</label>' +
          (isNew ? '<select id="fmeComp">' + compOpts + '</select>'
                 : '<div>' + compPill(rec.comp) + '</div>') + '</div>' +
        '<div class="form-group"><label for="fmeRound">Round</label>' +
          '<input id="fmeRound" type="text" value="' + esc(rec && rec.round || '') + '"' + dis + '></div>' +
        '<div class="form-group"><label>Home</label><div id="fmeHome"></div></div>' +
        '<div class="form-group"><label>Away</label><div id="fmeAway"></div></div>' +
        '<div class="form-group"><label for="fmeDate">Date</label>' +
          '<div class="datetime-row"><input id="fmeDate" type="date" value="' + esc(rec && rec.date || '') + '"' + dis + '>' +
          '<input id="fmeKo" type="time" value="' + esc(rec && rec.ko || '15:00') + '"' + dis + '></div>' +
          (rec && F.awaiting(rec) ? '<div class="form-hint">Awaiting a date. Set one here once it is agreed.</div>' : '') + '</div>' +
        '<div class="form-group" id="fmeOptaWrap"><label for="fmeOpta">Opta ID</label>' +
          '<input id="fmeOpta" type="text" placeholder="g2660046" value="' + esc(rec && rec.optaID || '') + '"' + dis + '></div>' +
        '<div class="form-group"><label>Score</label><div class="fm-score">' +
          numIn('fmeH', res.h, dis) + '<span class="fm-dash">–</span>' + numIn('fmeA', res.a, dis) + '</div></div>' +
        '<div class="form-group"><label>After extra time</label><div class="fm-score">' +
          numIn('fmeEH', res.aet && res.aet.h, dis) + '<span class="fm-dash">–</span>' + numIn('fmeEA', res.aet && res.aet.a, dis) + '</div></div>' +
        '<div class="form-group"><label>Penalties</label><div class="fm-score">' +
          numIn('fmePH', res.pens && res.pens.h, dis) + '<span class="fm-dash">–</span>' + numIn('fmePA', res.pens && res.pens.a, dis) + '</div></div>' +
        '<div class="form-group" id="fmeResultWrap"><label for="fmeWent">Went through</label>' +
          '<select id="fmeWent"' + dis + '>' +
            '<option value="">From the score</option>' +
            '<option value="home">Home</option>' +
            '<option value="away">Away</option>' +
            '<option value="replay">Drawn: replay</option>' +
          '</select></div>' +
        (rec && rec.date ? '<div class="form-group"><label>Crowd</label><div class="fm-score">' +
          numIn('fmeCrowd', S.crowds[rec.key] ? S.crowds[rec.key].total : null, dis) + '<span class="fm-dash">away</span>' +
          numIn('fmeCrowdAway', S.crowds[rec.key] ? S.crowds[rec.key].away : null, dis) + '</div></div>' : '') +
        '<div class="form-group"><label><input id="fmeNeutral" type="checkbox"' + (rec && rec.neutral ? ' checked' : '') + dis +
          '> Neutral venue</label>' +
          '<input id="fmeVenue" type="text" placeholder="Venue" value="' + esc(rec && rec.venue || '') + '"' + dis + '></div>' +
        (hist ? '<div class="form-group span2"><label>Lost dates</label>' + hist + '</div>' : '') +
      '</div>';

    var homePick, awayPick;
    function pickers() {
      var picked = {};
      ['home', 'away'].forEach(function (side) {
        var mount = wrap.querySelector(side === 'home' ? '#fmeHome' : '#fmeAway');
        var current = rec ? rec[side].name : null;
        if (fixedTeams || ro) { mount.innerHTML = team(rec[side], false); NL.clubs.wireCrestImgs(mount); return; }
        var p = NL.clubPicker(mount, {
          mode: 'search', season: 'all', extraClubs: S.guests, freetext: 'commit',
          placeholder: 'Club', onSelect: function () {}
        });
        if (current) p.setValue(current);
        picked[side] = p;
      });
      homePick = picked.home; awayPick = picked.away;
    }

    function syncComp() {
      var key = isNew ? handOf(wrap.querySelector('#fmeComp').value).comp : rec.comp;
      var fa = F.COMP_BY_KEY[key].fa;
      wrap.querySelector('#fmeOptaWrap').hidden = fa;
      wrap.querySelector('#fmeResultWrap').hidden = !fa;
    }

    var ctrl;
    var buttons = [];
    if (!ro && rec && rec.source === 'manual') {
      buttons.push({ label: 'Delete', className: 'btn--danger', onClick: function (m) {
        NL.confirm('Delete ' + rec.home.name + ' v ' + rec.away.name + '?', { title: 'Delete tie', confirmText: 'Delete', variant: 'danger' })
          .then(function (yes) {
            if (!yes) return;
            var up = {}; up['fixtures/' + rec.key] = null; up['public/' + rec.key] = null;
            NL.ensureAuth().then(function () { return ref().update(up); })
              .then(function () { NL.toast('Deleted', 'success'); m.close(); })
              .catch(function (e) { NL.toast('Delete failed: ' + e.message, 'error'); });
          });
      }});
    }
    if (!ro && rec && rec.date) {
      buttons.push({ label: 'Postpone', className: 'btn--ghost', onClick: function (m) { openLose(rec, 'postponed', m); } });
      buttons.push({ label: 'Abandon', className: 'btn--ghost', onClick: function (m) { openLose(rec, 'abandoned', m); } });
    }
    buttons.push({ label: ro ? 'Close' : 'Cancel', className: 'btn--ghost', onClick: function (m) { m.close(); } });
    if (!ro) {
      buttons.push({ label: isNew ? 'Add tie' : 'Save', className: 'btn--primary', onClick: function (m) {
        submit(rec, wrap, homePick, awayPick).then(function (ok) { if (ok) m.close(); });
      }});
    }

    ctrl = NL.modal({
      title: isNew ? 'Add cup tie' : rec.home.name + ' v ' + rec.away.name,
      body: wrap,
      width: 'wide',
      buttons: buttons
    });
    pickers();
    if (rec) wrap.querySelector('#fmeWent').value = rec.wentThrough || '';
    if (isNew) wrap.querySelector('#fmeComp').addEventListener('change', syncComp);
    syncComp();

    wrap.addEventListener('click', function (e) {
      var b = e.target.closest('[data-drop]');
      if (!b) return;
      var i = +b.getAttribute('data-drop');
      var a = rec.attempts[i];
      NL.confirm('Remove the lost date ' + F.fmt(a.date) + ' (' + a.outcome + ')? Use this for a date entered by mistake; it is not logged as a change.',
        { title: 'Remove lost date', confirmText: 'Remove', variant: 'danger' })
        .then(function (yes) {
          if (!yes) return;
          save(F.dropAttempt(rec, i))
            .then(function () { NL.toast('Lost date removed', 'success'); ctrl.close(); })
            .catch(function (e2) { NL.toast('Save failed: ' + e2.message, 'error'); });
        });
    });
  }

  /* Postpone or abandon. The game drops out of the public view until it
     has a new date; the reason and the moment it was called are kept. */
  function openLose(rec, outcome, parent) {
    var wrap = document.createElement('div');
    var opts = S.reasons.map(function (r) { return '<option>' + esc(r) + '</option>'; }).join('');
    wrap.innerHTML =
      '<div class="form-group"><label for="fmlReason">Reason</label>' +
        '<select id="fmlReason"><option value="">Choose</option>' + opts + '</select></div>' +
      '<div class="form-group"><label for="fmlNote">Note</label><input id="fmlNote" type="text"></div>' +
      (outcome === 'abandoned'
        ? '<div class="form-group"><label for="fmlMin">Minute</label><input id="fmlMin" type="number" min="0" max="130" inputmode="numeric"></div>'
        : '');
    NL.modal({
      title: (outcome === 'abandoned' ? 'Abandon ' : 'Postpone ') + rec.home.name + ' v ' + rec.away.name,
      body: wrap,
      size: 'sm',
      buttons: [
        { label: 'Cancel', className: 'btn--ghost', onClick: function (m) { m.close(); } },
        { label: outcome === 'abandoned' ? 'Abandon' : 'Postpone', className: 'btn--primary', onClick: function (m) {
          var reason = wrap.querySelector('#fmlReason').value;
          var note = wrap.querySelector('#fmlNote').value.trim();
          if (!reason) { NL.toast('Choose a reason', 'error'); return; }
          if (reason === 'Other' && !note) { NL.toast('Say what the other reason is', 'error'); return; }
          var minEl = wrap.querySelector('#fmlMin');
          var minute = minEl && minEl.value !== '' ? +minEl.value : null;
          var next = F.loseDate(rec, { outcome: outcome, reason: note ? reason + ': ' + note : reason, minute: minute, at: now() });
          save(next).then(function () {
            NL.toast(outcome === 'abandoned' ? 'Abandoned' : 'Postponed', 'success');
            m.close(); parent.close();
          }).catch(function (e) { NL.toast('Save failed: ' + e.message, 'error'); });
        }}
      ]
    });
  }

  /* A crowd typed in a game's dialog is saved where every crowd lives — the
     Attendance tool's submission for that match ID — so there is still one
     figure, not a copy. Shape as attendance/index.html submitAttendance
     writes it. A past season's crowds sit in Attendance's archive, which
     only a superadmin may write (the rules say so too). */
  function crowdFromForm(wrap) {
    var t = intOf(wrap, 'fmeCrowd'), a = intOf(wrap, 'fmeCrowdAway');
    var key = wrap.getAttribute('data-key');
    var held = S.crowds[key] || null;
    if (t == null) return { ok: a == null, msg: 'Enter the total crowd, or leave both empty', change: false };
    if (a != null && a > t) return { ok: false, msg: 'Away fans cannot exceed the total' };
    var change = !held || held.total !== t || (held.away == null ? null : held.away) !== (a == null ? null : a);
    return { ok: true, change: change, total: t, away: a };
  }

  function ukToUtc(ymd, hm) {
    var p = ymd.split('-'), t = (hm || '15:00').split(':');
    var guess = Date.UTC(+p[0], +p[1] - 1, +p[2], +t[0], +t[1]);
    var d = new Date(guess);
    var off = Date.parse(d.toLocaleString('en-US', { timeZone: 'Europe/London' })) - Date.parse(d.toLocaleString('en-US', { timeZone: 'UTC' }));
    return new Date(guess - off).toISOString().slice(0, 19).replace('T', ' ');
  }

  var ATT_KEY = { national: 'nl', north: 'north', south: 'south', 'nl-cup': 'nl-cup', 'fa-cup': 'fa-cup', 'fa-trophy': 'fa-trophy' };

  function saveCrowd(rec, c) {
    var path = attPath(S.season, 'submissions/' + rec.key);
    var stamp = Date.now(), who = S.session || {};
    var held = S.crowds[rec.key];
    var write = held
      ? db.ref(path).update({ total: c.total, away: c.away, awayRecorded: c.away != null, lastEditedAt: stamp, lastEditedBy: who.uid || null })
      : db.ref(path).set(clean({
          matchID: rec.key,
          clubKey: (NL.clubs.byName(rec.home.name) || {}).optaID || null,
          clubName: rec.home.name,
          competitionKey: ATT_KEY[rec.comp] || rec.comp,
          kickoffUTC: ukToUtc(rec.date, rec.ko),
          total: c.total,
          away: c.away,
          awayRecorded: c.away != null,
          submittedBy: who.uid || null,
          submittedByName: who.name || who.email || '',
          submittedByRole: 'admin',
          submittedAt: stamp
        }));
    return NL.ensureAuth().then(function () { return write; }).then(function () {
      S.crowds[rec.key] = { total: c.total, away: c.away };
      NL.writeAudit('fixtures_crowd', rec.home.name + ' v ' + rec.away.name + ' ' + rec.date + ': ' + c.total);
      render();
    });
  }

  function intOf(wrap, id) {
    var v = wrap.querySelector('#' + id).value;
    return v === '' ? null : Math.max(0, parseInt(v, 10));
  }

  function resultFromForm(wrap) {
    var h = intOf(wrap, 'fmeH'), a = intOf(wrap, 'fmeA');
    if (h == null && a == null) return { ok: true, result: null };
