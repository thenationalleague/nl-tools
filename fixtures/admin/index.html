<!--
  NL Tools — redirect stub
  Version: v4.0 (12/11/2026)

-->

  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32x32.png">
  <script>location.replace('/fixtures/' + location.search + location.hash);</script>
</head>
<body>

</body>
