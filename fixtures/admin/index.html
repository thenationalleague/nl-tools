  /* The games awaiting a date, oldest original date first, as a dropdown:
     the list can run to dozens in a wet winter (CLAUDE.md, tabs and pills
     are for closed sets). +N marks a club with others waiting; a pencil
     shows its date. */
  function todoPicker(list) {
    var opts = list.map(function (x) {
      var r = x.rec, comp = F.COMP_BY_KEY[r.comp];
      var more = [[r.home, x.backlog.home], [r.away, x.backlog.away]].filter(function (p) { return p[1] > 0; })
        .map(function (p) { return (p[0].code || p[0].name) + ' +' + p[1]; });
      var label = day(x.original) + ' · ' + r.home.name + ' v ' + r.away.name + ' · ' + (comp ? comp.label : r.comp) +
        (more.length ? ' · ' + more.join(', ') : '') +
        (X.pencilsOf(r).length ? ' · pencilled ' + X.pencilsOf(r).map(function (p) { return day(p.date); }).join(', ') : '');
      return '<option value="' + esc(r.key) + '"' + (r.key === S.rr.key ? ' selected' : '') + '>' + esc(label) + '</option>';
    }).join('');
    return '<select class="nl-select" id="fmRrPick" aria-label="Game awaiting a date">' + opts + '</select>';
  }

  function gameOf(rec, list, data, moving) {
    var unav = unavailList();
    var res = X.slots(rec, {
      fixtures: S.fixtures, calendar: data.calendar, rounds: data.rounds,
      distances: data.distances, today: today(), unavailable: unav
    }, { anchor: moving && rec.date ? rec.date : null,
      mondays: S.rr.mondays, thursdays: S.rr.thursdays, fridays: S.rr.fridays, sundays: S.rr.sundays });
    S.rr.slots = res.slots;
    var lost = rec.attempts || [], last = lost[lost.length - 1];
    var journey = milesOf(data.distances, rec.home, rec.away, true);
    var orig = rec.original || {};
    var pens = X.pencilsOf(rec);
    var focus = S.rr.slot || (pens[0] && pens[0].date) || null;
    S.rr.anchor = focus || res.original || res.from;

    /* The rarer days, folded away in the header; open, it floats rather
       than pushing the calendar down. */
    var extra = [['mondays', 'Mon'], ['thursdays', 'Thu'], ['fridays', 'Fri'], ['sundays', 'Sun']];
    var on = extra.filter(function (x) { return S.rr[x[0]]; }).map(function (x) { return x[1]; });
    var more = '<details class="disclosure fm-more" id="fmRrMore"' + (S.rr.moreOpen ? ' open' : '') + '>' +
      '<summary>More days' + (on.length ? '<span class="disclosure__meta">+' + esc(on.join(', ')) + '</span>' : '') +
        '</summary><div class="fm-more__body">' +
      '<span class="fm-more__label">Also offer</span>' +
      extra.map(function (x) {
        return '<label><input type="checkbox" data-day="' + x[0] + '"' + (S.rr[x[0]] ? ' checked' : '') + '> ' + x[1] + '</label>';
      }).join('') +
      '</div></details>';

    /* The shortlist: each pencilled date with Confirm and remove. */
    var pencilLine = pens.length ? '<div class="fm-match__pencil"><strong>Pencilled</strong>' + pens.map(function (p) {
      return '<span class="fm-pen"><span class="pill pill--info">' + esc(dayKo(p.date, p.ko)) + '</span>' +
        (S.canEdit ? '<button class="btn btn--primary btn--sm" type="button" data-confirm-pencil="' + p.date + '">Confirm</button>' +
          '<button class="btn btn--ghost btn--sm" type="button" data-unpencil="' + p.date + '" aria-label="Remove ' + esc(day(p.date)) + '">×</button>' : '') + '</span>';
    }).join('') + (pens.length < X.MAX_PENCILS ? '' : '<span class="fm-pen__full">Shortlist full</span>') + '</div>' : '';
    /* Dates ruled out that bear on this game, still to come: its own, and
       either club's season-wide ones. */
    var t = today();
    var mine = (rec.ruledOut || []).filter(function (x) { return x.date > t; }).map(function (x) {
      return '<span class="fm-pen"><span class="pill pill--rejected">' + esc(day(x.date)) + '</span>' + esc(x.reason) +
        (S.canEdit ? ' <button class="btn btn--ghost btn--sm" type="button" data-unrule="' + x.date + '" aria-label="Lift">×</button>' : '') + '</span>';
    });
    var clubs = unav.filter(function (u) {
      return u.date > t && ((u.club === rec.home.name && u.side !== 'away') || (u.club === rec.away.name && u.side !== 'home'));
    }).sort(function (a, b) { return a.date < b.date ? -1 : 1; }).map(function (u) {
      return '<span class="fm-pen"><span class="pill pill--rejected">' + esc(day(u.date)) + '</span>' +
        esc(shortName(u.club) + (u.side === 'home' ? ' can’t host' : u.side === 'away' ? ' can’t travel' : ' can’t play') + ': ' + u.reason) +
        (S.canEdit ? ' <button class="btn btn--ghost btn--sm" type="button" data-unavail-off="' + esc(u.id) + '" aria-label="Lift">×</button>' : '') + '</span>';
    });
    var ruledLine = mine.length || clubs.length ? '<div class="fm-match__pencil fm-match__ruled"><strong>Ruled out</strong>' + mine.concat(clubs).join('') + '</div>' : '';

    /* The match as a banner: both clubs and their crests in navy, then a
       strip with the date, what happened to it and the journey. */
    var html = '<div class="fm-rr-game"><div class="fm-match">' +
      '<div class="fm-match__bar"><h2 class="fm-match__title">' +
        '<span class="fm-match__club">' + crest(rec.home.name) + '<span>' + esc(rec.home.name) + '</span></span>' +
        '<span class="fm-match__club">' + crest(rec.away.name) + '<span>' + esc(rec.away.name) + '</span></span></h2>' +
        '<div class="fm-match__tags">' + compPill(rec.comp) + broadcastPill(rec) + '</div></div>' +
      '<div class="fm-match__sub"><p class="fm-match__when">' +
        (moving && rec.date ? '<strong>Currently ' + esc(dayKo(rec.date, rec.ko)) + '</strong>'
          : '<strong>' + esc(dayKo(res.original, orig.date === res.original ? orig.ko : null)) + '</strong>') +
        lostDates(rec, res.original) +
        (journey ? '<span>' + esc(rec.away.name) + ' travel ' + esc(journey) + '</span>' : '') + '</p>' +
        more + '</div>' + pencilLine + ruledLine + '</div>';

    html += '<div class="fm-rr-cal">' + calendar(rec, res, data, focus) + '</div>' +
      '<div class="fm-rr-dates" id="fmRrSlots">' + slotList(res, focus) + '</div></div>';
    return html;
  }

  /* Every date the game has lost, oldest first: 'Abandoned: Weather' for
     the original date, 'Postponed Tue 10 Nov 2026: Waterlogged pitch' for
     a later one. A date moved by agreement is not a loss and is left out. */
  function lostDates(rec, original) {
    return (rec.attempts || []).filter(function (a) { return a.outcome !== 'moved'; }).map(function (a) {
      return '<span>' + esc((a.outcome === 'abandoned' ? 'Abandoned' : 'Postponed') +
        (a.date !== original ? ' ' + day(a.date) : '') + (a.reason ? ': ' + a.reason : '')) + '</span>';
    }).join('');
  }

  /* The away side's journey for a game between two League clubs, from
     the distances table: '237 mi', or with time '237 mi · 4h06'. Null for
     an outside club, which has no coordinates. */
  function milesOf(distances, home, away, withTime) {
    var p = home.code && away.code ? (distances.pairs || {})[home.code + '|' + away.code] : null;
    if (!p) return null;
    var m = Math.round(p[1]);
    return Math.round(p[0]) + ' mi' + (withTime ? ' · ' + Math.floor(m / 60) + 'h' + ('0' + (m % 60)).slice(-2) : '');
  }

  function slotLevel(s) {
    return s.flags.some(function (f) { return f.level === 'red'; }) ? 'red'
      : s.flags.some(function (f) { return f.level === 'amber'; }) ? 'amber' : 'green';
  }

  var KEY = '<div class="fm-cal__key"><span class="k-free">Free, clear</span><span class="k-flag">Free, with flags</span>' +
    '<span class="k-pencil">Pencilled</span><span class="k-orig">Original date</span><span class="k-ruled">Ruled out</span></div>';

  function slotList(res, focus) {
    if (!res.slots.length) return '<div class="banner banner--amber">No date free for both clubs before ' + esc(day(res.to)) + '.</div>';
    var html = '<div class="fm-slots"><div class="fm-slots__head">Best dates</div>', divided = false;
    res.slots.forEach(function (s) {
      if (!s.within35 && !divided) {
        divided = true;
        html += '<div class="fm-slot-div">More than 35 days from the original date</div>';
      }
      html += '<button type="button" class="fm-slot' + (s.date === focus ? ' is-on' : '') + '" data-slot="' + s.date + '" data-choose>' +
        '<span class="fm-slot__date">' + esc(day(s.date)) + '</span>' +
        '<span class="fm-slot__flags">' + flagsHtml(s.flags) + '</span></button>';
    });
    return html + '</div>' + KEY;
  }

  /* A date's flags, grouped under their category (X.CATS): each flag a
     pill, and under it the games behind it, one a line, so a run's
     spacing or a nearby kick-off can be judged. */
  function flagsHtml(flags) {
    if (!flags.length) return '<span class="pill pill--approved">Clear</span>';
    return X.CATS.map(function (c) {
      var mine = flags.filter(function (f) { return f.cat === c.key; });
      if (!mine.length) return '';
      return '<div class="fm-fg"><div class="fm-fg__title">' + (c.key === 'international' ? GLOBE : '') + esc(c.label) + '</div>' +
        mine.map(flagPill).join('') + '</div>';
    }).join('');
  }
  function flagPill(f) {
    var cls = f.level === 'red' ? 'pill--rejected' : f.level === 'amber' ? 'pill--pending' : 'pill--info';
    var pill = f.cat === 'international' ? '' : '<span class="pill fm-flag ' + cls + '">' + esc(f.text) + '</span>';
    if (!f.items || !f.items.length) return pill;
    return '<div class="fm-flag-group">' + pill + '<div class="fm-flag-items">' + f.items.map(function (x) {
      return '<span>' + (x.date ? '<b>' + esc(day(x.date)) + '</b> ' : '') + esc(x.text) + '</span>';
    }).join('') + '</div></div>';
  }
  /* A small globe for international windows: no canon icon has one. */
  var GLOBE = '<svg class="fm-globe" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5"/>' +
    '<path d="M1.5 8h13M8 1.5c2 2 2.8 4.2 2.8 6.5S10 12.5 8 14.5M8 1.5C6 3.5 5.2 5.7 5.2 8S6 12.5 8 14.5"/></svg>';

  /* Both clubs in one calendar, as a continuous run of weeks rather than
     month pages: a postponed game sits where months meet, and the days
     either side of it matter (Richard, 28/10/2026). The home club is in
     the top half of every day, the away club in the bottom. It opens on
     the original date; the weeks in the middle of the view are sharp and
     those above and below fade (wireWeeks). */
  function mondayOf(d) {
    var w = new Date(d + 'T12:00:00Z').getUTCDay();
    return new Date(Date.parse(d + 'T12:00:00Z') - ((w + 6) % 7) * 864e5).toISOString().slice(0, 10);
  }
  function plusDays(d, n) { return new Date(Date.parse(d + 'T12:00:00Z') + n * 864e5).toISOString().slice(0, 10); }
  var MON3 = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

  function calendar(rec, res, data, focus) {
    var slotOf = {};
    res.slots.forEach(function (s) { slotOf[s.date] = s; });
    var cups = {};
    (data.calendar.cups || []).forEach(function (c) {
      var name = COMP_SHORT[c.comp] + ' ' + c.round;
      cups[c.date] = (cups[c.date] ? cups[c.date] + ' · ' : '') + name;
      if (c.replay) cups[c.replay] = (cups[c.replay] ? cups[c.replay] + ' · ' : '') + name + ' replay';
    });
    var byDay = {};
    Object.keys(S.fixtures).forEach(function (k) {
      var r = S.fixtures[k];
      if (r.key === rec.key) return;
      if (r.date) (byDay[r.date] = byDay[r.date] || []).push({ r: r, pencil: false });
      X.pencilsOf(r).forEach(function (p) { (byDay[p.date] = byDay[p.date] || []).push({ r: r, pencil: true }); });
    });
    var c = { rec: rec, res: res, slotOf: slotOf, cups: cups, byDay: byDay, focus: focus, t: today(), unav: unavailList(),
      distances: data.distances, windows: data.calendar.internationalWindows || [] };
    /* From two weeks before the earlier of today and the original date, to
       the week of the last usable date. */
    var t = c.t, start = res.original && res.original < t ? res.original : t;
    var first = plusDays(mondayOf(start), -14), last = mondayOf(res.to);
    var html = '<div class="fm-cal"><div class="fm-cal__month"><strong id="fmRrMonthLbl"></strong><span class="fm-cal__whose">' +
      '<span data-who="top"><i></i>' + crest(rec.home.name) + esc(shortName(rec.home.name)) + '</span>' +
      '<span data-who="bot"><i class="k-away"></i>' + crest(rec.away.name) + esc(shortName(rec.away.name)) + '</span></span></div><div class="fm-cal__head">' + DOW_MON.map(function (d) { return '<div class="fm-cal__dow">' + d + '</div>'; }).join('') + '</div>' +
      '<div class="fm-cal__view"><div class="fm-cal__scroll" id="fmRrWeeks">';
    for (var wk = first; wk <= last; wk = plusDays(wk, 7)) {
      html += '<div class="fm-cal__week" data-week="' + wk + '">';
      for (var i = 0; i < 7; i++) html += calDay(plusDays(wk, i), c);
      html += '</div>';
    }
    return html + '</div><div class="fm-cal__edge fm-cal__edge--top"></div><div class="fm-cal__edge fm-cal__edge--bot"></div></div></div>';
  }

  /* Five sharp weeks show, and half a week either side under a blur that
     thickens towards the edge (.fm-cal__edge). Scrolling snaps a week at
     a time, so the five always line up. Opens with the anchor's week as
     the first sharp one. */
  function wireWeeks(keepTop) {
    var box = document.getElementById('fmRrWeeks');
    if (!box) return;
    var label = document.getElementById('fmRrMonthLbl');
    var weeks = Array.prototype.slice.call(box.children);
    /* The months the five sharp weeks cover, named above the calendar:
       'November 2026', or 'October – November 2026' across a boundary. */
    function months() {
      var h = weeks[0] ? weeks[0].offsetHeight : 1;
      var i = Math.max(0, Math.round((box.scrollTop + h / 2) / h));
      var a = weeks[Math.min(i, weeks.length - 1)], b = weeks[Math.min(i + 4, weeks.length - 1)];
      if (!a || !label) return;
      var from = a.getAttribute('data-week'), to = plusDays(b.getAttribute('data-week'), 6);
      var fm = MONTH_LONG[+from.slice(5, 7) - 1], tm = MONTH_LONG[+to.slice(5, 7) - 1];
      label.textContent = fm === tm ? fm + ' ' + to.slice(0, 4)
        : fm + (from.slice(0, 4) !== to.slice(0, 4) ? ' ' + from.slice(0, 4) : '') + ' – ' + tm + ' ' + to.slice(0, 4);
    }
    box.addEventListener('scroll', function () { S.rr.scroll = box.scrollTop; months(); hideTip(); });
    if (keepTop != null) box.scrollTop = keepTop;
    else {
      var at = box.querySelector('[data-week="' + mondayOf(S.rr.anchor) + '"]');
      if (at) box.scrollTop = Math.max(0, at.offsetTop - at.offsetHeight / 2);
    }
    months();
  }
  var MONTH_LONG = ['January', 'February', 'March', 'April', 'May', 'June', 'July',
    'August', 'September', 'October', 'November', 'December'];

  /* A branded tooltip for a free day: its flags, grouped, as the best
     dates list shows them. One element, moved to whatever is hovered.
     Canon candidate (28/10/2026): no canon tooltip exists, and every tool
     with a title attribute shows the browser's. */
  var tipEl = null;
  function showTip(cell) {
    var d = cell.getAttribute('data-tip-slot');
    var slot = (S.rr.slots || []).filter(function (x) { return x.date === d; })[0];
    if (!slot) return;
    if (!tipEl) { tipEl = document.createElement('div'); tipEl.className = 'fm-tip'; tipEl.setAttribute('role', 'tooltip'); document.body.appendChild(tipEl); }
    tipEl.innerHTML = '<div class="fm-tip__date">' + esc(day(d)) + '</div>' + flagsHtml(slot.flags);
    tipEl.hidden = false;
    var r = cell.getBoundingClientRect(), w = tipEl.offsetWidth, h = tipEl.offsetHeight;
    var left = r.right + 8 + w > window.innerWidth ? r.left - w - 8 : r.right + 8;
    var top = Math.min(Math.max(8, r.top), window.innerHeight - h - 8);
    tipEl.style.left = Math.max(8, left) + 'px';
    tipEl.style.top = top + 'px';
  }
  function hideTip() { if (tipEl) tipEl.hidden = true; }

  /* One day: its number and any cup round; then each club's half, or, on a
     free day, the whole cell as the button that pencils or confirms it. */
  function calDay(d, c) {
    var cls = ['fm-cal__day'];
    if (d <= c.t) cls.push('is-past');

    if (d === c.t) cls.push('is-today');
    if (d === c.focus) cls.push('is-on');
    if (d === c.res.original) cls.push('is-orig');
    /* The month boundary: a thin line on the month's first seven date
       strips and beside the 1st; every other month's strips shaded. */
    var dn = +d.slice(8), mo = +d.slice(5, 7);
    if (mo % 2) cls.push('is-alt');
    if (dn <= 7) cls.push('is-mtop');
    if (dn === 1) cls.push('is-mfirst');
    var halves = [half(c.rec.home.name, d, c, 'top'), half(c.rec.away.name, d, c, 'bot')];
    var s = c.slotOf[d], body;
    var own = (c.rec.ruledOut || []).filter(function (x) { return x.date === d; })[0];
    if (own && d > c.t) {
      body = '<div class="fm-ruled"><strong>Ruled out</strong><span>' + esc(own.reason) + '</span></div>';
    } else if (s) {
      var lv = slotLevel(s);
      body = '<button type="button" class="fm-free' + (lv !== 'green' ? ' fm-free--' + lv : '') + '" data-slot="' + d + '" data-choose data-tip-slot="' + d + '">' +
        '<strong>Free</strong>' + (s.flags.length ? '<span>' + s.flags.length + ' flag' + (s.flags.length > 1 ? 's' : '') + '</span>' : '') + '</button>';
    } else {
      body = halves.join('');
    }
    var cup = c.cups[d] && !halves.some(function (h) { return h.indexOf('data-cup') !== -1; }) ? '<span class="fm-cal__cup">' + esc(c.cups[d]) + '</span>' : '';
    var intl = (c.windows || []).some(function (w) { return d >= w.from && d <= w.to; });
    var num = dn === 1 ? '<span class="fm-cal__mon">1 ' + MON3[mo - 1] + '</span>' : String(dn);
    return '<div class="' + cls.join(' ') + '"><div class="fm-cal__date"><span class="fm-cal__n">' + num +
      (intl ? '<span class="fm-cal__intl">' + GLOBE + '</span>' : '') + cup + '</span></div>' +
      '<div class="fm-cal__body">' + body + '</div></div>';
  }

  /* A club's short name from clubs-meta ('Forest Green'), for a calendar
     cell; an outside club has none and keeps its own. */
  function shortName(name) {
    var c = NL.clubs.byName(name) || NL.clubs.guestByName(name);
    return (c && c.short) || name;
  }

  /* A club's game on a day: the opponent's crest, its short name, H or A,
     the competition, and the miles when the club travels. */
  function half(club, d, c, pos) {
    var games = (c.byDay[d] || []).filter(function (g) { return g.r.home.name === club || g.r.away.name === club; });
    var g = games[0];
    if (!g) {
      /* A club that cannot host (top half, the home club) or travel
         (bottom half, the away club) that day: said once, kept all season. */
      var side = pos === 'top' ? 'home' : 'away';
      var u = d > c.t && (c.unav || []).filter(function (x) { return x.club === club && x.date === d && (x.side === side || x.side === 'any'); })[0];
      return u ? '<div class="fm-half fm-half--' + pos + ' is-blocked"><span>' + esc(side === 'home' ? 'Can’t host' : 'Can’t travel') +
        '</span><span class="fm-half__why">' + esc(u.reason) + '</span></div>' : '<div class="fm-half fm-half--' + pos + '"></div>';
    }
    var r = g.r, home = r.home.name === club, opp = home ? r.away : r.home;
    var comp = F.COMP_BY_KEY[r.comp];
    var label = COMP_SHORT[r.comp] + (r.playoff ? ' PO' : '') + (comp.league || !r.round ? '' : ' ' + r.round);
    var mi = home ? null : milesOf(c.distances, r.home, r.away, false);
    var title = games.map(function (x) {
      return x.r.home.name + ' v ' + x.r.away.name + ', ' + F.COMP_BY_KEY[x.r.comp].label + (x.r.round ? ' ' + x.r.round : '') +
        (x.pencil ? ' (pencilled)' : x.r.ko ? ', ' + x.r.ko : '');
    }).join('\n');
    return '<div class="fm-half fm-half--' + pos + ' has-game' + (g.pencil ? ' is-pencil' : '') + '" title="' + esc(title) + '"' + (comp.league ? '' : ' data-cup') + '>' +
      '<span class="fm-half__crest">' + crest(opp.name) + '</span>' +
      '<span class="fm-half__band"><span class="fm-half__opp">' + esc(shortName(opp.name)) + '</span>' +
        '<span class="fm-half__meta"><span class="fm-ha fm-ha--' + (home ? 'h' : 'a') + '">' + (home ? 'H' : 'A') + '</span>' +
        '<span class="fm-cal__comp comp-pill--' + comp.pill + '">' + esc(label) + '</span>' +
        (mi ? '<span class="fm-half__mi">' + esc(mi) + '</span>' : '') +
        (games.length > 1 ? '<span>+' + (games.length - 1) + '</span>' : '') + '</span></span></div>';
  }

  /* Pencil or confirm a slot. The kick-off can be changed; a game shown in
     the UK going into the blocked hours asks first (Article 48, plan). */
  function openChoose(rec, date) {
    var wrap = document.createElement('div');
    var ko = dayOf(date) === 'Sat' ? '15:00' : '19:45';
    var slot = (S.rr.slots || []).filter(function (x) { return x.date === date; })[0];
    wrap.innerHTML =
      '<p class="fm-choose__date">' + esc(day(date)) + '</p>' +
      (slot ? '<div class="fm-choose__flags">' + flagsHtml(slot.flags) + '</div>' : '') +
      '<div class="form-group"><label for="fmcKo">Kick-off</label>' +
        '<input id="fmcKo" class="fm-ko-in" type="text" inputmode="numeric" maxlength="5" autocomplete="off" value="' + ko + '"></div>' +
      '<div id="fmcWarn"></div>';
    /* A text box, not <input type="time">: the browser's time control shows
       12-hour on any machine set to US English, and kick-offs are always
       24-hour. Canon candidate (28/10/2026): eight pages use type="time". */
    var koIn = wrap.querySelector('#fmcKo');
    koIn.addEventListener('blur', function () { var t = hhmm(koIn.value); if (t) koIn.value = t; warn(); });
    function koOf() {
      var t = hhmm(koIn.value);
      if (!t) { NL.toast('Kick-off as a 24-hour time, e.g. 15:00 or 19:45', 'error'); koIn.focus(); }
      return t;
    }
    function warn() {
      var k = hhmm(koIn.value);
      wrap.querySelector('#fmcWarn').innerHTML = X.ukShown(rec) && X.overlapsBlocked(rrCal(), date, k)
        ? '<div class="banner banner--amber">Blocked hours: at ' + esc(k) + ' this game loses UK availability. 12:30 or 17:30 keeps it.</div>' : '';
    }
    wrap.querySelector('#fmcKo').addEventListener('input', warn);
    warn();
    NL.modal({
      title: rec.home.name + ' v ' + rec.away.name,
      body: wrap,
      buttons: [
        { label: 'Rule out', className: 'btn--ghost', onClick: function (m) { m.close(); openRuleOut(rec, date); } },
        { label: 'Cancel', className: 'btn--ghost', onClick: function (m) { m.close(); } },
        { label: 'Pencil', className: 'btn--ghost', onClick: function (m) {
          var k = koOf();
          if (!k) return;
          var next = X.pencil(rec, date, k, now());
          if (!next) { NL.toast('Up to ' + X.MAX_PENCILS + ' pencilled dates: remove one first', 'error'); return; }
          article48(rec, date, k).then(function (ok) {
            if (!ok) return;
            save(next).then(function () {
              NL.toast('Pencilled for ' + day(date), 'success'); m.close();
            }).catch(function (e) { NL.toast('Save failed: ' + e.message, 'error'); });
          });
        }},
        { label: 'Confirm date', className: 'btn--primary', onClick: function (m) {
          var k = koOf();
          if (k) confirmDate(rec, date, k, m);
        }}
      ]
    });
  }

  /* Rule a date out, with a reason: for this game only, or for a club
     that cannot host or cannot travel that day, which then holds for
     every game this season so the question is not asked again. */
  function openRuleOut(rec, date) {
    var wrap = document.createElement('div');
    wrap.innerHTML =
      '<p class="fm-choose__date">' + esc(day(date)) + '</p>' +
      '<div class="form-group"><label for="froWhy">Reason</label><input id="froWhy" type="text" maxlength="120"></div>' +
      '<div class="form-group fm-ro"><label><input type="radio" name="froScope" value="game" checked> This game only</label>' +
        '<label><input type="radio" name="froScope" value="home"> ' + esc(rec.home.name) + ' can’t host that day, for any game</label>' +
        '<label><input type="radio" name="froScope" value="away"> ' + esc(rec.away.name) + ' can’t travel that day, for any game</label></div>';
    NL.modal({
      title: rec.home.name + ' v ' + rec.away.name,
      body: wrap,
      buttons: [
        { label: 'Cancel', className: 'btn--ghost', onClick: function (m) { m.close(); } },
        { label: 'Rule out', className: 'btn--primary', onClick: function (m) {
          var why = wrap.querySelector('#froWhy').value.trim();
          if (!why) { NL.toast('Give a reason', 'error'); return; }
          var scope = wrap.querySelector('input[name="froScope"]:checked').value;
          var done = scope === 'game'
            ? save(X.ruleOut(rec, date, why, now()))
            : NL.ensureAuth().then(function () {
                return ref('unavailable').push({ club: scope === 'home' ? rec.home.name : rec.away.name, side: scope, date: date, reason: why, at: now() });
              }).then(function () {
                return X.pencilsOf(rec).some(function (p) { return p.date === date; }) ? save(X.unpencil(rec, date)) : null;
              });
          done.then(function () { NL.toast('Ruled out ' + day(date), 'success'); m.close(); })
            .catch(function (e) { NL.toast('Save failed: ' + e.message, 'error'); });
        }}
      ]
    });
  }

  /* '19:45', '1945', '19.45' or '930' → 'HH:MM', 24-hour; anything else null. */
  function hhmm(v) {
    var m = String(v || '').trim().match(/^(\d{1,2})[:.]?(\d{2})$/);
    if (!m) return null;
    var h = +m[1], mi = +m[2];
    return h < 24 && mi < 60 ? ('0' + h).slice(-2) + ':' + m[2] : null;
  }

  function rrCal() {
    var d = S.rr.data[NL.season.label(S.meta, S.season)];
    return (d && d.calendar) || {};
  }

  function article48(rec, date, ko) {
    if (!(X.ukShown(rec) && X.overlapsBlocked(rrCal(), date, ko))) return Promise.resolve(true);
    return NL.confirm('A ' + ko + ' kick-off on ' + day(date) + ' is in the blocked hours, so this game loses UK availability.', {
      title: 'Blocked hours', confirmText: 'Use ' + ko + ' anyway'
    });
  }

  function confirmDate(rec, date, ko, modal) {
    article48(rec, date, ko).then(function (ok) {
      if (!ok) return;
      var moved = !!rec.date;
      var next = X.unpencil(F.setDate(rec, date, ko, now()));
      save(next).then(function () {
        NL.toast((moved ? 'Moved to ' : 'Rescheduled for ') + dayKo(date, ko), 'success');
        /* The save has already redrawn the tab (the listener fires first),
           so redraw again now the selection is reset; otherwise the next
           click finds no game. */
        if (!moved) S.rr.key = null;
        S.rr.slot = null;
        renderRearrange();
        if (modal) modal.close();
      }).catch(function (e) { NL.toast('Save failed: ' + e.message, 'error'); });
    });
  }

  /* ── Save ─────────────────────────────────────────────────────────── */
  function patch(up, rec) {
    rec.updatedAt = now();
    up['fixtures/' + rec.key] = clean(rec);
    up['public/' + rec.key] = F.publicView(rec) ? clean(F.publicView(rec)) : null;
  }
  function saveAll(recs) {
    var up = {};
    recs.forEach(function (r) { patch(up, r); });
    return NL.ensureAuth().then(function () { return ref().update(up); });
  }
  function save(rec) { return saveAll([rec]); }

  /* ── Add / edit ──────────────────────────────────────────────────────
     League fixtures come from the import and keep their teams and
     competition. Cup ties are entered here. A changed date keeps the old
     one as a lost date ('moved'). */
  /* What can be added by hand. A play-off belongs to its division. */
  var HAND = [
    { v: 'nl-cup', comp: 'nl-cup', label: 'NL Cup' },
    { v: 'national-po', comp: 'national', playoff: true, label: 'National play-off' },
    { v: 'north-po', comp: 'north', playoff: true, label: 'North play-off' },
    { v: 'south-po', comp: 'south', playoff: true, label: 'South play-off' },
    { v: 'fa-cup', comp: 'fa-cup', label: 'FA Cup' },
    { v: 'fa-trophy', comp: 'fa-trophy', label: 'FA Trophy' }
  ];
  function handOf(v) { return HAND.filter(function (h) { return h.v === v; })[0] || HAND[0]; }

  function numIn(id, v, dis) {
    return '<input id="' + id + '" type="number" min="0" inputmode="numeric" value="' + (v == null ? '' : v) + '"' + dis + '>';
  }

  function openEdit(rec) {
    var isNew = !rec;
    var comp = rec ? F.COMP_BY_KEY[rec.comp] : F.COMP_BY_KEY['fa-cup'];
    var fixedTeams = !isNew && (comp.league || rec.source === 'import');
    var ro = !S.canEdit;
    var dis = ro ? ' disabled' : '';
    var res = (rec && rec.result) || {};

    var wrap = document.createElement('div');
    if (rec) wrap.setAttribute('data-key', rec.key);
    var compOpts = HAND.map(function (h) {
      return '<option value="' + h.v + '"' + (h.v === 'fa-cup' ? ' selected' : '') + '>' + esc(h.label) + '</option>';
    }).join('');
    var hist = rec && rec.attempts && rec.attempts.length
      ? '<ol class="fm-history">' + rec.attempts.map(function (a, i) {
          return '<li><span>' + esc(F.fmt(a.date) + (a.ko ? ' ' + a.ko : '')) + ' · ' + esc(a.outcome) +
            (a.minute ? ' (' + a.minute + 'm)' : '') + (a.reason ? ' · ' + esc(a.reason) : '') + '</span>' +
            (ro ? '' : '<button class="btn btn--ghost btn--sm" type="button" data-drop="' + i + '">Remove</button>') + '</li>';
        }).join('') + '</ol>'
      : '';

    wrap.innerHTML =
      '<div class="form-grid">' +
        '<div class="form-group"><label for="fmeComp">Competition</label>' +
          (isNew ? '<select id="fmeComp">' + compOpts + '</select>'
                 : '<div>' + compPill(rec.comp) + '</div>') + '</div>' +
        '<div class="form-group"><label for="fmeRound">Round</label>' +
          '<input id="fmeRound" type="text" value="' + esc(rec && rec.round || '') + '"' + dis + '></div>' +
        '<div class="form-group"><label>Home</label><div id="fmeHome"></div></div>' +
        '<div class="form-group"><label>Away</label><div id="fmeAway"></div></div>' +
        '<div class="form-group"><label for="fmeDate">Date</label>' +
          '<div class="datetime-row"><input id="fmeDate" type="date" value="' + esc(rec && rec.date || '') + '"' + dis + '>' +
          '<input id="fmeKo" type="time" value="' + esc(rec && rec.ko || '15:00') + '"' + dis + '></div>' +
          (rec && F.awaiting(rec) ? '<div class="form-hint">Awaiting a date. Set one here once it is agreed.</div>' : '') + '</div>' +
        '<div class="form-group" id="fmeOptaWrap"><label for="fmeOpta">Opta ID</label>' +
          '<input id="fmeOpta" type="text" placeholder="g2660046" value="' + esc(rec && rec.optaID || '') + '"' + dis + '></div>' +
        '<div class="form-group"><label>Score</label><div class="fm-score">' +
          numIn('fmeH', res.h, dis) + '<span class="fm-dash">–</span>' + numIn('fmeA', res.a, dis) + '</div></div>' +
        '<div class="form-group"><label>After extra time</label><div class="fm-score">' +
          numIn('fmeEH', res.aet && res.aet.h, dis) + '<span class="fm-dash">–</span>' + numIn('fmeEA', res.aet && res.aet.a, dis) + '</div></div>' +
        '<div class="form-group"><label>Penalties</label><div class="fm-score">' +
          numIn('fmePH', res.pens && res.pens.h, dis) + '<span class="fm-dash">–</span>' + numIn('fmePA', res.pens && res.pens.a, dis) + '</div></div>' +
        '<div class="form-group" id="fmeResultWrap"><label for="fmeWent">Went through</label>' +
          '<select id="fmeWent"' + dis + '>' +
            '<option value="">From the score</option>' +
            '<option value="home">Home</option>' +
            '<option value="away">Away</option>' +
            '<option value="replay">Drawn: replay</option>' +
          '</select></div>' +
        (rec && rec.date ? '<div class="form-group"><label>Attendance</label><div class="fm-score">' +
          numIn('fmeCrowd', S.crowds[rec.key] ? S.crowds[rec.key].total : null, dis) + '<span class="fm-dash">away</span>' +
          numIn('fmeCrowdAway', S.crowds[rec.key] ? S.crowds[rec.key].away : null, dis) + '</div></div>' : '') +
        '<div class="form-group"><label><input id="fmeNeutral" type="checkbox"' + (rec && rec.neutral ? ' checked' : '') + dis +
          '> Neutral venue</label>' +
          '<input id="fmeVenue" type="text" placeholder="Venue" value="' + esc(rec && rec.venue || '') + '"' + dis + '></div>' +
        (hist ? '<div class="form-group span2"><label>Lost dates</label>' + hist + '</div>' : '') +
      '</div>';

    var homePick, awayPick;
    function pickers() {
      var picked = {};
      ['home', 'away'].forEach(function (side) {
        var mount = wrap.querySelector(side === 'home' ? '#fmeHome' : '#fmeAway');
        var current = rec ? rec[side].name : null;
        if (fixedTeams || ro) { mount.innerHTML = team(rec[side], false); NL.clubs.wireCrestImgs(mount); return; }
        var p = NL.clubPicker(mount, {
          mode: 'search', season: 'all', extraClubs: S.guests, freetext: 'commit',
          placeholder: 'Club', onSelect: function () {}
        });
        if (current) p.setValue(current);
        picked[side] = p;
      });
      homePick = picked.home; awayPick = picked.away;
    }

    function syncComp() {
      var key = isNew ? handOf(wrap.querySelector('#fmeComp').value).comp : rec.comp;
      var fa = F.COMP_BY_KEY[key].fa;
      wrap.querySelector('#fmeOptaWrap').hidden = fa;
      wrap.querySelector('#fmeResultWrap').hidden = !fa;
    }

    var ctrl;
    var buttons = [];
    if (!ro && rec && rec.source === 'manual') {
      buttons.push({ label: 'Delete', className: 'btn--danger', onClick: function (m) {
        NL.confirm('Delete ' + rec.home.name + ' v ' + rec.away.name + '?', { title: 'Delete tie', confirmText: 'Delete', variant: 'danger' })
          .then(function (yes) {
            if (!yes) return;
            var up = {}; up['fixtures/' + rec.key] = null; up['public/' + rec.key] = null;
            NL.ensureAuth().then(function () { return ref().update(up); })
              .then(function () { NL.toast('Deleted', 'success'); m.close(); })
              .catch(function (e) { NL.toast('Delete failed: ' + e.message, 'error'); });
          });
      }});
    }
    if (!ro && rec && rec.date) {
      buttons.push({ label: 'Postpone', className: 'btn--ghost', onClick: function (m) { openLose(rec, 'postponed', m); } });
      buttons.push({ label: 'Abandon', className: 'btn--ghost', onClick: function (m) { openLose(rec, 'abandoned', m); } });
    }
    buttons.push({ label: ro ? 'Close' : 'Cancel', className: 'btn--ghost', onClick: function (m) { m.close(); } });
    if (!ro) {
      buttons.push({ label: isNew ? 'Add tie' : 'Save', className: 'btn--primary', onClick: function (m) {
        submit(rec, wrap, homePick, awayPick).then(function (ok) { if (ok) m.close(); });
      }});
    }

    ctrl = NL.modal({
      title: isNew ? 'Add cup tie' : rec.home.name + ' v ' + rec.away.name,
      body: wrap,
      width: 'wide',
      buttons: buttons
    });
    pickers();
    if (rec) wrap.querySelector('#fmeWent').value = rec.wentThrough || '';
    if (isNew) wrap.querySelector('#fmeComp').addEventListener('change', syncComp);
    syncComp();

    wrap.addEventListener('click', function (e) {
      var b = e.target.closest('[data-drop]');
      if (!b) return;
      var i = +b.getAttribute('data-drop');
      var a = rec.attempts[i];
      NL.confirm('Remove the lost date ' + F.fmt(a.date) + ' (' + a.outcome + ')? Use this for a date entered by mistake; it is not logged as a change.',
        { title: 'Remove lost date', confirmText: 'Remove', variant: 'danger' })
        .then(function (yes) {
          if (!yes) return;
          save(F.dropAttempt(rec, i))
            .then(function () { NL.toast('Lost date removed', 'success'); ctrl.close(); })
            .catch(function (e2) { NL.toast('Save failed: ' + e2.message, 'error'); });
        });
    });
  }

  /* Postpone or abandon. The game drops out of the public view until it
     has a new date; the reason and the moment it was called are kept. */
  function openLose(rec, outcome, parent) {
    var wrap = document.createElement('div');
    var opts = S.reasons.map(function (r) { return '<option>' + esc(r) + '</option>'; }).join('');
    wrap.innerHTML =
      '<div class="form-group"><label for="fmlReason">Reason</label>' +
        '<select id="fmlReason"><option value="">Choose</option>' + opts + '</select></div>' +
      '<div class="form-group"><label for="fmlNote">Note</label><input id="fmlNote" type="text"></div>' +
      (outcome === 'abandoned'
        ? '<div class="form-group"><label for="fmlMin">Minute</label><input id="fmlMin" type="number" min="0" max="130" inputmode="numeric"></div>'
        : '');
    NL.modal({
      title: (outcome === 'abandoned' ? 'Abandon ' : 'Postpone ') + rec.home.name + ' v ' + rec.away.name,
      body: wrap,
      size: 'sm',
      buttons: [
        { label: 'Cancel', className: 'btn--ghost', onClick: function (m) { m.close(); } },
        { label: outcome === 'abandoned' ? 'Abandon' : 'Postpone', className: 'btn--primary', onClick: function (m) {
          var reason = wrap.querySelector('#fmlReason').value;
          var note = wrap.querySelector('#fmlNote').value.trim();
          if (!reason) { NL.toast('Choose a reason', 'error'); return; }
          if (reason === 'Other' && !note) { NL.toast('Say what the other reason is', 'error'); return; }
          var minEl = wrap.querySelector('#fmlMin');
          var minute = minEl && minEl.value !== '' ? +minEl.value : null;
          var next = F.loseDate(rec, { outcome: outcome, reason: note ? reason + ': ' + note : reason, minute: minute, at: now() });
          save(next).then(function () {
            NL.toast(outcome === 'abandoned' ? 'Abandoned' : 'Postponed', 'success');
            m.close(); parent.close();
          }).catch(function (e) { NL.toast('Save failed: ' + e.message, 'error'); });
        }}
      ]
    });
  }

  /* A crowd typed in a game's dialog is saved where every crowd lives — the
     Attendance tool's submission for that match ID — so there is still one
     figure, not a copy. Shape as attendance/index.html submitAttendance
     writes it. A past season's crowds sit in Attendance's archive, which
     only a superadmin may write (the rules say so too). */
  function crowdFromForm(wrap) {
    var t = intOf(wrap, 'fmeCrowd'), a = intOf(wrap, 'fmeCrowdAway');
    var key = wrap.getAttribute('data-key');
    var held = S.crowds[key] || null;
    if (t == null) return { ok: a == null, msg: 'Enter the total crowd, or leave both empty', change: false };
    if (a != null && a > t) return { ok: false, msg: 'Away fans cannot exceed the total' };
    var change = !held || held.total !== t || (held.away == null ? null : held.away) !== (a == null ? null : a);
    return { ok: true, change: change, total: t, away: a };
  }

  function ukToUtc(ymd, hm) {
    var p = ymd.split('-'), t = (hm || '15:00').split(':');
    var guess = Date.UTC(+p[0], +p[1] - 1, +p[2], +t[0], +t[1]);
    var d = new Date(guess);
    var off = Date.parse(d.toLocaleString('en-US', { timeZone: 'Europe/London' })) - Date.parse(d.toLocaleString('en-US', { timeZone: 'UTC' }));
    return new Date(guess - off).toISOString().slice(0, 19).replace('T', ' ');
  }

  var ATT_KEY = { national: 'nl', north: 'north', south: 'south', 'nl-cup': 'nl-cup', 'fa-cup': 'fa-cup', 'fa-trophy': 'fa-trophy' };

  function saveCrowd(rec, c) {
    var path = attPath(S.season, 'submissions/' + rec.key);
    var stamp = Date.now(), who = S.session || {};
    var held = S.crowds[rec.key];
    var write = held
      ? db.ref(path).update({ total: c.total, away: c.away, awayRecorded: c.away != null, lastEditedAt: stamp, lastEditedBy: who.uid || null })
      : db.ref(path).set(clean({
          matchID: rec.key,
          clubKey: (NL.clubs.byName(rec.home.name) || {}).optaID || null,
          clubName: rec.home.name,
          competitionKey: ATT_KEY[rec.comp] || rec.comp,
          kickoffUTC: ukToUtc(rec.date, rec.ko),
          total: c.total,
          away: c.away,
          awayRecorded: c.away != null,
          submittedBy: who.uid || null,
          submittedByName: who.name || who.email || '',
          submittedByRole: 'admin',
          submittedAt: stamp
        }));
    return NL.ensureAuth().then(function () { return write; }).then(function () {
      S.crowds[rec.key] = { total: c.total, away: c.away };
      NL.writeAudit('fixtures_crowd', rec.home.name + ' v ' + rec.away.name + ' ' + rec.date + ': ' + c.total);
      render();
    });
  }

  function intOf(wrap, id) {
    var v = wrap.querySelector('#' + id).value;
    return v === '' ? null : Math.max(0, parseInt(v, 10));
  }

  function resultFromForm(wrap) {
    var h = intOf(wrap, 'fmeH'), a = intOf(wrap, 'fmeA');
    if (h == null && a == null) return { ok: true, result: null };
    if (h == null || a == null) return { ok: false, msg: 'Enter both scores, or neither' };
    var eh = intOf(wrap, 'fmeEH'), ea = intOf(wrap, 'fmeEA');
    var ph = intOf(wrap, 'fmePH'), pa = intOf(wrap, 'fmePA');
    if ((eh == null) !== (ea == null)) return { ok: false, msg: 'Extra time needs both scores' };
    if ((ph == null) !== (pa == null)) return { ok: false, msg: 'Penalties need both scores' };
    return { ok: true, result: { h: h, a: a, aet: eh != null ? { h: eh, a: ea } : null,
      pens: ph != null ? { h: ph, a: pa } : null, source: 'manual' } };
  }

  function submit(rec, wrap, homePick, awayPick) {
    var isNew = !rec;
    var hand = isNew ? handOf(wrap.querySelector('#fmeComp').value) : null;
    var compKey = isNew ? hand.comp : rec.comp;
    var comp = F.COMP_BY_KEY[compKey];
    var homeName = homePick ? homePick.getValue() : rec.home.name;
    var awayName = awayPick ? awayPick.getValue() : rec.away.name;
    var date = wrap.querySelector('#fmeDate').value || null;
    var ko = wrap.querySelector('#fmeKo').value || null;
    var round = wrap.querySelector('#fmeRound').value.trim() || null;
    var opta = wrap.querySelector('#fmeOpta').value.trim().toLowerCase() || null;
    var res = resultFromForm(wrap);

    function no(msg) { NL.toast(msg, 'error'); return Promise.resolve(false); }
    if (!res.ok) return no(res.msg);
    if (!homeName || !awayName) return no('Pick both clubs');
    if (homeName === awayName) return no('Home and away are the same club');
    if (opta && !/^g\d+$/.test(opta)) return no('An Opta ID looks like g2660046');
    if (isNew && !date) return no('A new tie needs a date');
    /* Our side of every tie comes from the roster — it is the side whose
       dates get blocked (plan, Outside clubs). */
    if (!clubOf(homeName) && !clubOf(awayName)) return no('At least one side must be a League club');
    if (opta && (!rec || rec.optaID !== opta)) {
      var clash = Object.keys(S.fixtures).filter(function (k) { return S.fixtures[k].optaID === opta && (!rec || k !== rec.key); });
      if (clash.length) return no('Opta ID already on another fixture');
    }

    var next = rec ? clean(rec) : {
      comp: compKey, playoff: hand && hand.playoff ? true : null,
      attempts: [], source: 'manual', state: 'scheduled', date: null, ko: null,
      broadcast: { availability: comp.fa ? 'cup' : compKey === 'nl-cup' ? 'worldwide' : 'tbc', enhanced: false, daznMove: false, ami: false },
      wentThrough: null, result: null
    };
    next.round = round;
    next.home = clubOf(homeName) || { name: homeName.trim() };
    next.away = clubOf(awayName) || { name: awayName.trim() };
    if (!comp.fa) next.optaID = opta;
    var neutral = wrap.querySelector('#fmeNeutral').checked;
    var venue = wrap.querySelector('#fmeVenue').value.trim();
    if (neutral && !venue) return no('Name the neutral venue');
    next.neutral = neutral || null;
    next.venue = neutral ? venue : null;
    if (date) next = F.setDate(next, date, ko, now());
    if (!next.original) next.original = { date: next.date, ko: next.ko };

    if (!res.result || !rec || !F.sameResult(res.result, rec.result)) next.result = res.result;
    if (comp.fa) {
      var w = wrap.querySelector('#fmeWent').value;
      next.wentThrough = w || (next.result ? F.faWinner(next.result, null) : null);
    }

    if (isNew) {
      var key = opta || F.mintKey(compKey + (next.playoff ? '-po' : ''), round, next.home.name, next.away.name);
      var n = 2, base = key;
      while (S.fixtures[key]) key = base + '-' + (n++);
      next.key = key;
    }

    var crowd = rec && rec.date ? crowdFromForm(wrap) : { ok: true, change: false };
    if (!crowd.ok) return no(crowd.msg);

    return save(next)
      .then(function () { return crowd.change ? saveCrowd(next, crowd) : null; })
      .then(function () { NL.toast(isNew ? 'Tie added' : 'Saved', 'success'); return true; })
      .catch(function (e) { NL.toast('Save failed: ' + e.message, 'error'); return false; });
  }

  /* ── Results ─────────────────────────────────────────────────────────
     A day at a time, two ways: from NLS for the competitions it carries,
     or by pasting rows from the sheet (any columns with home, score, away).
     A score already held that differs is shown and kept unless ticked. */
  var NLS = 'https://multi-club-matches.football.web.gc.nationalleagueservices.co.uk/v2/matches/';
  var NLS_COMPS = [89, 373, 372, 1275];

  /* Canon candidate (28/10/2026): a season of NLS matches, paged, is also
     fetched by dazn/admin/index.html (three leagues). The second copy is
     the signal to promote one NL.* helper. */
  function nlsSeason() {
    return Promise.all(NLS_COMPS.map(function (comp) {
      var all = [];
      function page(n) {
        var url = NLS + '?seasonID=' + encodeURIComponent(S.season) + '&competitionID=' + comp +
          '&sort=kickOffDateUTC&page.number=' + n + '&page.size=100';
        return fetch(url).then(function (r) {
          if (!r.ok) throw new Error('NLS ' + comp + ': HTTP ' + r.status);
          return r.json();
        }).then(function (j) {
          var data = j.data || [];
          all = all.concat(data);
          var total = j.meta && j.meta.totalCount;
          if (data.length === 100 && (total == null || all.length < total)) return page(n + 1);
          return all;
        });
      }
      return page(1);
    })).then(function (lists) { return [].concat.apply([], lists); });
  }

  var LONDON = new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/London', year: 'numeric', month: '2-digit', day: '2-digit' });
  var LONDON_T = new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/London', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
  function londonYmd(t) { return LONDON.format(new Date(t)); }

  function openResults() {
    var t = today();
    var weekAgo = F.ymdOf(new Date(Date.now() - 7 * 864e5));
    var wrap = document.createElement('div');
    wrap.innerHTML =
      '<h3 class="fm-section">From NLS</h3>' +
      '<div class="form-grid">' +
        '<div class="form-group"><label for="fmrFrom">From</label><input id="fmrFrom" type="date" value="' + weekAgo + '"></div>' +
        '<div class="form-group"><label for="fmrTo">To</label><input id="fmrTo" type="date" value="' + t + '"></div>' +
      '</div>' +
      '<button class="btn btn--navy btn--sm" type="button" id="fmrFetch">Fetch</button>' +
      '<h3 class="fm-section">Or paste rows</h3>' +
      '<div class="form-group"><textarea id="fmrPaste" class="fm-paste" spellcheck="false" placeholder="Home, score, away on each row"></textarea></div>' +
      '<button class="btn btn--navy btn--sm" type="button" id="fmrRead">Read</button>' +
      '<div id="fmrOut" class="fm-gap"></div>';

    var pending = null;      /* { rows: [match], kind } */

    function show(matches, unmatched, opta) {
      var add = matches.filter(function (m) { return m.result && !m.current; });
      var same = matches.filter(function (m) { return m.result && m.current && !m.differs; });
      var diff = matches.filter(function (m) { return m.differs; });
      var fill = (opta || []).length;
      pending = { matches: matches };
      var html = '<div class="banner banner--info"><strong>' + add.length + ' new results</strong>' +
        (fill ? ', ' + fill + ' Opta IDs to fill' : '') + '. ' + same.length + ' already held' +
        (diff.length ? ', ' + diff.length + ' different.' : '.') + '</div>';
      if (diff.length) {
        html += '<label class="fm-gap"><input type="checkbox" id="fmrOver"> Replace the ' + diff.length + ' that differ</label>' +
          '<ul class="fm-problems">' + diff.map(function (m) {
            var r = S.fixtures[m.key];
            return '<li>' + esc(r.home.name + ' v ' + r.away.name) + ': held ' + esc(F.resultText(m.current)) +
              ', new ' + esc(F.resultText(m.result)) + '</li>';
          }).join('') + '</ul>';
      }
      if (unmatched && unmatched.length) {
        html += '<details class="disclosure"><summary>' + unmatched.length + ' rows not matched</summary><ul class="fm-problems">' +
          unmatched.map(function (u) { return '<li>' + esc(u) + '</li>'; }).join('') + '</ul></details>';
      }
      wrap.querySelector('#fmrOut').innerHTML = html;
    }

    wrap.querySelector('#fmrFetch').addEventListener('click', function () {
      var from = wrap.querySelector('#fmrFrom').value, to = wrap.querySelector('#fmrTo').value;
      if (!from || !to || from > to) { NL.toast('Pick a date range', 'error'); return; }
      wrap.querySelector('#fmrOut').innerHTML = '<div class="banner banner--info">Fetching from NLS…</div>';
      nlsSeason().then(function (rows) {
        /* Results inside the range; Opta IDs from the whole season, since an
           unplayed game has one too. */
        var res = F.nlsResults(rows).filter(function (n) {
          var d = n.utc != null ? londonYmd(n.utc) : null;
          if (!n.result) return true;
          return d && d >= from && d <= to;
        });
        var m = F.matchNls(S.fixtures, res, londonYmd, function (id) { var c = NL.clubs.byOpta(id); return c ? c.name : null; });
        show(m, null, m.filter(function (x) { return x.optaID; }));
      }).catch(function (e) {
        wrap.querySelector('#fmrOut').innerHTML = '<div class="banner banner--error">' + esc(e.message) + '</div>';
      });
    });

    wrap.querySelector('#fmrRead').addEventListener('click', function () {
      var out = F.resultsFromPaste(S.fixtures, wrap.querySelector('#fmrPaste').value, NL.parseDate);
      show(out.matches, out.unmatched, null);
    });

    NL.modal({
      title: 'Results',
      body: wrap,
      width: 'wide',
      buttons: [
        { label: 'Close', className: 'btn--ghost', onClick: function (m) { m.close(); } },
        { label: 'Apply', className: 'btn--primary', onClick: function (m) {
          if (!pending) { NL.toast('Fetch or read some results first', 'error'); return; }
          var over = wrap.querySelector('#fmrOver');
          var replace = over && over.checked;
          var recs = [];
          pending.matches.forEach(function (x) {
            var r = S.fixtures[x.key];
            if (!r) return;
            var n = clean(r), changed = false;
            if (x.optaID && !n.optaID) { n.optaID = x.optaID; changed = true; }
            if (x.result && (!x.current || (x.differs && replace))) { n.result = x.result; changed = true; }
            if (changed && F.COMP_BY_KEY[n.comp].fa && !n.wentThrough) n.wentThrough = F.faWinner(n.result, null);
            if (changed) recs.push(n);
          });
          if (!recs.length) { NL.toast('Nothing to change', 'success'); return; }
          saveAll(recs).then(function () {
            NL.writeAudit('fixtures_results', recs.length + ' fixtures');
            NL.toast(recs.length + ' fixtures updated', 'success');
            m.close();
          }).catch(function (e) { NL.toast('Save failed: ' + e.message, 'error'); });
        }}
      ]
    });
  }

  /* ── A past season from Attendance ───────────────────────────────────
     The Attendance tool archived every game of a finished season with the
     crowds clubs submitted against it. Bringing those games across keeps
     their match IDs as keys, so the crowds stay joined without a copy. */
  function openFromAttendance() {
    var key = S.season;
    var label = NL.season.label(S.meta, key);
    NL.ensureAuth()
      .then(function () { return db.ref(attPath(key, 'fixtures')).once('value'); })
      .then(function (snap) {
        var res = F.fromAttendance(snap.val() || {}, {
          clubByOpta: function (id) { var c = NL.clubs.byOpta(id); return c ? { name: c.name, code: c.code } : null; },
          clubOf: clubOf,
          london: function (t) {
            var d = new Date(t);
            return { date: londonYmd(t), ko: LONDON_T.format(d) };
          }
        });
        var n = Object.keys(res.fixtures).length;
        if (!n) { NL.alert('Attendance has no fixtures archived for ' + label + '.', { title: 'Nothing to bring in' }); return; }
        var by = {}, crowds = 0;
        Object.keys(res.fixtures).forEach(function (k) {
          var r = res.fixtures[k];
          by[r.comp] = (by[r.comp] || 0) + 1;
          if (S.crowds[k]) crowds++;
        });
        var lines = F.COMPS.filter(function (c) { return by[c.key]; }).map(function (c) { return c.label + ' ' + by[c.key]; }).join(' · ');
        var existing = Object.keys(S.fixtures).length;
        return NL.confirm(n + ' games for ' + label + ' (' + lines + '), ' + crowds + ' with a crowd.' +
          (existing ? '\nThis replaces the ' + existing + ' already here.' : '') +
          (res.problems.length ? '\n' + res.problems.length + ' to check: ' + res.problems.slice(0, 3).map(function (p) { return p.text; }).join('; ') : ''),
          { title: 'Bring in ' + label, confirmText: 'Bring in', variant: existing ? 'danger' : 'primary' })
          .then(function (yes) {
            if (!yes) return;
            var fx = {}, pub = {}, stamp = now();
            Object.keys(res.fixtures).forEach(function (k) {
              var r = res.fixtures[k];
              r.updatedAt = stamp;
              fx[k] = clean(r);
              var p = F.publicView(r);
              if (p) pub[k] = clean(p);
            });
            return ref().set({ fixtures: fx, public: pub,
              meta: { importedAt: stamp, importedBy: (S.session && S.session.email) || null, from: 'attendance' } })
              .then(function () {
                NL.writeAudit('fixtures_from_attendance', label + ': ' + n + ' games');
                NL.toast(n + ' games brought in', 'success');
              });
          });
      })
      .catch(function (e) { NL.toast('Could not bring in: ' + e.message, 'error'); });
  }

  /* ── Import ──────────────────────────────────────────────────────────
     Once per season: the workbook becomes the record and the workbook is
     frozen (plan, The record). Re-importing replaces every fixture, so it
     says so first. */
  function openImport() {
    var wrap = document.createElement('div');
    wrap.innerHTML =
      '<div class="form-group"><label for="fmiFix">Fixtures tab</label>' +
        '<textarea id="fmiFix" class="fm-paste" spellcheck="false" placeholder="Select all on the Fixtures tab, copy, paste here"></textarea></div>' +
      '<div class="form-group"><label for="fmiRe">Rearrangements tab</label>' +
        '<textarea id="fmiRe" class="fm-paste" spellcheck="false"></textarea></div>' +
      '<div id="fmiOut"></div>';
    var result = null;

    var ctrl = NL.modal({
      title: 'Import workbook',
      body: wrap,
      width: 'wide',
      buttons: [
        { label: 'Cancel', className: 'btn--ghost', onClick: function (m) { m.close(); } },
        { label: 'Check', className: 'btn--navy', onClick: function () { check(); } },
        { label: 'Import', className: 'btn--primary', onClick: function (m) { commit(m); } }
      ]
    });

    /* The season a sheet belongs to comes from its own dates (1 July to
       30 June), not from whichever season is on screen: on 28/10/2026 last
       season's sheet, imported while this season was showing, replaced it.
       Rows dated outside that season are left out and counted. */
    function seasonOfDate(d) {
      var y = +d.slice(0, 4), m = +d.slice(5, 7);
      return String(m >= 7 ? y : y - 1);
    }
    function dateOf(r) { return r.date || (r.attempts && r.attempts.length ? r.attempts[0].date : null); }

    function check() {
      var out = wrap.querySelector('#fmiOut');
      out.innerHTML = '<div class="banner banner--info">Checking…</div>';
      var goBtn = wrap.closest('.modal') && wrap.closest('.modal').querySelector('.modal__footer .btn--primary');
      if (goBtn) goBtn.textContent = 'Import';
      var opts = {
        fixtures: wrap.querySelector('#fmiFix').value,
        rearrangements: wrap.querySelector('#fmiRe').value.trim() || null,
        clubOf: clubOf,
        divisionOf: function (name) { var c = NL.clubs.byName(name); return c ? c.division : null; },
        parseDate: NL.parseDate
      };
      var first = F.build(opts);
      if (first.error) { out.innerHTML = '<div class="banner banner--error">' + esc(first.error) + '</div>'; result = null; return; }
      var tally = {};
      Object.keys(first.fixtures).forEach(function (k) {
        var d = dateOf(first.fixtures[k]);
        if (d) tally[seasonOfDate(d)] = (tally[seasonOfDate(d)] || 0) + 1;
      });
      var season = Object.keys(tally).sort(function (x, y) { return tally[y] - tally[x]; })[0];
      if (!season || NL.season.keys(S.meta).indexOf(season) === -1) {
        out.innerHTML = '<div class="banner banner--error">This sheet’s games are in ' +
          esc(season ? NL.season.label(S.meta, season) : 'no season') + ', which is not one this tool holds.</div>';
        result = null;
        return;
      }
      var past = season !== S.current;
      var seedP = season === '2026' ? getJson(SEED_URL) : Promise.resolve(null);
      /* A past season is keyed to the Attendance archive so its crowds stay
         attached; the current one keeps its Opta IDs from the sheet. */
      var archP = past
        ? NL.ensureAuth().then(function () { return db.ref(attPath(season, 'fixtures')).once('value'); })
            .then(function (snap) { return snap.val() || {}; })
        : Promise.resolve(null);
      var crowdP = NL.ensureAuth().then(function () { return db.ref(attPath(season, 'submissions')).once('value'); })
        .then(function (snap) { return crowdsOf(snap.val()); }).catch(function () { return {}; });
      Promise.all([seedP, archP, crowdP]).then(function (got) {
        var seed = got[0], archive = got[1], crowds = got[2];
        opts.seed = seed;
        result = F.build(opts);
        var outside = 0;
        Object.keys(result.fixtures).forEach(function (k) {
          var d = dateOf(result.fixtures[k]);
          if (d && seasonOfDate(d) !== season) { delete result.fixtures[k]; outside++; }
        });
        result.season = season;
        result.counts = F.counts(result.fixtures);
        var keyed = null;
        if (archive) {
          keyed = F.keyToAttendance(result.fixtures, archive);
          result.fixtures = keyed.fixtures;
          result.counts = F.counts(keyed.fixtures);
          /* "No Opta ID" lines are answered by the keying; what is left
             unmatched is listed below instead. */
          result.problems = result.problems.filter(function (p) { return p.kind !== 'opta'; });
        }
        var c = result.counts;
        var by = F.COMPS.map(function (x) { return c.byComp[x.key] ? esc(x.label) + ' ' + c.byComp[x.key] : null; })
          .filter(Boolean).join(' · ');
        var withResult = Object.keys(result.fixtures).filter(function (k) { return result.fixtures[k].result; }).length;
        var html = '<div class="banner ' + (season === S.season ? 'banner--info' : 'banner--amber') + '"><strong>' +
          'This sheet is ' + esc(NL.season.label(S.meta, season)) + '</strong>: it imports into ' + esc(NL.season.label(S.meta, season)) +
          (season === S.season ? '.' : ', not the season on screen.') +
          (outside ? ' ' + outside + ' rows dated outside it are left out.' : '') + '</div>' +
          '<div class="banner banner--info"><strong>' + c.total + ' fixtures.</strong> ' + by +
          (c.playoffs ? ' (' + c.playoffs + ' of them play-offs)' : '') +
          '. ' + withResult + ' with results. ' + c.awaiting + ' awaiting a date.' +
          (seed || past ? '' : ' No published schedule found, so original dates come from the history.') + '</div>';
        if (keyed) html += attendanceCheck(keyed, crowds);
        if (result.problems.length) {
          html += '<details class="disclosure"><summary>' + result.problems.length + ' to check after import' +
            '<span class="disclosure__meta">none stop the import</span></summary><ul class="fm-problems">' +
            result.problems.map(function (p) { return '<li>' + esc(p.text) + '</li>'; }).join('') + '</ul></details>';
        }
        out.innerHTML = html;
        /* The button names the season the games go into. */
        var go = wrap.closest('.modal') && wrap.closest('.modal').querySelector('.modal__footer .btn--primary');
        if (go) go.textContent = 'Import into ' + NL.season.label(S.meta, season);
        var cp = out.querySelector('[data-copy-apart]');
        if (cp) cp.addEventListener('click', function () { NL.copy(cp.getAttribute('data-copy-apart')); });
      });
    }

    /* How the past season meets its crowds: games matched to the
       Attendance archive, FA ties given Attendance's own ID, anything left;
       then crowds attached, and the sheet's crowd column checked against
       them (more than 10% apart is listed). Attendance's figure is the one
       kept. */
    function attendanceCheck(k, crowds) {
      var attached = 0, apart = [];
      Object.keys(k.fixtures).forEach(function (key) {
        var r = k.fixtures[key], c = crowds[key];
        if (!c) return;
        attached++;
        if (r.sheetCrowd != null && Math.abs(r.sheetCrowd - c.total) > 0.1 * Math.max(c.total, 1)) {
          apart.push(r.home.name + ' v ' + r.away.name + ' (' + F.fmt(r.date) + '): Attendance ' +
            c.total.toLocaleString('en-GB') + ', sheet ' + r.sheetCrowd.toLocaleString('en-GB'));
        }
      });
      var h = '<div class="banner ' + (k.unmatched.length ? 'banner--amber' : 'banner--info') + '"><strong>' +
        k.matched + ' matched to Attendance</strong>, ' + k.formula + ' FA ties by Attendance\u2019s own ID, ' +
        k.unmatched.length + ' unmatched. ' + attached + ' crowds attached.</div>';
      if (k.unmatched.length) {
        h += '<details class="disclosure" open><summary>' + k.unmatched.length + ' not matched</summary><ul class="fm-problems">' +
          k.unmatched.map(function (r) { return '<li>' + esc(F.COMP_BY_KEY[r.comp].label + ' ' + r.home.name + ' v ' + r.away.name + ' ' + F.fmt(r.date)) + '</li>'; }).join('') +
          '</ul></details>';
      }
      if (apart.length) {
        h += '<details class="disclosure"><summary>' + apart.length + ' crowds differ from the sheet' +
          '<span class="disclosure__meta">Attendance\u2019s figure is kept</span></summary><ul class="fm-problems">' +
          apart.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>' +
          '<button class="btn btn--ghost btn--sm" type="button" data-copy-apart="' + esc(apart.join('\n')) + '">Copy list</button></details>';
      }
      return h;
    }

    function commit(m) {
      if (!result) { NL.toast('Check the paste first', 'error'); return; }
      var target = result.season;
      var existingP = target === S.season
        ? Promise.resolve(Object.keys(S.fixtures).length)
        : NL.ensureAuth().then(function () { return db.ref(BASE + target + '/fixtures').once('value'); })
            .then(function (snap) { return Object.keys(snap.val() || {}).length; });
      existingP.then(function (existing) {
        return existing
          ? NL.confirm('This replaces all ' + existing + ' fixtures for ' + NL.season.label(S.meta, target) +
              ', including anything changed since the last import.', { title: 'Replace fixtures', confirmText: 'Replace', variant: 'danger' })
          : true;
      }).then(function (yes) {
        if (!yes) return;
        var fx = {}, pub = {}, stamp = now();
        Object.keys(result.fixtures).forEach(function (k) {
          var r = result.fixtures[k];
          r.updatedAt = stamp;
          delete r.sheetCrowd;
          fx[k] = clean(r);
          var p = F.publicView(r);
          if (p) pub[k] = clean(p);
        });
        var payload = {
          fixtures: fx,
          public: pub,
          meta: { importedAt: stamp, importedBy: (S.session && S.session.email) || null, counts: clean(result.counts) }
        };
        NL.ensureAuth().then(function () { return db.ref(BASE + target).set(payload); })
          .then(function () {
            NL.writeAudit('fixtures_import', NL.season.label(S.meta, target) + ': ' + result.counts.total + ' fixtures');
            NL.toast('Imported ' + result.counts.total + ' fixtures into ' + NL.season.label(S.meta, target), 'success');
            m.close();
            if (target !== S.season) {
              openSeason(target);
            }
          })
          .catch(function (e) { NL.toast('Import failed: ' + e.message, 'error'); });
      });
    }
    return ctrl;
  }

  /* If auth-guard fired before this script loaded, replay the session. */
  if (window._toolDeferredSession) {
    window.TOOL.boot(window._toolDeferredSession);
    delete window._toolDeferredSession;
  }
})();
</script>

</body>
</html>
