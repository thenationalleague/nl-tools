<!DOCTYPE html>
<!--
  NL Tools — Fixture Management
  Version: v3.3 (30/10/2026)
  File: /fixtures/admin/index.html

  The League's master fixture record: every game in every competition, with
  the dates each one has lost. Staff console. The plan, and every decision
  behind it, is system/fixture-management-plan.md.

  CHANGELOG
    v3.3 (30/10/2026) – Rearrangements calendar: the home club's games (top
      of each day) are soft brand navy, the away club's (bottom) soft brand
      red, and the H and A tags are solid navy and solid red with white
      letters (Richard).
      Pointing at a club in the legend fades the other club's games.
    v3.2 (30/10/2026) – Rearrangements: a day more than 35 days from the
      original date is no longer faded. Being outside the window is now a
      flag on the slot from the finder (v1.7), listed first, so such a slot
      is never green and free (Richard: the window is a flag, not a reason
      to make it less clear). _finder.js ?v=7 -> ?v=8.
    v3.1 (30/10/2026) – Fixtures and Broadcast are two views of one list
      (Richard): both tabs show the same panel, filters and season, and
      switching keeps the first game in view at the same height. The
      Broadcast view's Dates/Upcoming filter went (it stuck when the season
      changed); Fixtures/Results does that job for both. Broadcast rows show
      pills, not tick boxes: availability, then Enhanced, DAZN and AMI in
      columns of their own, each pill shown only when on; a game to review carries an amber (i). Tap a game to change
      it in its own panel (AMI still worldwide only; saving clears review).
      FA ties stay listed, blank. The six number cards became a Needs a
      look filter and one line of counts (with the DAZN tally on
      Broadcast). The Rearrangements tab shows how many games await a date
      (canon .tab__count, brand v2.75).
    v3.0 (30/10/2026) – the fixture list gives the club names the room
      (Richard: names were "hugely truncated"). Competition is a coloured
      band: under each date, games group by competition with a header row in
      its colour, and each row has the same colour on its left edge, from
      the canon comp-pill modifiers. Attendance shows only when the table
      holds a game already played; broadcast is no longer a column, only a
      tag on an upcoming game that is worldwide, overseas or TBC (decided on
      the Broadcast tab). The Broadcast tab's table is unchanged.
    v2.9 (30/10/2026) – the fixture tables were 1,130px wide at least, so on
      a window under about 1,170px each one scrolled sideways, with its scroll
      bar at the bottom of a list that can run for screens (Richard). The
      fixed columns are narrower (min-width 900px; the broadcast table 1000px),
      the result column wraps, and the broadcast tick columns widen to fit
      their headers.
    v2.8 (30/10/2026) – Declutter: the filters are buttons that open a
      short list (NL.filterButton) – Competition on the Fixtures tab, and
      Competition, Status and Dates on Broadcast. Several competitions or
      statuses can be picked at once, each with its count; nothing picked
      means all. Fixtures / Results and Awaiting a date / Move a fixture
      are tabs, as they switch what the page shows.
    v2.7 (28/10/2026) — Rearrangements: Move a fixture, beside Awaiting a
      date, finds a new date for a game that still has one, chosen by home
      club then away club; its 35 days count from its current date and
      confirming records the old date as moved. Pencils are a shortlist of
      up to three dates, each confirmed or removed on its own. A date can
      be ruled out with a reason, for this game only, or for a club that
      cannot host or cannot travel that day, which then holds for every
      game this season and shows hatched on the calendar. The Fixtures tab
      marks pencilled games and has a Pencilled card; Crowd is
      Attendance, the away figure in brackets; counts carry their thousands
      comma; Upcoming/All is Fixtures/Results, and a past season shows
      results only.
    v2.6 (28/10/2026) — A cup flag ("BRW in FAT R4?") lists where the club
      is in that cup: the tie still to be decided with its date and kick-off,
      the round won and the next round's date, or the round it enters at.
    v2.5 (28/10/2026) — Rearrangements fill the window: the page never
      scrolls, and the games list, calendar and best dates each scroll on
      their own. Days are tiles with a gap between them and a date strip
      on top, so the number never sits on a game. Each club's half has a
      stripe, solid navy for the home club and pale for the away club,
      keyed in the month bar. The month line is thin and inside the date
      strip, so it covers no words. The blur shrinks on a short window.
      The games awaiting a date are a dropdown above the banner, giving the
      calendar the full width, and each club's half is exactly half the
      day: a long name is clamped to two lines, never pushing the other out.
    v2.4 (28/10/2026) — Rearrangements, fifth pass. The banner drops the
      "v". The calendar names the months its sharp weeks cover. Hovering a
      free day shows a branded card of its flags, not the browser tooltip.
      Flags are grouped under headings (Consecutive games, Match proximity,
      Cup rounds, International window, Broadcast, Pencilled, Day), a
      within-48h flag naming the nearby game and kick-off. The pencil
      dialog shows the date on its own line and the date's flags, with its
      buttons on one line. Every lost date is listed, not just the latest.
      More days closes on a click elsewhere. Kick-off is a 24-hour text
      box ('1945' becomes 19:45), not the browser's time control, which
      shows 12-hour on a machine set to US English.
    v2.3 (28/10/2026) — Rearrangements, fourth pass. Three columns (games
      waiting, calendar, best dates) at a fixed size, checked at 1920×1080
      and 1280×600 (CLAUDE.md, Two screens). The match as a big header:
      date and kick-off left, competition and broadcast right. Five sharp
      weeks with half a week blurred either side, snapping a week at a time.
      Each club's half is a strip with the opponent's name, H or A,
      competition and miles beside its crest. Ops team's rules: within 48h,
      two away trips in a row each over 200 miles round trip, international
      windows (a globe on the day). Mondays, Thursdays, Fridays and Sundays
      are folded away under More days. The match is a navy banner. A run flag
      lists its games and dates.
    v2.2 (28/10/2026) — Rearrangements, third pass. One calendar for both
      clubs: every day split, home club's game on top, away club's below,
      each with the opponent's crest large on the right and a band with the
      name, H or A, the competition and the miles travelled. It is a
      continuous run of weeks, opening on the original date, the middle
      weeks sharp and the rest fading, with a heavy line and "1 Nov" where
      a month starts. A free day is itself the button. Wednesday is a slot
      as well as Tuesday; Mondays and Thursdays are switches.
    v2.1 (28/10/2026) — Rearrangements, second pass (Richard's review). The
      to-do list is a table in the Fixtures tab's columns. Each calendar day
      is the same size and shows the opponent's crest and full name, H or A
      and the competition. Days outside the 35-day window fade, and the
      window now runs both ways, so a game can be brought forward. Canon
      dates (Sat 24 Oct 2026), NL.monthPicker, slots in a panel beside
      the calendars, and shorter flags with club codes.
    v2.0 (28/10/2026) — Rearrangements tab. Every game awaiting a date,
      oldest original date first, with a badge when a club has more than one
      waiting. For the chosen game, the date finder (fixtures/_finder.js)
      lists every free Saturday and Tuesday (Thursdays on a switch) up to
      the midweek before the final matchday, the 35 days after the original
      date first and cleanest first within them, each with its flags; both
      clubs' months below, home on top. A slot is pencilled or confirmed,
      with a confirm step for a UK-shown game going into the blocked hours.
    v1.9 (28/10/2026) — Tabs: Fixtures, Broadcast, Settings. Broadcast lists
      every league and NL Cup game with its availability, Enhanced, moved by
      DAZN (count against the 120) and AMI (worldwide games only), changed in
      place; a broadcast game given a new date waits on a review list.
      Settings holds Results, Add cup tie and the imports. The season is a
      dropdown above the tabs and no longer repeated in a heading. Clearing
      the club filter (× or an emptied box) now clears it.
    v1.8 (28/10/2026) — Import works out a sheet's season from its own dates
      (1 July to 30 June) and imports into that season whatever is on screen,
      leaving out and counting rows dated outside it — on 28/10/2026 last
      season's sheet replaced this season's. A game's dialog takes its crowd
      (total and away), saved as the Attendance submission for that match ID.
      The import's list of crowds that differ from the sheet can be copied.
    v1.6 (28/10/2026) — Play-offs sit in their division (National, North,
      South) marked PO before the round, not in a competition of their own;
      a play-off tie is added as "North play-off" and so on. Attendance
      reads them as their division's games, as NLS files them.
    v1.5 (28/10/2026) — Import workbook on a past season: the sheet is
      keyed to the Attendance archive (fixtures/_core.js keyToAttendance),
      so every game keeps the ID its crowd is filed under — Opta IDs for
      league, NL Cup and play-offs, Attendance's own for FA ties. The check
      lists anything unmatched and any crowd more than 10% from the sheet's.
      NLS results now agree with an extra-time score held as full time + aet.
    v1.4 (28/10/2026) — A grey shield stands in for a club with no crest.
    v1.3 (28/10/2026) — Seasons: a switcher, and a past season brought in
      from the Attendance tool's archive (its match IDs stay the keys, so
      club-submitted crowds stay joined). Each game shows its crowd, read
      from Attendance — never copied — and a No crowd card lists played home
      games of League clubs with none. Neutral venue (and its name) is set
      in a game's dialog; Attendance reads it from here.
    v1.2 (28/10/2026) — A fixture can be postponed or abandoned from its
      dialog (reason, and the minute for an abandonment), and a mistaken
      lost date removed. Results: imported from the workbook, edited in the
      dialog (90 minutes, extra time, penalties), and filled a day at a time
      from NLS or by pasting rows. The list reads from a centre line — home
      name and crest right-aligned, score in the middle, away crest and name
      left — in fixed columns, so every table lines up; each day runs
      National, North, South, then the cups. Broadcast labels are coloured.
      Crests come from assets/crests/manifest.json as well as the club
      files, so EFL and other outside clubs with a crest show one.
    v1.1 (28/10/2026) — Crests only for clubs we hold one for, by crestName.
      Outside FA Cup/Trophy clubs drew a crest <img> that 404'd twice per row
      per render, uncached: a request storm that hit Pages rate limits. PL2
      guests were missing too (they wear their parent club's crest). The
      list also draws 200 rows at a time.
    v1.0 (28/10/2026) — First build: the Fixtures tab. Imports the working
      workbook once (Fixtures + Rearrangements tabs, pasted), lists every
      game with filters for competition, club and what needs attention,
      adds and edits cup ties (NL Cup knockouts, play-offs, FA Cup, FA
      Trophy), takes Opta IDs and FA results. Rearrangements, Broadcast and
      AMI arrive as their own tabs in later PRs.

  Storage (RTDB):
    app-data/ops-fixture-management/seasons/<season>/fixtures/<key>
        the full record — staff only (fixtures/_core.js has the shape)
    app-data/ops-fixture-management/seasons/<season>/public/<key>
        the projection every signed-in user may read: current date and
        kick-off, teams, Worldwide/Overseas only, nothing awaiting a date
    app-data/ops-fixture-management/seasons/<season>/meta
        { importedAt, importedBy, counts }
    Both fixture nodes are written in one update, so they cannot disagree.

  Access (auth-guard registry — see system/auth-guard.js):
    toolLevel admin → edit and import. access → read only. Club roles are
    off until the public page ships.
-->

  .fm-team img, .fm-crest-none { width: 22px; height: 22px; object-fit: contain; flex: 0 0 22px; }
  .fm-crest-none path { fill: var(--navy-200); }
  .fm-mid { text-align: center; font-variant-numeric: tabular-nums; font-weight: 800; font-variation-settings: 'wght' 800; }
  .fm-mid--v { color: var(--text-muted); font-weight: 400; font-variation-settings: 'wght' 400; }
  .fm-ko { font-variant-numeric: tabular-nums; }
  .fm-flags { display: flex; gap: 4px; flex-wrap: wrap; }

  /* Broadcast status, mapped onto the system hues: shown worldwide and
     overseas read as "on"; TBC as a decision pending; the rest quiet. */
  .fm-bc--worldwide    { background: var(--green-light);  color: var(--green); }
  .fm-bc--overseas     { background: var(--blue-light);   color: var(--blue); }
  .fm-bc--tbc          { background: var(--amber-light);  color: var(--amber-deep); }
  .fm-bc--unavailable  { background: var(--off-white);    color: var(--text-muted); }
  .fm-bc--not-selected { background: var(--white);        color: var(--text-muted); box-shadow: inset 0 0 0 1px var(--border); }
  .fm-bc--cup          { background: var(--purple-light); color: var(--purple); }

  .fm-score { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; }
  .fm-score input { text-align: center; }
  .fm-score .fm-dash { color: var(--text-muted); }
  .fm-history li { display: flex; gap: 10px; align-items: baseline; }
  .fm-section { margin: 18px 0 6px; }

  .fm-paste { width: 100%; min-height: 120px; font-family: var(--font-mono); font-size: var(--text-xs); }
  .fm-history { margin: 0; padding-left: 18px; font-size: var(--text-sm); }
  .fm-gap { margin-top: 28px; }
  .fm-history li { margin-bottom: 4px; }
  .fm-top { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
  /* The season and tabs stay on screen under the topbar (v3.1), so you can
     switch between Fixtures and Broadcast from anywhere in a long list and
     land on the same games. --fm-stick is the topbar's height, set on boot. */
  .fm-top { position: sticky; top: var(--fm-stick, 0px); z-index: 20; background: var(--off-white);
    padding: 8px 0; margin-top: -8px; }
  .fm-season { width: auto; min-width: 130px; }
  .fm-tabs { flex: 1; margin-bottom: 0; min-width: 0; max-width: 100%; overflow-x: auto; }
  .fm-settings { display: grid; gap: 12px; max-width: 640px; }
  .fm-setting { display: flex; gap: 14px; align-items: center; }
  .fm-setting__btn { min-width: 210px; }
  .fm-setting span { color: var(--text-muted); font-size: var(--text-sm); }
  /* Above the list: game count, and on Broadcast the DAZN tally. */
  .fm-tally { font-size: var(--text-sm); color: var(--text-muted); margin: 0 0 12px; }
  .fm-tally strong { color: var(--text); }
  /* Broadcast view columns and its game panel (v3.1). */
  .fm-list--bc { min-width: 900px; }
  /* Broadcast is mostly upcoming games, so the middle is a "v": narrower. */
  .fm-list--bc col.c-mid { width: 64px; }
  .fm-list col.c-bcav { width: 180px; }
  .fm-list col.c-enh { width: 124px; }
  .fm-list col.c-dazn { width: 84px; }
  .fm-list col.c-ami { width: 72px; }
  .fm-row--off { cursor: default; }
  .fm-review { display: inline-flex; color: var(--amber); align-self: center; }
  .fm-review .icon { width: 18px; height: 18px; }
  .fm-row--off td { color: var(--text-muted); }
  .fm-bcmeta { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; font-size: var(--text-sm); color: var(--text-muted); }
  .fm-bcxs { display: flex; gap: 8px 20px; flex-wrap: wrap; margin-top: 4px; }
  .fm-bcx { display: inline-flex; gap: 8px; align-items: center; font-size: var(--text-sm); }

  /* Rearrangements: the to-do list as a table like the Fixtures tab's, then
     the chosen game, its two calendars and its slots side by side. */
  .fm-rr__meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: var(--text-sm); color: var(--text-muted); margin: 0 0 12px; }
  /* Three columns on a wide screen, the whole tab inside the window and
     the page itself never scrolling: the games waiting, the calendar and
     the best dates each scroll on their own, under the pointer. The layout
     is the same on every screen; only the columns' height follows the
     window (fitRearrange; CLAUDE.md, Two screens). */
  .fm-rr-app { display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 10px; height: var(--app-h, auto); }
  /* The games awaiting a date: a dropdown, so the calendar has the width. */
  .fm-rr-pick { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; min-width: 0; }
  .fm-rr-modes { margin: 0; }
  .fm-when { margin: 0; }
  .fm-rr-pick .fm-picker { min-width: 220px; }
  .fm-rr-v { color: var(--text-muted); }
  .fm-pen { display: inline-flex; gap: 4px; align-items: center; font-size: var(--text-sm); color: var(--text-muted); }
  .fm-pen__full { font-size: var(--text-xs); color: var(--text-muted); }
  .fm-match__ruled { margin-top: 4px; }
  .fm-ro { display: grid; gap: 6px; }
  .fm-ro label { display: flex; gap: 8px; align-items: center; font-weight: 400; text-transform: none; letter-spacing: 0; font-size: var(--text-sm); color: var(--text); }
  /* A date ruled out: hatched, with the reason. */
  .fm-half.is-blocked, .fm-ruled { display: flex; flex-direction: column; justify-content: center; gap: 1px; padding: 2px 8px;
    background: repeating-linear-gradient(135deg, var(--off-white) 0 6px, var(--navy-50) 6px 12px); color: var(--text-muted); font-weight: 700; }
  .fm-ruled { position: absolute; inset: 0; align-items: center; text-align: center; }
  .fm-half__why, .fm-ruled span { font-weight: 400; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .fm-rr-pick select { flex: 0 1 auto; width: auto; min-width: 0; max-width: 100%; }
  .fm-rr-pick span { font-size: var(--text-sm); color: var(--text-muted); white-space: nowrap; }
  .fm-rr-game { display: grid; grid-template-columns: minmax(0, 1fr) clamp(230px, 17vw, 300px); grid-template-rows: auto minmax(0, 1fr);
    grid-template-areas: "match match" "cal dates"; gap: 10px 16px; min-width: 0; min-height: 0; }
  .fm-match { grid-area: match; }
  .fm-rr-cal { grid-area: cal; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
  .fm-rr-cal > .fm-cal { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .fm-rr-cal .fm-cal__view { flex: 1; min-height: 0; }
  .fm-rr-cal .fm-cal__scroll { height: 100%; }
  .fm-rr-dates { grid-area: dates; min-width: 0; min-height: 0; display: grid; align-content: start; gap: 8px; overflow: auto; overscroll-behavior: contain; }
  @media (max-width: 1099px) {
    .fm-rr-app { height: auto; }
    .fm-rr-game { grid-template-columns: minmax(0, 1fr); }
    .fm-rr-game { grid-template-areas: "match" "cal" "dates"; grid-template-rows: auto; }
    .fm-rr-cal .fm-cal__scroll { height: calc(var(--wk) * 6); }
    .fm-rr-dates { max-height: 60vh; }
  }

  /* The best dates, cleanest first: each row opens the same dialog as a
     free day on the calendar. */
  .fm-slots { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); }
  .fm-slots__head { padding: 8px 12px; background: var(--navy-50); border-bottom: 1px solid var(--navy-100);
    font-size: var(--text-xs); text-transform: uppercase; letter-spacing: var(--tracking-wide); color: var(--navy); font-weight: 800; font-variation-settings: 'wght' 800; }
  .fm-slot { display: grid; gap: 6px; width: 100%; padding: 9px 12px; border: 0; border-top: 1px solid var(--navy-50);
    background: none; font: inherit; color: inherit; text-align: left; cursor: pointer; }
  .fm-slots__head + .fm-slot { border-top: none; }
  .fm-slot:hover { background: var(--navy-50); }
  .fm-slot.is-on { background: var(--navy-50); box-shadow: inset 3px 0 0 var(--navy); }
  .fm-slot:focus-visible { outline: none; box-shadow: var(--focus-ring); }
  .fm-slot__date { font-weight: 800; font-variation-settings: 'wght' 800; color: var(--navy); font-variant-numeric: tabular-nums; }
  .fm-flag { white-space: normal; text-align: left; }
  .fm-slot-div { padding: 8px 12px; background: var(--off-white); font-size: var(--text-xs); color: var(--text-muted);
    text-transform: uppercase; letter-spacing: var(--tracking-wide); border-top: 1px solid var(--navy-100); }

  /* One month calendar for both clubs. Each day is split: the home club's
     game in the top half, the away club's in the bottom, so a free day is
     one where both halves are empty. Every day the same size.
     Canon candidate (28/10/2026): the plan wants a canon month calendar. */
  .fm-cal { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .fm-cal__head { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
  .fm-cal__head { border-bottom: 1px solid var(--navy-100); background: var(--navy-50); }
  /* Five sharp weeks, and half a week either side under a blur that
     thickens towards the edge. */
  .fm-rr-app { --wk: 124px; }
  .fm-cal__view { position: relative; }
  .fm-cal__scroll { position: relative; height: calc(var(--wk) * 6); overflow-y: auto; overscroll-behavior: contain;
    scroll-snap-type: y mandatory; scroll-padding-top: calc(var(--wk) / 2); }
  /* Days as separate tiles: a gap between them shows the grid behind. */
  .fm-cal__week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; padding-bottom: 3px; height: var(--wk);
    scroll-snap-align: start; background: var(--navy-100); }
  /* Half a week, or less on a short window so the blur never eats the
     sharp weeks. */
  .fm-cal__edge { position: absolute; left: 0; right: 0; height: min(calc(var(--wk) / 2), 12%); pointer-events: none; z-index: 2;
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
  .fm-cal__edge--top { top: 0; -webkit-mask-image: linear-gradient(to bottom, #000 10%, transparent); mask-image: linear-gradient(to bottom, #000 10%, transparent);
    background: linear-gradient(to bottom, var(--white) 0%, transparent 100%); }
  .fm-cal__edge--bot { bottom: 0; -webkit-mask-image: linear-gradient(to top, #000 10%, transparent); mask-image: linear-gradient(to top, #000 10%, transparent);
    background: linear-gradient(to top, var(--white) 0%, transparent 100%); }
  .fm-globe { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 1.4; vertical-align: -2px; margin-right: 3px; }
  .fm-cal__intl { color: var(--blue); display: inline-flex; }
  .fm-cal__intl .fm-globe { margin: 0; width: 13px; height: 13px; }

  /* The match being rearranged, as a banner: clubs and crests in navy,
     competition and broadcast right; a strip under it with the date,
     what happened and the journey, and Options. */
  .fm-match { border-radius: var(--radius); overflow: visible; }
  .fm-match__bar { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 10px 16px;
    background: var(--navy); color: var(--white); border-radius: var(--radius) var(--radius) 0 0; }
  .fm-match__title { display: flex; align-items: center; gap: 14px 28px; flex-wrap: wrap; min-width: 0; margin: 0;
    font-size: clamp(var(--text-md), 1.8vw, var(--text-xl)); line-height: 1.1; color: var(--white);
    text-transform: uppercase; letter-spacing: .03em; font-weight: 800; font-variation-settings: 'wght' 800; }
  .fm-match__club { display: inline-flex; align-items: center; gap: 10px; min-width: 0; }
  /* A white tile behind each crest: a dark crest vanishes on navy. */
  .fm-match__club img, .fm-match__club .fm-crest-none { width: 44px; height: 44px; object-fit: contain; flex: 0 0 44px;
    padding: 4px; background: var(--white); border-radius: var(--radius-sm); }
  .fm-match__club .fm-crest-none path { fill: var(--navy-300); }
  .fm-match__tags { display: flex; gap: 8px; align-items: center; flex: 0 0 auto; }
  .fm-match__sub { position: relative; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 6px 16px;
    background: var(--navy-100); border-radius: 0 0 var(--radius) var(--radius); }
  .fm-match__when { display: flex; gap: 2px 18px; flex-wrap: wrap; align-items: baseline; margin: 0; font-size: var(--text-sm); color: var(--navy); }
  .fm-match__when strong { font-size: var(--text-base); font-weight: 800; font-variation-settings: 'wght' 800; }
  .fm-match__pencil { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; margin: 8px 0 0; font-size: var(--text-sm); }
  .fm-match__pencil > strong { color: var(--navy); }
  .fm-more { font-size: var(--text-sm); }
  .fm-more > summary { padding: 2px 6px; }
  .fm-more__body { position: absolute; right: 0; top: 100%; z-index: 5; width: 280px; display: flex; gap: 8px 14px; flex-wrap: wrap; align-items: center;
    padding: 10px 12px; background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-lg); }
  .fm-more__label { width: 100%; font-size: var(--text-xs); color: var(--text-muted); text-transform: uppercase; letter-spacing: var(--tracking-wide); }
  .fm-more__body label { display: flex; gap: 6px; align-items: center; }
  .fm-more__body input[type=number] { width: 72px; }
  .fm-flag-group { display: grid; gap: 3px; width: 100%; }
  /* Flags grouped under their category. */
  .fm-slot__flags { display: grid; gap: 8px; }
  .fm-fg { display: grid; gap: 4px; justify-items: start; }
  .fm-fg__title { display: inline-flex; align-items: center; gap: 4px; font-size: var(--text-xs); text-transform: uppercase;
    letter-spacing: var(--tracking-wide); color: var(--navy); font-weight: 800; font-variation-settings: 'wght' 800; }
  .fm-cal__month { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 6px 12px;
    background: var(--navy-50); border-bottom: 1px solid var(--navy-100); color: var(--navy); }
  .fm-cal__month strong { font-size: var(--text-md); font-weight: 800; font-variation-settings: 'wght' 800; text-transform: uppercase; letter-spacing: .04em; }
  .fm-cal__whose { display: flex; gap: 14px; align-items: center; font-size: var(--text-xs); font-weight: 700; }
  .fm-cal__whose span { display: inline-flex; gap: 6px; align-items: center; }
  .fm-cal__whose i { width: 4px; height: 16px; background: var(--navy); }
  .fm-cal__whose i.k-away { background: var(--primary); }
  /* Point at a club in the legend and the other club's games step back. */
  .fm-cal__whose span { cursor: default; padding: 2px 6px; border-radius: var(--radius-sm); }
  .fm-cal__whose [data-who="top"]:hover { background: var(--navy-100); }
  .fm-cal__whose [data-who="bot"]:hover { background: var(--primary-100); }
  .fm-cal:has(.fm-cal__whose [data-who="top"]:hover) .fm-half--bot.has-game,
  .fm-cal:has(.fm-cal__whose [data-who="bot"]:hover) .fm-half--top.has-game { opacity: .25; }
  .fm-cal__whose img, .fm-cal__whose .fm-crest-none { width: 18px; height: 18px; object-fit: contain; }
  .fm-tip { position: fixed; z-index: 150; width: 300px; max-height: 70vh; overflow: auto; display: grid; gap: 8px; padding: 10px 12px;
    background: var(--white); border: 1px solid var(--navy-100); border-left: 3px solid var(--navy); border-radius: var(--radius);
    box-shadow: var(--shadow-lg); pointer-events: none; font-size: var(--text-sm); }
  .fm-tip__date { font-weight: 800; font-variation-settings: 'wght' 800; color: var(--navy); }
  .fm-ko-in { width: 110px; font-variant-numeric: tabular-nums; }
  .fm-choose__date { margin: 0 0 10px; font-size: var(--text-lg); font-weight: 800; font-variation-settings: 'wght' 800; color: var(--navy); }
  .fm-choose__flags { display: grid; gap: 8px; margin: 0 0 14px; padding: 10px 12px; background: var(--off-white); border-radius: var(--radius); }
  .fm-flag-items { display: grid; gap: 1px; padding-left: 12px; border-left: 2px solid var(--border); font-size: var(--text-xs); color: var(--text-muted); }
  .fm-flag-items b { color: var(--text); font-weight: 700; font-variation-settings: 'wght' 700; margin-right: 4px; }
  /* Month boundary: a thin line along the top of the month's first seven
     date strips and down the side of the 1st, inside the strip so it
     never covers a word. Alternate months' strips are shaded. */
  .fm-cal__day.is-alt .fm-cal__date { background: var(--navy-50); }
  .fm-cal__day.is-mtop .fm-cal__date { box-shadow: inset 0 2px 0 var(--navy-400); }
  .fm-cal__day.is-mfirst .fm-cal__date { box-shadow: inset 0 2px 0 var(--navy-400), inset 2px 0 0 var(--navy-400); }
  .fm-cal__mon { color: var(--primary); text-transform: uppercase; letter-spacing: .03em; }
  .fm-cal__dow { padding: 6px 0; text-align: center; font-size: var(--text-xs); text-transform: uppercase;
    letter-spacing: var(--tracking-wide); color: var(--text-muted); }
  .fm-cal__day { position: relative; display: grid; grid-template-rows: 20px minmax(0, 1fr); min-width: 0; overflow: hidden;
    background: var(--white); font-size: var(--text-xs); }
  /* The date strip: the day's number, globe and cup round, above the games. */
  .fm-cal__date { display: flex; align-items: center; padding: 0 6px; border-bottom: 1px solid var(--navy-100); background: var(--white); }
  /* Exactly half each, whatever is in them: a long name is clamped, not
     allowed to push the other club's half out. */
  .fm-cal__body { position: relative; display: grid; grid-template-rows: repeat(2, minmax(0, 1fr)); min-height: 0; }
  .fm-cal__n { display: flex; gap: 5px; align-items: baseline; min-width: 0; white-space: nowrap; overflow: hidden;
    font-size: var(--text-sm); font-weight: 800; font-variation-settings: 'wght' 800; color: var(--navy); font-variant-numeric: tabular-nums; }
  .fm-cal__cup { font-size: 10px; color: var(--purple); letter-spacing: .02em; }
  /* A club's half with a game in it is a tinted strip: name, H/A,
     competition and miles beside the opponent's crest, side by side so
     neither covers the other. Mirrored, as the Fixtures table is: the home
     club's half has its crest on the right, the away club's on the left.
     Both tints are navy; red on this page only ever means a warning. The
     top half leaves room for the day number. */
  /* Each half carries its club's stripe on the left, always: solid navy
     for the home club, pale for the away club (the key is in the month
     bar), on a half with a game in it. */
  .fm-half { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
  /* The two clubs (v3.3, Richard): the home club's games (top) in the
     brand navy, the away club's (bottom) in the brand red, a soft ground
     with an edge in the full colour; the legend above the calendar uses
     the same two. Canon candidate (30/10/2026): home/away colours, if a
     second tool wants them. */
  .fm-half--top.has-game { box-shadow: inset 4px 0 0 var(--navy); }
  .fm-half--bot.has-game { box-shadow: inset 4px 0 0 var(--primary); }
  .fm-half + .fm-half { border-top: 1px dashed var(--navy-100); }
  .fm-half.has-game { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 4px; padding: 2px 4px 2px 9px; }
  .fm-half--top.has-game { background: var(--navy-100); }
  .fm-half--bot.has-game { background: var(--primary-100); grid-template-columns: auto minmax(0, 1fr); padding: 2px 6px 2px 8px; }
  .fm-half--bot .fm-half__crest { grid-column: 1; }
  .fm-half--bot .fm-half__band { grid-column: 2; justify-items: end; text-align: right; }
  .fm-half--bot .fm-half__meta { justify-content: flex-end; }
  .fm-half__crest { grid-column: 2; grid-row: 1; align-self: center; }
  .fm-half__crest img, .fm-half__crest .fm-crest-none { width: clamp(24px, 1.8vw, 34px); height: clamp(24px, 1.8vw, 34px); object-fit: contain; display: block; }
  .fm-half--top .fm-half__crest img, .fm-half--top .fm-half__crest .fm-crest-none { width: clamp(22px, 1.6vw, 30px); height: clamp(22px, 1.6vw, 30px); }
  .fm-half__band { grid-column: 1; grid-row: 1; display: grid; gap: 2px; min-width: 0; }
  /* Never cut a name off: the short form, wrapping onto a second line if it must. */
  .fm-half__opp { font-size: clamp(10.5px, .8vw, 13px); font-weight: 800; font-variation-settings: 'wght' 800; color: var(--navy); line-height: 1.1;
    overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .fm-half__meta { display: flex; gap: 2px 4px; align-items: center; white-space: nowrap; overflow: hidden; }
  .fm-half__mi { font-weight: 700; color: var(--navy); font-variant-numeric: tabular-nums; }
  .fm-half.is-pencil { opacity: .6; }
  .fm-half.has-game.is-pencil { background: var(--amber-light); }
  .fm-cal__comp { font-size: 10px; font-weight: 800; font-variation-settings: 'wght' 800; letter-spacing: .04em; white-space: nowrap;
    padding: 1px 5px; border-radius: var(--radius-pill); background: var(--comp-pill-bg, var(--off-white));
    color: var(--comp-pill-ink, var(--text-muted)); box-shadow: inset 0 0 0 1px var(--comp-pill-edge, var(--border)); }
  .fm-ha { display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; border-radius: var(--radius-sm);
    font-size: 11px; font-weight: 800; font-variation-settings: 'wght' 800; }
  /* H and A on a game: solid navy and solid red, white letters. */
  .fm-ha--h { background: var(--navy); color: var(--white); }
  .fm-ha--a { background: var(--primary); color: var(--white); }

  /* A free day: the whole cell is the button. Green when clean, amber with
     flags (more than 35 days from the original date is one), red with a
     red flag. */
  .fm-free { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    border: 0; padding: 0; font: inherit; cursor: pointer; background: var(--green-light); color: var(--green);
    box-shadow: inset 0 0 0 2px var(--green); }
  .fm-free strong { font-size: var(--text-sm); text-transform: uppercase; letter-spacing: var(--tracking-wide); font-weight: 800; font-variation-settings: 'wght' 800; }
  .fm-free--amber { background: var(--amber-light); color: var(--amber-deep); box-shadow: inset 0 0 0 2px var(--amber); }
  .fm-free--red { background: var(--red-light); color: var(--red); box-shadow: inset 0 0 0 2px var(--red); }
  .fm-free:hover, .fm-free:focus-visible { outline: none; box-shadow: inset 0 0 0 3px var(--navy); }
  .fm-cal__day.is-on .fm-free { box-shadow: inset 0 0 0 3px var(--navy); }
  .fm-cal__day.is-past { background: var(--off-white); }
  .fm-cal__day.is-past > * { opacity: .35; }
  .fm-cal__day.is-orig::after { content: ''; position: absolute; inset: 0; box-shadow: inset 0 0 0 3px var(--primary); pointer-events: none; }
  .fm-cal__day.is-today .fm-cal__n { color: var(--primary); }
  .fm-cal__key { display: flex; gap: 14px; flex-wrap: wrap; font-size: var(--text-xs); color: var(--text-muted); padding: 8px 12px; border-top: 1px solid var(--navy-100); }
  .fm-cal__key span::before { content: ''; display: inline-block; width: 12px; height: 12px; margin-right: 5px; vertical-align: -2px; border-radius: 2px; }
  .fm-cal__key .k-free::before { background: var(--green-light); box-shadow: inset 0 0 0 2px var(--green); }
  .fm-cal__key .k-flag::before { background: var(--amber-light); box-shadow: inset 0 0 0 2px var(--amber); }
  .fm-cal__key .k-pencil::before { background: var(--amber-light); }
  .fm-cal__key .k-orig::before { box-shadow: inset 0 0 0 2px var(--primary); }
  .fm-cal__key .k-ruled::before { background: repeating-linear-gradient(135deg, var(--off-white) 0 3px, var(--navy-100) 3px 6px); }
  .fm-problems { max-height: 260px; overflow: auto; margin: 8px 0 0; padding-left: 18px; font-size: var(--text-sm); }
</style>
</head>
<body>

<!-- Topbar — auto-rendered by /system/nl-topbar.js from window.NL_TOOL -->
<div id="nlTopbar"></div>

<div id="pageWrap">
  <div class="page">

    <div class="fm-top">
      <select class="nl-select fm-season" id="fmSeasonSel" aria-label="Season"></select>
      <div class="tabs fm-tabs" id="fmTabs" role="tablist">
        <button class="tab active" type="button" role="tab" data-tab="fixtures">Fixtures</button>
        <button class="tab" type="button" role="tab" data-tab="rearrange">Rearrangements <span class="tab__count" id="fmRrCount" hidden></span></button>
        <button class="tab" type="button" role="tab" data-tab="broadcast">Broadcast</button>
        <button class="tab" type="button" role="tab" data-tab="settings" id="fmSettingsTab" hidden>Settings</button>
      </div>
    </div>

    <!-- One list, two views: the Fixtures and Broadcast tabs both show this
         panel, with the same filters and the same place on the page. -->
    <section data-panel="fixtures">
      <div class="filter-bar">
        <div class="tabs fm-when" id="fmWhen" role="tablist" aria-label="Dates">
          <button class="tab active" type="button" role="tab" aria-selected="true" data-when="fixtures">Fixtures</button>
          <button class="tab" type="button" role="tab" aria-selected="false" data-when="results">Results</button>
        </div>
        <div id="fmComps"></div>
        <div class="fm-picker" id="fmClub"></div>
        <div id="fmNeed"></div>
        <div id="fmStatus" hidden></div>
      </div>
      <p class="fm-tally" id="fmTally"></p>
      <div id="fmBody"></div>
    </section>

    <section data-panel="rearrange" hidden>
      <div id="fmRrBody"></div>
    </section>

    <section data-panel="settings" hidden>
      <div class="fm-settings">
        <div class="fm-setting">
          <button class="btn btn--navy btn--sm fm-setting__btn" type="button" id="fmResults">Results</button>
          <span>Fill a day’s results from NLS, or paste rows.</span>
        </div>
        <div class="fm-setting" id="fmAddRow">
          <button class="btn btn--primary btn--sm fm-setting__btn" type="button" id="fmAdd">Add cup tie</button>
          <span>NL Cup knockouts, play-offs, FA Cup and FA Trophy.</span>
        </div>
        <div class="fm-setting">
          <button class="btn btn--ghost btn--sm fm-setting__btn" type="button" id="fmImport">Import workbook</button>
          <span>Replaces every fixture in the sheet’s season.</span>
        </div>
        <div class="fm-setting" id="fmFromAttRow" hidden>
          <button class="btn btn--ghost btn--sm fm-setting__btn" type="button" id="fmFromAtt">Bring in from Attendance</button>
          <span>A past season from Attendance’s own record, when there is no sheet.</span>
        </div>
      </div>
    </section>

  </div>
</div>

<!-- Main app -->
<script>
(function () {
  'use strict';

  var F = window.FixturesCore;
  var esc = NL.escHtml;
  var BASE = 'app-data/ops-fixture-management/seasons/';
  var SEED_URL = '/assets/data/fixtures-2026-27.json';
  var REASONS_URL = '/assets/data/postponement-reasons.json';
  var CRESTS_URL = '/assets/crests/manifest.json';
  /* Rows drawn at once. A season is ~1,900 games; drawing them all is
     ~3,800 crest images and a slow page for a list read from the top. */
  var PAGE = 200;

  var S = {
    session: null,
    canEdit: false,
    meta: null,
    guests: [],
    crests: {},          /* name → true, from the crest manifest */
    reasons: [],
    season: null,
    fixtures: {},
    comp: [],            /* competition keys; empty = every competition */
    compBtn: null,       /* the Competition filter button */
    club: null,
    when: 'fixtures',    /* 'fixtures' (today on) | 'results' (played); a past season is results only */
    need: null,          /* 'awaiting' | 'noOpta' | 'cupDue' | 'pencilled' | 'noCrowd' — the Needs a look filter */
    needBtn: null,
    status: [],          /* Broadcast view: availability keys and/or 'review'; empty = all */
    statusBtn: null,
    picker: null,
    limit: PAGE,
    tab: 'fixtures',
    rr: { mode: 'waiting', moveHome: null, moveAway: null, moveKey: null, key: null, mondays: false, thursdays: false, fridays: false, sundays: false, moreOpen: false, anchor: null, scroll: null, drawn: null, slot: null, data: {} },
    current: null,       /* the current season key */
    listen: null,        /* the live fixtures ref for the viewed season */
    crowds: {},          /* matchID → { total, away } from Attendance */
    unavail: {},         /* id → { club, side, date, reason, at }: dates a club cannot host or travel */
    unavRef: null
  };

  function today() { return F.ymdOf(new Date()); }
  /* A count with its thousands comma: 1,890. Canon candidate (28/10/2026):
     every tool that shows a count wants the same. */
  function num(n) { return Number(n || 0).toLocaleString('en-GB'); }
  function ref(path) { return db.ref(BASE + S.season + (path ? '/' + path : '')); }
  function now() { return new Date().toISOString(); }

  /* Firebase rejects undefined anywhere in a write; a JSON round trip drops it. */
  function clean(o) { return JSON.parse(JSON.stringify(o)); }

  function clubOf(name) {
    if (!name) return null;
    var c = NL.clubs.byName(name) || NL.clubs.guestByName(name);
    return c ? { name: c.name, code: c.code || null } : null;
  }

  function getJson(url) {
    return fetch(url, { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; });
  }

  /* ── Boot ─────────────────────────────────────────────────────────── */
  window.TOOL = window.TOOL || {};
  window.TOOL.boot = function (session) {
    S.session = session;
    var bar = document.getElementById('nlTopbar');
    var stick = function () { document.documentElement.style.setProperty('--fm-stick', (bar ? bar.offsetHeight : 0) + 'px'); };
    stick();
    window.addEventListener('resize', stick);
    S.canEdit = session.toolLevel === 'admin';
    document.getElementById('fmSettingsTab').hidden = !S.canEdit;
    renderComps();
    wireStatic();

    NL.ensureAuth()
      .then(function () {
        return Promise.all([
          NL.clubs.load(),
          NL.clubs.guests().catch(function () { return []; }),
          getJson(CRESTS_URL),
          getJson(REASONS_URL)
        ]);
      })
      .then(function (r) {
        S.meta = r[0];
        S.guests = r[1] || [];
        ((r[2] && r[2].names) || []).forEach(function (n) { S.crests[n] = true; });
        S.reasons = ((r[3] && r[3].reasons) || []).map(function (x) { return x.label; });
        S.current = NL.season.current(S.meta) || String(NL.season.fromDate());
        S.picker = NL.clubPicker('#fmClub', {
          mode: 'search', season: 'all', clearable: true, extraClubs: S.guests,
          placeholder: 'Any club',
          onSelect: function (sel) { S.club = sel ? sel.name : null; S.limit = PAGE; render(); }
        });
        renderSeasons();
        openSeason(S.current);
      })
      .catch(function (err) {
        document.getElementById('fmBody').innerHTML =
          '<div class="banner banner--error">Could not load club data: ' + esc(err.message) + '</div>';
      });
  };

  /* ── Seasons ──────────────────────────────────────────────────────────
     A closed set: the seasons clubs-meta knows. The workbook import is for
     the current one; a past one comes in from Attendance. */
  function renderSeasons() {
    document.getElementById('fmSeasonSel').innerHTML = NL.season.keys(S.meta).map(function (k) {
      return '<option value="' + esc(k) + '"' + (k === S.current ? ' selected' : '') + '>' + esc(NL.season.label(S.meta, k)) + '</option>';
    }).join('');
  }

  function openSeason(key) {
    if (S.listen) S.listen.off();
    S.season = key;
    S.fixtures = {};
    S.crowds = {};
    S.limit = PAGE;
    var past = key !== S.current;
    document.getElementById('fmSeasonSel').value = key;
    document.getElementById('fmFromAttRow').hidden = !past;
    /* A past season has only results: no toggle, nothing "upcoming". */
    S.when = past ? 'results' : 'fixtures';
    var when = document.getElementById('fmWhen');
    when.hidden = past;
    Array.prototype.forEach.call(when.children, function (c) {
      var on = c.getAttribute('data-when') === S.when;
      c.classList.toggle('active', on);
      c.setAttribute('aria-selected', String(on));
    });
    document.getElementById('fmAddRow').hidden = past;
    loadCrowds(key);
    if (S.unavRef) S.unavRef.off();
    S.unavail = {};
    S.unavRef = ref('unavailable');
    S.unavRef.on('value', function (snap) { S.unavail = snap.val() || {}; if (S.tab === 'rearrange') renderRearrange(); });
    S.listen = ref('fixtures');
    S.listen.on('value', function (snap) {
      S.fixtures = snap.val() || {};
      render();
    }, function (err) {
      document.getElementById('fmBody').innerHTML =
        '<div class="banner banner--error">Could not read fixtures: ' + esc(err.message) + '</div>';
    });
  }

  /* Crowds are club submissions in the Attendance tool, filed under the
     match ID. Read, never copied: a figure lives in one place. */
  function attPath(key, node) {
    return 'app-data/ops-attendance/' + (key === S.current ? '' : 'archive/' + key + '/') + node;
  }
  function crowdsOf(subs) {
    var out = {};
    Object.keys(subs || {}).forEach(function (id) {
      var x = subs[id] || {};
      if (x.total != null) out[id] = { total: +x.total, away: x.awayRecorded !== false && x.away != null ? +x.away : null };
    });
    return out;
  }
  function loadCrowds(key) {
    NL.ensureAuth()
      .then(function () { return db.ref(attPath(key, 'submissions')).once('value'); })
      .then(function (snap) {
        if (S.season !== key) return;
        S.crowds = crowdsOf(snap.val());
        render();
      })
      .catch(function () { /* no crowds is not an error: the column stays empty */ });
  }

  /* A crowd is expected for a game a League club hosted (or a neutral
     one), once it has a result or its date has passed. */
  function crowdDue(r, t) {
    if (!r.date || S.crowds[r.key]) return false;
    if (!(r.result || r.date < t)) return false;
    return !!(r.home.code || r.neutral);
  }

  function wireStatic() {
    document.getElementById('fmSeasonSel').addEventListener('change', function (e) {
      if (e.target.value !== S.season) openSeason(e.target.value);
    });
    document.getElementById('fmTabs').addEventListener('click', function (e) {
      var b = e.target.closest('[data-tab]');
      if (!b) return;
      var was = S.tab;
      S.tab = b.getAttribute('data-tab');
      setActive('fmTabs', b);
      var panel = S.tab === 'broadcast' ? 'fixtures' : S.tab;
      Array.prototype.forEach.call(document.querySelectorAll('[data-panel]'), function (p) {
        p.hidden = p.getAttribute('data-panel') !== panel;
      });
      /* Between Fixtures and Broadcast the list stays where it was: the
         first game in view is held at the same height on the screen. */
      var keep = (was === 'fixtures' || was === 'broadcast') && panel === 'fixtures' ? anchorRow() : null;
      render();
      if (keep) restoreRow(keep);
    });
    /* NL.clubPicker's × and an emptied box clear the picker without calling
       onSelect, so the filter would stay on. Watch for both here.
       Canon candidate (28/10/2026): the picker should tell its caller. */
    var club = document.getElementById('fmClub');
    /* Capture phase: the × stops its click from bubbling. */
    club.addEventListener('click', function (e) {
      if (!e.target.closest('.club-picker__clear')) return;
      S.club = null; S.limit = PAGE; render();
    }, true);
    club.addEventListener('input', function (e) {
      if (e.target.value === '' && S.club) { S.club = null; S.limit = PAGE; render(); }
    });
    wireRearrange();
    document.getElementById('fmFromAtt').addEventListener('click', openFromAttendance);
    document.getElementById('fmImport').addEventListener('click', openImport);
    document.getElementById('fmResults').addEventListener('click', openResults);
    document.getElementById('fmAdd').addEventListener('click', function () { openEdit(null); });
    document.getElementById('fmWhen').addEventListener('click', function (e) {
      var b = e.target.closest('[data-when]');
      if (!b) return;
      S.when = b.getAttribute('data-when');
      S.limit = PAGE;
      setActive('fmWhen', b);
      b.parentNode.querySelectorAll('[data-when]').forEach(function (c) { c.setAttribute('aria-selected', String(c === b)); });
      render();
    });
    document.getElementById('fmBody').addEventListener('click', function (e) {
      if (e.target.closest('[data-more]')) { S.limit += PAGE; render(); return; }
      var tr = e.target.closest('[data-key]');
      if (!tr) return;
      var rec = S.fixtures[tr.getAttribute('data-key')] || null;
      if (S.tab === 'broadcast') { if (rec && isBroadcast(rec)) openBroadcast(rec); return; }
      openEdit(rec);
    });
  }

  function setActive(groupId, btn) {
    Array.prototype.forEach.call(document.getElementById(groupId).children, function (c) {
      c.classList.toggle('active', c === btn);
    });
  }

  /* Competition filter: several at once, nothing chosen = all of them.
     Counts are the season's games in each, refreshed on every render. */
  function compOptions(keys, recs) {
    var n = {};
    recs.forEach(function (r) { n[r.comp] = (n[r.comp] || 0) + 1; });
    return keys.map(function (k) { return { value: k, label: F.COMP_BY_KEY[k].label, count: num(n[k] || 0) }; });
  }
  function renderComps() {
    S.compBtn = NL.filterButton('#fmComps', {
      label: 'Competition',
      options: compOptions(F.COMPS.map(function (c) { return c.key; }), []),
      onChange: function (v) { S.comp = v; S.limit = PAGE; render(); }
    });
    /* The old number cards, as one filter: pick a problem, see its games. */
    S.needBtn = NL.filterButton('#fmNeed', {
      label: 'Needs a look', allLabel: 'Any', multiple: false, options: [],
      onChange: function (v) { S.need = v; S.limit = PAGE; render(); }
    });
    S.statusBtn = NL.filterButton('#fmStatus', {
      label: 'Status', options: [],
      onChange: function (v) { S.status = v; S.limit = PAGE; render(); }
    });
  }

  /* ── List ─────────────────────────────────────────────────────────── */
  function passes(r, t) {
    if (S.comp.length && S.comp.indexOf(r.comp) === -1) return false;
    if (S.tab === 'broadcast' && S.status.length && !statusHit(r)) return false;
    if (S.club && r.home.name !== S.club && r.away.name !== S.club) return false;
    if (S.need === 'awaiting' && !F.awaiting(r)) return false;
    if (S.need === 'noOpta' && (r.optaID || F.COMP_BY_KEY[r.comp].fa)) return false;
    if (S.need === 'cupDue' && !F.cupResultDue(r, t)) return false;
    if (S.need === 'noCrowd' && !crowdDue(r, t)) return false;
    if (S.need === 'pencilled' && !X.pencilsOf(r).length) return false;
    if (!S.need && S.when === 'fixtures' && r.date && r.date < t && !r.result) return false;
    if (!S.need && S.when === 'fixtures' && r.result && r.date < t) return false;
    if (!S.need && S.when === 'results' && !(r.date && (r.date < t || r.result))) return false;
    return true;
  }

  /* The Rearrangements tab carries how many games await a date (canon
     .tab__count, brand v2.75), on every tab, hidden at zero. */
  function renderRrCount() {
    var n = Object.keys(S.fixtures).filter(function (k) { return F.awaiting(S.fixtures[k]); }).length;
    var el = document.getElementById('fmRrCount');
    el.textContent = num(n);
    el.hidden = !n;
  }

  function render() {
    renderRrCount();
    if (S.tab === 'rearrange') { renderRearrange(); return; }
    if (S.tab === 'settings') return;
    var t = today();
    var all = Object.keys(S.fixtures).map(function (k) { return S.fixtures[k]; });
    var bc = S.tab === 'broadcast';
    S.compBtn.setOptions(compOptions(F.COMPS.map(function (c) { return c.key; }), all));
    renderNeeds(all, t);
    document.getElementById('fmStatus').hidden = !bc;
    if (bc) renderStatus(all);

    var body = document.getElementById('fmBody');
    if (!all.length) {
      body.innerHTML = '<div class="empty-state"><div class="empty-state__title">No fixtures for ' +
        esc(NL.season.label(S.meta, S.season)) + ' yet</div>' +
        (S.canEdit ? '<div class="empty-state__text">Import the workbook to start.</div>' : '') + '</div>';
      return;
    }

    var list = all.filter(function (r) { return passes(r, t); });
    renderTally(all, list, bc);
    var waiting = list.filter(F.awaiting).sort(function (a, b) {
      var x = lastLost(a), y = lastLost(b);
      return x !== y ? (x < y ? -1 : 1) : F.compare(a, b);
    });
    /* Results run newest first; fixtures from the next one on. */
    var dated = list.filter(function (r) { return !F.awaiting(r); }).sort(S.when === 'results' && !S.need
      ? function (a, b) { return a.date !== b.date ? (a.date < b.date ? 1 : -1) : F.compare(a, b); } : F.compare);

    var html = '';
    if (waiting.length) {
      html += '<div class="section-head"><h2>Awaiting a date</h2></div>' + tableOf(waiting, true);
    }
    if (dated.length) {
      if (waiting.length) html += '<div class="section-head fm-gap"><h2>Dated</h2></div>';
      html += tableOf(dated.slice(0, S.limit), false);
      if (dated.length > S.limit) {
        html += '<div class="filter-bar fm-gap"><button class="btn btn--ghost btn--sm" type="button" data-more>' +
          'Show ' + Math.min(PAGE, dated.length - S.limit) + ' more of ' + (dated.length - S.limit) + '</button></div>';
      }
    }
    if (!waiting.length && !dated.length) {
      html = '<div class="empty-state"><div class="empty-state__title">Nothing matches</div></div>';
    }
    body.innerHTML = html;
    NL.clubs.wireCrestImgs(body);
  }

  function lastLost(r) {
    var a = r.attempts || [];
    return a.length ? a[a.length - 1].date : '';
  }

  /* Needs a look: what were six number cards (v3.1). Counts are the whole
     season's, whatever else is filtered. */
  function renderNeeds(all, t) {
    var c = F.counts(S.fixtures, t), noCrowd = 0, pencilled = 0;
    all.forEach(function (r) {
      if (crowdDue(r, t)) noCrowd++;
      if (X.pencilsOf(r).length) pencilled++;
    });
    S.needBtn.setOptions([
      ['awaiting', c.awaiting, 'Awaiting a date'],
      ['noOpta', c.noOpta, 'No Opta ID'],
      ['cupDue', c.cupDue, 'FA result due'],
      ['pencilled', pencilled, 'Pencilled'],
      ['noCrowd', noCrowd, 'No attendance']
    ].map(function (x) { return { value: x[0], label: x[2], count: num(x[1]) }; }));
  }

  /* One line above the list: how many games it holds and, on Broadcast,
     the DAZN tally across the season. */
  function renderTally(all, list, bc) {
    var html = '<strong>' + num(list.length) + '</strong> ' + (list.length === 1 ? 'game' : 'games');
    if (bc) {
      var mine = all.filter(isBroadcast);
      var moves = mine.filter(function (r) { return r.broadcast && r.broadcast.daznMove; }).length;
      var ami = mine.filter(function (r) { return r.broadcast && r.broadcast.ami; }).length;
      var review = mine.filter(function (r) { return r.broadcast && r.broadcast.review; }).length;
      html += ' · Moved by DAZN <strong>' + moves + ' / ' + F.DAZN_MOVES + '</strong> · AMI <strong>' + ami + '</strong>' +
        (review ? ' · <strong>' + review + '</strong> to review' : '');
    }
    document.getElementById('fmTally').innerHTML = html;
  }

  /* A crest is requested only when we know the file exists: the roster
     and cup guests by crestName ("Fulham PL2" wears Fulham's), then any
     other club named in assets/crests/manifest.json — the EFL sides met in
     the FA Cup, say. Never probe: a crest <img> for a club with no file
     404s twice per row per render, uncached, and a list of FA ties did
     that ~1,500 times and hit Pages rate limits (28/10/2026). */
  function crestOf(name) {
    var c = NL.clubs.byName(name) || NL.clubs.guestByName(name);
    if (c) return c.crestName || c.name;
    return S.crests[name] ? name : null;
  }

  /* A plain grey shield for a club we hold no crest for: an inline SVG, so
     it costs no request. */
  var NO_CREST = '<svg class="fm-crest-none" viewBox="0 0 24 24" aria-hidden="true">' +
    '<path d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5l-8-3z"/></svg>';

  function crest(name) {
    var c = crestOf(name);
    return c ? NL.clubs.crestImgHtml(c, 'thumb') : NO_CREST;
  }

  /* Home: name then crest, right-aligned to the centre line. Away: crest
     then name, left-aligned from it. */
  function team(side, home) {
    var name = '<span class="fm-name">' + esc(side.name) + '</span>';
    return '<div class="fm-team' + (home ? ' fm-team--home' : '') + '">' +
      (home ? name + crest(side.name) : crest(side.name) + name) + '</div>';
  }

  function compPill(key) {
    var c = F.COMP_BY_KEY[key];
    return '<span class="comp-pill' + (c && c.pill ? ' comp-pill--' + c.pill : '') + '">' + esc(c ? c.label : key) + '</span>';
  }

  function broadcastPill(r) {
    var a = F.AVAIL_BY_KEY[r.broadcast && r.broadcast.availability];
    return a ? '<span class="pill fm-bc--' + a.key + '">' + esc(a.label) + '</span>' : '';
  }

  function flags(r, t, lead) {
    var out = lead ? [lead] : [];
    var lost = (r.attempts || []).length;
    if (F.awaiting(r)) out.push('<span class="pill pill--postponed">' + esc(r.state === 'abandoned' ? 'Abandoned' : 'Postponed') + '</span>');
    else if (lost) out.push('<span class="pill pill--info">Moved' + (lost > 1 ? ' ×' + lost : '') + '</span>');
    if (!r.optaID && !F.COMP_BY_KEY[r.comp].fa) out.push('<span class="pill pill--pending">No Opta ID</span>');
    if (F.cupResultDue(r, t)) out.push('<span class="pill pill--pending">Result due</span>');
    var pens = X.pencilsOf(r);
    if (pens.length) out.push('<span class="pill pill--info" title="Pencilled, not confirmed">Pencilled ' +
      esc(pens.map(function (p) { return +p.date.slice(8) + '/' + +p.date.slice(5, 7); }).join(' · ')) + '</span>');
    return '<div class="fm-flags">' + out.join('') + '</div>';
  }

  function middle(r, t) {
    if (r.result) return '<td class="fm-mid">' + esc(F.resultText(r.result)) + '</td>';
    return '<td class="fm-mid fm-mid--v">' + (r.date && r.date < t ? '–' : 'v') + '</td>';
  }

  function crowdCell(r, t) {
    var c = S.crowds[r.key];
    /* Total, then the away following in brackets: 2,145 (312). */
    if (c) return '<td class="fm-crowd">' + esc(num(c.total)) +
      (c.away != null ? ' <span class="fm-crowd__away">(' + esc(num(c.away)) + ')</span>' : '') + '</td>';
    return '<td class="fm-crowd fm-crowd--none">' + (crowdDue(r, t) ? '–' : '') + '</td>';
  }

  /* The fixture list (v3.0). Competition is a coloured band, not a
     column: under each date, games group by competition with a header row
     in its colour, and each row carries the same colour on its left edge.
     Columns follow what the rows need: Attendance only when the table
     holds a game already played, and the broadcast decision only as a tag
     on an upcoming game that is shown or still to decide (the Broadcast
     tab is where it is made). That leaves the club names the room. */
  var COMP_NAME = { national: 'National League', north: 'National League North',
    south: 'National League South' };
  var COMP_INDEX = {};
  F.COMPS.forEach(function (c, i) { COMP_INDEX[c.key] = i; });

  function compBand(key) {
    var c = F.COMP_BY_KEY[key];
    return c && c.pill ? ' comp-pill--' + c.pill : '';
  }

  /* Upcoming games only: worldwide, overseas or still TBC. */
  var TV_TAG = { worldwide: 1, overseas: 1, tbc: 1 };
  function tvTag(r, t) {
    var a = r.broadcast && r.broadcast.availability;
    if (!TV_TAG[a] || (r.date && r.date < t)) return '';
    return broadcastPill(r);
  }

  function tableOf(rows, waiting) {
    var t = today();
    var bc = S.tab === 'broadcast';
    var crowd = !bc && rows.some(function (r) { return r.date && r.date < t; });
    var n = bc ? 9 : crowd ? 7 : 6;
    /* Awaiting-a-date rows run oldest loss first; grouped by competition
       they keep that order inside each group. */
    if (waiting) {
      rows = rows.map(function (r, i) { return { r: r, i: i }; }).sort(function (a, b) {
        return ((COMP_INDEX[a.r.comp] || 0) - (COMP_INDEX[b.r.comp] || 0)) || a.i - b.i;
      }).map(function (x) { return x.r; });
    }
    var html = '<div class="table-wrap"><table class="table table--compact fm-table fm-list' + (bc ? ' fm-list--bc' : '') + '">' +
      '<colgroup><col class="c-ko"><col class="c-rd"><col><col class="c-mid"><col>' +
      (bc ? '<col class="c-bcav"><col class="c-enh"><col class="c-dazn"><col class="c-ami">' : (crowd ? '<col class="c-crowd">' : '') + '<col class="c-flag">') +
      '</colgroup><thead><tr>' +
      '<th>' + (waiting ? 'Lost' : 'KO') + '</th><th>Rd</th><th class="ta-right">Home</th>' +
      '<th class="ta-center"></th><th>Away</th>' +
      (bc ? '<th>Broadcast</th><th>Enhanced</th><th>DAZN</th><th>AMI</th>' : (crowd ? '<th class="ta-right">Attendance</th>' : '') + '<th></th>') +
      '</tr></thead><tbody>';
    var day = null, comp = null;
    rows.forEach(function (r) {
      if (!waiting && r.date !== day) {
        day = r.date; comp = null;
        html += '<tr class="fm-day"><td colspan="' + n + '">' + esc(NL.formatDate(r.date)) + '</td></tr>';
      }
      if (r.comp !== comp) {
        comp = r.comp;
        var c = F.COMP_BY_KEY[comp];
        html += '<tr class="fm-comp' + compBand(comp) + '"><td colspan="' + n + '">' +
          esc(COMP_NAME[comp] || (c ? c.label : comp)) + '</td></tr>';
      }
      var last = waiting ? r.attempts[r.attempts.length - 1] : null;
      html += '<tr class="fm-row' + compBand(r.comp) + (bc && !isBroadcast(r) ? ' fm-row--off' : '') + '" data-key="' + esc(r.key) + '">' +
        '<td class="fm-ko">' + esc(waiting ? (last ? F.fmt(last.date) : '—') : (r.ko || '—')) + '</td>' +
        '<td>' + esc((r.playoff ? 'PO ' : '') + (r.round || '')) + '</td>' +
        '<td>' + team(r.home, true) + '</td>' +
        middle(r, t) +
        '<td>' + team(r.away, false) + '</td>' +
        (bc ? broadcastCells(r)
            : (crowd ? crowdCell(r, t) : '') + '<td>' + flags(r, t, tvTag(r, t)) + '</td>') + '</tr>';
    });
    return html + '</tbody></table></div>';
  }

  /* ── Broadcast ───────────────────────────────────────────────────────
     Every game's availability, Enhanced, moved at DAZN's request and AMI,
     set from the game's own panel in the Broadcast view (v3.1). A broadcast
     game given a new date is flagged for review until confirmed there. */
  var BC_COMPS = ['national', 'north', 'south', 'nl-cup'];
  var BC_STATUS = [['tbc', 'TBC'], ['worldwide', 'Worldwide'], ['overseas', 'Overseas'],
    ['not-selected', 'Not selected'], ['unavailable', 'Unavailable'], ['review', 'Review']];

  /* FA ties are not ours to show: listed in the Broadcast view so rows do
     not jump between views, but blank and not opened. */
  function isBroadcast(r) { return BC_COMPS.indexOf(r.comp) !== -1; }

  /* A game matches a status by its availability, or by Review when it is
     waiting on one. */
  function statusHit(r) {
    var b = r.broadcast || {};
    return S.status.indexOf(b.availability) !== -1 || (S.status.indexOf('review') !== -1 && !!b.review);
  }

  function renderStatus(all) {
    var sc = {};
    all.filter(isBroadcast).forEach(function (r) {
      var b = r.broadcast || {};
      if (b.availability) sc[b.availability] = (sc[b.availability] || 0) + 1;
      if (b.review) sc.review = (sc.review || 0) + 1;
    });
    S.statusBtn.setOptions(BC_STATUS.map(function (x) { return { value: x[0], label: x[1], count: num(sc[x[0]] || 0) }; }));
  }

  /* The Broadcast view's cells: the availability (with an amber (i) when a
     rearranged game is waiting on a check), then Enhanced, DAZN move and
     AMI in a column each, a pill only when it is on. */
  /* A rearranged game whose broadcast decision needs checking: a small
     amber info mark beside its pill, not a pill of its own. */
  var REVIEW_ICON = '<span class="fm-review" title="Rearranged since it was picked: open it to check" ' +
    'role="img" aria-label="Rearranged since it was picked: check">' + NL.icon('info', 'sm').outerHTML + '</span>';

  function broadcastCells(r) {
    if (!isBroadcast(r)) return '<td></td><td></td><td></td><td></td>';
    var b = r.broadcast || {};
    var av = broadcastPill(r) + (b.review ? REVIEW_ICON : '');
    return '<td><div class="fm-flags">' + av + '</div></td>' +
      '<td>' + (b.enhanced ? '<span class="pill pill--info">Enhanced</span>' : '') + '</td>' +
      '<td>' + (b.daznMove ? '<span class="pill pill--postponed" title="Moved at DAZN\u2019s request">DAZN</span>' : '') + '</td>' +
      '<td>' + (b.ami ? '<span class="pill pill--approved">AMI</span>' : '') + '</td>';
  }

  /* Tap a game in the Broadcast view: its decision, changed here and saved
     at once. Saving clears Moved: review; AMI takes only games shown in the
     UK (plan, AMI), so it is off unless the game is worldwide. */
  function openBroadcast(rec) {
    var b = rec.broadcast || {};
    var ro = !S.canEdit, dis = ro ? ' disabled' : '';
    var wrap = document.createElement('div');
    var opts = F.AVAILABILITY.filter(function (a) { return a.key !== 'cup'; }).map(function (a) {
      return '<option value="' + a.key + '"' + (b.availability === a.key ? ' selected' : '') + '>' + esc(a.label) + '</option>';
    }).join('');
    function tick(id, f, label) {
      return '<label class="fm-bcx"><input type="checkbox" id="' + id + '" data-f="' + f + '"' + (b[f] ? ' checked' : '') + dis + '> ' + esc(label) + '</label>';
    }
    wrap.innerHTML =
      (b.review ? '<div class="banner banner--amber">Rearranged since it was picked. Check the decision still stands, then save.</div>' : '') +
      '<div class="fm-bcmeta">' + compPill(rec.comp) + ' <span>' + esc(rec.date ? NL.formatDate(rec.date) + (rec.ko ? ', ' + rec.ko : '') : 'Awaiting a date') + '</span></div>' +
      '<div class="form-group"><label for="fmbAv">Availability</label>' +
        '<select id="fmbAv"' + dis + '>' + opts + '</select></div>' +
      '<div class="fm-bcxs">' + tick('fmbEnh', 'enhanced', 'Enhanced') + tick('fmbDazn', 'daznMove', 'Moved by DAZN') +
        tick('fmbAmi', 'ami', 'AMI') + '</div>';
    var av = wrap.querySelector('#fmbAv'), ami = wrap.querySelector('#fmbAmi');
    function syncAmi() {
      var ok = av.value === 'worldwide';
      if (!ok) ami.checked = false;
      ami.disabled = ro || !ok;
    }
    av.addEventListener('change', syncAmi);
    syncAmi();
    var buttons = [{ label: ro ? 'Close' : 'Cancel', className: 'btn--ghost', onClick: function (m) { m.close(); } }];
    if (!ro) buttons.push({ label: b.review ? 'Save, still right' : 'Save', className: 'btn--primary', onClick: function (m) {
      var n = clean(rec);
      n.broadcast = n.broadcast || {};
      n.broadcast.availability = av.value;
      ['enhanced', 'daznMove', 'ami'].forEach(function (f) { n.broadcast[f] = wrap.querySelector('[data-f="' + f + '"]').checked; });
      if (n.broadcast.availability !== 'worldwide') n.broadcast.ami = false;
      delete n.broadcast.review;
      save(n).then(function () { m.close(); })
        .catch(function (err) { NL.toast('Save failed: ' + err.message, 'error'); });
    }});
    NL.modal({ title: rec.home.name + ' v ' + rec.away.name, body: wrap, buttons: buttons });
  }

  /* Where the list is: the first game row in view and its height on the
     screen, so a re-render can put it back in the same place. */
  function anchorRow() {
    var rows = document.querySelectorAll('#fmBody tr[data-key]');
    /* Below the sticky season-and-tabs bar, which covers the rows under it. */
    var floor = document.querySelector('.fm-top').getBoundingClientRect().bottom;
    for (var i = 0; i < rows.length; i++) {
      var top = rows[i].getBoundingClientRect().top;
      if (top >= floor) return { key: rows[i].getAttribute('data-key'), top: top };
    }
    return null;
  }
  function restoreRow(a) {
    var row = document.querySelector('#fmBody tr[data-key="' + (window.CSS && CSS.escape ? CSS.escape(a.key) : a.key) + '"]');
    if (row) window.scrollBy(0, row.getBoundingClientRect().top - a.top);
  }

  /* ── Rearrangements ──────────────────────────────────────────────────
     Every game awaiting a date, oldest original date first, and for the
     chosen one the slots the date finder (fixtures/_finder.js) offers,
     with both clubs' months beside them. A slot is pencilled (staff only,
     a soft block on the clubs' other games) or confirmed, which gives the
     game its new date and puts it back on the public list. */
  var X = window.FixturesFinder;
  var DOW_MON = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
  var DOW_SUN = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  /* A competition in a calendar cell: the comp pill's own short form. */
  var COMP_SHORT = { national: 'NAT', north: 'NOR', south: 'SOU', 'nl-cup': 'NLC', 'fa-cup': 'FAC', 'fa-trophy': 'FAT' };

  function dayOf(d) { return DOW_SUN[new Date(d + 'T12:00:00Z').getUTCDay()]; }
  /* 'Sat 24 Oct 2026', the canon short date with its weekday. */
  function day(d) { return d ? dayOf(d) + ' ' + NL.formatDateShort(d) : '—'; }
  function dayKo(d, ko) { return day(d) + (d && ko ? ', ' + ko : ''); }

  /* The season's calendar, rounds and distances, fetched once a season.
     A season with no calendar file has nothing to rearrange into. */
  function rrData(cb) {
    var label = NL.season.label(S.meta, S.season);
    var held = S.rr.data[label];
    if (held) return held.ready ? held : null;
    S.rr.data[label] = { ready: false };
    Promise.all([
      getJson('/assets/data/calendar-' + label + '.json'),
      getJson('/assets/data/rounds-' + label + '.json'),
      getJson('/assets/data/club-distances.json')
    ]).then(function (r) {
      S.rr.data[label] = { ready: true, calendar: r[0], rounds: r[1] || {}, distances: r[2] || { pairs: {} } };
      cb();
    });
    return null;
  }

  /* The game on screen: the one awaiting a date, or the one being moved. */
  function curRec() { return S.fixtures[S.rr.mode === 'move' ? S.rr.moveKey : S.rr.key]; }
  function unavailList() { return Object.keys(S.unavail || {}).map(function (k) { return Object.assign({ id: k }, S.unavail[k]); }); }

  function wireRearrange() {
    var body = document.getElementById('fmRrBody');
    body.addEventListener('click', function (e) {
      var mode = e.target.closest('[data-rr-mode]');
      if (mode) { S.rr.mode = mode.getAttribute('data-rr-mode'); S.rr.slot = null; renderRearrange(); return; }
      var lift = e.target.closest('[data-unavail-off]');
      if (lift) {
        NL.ensureAuth().then(function () { return ref('unavailable/' + lift.getAttribute('data-unavail-off')).remove(); })
          .then(function () { NL.toast('No longer ruled out', 'success'); })
          .catch(function (err) { NL.toast('Save failed: ' + err.message, 'error'); });
        return;
      }
      var unrule = e.target.closest('[data-unrule]');
      if (unrule) {
        var g = JSON.parse(JSON.stringify(curRec()));
        g.ruledOut = (g.ruledOut || []).filter(function (x) { return x.date !== unrule.getAttribute('data-unrule'); });
        if (!g.ruledOut.length) delete g.ruledOut;
        save(g).then(function () { NL.toast('No longer ruled out', 'success'); })
          .catch(function (err) { NL.toast('Save failed: ' + err.message, 'error'); });
        return;
      }
      var item = e.target.closest('[data-rr]');
      if (item) { S.rr.key = item.getAttribute('data-rr'); S.rr.slot = null; renderRearrange(); return; }
      var pick = e.target.closest('[data-slot]');
      if (pick) {
        S.rr.slot = pick.getAttribute('data-slot');
        /* From the list, bring the day into view on the calendar. */
        var cell = e.target.closest('.fm-slots') && document.querySelector('#fmRrWeeks [data-week="' + mondayOf(S.rr.slot) + '"]');
        if (cell) { var box = document.getElementById('fmRrWeeks'); box.scrollTop = Math.max(0, cell.offsetTop - cell.offsetHeight / 2); }
        hideTip();
        if (S.canEdit && e.target.closest('[data-choose]')) openChoose(curRec(), S.rr.slot);
        else renderRearrange();
        return;
      }
      var unp = e.target.closest('[data-unpencil]');
      if (unp) {
        save(X.unpencil(curRec(), unp.getAttribute('data-unpencil'))).then(function () { NL.toast('Pencil removed', 'success'); })
          .catch(function (err) { NL.toast('Save failed: ' + err.message, 'error'); });
        return;
      }
      var conf = e.target.closest('[data-confirm-pencil]');
      if (conf) {
        var rec = curRec(), d = conf.getAttribute('data-confirm-pencil');
        var p = X.pencilsOf(rec).filter(function (x) { return x.date === d; })[0];
        if (p) confirmDate(rec, p.date, p.ko);
      }
    });
    body.addEventListener('mouseover', function (e) {
      var c = e.target.closest('[data-tip-slot]');
      if (c) showTip(c); else hideTip();
    });
    body.addEventListener('mouseleave', hideTip);
    body.addEventListener('focusin', function (e) { var c = e.target.closest('[data-tip-slot]'); if (c) showTip(c); });
    body.addEventListener('focusout', hideTip);
    /* A click anywhere else closes More days. */
    document.addEventListener('click', function (e) {
      var more = document.getElementById('fmRrMore');
      if (more && more.open && !more.contains(e.target)) { more.open = false; S.rr.moreOpen = false; }
    });
    /* toggle does not bubble: capture it to remember the fold. */
    body.addEventListener('toggle', function (e) {
      if (e.target.id === 'fmRrMore') S.rr.moreOpen = e.target.open;
    }, true);
    body.addEventListener('change', function (e) {
      if (e.target.id === 'fmRrPick') { S.rr.key = e.target.value; S.rr.slot = null; renderRearrange(); return; }
      if (e.target.id === 'fmRrFix') { S.rr.moveKey = e.target.value || null; S.rr.slot = null; renderRearrange(); return; }
      var dayBox = e.target.getAttribute && e.target.getAttribute('data-day');
      if (dayBox) { S.rr[dayBox] = e.target.checked; renderRearrange(); }
    });
  }

  function renderRearrange() {
    var body = document.getElementById('fmRrBody');
    var data = rrData(renderRearrange);
    if (!data) { body.innerHTML = '<div class="empty-state"><div class="empty-state__title">Loading…</div></div>'; return; }
    if (!data.calendar) {
      body.innerHTML = '<div class="empty-state"><div class="empty-state__title">No season calendar for ' +
        esc(NL.season.label(S.meta, S.season)) + '</div></div>';
      return;
    }
    var list = X.todo(S.fixtures);
    var moving = S.rr.mode === 'move';
    var rec = null;
    /* Drawn first: it settles which fixture is being moved. */
    var picks = moving ? movePickers() : list.length ? todoPicker(list) : '';
    if (moving) {
      rec = S.rr.moveKey && S.fixtures[S.rr.moveKey] ? S.fixtures[S.rr.moveKey] : null;
    } else if (list.length) {
      if (!S.rr.key || !S.fixtures[S.rr.key] || S.fixtures[S.rr.key].date) S.rr.key = list[0].rec.key;
      rec = S.fixtures[S.rr.key];
    }
    var key = rec ? rec.key : null;
    var same = S.rr.drawn === key;
    var top = '<div class="fm-rr-pick">' + modeBar(list.length) + picks + '</div>';
    var main = rec ? gameOf(rec, list, data, moving)
      : '<div class="empty-state"><div class="empty-state__title">' +
        (moving ? 'Choose the home club, then the away club' : 'Nothing awaiting a date') + '</div></div>';
    body.innerHTML = '<div class="fm-rr-app">' + top + main + '</div>';
    if (moving) mountMovePickers();
    fitRearrange();
    if (rec) wireWeeks(same ? S.rr.scroll : null);
    S.rr.drawn = key;
    NL.clubs.wireCrestImgs(body);
  }

  /* The tab's height: what is left of the window below its top, so the
     page never scrolls and each column scrolls on its own. Recomputed on
     resize. Below 1100px wide the columns stack and the page scrolls. */
  function fitRearrange() {
    var app = document.querySelector('.fm-rr-app');
    if (!app) return;
    if (!window.matchMedia('(min-width: 1100px)').matches) { app.style.removeProperty('--app-h'); return; }
    var page = document.querySelector('#pageWrap .page');
    var pad = page ? parseFloat(getComputedStyle(page).paddingBottom) || 0 : 0;
    var top = app.getBoundingClientRect().top + window.scrollY;
    app.style.setProperty('--app-h', Math.max(420, Math.floor(window.innerHeight - top - pad - 1)) + 'px');
  }
  window.addEventListener('resize', function () { if (S.tab === 'rearrange') fitRearrange(); });

  /* Two jobs, a closed set: games that have lost their date, and any
     fixture that has one but needs to move. */
  function modeBar(waiting) {
    function tab(mode, text) {
      var on = S.rr.mode === mode;
      return '<button class="tab' + (on ? ' active' : '') + '" type="button" role="tab" aria-selected="' + on + '" data-rr-mode="' + mode + '">' + text + '</button>';
    }
    return '<div class="tabs fm-rr-modes" role="tablist" aria-label="Rearrange">' +
      tab('waiting', 'Awaiting a date (' + num(waiting) + ')') + tab('move', 'Move a fixture') + '</div>';
  }

  /* Move a fixture: the home club, the away club, then which of their
     games (league, cup) if more than one. */
  function movePickers() {
    var games = Object.keys(S.fixtures).map(function (k) { return S.fixtures[k]; }).filter(function (r) {
      return S.rr.moveHome && S.rr.moveAway && r.home.name === S.rr.moveHome && r.away.name === S.rr.moveAway;
    }).sort(F.compare);
    if (games.length === 1) S.rr.moveKey = games[0].key;
    else if (!games.some(function (r) { return r.key === S.rr.moveKey; })) S.rr.moveKey = null;
    var pick = '';
    if (S.rr.moveHome && S.rr.moveAway) {
      pick = games.length
        ? '<select class="nl-select" id="fmRrFix" aria-label="Fixture">' + (games.length > 1 ? '<option value="">Which game?</option>' : '') +
          games.map(function (r) {
            var comp = F.COMP_BY_KEY[r.comp];
            return '<option value="' + esc(r.key) + '"' + (r.key === S.rr.moveKey ? ' selected' : '') + '>' +
              esc((r.date ? dayKo(r.date, r.ko) : 'Awaiting a date') + ' · ' + (comp ? comp.label : r.comp) +
                (r.playoff ? ' play-off' : '') + (r.round && !(comp && comp.league && !r.playoff) ? ' ' + r.round : '')) + '</option>';
          }).join('') + '</select>'
        : '<span>No fixture between them this season</span>';
    }
    return '<div class="fm-picker" id="fmRrHome"></div><span class="fm-rr-v">v</span><div class="fm-picker" id="fmRrAway"></div>' + pick;
  }
  function mountMovePickers() {
    [['#fmRrHome', 'moveHome', 'Home club'], ['#fmRrAway', 'moveAway', 'Away club']].forEach(function (x) {
      NL.clubPicker(x[0], {
        mode: 'search', season: 'all', extraClubs: S.guests, placeholder: x[2], value: S.rr[x[1]],
        onSelect: function (sel) { S.rr[x[1]] = sel ? sel.name : null; S.rr.moveKey = null; S.rr.slot = null; renderRearrange(); }
      });
    });
  }
