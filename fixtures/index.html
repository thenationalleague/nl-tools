      if (!ok) return;
      var entry = { type: 'corrected', from: 'played', to: 'scheduled', effectiveAt: null,
                    recordedAt: stamp(), by: (S.session && S.session.uid) || null, reasonCode: null };
      f.status = 'scheduled'; clearScores(f);
      Promise.all([saveFixture(f), appendHistory(f.recordID, entry)]).then(function () {
        NL.writeAudit('fixture_result_removed', { recordID: f.recordID, was: was });
        render(); NL.toast('Result removed', 'success');
      });
    });
  }

  /* Any fixture can be deleted — a mis-added row has to be removable. What
     differs is the cost, so the warning names it: an Opta-keyed fixture comes
     back on the next import of the sheet (same key), a hand-added one does
     not, and neither brings its history back. */
  function confirmDelete(f) {
    var n = histOf(f.recordID).length;
    var lost = n ? n + (n === 1 ? ' history entry goes' : ' history entries go') + ' with it. ' : '';
    NL.confirm(
      f.home + ' v ' + f.away + '\n' + f.competition + ' · ' +
        (f.status === 'postponed' ? 'awaiting a new date' : whenText(f.date, f.kickoff)), {
      title: 'Delete this fixture?',
      detail: lost + (f.optaID
        ? 'Re-importing the sheet restores the fixture' + (n ? ', but not its history.' : '.')
        : 'Nothing re-creates it — this one was added by hand.'),
      confirmText: 'Delete', variant: 'danger'
    }).then(function (ok) {
      if (!ok) return;
      var db = firebase.database();
      Promise.all([
        db.ref(seasonPath('fixtures') + '/' + f.recordID).remove(),
        db.ref(seasonPath('history') + '/' + f.recordID).remove(),
        db.ref(seasonPath('notes') + '/' + f.recordID).remove()
      ]).then(function () {
        delete S.fixtures[f.recordID]; delete S.history[f.recordID]; delete S.notes[f.recordID];
        NL.writeAudit('fixture_deleted', { recordID: f.recordID, fixture: f.home + ' v ' + f.away });
        render(); NL.toast('Fixture deleted', 'success');
      });
    });
  }

  function askOpta(f) {
    NL.prompt('Opta match ID', { default: f.optaID || '', placeholder: 'g2660046' }).then(function (v) {
      if (v == null) return;
      f.optaID = v.trim() || null;
      saveFixture(f).then(function () {
        NL.writeAudit('fixture_opta_id', { recordID: f.recordID, optaID: f.optaID });
        render(); NL.toast(f.optaID ? 'Opta ID saved' : 'Opta ID cleared', 'success');
      });
    });
  }

  /* The sheet's own convention: 2-1 (1-1 aet, 4-3 p). Reproduced rather than
     invented so anything exported lines up with what Richard already writes. */
  function scoreText(f) {
    if (f.homeScore == null || f.awayScore == null) return '';
    var s = f.homeScore + '\u2013' + f.awayScore, extra = [];
    if (f.aetHome != null) extra.push(f.aetHome + '\u2013' + f.aetAway + ' aet');
    if (f.penHome != null) extra.push(f.penHome + '\u2013' + f.penAway + ' p');
    return s + (extra.length ? ' (' + extra.join(', ') + ')' : '');
  }

  /* One place that knows a result is six numbers, not two. */
  function clearScores(f) {
    f.homeScore = null; f.awayScore = null;
    f.aetHome = null; f.aetAway = null;
    f.penHome = null; f.penAway = null;
  }

  function historyBlock(f) {
    var h = histOf(f.recordID);
    if (!h.length) return '';
    var byCode = REASON_BY_CODE;
    var items = h.map(function (e, i) {
      var r = byCode[e.reasonCode];
      var line = e.type === 'corrected'
          ? (e.from === 'played' ? 'Result removed' : 'Reinstated (was ' + e.from + ')')
        : e.type === 'postponed' ? 'Postponed from ' + e.from
        : (e.from ? 'Moved from ' + e.from + ' to ' + e.to : 'Date set: ' + e.to);
      return '<li><div class="fx-hist__t">' + (i + 1) + '. ' + esc(line) +
        (canEdit() ? '<button type="button" class="fx-hist__edit" data-fxhist="' + i +
          '" title="Correct or remove this entry">Edit</button>' : '') + '</div>' +
        '<div class="fx-hist__d">' + (e.effectiveAt ? 'Decided ' + esc(e.effectiveAt) + ' &middot; ' : '') +
        'recorded ' + esc(e.recordedAt) + (r ? ' &middot; ' + esc(r.label) : '') +
        (e.reasonWas ? ' <span class="fx-hist__amend">(reason corrected)</span>' : '') + '</div></li>';
    }).join('');
    var waits = waitDays(f);
    var notes = (S.notes[f.recordID] || []).map(function (n) {
      return '<div class="fx-hist__d">&ldquo;' + esc(n.text) + '&rdquo; &middot; ' + esc(n.at) + '</div>';
    }).join('');
    return '<div class="fx-ref"><div class="fx-mv-head">Scheduling history</div><ul class="fx-hist">' + items + '</ul>' +
      (waits.length ? '<p class="form-hint">Time to rearrange: ' + esc(waits.join(', ')) + '</p>' : '') +
      (notes ? '<div style="margin-top:9px;">' + notes + '</div>' : '') + '</div>';
  }

  /* Three honest states, never a placeholder: a real ID, awaiting one, or
     none is ever issued. Editable throughout — if an ID turns up for a
     competition Opta does not normally cover, the field should take it. */
  function optaCell(f) {
    var btn = '<button type="button" class="fx-link" data-fxopta="1">' + (f.optaID ? 'edit' : 'add') + '</button>';
    if (f.optaID) return esc(f.optaID) + ' ' + btn;
    if (OPTA_EXPECTED[f.competition]) return '<span class="fx-await">Awaiting</span> ' + btn;
    return '<span class="fx-none">Not issued</span> ' + btn;
  }

  /* Broadcast, production, AMI, DAZN-moved. Staff only — the club view never
     reaches openEdit. Production and AMI are gated on the game actually being
     shown: DAZN's camera call means nothing on a game nobody is covering.
     DAZN-moved is NOT gated, because it records that DAZN moved the fixture,
     which says nothing about whether the game ends up on DAZN. */
  function bcastBlock(f) {
    var b = bcastOf(f.recordID) || {};
    var code = b.status || 'tbc';
    var shown = isShown(code);
    return '<div class="fx-bcast">' +
      '<div class="form-group"><label for="fxBcast">Broadcast</label>' +
      '<select id="fxBcast">' + BCAST.map(function (o) {
        return '<option value="' + o.code + '"' + (o.code === code ? ' selected' : '') +
          '>' + esc(o.label) + '</option>';
      }).join('') + '</select></div>' +
      '<div class="fx-ticks" id="fxTicks">' +
      '<label class="fx-tick' + (shown ? '' : ' is-off') + '">' +
        '<input type="checkbox" id="fxEnh"' + (b.enhanced ? ' checked' : '') +
        (shown ? '' : ' disabled') + '> Enhanced production' +
        '<span class="fx-tick__hint">' + (shown ? 'Basic unless ticked' : 'Not being shown') + '</span></label>' +
      '<label class="fx-tick' + (shown ? '' : ' is-off') + '">' +
        '<input type="checkbox" id="fxAmi"' + (b.ami ? ' checked' : '') +
        (shown ? '' : ' disabled') + '> Sent to AMI</label>' +
      '<label class="fx-tick">' +
        '<input type="checkbox" id="fxDazn"' + (b.daznMoved ? ' checked' : '') +
        '> Moved by DAZN<span class="fx-tick__hint">Whether or not it is shown</span></label>' +
      '</div></div>';
  }

  function wireBcast(ctrl, f) {
    var sel = ctrl.body.querySelector('#fxBcast');
    if (!sel) return;
    function save() {
      var code = sel.value, shown = isShown(code);
      var rec = {
        status: code,
        /* Leaving a state where the game is shown clears the settings that
           only make sense there, rather than leaving stale production detail
           attached to a game nobody is covering. */
        enhanced: shown && ctrl.body.querySelector('#fxEnh').checked,
        ami: shown && ctrl.body.querySelector('#fxAmi').checked,
        daznMoved: ctrl.body.querySelector('#fxDazn').checked
      };
      S.bcast[f.recordID] = rec;
      firebase.database().ref(seasonPath('broadcast') + '/' + f.recordID).set(rec)
        .then(function () {
          NL.writeAudit('fixture_broadcast', { recordID: f.recordID, status: code });
          render();
        })
        .catch(function (e) { NL.toast('Could not save — ' + ((e && e.message) || e), 'error'); });
      /* Re-render so the gating follows the selection immediately. */
      var holder = ctrl.body.querySelector('.fx-bcast');
      if (holder) { holder.outerHTML = bcastBlock(f); wireBcast(ctrl, f); }
    }
    sel.addEventListener('change', save);
    ['#fxEnh', '#fxAmi', '#fxDazn'].forEach(function (id) {
      var el = ctrl.body.querySelector(id);
      if (el) el.addEventListener('change', save);
    });
  }

  function refBlock(f) {
    return '<details class="fx-ref"><summary>Reference</summary><dl>' +
      '<dt>Opta match ID</dt><dd>' + optaCell(f) + '</dd>' +
      (f.optaID === f.recordID ? '' : '<dt>Record ID</dt><dd>' + esc(f.recordID) + '</dd>') +
      (f.matchday ? '<dt>Matchday</dt><dd>' + esc(f.matchday) + '</dd>' : '') +
      (function () {
        var pr = pairOf(f);
        if (!pr) return '';
        return '<dt>Away travel</dt><dd>' +
          (pr.miles ? esc(pr.miles) + ' miles' : '') +
          (pr.miles && pr.mins ? ' &middot; ' : '') + esc(driveText(pr.mins)) + '</dd>';
      }()) +
      '<dt>Originally</dt><dd>' + whenStr(f.originalDate || f.date, f.originalKickoff || f.kickoff) + '</dd>' +
      '<dt>Season</dt><dd>' + esc(NL.season.label(NL.clubs.meta(), S.season) || S.season) + '</dd>' +
      '</dl></details>';
  }

  /* ---- Import ---------------------------------------------------------- */
  var IMP = { rows: [], head: [], map: {} };
  var FIELDS = [
    { key: 'date',  label: 'Date',      req: true },
    { key: 'ko',    label: 'Kick-off',  req: true },
    { key: 'home',  label: 'Home club', req: true },
    { key: 'away',  label: 'Away club', req: true },
    /* Required, deliberately. A dropdown applying one competition to every
       row is what filed 552 South fixtures as North: one wrong selection, no
       per-row evidence, nothing on screen that could contradict it. Reading
       it from the sheet makes that class of mistake impossible and lets the
       whole programme go in as a single paste. A hand-typed cup sheet needs
       the column too — one word repeated down a column. */
    { key: 'comp',  label: 'Competition', req: true },
    { key: 'round', label: 'Matchday / Round', req: false },
    { key: 'opta',  label: 'Opta ID',   req: false },
    /* Broadcast block. All optional: a fixture sheet without them is still a
       valid fixture sheet, and a blank cell is a real state (not ticked /
       not decided), not missing data. */
    { key: 'bcast', label: 'Broadcast',  req: false },
    { key: 'prod',  label: 'Production', req: false },
    { key: 'ami',   label: 'AMI',        req: false },
    { key: 'dazn',  label: 'DAZN moved', req: false }
  ];

  /* Sheet spellings the tool should accept for a competition, so a paste does
     not fail on "NLS" or "National League South". Anything unrecognised is
     reported per row rather than quietly filed somewhere wrong. */
  var COMP_ALIAS = (function () {
    var a = {};
    COMPS.forEach(function (c) { a[c.toLowerCase()] = c; });
    a['nl'] = a['national league'] = 'National';
    a['nln'] = a['national league north'] = 'North';
    a['nls'] = a['national league south'] = 'South';
    a['nlc'] = a['national league cup'] = 'NL Cup';
    a['fac'] = 'FA Cup';
    a['fat'] = a['fa trophy'] = 'FA Trophy';
    return a;
  }());
  /* An Opta ID becomes the RTDB record key, so it has to BE a usable key.
     RTDB forbids . # $ / [ ] — and a failed spreadsheet lookup puts "#N/A"
     in the cell, which contains two of them. Left alone it took down the
     whole import with "invalid key (#N) in path /#N/A".

     Anything unusable is treated as "no Opta ID" rather than guessed at or
     mangled into something that looks like one: the fixture still imports,
     it just gets a minted key and the real ID can be filled in later. */
  var EXCEL_ERR = /^#(N\/A|VALUE!|REF!|NAME\?|DIV\/0!|NUM!|NULL!|SPILL!|CALC!)$/i;
  var NOT_AN_ID = /^(n\/a|na|none|null|-|\u2013|\u2014|tbc|tbd|\?)$/i;
  function cleanOpta(v) {
    var t = String(v == null ? '' : v).trim();
    if (!t || EXCEL_ERR.test(t) || NOT_AN_ID.test(t)) return '';
    if (/[.#$/\[\]]/.test(t)) return '';
    return t;
  }

  function normComp(v) {
    return COMP_ALIAS[String(v == null ? '' : v).trim().toLowerCase()] || null;
  }

  /* ---- Broadcast -------------------------------------------------------
     Stored as a CODE, displayed as a LABEL. The label is the part that gets
     renamed — "Worldwide" was very nearly "UK" — and a rename must not mean
     rewriting every fixture. Same split the postponement reasons already
     use. Codes here are permanent; edit the labels freely.

     Lives in its own RTDB node, NOT on the fixture: fixtures are readable by
     any signed-in user so clubs can see their own games, and none of this is
     for them. Rules put it alongside history and notes. */
  var BCAST = [
    { code: 'tbc',          label: 'TBC' },
    { code: 'not-selected', label: 'Not selected' },
    { code: 'unavailable',  label: 'Unavailable' },
    { code: 'overseas',     label: 'Overseas' },
    { code: 'worldwide',    label: 'Worldwide' }
  ];
  var BCAST_LABEL = {};
  BCAST.forEach(function (b) { BCAST_LABEL[b.code] = b.label; });
  /* Only Overseas and Worldwide mean the game is actually being shown, which
     is what gates production, AMI and the derived "Televised". */
  function isShown(code) { return code === 'overseas' || code === 'worldwide'; }

  function normBcast(v) {
    var s = String(v == null ? '' : v).trim().toLowerCase();
    if (!s) return 'tbc';                 /* blank on import reads as TBC */
    var hit = null;
    BCAST.forEach(function (b) { if (b.code === s || b.label.toLowerCase() === s) hit = b.code; });
    if (hit) return hit;
    if (s === 'uk') return 'worldwide';   /* the rename that was considered */
    if (s === 'none' || s === 'no') return 'not-selected';
    return null;                          /* unrecognised — reported, not guessed */
  }
  /* Spreadsheet truthiness. A blank cell is false, which is what a tick-box
     column looks like when it is not ticked.

     `self` is the column's own HEADER. The NL sheet marks a tick by
     repeating the column name in the cell — the AMI column contains "AMI",
     the DAZN column contains "DAZN" — so a cell equal to its own header is
     a tick. Without this the real sheet imports as all-unticked, silently,
     because every value looks like a stray label. */
  function normTick(v, self) {
    var s = String(v == null ? '' : v).trim().toLowerCase();
    if (!s) return false;
    if (self && s === String(self).trim().toLowerCase()) return true;
    return s === 'y' || s === 'yes' || s === 'true' || s === '1' || s === 'x' || s === '✓';
  }
  /* Production is Basic unless elevated, so the stored value is the tick.
     "Basic" is stated explicitly in some rows and must stay false. */
  function normEnhanced(v, self) {
    var s = String(v == null ? '' : v).trim().toLowerCase();
    if (s === 'basic') return false;
    return s === 'enhanced' || normTick(v, self);
  }
  function bcastOf(id) { return S.bcast[id] || null; }

  /* Broadcast on the row itself. Importing the columns and seeing nothing
     change in the list is indistinguishable from the import not working —
     the same complaint as every other silent failure here.

     Deliberately terse: the state as a pill, then single-letter markers for
     Enhanced / AMI / moved-by-DAZN. Spelling any of it out costs more width
     than a 33px row has, and these get scanned down a column rather than
     read as sentences; the full wording is on hover.

     Green follows the sheet's own <tr> generator — filled for Worldwide,
     pale for Overseas — so the tool and the published table agree, but takes
     the brand's --green instead of the hard-coded hex. */
  /* Written out in full. Abbreviations save width nobody needed: the column
     sizes itself and the four toggles below let you drop whatever you are
     not looking at, which is a better answer than making everything cryptic
     all of the time.

     DAZN is white on black and AMI white on NL red, matching how they are
     already presented; brand tokens rather than the sheet's hard-coded hex. */
  var TV_PARTS = [
    { key: 'bcast', label: 'Broadcast' },
    { key: 'prod',  label: 'Production' },
    { key: 'ami',   label: 'AMI' },
    { key: 'dazn',  label: 'DAZN' }
  ];
  function tvOn(k) { return S.tv[k] !== false; }
  function anyTv() { return TV_PARTS.some(function (p) { return tvOn(p.key); }); }

  function bcastCell(f) {
    if (!anyTv()) return '';
    var b = bcastOf(f.recordID);
    if (!b || !b.status) return '<td class="fx-c-tv"></td>';
    var out = '';
    if (tvOn('bcast')) {
      var cls = b.status === 'worldwide' ? ' fx-tv--ww'
              : b.status === 'overseas'  ? ' fx-tv--os'
              : b.status === 'tbc'       ? ' fx-tv--tbc' : ' fx-tv--off';
      out += '<span class="fx-tv' + cls + '">' +
        esc((BCAST_LABEL[b.status] || b.status).toUpperCase()) + '</span>';
    }
    /* Production only reads as information on a game being shown — BASIC on
       a game nobody is covering is noise. */
    if (tvOn('prod') && isShown(b.status)) {
      out += '<span class="fx-tv ' + (b.enhanced ? 'fx-tv--enh' : 'fx-tv--basic') + '">' +
        (b.enhanced ? 'ENHANCED' : 'BASIC') + '</span>';
    }
    if (tvOn('ami') && b.ami) out += '<span class="fx-tv fx-tv--ami">AMI</span>';
    if (tvOn('dazn') && b.daznMoved) out += '<span class="fx-tv fx-tv--dazn">DAZN</span>';
    return '<td class="fx-c-tv">' + out + '</td>';
  }

  /* ---- Pairings --------------------------------------------------------
     Distance and drive time belong to the PAIR of clubs, not the fixture:
     the same Billericay-to-Dover trip is the same trip whether the game is
     played in August or moved to March, and whether it is a league fixture
     or a cup tie. Stored once per ordered pair and looked up at render
     time, so a rearrangement never needs it re-imported.

     Keyed on 3-letter club codes where clubs-meta knows them, which are
     guaranteed safe as RTDB keys; anything else falls back to a sanitised
     name so a non-League opponent still works. */
  function clubKey(name) {
    var c = NL.clubs.byName(name);
    if (c && c.code) return c.code;
    return String(name || '').replace(/[.$#\[\]\/]/g, '').replace(/\s+/g, '-').toUpperCase().slice(0, 24);
  }
  function pairKey(home, away) { return clubKey(home) + '_' + clubKey(away); }
  function pairOf(f) { return S.pairs[pairKey(f.home, f.away)] || null; }
  /* 81 -> "1h 21m". Minutes alone stop being readable somewhere around 90. */
  function driveText(mins) {
    var m = Math.round(+mins || 0);
    if (!m) return '';
    return m < 60 ? m + ' mins' : Math.floor(m / 60) + 'h ' + (m % 60 ? (m % 60) + 'm' : '00m');
  }

  /* Excel pastes are tab-separated; a saved file is CSV. Pick whichever the
     first line has more of, then hand CSV to the canon parser. */
  function splitRows(text) {
    var lines = String(text).replace(/\r\n/g, '\n').split('\n').filter(function (l) { return l.trim(); });
    if (!lines.length) return [];
    var tabs = (lines[0].match(/\t/g) || []).length;
    var commas = (lines[0].match(/,/g) || []).length;
    if (tabs >= commas && tabs > 0) {
      return lines.map(function (l) { return l.split('\t').map(function (c) { return c.trim(); }); });
    }
    return NL.csvParse(lines.join('\r\n')).map(function (r) {
      return r.map(function (c) { return String(c).trim(); });
    });
  }

  /* Guess from header names, falling back to what the data looks like, so a
     sheet with no header row still maps sensibly. */
  function guessMap(head, rows) {
    var m = {}, used = {};
    /* Order matters: the most specific pattern must claim a column first.
       `date: /date|day/i` used to swallow "Matchday" — every row then came
       back unreadable because the date column was the matchday number. */
    var want = [
      ['opta',  /opta|match ?id/i],
      ['comp',  /competition|division|^\s*comp\b/i],
      ['bcast', /broadcast|availability/i],
      ['prod',  /production/i],
      ['ami',   /^\s*ami\s*$/i],
      ['dazn',  /^\s*dazn\s*$/i],
      ['round', /matchday|round|stage|^\s*md\s*$/i],
      /* date BEFORE ko. A single "Date & Time" column matches both, and if ko
         claims it first the column is consumed and Date maps to nothing —
         which is exactly what a whole-programme paste looks like. Date wins
         it, and the ko fallback below then shares the same column. */
      ['date',  /date/i],
      ['ko',    /kick.?off|\btime\b|^\s*ko\s*$/i],
      ['home',  /home/i],
      ['away',  /away|opponent|visitor/i]
    ];
    want.forEach(function (pair) {
      head.forEach(function (h, i) {
        if (!used[i] && m[pair[0]] == null && pair[1].test(h)) { m[pair[0]] = i; used[i] = 1; }
      });
    });
    var sample = rows[0] || [];
    if (m.date == null) {
      for (var i = 0; i < sample.length; i++) if (!used[i] && looksDate(sample[i])) { m.date = i; used[i] = 1; break; }
      /* Mirror of the ko fallback: if the only date-bearing column was taken
         by kick-off, the two share it rather than one going unmapped. */
      if (m.date == null && m.ko != null && looksDate(sample[m.ko])) m.date = m.ko;
    }
    if (m.ko == null) {
      /* A combined "13/10/2026 19:45" cell should feed BOTH date and time. */
      if (m.date != null && looksTime(sample[m.date])) m.ko = m.date;
      else for (var j = 0; j < sample.length; j++) if (!used[j] && looksTime(sample[j])) { m.ko = j; used[j] = 1; break; }
    }
    return m;
  }

  function impStep1() {
    NL.modal({
      title: 'Import fixtures', width: 'wide',
      body: '<div class="fx-steps"><span class="is-on">1 Paste</span><span>2 Match columns</span><span>3 Check</span></div>' +
        '<p class="text-body" style="margin:0 0 12px;">Paste rows straight from a spreadsheet, or a CSV. ' +
        '<strong>Column order does not matter</strong> &mdash; you match them up on the next step. ' +
        'Include a header row if you have one.</p>' +
        '<div class="fx-needs"><span>Needs:</span><code>Date</code><code>Kick-off</code>' +
        '<code>Home</code><code>Away</code><span>optional:</span><code>Matchday</code><code>Opta ID</code></div>' +
        '<div class="form-group"><textarea id="fxImpText" rows="7" ' +
        'placeholder="Matchday&#9;Date&#9;Kick Off&#9;Home&#9;Away&#9;Opta ID&#10;1&#9;Sat, 8 Aug 2026&#9;3:00 PM&#9;AFC Fylde&#9;Wealdstone&#9;g2660046"></textarea></div>',
      buttons: [
        { label: 'Cancel', className: 'btn btn--ghost', onClick: function (c) { c.close(); } },
        { label: 'Next', className: 'btn btn--primary', onClick: function (c) {
            var rows = splitRows($('fxImpText').value);
            if (!rows.length) { NL.toast('Nothing to read', 'info'); return; }
            /* Row 1 is a header only if it holds no date. */
            var hasHead = !rows[0].some(looksDate);
            IMP.head = hasHead ? rows[0] : rows[0].map(function (_, i) { return 'Column ' + (i + 1); });
            IMP.rows = hasHead ? rows.slice(1) : rows;
            if (!IMP.rows.length) { NL.toast('No fixture rows found', 'info'); return; }
            IMP.map = guessMap(IMP.head, IMP.rows);
            c.close(); impStep2();
          } }
      ]
    });
  }

  function impStep2() {
    var opts = function (sel) {
      return '<option value="">&mdash; not in my data &mdash;</option>' +
        IMP.head.map(function (h, i) {
          return '<option value="' + i + '"' + (String(sel) === String(i) ? ' selected' : '') + '>' + esc(h) + '</option>';
        }).join('');
    };
    var ctrl = NL.modal({
      title: 'Match columns', width: 'wide',
      body: '<div class="fx-steps"><span>1 Paste</span><span class="is-on">2 Match columns</span><span>3 Check</span></div>' +
        '<p class="text-secondary" style="margin:0 0 12px;">' + IMP.rows.length +
        ' rows read. Point each field at the right column.</p>' +
        '<div class="fx-map">' +
        FIELDS.map(function (f) {
          return '<div class="form-group"><label>' + esc(f.label) + (f.req ? ' *' : '') + '</label>' +
            '<select data-fxmap="' + f.key + '">' + opts(IMP.map[f.key]) + '</select>' +
            '<div class="fx-map__sample" data-fxsample="' + f.key + '"></div></div>';
        }).join('') + '</div>' +
        '<div class="fx-map__note" id="fxImpNote" hidden></div>',
      buttons: [
        { label: 'Back', className: 'btn btn--ghost', onClick: function (c) { c.close(); impStep1(); } },
        { label: 'Cancel', className: 'btn btn--ghost', onClick: function (c) { c.close(); } },
        { label: 'Next', className: 'btn btn--primary', onClick: function (c) {
            var missing = FIELDS.filter(function (f) { return f.req && (IMP.map[f.key] == null || IMP.map[f.key] === ''); });
            if (missing.length) {
              NL.toast('Still need: ' + missing.map(function (f) { return f.label; }).join(', '), 'info');
              return;
            }
            c.close(); impStep3();
          } }
      ]
    });

    function refresh() {
      FIELDS.forEach(function (f) {
        var i = IMP.map[f.key];
        var el = ctrl.body.querySelector('[data-fxsample="' + f.key + '"]');
        var raw = (i === '' || i == null) ? '' : (IMP.rows[0] || [])[i];
        var shown = raw;
        if (f.key === 'date' && raw) shown = grabDate(raw) || raw;
        if (f.key === 'ko' && raw) { var g = grabTime(raw); shown = g ? g.t : raw; }
        el.textContent = shown ? 'e.g. ' + shown : '';
      });
      /* One column feeding both date and kick-off is the split case. */
      var note = ctrl.body.querySelector('#fxImpNote');
      if (IMP.map.date != null && IMP.map.date !== '' && String(IMP.map.date) === String(IMP.map.ko)) {
        note.hidden = false;
        note.innerHTML = '<strong>' + esc(IMP.head[IMP.map.date]) +
          '</strong> holds the date and the time together. It will be split automatically.';
      } else { note.hidden = true; }
    }
    ctrl.body.querySelectorAll('[data-fxmap]').forEach(function (sel) {
      sel.addEventListener('change', function () {
        IMP.map[sel.getAttribute('data-fxmap')] = sel.value === '' ? null : +sel.value;
        refresh();
      });
    });
    refresh();
  }

  function parseImport() {
    var g = function (r, k) { var i = IMP.map[k]; return (i == null || i === '') ? '' : (r[i] || ''); };
    var headOf = function (k) { var i = IMP.map[k]; return (i == null || i === '') ? '' : (IMP.head[i] || ''); };
    return IMP.rows.map(function (r) {
      var d = grabDate(g(r, 'date'));
      var tp = grabTime(g(r, 'ko'));
      var home = g(r, 'home'), away = g(r, 'away');
      /* The record key is the Opta ID when one is supplied — that is the
         model, and it is already how attendance keys its submissions. Only
         a fixture with no Opta ID at creation gets a minted key. */
      var rawOpta = g(r, 'opta').trim();
      var opta = cleanOpta(rawOpta);
      /* Always per row. A value the tool cannot place is left null so the
         row fails visibly instead of landing in the wrong competition. */
      var rawComp = g(r, 'comp').trim();
      var comp = normComp(rawComp);
      var rawB = g(r, 'bcast').trim();
      var bcast = normBcast(rawB);
      return {
        date: d, kickoff: tp ? tp.t : '15:00', guessedPm: !!(tp && tp.guessed),
        home: home, away: away, round: g(r, 'round'), opta: opta,
        comp: comp, rawComp: rawComp,
        bcast: bcast, rawBcast: rawB,
        enhanced: normEnhanced(g(r, 'prod'), headOf('prod')),
        ami: normTick(g(r, 'ami'), headOf('ami')),
        daznMoved: normTick(g(r, 'dazn'), headOf('dazn')),
        recordID: opta || null,
        rawOpta: rawOpta,
        exists: !!(opta && S.fixtures[opta]),
        ok: !!(d && home && away && comp),
        homeNL: !!NL.clubs.byName(home), awayNL: !!NL.clubs.byName(away)
      };
    });
  }

  function impStep3() {
    var parsed = parseImport();
    var good = parsed.filter(function (p) { return p.ok; });
    var bad = parsed.length - good.length;
    var freetext = good.filter(function (p) { return !p.homeNL || !p.awayNL; }).length;
    var guessed = good.filter(function (p) { return p.guessedPm; }).length;
    var dupes = good.filter(function (p) { return p.exists; }).length;
    var fresh = good.length - dupes;
    /* A whole-programme paste spans six competitions, so the headline counts
       per competition rather than naming one. */
    var tally = {};
    good.forEach(function (p) { tally[p.comp] = (tally[p.comp] || 0) + 1; });
    var compList = COMPS.filter(function (c) { return tally[c]; })
      .map(function (c) { return tally[c] + ' ' + c; }).join(' &middot; ');
    /* Rows whose competition cell the tool could not read. Named explicitly:
       "3 unreadable" tells you nothing about which word to fix. */
    var badComp = {};
    parsed.forEach(function (p) {
      if (p.rawComp && !p.comp) badComp[p.rawComp] = (badComp[p.rawComp] || 0) + 1;
    });
    var badCompNames = Object.keys(badComp);
    /* Same treatment for a broadcast value we cannot place. It does NOT fail
       the row — the fixture is still a fixture — but it is named rather than
       silently becoming TBC. */
    var badB = {};
    parsed.forEach(function (p) {
      if (p.rawBcast && !p.bcast) badB[p.rawBcast] = (badB[p.rawBcast] || 0) + 1;
    });
    var badBNames = Object.keys(badB);
    /* Rows whose Opta cell held something the tool refused. Counted, because
       silently minting a key for a row you believed had an Opta ID is how
       you end up with two records for one fixture. */
    var badOpta = {};
    parsed.forEach(function (p) {
      if (p.rawOpta && !p.opta) badOpta[p.rawOpta] = (badOpta[p.rawOpta] || 0) + 1;
    });
    var badOptaNames = Object.keys(badOpta);
    var bcastMapped = IMP.map.bcast != null && IMP.map.bcast !== '';

    NL.modal({
      title: 'Check', width: 'wide',
      body: '<div class="fx-steps"><span>1 Paste</span><span>2 Match columns</span><span class="is-on">3 Check</span></div>' +
        '<p class="text-secondary" style="margin:0 0 10px;">' + fresh + ' to import' +
        (compList ? ' &middot; ' + compList : '') +
        (dupes ? ' &middot; <strong>' + dupes + ' already here</strong>, which will be updated' : '') +
        (bad ? ' &middot; <span style="color:var(--primary);">' + bad + ' unreadable</span>' : '') +
        (freetext ? ' &middot; ' + freetext + ' with a non-League club' : '') + '</p>' +
        (badOptaNames.length
          ? '<div class="fx-map__note"><strong>Not a usable Opta ID</strong> on ' +
            badOptaNames.map(function (n) {
              return badOpta[n] + ' row' + (badOpta[n] === 1 ? '' : 's') + ' reading &ldquo;' + esc(n) + '&rdquo;';
            }).join(', ') + '. Those fixtures import without one, and can have it added later.</div>'
          : '') +
        (badBNames.length
          ? '<div class="fx-map__note"><strong>Broadcast not recognised</strong> on ' +
            badBNames.map(function (n) {
              return badB[n] + ' row' + (badB[n] === 1 ? '' : 's') + ' reading &ldquo;' + esc(n) + '&rdquo;';
            }).join(', ') + '. Those fixtures import, but come in as TBC.</div>'
          : '') +
        (badCompNames.length
          ? '<div class="fx-map__note"><strong>Competition not recognised</strong> on ' +
            badCompNames.map(function (n) {
              return badComp[n] + ' row' + (badComp[n] === 1 ? '' : 's') + ' reading &ldquo;' + esc(n) + '&rdquo;';
            }).join(', ') + '. Those rows will not import.</div>'
          : '') +
        (guessed ? '<div class="fx-map__note">' + guessed + ' row' + (guessed === 1 ? ' has a time' : 's have times') +
          ' with no am/pm, read as afternoon. Check the Kick-off column below.</div>' : '') +
        '<div class="fx-scroll"><table class="fx-prev"><thead><tr><th>Comp</th><th>Round</th><th>Date</th><th>KO</th>' +
        '<th>Home</th><th>Away</th><th>Opta ID</th></tr></thead><tbody>' +
        parsed.map(function (p) {
          return '<tr>' +
            '<td' + (p.comp ? '' : ' class="is-bad"') + '>' +
              esc(p.comp ? (COMP_SHORT[p.comp] || p.comp) : (p.rawComp || 'missing')) + '</td>' +
            '<td>' + (p.round ? esc(p.round) : '&mdash;') + '</td>' +
            '<td' + (p.date ? '' : ' class="is-bad"') + '>' + esc(p.date || 'unreadable') + '</td>' +
            '<td>' + esc(p.kickoff) + '</td>' +
            '<td' + (p.homeNL ? '' : ' class="is-new"') + '>' + (p.home ? esc(p.home) : '&mdash;') + '</td>' +
            '<td' + (p.awayNL ? '' : ' class="is-new"') + '>' + (p.away ? esc(p.away) : '&mdash;') + '</td>' +
            '<td' + (p.opta ? '' : ' class="is-new"') + '>' +
              esc(p.opta || (OPTA_EXPECTED[p.comp] ? 'awaiting' : 'not issued')) +
              (p.exists ? ' <span class="fx-dupe">already here</span>' : '') + '</td></tr>';
        }).join('') + '</tbody></table></div>' +
        '<p class="form-hint">Italic clubs are not in the League &mdash; kept as typed. ' +
        'Opta issues no IDs for the FA Cup or FA Trophy; elsewhere they can be added later '
        + 'from each fixture.</p>',
      buttons: [
        { label: 'Back', className: 'btn btn--ghost', onClick: function (c) { c.close(); impStep2(); } },
        { label: 'Cancel', className: 'btn btn--ghost', onClick: function (c) { c.close(); } },
        { label: 'Import ' + good.length, className: 'btn btn--primary', onClick: function (c) {
            var updates = {};
            good.forEach(function (p) {
              /* Minted keys are NOT Opta-shaped: a fabricated ID must stay
                 distinguishable from a real one. */
              /* Minted keys are NOT Opta-shaped (a fabricated ID must stay
                 distinguishable from a real one) and are STABLE: derived
                 from the fixture rather than the clock, so re-pasting a cup
                 sheet updates those ties instead of adding them again. The
                 date is deliberately not in the key — a tie that gets
                 rearranged in the tool must still match its own row on the
                 next import. */
              var id = p.recordID ||
                ('nlf-' + S.season + '-' + COMP_SHORT[p.comp] + '-' +
                 clubKey(p.home) + '-' + clubKey(p.away)).toLowerCase();
              var prev = S.fixtures[id];

              /* Carry a field over from the existing record, falling back when
                 it is not there.

                 `prev ? prev.x : fallback` is NOT good enough, and this is the
                 whole bug behind the silent re-import failure: RTDB does not
                 store null, it deletes the key. A fixture first written with
                 homeScore:null reads back with no homeScore AT ALL, so
                 prev.homeScore is `undefined` — and `undefined` anywhere in a
                 payload makes Firebase throw SYNCHRONOUSLY, before any promise
                 exists to reject. The click handler died where it stood.
                 Never let undefined out of here. */
              var keep = function (field, fallback) {
                var v = prev ? prev[field] : undefined;
                return v === undefined ? (fallback === undefined ? null : fallback) : v;
              };

              updates[id] = {
                recordID: id, optaID: p.opta || null,
                competition: p.comp, matchday: p.round || '',
                home: p.home, away: p.away,
                /* Re-importing must not rewrite history. The ORIGINAL date is
                   set once, on first sight; the current date follows the
                   sheet. A fixture already moved in the tool keeps its status
                   and score. */
                originalDate: keep('originalDate', p.date),
                originalKickoff: keep('originalKickoff', p.kickoff),
                date: p.date, kickoff: p.kickoff,
                status: keep('status', 'scheduled'),
                homeScore: keep('homeScore', null),
                awayScore: keep('awayScore', null),
                createdAt: keep('createdAt', stamp()),
                createdBy: keep('createdBy', (S.session && S.session.uid) || null)
              };
            });

            /* The broadcast block is written separately because it lives in
               a staff-only node — fixtures are readable by any signed-in
               user so a club can see its own games, and none of this is for
               them. Only written when the paste actually carried the
               columns, so a plain fixture sheet cannot wipe it. */
            var bUpdates = null;
            if (bcastMapped || ['prod', 'ami', 'dazn'].some(function (k) {
              return IMP.map[k] != null && IMP.map[k] !== '';
            })) {
              bUpdates = {};
              good.forEach(function (p) {
                var id = p.recordID || null;
                if (!id) return;   /* minted ids are assigned below */
                bUpdates[id] = {
                  status: p.bcast || 'tbc',
                  enhanced: !!p.enhanced,
                  ami: !!p.ami,
                  daznMoved: !!p.daznMoved
                };
              });
            }

            /* 1,656 records in one write is a large payload; chunk it so a
               single failure does not lose the lot. */
            var keys = Object.keys(updates), CHUNK = 400, jobs = [];
            for (var i = 0; i < keys.length; i += CHUNK) {
              var slice = {};
              keys.slice(i, i + CHUNK).forEach(function (k) { slice[k] = updates[k]; });
              jobs.push(slice);
            }
            var done = 0;
            /* Firebase can fail two different ways here and only one of them
               is a rejection: a bad payload THROWS on the spot. Catching just
               the promise left the button looking dead — you clicked, nothing
               happened, nothing said why. Both routes now surface. */
            function failed(e) {
              NL.toast('Import stopped after ' + done + ' — ' + ((e && e.message) || e), 'error');
              if (window.console) console.error('fixture import failed', e);
            }
            (function next() {
              if (!jobs.length) {
                keys.forEach(function (k) { S.fixtures[k] = updates[k]; });
                if (bUpdates && Object.keys(bUpdates).length) {
                  Object.keys(bUpdates).forEach(function (k) { S.bcast[k] = bUpdates[k]; });
                  firebase.database().ref(seasonPath('broadcast')).update(bUpdates)
                    .catch(function (e) { failed(e); });
                }
                NL.writeAudit('fixture_import', { competitions: compList.replace(/ &middot; /g, ', '), count: done });
                c.close(); render();
                NL.toast(done + ' fixture' + (done === 1 ? '' : 's') + ' imported', 'success');
                return;
              }
              var batch = jobs.shift();
              try {
                firebase.database().ref(seasonPath('fixtures')).update(batch)
                  .then(function () { done += Object.keys(batch).length; next(); })
                  .catch(failed);
              } catch (e) { failed(e); }
            }());
          } }
      ]
    });
  }

  function isNum(v) {
    var t = String(v == null ? '' : v).replace(/[^0-9.]/g, '');
    return t !== '' && isFinite(+t);
  }

  /* Paste the travel lookup: one row per ordered club pair. Its own dialog
     rather than a mode of the fixture importer — different shape, different
     lifetime. It changes when a club moves ground, not when a game moves,
     which is exactly why it is a lookup and not a fixture field. */
  function importPairs() {
    var ctrl = NL.modal({
      title: 'Travel table', width: 'wide',
      body: '<p class="text-secondary" style="margin:0 0 10px;">One row per pairing: ' +
        '<strong>home club, away club, miles, minutes</strong>. Paste straight from Excel ' +
        'or as CSV; a header row is detected and skipped.</p>' +
        '<div class="fx-needs"><code>Home team</code><code>Away team</code>' +
        '<code>Distance (miles)</code><code>Distance (minutes)</code></div>' +
        '<div class="form-group"><textarea id="fxPairText" rows="9" spellcheck="false" ' +
        'placeholder="Home team&#9;Away team&#9;Distance (miles)&#9;Distance (minutes)&#10;' +
        'Billericay Town&#9;Dover Athletic&#9;76.10&#9;81"></textarea></div>' +
        '<div id="fxPairOut"></div>',
      buttons: [
        { label: 'Cancel', className: 'btn btn--ghost', onClick: function (c) { c.close(); } },
        { label: 'Import', className: 'btn btn--primary', onClick: function (c) {
            var rows = pairRows(ctrl.body.querySelector('#fxPairText').value);
            var updates = {}, bad = 0, unknown = {};
            rows.forEach(function (r) {
              var home = (r[0] || '').trim(), away = (r[1] || '').trim();
              if (!home || !away || (!isNum(r[2]) && !isNum(r[3]))) { bad++; return; }
              if (!NL.clubs.byName(home)) unknown[home] = 1;
              if (!NL.clubs.byName(away)) unknown[away] = 1;
              updates[pairKey(home, away)] = {
                home: home, away: away,
                miles: isNum(r[2]) ? +String(r[2]).replace(/[^0-9.]/g, '') : null,
                mins:  isNum(r[3]) ? Math.round(+String(r[3]).replace(/[^0-9.]/g, '')) : null
              };
            });
            var n = Object.keys(updates).length;
            if (!n) { NL.toast('No usable rows \u2014 check the column order', 'error'); return; }
            /* A full club-to-club matrix is 82 x 81 = 6,642 rows. Chunked for
               the same reason the fixture import is: one write that large is
               a single point of failure, and a partial failure should say how
               far it got rather than losing the lot. */
            var pk = Object.keys(updates), CH = 400, jobs = [];
            for (var i = 0; i < pk.length; i += CH) {
              var slice = {};
              pk.slice(i, i + CH).forEach(function (k) { slice[k] = updates[k]; });
              jobs.push(slice);
            }
            var done = 0;
            function failed(e) {
              NL.toast('Stopped after ' + done + ' \u2014 ' + ((e && e.message) || e), 'error');
              if (window.console) console.error('pairings import failed', e);
            }
            (function next() {
              if (!jobs.length) {
                pk.forEach(function (k) { S.pairs[k] = updates[k]; });
                NL.writeAudit('fixture_pairings_import', { count: done });
                c.close(); render();
                NL.toast(done + ' pairing' + (done === 1 ? '' : 's') + ' saved' +
                  (bad ? ' \u00b7 ' + bad + ' row' + (bad === 1 ? '' : 's') + ' skipped' : ''), 'success');
                var u = Object.keys(unknown);
                if (u.length) {
                  NL.toast(u.length + ' club name' + (u.length === 1 ? '' : 's') +
                    ' not in the League list, kept as typed: ' + u.slice(0, 3).join(', ') +
                    (u.length > 3 ? '\u2026' : ''), 'info');
                }
                return;
              }
              var batch = jobs.shift();
              try {
                firebase.database().ref(seasonPath('pairings')).update(batch)
                  .then(function () { done += Object.keys(batch).length; next(); })
                  .catch(failed);
              } catch (e) { failed(e); }
            }());
          } }
      ]
    });
    /* Live count while pasting, so a wrong column order shows up before the
       import rather than after it. */
    var ta = ctrl.body.querySelector('#fxPairText'), tick = null;
    ta.addEventListener('input', function () {
      /* Re-parsing 6,000 rows on every keystroke makes the box feel broken.
         One pass shortly after typing stops is enough for a row count. */
      clearTimeout(tick);
      tick = setTimeout(preview, 120);
    });
    function preview() {
      var rows = pairRows(ta.value), r0 = rows[0];
      var ok = rows.filter(function (r) {
        return (r[0] || '').trim() && (r[1] || '').trim() && (isNum(r[2]) || isNum(r[3]));
      }).length;
      ctrl.body.querySelector('#fxPairOut').innerHTML = rows.length
        ? '<p class="form-hint">' + ok + ' of ' + rows.length + ' rows readable' +
          (r0 ? ' &middot; first: <strong>' + esc((r0[0] || '?') + ' \u2192 ' + (r0[1] || '?')) + '</strong>, ' +
            /* Parse before showing: the cell often reads "76.10 miles", and
               echoing it raw gives "76.10 miles miles". */
            esc(isNum(r0[2]) ? +String(r0[2]).replace(/[^0-9.]/g, '') : '?') + ' miles, ' +
            esc(driveText(r0[3]) || '?') : '') + '</p>'
        : '';
    }
  }
  /* Shares the fixture importer's tab-or-CSV sniffing, then drops a header
     row — detected as "the number columns are not numbers". */
  function pairRows(raw) {
    var rows = splitRows(raw);
    if (rows.length && !(isNum(rows[0][2]) && isNum(rows[0][3]))) rows = rows.slice(1);
    return rows;
  }

  /* ---- Wiring ---------------------------------------------------------- */
  function wire() {
    $('fxCompPills').innerHTML = COMPS.map(function (c) {
      return '<button type="button" class="filter-pill active" data-fxcomp="' + esc(c) + '">' +
        esc(COMP_SHORT[c]) + '</button>';
    }).join('');

    var md = $('fxMd');
    for (var i = 1; i <= 46; i++) md.insertAdjacentHTML('beforeend', '<option value="' + i + '">MD ' + i + '</option>');
    md.addEventListener('change', function () { S.md = md.value; render(); });
    $('fxWhy').addEventListener('change', function () { S.why = this.value; render(); });

    if (!S.isClub) {
      S.picker = NL.clubPicker('#fxClubPicker', {
        mode: 'search', season: S.season, clearable: true,
        placeholder: 'Search club',
        onSelect: function (sel) { S.club1 = sel && sel.name || null; render(); }
      });
    }

    $('fxClear').addEventListener('click', function () {
      S.club1 = null; S.venue = 'all'; S.md = ''; md.value = ''; S.why = ''; $('fxWhy').value = '';
      COMPS.forEach(function (c) { S.comps[c] = true; });
      document.querySelectorAll('[data-fxcomp]').forEach(function (b) { b.classList.add('active'); });
      $('fxVenue').querySelectorAll('.chip').forEach(function (ch) {
        ch.classList.toggle('active', ch.getAttribute('data-fxvenue') === 'all');
      });
      if (S.picker) S.picker.clear();
      render();
    });

    document.addEventListener('click', function (e) {
      var t = e.target.closest('[data-fxcomp],[data-fxvenue],[data-fxtab],[data-fxopen],[data-fxtv]');
      if (!t) return;
      if (t.hasAttribute('data-fxcomp')) {
        var c = t.getAttribute('data-fxcomp');
        S.comps[c] = !S.comps[c]; t.classList.toggle('active'); render();
      } else if (t.hasAttribute('data-fxvenue')) {
        S.venue = t.getAttribute('data-fxvenue');
        $('fxVenue').querySelectorAll('.chip').forEach(function (ch) { ch.classList.toggle('active', ch === t); });
        render();
      } else if (t.hasAttribute('data-fxtab')) {
        S.tab = t.getAttribute('data-fxtab');
        document.querySelectorAll('[data-fxtab]').forEach(function (b) {
          var on = b === t; b.classList.toggle('active', on); b.setAttribute('aria-selected', on);
        });
        $('fxPaneAll').hidden = S.tab !== 'all';
        $('fxPaneMoves').hidden = S.tab !== 'moves';
        render();
      } else if (t.hasAttribute('data-fxtv')) {
        var k = t.getAttribute('data-fxtv');
        S.tv[k] = !tvOn(k);
        /* Remembered, because re-hiding the same three columns on every visit
           is exactly the kind of chore a preference exists to remove. */
        try { localStorage.setItem('fx-tv', JSON.stringify(S.tv)); } catch (err) {}
        render();
      } else { open(t.getAttribute('data-fxopen')); }
    });

    $('fxExport').addEventListener('click', function () {
      var rows = [['recordID', 'optaID', 'competition', 'matchday', 'home', 'away',
                   'date', 'kickoff', 'status', 'homeScore', 'awayScore', 'originalDate']];
      filtered().forEach(function (f) {
        rows.push([f.recordID, f.optaID || '', f.competition, f.matchday, f.home, f.away,
          f.status === 'postponed' ? '' : f.date, f.status === 'postponed' ? '' : f.kickoff,
          f.status, f.homeScore == null ? '' : f.homeScore, f.awayScore == null ? '' : f.awayScore,
          f.originalDate || '']);
      });
      NL.download('nl-fixtures-' + S.season + '.csv', NL.csv(rows, { bom: true }), 'text/csv');
      NL.toast('Exported ' + (rows.length - 1) + ' fixtures', 'success');
    });

    var imp = $('fxImport');
    if (canEdit()) imp.addEventListener('click', impStep1); else imp.hidden = true;
    var prs = $('fxPairs');
    if (canEdit()) prs.addEventListener('click', importPairs); else prs.hidden = true;
    var blk = $('fxBulk');
    if (canEdit()) blk.addEventListener('click', bulkDelete); else blk.hidden = true;
  }
}());
</script>

</body>
