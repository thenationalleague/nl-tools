<!DOCTYPE html>
<!--
  NL Tools — Fixtures
  Version: v0.18 (16/08/2026)
  File: /fixtures/index.html

  CHANGELOG
    v0.18 (16/08/2026) — crestImg delegates to canon NL.clubs.crestImgHtml
      with wireCrestImgs sweeps at both insertion points. This also FIXES a
      silent bug: the old version wired the rose fallback onto a detached
      element and then serialised it with outerHTML, which drops
      property-assigned handlers — so the fallback never fired. loading="lazy"
      stays, injected into the string pre-parse (canon has no opt for it;
      second caller promotes).
    v0.17 (05/08/2026) — The row action sits on canon .btn--icon rather
      than a private copy of the same shape. .fx-act keeps only the two
      things that are about this table and not a shared pattern: 22px,
      because on 552 rows a 30px button sets the row height, and a
      quiet-until-hover colour, because 552 bordered boxes read as 552
      buttons. Nothing changes on screen.
    v0.16 (30/07/2026) — One line per move in Rearrangements, each date
      PAIRED with the reason it came off that date, kick-offs in 12-hour
      form. Replaces the arrow chain and the deduplicated reason list,
      which could not be lined up against each other.
    v0.15 (30/07/2026) — Rearrangements obeys the same filters as the
      fixture list (the toolbar sat inside the fixtures pane, so it was
      hidden on the other tab) and adds a reason filter. Drops 'Took'.
      Adds a Previously column: every kick-off the fixture has already
      carried, and every reason it has moved for.
    v0.14 (30/07/2026) — Rearrangements is the same table as the main
      list (crests, tints, break lines) rather than a card stack; two
      visual languages for one set of fixtures was the problem. History
      entries can be corrected or removed: a mis-keyed reason is not an
      event, so it is edited in place and stamped reasonWas rather than
      appending a timeline entry for a typo.
    v0.13 (30/07/2026) — Broadcast written out in full as proper pills
      (DAZN white-on-black, AMI white-on-NL-red, BASIC/ENHANCED), each
      of the four independently hideable and remembered. Adds a bulk
      delete of the filtered view, guarded by typing the count — the
      answer to a mis-import that produced hundreds of rows to undo.
    v0.12 (30/07/2026) — Broadcast surfaces on the row (a TV column: the
      state as a pill, then E/A/D for Enhanced, AMI and moved-by-DAZN).
      Importing four columns and seeing nothing change is
      indistinguishable from the import failing. Travel-table writes are
      chunked and its preview debounced, for a full 82-club matrix.
    v0.11 (30/07/2026) — "#N/A" in the Opta ID column took down the whole
      import: RTDB keys cannot contain # or /, and the ID becomes the
      record key. Excel error values and other non-IDs are now treated as
      no ID, reported per value, and the fixture imports anyway. Minted
      keys are also stable now — they were built from the clock, so every
      re-paste of a cup sheet would have added the ties again.
    v0.10 (30/07/2026) — Travel table (distance + drive time, keyed on
      the club pair, pasted as its own lookup). Extra time and penalties
      behind a disclosure in the Result dialog, with penalties usable
      WITHOUT extra time because the NL Cup goes straight to a shootout.
      Hover no longer turns every row the same blue as NL South.
    v0.9 (30/07/2026) — Broadcast block: Broadcast, Production, AMI and
      DAZN-moved, importable and editable. Stored in its own staff-only
      RTDB node because fixtures are readable by any signed-in user and
      none of this is for clubs. Broadcast is a stored CODE with a
      display label, so renaming Worldwide costs one line, not 1,656
      records. Production and AMI are gated on the game being shown and
      clear when it stops being; DAZN-moved is not, because it records
      that DAZN moved the fixture, not that DAZN is showing it.
    v0.8 (30/07/2026) — Competition is now a REQUIRED column and the
      dropdown is gone. A control that applies one competition to every
      row is the mis-selection risk itself; removing it removes the
      class of error. A hand-typed cup sheet needs the column too.
    v0.7 (30/07/2026) — Competition is a mappable column, so the whole
      programme goes in as one paste instead of one division at a time.
      The dropdown stays as the fallback for a sheet with no such column
      and disables itself when one is mapped. Removes the mis-selection
      that filed 552 South fixtures as North.
    v0.6 (30/07/2026) — A result entered by mistake could not be taken
      off: Save refused unless BOTH boxes had a value, so clearing them
      did nothing, and the only ways out were Abandoned (a lie) or
      deleting the fixture. Adds Remove result, logged to the history
      like any other correction. Saving a result on a future-dated
      fixture now warns first — warns, not blocks, because that is also
      how you correct a fixture whose date is wrong.
    v0.5 (30/07/2026) — Re-importing a sheet already in the tool did
      nothing at all, silently. RTDB deletes rather than stores a null,
      so homeScore/awayScore read back UNDEFINED, and undefined in a
      payload makes Firebase throw synchronously — before any promise
      exists to reject, so the .catch never ran and the button looked
      dead. Carried-over fields are now normalised, and a throwing write
      surfaces as an error toast instead of nothing.
    v0.4 (30/07/2026) — Away club sat 2px above the home club on every
      row. .fx-team was inline-flex, whose baseline comes from the FIRST
      flex item, and the two cells are deliberately mirrored: home is
      text-then-crest, away is crest-then-text. Now a block-level flex
      box so the cell's own vertical-align does the centring.
    v0.3 (30/07/2026) — Density pass. Rows 57px -> 33px (13 -> 22 per screen)
      via canon's new .table--compact plus a 22px icon row-action in place of
      a 33px text button, which was what actually set the row height. Tabs
      capped and moved onto one line with the season and both actions. KO
      sized to match the team names. Home header right-aligned to its column
      (it never was — canon's !important won).
    v0.2 (30/07/2026) — The league programme imports through the same wizard
      as cup ties. Re-import is idempotent: rows keyed by Opta ID are updated
      in place and originalDate/status/score survive. Deletion is available on
      every fixture, with a warning that names what is lost.
    v0.1 (30/07/2026) — First build.

  Every fixture in every National League competition, with the scheduling
  history behind it.

  WHY THE DATA IS SHAPED THIS WAY
    A postponement and a rearrangement are separate events. A game called
    off with no new date is `postponed` (from-date, no to-date); a game
    moved straight to a new date is `rescheduled` (both). Modelling them as
    one event makes "postponed, awaiting rearrangement" unrepresentable —
    which is the state the League is in for most of the winter — and makes
    "how long did the club wait" uncomputable.

    Storage (RTDB), split so the rules can enforce the visibility tiers:
      app-data/ops-fixtures/seasons/<season>/fixtures/<recordID>
      app-data/ops-fixtures/seasons/<season>/history/<recordID>
      app-data/ops-fixtures/seasons/<season>/notes/<recordID>
      app-data/ops-fixtures/seasons/<season>/metrics/<recordID>
      tools/ops-fixtures                    tool registration

    recordID is assigned once and never changes. League fixtures use the
    Opta ID (already how attendance keys its submissions); cup ties mint
    one, because Opta issues nothing at creation. optaID is a separate
    nullable attribute so filling it in later never orphans the history.

  Access (auth-guard registry — see system/auth-guard.js):
    superadmin / admin / staff  → read everything, edit
    club-admin / club-viewer    → own fixtures only, read-only, no reasons
                                  and no history (enforced by RTDB rules,
                                  not just by the UI)
-->

<style>
  /* #pageWrap default hide is in nl-brand.css; auth-guard reveals with
     style.display = 'block'. Don't clear with '' — would re-trigger the
     brand rule and re-hide the page.

     Only what canon does not already provide lives here. The filter bar,
     pills, chips, table, tabs, pills, buttons, modals and club picker are
     all nl-brand.css v2.28 / NL.* — see the Style Guide. */

  /* Competition identity — pastel row washes. Deliberately barely-there:
     enough to block competitions apart at a glance without competing with
     the text. Tool-local for now; attendance's --competition-* tokens are
     solid badge colours, a different job. A canon candidate the moment a
     second tool wants row tinting. */
  #pageWrap {
    --comp-national: #fdf4ec;
    --comp-north:    #fdfbea;
    --comp-south:    #eff4fc;
    --comp-nlcup:    #f6f0fa;
    --comp-facup:    #fdeff1;
    --comp-fatrophy: #f3f4f6;
    /* Hover darkens a row's OWN tint by ~6%. Canon's hover is a flat
       --off-white (#f4f6f9), which is within a hair of --comp-south
       (#eff4fc) — so hovering any row made it look like a National League
       South game. Keeping the hue and dropping the value says "this row"
       instead of "a different competition". */
    --comp-national-hover: #eee5de;
    --comp-north-hover:    #eeecdc;
    --comp-south-hover:    #e1e5ed;
    --comp-nlcup-hover:    #e7e2eb;
    --comp-facup-hover:    #eee1e3;
    --comp-fatrophy-hover: #e4e5e7;
  }
  tr.fx-national  td { background-color: var(--comp-national); }
  tr.fx-north     td { background-color: var(--comp-north); }
  tr.fx-south     td { background-color: var(--comp-south); }
  tr.fx-nlcup     td { background-color: var(--comp-nlcup); }
  tr.fx-facup     td { background-color: var(--comp-facup); }
  tr.fx-fatrophy  td { background-color: var(--comp-fatrophy); }

  /* Break hierarchy. MUST stay scoped under .table tbody: `tr.fx-datebreak td`
     alone ties with `.table tbody td` on specificity and loses on source
     order, which silently erases every break.
       new date                     thick solid
       new competition, same date   thin solid
       new kick-off, same comp      long dash */
  /* Row padding comes from canon's .table--compact on the <table>. It cannot
     be set here: every declaration in canon's .table block is !important, so
     a `padding` on this rule loses silently (it did, for weeks — rows stayed
     at 57px). Same for column text-align, hence .ta-right / .ta-center. */
  .table tbody td { border-top: 1px solid var(--border); border-bottom: none; }
  .table tbody tr.fx-kobreak td {
    border-top-color: transparent;
    /* A CSS dashed border gives tiny dashes with no way to tune them, so
       the dash is painted: 10px on, 7px off. */
    background-image: repeating-linear-gradient(to right,
      var(--navy-300) 0 10px, transparent 10px 17px);
    background-repeat: no-repeat;
    background-size: 100% 1px;
    background-position: left top;
  }
  .table tbody tr.fx-compbreak td { border-top: 1px solid var(--navy-300); }
  .table tbody tr.fx-datebreak td { border-top: 2px solid var(--navy-400); }
  .table tbody tr:first-child td { border-top: none; }
  /* !important is required, not decorative: canon sets `.table tr:hover td`
     with !important, so an ordinary rule here loses however specific it is.
     Equal specificity plus !important resolves on source order, and this
     sheet loads after the brand. */
  .table tbody tr.fx-national:hover  td { background-color: var(--comp-national-hover) !important; }
  .table tbody tr.fx-north:hover     td { background-color: var(--comp-north-hover) !important; }
  .table tbody tr.fx-south:hover     td { background-color: var(--comp-south-hover) !important; }
  .table tbody tr.fx-nlcup:hover     td { background-color: var(--comp-nlcup-hover) !important; }
  .table tbody tr.fx-facup:hover     td { background-color: var(--comp-facup-hover) !important; }
  .table tbody tr.fx-fatrophy:hover  td { background-color: var(--comp-fatrophy-hover) !important; }

  /* Home reads inward, away reads outward, so the crests meet either side
     of the middle and the eye lands on the fixture.

     display:flex, NOT inline-flex. An inline-flex box takes its baseline
     from its FIRST flex item, and these two cells are deliberately mirrored:
     home is text-then-crest, away is crest-then-text. So home baselined on
     its text and away on the bottom of its image, putting the away club 2px
     higher than the home club on every row. As a block-level flex box the
     cell's own vertical-align:middle does the work and both sit dead centre;
     the side it hugs comes from justify-content rather than text-align. */
  .fx-team { display: flex; align-items: center; gap: 7px;
             font-variation-settings: 'wght' 700; white-space: nowrap; }
  .fx-c-home .fx-team { justify-content: flex-end; }
  .fx-c-away .fx-team { justify-content: flex-start; }
  .fx-team img { width: 17px; height: 17px; object-fit: contain; flex: none; }

  /* The middle cell is the whole status system: kick-off before the game,
     the score after it, P–P or A–A when it did not happen. No prose.
     It is read as often as the team names, so it is sized to match them
     rather than treated as small print. */
  .fx-state { white-space: nowrap; font-variant-numeric: tabular-nums;
              font-variation-settings: 'wght' 700; font-size: 14px; color: var(--text); }
  .fx-state--score { font-variation-settings: 'wght' 900; }
  .fx-state--pp    { font-variation-settings: 'wght' 900; color: var(--purple); letter-spacing: .04em; }
  .fx-state--aa    { font-variation-settings: 'wght' 900; color: var(--amber);  letter-spacing: .04em; }

  /* Every column is sized except the action, which is left to absorb all the
     slack on a wide screen. Give it a width too and the leftover pools
     between Away and Comp instead, splitting the fixture from its label
     across half a screen of nothing. */
  .fx-c-md { width: 46px; font-variation-settings: 'wght' 900; color: var(--text-muted);
             font-variant-numeric: tabular-nums; }
  .fx-c-date { width: 112px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .fx-c-home, .fx-c-away { width: 250px; }
  .fx-c-state { width: 62px; }
  .fx-c-comp { width: 50px; font-size: 11px; font-variation-settings: 'wght' 900;
               letter-spacing: .06em; color: var(--text-muted); }
  /* No fixed width: the pills are full words and the action column absorbs
     whatever is left, so the column takes what it needs and gives it back
     when parts are toggled off. */
  .fx-c-tv { white-space: nowrap; }
  .fx-c-why { width: 190px; font-size: 12.5px; color: var(--text-muted); }
  .fx-c-prev { font-size: 12px; color: var(--text-muted); white-space: nowrap;
               font-variant-numeric: tabular-nums; }
  /* Matching line boxes in both columns, so the date and the reason it moved
     for sit on the same line as each other. */
  /* ABSOLUTE, not a multiplier: the two columns are 12px and 12.5px, so a
     relative line-height gives them different line boxes and the pairs drift
     apart by a pixel per row. */
  .fx-stack div { line-height: 19px; }
  .fx-stack div + div { margin-top: 1px; }
  /* Cells stay top-aligned once a row carries several moves, otherwise the
     stacks centre against each other and stop lining up. */
  .table--compact td.fx-stack { vertical-align: top !important; }
  .fx-c-wait { width: 92px; font-variant-numeric: tabular-nums;
               font-variation-settings: 'wght' 800; color: var(--purple); }
  .fx-mv-block { margin-bottom: 26px; }
  .fx-tv { display: inline-block; padding: 1px 7px; border-radius: var(--radius-pill);
           font-size: 9.5px; font-variation-settings: 'wght' 900; letter-spacing: .06em;
           vertical-align: 1px; margin-right: 4px; }
  .fx-tv--ww    { background: var(--green); color: var(--white); }
  .fx-tv--os    { background: var(--green-light); color: var(--green); }
  .fx-tv--tbc   { background: var(--off-white); color: var(--text-muted); border: 1px solid var(--border); }
  .fx-tv--off   { color: var(--text-muted); }
  .fx-tv--basic { background: var(--navy-100); color: var(--navy-600); }
  .fx-tv--enh   { background: var(--navy); color: var(--white); }
  .fx-tv--ami   { background: var(--primary); color: var(--white); }
  /* DAZN's own livery, which is why this one is not a brand token. */
  .fx-tv--dazn  { background: #000000; color: var(--white); }
  .fx-dow { color: var(--text-muted); font-variation-settings: 'wght' 700; }

  /* Row action, on canon .btn--icon (v2.33). The shape, the centring, the
     focus ring and the disabled state all come from there now; what is left
     is the two things that are genuinely about this table rather than a
     pattern a second tool has asked for.

     Size — canon is 30px, and on 552 rows the button rather than the content
     would set the row height. 22px is what lets a compact row be compact.
     Colour — no canon variant is quiet-until-hover, and 552 white bordered
     boxes read as 552 buttons instead of a table with an affordance in it.
     Either one becomes a canon candidate the moment a second tool wants it;
     one caller is not a standard. */
  .fx-act { width: 22px; height: 22px; border: 1px solid transparent;
            background: none; color: var(--text-muted); }
  .fx-act:hover { background: var(--navy-100); color: var(--navy);
                  border-color: var(--navy-200); }
  .fx-act .icon { width: 14px; height: 14px; }

  /* One control line: tabs left at their own width, season + actions right.
     Canon .tabs is display:flex with flex:1 tabs, so it fills whatever box
     it is given — the cap belongs on the wrapper, not on .tab. */
  .fx-bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
            margin-bottom: 16px; }
  .fx-bar .tabs { flex: 0 1 400px; margin-bottom: 0; }
  .fx-bar__right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .fx-season { font-size: 12px; font-variation-settings: 'wght' 800;
               letter-spacing: .06em; color: var(--text-muted);
               font-variant-numeric: tabular-nums; }

  /* .toolbar / .toolbar__left / .toolbar__filter / .filter-pill /
     .chip-group / .club-picker are all canon. The only thing this tool adds
     is a sensible width for the picker inside the strip. */
  .toolbar .club-picker { min-width: 210px; }

  .fx-tally { font-size: 12px; color: var(--text-muted); margin: 10px 2px 0; }

  /* Rearrangements pane */
  .fx-mv-head { font-size: 11.5px; font-variation-settings: 'wght' 800; letter-spacing: .05em;
                text-transform: uppercase; color: var(--text-muted); margin: 0 0 9px; }
  .fx-mv { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius-lg);
           padding: 12px 15px; margin-bottom: 8px; display: flex; align-items: center;
           gap: 14px; flex-wrap: wrap; }
  .fx-mv__fx { font-variation-settings: 'wght' 800; flex: 1; min-width: 190px; }
  .fx-mv__meta { font-size: 12.5px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
  .fx-mv__wait { font-size: 12.5px; font-variation-settings: 'wght' 800; color: var(--purple); }
  /* Canon .tab.active is a filled --primary pill, so the count needs its own
     treatment there or it disappears into the red. */
  .fx-tab-n { display: inline-block; min-width: 17px; padding: 0 5px; margin-left: 5px;
              border-radius: var(--radius-pill); background: var(--navy-100); color: var(--navy);
              font-size: 11px; font-variation-settings: 'wght' 800;
              font-variant-numeric: tabular-nums; text-align: center; }
  .tab.active .fx-tab-n { background: var(--white); color: var(--primary); }

  /* The line under a modal title. Repeated on five dialogs here, and every
     hand-built modal in the repo does something similar — a .modal__sub
     canon candidate, flagged rather than promoted on first use. */
  .fx-modal-sub { margin: 0 0 14px; }

  /* Detail + history */
  .fx-hist { list-style: none; margin: 11px 0 0; padding: 0; display: flex;
             flex-direction: column; gap: 9px; }
  .fx-hist li { border-left: 2px solid var(--navy-200); padding-left: 11px; }
  .fx-hist__t { font-variation-settings: 'wght' 800; font-size: 12.5px; }
  .fx-hist__d { font-size: 12px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
  .fx-hist__t { display: flex; align-items: baseline; gap: 8px; }
  .fx-hist__edit { border: none; background: none; padding: 0; cursor: pointer;
                   font-family: var(--font); font-size: 11px; color: var(--navy);
                   font-variation-settings: 'wght' 800; text-decoration: underline;
                   opacity: 0; transition: opacity .12s; }
  .fx-hist li:hover .fx-hist__edit, .fx-hist__edit:focus-visible { opacity: 1; }
  .fx-hist__amend { font-style: italic; }
  /* Wraps because a scored fixture gets a fourth action; four across squashes
     the labels in a default-width modal. */
  .fx-choice { display: flex; gap: 8px; flex-wrap: wrap; }
  .fx-choice .btn { flex: 1 1 120px; justify-content: center; }
  /* Broadcast block in the fixture dialog */
  .fx-bcast { margin-top: 16px; border-top: 1px solid var(--border); padding-top: 13px; }
  .fx-bcast .form-group { margin-bottom: 10px; }
  .fx-ticks { display: flex; flex-direction: column; gap: 7px; }
  .fx-tick { display: flex; align-items: center; gap: 8px; font-size: 13px;
             font-variation-settings: 'wght' 700; cursor: pointer; }
  .fx-tick input { margin: 0; }
  /* Greyed rather than hidden: "not applicable because the game is not being
     shown" is information, where a vanishing control is just confusing. */
  .fx-tick.is-off { color: var(--text-muted); cursor: default; }
  .fx-tick__hint { font-size: 11.5px; font-variation-settings: 'wght' 400;
                   color: var(--text-muted); }

  .fx-ref { margin-top: 16px; border-top: 1px solid var(--border); padding-top: 13px; }
  /* Deliberately NOT canon .disclosure (nl-brand v2.41): these summaries
     (.fx-ref, .fx-xtra below) are mini-caps inline label togglers inside a
     form panel — letterspaced uppercase --text-muted with the native marker
     kept — not weight-800 navy rows with a chevron and meta span. Different,
     smaller widget; the canon row would triple their visual weight. */
  .fx-ref summary { font-size: 11.5px; font-variation-settings: 'wght' 800; letter-spacing: .05em;
                    text-transform: uppercase; color: var(--text-muted); cursor: pointer; }
  .fx-ref dl { display: grid; grid-template-columns: auto 1fr; gap: 5px 14px;
               margin: 11px 0 0; font-size: 12.5px; }
  .fx-ref dt { color: var(--text-muted); font-variation-settings: 'wght' 700; }
  .fx-ref dd { margin: 0; font-variant-numeric: tabular-nums; }
  .fx-await { color: var(--amber); font-variation-settings: 'wght' 800; }
  .fx-none { color: var(--text-muted); font-style: italic; }
  .fx-link { border: none; background: none; color: var(--navy); font-family: var(--font);
             font-size: 12px; font-variation-settings: 'wght' 800; cursor: pointer;
             text-decoration: underline; padding: 0 2px; }

  /* Score entry */
  .fx-score { display: flex; align-items: flex-end; gap: 12px; justify-content: center; margin: 4px 0 2px; }
  .fx-score label { flex: 1; max-width: 190px; display: flex; flex-direction: column; gap: 5px; }
  .fx-score span { font-size: 12px; font-variation-settings: 'wght' 700;
                   color: var(--text-muted); text-align: center; }
  .fx-score input { text-align: center; font-size: 22px; font-variation-settings: 'wght' 900;
                    padding: 8px; font-variant-numeric: tabular-nums; }
  .fx-score__dash { font-size: 20px; font-variation-settings: 'wght' 900;
                    color: var(--text-muted); padding-bottom: 9px; }
  .fx-score--sm input { font-size: 16px; padding: 6px; }
  .fx-score--sm .fx-score__dash { font-size: 15px; padding-bottom: 7px; }
  .fx-xtra { margin-top: 14px; border-top: 1px solid var(--border); padding-top: 11px; }
  .fx-xtra summary { font-size: 11.5px; font-variation-settings: 'wght' 800; letter-spacing: .05em;
                     text-transform: uppercase; color: var(--text-muted); cursor: pointer; }
  .fx-xtra .fx-score { margin: 10px 0 0; }
  /* Marks a score that was not settled in 90 minutes, without spending the
     width a full "(1-1 aet, 4-3 p)" would cost in a 62px column. */
  .fx-xt { font-size: 9.5px; font-variation-settings: 'wght' 800; letter-spacing: .04em;
           color: var(--text-muted); margin-left: 3px; vertical-align: 2px; }

  /* Import wizard */
  .fx-steps { display: flex; gap: 6px; margin: 0 0 16px; font-size: 11px;
              font-variation-settings: 'wght' 800; letter-spacing: .05em;
              text-transform: uppercase; color: var(--text-muted); }
  .fx-steps span { padding: 3px 9px; border-radius: var(--radius-pill); background: var(--off-white); }
  .fx-steps span.is-on { background: var(--navy); color: var(--white); }
  .fx-needs { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 14px;
              font-size: 12px; color: var(--text-muted); align-items: center; }
  .fx-needs code { background: var(--off-white); border: 1px solid var(--border);
                   border-radius: var(--radius-sm); padding: 2px 7px; font-size: 11.5px;
                   font-variation-settings: 'wght' 700; color: var(--text); }
  .fx-map { display: grid; grid-template-columns: repeat(auto-fit, minmax(214px, 1fr)); gap: 10px; }
  .fx-map__sample { font-size: 11.5px; color: var(--text-muted); margin-top: 4px;
                    min-height: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fx-map__note { background: var(--blue-light); border: 1px solid var(--border);
                  border-radius: var(--radius); padding: 9px 12px; font-size: 12.5px; margin: 10px 0 0; }
  .fx-prev { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .fx-prev th { text-align: left; font-size: 10px; font-variation-settings: 'wght' 800;
                letter-spacing: .05em; text-transform: uppercase; color: var(--text-muted);
                padding: 6px 8px; border-bottom: 1px solid var(--border); }
  .fx-prev td { padding: 5px 8px; border-bottom: 1px solid var(--border); }
  .fx-prev tr:last-child td { border-bottom: none; }
  .fx-prev .is-bad { color: var(--primary); font-variation-settings: 'wght' 800; }
  .fx-prev .is-new { color: var(--text-muted); font-style: italic; }
  .fx-dupe { color: var(--amber); font-variation-settings: 'wght' 800; font-size: 11px; }
  .fx-scroll { max-height: 280px; overflow-y: auto; border: 1px solid var(--border);
               border-radius: var(--radius); }

  @media (max-width: 680px) {
    .fx-c-comp, .fx-c-tv { display: none; }
  }
</style>
</head>
<body>

<!-- Topbar — auto-rendered by /system/nl-topbar.js from window.NL_TOOL -->
<div id="nlTopbar"></div>

<div id="pageWrap">
  <div class="page">

    <!-- Staff get no page title: the topbar already says "Fixtures". A club
         user gets their club name, which the topbar does NOT show, so the
         whole header stays hidden until render() has something to put in it. -->
    <div class="page-header" id="fxHeader" hidden>
      <div class="page-header__titles">
        <h1 class="page-header__title" id="fxTitle"></h1>
      </div>
    </div>

    <!-- One control line: two tabs at their natural width, season and the
         two actions pushed right. The tabs used to span the full 1400px for
         the sake of two words each. -->
    <div class="fx-bar">
      <div class="tabs" role="tablist" aria-label="View">
        <button type="button" class="tab active" role="tab" aria-selected="true" data-fxtab="all">All fixtures</button>
        <button type="button" class="tab" role="tab" aria-selected="false" data-fxtab="moves">Rearrangements <span class="fx-tab-n" id="fxMoveCount">0</span></button>
      </div>
      <div class="fx-bar__right">
        <span class="fx-season" id="fxSub"></span>
        <button type="button" class="btn btn--ghost btn--sm" id="fxPairs">Travel table</button>
        <button type="button" class="btn btn--ghost btn--sm" id="fxExport">Export</button>
        <button type="button" class="btn btn--primary btn--sm" id="fxImport">Import fixtures</button>
      </div>
    </div>

      <div class="toolbar">
        <div class="toolbar__left">
          <div class="filter-pill-row" id="fxCompPills"></div>
          <div id="fxClubPicker"></div>
          <div class="chip-group" id="fxVenue" hidden>
            <button type="button" class="chip active" data-fxvenue="all">All</button>
            <button type="button" class="chip" data-fxvenue="home">Home</button>
            <button type="button" class="chip" data-fxvenue="away">Away</button>
          </div>
          <select class="toolbar__filter" id="fxMd" aria-label="Matchday"><option value="">All matchdays</option></select>
          <select class="toolbar__filter" id="fxWhy" aria-label="Reason" hidden><option value="">Any reason</option></select>
          <div class="filter-pill-row" id="fxTvPills" hidden>
            <span class="filter-pill-row__label">TV</span>
          </div>
        </div>
        <div class="toolbar__right">
          <button type="button" class="btn btn--ghost btn--sm" id="fxClear" hidden>Clear</button>
          <button type="button" class="btn btn--danger btn--sm" id="fxBulk">Delete shown&hellip;</button>
        </div>
      </div>

    <div id="fxPaneAll">

      <div class="table-wrap">
        <table class="table table--compact">
          <thead>
            <tr>
              <th class="fx-c-md">MD</th>
              <th class="fx-c-date">Date</th>
              <th class="fx-c-home ta-right">Home</th>
              <th class="fx-c-state ta-center">KO</th>
              <th class="fx-c-away">Away</th>
              <th class="fx-c-comp">Comp</th>
              <th class="fx-c-tv" id="fxThTv">TV</th>
              <th class="fx-c-act"></th>
            </tr>
          </thead>
          <tbody id="fxRows"></tbody>
        </table>
        <div class="empty-state" id="fxEmpty" hidden>
          <div class="empty-state__title">Nothing matches those filters</div>
          <div class="empty-state__text">Try removing a competition or club.</div>
        </div>
        <div class="loading-row" id="fxLoading">Loading fixtures…</div>
      </div>
      <p class="fx-tally" id="fxTally"></p>
    </div>

    <div id="fxPaneMoves" hidden></div>

  </div>
</div>

<!-- Main app -->
<script>
(function () {
  'use strict';

  /* =====================================================================
     DATA MODEL

     seasons/<season>/fixtures/<recordID>   the fixture
     seasons/<season>/history/<recordID>    append-only scheduling log
     seasons/<season>/notes/<recordID>      staff-only free text
     seasons/<season>/metrics/<recordID>    attendance, DAZN, later additions

     Split into separate nodes so the RTDB rules can enforce the visibility
     tiers: fixtures readable by any signed-in user, history auth-gated,
     notes staff-only. One object could not be separated later without a
     migration.

     recordID is assigned once and NEVER changes. For league fixtures it is
     the Opta ID (which already keys attendance submissions). For cup ties
     Opta issues nothing at creation, so one is minted. optaID is a separate
     nullable attribute — filling it in later must not rename the record,
     or the history and metrics would be orphaned.
     ===================================================================== */

  var BASE = 'app-data/ops-fixtures';
  var S = {
    season: null, session: null, role: null, isClub: false, club: null,
    fixtures: {}, history: {}, notes: {}, bcast: {}, pairs: {},
    tab: 'all', comps: {}, venue: 'all', md: '', club1: null, why: '', tv: {},
    picker: null, booted: false
  };

  var COMPS = ['National', 'North', 'South', 'NL Cup', 'FA Cup', 'FA Trophy'];
  var COMP_ORDER = { National: 1, North: 2, South: 3, 'NL Cup': 4, 'FA Cup': 5, 'FA Trophy': 6 };
  var COMP_SHORT = { National: 'NL', North: 'NLN', South: 'NLS',
                     'NL Cup': 'NLC', 'FA Cup': 'FAC', 'FA Trophy': 'FAT' };
  var COMP_CLASS = { National: 'fx-national', North: 'fx-north', South: 'fx-south',
                     'NL Cup': 'fx-nlcup', 'FA Cup': 'fx-facup', 'FA Trophy': 'fx-fatrophy' };
  /* Whether Opta issues an ID for this competition at all. A fact about the
     competition, not the tie — which is why it is not a placeholder value
     sitting in the fixture's optaID field. */
  var OPTA_EXPECTED = { National: true, North: true, South: true,
                        'NL Cup': true, 'FA Cup': false, 'FA Trophy': false };

  var REASONS = [];   /* loaded from assets/data/postponement-reasons.json */

  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return NL.escHtml(s); };

  /* ---- Dates + times --------------------------------------------------
     Stored as DD/MM/YYYY + HH:MM (24h). Display is UK match-listing style:
     "Sat 8 Aug 26", "3pm", "7.45pm". */
  var MO = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var MONTHS = { jan:1, feb:2, mar:3, apr:4, may:5, jun:6, jul:7, aug:8, sep:9, oct:10, nov:11, dec:12 };
  var MONTH_RE = '(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*';

  function sortKey(d) { var p = String(d).split('/'); return p[2] + p[1] + p[0]; }
  function prettyDate(d) { var p = String(d).split('/'); return (+p[0]) + ' ' + MO[+p[1] - 1] + ' ' + p[2].slice(2); }
  function dow(d) { var p = String(d).split('/'); return DOW[new Date(Date.UTC(+p[2], +p[1] - 1, +p[0])).getUTCDay()]; }
  function clock(t) {
    var p = String(t).split(':'), h = +p[0], m = +p[1];
    var hh = h % 12; if (hh === 0) hh = 12;
    return hh + (m ? '.' + String(m).padStart(2, '0') : '') + (h >= 12 ? 'pm' : 'am');
  }
  /* History stores a stamp (dd/mm/yyyy HH:MM), the fixture stores a bare
     date. Anything rendered as a date has to be trimmed to the date part or
     dow() splits on the wrong thing and yields "undefined". */
  function dateOnly(v) { return String(v || '').slice(0, 10); }
  function dateStr(d) {
    d = dateOnly(d);
    return '<span class="fx-dow">' + dow(d) + '</span> ' + esc(prettyDate(d));
  }
  function whenStr(d, t) { return dateStr(d) + ' &middot; ' + clock(t); }
  /* Same thing without markup, for anywhere the string is escaped on the way
     in (NL.confirm/prompt messages) rather than inserted as HTML. */
  function whenText(d, t) { return dow(d) + ' ' + prettyDate(d) + ' · ' + clock(t); }
  function toISO(d) { var p = String(d).split('/'); return p[2] + '-' + p[1] + '-' + p[0]; }
  function fromISO(v) { var p = String(v).split('-'); return p[2] + '/' + p[1] + '/' + p[0]; }
  function todayISO() { return new Date().toISOString().slice(0, 10); }
  function stamp() {
    var d = new Date(), p = function (n) { return String(n).padStart(2, '0'); };
    return p(d.getDate()) + '/' + p(d.getMonth() + 1) + '/' + d.getFullYear() + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }
  function parseStamp(s) {
    var m = /^(\d{2})\/(\d{2})\/(\d{4}) (\d{2}):(\d{2})$/.exec(s || '');
    return m ? Date.UTC(+m[3], +m[2] - 1, +m[1], +m[4], +m[5]) : null;
  }

  /* Accepts what spreadsheets actually produce: 13/10/2026, 13-10-2026,
     "Tue, 13 Oct 2026", "13 October 2026", "Oct 13, 2026", 2026-10-13.
     A leading weekday is discarded — it adds nothing and must not be
     mistaken for the day number. */
  function grabDate(v) {
    var str = String(v || '').trim();
    if (!str) return null;
    var pad = function (n) { return String(n).padStart(2, '0'); };
    var yr = function (y) { return String(y).length === 2 ? '20' + y : String(y); };
    var m;
    /* ISO first, so 2026-10-13 is never read as 26/10/13. */
    m = /(\d{4})-(\d{1,2})-(\d{1,2})/.exec(str);
    if (m) return pad(m[3]) + '/' + pad(m[2]) + '/' + m[1];
    m = new RegExp('(\\d{1,2})\\s*(?:st|nd|rd|th)?[\\s,.-]+' + MONTH_RE + '[\\s,.-]+(\\d{2,4})', 'i').exec(str);
    if (m) return pad(m[1]) + '/' + pad(MONTHS[m[2].slice(0, 3).toLowerCase()]) + '/' + yr(m[3]);
    m = new RegExp(MONTH_RE + '[\\s,.-]+(\\d{1,2})\\s*(?:st|nd|rd|th)?[\\s,.-]+(\\d{2,4})', 'i').exec(str);
    if (m) return pad(m[2]) + '/' + pad(MONTHS[m[1].slice(0, 3).toLowerCase()]) + '/' + yr(m[3]);
    m = /(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/.exec(str);
    if (m) return pad(m[1]) + '/' + pad(m[2]) + '/' + yr(m[3]);
    return null;
  }
  /* Reads 24-hour and 12-hour times. Dropping the am/pm marker turns
     "7:45 PM" into 07:45, so it is read explicitly. Returns {t, guessed};
     guessed flags a bare 1-10 o'clock, read as afternoon because no NL
     fixture kicks off at 3am — surfaced in the import preview, never
     applied silently. */
  function grabTime(v) {
    var str = String(v || '')
      .replace(/\d{4}-\d{1,2}-\d{1,2}/, '')
      .replace(/\d{1,2}[\/.-]\d{1,2}[\/.-]\d{2,4}/, '')
      .replace(new RegExp('\\d{1,2}\\s*(?:st|nd|rd|th)?[\\s,.-]+' + MONTH_RE + '[\\s,.-]+\\d{2,4}', 'i'), '');
    var m = /(\d{1,2})[:.](\d{2})/.exec(str);
    if (!m) return null;
    var h = +m[1], mm = m[2], guessed = false;
    var mer = /^\s*([ap])\.?\s*m\.?/i.exec(str.slice(m.index + m[0].length));
    if (mer) {
      var pm = mer[1].toLowerCase() === 'p';
      if (pm && h < 12) h += 12;
      if (!pm && h === 12) h = 0;
    } else if (h >= 1 && h <= 10) { h += 12; guessed = true; }
    return { t: String(h).padStart(2, '0') + ':' + mm, guessed: guessed };
  }
  function looksDate(v) { return grabDate(v) != null; }
  function looksTime(v) { return /\d{1,2}[:.]\d{2}/.test(v || ''); }

  /* ---- RTDB paths ------------------------------------------------------ */
  function seasonPath(node) { return BASE + '/seasons/' + S.season + '/' + node; }
  function canEdit() { return S.role === 'staff' || S.role === 'admin' || S.role === 'superadmin'; }

  /* ---- Boot ------------------------------------------------------------ */
  window.TOOL = window.TOOL || {};
  window.TOOL.boot = function (session) {
    if (S.booted) { S.session = session; return; }
    S.booted = true;
    S.session = session;
    S.role = NL.roles.norm(session && session.role);
    S.isClub = NL.isClubUser(session);
    try { S.tv = JSON.parse(localStorage.getItem('fx-tv') || '{}') || {}; } catch (e) { S.tv = {}; }
    S.club = session && session.club || null;

    NL.ensureAuth().then(function () {
      return Promise.all([NL.clubs.load(), loadReasons()]);
    }).then(function (res) {
      S.season = NL.season.current(res[0]);
      COMPS.forEach(function (c) { S.comps[c] = true; });
      return loadSeason();
    }).then(function () {
      wire();
      render();
      $('fxLoading').style.display = 'none';
    }).catch(function (err) {
      $('fxLoading').innerHTML = '<span style="color:var(--red);">Could not load fixtures: ' +
        esc(err && err.message || String(err)) + '</span>';
      console.error('[fixtures]', err);
    });
  };
  if (window._toolDeferredSession) {
    window.TOOL.boot(window._toolDeferredSession);
    delete window._toolDeferredSession;
  }

  function loadReasons() {
    return fetch('/assets/data/postponement-reasons.json', { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : { reasons: [] }; })
      .then(function (j) {
        REASONS = j.reasons || [];
        REASON_BY_CODE = {};
        REASONS.forEach(function (r) { REASON_BY_CODE[r.code] = r; });
      })
      .catch(function () { REASONS = []; });
  }

  /* History and notes are separate nodes with their own rules — a club
     user's read of either is expected to fail, so a denial is normal and
     must not break the page. */
  function loadSeason() {
    var db = firebase.database();
    var jobs = [db.ref(seasonPath('fixtures')).once('value').then(function (s) { S.fixtures = s.val() || {}; })];
    if (!S.isClub) {
      jobs.push(db.ref(seasonPath('history')).once('value')
        .then(function (s) { S.history = s.val() || {}; })
        .catch(function () { S.history = {}; }));
      jobs.push(db.ref(seasonPath('notes')).once('value')
        .then(function (s) { S.notes = s.val() || {}; })
        .catch(function () { S.notes = {}; }));
      jobs.push(db.ref(seasonPath('broadcast')).once('value')
        .then(function (s) { S.bcast = s.val() || {}; })
        .catch(function () { S.bcast = {}; }));
      jobs.push(db.ref(seasonPath('pairings')).once('value')
        .then(function (s) { S.pairs = s.val() || {}; })
        .catch(function () { S.pairs = {}; }));
    }
    return Promise.all(jobs);
  }

  function histOf(id) { var h = S.history[id]; return h ? (Array.isArray(h) ? h : Object.keys(h).sort().map(function (k) { return h[k]; })) : []; }

  function saveFixture(f) {
    return firebase.database().ref(seasonPath('fixtures') + '/' + f.recordID).set(f);
  }
  function appendHistory(id, entry) {
    var list = histOf(id).concat([entry]);
    S.history[id] = list;
    return firebase.database().ref(seasonPath('history') + '/' + id).set(list);
  }
  function saveNote(id, text) {
    if (!text) return Promise.resolve();
    var list = (S.notes[id] || []).concat([{ text: text, at: stamp(), by: S.session && S.session.uid || null }]);
    S.notes[id] = list;
    return firebase.database().ref(seasonPath('notes') + '/' + id).set(list);
  }

  /* ---- Selection ------------------------------------------------------- */
  function all() { return Object.keys(S.fixtures).map(function (k) { return S.fixtures[k]; }); }
  function visible() {
    return S.isClub
      ? all().filter(function (f) { return f.home === S.club || f.away === S.club; })
      : all();
  }
  function focusClub() { return S.isClub ? S.club : S.club1; }

  function filtered() {
    var c = focusClub();
    var out = visible().filter(function (f) {
      if (S.comps[f.competition] === false) return false;
      if (S.md && String(f.matchday) !== S.md) return false;
      if (c) {
        if (S.venue === 'home') return f.home === c;
        if (S.venue === 'away') return f.away === c;
        return f.home === c || f.away === c;
      }
      return true;
    });
    /* Date, then competition, then kick-off — so a date reads as a block
       and the tints group cleanly inside it. A postponed fixture keeps its
       original slot rather than dropping out of the run of play. */
    out.sort(function (a, b) {
      return sortKey(a.date).localeCompare(sortKey(b.date)) ||
        ((COMP_ORDER[a.competition] || 9) - (COMP_ORDER[b.competition] || 9)) ||
        String(a.kickoff).localeCompare(String(b.kickoff)) ||
        String(a.home).localeCompare(String(b.home));
    });
    return out;
  }

  /* ---- Render ---------------------------------------------------------- */
  /* Canon crestImgHtml plus loading="lazy", which must be in the parsed HTML
     (set after insertion the fetch has already started — same reason the old
     detached-element version was broken: wireCrestImg's property-assigned
     onerror never survived outerHTML serialisation, so the rose fallback was
     silently inert). Fallback wiring is now the wireCrestImgs sweep at each
     insertion point. */
  function crestImg(name) {
    return NL.clubs.crestImgHtml(name, 'thumb').replace('<img ', '<img loading="lazy" ');
  }

  /* Kick-off before the game, score after it, P–P or A–A when it did not
     happen. Nothing at all for a fixture that is simply on. */
  function stateCell(f) {
    if (f.status === 'postponed') return '<td class="fx-c-state ta-center fx-state fx-state--pp">P&ndash;P</td>';
    if (f.status === 'abandoned') return '<td class="fx-c-state ta-center fx-state fx-state--aa">A&ndash;A</td>';
    if (f.homeScore != null && f.awayScore != null) {
      return '<td class="fx-c-state ta-center fx-state fx-state--score">' + f.homeScore + '&ndash;' + f.awayScore +
        /* Both markers when both apply. Penalties do NOT imply extra time:
           the NL Cup goes straight to a shootout for the bonus point, so
           "p" on its own is a real and common state. */
        (f.aetHome != null ? '<span class="fx-xt">aet</span>' : '') +
        (f.penHome != null ? '<span class="fx-xt">p</span>' : '') + '</td>';
    }
    return '<td class="fx-c-state ta-center fx-state">' + clock(f.kickoff) + '</td>';
  }

  /* A row action on 552 rows is a 33px-tall button repeated 552 times — it,
     not the text, was setting the row height. An icon carries the same
     affordance in a third of the space.
     This is canon .btn--icon since brand v2.33; .fx-act is now the size and
     the quiet colour only, not a second copy of the shape.
     Pen when you can change the fixture, eye when you can only look at it —
     the icon states the permission before the click, which is a better answer
     than a button that is there but does nothing, or one that vanishes and
     leaves the question open. club-directory/editor does the same. */
  function actBtn(f) {
    var edit = canEdit();
    return '<button type="button" class="btn btn--icon fx-act" data-fxopen="' + esc(f.recordID) +
      '" title="' + (edit ? 'Change this fixture' : 'View this fixture') +
      '" aria-label="' + (edit ? 'Change ' : 'View ') + esc(f.home) + ' v ' + esc(f.away) + '">' +
      '<svg class="icon icon--sm" aria-hidden="true"><use href="/assets/icons/sprites.svg#icon-' +
      (edit ? 'edit' : 'eye') + '"></use></svg></button>';
  }

  function render() {
    /* Only show a heading when it says something the topbar doesn't. */
    var heading = S.isClub ? (S.club || '') : '';
    $('fxTitle').textContent = heading;
    $('fxHeader').hidden = !heading;
    $('fxSub').textContent = NL.season.label(NL.clubs.meta(), S.season) || S.season;
    /* Only offer the toggles once there is broadcast data to toggle. */
    var hasTv = Object.keys(S.bcast).length > 0;
    $('fxTvPills').hidden = !hasTv || S.isClub;
    if (hasTv) {
      var row = $('fxTvPills');
      if (!row.querySelector('[data-fxtv]')) {
        row.insertAdjacentHTML('beforeend', TV_PARTS.map(function (p) {
          return '<button type="button" class="filter-pill" data-fxtv="' + p.key + '">' +
            esc(p.label) + '</button>';
        }).join(''));
      }
      row.querySelectorAll('[data-fxtv]').forEach(function (b) {
        b.classList.toggle('active', tvOn(b.getAttribute('data-fxtv')));
      });
    }
    $('fxThTv').hidden = !anyTv();
    $('fxVenue').hidden = !focusClub();
    if (!focusClub() && S.venue !== 'all') S.venue = 'all';
    /* In club view the club is the whole page, and a club sits in one
       competition band — neither control has anything left to offer. */
    $('fxClubPicker').hidden = S.isClub;
    $('fxCompPills').hidden = S.isClub;
    $('fxClear').hidden = !(S.club1 || S.md || S.why || S.venue !== 'all' ||
      COMPS.some(function (c) { return !S.comps[c]; }));

    /* The rearrangements list obeys the same filters as the fixture list —
       it is the same fixtures, so "show me Morecambe" should mean the same
       thing on both tabs. The toolbar now sits above both panes rather than
       inside the fixtures one, which is why it could not before. */
    var moves = movesSet();
    /* Reason only means anything here, and only once something has moved. */
    $('fxWhy').hidden = !(S.tab === 'moves' && moves.length);
    $('fxTvPills').hidden = $('fxTvPills').hidden || S.tab === 'moves';
    if (S.tab === 'moves' && moves.length) fillReasons(moves);
    $('fxMoveCount').textContent = movesSet(true).length;
    if (S.tab === 'moves') { renderMoves(moves); return; }

    var rows = filtered(), prev = null;
    $('fxRows').innerHTML = rows.map(function (f) {
      var cls = COMP_CLASS[f.competition] || '';
      if (!prev || f.date !== prev.date) cls += ' fx-datebreak';
      else if (f.competition !== prev.competition) cls += ' fx-compbreak';
      else if (f.kickoff !== prev.kickoff) cls += ' fx-kobreak';
      prev = f;
      return '<tr class="' + cls + '">' +
        '<td class="fx-c-md">' + esc(f.matchday || '—') + '</td>' +
        '<td class="fx-c-date">' + dateStr(f.date) + '</td>' +
        '<td class="fx-c-home ta-right"><span class="fx-team">' + esc(f.home) + crestImg(f.home) + '</span></td>' +
        stateCell(f) +
        '<td class="fx-c-away"><span class="fx-team">' + crestImg(f.away) + esc(f.away) + '</span></td>' +
        '<td class="fx-c-comp">' + esc(COMP_SHORT[f.competition] || f.competition) + '</td>' +
        bcastCell(f) +
        '<td class="fx-c-act ta-right">' + actBtn(f) + '</td>' +
        '</tr>';
    }).join('');
    NL.clubs.wireCrestImgs($('fxRows'));
    $('fxEmpty').hidden = rows.length > 0;
    $('fxTally').textContent = rows.length === visible().length
      ? rows.length + ' fixtures'
      : rows.length + ' of ' + visible().length + ' fixtures';
  }

  /* Rebuilt whenever the reasons file lands; one lookup shared by the history
     block and the rearrangements table. */
  var REASON_BY_CODE = {};

  /* Everything that has moved, through the ordinary filters. `ignoreWhy`
     is for the tab badge, which should count what has moved rather than
     what survives a reason filter the user may have left set. */
  function movesSet(ignoreWhy) {
    return filtered().filter(function (f) {
      if (f.status !== 'postponed' && f.status !== 'rearranged') return false;
      if (!ignoreWhy && S.why) {
        return histOf(f.recordID).some(function (e) { return e.reasonCode === S.why; });
      }
      return true;
    });
  }

  /* Only offer reasons that actually occur in what is showing. A dropdown of
     19 options where 16 match nothing is a worse control than no dropdown. */
  function fillReasons(moves) {
    var seen = {};
    moves.forEach(function (f) {
      histOf(f.recordID).forEach(function (e) { if (e.reasonCode) seen[e.reasonCode] = 1; });
    });
    var sel = $('fxWhy');
    var codes = Object.keys(seen).sort(function (a, b) {
      return (REASON_BY_CODE[a] ? REASON_BY_CODE[a].label : a)
        .localeCompare(REASON_BY_CODE[b] ? REASON_BY_CODE[b].label : b);
    });
    var want = 'Any reason|' + codes.join('|');
    if (sel.getAttribute('data-built') === want) { sel.value = S.why; return; }
    sel.setAttribute('data-built', want);
    sel.innerHTML = '<option value="">Any reason</option>' + codes.map(function (c) {
      return '<option value="' + esc(c) + '">' +
        esc(REASON_BY_CODE[c] ? REASON_BY_CODE[c].label : c) + '</option>';
    }).join('');
    sel.value = S.why;
  }

  function renderMoves(moves) {
    var pane = $('fxPaneMoves');
    if (!moves.length) {
      pane.innerHTML = '<div class="empty-state">' +
        '<div class="empty-state__title">Nothing has moved yet</div>' +
        '<div class="empty-state__text">Postponed and rearranged fixtures collect here.</div></div>';
      return;
    }
    var waiting = moves.filter(function (f) { return f.status === 'postponed'; });
    var done = moves.filter(function (f) { return f.status === 'rearranged'; });
    pane.innerHTML = mvGroup('Awaiting a new date', waiting, true) + mvGroup('Rearranged', done, false);
    NL.clubs.wireCrestImgs(pane);
  }

  /* The same table as the main list, not a card stack. It is the same data
     read the same way — crests, competition tint, break lines — and having
     two visual languages for one set of fixtures was the whole complaint.
     What changes is the columns: when it was called off, and how long it has
     been waiting, in place of kick-off. */
  /* Sat, 15 Aug 2026 (3pm) — the kick-off in the same 12-hour form the rest
     of the tool uses, rather than the 19:45 the data is stored in. */
  function whenLong(d, t) {
    d = dateOnly(d);
    var q = String(d).split('/');
    return dow(d) + ', ' + (+q[0]) + ' ' + MO[+q[1] - 1] + ' ' + q[2] + ' (' + clock(t) + ')';
  }

  /* One line per move: the slot the fixture held, and the reason it came off
     it. Paired rather than listed as two separate collections, because a
     deduplicated list of reasons cannot be lined up against a list of dates —
     you could see "waterlogged, police" and three dates and not know which
     was which. Read from the history, since the fixture only remembers where
     it is now and where it started. */
  function moveLines(f) {
    var out = [];
    histOf(f.recordID).forEach(function (e) {
      if (e.type !== 'postponed' && e.type !== 'rescheduled') return;
      if (!e.from) return;
      var t = e.from.slice(11) || f.originalKickoff || f.kickoff;
      var r = REASON_BY_CODE[e.reasonCode];
      out.push({ when: whenLong(dateOnly(e.from), t), why: r ? r.label : null });
    });
    return out;
  }

  /* The same table as the main list, not a card stack: same crests, tints and
     break lines. What changes is what the columns answer. */
  function mvGroup(title, list, waiting) {
    if (!list.length) return '';
    var prev = null;
    return '<div class="fx-mv-block"><p class="fx-mv-head">' + esc(title) + ' (' + list.length + ')</p>' +
      '<div class="table-wrap"><table class="table table--compact"><thead><tr>' +
      '<th class="fx-c-md">MD</th>' +
      (waiting ? '' : '<th class="fx-c-date">Now</th>') +
      '<th class="fx-c-home ta-right">Home</th>' +
      '<th class="fx-c-state ta-center">' + (waiting ? 'P&ndash;P' : 'KO') + '</th>' +
      '<th class="fx-c-away">Away</th>' +
      '<th class="fx-c-comp">Comp</th>' +
      '<th class="fx-c-prev">Previously</th>' +
      '<th class="fx-c-why">Reason</th>' +
      (waiting ? '<th class="fx-c-wait ta-right">Waiting</th>' : '') +
      '<th class="fx-c-act"></th></tr></thead><tbody>' +
      list.map(function (f) {
        var h = histOf(f.recordID);
        var last = h[h.length - 1] || {};
        var cls = COMP_CLASS[f.competition] || '';
        var key = waiting ? (dateOnly(last.from) || f.date) : f.date;
        if (!prev || key !== prev) cls += ' fx-datebreak';
        prev = key;
        var lines = moveLines(f);
        return '<tr class="' + cls + '">' +
          '<td class="fx-c-md">' + esc(f.matchday || '\u2014') + '</td>' +
          (waiting ? '' : '<td class="fx-c-date">' + dateStr(f.date) + '</td>') +
          '<td class="fx-c-home ta-right"><span class="fx-team">' + esc(f.home) + crestImg(f.home) + '</span></td>' +
          (waiting
            ? '<td class="fx-c-state ta-center fx-state fx-state--pp">P&ndash;P</td>'
            : '<td class="fx-c-state ta-center fx-state">' + clock(f.kickoff) + '</td>') +
          '<td class="fx-c-away"><span class="fx-team">' + crestImg(f.away) + esc(f.away) + '</span></td>' +
          '<td class="fx-c-comp">' + esc(COMP_SHORT[f.competition] || f.competition) + '</td>' +
          /* Both columns stack one line per move, so they read across as
             pairs and the row grows with the number of moves. */
          '<td class="fx-c-prev fx-stack">' + (lines.length
            ? lines.map(function (l) { return '<div>' + esc(l.when) + '</div>'; }).join('')
            : '<span class="fx-none">\u2014</span>') + '</td>' +
          '<td class="fx-c-why fx-stack">' + (lines.length
            ? lines.map(function (l) {
                return '<div>' + (l.why ? esc(l.why) : '<span class="fx-none">not given</span>') + '</div>';
              }).join('')
            : '<span class="fx-none">not given</span>') + '</td>' +
          (waiting ? '<td class="fx-c-wait ta-right">' + esc(daysSince(last.effectiveAt)) + '</td>' : '') +
          '<td class="fx-c-act ta-right">' + actBtn(f) + '</td>' +
          '</tr>';
      }).join('') + '</tbody></table></div></div>';
  }



  function daysSince(s) {
    var t = parseStamp(s);
    if (!t) return '';
    var d = Math.max(0, Math.round((Date.now() - t) / 864e5));
    return d === 0 ? 'today' : d + ' day' + (d === 1 ? '' : 's') + ' waiting';
  }
  /* Each postponement pairs with the next rescheduling. A fixture moved
     straight to a new date never enters the waiting state, so it
     contributes nothing here rather than a misleading zero. A correction
     cancels an open postponement so a mistake never counts as a wait. */
  function waitDays(f) {
    var out = [], open = null;
    histOf(f.recordID).forEach(function (h) {
      if (h.type === 'postponed') open = h;
      else if (h.type === 'corrected') open = null;
      else if (h.type === 'rescheduled' && open) {
        var a = parseStamp(open.effectiveAt), b = parseStamp(h.effectiveAt);
        if (a && b) out.push(Math.max(0, Math.round((b - a) / 864e5)) + ' days');
        open = null;
      }
    });
    return out;
  }

  /* ---- Detail ---------------------------------------------------------- */
  function open(id) {
    var f = S.fixtures[id];
    if (!f) return;
    if (!canEdit()) return openRead(f);
    openEdit(f);
  }

  /* Club view: current date, a marker, no reasons, no history. */
  function openRead(f) {
    NL.modal({
      title: f.home + ' v ' + f.away,
      size: 'sm',
      body: '<p class="text-secondary fx-modal-sub">' +
        esc(f.competition) + (f.matchday ? ' &middot; Matchday ' + esc(f.matchday) : '') + '</p>' +
        '<div class="form-group"><label>When</label><div>' +
        (f.status === 'postponed'
          ? '<strong>Postponed</strong> &mdash; a new date has not been set yet.'
          : whenStr(f.date, f.kickoff)) + '</div></div>',
      buttons: [{ label: 'Close', className: 'btn btn--ghost', onClick: function (c) { c.close(); } }]
    });
  }

  function openEdit(f) {
    var body = '<p class="text-secondary fx-modal-sub">' +
      esc(f.competition) + (f.matchday ? ' &middot; Matchday ' + esc(f.matchday) : '') + ' &middot; ' +
      (f.status === 'postponed' ? 'awaiting a new date' : whenStr(f.date, f.kickoff)) + '</p>' +
      '<div class="fx-choice">' +
      (f.status === 'postponed' || f.status === 'abandoned'
        ? (f.status === 'postponed' ? '<button type="button" class="btn btn--ghost" data-act="date">Set new date</button>' : '') +
          '<button type="button" class="btn btn--ghost" data-act="reinstate">Reinstate</button>'
        : '<button type="button" class="btn btn--ghost" data-act="postpone">Postpone</button>' +
          '<button type="button" class="btn btn--ghost" data-act="rearrange">Rearrange</button>' +
          '<button type="button" class="btn btn--ghost" data-act="result">Result</button>' +
          /* A score entered by mistake has to come off. Without this the only
             ways out were Abandoned, which is a lie, or deleting the fixture. */
          (f.homeScore != null && f.awayScore != null
            ? '<button type="button" class="btn btn--ghost" data-act="clearresult">Remove result</button>'
            : '')) +
      '</div>' + bcastBlock(f) + historyBlock(f) + refBlock(f);

    var buttons = [
      { label: 'Delete fixture', className: 'btn btn--danger',
        onClick: function (c) { c.close(); confirmDelete(f); } },
      { label: 'Close', className: 'btn btn--ghost', onClick: function (c) { c.close(); } }
    ];

    var ctrl = NL.modal({
      title: f.home + ' v ' + f.away, body: body, buttons: buttons, footerSplit: true
    });
    ctrl.body.querySelectorAll('[data-act]').forEach(function (b) {
      b.addEventListener('click', function () {
        var a = b.getAttribute('data-act');
        ctrl.close();
        if (a === 'postpone') formPostpone(f);
        else if (a === 'rearrange') formRearrange(f, false);
        else if (a === 'date') formRearrange(f, true);
        else if (a === 'result') formResult(f);
        else if (a === 'clearresult') clearResult(f);
        else if (a === 'reinstate') reinstate(f);
      });
    });
    ctrl.body.querySelectorAll('[data-fxopta]').forEach(function (b) {
      b.addEventListener('click', function () { ctrl.close(); askOpta(f); });
    });
    ctrl.body.querySelectorAll('[data-fxhist]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        ctrl.close();
        editHistory(f, +btn.getAttribute('data-fxhist'));
      });
    });
    wireBcast(ctrl, f);
  }

  function reasonField(typical) {
    if (!REASONS.length) return '';
    var opts = REASONS.slice().sort(function (a, b) {
      var am = a.typical === typical || a.typical === 'either';
      var bm = b.typical === typical || b.typical === 'either';
      return (bm - am) || a.label.localeCompare(b.label);
    });
    return '<div class="form-group"><label>Reason</label><select id="fxReason">' +
      opts.map(function (r) { return '<option value="' + esc(r.code) + '">' + esc(r.label) + '</option>'; }).join('') +
      '</select></div>';
  }

  /* Postponed: an effective date, but NO new fixture date. */
  function formPostpone(f) {
    var ctrl = NL.modal({
      title: 'Postpone',
      body: '<p class="text-secondary fx-modal-sub">' +
        esc(f.home) + ' v ' + esc(f.away) + ' &middot; ' + whenStr(f.date, f.kickoff) + '</p>' +
        '<div class="form-group"><label>Called off</label><div class="datetime-row">' +
        '<input type="date" id="fxEffD" value="' + todayISO() + '">' +
        '<input type="time" id="fxEffT" value="12:00"></div></div>' +
        reasonField('postponed') +
        '<div class="form-group"><label>Note &mdash; staff only</label>' +
        '<textarea id="fxNote" rows="2"></textarea></div>',
      buttons: [
        { label: 'Cancel', className: 'btn btn--ghost', onClick: function (c) { c.close(); } },
        { label: 'Mark postponed', className: 'btn btn--primary', autofocus: true, onClick: function (c) {
            var entry = {
              type: 'postponed', from: f.date + ' ' + f.kickoff, to: null,
              effectiveAt: fromISO($('fxEffD').value) + ' ' + $('fxEffT').value,
              recordedAt: stamp(), by: S.session && S.session.uid || null,
              reasonCode: $('fxReason') ? $('fxReason').value : null
            };
            f.status = 'postponed';
            Promise.all([saveFixture(f), appendHistory(f.recordID, entry),
                         saveNote(f.recordID, $('fxNote').value.trim())])
              .then(function () {
                NL.writeAudit('fixture_postponed', { recordID: f.recordID, reason: entry.reasonCode });
                c.close(); render(); NL.toast('Marked postponed', 'success');
              })
              .catch(function (e) { NL.toast('Could not save: ' + (e.message || e), 'error'); });
          } }
      ]
    });
    return ctrl;
  }

  /* Rearranged: both an effective date AND the new fixture date. */
  function formRearrange(f, fromPostponed) {
    NL.modal({
      title: fromPostponed ? 'Set new date' : 'Rearrange',
      body: '<p class="text-secondary fx-modal-sub">' +
        esc(f.home) + ' v ' + esc(f.away) +
        (fromPostponed ? ' &middot; awaiting a date' : ' &middot; currently ' + whenStr(f.date, f.kickoff)) + '</p>' +
        '<div class="form-group"><label>New date</label><div class="datetime-row">' +
        '<input type="date" id="fxNewD" value="' + toISO(f.date) + '">' +
        '<input type="time" id="fxNewT" value="' + esc(f.kickoff) + '"></div></div>' +
        '<div class="form-group"><label>Agreed</label><div class="datetime-row">' +
        '<input type="date" id="fxEffD" value="' + todayISO() + '">' +
        '<input type="time" id="fxEffT" value="12:00"></div></div>' +
        reasonField(fromPostponed ? 'either' : 'rescheduled') +
        '<div class="form-group"><label>Note &mdash; staff only</label>' +
        '<textarea id="fxNote" rows="2"></textarea></div>',
      buttons: [
        { label: 'Cancel', className: 'btn btn--ghost', onClick: function (c) { c.close(); } },
        { label: 'Save new date', className: 'btn btn--primary', autofocus: true, onClick: function (c) {
            if (!$('fxNewD').value) { NL.toast('Pick a new date first', 'info'); return; }
            var nd = fromISO($('fxNewD').value), nk = $('fxNewT').value || '15:00';
            var entry = {
              type: 'rescheduled',
              from: fromPostponed ? null : f.date + ' ' + f.kickoff,
              to: nd + ' ' + nk,
              effectiveAt: fromISO($('fxEffD').value) + ' ' + $('fxEffT').value,
              recordedAt: stamp(), by: S.session && S.session.uid || null,
              reasonCode: $('fxReason') ? $('fxReason').value : null
            };
            f.date = nd; f.kickoff = nk; f.status = 'rearranged';
            Promise.all([saveFixture(f), appendHistory(f.recordID, entry),
                         saveNote(f.recordID, $('fxNote').value.trim())])
              .then(function () {
                NL.writeAudit('fixture_rearranged', { recordID: f.recordID, to: entry.to });
                c.close(); render();
                NL.toast('Moved to ' + dow(nd) + ' ' + prettyDate(nd) + ' · ' + clock(nk), 'success');
              })
              .catch(function (e) { NL.toast('Could not save: ' + (e.message || e), 'error'); });
          } }
      ]
    });
  }

  function formResult(f) {
    NL.modal({
      title: 'Result',
      body: '<p class="text-secondary fx-modal-sub">' +
        esc(f.home) + ' v ' + esc(f.away) + ' &middot; ' + whenStr(f.date, f.kickoff) + '</p>' +
        '<div class="fx-score">' +
        '<label><span>' + esc(f.home) + '</span><input type="number" id="fxHS" min="0" max="99" value="' +
          (f.homeScore == null ? '' : f.homeScore) + '"></label>' +
        '<span class="fx-score__dash">&ndash;</span>' +
        '<label><span>' + esc(f.away) + '</span><input type="number" id="fxAS" min="0" max="99" value="' +
          (f.awayScore == null ? '' : f.awayScore) + '"></label></div>' +
        /* Folded away: extra time and penalties apply to a handful of cup ties
           a season, and a league result should not have to walk past four
           empty boxes. Opens itself only when there is already something in
           them. */
        '<details class="fx-xtra"' + (f.aetHome != null || f.penHome != null ? ' open' : '') + '>' +
        '<summary>Extra time / penalties</summary>' +
        '<div class="fx-score fx-score--sm">' +
        '<label><span>AET ' + esc(f.home) + '</span><input type="number" id="fxAetH" min="0" max="99" value="' +
          (f.aetHome == null ? '' : f.aetHome) + '"></label>' +
        '<span class="fx-score__dash">&ndash;</span>' +
        '<label><span>AET ' + esc(f.away) + '</span><input type="number" id="fxAetA" min="0" max="99" value="' +
          (f.aetAway == null ? '' : f.aetAway) + '"></label></div>' +
        '<div class="fx-score fx-score--sm">' +
        '<label><span>Pens ' + esc(f.home) + '</span><input type="number" id="fxPenH" min="0" max="99" value="' +
          (f.penHome == null ? '' : f.penHome) + '"></label>' +
        '<span class="fx-score__dash">&ndash;</span>' +
        '<label><span>Pens ' + esc(f.away) + '</span><input type="number" id="fxPenA" min="0" max="99" value="' +
          (f.penAway == null ? '' : f.penAway) + '"></label></div>' +
        '<p class="form-hint">Leave blank unless the tie went that far. The score above stays the ' +
        '90-minute score. Penalties can be filled in without extra time &mdash; the NL Cup goes ' +
        'straight to a shootout.</p>' +
        '</details>',
      footerSplit: true,
      buttons: [
        { label: 'Abandoned', className: 'btn btn--ghost', onClick: function (c) {
            f.status = 'abandoned'; clearScores(f);
            saveFixture(f).then(function () {
              NL.writeAudit('fixture_abandoned', { recordID: f.recordID });
              c.close(); render(); NL.toast('Marked abandoned', 'success');
            });
          } },
        { label: 'Cancel', className: 'btn btn--ghost', onClick: function (c) { c.close(); } },
        { label: 'Save', className: 'btn btn--primary', autofocus: true, onClick: function (c) {
            var h = $('fxHS').value, a = $('fxAS').value;
            if (h === '' || a === '') { NL.toast('Enter both scores', 'info'); return; }
            /* A half-entered pair is worse than none: it would render as
               "3-null aet". Both or neither. */
            var pair = function (hi, ai, label) {
              var x = $(hi).value, y = $(ai).value;
              if (x === '' && y === '') return [null, null];
              if (x === '' || y === '') { NL.toast('Enter both ' + label + ' scores, or neither', 'info'); return null; }
              return [+x, +y];
            };
            var aet = pair('fxAetH', 'fxAetA', 'extra-time');
            if (!aet) return;
            var pen = pair('fxPenH', 'fxPenA', 'penalty');
            if (!pen) return;
            var commit = function () {
              f.homeScore = +h; f.awayScore = +a; f.status = 'played';
              f.aetHome = aet[0]; f.aetAway = aet[1];
              f.penHome = pen[0]; f.penAway = pen[1];
              saveFixture(f).then(function () {
                NL.writeAudit('fixture_result', { recordID: f.recordID, score: scoreText(f) });
                c.close(); render(); NL.toast('Result saved', 'success');
              });
            };
            /* Warn, don't block. A result on a future date is nearly always a
               slip, but it is also how you'd correct a fixture whose date is
               wrong — so the way out is a confirmation, not a locked door. */
            if (toISO(f.date) > todayISO()) {
              NL.confirm(f.home + ' v ' + f.away + ' is not until ' + whenText(f.date, f.kickoff) + '.', {
                title: 'That game has not been played yet',
                detail: 'Check the date is right before saving — a result on the wrong fixture is easy to miss.',
                confirmText: 'Save anyway', variant: 'danger'
              }).then(function (ok) { if (ok) commit(); });
            } else { commit(); }
          } }
      ]
    });
  }

  /* Undo a P–P or A–A entered by mistake. The log keeps a `corrected`
     entry rather than deleting history — if a postponement could be
     silently erased the audit trail would stop being trustworthy. */
  function reinstate(f) {
    var was = f.status;
    var entry = { type: 'corrected', from: was, to: 'scheduled', effectiveAt: null,
                  recordedAt: stamp(), by: S.session && S.session.uid || null, reasonCode: null };
    f.status = 'scheduled'; clearScores(f);
    Promise.all([saveFixture(f), appendHistory(f.recordID, entry)]).then(function () {
      NL.writeAudit('fixture_reinstated', { recordID: f.recordID, was: was });
      render();
      NL.toast('Reinstated — ' + (was === 'abandoned' ? 'A–A' : 'P–P') + ' removed', 'success');
    });
  }

  /* Correcting a history entry.

     The log is append-only for a reason: "it was postponed, then rearranged"
     is a record you have to be able to trust. But a MIS-KEYED reason is not
     an event — nothing happened when Police was picked instead of Weather,
     the finger slipped. Appending "reason changed" for that would be
     recording the typo as though it were history.

     So the reason is edited in place and the entry keeps reasonWas, marked
     "(reason corrected)" underneath, which preserves the audit trail without
     inventing a timeline event.

     Deleting the entry outright is the harder escape hatch, for the case
     where the entry should never have existed at all. It is a genuine loss,
     so it is confirmed separately and says what it costs: the wait-time
     figures are computed from these entries. */
  function editHistory(f, idx) {
    var list = histOf(f.recordID).slice();
    var e = list[idx];
    if (!e) return;
    var when = e.type === 'postponed' ? 'Postponed from ' + e.from
             : e.type === 'rescheduled' ? (e.from ? 'Moved from ' + e.from + ' to ' + e.to : 'Date set: ' + e.to)
             : 'Correction';
    var opts = REASONS.slice().sort(function (a, b) { return a.label.localeCompare(b.label); });
    var ctrl = NL.modal({
      title: 'Correct this entry',
      body: '<p class="text-secondary fx-modal-sub">' + esc(f.home) + ' v ' + esc(f.away) +
        ' &middot; ' + esc(when) + ' &middot; recorded ' + esc(e.recordedAt) + '</p>' +
        '<div class="form-group"><label for="fxHrsn">Reason</label><select id="fxHrsn">' +
        '<option value="">&mdash; none &mdash;</option>' +
        opts.map(function (r) {
          return '<option value="' + esc(r.code) + '"' +
            (r.code === e.reasonCode ? ' selected' : '') + '>' + esc(r.label) + '</option>';
        }).join('') + '</select></div>' +
        (e.effectiveAt
          ? '<div class="form-group"><label for="fxHeff">Decided on</label>' +
            '<input type="date" id="fxHeff" value="' + esc(toISO(e.effectiveAt.slice(0, 10))) + '">' +
            '<p class="form-hint">The date the decision was taken, which is what the waiting time is measured from.</p></div>'
          : ''),
      footerSplit: true,
      buttons: [
        { label: 'Remove entry', className: 'btn btn--danger', onClick: function (c) {
            c.close(); removeHistory(f, idx);
          } },
        { label: 'Cancel', className: 'btn btn--ghost', onClick: function (c) { c.close(); } },
        { label: 'Save', className: 'btn btn--primary', autofocus: true, onClick: function (c) {
            var code = ctrl.body.querySelector('#fxHrsn').value || null;
            var effEl = ctrl.body.querySelector('#fxHeff');
            var eff = effEl && effEl.value ? fromISO(effEl.value) + (e.effectiveAt.slice(10) || '') : e.effectiveAt;
            if (code === e.reasonCode && eff === e.effectiveAt) { c.close(); return; }
            var next = {};
            Object.keys(e).forEach(function (k) { next[k] = e[k]; });
            if (code !== e.reasonCode) {
              /* Only stamp the first correction: reasonWas should say what it
                 was originally, not what it was one edit ago. */
              if (next.reasonWas === undefined) next.reasonWas = e.reasonCode || null;
              next.reasonCode = code;
            }
            next.effectiveAt = eff;
            next.amendedAt = stamp();
            next.amendedBy = (S.session && S.session.uid) || null;
            list[idx] = next;
            S.history[f.recordID] = list;
            firebase.database().ref(seasonPath('history') + '/' + f.recordID).set(list)
              .then(function () {
                NL.writeAudit('fixture_history_amended', { recordID: f.recordID, entry: idx + 1, reason: code });
                c.close(); render(); NL.toast('Entry corrected', 'success');
              })
              .catch(function (err) { NL.toast('Could not save \u2014 ' + ((err && err.message) || err), 'error'); });
          } }
      ]
    });
  }

  function removeHistory(f, idx) {
    var list = histOf(f.recordID).slice();
    var e = list[idx];
    if (!e) return;
    NL.confirm(f.home + ' v ' + f.away, {
      title: 'Remove this history entry?',
      detail: 'The entry goes for good, and the waiting-time figures are worked out from these entries, so they will change. ' +
        'The fixture itself and its current date are not affected.',
      confirmText: 'Remove', variant: 'danger'
    }).then(function (ok) {
      if (!ok) return;
      list.splice(idx, 1);
      S.history[f.recordID] = list;
      var ref = firebase.database().ref(seasonPath('history') + '/' + f.recordID);
      (list.length ? ref.set(list) : ref.remove()).then(function () {
        NL.writeAudit('fixture_history_removed', { recordID: f.recordID, entry: idx + 1, type: e.type });
        render(); NL.toast('Entry removed', 'success');
      }).catch(function (err) { NL.toast('Could not save \u2014 ' + ((err && err.message) || err), 'error'); });
    });
  }

  /* Bulk delete of whatever the filters are currently showing.

     Exists because a mis-import is not a one-fixture mistake: get the
     competition wrong, or import the same cup sheet under two different key
     schemes, and you have hundreds of rows to undo one dialog at a time.
     Scoping it to the filtered view means the destructive thing is the thing
     you can already see, and the competition pills give you the surgical
     version — filter to NLC, delete those, re-import — without going near
     the league programme.

     Guarded by typing the count rather than clicking OK: the number is the
     one fact you must not get wrong, so you have to read it. */
  function bulkDelete() {
    var rows = filtered();
    if (!rows.length) { NL.toast('Nothing shown to delete', 'info'); return; }
    var comps = {};
    rows.forEach(function (f) { comps[f.competition] = (comps[f.competition] || 0) + 1; });
    var desc = COMPS.filter(function (c) { return comps[c]; })
      .map(function (c) { return comps[c] + ' ' + c; }).join(', ');
    var hist = rows.filter(function (f) { return histOf(f.recordID).length; }).length;

    NL.prompt('Everything currently shown: ' + desc + '.' +
      (hist ? '\n\n' + hist + (hist === 1 ? ' of them carries' : ' of them carry') +
        ' scheduling history, which cannot be recovered.' : '') +
      '\n\nType ' + rows.length + ' to confirm.', {
      title: 'Delete ' + rows.length + ' fixture' + (rows.length === 1 ? '' : 's') + '?',
      confirmText: 'Delete'
    }).then(function (v) {
      if (v == null) return;
      if (String(v).trim() !== String(rows.length)) { NL.toast('Not deleted \u2014 the number did not match', 'info'); return; }

      var ids = rows.map(function (f) { return f.recordID; });
      var db = firebase.database(), CH = 400, jobs = [];
      for (var i = 0; i < ids.length; i += CH) jobs.push(ids.slice(i, i + CH));
      var done = 0;
      function failed(e) {
        NL.toast('Stopped after ' + done + ' \u2014 ' + ((e && e.message) || e), 'error');
        render();
      }
      (function next() {
        if (!jobs.length) {
          NL.writeAudit('fixture_bulk_delete', { count: done, of: desc });
          render();
          NL.toast(done + ' fixture' + (done === 1 ? '' : 's') + ' deleted', 'success');
          return;
        }
        var batch = jobs.shift(), nulls = {};
        batch.forEach(function (id) { nulls[id] = null; });
        try {
          /* null at a child path deletes it, so one update() clears a whole
             batch from each node. */
          Promise.all([
            db.ref(seasonPath('fixtures')).update(nulls),
            db.ref(seasonPath('history')).update(nulls),
            db.ref(seasonPath('notes')).update(nulls),
            db.ref(seasonPath('broadcast')).update(nulls)
          ]).then(function () {
            batch.forEach(function (id) {
              delete S.fixtures[id]; delete S.history[id];
              delete S.notes[id]; delete S.bcast[id];
            });
            done += batch.length; next();
          }).catch(failed);
        } catch (e) { failed(e); }
      }());
    });
  }

  /* Same shape as reinstate(): the correction is APPENDED to the history
     rather than erasing anything, so "there was a score here once and it was
     taken off" stays visible. */
  function clearResult(f) {
    var was = scoreText(f);
    NL.confirm(f.home + ' ' + was + ' ' + f.away, {
      title: 'Remove this result?',
      detail: 'The fixture goes back to showing its kick-off time. The removal is kept in the history.',
      confirmText: 'Remove result', variant: 'danger'
    }).then(function (ok) {
