<!DOCTYPE html>
<!--
  NL Tools — 404
  Version: v1.1 (22/08/2026)
  File: /404.html

  GitHub Pages serves this for any path on nl.tools that does not exist.
  There was no such file until 22/08/2026, so every wrong URL showed GitHub's
  own 404, which to a club reads as the whole site being down rather than one
  address being wrong.

  v1.1 — NO BAR AND NO LINKS. The first cut wore the .nl-idbar and offered
    two doors, the portal and the handbook. Richard: "404 SHOULDNt hav ehte
    topbar nor link to anywhere."

    Both were the page pretending to know things it does not. A bar is
    chrome that belongs to a page, and there is no page here — it is the
    absence of one. And the two doors were a guess at who had arrived:
    staff, or a club. This file is served to anyone, at any path, before any
    gate, and most of the time the answer is not a door at all but the typo
    now sitting in front of them.

    So: whose site this is, that the page is not here, and the address that
    failed. Nothing to press, because there is nothing this page knows to
    offer. Back is the browser's job.

  IT MUST WORK AT ANY DEPTH. Pages serves this one file for /x, /a/b/c and
  everything below, so every reference here is absolute. A relative one would
  resolve against whatever path the visitor got wrong — the stylesheet would
  404 on the 404.
-->
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — NL Tools</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/assets/crests/National%20League%20rose.png">
<link rel="stylesheet" href="/system/nl-brand.css?v=59">
<style>
  .nf {
    min-height: 84vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    padding: 32px 24px; gap: 16px;
  }
  .nf__rose { width: 56px; height: 56px; object-fit: contain; }
  .nf__h {
    margin: 0; font-size: var(--text-xl); font-weight: 900;
    font-variation-settings: 'wght' 900; color: var(--navy);
  }
  /* The address that failed, set as an address rather than as prose. Nine
     times in ten it is a typo the visitor can see the moment it is in front
     of them, and the tenth time it is what they send to whoever gave them
     the link. */
  .nf__url {
    margin: 0; font-family: var(--font-mono); font-size: var(--text-sm);
    color: var(--text-muted); word-break: break-all; max-width: 34rem;
  }
</style>
</head>
<body>

<main class="nf">
  <img class="nf__rose" src="/assets/crests/National%20League%20rose.png" alt="The National League">
  <h1 class="nf__h">Page not found</h1>
  <p class="nf__url" id="nfUrl"></p>
</main>

<script>
  /* textContent, not innerHTML: the path is attacker-controlled by definition
     — anyone can put anything in a URL and send it to somebody. */
  document.getElementById('nfUrl').textContent =
    location.host + location.pathname + location.search;
</script>

</body>
</html>
