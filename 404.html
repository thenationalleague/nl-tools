<!DOCTYPE html>
<!--
  NL Tools — 404
  Version: v1.0 (22/08/2026)
  File: /404.html

  GitHub Pages serves this for any path on nl.tools that does not exist.
  There was no such file until now, so every wrong URL — a typo, an old link,
  a trailing slash the layout did not expect — showed GitHub's own 404, which
  to a club reads as the whole site being down rather than one address being
  wrong. Found while fixing exactly that: /handbook/reader/ 404'd for a week.

  IT MUST WORK AT ANY DEPTH. Pages serves this one file for /x, /a/b/c and
  everything below, so every reference here is absolute. A relative one would
  resolve against whatever path the visitor got wrong.

  The bar is .nl-idbar--open, the navy one, which by canon (brand v2.37)
  means nobody was asked who you are. That is the truth of a 404: this page
  is served before any gate, to anyone.

  IT SHOWS THE ADDRESS THAT FAILED. Not decoration — nine times in ten the
  answer is a typo the visitor can see the moment it is in front of them, and
  the tenth time it is what they paste to whoever sent the link. Everything
  else on the page is two doors: the portal for staff, the handbook for
  clubs, which between them are where nearly everyone was heading.
-->
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — NL Tools</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/assets/crests/National%20League%20rose.png">
<link rel="stylesheet" href="/system/nl-brand.css?v=59">
<style>
  .nf {
    min-height: 70vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    padding: 32px 24px; gap: 18px;
  }
  .nf__h {
    margin: 0; font-size: var(--text-xl); font-weight: 900;
    font-variation-settings: 'wght' 900; color: var(--navy);
  }
  /* The address that failed, set as an address rather than as prose. */
  .nf__url {
    margin: 0; font-family: var(--font-mono); font-size: var(--text-sm);
    color: var(--text-muted); word-break: break-all; max-width: 34rem;
  }
  .nf__doors { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
</style>
</head>
<body>

<header class="nl-idbar nl-idbar--open">
  <img class="nl-idbar__crest" src="/assets/crests/National%20League%20rose.png"
       alt="" width="42" height="42">
  <div class="nl-idbar__id">
    <div class="nl-idbar__title">NL Tools</div>
    <div class="nl-idbar__sub">The National League</div>
  </div>
</header>

<main class="nf">
  <h1 class="nf__h">Page not found</h1>
  <p class="nf__url" id="nfUrl"></p>
  <div class="nf__doors">
    <a class="btn btn--sm btn--primary" href="/">Staff &amp; club portal</a>
    <a class="btn btn--sm btn--ghost" href="/handbook/reader/">Handbook</a>
  </div>
</main>

<script>
  /* textContent, not innerHTML: the path is attacker-controlled by definition
     — anyone can put anything in a URL and send it to somebody. */
  document.getElementById('nfUrl').textContent =
    location.host + location.pathname + location.search;
</script>

</body>
</html>
