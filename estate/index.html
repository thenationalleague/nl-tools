<!DOCTYPE html>
<!--
  NL Tools — Estate
  Version: v1.3 (30/10/2026)

  v1.3 (30/10/2026) — Every row lists its addresses under the name: each
  page of a tool with what it is (admin, reader, sub-page…) and, where a
  tool has more than one way in, who can open that page. Jobs show their
  file. Replaces the bare "5 pages" count (Richard: "the slugs not being
  listed for pages isn't ideal").

  v1.2 (30/10/2026) — Claude skills taken off the list (Richard: "don't
  want my skills listed here"). Kinds are now tools, website widgets,
  pages and background jobs only.

  v1.1 (30/10/2026) — Colour back on the Everything tab, after Richard found
  v1.0 "a lot less visually useful". Colour now means one thing per column:
  who can open it uses the access colours the detail view has used since
  v0.5 (purple superadmin, blue staff, green clubs, amber code or open);
  status keeps its pills; where it runs is a quiet neutral tag. The detail
  view's checks come back as red and amber warnings under the name, in
  plain words, rolled up across a tool's pages, with a "Needs a look"
  filter and count.

  v1.0 (30/10/2026) — Declutter: Estate becomes the main reference, in
  plain English. Three tabs:
    Everything        one row per thing we run: every tool (its admin,
                      reader and club pages folded into the one row), every
                      website widget and loose page, every cloud job and
                      GitHub job (scanned from the repo by
                      scripts/build-inventory.js), and the Apps Script
                      projects that live outside the repo
                      (kept by hand in /system/estate.json). Says what each
                      does, who can open it, where it runs, how much it is
                      used or when it runs, and Richard's status and note.
    Pages in detail   the old technical table, unchanged apart from its
                      filters.
    Plans and records the meta shelf and document library.
  First page on NL.filterButton (nl-utils v1.47): the chip groups are gone
  from the detail view too, so this page is off the brand-canon test's
  OLD_CONTROL_PAGES list.
  Usage is opens by signed-in people over the last 90 days, summed from
  app-data/ops-data/daily (written nightly by functions/usage-rollup.js;
  counts only, no names). Visits made with a club code are not counted
  there yet, so pages reached that way show only their staff side.
  Why estate.json is fetched by the page rather than folded into the
  generated inventory: a status or note edited there shows as soon as the
  merge is live, without waiting for the inventory job.

  v0.9 (29/10/2026) — Declutter: brand-dev/ deleted, so its Brand Dev
  link is gone from the reference list and the Sandbox note says so.
  The page is due a full plain-English rebuild as the estate's main
  reference; this is only the dead link.

  v0.7 (16/08/2026) — table scroll containers repointed to the canon
  .table-wrap (brand v2.45): .est-wrap/.est-panel keep only their chrome
  (border, surface, shadow, the open-disclosure corner radius) as tool
  skin; the overflow mechanics come from canon. nl-brand ?v=44 -> ?v=45
  (lockstep sweep).
  File: /estate/index.html

  v0.6 (16/08/2026) — the collapsed family sections sit on canon
  .disclosure/.disclosure__meta (promoted to nl-brand.css v2.41 — this
  page's .est-fam summary was one of the source copies). The native
  ::marker (tinted locally) becomes the canon ▸/▾ chevron; local
  cursor/weight/colour rules deleted, .est-fam__note replaced by the canon
  meta span. The off-white surface, border, radius, --text-sm size and
  the open-state top-corner rounding stay local. nl-brand ?v=40 -> ?v=41.

  Every page in the repo as a table of detail — what it is, how it is reached,
  whether it is on canon, what data it owns, and what links to it.

  Why this exists: the portal only lists gated tools that have an RTDB
  `tools/<toolKey>` record. Everything else — public companion forms, passcode
  pages, CMS embeds, lab experiments, redirect stubs — appears nowhere at all,
  and a gated tool whose registry record was never created is invisible too.
  Roughly half the repo's pages were unlisted by anything before this page.

  Shape of the page (v0.2):
    Tools are the page. Embeds, assets and sandbox pages are separate FAMILIES,
    not peers of a tool, and sit in collapsed sections below so they stop
    competing for attention — an embed is something to paste into the Urban Zoo
    CMS, an asset stub is a crest index. Counts stay visible so a family that
    starts drifting is still noticed.

    Within the tools family, rows carry a ROLE, because the repo has two
    standing conventions the portal does not show:

      <tool>/admin/   the tool's admin panel — a separate gated page that gets
                      no portal card of its own.
      <tool>/reader/  the tool's PUBLIC no-login view of the stamped/published
                      version. The gated tool edits; the reader shows what has
                      been published. Adopted as the standard shape on
                      15/08/2026, so any future <tool>/reader/ is recognised on
                      the day it lands instead of sitting here as a loose page.

    A public form and the console behind it are one tool in two files, and the
    role column is what says so.

  Data:
    /assets/data/tools-inventory.json    generated by scripts/build-inventory.js,
                                         rebuilt by .github/workflows/build-inventory.yml
                                         on every push to main. Read-only — this
                                         page writes nothing and owns no RTDB path.

  Access (RTDB tools/ops-estate):
    superadmin admin · everyone else off. It is a map of the estate, including
    pages that are deliberately obscure; it is not a directory for clubs.

  Reading the flags:
    Parked          the toolKey sits in tools-registry.parked.json: deliberately
                    off the portal with its code retained, per
                    system/tool-status-and-access.md. A decision, not a fault —
                    so it is a neutral pill, not a flag.
    Unaccounted for the toolKey is in NEITHER registry file. The snapshots can
                    lag live RTDB, so this means "worth checking in the
                    console", not "definitely broken".
    No inbound      nothing else in the repo links to this URL. The strongest
                    retire signal available — git dates are useless here because
                    brand sweeps rewrite every file at once. Not applied to
                    embeds (their links live in the Urban Zoo CMS) or to gated
                    tools (they are reached from the portal, not from markup).
    Gated in name   a registry record points at a page that has no auth-guard.

  Reading the columns:
    Canon    which of the four shared files the page loads, and at what ?v= —
             B(rand) U(tils) T(opbar) G(uard). Green current, amber stale, red
             loaded with no ?v= at all (caches indefinitely past a deploy), grey
             absent. Grey is normal on a public page: it has no topbar or guard
             by design. lint-tools.sh only checks nl-brand.css on non-gated
             pages, so for ~47 pages this column is the only thing looking.
    Data     the app-data/<key> the page touches, red when rules.snapshot.json
             has no cover for it. Unlike the registry snapshots, that file IS
             the deployed rules document, so an uncovered path is a real gap
             rather than a possibly-stale mirror.
    Debt     raw hex colours and native confirm/alert/prompt — where a brand
             pass would find work. NOT counted for embeds (the CMS strips
             <link> tags, so inlining colour is their delivery contract) or for
             the Style Guide (hex is its content). One embed carries 227; left
             in, it would dominate the ranking forever and mean nothing.
-->

<style>
  /* #pageWrap default hide is in nl-brand.css; auth-guard reveals with
     style.display = 'block'. Don't clear with '' — would re-trigger the
     brand rule and re-hide the page. */

  /* Search field. The canon has .filter-bar/.chip but no text input inside
     one, so this is the only input styling here. */
  .est-search {
    flex: 1 1 260px;
    min-width: 200px;
    min-height: var(--control-h);
    box-sizing: border-box;
    padding: 0 12px;
    border: 1px solid var(--navy-200);
    border-radius: var(--radius-sm);
    font: inherit;
    font-size: var(--text-sm);
    color: var(--text);
    background: var(--white);
  }
  .est-search:focus { outline: none; border-color: var(--navy); }

  /* One table for the whole family, with a header row per tool group rather
     than a table per group — grouping inside a single table keeps every column
     aligned down the page, which is the entire point of a detail table. */
  .est-table { width: 100%; border-collapse: collapse; font-size: var(--text-sm); }
  .est-table th {
    text-align: left;
    padding: 7px 10px;
    font-size: var(--text-xs);
    font-variation-settings: 'wght' 800;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-muted);
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
    background: var(--white);
    position: sticky;
    top: 0;
    z-index: 2;
  }
  .est-table td {
    padding: 7px 10px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
  }
  .est-table tbody tr:hover td { background: var(--off-white); }

  .est-grouprow td {
    background: var(--navy-50);
    font-variation-settings: 'wght' 800;
    color: var(--navy);
    font-size: var(--text-xs);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 6px 10px;
    border-bottom: 1px solid var(--border);
  }
  .est-grouprow td span { font-variation-settings: 'wght' 500; text-transform: none; letter-spacing: 0; color: var(--text-muted); }

  .est-url {
    font-family: var(--font-mono);
    font-size: var(--text-xs);
    font-variation-settings: 'wght' 700;
    color: var(--primary);
    text-decoration: none;
    white-space: nowrap;
  }
  .est-url:hover { text-decoration: underline; }
  /* A nested page is indented so the shape of a tool — front door, admin,
     companions — is legible at a glance without reading every path. */
  .est-url--nested { padding-left: 12px; }

  .est-title { font-variation-settings: 'wght' 600; }
  .est-sum {
    color: var(--text-muted);
    font-size: var(--text-xs);
    line-height: 1.4;
    display: block;
    max-width: 46ch;
  }
  .est-muted { color: var(--text-muted); font-size: var(--text-xs); white-space: nowrap; }

  /* Canon badges: B U T G, one letter per shared file. */
  .est-canon { display: flex; gap: 3px; }
  .est-cb {
    width: 18px; height: 18px;
    border-radius: 3px;
    font-size: var(--text-xs);
    font-variation-settings: 'wght' 800;
    display: inline-flex; align-items: center; justify-content: center;
    border: 1px solid transparent;
  }
  .est-cb--current { background: var(--green-light); color: var(--green); }
  .est-cb--stale   { background: var(--amber-light); color: var(--amber); }
  .est-cb--unversioned { background: var(--red-light); color: var(--red); }
  /* Absent is deliberately quiet, not a warning: a public page has no topbar
     and no guard by design, and colouring that red would cry wolf on ~30 rows. */
  .est-cb--absent  { background: var(--off-white); color: var(--navy-300); border-color: var(--border); }

  .est-key {
    font-family: var(--font-mono);
    font-size: var(--text-xs);
    color: var(--text-muted);
    white-space: nowrap;
  }
  .est-key--bad { color: var(--red); font-variation-settings: 'wght' 700; }

  /* The meta shelf. Cards for the tools, a compact list for the library —
     documents are read on GitHub, so a row is a pointer, not a page. */
  .est-meta { margin-top: 34px; border-top: 3px solid var(--navy); padding-top: 4px; }
  .est-meta__h {
    font-size: var(--text-sm); text-transform: uppercase; letter-spacing: .08em;
    color: var(--navy); font-variation-settings: 'wght' 800; margin: 18px 0 10px;
  }
  .est-meta__grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
  .est-meta__card {
    display: block; padding: 12px 14px; background: var(--white);
    border: 1px solid var(--border); border-radius: var(--radius);
    text-decoration: none; color: var(--text);
  }
  .est-meta__card:hover { border-color: var(--navy-300); }
  .est-meta__card b { display: block; color: var(--navy); font-size: var(--text-base); }
  .est-meta__card span { font-size: var(--text-xs); color: var(--text-muted); line-height: 1.45; display: block; margin-top: 3px; }
  .est-meta__list { display: flex; flex-direction: column; gap: 0; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .est-meta__row {
    display: flex; gap: 12px; align-items: baseline; padding: 9px 14px;
    background: var(--white); border-top: 1px solid var(--border);
    text-decoration: none; font-size: var(--text-sm);
  }
  .est-meta__row:first-child { border-top: 0; }
  .est-meta__row:hover { background: var(--off-white); }
  .est-meta__row b { color: var(--navy); white-space: nowrap; font-variation-settings: 'wght' 700; }
  .est-meta__row span { color: var(--text-muted); }
  @media (max-width: 640px) { .est-meta__row { flex-direction: column; gap: 2px; } }

  .est-fam { margin-top: 22px; }
  /* Summary skeleton is canon .disclosure (nl-brand v2.41) — only the
     surface, size and open-state rounding are this page's. */
  .est-fam > summary {
    background: var(--off-white);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    font-size: var(--text-sm);
  }
  .est-fam[open] > summary { border-radius: var(--radius) var(--radius) 0 0; }

  /* Chrome only — scroll mechanics come from the canon .table-wrap (brand
     v2.45); these tables are custom and carry none of their own. .est-panel
     keeps its open-disclosure radius (top corners squared into the summary
     row) — stated after the canon link, so it wins the wrap's default. */
  .est-panel {
    border: 1px solid var(--border);
    border-top: none;
    border-radius: 0 0 var(--radius) var(--radius);
    background: var(--white);
  }
  .est-wrap {
    border: 1px solid var(--border);
    background: var(--white);
    box-shadow: var(--shadow);
  }

  .est-note { font-size: var(--text-xs); color: var(--text-muted); margin-top: 18px; line-height: 1.5; }

  /* Everything tab. The row's name and what it does share a cell, as do the
     status and its note, so the table is six columns and reads on the
     1280-wide screen without its words being squeezed to a few per line. */
  .est-filters { margin-bottom: 14px; }
  .est-all td:first-child { min-width: 260px; }
  .est-name { font-variation-settings: 'wght' 700; color: var(--navy); text-decoration: none; }
  a.est-name:hover { text-decoration: underline; }
  .est-does { display: block; max-width: 52ch; line-height: 1.4; margin-top: 2px; }
  .est-sub { display: block; margin-top: 3px; }
  /* A tool's addresses, front door first; the rest indented under it so
     the shape (admin, reader, club pages) reads at a glance. */
  .est-paths { margin-top: 4px; display: flex; flex-direction: column; gap: 1px; }
  .est-path { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .est-path--nested { padding-left: 12px; }
  .est-path .est-url { white-space: normal; word-break: break-all; }
  .est-cell { white-space: nowrap; }
  .est-statnote { display: block; color: var(--text-muted); font-size: var(--text-xs); line-height: 1.4; max-width: 40ch; margin-top: 3px; }
  .est-statnote:first-child { margin-top: 0; }
  .est-tags { display: flex; flex-wrap: wrap; gap: 4px; }
  .est-tags--under { margin-top: 5px; }
  /* Where it runs is a category, not a judgement, so it gets no hue. */
  .est-pill--plain { background: var(--navy-50); color: var(--navy); }
</style>
</head>
<body>

<div id="pageWrap">
  <div class="page">

    <!-- A closed set of three places in the tool, so tabs. -->
    <div class="tabs" role="tablist" id="estTabs">
      <button type="button" class="tab active" role="tab" aria-selected="true" data-view="all">Everything</button>
      <button type="button" class="tab" role="tab" aria-selected="false" data-view="tech">Pages in detail</button>

    <section id="viewAll" role="tabpanel">
      <div class="stats" id="allStats"></div>

        <div id="fKind"></div>
        <div id="fDoor"></div>
        <div id="fRuns"></div>
        <div id="fStatus"></div>
        <div id="fWarn"></div>
      </div>
      <div class="table-wrap est-wrap" id="allTable"><div class="empty-state">Loading…</div></div>
      <p class="est-note" id="allNote"></p>
    </section>

    <section id="viewTech" role="tabpanel" hidden>
      <div class="stats" id="estStats"></div>
      <div class="filter-btn-row est-filters">
        <input type="search" class="est-search" id="estSearch"
               placeholder="Search path, title, description or RTDB key" aria-label="Search the pages">
        <div id="estRoles"></div>
        <div id="estFlags"></div>
        <button class="btn btn--ghost btn--sm" id="estCopy">Copy paths</button>
      </div>
      <div class="table-wrap est-wrap" id="estTools"></div>
      <div id="estFamilies"></div>
      <p class="est-note" id="estNote"></p>
    </section>

    <!-- The master layer. Curated, not generated: the inventory knows pages,
         but which page is meta-tooling and what each document DECIDES is
         editorial knowledge, and the whole point of this shelf is that it is
         findable — CLAUDE.md carried the line "these exist and are not linked
         from anywhere a session would find them" for a month before this. -->
    <section id="viewMeta" role="tabpanel" hidden>
      <h2 class="est-meta__h">Tools about the estate</h2>
      <div class="est-meta__grid" id="estMetaTools"></div>
      <h2 class="est-meta__h">Plans, decisions and records</h2>
      <div class="est-meta__list" id="estLibrary"></div>
    </section>

  </div>
</div>

<!-- Main app -->
<script>
(function () {
  'use strict';

  var INVENTORY_URL = '/assets/data/tools-inventory.json';

  /* Families. `tool` is the estate you manage and gets the main table; the rest
     are collapsed below with a one-line note saying why they are separate, so
     the distinction is stated rather than assumed. */
  var FAMILIES = [
    { key: 'embed',   label: 'Embeds',  note: 'Pasted into the Urban Zoo CMS. No auth-guard, inline styles only — a different delivery contract, so canon and inbound-link columns do not apply the same way.' },
    { key: 'asset',   label: 'Assets',  note: 'Generated directory listings for crests and division art. Not tools.' },
    { key: 'sandbox', label: 'Sandbox', note: 'Mock-ups and experiments. None left since brand-dev/ was deleted on 29/10/2026.' },
    { key: 'system',  label: 'System',  note: 'Pages under system/ that are not mockups.' }
  ];

  var ROLES = [
    { key: 'main',      label: 'Main' },
    { key: 'admin',     label: 'Admin' },
    { key: 'reader',    label: 'Reader' },
    { key: 'sub',       label: 'Sub-page' },
    { key: 'companion', label: 'Companion' },
    { key: 'variant',   label: 'Variant' }
  ];
  var ROLE_LABEL = {};
  ROLES.forEach(function (r) { ROLE_LABEL[r.key] = r.label; });

  var ROLE_PILL = {
    main: 'pill--info',
    admin: 'pill--postponed',
    reader: 'pill--approved',
    sub: 'pill--info',
    companion: 'pill--soon',
    variant: 'pill--soon'
  };

  /* See the header note: a no-inbound-link finding only means something where
     markup is how the page is reached. */
  var INBOUND_MEANINGFUL = { companion: 1, public: 1, sandbox: 1, redirect: 1 };

  var CANON_KEYS = [
    { key: 'nl-brand',   letter: 'B', name: 'nl-brand.css' },
    { key: 'nl-utils',   letter: 'U', name: 'nl-utils.js' },
    { key: 'nl-topbar',  letter: 'T', name: 'nl-topbar.js' },
    { key: 'auth-guard', letter: 'G', name: 'auth-guard.js' }
  ];

  var state = { data: null, search: '', role: [], flag: [] };

  /* ── flags ─────────────────────────────────────────────────────────────── */

  function flagsFor(page) {
    var out = [];
    if (page.registryState === 'none') {
      out.push({ key: 'unregistered', label: 'Unaccounted for', pill: 'pill--pending' });
    }
    if (page.ungatedButRegistered) {
      out.push({ key: 'ungated', label: 'Gated in name only', pill: 'pill--rejected' });
    }
    if (page.role === 'admin' && !page.gated) {
      out.push({ key: 'openadmin', label: 'Admin, no auth-guard', pill: 'pill--rejected' });
    }
    if ((page.appDataUncovered || []).length) {
      out.push({ key: 'norules', label: 'No RTDB rules', pill: 'pill--rejected' });
    }
    if (canonProblem(page)) {
      out.push({ key: 'canon', label: 'Canon drift', pill: 'pill--pending' });
    }
    if (INBOUND_MEANINGFUL[page.species] && page.inbound.length === 0) {
      out.push({ key: 'orphan', label: 'No inbound link', pill: 'pill--expired' });
    }
    return out;
  }

  /** Stale or unversioned counts as drift. Absent does not — see the CSS note. */
  function canonProblem(page) {
    return CANON_KEYS.some(function (c) {
      var s = page.canon && page.canon[c.key];
      return s && (s.state === 'stale' || s.state === 'unversioned');
    });
  }

  function matches(page) {
    if (state.role.length && state.role.indexOf(page.role) === -1) return false;
    if (state.flag.length) {
      if (!flagsFor(page).some(function (f) { return state.flag.indexOf(f.key) !== -1; })) return false;
    }
    if (state.search) {
      var hay = [page.url, page.path, page.title, page.summary, page.toolKey]
        .concat(page.appData || []).filter(Boolean).join(' ').toLowerCase();
      if (hay.indexOf(state.search) === -1) return false;
    }
    return true;
  }

  /* ── cells ─────────────────────────────────────────────────────────────── */

  function canonCell(page) {
    var cells = CANON_KEYS.map(function (c) {
      var s = (page.canon && page.canon[c.key]) || { state: 'absent', version: null };
      var title = c.name + ' — ' + s.state + (s.version ? ' (?v=' + s.version + ')' : '');
      return '<span class="est-cb est-cb--' + s.state + '" title="' + NL.escHtml(title) + '">' +
             c.letter + '</span>';
    });
    return '<div class="est-canon">' + cells.join('') + '</div>';
  }

  function dataCell(page) {
    var keys = page.appData || [];
    if (!keys.length) return '<span class="est-muted">—</span>';
    var bad = page.appDataUncovered || [];
    return keys.map(function (k) {
      var isBad = bad.indexOf(k) !== -1;
      return '<div class="est-key' + (isBad ? ' est-key--bad' : '') + '"' +
             (isBad ? ' title="No cover in rules.snapshot.json — writes here are denied"' : '') +
             '>' + NL.escHtml(k) + (isBad ? ' ⚠' : '') + '</div>';
    }).join('');
  }

  function debtCell(page) {
    if (!page.violationsApply) return '<span class="est-muted" title="Inline colour is this page’s delivery contract, not debt">n/a</span>';
    var v = page.violations || { hex: 0, nativeDialogs: 0 };
    if (!v.hex && !v.nativeDialogs) return '<span class="est-muted">—</span>';
    var bits = [];
    if (v.hex) bits.push(v.hex + ' hex');
    if (v.nativeDialogs) bits.push(v.nativeDialogs + ' dlg');
    return '<span class="est-muted" title="Raw hex colours / native confirm-alert-prompt">' +
           NL.escHtml(bits.join(' · ')) + '</span>';
  }

  /* Pill class per access kind — the WHO of a row, derived by the inventory
     from registry defaults (gated pages) or gate mechanics (ungated ones).
     Red-tinted for superadmin so the most restricted rows read at a glance;
     amber for code-entered, where the URL+code is doing the gating. */
  var ACCESS_PILL = {
    superadmin: 'pill--postponed',
    staff: 'pill--info',
    club: 'pill--approved',
    code: 'pill--pending',
    open: 'pill--soon'
  };

  function accessCell(page) {
    var bits = [];
    if (page.access && page.access.label) {
      bits.push('<span class="pill ' + (ACCESS_PILL[page.access.kind] || 'pill--info') + '" title="' +
        NL.escHtml('Derived from ' + (page.gated ? 'the registry record’s role defaults' : 'the page’s gate mechanics')) +
        '">' + NL.escHtml(page.access.label) + '</span>');
    } else {
      /* Inventory predates the access field — fall back to the old pills. */
      bits.push(page.gated
        ? '<span class="pill pill--approved">Gated</span>'
        : '<span class="pill pill--soon">Public</span>');
      if (page.registryState === 'live') {
        var aud = page.registry && page.registry.audience;
        bits.push('<span class="pill pill--info">' + NL.escHtml(aud || 'portal') + '</span>');
      }
    }
    if (page.registryState === 'parked') {
      bits.push('<span class="pill pill--info" title="' +
        NL.escHtml('Deliberately off the portal' + (page.parkedStage ? ' — ' + page.parkedStage : '')) +
        '">Parked</span>');
    } else if (page.registryState === 'none') {
      bits.push('<span class="pill pill--pending">No record</span>');
    }
    return bits.join(' ');
  }

  function rowHtml(page) {
    var name = (page.registry && page.registry.label) || page.title || '';
    var nested = page.role !== 'main';
    var flagPills = flagsFor(page).filter(function (f) {
      /* Registry state already shows in the Access column; repeating it as a
         flag pill would say the same thing twice on the same row. */
      return f.key !== 'unregistered';
    });

    return '<tr>' +
      '<td><a class="est-url' + (nested ? ' est-url--nested' : '') + '" href="' + NL.escHtml(page.url) +
        '" target="_blank" rel="noopener">' + NL.escHtml(page.url) + '</a></td>' +
      '<td><span class="pill ' + (ROLE_PILL[page.role] || 'pill--info') + '">' +
        NL.escHtml(ROLE_LABEL[page.role] || page.role) + '</span></td>' +
      '<td>' + (name ? '<span class="est-title">' + NL.escHtml(name) + '</span>' : '') +
        (page.version ? ' <span class="est-muted">' + NL.escHtml(page.version) + '</span>' : '') +
        (page.summary ? '<span class="est-sum">' + NL.escHtml(page.summary) + '</span>' : '') +
        (flagPills.length ? '<div style="margin-top:4px">' + flagPills.map(function (f) {
          return '<span class="pill ' + f.pill + '">' + NL.escHtml(f.label) + '</span>';
        }).join(' ') + '</div>' : '') +
      '</td>' +
      '<td>' + accessCell(page) + '</td>' +
      '<td>' + canonCell(page) + '</td>' +
      '<td>' + dataCell(page) + '</td>' +
      '<td>' + debtCell(page) + '</td>' +
      '<td class="est-muted" title="' + NL.escHtml(page.inbound.join(', ')) + '">' +
        page.inbound.length + '</td>' +
      /* lastSubstantive, not lastCommit. Bumping a shared file's ?v= rewrites
         one line in all 64 pages at once, so after a bump every row here read
         as changed today and the column said nothing. This is the date of the
         last commit that did something other than a cache-bust. */
      '<td class="est-muted" title="' +
        (page.lastCommit && page.lastSubstantive && page.lastCommit !== page.lastSubstantive
          ? 'Last touched at all ' + page.lastCommit + ', but only by a canon cache-bust'
          : '') + '">' +
        (page.lastSubstantive || page.lastCommit || '—') +
        '<br>' + Math.round(page.bytes / 1024) + 'kb</td>' +
      '</tr>';
  }

  var HEAD = '<thead><tr>' +
    '<th>Page</th><th>Role</th><th>What it is</th><th>Access</th>' +
    '<th title="B brand · U utils · T topbar · G guard">Canon</th>' +
    '<th>Data</th><th>Debt</th><th title="Files in the repo linking here">In</th>' +
    '<th title="Last commit that was not just a canon cache-bump">Changed</th>' +
    '</tr></thead>';

  function tableFor(pages, groupBy) {
    if (!pages.length) return '<div class="empty-state">Nothing matches that filter.</div>';

    var body = '';
    if (groupBy) {
      var groups = {};
      pages.forEach(function (p) { (groups[p.group || '(root)'] = groups[p.group || '(root)'] || []).push(p); });
      Object.keys(groups).sort().forEach(function (g) {
        var rows = groups[g].slice().sort(function (a, b) {
          /* Front door first, then its admin, then the rest — the tool's own
             shape, rather than alphabetical order which splits them up. */
          var order = { main: 0, admin: 1, reader: 2, sub: 3, companion: 4, variant: 5 };
          return (order[a.role] - order[b.role]) || a.url.localeCompare(b.url);
        });
        body += '<tbody><tr class="est-grouprow"><td colspan="9">' + NL.escHtml(g) +
                ' <span>' + rows.length + (rows.length === 1 ? ' page' : ' pages') + '</span></td></tr>' +
                rows.map(rowHtml).join('') + '</tbody>';
      });
    } else {
      body = '<tbody>' + pages.slice().sort(function (a, b) {
        return a.url.localeCompare(b.url);
      }).map(rowHtml).join('') + '</tbody>';
    }
    return '<table class="est-table">' + HEAD + body + '</table>';
  }

  /* ── render ────────────────────────────────────────────────────────────── */

  function renderStats() {
    var P = state.data.pages;
    var tools = P.filter(function (p) { return p.family === 'tool'; });
    var count = function (fn) { return P.filter(fn).length; };

    var cards = [
      { num: new Set(tools.map(function (p) { return p.group; })).size, label: 'Tools' },
      { num: tools.length, label: 'Tool pages' },
      { num: count(function (p) { return p.registryState === 'none'; }), label: 'Unaccounted for' },
      { num: count(function (p) { return canonProblem(p); }), label: 'Canon drift' },
      { num: count(function (p) { return (p.appDataUncovered || []).length; }), label: 'No RTDB rules' },
      { num: count(function (p) { return INBOUND_MEANINGFUL[p.species] && !p.inbound.length; }), label: 'No inbound link' }
    ];
    document.getElementById('estStats').innerHTML = cards.map(function (s) {
      return '<div class="stat"><div class="stat__num">' + s.num + '</div>' +
             '<div class="stat__label">' + NL.escHtml(s.label) + '</div></div>';
    }).join('');
  }

  /* Counts are over the whole estate and never change while the page is
     open, so the two buttons are made once. A flag with no pages is left
     out rather than offered with a zero. */
  function makeTechFilters() {
    var tools = state.data.pages.filter(function (p) { return p.family === 'tool'; });
    var counts = {};
    tools.forEach(function (p) { counts[p.role] = (counts[p.role] || 0) + 1; });
    NL.filterButton('#estRoles', {
      label: 'Role',
      options: ROLES.filter(function (r) { return counts[r.key]; }).map(function (r) {
        return { value: r.key, label: r.label, count: counts[r.key] };
      }),
      onChange: function (v) { state.role = v; renderTables(); }
    });

    var fc = {};
    state.data.pages.forEach(function (p) {
      flagsFor(p).forEach(function (f) { fc[f.key] = (fc[f.key] || 0) + 1; });
    });
    NL.filterButton('#estFlags', {
      label: 'Flags',
      allLabel: 'Any',
      options: [
        { key: 'norules',      label: 'No RTDB rules' },
        { key: 'openadmin',    label: 'Admin, no auth-guard' },
        { key: 'ungated',      label: 'Gated in name only' },
        { key: 'canon',        label: 'Canon drift' },
        { key: 'unregistered', label: 'Unaccounted for' },
        { key: 'orphan',       label: 'No inbound link' }
      ].filter(function (f) { return fc[f.key]; }).map(function (f) {
        return { value: f.key, label: f.label, count: fc[f.key] };
      }),
      onChange: function (v) { state.flag = v; renderTables(); }
    });
  }

  function renderTables() {
    var visible = state.data.pages.filter(matches);

    document.getElementById('estTools').innerHTML =
      tableFor(visible.filter(function (p) { return p.family === 'tool'; }), true);

    var out = '';
    FAMILIES.forEach(function (fam) {
      var rows = visible.filter(function (p) { return p.family === fam.key; });
      var total = state.data.pages.filter(function (p) { return p.family === fam.key; }).length;
      if (!total) return;
      out += '<details class="est-fam disclosure"><summary>' + NL.escHtml(fam.label) + ' — ' + total +
             ' <span class="disclosure__meta">' + NL.escHtml(fam.note) + '</span></summary>' +
             '<div class="table-wrap est-panel">' + tableFor(rows, false) + '</div></details>';
    });
    document.getElementById('estFamilies').innerHTML = out;
  }

  function renderNote() {
    var d = state.data;
    document.getElementById('estNote').textContent =
      'Generated ' + NL.formatDateTime(d.generated) + ' from ' + d.registrySource +
      '. Registry state comes from the in-repo snapshots, which can lag live RTDB — check the console before concluding a tool is unregistered. RTDB rules cover is read from rules.snapshot.json, which IS the deployed document.';
  }

  /* ── the meta shelf ─────────────────────────────────────────────────────
     Curated by hand, rendered once — it does not react to the filters above,
     because "what governs the estate" is not a thing you search, it is a
     thing you must be able to FIND. Documents link to their GitHub render:
     they live as markdown in the repo on purpose (versioned, PR-reviewed),
     and GitHub already renders markdown better than a hand-rolled viewer. */
  var GH = 'https://github.com/thenationalleague/nl-tools/blob/main/';
  var META_TOOLS = [
    { href: '/style-guide/',  label: 'Style Guide',
      note: 'The living visual reference — every token and component, rendered. Superadmin only.' },
    { href: '/club-directory/meta-reference.html', label: 'Meta Reference',
      note: 'The clubs-meta field dictionary — what every field means and which tools read it.' },
    { href: '/nls-monitor/', label: 'NLServices API',
      note: 'Live monitor of the NLServices API ingester — run health, matchdays, events. Superadmin only.' },
    { href: GH + 'CLAUDE.md', label: 'CLAUDE.md',
      note: 'The working contract every Claude session reads first. The closest thing to a constitution.' }
  ];
  var LIBRARY = [
    { p: 'system/RUNBOOK.md',                   d: 'How the system is run from a browser. Being rewritten in the Declutter.' },
    { p: 'system/estate.json',                  d: 'The hand-kept half of this page: names, statuses and notes, plus the Apps Script projects.' },
    { p: 'system/fixture-management-plan.md',   d: 'The master fixtures record and its date finder, broadcast and AMI parts.' },
    { p: 'system/guest-pass-plan.md',           d: 'Scoping, not built: a code for outsiders that opens a set list of tools.' },
    { p: 'system/deployer-migration.md',        d: 'Parked: the one account every deploy uses, and how to split it safely.' },
    { p: 'system/CONSOLIDATION.md',             d: 'The master plan — every tool draws from one shared place. Seven workstreams.' },
    { p: 'system/tool-status-and-access.md',    d: 'Which tools are live, parked or retired, and the per-role access model for each.' },
    { p: 'system/retired/README.md',            d: 'Every retired tool’s post-mortem — read before proposing to build anything that existed once.' },
    { p: 'system/gas-to-functions-migration.md',d: 'Locked decision: retire the public Apps Script app; Firebase for everything.' },
    { p: 'system/staff-club-audience-plan.md',  d: 'The staff/club audience gate.' },
    { p: 'system/roles-and-access-plan.md',     d: 'The six-role, three-realm model.' },
    { p: 'system/brand-v3-scale-plan.md',       d: 'Parked type/scale pass. Its brand-dev mock-ups were deleted on 29/10/2026.' },
    { p: 'system/rtdb/README.md',               d: 'The RTDB snapshot contract — which files are deployed vs reference.' },
    { p: 'system/storage/README.md',            d: 'Firebase Storage rules, CORS, and the nightly data feeds in data/.' },
    { p: 'gas/README.md',                       d: 'The Apps Script mirror — how the two-way sync and deploy keep repo and live honest.' },
    { p: 'embeds/widget-handover.md',           d: 'The embed invariants — what survives the Urban Zoo CMS and what it strips.' }
  ];

  function renderMeta() {
    document.getElementById('estMetaTools').innerHTML = META_TOOLS.map(function (t) {
      return '<a class="est-meta__card" href="' + t.href + '"><b>' + NL.escHtml(t.label) + '</b>' +
             '<span>' + NL.escHtml(t.note) + '</span></a>';
    }).join('');
    document.getElementById('estLibrary').innerHTML = LIBRARY.map(function (r) {
      return '<a class="est-meta__row" href="' + GH + r.p + '"><b>' + NL.escHtml(r.p) + '</b>' +
             '<span>' + NL.escHtml(r.d) + '</span></a>';
    }).join('');
  }

  function render() {
    renderStats();
    renderTables();
    renderNote();
  }

  /* ── events ────────────────────────────────────────────────────────────── */

  function wire() {
    makeTechFilters();

    var search = document.getElementById('estSearch');
    search.addEventListener('input', function () {
      state.search = search.value.trim().toLowerCase();
      renderTables();
    });

    document.getElementById('estCopy').addEventListener('click', function () {
      var paths = state.data.pages.filter(matches).map(function (p) { return p.path; });
      if (!paths.length) { NL.toast('Nothing to copy', 'info'); return; }
      NL.copy(paths.join('\n'), { ok: paths.length + ' path' + (paths.length === 1 ? '' : 's') + ' copied' });
    });
  }

  /* ── Everything tab ─────────────────────────────────────────────────────
     One row per thing we run. Pages come from the generated inventory and are
     folded into one row per tool (a tool's admin, reader and club pages are
     the same tool to the person deciding whether it earns its place). Cloud
     and GitHub jobs come from the same scan. /system/estate.json adds the
     plain names, status and notes, plus what lives outside the repo. */

  var ESTATE_URL = '/system/estate.json';
  var REPO_URL = 'https://github.com/thenationalleague/nl-tools';
  var USAGE_DAYS = 90;

  var KINDS = ['Tool', 'Website widget', 'Page', 'Background job'];
  var KIND_PLURAL = { 'Tool': 'Tools', 'Website widget': 'Website widgets', 'Page': 'Other pages',
                      'Background job': 'Background jobs' };
  var DOORS = { open: 'Anyone', code: 'Club code', club: 'Clubs and League staff',
                staff: 'League staff', superadmin: 'Superadmin only' };
  var DOOR_ORDER = ['Anyone', 'Club code', 'Clubs and League staff', 'League staff', 'Superadmin only'];
  var STATUSES = ['Core', 'Occasional', 'Dead', 'Not decided'];
  var STATUS_PILL = { 'Core': 'pill--approved', 'Occasional': 'pill--info', 'Dead': 'pill--rejected' };

  var all = { rows: [], search: '', kind: [], door: [], runs: [], status: [], warn: [], usage: null };

  /* The detail view's checks, in plain words. Red stops something working
     or leaves it open; amber is worth a look. */
  var WARN = {
    norules:      { label: 'No database rules',      pill: 'pill--rejected' },
    openadmin:    { label: 'Admin page not locked',  pill: 'pill--rejected' },
    codeadmin:    { label: 'Admin page on a code',   pill: 'pill--pending',
                    title: 'The admin page is opened with a code rather than a login' },
    ungated:      { label: 'Not actually locked',    pill: 'pill--rejected' },
    canon:        { label: 'Old shared files',       pill: 'pill--pending' },
    unregistered: { label: 'Not on the portal list', pill: 'pill--pending' },
    orphan:       { label: 'Nothing links to it',    pill: 'pill--pending',
                    title: 'No page in the repo links here. Fine if people reach it from emails, the website or a QR code' }
  };
  var WARN_ORDER = ['norules', 'openadmin', 'ungated', 'codeadmin', 'canon', 'unregistered', 'orphan'];
  var DOOR_PILL = { 'Anyone': 'pill--soon', 'Club code': 'pill--pending', 'Clubs and League staff': 'pill--approved',
                    'League staff': 'pill--info', 'Superadmin only': 'pill--postponed' };

  /* Which row a page belongs to. A page with no toolKey of its own joins the
     tool that owns its folder (dazn/ is the DAZN tool's club side); loose
     pages are a row each, keyed the way estate.json names them. */
  function rowIdFor(p, folderTool) {
    if (p.toolKey) return 'tool:' + p.toolKey;
    if (folderTool[p.group]) return 'tool:' + folderTool[p.group];
    if (!p.group || p.group === 'embeds') return 'page:' + p.path;
    if (p.group === 'public' || p.group === 'assets') return 'page:' + p.dir;
    return 'page:' + p.group;
  }

  function uniq(list) {
    return list.filter(function (v, i) { return v && list.indexOf(v) === i; });
  }

  var PATH_ORDER = { main: 0, admin: 1, reader: 2, sub: 3, companion: 4, variant: 5 };

  /* A row's pages, front door first. Each says what it is unless it is the
     front door, and who can open it when the tool has more than one way in
     (Programme Packs: clubs by code at /programme/, staff at /admin/). */
  function pathsFor(ps, showDoor) {
    var rank = function (p) { return p.role in PATH_ORDER ? PATH_ORDER[p.role] : 9; };
    var sorted = ps.slice().sort(function (a, b) {
      return (rank(a) - rank(b)) || a.url.localeCompare(b.url);
    });
    return sorted.map(function (p, i) {
      var bits = [];
      if (p.species === 'redirect') bits.push('forwards on');
      else if (i > 0 && p.role !== 'main') bits.push((ROLE_LABEL[p.role] || p.role || '').toLowerCase());
      if (showDoor && p.species !== 'redirect' && DOORS[p.access && p.access.kind]) bits.push(DOORS[p.access.kind]);
      return { url: p.url, text: p.url, label: bits.filter(Boolean).join(' · '), nested: i > 0 };
    });
  }

  function pageRows(pages, items) {
    var keys = {};
    pages.forEach(function (p) { if (p.toolKey) (keys[p.group] = keys[p.group] || {})[p.toolKey] = 1; });
    var folderTool = {};
    Object.keys(keys).forEach(function (g) {
      var k = Object.keys(keys[g]);
      if (k.length === 1) folderTool[g] = k[0];
    });

    var byId = {}, order = [];
    pages.forEach(function (p) {
      var id = rowIdFor(p, folderTool);
      if (!byId[id]) { byId[id] = []; order.push(id); }
      byId[id].push(p);
    });

    return order.map(function (id) {
      var ps = byId[id];
      var main = ps.filter(function (p) { return p.toolKey && p.role === 'main'; })[0] ||
                 ps.filter(function (p) { return p.toolKey; })[0] ||
                 ps.filter(function (p) { return p.role === 'main'; })[0] || ps[0];
      var it = items[id] || {};
      var isTool = id.indexOf('tool:') === 0;
      var isEmbed = main.species === 'embed';
      /* A redirect is a forwarding address, not a way in: it would add
         "Anyone" to a staff tool that has an old public URL. */
      var real = ps.filter(function (p) { return p.species !== 'redirect'; });
      var doors = uniq((real.length ? real : ps).map(function (p) { return DOORS[p.access && p.access.kind]; }))
        .sort(function (a, b) { return DOOR_ORDER.indexOf(a) - DOOR_ORDER.indexOf(b); });
      var auto = [];
      if (main.registryState === 'parked') auto.push('Off the portal (parked)');
      /* The portal has no registry record by design. */
      var warns = uniq([].concat.apply([], ps.map(function (p) {
        return flagsFor(p).map(function (f) {
          /* An old admin address that only forwards on is not an open admin
             page, and one behind a club code is locked, just not by login. */
          if (f.key === 'openadmin') {
            if (p.species === 'redirect') return null;
            if (p.access && p.access.kind === 'code') return 'codeadmin';
          }
          /* Nothing ever links to a page-not-found page. */
          if (f.key === 'orphan' && p.path === '404.html') return null;
          return f.key;
        });
      }))).filter(function (k) { return !(k === 'unregistered' && id === 'tool:portal'); })
        .sort(function (a, b) { return WARN_ORDER.indexOf(a) - WARN_ORDER.indexOf(b); });
      return {
        id: id,
        kind: isTool ? 'Tool' : isEmbed ? 'Website widget' : 'Page',
        name: it.name || (main.registry && main.registry.label) || main.title || main.path,
        does: it.does || (main.registry && main.registry.description) || '',
        url: (isTool && main.registry && main.registry.url) || main.url,
        paths: pathsFor(ps, doors.length > 1),
        doors: doors,
        runsOn: isEmbed ? 'NL website' : 'nl.tools',
        toolKey: isTool ? id.slice(5) : null,
        lifespan: it.lifespan || '',
        status: it.status || 'Not decided',
        note: [it.note].concat(auto).filter(Boolean).join('. '),
        warns: warns,
        hay: ps.map(function (p) { return p.url; }).join(' ')
      };
    });
  }

  /* ── schedules in words ─────────────────────────────────────────────── */

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  var MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July',
                'August', 'September', 'October', 'November', 'December'];

  /* The cron shapes this repo actually uses, in words. Anything else is
     shown as written rather than guessed at. */
  function cronText(c) {
    var f = c.trim().split(/\s+/);
    if (f.length !== 5) return c;
    var m = f[0], h = f[1], dom = f[2], mon = f[3], dow = f[4];
    if (dow !== '*') return c;
    var hours = /^\d+-\d+$/.test(h) ? ', ' + pad(+h.split('-')[0]) + ':00–' + pad(+h.split('-')[1]) + ':59' : '';
    if (dom === '*' && mon === '*') {
      if (m === '*' && h === '*') return 'Every minute';
      var step = /^\*\/(\d+)$/.exec(m);
      if (step && (h === '*' || hours)) return 'Every ' + step[1] + ' minutes' + hours;
      if (/^\d+(,\d+)+$/.test(m) && (h === '*' || hours)) {
        var ms = m.split(',').map(Number), gap = 60 / ms.length;
        var even = ms.every(function (v, i) { return i === 0 || v - ms[i - 1] === gap; });
        if (even) return 'Every ' + gap + ' minutes' + hours;
      }
      if (/^\d+$/.test(m) && h === '*') return 'Hourly';
      if (/^\d+$/.test(m) && /^\d+(,\d+)*$/.test(h)) {
        return 'Daily ' + h.split(',').map(function (x) { return pad(+x) + ':' + pad(+m); }).join(' and ');
      }
      return c;
    }
    if (/^\d+$/.test(dom) && /^\d+$/.test(mon) && /^\d+$/.test(m) && /^\d+$/.test(h)) {
      return dom + ' ' + MONTHS[+mon - 1] + ' ' + pad(+h) + ':' + pad(+m);
    }
    return c;
  }

  /* Firebase's own shorthand ("every 1 minutes", "every day 03:20"). */
  function fnScheduleText(s) {
    var e = /^every (\d+) (minute|hour)s?$/.exec(s);
    if (e) return e[1] === '1' ? (e[2] === 'minute' ? 'Every minute' : 'Hourly') : 'Every ' + e[1] + ' ' + e[2] + 's';
    var d = /^every day (\d\d:\d\d)$/.exec(s);
    if (d) return 'Daily ' + d[1];
    return cronText(s);
  }

  function zone(tz) {
    if (tz === 'Europe/London') return ' UK time';
    if (tz === 'Etc/UTC' || tz === 'UTC') return ' UTC';
    return '';
  }

  var FN_WHEN = { 'called by a page': 'When a page asks', 'database change': 'When its data changes',
                  'web address': 'When its address is called' };

  function jobRows(jobs, items) {
    return jobs.map(function (j) {
      var it = items[j.id] || {};
      var isFn = j.kind === 'function';
      var when;
      if (isFn) {
        when = j.trigger === 'timer' && j.schedule
          ? fnScheduleText(j.schedule) + (/\d\d:\d\d|:00/.test(fnScheduleText(j.schedule)) ? zone(j.timeZone) : '')
          : (FN_WHEN[j.trigger] || j.trigger);
      } else {
        /* GitHub runs every timer on UTC. */
        var parts = (j.schedule || []).map(function (c) {
          var t = cronText(c);
          return t + (/\d\d:\d\d/.test(t) ? ' UTC' : '');
        });
        var tr = j.triggers || [];
        if (tr.indexOf('push') !== -1) parts.push('On merge');
        if (tr.indexOf('pull_request') !== -1) parts.push('On each pull request');
        if (tr.indexOf('repository_dispatch') !== -1) parts.push('Started by a cloud job');
        if (!parts.length && tr.indexOf('workflow_dispatch') !== -1) parts.push('By button');
        when = parts.join('; ');
      }
      return {
        id: j.id,
        kind: 'Background job',
        name: it.name || j.name,
        does: it.does || '',
        url: isFn ? REPO_URL + '/blob/main/' + j.file : REPO_URL + '/actions/workflows/' + j.file.split('/').pop(),
        /* The name opens the run history; the file opens the code. */
        paths: [{ url: REPO_URL + '/blob/main/' + j.file,
                  text: j.file, label: '', nested: false }],
        doors: [],
        runsOn: isFn ? 'Google cloud' : 'GitHub',
        when: when,
        lifespan: it.lifespan || '',
        status: it.status || 'Not decided',
        note: it.note || '',
        warns: [],
        hay: j.file
      };
    });
  }

  function extraRows(extra) {
    return (extra || []).map(function (x) {
      return {
        id: x.id, kind: x.kind, name: x.name, does: x.does || '', url: x.url || '',
        paths: [], doors: [], runsOn: x.runsOn || '', when: x.use || '',
        lifespan: x.lifespan || '', status: x.status || 'Not decided', note: x.note || '', warns: [], hay: ''
      };
    });
  }

  /* ── usage ──────────────────────────────────────────────────────────── */

  /* Opens per tool over the last 90 days, from the nightly counters. Days
     there are UTC dates, so the cut-off is too. */
  function readUsage() {
    var from = new Date(Date.now() - USAGE_DAYS * 864e5).toISOString().slice(0, 10);
    return db.ref('app-data/ops-data/daily').orderByKey().startAt(from).once('value').then(function (snap) {
      var out = {};
      snap.forEach(function (day) {
        var d = day.key;
        day.forEach(function (t) {
          var v = t.val() || {}, o = out[t.key] = out[t.key] || { opens: 0, last: null };
          o.opens += v.opens || 0;
          if (v.opens && (!o.last || d > o.last)) o.last = d;
        });
      });
      return out;
    });
  }

  function useCell(r) {
    if (r.kind === 'Background job') {
      return r.when ? NL.escHtml(r.when) : '<span class="est-muted">—</span>';
    }
    if (!r.toolKey) {
      return '<span class="est-muted" title="Only opens by signed-in people are counted">Not counted</span>';
    }
    if (!all.usage) return '<span class="est-muted">—</span>';
    var u = all.usage[r.toolKey];
    if (!u || !u.opens) return 'Not opened';
    return '<span class="est-cell">' + u.opens.toLocaleString('en-GB') + (u.opens === 1 ? ' open' : ' opens') + '</span>' +
      '<span class="est-sub est-muted">last ' + NL.escHtml(NL.formatDate(u.last)) + '</span>';
  }

  /* ── table ──────────────────────────────────────────────────────────── */

  function allMatches(r) {
    if (all.kind.length && all.kind.indexOf(r.kind) === -1) return false;
    if (all.door.length && !r.doors.some(function (d) { return all.door.indexOf(d) !== -1; })) return false;
    if (all.runs.length && all.runs.indexOf(r.runsOn) === -1) return false;
    if (all.status.length && all.status.indexOf(r.status) === -1) return false;
    if (all.warn.length && !r.warns.some(function (w) { return all.warn.indexOf(w) !== -1; })) return false;
    if (all.search) {
      var hay = [r.name, r.does, r.note, r.url, r.id, r.runsOn, r.when, r.hay].concat(r.doors)
        .concat(r.warns.map(function (w) { return WARN[w].label; }))
        .filter(Boolean).join(' ').toLowerCase();
      if (hay.indexOf(all.search) === -1) return false;
    }
    return true;
  }

  function allRowHtml(r) {
    var name = r.url
      ? '<a class="est-name" href="' + NL.escHtml(r.url) + '" target="_blank" rel="noopener">' + NL.escHtml(r.name) + '</a>'
      : '<span class="est-name">' + NL.escHtml(r.name) + '</span>';
    var status = STATUS_PILL[r.status]
      ? '<span class="pill ' + STATUS_PILL[r.status] + '">' + NL.escHtml(r.status) + '</span>'
      : '<span class="est-muted">' + NL.escHtml(r.status) + '</span>';
    return '<tr>' +
      '<td>' + name +
        (r.does ? '<span class="est-does">' + NL.escHtml(r.does) + '</span>' : '') +
        (r.paths.length ? '<div class="est-paths">' + r.paths.map(function (pt) {
          return '<div class="est-path' + (pt.nested ? ' est-path--nested' : '') + '">' +
            '<a class="est-url" href="' + NL.escHtml(pt.url) + '" target="_blank" rel="noopener">' + NL.escHtml(pt.text) + '</a>' +
            (pt.label ? '<span class="est-muted">' + NL.escHtml(pt.label) + '</span>' : '') + '</div>';
        }).join('') + '</div>' : '') +
        (r.warns.length ? '<div class="est-tags est-tags--under">' + r.warns.map(function (w) {
          return '<span class="pill ' + WARN[w].pill + '"' +
            (WARN[w].title ? ' title="' + NL.escHtml(WARN[w].title) + '"' : '') + '>' + NL.escHtml(WARN[w].label) + '</span>';
        }).join('') + '</div>' : '') +
      '</td>' +
      '<td>' + (r.doors.length ? '<div class="est-tags">' + r.doors.map(function (d) {
          return '<span class="pill ' + (DOOR_PILL[d] || 'est-pill--plain') + '">' + NL.escHtml(d) + '</span>';
        }).join('') + '</div>' : '<span class="est-muted">—</span>') + '</td>' +
      '<td>' + (r.runsOn ? '<span class="pill est-pill--plain">' + NL.escHtml(r.runsOn) + '</span>' : '<span class="est-muted">—</span>') + '</td>' +
      '<td>' + useCell(r) + '</td>' +
      '<td class="est-cell">' + (r.lifespan ? NL.escHtml(r.lifespan) : '<span class="est-muted">—</span>') + '</td>' +
      '<td>' + status + (r.note ? '<span class="est-statnote">' + NL.escHtml(r.note) + '</span>' : '') + '</td>' +
      '</tr>';
  }

  var ALL_HEAD = '<thead><tr><th>Name and what it does</th><th>Who can open it</th><th>Runs on</th>' +
    '<th title="Tools: opens by signed-in people in the last 90 days. Jobs: when they run.">Use, or when it runs</th>' +
    '<th>Lifespan</th><th>Status</th></tr></thead>';

  function renderAll() {
    var rows = all.rows.filter(allMatches);
    var el = document.getElementById('allTable');
    if (!rows.length) { el.innerHTML = '<div class="empty-state">Nothing matches.</div>'; return; }
    var body = '';
    KINDS.forEach(function (k) {
      var group = rows.filter(function (r) { return r.kind === k; });
      if (!group.length) return;
      body += '<tbody><tr class="est-grouprow"><td colspan="6">' + NL.escHtml(KIND_PLURAL[k]) +
        ' <span>' + group.length + '</span></td></tr>' + group.map(allRowHtml).join('') + '</tbody>';
    });
    el.innerHTML = '<table class="est-table est-all">' + ALL_HEAD + body + '</table>';
  }

  function countBy(fn) {
    var c = {};
    all.rows.forEach(function (r) { [].concat(fn(r)).forEach(function (v) { if (v) c[v] = (c[v] || 0) + 1; }); });
    return c;
  }

  function opts(order, counts) {
    var keys = order.filter(function (k) { return counts[k]; })
      .concat(Object.keys(counts).filter(function (k) { return order.indexOf(k) === -1; }).sort());
    return keys.map(function (k) { return { value: k, label: k, count: counts[k] }; });
  }

  function setupAll(inv, est) {
    var items = (est && est.items) || {};
    all.rows = pageRows(inv.pages, items)
      .concat(jobRows(inv.jobs || [], items))
      .concat(extraRows(est && est.extra));
    all.rows.forEach(function (r) {
      if (KINDS.indexOf(r.kind) === -1) r.kind = 'Page';
    });
    all.rows.sort(function (a, b) { return a.name.localeCompare(b.name, 'en-GB', { sensitivity: 'base' }); });

    var kinds = countBy(function (r) { return r.kind; });
    var needLook = all.rows.filter(function (r) { return r.warns.length; }).length;
    document.getElementById('allStats').innerHTML = KINDS.map(function (k) {
      return '<div class="stat"><div class="stat__num">' + (kinds[k] || 0) + '</div>' +
             '<div class="stat__label">' + NL.escHtml(KIND_PLURAL[k]) + '</div></div>';
    }).join('') + '<div class="stat"><div class="stat__num">' + needLook + '</div>' +
      '<div class="stat__label">Need a look</div></div>';

    NL.filterButton('#fKind', { label: 'What it is', options: opts(KINDS, kinds),
      onChange: function (v) { all.kind = v; renderAll(); } });
    NL.filterButton('#fDoor', { label: 'Who can open it', options: opts(DOOR_ORDER, countBy(function (r) { return r.doors; })),
      onChange: function (v) { all.door = v; renderAll(); } });
    NL.filterButton('#fRuns', { label: 'Runs on', options: opts(['nl.tools', 'NL website', 'Google cloud', 'GitHub'], countBy(function (r) { return r.runsOn; })),
      onChange: function (v) { all.runs = v; renderAll(); } });
    NL.filterButton('#fStatus', { label: 'Status', options: opts(STATUSES, countBy(function (r) { return r.status; })),
      onChange: function (v) { all.status = v; renderAll(); } });
    var wc = countBy(function (r) { return r.warns; });
    NL.filterButton('#fWarn', { label: 'Needs a look', allLabel: 'Any',
      options: WARN_ORDER.filter(function (k) { return wc[k]; }).map(function (k) {
        return { value: k, label: WARN[k].label, count: wc[k] };
      }),
      onChange: function (v) { all.warn = v; renderAll(); } });

    var search = document.getElementById('allSearch');
    search.addEventListener('input', function () {
      all.search = search.value.trim().toLowerCase();
      renderAll();
    });

    document.getElementById('allNote').textContent =
      'Pages and jobs are read from the repo (list updated ' + NL.formatDateTime(inv.generated) + '). ' +
      'Names, statuses and notes, and the Apps Script projects, are kept by hand in system/estate.json. ' +
      'Use counts opens by signed-in people over the last ' + USAGE_DAYS + ' days; visits made with a club code are not counted yet.';
    renderAll();
  }

  /* ── tabs ───────────────────────────────────────────────────────────── */

  var VIEWS = { all: 'viewAll', tech: 'viewTech', meta: 'viewMeta' };

  function wireTabs() {
    var tabs = document.getElementById('estTabs');
    tabs.addEventListener('click', function (e) {
      var btn = e.target.closest('[data-view]');
      if (!btn) return;
      var view = btn.getAttribute('data-view');
      Array.prototype.forEach.call(tabs.querySelectorAll('.tab'), function (t) {
        var on = t === btn;
        t.classList.toggle('active', on);
        t.setAttribute('aria-selected', on ? 'true' : 'false');
      });
      Object.keys(VIEWS).forEach(function (k) {
        document.getElementById(VIEWS[k]).hidden = k !== view;
      });
    });
  }

  /* ── boot ──────────────────────────────────────────────────────────────── */

  window.TOOL = window.TOOL || {};
  window.TOOL.boot = function () {
    renderMeta();   /* static shelf — renders even if the inventory fetch fails */
    wireTabs();
    var getJson = function (url) {
      return fetch(url, { cache: 'no-cache' }).then(function (r) {
        if (!r.ok) throw new Error(url + ' HTTP ' + r.status);
        return r.json();
      });
    };
    /* The hand-kept file and the usage counters only add detail: if either
       fails, the list still shows, and the note says what is missing. */
    var est = getJson(ESTATE_URL).catch(function (err) {
      console.error('[estate] estate.json load failed', err);
      return null;
    });
    /* A thrown error (not just a rejected read) must not stop the list. */
    var usage = new Promise(function (ok) { ok(readUsage()); }).catch(function (err) {
      console.error('[estate] usage read failed', err);
      return null;
    });

    Promise.all([getJson(INVENTORY_URL), est, usage])
      .then(function (res) {
        var data = res[0];
        var ungated = {};
        (data.ungatedRegistered || []).forEach(function (r) { ungated[r.url] = true; });
        data.pages.forEach(function (p) { p.ungatedButRegistered = Boolean(ungated[p.url]); });

        state.data = data;
        wire();
        render();

        all.usage = res[2];
        setupAll(data, res[1]);
        if (!res[1]) NL.toast('Could not load the names and statuses (system/estate.json)', 'error');
        if (!res[2]) NL.toast('Could not load the use counts', 'error');
      })
      .catch(function (err) {
        console.error('[estate] inventory load failed', err);
        var msg = '<div class="empty-state">Could not load the list. ' +
          'It is built by the Update the Estate list job on every merge.</div>';
        document.getElementById('allTable').innerHTML = msg;
        document.getElementById('estTools').innerHTML = msg;
      });
  };

  /* If auth-guard fired before this script loaded, replay the session. */
  if (window._toolDeferredSession) {
    window.TOOL.boot(window._toolDeferredSession);
    delete window._toolDeferredSession;
  }
})();
</script>

</body>
</html>
