<!DOCTYPE html>
<!--
  NL Tools — Estate
  Version: v0.5 (16/08/2026)
  File: /estate/index.html

  Every page in the repo as a table of detail — what it is, how it is reached,
  whether it is on canon, what data it owns, and what links to it.

  Why this exists: the portal only lists gated tools that have an RTDB
  `tools/<toolKey>` record. Everything else — public companion forms, passcode
  pages, CMS embeds, lab experiments, redirect stubs — appears nowhere at all,
  and a gated tool whose registry record was never created is invisible too.
  Roughly half the repo's pages were unlisted by anything before this page.

  Shape of the page (v0.2):
    Tools are the page. Embeds, assets and sandbox pages are separate FAMILIES,
    not peers of a tool, and sit in collapsed sections below so they stop
    competing for attention — an embed is something to paste into the Urban Zoo
    CMS, an asset stub is a crest index. Counts stay visible so a family that
    starts drifting is still noticed.

    Within the tools family, rows carry a ROLE, because the repo has two
    standing conventions the portal does not show:

      <tool>/admin/   the tool's admin panel — a separate gated page that gets
                      no portal card of its own.
      <tool>/reader/  the tool's PUBLIC no-login view of the stamped/published
                      version. The gated tool edits; the reader shows what has
                      been published. Adopted as the standard shape on
                      15/08/2026, so any future <tool>/reader/ is recognised on
                      the day it lands instead of sitting here as a loose page.

    A public form and the console behind it are one tool in two files, and the
    role column is what says so.

  Data:
    /assets/data/tools-inventory.json    generated by scripts/build-inventory.js,
                                         rebuilt by .github/workflows/build-inventory.yml
                                         on every push to main. Read-only — this
                                         page writes nothing and owns no RTDB path.

  Access (RTDB tools/ops-estate):
    superadmin admin · everyone else off. It is a map of the estate, including
    pages that are deliberately obscure; it is not a directory for clubs.

  Reading the flags:
    Parked          the toolKey sits in tools-registry.parked.json: deliberately
                    off the portal with its code retained, per
                    system/tool-status-and-access.md. A decision, not a fault —
                    so it is a neutral pill, not a flag.
    Unaccounted for the toolKey is in NEITHER registry file. The snapshots can
                    lag live RTDB, so this means "worth checking in the
                    console", not "definitely broken".
    No inbound      nothing else in the repo links to this URL. The strongest
                    retire signal available — git dates are useless here because
                    brand sweeps rewrite every file at once. Not applied to
                    embeds (their links live in the Urban Zoo CMS) or to gated
                    tools (they are reached from the portal, not from markup).
    Gated in name   a registry record points at a page that has no auth-guard.

  Reading the columns:
    Canon    which of the four shared files the page loads, and at what ?v= —
             B(rand) U(tils) T(opbar) G(uard). Green current, amber stale, red
             loaded with no ?v= at all (caches indefinitely past a deploy), grey
             absent. Grey is normal on a public page: it has no topbar or guard
             by design. lint-tools.sh only checks nl-brand.css on non-gated
             pages, so for ~47 pages this column is the only thing looking.
    Data     the app-data/<key> the page touches, red when rules.snapshot.json
             has no cover for it. Unlike the registry snapshots, that file IS
             the deployed rules document, so an uncovered path is a real gap
             rather than a possibly-stale mirror.
    Debt     raw hex colours and native confirm/alert/prompt — where a brand
             pass would find work. NOT counted for embeds (the CMS strips
             <link> tags, so inlining colour is their delivery contract) or for
             the Style Guide (hex is its content). One embed carries 227; left
             in, it would dominate the ranking forever and mean nothing.
-->

  <script>
    window.NL_TOOL = {

    window.NL_CHANGELOG = [

<style>
  /* #pageWrap default hide is in nl-brand.css; auth-guard reveals with
     style.display = 'block'. Don't clear with '' — would re-trigger the
     brand rule and re-hide the page. */

  /* Search field. The canon has .filter-bar/.chip but no text input inside
     one, so this is the only input styling here. */
  .est-search {
    flex: 1 1 260px;
    min-width: 200px;
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font: inherit;
    font-size: var(--text-sm);
    color: var(--text);
    background: var(--white);
  }
  .est-search:focus { outline: none; border-color: var(--navy); }

  /* One table for the whole family, with a header row per tool group rather
     than a table per group — grouping inside a single table keeps every column
     aligned down the page, which is the entire point of a detail table. */
  .est-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .est-table th {
    text-align: left;
    padding: 7px 10px;
    font-size: var(--text-xs);
    font-variation-settings: 'wght' 800;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-muted);
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
    background: var(--white);
    position: sticky;
    top: 0;
    z-index: 2;
  }
  .est-table td {
    padding: 7px 10px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
  }
  .est-table tbody tr:hover td { background: var(--off-white); }

  .est-grouprow td {
    background: var(--navy-50);
    font-variation-settings: 'wght' 800;
    color: var(--navy);
    font-size: var(--text-xs);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 6px 10px;
    border-bottom: 1px solid var(--border);
  }
  .est-grouprow td span { font-variation-settings: 'wght' 500; text-transform: none; letter-spacing: 0; color: var(--text-muted); }

  .est-url {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    font-variation-settings: 'wght' 700;
    color: var(--primary);
    text-decoration: none;
    white-space: nowrap;
  }
  .est-url:hover { text-decoration: underline; }
  /* A nested page is indented so the shape of a tool — front door, admin,
     companions — is legible at a glance without reading every path. */
  .est-url--nested { padding-left: 12px; }

  .est-title { font-variation-settings: 'wght' 600; }
  .est-sum {
    color: var(--text-muted);
    font-size: 12px;
    line-height: 1.4;
    display: block;
    max-width: 46ch;
  }
  .est-muted { color: var(--text-muted); font-size: 12px; white-space: nowrap; }

  /* Canon badges: B U T G, one letter per shared file. */
  .est-canon { display: flex; gap: 3px; }
  .est-cb {
    width: 18px; height: 18px;
    border-radius: 3px;
    font-size: 10px;
    font-variation-settings: 'wght' 800;
    display: inline-flex; align-items: center; justify-content: center;
    border: 1px solid transparent;
  }
  .est-cb--current { background: var(--green-light); color: var(--green); }
  .est-cb--stale   { background: var(--amber-light); color: var(--amber); }
  .est-cb--unversioned { background: var(--red-light); color: var(--red); }
  /* Absent is deliberately quiet, not a warning: a public page has no topbar
     and no guard by design, and colouring that red would cry wolf on ~30 rows. */
  .est-cb--absent  { background: var(--off-white); color: var(--navy-300); border-color: var(--border); }

  .est-key {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;

    color: var(--text-muted);
    white-space: nowrap;
  }

  /* The meta shelf. Cards for the tools, a compact list for the library —
     documents are read on GitHub, so a row is a pointer, not a page. */
  .est-meta { margin-top: 34px; border-top: 3px solid var(--navy); padding-top: 4px; }
  .est-meta__h {

  .est-meta__card {

    border: 1px solid var(--border); border-radius: var(--radius);
    text-decoration: none; color: var(--text);

  .est-meta__row b { color: var(--navy); white-space: nowrap; font-variation-settings: 'wght' 700; }

  .est-fam { margin-top: 22px; }
  .est-fam > summary {
    cursor: pointer;
    padding: 10px 14px;
    background: var(--off-white);
    border: 1px solid var(--border);
    border-radius: var(--radius);

    overflow-x: auto;
    background: var(--white);
  }
  .est-wrap {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--white);
    box-shadow: var(--shadow);
    overflow-x: auto;
  }

  .est-note { font-size: var(--text-xs); color: var(--text-muted); margin-top: 18px; line-height: 1.5; }
</style>

<body>

<!-- Topbar — auto-rendered by /system/nl-topbar.js from window.NL_TOOL -->
<div id="nlTopbar"></div>

<div id="pageWrap">
  <div class="page">

    <div class="stats" id="estStats"></div>

    <div class="filter-bar filter-bar--stacked">
      <div class="filter-row">
        <input type="search" class="est-search" id="estSearch"
               placeholder="Search path, title, description or RTDB key" aria-label="Search the estate">
        <button class="btn btn--ghost btn--sm" id="estCopy">Copy paths</button>
      </div>
      <div class="filter-row">
        <span class="filter-label">Role</span>
        <div class="chip-group" id="estRoles"></div>
      </div>
      <div class="filter-row">
        <span class="filter-label">Flags</span>
        <div class="chip-group" id="estFlags"></div>
      </div>
    </div>

    <div class="est-wrap" id="estTools"></div>
    <div id="estFamilies"></div>

    <!-- The master layer. Curated, not generated: the inventory knows pages,
         but which page is meta-tooling and what each document DECIDES is
         editorial knowledge, and the whole point of this shelf is that it is
         findable — CLAUDE.md carried the line "these exist and are not linked
         from anywhere a session would find them" for a month before this. -->
    <section class="est-meta">
      <h2 class="est-meta__h">Meta — tools about the estate</h2>
      <div class="est-meta__grid" id="estMetaTools"></div>
      <h2 class="est-meta__h">Library — plans, decisions and records</h2>
      <div class="est-meta__list" id="estLibrary"></div>
    </section>

    <p class="est-note" id="estNote"></p>

  </div>
</div>

<!-- Main app -->
<script>
(function () {
  'use strict';

  var INVENTORY_URL = '/assets/data/tools-inventory.json';

  /* Families. `tool` is the estate you manage and gets the main table; the rest
     are collapsed below with a one-line note saying why they are separate, so
     the distinction is stated rather than assumed. */
  var FAMILIES = [
    { key: 'embed',   label: 'Embeds',  note: 'Pasted into the Urban Zoo CMS. No auth-guard, inline styles only — a different delivery contract, so canon and inbound-link columns do not apply the same way.' },
    { key: 'asset',   label: 'Assets',  note: 'Generated directory listings for crests and division art. Not tools.' },
    { key: 'sandbox', label: 'Sandbox', note: 'brand-dev/ — brand development mockups. Internal meta-tooling, same family as Estate and the Style Guide.' },
    { key: 'system',  label: 'System',  note: 'Pages under system/ that are not mockups.' }
  ];

  var ROLES = [
    { key: 'main',      label: 'Main' },
    { key: 'admin',     label: 'Admin' },
    { key: 'reader',    label: 'Reader' },
    { key: 'sub',       label: 'Sub-page' },
    { key: 'companion', label: 'Companion' },
    { key: 'variant',   label: 'Variant' }
  ];
  var ROLE_LABEL = {};
  ROLES.forEach(function (r) { ROLE_LABEL[r.key] = r.label; });

  var ROLE_PILL = {
    main: 'pill--info',
    admin: 'pill--postponed',
    reader: 'pill--approved',
    sub: 'pill--info',
    companion: 'pill--soon',
    variant: 'pill--soon'
  };

  /* See the header note: a no-inbound-link finding only means something where
     markup is how the page is reached. */
  var INBOUND_MEANINGFUL = { companion: 1, public: 1, sandbox: 1, redirect: 1 };

  var CANON_KEYS = [
    { key: 'nl-brand',   letter: 'B', name: 'nl-brand.css' },
    { key: 'nl-utils',   letter: 'U', name: 'nl-utils.js' },
    { key: 'nl-topbar',  letter: 'T', name: 'nl-topbar.js' },
    { key: 'auth-guard', letter: 'G', name: 'auth-guard.js' }
  ];

  var state = { data: null, search: '', role: null, flag: null };

  /* ── flags ─────────────────────────────────────────────────────────────── */

  function flagsFor(page) {
    var out = [];
    if (page.registryState === 'none') {
      out.push({ key: 'unregistered', label: 'Unaccounted for', pill: 'pill--pending' });
    }
    if (page.ungatedButRegistered) {
      out.push({ key: 'ungated', label: 'Gated in name only', pill: 'pill--rejected' });
    }
    if (page.role === 'admin' && !page.gated) {
      out.push({ key: 'openadmin', label: 'Admin, no auth-guard', pill: 'pill--rejected' });
    }
    if ((page.appDataUncovered || []).length) {
      out.push({ key: 'norules', label: 'No RTDB rules', pill: 'pill--rejected' });
    }
    if (canonProblem(page)) {
      out.push({ key: 'canon', label: 'Canon drift', pill: 'pill--pending' });
    }
    if (INBOUND_MEANINGFUL[page.species] && page.inbound.length === 0) {
      out.push({ key: 'orphan', label: 'No inbound link', pill: 'pill--expired' });
    }
    return out;
  }

  /** Stale or unversioned counts as drift. Absent does not — see the CSS note. */
  function canonProblem(page) {
    return CANON_KEYS.some(function (c) {
      var s = page.canon && page.canon[c.key];
      return s && (s.state === 'stale' || s.state === 'unversioned');
    });
  }

  function matches(page) {
    if (state.role && page.role !== state.role) return false;
    if (state.flag) {
      if (!flagsFor(page).some(function (f) { return f.key === state.flag; })) return false;
    }
    if (state.search) {
      var hay = [page.url, page.path, page.title, page.summary, page.toolKey]
        .concat(page.appData || []).filter(Boolean).join(' ').toLowerCase();
      if (hay.indexOf(state.search) === -1) return false;
    }
    return true;
  }

  /* ── cells ─────────────────────────────────────────────────────────────── */

  function canonCell(page) {
    var cells = CANON_KEYS.map(function (c) {
      var s = (page.canon && page.canon[c.key]) || { state: 'absent', version: null };
      var title = c.name + ' — ' + s.state + (s.version ? ' (?v=' + s.version + ')' : '');
      return '<span class="est-cb est-cb--' + s.state + '" title="' + NL.escHtml(title) + '">' +
             c.letter + '</span>';
    });
    return '<div class="est-canon">' + cells.join('') + '</div>';
  }

  function dataCell(page) {
    var keys = page.appData || [];
    if (!keys.length) return '<span class="est-muted">—</span>';
    var bad = page.appDataUncovered || [];
    return keys.map(function (k) {
      var isBad = bad.indexOf(k) !== -1;
      return '<div class="est-key' + (isBad ? ' est-key--bad' : '') + '"' +
             (isBad ? ' title="No cover in rules.snapshot.json — writes here are denied"' : '') +
             '>' + NL.escHtml(k) + (isBad ? ' ⚠' : '') + '</div>';
    }).join('');
  }

  function debtCell(page) {
    if (!page.violationsApply) return '<span class="est-muted" title="Inline colour is this page’s delivery contract, not debt">n/a</span>';
    var v = page.violations || { hex: 0, nativeDialogs: 0 };
    if (!v.hex && !v.nativeDialogs) return '<span class="est-muted">—</span>';
    var bits = [];
    if (v.hex) bits.push(v.hex + ' hex');
    if (v.nativeDialogs) bits.push(v.nativeDialogs + ' dlg');
    return '<span class="est-muted" title="Raw hex colours / native confirm-alert-prompt">' +
           NL.escHtml(bits.join(' · ')) + '</span>';
  }

  /* Pill class per access kind — the WHO of a row, derived by the inventory
     from registry defaults (gated pages) or gate mechanics (ungated ones).
     Red-tinted for superadmin so the most restricted rows read at a glance;
     amber for code-entered, where the URL+code is doing the gating. */
  var ACCESS_PILL = {
    superadmin: 'pill--postponed',
    staff: 'pill--info',
    club: 'pill--approved',
    code: 'pill--pending',
    open: 'pill--soon'
  };

  function accessCell(page) {
    var bits = [];
    if (page.access && page.access.label) {
      bits.push('<span class="pill ' + (ACCESS_PILL[page.access.kind] || 'pill--info') + '" title="' +
        NL.escHtml('Derived from ' + (page.gated ? 'the registry record’s role defaults' : 'the page’s gate mechanics')) +
        '">' + NL.escHtml(page.access.label) + '</span>');
    } else {
      /* Inventory predates the access field — fall back to the old pills. */
      bits.push(page.gated
        ? '<span class="pill pill--approved">Gated</span>'
        : '<span class="pill pill--soon">Public</span>');
      if (page.registryState === 'live') {
        var aud = page.registry && page.registry.audience;
        bits.push('<span class="pill pill--info">' + NL.escHtml(aud || 'portal') + '</span>');
      }
    }
    if (page.registryState === 'parked') {
      bits.push('<span class="pill pill--info" title="' +
        NL.escHtml('Deliberately off the portal' + (page.parkedStage ? ' — ' + page.parkedStage : '')) +
        '">Parked</span>');
    } else if (page.registryState === 'none') {
      bits.push('<span class="pill pill--pending">No record</span>');
    }
    return bits.join(' ');
  }

  function rowHtml(page) {
    var name = (page.registry && page.registry.label) || page.title || '';
    var nested = page.role !== 'main';
    var flagPills = flagsFor(page).filter(function (f) {
      /* Registry state already shows in the Access column; repeating it as a
         flag pill would say the same thing twice on the same row. */
      return f.key !== 'unregistered';
    });

    return '<tr>' +
      '<td><a class="est-url' + (nested ? ' est-url--nested' : '') + '" href="' + NL.escHtml(page.url) +
        '" target="_blank" rel="noopener">' + NL.escHtml(page.url) + '</a></td>' +
      '<td><span class="pill ' + (ROLE_PILL[page.role] || 'pill--info') + '">' +
        NL.escHtml(ROLE_LABEL[page.role] || page.role) + '</span></td>' +
      '<td>' + (name ? '<span class="est-title">' + NL.escHtml(name) + '</span>' : '') +
        (page.version ? ' <span class="est-muted">' + NL.escHtml(page.version) + '</span>' : '') +
        (page.summary ? '<span class="est-sum">' + NL.escHtml(page.summary) + '</span>' : '') +
        (flagPills.length ? '<div style="margin-top:4px">' + flagPills.map(function (f) {
          return '<span class="pill ' + f.pill + '">' + NL.escHtml(f.label) + '</span>';
        }).join(' ') + '</div>' : '') +
      '</td>' +
      '<td>' + accessCell(page) + '</td>' +
      '<td>' + canonCell(page) + '</td>' +
      '<td>' + dataCell(page) + '</td>' +
      '<td>' + debtCell(page) + '</td>' +
      '<td class="est-muted" title="' + NL.escHtml(page.inbound.join(', ')) + '">' +
        page.inbound.length + '</td>' +
      /* lastSubstantive, not lastCommit. Bumping a shared file's ?v= rewrites
         one line in all 64 pages at once, so after a bump every row here read
         as changed today and the column said nothing. This is the date of the
         last commit that did something other than a cache-bust. */
      '<td class="est-muted" title="' +
        (page.lastCommit && page.lastSubstantive && page.lastCommit !== page.lastSubstantive
          ? 'Last touched at all ' + page.lastCommit + ', but only by a canon cache-bust'
          : '') + '">' +
        (page.lastSubstantive || page.lastCommit || '—') +
        '<br>' + Math.round(page.bytes / 1024) + 'kb</td>' +
      '</tr>';
  }

  var HEAD = '<thead><tr>' +
    '<th>Page</th><th>Role</th><th>What it is</th><th>Access</th>' +
    '<th title="B brand · U utils · T topbar · G guard">Canon</th>' +
    '<th>Data</th><th>Debt</th><th title="Files in the repo linking here">In</th>' +
    '<th title="Last commit that was not just a canon cache-bump">Changed</th>' +
    '</tr></thead>';

  function tableFor(pages, groupBy) {
    if (!pages.length) return '<div class="empty-state">Nothing matches that filter.</div>';

    var body = '';
    if (groupBy) {
      var groups = {};
      pages.forEach(function (p) { (groups[p.group || '(root)'] = groups[p.group || '(root)'] || []).push(p); });
      Object.keys(groups).sort().forEach(function (g) {
        var rows = groups[g].slice().sort(function (a, b) {
          /* Front door first, then its admin, then the rest — the tool's own
             shape, rather than alphabetical order which splits them up. */
          var order = { main: 0, admin: 1, reader: 2, sub: 3, companion: 4, variant: 5 };
          return (order[a.role] - order[b.role]) || a.url.localeCompare(b.url);
        });
        body += '<tbody><tr class="est-grouprow"><td colspan="9">' + NL.escHtml(g) +
                ' <span>' + rows.length + (rows.length === 1 ? ' page' : ' pages') + '</span></td></tr>' +
                rows.map(rowHtml).join('') + '</tbody>';
      });
    } else {
      body = '<tbody>' + pages.slice().sort(function (a, b) {
        return a.url.localeCompare(b.url);
      }).map(rowHtml).join('') + '</tbody>';
    }
    return '<table class="est-table">' + HEAD + body + '</table>';
  }

  /* ── render ────────────────────────────────────────────────────────────── */

  function renderStats() {
    var P = state.data.pages;
    var tools = P.filter(function (p) { return p.family === 'tool'; });
    var count = function (fn) { return P.filter(fn).length; };

    var cards = [
      { num: new Set(tools.map(function (p) { return p.group; })).size, label: 'Tools' },
      { num: tools.length, label: 'Tool pages' },
      { num: count(function (p) { return p.registryState === 'none'; }), label: 'Unaccounted for' },
      { num: count(function (p) { return canonProblem(p); }), label: 'Canon drift' },
      { num: count(function (p) { return (p.appDataUncovered || []).length; }), label: 'No RTDB rules' },
      { num: count(function (p) { return INBOUND_MEANINGFUL[p.species] && !p.inbound.length; }), label: 'No inbound link' }
    ];
    document.getElementById('estStats').innerHTML = cards.map(function (s) {
      return '<div class="stat"><div class="stat__num">' + s.num + '</div>' +
             '<div class="stat__label">' + NL.escHtml(s.label) + '</div></div>';
    }).join('');
  }

  function renderChips() {
    var tools = state.data.pages.filter(function (p) { return p.family === 'tool'; });

    var counts = {};
    tools.forEach(function (p) { counts[p.role] = (counts[p.role] || 0) + 1; });
    var rc = ['<button class="chip' + (state.role ? '' : ' active') + '" data-role="">All</button>'];
    ROLES.forEach(function (r) {
      if (!counts[r.key]) return;
      rc.push('<button class="chip' + (state.role === r.key ? ' active' : '') +
              '" data-role="' + r.key + '">' + NL.escHtml(r.label) + ' ' + counts[r.key] + '</button>');
    });
    document.getElementById('estRoles').innerHTML = rc.join('');

    var fc = {};
    state.data.pages.forEach(function (p) {
      flagsFor(p).forEach(function (f) { fc[f.key] = (fc[f.key] || 0) + 1; });
    });
    var fl = ['<button class="chip' + (state.flag ? '' : ' active') + '" data-flag="">Any</button>'];
    [
      { key: 'norules',      label: 'No RTDB rules' },
      { key: 'openadmin',    label: 'Admin, no auth-guard' },
      { key: 'ungated',      label: 'Gated in name only' },
      { key: 'canon',        label: 'Canon drift' },
      { key: 'unregistered', label: 'Unaccounted for' },
      { key: 'orphan',       label: 'No inbound link' }
    ].forEach(function (f) {
      if (!fc[f.key]) return;
      fl.push('<button class="chip' + (state.flag === f.key ? ' active' : '') +
              '" data-flag="' + f.key + '">' + NL.escHtml(f.label) + ' ' + fc[f.key] + '</button>');
    });
    document.getElementById('estFlags').innerHTML = fl.join('');
  }

  function renderTables() {
    var visible = state.data.pages.filter(matches);

    document.getElementById('estTools').innerHTML =
      tableFor(visible.filter(function (p) { return p.family === 'tool'; }), true);

    var out = '';
    FAMILIES.forEach(function (fam) {
      var rows = visible.filter(function (p) { return p.family === fam.key; });
      var total = state.data.pages.filter(function (p) { return p.family === fam.key; }).length;
      if (!total) return;
      out += '<details class="est-fam"><summary>' + NL.escHtml(fam.label) + ' — ' + total +
             ' <span class="est-fam__note">' + NL.escHtml(fam.note) + '</span></summary>' +
             '<div class="est-panel">' + tableFor(rows, false) + '</div></details>';
    });
    document.getElementById('estFamilies').innerHTML = out;
  }

  function renderNote() {
    var d = state.data;
    document.getElementById('estNote').textContent =
      'Generated ' + NL.formatDateTime(d.generated) + ' from ' + d.registrySource +
      '. Registry state comes from the in-repo snapshots, which can lag live RTDB — check the console before concluding a tool is unregistered. RTDB rules cover is read from rules.snapshot.json, which IS the deployed document.';
  }

  /* ── the meta shelf ─────────────────────────────────────────────────────
     Curated by hand, rendered once — it does not react to the filters above,
     because "what governs the estate" is not a thing you search, it is a
     thing you must be able to FIND. Documents link to their GitHub render:
     they live as markdown in the repo on purpose (versioned, PR-reviewed),
     and GitHub already renders markdown better than a hand-rolled viewer. */
  var GH = 'https://github.com/thenationalleague/tools/blob/main/';
  var META_TOOLS = [
    { href: '/style-guide/',  label: 'Style Guide',
      note: 'The living visual reference — every token and component, rendered. Superadmin only.' },
    { href: '/club-directory/meta-reference.html', label: 'Meta Reference',
      note: 'The clubs-meta field dictionary — what every field means and which tools read it.' },
    { href: '/nls-monitor/', label: 'NLServices API',
      note: 'Live monitor of the NLServices API ingester — run health, matchdays, events. Superadmin only.' },
    { href: '/brand-dev/portal.html', label: 'Brand Dev',
      note: 'Brand-direction mockups (v3 type scale: portal, tasks, travel-planner). Mocks may disagree with the current brand — that is their job.' },
    { href: GH + 'CLAUDE.md', label: 'CLAUDE.md',
      note: 'The working contract every Claude session reads first. The closest thing to a constitution.' }
  ];
  var LIBRARY = [
    { p: 'system/CONSOLIDATION.md',             d: 'The master plan — every tool draws from one shared place. Seven workstreams.' },
    { p: 'system/tool-status-and-access.md',    d: 'Which tools are live, parked or retired, and the per-role access model for each.' },
    { p: 'system/retired/README.md',            d: 'Every retired tool’s post-mortem — read before proposing to build anything that existed once.' },
    { p: 'system/gas-to-functions-migration.md',d: 'Locked decision: retire the public Apps Script app; Firebase for everything.' },
    { p: 'system/staff-club-audience-plan.md',  d: 'The staff/club audience gate.' },
    { p: 'system/roles-and-access-plan.md',     d: 'The six-role, three-realm model.' },
    { p: 'system/brand-v3-scale-plan.md',       d: 'Parked type/scale pass — the brand-dev mockups belong to this.' },
    { p: 'system/rtdb/README.md',               d: 'The RTDB snapshot contract — which files are deployed vs reference.' },
    { p: 'system/storage/README.md',            d: 'Firebase Storage rules, CORS, and the nightly data feeds in data/.' },
    { p: 'gas/README.md',                       d: 'The Apps Script mirror — how the two-way sync and deploy keep repo and live honest.' },
    { p: 'embeds/widget-handover.md',           d: 'The embed invariants — what survives the Urban Zoo CMS and what it strips.' }
  ];

  function renderMeta() {
    document.getElementById('estMetaTools').innerHTML = META_TOOLS.map(function (t) {
      return '<a class="est-meta__card" href="' + t.href + '"><b>' + NL.escHtml(t.label) + '</b>' +
             '<span>' + NL.escHtml(t.note) + '</span></a>';
    }).join('');
    document.getElementById('estLibrary').innerHTML = LIBRARY.map(function (r) {
      return '<a class="est-meta__row" href="' + GH + r.p + '"><b>' + NL.escHtml(r.p) + '</b>' +
             '<span>' + NL.escHtml(r.d) + '</span></a>';
    }).join('');
  }

  function render() {
    renderStats();
    renderChips();
    renderTables();
    renderNote();
  }

  /* ── events ────────────────────────────────────────────────────────────── */

  function wire() {
    document.getElementById('estRoles').addEventListener('click', function (e) {
      var btn = e.target.closest('[data-role]');
      if (!btn) return;
      state.role = btn.getAttribute('data-role') || null;
      render();
    });

    document.getElementById('estFlags').addEventListener('click', function (e) {
      var btn = e.target.closest('[data-flag]');
      if (!btn) return;
      state.flag = btn.getAttribute('data-flag') || null;
      render();
    });

    var search = document.getElementById('estSearch');
    search.addEventListener('input', function () {
      state.search = search.value.trim().toLowerCase();
      renderTables();
    });

    document.getElementById('estCopy').addEventListener('click', function () {
      var paths = state.data.pages.filter(matches).map(function (p) { return p.path; });
      if (!paths.length) { NL.toast('Nothing to copy', 'info'); return; }
      NL.copy(paths.join('\n'), { ok: paths.length + ' path' + (paths.length === 1 ? '' : 's') + ' copied' });
    });
  }

  /* ── boot ──────────────────────────────────────────────────────────────── */

  window.TOOL = window.TOOL || {};
  window.TOOL.boot = function () {
    renderMeta();   /* static shelf — renders even if the inventory fetch fails */
    fetch(INVENTORY_URL, { cache: 'no-cache' })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function (data) {
        var ungated = {};
        (data.ungatedRegistered || []).forEach(function (r) { ungated[r.url] = true; });
        data.pages.forEach(function (p) { p.ungatedButRegistered = Boolean(ungated[p.url]); });

        state.data = data;
        wire();
        render();
      })
      .catch(function (err) {
        console.error('[estate] inventory load failed', err);
        document.getElementById('estTools').innerHTML =
          '<div class="empty-state">Could not load the inventory. ' +
          'It is built by the build-inventory workflow on push to main.</div>';
      });
  };

  /* If auth-guard fired before this script loaded, replay the session. */
  if (window._toolDeferredSession) {
    window.TOOL.boot(window._toolDeferredSession);
    delete window._toolDeferredSession;
  }
})();
</script>

</body>
</html>
