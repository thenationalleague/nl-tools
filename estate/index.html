<!DOCTYPE html>
<!--
  NL Tools — Estate
  Version: v0.1 (15/08/2026)
  File: /estate/index.html

  Every page in the repo, in one list — what it is, whether it is gated, whether
  the portal knows about it, and what links to it.

  Why this exists: the portal only lists gated tools that have an RTDB
  `tools/<toolKey>` record. Everything else — public companion forms, passcode
  pages, CMS embeds, lab experiments, redirect stubs — appears nowhere at all,
  and a gated tool whose registry record was never created is invisible too.
  Roughly half the repo's pages were unlisted by anything before this page.

  Data:
    /assets/data/tools-inventory.json    generated by scripts/build-inventory.js,
                                         rebuilt by .github/workflows/build-inventory.yml
                                         on every push to main. Read-only — this
                                         page writes nothing and owns no RTDB path.

  Access (RTDB tools/ops-estate):
    superadmin admin · everyone else off. It is a map of the estate, including
    pages that are deliberately obscure; it is not a directory for clubs.

  Reading the flags:
    Parked          the toolKey sits in tools-registry.parked.json: deliberately
                    off the portal with its code retained, per
                    system/tool-status-and-access.md. A decision, not a fault —
                    so it is a neutral pill, not a flag.
    Unaccounted for the toolKey is in NEITHER registry file. The snapshots can
                    lag live RTDB, so this means "worth checking in the
                    console", not "definitely broken".
    No inbound      nothing else in the repo links to this URL. The strongest
                    retire signal available — git dates are useless here because
                    brand sweeps rewrite every file at once. Not applied to
                    embeds (their links live in the Urban Zoo CMS) or to gated
                    tools (they are reached from the portal, not from markup).
    Gated in name   a registry record points at a page that has no auth-guard.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estate — NL Tools</title>
  <!-- Favicons. Static, not injected: nl-topbar.js adds these too, but a
       standalone page never loads it, and an icon that arrives with the JS
       leaves the tab blank until it does. /favicon.ico at the root is the
       backstop every browser asks for without being told. -->
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/favicon-16x16.png">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">

  <!-- Brand stylesheet (lint canonical: ?v=35) -->
  <link rel="stylesheet" href="/system/nl-brand.css?v=36">

  <!-- Firebase 10.12.0 SDK (compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

  <!-- Firebase init -->
  <script>
    firebase.initializeApp({
      apiKey:            "AIzaSyC3az3OMnU7TdqlaWp8yrO_EjgZ36l-mXU",
      authDomain:        "nl-tools.firebaseapp.com",
      databaseURL:       "https://nl-tools-default-rtdb.europe-west1.firebasedatabase.app",
      projectId:         "nl-tools",
      storageBucket:     "nl-tools.firebasestorage.app",
      messagingSenderId: "801354670005",
      appId:             "1:801354670005:web:05d8ebad3e7e63610d03fc"
    });
    var db = firebase.database();
  </script>

  <!-- Tool identity + changelog. Keep window.NL_TOOL and var NL_TOOL_KEY
       in sync — auth-guard reads NL_TOOL_KEY, nl-topbar reads window.NL_TOOL. -->
  <script>
    window.NL_TOOL = {
      title: 'Estate',
      toolKey: 'ops-estate'
    };
    var NL_TOOL_KEY = 'ops-estate';

    window.NL_CHANGELOG = [
      {
        date: '15/08/2026',
        version: 'v0.1',
        items: [
          'Initial build. Lists every HTML page in the repo from the generated inventory, grouped by top-level directory.',
          'Flags gated tools with no registry-snapshot record, pages with no inbound repo link, and registry records pointing at an ungated page.',
          'Filter by species, by flag, or by free text; copy the filtered paths for a retire list.'
        ]
      }
    ];

    /* auth-guard fires this once the session is verified + pageWrap is
       revealed. Boot the main app from here so RTDB reads happen with a
       live auth token. Do NOT read RTDB before this fires. */
    window.nlAuthReady = function (userData) {
      window.NL = window.NL || {};
      window.NL.session = userData;
      if (window.TOOL && window.TOOL.boot) {
        window.TOOL.boot(userData);
      } else {
        window._toolDeferredSession = userData;
      }
    };
  </script>

  <!-- NL system scripts (lint canonical: ?v=29 / ?v=8 / ?v=10) -->
  <script src="/system/nl-utils.js?v=30"></script>
  <script src="/system/nl-topbar.js?v=8"></script>
  <script src="/system/auth-guard.js?v=10"></script>

<style>
  /* #pageWrap default hide is in nl-brand.css; auth-guard reveals with
     style.display = 'block'. Don't clear with '' — would re-trigger the
     brand rule and re-hide the page. */

  /* Search field. The canon has .filter-bar/.chip but no text input inside
     one, so this is the only input styling here. */
  .est-search {
    flex: 1 1 220px;
    min-width: 180px;
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font: inherit;
    font-size: var(--text-sm);
    color: var(--text);
    background: var(--white);
  }
  .est-search:focus {
    outline: none;
    border-color: var(--navy);
  }

  /* Group card — one per top-level directory, so a public form and the gated
     admin behind it read as one thing rather than two unrelated orphans. */
  .est-group {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    margin-bottom: 14px;
    overflow: hidden;
  }
  .est-group__head {
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding: 10px 16px;
    background: var(--off-white);
    border-bottom: 1px solid var(--border);
  }
  .est-group__name {
    font-weight: 800;
    font-variation-settings: 'wght' 800;
    color: var(--navy);
    font-size: var(--text-sm);
  }
  .est-group__count {
    font-size: var(--text-xs);
    color: var(--text-muted);
  }

  .est-row {
    padding: 11px 16px;
    border-bottom: 1px solid var(--border);
  }
  .est-row:last-child { border-bottom: none; }
  .est-row:hover { background: var(--off-white); }

  .est-row__top {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .est-row__url {
    /* CANON CANDIDATE: 21 pages now hand-roll this exact stack. It wants to be
       a --font-mono token in nl-brand.css, but promoting it means a lockstep
       ?v= bump across every tool head — a change of its own, not a rider on
       this one. Matching the prevailing stack until then. */
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: var(--text-sm);
    font-weight: 700;
    font-variation-settings: 'wght' 700;
    color: var(--primary);
    text-decoration: none;
  }
  .est-row__url:hover { text-decoration: underline; }
  .est-row__spacer { flex: 1 1 auto; }
  .est-row__links {
    font-size: var(--text-xs);
    color: var(--text-muted);
    white-space: nowrap;
  }
  .est-row__title {
    font-size: var(--text-sm);
    color: var(--text);
    margin-top: 3px;
  }
  .est-row__summary {
    font-size: var(--text-xs);
    color: var(--text-muted);
    margin-top: 2px;
    line-height: 1.45;
  }
  .est-row__admin {
    font-size: var(--text-xs);
    margin-top: 4px;
  }
  .est-row__admin a { color: var(--navy); }

  /* Species pills. The canon .pill covers the shape; these are the four
     colour roles it does not already name. */
  .pill--tool      { background: var(--navy-100);    color: var(--navy); }
  .pill--companion { background: var(--blue-light);  color: var(--navy); }
  .pill--sandbox   { background: var(--amber-light); color: var(--amber); }
  .pill--embed     { background: var(--purple-light);color: var(--purple); }

  .est-note {
    font-size: var(--text-xs);
    color: var(--text-muted);
    margin-top: 18px;
    line-height: 1.5;
  }
</style>
</head>
<body>

<!-- Topbar — auto-rendered by /system/nl-topbar.js from window.NL_TOOL -->
<div id="nlTopbar"></div>

<div id="pageWrap">
  <div class="page">

    <div class="stats" id="estStats"></div>

    <div class="filter-bar filter-bar--stacked">
      <div class="filter-row">
        <input type="search" class="est-search" id="estSearch"
               placeholder="Search path, title or description" aria-label="Search the estate">
        <button class="btn btn--ghost btn--sm" id="estCopy">Copy paths</button>
      </div>
      <div class="filter-row">
        <span class="filter-label">Type</span>
        <div class="chip-group" id="estSpecies"></div>
      </div>
      <div class="filter-row">
        <span class="filter-label">Flags</span>
        <div class="chip-group" id="estFlags"></div>
      </div>
    </div>

    <div id="estList"></div>

    <p class="est-note" id="estNote"></p>

  </div>
</div>

<!-- Main app -->
<script>
(function () {
  'use strict';

  var INVENTORY_URL = '/assets/data/tools-inventory.json';

  /* Species → label + pill modifier. Order here is the order of the filter
     chips: the two that answer "what have I got loose" come first. */
  var SPECIES = [
    { key: 'companion', label: 'Companion', pill: 'pill--companion' },
    { key: 'public',    label: 'Public',    pill: 'pill--info' },
    { key: 'tool',      label: 'Tool',      pill: 'pill--tool' },
    { key: 'embed',     label: 'Embed',     pill: 'pill--embed' },
    { key: 'sandbox',   label: 'Sandbox',   pill: 'pill--sandbox' },
    { key: 'redirect',  label: 'Redirect',  pill: 'pill--pending' },
    { key: 'asset',     label: 'Asset',     pill: 'pill--info' },
    { key: 'root',      label: 'Login',     pill: 'pill--tool' }
  ];
  var SPECIES_BY_KEY = {};
  SPECIES.forEach(function (s) { SPECIES_BY_KEY[s.key] = s; });

  /* A no-inbound-links finding only means something where markup is how the
     page is reached. Embeds are linked from the Urban Zoo CMS, gated tools
     from the portal's RTDB registry, and the login page and asset indexes are
     entered directly — flagging those four would be noise, every run. */
  var INBOUND_MEANINGFUL = { companion: 1, public: 1, sandbox: 1, redirect: 1 };

  var state = {
    data: null,
    search: '',
    species: null,   // null = all
    flag: null       // null = all; otherwise 'unregistered' | 'orphan' | 'ungated'
  };

  /* ── flags ─────────────────────────────────────────────────────────────
     Each returns a short label or nothing. These are the whole point of the
     page: the evidence for a keep/retire call, in the order that matters. */
  function flagsFor(page) {
    var out = [];
    /* Parked is a decision, not a fault — it gets a neutral pill and is never a
       filterable "flag". Only a tool in NEITHER registry file is unexplained. */
    if (page.registryState === 'none') {
      out.push({ key: 'unregistered', label: 'Unaccounted for', pill: 'pill--pending' });
    }
    if (page.ungatedButRegistered) {
      out.push({ key: 'ungated', label: 'Gated in name only', pill: 'pill--rejected' });
    }
    if (INBOUND_MEANINGFUL[page.species] && page.inbound.length === 0) {
      out.push({ key: 'orphan', label: 'No inbound link', pill: 'pill--expired' });
    }
    return out;
  }

  function matches(page) {
    if (state.species && page.species !== state.species) return false;
    if (state.flag) {
      var has = flagsFor(page).some(function (f) { return f.key === state.flag; });
      if (!has) return false;
    }
    if (state.search) {
      var hay = [page.url, page.path, page.title, page.summary, page.toolKey]
        .filter(Boolean).join(' ').toLowerCase();
      if (hay.indexOf(state.search) === -1) return false;
    }
    return true;
  }

  /* ── render ────────────────────────────────────────────────────────────── */

  function renderStats() {
    var pages = state.data.pages;
    var c = state.data.counts;
    var orphans = pages.filter(function (p) {
      return INBOUND_MEANINGFUL[p.species] && p.inbound.length === 0;
    }).length;
    var loose = pages.filter(function (p) { return !p.gated && p.species !== 'root' && p.species !== 'asset'; }).length;

    var cards = [
      { num: c.total, label: 'Pages' },
      { num: c.gated, label: 'Gated tools' },
      { num: loose, label: 'Ungated' },
      { num: c.parkedTools, label: 'Parked' },
      { num: c.unregisteredTools, label: 'Unaccounted for' },
      { num: orphans, label: 'No inbound link' }
    ];
    document.getElementById('estStats').innerHTML = cards.map(function (s) {
      return '<div class="stat"><div class="stat__num">' + s.num + '</div>' +
             '<div class="stat__label">' + NL.escHtml(s.label) + '</div></div>';
    }).join('');
  }

  function renderChips() {
    var counts = {};
    state.data.pages.forEach(function (p) { counts[p.species] = (counts[p.species] || 0) + 1; });

    var sp = ['<button class="chip' + (state.species ? '' : ' active') + '" data-species="">All</button>'];
    SPECIES.forEach(function (s) {
      if (!counts[s.key]) return;
      sp.push('<button class="chip' + (state.species === s.key ? ' active' : '') +
              '" data-species="' + s.key + '">' + NL.escHtml(s.label) + ' ' + counts[s.key] + '</button>');
    });
    document.getElementById('estSpecies').innerHTML = sp.join('');

    var flagCounts = { unregistered: 0, orphan: 0, ungated: 0 };
    state.data.pages.forEach(function (p) {
      flagsFor(p).forEach(function (f) { flagCounts[f.key]++; });
    });
    var fl = ['<button class="chip' + (state.flag ? '' : ' active') + '" data-flag="">Any</button>'];
    [
      { key: 'unregistered', label: 'Unaccounted for' },
      { key: 'orphan',       label: 'No inbound link' },
      { key: 'ungated',      label: 'Gated in name only' }
    ].forEach(function (f) {
      if (!flagCounts[f.key]) return;
      fl.push('<button class="chip' + (state.flag === f.key ? ' active' : '') +
              '" data-flag="' + f.key + '">' + NL.escHtml(f.label) + ' ' + flagCounts[f.key] + '</button>');
    });
    document.getElementById('estFlags').innerHTML = fl.join('');
  }

  function rowHtml(page) {
    var sp = SPECIES_BY_KEY[page.species] || { label: page.species, pill: 'pill--info' };
    var pills = ['<span class="pill ' + sp.pill + '">' + NL.escHtml(sp.label) + '</span>'];
    if (page.registryState === 'parked') {
      pills.push('<span class="pill pill--info" title="' +
        NL.escHtml('Deliberately off the portal' + (page.parkedStage ? ' — ' + page.parkedStage : '') +
        '. See system/tool-status-and-access.md') + '">Parked</span>');
    }
    flagsFor(page).forEach(function (f) {
      pills.push('<span class="pill ' + f.pill + '">' + NL.escHtml(f.label) + '</span>');
    });

    var links = page.inbound.length === 1
      ? '1 link in'
      : page.inbound.length + ' links in';

    var html =
      '<div class="est-row">' +
        '<div class="est-row__top">' +
          '<a class="est-row__url" href="' + NL.escHtml(page.url) + '" target="_blank" rel="noopener">' +
            NL.escHtml(page.url) + '</a>' +
          pills.join('') +
          '<span class="est-row__spacer"></span>' +
          '<span class="est-row__links" title="' + NL.escHtml(page.inbound.join(', ')) + '">' + links + '</span>' +
        '</div>';

    var name = page.registry && page.registry.label ? page.registry.label : page.title;
    if (name) {
      html += '<div class="est-row__title">' + NL.escHtml(name) +
              (page.version ? ' <span class="est-row__links">' + NL.escHtml(page.version) + '</span>' : '') +
              '</div>';
    }
    if (page.summary) {
      html += '<div class="est-row__summary">' + NL.escHtml(page.summary) + '</div>';
    }
    if (page.adminPage) {
      html += '<div class="est-row__admin">Admin: <a href="' + NL.escHtml(page.adminPage) +
              '" target="_blank" rel="noopener">' + NL.escHtml(page.adminPage) + '</a>' +
              (page.adminGated === false ? ' <span class="pill pill--rejected">ungated</span>' : '') +
              '</div>';
    }
    html += '</div>';
    return html;
  }

  function renderList() {
    var visible = state.data.pages.filter(matches);
    var host = document.getElementById('estList');

    if (!visible.length) {
      host.innerHTML = '<div class="empty-state">Nothing matches that filter.</div>';
      return;
    }

    var groups = {};
    visible.forEach(function (p) {
      var g = p.group || '(root)';
      (groups[g] = groups[g] || []).push(p);
    });

    host.innerHTML = Object.keys(groups).sort().map(function (g) {
      var rows = groups[g].sort(function (a, b) { return a.url.localeCompare(b.url); });
      return '<div class="est-group">' +
               '<div class="est-group__head">' +
                 '<span class="est-group__name">' + NL.escHtml(g) + '</span>' +
                 '<span class="est-group__count">' + rows.length +
                   (rows.length === 1 ? ' page' : ' pages') + '</span>' +
               '</div>' +
               rows.map(rowHtml).join('') +
             '</div>';
    }).join('');
  }

  function renderNote() {
    var d = state.data;
    var bits = ['Generated ' + NL.formatDateTime(d.generated) + ' from ' + NL.escHtml(d.registrySource) + '.'];
    if (d.counts.unregisteredTools) {
      bits.push('Registry state is read from the in-repo snapshots, which can lag live RTDB — check the console before concluding a tool is unregistered.');
    }
    document.getElementById('estNote').innerHTML = bits.join(' ');
  }

  function render() {
    renderStats();
    renderChips();
    renderList();
    renderNote();
  }

  /* ── events ────────────────────────────────────────────────────────────── */

  function wire() {
    document.getElementById('estSpecies').addEventListener('click', function (e) {
      var btn = e.target.closest('[data-species]');
      if (!btn) return;
      state.species = btn.getAttribute('data-species') || null;
      render();
    });

    document.getElementById('estFlags').addEventListener('click', function (e) {
      var btn = e.target.closest('[data-flag]');
      if (!btn) return;
      state.flag = btn.getAttribute('data-flag') || null;
      render();
    });

    var search = document.getElementById('estSearch');
    search.addEventListener('input', function () {
      state.search = search.value.trim().toLowerCase();
      renderList();
    });

    /* Copy the currently-filtered file paths. The retire decision happens on
       this page; the deletion happens in a PR, and this is the handover. */
    document.getElementById('estCopy').addEventListener('click', function () {
      var paths = state.data.pages.filter(matches).map(function (p) { return p.path; });
      if (!paths.length) { NL.toast('Nothing to copy', 'info'); return; }
      NL.copy(paths.join('\n'), { ok: paths.length + ' path' + (paths.length === 1 ? '' : 's') + ' copied' });
    });
  }

  /* ── boot ──────────────────────────────────────────────────────────────── */

  window.TOOL = window.TOOL || {};
  window.TOOL.boot = function () {
    fetch(INVENTORY_URL, { cache: 'no-cache' })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function (data) {
        /* Mark the pages a registry record claims are gated but which carry no
           auth-guard. Cheaper to resolve here than to duplicate the join in
           the scanner's per-page output. */
        var ungated = {};
        (data.ungatedRegistered || []).forEach(function (r) { ungated[r.url] = true; });
        data.pages.forEach(function (p) { p.ungatedButRegistered = Boolean(ungated[p.url]); });

        state.data = data;
        wire();
        render();
      })
      .catch(function (err) {
        console.error('[estate] inventory load failed', err);
        document.getElementById('estList').innerHTML =
          '<div class="empty-state">Could not load the inventory. ' +
          'It is built by the build-inventory workflow on push to main.</div>';
      });
  };

  /* If auth-guard fired before this script loaded, replay the session. */
  if (window._toolDeferredSession) {
    window.TOOL.boot(window._toolDeferredSession);
    delete window._toolDeferredSession;
  }
})();
</script>

</body>
</html>
