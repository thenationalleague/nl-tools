<!DOCTYPE html>
<!--
  NL Tools — NL Cup Footage — landing / entry (placeholder)
  File: /tools/footage/index.html

  This is the reserved home for NL Cup Footage — the eventual **portal-card
  destination** for NL users (a logged-in NL portal session will later route
  straight to that club's footage). For now it is a light landing.

  The actual club login (passcode / ?c=<token> direct link) lives one level
  deeper at /tools/footage/club/ — like the master at /tools/footage/master/.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NL Cup Footage</title>
<link rel="stylesheet" href="/tools/system/nl-brand.css?v=21">
<style>
  body { background: var(--off-white); min-height: 100vh; margin: 0;
    display: flex; align-items: center; justify-content: center; padding: 24px;
    font-family: var(--font, system-ui, sans-serif); }
  .card { background: var(--white); border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: var(--shadow);
    max-width: 460px; width: 100%; padding: 32px clamp(20px,5vw,40px); text-align: center;
    border-top: 7px solid var(--primary); }
  .card h1 { margin: 8px 0 4px; font-size: clamp(20px,4vw,26px); font-weight: 900;
    font-variation-settings: 'wght' 900; text-transform: uppercase; letter-spacing: 0.03em;
    color: var(--navy); }
  .card .sub { color: var(--text-muted); font-size: 13px; font-weight: 700;
    letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 20px; }
  .card p { color: var(--navy-600); font-size: 14px; line-height: 1.6; margin: 0 0 24px; }
  .card a.enter { display: inline-block; background: var(--primary); color: var(--white);
    text-decoration: none; font-weight: 800; padding: 12px 22px; border-radius: var(--radius);
    letter-spacing: 0.02em; }
  .card a.enter:hover { background: var(--primary-600); }
</style>
</head>
<body>
  <div class="card">
    <h1>NL Cup Footage</h1>
    <div class="sub">NL × PL2 Cup</div>
    <p>Match footage for the 32 cup clubs. Clubs access their own games with the
       private link or passcode sent by the NL media team.</p>
    <a class="enter" href="/tools/footage/club/">Have a passcode? Enter here →</a>
  </div>
</body>
</html>
