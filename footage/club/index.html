<!DOCTYPE html>
<html lang="en">
<head>
<!--
  NL Cup Footage — Club-facing standalone page
  Version: v0.8 (14/07/2026) — same-browser isolation: runs on a NAMED Firebase app
           ('nlFootageExt') so its anonymous sign-in can't clobber a portal
           (superadmin) login open in another tab; and it no longer reads the portal
           editor's local draft (localStorage) — shows only the seed + PUBLISHED RTDB.
  Version: v0.7 (14/07/2026) — foldery simplification: files show as name + size (no
           Highlights/Full-match/clean-dirty labels). Folder = game; Preview + Download
           per file; preview-ability is size-based. Reads tolerate old labelled records.
  Version: v0.6 (13/07/2026) — house-style re-skin: the maroon header bar and passcode
           gate now use the NL-tools brand system (white/navy/primary tokens, portal
           context-header look). No behaviour change — passcode gate, ?c= token, folder
           rendering, signed-URL gate + fallback, download, preview and RTDB listeners
           are all untouched.
  Version: v0.5 (12/07/2026) — preview player hides its download control
           (controlsList=nodownload) so clubs can't grab the low-quality 360p proxy;
           full-quality download stays via the Download button. Deterrent, not DRM.
  Version: v0.4 (12/07/2026) — every file shows a Preview button (full matches get an
           explainer + download instead of a dead player); missing Storage objects
           degrade to a clear "no longer available" message rather than a hard fail.
  Version: v0.3 (12/07/2026) — preview tries the 360p proxy for any file (size-gated,
           not filename-gated), falling back to the full file.
  Version: v0.2 (12/07/2026) — cross-device delivery: producer uploads read live
           from RTDB (app-data/media-footage/uploads) and merged into the games.
  Version: v0.1 (12/07/2026) — MVP prototype.
  File: /footage/index.html

  Standalone (NO auth-guard). Access model: per-club direct link
  (?c=<token>) or per-club passcode. Reads footage/data.js.

  Two live RTDB nodes feed the view: the base catalogue (app-data/media-footage/data,
  published by the master tool) and producer uploads (app-data/media-footage/uploads),
  both via .on('value') so an upload from any device shows without a refresh. Real
  files stream/download from Firebase Storage via getDownloadURL.
-->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NL Cup Footage</title>
<link rel="stylesheet" href="/system/nl-brand.css?v=36">

<!-- Firebase 10.12.0 (compat) — RTDB catalogue read (Stage B). Public read of
     app-data/media-footage/data; layered over the committed dummy so a missing/empty
     node never regresses the page. -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
<script>
  // Named app ('nlFootageExt') — NOT the default app. This page signs in
  // anonymously; the NL portal (same origin) signs in as superadmin on the DEFAULT
  // app. A named app has its own auth-persistence namespace, so this anonymous
  // session can't clobber a portal login open in another tab (and vice versa).
  var FB_APP = firebase.initializeApp({
    apiKey:"AIzaSyC3az3OMnU7TdqlaWp8yrO_EjgZ36l-mXU", authDomain:"nl-tools.firebaseapp.com",
    databaseURL:"https://nl-tools-default-rtdb.europe-west1.firebasedatabase.app", projectId:"nl-tools",
    storageBucket:"nl-tools.firebasestorage.app", messagingSenderId:"801354670005",
    appId:"1:801354670005:web:05d8ebad3e7e63610d03fc"
  }, 'nlFootageExt');
</script>
<!-- Canon helpers (NL.toast/confirm/escHtml). Loaded after the named app so its
     audit hook self-skips (no default app here) — see nl-utils v1.23. -->
<script src="/system/nl-utils.js?v=30"></script>
<style>
  body { background: var(--off-white); }
  /* Sticky club header — reads as an NL-tools header: white surface, navy/primary
     brand system and the portal's context-header (crest + name + subtitle) pattern,
     with a primary accent underline echoing the portal ctx card's left accent. */
  .hbar {
    background: var(--white); color: var(--text);
    border-bottom: 3px solid var(--primary);
    box-shadow: var(--shadow);
    padding: 13px clamp(16px,3vw,32px);
    display: flex; align-items: center; gap: 13px;
    position: sticky; top: 0; z-index: 50;
  }
  .hbar__crest { width: 42px; height: 42px; object-fit: contain; flex-shrink: 0; }
  .hbar__mono { width: 42px; height: 42px; border-radius: 50%; flex-shrink: 0;
    display: inline-flex; align-items: center; justify-content: center;
    font-weight: 900; font-size: 12px; color: var(--white); }
  .hbar__id { flex: 1; min-width: 0; line-height: 1.2; }
  .hbar__club { font-size: clamp(15px,1.8vw,20px); font-weight: 900; font-variation-settings:'wght' 900;
    color: var(--navy); text-transform: uppercase; letter-spacing: 0.02em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hbar__sub { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-muted); }
  .hbar__signout { background: var(--white); border: 1px solid var(--border); color: var(--navy);
    padding: 7px 12px; border-radius: var(--radius); font-family: var(--font); font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.06em; cursor: pointer; flex-shrink: 0; }
  .hbar__signout:hover { background: var(--off-white); border-color: var(--navy); }
  .hbar__signout:focus-visible { outline: none; box-shadow: var(--focus-ring); }

  .wrap { max-width: 900px; margin: 0 auto; padding: clamp(20px,3vw,36px) clamp(14px,2.5vw,28px) 80px; }

  .dummy-flag { background: var(--amber-light); border: 1px solid color-mix(in srgb,var(--amber) 35%,white);
    color: var(--amber); border-radius: var(--radius); padding: 10px 14px; font-size: 12px; font-weight: 700;
    margin-bottom: 24px; display: flex; align-items: center; gap: 8px; }

  /* Passcode gate */
  .gate { min-height: 70vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .gate__card { background: var(--white); border-radius: var(--radius-lg); box-shadow: var(--shadow); padding: 40px 36px;
    width: 100%; max-width: 400px; text-align: center; border: 1px solid var(--border);
    border-top: 3px solid var(--primary); }
  .gate__logo { width: 64px; margin-bottom: 18px; }
  .gate__title { font-size: 20px; font-weight: 900; font-variation-settings:'wght' 900; color: var(--navy);
    text-transform: uppercase; letter-spacing: 0.02em; margin-bottom: 6px; }
  .gate__sub { font-size: 12px; color: var(--text-muted); margin-bottom: 24px; line-height: 1.5; }
  .gate__input { width: 100%; text-align: center; text-transform: uppercase; letter-spacing: 0.3em;
    font-size: 22px; font-weight: 800; font-family: var(--font); padding: 12px; border: 1px solid var(--border);
    border-radius: var(--radius); color: var(--text); margin-bottom: 14px; outline: none; }
  .gate__input:focus { border-color: var(--primary); box-shadow: var(--focus-ring); }
  .gate__err { color: var(--red); font-size: 12px; font-weight: 700; min-height: 18px; margin-bottom: 10px; }

  .stage-head { font-size: 12px; font-weight: 900; font-variation-settings:'wght' 900; text-transform: uppercase;
    letter-spacing: 0.14em; color: var(--navy); margin: 32px 0 14px; padding-bottom: 8px; border-bottom: 2px solid var(--border); }
  .stage-head:first-of-type { margin-top: 0; }

  /* Match = a folder */
  .folder { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); margin-bottom: 10px; overflow: hidden; }
  .folder__head { width: 100%; display: flex; align-items: center; gap: 11px; padding: 13px 15px;
    background: var(--white); border: none; border-left: 3px solid transparent; cursor: pointer;
    text-align: left; font-family: var(--font); }
  .folder__head:hover { background: var(--off-white); }
  .folder__head:focus-visible { outline: none; box-shadow: var(--focus-ring); }
  .folder__head[aria-expanded="true"] { background: var(--off-white); border-left-color: var(--primary); }
  .folder__ic { font-size: 15px; flex-shrink: 0; }
  .folder__date { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.07em;
    color: var(--text-muted); flex-shrink: 0; width: 58px; }
  .folder__fix { display: flex; align-items: center; gap: 7px; flex: 1; min-width: 0; font-weight: 800;
    font-variation-settings:'wght' 800; font-size: 14px; }
  .folder__team { display: inline-flex; align-items: center; gap: 5px; }
  .folder__team.me { color: var(--primary); }
  .folder__team img, .folder__team .mono { width: 20px; height: 20px; flex-shrink: 0; }
  .folder__team .mono { border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;
    color: var(--white); font-size: 8px; font-weight: 900; }
  .folder__v { color: var(--text-muted); font-weight: 700; font-size: 11px; }
  .folder__round { font-size: 10px; font-weight: 700; color: var(--text-muted); text-transform: uppercase;
    letter-spacing: 0.06em; flex-shrink: 0; }
  .folder__count { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em;
    color: var(--navy); background: var(--navy-50); border: 1px solid var(--navy-100); border-radius: 20px;
    padding: 3px 9px; flex-shrink: 0; }
  .folder__count--none { color: var(--text-muted); background: var(--off-white); border-color: var(--border); }
  .folder__chev { color: var(--text-muted); font-size: 11px; flex-shrink: 0; transition: transform 0.15s; }
  .folder__head[aria-expanded="true"] .folder__chev { transform: rotate(180deg); }
  .folder__body { border-top: 1px solid var(--border); }
  .folder__body[hidden] { display: none; }
  .folder__empty { padding: 15px 16px; text-align: center; color: var(--text-muted); font-size: 12px; font-weight: 600; }

  /* Files inside a folder */
  .file { display: flex; align-items: center; gap: 11px; padding: 10px 15px 10px 40px; border-bottom: 1px solid var(--border); }
  .file:last-child { border-bottom: none; }
  .file__ic { width: 30px; height: 30px; border-radius: 7px; flex-shrink: 0; display: inline-flex;
    align-items: center; justify-content: center; font-size: 13px; }
  .file__ic--v { background: var(--primary-50); color: var(--primary); }
  .file__ic--f { background: var(--navy-50); color: var(--navy); }
  .file__meta { flex: 1; min-width: 0; line-height: 1.3; }
  .file__label { display: block; font-size: 13px; font-weight: 700; color: var(--text); }
  .file__name { display: block; font-size: 10.5px; color: var(--text-muted); font-weight: 500;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .file__actions { display: flex; gap: 6px; flex-shrink: 0; }
  .file__btn { border: none; border-radius: var(--radius); font-family: var(--font); font-size: 11px; font-weight: 800;
    text-transform: uppercase; letter-spacing: 0.04em; padding: 7px 12px; cursor: pointer; white-space: nowrap; }
  .file__btn--dl { background: var(--navy); color: var(--white); }
  .file__btn--dl:hover { background: var(--navy-600); }
  .file__btn--pv { background: var(--white); color: var(--navy); border: 1px solid var(--border); }
  .file__btn--pv:hover { border-color: var(--navy); }
  .file__btn:focus-visible { outline: none; box-shadow: var(--focus-ring); }
  @media (max-width: 520px) {
    /* Stack the header so long club names never collide with the round/count */
    .folder__head { flex-wrap: wrap; row-gap: 4px; }
    .folder__date { width: auto; }
    .folder__fix { flex-basis: 100%; order: 5; font-size: 13px; }
    .folder__round { display: none; }
    .file { padding-left: 15px; flex-wrap: wrap; }
    .file__actions { width: 100%; padding-left: 41px; }
  }

  .tbd { padding: 18px; text-align: center; color: var(--text-muted); font-size: 13px; font-weight: 600; }

  /* Preview modal */
  .pv-backdrop { position: fixed; inset: 0; background: rgba(10,22,40,0.7); z-index: 200; display: none;
    align-items: center; justify-content: center; padding: 24px; }
  .pv-backdrop.open { display: flex; }
  .pv { background: var(--navy-900); border-radius: 10px; width: 100%; max-width: 720px; overflow: hidden; box-shadow: 0 16px 60px rgba(0,0,0,0.4); }
  .pv__head { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: var(--navy); color: var(--white); }
  .pv__title { font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; }
  .pv__close { background: none; border: none; color: var(--white); font-size: 24px; cursor: pointer; line-height: 1; }
  .pv__stage { aspect-ratio: 16/9; background: #000; display: flex; align-items: center; justify-content: center;
    color: rgba(255,255,255,0.6); font-size: 13px; text-align: center; padding: 20px; }
  .pv__video { width: 100%; display: block; background: #000; aspect-ratio: 16/9; }
</style>
</head>
<body>

<!-- Passcode gate (shown when no valid club token) -->
<div class="gate" id="gate" style="display:none">
  <div class="gate__card">
    <img class="gate__logo" src="https://raw.githubusercontent.com/thenationalleague/tools/refs/heads/main/assets/crests/National%20League%20rose.png" alt="National League">
    <div class="gate__title">NL Cup Footage</div>
    <div class="gate__sub" id="gateSub">Enter your club passcode to access your games.</div>
    <input class="gate__input" id="gateInput" maxlength="6" placeholder="••••••" autocomplete="off" aria-label="Club passcode">
    <div class="gate__err" id="gateErr" role="alert"></div>
    <button class="btn btn--primary" id="gateBtn" style="width:100%;justify-content:center;">View my games</button>
  </div>
</div>

<!-- Club view -->
<div id="app" style="display:none">
  <div class="hbar">
    <span id="hbarCrest"></span>
    <div class="hbar__id">
      <div class="hbar__club" id="hbarClub"></div>
      <div class="hbar__sub" id="hbarSub"></div>
    </div>
    <button class="hbar__signout" id="signout">Not you?</button>
  </div>
  <div class="wrap">
    <div id="games"></div>
  </div>
</div>

<div class="pv-backdrop" id="pvBackdrop">
  <div class="pv">
    <div class="pv__head"><span class="pv__title" id="pvTitle">Preview</span><button class="pv__close" id="pvClose" aria-label="Close preview">&times;</button></div>
    <video id="pvVideo" class="pv__video" controls playsinline preload="metadata" controlsList="nodownload noremoteplayback" disablePictureInPicture oncontextmenu="return false" style="display:none"></video>
    <div class="pv__stage" id="pvStage"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="/footage/data.js"></script>
<script>
(function(){
  'use strict';
  var CREST_ROSE = 'https://raw.githubusercontent.com/thenationalleague/tools/refs/heads/main/assets/crests/National%20League%20rose.png';

  /* Data source: the committed seed, then the PUBLISHED catalogue via the RTDB
     /data listener overrides it. We deliberately do NOT read the portal editor's
     local working copy (localStorage 'nlFootageData') — a club must only ever see
     what's been Published, and reading it caused the editor's unsaved draft to
     bleed into this page when both are open in the same browser. */
  function getData(){ return window.FOOTAGE_DATA; }
  var DATA = getData();
  var byCode = {}; DATA.clubs.forEach(function(c){ byCode[c.code] = c; });
  var LIVE_REF = 'app-data/media-footage/data';   // RTDB catalogue (Stage B)
  var currentClubCode = null;

  // Canon helpers (nl-utils), with a local fallback if it ever fails to load.
  function esc(s){ return (window.NL && NL.escHtml) ? NL.escHtml(s) : String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function toast(m){ if(window.NL && NL.toast){ NL.toast(m,'info'); return; } var t=document.getElementById('toast'); if(!t) return; t.textContent=m; t.className='toast toast--info show'; setTimeout(function(){t.classList.remove('show');},2600); }

  function crestHTML(club, size){
    size = size || 22;
    if (club && club.crest) return '<img src="'+esc(club.crest)+'" alt="" onerror="this.onerror=null;this.src=\''+CREST_ROSE+'\'" style="width:'+size+'px;height:'+size+'px;object-fit:contain;">';
    var col = (club && club.mono) || '#5a6a82';
    return '<span class="mono" style="background:'+esc(col)+';width:'+size+'px;height:'+size+'px;">'+esc(club?club.code:'?')+'</span>';
  }

  function findClubByToken(tok){ if(!tok) return null; for(var i=0;i<DATA.clubs.length;i++){ if(DATA.clubs[i].token===tok) return DATA.clubs[i]; } return null; }
  function findClubByPass(p){ p=(p||'').toUpperCase().trim(); for(var i=0;i<DATA.clubs.length;i++){ if((DATA.clubs[i].passcode||'').toUpperCase()===p) return DATA.clubs[i]; } return null; }

  function gamesForClub(code){
    return DATA.games.filter(function(g){ return g.home===code || g.away===code; })
      .sort(function(a,b){ return (a.date||'').localeCompare(b.date||''); });
  }

  function teamHTML(code, meCode){
    var c = byCode[code];
    var cls = 'folder__team' + (code===meCode ? ' me' : '');
    return '<span class="'+cls+'">'+crestHTML(c,20)+esc(c?c.short:code)+'</span>';
  }

  /* Normalise a game to a flat list of files, handling both the flexible
     files[] model and the legacy 4-slot assets{} shape. */
  var LEGACY_LABEL = { fmr_clean:'Full match (clean)', fmr_dirty:'Full match (with graphics)',
                       hl_clean:'Highlights (clean)', hl_dirty:'Highlights (with graphics)' };
  function filesForGame(g){
    if (Array.isArray(g.files)) return g.files;
    if (g.assets){
      var out=[]; Object.keys(g.assets).forEach(function(k){
        if(!g.assets[k]) return; var p=k.split('_');
        out.push({ id:g.id+'-'+k, type:p[0], variant:p[1]||null, label:LEGACY_LABEL[k]||k,
                   name:'', size:'', preview:p[0]==='hl', live:true, url:g.assets[k] });
      });
      return out;
    }
    return [];
  }
  function clubFiles(g){ return filesForGame(g).filter(function(f){ return f.live!==false; }); }

  function fileRow(g, f){
    var vid = f.preview;
    var ic = '<span class="file__ic '+(vid?'file__ic--v':'file__ic--f')+'">'+(vid?'▶':'⬇')+'</span>';
    var nm = f.name || f.label || 'Footage';
    var meta = '<div class="file__meta"><span class="file__label">'+esc(nm)+'</span>'
             + (f.size?'<span class="file__name">'+esc(f.size)+'</span>':'') + '</div>';
    // Every file gets a Preview button so no row looks "missing" one. For a
    // full match (not previewable) the preview opens an explainer + download,
    // rather than a dead player — see openPreview().
    var acts = '<div class="file__actions">'
      + '<button class="file__btn file__btn--pv" data-pv="'+esc(g.id)+'|'+esc(f.id)+'">Preview</button>'
      + '<button class="file__btn file__btn--dl" data-dl="'+esc(g.id)+'|'+esc(f.id)+'">Download</button></div>';
    return '<div class="file">'+ic+meta+acts+'</div>';
  }

  function folderHTML(g, meCode){
    if (g.home==null || g.away==null){ // knockout TBD
      return '<div class="folder"><div class="folder__head" style="cursor:default">'
        + '<span class="folder__ic">📁</span><span class="folder__fix">'+esc(g.round)+'</span>'
        + '<span class="folder__count folder__count--none">TBC</span></div>'
        + '<div class="folder__body"><div class="folder__empty">Teams confirmed once the round is drawn.</div></div></div>';
    }
    var files = clubFiles(g);
    var n = files.length;
    var head = '<button class="folder__head" data-toggle="'+esc(g.id)+'" aria-expanded="false">'
      + '<span class="folder__ic">📁</span>'
      + '<span class="folder__date">'+esc(g.date)+'</span>'
      + '<span class="folder__fix">'+teamHTML(g.home,meCode)+'<span class="folder__v">v</span>'+teamHTML(g.away,meCode)+'</span>'
      + '<span class="folder__round">'+esc(g.round)+'</span>'
      + '<span class="folder__count'+(n?'':' folder__count--none')+'">'+(n?(n+' file'+(n>1?'s':'')):'Not ready')+'</span>'
      + '<span class="folder__chev">▾</span></button>';
    var body = '<div class="folder__body" hidden>'
      + (n ? files.map(function(f){ return fileRow(g,f); }).join('')
           : '<div class="folder__empty">Footage not delivered yet — check back soon.</div>')
      + '</div>';
    return '<div class="folder">'+head+body+'</div>';
  }

  function toggleFolder(head){
    var open = head.getAttribute('aria-expanded')==='true';
    head.setAttribute('aria-expanded', open?'false':'true');
    var body = head.nextElementSibling;
    if (body){ if(open) body.setAttribute('hidden',''); else body.removeAttribute('hidden'); }
  }

  function render(club){
    currentClubCode = club.code;
    currentClubToken = club.token || null;
    document.getElementById('gate').style.display='none';
    document.getElementById('app').style.display='block';
    document.getElementById('hbarCrest').innerHTML = club.crest
      ? '<img class="hbar__crest" src="'+esc(club.crest)+'" alt="" onerror="this.onerror=null;this.src=\''+CREST_ROSE+'\'">'
      : '<span class="hbar__mono" style="background:'+esc(club.mono||'#223b7c')+'">'+esc(club.code)+'</span>';
    document.getElementById('hbarClub').textContent = club.name;
    document.getElementById('hbarSub').textContent = DATA.competition;

    var games = gamesForClub(club.code);
    // group by stage, preserving order
    var order = [], byStage = {};
    games.forEach(function(g){ if(!byStage[g.stage]){ byStage[g.stage]=[]; order.push(g.stage);} byStage[g.stage].push(g); });
    var html = '';
    if (!games.length) html = '<div class="tbd">No games assigned to your club yet.</div>';
    order.forEach(function(st){
      html += '<div class="stage-head">'+esc(st)+'</div>';
      html += byStage[st].map(function(g){ return folderHTML(g, club.code); }).join('');
    });
    document.getElementById('games').innerHTML = html;
    // Open the first match folder that actually has files, so it's not all shut.
    var heads = document.querySelectorAll('#games .folder__head[data-toggle]');
    for (var i=0;i<heads.length;i++){
      if (heads[i].querySelector('.folder__count') && heads[i].querySelector('.folder__count').textContent.indexOf('file')>-1){ toggleFolder(heads[i]); break; }
    }
  }

  // Real Firebase Storage helpers — activate for any file carrying a real
  // storagePath; dummy files (no storagePath) keep the placeholder behaviour.
  function ensureAuth(){
    try { var u = FB_APP.auth().currentUser; if (u) return Promise.resolve(u);
      return FB_APP.auth().signInAnonymously().then(function(c){ return c.user; });
    } catch(e){ return Promise.reject(e); }
  }
  function isReal(f){ return !!(f && f.storagePath); }
  // Footage URLs come straight from getDownloadURL — fast (sub-1s). Access is
  // scoped in the UI (a passcode only reveals its own club's games). The per-club
  // cryptographic download-lock was dropped: the org-policy-proof RTDB gate added
  // ~15-20s Eventarc latency, and loosening Domain Restricted Sharing was rejected.
  // See footage/NEXT.md. Falls back proxy→full when a proxy isn't present yet.
  var currentClubToken = null;   // set on render(club)
  function signedUrl(path){
    return ensureAuth().then(function(){
      return FB_APP.storage().ref(path).getDownloadURL().catch(function(){
        return FB_APP.storage().ref(path.replace('footage/national-league-cup/proxies/','footage/national-league-cup/')).getDownloadURL();
      });
    });
  }
  function resolveUrl(f){ return signedUrl(f.storagePath); }
  // 360p preview proxy (made by the makeProxy Cloud Function at footage/national-league-cup/proxies/<name>,
  // for highlights/clips only). Preview streams the proxy if present, else the full file.
  function proxyPathFor(f){
    if (!f.storagePath || f.storagePath.indexOf('footage/national-league-cup/') !== 0) return null;
    if (f.storagePath.indexOf('/proxies/') !== -1) return null;   // already a proxy
    // Try the proxy for any file (the fallback handles files that never got one,
    // e.g. full matches over the size cap). No filename/type gate.
    return f.storagePath.replace('footage/national-league-cup/', 'footage/national-league-cup/proxies/');
  }
  function previewUrl(f){ return signedUrl(proxyPathFor(f) || f.storagePath); }
  function fileByRef(ref){ var p=ref.split('|'), g=DATA.games.filter(function(x){return x.id===p[0];})[0]; if(!g) return null; var f=filesForGame(g).filter(function(x){return x.id===p[1];})[0]; return f?{g:g,f:f}:null; }

  function downloadFile(f){
    toast('Preparing download…');
    return resolveUrl(f).then(function(url){ var a=document.createElement('a'); a.href=url; a.download=f.name||''; a.target='_blank'; document.body.appendChild(a); a.click(); a.remove(); })
      .catch(function(e){ toast(missingObj(e)?'This file is no longer available.':('Download failed'+(e.code?(': '+e.code):'')), 'error'); });
  }
  function missingObj(e){ var c=(e&&(e.code||e.message))||''; return /object-not-found|not-?found|404/i.test(c); }
  function openPreview(ref){
    var o = fileByRef(ref); if(!o) return;
    var g=o.g, f=o.f, h=byCode[g.home], a=byCode[g.away];
    document.getElementById('pvTitle').textContent = (h?h.short:g.home)+' v '+(a?a.short:g.away)+' — '+(f.name||f.label||'Footage');
    var vid = document.getElementById('pvVideo'), stage = document.getElementById('pvStage');
    document.getElementById('pvBackdrop').classList.add('open');
    try{ vid.pause(); }catch(e){}
    if (isReal(f) && f.preview){
      // previewable → stream the 360p proxy (falls back to the full file)
      stage.style.display='flex'; stage.innerHTML='Loading…'; vid.style.display='none';
      previewUrl(f).then(function(url){ vid.src=url; vid.style.display='block'; stage.style.display='none'; var p=vid.play(); if(p&&p.catch)p.catch(function(){}); })
        .catch(function(e){
          vid.style.display='none'; stage.style.display='flex';
          stage.innerHTML = missingObj(e)
            ? '<div style="text-align:center;max-width:320px"><div style="font-weight:800;margin-bottom:6px">File no longer available</div><div style="font-size:13px;color:var(--text-muted)">This footage has been removed. Ask the NL media team if you were expecting it.</div></div>'
            : 'Could not load preview.<br><small style="opacity:0.6">'+esc(e.code||e.message||'')+'</small>';
        });
    } else if (isReal(f)){
      // real file but not previewable (full match / over the size cap) → explain + offer the download
      vid.removeAttribute('src'); vid.style.display='none'; stage.style.display='flex';
      stage.innerHTML = '<div style="text-align:center;max-width:340px">'
        + '<div style="font-weight:800;margin-bottom:6px">Full match — download only</div>'
        + '<div style="font-size:13px;color:var(--text-muted);margin-bottom:14px">This file is too large to preview online'+(f.size?(' ('+esc(f.size)+')'):'')+'. Download it to watch in your own player.</div>'
        + '<button class="file__btn file__btn--dl" id="pvDl">Download</button></div>';
      var b=document.getElementById('pvDl'); if(b) b.onclick=function(){ downloadFile(f); };
    } else {
      vid.removeAttribute('src'); vid.style.display='none'; stage.style.display='flex';
      stage.innerHTML = 'Preview not available for this file.';
    }
  }
  function closePreview(){ var v=document.getElementById('pvVideo'); try{ v.pause(); }catch(e){} v.removeAttribute('src'); v.style.display='none'; document.getElementById('pvBackdrop').classList.remove('open'); }
  document.getElementById('pvClose').addEventListener('click', closePreview);
  document.getElementById('pvBackdrop').addEventListener('click', function(e){ if(e.target===this) closePreview(); });
  document.addEventListener('keydown', function(e){ if(e.key==='Escape') closePreview(); });

  function showGate(msg){
    currentClubCode = null;
    document.getElementById('app').style.display='none';
    document.getElementById('gate').style.display='flex';
    if (msg) document.getElementById('gateSub').textContent = msg;
    var inp = document.getElementById('gateInput'), err = document.getElementById('gateErr');
    inp.focus();
    function submit(){
      var club = findClubByPass(inp.value);
      if (!club){ err.textContent = 'Passcode not recognised. Check with the NL media team.'; return; }
      err.textContent='';
      history.replaceState({},'', location.pathname + '?c=' + encodeURIComponent(club.token));
      render(club);
    }
    document.getElementById('gateBtn').onclick = submit;
    inp.onkeydown = function(e){ if(e.key==='Enter') submit(); };
  }

  document.getElementById('signout').addEventListener('click', function(){
    history.replaceState({},'', location.pathname);
    showGate();
  });

  // one-time delegated bind on #games (survives render()'s innerHTML swaps,
  // so adopting live data and re-rendering never double-binds).
  document.getElementById('games').addEventListener('click', function(e){
    var t = e.target;
    var dl = t.closest && t.closest('[data-dl]');
    if (dl){
      var o = fileByRef(dl.getAttribute('data-dl'));
      if (o && isReal(o.f)) downloadFile(o.f);
      else toast('This file isn’t available to download yet.');
      return;
    }
    var pv = t.closest && t.closest('[data-pv]'); if (pv){ openPreview(pv.getAttribute('data-pv')); return; }
    var tg = t.closest && t.closest('[data-toggle]'); if (tg){ toggleFolder(tg); return; }
  });

  // boot: ?c=<token> → direct in; else passcode gate
  var params = new URLSearchParams(location.search);
  var club = findClubByToken(params.get('c'));
  if (club) render(club); else showGate();

  // Cross-device delivery. Two live RTDB nodes feed the club view:
  //   • LIVE_REF   (data)    — the base catalogue the master tool publishes
  //   • UPLOADS_REF (uploads) — individual producer-uploaded files
  // Both are read with .on('value') so a producer upload from any device shows
  // up here without a refresh. Everything is layered over the committed data,
  // so a missing/empty node or an offline read just leaves the page working.
  var UPLOADS_REF = 'app-data/media-footage/uploads';
  var baseData = DATA;      // catalogue (committed → live RTDB when published)
  var uploadsCache = {};    // pushId -> upload record

  function applyLive(d){
    if (d && d.clubs && d.games) baseData = d;
    rebuild();
  }
  // Rebuild DATA = base catalogue + producer uploads (merged by gameId).
  function rebuild(){
    DATA = baseData;
    window.footageHydrateClubs(DATA.clubs, window._footageMeta);   // NL identity ← clubs-meta.json
    byCode = {}; DATA.clubs.forEach(function(c){ byCode[c.code] = c; });
    var byId = {};
    DATA.games.forEach(function(g){
      if (!Array.isArray(g.files)) g.files = [];
      g.files = g.files.filter(function(f){ return !f._up; });   // drop prior merge
      byId[g.id] = g;
    });
    Object.keys(uploadsCache).forEach(function(k){
      var u = uploadsCache[k]; if (!u || !u.gameId) return;
      var g = byId[u.gameId]; if (!g) return;
      g.files.push({ id:k, name:u.name, size:u.size, preview:!!u.preview,
        live:u.live!==false, storagePath:u.storagePath, url:u.url||'#stored', _up:true });
    });
    if (currentClubCode && byCode[currentClubCode]) render(byCode[currentClubCode]);
  }
  try {
    FB_APP.database().ref(LIVE_REF).on('value',
      function(s){ applyLive(s.val()); },
      function(){ /* offline / rules not deployed — keep committed data */ });
    FB_APP.database().ref(UPLOADS_REF).on('value',
      function(s){ uploadsCache = s.val() || {}; rebuild(); },
      function(){ /* offline / rules not deployed — no uploads merged */ });
  } catch(e){}
  // NL club identity lives in clubs-meta.json — fetch once, then re-render hydrated.
  window.footageLoadMeta().then(function(){ rebuild(); });
})();
</script>
</body>
</html>
