<!DOCTYPE html>
<!--
  NL Tools — NL Cup Footage / Stage A Firebase Storage connectivity check (diagnostic)
  Standalone, unlinked. Proves the Firebase Storage download pipe end-to-end:
  sign in (portal session if present, else anonymous) → getDownloadURL() → play.
  Safe to delete once Stage A is confirmed.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NL Cup Footage — Firebase Storage check</title>
<link rel="stylesheet" href="/system/nl-brand.css?v=26">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
<style>
  body{font-family:var(--font,system-ui,sans-serif);max-width:760px;margin:2rem auto;padding:0 1.25rem;color:var(--navy,#111)}
  h1{font-size:1.15rem}
  #log{background:var(--navy-900,#0c1424);color:#e6e9ef;padding:1rem 1.15rem;border-radius:10px;font:13px/1.6 ui-monospace,SFMono-Regular,monospace;white-space:pre-wrap;min-height:3rem}
  .ok{color:#57d977}.err{color:#ff7a7a}.dim{color:#9aa6b8}
  video{width:100%;margin-top:1rem;border-radius:10px;background:#000;display:none}
  a.dl{display:none;margin-top:1rem;padding:.6rem 1.1rem;background:var(--primary,#9e0000);color:#fff;text-decoration:none;border-radius:8px;font-weight:600}
</style>
</head>
<body>
<h1>Stage A — Firebase Storage pipe check</h1>
<div id="log">booting…</div>
<video id="v" controls playsinline preload="metadata"></video>
<a id="dl" class="dl" download>Download the full file</a>
<script>
  var SAMPLE = '2025-10-21_TRU_BHA_HL_CLEAN.mp4';
  var logEl = document.getElementById('log');
  logEl.textContent = '';
  function log(msg, cls){ logEl.innerHTML += (logEl.innerHTML?'\n':'') + (cls?'<span class="'+cls+'">'+msg+'</span>':msg); }

  firebase.initializeApp({
    apiKey:            "AIzaSyC3az3OMnU7TdqlaWp8yrO_EjgZ36l-mXU",
    authDomain:        "nl-tools.firebaseapp.com",
    databaseURL:       "https://nl-tools-default-rtdb.europe-west1.firebasedatabase.app",
    projectId:         "nl-tools",
    storageBucket:     "nl-tools.firebasestorage.app",
    messagingSenderId: "801354670005",
    appId:             "1:801354670005:web:05d8ebad3e7e63610d03fc"
  });
  log('1. Firebase initialised — bucket ' + firebase.app().options.storageBucket, 'dim');

  var done = false;
  function afterAuth(who){
    if (done) return; done = true;
    log('2. Authenticated as: ' + who, 'ok');
    log('3. Requesting getDownloadURL for "' + SAMPLE + '" …', 'dim');
    firebase.storage().ref(SAMPLE).getDownloadURL()
      .then(function(url){
        log('4. Signed download URL obtained ✔', 'ok');
        var v = document.getElementById('v'); v.src = url; v.style.display = 'block';
        var dl = document.getElementById('dl'); dl.href = url; dl.style.display = 'inline-block';
        v.addEventListener('loadedmetadata', function(){
          log('5. <video> loaded metadata — duration ' + v.duration.toFixed(1) + 's ✔', 'ok');
          log('\nPASS — the Firebase Storage download pipe works end to end.', 'ok');
        });
        v.addEventListener('error', function(){ log('5. <video> could not play the stream (URL was still issued).', 'err'); });
      })
      .catch(function(e){
        log('4. getDownloadURL FAILED: ' + e.code + ' — ' + e.message, 'err');
        if (e.code === 'storage/object-not-found') log('→ File not found at bucket root. Check the exact upload name.', 'dim');
        if (e.code === 'storage/unauthorized')    log('→ Rules blocked the read. Confirm the read-if-signed-in rule is published.', 'dim');
      });
  }

  // Prefer an existing portal session; only fall back to anonymous if none restores.
  firebase.auth().onAuthStateChanged(function(user){
    if (user) afterAuth(user.isAnonymous ? 'anonymous' : (user.email || user.uid));
  });
  setTimeout(function(){
    if (firebase.auth().currentUser) return;   // portal session already handled it
    log('No portal session in this tab — trying anonymous sign-in…', 'dim');
    firebase.auth().signInAnonymously().catch(function(e){
      log('AUTH FAILED: ' + e.code + ' — ' + e.message, 'err');
      if (e.code === 'auth/operation-not-allowed' || e.code === 'auth/admin-restricted-operation'){
        log('→ Either open this while signed into the portal, or enable Anonymous auth:', 'err');
        log('  Firebase console → Authentication → Sign-in method → Anonymous → Enable.', 'dim');
      }
    });
  }, 1200);
</script>
</body>
</html>
