<!-- ============================================================
     SCORE PREDICTOR — v1
     - Pulls real fixtures from NLS public API
     - Decodes JWT from _gc_sa_sso_access for user identity
     - Sim-time toggle: 12:00 / 16:00 / 18:00 BST on 2025-08-09
     - Predictions stored in localStorage keyed by JWT `id`
     - (v2 will swap localStorage for RTDB on nl-tools)
     ============================================================ -->

<div id="sp-root" style="font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;max-width:920px;margin:24px auto;color:#1f2328;">
  <div id="sp-banner" style="background:#fff3cd;border:1px solid #ffe69c;color:#7a5d00;padding:10px 14px;border-radius:8px;margin-bottom:16px;font-size:13px;">
    Loading predictor…
  </div>
  <div id="sp-greet" style="display:none;margin-bottom:12px;"></div>
  <div id="sp-simbar" style="display:none;margin-bottom:16px;"></div>
  <div id="sp-fixtures"></div>
</div>

<script>
(function () {
  // ---------- config ----------
  var COMP_ID   = 89;            // National Division
  var SEASON_ID = 2025;          // 2025/26
  var MATCH_DAY = '2025-08-09';  // opening day
  var API_BASE  = 'https://multi-club-matches.football.web.gc.nationalleagueservices.co.uk/v2';
  var MATCH_DURATION_MIN = 105;  // 90 + ~15 (HT + stoppage), used for in-play window
  var SIM_OPTIONS = [
    { label: '12:00 BST — pre-KO',  utc: '2025-08-09T11:00:00Z' },
    { label: '16:00 BST — in-play', utc: '2025-08-09T15:00:00Z' },
    { label: '18:00 BST — post-FT', utc: '2025-08-09T17:00:00Z' }
  ];

  // ---------- dom refs ----------
  var banner   = document.getElementById('sp-banner');
  var greet    = document.getElementById('sp-greet');
  var simbar   = document.getElementById('sp-simbar');
  var fixtures = document.getElementById('sp-fixtures');

  // ---------- 1. identity ----------
  function readCookie(name) {
    var pairs = (document.cookie || '').split('; ');
    for (var i = 0; i < pairs.length; i++) {
      var kv = pairs[i];
      if (kv.indexOf(name + '=') === 0) return kv.slice(name.length + 1);
    }
    return null;
  }
  function decodeJwtPayload(jwt) {
    if (!jwt) return null;
    var parts = jwt.split('.');
    if (parts.length !== 3) return null;
    try {
      var s = parts[1].replace(/-/g, '+').replace(/_/g, '/');
      while (s.length % 4) s += '=';
      return JSON.parse(decodeURIComponent(escape(atob(s))));
    } catch (e) { return null; }
  }

  var jwt = readCookie('_gc_sa_sso_access');
  var claims = decodeJwtPayload(jwt);
  if (!claims || !claims.id) {
    banner.style.background = '#fde8e8';
    banner.style.borderColor = '#f5a3a3';
    banner.style.color = '#8a1f1f';
    banner.textContent = 'You need to be signed in to use the Score Predictor. (Could not read your SSO token.)';
    return;
  }
  var USER = {
    id:        claims.id,
    forename:  claims.forename || 'there',
    surname:   claims.surname || '',
    email:     claims.email,
    favTeam:   claims.favourite_team || null
  };

  // ---------- 2. simulated clock ----------
  var simIndex = 0;
  function simNow() { return new Date(SIM_OPTIONS[simIndex].utc); }

  // ---------- 3. predictions store (localStorage for v1) ----------
  var STORAGE_KEY = 'sp.predictions.' + USER.id;
  function loadPreds() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); }
    catch (e) { return {}; }
  }
  function savePred(matchId, home, away) {
    var p = loadPreds();
    p[matchId] = { home: home, away: away, savedAt: Date.now() };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(p));
  }

  // ---------- 4. helpers ----------
  function normaliseUtc(str) {
    if (!str) return null;
    var iso = str.indexOf('T') >= 0 ? str : str.replace(' ', 'T') + 'Z';
    return new Date(iso);
  }
  function fmtKO(d) {
    if (!d) return '';
    return d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', timeZone: 'Europe/London' }) + ' BST';
  }
  function stateFor(match, now) {
    var ko = normaliseUtc(match.attributes.kickOffDateUTC);
    if (!ko) return 'unknown';
    var diff = (now - ko) / 60000;
    if (diff < 0) return 'pre';
    if (diff < MATCH_DURATION_MIN) return 'live';
    return 'post';
  }
  function scoreOutcome(h, a) {
    if (h > a) return 'H';
    if (h < a) return 'A';
    return 'D';
  }
  function pointsFor(predH, predA, realH, realA) {
    if (predH == null || predA == null) return null;
    if (predH === realH && predA === realA) return 3;
    if (scoreOutcome(predH, predA) === scoreOutcome(realH, realA)) return 1;
    return 0;
  }
  function escapeHtml(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  }); }

  // ---------- 5. render greeting + sim bar ----------
  function renderGreet() {
    greet.style.display = 'block';
    greet.innerHTML =
      '<h2 style="margin:0 0 4px;font-size:22px;">Welcome back, ' + escapeHtml(USER.forename) + ' 👋</h2>' +
      (USER.favTeam
        ? '<div style="color:#57606a;font-size:14px;">Predicting opening day — your team: <b>' + escapeHtml(USER.favTeam) + '</b></div>'
        : '<div style="color:#57606a;font-size:14px;">Predicting opening day fixtures</div>');
  }
  function renderSimBar() {
    simbar.style.display = 'flex';
    simbar.style.flexWrap = 'wrap';
    simbar.style.gap = '8px';
    simbar.style.alignItems = 'center';
    simbar.innerHTML =
      '<span style="font-size:13px;color:#57606a;margin-right:4px;">Simulated time:</span>' +
      SIM_OPTIONS.map(function (o, i) {
        var active = i === simIndex;
        return '<button data-sim="' + i + '" style="' +
          'padding:6px 12px;border-radius:999px;font-size:13px;cursor:pointer;border:1px solid ' +
          (active ? '#9e2a2b' : '#d0d7de') + ';background:' + (active ? '#9e2a2b' : '#fff') + ';color:' +
          (active ? '#fff' : '#1f2328') + ';">' + escapeHtml(o.label) + '</button>';
      }).join('');
    Array.prototype.forEach.call(simbar.querySelectorAll('button'), function (b) {
      b.addEventListener('click', function () {
        simIndex = Number(b.getAttribute('data-sim'));
        renderSimBar();
        renderFixtures();
      });
    });
  }

  // ---------- 6. fixture rendering ----------
  var MATCHES = [];

  function teamRow(team, score, side) {
    var crest = team.crest || team.crestURL || '';
    return '' +
      '<div style="display:flex;align-items:center;gap:10px;' + (side === 'away' ? 'flex-direction:row-reverse;text-align:right;' : '') + '">' +
        (crest ? '<img src="' + escapeHtml(crest) + '" alt="" style="width:32px;height:32px;object-fit:contain;flex:none;">' : '<div style="width:32px;height:32px;flex:none;"></div>') +
        '<div style="font-weight:600;font-size:15px;flex:1;">' + escapeHtml(team.name) + '</div>' +
        (score != null ? '<div style="font-size:22px;font-weight:700;min-width:24px;text-align:center;">' + score + '</div>' : '') +
      '</div>';
  }

  function predictionInput(matchId, side, value) {
    return '<input type="number" min="0" max="20" inputmode="numeric" data-match="' + matchId + '" data-side="' + side + '" ' +
      'value="' + (value != null ? value : '') + '" ' +
      'style="width:48px;height:40px;font-size:18px;text-align:center;border:1px solid #d0d7de;border-radius:6px;">';
  }

  function renderMatch(m) {
    var attrs = m.attributes;
    var ko = normaliseUtc(attrs.kickOffDateUTC);
    var now = simNow();
    var state = stateFor(m, now);
    var preds = loadPreds();
    var p = preds[m.id] || {};

    var stateLabel, stateColor;
    if (state === 'pre')   { stateLabel = 'Kicks off ' + fmtKO(ko); stateColor = '#0969da'; }
    if (state === 'live')  { stateLabel = 'IN PLAY';                stateColor = '#bf3989'; }
    if (state === 'post')  { stateLabel = 'FULL TIME';              stateColor = '#1a7f37'; }

    var realH = attrs.homeTeam.score, realA = attrs.awayTeam.score;
    var showHome = (state === 'pre') ? null : realH;
    var showAway = (state === 'pre') ? null : realA;

    var body = '';
    if (state === 'pre') {
      body =
        '<div style="display:flex;gap:8px;align-items:center;justify-content:center;margin-top:12px;">' +
          predictionInput(m.id, 'home', p.home) +
          '<span style="color:#57606a;">vs</span>' +
          predictionInput(m.id, 'away', p.away) +
        '</div>' +
        '<div style="text-align:center;margin-top:8px;font-size:12px;color:#57606a;">Your prediction (auto-saves)</div>';
    } else if (state === 'live') {
      body = '<div style="text-align:center;margin-top:12px;font-size:13px;color:#57606a;">' +
        'Predictions locked. ' +
        (p.home != null ? 'You predicted <b>' + p.home + '–' + p.away + '</b>.' : 'You didn\'t predict this one.') +
        '</div>';
    } else if (state === 'post') {
      var pts = pointsFor(p.home, p.away, realH, realA);
      var ptsLabel;
      if (pts === null) ptsLabel = 'No prediction made';
      else if (pts === 3) ptsLabel = '🎯 Exact score! <b>+3 pts</b>';
      else if (pts === 1) ptsLabel = '✔ Right result. <b>+1 pt</b>';
      else                ptsLabel = '✗ Wrong result. <b>0 pts</b>';
      body = '<div style="text-align:center;margin-top:12px;font-size:13px;color:#57606a;">' +
        (p.home != null ? 'You predicted <b>' + p.home + '–' + p.away + '</b> · ' : '') + ptsLabel +
        '</div>';
    }

    return '' +
      '<div style="background:#fff;border:1px solid #d0d7de;border-radius:10px;padding:14px 16px;margin-bottom:12px;">' +
        '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">' +
          '<span style="font-size:12px;font-weight:600;color:' + stateColor + ';text-transform:uppercase;letter-spacing:.5px;">' + stateLabel + '</span>' +
          '<span style="font-size:12px;color:#57606a;">' + escapeHtml(attrs.kickOffDateUTC || '') + ' UTC</span>' +
        '</div>' +
        '<div style="display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center;">' +
          teamRow(attrs.homeTeam, showHome, 'home') +
          '<div style="color:#57606a;font-size:13px;">' + (state === 'pre' ? 'v' : '–') + '</div>' +
          teamRow(attrs.awayTeam, showAway, 'away') +
        '</div>' +
        body +
      '</div>';
  }

  function renderFixtures() {
    if (!MATCHES.length) {
      var diag = window.__SP_DIAG__ || {};
      var dateCounts = diag.dateCounts || {};
      var topDates = Object.keys(dateCounts).sort(function (a, b) { return dateCounts[b] - dateCounts[a]; }).slice(0, 12);
      var sample = diag.sample || {};
      fixtures.innerHTML =
        '<div style="padding:18px;background:#fff8e6;border:1px solid #f0c674;border-radius:8px;font-size:13px;color:#5b4900;">' +
          '<div style="font-weight:600;margin-bottom:8px;">No matches found for ' + MATCH_DAY + '. Diagnostics:</div>' +
          '<pre style="margin:0;white-space:pre-wrap;word-break:break-all;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;">' +
          'Request URL:   ' + escapeHtml(diag.url || '(none)') + '\n' +
          'HTTP status:   ' + escapeHtml(String(diag.status || '?')) + '\n' +
          'Top-level keys: ' + escapeHtml((diag.topKeys || []).join(', ')) + '\n' +
          'data[] length: ' + escapeHtml(String(diag.dataLen == null ? '?' : diag.dataLen)) + '\n' +
          'meta / links:  ' + escapeHtml(JSON.stringify(diag.meta || {})) + '\n\n' +
          'Distinct dates seen (top 12, with counts):\n  ' +
          (topDates.length
            ? topDates.map(function (d) { return d + ' × ' + dateCounts[d]; }).join('\n  ')
            : '(none — data array empty or no kickOffDateUTC field)') + '\n\n' +
          'Sample of first match.attributes (keys + key values):\n' + escapeHtml(JSON.stringify(sample, null, 2)) +
          '</pre>' +
        '</div>';
      return;
    }
    var totalPts = 0, totalPredicted = 0, totalDone = 0;
    var preds = loadPreds();
    MATCHES.forEach(function (m) {
      var state = stateFor(m, simNow());
      var p = preds[m.id];
      if (state === 'post' && p && p.home != null) {
        var pts = pointsFor(p.home, p.away, m.attributes.homeTeam.score, m.attributes.awayTeam.score);
        if (pts != null) { totalPts += pts; totalDone += 1; }
      }
      if (p && p.home != null) totalPredicted += 1;
    });

    var summary = '<div style="background:#f6f8fa;border:1px solid #d0d7de;border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:13px;color:#1f2328;display:flex;gap:18px;flex-wrap:wrap;">' +
      '<span>Matches: <b>' + MATCHES.length + '</b></span>' +
      '<span>Predicted: <b>' + totalPredicted + '</b></span>' +
      (totalDone > 0 ? '<span>Settled: <b>' + totalDone + '</b></span><span>Points: <b>' + totalPts + '</b></span>' : '') +
    '</div>';

    fixtures.innerHTML = summary + MATCHES.map(renderMatch).join('');

    // wire prediction inputs
    Array.prototype.forEach.call(fixtures.querySelectorAll('input[data-match]'), function (inp) {
      inp.addEventListener('input', function () {
        var matchId = inp.getAttribute('data-match');
        var side = inp.getAttribute('data-side');
        var p = loadPreds()[matchId] || {};
        var val = inp.value === '' ? null : Math.max(0, Math.min(20, parseInt(inp.value, 10)));
        if (side === 'home') savePred(matchId, val, p.away == null ? null : p.away);
        else                 savePred(matchId, p.home == null ? null : p.home, val);
        // re-render summary line only
        var preds = loadPreds();
        var count = MATCHES.reduce(function (n, m) { return n + (preds[m.id] && preds[m.id].home != null ? 1 : 0); }, 0);
        var summaryEl = fixtures.querySelector('div');
        if (summaryEl) summaryEl.innerHTML = summaryEl.innerHTML.replace(/Predicted: <b>\d+<\/b>/, 'Predicted: <b>' + count + '</b>');
      });
    });
  }

  // ---------- 7. fetch fixtures ----------
  var MAX_PAGES = 10; // safety cap; season is ~557 matches = 6 pages of 100
  function dateOf(m) {
    var a = (m && m.attributes) || {};
    return String(a.kickOffDateUTC || a.kickoffDateUTC || a.kickOffDate || a.kickoffDate || a.date || '');
  }

  function fetchFixtures() {
    window.__SP_DIAG__ = { pages: [] };
    var all = [];

    function getPage(n) {
      var url = API_BASE + '/matches/?competitionID=' + COMP_ID + '&seasonID=' + SEASON_ID +
                '&sort=kickOffDateUTC&page.number=' + n + '&page.size=100';
      banner.style.display = 'block';
      banner.textContent = 'Fetching fixtures… (page ' + n + ')';
      return fetch(url, { credentials: 'omit' })
        .then(function (r) {
          if (!r.ok) throw new Error('HTTP ' + r.status + ' on page ' + n);
          return r.json();
        })
        .then(function (json) {
          var data = (json && json.data) || [];
          var total = json && json.meta && json.meta.totalCount;
          window.__SP_DIAG__.pages.push({ n: n, returned: data.length, total: total });
          all = all.concat(data);

          var moreLeft = (data.length === 100) && (total == null || all.length < total);
          if (moreLeft && n < MAX_PAGES) return getPage(n + 1);
          return null;
        });
    }

    return getPage(1).then(function () {
      window.__SP_DIAG__.totalFetched = all.length;

      var counts = {};
      var firstSample = null;
      for (var i = 0; i < all.length; i++) {
        var d = dateOf(all[i]).slice(0, 10);
        if (d) counts[d] = (counts[d] || 0) + 1;
        if (!firstSample && all[i] && all[i].attributes) {
          var s = all[i].attributes;
          firstSample = {
            keys: Object.keys(s),
            kickOffDateUTC: s.kickOffDateUTC,
            competitionID: s.competitionID,
            matchPeriod: s.matchPeriod,
            homeTeam: s.homeTeam && s.homeTeam.name,
            awayTeam: s.awayTeam && s.awayTeam.name
          };
        }
      }
      window.__SP_DIAG__.dateCounts = counts;
      window.__SP_DIAG__.sample = firstSample;

      return all.filter(function (m) { return dateOf(m).indexOf(MATCH_DAY) === 0; });
    });
  }

  // ---------- 8. boot ----------
  renderGreet();
  banner.textContent = 'Fetching fixtures for ' + MATCH_DAY + '…';
  fetchFixtures().then(function (matches) {
    MATCHES = matches;
    banner.style.display = 'none';
    renderSimBar();
    renderFixtures();
  }).catch(function (err) {
    banner.style.background = '#fde8e8';
    banner.style.borderColor = '#f5a3a3';
    banner.style.color = '#8a1f1f';
    banner.textContent = 'Could not load fixtures: ' + err.message + '. Open DevTools → Network for details.';
  });
})();
</script>
