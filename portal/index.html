var AUDIT_ACTION_ICONS = {
  'signed_in':           '🔑',
  'signed_out':          '🚪',
  'invite_sent':         '✉️',
  'request_approved':    '✅',
  'request_declined':    '❌',
  'access_changed':      '🔧',
  'role_changed':        '👤',
  'message_created':     '📝',
  'message_edited':      '✏️',
  'message_deleted':     '🗑️',
  'invite_cancelled':    '🚫',
  'user_removed':        '🗑️',
  'page_opened':         '👁️'
  /* *_changed (auto-audit) falls through to default 📋 */
};

var AUDIT_STATE = {
  mode:        'feed',    /* 'feed' or 'search' */
  cursor:      null,      /* oldest timestamp seen, used for pagination */
  searchUid:   null,
  searchCursor: null,
  exhausted:   false      /* no more entries to load */
};

/*
 * writeAudit(action, detail)
 * Writes to both audit/{ts} and audit-by-user/{actorUid}/{ts}.
 * Never throws -- audit failures surface via console.warn.
 */
function _auditDetailToString(d) {
  if (d == null) return '';
  if (typeof d === 'string') return d;
  if (typeof d === 'number' || typeof d === 'boolean') return String(d);
  try { return JSON.stringify(d); } catch(e) { return String(d); }
}
function writeAudit(action, detail) {
  if (!STATE.uid) return;
  var ts      = Date.now();
  var entry   = {
    action:    String(action || ''),
    detail:    _auditDetailToString(detail),
    uid:       STATE.uid,
    name:      (STATE.userData && STATE.userData.name)  || '',
    email:     (STATE.userData && STATE.userData.email) || '',
    at:        new Date(ts).toISOString()
  };
  var updates = {};
  updates['admin/audit/' + ts]                          = entry;
  updates['admin/audit-by-user/' + STATE.uid + '/' + ts] = entry;
  db.ref().update(updates).catch(function(e) {
    console.warn('writeAudit failed:', e && e.code, e && e.message);
  });
}

/*
 * writeAuditFor(targetUid, targetName, targetEmail, action, detail)
 * Used when an admin acts ON another user -- logs under both the
 * actor (STATE.uid) and the target user's index.
 */
function writeAuditFor(targetUid, targetName, targetEmail, action, detail) {
  if (!STATE.uid) return;
  var ts    = Date.now();
  var entry = {
    action:      String(action || ''),
    detail:      _auditDetailToString(detail),
    uid:         STATE.uid,
    name:        (STATE.userData && STATE.userData.name)  || '',
    email:       (STATE.userData && STATE.userData.email) || '',
    targetUid:   targetUid   || '',
    targetName:  targetName  || '',
    targetEmail: targetEmail || '',
    at:          new Date(ts).toISOString()
  };
  var updates = {};
  updates['admin/audit/' + ts]                               = entry;
  updates['admin/audit-by-user/' + STATE.uid + '/' + ts]     = entry;
  if (targetUid && targetUid !== STATE.uid) {
    updates['admin/audit-by-user/' + targetUid + '/' + ts]   = entry;
  }
  db.ref().update(updates).catch(function(e) {
    console.warn('writeAudit failed:', e && e.code, e && e.message);
  });
}

/* ---- Audit display ------------------------------------------------------- */

/* Audit pane controls use document-level event delegation so they work
   regardless of when the pane HTML is in the DOM or whether the audit tab
   has been opened yet. Idempotent — safe to call multiple times because the
   guard flag prevents double-binding. */
function initAuditPane() {
  if (window._auditPaneInit) return;
  window._auditPaneInit = true;

  document.addEventListener('click', function(ev) {
    /* Suggestion item click → apply filter */
    var sugg = ev.target && ev.target.closest && ev.target.closest('.audit-suggest__item');
    if (sugg) {
      applyAuditSuggestion(sugg);
      return;
    }
    /* Close suggestion box on outside click */
    var box = document.getElementById('auditSuggest');
    if (box && !ev.target.closest('#auditSuggest, #auditSearch')) {
      box.classList.remove('open');
    }
    /* Button clicks */
    var t = ev.target && ev.target.closest && ev.target.closest('button');
    if (!t) return;
    if (t.id === 'auditSearchBtn') {
      runAuditSearch();
    } else if (t.id === 'auditClearBtn') {
      var s = document.getElementById('auditSearch');
      if (s) s.value = '';
      var n = document.getElementById('auditSearchNotice');
      if (n) n.style.display = 'none';
      var sb = document.getElementById('auditSuggest');
      if (sb) sb.classList.remove('open');
      AUDIT_STATE.mode         = 'feed';
      AUDIT_STATE.cursor       = null;
      AUDIT_STATE.searchUid    = null;
      AUDIT_STATE.searchCursor = null;
      AUDIT_STATE.exhausted    = false;
      var l = document.getElementById('auditList');
      if (l) l.innerHTML = '';
      loadAuditFeed(true);
    } else if (t.id === 'auditLoadMoreBtn') {
      if (AUDIT_STATE.mode === 'search') {
        loadAuditForUser(AUDIT_STATE.searchUid, false);
      } else if (AUDIT_STATE.mode === 'action-search') {
        /* action-search currently loads last 500 entries — no pagination yet */
      } else {
        loadAuditFeed(false);
      }
    }
  });

  document.addEventListener('input', function(ev) {
    if (ev.target && ev.target.id === 'auditSearch') {
      renderAuditSuggestions(ev.target.value);
    }
  });

  document.addEventListener('keydown', function(ev) {
    if (ev.target && ev.target.id === 'auditSearch' && ev.key === 'Enter') {
      document.getElementById('auditSuggest').classList.remove('open');
      runAuditSearch();
    }
  });

  document.addEventListener('focusin', function(ev) {
    if (ev.target && ev.target.id === 'auditSearch') {
      renderAuditSuggestions(ev.target.value);
    }
  });
}

/* Build suggestion lists: matching people + matching action types */
function buildAuditSuggestions(q) {
  q = (q || '').trim().toLowerCase();
  var result = { people: [], actions: [] };
  if (!q) return result;

  if (STATE.allUsers) {
    Object.keys(STATE.allUsers).forEach(function(uid) {
      var u = STATE.allUsers[uid];
      if ((u.name  || '').toLowerCase().indexOf(q) !== -1 ||
          (u.email || '').toLowerCase().indexOf(q) !== -1) {
        result.people.push({
          uid: uid,
          name: u.name || u.email || uid,
          email: u.email || '',
          role: u.role || '',
          club: u.club || ''
        });
      }
    });
  }
  if (STATE.userData) {
    var selfMatch =
      (STATE.userData.name  || '').toLowerCase().indexOf(q) !== -1 ||
      (STATE.userData.email || '').toLowerCase().indexOf(q) !== -1;
    var already = result.people.some(function(p) { return p.uid === STATE.uid; });
    if (selfMatch && !already) {
      result.people.push({
        uid: STATE.uid,
        name: STATE.userData.name || STATE.userData.email || STATE.uid,
        email: STATE.userData.email || '',
        role: STATE.userData.role || '',
        club: STATE.userData.club || ''
      });
    }
  }

  Object.keys(AUDIT_ACTION_LABELS).forEach(function(a) {
    var label = AUDIT_ACTION_LABELS[a];
    if (a.toLowerCase().indexOf(q) !== -1 || label.toLowerCase().indexOf(q) !== -1) {
      result.actions.push({ action: a, label: label });
    }
  });

  result.people  = result.people.slice(0, 6);
  result.actions = result.actions.slice(0, 6);
  return result;
}

function renderAuditSuggestions(q) {
  var box = document.getElementById('auditSuggest');
  if (!box) return;
  var s = buildAuditSuggestions(q);
  if (s.people.length === 0 && s.actions.length === 0) {
    box.classList.remove('open');
    box.innerHTML = '';
    return;
  }
  var html = '';
  if (s.people.length) {
    html += '<div class="audit-suggest__group">People</div>';
    s.people.forEach(function(p) {
      var sub = [];
      if (p.email) sub.push(esc(p.email));
      if (p.role)  sub.push(esc(p.role));
      if (p.club)  sub.push(esc(p.club));
      html += '<div class="audit-suggest__item" data-kind="person" data-uid="' + esc(p.uid) + '" data-label="' + esc(p.name) + '">' +
              '<div class="audit-suggest__icon">👤</div>' +
              '<div class="audit-suggest__main">' + esc(p.name) +
                '<div class="audit-suggest__sub">' + sub.join(' · ') + '</div>' +
              '</div></div>';
    });
  }
  if (s.actions.length) {
    html += '<div class="audit-suggest__group">Actions</div>';
    s.actions.forEach(function(a) {
      html += '<div class="audit-suggest__item" data-kind="action" data-action="' + esc(a.action) + '" data-label="' + esc(a.label) + '">' +
              '<div class="audit-suggest__icon">' + (AUDIT_ACTION_ICONS[a.action] || '📋') + '</div>' +
              '<div class="audit-suggest__main">' + esc(a.label) +
                '<div class="audit-suggest__sub">' + esc(a.action) + '</div>' +
              '</div></div>';
    });
  }
  box.innerHTML = html;
  box.classList.add('open');
}

function applyAuditSuggestion(el) {
  var kind = el.getAttribute('data-kind');
  var input = document.getElementById('auditSearch');
  var box   = document.getElementById('auditSuggest');
  var label = el.getAttribute('data-label') || '';
  if (input) input.value = label;
  if (box)   box.classList.remove('open');

  if (kind === 'person') {
    var uid = el.getAttribute('data-uid');
    var userData = STATE.allUsers[uid] || STATE.userData;
    var notice = document.getElementById('auditSearchNotice');
    notice.textContent = 'Showing full history for ' +
      (userData.name || userData.email || uid) + '.';
    notice.style.display = 'block';
    AUDIT_STATE.mode         = 'search';
    AUDIT_STATE.searchUid    = uid;
    AUDIT_STATE.searchCursor = null;
    AUDIT_STATE.exhausted    = false;
    document.getElementById('auditList').innerHTML =
      '<div class="audit-loading">Loading history...<\/div>';
    loadAuditForUser(uid, true);
  } else if (kind === 'action') {
    var action = el.getAttribute('data-action');
    var label2 = AUDIT_ACTION_LABELS[action] || action;
    var notice2 = document.getElementById('auditSearchNotice');
    notice2.textContent = 'Showing all entries with action "' + label2 +
      '" (last 500 events).';
    notice2.style.display = 'block';
    AUDIT_STATE.mode      = 'action-search';
    AUDIT_STATE.cursor    = null;
    AUDIT_STATE.exhausted = false;
    document.getElementById('auditList').innerHTML =
      '<div class="audit-loading">Searching...<\/div>';
    loadAuditActionSearch(action.toLowerCase(), true);
  }
}

function loadAuditFeed(fresh) {
  if (fresh) {
    AUDIT_STATE.cursor    = null;
    AUDIT_STATE.exhausted = false;
    document.getElementById('auditList').innerHTML =
      '<div class="audit-loading">Loading...<\/div>';
  }

  var query = db.ref('admin/audit').orderByKey().limitToLast(21);
  if (AUDIT_STATE.cursor) {
    query = db.ref('admin/audit').orderByKey().endBefore(String(AUDIT_STATE.cursor)).limitToLast(21);
  }

  query.once('value').then(function(snap) {
    var entries = [];
    snap.forEach(function(child) {
      var e = child.val();
      e._ts = child.key;
      entries.push(e);
    });

    /* 21 fetched -- if we got 21 there are more; show 20, keep 21st as cursor signal */
    var hasMore = entries.length === 21;
    if (hasMore) entries = entries.slice(0, 20);

    /* Reverse so newest first */
    entries.reverse();

    if (fresh) document.getElementById('auditList').innerHTML = '';

    if (fresh && entries.length === 0) {
      document.getElementById('auditList').innerHTML =
        '<div class="audit-empty">No audit entries yet.<\/div>';
      document.getElementById('auditLoadMore').style.display = 'none';
      return;
    }

    appendAuditEntries(entries);

    /* Cursor = oldest entry shown */
    if (entries.length > 0) {
      AUDIT_STATE.cursor = entries[entries.length - 1]._ts;
    }

    AUDIT_STATE.exhausted = !hasMore;
    document.getElementById('auditLoadMore').style.display =
      hasMore ? 'block' : 'none';
  }).catch(function() {
    document.getElementById('auditList').innerHTML =
      '<div class="audit-empty">Could not load audit log.<\/div>';
  });
}

function runAuditSearch() {
  var q = document.getElementById('auditSearch').value.trim().toLowerCase();
  if (!q) return;

  /* Find matching user(s) in loaded users */
  var matchedUids = Object.keys(STATE.allUsers).filter(function(uid) {
    var u = STATE.allUsers[uid];
    return (u.name  || '').toLowerCase().indexOf(q) !== -1 ||
           (u.email || '').toLowerCase().indexOf(q) !== -1;
  });

  /* Also match the current superadmin themselves */
  if (STATE.userData) {
    var selfMatch =
      (STATE.userData.name  || '').toLowerCase().indexOf(q) !== -1 ||
      (STATE.userData.email || '').toLowerCase().indexOf(q) !== -1;
    if (selfMatch && matchedUids.indexOf(STATE.uid) === -1) {
      matchedUids.push(STATE.uid);
    }
  }

  if (matchedUids.length === 0) {
    /* No user match -- search action/detail in feed */
    AUDIT_STATE.mode      = 'action-search';
    AUDIT_STATE.cursor    = null;
    AUDIT_STATE.exhausted = false;
    document.getElementById('auditList').innerHTML =
      '<div class="audit-loading">Searching...<\/div>';
    loadAuditActionSearch(q, true);
    return;
  }

  /* For now use first match -- could extend to multi-user results */
  var uid      = matchedUids[0];
  var userData = STATE.allUsers[uid] || STATE.userData;
  var notice   = document.getElementById('auditSearchNotice');
  notice.textContent = 'Showing full history for ' +
    (userData.name || userData.email || uid) +
    '. This reads their complete audit trail.';
  notice.style.display = 'block';

  AUDIT_STATE.mode         = 'search';
  AUDIT_STATE.searchUid    = uid;
  AUDIT_STATE.searchCursor = null;
  AUDIT_STATE.exhausted    = false;
  document.getElementById('auditList').innerHTML =
    '<div class="audit-loading">Loading history...<\/div>';
  loadAuditForUser(uid, true);
}

function loadAuditForUser(uid, fresh) {
  if (fresh) {
    AUDIT_STATE.searchCursor = null;
    AUDIT_STATE.exhausted    = false;
  }

  var query = db.ref('admin/audit-by-user/' + uid).orderByKey().limitToLast(21);
  if (AUDIT_STATE.searchCursor) {
    query = db.ref('admin/audit-by-user/' + uid)
      .orderByKey()
      .endBefore(String(AUDIT_STATE.searchCursor))
      .limitToLast(21);
  }

  query.once('value').then(function(snap) {
    var entries = [];
    snap.forEach(function(child) {
      var e = child.val();
      e._ts = child.key;
      entries.push(e);
    });

    var hasMore = entries.length === 21;
    if (hasMore) entries = entries.slice(0, 20);
    entries.reverse();

    if (fresh) document.getElementById('auditList').innerHTML = '';

    if (fresh && entries.length === 0) {
      document.getElementById('auditList').innerHTML =
        '<div class="audit-empty">No audit history for this user.<\/div>';
      document.getElementById('auditLoadMore').style.display = 'none';
      return;
    }

    appendAuditEntries(entries);

    if (entries.length > 0) {
      AUDIT_STATE.searchCursor = entries[entries.length - 1]._ts;
    }

    AUDIT_STATE.exhausted = !hasMore;
    document.getElementById('auditLoadMore').style.display =
      hasMore ? 'block' : 'none';
  }).catch(function() {
    document.getElementById('auditList').innerHTML =
      '<div class="audit-empty">Could not load user history.<\/div>';
  });
}

function loadAuditActionSearch(q, fresh) {
  /* Read last 500 entries and filter by action/detail client-side */
  db.ref('admin/audit').orderByKey().limitToLast(500).once('value').then(function(snap) {
    var entries = [];
    snap.forEach(function(child) {
      var e = child.val();
      e._ts = child.key;
      var searchable = [e.action, e.detail, e.name, e.email,
                        e.targetName, e.targetEmail].join(' ').toLowerCase();
      if (searchable.indexOf(q) !== -1) entries.push(e);
    });
    entries.reverse();

    document.getElementById('auditList').innerHTML = '';
    if (entries.length === 0) {
      document.getElementById('auditList').innerHTML =
        '<div class="audit-empty">No entries matching "' + esc(q) + '".<\/div>';
      document.getElementById('auditLoadMore').style.display = 'none';
      return;
    }

    appendAuditEntries(entries);
    document.getElementById('auditLoadMore').style.display = 'none';
    var notice = document.getElementById('auditSearchNotice');
    notice.textContent = entries.length + ' entries matching "' + q +
      '" in last 500 actions.';
    notice.style.display = 'block';
  });
}

function appendAuditEntries(entries) {
  var list = document.getElementById('auditList');
  /* Remove loading placeholder if present */
  var loading = list.querySelector('.audit-loading');
  if (loading) list.removeChild(loading);

  entries.forEach(function(e) {
    var row = document.createElement('div');
    row.className = 'audit-entry';

    var icon = document.createElement('div');
    icon.className = 'audit-entry__icon';
    icon.textContent = AUDIT_ACTION_ICONS[e.action] || '📋';

    var body = document.createElement('div');
    body.className = 'audit-entry__body';

    var action = document.createElement('div');
    action.className = 'audit-entry__action';
    action.textContent = formatAuditAction(e);

    var detail = document.createElement('div');
    detail.className = 'audit-entry__detail';
    var detailParts = [];
    if (e.name || e.email) detailParts.push(e.name || e.email);
    if (e.targetName || e.targetEmail) {
      detailParts.push('→ ' + (e.targetName || e.targetEmail));
    }
    if (e.detail) detailParts.push(e.detail);
    detail.textContent = detailParts.join('  —  ');

    body.appendChild(action);
    body.appendChild(detail);

    var time = document.createElement('div');
    time.className = 'audit-entry__time';
    time.textContent = formatAuditTime(e.at || e.ts || e._ts);
    time.title = e.at || (e.ts ? new Date(e.ts).toISOString() : '');

    row.appendChild(icon);
    row.appendChild(body);
    row.appendChild(time);
    list.appendChild(row);
  });
}

function formatAuditAction(e) {
  if (AUDIT_ACTION_LABELS[e.action]) return AUDIT_ACTION_LABELS[e.action];
  /* Auto-audit shape: "<tool>_changed" → "Tool data changed" */
  var m = e.action && e.action.match(/^(.+)_changed$/);
  if (m) {
    var tool = m[1].replace(/[-_]/g, ' ');
    return tool.charAt(0).toUpperCase() + tool.slice(1) + ' data changed';
  }
  /* Generic fallback: action_name → "Action name" */
  if (e.action) {
    return e.action
      .replace(/[-_]+/g, ' ')
      .replace(/\b\w/g, function(c) { return c.toUpperCase(); });
  }
  return 'Unknown action';
}

function formatAuditTime(val) {
  if (!val) return '';
  /* Resolve the many audit-key shapes to something NL.parseDate reads, then
     let the canon ladder format it. Pure numeric strings → epoch; a
     "<ts>_<rand>" audit key → its leading timestamp; ISO strings pass through. */
  var ts = val;
  if (typeof val === 'string') {
    if (!isNaN(val)) {
      ts = parseInt(val, 10);
    } else if (isNaN(new Date(val).getTime())) {
      var m = val.match(/^(\d{10,})/);
      if (m) ts = parseInt(m[1], 10);
    }
  }
  var out = NL.timeAgo(ts);      // 'Just now' path shows as 'just now'; >=7d → '17 Apr 2026, 09:30'
  return out === '—' ? '' : out;
}

/*
 * loadRequests() reads requests/ node and shows pending entries.
 * Approve: removes pending flag from users/{uid}, fires sendApproval GAS.
 * Reject:  sets rejected:true on users/{uid}, fires sendRejection GAS.
 * Both update the request record status for audit trail.
 * Handles both new requests (with uid) and legacy requests (without uid).
 */
function loadRequests() {
  var container = document.getElementById('requestsList');
  container.innerHTML = '<div style="font-size:var(--text-sm);color:var(--text-muted);padding:8px 0;">Loading…</div>';

  db.ref('admin/requests').once('value').then(function(snap) {
    container.innerHTML = '';
    if (!snap.exists()) {
      var e = document.createElement('div');
      e.style.cssText = 'font-size:var(--text-sm);color:var(--text-muted);padding:8px 0;';
      e.textContent = 'No requests yet.';
      container.appendChild(e);
      return;
    }

    var pending = [], handled = [];
    snap.forEach(function(child) {
      var r = child.val(); r._key = child.key;
      if (r.status === 'pending') pending.push(r);
      else handled.push(r);
    });
    handled.sort(function(a, b) { return (b.createdAt || 0) - (a.createdAt || 0); });
    handled = handled.slice(0, 20);

    if (pending.length) {
      var ph = document.createElement('div');
      ph.style.cssText = 'font-size:var(--text-xs);font-weight:800;text-transform:uppercase;letter-spacing:0.1em;color:var(--text-muted);margin-bottom:12px;';
      ph.textContent = 'Pending (' + pending.length + ')';
      container.appendChild(ph);
      pending.forEach(function(r) { container.appendChild(buildRequestCard(r)); });
    } else {
      var np = document.createElement('div');
      np.style.cssText = 'font-size:var(--text-sm);color:var(--text-muted);padding:8px 0 20px;';
      np.textContent = 'No pending requests.';
      container.appendChild(np);
    }

    /* Recently handled removed — audit log handles this */
    void 0;
  }).catch(function() {
    container.innerHTML = '<div style="font-size:var(--text-sm);color:var(--text-muted);padding:8px 0;">Could not load requests.</div>';
  });
}

function buildRequestCard(r) {
  var card = document.createElement('div');
  card.className = 'request-card';

  /* Header: name, email, club, role, timestamp */
  var header = document.createElement('div');
  header.className = 'request-card__header';
  var info = document.createElement('div');
  info.className = 'request-card__info';
  var nameEl = document.createElement('div');
  nameEl.className = 'request-card__name';
  nameEl.textContent = r.name || '(no name)';
  var meta = document.createElement('div');
  meta.className = 'request-card__meta';
  var metaParts = [r.email || ''];
  if (r.club)     metaParts.push(r.club);
  if (r.jobTitle) metaParts.push(r.jobTitle);
  /* NL.formatDateTime, which produces exactly what these two toLocale calls
     were assembling by hand — "17 Aug 2026, 19:46". Two implementations of one
     format is a format that will eventually disagree with itself. */
  if (r.createdAt) metaParts.push(NL.formatDateTime(r.createdAt));
  meta.textContent = metaParts.join('  —  ');
  info.appendChild(nameEl);
  info.appendChild(meta);

  /* Warning if no uid — legacy request, can only reject */
  var hasUid = !!r.uid;
  if (!hasUid) {
    var warn = document.createElement('div');
    warn.style.cssText = 'font-size:var(--text-xs);color:var(--amber);font-weight:700;margin-top:4px;';
    warn.textContent = '⚠ Legacy request — no linked account. Reject to archive.';
    info.appendChild(warn);
  }

  header.appendChild(info);
  card.appendChild(header);

  /* Tool access sliders -- only if uid exists */
  if (hasUid) {
    var ss = document.createElement('div');
    ss.style.cssText = 'border-top:1px solid var(--border);padding:14px 20px 4px;';
    var sh = document.createElement('div');
    sh.style.cssText = 'font-size:var(--text-xs);font-weight:800;text-transform:uppercase;letter-spacing:0.1em;color:var(--text-muted);margin-bottom:10px;';
    sh.textContent = 'Access to grant — adjust before approving';
    ss.appendChild(sh);

    /* Build sliders from the tools they requested + defaults */
    var tools  = STATE.toolsList.filter(function(t) { return t._key !== 'welcome'; });
    var dm     = {};
    var reqTools = (r.tools && typeof r.tools === 'object' && !Array.isArray(r.tools))
      ? r.tools
      : {};

    tools.forEach(function(t) { var d = toolAudience(t); if (!dm[d]) dm[d] = []; dm[d].push(t); });
    sortDepts(Object.keys(dm)).forEach(function(dept) {
      if (dept === 'staff') return; /* never show staff tools on request cards */
      var dl = document.createElement('div');
      dl.style.cssText = 'font-size:var(--text-xs);font-weight:800;text-transform:uppercase;letter-spacing:0.1em;color:var(--text-muted);padding:8px 0 4px;border-top:1px solid var(--border);';
      dl.textContent = getDeptLabel(dept);
      ss.appendChild(dl);
      dm[dept].forEach(function(t) {
        var defaultLevel = roleDefaultLevel(t._key, r.role || 'staff');
        /* If they requested this tool and default is off, bump to access */
        var reqLevel = reqTools[t._key];
        if (reqLevel === 'access' && defaultLevel === 'off') defaultLevel = 'access';
        var row = document.createElement('div');
        row.className = 'invite-tool-row';
        var nm = document.createElement('div');
        nm.className = 'invite-tool-name';
        nm.textContent = (t.icon ? t.icon + ' ' : '') + (t.label || t._key);
        if (reqLevel === 'access') {
          var b = document.createElement('span');
          b.style.cssText = 'margin-left:6px;font-size:var(--text-xs);background:var(--navy);color:var(--white);padding:1px 6px;border-radius:8px;font-weight:800;text-transform:uppercase;';
          b.textContent = 'Requested';
          nm.appendChild(b);
        }
        row.appendChild(nm);
        row.appendChild(buildInviteSlider(t._key, defaultLevel, true /* club, cap admin */));
        ss.appendChild(row);
      });
    });
    card.appendChild(ss);
  }

  /* Actions */
  var actions = document.createElement('div');
  actions.className = 'request-card__actions';
  actions.style.cssText = 'padding:14px 20px;border-top:1px solid var(--border);';

  if (hasUid) {
    var approveBtn = document.createElement('button');
    approveBtn.className = 'btn btn--navy btn--sm';
    approveBtn.textContent = 'Approve';
    approveBtn.addEventListener('click', function() { approveRequest(r, approveBtn, ss); });

    var rejectBtn = document.createElement('button');
    rejectBtn.className = 'btn btn--ghost btn--sm';
    rejectBtn.textContent = 'Reject';
    rejectBtn.addEventListener('click', function() { rejectRequest(r, rejectBtn); });

    actions.appendChild(approveBtn);
    actions.appendChild(rejectBtn);
  } else {
    /* Legacy: reject only */
    var archiveBtn = document.createElement('button');
    archiveBtn.className = 'btn btn--ghost btn--sm';
    archiveBtn.textContent = 'Archive';
    archiveBtn.addEventListener('click', function() {
      db.ref('admin/requests/' + r._key + '/status').set('archived')
        .then(function() { showToast('Request archived', 'success'); loadRequests(); });
    });
    actions.appendChild(archiveBtn);
  }

  card.appendChild(actions);
  return card;
}

/* Approve: remove pending flag, write tool access, fire sendApproval email */
function approveRequest(r, btn, ss) {
  btn.disabled = true;
  btn.textContent = 'Approving…';

  if (!r.uid) {
    showToast('No linked account — cannot approve', 'error');
    btn.disabled = false;
    btn.textContent = 'Approve';
    return;
  }

  /* Read tool levels from sliders */
  var toolAccess = {};
  if (ss) {
    ss.querySelectorAll('.acc-slider').forEach(function(slider) {
      var key = slider.dataset.toolkey;
      if (!key) return;
      /* Read the level off the segment, not off its index — the last reader
         still doing the latter. See the note in the invite send path. */
      var level = 'off';
      slider.querySelectorAll('.acc-slider__stop').forEach(function(s) {
        if (s.classList.contains('acc-slider__stop--active')) level = s.dataset.level || level;
      });
      toolAccess[key] = level;
    });
  }

  var updates = {};
  updates['users/' + r.uid + '/pending']  = false;
  updates['users/' + r.uid + '/rejected'] = false;
  /* Write adjusted tool access — overrides-only (skip role defaults) */
  Object.keys(toolAccess).forEach(function(k) {
    var def = roleDefaultLevel(k, r.role || 'staff');
    updates['users/' + r.uid + '/tools/' + k] = (toolAccess[k] === def) ? null : toolAccess[k];
  });
  updates['admin/requests/' + r._key + '/status'] = 'approved';

  writeAuditFor(r.uid, r.name || '', r.email || '',
    'request_approved', (r.name || r.email || '') + (r.club ? ' (' + r.club + ')' : ''));

  db.ref().update(updates)
    .then(function() {
      /* Fire approval email -- fire and forget (idToken verified GAS-side) */
      nlGasFetch({ action: 'sendApproval', name: r.name || '', email: r.email || '', club: r.club || '' })
        .catch(function() {});
      showToast('Approved — ' + (r.name || r.email || ''), 'success');
      loadRequests();
      loadUsers();
    })
    .catch(function(err) {
      btn.disabled = false;
      btn.textContent = 'Approve';
      showToast('Failed: ' + err.message, 'error');
    });
}

/* Reject: set rejected:true, fire sendRejection email */
function rejectRequest(r, btn) {
  btn.disabled = true;
  btn.textContent = 'Rejecting…';

  if (!r.uid) {
    /* Legacy request with no uid -- just mark rejected in requests node */
    db.ref('admin/requests/' + r._key + '/status').set('rejected')
      .then(function() { showToast('Request rejected', 'success'); loadRequests(); })
      .catch(function() { btn.disabled = false; btn.textContent = 'Reject'; });
    return;
  }

  var updates = {};
  updates['users/' + r.uid + '/pending']  = false;
  updates['users/' + r.uid + '/rejected'] = true;
  updates['admin/requests/' + r._key + '/status'] = 'rejected';

  writeAuditFor(r.uid, r.name || '', r.email || '',
    'request_declined', (r.name || r.email || '') + (r.club ? ' (' + r.club + ')' : ''));

  db.ref().update(updates)
    .then(function() {
      /* Fire rejection email -- fire and forget (idToken verified GAS-side) */
      nlGasFetch({ action: 'sendRejection', name: r.name || '', email: r.email || '' })
        .catch(function() {});
      showToast('Request rejected', 'success');
      loadRequests();
      loadUsers();
    })
    .catch(function(err) {
      btn.disabled = false;
      btn.textContent = 'Reject';
      showToast('Failed: ' + err.message, 'error');
    });
}
