  Changelog:
  v5.105 (17/08/2026) — Club access follows the ROLE; club rows are read-only.
    Settled 17/08/2026 (see system/roles-and-access-plan.md): a club person gets
    exactly what Club Admin or Club Staff grants, with no per-tool exceptions.
    Club roles were already capped below admin in the builder, the preview and
    the save path — this makes the whole row non-interactive rather than leaving
    Off/Use editable. An override is a fact about access living in one record
    that silently contradicts the role, and it is what would make club
    self-service unexplainable to 72 clubs. Any legacy per-tool entry that
    disagrees with the role default is now FLAGGED ("Override" chip, 6.07:1)
    rather than hidden, so stranded data is visible by exception and can be
    cleared. League side is unchanged and keeps the per-tool level on the three
    tools that read it.

  v5.104 (17/08/2026) — The five role-driven tools declare two levels too
    (Attendance, Handbook, Commercial Benchmarking, Fixtures, Club Directory).
    They do have an admin tier, but their code decides it from the person's ROLE,
    never from the per-tool level — so offering Manage there was a second,
    competing tiering system that set a value nothing read. Role is the toolset;
    the level says whether you get in. Fan Widgets joins the two-level set as
    well (no admin gating anywhere in it, superadmin-only by defaults).
    Thirteen of seventeen tools are now Off / Use; only Judgements, Vacancies and
    Website Archive still offer Manage.

  v5.116 (17/08/2026) — The bits v5.115 missed, reported from a phone as
    near-unreadable. That sweep matched `font-size: Npx` and a clamp() is not
    plain px, so every clamp-based size walked past it — including
    .tool-tile__desc at clamp(11px, 0.7vw, 13px), whose 11px floor put the
    sentence explaining what each tool does BELOW the brand minimum on every
    phone. Now --text-sm; .tool-tile__name (clamp 13-16) is --text-base.
    .uacc-name__secondary — the email address identifying each user row — goes
    from --text-xs to --text-sm. The 12px floor is a minimum for fine print,
    not a target for text people actually read, and this is how you tell one
    person from another in the list.
    The floor test now reads a clamp's floor as well as a plain px, so the
    same class of miss cannot repeat. Verified by injecting clamp(10px,...).
    Contrast was measured and is not the problem: --text-muted is 5.50:1 on
    white, comfortably past AA. It was size.

  v5.115 (17/08/2026) — Brand sweep, pass two: the text is not tiny any more.
    Every font-size in this file is a --text-* token. There were 95, of which
    57 sat below the 12px floor the brand set at v2.36 — down to 8px — so on a
    phone this page was close to unreadable. 68 lived in the stylesheet and 27
    were written inline in JS or markup, which is why previous passes missed
    them.
    Mapping: 8-12px to --text-xs, 13-15px to --text-sm, 16-17 --text-base, 18
    --text-md, 22-24 --text-lg. The 13px ones deliberately do NOT go to
    --text-xs: that token clamps to 12px on a phone, so they would have shrunk
    on the very device this is for.
    The root cause was in canon, not here — nl-brand.css had 19 of its own
    sub-floor sizes, so .table th, .pill, every form label and the whole topbar
    were tiny in EVERY tool. Fixed there (v2.49) with two tests holding the
    floor. This file was the symptom.

  v5.114 (17/08/2026) — Brand sweep, pass one: the shadow copies go.
    This file carried its own .toast — 13px/700 sentence case against canon's
    11px/800 uppercase, and solid-fill success/error/info against canon's
    coloured left border — so the portal's toasts were the only ones in the
    estate that did not look like NL toasts, even though showToast() has
    delegated to NL.toast for months. It also carried the whole .role-* block,
    byte-identical for the five roles canon had plus local definitions for
    club-admin and club-staff, which canon was MISSING after the 16/08 rename.
    That copy is why nobody noticed canon was a version behind the role model.
    Both deleted; canon fixed (nl-brand v2.48) and covered by a test that fails
    if the pills and NL.roles ever disagree again.
    The club filter <select> was twelve inline properties hand-rolling
    .nl-select, so it had no hover, no focus ring and no drawn chevron.
    Every rgba() in this file is gone. The two focus rings were the same recipe
    as var(--focus-ring); the spinner rim is --navy-300; the tile-hover and
    dropdown shadows are the new var(--shadow-lg) (promoted after the estate
    turned out to hold five hand-mixed raised shadows in four values and three
    inks); the starred-tile navy glow stays local as portal identity but is
    mixed from --navy rather than a repeated literal, and is flagged as the
    thing to promote if a second tool grows a pinned surface.
    Still to do: ~97 hardcoded font-sizes against the --text-* scale, ~60
    inline style/cssText sites, and a copy pass.

  v5.113 (17/08/2026) — The tool-name column gets min-width:0, which is what
    was actually breaking the alignment on the sign-up request cards. A flex
    item defaults to min-width:auto and so refuses to shrink below its longest
    word: "Commercial Benchmarking" held the name column open and pushed the
    fixed-width control right on that row alone, while every shorter name left
    it where it belonged. The column lost its line on exactly the tools with
    the longest names, which is why it looked arbitrary. Applied to both
    .uacc-tool-name and .invite-tool-name, with overflow-wrap so a long name
    wraps rather than overflowing.

  v5.112 (17/08/2026) — FIX: a League Admin pressing Edit saw nothing selected
    on all thirteen two-rung tools. Three repaint paths — enterEditMode,
    cancelAccess and previewRoleSliders — did their own arithmetic against the
    global off/access/admin list rather than the slider's own rungs, so a
    stored or defaulted 'admin' resolved to index 2, no rung matched, and the
    control came up blank. All three now call setSliderLevel, which has always
    painted against the rungs that exist; so do both click handlers, so there
    is one repaint in the file instead of five. The sign-up request card's
    reader, the last one mapping index back to a level, reads dataset.level.
    The rungs line up now, not just the boxes. The control is a fixed width and
    the rungs used to divide it, so "Use" was half the box on a two-rung tool
    and a third of it on a three-rung one — the words landed in a different
    place on every row and the column read as ragged even though the boxes
    matched. It is a three-column grid, and a rung the tool (or the role) does
    not have is an empty cell: Off sits under Off, Use under Use, Manage under
    Manage, all the way down. The cell is aria-hidden and carries no label,
    role or handler.
    Dropped .acc-slider__stop--filled — applied in two builders, styled
    nowhere since the track was deleted.

  v5.111 (17/08/2026) — The invite form's tool preview gets the same shape as
    the user rows: the role's grant in one line, then a fold for the exception
    you might want to make before sending. On an invite there are no exceptions
    by definition — every tool starts at its role default — so the old grid was
    sixteen controls restating a role the sender had chosen two fields earlier.
    FIX in the send path: the level written for each tool was read from the
    stop's INDEX and mapped back through ACC_LEVELS. That only holds while
    every slider has three rungs, and since v5.102 thirteen tools render two
    and a club role drops Manage as well. It has been right by luck — index 0
    is 'off' and index 1 'access' in both ladders — and would have written the
    wrong level the day a ladder started anywhere but 'off'. Reads
    stop.dataset.level now, like every other reader since the ladders went
    per-tool. This was the last one left doing it.
    Deleted with the grid: buildInviteSetAllSlider, resetInviteSetAll,
    resetSetAllSlider, the three edit-mode blocks that locked and cleared a bar
    nothing builds, and 158 lines of CSS for the dept header, the mobile band
    and the set-all slider — which held every rgba() overlay in this file, on a
    white-on-navy control the brand has no tokens for. buildAccSlider loses its
    bodyEl argument, which existed only so a slider could reach up and clear
    that bar.

  v5.110 (17/08/2026) — Each role states what it grants, in both pickers. The
    four buttons were bare names, so nothing on screen said which role can
    submit a club's attendances — the answer lived only in
    system/roles-and-access-plan.md, which nothing links to, and the person
    choosing the role is exactly the person who needs it. The wording comes
    from NL.roles.grant (nl-utils v1.39) rather than either picker, so the
    invite form and the inline picker in each user row cannot drift apart, and
    a future tool explaining access reads it from the same place as the label.
    The invite form's buttons are static markup, so fillRoleGrants() fills them
    from canon when the panel is revealed.
    Lockstep: nl-utils ?v=41 -> ?v=42, auth-guard ?v=14 -> ?v=15.

  v5.109 (17/08/2026) — Nothing is struck through any more, because nothing
    unreachable is drawn. With thirteen of sixteen tools at two rungs, a club
    account's panel was mostly crossed-out text: eight league tools it can
    never open, plus a Manage rung on every remaining row that a club role can
    never hold. It read as broken rather than as informative, and a control
    nobody can ever operate is not information anyone acts on.
    League-audience tools are skipped for club accounts and counted once in
    the summary line instead ("8 league tools are not open to club accounts").
    The Manage rung is filtered out of the ladder for club rows in
    buildAccSlider rather than rendered and defaced. What is left is a real
    control, read-only until Edit access is pressed.
    .acc-slider__stop--padlocked keeps its class as a fallback but loses the
    line-through: muted and inert, not defaced.
    Canon candidate: .acc-slider is a second implementation of a segmented
    single-choice control, which nl-brand.css already has as .chip-group /
    .chip. The portal's version adds states the canon one lacks (a read-only
    value display, and a per-tool ladder). Worth converging — see the note in
    the CSS above .acc-slider.

  v5.108 (17/08/2026) — Two rows that drew as "you have nothing" when they did
    not. A superadmin's own entry rendered sixteen tools of struck-through
    Off / Use / Manage: every rung is structurally unavailable to them because
    the role is granted before the level is ever asked, so permanentLock
    padlocked the lot. They now get the summary line and no list at all.
    Club rows had the same fault for the same reason — permanentLock included
    every club row, so a club person's sixteen tools drew struck out while
    they in fact hold Use on all of them. permanentLock is now reserved for
    what it means: a league-audience tool on a club account. Club rows are
    read-only, which is a different statement and already has a style
    (.acc-slider--locked — value legible, affordance retreats); the Manage
    rung stays struck via clubLocked, since a club role can never hold it.
    enterEditMode gains an isClub guard, because the strike-through was
    quietly doing that job.
    Also: NL_CHANGELOG had not moved since v5.101, so the topbar badge still
    read v5.101 while six versions of visible change shipped underneath it.

  v5.107 (17/08/2026) — The access editor leads with the role and shows only
    the exceptions. It used to lay out all sixteen tools as editable controls
    for every user, every time — so for a typical account all sixteen restated
    the role, and the one row that genuinely deviated looked exactly like the
    fifteen that did not. An exception is only visible if the rule is not
    drawn beside it sixteen times. For club accounts it was worse: club access
    follows the role with no per-tool exceptions, so every control was inert.
    Now: one sentence naming what the role grants, then the deviating tools
    under a red accent (labelled Exception on a league account, Stranded on a
    club one — there it is leftover data to clear), then the rest folded into
    a canon .disclosure that opens with edit mode.
    The records did not change: saveAccess() has always written overrides
    only, nulling any level equal to the role default. This brings the panel
    into line with what it was already storing. Row markup is untouched, so
    enterEditMode / saveAccess / cancelAccess find their rows as before.
    Deleted buildSetAllSlider() and setAllInDept(): bulk-setting exceptions is
    an anti-feature once role is the toolset, and that control shipped as two
    duplicated DOM nodes (navy desktop copy, red mobile copy, swapped by media
    query) styled with ~40 rgba() overlays the brand does not use.

  v5.106 (17/08/2026) — Access controls line up, and a dead rule stops drawing.
    Every .acc-slider is now one fixed width (--acc-slider-w, declared once on
    .admin-panel) with its rungs dividing that width, instead of inline-flex
    with a 60px min-width per rung. A two-rung tool drew ~128px and a
    three-rung tool ~190px, so right-aligned in the row every control started
    at a different place and the column read as ragged — the thirteen/three
    split of v5.104 made that visible on almost every row.
    Also deleted the orphaned first definition of .uacc-dept-label: both its
    consumers moved inside .uacc-dept-header long ago, so the later definition
    won every shared property and the block rendered nothing — except its
    ::after, which had no counterpart to lose to and kept drawing a stray 1px
    rule across the navy bar.

  v5.103 (17/08/2026) — The eight flat tools declare two levels (Graphics, Travel
    Planner, Newsletter, Wellbeing, Estate, NLServices, Style Guide, Programme
    admin). None has an admin concept anywhere in its code, so "Manage" there set
    a value nothing read; their rows are now Off / Use. buildToolTile also clamps
    through the tool's ladder before colouring the tile, because a record can
    still carry defaults of 'admin' on a two-level tool — harmless for access
    (auth-guard only cares it isn't 'off') but the card would otherwise wear the
    red "you administer this" border for something nobody can administer. Clamping
    keeps the card honest without rewriting stored data.

  v5.102 (17/08/2026) — Access levels become per-tool. New toolLevels(tool) reads
    a `levels` array from the tool's registry record and the sliders render only
    those rungs, so a tool with no admin tier stops offering "Manage" — a control
    that, on most tools, sets a value nothing reads. Absent/malformed `levels`
    falls back to the full three, so an unmigrated or badly-edited record behaves
    exactly as before and can never silently remove an access state. Only a
    PREFIX of off/access/admin is honoured (drop the top rung, never punch a hole).
    Each stop now carries data-level and the readers use it instead of mapping
    stop INDEX back to ACC_LEVELS, which only held while every slider had three
    stops. setSliderLevel clamps to the highest rung a tool has, so a dept
    "set all to Manage" no longer leaves two-level tools with nothing selected.
    Inert until records declare `levels`.

  v5.101 (17/08/2026) — Access model step 3: the per-tool level control is
    rebuilt, and its words change. Levels are now Off / Use / Manage (stored
    values off/access/admin are untouched) so "admin" is left to mean the ROLE
    alone rather than a role, a power level and "edits own club" at once.
    The control itself was a pseudo-slider: three dots on a track that was
    never drawn — its updateFill() computed a percentage and discarded it, and
    .acc-slider__track had no CSS at all — labelled in 8px uppercase 800 and
    operable only by mouse. It is now a segmented control: the standard
    affordance for one-of-three, 11.5px labels, brand tokens throughout.
    Accessibility: role=radiogroup/radio with aria-checked, a roving tabstop,
    Space/Enter activation and a visible focus ring, where before it was divs
    with click handlers — unreachable by keyboard and silent to screen readers.
    A shared syncAccAria() keeps state correct across the preview/restore paths.
    Canon: removed rgba(0,0,0,.03) and rgba(158,0,0,.15) in favour of the shade
    ladder, and deleted the inline style.cssText / label.style.color writes —
    including one setting label text to var(--border), a border token used as a
    text colour, which failed contrast outright. All states verified against
    WCAG AA (5.08:1 idle, 8.56:1 selected, 4.53:1 padlocked-on-navy).

  v5.97 (16/08/2026) — Local .banner family promoted to canon (nl-brand.css

  v5.95 (17/07/2026) — Privileged GAS calls now send the caller's Firebase ID
    token so the backend can authorise them (Phase 7 — invite/approval authz).

    public GAS URL could POST sendInvite with role:'superadmin'. GAS-side gate
    (verifyCaller_ + role checks) is documented in gas/SECURITY-invite-authz.md.

  v5.94 (14/07/2026) — Retired the `department` field (Phase 5). The admin

  v5.93 (14/07/2026) — Staff/Club split now reads the canonical `audience`
    field (Phase 4 of audience gating). New top-level toolAudience(tool)
    helper is the single source of truth; the tool-grid grouping (isClubTool)

  v5.87 (14/06/2026) — Fix "Restore defaults" using the wrong role:

<style>/* ────────────────────────────────────────────────────────────────
   Portal-specific CSS. Shared foundation from /system/nl-brand.css:
     - Fonts (@font-face carbona)
     - Design tokens (:root variables)
     - Reset (*, body, html)
     - Topbar (.topbar + full component)
     - Buttons (.btn + variants)
     - Section header (.section-head)
   Portal-specific patterns kept here: welcome carousel, tool tiles,
   admin panel, users accordion, invite form, audit log, pills (role-*),
   toast (different class pattern), auth overlay.
   (.banner + variants promoted to nl-brand.css v2.40 — the guard banner
   markup below uses the canon classes directly.)
   ──────────────────────────────────────────────────────────────── */

/* -- Page body ------------------------------------------------------------- */
/* .page-body sizing inherited from nl-brand.css (universal container rule) */

/* -- Auth loading overlay -------------------------------------------------- */
@keyframes nlSpin { to { transform: rotate(360deg); } }
.auth-overlay {
  position: fixed;
  inset: 0;
  background: var(--primary);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
}
.auth-overlay__spinner {
  width: 36px; height: 36px;
  border: 3px solid var(--navy-300);
  border-top-color: var(--white);
  border-radius: 50%;
  animation: nlSpin 0.7s linear infinite;
}

/* -- Welcome carousel ------------------------------------------------------ */
.noticeboard-wrap {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  margin-bottom: 32px;
  overflow: hidden;
}
.noticeboard-header {
  display: flex;
  align-items: center;
  padding: 14px 20px;
  border-bottom: 1px solid var(--border);
}
.noticeboard-header.open { border-bottom-color: var(--border); }
.noticeboard-header__icon { font-size: var(--text-md); margin-right: 12px; }
.noticeboard-header__title {
  flex: 1;
  font-size: var(--text-sm);
  font-weight: 700;
  font-variation-settings: 'wght' 700;
  color: var(--text);
}
.noticeboard-header__count {
  font-size: var(--text-xs);
  color: var(--text-muted);
  margin-right: 10px;
}

.noticeboard-body { display: none; padding: 0; }
.noticeboard-body.open { display: block; }

.noticeboard-slides { position: relative; }
.noticeboard-slide {
  padding: 20px 24px;
  border-bottom: 1px solid var(--border);
  display: none;
}
.noticeboard-slide.active { display: block; }
.noticeboard-slide__title {
  font-size: var(--text-base);
  font-weight: 700;
  font-variation-settings: 'wght' 700;
  color: var(--text);
  margin-bottom: 8px;
}
.noticeboard-slide__content { font-size: var(--text-sm); color: var(--text-muted); line-height: 1.6; }
.noticeboard-slide__content p { margin-bottom: 8px; }
.noticeboard-slide__content p:last-child { margin-bottom: 0; }
.noticeboard-slide__content strong,
.noticeboard-slide__content b {
  font-weight: 700;
  font-variation-settings: 'wght' 700;
}

.noticeboard-nav {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 20px;
}
.noticeboard-nav__btn {
  background: none;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 5px 12px;
  font-size: var(--text-xs);
  font-weight: 700;
  font-variation-settings: 'wght' 700;
  cursor: pointer;
  font-family: var(--font);
  color: var(--text-muted);
  transition: all 0.15s;
}
.noticeboard-nav__btn:hover { border-color: var(--navy); color: var(--navy); }
.noticeboard-nav__btn:disabled { opacity: 0.35; cursor: default; }
.noticeboard-nav__dots { display: flex; gap: 5px; flex: 1; justify-content: center; }
.noticeboard-nav__dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--border);
  border: none;
  cursor: pointer;
  padding: 0;
  transition: background 0.15s;
}
.noticeboard-nav__dot.active { background: var(--primary); }
.noticeboard-empty {
  padding: 24px;
  text-align: center;
  color: var(--text-muted);
  font-size: var(--text-sm);
}

/* -- Favourites ------------------------------------------------------------ */
.tool-tile--starred {
  background: var(--blue-light);
  border-top-color: var(--navy) !important;
  /* CANON CANDIDATE (17/08/2026): a navy-tinted glow marking a starred tile,
     and the text-shadow below it. Portal identity today — the only starred
     thing in the estate — so it stays local per the one-off rule. If a second
     tool grows a "pinned/favourite" surface, this pair is the thing to
     promote, not another hand-mixed navy wash. rgb(34,59,124) is --navy. */
  box-shadow: 0 2px 16px color-mix(in srgb, var(--navy) 15%, transparent);
}
.tool-tile__star {
  position: absolute;
  top: 10px;
  right: 10px;
  background: none;
  border: none;
  cursor: pointer;
  font-size: var(--text-lg);
  line-height: 1;
  opacity: 0.4; /* was 0.2 — near-invisible (1.3:1); the favourite affordance must be discoverable */
  transition: opacity 0.15s, transform 0.15s, color 0.15s;
  padding: 4px;
  color: var(--text-muted);
  z-index: 2;
}
.tool-tile__star:hover { opacity: 0.7; transform: scale(1.1); color: var(--navy); }
.tool-tile__star:focus-visible { outline: none; opacity: 0.9; box-shadow: var(--focus-ring); border-radius: 6px; }
.tool-tile--starred .tool-tile__star {
  opacity: 1;
  color: var(--navy);
  font-size: var(--text-lg);
  text-shadow: 0 1px 4px color-mix(in srgb, var(--navy) 30%, transparent);
}
.tool-tile { position: relative; } /* needed for absolute star */

/* -- Tool section headings ------------------------------------------------- */
.tools-section__head {
  font-size: var(--text-xs);
  font-weight: 900;
  font-variation-settings: 'wght' 900;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  color: var(--text-muted);
  padding: 0 0 10px 0;
  border-bottom: 1px solid var(--border);
  margin-bottom: 20px;
}

/* -- Tool section spacing -------------------------------------------------- */
#staffToolsSection + #clubToolsSection .section-head { margin-top: 40px; }

/* -- Tool tile grid -------------------------------------------------------- */
.tool-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(clamp(200px, 18vw, 280px), 1fr));
  gap: clamp(14px, 1vw, 20px);
  margin-bottom: 36px;
}
.tool-tile {
  background: var(--white);
  border: 1px solid var(--border);
  border-top: 3px solid var(--border);
  border-radius: var(--radius);
  padding: clamp(20px, 1.5vw, 28px) clamp(18px, 1.25vw, 24px);
  cursor: pointer;
  text-decoration: none;
  color: var(--text);
  display: flex;
  flex-direction: column;
  gap: 10px;
  transition: box-shadow 0.15s, border-color 0.15s, transform 0.1s;
  box-shadow: var(--shadow);
  position: relative;
}
.tool-tile--admin  { border-top-color: var(--primary); }
.tool-tile--access { border-top-color: var(--navy); }
/* "Off" tiles are de-emphasised via a neutral border + muted icon, NOT by
   fading the whole tile — container opacity dropped the description text below
   WCAG AA (2.5:1). Text now stays at full --text-muted contrast (5.5:1). */
.tool-tile--off    { border-top-color: var(--border); }
.tool-tile--off .tool-tile__icon { opacity: 0.5; }
.tool-tile--off .tool-tile__name { color: var(--text-muted); }
.tool-tile:hover {
  border-color: var(--navy);
  box-shadow: var(--shadow-lg);
  transform: translateY(-1px);
}
.tool-tile--placeholder {
  opacity: 0.55;
  cursor: default;
}
.tool-tile--placeholder:hover {
  border-color: var(--border);
  box-shadow: var(--shadow);
  transform: none;
}
.tool-tile__icon { font-size: clamp(28px, 1.8vw, 38px); line-height: 1; }
.tool-tile__name {
  /* Was clamp(13px, 0.9vw, 16px) — a hand-rolled scale that predates the
     tokens and escaped the v5.115 sweep, because that pass matched plain px
     and a clamp is not plain px. */
  font-size: var(--text-base);
  font-weight: 800;
  font-variation-settings: 'wght' 800;
  color: var(--text);
  line-height: 1.2;
}
.tool-tile__desc {
  /* Was clamp(11px, 0.7vw, 13px). The 11px floor put this BELOW the brand
     minimum on every phone — reported as near-unreadable, and correctly. It
     survived the sweep for the same reason as the title above.
     --text-sm, not --text-xs: this is the sentence explaining what a tool
     does, which is reading text, and the 12px floor is a minimum for fine
     print rather than a target for prose. */
  font-size: var(--text-sm);
  color: var(--text-muted);
  line-height: 1.4;
  flex: 1;
}
.tool-tile__badge {
  position: absolute;
  top: 10px;
  right: 10px;
  background: var(--primary);
  color: var(--white);
  border-radius: 10px;
  font-size: var(--text-xs);
  font-weight: 900;
  font-variation-settings: 'wght' 900;
  padding: 2px 6px;
  min-width: 18px;
  text-align: center;
}
.tool-tile__soon {
  font-size: var(--text-xs);
  font-weight: 800;
  font-variation-settings: 'wght' 800;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-muted);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 2px 6px;
  align-self: flex-start;
}

/* -- Keyboard focus indicators --------------------------------------------- */
/* The shared .btn/.tab/input widgets already carry :focus-visible from
   nl-brand.css. These portal-specific custom controls did not — keyboard
   focus was invisible on them. Wire the canonical --focus-ring token in. */
.admin-tab:focus-visible,
.noticeboard-nav__btn:focus-visible,
.noticeboard-nav__dot:focus-visible,
.club-filter-pill:focus-visible,
.invite-role-btn:focus-visible,
.invite-org-btn:focus-visible,
.available-tile__req:focus-visible,
.cancel-invite-btn:focus-visible,
.change-role-btn:focus-visible,
.resend-pill:focus-visible,
.tool-tile:focus-visible,
.uacc-header:focus-visible {
  outline: none;
  box-shadow: var(--focus-ring);
}
.tool-tile:focus-visible { border-color: var(--navy); }
.uacc-header:focus-visible { box-shadow: inset var(--focus-ring); }

/* -- Available tools ------------------------------------------------------- */
.available-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(clamp(220px, 16vw, 280px), 1fr));
  gap: clamp(10px, 0.8vw, 14px);
  margin-bottom: 36px;
}
.available-tile {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  box-shadow: var(--shadow);
}
.available-tile__icon { font-size: var(--text-lg); flex-shrink: 0; }
.available-tile__info { flex: 1; min-width: 0; }
.available-tile__name {
  font-size: var(--text-sm);
  font-weight: 700;
  font-variation-settings: 'wght' 700;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.available-tile__dept {
  font-size: var(--text-xs);
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  font-weight: 700;
  font-variation-settings: 'wght' 700;
}
.available-tile__req {
  background: none;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 4px 10px;
  font-size: var(--text-xs);
  font-weight: 700;
  font-variation-settings: 'wght' 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  cursor: pointer;
  font-family: var(--font);
  color: var(--text-muted);
  transition: all 0.15s;
  white-space: nowrap;
}
.available-tile__req:hover { border-color: var(--navy); color: var(--navy); }
.available-tile__req:disabled { opacity: 0.5; cursor: default; }

/* -- Admin panel ----------------------------------------------------------- */
.admin-panel {
  margin-top: 40px;
  border-top: 2px solid var(--border);
  padding-top: 32px;

  /* The width of every access control in the panel. Declared once, here, so
     the tool rows, the invite preview and the set-all bar cannot drift into
     three slightly different columns. Sized for the longest rung label
     ("Manage") at three rungs. */
  --acc-slider-w: 186px;
}
.admin-panel__title {
  font-size: var(--text-sm);
  font-weight: 900;
  font-variation-settings: 'wght' 900;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--text-muted);
  margin-bottom: 24px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.admin-panel__title::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}

/* Admin tabs */
.admin-tabs {
  display: flex;
  gap: 4px;
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 3px;
  margin-bottom: 24px;
  flex-wrap: wrap;
}
.admin-tab {
  flex: 1;
  min-width: 80px;
  text-align: center;
  padding: 8px 12px;
  border-radius: 4px;
  font-size: var(--text-xs);
  font-weight: 800;
  font-variation-settings: 'wght' 800;
  cursor: pointer;
  color: var(--text-muted);
  border: none;
  background: none;
  transition: all 0.15s;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  font-family: var(--font);
}
.admin-tab.active { background: var(--primary); color: var(--white); }


/* -- Inbound section headers (merged requests + pending invites) ----------- */
.inbound-section__head {
  display: flex;
  align-items: baseline;
  gap: 10px;
  margin-bottom: 14px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--border);
}
.inbound-section__label {
  font-size: var(--text-xs);
  font-weight: 800;
  font-variation-settings: 'wght' 800;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--navy);
}
.inbound-section__hint {
  font-size: var(--text-xs);
  color: var(--text-muted);
}

/* -- Users + Invite two-column split --------------------------------------- */
.users-invite-split {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 28px;
  align-items: start;
}
.users-invite-split__invite {
  background: var(--off-white);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  position: sticky;
  top: 80px;
}
.users-invite-split__invite-head {
  font-size: var(--text-xs);
  font-weight: 800;
  font-variation-settings: 'wght' 800;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--navy);
  margin-bottom: 16px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--border);
}
@media (max-width: 860px) {
  .users-invite-split {
    grid-template-columns: 1fr;
  }
  .users-invite-split__invite {
    position: static;
  }
}

.admin-pane { display: none; }
.admin-pane.active { display: block; }

/* -- Requests tab ---------------------------------------------------------- */
.request-card {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px 20px;
  margin-bottom: 12px;
  box-shadow: var(--shadow);
}
.request-card__header {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  margin-bottom: 12px;
}
.request-card__info { flex: 1; }
.request-card__name {
  font-size: var(--text-sm);
  font-weight: 700;
  font-variation-settings: 'wght' 700;
  color: var(--text);
}
.request-card__meta {
  font-size: var(--text-xs);
  color: var(--text-muted);
  margin-top: 2px;
}
.request-card__tools {
  font-size: var(--text-xs);
  color: var(--text-muted);
  margin-bottom: 14px;
  line-height: 1.5;
}
.request-card__actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* -- Users table ----------------------------------------------------------- */
.users-controls {
  display: flex;
  gap: 10px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.users-controls input[type="text"] {
  flex: 1;
  min-width: 160px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 8px 12px;
  font-size: var(--text-sm);
  font-family: var(--font);
  outline: none;
  transition: border-color 0.15s;
}
.users-controls input[type="text"]:focus { border-color: var(--primary); }





/* -- Invite club picker ---------------------------------------------------- */
.inv-club-picker { position: relative; }
.inv-club-picker__wrap {
  display: flex; align-items: center; gap: 10px;
  border: 1px solid var(--border); border-radius: var(--radius);
  padding: 7px 12px; background: var(--white);
  transition: border-color 0.15s, box-shadow 0.15s;
}
.inv-club-picker__wrap:focus-within {
  border-color: var(--primary);
  box-shadow: var(--focus-ring);
}
.inv-club-picker__crest { width: 28px; height: 28px; object-fit: contain; flex-shrink: 0; }
.inv-club-picker__input {
  flex: 1; border: none !important; padding: 0 !important;
  font-size: var(--text-sm); outline: none; background: transparent;
  font-family: var(--font); font-variation-settings: 'wght' 400; color: var(--text);
}
.inv-club-picker__input::placeholder { color: var(--text-muted); }
.inv-club-picker__dropdown {
  position: absolute; top: 100%; left: 0; right: 0; z-index: 200;
  background: var(--white); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow);
  max-height: 200px; overflow-y: auto; display: none; margin-top: 3px;
}
.inv-club-picker__dropdown.open { display: block; }
.inv-club-picker__option {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 12px; cursor: pointer; font-size: var(--text-sm);
  border-bottom: 1px solid var(--border);
}
.inv-club-picker__option:last-child { border-bottom: none; }
.inv-club-picker__option:hover { background: var(--off-white); }
.inv-club-picker__option img { width: 24px; height: 24px; object-fit: contain; flex-shrink: 0; }
.inv-club-picker__option-name { flex: 1; font-weight: 600; font-variation-settings: 'wght' 600; }
.inv-club-picker__option-div { font-size: var(--text-xs); color: var(--text-muted); text-transform: uppercase; }

/* -- Users accordion (all screen sizes) ----------------------------------- */

.users-accordion { margin-top: 4px; }


.uacc-item {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 8px;
  overflow: hidden;
  box-shadow: var(--shadow);
}

/* Header — single row desktop layout */
.uacc-header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  cursor: pointer;
  user-select: none;
  transition: background 0.12s;
}
.uacc-header:hover { background: var(--off-white); }
.uacc-header.open { border-bottom: 1px solid var(--border); }

/* Org crest */
.uacc-crest {
  width: 36px; height: 36px;
  object-fit: contain;
  border-radius: 50%;
  background: var(--off-white);
  padding: 3px;
  flex-shrink: 0;
}

/* Name col — grows */
.uacc-name {
  flex: 2;
  min-width: 0;
}
.uacc-name__primary {
  font-size: var(--text-sm);
  font-weight: 700;
  font-variation-settings: 'wght' 700;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.uacc-name__secondary {
  /* An email address is how you identify the person in this row, so it is
     read, not glanced at. --text-xs is the floor for fine print; this earns
     --text-sm. Reported as near-unreadable at the floor. */
  font-size: var(--text-sm);
  color: var(--text-muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* Org name col — desktop only */
.uacc-org {
  flex: 1;
  min-width: 0;
  font-size: var(--text-xs);
  color: var(--text-muted);
  font-weight: 600;
  font-variation-settings: 'wght' 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.uacc-chevron {
  font-size: var(--text-xs);
  color: var(--text-muted);
  transition: transform 0.2s;
  flex-shrink: 0;
}
.uacc-header.open .uacc-chevron { transform: rotate(180deg); }



/* Mobile: two-row stacked layout */
@media (max-width: 600px) {
  .uacc-org { display: none; }
  .uacc-header {
    flex-wrap: wrap;
    padding: 10px 12px;
    gap: 8px;
    align-items: center;
  }
  .uacc-crest { width: 28px; height: 28px; order: 1; }
  .uacc-name  { order: 2; flex: 1; min-width: 0; }
  .uacc-chevron { order: 3; flex-shrink: 0; }

/* The .role-* variants live in nl-brand.css (v2.48). This file carried its own
   copy — byte-identical for the five roles canon had, plus local definitions
   for club-admin and club-staff, which canon was missing after the 16/08
   rename. That copy is why nobody noticed canon was a version behind the role
   model: the portal looked right, so the gap only showed on any other tool
   that tried to render a club pill. Fixed in canon, deleted here. */

/* -- Per-tool access level ------------------------------------------------- */
/* Access level — a segmented control (Off / Use / Manage).
   Was a pseudo-slider: three dots on a "track" that was never drawn (its
   updateFill() was dead code), labelled in 8px uppercase and reachable only
   by mouse. A segmented control is the standard affordance for one-of-three,
   so it needs no learning, reads at a glance, and takes keyboard focus. */
/* CANON CANDIDATE (17/08/2026) — .acc-slider is a second implementation of a
   segmented, mutually-exclusive choice control, and nl-brand.css already has
   one: .chip-group / .chip. This version carries states the canon component
   does not — a read-only value display (--locked) and a per-tool ladder whose
   rung count varies — so converging means extending .chip-group rather than
   swapping to it. Flagged, not done: there is one consumer today, and the
   promotion rule is that the second use earns the move. If a tool needs a
   two- or three-way choice, extend .chip-group and bring this with it.

   One fixed width for every control, whatever its rung count.
   These sit in a column, one per tool, and used to be inline-flex with a
   60px min-width per segment — so a two-rung tool (Off / Use) drew ~128px
   and a three-rung tool (Off / Use / Manage) ~190px. Right-aligned in the
   row, that put every control's left edge in a different place and the
   column read as ragged. Now the box is a fixed width and the segments
   divide it, so all the controls line up and only the internal split moves. */
.acc-slider {
  display: grid;
  grid-template-columns: repeat(3, 1fr);   /* one column per rung, always */
  align-items: stretch;
  gap: 2px;
  padding: 2px;
  position: relative;
  flex: 0 0 var(--acc-slider-w, 186px);
  width: var(--acc-slider-w, 186px);
  background: var(--off-white);
  border: 1px solid var(--border);
  border-radius: var(--radius);
}
/* Holds a column open where this tool has no rung. Not a control: no label,
   no handler, aria-hidden. Its only job is to keep Use above Use. */
.acc-slider__gap { display: block; }

.acc-slider__stop {
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  z-index: 1;
  cursor: pointer;
  min-width: 0;          /* the grid column sets the width */
  padding: 5px 4px;
  border-radius: calc(var(--radius) - 2px);
  background: transparent;
  transition: background 0.15s ease, color 0.15s ease;
}
/* Hover must exclude the selected segment. Without the :not() below, this
   selector (0,3,0) out-specifies .acc-slider__stop--active (0,1,0), so
   hovering the selected segment repainted it near-white while its label
   stayed white — invisible, about 1.05:1. The selected segment gets its own
   hover instead: a step down the primary ladder, white text intact. */
.acc-slider__stop:hover:not(.acc-slider__stop--padlocked):not(.acc-slider__stop--active) {
  background: var(--navy-50);
}
.acc-slider__stop--active:hover { background: var(--primary-600); }
.acc-slider__stop:focus-visible {
  outline: 2px solid var(--navy);
  outline-offset: 1px;
}

/* The dot is gone — the segment itself carries the state now. */
.acc-slider__node { display: none; }

.acc-slider__label {
  font-size: var(--text-xs);
  font-weight: 600;
  font-variation-settings: 'wght' 600;
  letter-spacing: 0.005em;
  color: var(--text-muted);
  transition: color 0.15s ease;
  white-space: nowrap;
  line-height: 1.25;
}

/* Selected — the one state that carries brand colour. */
.acc-slider__stop--active { background: var(--primary); }
.acc-slider__stop--active .acc-slider__label {
  color: var(--white);
  font-weight: 700;
  font-variation-settings: 'wght' 700;
}

/* Read-only (not in edit mode): value stays legible, affordance retreats. */
.acc-slider--locked .acc-slider__stop { cursor: default; pointer-events: none; }
.acc-slider--locked { background: transparent; }
.acc-slider--locked .acc-slider__stop--active { background: var(--primary-100); }
.acc-slider--locked .acc-slider__stop--active .acc-slider__label { color: var(--primary-900); }

/* Structurally unavailable. This used to strike the label through, and with
   thirteen of sixteen tools at two rungs it meant a club account's panel was
   mostly crossed-out text — it read as broken rather than as informative, and
   a rung nobody can ever select is not information anyone acts on.
   The rows and rungs are now simply not drawn (see buildAccordionItem and
   buildAccSlider), so this state is close to unreachable. It stays as a
   fallback for any path that still passes it, muted and inert rather than
   defaced. */
.acc-slider__stop--padlocked { cursor: default; }
.acc-slider__stop--padlocked .acc-slider__label {
  color: var(--text-muted);
  opacity: 0.5;
}

@media (prefers-reduced-motion: reduce) {
  .acc-slider__stop, .acc-slider__label { transition: none; }
}

<body>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ---- Firebase init already done in <head> before auth-guard loads --------- */
var auth = firebase.auth();
var db   = firebase.database();

/* ---- Constants ----------------------------------------------------------- */
var NL_GAS_URL = NL.endpoints.gas; /* Consolidated GAS — invite + notifications + drive */

/* Privileged GAS calls (sendInvite / sendApproval / sendRejection) are verified
   server-side: GAS checks the caller's Firebase ID token and role before acting.
   nlGasFetch attaches a fresh idToken to the payload; the URL alone no longer
   grants privilege. Returns the fetch() promise so existing .then/.catch chains
   are unchanged. */
function nlGasFetch(payload) {
  return (NL && NL.ensureAuth ? NL.ensureAuth() : Promise.resolve())
    .then(function() {
      var u = firebase.auth().currentUser;
      return u ? u.getIdToken() : null;
    })
    .then(function(idToken) {
      payload.idToken = idToken || '';
      return fetch(NL_GAS_URL + '?cb=' + Date.now(), {
        method:  'POST',
        headers: { 'Content-Type': 'text/plain' },
        body:    JSON.stringify(payload)
      });
    });
}

var CREST_BASE     = '/assets/crests/';
var FALLBACK_CREST = CREST_BASE + 'National%20League%20rose.png';
var LOGIN_URL      = '/';

/* ---- State --------------------------------------------------------------- */

/* ---- Department display map and sort order ------------------------------- */
/* Tool grouping in the admin role-editor — the two audience buckets (Phase 5;
   replaces the retired staff/ops/media/commercial department split). Keyed by
   the values toolAudience() returns. */
var DEPT_MAP = {
  'staff': { label: 'Staff Tools', order: 1 },
  'club':  { label: 'Club Tools',  order: 2 },
};

function getDeptLabel(code) {
  return (DEPT_MAP[code] && DEPT_MAP[code].label) || code;
}

function sortDepts(depts) {
  return depts.sort(function(a, b) {
    var ao = (DEPT_MAP[a] && DEPT_MAP[a].order) || 99;
    var bo = (DEPT_MAP[b] && DEPT_MAP[b].order) || 99;
    return ao - bo;
  });
}

/* ---- Version ------------------------------------------------------------- */
/* Version is shown via the topbar's clickable version badge (window.NL_CHANGELOG),
   which nl-topbar gates to league roles. The kicker stays the plain 'Portal'
   label so club users see no version detail. */

var STATE = {
  uid:      null,
  user:     null,      /* Firebase Auth user */
  userData: null,      /* RTDB user record */
  role:     '',
  tools:    {},        /* tools catalogue from RTDB */
  toolsList: [],
  isAdmin:      false,
  isSuperAdmin: false,
  wmQuill:  null,
  wmSlide:  0,
  wmSlides: [],
  allUsers: {}
};

/* ---- Helpers ------------------------------------------------------------- */
function esc(s) {
  s = String(s || '');
  s = s.replace(/&/g, '&amp;');
  s = s.replace(/\x3c/g, '&lt;');
  s = s.replace(/>/g, '&gt;');
  s = s.replace(/"/g, '&quot;');
  return s;
}

function capitalise(s) {
  return s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
}

/* ---- Access level helpers ------------------------------------------------ */
function getAccessLevel(uid, toolKey) {
  if (STATE.isSuperAdmin && uid === STATE.uid) return 'admin';
  var ud = (uid === STATE.uid) ? STATE.userData : (STATE.allUsers[uid] || {});
  if (!ud) return 'off';
  if (ud.role === 'superadmin') return 'admin';
  var entry = ud.tools && ud.tools[toolKey];
  if (typeof entry === 'string') return entry;
  if (entry === true) return 'access';
  var tool = STATE.tools[toolKey];
  if (!tool || !tool.defaults) return 'off';
  return tool.defaults[getGroupKey(ud)] || 'off';
}

function getGroupKey(ud) {
  /* The defaults key IS the bare role key — matches auth-guard's
     defaults[role] lookup and the registry (superadmin/admin/staff/
     club-admin/club-staff). Legacy 'club' → 'club-admin', 'club-viewer' → 'club-staff'. */
  var role = (ud && ud.role) || '';
  if (role === 'club') return 'club-admin';
  return role;
}

/* Fill the invite form's static role buttons with their grant line from canon.
   The buttons are markup (they exist before any user data loads) but the
   wording is NL.roles.grant, so this picker and the inline one in each user
   row say the same thing without either holding a copy of the text. */
function fillRoleGrants() {
  document.querySelectorAll('#inviteRolePicker .invite-role-btn').forEach(function(btn) {
    if (btn.querySelector('.invite-role-btn__grant')) return;
    var text = NL.roles.grant(btn.dataset.role);
    if (!text) return;
    var span = document.createElement('span');
    span.className = 'invite-role-btn__grant';
    span.textContent = text;
    btn.appendChild(span);
  });
}

function getDefaultLevel(toolKey, ud) {
  var tool = STATE.tools[toolKey];
  if (!tool || !tool.defaults) return 'off';
  return tool.defaults[getGroupKey(ud)] || 'off';
}

/* ── Six-role model (Phase 3b) ───────────────────────────────────────────
   Identity roles, in picker order. Labels come from NL.roles (nl-utils)
   with a local fallback so the portal still renders if utils is stale. */
var PORTAL_ROLE_KEYS = ['superadmin', 'admin', 'staff', 'club-admin', 'club-staff'];
function roleLabel(r) {
  if (window.NL && NL.roles && NL.roles.LABELS && NL.roles.LABELS[r]) return NL.roles.LABELS[r];
  return ({ superadmin: 'Superadmin', admin: 'League Admin', staff: 'League Staff',
            'club-admin': 'Club Admin', 'club-staff': 'Club Staff',
            'club-viewer': 'Club Staff', club: 'Club Admin' })[r] || capitalise(r || '');
}
function normRole(r) {
  if (window.NL && NL.roles && NL.roles.norm) return NL.roles.norm(r);
  return r === 'club' ? 'club-admin' : (r || 'staff');
}
function isClubRole(r) {
  if (window.NL && NL.isClubUser) return NL.isClubUser(r);
  return r === 'club-admin' || r === 'club-staff' || r === 'club-viewer' || r === 'club';
}
/* "Restricted" roles — club roles. These can't be granted admin on any tool,
   and are fully locked out of staff-audience tools. They CAN be toggled
   Off/Access per tool. (Edit-vs-view for club roles is separate, by role.) */
function isRestrictedRole(r) { return isClubRole(r); }
/* Canonical staff/club split for a tool RECORD — the `audience` field is the
   source of truth. Falls back to the club-admin-default heuristic only for a
   record that somehow lacks the audience field (all live records have it). */
function toolAudience(tool) {
  if (!tool) return 'club';
  /* 'meta' is an audience for ACCESS purposes identical to 'staff' — league
     roles only, never club, never on invite/request cards. Mapping it here
     means every consumer of toolAudience inherits the staff protections
     without knowing meta exists. Only the portal's shelf split reads the raw
     value (see isMetaTool). */
  if (tool.audience === 'meta') return 'staff';
  /* 'league' is the canonical value; 'staff' is the legacy spelling, kept
     accepted so a part-migrated registry can't mis-shelve a tool. Both mean
     league roles only. This function's return value stays 'staff' because
     every caller branches on staff-vs-club, not on the registry wording. */
  if (tool.audience === 'league' || tool.audience === 'staff') return 'staff';
  if (tool.audience === 'club') return 'club';
  return (((tool.defaults && tool.defaults['club-admin']) || 'off') !== 'off') ? 'club' : 'staff';
}
/* Default access level a role gets on a tool, straight from the registry. */
function roleDefaultLevel(toolKey, role) {
  var tool = STATE.tools[toolKey];
  if (!tool || !tool.defaults) return 'off';
  return tool.defaults[normRole(role)] || 'off';
}
/* Names of clubs in the current-season roster (for the club picker + off-roster flag). */
function currentRosterNames() {
  var meta = INV_META;
  var list = (window.NL && NL.season && meta) ? NL.season.clubsFor(meta) : INV_CLUBS_DATA;
  var set = {};
  (list || []).forEach(function(c) { if (c && c.name) set[c.name] = true; });
  return set;
}
function isOffRoster(name) {
  if (!name) return false;
  if (!INV_CLUBS_DATA.length) return false; /* meta not loaded yet — don't false-flag */
  return !currentRosterNames()[name];
}


function showToast(msg, type) {
  /* Delegates to NL.toast (shared widget) — keeps all 41 portal callers working */
  if (window.NL && window.NL.toast) { NL.toast(msg, type); return; }
  /* Fallback for a page that somehow loaded without nl-utils. It used the
     old .toast.success class pattern, which stopped meaning anything the
     moment this file's shadow copy of .toast went — canon's modifier is
     .toast--success. Corrected so the fallback still looks like a toast. */
  var t = document.getElementById('toast');
  if (!t) return;
  t.textContent = msg;
  t.className = 'toast toast--' + (type || 'success') + ' show';
  setTimeout(function() { t.classList.remove('show'); }, 3500);
}

function showMsg(id, text, type) {
  var el = document.getElementById(id);
  if (!el) return;
  /* Announce to assistive tech: errors assertively, info/success politely. */
  el.setAttribute('role', type === 'error' || !type ? 'alert' : 'status');
  el.setAttribute('aria-live', type === 'error' || !type ? 'assertive' : 'polite');
  el.textContent = text;
  el.className = 'msg msg--' + (type || 'error') + ' show';
}

function hideMsg(id) {
  var el = document.getElementById(id);
  if (el) el.className = 'msg';
}

function setBtnLoading(id, loading, label) {
  var btn = document.getElementById(id);
  if (!btn) return;
  btn.disabled = loading;
  if (loading) {
    btn.dataset.label = btn.textContent;
    var sp = document.createElement('span');
    sp.className = 'btn-spinner';
    btn.innerHTML = '';
    btn.appendChild(sp);
  } else {
    btn.textContent = label || btn.dataset.label || btn.textContent;
  }
}

function removeOverlay() {
  var ov = document.getElementById('authOverlay');
  if (ov) ov.parentNode.removeChild(ov);
}

/* ---- Guard banner -------------------------------------------------------- */
function showGuardBanner() {
  var params = new URLSearchParams(window.location.search);
  var guard  = params.get('guard');
  if (!guard) return;

  /* Clean the URL */
  var clean = window.location.pathname;
  window.history.replaceState({}, '', clean);

  var container = document.getElementById('guardBanner');
  var div = document.createElement('div');

  if (guard === 'denied') {
    div.className = 'banner banner--error';
    div.textContent = 'You do not have access to that tool. Contact an administrator to request access.';
  } else if (guard === 'pending') {
    div.className = 'banner banner--amber';
    div.textContent = 'Your account is pending approval. You will receive an email once access has been granted.';
  } else if (guard === 'error') {
    div.className = 'banner banner--error';
    div.textContent = 'There was a problem checking your access. Please try signing out and back in.';
  }

  container.appendChild(div);
}

/* ---- Auth ---------------------------------------------------------------- */
auth.onAuthStateChanged(function(user) {
  if (!user) {
    window.location.replace(LOGIN_URL);
    return;
  }
  STATE.user = user;
  STATE.uid  = user.uid;

  db.ref('users/' + user.uid).once('value')
    .then(function(snap) {
      if (!snap.exists()) {
        window.location.replace(LOGIN_URL);
        return;
      }
      STATE.userData = snap.val();
      STATE.role       = STATE.userData.role || '';
      STATE.isSuperAdmin = STATE.role === 'superadmin';
      STATE.isAdmin      = STATE.role === 'admin' || STATE.isSuperAdmin;

      /* pending flag cleared by login page after account creation */

      /* Write session for tool page auth -- read by auth-guard.js v3.0 */
      if (window.nlSession) {
        window.nlSession.write(user.uid, STATE.userData);
      }

      /* Set NL.session and render topbar (auth-guard exits early on portal,
         so we render the topbar manually once we have user data) */
      var sessionObj = {
        uid:     STATE.uid,
        email:   STATE.user.email,
        name:    STATE.userData.name || '',
        role:    STATE.role,
        /* org/orgKey removed from model */
        org: '', orgKey: '',
        club:    STATE.userData.club || '',
        tools:   STATE.userData.tools || {}
      };
      if (window.NL) window.NL.session = sessionObj;
      if (window.NL && window.NL.renderTopbar) {
        window.NL.renderTopbar(sessionObj);
      }

      loadTools().then(function() {
        initPortal();
        /* Only audit when the user actually pressed Sign In on /.
           The login page sets nl_fresh_signin in sessionStorage just before
           calling signInWithEmailAndPassword; we consume + clear it here so
           subsequent portal loads (navigation, refresh) don't re-log. */
        var freshSignin = false;
        try {
          freshSignin = sessionStorage.getItem('nl_fresh_signin') === '1';
          if (freshSignin) sessionStorage.removeItem('nl_fresh_signin');
        } catch (e) {}
        if (freshSignin) {
          writeAudit('signed_in', 'Portal loaded');
        }
      });
    })
    .catch(function() {
      window.location.replace(LOGIN_URL);
    });
});

/* ---- Load tools catalogue ------------------------------------------------ */
function loadTools() {
  return db.ref('tools').once('value').then(function(snap) {
    if (snap.exists()) {
      STATE.tools = snap.val();
      STATE.toolsList = Object.keys(STATE.tools).map(function(k) {
        var t = STATE.tools[k];
        t._key = k;
        return t;
      });
    }
  }).catch(function() {});
}

/* ---- Init portal --------------------------------------------------------- */
function initPortal() {
  removeOverlay();
  document.getElementById('pageWrap').style.display = 'block';

  showGuardBanner();

/* ---- Welcome carousel ---------------------------------------------------- */
function loadWelcomeMessages() {
  db.ref('admin/welcome-messages').once('value').then(function(snap) {
    var val = snap.val();
    var wmBody = document.getElementById('noticeboardBody');
    var oldEmpties = wmBody.querySelectorAll('.noticeboard-empty');
    for (var ei = 0; ei < oldEmpties.length; ei++) oldEmpties[ei].parentNode.removeChild(oldEmpties[ei]);
    document.getElementById('noticeboardSlides').innerHTML = '';
    document.getElementById('wNavDots').innerHTML = '';
    document.getElementById('noticeboardNav').style.display = 'none';
    var wmCountEl = document.getElementById('noticeboardCount');
    if (wmCountEl) wmCountEl.textContent = '';
    /* Firebase returns "" for an empty node created in console */
    if (!val || typeof val !== 'object') {
      renderWelcomeEmpty();
      return;
    }
    var msgs = Object.keys(val).map(function(k) {
      var m = val[k]; m._key = k; return m;
    }).sort(function(a, b) {
      return (b.createdAt || 0) - (a.createdAt || 0);
    });
    STATE.wmSlides = msgs;
    STATE.wmSlide  = 0;
    renderWelcomeSlides();
  }).catch(function() { renderWelcomeEmpty(); });
}

function renderWelcomeEmpty() {
  var body = document.getElementById('noticeboardBody');
  if (body.querySelector('.noticeboard-empty')) return;
  var div  = document.createElement('div');
  div.className = 'noticeboard-empty';
  div.textContent = 'No announcements at the moment.';
  body.appendChild(div);
}

function renderWelcomeSlides() {
  var msgs    = STATE.wmSlides;
  var slides  = document.getElementById('noticeboardSlides');
  var nav     = document.getElementById('noticeboardNav');
  var dots    = document.getElementById('wNavDots');
  var count   = document.getElementById('noticeboardCount');

  slides.innerHTML = '';
  dots.innerHTML   = '';

  if (msgs.length === 0) { renderWelcomeEmpty(); return; }

  count.textContent = msgs.length + (msgs.length === 1 ? ' message' : ' messages');

  msgs.forEach(function(m, i) {
    var slide = document.createElement('div');
    slide.className = 'noticeboard-slide' + (i === 0 ? ' active' : '');
    slide.dataset.idx = i;

    /* Title + admin actions row */
    var titleRow = document.createElement('div');
    titleRow.style.cssText = 'display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:4px;';

    var title = document.createElement('div');
    title.className = 'noticeboard-slide__title';
    title.style.flex = '1';
    title.textContent = m.title || '';
    titleRow.appendChild(title);

    /* Admin Edit/Delete buttons inline */
    if (STATE.isAdmin) {
      var adminActions = document.createElement('div');
      adminActions.style.cssText = 'display:flex;gap:6px;flex-shrink:0;';
      var editBtn = document.createElement('button');
      editBtn.className = 'btn btn--ghost btn--sm';
      editBtn.textContent = 'Edit';
      editBtn.addEventListener('click', function(e) { e.stopPropagation(); loadWmIntoEditor(m._key, m); document.getElementById('wmInlineEditor').style.display = 'block'; });
      var delBtn = document.createElement('button');
      delBtn.className = 'btn btn--danger btn--sm';
      delBtn.textContent = 'Delete';
      delBtn.addEventListener('click', function(e) { e.stopPropagation(); deleteWmMessage(m._key, delBtn); });
      adminActions.appendChild(editBtn);
      adminActions.appendChild(delBtn);
      titleRow.appendChild(adminActions);
    }

    /* Date line -- shown to everyone */
    var dateLine = document.createElement('div');
    dateLine.style.cssText = 'font-size:var(--text-xs);color:var(--text-muted);margin-bottom:10px;';
    dateLine.textContent = 'By ' + (m.author || 'The National League') +
      (m.createdAt ? '  —  ' + NL.formatDate(m.createdAt) : '');   // canon '17 April 2026'

    var msgContent = document.createElement('div');
    msgContent.className = 'noticeboard-slide__content';
    /* content is stored as HTML from Quill — safe to set as innerHTML
       since only admins can write it */
    msgContent.innerHTML = m.content || '';

    slide.appendChild(titleRow);
    slide.appendChild(dateLine);
    slide.appendChild(msgContent);
    slides.appendChild(slide);

    var dot = document.createElement('button');
    dot.className = 'noticeboard-nav__dot' + (i === 0 ? ' active' : '');
    dot.dataset.idx = i;
    dot.setAttribute('aria-label', 'Go to message ' + (i + 1));
    if (i === 0) dot.setAttribute('aria-current', 'true');
    dot.addEventListener('click', function() { goWelcomeSlide(parseInt(dot.dataset.idx)); });
    dots.appendChild(dot);
  });

  if (msgs.length > 1) nav.style.display = 'flex';

  document.getElementById('wNavPrev').addEventListener('click', function() {
    goWelcomeSlide(STATE.wmSlide - 1);
  });
  document.getElementById('wNavNext').addEventListener('click', function() {
    goWelcomeSlide(STATE.wmSlide + 1);
  });

  updateWelcomeNav();

  /* Always open */
}


function goWelcomeSlide(idx) {
  var msgs = STATE.wmSlides;
  idx = Math.max(0, Math.min(msgs.length - 1, idx));
  STATE.wmSlide = idx;

  document.querySelectorAll('.noticeboard-slide').forEach(function(s, i) {
    s.classList.toggle('active', i === idx);
  });
  document.querySelectorAll('.noticeboard-nav__dot').forEach(function(d, i) {
    d.classList.toggle('active', i === idx);
    if (i === idx) { d.setAttribute('aria-current', 'true'); }
    else { d.removeAttribute('aria-current'); }
  });
  updateWelcomeNav();
}

function updateWelcomeNav() {
  var prev = document.getElementById('wNavPrev');
  var next = document.getElementById('wNavNext');
  if (prev) prev.disabled = STATE.wmSlide === 0;
  if (next) next.disabled = STATE.wmSlide === STATE.wmSlides.length - 1;
}

/* ---- Tool tile grid ------------------------------------------------------ */
/* ── Favourites — persisted per user in RTDB at /users/{uid}/favourites ── */
function getFavourites() {
  var ud = STATE.userData;
  return ud && ud.favourites ? ud.favourites : {};
}

function toggleFavourite(toolKey) {
  var favs = getFavourites();
  var isStarred = !!favs[toolKey];
  var ref = firebase.database().ref('users/' + STATE.uid + '/favourites/' + toolKey);
  if (isStarred) {
    ref.remove();
    if (STATE.userData.favourites) delete STATE.userData.favourites[toolKey];
  } else {
    ref.set(true);
    if (!STATE.userData.favourites) STATE.userData.favourites = {};
    STATE.userData.favourites[toolKey] = true;
  }
  renderToolGrid();
}

function renderToolGrid() {
  var ud      = STATE.userData;
  var tools   = STATE.toolsList;
  var isClub  = ud && isClubRole(ud.role);
  var favs    = getFavourites();

  /* Collect visible tools, sorted: starred first then alphabetical */
  var myTools = [];
  tools.forEach(function(t) {
    if (t._key === 'welcome') return;
    var level = getAccessLevel(STATE.uid, t._key);
    if (level !== 'access' && level !== 'admin') return;  /* off = no access */
    myTools.push({ key: t._key, tool: t, level: level });
  });

  /* Sort: starred first, then alphabetical by label */
  myTools.sort(function(a, b) {
    var aStarred = !!favs[a.key];
    var bStarred = !!favs[b.key];
    if (aStarred !== bStarred) return aStarred ? -1 : 1;
    return (a.tool.label || a.key).localeCompare(b.tool.label || b.key);
  });

  /* Split by type: a "club tool" is one club roles can reach (club-admin
     default is not 'off'); everything else is a staff tool. */
  function isClubTool(t) { return toolAudience(t.tool) === 'club'; }
  function isMetaTool(t) { return t.tool.audience === 'meta'; }
  var metaTools  = myTools.filter(isMetaTool);
  var staffTools = myTools.filter(function(t) { return !isClubTool(t) && !isMetaTool(t); });
  var clubTools  = myTools.filter(function(t) { return  isClubTool(t) && !isMetaTool(t); });

  function populateGrid(gridId, items) {
    var grid = document.getElementById(gridId);
    if (!grid) return;
    grid.innerHTML = '';
    if (items.length === 0) {
      var empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.style.gridColumn = '1 / -1';
      var icon = document.createElement('div');
      icon.className = 'empty-state__icon';
      icon.textContent = '🔒';
      var text = document.createElement('div');
      text.className = 'empty-state__text';
      text.textContent = 'No tools available.';
      empty.appendChild(icon); empty.appendChild(text);
      grid.appendChild(empty);
      return;
    }
    items.forEach(function(item) {
      grid.appendChild(buildToolTile(item.key, item.tool, item.level));
    });
  }

  if (isClub) {
    /* Club users — flat list of club-facing tools only */
    document.getElementById('staffToolsSection').style.display = 'none';
    document.getElementById('clubToolsSection').style.display = 'none';
    document.getElementById('metaToolsSection').style.display = 'none';
    document.getElementById('clubFlatSection').style.display = '';
    populateGrid('clubFlatGrid', clubTools);
  } else {
    /* Staff users — two sections */
    document.getElementById('clubFlatSection').style.display = 'none';
    document.getElementById('staffToolsSection').style.display = staffTools.length ? '' : 'none';
    document.getElementById('clubToolsSection').style.display = clubTools.length ? '' : 'none';
    /* Meta shelf: hidden entirely unless this user can see something on it. */
    document.getElementById('metaToolsSection').style.display = metaTools.length ? '' : 'none';
    populateGrid('staffToolGrid', staffTools);
    populateGrid('clubToolGrid', clubTools);
    populateGrid('metaToolGrid', metaTools);
  }
}

function buildToolTile(key, t, level) {
  level = level || 'access';
  /* Clamp through the tool's own ladder before colouring the tile. A record can
     still carry a default of 'admin' on a tool that has no admin tier — harmless
     for access (auth-guard only cares that it isn't 'off'), but the tile would
     otherwise wear the red "you administer this" border for something nobody can
     administer. Clamping here keeps the card honest without rewriting data. */
  var tileLevels = toolLevels(t);
  if (tileLevels.indexOf(level) === -1) {
    level = (ACC_LEVELS.indexOf(level) > 0) ? tileLevels[tileLevels.length - 1] : 'off';
  }
  var tile = document.createElement('a');
  var levelClass = level === 'admin' ? ' tool-tile--admin'
                 : level === 'access' ? ' tool-tile--access'
                 : ' tool-tile--off';
  tile.className = 'tool-tile' + (t.placeholder ? ' tool-tile--placeholder' : '') + levelClass;

  if (t.placeholder || !t.url || t.url === '#') {
    tile.href = '#';
    tile.addEventListener('click', function(e) {
      e.preventDefault();
      if (t.placeholder) showToast(t.label + ' is coming soon', 'success');
    });
  } else {
    tile.href = t.url;
  }

  var icon = document.createElement('div');
  icon.className = 'tool-tile__icon';
  icon.textContent = t.icon || '🔧';

  var name = document.createElement('div');
  name.className = 'tool-tile__name';
  name.textContent = t.label || key;

  var desc = document.createElement('div');
  desc.className = 'tool-tile__desc';
  desc.textContent = t.description || '';

  tile.appendChild(icon);
  tile.appendChild(name);
  tile.appendChild(desc);

  if (t.placeholder) {
    var soon = document.createElement('span');
    soon.className = 'tool-tile__soon';
    soon.textContent = 'Coming soon';
    tile.appendChild(soon);
  }

  /* Star / favourite toggle */
  var starBtn = document.createElement('button');
  starBtn.className = 'tool-tile__star';
  starBtn.title = 'Toggle favourite';
  starBtn.setAttribute('aria-label', 'Toggle favourite');
  var favs = getFavourites();
  starBtn.textContent = favs[key] ? '★' : '☆';
  if (favs[key]) tile.classList.add('tool-tile--starred');
  starBtn.addEventListener('click', function(e) {
    e.preventDefault();
    e.stopPropagation();
    toggleFavourite(key);
  });
  tile.appendChild(starBtn);

  return tile;
}
