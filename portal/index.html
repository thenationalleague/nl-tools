/* ---- Pending Invites tab ------------------------------------------------- */
/*
 * Shows users with pending:true who came via admin invite (not requests flow).
 * A user is a pending invite if: pending===true AND no matching requests/ entry
 * with their uid. Simpler heuristic: pending===true AND role !== pending request
 * pattern. Since all pending users are pending:true, we distinguish by checking
 * if there is a requests/ entry with status=pending for that uid.
 * For simplicity: show ALL pending:true users here (both invite and request paths)
 * UNLESS they have a matching pending request record. That way request-flow users
 * appear in Requests tab AND Pending Invites tab is invite-only.
 *
 * Actually cleanest: mark invite-flow pending users with source:'invite' in RTDB.
 * But we haven't done that yet. For now: pending invite = pending:true user who
 * does NOT appear in requests/ as a pending entry.
 */
function loadPendingInvites() {
  var container = document.getElementById('pendingInvitesList');
  if (!container) return;

  /* Ensure auth is ready before attempting read */
  if (!auth.currentUser) {
    container.innerHTML = '<div style="font-size:var(--text-sm);color:var(--text-muted);padding:8px 0;">Not authenticated.</div>';
    return;
  }

  container.innerHTML = '<div style="font-size:var(--text-sm);color:var(--text-muted);padding:8px 0;">Loading…</div>';

  db.ref('admin/invites-pending').once('value').then(function(snap) {
    var allItems = [];
    if (snap.exists()) {
      snap.forEach(function(child) {
        var inv = child.val();
        inv._key = child.key;
        allItems.push(inv);
      });
    }

    /* v5.54: Filter out invites where user already accepted */
    var activeEmails = {};
    Object.keys(STATE.allUsers).forEach(function(uid) {
      var u = STATE.allUsers[uid];
      if (u.email && !u.pending) activeEmails[u.email.toLowerCase()] = uid;
    });
    var items = [];
    var staleKeys = [];
    allItems.forEach(function(inv) {
      var email = (inv.email || '').toLowerCase();
      if (email && activeEmails[email]) {
        staleKeys.push(inv._key);
      } else {
        items.push(inv);
      }
    });
    if (staleKeys.length) {
      var cleanUpdates = {};
      staleKeys.forEach(function(k) { cleanUpdates['admin/invites-pending/' + k] = null; });
      db.ref().update(cleanUpdates).catch(function(e) {
        console.warn('stale invite cleanup failed:', e && e.code, e && e.message);
      });
    }

    /* Sort newest first */
    items.sort(function(a, b) { return (b.sentAt || 0) - (a.sentAt || 0); });

    /* Update tab badge */
    var badge = document.getElementById('pendingInviteCount');
    if (badge) {
      badge.textContent = items.length ? '(' + items.length + ')' : '';
      badge.style.cssText = items.length
        ? 'background:var(--primary);color:var(--white);border-radius:8px;padding:1px 6px;font-size:var(--text-xs);margin-left:4px;'
        : '';
    }

    container.innerHTML = '';

    if (!items.length) {
      var empty = document.createElement('div');
      empty.style.cssText = 'font-size:var(--text-sm);color:var(--text-muted);padding:8px 0;';
      empty.textContent = 'No pending invites.';
      container.appendChild(empty);
      return;
    }

    var hdr = document.createElement('div');
    hdr.style.cssText = 'font-size:var(--text-xs);font-weight:800;text-transform:uppercase;letter-spacing:0.1em;color:var(--text-muted);margin-bottom:12px;';
    hdr.textContent = items.length + ' pending invite' + (items.length === 1 ? '' : 's');
    container.appendChild(hdr);

    items.forEach(function(inv) {
      try {
        container.appendChild(buildPendingInviteCard(inv));
      } catch(cardErr) {
        console.error('buildPendingInviteCard failed for', inv, cardErr);
        var errRow = document.createElement('div');
        errRow.style.cssText = 'font-size:var(--text-xs);color:var(--red);padding:4px 0;';
        errRow.textContent = 'Error rendering card for ' + (inv.email || inv.name || inv._key) + ': ' + cardErr.message;
        container.appendChild(errRow);
      }
    });
  }).catch(function(err) {
    console.error('loadPendingInvites failed:', err);
    container.innerHTML = '<div style="font-size:var(--text-sm);color:var(--text-muted);padding:8px 0;">Could not load pending invites: ' + (err && err.message ? err.message : String(err)) + '</div>';
  });
}

function buildPendingInviteCard(inv) {
  var card = document.createElement('div');
  card.className = 'request-card';

  /* Header */
  var header = document.createElement('div');
  header.className = 'request-card__header';
  var info = document.createElement('div');
  info.className = 'request-card__info';

  var nameEl = document.createElement('div');
  nameEl.className = 'request-card__name';
  nameEl.textContent = inv.name || '(no name)';

  var meta = document.createElement('div');
  meta.className = 'request-card__meta';
  var metaParts = [inv.email || ''];
  if (isClubRole(inv.role) && inv.club) metaParts.push(inv.club + (inv.jobTitle ? ' · ' + inv.jobTitle : ''));
  else if (inv.org) metaParts.push(inv.org + (inv.role ? ' — ' + roleLabel(inv.role) : '') + ((inv.jobTitle) ? '  ·  ' + inv.jobTitle : ''));
  /* year:false keeps this one's "Sent 17 Aug, 19:46" shape — a pending invite
     is days old, not years, so the year was deliberately omitted here. */
  if (inv.sentAt) {
    metaParts.push('Sent ' + NL.formatDateTime(inv.sentAt, { year: false }) +
      (inv.sentBy ? ' by ' + inv.sentBy : ''));
  }
  meta.textContent = metaParts.join('  —  ');

  info.appendChild(nameEl);
  info.appendChild(meta);
  header.appendChild(info);

  var pill = document.createElement('span');
  pill.className = 'user-role-pill role-pending';
  pill.textContent = 'Awaiting acceptance';
  header.appendChild(pill);

  card.appendChild(header);

  /* Actions */
  var actions = document.createElement('div');
  actions.className = 'request-card__actions';
  actions.style.cssText = 'padding:12px 20px;border-top:1px solid var(--border);';

  /* Resend -- generates new token via GAS, updates sentAt */
  var resendBtn = document.createElement('button');
  resendBtn.className = 'btn btn--ghost btn--sm';
  resendBtn.textContent = 'Resend invite';
  resendBtn.addEventListener('click', function() {
    resendBtn.disabled = true;
    resendBtn.textContent = 'Sending…';
    nlGasFetch({
      action:   'sendInvite',
      email:    inv.email    || '',
      name:     inv.name     || '',
      role:     inv.role     || 'staff',
      /* org/orgKey removed */ org: '', orgKey: '',
      club:     inv.club     || '',
      jobTitle: inv.jobTitle || '',
      tools:    inv.tools    || {}
    })
    .then(function(r) { return r.json(); })
    .then(function(result) {
      if (result && result.ok === false) {
        showToast('Resend failed: ' + (result.error || 'unknown'), 'error');
        resendBtn.disabled = false;
        resendBtn.textContent = 'Resend invite';
      } else {
        /* Update sentAt on the pending record */
        db.ref('admin/invites-pending/' + inv._key + '/sentAt').set(Date.now()).catch(function() {});
        showToast('Invite resent to ' + inv.email, 'success');
        writeAudit('invite_sent', 'Resent invite to ' + (inv.name || inv.email || ''));
        resendBtn.textContent = 'Sent ✓';
        setTimeout(function() { loadPendingInvites(); }, 1000);
      }
    })
    .catch(function() {
      showToast('Failed to resend', 'error');
      resendBtn.disabled = false;
      resendBtn.textContent = 'Resend invite';
    });
  });

  /* Revoke -- deletes invites-pending entry + invalidates RTDB invite tokens */
  var revokeBtn = document.createElement('button');
  revokeBtn.className = 'btn btn--ghost btn--sm';
  revokeBtn.style.cssText = 'color:var(--red);border-color:color-mix(in srgb, var(--red) 30%, white);';
  revokeBtn.textContent = 'Revoke';
  revokeBtn.addEventListener('click', function() {
    if (revokeBtn.dataset.confirmed !== '1') {
      revokeBtn.dataset.confirmed = '1';
      revokeBtn.textContent = 'Confirm revoke?';
      revokeBtn.style.cssText = 'background:var(--red);color:var(--white);border-color:var(--red);';
      setTimeout(function() {
        if (revokeBtn.dataset.confirmed === '1') {
          revokeBtn.dataset.confirmed = '0';
          revokeBtn.textContent = 'Revoke';
          revokeBtn.style.cssText = 'color:var(--red);border-color:color-mix(in srgb, var(--red) 30%, white);';
        }
      }, 3000);
      return;
    }
    revokeBtn.disabled = true;
    revokeBtn.textContent = 'Revoking…';

    /* Delete the invites-pending record -- tokens expire naturally after 24hrs */
    db.ref('admin/invites-pending/' + inv._key).remove()
      .then(function() {
        writeAudit('invite_cancelled', (inv.name || inv.email || '') + ' invite revoked');
        showToast('Invite revoked for ' + (inv.name || inv.email || ''), 'success');
        loadPendingInvites();
      })
      .catch(function(err) {
        revokeBtn.disabled = false;
        revokeBtn.textContent = 'Revoke';
        revokeBtn.dataset.confirmed = '0';
        showToast('Failed to revoke: ' + err.message, 'error');
      });
  });

  actions.appendChild(resendBtn);
  actions.appendChild(revokeBtn);
  card.appendChild(actions);
  return card;
}

function loadUsers() {
  db.ref('users').once('value').then(function(snap) {
    STATE.allUsers = snap.val() || {};
    renderClubFilterPills();
    renderUsers(STATE.allUsers);
  });

  document.getElementById('reloadUsersBtn').addEventListener('click', function() { loadUsers(); });

  document.getElementById('userSearch').addEventListener('input', function() {
    applyUserFilters();
  });
}

function applyUserFilters() {
  var q    = document.getElementById('userSearch').value.toLowerCase().trim();
  var club = _activeClubFilter;
  var filtered = {};
  Object.keys(STATE.allUsers).forEach(function(uid) {
    var u = STATE.allUsers[uid];
    var matchesText = !q ||
      (u.name  || '').toLowerCase().indexOf(q) !== -1 ||
      (u.email || '').toLowerCase().indexOf(q) !== -1;
    var matchesFilter = true;
    if (club) {
      if (club === '__staff__') {
        matchesFilter = !isClubRole(u.role);
      } else if (club.startsWith('__club__')) {
        var clubVal = club.replace('__club__', '');
        matchesFilter = (u.club || '') === clubVal;
      } else {
        matchesFilter = (u.club || '') === club;
      }
    }
    if (matchesText && matchesFilter) filtered[uid] = u;
  });
  renderUsers(filtered);
}

function renderClubFilterPills() {
  var wrap   = document.getElementById('clubFilterWrap');
  var select = document.getElementById('clubFilterSelect');
  if (!wrap || !select) return;

  /* org field removed — group by role (staff vs club) */
  var hasStaff = false;
  var clubs    = {};
  Object.keys(STATE.allUsers).forEach(function(uid) {
    var u = STATE.allUsers[uid];
    if (isClubRole(u.role) && u.club) {
      clubs[u.club] = true;
    } else if (u.role) {
      hasStaff = true;
    }
  });

  var clubList = Object.keys(clubs).sort();

  if (!hasStaff && clubList.length === 0) {
    wrap.style.display = 'none';
    return;
  }

  wrap.style.display = 'block';

  /* Rebuild options */
  select.innerHTML = '<option value="">All users<\/option>';

  if (hasStaff) {
    var staffGroup = document.createElement('optgroup');
    staffGroup.label = 'Staff';
    var staffOpt = document.createElement('option');
    staffOpt.value = '__staff__';
    staffOpt.textContent = 'NL Staff';
    staffGroup.appendChild(staffOpt);
    select.appendChild(staffGroup);
  }

  if (clubList.length) {
    var clubGroup = document.createElement('optgroup');
    clubGroup.label = 'Clubs';
    clubList.forEach(function(club) {
      var opt = document.createElement('option');
      opt.value = '__club__' + club;
      opt.textContent = club;
      clubGroup.appendChild(opt);
    });
    select.appendChild(clubGroup);
  }

  /* Reset to All users on each rebuild */
  select.value = '';
  _activeClubFilter = null;

  select.onchange = function() {
    var val = select.value;
    if (!val) {
      _activeClubFilter = null;
    } else {
      _activeClubFilter = val; /* __staff__, __club__X handled in applyUserFilters */
    }
    applyUserFilters();
  };
}

function renderUsers(users) {
  renderUsersAccordion(users);
}

/* ---- Accordion ----------------------------------------------------------- */
var _openAccUid = null;
var _editUid    = null; /* uid of user currently in edit access mode */

function renderUsersAccordion(users) {
  var container = document.getElementById('usersAccordion');
  container.innerHTML = '';
  _openAccUid = null;

  var uids = Object.keys(users || {});
  if (uids.length === 0) {
    var empty = document.createElement('div');
    empty.className = 'empty-state';
    var icon = document.createElement('div');
    icon.className = 'empty-state__icon';
    icon.textContent = '\uD83D\uDC65';
    var text = document.createElement('div');
    text.className = 'empty-state__text';
    text.textContent = 'No users found.';
    empty.appendChild(icon);
    empty.appendChild(text);
    container.appendChild(empty);
    return;
  }

  /* Build dept/tool structure -- all tools including placeholders, except welcome */
  var tools   = STATE.toolsList.filter(function(t) { return t._key !== 'welcome'; });
  var deptMap = {};
  tools.forEach(function(t) {
    var d = toolAudience(t);
    if (!deptMap[d]) deptMap[d] = [];
    deptMap[d].push(t);
  });
  var depts = sortDepts(Object.keys(deptMap));

  uids.forEach(function(uid) {
    var u = users[uid];
    /* Pending invited users shown in Pending Invites tab, not here */
    if (u.pending && !u.rejected) return;
    container.appendChild(buildAccordionItem(uid, u, depts, deptMap));
  });
}

function buildAccordionItem(uid, u, depts, deptMap) {
  var item = document.createElement('div');
  item.className = 'uacc-item';
  item.dataset.uid = uid;

  /* Header — expose as a real button to AT (it's a div for layout reasons). */
  var header = document.createElement('div');
  header.className = 'uacc-header';
  header.setAttribute('role', 'button');
  header.tabIndex = 0;
  header.setAttribute('aria-expanded', 'false');

  /* Org crest -- club users get their club crest, everyone else gets NL rose */
  var isClubUser = isClubRole(u.role);
  var crestImg = document.createElement('img');
  crestImg.className = 'uacc-crest';
  if (isClubUser && u.club) {
    NL.clubs.wireCrestImg(crestImg, u.club);       /* thumb → full → rose */
    crestImg.src = NL.clubs.crestUrl(u.club, 'thumb');
    crestImg.alt = u.club;
  } else {
    crestImg.src = FALLBACK_CREST;
    crestImg.alt = 'National League';
  }
  header.appendChild(crestImg);

  /* Name + email */
  var nameWrap = document.createElement('div');
  nameWrap.className = 'uacc-name';
  var primary = document.createElement('div');
  primary.className = 'uacc-name__primary';
  primary.textContent = u.name || '(no name)';
  var secondary = document.createElement('div');
  secondary.className = 'uacc-name__secondary';
  secondary.textContent = u.email || '';
  nameWrap.appendChild(primary);
  nameWrap.appendChild(secondary);
  header.appendChild(nameWrap);

  /* Stacked pill block: role pill on top, org/club context below */
  var pillStack = document.createElement('div');
  pillStack.className = 'uacc-pill-stack';

  /* Row wrapper for pill + change role button */
  var pillRow = document.createElement('div');
  pillRow.style.cssText = 'display:flex;align-items:center;gap:6px;justify-content:flex-end;';
  var rolePill = document.createElement('span');
  rolePill.className = 'user-role-pill role-' + (u.pending ? 'pending' : normRole(u.role || 'staff'));
  rolePill.textContent = u.pending ? 'Pending' : roleLabel(u.role || 'staff');
  pillRow.appendChild(rolePill);
  pillStack.appendChild(pillRow);

  /* Context line below pill */
  var context = document.createElement('div');
  context.className = 'uacc-pill-stack__context';

  if (isClubUser && u.club) {
    var clubCrest = document.createElement('img');
    clubCrest.className = 'uacc-pill-stack__crest';
    NL.clubs.wireCrestImg(clubCrest, u.club);       /* thumb → full → rose */
    clubCrest.src = NL.clubs.crestUrl(u.club, 'thumb');
    clubCrest.alt = u.club;
    context.appendChild(clubCrest);
    var clubText = document.createElement('span');
    clubText.textContent = u.club + (u.jobTitle ? '  ·  ' + u.jobTitle : '');
    context.appendChild(clubText);
  } else if (!u.pending) {
    var orgText = document.createElement('span');
    var orgLabel = isClubRole(u.role) ? (u.club || 'Club') : 'National League';
    orgText.textContent = orgLabel + (u.jobTitle ? '  ·  ' + u.jobTitle : '');
    context.appendChild(orgText);
  }



  pillStack.appendChild(context);
  header.appendChild(pillStack);

  var chevron = document.createElement('span');
  chevron.className = 'uacc-chevron';
  chevron.textContent = '\u25BC';
  header.appendChild(chevron);

  /* Determine superuser status once at item level -- used in dept loop */
  var isSuperUser = u.role === 'superadmin' || (uid === STATE.uid && STATE.isSuperAdmin);

  /* Body */
  var body = document.createElement('div');
  body.className = 'uacc-body';

  /* Access is decided by ROLE (settled 17/08/2026 — see
     system/roles-and-access-plan.md). So this shows the role's grant as one
     sentence, then the EXCEPTIONS: tools where this account's stored entry
     disagrees with what its role gives it. Everything else sits behind a
     disclosure.

     The old build laid out all sixteen tools as editable controls for every
     user, every time. For a typical account all sixteen simply restated the
     role, so the one row that genuinely deviated looked exactly like the
     fifteen that did not — an exception is only visible if the rule is not
     drawn beside it sixteen times. For a club account it was worse: club
     access follows the role with no per-tool exceptions, so every one of
     those controls was inert.

     The data model already worked this way — saveAccess() has always written
     overrides only, nulling any level equal to the role default. This brings
     the panel into line with the records it writes.

     Rows keep the .uacc-tool-row / .acc-slider markup exactly as before and
     all still live inside `body`, so enterEditMode / saveAccess / cancelAccess
     go on finding them with the same selectors — this changes where a row is
     shown, not what it is. */

  var roleNow      = normRole(u.role || 'staff');
  var exceptions   = [];   /* rows whose stored entry differs from the role */
  var conforming   = [];   /* rows that just restate the role */
  var closedCount  = 0;    /* tools this account's realm can never reach */

  depts.forEach(function(dept) {
    var deptTools = deptMap[dept];
    if (!deptTools || !deptTools.length) return;

    /* League-audience tools are structurally closed to club roles — the
       audience gate denies them in auth-guard before any level is read. */
    var staffLocked = dept === 'staff' && u.role !== 'superadmin' &&
                      isRestrictedRole(u.role);

    /* So they are not drawn. Eight rows of struck-out Off / Use, one per
       league tool, on every club account, saying nothing that changes what
       anyone does — the count in the summary says it once instead. */
    if (staffLocked) { closedCount += deptTools.length; return; }

    deptTools.forEach(function(t) {
      var currentLevel = getAccessLevel(uid, t._key);
      var defaultLevel = getDefaultLevel(t._key, u);
      var isClubLocked = isRestrictedRole(u.role); /* club roles can never Manage */

      /* If a restricted user is somehow set to admin, cap display at access */
      if (isClubLocked && currentLevel === 'admin') currentLevel = 'access';

      var row = document.createElement('div');
      row.className = 'uacc-tool-row';
      row.dataset.dept = dept;

      var toolName = document.createElement('div');
      toolName.className = 'uacc-tool-name';
      var iconSpan = document.createElement('span');
      iconSpan.className = 'uacc-tool-name__icon';
      iconSpan.textContent = t.icon || '';
      toolName.appendChild(iconSpan);
      toolName.appendChild(document.createTextNode(t.label || t._key));

      /* Nothing here is struck out any more, because nothing unreachable is
         drawn: a tool this account's realm cannot open is skipped above, and a
         rung its role cannot hold is dropped from the ladder in
         buildAccSlider. What remains is a real control, shown read-only until
         Edit access is pressed — .acc-slider--locked, where the value stays
         legible and only the affordance retreats. Superadmins never reach
         here at all (see below). */
      var sliderEl = buildAccSlider(uid, t._key, currentLevel, defaultLevel,
                                    false, isClubLocked, dept);
      sliderEl.classList.add('acc-slider--locked');

      row.appendChild(toolName);

      /* Deviates from what the role grants. On a league account that is a
         deliberate exception; on a club account it is stranded data from
         before club rows became read-only, and wants clearing. */
      var deviates = currentLevel !== defaultLevel;
      if (deviates) {
        var note = document.createElement('span');
        note.className = 'uacc-override';
        note.textContent = isClubLocked ? 'Stranded' : 'Exception';
        note.title = (isClubLocked
          ? 'A per-tool entry left over from before club access followed the role. '
          : 'A deliberate per-tool entry for this person. ')
          + 'Their role grants ' + (ACC_LABELS[defaultLevel] || defaultLevel) + '.';
        toolName.appendChild(note);
      }

      row.appendChild(sliderEl);
      (deviates ? exceptions : conforming).push(row);
    });
  });

  /* One sentence: what the role gives them. */
  var summary = document.createElement('div');
  summary.className = 'uacc-summary';
  var summaryText = document.createElement('span');
  if (isSuperUser) {
    summaryText.textContent = 'Superadmin — every tool, always. Nothing here to set.';
  } else {
    summaryText.textContent = 'Access follows their role: ' + roleLabel(roleNow) + '.'
      + (closedCount ? ' ' + closedCount + ' league tools are not open to club accounts.' : '');
  }
  summary.appendChild(summaryText);
  body.appendChild(summary);

  /* A superadmin gets the sentence and nothing else. Every rung of every tool
     is structurally unavailable to them — the role is granted before the
     level is ever asked — so the list rendered as sixteen rows of
     struck-through Off / Use / Manage: unreadable, unusable, and saying
     sixteen times what the line above says once. */

  /* The exceptions. Visible because they are rare. */
  if (!isSuperUser && exceptions.length) {
    var exHead = document.createElement('div');
    exHead.className = 'uacc-ex-head';
    exHead.textContent = exceptions.length === 1
      ? '1 tool set apart from their role'
      : exceptions.length + ' tools set apart from their role';
    body.appendChild(exHead);

    var exWrap = document.createElement('div');
    exWrap.className = 'uacc-dept-wrap uacc-dept-wrap--ex';
    exceptions.forEach(function(r) { exWrap.appendChild(r); });
    body.appendChild(exWrap);
  }

  /* Everything else, folded away. Canon .disclosure (nl-brand v2.41) rather
     than a hand-rolled toggle. */
  if (!isSuperUser && conforming.length) {
    var all = document.createElement('details');
    all.className = 'disclosure uacc-all';
    var allSummary = document.createElement('summary');
    allSummary.textContent = exceptions.length
      ? 'The other ' + conforming.length + ' tools'
      : 'All ' + conforming.length + ' tools';
    all.appendChild(allSummary);

    var allWrap = document.createElement('div');
    allWrap.className = 'uacc-dept-wrap';
    conforming.forEach(function(r) { allWrap.appendChild(r); });
    all.appendChild(allWrap);
    body.appendChild(all);
  }

  /* Edit access bar -- shown when in edit mode */
  var editBar = document.createElement('div');
  editBar.className = 'uacc-edit-bar';
  var editBarLabel = document.createElement('span');
  editBarLabel.className = 'uacc-edit-bar__label';
  editBarLabel.textContent = 'Editing access — unsaved changes';
  editBar.appendChild(editBarLabel);
  body.insertBefore(editBar, body.firstChild);

  /* Helper: get current role-aware constraints for this user (6-role model).
     Restricted roles (club-admin/club-staff) can't be granted
     admin (capAccess) and are fully locked out of staff-dept tools, but their
     non-staff tools stay toggleable Off/Access. League roles edit freely. */
  function getRoleConstraints(roleOverride) {
    var r = normRole(roleOverride || u.role || 'staff');
    var restricted = isRestrictedRole(r);
    return {
      role: r,
      isClub: isClubRole(r),
      capAccess: restricted,
      isStaffLocked: function(dept) { return dept === 'staff' && restricted; }
    };
  }

  /* Unlock sliders for edit mode */
  function enterEditMode() {
    /* Cancel any other user's edit mode first */
    if (_editUid && _editUid !== uid) {
      var prevItem = document.querySelector('.uacc-item[data-uid="' + _editUid + '"]');
      if (prevItem) {
        var prevCancel = prevItem.querySelector('.uacc-cancel-edit-btn');
        if (prevCancel) prevCancel.click();
      }
    }
    _editUid = uid;
    /* Open role picker as part of edit mode */
    var picker = body.querySelector('.inline-role-picker');
    if (picker) picker.classList.add('open');
    /* Adding an exception means reaching a tool that conforms today, so the
       folded list opens with edit mode. It stays open until the item is
       re-rendered — closing it under someone mid-edit would hide a control
       they had just changed. */
    var allFold = body.querySelector('.uacc-all');
    if (allFold) allFold.open = true;
    editBar.classList.add('active');
    editAccessBtn.style.display = 'none';
    saveAccessBtn.style.display = '';
    cancelAccessBtn.style.display = '';
    var restoreBtnEl = body.querySelector('.uacc-restore-btn');
    if (restoreBtnEl) restoreBtnEl.style.display = '';

    /* Always reset slider values from RTDB before unlocking --
       prevents stale visual state left by role picker preview/cancel */
    var storedTools = (STATE.allUsers[uid] || {}).tools || {};
    var currentU    = STATE.allUsers[uid] || u;
    var constraints = getRoleConstraints(currentU.role);

    body.querySelectorAll('.uacc-tool-row').forEach(function(row) {
      var slider = row.querySelector('.acc-slider');
      if (!slider || !slider.dataset.toolkey) return;
      var toolKey = slider.dataset.toolkey;
      var tool    = STATE.tools[toolKey];
      var deptKey = toolAudience(tool);

      if (isSuperUser) return;
      if (constraints.isStaffLocked(deptKey)) return; /* staff-dept tool for restricted role stays locked off */
      /* Club access follows the role, with no per-tool exceptions (settled
         17/08/2026). Club rows stay read-only in edit mode too — they are no
         longer struck through, so this is the guard that keeps them
         uneditable now that the strike-through is not doing it. */
      if (constraints.isClub) return;

      /* Reset to stored RTDB value (or role default if no override).
         setSliderLevel paints against the slider's OWN rungs. This block used
         to do its own arithmetic against the global off/access/admin list, so
         on a two-rung tool a stored 'admin' resolved to index 2, no rung
         matched, and the control came up with NOTHING selected — the blank
         rows a League Admin saw on all thirteen two-rung tools the moment they
         pressed Edit. */
      var level = storedTools[toolKey] || getDefaultLevel(toolKey, currentU);
      setSliderLevel(slider, level);
      delete slider.dataset.previewLevel;

      /* Remove locked class -- CSS handles pointer-events, handlers already wired */
      slider.classList.remove('acc-slider--locked');
    });
  }

  /* Lock sliders back (edit mode exit) */
  function exitEditMode() {
    _editUid = null;
    editBar.classList.remove('active');
    editAccessBtn.style.display = '';
    saveAccessBtn.style.display = 'none';
    cancelAccessBtn.style.display = 'none';
    var restoreBtnEl2 = body.querySelector('.uacc-restore-btn');
    if (restoreBtnEl2) restoreBtnEl2.style.display = 'none';

    body.querySelectorAll('.acc-slider').forEach(function(slider) {
      slider.classList.add('acc-slider--locked');
      /* CSS class handles pointer-events -- no inline style needed */
    });
  }

  /* Save: 6-role model, overrides-only writes (lean records).
     Tool levels equal to the role default are NOT stored — the path is
     nulled so the user inherits the registry default. Only genuine
     deviations persist. Club roles force every tool to its role default. */
  function saveAccess() {
    var role        = normRole(selectedRole);
    var constraints = getRoleConstraints(role);
    var storedUser  = STATE.allUsers[uid] || {};
    var updates     = {};
    var hasChanges  = false;

    body.querySelectorAll('.uacc-tool-row').forEach(function(row) {
      var slider = row.querySelector('.acc-slider');
      if (!slider || !slider.dataset.toolkey) return;
      var toolKey = slider.dataset.toolkey;
      var tool    = STATE.tools[toolKey];
      var deptKey = toolAudience(tool);

      /* Read current visual level from slider */
      var level = 'off';
      slider.querySelectorAll('.acc-slider__stop').forEach(function(s, si) {
        if (s.classList.contains('acc-slider__stop--active')) level = s.dataset.level || ACC_LEVELS[si];
      });

      var def = roleDefaultLevel(toolKey, role);
      if (constraints.isStaffLocked(deptKey)) level = 'off';   /* restricted: no staff tools */
      if (constraints.capAccess && level === 'admin') level = 'access';  /* restricted: no admin */

      var path = 'users/' + uid + '/tools/' + toolKey;
      updates[path] = (level === def) ? null : level;      /* overrides-only */
      if (getAccessLevel(uid, toolKey) !== level) hasChanges = true;
    });

    var newClub     = isClubRole(role) ? (confirmedClub || '') : '';
    var newOrgName  = isClubRole(role) ? '' : 'National League';
    var newJobTitle = jobTitleInput ? jobTitleInput.value.trim() : (storedUser.jobTitle || '');

    if (isClubRole(role) && !newClub) { showToast('Select a club for this user', 'error'); return; }

    if (role        !== (storedUser.role     || '')) hasChanges = true;
    if (newClub     !== (storedUser.club     || '')) hasChanges = true;
    if (newOrgName  !== (storedUser.org      || '')) hasChanges = true;
    if (newJobTitle !== (storedUser.jobTitle || '')) hasChanges = true;

    if (!hasChanges) { exitEditMode(); return; }

    saveAccessBtn.disabled = true;
    saveAccessBtn.textContent = 'Saving…';

    updates['users/' + uid + '/role']     = role;
    updates['users/' + uid + '/club']     = newClub;
    updates['users/' + uid + '/org']      = newOrgName;
    updates['users/' + uid + '/jobTitle'] = newJobTitle;
    updates['users/' + uid + '/orgKey']   = null;          /* deprecated field — clear */

    var roleChanged = role !== (storedUser.role || '');
    writeAuditFor(uid, storedUser.name || '', storedUser.email || '',
      'access_changed', (roleChanged ? 'Role: ' + (storedUser.role||'?') + ' -> ' + role + '. ' : '') +
      'Access update for ' + (storedUser.name || storedUser.email || uid));

    db.ref().update(updates)
      .then(function() {
        showToast('Access saved for ' + (u.name || u.email || ''), 'success');
        exitEditMode();
        loadUsers();
      })
      .catch(function(err) {
        saveAccessBtn.disabled = false;
        saveAccessBtn.textContent = 'Save access';
        showToast('Failed to save: ' + err.message, 'error');
      });
  }

  /* Cancel: revert sliders to RTDB state */
  function cancelAccess() {
    var storedTools = (STATE.allUsers[uid] || {}).tools || {};
    var constraints = getRoleConstraints();

    body.querySelectorAll('.uacc-tool-row').forEach(function(row) {
      var slider = row.querySelector('.acc-slider');
      if (!slider || !slider.dataset.toolkey) return;
      var toolKey = slider.dataset.toolkey;
      /* Same rule as enterEditMode: repaint against the slider's own rungs. */
      var level = storedTools[toolKey] || getDefaultLevel(toolKey, u);
      setSliderLevel(slider, level);
      delete slider.dataset.previewLevel;
    });

    /* Close and reset role picker to the stored role */
    var picker = body.querySelector('.inline-role-picker');
    if (picker) picker.classList.remove('open');
    selectedRole  = storedRole;
    confirmedClub = u.club || '';
    if (typeof syncRolePickerUI === 'function') syncRolePickerUI();

    exitEditMode();
  }

  /* Footer — role selector + resend */
  var footer = document.createElement('div');
  footer.className = 'uacc-footer';

  if (u.role === 'superadmin') {
    var lock = document.createElement('span');
    lock.style.cssText = 'font-size:var(--text-xs);color:var(--text-muted);font-style:italic;';
    lock.textContent = 'Superadmin — role locked';
    footer.appendChild(lock);

  } else if (u.pending) {
    /* Pending user -- resend, cancel, no role change */
    var resendBtn = document.createElement('button');
    resendBtn.className = 'resend-pill';
    resendBtn.textContent = 'Resend invite';
    resendBtn.addEventListener('click', function() { resendInvite(u.email, resendBtn); });
    footer.appendChild(resendBtn);

    var cancelBtn = document.createElement('button');
    cancelBtn.className = 'cancel-invite-btn';
    cancelBtn.textContent = 'Cancel invite';
    var confirmed = false;
    cancelBtn.addEventListener('click', function() {
      if (!confirmed) {
        confirmed = true;
        cancelBtn.classList.add('confirm');
        cancelBtn.textContent = 'Confirm cancel?';
        setTimeout(function() {
          if (confirmed) {
            confirmed = false;
            cancelBtn.classList.remove('confirm');
            cancelBtn.textContent = 'Cancel invite';
          }
        }, 3000);
      } else {
        /* Delete the user record */
        db.ref('users/' + uid).remove()
          .then(function() {
            showToast('Invite cancelled', 'success');
            writeAudit('invite_cancelled', (u.name || u.email || '') + ' invite removed');
            loadUsers();
          })
          .catch(function() { showToast('Failed to cancel invite', 'error'); });
      }
    });
    footer.appendChild(cancelBtn);

  } else {
    /* Active user -- inline six-role picker (opened with the Edit button) */
    var rolePicker = document.createElement('div');
    rolePicker.className = 'inline-role-picker';

    var selectedRole  = normRole(u.role || 'staff');   /* one of the 6 role keys */
    var storedRole    = selectedRole;                  /* original, for preview restore */
    var confirmedClub = u.club || '';

    /* ── Live preview: reflect the chosen role in the tool sliders ──────────
       Superadmin: everything admin, fully locked. Restricted (club) roles:
       staff-audience tools fully locked off; non-staff tools show
       Off/Access editable with Admin padlocked. League roles: fully editable
       — on the original role keep stored overrides, else show role defaults. */
    function previewRoleSliders(newRole, forceDefaults) {
      var role = normRole(newRole);
      var storedTools = (STATE.allUsers[uid] || {}).tools || {};
      var isOriginalRole = (role === storedRole);
      var superLock  = (role === 'superadmin');
      var restricted = isRestrictedRole(role);

      body.querySelectorAll('.uacc-tool-row').forEach(function(row) {
        var slider = row.querySelector('.acc-slider');
        if (!slider) return;
        var toolKey = slider.dataset.toolkey;
        if (!toolKey) return;
        var tool = STATE.tools[toolKey];
        var staffLock = restricted && toolAudience(tool) === 'staff';
        var fullLock  = superLock || staffLock;

        var defaultLevel = superLock ? 'admin' : (staffLock ? 'off' : roleDefaultLevel(toolKey, role));

        var useLevel;
        if (fullLock || forceDefaults || !isOriginalRole) {
          useLevel = defaultLevel;
        } else {
          var sl = storedTools[toolKey];
          if (sl === undefined || sl === null) useLevel = defaultLevel;
          else if (typeof sl === 'string') useLevel = sl;
          else useLevel = sl.admin ? 'admin' : (sl.access ? 'access' : 'off');
        }
        if (restricted && useLevel === 'admin') useLevel = 'access';

        slider.className = 'acc-slider' + (fullLock ? ' acc-slider--locked' : '');

        /* Paint against the slider's own rungs (setSliderLevel), not against
           the global off/access/admin list — on a two-rung tool an 'admin'
           value has no rung to land on and the control came up blank. */
        setSliderLevel(slider, useLevel);

        /* A rung the previewed role could never hold stays inert. Nothing is
           struck through: the club filter in buildAccSlider means a club
           preview has no Manage rung to disable in the first place, and this
           only bites on a slider built for a league role and previewed as a
           club one, before the row is rebuilt. */
        slider.querySelectorAll('.acc-slider__stop').forEach(function(stop) {
          var stopLevel = stop.dataset.level;
          var padlock = fullLock || (restricted && stopLevel === 'admin');
          stop.classList.toggle('acc-slider__stop--padlocked', !!padlock);
          stop.style.pointerEvents = padlock ? 'none' : '';
        });
        syncAccAria(slider);

        slider.dataset.previewLevel = useLevel;
      });
    }

    /* ── Role (six-role picker) ── */
    var roleRow = document.createElement('div');
    roleRow.className = 'inline-role-picker__section';
    var roleLbl = document.createElement('div');
    roleLbl.className = 'inline-role-picker__section-label';
    roleLbl.textContent = 'Role';
    roleRow.appendChild(roleLbl);
    var roleBtns = document.createElement('div');
    roleBtns.className = 'inline-role-picker__btns';
    roleRow.appendChild(roleBtns);
    rolePicker.appendChild(roleRow);

    /* ── Club picker (club roles only) ── */
    var clubPickerRow = document.createElement('div');
    clubPickerRow.className = 'inline-role-picker__section';
    var clubLbl2 = document.createElement('div');
    clubLbl2.className = 'inline-role-picker__section-label';
    clubLbl2.textContent = 'Club';
    var offRosterBadge = document.createElement('span');
    offRosterBadge.style.cssText = 'display:none;font-size:var(--text-xs);font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--amber);margin-left:6px;';
    offRosterBadge.textContent = '⚠ off current roster';
    clubLbl2.appendChild(offRosterBadge);
    var crPicker = document.createElement('div');
    crPicker.style.cssText = 'flex:1;';
    /* Off-roster badge is computed here (the component always reports
       isOffRoster:false), so keep the portal's own isOffRoster() check. */
    function refreshOffRoster() {
      loadInvClubs().then(function() {
        offRosterBadge.style.display = isOffRoster(confirmedClub) ? 'inline' : 'none';
      });
    }
    /* Shared NL.clubPicker (search mode). The dropdown lists the current-season
       roster (departed clubs drop, entrants appear); an existing user's
       off-roster club is still shown via setValue and flagged by the badge.
       freetext:false + clearable:false keep the contract that a club role must
       map to a real club chosen from the roster. */
    var clubCtl = NL.clubPicker(crPicker, {
      season:      'current',
      freetext:    false,
      clearable:   false,
      placeholder: 'Search clubs…',
      onSelect: function(sel) {
        confirmedClub = sel.name;
        offRosterBadge.style.display = isOffRoster(confirmedClub) ? 'inline' : 'none';
      }
    });
    if (confirmedClub) { clubCtl.setValue(confirmedClub); refreshOffRoster(); }
    clubPickerRow.appendChild(clubLbl2);
    clubPickerRow.appendChild(crPicker);
    rolePicker.appendChild(clubPickerRow);

    /* ── Job title (all roles) ── */
    var jobTitleRow = document.createElement('div');
    jobTitleRow.className = 'inline-role-picker__section';
    jobTitleRow.style.display = 'flex';
    var jobTitleLbl = document.createElement('div');
    jobTitleLbl.className = 'inline-role-picker__section-label';
    jobTitleLbl.textContent = 'Job title';
    var jobTitleInput = document.createElement('input');
    jobTitleInput.type = 'text';
    jobTitleInput.value = u.jobTitle || '';
    jobTitleInput.placeholder = 'e.g. Media Manager, Operations Director';
    jobTitleInput.style.cssText = 'flex:1;font-size:var(--text-sm);padding:7px 10px;border:1px solid var(--border);border-radius:var(--radius);font-family:var(--font);';
    jobTitleRow.appendChild(jobTitleLbl);
    jobTitleRow.appendChild(jobTitleInput);
    rolePicker.appendChild(jobTitleRow);

    /* ── Show/hide conditional rows + sync active pill for the selected role ── */
    function syncRolePickerUI() {
      var clubRole = isClubRole(selectedRole);
      clubPickerRow.style.display = clubRole ? 'flex' : 'none';
      roleBtns.querySelectorAll('.invite-role-btn').forEach(function(b) {
        b.classList.toggle('active', b.dataset.role === selectedRole);
      });
      if (clubRole) { clubCtl.setValue(confirmedClub || ''); refreshOffRoster(); }
    }

    /* ── Wire up the six role buttons ── */
    PORTAL_ROLE_KEYS.forEach(function(r) {
      var rbtn = document.createElement('button');
      rbtn.type = 'button';
      rbtn.dataset.role = r;
      rbtn.className = 'invite-role-btn invite-role-btn--described'
                     + (selectedRole === r ? ' active' : '');
      /* Name and grant together. Four bare names told nobody which one can
         submit their club's attendances — the answer lived only in a plan
         document, and the person picking is the one who needs it. */
      var rname = document.createElement('span');
      rname.className = 'invite-role-btn__name';
      rname.textContent = roleLabel(r);
      rbtn.appendChild(rname);
      var rgrant = NL.roles.grant(r);
      if (rgrant) {
        var rdesc = document.createElement('span');
        rdesc.className = 'invite-role-btn__grant';
        rdesc.textContent = rgrant;
        rbtn.appendChild(rdesc);
      }
      rbtn.addEventListener('click', function() {
        selectedRole = r;
        if (!isClubRole(r)) confirmedClub = '';
        syncRolePickerUI();
        previewRoleSliders(selectedRole);
      });
      roleBtns.appendChild(rbtn);
    });
    syncRolePickerUI();
  }

  /* Edit access / Save / Cancel -- shown for all non-superadmin, non-pending users */
  if (u.role !== 'superadmin' && !u.pending) {
    var editAccessBtn = document.createElement('button');
    editAccessBtn.className = 'btn btn--ghost btn--sm';
    editAccessBtn.textContent = 'Edit';
    editAccessBtn.addEventListener('click', function(e) { e.stopPropagation(); enterEditMode(); });

    var saveAccessBtn = document.createElement('button');
    saveAccessBtn.className = 'btn btn--navy btn--sm';
    saveAccessBtn.textContent = 'Save access';
    saveAccessBtn.style.display = 'none';
    saveAccessBtn.addEventListener('click', function(e) { e.stopPropagation(); saveAccess(); });

    var restoreBtn = document.createElement('button');
    restoreBtn.className = 'btn btn--ghost btn--sm uacc-restore-btn';
    restoreBtn.textContent = 'Restore defaults';
    restoreBtn.style.display = 'none';
    restoreBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      /* Reset all sliders to the SELECTED role's defaults (respects staff-lock,
         admin-cap and padlocks via previewRoleSliders' forceDefaults path). */
      previewRoleSliders(selectedRole, true);
      showToast('Defaults restored — save to apply', 'info');
    });

    var cancelAccessBtn = document.createElement('button');
    cancelAccessBtn.className = 'btn btn--ghost btn--sm uacc-cancel-edit-btn';
    cancelAccessBtn.textContent = 'Cancel';
    cancelAccessBtn.style.display = 'none';
    cancelAccessBtn.addEventListener('click', function(e) { e.stopPropagation(); cancelAccess(); });

    footer.appendChild(editAccessBtn);
    footer.appendChild(saveAccessBtn);
    footer.appendChild(restoreBtn);
    footer.appendChild(cancelAccessBtn);

  }

  /* Role picker — only exists for non-superadmin active users */
  if (typeof rolePicker !== 'undefined' && rolePicker) {
    body.appendChild(rolePicker);
  }

  /* Remove user button — sits alongside Edit in footer, pushed right */
  if (u.role !== 'superadmin') {
    var removeBtn = document.createElement('button');
    removeBtn.className = 'btn btn--ghost btn--sm';
    removeBtn.style.cssText = 'color:var(--red);border-color:color-mix(in srgb, var(--red) 30%, white);font-size:var(--text-xs);margin-left:auto;';
    removeBtn.textContent = 'Remove user';
    removeBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      if (removeBtn.dataset.confirmed !== '1') {
        removeBtn.dataset.confirmed = '1';
        removeBtn.textContent = 'Confirm remove?';
        removeBtn.style.background = 'var(--red)';
        removeBtn.style.color = 'var(--white)';
        removeBtn.style.borderColor = 'var(--red)';
        setTimeout(function() {
          if (removeBtn.dataset.confirmed === '1') {
            removeBtn.dataset.confirmed = '0';
            removeBtn.textContent = 'Remove user';
            removeBtn.style.background = '';
            removeBtn.style.color = 'var(--red)';
            removeBtn.style.borderColor = 'color-mix(in srgb, var(--red) 30%, white)';
          }
        }, 3000);
        return;
      }
      removeBtn.disabled = true;
      removeBtn.textContent = 'Removing…';
      var targetUser3 = STATE.allUsers[uid] || {};
      writeAuditFor(uid, targetUser3.name || '', targetUser3.email || '',
        'user_removed', (targetUser3.name || targetUser3.email || '') + ' removed by admin');
      db.ref('users/' + uid).remove()
        .then(function() {
          showToast((u.name || u.email || 'User') + ' removed', 'success');
          loadUsers();
        })
        .catch(function(err) {
          removeBtn.disabled = false;
          removeBtn.textContent = 'Remove user';
          removeBtn.dataset.confirmed = '0';
          showToast('Failed to remove: ' + err.message, 'error');
        });
    });
    footer.appendChild(removeBtn);
  }

  body.appendChild(footer);
  item.appendChild(header);
  item.appendChild(body);

  /* Toggle on header click (or Enter/Space, since it's role="button") */
  function toggleHeader() {
    var isOpen = body.classList.contains('open');

    /* If another user is in edit mode, cancel it first */
    if (_editUid && _editUid !== uid) {
      var editItem = document.querySelector('.uacc-item[data-uid="' + _editUid + '"]');
      if (editItem) {
        var prevCancel = editItem.querySelector('.uacc-cancel-edit-btn');
        if (prevCancel) prevCancel.click();
      }
    }

    /* Close any other open item */
    if (_openAccUid && _openAccUid !== uid) {
      var prev = document.querySelector('.uacc-item[data-uid="' + _openAccUid + '"]');
      if (prev) {
        var prevHeader = prev.querySelector('.uacc-header');
        prevHeader.classList.remove('open');
        prevHeader.setAttribute('aria-expanded', 'false');
        prev.querySelector('.uacc-body').classList.remove('open');
      }
    }

    if (isOpen) {
      header.classList.remove('open');
      header.setAttribute('aria-expanded', 'false');
      body.classList.remove('open');
      _openAccUid = null;
    } else {
      header.classList.add('open');
      header.setAttribute('aria-expanded', 'true');
      body.classList.add('open');
      _openAccUid = uid;
    }
  }
  header.addEventListener('click', toggleHeader);
  header.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') {
      e.preventDefault();
      toggleHeader();
    }
  });

  return item;
}


/* ---- Welcome message editor ---------------------------------------------- */

/* ---- Access slider ------------------------------------------------------- */
var ACC_LEVELS = ['off', 'access', 'admin'];

/* Which levels does THIS tool actually have? Most tools have no admin tier —
   editing follows the person's role, or there is nothing to administer at all —
   so offering "Manage" there is a control that does nothing. A tool declares
   its ladder in the registry as `levels`; absent means the full three, so an
   unmigrated record behaves exactly as before.
   Only a PREFIX of ACC_LEVELS is meaningful: you can drop the top rung, never
   punch a hole in the middle. Anything else is ignored in favour of the full
   set — a malformed record must not silently remove access states. */
function toolLevels(tool) {
  var declared = tool && tool.levels;
  if (!Array.isArray(declared) || !declared.length) return ACC_LEVELS;
  var isPrefix = declared.every(function(l, i) { return l === ACC_LEVELS[i]; });
  return isPrefix ? declared : ACC_LEVELS;
}
/* Stored values stay off/access/admin — only the words change. "Admin" meant
   three things at once (a league role, a per-tool power level, and "edits own
   club"), so the per-tool level gets its own plain vocabulary and "admin" is
   left to mean the role alone. */
var ACC_LABELS = { off: 'Off', access: 'Use', admin: 'Manage' };

/* Keep the segmented control's a11y state matching its classes. The preview
   and restore paths repaint the --active class directly, so aria-checked and
   the roving tabstop are re-derived from it here rather than in five places. */
function syncAccAria(slider) {
  if (!slider || !slider.querySelectorAll) return;
  slider.querySelectorAll('.acc-slider__stop').forEach(function(s) {
    if (s.getAttribute('aria-disabled') === 'true') return;
    var on = s.classList.contains('acc-slider__stop--active');
    s.setAttribute('aria-checked', String(on));
    s.tabIndex = on ? 0 : -1;
  });
}

/* Set an acc-slider to a given level, updating dot classes.
   Used by Restore defaults to reset all sliders at once. */
function setSliderLevel(slider, level) {
  /* Match against the stops this slider actually has, not the global ladder.
     A "set all" can ask for 'admin' on a tool that has no admin tier — clamp to
     the highest rung that exists rather than leaving nothing selected. */
  var stops = slider.querySelectorAll('.acc-slider__stop');
  var levels = Array.prototype.map.call(stops, function(s, si) {
    return s.dataset.level || ACC_LEVELS[si];
  });
  var idx = levels.indexOf(level);
  if (idx === -1) idx = (ACC_LEVELS.indexOf(level) > 0) ? levels.length - 1 : 0;
  var applied = levels[idx] || 'off';

  stops.forEach(function(stop, si) {
    stop.classList.remove('acc-slider__stop--active', 'acc-slider__stop--filled', 'acc-slider__stop--padlocked');
    if (si === idx) stop.classList.add('acc-slider__stop--active');
  });
  syncAccAria(slider);

  slider.dataset.previewLevel = applied;
}

/* dept is kept as data on the row (grouping/debugging); the bodyEl argument
   went with resetSetAllSlider in v5.111 — it existed only so the slider could
   reach up and clear the set-all bar. */
function buildAccSlider(uid, toolKey, currentLevel, defaultLevel, locked, clubLocked, dept) {
  var wrap = document.createElement('div');
  wrap.className = 'acc-slider' + (locked ? ' acc-slider--locked' : '');
  wrap.dataset.toolkey = toolKey;
  wrap.dataset.currentLevel = currentLevel;
  wrap.dataset.dept = dept;
  wrap.setAttribute('role', 'radiogroup');
  wrap.setAttribute('aria-label', 'Access level');
  /* Render only the levels this tool actually has (see toolLevels). If a stored
     value sits above the tool's ladder — a legacy 'admin' on a tool that has no
     admin tier — it is clamped to the top rung that exists, so the control can
     never display a state it cannot represent. */
  var LEVELS = toolLevels(STATE.tools && STATE.tools[toolKey]);
  /* A club role can never hold Manage, so for a club account the rung is not
     drawn at all. It used to be drawn and struck through, which is a control
     saying "here is a thing you cannot have" — noise on every club row, on
     every tool, forever. If it cannot be operated it is not a control. */
  if (clubLocked) LEVELS = LEVELS.filter(function(l) { return l !== 'admin'; });
  var currentIdx = LEVELS.indexOf(currentLevel);
  if (currentIdx === -1) currentIdx = (ACC_LEVELS.indexOf(currentLevel) > 0) ? LEVELS.length - 1 : 0;
  var defaultIdx = LEVELS.indexOf(defaultLevel);

  /* The old build appended an .acc-slider__track plus a __track-fill child, and
     called an updateFill() whose body computed a percentage then threw it away.
     Two undrawn divs and a no-op on every render — the track had no CSS at all.
     Gone; the segments carry the state themselves. */

  /* locked     = edit-mode lock only -- slider is read-only until Edit pressed.
                  Does NOT prevent click handlers from being attached.
     clubLocked = only admin stop permanently padlocked (club users).
     Truly padlocked = superadmin (locked=true AND it's a superadmin slider)
                       OR clubLocked admin stop.
     We use a separate `isPermanentLock` flag passed as `locked` only when
     the tool is structurally off-limits (staff tools for club/trust/u19,
     or superadmin's own slider). In those cases stops get padlocks + no handler.
     For normal edit-mode locking, `locked` just adds the CSS class -- handlers
     are always wired and check `_editUid` before acting. */
  /* Three columns, always — even when this tool has two rungs. The control is
     a fixed width and the rungs used to divide it, so "Use" was half the box on
     a two-rung tool and a third of it on a three-rung one: the words sat in a
     different place on every row and the column read as ragged even though the
     boxes were the same size. Aligning the box was not the job; aligning the
     BUTTONS is. The missing rung is rendered as an empty cell so Off sits under
     Off, Use under Use and Manage under Manage all the way down the list. */
  ACC_LEVELS.forEach(function(level) {
    var idx = LEVELS.indexOf(level);
    if (idx === -1) {
      /* A rung this tool (or this role) does not have. An empty cell holds the
         column open; it is not a control, so it carries no role, no label and
         no handler, and a screen reader passes straight over it. */
      var gap = document.createElement('div');
      gap.className = 'acc-slider__gap';
      gap.setAttribute('aria-hidden', 'true');
      wrap.appendChild(gap);
      return;
    }

    var isPadlocked = locked || (clubLocked && level === 'admin');

    var stop = document.createElement('div');
    stop.className = 'acc-slider__stop';
    if (isPadlocked) {
      stop.classList.add('acc-slider__stop--padlocked');
    } else {
      /* --filled (every rung below the selected one) was applied here and
         styled nowhere — the segments carry the state on their own since the
         track was deleted. Dropped rather than left as a class that looks
         meaningful in the DOM inspector and is not. */
      if (idx === currentIdx) stop.classList.add('acc-slider__stop--active');
    }

    var label = document.createElement('div');
    label.className = 'acc-slider__label';
    label.textContent = ACC_LABELS[level];
    stop.appendChild(label);
    /* Carry the level on the element. Several readers used to map stop INDEX
       back to ACC_LEVELS, which only worked while every slider had all three
       stops. */
    stop.dataset.level = level;

    /* Semantics + keyboard. These were plain divs with a click handler, so the
       whole control was mouse-only and silent to a screen reader. */
    stop.setAttribute('role', 'radio');
    stop.setAttribute('aria-checked', String(!isPadlocked && idx === currentIdx));
    if (isPadlocked) {
      stop.setAttribute('aria-disabled', 'true');
      stop.title = 'Not available for this role';
    } else {
      stop.tabIndex = (idx === currentIdx) ? 0 : -1;
    }

    /* Attach click handler to all non-padlocked stops.
       Edit-only locked stops get handler too -- it checks _editUid before acting. */
    if (!isPadlocked) {
      stop.addEventListener('click', function(e) {
        e.stopPropagation();
        /* Only act if this user is currently in edit mode */
        if (_editUid !== uid) return;
        if (uid === STATE.uid && STATE.isSuperAdmin && level !== 'admin') {
          showToast('You cannot reduce your own access', 'error');
          return;
        }
        currentLevel = level;
        currentIdx   = idx;
        /* One repaint, shared with every other path (setSliderLevel), which
           also keeps aria-checked and the roving tabstop with the selection. */
        setSliderLevel(wrap, level);
        /* No RTDB write -- deferred to Save */
      });
      /* Space/Enter activate the focused segment, as a radio should. */
      stop.addEventListener('keydown', function(e) {
        if (e.key === ' ' || e.key === 'Enter' || e.key === 'Spacebar') {
          e.preventDefault();
          stop.click();
        }
      });
    }
    wrap.appendChild(stop);
  });
  return wrap;
}

/* Reset a dept's set-all slider to neutral (mixed state) when individual tools change */
/* resetSetAllSlider() lived here until v5.111. It cleared the set-all bar
   whenever an individual tool changed, so the bar never claimed a section
   was uniform when it wasn't. There is no set-all bar in either pane now, so
   it had been searching the DOM for nodes nobody builds. */

/* buildSetAllSlider() and setAllInDept() lived here until v5.107.
   A 'set every tool in this section to X' control only makes sense while the
   panel treats per-tool levels as the thing you administer. Role is the
   toolset, and per-tool entries are exceptions — bulk-setting exceptions is
   an anti-feature, and this one shipped as two duplicated DOM nodes (a navy
   desktop copy and a red mobile copy, swapped by media query) styled with
   about forty rgba() overlays the brand does not use. Deleted with the grid
   it belonged to. */

/* ---- Invite club picker -------------------------------------------------- */
var invClubPicker = null; /* NL.clubPicker controller (created in initInviteForm) */
var INV_CLUBS_DATA = [];
var INV_META = null; /* full parsed clubs-meta — still needed for the inline role picker + off-roster flag */

function loadInvClubs() {
  if (INV_CLUBS_DATA.length) return Promise.resolve();
  /* Share the canon loader (NL.clubs) instead of a second clubs-meta fetch —
     the club pickers already load it, so this dedups the request. */
  return window.NL.clubs.load()
    .then(function(data) { INV_META = data; INV_CLUBS_DATA = data.clubs || []; })
    .catch(function() { INV_META = null; INV_CLUBS_DATA = []; });
}

function initInviteForm() {
  /* Shared club picker (nl-utils). season:'current' offers only the live
     roster; freetext:false because an invite must map to a real NL club. */
  if (!invClubPicker) {
    invClubPicker = NL.clubPicker('#invClubPicker', {
      season: 'current',
      freetext: false,
      placeholder: 'Search club name…'
    });
  }

  document.querySelectorAll('.invite-role-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.invite-role-btn').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      var role = btn.dataset.role;
      document.getElementById('inviteRole').value = role;
      var clubRole = isClubRole(role);
      document.getElementById('inviteClubField').style.display = clubRole ? 'block' : 'none';
      if (clubRole) loadInvClubs();
      renderInviteToolSliders();
    });
  });

  renderInviteToolSliders();

  document.getElementById('inviteBtn').addEventListener('click', function() {
    var email    = document.getElementById('inviteEmail').value.trim();
    var name     = document.getElementById('inviteName').value.trim();
    var role     = normRole(document.getElementById('inviteRole').value);
    var club     = (invClubPicker.getValue() || '').trim();
    var jobTitle = document.getElementById('inviteClubRole').value.trim();
    /* Club roles carry no org; every league role carries the National League. */
    var org      = isClubRole(role) ? '' : 'National League';

    if (!email || !name) { showMsg('inviteMsg', 'Email and name are required.', 'error'); return; }
    if (isClubRole(role) && !club) { showMsg('inviteMsg', 'Please select a club.', 'error'); return; }

    setBtnLoading('inviteBtn', true);

    /* Overrides-only: store a tool only when it differs from the role default. */
    var toolAccess = {};
    document.querySelectorAll('#inviteToolSliders .acc-slider').forEach(function(slider) {
      var toolKey = slider.dataset.toolkey;
      if (!toolKey) return;
      /* Read the level off the SEGMENT, not off its index. Mapping index back
         into ACC_LEVELS only holds while every slider has all three rungs, and
         since v5.102 they do not: thirteen tools render two, and a club role
         drops the Manage rung as well. This reader was the last one left doing
         it — buildAccSlider's stops have carried dataset.level since the
         ladders went per-tool. It has been right by luck (index 0 is 'off' and
         index 1 is 'access' in both the full and the two-rung ladder) and would
         have silently written the wrong level the day a ladder started
         anywhere but 'off'. */
      var level = 'off';
      slider.querySelectorAll('.acc-slider__stop').forEach(function(s) {
        if (s.classList.contains('acc-slider__stop--active')) level = s.dataset.level || level;
      });
      if (level !== roleDefaultLevel(toolKey, role)) toolAccess[toolKey] = level;
    });

    /* Show sending state */
    var inviteBtn = document.getElementById('inviteBtn');
    inviteBtn.disabled = true;
    inviteBtn.innerHTML = '<span class="btn-spinner"><\/span> Sending…';

    /* Send invite via GAS -- GAS stores token in RTDB invites/{token}
       with full user payload. Login page creates user record after auth. */
    nlGasFetch({
      action:   'sendInvite',
      email:    email,
      name:     name,
      role:     role,
      org:      org      || '',
      club:     club     || '',
      jobTitle: jobTitle || '',
      tools:    toolAccess
    })
    .then(function(r) { return r.json(); })
    .then(function(result) {
      setBtnLoading('inviteBtn', false, 'Send invite');
      if (result && result.ok === false) {
        showMsg('inviteMsg', 'Email failed: ' + (result.error || 'unknown error'), 'error');
      } else {
        var auditDetail = isClubRole(role)
          ? 'Invited ' + name + ' as ' + roleLabel(role) + ' for ' + club + (jobTitle ? ' (' + jobTitle + ')' : '')
          : 'Invited ' + name + ' as ' + roleLabel(role) + (org ? ' (' + org + ')' : '');
        writeAudit('invite_sent', auditDetail);

        /* Write pending invite record so it appears in Pending Invites tab */
        var pendingRecord = {
          email:     email,
          name:      name,
          role:      role,
          org:       org      || '',
          club:      club     || '',
          jobTitle:  jobTitle || '',
          tools:     toolAccess,
          sentAt:    Date.now(),
          sentBy:    (STATE.userData && STATE.userData.name) || ''
        };
        db.ref('admin/invites-pending').push(pendingRecord)
          .then(function() { loadPendingInvites(); })
          .catch(function() {});

        showToast('Invite sent to ' + email, 'success');
        document.getElementById('inviteEmail').value    = '';
        document.getElementById('inviteName').value     = '';
        document.getElementById('inviteClubRole').value = ''; /* clears job title */
        if (invClubPicker) invClubPicker.clear();
        loadUsers();
      }
    })
    .catch(function(err) {
      setBtnLoading('inviteBtn', false, 'Send invite');
      showMsg('inviteMsg', 'Failed: ' + err.message, 'error');
    });
  });
}

function renderInviteToolSliders() {
  var container = document.getElementById('inviteToolSliders');
  if (!container) return;
  container.innerHTML = '';
  var role      = normRole(document.getElementById('inviteRole').value || 'staff');
  var isClubOrg = isRestrictedRole(role);
  var tools     = STATE.toolsList.filter(function(t) { return t._key !== 'welcome'; });

  /* Same shape as the user rows (v5.107): the role does the work, and the
     per-tool list is for the exception you might want to make before sending.
     On an invite there are no exceptions yet by definition — every tool starts
     at its role default — so the old grid of sixteen sliders was sixteen
     controls restating the role to someone who had just picked it. */

  var open = 0, closed = 0;
  var rows = [];

  tools.forEach(function(t) {
    var dept = toolAudience(t);
    /* League-audience tools are closed to club roles at the audience gate, so
       they are counted, not drawn. */
    if (isClubOrg && dept === 'staff') { closed++; return; }

    var defaultLevel = roleDefaultLevel(t._key, role);
    if (defaultLevel !== 'off') open++;

    var row = document.createElement('div');
    row.className = 'invite-tool-row';
    row.dataset.dept = dept;
    var nameEl = document.createElement('div');
    nameEl.className = 'invite-tool-name';
    nameEl.textContent = (t.icon ? t.icon + ' ' : '') + (t.label || t._key);
    row.appendChild(nameEl);
    row.appendChild(buildInviteSlider(t._key, defaultLevel, isClubOrg, dept, container));
    rows.push(row);
  });

  /* What they will get, before anyone touches a control. */
  var summary = document.createElement('div');
  summary.className = 'uacc-summary';
  summary.textContent = roleLabel(role) + ' \u2014 ' + NL.roles.grant(role)
    + ' Opens ' + open + ' of the ' + rows.length + ' tools they can reach.'
    + (closed ? ' A further ' + closed + ' are league-only.' : '');
  container.appendChild(summary);

  if (!rows.length) return;

  var fold = document.createElement('details');
  fold.className = 'disclosure uacc-all';
  var foldSummary = document.createElement('summary');
  foldSummary.textContent = 'Set a tool apart from the role (optional)';
  fold.appendChild(foldSummary);
  var wrap = document.createElement('div');
  wrap.className = 'uacc-dept-wrap';
  rows.forEach(function(r) { wrap.appendChild(r); });
  fold.appendChild(wrap);
  container.appendChild(fold);
}

/* resetInviteSetAll() and buildInviteSetAllSlider() lived here until v5.111,
   the invite form's copy of the set-all bar deleted from the user rows in
   v5.107. Same reasoning: role is the toolset, per-tool entries are
   exceptions, and a control for bulk-setting exceptions is an anti-feature.
   It carried the same duplicated navy-header / red-band pair and the same
   rgba() overlays the brand has no tokens for. */

function buildInviteSlider(toolKey, currentLevel, clubLocked, dept, container) {
  var wrap = document.createElement('div');
  wrap.className = 'acc-slider';
  wrap.dataset.toolkey = toolKey;
  /* Cap club users at access */
  if (clubLocked && currentLevel === 'admin') currentLevel = 'access';
  /* Only the levels this tool has — see toolLevels. */
  var LEVELS = toolLevels(STATE.tools && STATE.tools[toolKey]);
  /* Same rule as the user rows: a rung a club role can never hold is not
     drawn, rather than drawn and crossed out. */
  if (clubLocked) LEVELS = LEVELS.filter(function(l) { return l !== 'admin'; });
  var currentIdx = LEVELS.indexOf(currentLevel);
  if (currentIdx === -1) currentIdx = (ACC_LEVELS.indexOf(currentLevel) > 0) ? LEVELS.length - 1 : 0;
  wrap.setAttribute('role', 'radiogroup');
  wrap.setAttribute('aria-label', 'Access level');
  /* Three columns, always — same rule as the user rows: an absent rung is an
     empty cell, so Off sits under Off and Use under Use down the whole list. */
  ACC_LEVELS.forEach(function(level) {
    var idx = LEVELS.indexOf(level);
    if (idx === -1) {
      var gap = document.createElement('div');
      gap.className = 'acc-slider__gap';
      gap.setAttribute('aria-hidden', 'true');
      wrap.appendChild(gap);
      return;
    }
    var isPadlocked = clubLocked && level === 'admin';
    var stop = document.createElement('div');
    stop.className = 'acc-slider__stop';
    if (isPadlocked) {
      stop.classList.add('acc-slider__stop--padlocked');
    } else {
      /* --filled (every rung below the selected one) was applied here and
         styled nowhere — the segments carry the state on their own since the
         track was deleted. Dropped rather than left as a class that looks
         meaningful in the DOM inspector and is not. */
      if (idx === currentIdx) stop.classList.add('acc-slider__stop--active');
    }
    var label = document.createElement('div');
    label.className = 'acc-slider__label';
    label.textContent = ACC_LABELS[level];
    stop.appendChild(label);
    stop.dataset.level = level;

    stop.setAttribute('role', 'radio');
    stop.setAttribute('aria-checked', String(!isPadlocked && idx === currentIdx));
    if (isPadlocked) {
      stop.setAttribute('aria-disabled', 'true');
      stop.title = 'Not available for this role';
    } else {
      stop.tabIndex = (idx === currentIdx) ? 0 : -1;
    }

    if (!isPadlocked) {
      stop.addEventListener('click', function(e) {
        e.stopPropagation();
        currentIdx = idx;
        setSliderLevel(wrap, level);
      });
      stop.addEventListener('keydown', function(e) {
        if (e.key === ' ' || e.key === 'Enter' || e.key === 'Spacebar') {
          e.preventDefault();
          stop.click();
        }
      });
    }
    wrap.appendChild(stop);
  });
  return wrap;
}

function resendInvite(email, btn) {
  if (!email) return;
  btn.textContent = 'Sending...';
  btn.disabled = true;
  nlGasFetch({ action: 'sendInvite', email: email, name: '', role: '', org: '', club: '', jobTitle: '' })
  .then(function(r) { return r.json(); })
  .then(function(result) {
    if (result && result.ok === false) {
      showToast('Failed to resend: ' + (result.error || 'unknown'), 'error');
      btn.disabled    = false;
      btn.textContent = 'Resend invite';
    } else {
      showToast('Invite resent to ' + email, 'success');
      btn.textContent = 'Sent';
    }
  })
  .catch(function() {
    showToast('Failed to resend invite', 'error');
    btn.disabled    = false;
    btn.textContent = 'Resend invite';
  });
}

function initWelcomeEditor() {
  STATE.wmQuill = new Quill('#wmQuillEditor', {
    theme:   'snow',
    modules: { toolbar: [
      ['bold', 'italic', 'underline'],
      [{ list: 'ordered' }, { list: 'bullet' }],
      ['link'],
      ['clean']
    ]}
  });

  loadWmList();

  document.getElementById('wmAddBtn').addEventListener('click', function() {
    clearWmEditor();
    document.getElementById('wmInlineEditor').style.display = 'block';
    document.getElementById('wmTitle').focus();
  });

  document.getElementById('wmCancelBtn').addEventListener('click', function() {
    clearWmEditor();
    document.getElementById('wmInlineEditor').style.display = 'none';
  });

  document.getElementById('wmSaveBtn').addEventListener('click', function() {
    saveWmMessage();
  });
}

function loadWmList() {
  /* Reload the carousel slides so inline Edit/Delete reflect current state */
  loadWelcomeMessages();
}

/* buildWmItem removed -- Edit/Delete now inline on carousel slides */

function loadWmIntoEditor(key, m) {
  document.getElementById('wmTitle').value     = m.title || '';
  document.getElementById('wmEditingKey').value = key;
  document.getElementById('wmEditorHead').textContent = 'Editing message';
  STATE.wmQuill.root.innerHTML = m.content || '';
}

function clearWmEditor() {
  document.getElementById('wmTitle').value      = '';
  document.getElementById('wmEditingKey').value = '';
  document.getElementById('wmEditorHead').textContent = 'New message';
  STATE.wmQuill.setContents([]);
}

function saveWmMessage() {
  var title   = document.getElementById('wmTitle').value.trim();
  var content = STATE.wmQuill.root.innerHTML;
  var key     = document.getElementById('wmEditingKey').value;

  if (!title) { showToast('Please enter a title', 'error'); return; }

  setBtnLoading('wmSaveBtn', true);

  var payload = {
    title:     title,
    content:   content,
    author:    STATE.userData.name || STATE.user.email || '',
    updatedAt: Date.now()
  };

  var ref = key
    ? db.ref('admin/welcome-messages/' + key)
    : db.ref('admin/welcome-messages').push();

  if (!key) payload.createdAt = Date.now();

  var promise = key ? ref.update(payload) : ref.set(payload);

  promise.then(function() {
    setBtnLoading('wmSaveBtn', false, 'Save message');
    clearWmEditor();
    document.getElementById('wmInlineEditor').style.display = 'none';
    writeAudit(key ? 'message_edited' : 'message_created', title);
    showToast('Message saved', 'success');
    loadWmList();
    loadWelcomeMessages(); /* Refresh carousel */
  }).catch(function() {
    setBtnLoading('wmSaveBtn', false, 'Save message');
    showToast('Failed to save message', 'error');
  });
}

function deleteWmMessage(key, btn) {
  btn.textContent = 'Confirm?';
  btn.style.background = 'var(--red)';
  btn.style.color = 'var(--white)';
  var confirmed = false;

  btn.addEventListener('click', function handler() {
    if (!confirmed) {
      confirmed = true;
      db.ref('admin/welcome-messages/' + key).remove()
        .then(function() {
          showToast('Message deleted', 'success');
          loadWmList();
          loadWelcomeMessages();
        })
        .catch(function() { showToast('Failed to delete', 'error'); });
      btn.removeEventListener('click', handler);
    }
  });

  setTimeout(function() {
    if (!confirmed) {
      btn.textContent = 'Delete';
      btn.style.background = '';
      btn.style.color = '';
    }
  }, 3000);
}
</script>
