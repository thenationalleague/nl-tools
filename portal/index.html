  v5.123 (15/09/2026) — Make invites survive the relay 404 for good.
    The googleusercontent relay that carries an Apps Script reply back to the
    browser 404s intermittently — AFTER the script has written the token and
    sent the email — so a "failure" still delivered, and the invite went
    missing from Pending because the client never heard back. Fixed on both
    sides. The portal now mints the invite token itself and sends through
    nlGasSend(), which retries the same payload (same token) until a real reply
    arrives; a clean {ok:false} is a genuine rejection and is not retried.
    The backend (Invite.js v1.5) is idempotent on that token — it will not send
    a second email for a token it has already emailed — so retrying is safe and
    never duplicates. All three invite paths (new invite, resend-from-card,
    bare resend) route through it; a resend mints a fresh token by design so it
    actually re-sends. Ships the portal half on merge; the backend half needs
    one Deploy Apps Script run.
  v5.122 (15/09/2026) — Say what Google sent back when it is not JSON.
    An invite failed with "Unexpected token '<', "<!DOCTYPE "... is not valid
    JSON" — the browser's JSON parser complaining about the first character of
    an HTML page, with the page itself thrown away. Every Apps Script fault
    that matters (authorisation lost, deployment gone, the account blocked,
    Drive's "unable to open the file") arrives as an HTML page, so that
    message hid the one line that would have named the cause. nlGasFetch now
    reads the body as text, parses it itself, and on failure raises an error
    carrying the page's title and first line of text plus the URL the
    response actually came from. Callers are unchanged: the object it resolves
    with still answers .json() (and .text()), so the three sendInvite sites,
    sendApproval and sendRejection keep their .then/.catch chains.

  v5.118 (17/08/2026) — The admin panel comes off the type floor. The v5.115
    sweep mapped by old PIXEL VALUE — anything 8-12px became --text-xs — which

    for "kickers, char counts, fine print", and --text-sm for "secondary text,

    the panel still read small after a sweep that removed every sub-floor size.
    Re-mapped by role: 28 declarations moved to --text-sm — tool names, the

    uppercase kickers, pills, badges and glyphs.

    186px -> 210px; three rungs of "Manage" do not fit 62px cells. Canon's rule
    for that is explicit — the fix for a cramped layout is the layout, not
    smaller type — so below 560px the row stacks and the control goes full
    width, rather than shrinking the text back to fit and undoing the point.

  v5.116 (17/08/2026) — The bits v5.115 missed, reported from a phone as
    near-unreadable. That sweep matched `font-size: Npx` and a clamp() is not

    .uacc-name__secondary — the email address identifying each user row — goes
    from --text-xs to --text-sm. The 12px floor is a minimum for fine print,
    not a target for text people actually read, and this is how you tell one
    person from another in the list.
    The floor test now reads a clamp's floor as well as a plain px, so the
    same class of miss cannot repeat. Verified by injecting clamp(10px,...).
    Contrast was measured and is not the problem: --text-muted is 5.50:1 on
    white, comfortably past AA. It was size.

  v5.115 (17/08/2026) — Brand sweep, pass two: the text is not tiny any more.

    Mapping: 8-12px to --text-xs, 13-15px to --text-sm, 16-17 --text-base, 18

    sub-floor sizes, so .table th, .pill, every form label and the whole topbar

  v5.102 (17/08/2026) — Access levels become per-tool. New toolLevels(tool) reads

    falls back to the full three, so an unmigrated or badly-edited record behaves
    exactly as before and can never silently remove an access state. Only a
    PREFIX of off/access/admin is honoured (drop the top rung, never punch a hole).
    Each stop now carries data-level and the readers use it instead of mapping
    stop INDEX back to ACC_LEVELS, which only held while every slider had three
    stops. setSliderLevel clamps to the highest rung a tool has, so a dept
    "set all to Manage" no longer leaves two-level tools with nothing selected.
    Inert until records declare `levels`.

<style>/* ────────────────────────────────────────────────────────────────
   Portal-specific CSS. Shared foundation from /system/nl-brand.css:
     - Fonts (@font-face carbona)
     - Design tokens (:root variables)
     - Reset (*, body, html)
     - Topbar (.topbar + full component)
     - Buttons (.btn + variants)
     - Section header (.section-head)
   Portal-specific patterns kept here: welcome carousel, tool tiles,
   admin panel, users accordion, invite form, audit log, pills (role-*),
   toast (different class pattern), auth overlay.
   (.banner + variants promoted to nl-brand.css v2.40 — the guard banner
   markup below uses the canon classes directly.)
   ──────────────────────────────────────────────────────────────── */

/* -- Page body ------------------------------------------------------------- */
/* .page-body sizing inherited from nl-brand.css (universal container rule) */

/* -- Auth loading overlay -------------------------------------------------- */
@keyframes nlSpin { to { transform: rotate(360deg); } }
.auth-overlay {
  position: fixed;
  inset: 0;
  background: var(--primary);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
}
.auth-overlay__spinner {
  width: 36px; height: 36px;
  border: 3px solid var(--navy-300);
  border-top-color: var(--white);
  border-radius: 50%;
  animation: nlSpin 0.7s linear infinite;
}

/* -- Welcome carousel ------------------------------------------------------ */
.noticeboard-wrap {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  margin-bottom: 32px;
  overflow: hidden;
}
.noticeboard-header {
  display: flex;
  align-items: center;
  padding: 14px 20px;
  border-bottom: 1px solid var(--border);
}
.noticeboard-header.open { border-bottom-color: var(--border); }
.noticeboard-header__icon { font-size: var(--text-md); margin-right: 12px; }
.noticeboard-header__title {
  flex: 1;
  font-size: var(--text-sm);
  font-weight: 700;
  font-variation-settings: 'wght' 700;
  color: var(--text);
}
.noticeboard-header__count {
  font-size: var(--text-sm);
  color: var(--text-muted);
  margin-right: 10px;
}

.noticeboard-body { display: none; padding: 0; }
.noticeboard-body.open { display: block; }

.noticeboard-slides { position: relative; }
.noticeboard-slide {
  padding: 20px 24px;
  border-bottom: 1px solid var(--border);
  display: none;
}
.noticeboard-slide.active { display: block; }
.noticeboard-slide__title {
  font-size: var(--text-base);
  font-weight: 700;
  font-variation-settings: 'wght' 700;
  color: var(--text);
  margin-bottom: 8px;
}
.noticeboard-slide__content { font-size: var(--text-sm); color: var(--text-muted); line-height: 1.6; }
.noticeboard-slide__content p { margin-bottom: 8px; }
.noticeboard-slide__content p:last-child { margin-bottom: 0; }
.noticeboard-slide__content strong,
.noticeboard-slide__content b {
  font-weight: 700;
  font-variation-settings: 'wght' 700;
}

.noticeboard-nav {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 20px;
}
.noticeboard-nav__btn {
  background: none;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 5px 12px;
  font-size: var(--text-sm);
  font-weight: 700;
  font-variation-settings: 'wght' 700;
  cursor: pointer;
  font-family: var(--font);
  color: var(--text-muted);
  transition: all 0.15s;
  /* Seats an icon beside the label, as canon .btn does. */
  display: inline-flex; align-items: center; gap: 6px;
}
.noticeboard-nav__btn:hover { border-color: var(--navy); color: var(--navy); }
.noticeboard-nav__btn:disabled { opacity: 0.35; cursor: default; }
.noticeboard-nav__dots { display: flex; gap: 5px; flex: 1; justify-content: center; }
.noticeboard-nav__dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--border);
  border: none;
  cursor: pointer;
  padding: 0;
  transition: background 0.15s;
}
.noticeboard-nav__dot.active { background: var(--primary); }
.noticeboard-empty {
  padding: 24px;
  text-align: center;
  color: var(--text-muted);
  font-size: var(--text-sm);
}

/* -- Favourites ------------------------------------------------------------ */
.tool-tile--starred {
  background: var(--blue-light);
  border-top-color: var(--navy) !important;
  /* CANON CANDIDATE (17/08/2026): a navy-tinted glow marking a starred tile,
     and the text-shadow below it. Portal identity today — the only starred
     thing in the estate — so it stays local per the one-off rule. If a second
     tool grows a "pinned/favourite" surface, this pair is the thing to
     promote, not another hand-mixed navy wash. rgb(34,59,124) is --navy. */
  box-shadow: 0 2px 16px color-mix(in srgb, var(--navy) 15%, transparent);
}
.tool-tile__star {
  position: absolute;
  top: 10px;
  right: 10px;
  background: none;
  border: none;
  cursor: pointer;
  font-size: var(--text-lg);
  line-height: 1;
  opacity: 0.4; /* was 0.2 — near-invisible (1.3:1); the favourite affordance must be discoverable */
  transition: opacity 0.15s, transform 0.15s, color 0.15s;
  padding: 4px;
  color: var(--text-muted);
  z-index: 2;
}
.tool-tile__star:hover { opacity: 0.7; transform: scale(1.1); color: var(--navy); }
.tool-tile__star:focus-visible { outline: none; opacity: 0.9; box-shadow: var(--focus-ring); border-radius: 6px; }
.tool-tile--starred .tool-tile__star {
  opacity: 1;
  color: var(--navy);
  font-size: var(--text-lg);
  text-shadow: 0 1px 4px color-mix(in srgb, var(--navy) 30%, transparent);
}
.tool-tile { position: relative; } /* needed for absolute star */

/* -- Tool section headings ------------------------------------------------- */
.tools-section__head {
  font-size: var(--text-xs);
  font-weight: 900;
  font-variation-settings: 'wght' 900;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  color: var(--text-muted);
  padding: 0 0 10px 0;
  border-bottom: 1px solid var(--border);
  margin-bottom: 20px;
}

/* -- Tool section spacing -------------------------------------------------- */
#staffToolsSection + #clubToolsSection .section-head { margin-top: 40px; }

/* -- Tool tile grid -------------------------------------------------------- */
.tool-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(clamp(200px, 18vw, 280px), 1fr));
  gap: clamp(14px, 1vw, 20px);
  margin-bottom: 36px;
}
.tool-tile {
  background: var(--white);
  border: 1px solid var(--border);
  border-top: 3px solid var(--border);
  border-radius: var(--radius);
  padding: clamp(20px, 1.5vw, 28px) clamp(18px, 1.25vw, 24px);
  cursor: pointer;
  text-decoration: none;
  color: var(--text);
  display: flex;
  flex-direction: column;
  gap: 10px;
  transition: box-shadow 0.15s, border-color 0.15s, transform 0.1s;
  box-shadow: var(--shadow);
  position: relative;
}
.tool-tile--admin  { border-top-color: var(--primary); }
.tool-tile--access { border-top-color: var(--navy); }
/* "Off" tiles are de-emphasised via a neutral border + muted icon, NOT by
   fading the whole tile — container opacity dropped the description text below
   WCAG AA (2.5:1). Text now stays at full --text-muted contrast (5.5:1). */
.tool-tile--off    { border-top-color: var(--border); }
.tool-tile--off .tool-tile__icon { opacity: 0.5; }
.tool-tile--off .tool-tile__name { color: var(--text-muted); }
.tool-tile:hover {
  border-color: var(--navy);
  box-shadow: var(--shadow-lg);
  transform: translateY(-1px);
}
.tool-tile--placeholder {
  opacity: 0.55;
  cursor: default;
}
.tool-tile--placeholder:hover {
  border-color: var(--border);
  box-shadow: var(--shadow);
  transform: none;
}
.tool-tile__icon { font-size: clamp(28px, 1.8vw, 38px); line-height: 1; }
.tool-tile__name {
  /* Was clamp(13px, 0.9vw, 16px) — a hand-rolled scale that predates the
     tokens and escaped the v5.115 sweep, because that pass matched plain px
     and a clamp is not plain px. */
  font-size: var(--text-base);
  font-weight: 800;
  font-variation-settings: 'wght' 800;
  color: var(--text);
  line-height: 1.2;
}
.tool-tile__desc {
  /* Was clamp(11px, 0.7vw, 13px). The 11px floor put this BELOW the brand
     minimum on every phone — reported as near-unreadable, and correctly. It
     survived the sweep for the same reason as the title above.
     --text-sm, not --text-xs: this is the sentence explaining what a tool
     does, which is reading text, and the 12px floor is a minimum for fine
     print rather than a target for prose. */
  font-size: var(--text-sm);
  color: var(--text-muted);
  line-height: 1.4;
  flex: 1;
}
.tool-tile__badge {
  position: absolute;
  top: 10px;
  right: 10px;
  background: var(--primary);
  color: var(--white);
  border-radius: 10px;
  font-size: var(--text-xs);
  font-weight: 900;
  font-variation-settings: 'wght' 900;
  padding: 2px 6px;
  min-width: 18px;
  text-align: center;
}
.tool-tile__soon {
  font-size: var(--text-xs);
  font-weight: 800;
  font-variation-settings: 'wght' 800;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-muted);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 2px 6px;
  align-self: flex-start;
}

/* -- Keyboard focus indicators --------------------------------------------- */
/* The shared .btn/.tab/input widgets already carry :focus-visible from
   nl-brand.css. These portal-specific custom controls did not — keyboard
   focus was invisible on them. Wire the canonical --focus-ring token in. */
.noticeboard-nav__btn:focus-visible,
.noticeboard-nav__dot:focus-visible,
.tool-tile:focus-visible {
  outline: none;
  box-shadow: var(--focus-ring);
}
.tool-tile:focus-visible { border-color: var(--navy); }

/* -- Toast notifications --------------------------------------------------- */
/* Canon owns .toast (nl-brand.css). This file shadowed it with a full second
   definition — 13px/700 sentence case against canon's 11px/800 uppercase, and
   solid-fill success/error/info against canon's coloured left border. So the
   portal's toasts were the only ones in the estate that did not look like NL
   toasts, and showToast() has delegated to NL.toast for long enough that the
   markup was already canon's. Deleted; NL.toast styles itself.
   Note the class names differed too: this file styled .toast.success while
   canon uses .toast--success, so the type colour was coming from here alone
   and is now canon's border treatment. */

</style>

<body>

<!-- Auth loading overlay -->
<div class="auth-overlay" id="authOverlay" role="status" aria-live="polite" aria-label="Signing you in…">
  <div class="auth-overlay__spinner"></div>
</div>

<!-- Main page (hidden until auth ready) -->
<div id="pageWrap" style="display:none">

  <!-- Topbar — auto-rendered by /system/nl-topbar.js from window.NL_TOOL -->
  <div id="nlTopbar"></div>

  <!-- Page body -->
  <div class="page-body">

    <!-- Guard banner (shown if redirected with ?guard= param) -->
    <div id="guardBanner"></div>

    <!-- Welcome carousel -->
    <div class="noticeboard-wrap" id="noticeboardWrap">
      <div class="noticeboard-header open" id="noticeboardHeader">
        <span class="noticeboard-header__icon">📣</span>
        <span class="noticeboard-header__title">Noticeboard</span>
        <span class="noticeboard-header__count" id="noticeboardCount"></span>
        <div id="wmAdminBtn" style="display:none">
          <button class="btn btn--ghost btn--sm" id="wmAddBtn">+ Add message</button>
        </div>
      </div>
      <div class="noticeboard-body open" id="noticeboardBody">
        <!-- Inline message editor (admin/superadmin only) -->
        <div id="wmInlineEditor" style="display:none;border-bottom:1px solid var(--border);padding:20px 24px;background:var(--off-white);">
          <div style="font-size:var(--text-xs);font-weight:800;font-variation-settings:'wght' 800;text-transform:uppercase;letter-spacing:0.1em;color:var(--text-muted);margin-bottom:12px;" id="wmEditorHead">New message</div>
          <div style="margin-bottom:12px;">
            <label style="display:block;font-size:var(--text-xs);font-weight:800;font-variation-settings:'wght' 800;text-transform:uppercase;letter-spacing:0.1em;color:var(--text-muted);margin-bottom:6px;">Title</label>
            <input type="text" id="wmTitle" placeholder="Message title" style="width:100%;border:1px solid var(--border);border-radius:var(--radius);padding:9px 12px;font-size:var(--text-sm);font-family:var(--font);outline:none;">
          </div>
          <div style="margin-bottom:12px;">
            <label style="display:block;font-size:var(--text-xs);font-weight:800;font-variation-settings:'wght' 800;text-transform:uppercase;letter-spacing:0.1em;color:var(--text-muted);margin-bottom:6px;">Content</label>
            <div id="wm-quill-container"><div id="wmQuillEditor"></div></div>
          </div>
          <div style="display:flex;gap:8px;">
            <button class="btn btn--ghost btn--sm" id="wmCancelBtn">Cancel</button>
            <button class="btn btn--primary btn--sm" id="wmSaveBtn">Save message</button>
          </div>
          <input type="hidden" id="wmEditingKey">
        </div>
        <div class="noticeboard-slides" id="noticeboardSlides"></div>
        <div class="noticeboard-nav" id="noticeboardNav" style="display:none">
          <button class="noticeboard-nav__btn" id="wNavPrev"><svg class="icon icon--sm" aria-hidden="true"><use href="/assets/icons/sprites.svg#icon-back"></use></svg> Prev</button>
          <div class="noticeboard-nav__dots" id="wNavDots"></div>
          <button class="noticeboard-nav__btn" id="wNavNext">Next <svg class="icon icon--sm" aria-hidden="true"><use href="/assets/icons/sprites.svg#icon-forward"></use></svg></button>
        </div>
      </div>
    </div>

    <!-- Tool sections — staff see two sections, clubs see one -->
    <div id="staffToolsSection" style="display:none;">
      <div class="tools-section__head">Staff Tools</div>
      <div class="tool-grid" id="staffToolGrid"><!-- Populated by JS --></div>
    </div>

    <div id="clubToolsSection" style="display:none;">
      <div class="tools-section__head" style="margin-top:36px;">Club Tools</div>
      <div class="tool-grid" id="clubToolGrid"><!-- Populated by JS --></div>
    </div>

    <!-- Website — the staff layer over the fan-facing widgets on the public
         site (registry shelf: 'website'). Renders only when a visible tool
         carries it. -->
    <div id="webToolsSection" style="display:none;">
      <div class="tools-section__head" style="margin-top:36px;">Website</div>
      <div class="tool-grid" id="webToolGrid"><!-- Populated by JS --></div>
    </div>

    <!-- In Progress — registry status: 'wip'. Shelving only: who can open a
         tool here is decided by its defaults and grants exactly as anywhere
         else. Promote a tool by deleting its status. -->
    <div id="wipToolsSection" style="display:none;">
      <div class="tools-section__head" style="margin-top:36px;">In Progress</div>
      <div class="tool-grid" id="wipToolGrid"><!-- Populated by JS --></div>
    </div>

    <!-- Meta — tools ABOUT the estate rather than of it (estate map, style
         guide). Third `audience` value: for access it behaves exactly as
         'staff' (toolAudience maps it, auth-guard hard-gates it to league
         roles), and only this shelf split reads the raw value. Renders only
         when a visible tool carries it, so for everyone but superadmin it
         simply never exists. -->
    <div id="metaToolsSection" style="display:none;">
      <div class="tools-section__head" style="margin-top:36px;">Meta</div>
      <div class="tool-grid" id="metaToolGrid"><!-- Populated by JS --></div>
    </div>

    <!-- Club users: single flat grid -->
    <div id="clubFlatSection" style="display:none;">
      <div class="tool-grid" id="clubFlatGrid"><!-- Populated by JS --></div>
    </div>



  </div><!-- /page-body -->
</div><!-- /pageWrap -->

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ---- Firebase init already done in <head> before auth-guard loads --------- */
var auth = firebase.auth();
var db   = firebase.database();

/* ---- Constants ----------------------------------------------------------- */
var LOGIN_URL      = '/';

/* ---- State --------------------------------------------------------------- */

/* ---- Version ------------------------------------------------------------- */
/* Version is shown via the topbar's clickable version badge (window.NL_CHANGELOG),
   which nl-topbar gates to league roles. The kicker stays the plain 'Portal'
   label so club users see no version detail. */

var STATE = {
  uid:      null,
  user:     null,      /* Firebase Auth user */
  userData: null,      /* RTDB user record */
  role:     '',
  tools:    {},        /* tools catalogue from RTDB */
  toolsList: [],
  isAdmin:      false,
  isSuperAdmin: false,
  wmQuill:  null,
  wmSlide:  0,
  wmSlides: []
};

/* ---- Helpers ------------------------------------------------------------- */
/* ---- Access level helpers ------------------------------------------------ */
function getAccessLevel(uid, toolKey) {
  if (STATE.isSuperAdmin && uid === STATE.uid) return 'admin';
  var ud = (uid === STATE.uid) ? STATE.userData : null;
  if (!ud) return 'off';
  if (ud.role === 'superadmin') return 'admin';
  /* The same resolver auth-guard uses (v5.125). This used to be its own copy,
     and it disagreed with the guard on two inputs: a legacy {access,admin}
     object and a stored `false` both fell through to the role default here,
     while the guard read them as written. Either one showed a card whose
     tool then turned the user away. One answer, from one place. */
  /* v15.6: with an issued pass, the pass decides, as auth-guard v16.0 does
     at the door (window.nlPassDecides is its switch), so a card shows only
     where the door will open. Manage is the old 'admin'. */
  if (window.nlPassDecides && NL.pass && NL.pass.isIssued(ud.pass)) {
    var lv = NL.pass.level(ud.pass, STATE.tools[toolKey]);
    return lv === 'manage' ? 'admin' : lv;
  }
  var entry = ud.tools ? ud.tools[toolKey] : undefined;
  return NL.resolveToolLevel(entry, STATE.tools[toolKey], ud.role);
}

/* A tool's rungs: its registry `levels` when that is a prefix of
   off / access / admin, else all three. The tile clamps to them. */
var ACC_LEVELS = ['off', 'access', 'admin'];
function toolLevels(tool) {
  var declared = tool && tool.levels;
  if (!Array.isArray(declared) || !declared.length) return ACC_LEVELS;
  var isPrefix = declared.every(function(l, i) { return l === ACC_LEVELS[i]; });
  return isPrefix ? declared : ACC_LEVELS;
}

function isClubRole(r) {
  if (window.NL && NL.isClubUser) return NL.isClubUser(r);
  return r === 'club-admin' || r === 'club-staff' || r === 'club-viewer' || r === 'club';
}
/* Canonical staff/club split for a tool RECORD — the `audience` field is the
   source of truth. Falls back to the club-admin-default heuristic only for a
   record that somehow lacks the audience field (all live records have it). */
function toolAudience(tool) {
  if (!tool) return 'club';
  /* 'meta' is an audience for ACCESS purposes identical to 'staff' — league
     roles only, never club, never on invite/request cards. Mapping it here
     means every consumer of toolAudience inherits the staff protections
     without knowing meta exists. Only the portal's shelf split reads the raw
     value (see isMetaTool). */
  if (tool.audience === 'meta') return 'staff';
  /* 'league' is the canonical value; 'staff' is the legacy spelling, kept
     accepted so a part-migrated registry can't mis-shelve a tool. Both mean
     league roles only. This function's return value stays 'staff' because
     every caller branches on staff-vs-club, not on the registry wording. */
  if (tool.audience === 'league' || tool.audience === 'staff') return 'staff';
  if (tool.audience === 'club') return 'club';
  return (((tool.defaults && tool.defaults['club-admin']) || 'off') !== 'off') ? 'club' : 'staff';
}
function showToast(msg, type) {
  /* Delegates to NL.toast (shared widget) — keeps all 41 portal callers working */
  if (window.NL && window.NL.toast) { NL.toast(msg, type); return; }
  /* Fallback for a page that somehow loaded without nl-utils. It used the
     old .toast.success class pattern, which stopped meaning anything the
     moment this file's shadow copy of .toast went — canon's modifier is
     .toast--success. Corrected so the fallback still looks like a toast. */
  var t = document.getElementById('toast');
  if (!t) return;
  t.textContent = msg;
  t.className = 'toast toast--' + (type || 'success') + ' show';
  setTimeout(function() { t.classList.remove('show'); }, 3500);
}

function showMsg(id, text, type) {
  var el = document.getElementById(id);
  if (!el) return;
  /* Announce to assistive tech: errors assertively, info/success politely. */
  el.setAttribute('role', type === 'error' || !type ? 'alert' : 'status');
  el.setAttribute('aria-live', type === 'error' || !type ? 'assertive' : 'polite');
  el.textContent = text;
  el.className = 'msg msg--' + (type || 'error') + ' show';
}

function hideMsg(id) {
  var el = document.getElementById(id);
  if (el) el.className = 'msg';
}

function setBtnLoading(id, loading, label) {
  var btn = document.getElementById(id);
  if (!btn) return;
  btn.disabled = loading;
  if (loading) {
    btn.dataset.label = btn.textContent;
    var sp = document.createElement('span');
    sp.className = 'btn-spinner';
    btn.innerHTML = '';
    btn.appendChild(sp);
  } else {
    btn.textContent = label || btn.dataset.label || btn.textContent;
  }
}

function removeOverlay() {
  var ov = document.getElementById('authOverlay');
  if (ov) ov.parentNode.removeChild(ov);
}

/* ---- Guard banner -------------------------------------------------------- */
function showGuardBanner() {
  var params = new URLSearchParams(window.location.search);
  var guard  = params.get('guard');
  if (!guard) return;

  /* Clean the URL */
  var clean = window.location.pathname;
  window.history.replaceState({}, '', clean);

  var container = document.getElementById('guardBanner');
  var div = document.createElement('div');

  if (guard === 'denied') {
    div.className = 'banner banner--error';
    div.textContent = 'You do not have access to that tool. Contact an administrator to request access.';
  } else if (guard === 'pending') {
    div.className = 'banner banner--amber';
    div.textContent = 'Your account is pending approval. You will receive an email once access has been granted.';
  } else if (guard === 'error') {
    div.className = 'banner banner--error';
    div.textContent = 'There was a problem checking your access. Please try signing out and back in.';
  }

  container.appendChild(div);
}

/* ---- Auth ---------------------------------------------------------------- */
auth.onAuthStateChanged(function(user) {
  if (!user) {
    window.location.replace(LOGIN_URL);
    return;
  }
  STATE.user = user;
  STATE.uid  = user.uid;

  db.ref('users/' + user.uid).once('value')
    .then(function(snap) {
      if (!snap.exists()) {
        window.location.replace(LOGIN_URL);
        return;
      }
      STATE.userData = snap.val();
      STATE.role       = STATE.userData.role || '';
      STATE.isSuperAdmin = STATE.role === 'superadmin';
      STATE.isAdmin      = STATE.role === 'admin' || STATE.isSuperAdmin;

      /* pending flag cleared by login page after account creation */

      /* Write session for tool page auth -- read by auth-guard.js v3.0 */
      if (window.nlSession) {
        window.nlSession.write(user.uid, STATE.userData);
      }

      /* Set NL.session and render topbar (auth-guard exits early on portal,
         so we render the topbar manually once we have user data) */
      var sessionObj = {
        uid:     STATE.uid,
        email:   STATE.user.email,
        name:    STATE.userData.name || '',
        role:    STATE.role,
        /* org/orgKey removed from model */
        org: '', orgKey: '',
        club:    STATE.userData.club || '',
        tools:   STATE.userData.tools || {},
        /* v15.3: the pass, for the small pass in the menu. Display only. */
        pass:    STATE.userData.pass || null
      };
      if (window.NL) window.NL.session = sessionObj;
      if (window.NL && window.NL.renderTopbar) {
        window.NL.renderTopbar(sessionObj);
      }

      loadTools().then(function() {
        initPortal();
        /* Only audit when the user actually pressed Sign In on /.
           The login page sets nl_fresh_signin in sessionStorage just before
           calling signInWithEmailAndPassword; we consume + clear it here so
           subsequent portal loads (navigation, refresh) don't re-log. */
        var freshSignin = false;
        try {
          freshSignin = sessionStorage.getItem('nl_fresh_signin') === '1';
          if (freshSignin) sessionStorage.removeItem('nl_fresh_signin');
        } catch (e) {}
        if (freshSignin) {
          writeAudit('signed_in', 'Portal loaded');
        }
      });
    })
    .catch(function() {
      window.location.replace(LOGIN_URL);
    });
});

/* ---- Load tools catalogue ------------------------------------------------ */
function loadTools() {
  /* v15.8: live grants applied (NL.pass.loadRegistry), so cards follow the
     same answer as the door. */
  return NL.pass.loadRegistry(db).then(function(reg) {
    if (reg && Object.keys(reg).length) {
      STATE.tools = reg;
      STATE.toolsList = Object.keys(STATE.tools).map(function(k) {
        var t = STATE.tools[k];
        t._key = k;
        return t;
      });
    }
  }).catch(function() {});
}

/* ---- Init portal --------------------------------------------------------- */
/* The admin area's old links (?tab=…, in bookmarks and the admin
   notification emails) go where each part lives now. v15.5. */
var MOVED_TABS = {
  users: '/people/', invites: '/people/?tab=invites', requests: '/people/?tab=requests',
  inbound: '/people/?tab=requests', audit: '/audit/'
};

function initPortal() {
  var tabParam = new URLSearchParams(window.location.search).get('tab');
  if (tabParam && MOVED_TABS[tabParam]) { window.location.replace(MOVED_TABS[tabParam]); return; }
  removeOverlay();
  document.getElementById('pageWrap').style.display = 'block';

  showGuardBanner();
  /* renderTopbar now via nl-topbar.js; called automatically on auth */
  loadWelcomeMessages();
  renderToolGrid();

  if (STATE.isAdmin) {
    initWelcomeEditor();
    /* Show admin controls in carousel header */
    document.getElementById('wmAdminBtn').style.display = 'block';
  }

/* signOut handler now in topbar profile dropdown (nl-topbar.js) */
}

/* renderTopbar removed — now handled by nl-topbar.js */

/* ---- Welcome carousel ---------------------------------------------------- */
function loadWelcomeMessages() {
  db.ref('admin/welcome-messages').once('value').then(function(snap) {
    var val = snap.val();
    var wmBody = document.getElementById('noticeboardBody');
    var oldEmpties = wmBody.querySelectorAll('.noticeboard-empty');
    for (var ei = 0; ei < oldEmpties.length; ei++) oldEmpties[ei].parentNode.removeChild(oldEmpties[ei]);
    document.getElementById('noticeboardSlides').innerHTML = '';
    document.getElementById('wNavDots').innerHTML = '';
    document.getElementById('noticeboardNav').style.display = 'none';
    var wmCountEl = document.getElementById('noticeboardCount');
    if (wmCountEl) wmCountEl.textContent = '';
    /* Firebase returns "" for an empty node created in console */
    if (!val || typeof val !== 'object') {
      renderWelcomeEmpty();
      return;
    }
    var msgs = Object.keys(val).map(function(k) {
      var m = val[k]; m._key = k; return m;
    }).sort(function(a, b) {
      return (b.createdAt || 0) - (a.createdAt || 0);
    });
    STATE.wmSlides = msgs;
    STATE.wmSlide  = 0;
    renderWelcomeSlides();
  }).catch(function() { renderWelcomeEmpty(); });
}

function renderWelcomeEmpty() {
  var body = document.getElementById('noticeboardBody');
  if (body.querySelector('.noticeboard-empty')) return;
  var div  = document.createElement('div');
  div.className = 'noticeboard-empty';
  div.textContent = 'No announcements at the moment.';
  body.appendChild(div);
}

function renderWelcomeSlides() {
  var msgs    = STATE.wmSlides;
  var slides  = document.getElementById('noticeboardSlides');
  var nav     = document.getElementById('noticeboardNav');
  var dots    = document.getElementById('wNavDots');
  var count   = document.getElementById('noticeboardCount');

  slides.innerHTML = '';
  dots.innerHTML   = '';

  if (msgs.length === 0) { renderWelcomeEmpty(); return; }

  count.textContent = msgs.length + (msgs.length === 1 ? ' message' : ' messages');

  msgs.forEach(function(m, i) {
    var slide = document.createElement('div');
    slide.className = 'noticeboard-slide' + (i === 0 ? ' active' : '');
    slide.dataset.idx = i;

    /* Title + admin actions row */
    var titleRow = document.createElement('div');
    titleRow.style.cssText = 'display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:4px;';

    var title = document.createElement('div');
    title.className = 'noticeboard-slide__title';
    title.style.flex = '1';
    title.textContent = m.title || '';
    titleRow.appendChild(title);

    /* Admin Edit/Delete buttons inline */
    if (STATE.isAdmin) {
      var adminActions = document.createElement('div');
      adminActions.style.cssText = 'display:flex;gap:6px;flex-shrink:0;';
      var editBtn = document.createElement('button');
      editBtn.className = 'btn btn--ghost btn--sm';
      editBtn.textContent = 'Edit';
      editBtn.addEventListener('click', function(e) { e.stopPropagation(); loadWmIntoEditor(m._key, m); document.getElementById('wmInlineEditor').style.display = 'block'; });
      var delBtn = document.createElement('button');
      delBtn.className = 'btn btn--danger btn--sm';
      delBtn.textContent = 'Delete';
      delBtn.addEventListener('click', function(e) { e.stopPropagation(); deleteWmMessage(m._key, delBtn); });
      adminActions.appendChild(editBtn);
      adminActions.appendChild(delBtn);
      titleRow.appendChild(adminActions);
    }

    /* Date line -- shown to everyone */
    var dateLine = document.createElement('div');
    dateLine.style.cssText = 'font-size:var(--text-sm);color:var(--text-muted);margin-bottom:10px;';
    dateLine.textContent = 'By ' + (m.author || 'The National League') +
      (m.createdAt ? '  —  ' + NL.formatDate(m.createdAt) : '');   // canon '17 April 2026'

    var msgContent = document.createElement('div');
    msgContent.className = 'noticeboard-slide__content';
    /* content is stored as HTML from Quill — safe to set as innerHTML
       since only admins can write it */
    msgContent.innerHTML = m.content || '';

    slide.appendChild(titleRow);
    slide.appendChild(dateLine);
    slide.appendChild(msgContent);
    slides.appendChild(slide);

    var dot = document.createElement('button');
    dot.className = 'noticeboard-nav__dot' + (i === 0 ? ' active' : '');
    dot.dataset.idx = i;
    dot.setAttribute('aria-label', 'Go to message ' + (i + 1));
    if (i === 0) dot.setAttribute('aria-current', 'true');
    dot.addEventListener('click', function() { goWelcomeSlide(parseInt(dot.dataset.idx)); });
    dots.appendChild(dot);
  });

  if (msgs.length > 1) nav.style.display = 'flex';

  document.getElementById('wNavPrev').addEventListener('click', function() {
    goWelcomeSlide(STATE.wmSlide - 1);
  });
  document.getElementById('wNavNext').addEventListener('click', function() {
    goWelcomeSlide(STATE.wmSlide + 1);
  });

  updateWelcomeNav();

  /* Always open */
}


function goWelcomeSlide(idx) {
  var msgs = STATE.wmSlides;
  idx = Math.max(0, Math.min(msgs.length - 1, idx));
  STATE.wmSlide = idx;

  document.querySelectorAll('.noticeboard-slide').forEach(function(s, i) {
    s.classList.toggle('active', i === idx);
  });
  document.querySelectorAll('.noticeboard-nav__dot').forEach(function(d, i) {
    d.classList.toggle('active', i === idx);
    if (i === idx) { d.setAttribute('aria-current', 'true'); }
    else { d.removeAttribute('aria-current'); }
  });
  updateWelcomeNav();
}

function updateWelcomeNav() {
  var prev = document.getElementById('wNavPrev');
  var next = document.getElementById('wNavNext');
  if (prev) prev.disabled = STATE.wmSlide === 0;
  if (next) next.disabled = STATE.wmSlide === STATE.wmSlides.length - 1;
}

/* ---- Tool tile grid ------------------------------------------------------ */
/* ── Favourites — persisted per user in RTDB at /users/{uid}/favourites ── */
function getFavourites() {
  var ud = STATE.userData;
  return ud && ud.favourites ? ud.favourites : {};
}

function toggleFavourite(toolKey) {
  var favs = getFavourites();
  var isStarred = !!favs[toolKey];
  var ref = firebase.database().ref('users/' + STATE.uid + '/favourites/' + toolKey);
  if (isStarred) {
    ref.remove();
    if (STATE.userData.favourites) delete STATE.userData.favourites[toolKey];
  } else {
    ref.set(true);
    if (!STATE.userData.favourites) STATE.userData.favourites = {};
    STATE.userData.favourites[toolKey] = true;
  }
  renderToolGrid();
}

function renderToolGrid() {
  var ud      = STATE.userData;
  var tools   = STATE.toolsList;
  var isClub  = ud && isClubRole(ud.role);
  var favs    = getFavourites();
  /* v15.9: a Club card holder (club logins) reaches a tool that has a club
     page (`clubUrl`) there, whatever its audience: My pass and the door
     both open it (NL.pass.explain, v1.55), so the portal shows it too, on
     the Club shelf. Without this the card was on My pass and missing here. */
  var clubCard = !!(ud && NL.pass && NL.pass.isIssued(ud.pass) && ud.pass.base === 'club');
  function viaClubPage(t) { return clubCard && !!t.tool.clubUrl; }

  /* Collect visible tools, sorted: starred first then alphabetical */
  var myTools = [];
  tools.forEach(function(t) {
    if (t._key === 'welcome') return;
    var level = getAccessLevel(STATE.uid, t._key);
    if (level !== 'access' && level !== 'admin') return;  /* off = no access */
    myTools.push({ key: t._key, tool: t, level: level });
  });

  /* Sort: starred first, then alphabetical by label */
  myTools.sort(function(a, b) {
    var aStarred = !!favs[a.key];
    var bStarred = !!favs[b.key];
    if (aStarred !== bStarred) return aStarred ? -1 : 1;
    return (a.tool.label || a.key).localeCompare(b.tool.label || b.key);
  });

  /* Split by type: a "club tool" is one club roles can reach (club-admin
     default is not 'off'); everything else is a staff tool.
     `shelf: 'club'` moves a League-only console onto the Club Tools shelf
     without opening it to club roles: Programme Packs and DAZN serve clubs
     through their own pages, and their portal cards are the staff layer on
     top. Shelf only — audience still decides who can be granted the tool. */
  function isClubTool(t) { return t.tool.shelf === 'club' || toolAudience(t.tool) === 'club' || viaClubPage(t); }
  function isMetaTool(t) { return t.tool.audience === 'meta'; }
  /* v5.125: two more shelves, both read straight off the registry and neither
     touching access. `status: 'wip'` gathers unfinished tools on In Progress,
     whoever can open them; `shelf: 'website'` is the staff layer over the
     fan-facing widgets on the public site. Precedence: meta, then in
     progress, then website, then club/staff — a card sits on one shelf only. */
  function isWipTool(t) { return t.tool.status === 'wip'; }
  function isWebTool(t) { return t.tool.shelf === 'website'; }
  /* Same structural boundary as auth-guard's audience gate: a club role never
     gets a card for a league or meta tool, whatever a stray grant says, so
     the portal cannot offer a door the guard will refuse. */
  if (isClub) {
    myTools = myTools.filter(function(t) { return toolAudience(t.tool) !== 'staff' || viaClubPage(t); });
  }
  var metaTools  = myTools.filter(isMetaTool);
  var rest       = myTools.filter(function(t) { return !isMetaTool(t); });
  var wipTools   = rest.filter(isWipTool);
  rest           = rest.filter(function(t) { return !isWipTool(t); });
  var webTools   = rest.filter(isWebTool);
  rest           = rest.filter(function(t) { return !isWebTool(t); });
  var staffTools = rest.filter(function(t) { return !isClubTool(t); });
  var clubTools  = rest.filter(isClubTool);

  function populateGrid(gridId, items) {
    var grid = document.getElementById(gridId);
    if (!grid) return;
    grid.innerHTML = '';
    if (items.length === 0) {
      var empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.style.gridColumn = '1 / -1';
      var icon = document.createElement('div');
      icon.className = 'empty-state__icon';
      icon.textContent = '🔒';
      var text = document.createElement('div');
      text.className = 'empty-state__text';
      text.textContent = 'No tools available.';
      empty.appendChild(icon); empty.appendChild(text);
      grid.appendChild(empty);
      return;
    }
    items.forEach(function(item) {
      grid.appendChild(buildToolTile(item.key, item.tool, item.level));
    });
  }

  if (isClub) {
    /* Club users — flat list of club-facing tools only */
    document.getElementById('staffToolsSection').style.display = 'none';
    document.getElementById('clubToolsSection').style.display = 'none';
    document.getElementById('metaToolsSection').style.display = 'none';
    document.getElementById('webToolsSection').style.display = 'none';
    document.getElementById('wipToolsSection').style.display = 'none';
    document.getElementById('clubFlatSection').style.display = '';
    /* Clubs see one flat list; the in-progress split is a staff view. */
    populateGrid('clubFlatGrid', clubTools.concat(wipTools.filter(isClubTool)));
  } else {
    /* Staff users — two sections */
    document.getElementById('clubFlatSection').style.display = 'none';
    document.getElementById('staffToolsSection').style.display = staffTools.length ? '' : 'none';
    document.getElementById('clubToolsSection').style.display = clubTools.length ? '' : 'none';
    /* Meta shelf: hidden entirely unless this user can see something on it. */
    document.getElementById('metaToolsSection').style.display = metaTools.length ? '' : 'none';
    document.getElementById('webToolsSection').style.display  = webTools.length  ? '' : 'none';
    document.getElementById('wipToolsSection').style.display  = wipTools.length  ? '' : 'none';
    populateGrid('staffToolGrid', staffTools);
    populateGrid('clubToolGrid', clubTools);
    populateGrid('webToolGrid', webTools);
    populateGrid('wipToolGrid', wipTools);
    populateGrid('metaToolGrid', metaTools);
  }
}

function buildToolTile(key, t, level) {
  level = level || 'access';
  /* Clamp through the tool's own ladder before colouring the tile. A record can
     still carry a default of 'admin' on a tool that has no admin tier — harmless
     for access (auth-guard only cares that it isn't 'off'), but the tile would
     otherwise wear the red "you administer this" border for something nobody can
     administer. Clamping here keeps the card honest without rewriting data. */
  var tileLevels = toolLevels(t);
  if (tileLevels.indexOf(level) === -1) {
    level = (ACC_LEVELS.indexOf(level) > 0) ? tileLevels[tileLevels.length - 1] : 'off';
  }
  var tile = document.createElement('a');
  var levelClass = level === 'admin' ? ' tool-tile--admin'
                 : level === 'access' ? ' tool-tile--access'
                 : ' tool-tile--off';
  tile.className = 'tool-tile' + (t.placeholder ? ' tool-tile--placeholder' : '') + levelClass;

  if (t.placeholder || !t.url || t.url === '#') {
    tile.href = '#';
    tile.addEventListener('click', function(e) {
      e.preventDefault();
      if (t.placeholder) showToast(t.label + ' is coming soon', 'success');
    });
  } else {
    /* v15.7: a Club card holder goes to the tool's club page, where their
       pass's club claim shows their own club (club logins). */
    var udp = STATE.userData && STATE.userData.pass;
    tile.href = (t.clubUrl && NL.pass && NL.pass.isIssued(udp) && udp.base === 'club') ? t.clubUrl : t.url;
  }

  var icon = document.createElement('div');
  icon.className = 'tool-tile__icon';
  icon.textContent = t.icon || '🔧';

  var name = document.createElement('div');
  name.className = 'tool-tile__name';
  name.textContent = t.label || key;

  var desc = document.createElement('div');
  desc.className = 'tool-tile__desc';
  desc.textContent = t.description || '';

  tile.appendChild(icon);
  tile.appendChild(name);
  tile.appendChild(desc);

  if (t.placeholder) {
    var soon = document.createElement('span');
    soon.className = 'tool-tile__soon';
    soon.textContent = 'Coming soon';
    tile.appendChild(soon);
  }

  /* Star / favourite toggle */
  var starBtn = document.createElement('button');
  starBtn.className = 'tool-tile__star';
  starBtn.title = 'Toggle favourite';
  starBtn.setAttribute('aria-label', 'Toggle favourite');
  var favs = getFavourites();
  starBtn.textContent = favs[key] ? '★' : '☆';
  if (favs[key]) tile.classList.add('tool-tile--starred');
  starBtn.addEventListener('click', function(e) {
    e.preventDefault();
    e.stopPropagation();
    toggleFavourite(key);
  });
  tile.appendChild(starBtn);

  return tile;
}

/*
 * writeAudit(action, detail)
 * Writes to both audit/{ts} and audit-by-user/{actorUid}/{ts}.
 * Never throws -- audit failures surface via console.warn.
 */
function _auditDetailToString(d) {
  if (d == null) return '';
  if (typeof d === 'string') return d;
  if (typeof d === 'number' || typeof d === 'boolean') return String(d);
  try { return JSON.stringify(d); } catch(e) { return String(d); }
}
function writeAudit(action, detail) {
  if (!STATE.uid) return;
  var ts      = Date.now();
  var entry   = {
    action:    String(action || ''),
    detail:    _auditDetailToString(detail),
    uid:       STATE.uid,
    name:      (STATE.userData && STATE.userData.name)  || '',
    email:     (STATE.userData && STATE.userData.email) || '',
    at:        new Date(ts).toISOString()
  };
  var updates = {};
  updates['admin/audit/' + ts]                          = entry;
  updates['admin/audit-by-user/' + STATE.uid + '/' + ts] = entry;
  db.ref().update(updates).catch(function(e) {
    console.warn('writeAudit failed:', e && e.code, e && e.message);
  });
}

/* ---- Welcome message editor ---------------------------------------------- */

function initWelcomeEditor() {
  STATE.wmQuill = new Quill('#wmQuillEditor', {
    theme:   'snow',
    modules: { toolbar: [
      ['bold', 'italic', 'underline'],
      [{ list: 'ordered' }, { list: 'bullet' }],
      ['link'],
      ['clean']
    ]}
  });

  loadWmList();

  document.getElementById('wmAddBtn').addEventListener('click', function() {
    clearWmEditor();
    document.getElementById('wmInlineEditor').style.display = 'block';
    document.getElementById('wmTitle').focus();
  });

  document.getElementById('wmCancelBtn').addEventListener('click', function() {
    clearWmEditor();
    document.getElementById('wmInlineEditor').style.display = 'none';
  });

  document.getElementById('wmSaveBtn').addEventListener('click', function() {
    saveWmMessage();
  });
}

function loadWmList() {
  /* Reload the carousel slides so inline Edit/Delete reflect current state */
  loadWelcomeMessages();
}

/* buildWmItem removed -- Edit/Delete now inline on carousel slides */

function loadWmIntoEditor(key, m) {
  document.getElementById('wmTitle').value     = m.title || '';
  document.getElementById('wmEditingKey').value = key;
  document.getElementById('wmEditorHead').textContent = 'Editing message';
  STATE.wmQuill.root.innerHTML = m.content || '';
}

function clearWmEditor() {
  document.getElementById('wmTitle').value      = '';
  document.getElementById('wmEditingKey').value = '';
  document.getElementById('wmEditorHead').textContent = 'New message';
  STATE.wmQuill.setContents([]);
}

function saveWmMessage() {
  var title   = document.getElementById('wmTitle').value.trim();
  var content = STATE.wmQuill.root.innerHTML;
  var key     = document.getElementById('wmEditingKey').value;

  if (!title) { showToast('Please enter a title', 'error'); return; }

  setBtnLoading('wmSaveBtn', true);

  var payload = {
    title:     title,
    content:   content,
    author:    STATE.userData.name || STATE.user.email || '',
    updatedAt: Date.now()
  };

  var ref = key
    ? db.ref('admin/welcome-messages/' + key)
    : db.ref('admin/welcome-messages').push();

  if (!key) payload.createdAt = Date.now();

  var promise = key ? ref.update(payload) : ref.set(payload);

  promise.then(function() {
    setBtnLoading('wmSaveBtn', false, 'Save message');
    clearWmEditor();
    document.getElementById('wmInlineEditor').style.display = 'none';
    writeAudit(key ? 'message_edited' : 'message_created', title);
    showToast('Message saved', 'success');
    loadWmList();
    loadWelcomeMessages(); /* Refresh carousel */
  }).catch(function() {
    setBtnLoading('wmSaveBtn', false, 'Save message');
    showToast('Failed to save message', 'error');
  });
}

function deleteWmMessage(key, btn) {
  btn.textContent = 'Confirm?';
  btn.style.background = 'var(--red)';
  btn.style.color = 'var(--white)';
  var confirmed = false;

  btn.addEventListener('click', function handler() {
    if (!confirmed) {
      confirmed = true;
      db.ref('admin/welcome-messages/' + key).remove()
        .then(function() {
          showToast('Message deleted', 'success');
          loadWmList();
          loadWelcomeMessages();
        })
        .catch(function() { showToast('Failed to delete', 'error'); });
      btn.removeEventListener('click', handler);
    }
  });

  setTimeout(function() {
    if (!confirmed) {
      btn.textContent = 'Delete';
      btn.style.background = '';
      btn.style.color = '';
    }
  }, 3000);
}
</script>
