<!DOCTYPE html>
<!--
  NL Tools — Roadmap
  Version: v0.2 (13/11/2026)
  File: /roadmap/index.html
  v0.2 (13/11/2026) — Now, Next and Later side by side, as a board, across
    the page (Richard's pick). v0.1 capped one column at 860px on the left,
    copied from Access's own cap: canon has no reading-width rule for a tool
    page, and a narrow column on a wide screen read as a mistake. A phone
    stacks the three. The pill says only who it waits on; the detail in
    brackets moves into the row.
  What is being built next, in plain English: Now, Next and Later, each item
  a headline that opens to what needs doing and why.

  Reads /system/ROADMAP.md, the one source, changed only by pull request
  (Richard reads here and corrects in chat; Claude updates the file in the
  same pull request as the work). Read-only by design: two places changing
  one plan is how plans drift. The file's own header describes its shape.

  Storage: none. The file is in the repo, which is public, so it holds no
  names, emails or codes.
  Access: Control shelf, Skeleton key only (registry ops-roadmap).
-->

  <!-- Brand stylesheet (lint canonical: ?v=76) -->

  <!-- Firebase 10.12.0 SDK (compat) -->

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

      apiKey:            "AIzaSyC3az3OMnU7TdqlaWp8yrO_EjgZ36l-mXU",

      databaseURL:       "https://nl-tools-default-rtdb.europe-west1.firebasedatabase.app",

<style>
  /* #pageWrap default hide is in nl-brand.css; auth-guard reveals with
     style.display = 'block'. Don't clear with '' — would re-trigger the
     brand rule and re-hide the page. */
  /* Three columns on both desktop screens (CLAUDE.md, Two screens: the same
     layout, columns narrowing in proportion); one on a phone. */
  .rm { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; align-items: start; }
  @media (max-width: 700px) { .rm { grid-template-columns: 1fr; } }
  .rm-group { min-width: 0; }
  .rm-item { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 8px; }
  .rm-item[open] > summary { border-bottom: 1px solid var(--border); }
  .rm-item > summary { align-items: center; font-size: var(--text-base); }
  .rm-wait { margin-left: auto; flex: none; }
  .rm-body { padding: 12px 16px 14px; font-size: var(--text-sm); color: var(--text); }
  .rm-body p { margin: 0 0 8px; line-height: 1.5; }
  .rm-body p:last-child { margin-bottom: 0; }
  .rm-lab { font-weight: 800; font-variation-settings: 'wght' 800; color: var(--navy); }
  .rm-body ul { margin: 0 0 8px; padding-left: 20px; color: var(--text-muted); }
  .rm-body li { margin: 2px 0; line-height: 1.45; }
</style>

<body>

<!-- Topbar — auto-rendered by /system/nl-topbar.js from window.NL_TOOL -->
<div id="nlTopbar"></div>

<div id="pageWrap">
  <div class="page">
    <div class="rm" id="rm"></div>
  </div>
</div>

<!-- Main app -->
<script>
(function () {
  'use strict';

  /* ROADMAP.md → [{ name, items: [{ title, what, why, points, waiting }] }].
     Only the shapes the file's header lists are read; anything else (the
     HTML comment, a stray line) is ignored. Exported for tests. */
  function parse(md) {
    var groups = [], g = null, it = null, inComment = false;
    String(md || '').split(/\r?\n/).forEach(function (raw) {
      var line = raw.trim();
      if (inComment) { if (line.indexOf('-->') !== -1) inComment = false; return; }
      if (line.indexOf('<!--') === 0) { if (line.indexOf('-->') === -1) inComment = true; return; }
      var m;
      if ((m = line.match(/^##\s+(.+)$/)) && !/^###/.test(line)) {
        g = { name: m[1].trim(), items: [] }; groups.push(g); it = null; return;
      }
      if ((m = line.match(/^###\s+(.+)$/))) {
        if (!g) { g = { name: '', items: [] }; groups.push(g); }
        it = { title: m[1].trim(), what: '', why: '', points: [], waiting: '' };
        g.items.push(it); return;
      }
      if (!it) return;
      if ((m = line.match(/^What:\s*(.*)$/))) it.what = m[1];
      else if ((m = line.match(/^Why:\s*(.*)$/))) it.why = m[1];
      else if ((m = line.match(/^Waiting on:\s*(.*)$/))) it.waiting = m[1];
      else if ((m = line.match(/^-\s+(.+)$/))) it.points.push(m[1]);
    });
    return groups;
  }
  window.ROADMAP = { parse: parse };

  var esc = function (s) { return NL.escHtml(s); };
  /* "you (one press)" → "you": the pill names who, the row says what. */
  function who(w) { return String(w).replace(/\s*\([^)]*\)\s*$/, ''); }

  function item(it) {
    var body = '';
    if (it.what) body += '<p><span class="rm-lab">What</span> ' + esc(it.what) + '</p>';
    if (it.why) body += '<p><span class="rm-lab">Why</span> ' + esc(it.why) + '</p>';
    var detail = (it.waiting.match(/\(([^)]*)\)\s*$/) || [])[1];
    if (detail) body += '<p><span class="rm-lab">Waiting on ' + esc(who(it.waiting)) + '</span> ' + esc(detail) + '</p>';
    if (it.points.length) body += '<ul>' + it.points.map(function (p) { return '<li>' + esc(p) + '</li>'; }).join('') + '</ul>';
    return '<details class="disclosure rm-item"><summary>' + esc(it.title) +
      (it.waiting ? ' <span class="pill pill--pending rm-wait">' + esc('Waiting on ' + who(it.waiting)) + '</span>' : '') +
      '</summary><div class="rm-body">' + body + '</div></details>';
  }

  function render(groups) {
    var el = document.getElementById('rm');
    if (!groups.length) {
      el.innerHTML = '<div class="empty-state"><div class="empty-state__title">Nothing on the roadmap</div></div>';
      return;
    }
    el.innerHTML = groups.map(function (g) {
      return '<section class="rm-group"><div class="section-head"><h2>' + esc(g.name) + '</h2></div>' +
        g.items.map(item).join('') + '</section>';
    }).join('');
  }

  window.TOOL = window.TOOL || {};
  window.TOOL.boot = function () {
    fetch('/system/ROADMAP.md', { cache: 'no-cache' })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
      .then(function (md) { render(parse(md)); })
      .catch(function (e) {
        console.error('[roadmap]', e);
        document.getElementById('rm').innerHTML = '<div class="empty-state"><div class="empty-state__title">The roadmap could not be loaded</div>' +
          '<div class="empty-state__text">Reload the page to try again.</div></div>';
      });
  };

  if (window._toolDeferredSession) {
    window.TOOL.boot(window._toolDeferredSession);
    delete window._toolDeferredSession;
  }
})();
</script>

</body>
</html>
