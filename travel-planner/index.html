<style>
  /* ── Modes ── */
  .tp__modes{display:flex;gap:0;margin-bottom:20px;background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  .tp__mode-btn{flex:1;padding:12px 16px;border:none;background:var(--white);font-family:var(--font);font-size:var(--text-sm)!important;font-weight:800;font-variation-settings:'wght' 800;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);cursor:pointer;transition:all .2s;border-bottom:3px solid transparent}
  .tp__mode-btn.active{color:var(--navy);border-bottom-color:var(--navy);background:var(--off-white)}
  .tp__mode-btn:hover:not(.active){background:var(--off-white)}

  /* ── Panel ── */
  .tp__panel{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px;margin-bottom:24px}
  .tp__panel-title{font-size:var(--text-sm);font-weight:800;font-variation-settings:'wght' 800;text-transform:uppercase;letter-spacing:.04em;color:var(--navy);margin-bottom:18px}
  .tp__field{margin-bottom:16px}.tp__field:last-child{margin-bottom:0}
  .tp__label{display:block;font-size:var(--text-xs);font-weight:700;font-variation-settings:'wght' 700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);margin-bottom:6px}
  .tp__input,.tp__select{width:100%;padding:10px 14px;border:2px solid var(--border);border-radius:var(--radius);font-family:var(--font);font-size:var(--text-sm)!important;font-variation-settings:'wght' 400;color:var(--text);background:var(--white);transition:border-color .2s;appearance:none}
  .tp__input:focus,.tp__select:focus{outline:none;border-color:var(--navy)}
  .tp__select-wrap{position:relative}.tp__select-wrap::after{content:"▾";position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--text-muted);pointer-events:none;font-size:14px}

  /* ── Autocomplete ── */
  .tp__ac-wrap{position:relative}
  .tp__ac-crest{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:22px;height:22px;object-fit:contain;pointer-events:none;display:none;z-index:2}
  .tp__ac-wrap.has-crest .tp__input{padding-left:42px}
  .tp__ac-list{position:absolute;top:100%;left:0;right:0;background:var(--white);border:2px solid var(--navy);border-top:none;border-radius:0 0 var(--radius) var(--radius);max-height:240px;overflow-y:auto;z-index:100;display:none}
  .tp__ac-list.show{display:block}
  .tp__ac-item{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;font-size:var(--text-sm);transition:background .15s}

  .tp__ac-item img{width:20px;height:20px;object-fit:contain}
  .tp__ac-item .name{font-weight:600;font-variation-settings:'wght' 600}
  .tp__ac-item .ground{font-size:var(--text-xs);color:var(--text-muted);margin-left:auto}
  .tp__ac-item .div-badge{font-size:10px;font-weight:700;font-variation-settings:'wght' 700;text-transform:uppercase;letter-spacing:.04em;padding:2px 6px;border-radius:3px;background:var(--off-white);color:var(--text-muted)}

  /* ── Transport ── */
  .tp__transport{display:flex;gap:8px;margin-bottom:16px}
  .tp__transport-btn{flex:1;padding:8px 12px;border:2px solid var(--border);border-radius:var(--radius);background:var(--white);font-family:var(--font);font-size:var(--text-xs)!important;font-weight:700;font-variation-settings:'wght' 700;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);cursor:pointer;transition:all .2s;text-align:center}
  .tp__transport-btn.active{border-color:var(--navy);background:var(--navy);color:var(--white)}

  /* ── TO/FROM toggle ── */

  .tp__fix-item .teams{font-size:var(--text-sm);font-weight:700;font-variation-settings:'wght' 700;color:var(--text)}

  .tp__fix-item .badge{font-size:10px;font-weight:800;font-variation-settings:'wght' 800;text-transform:uppercase;letter-spacing:.04em;padding:3px 8px;border-radius:99px}

  /* ── Results layout ── */
  .tp__results{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px}
  .tp__map-col{min-height:400px;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}

  /* ── Summary ── */
  .tp__summary{background:var(--navy);color:var(--white);border-radius:var(--radius) var(--radius) 0 0;padding:18px 22px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}

  .tp__summary-route .arrow{color:rgba(255,255,255,.4);margin:0 8px}
  .tp__summary-duration{font-size:var(--text-sm);font-weight:600;font-variation-settings:'wght' 600;background:rgba(255,255,255,.15);padding:4px 12px;border-radius:99px}

  /* ── Board ── */
  .tp__board{background:var(--white);border-radius:0 0 var(--radius) var(--radius);box-shadow:var(--shadow);overflow:hidden}
  .tp__leg{display:flex;gap:0;border-bottom:1px solid var(--border)}.tp__leg:last-child{border-bottom:none}
  .tp__leg-timeline{width:72px;min-width:72px;display:flex;flex-direction:column;align-items:center;padding:18px 0;position:relative}
  .tp__leg-time{font-size:15px;font-weight:800;font-variation-settings:'wght' 800;color:var(--text);z-index:1}
  .tp__leg-timeline .line{flex:1;width:2px;background:var(--border);margin:6px 0}
  .tp__leg-time-end{font-size:var(--text-xs);font-weight:600;font-variation-settings:'wght' 600;color:var(--text-muted);z-index:1}
  .tp__leg-timeline .dot{width:12px;height:12px;border-radius:50%;border:3px solid var(--navy);background:var(--white);z-index:1;margin-bottom:4px}
  .tp__leg--WALKING .dot{border-color:var(--text-muted)}
  .tp__leg--BUS .dot{border-color:var(--amber)}
  .tp__leg--RAIL .dot,.tp__leg--HEAVY_RAIL .dot,.tp__leg--COMMUTER_TRAIN .dot,.tp__leg--HIGH_SPEED_TRAIN .dot,.tp__leg--LONG_DISTANCE_TRAIN .dot,.tp__leg--INTERCITY_BUS .dot{border-color:var(--navy)}
  .tp__leg--SUBWAY .dot,.tp__leg--METRO_RAIL .dot{border-color:var(--primary)}
  .tp__leg--TRAM .dot,.tp__leg--LIGHT_RAIL .dot{border-color:var(--green)}
  .tp__leg--DRIVING .dot{border-color:var(--blue)}
  .tp__leg-detail{flex:1;padding:18px 20px 18px 0}
  .tp__leg-mode{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;font-variation-settings:'wght' 800;text-transform:uppercase;letter-spacing:.06em;padding:3px 10px;border-radius:99px;margin-bottom:6px}
  .tp__leg--WALKING .tp__leg-mode{background:var(--off-white);color:var(--text-muted)}
  .tp__leg--BUS .tp__leg-mode{background:var(--amber-light);color:var(--amber)}
  .tp__leg--RAIL .tp__leg-mode,.tp__leg--HEAVY_RAIL .tp__leg-mode,.tp__leg--COMMUTER_TRAIN .tp__leg-mode,.tp__leg--HIGH_SPEED_TRAIN .tp__leg-mode,.tp__leg--LONG_DISTANCE_TRAIN .tp__leg-mode,.tp__leg--INTERCITY_BUS .tp__leg-mode{background:var(--blue-light);color:var(--blue)}
  .tp__leg--SUBWAY .tp__leg-mode,.tp__leg--METRO_RAIL .tp__leg-mode{background:#fce4ec;color:var(--primary)}
  .tp__leg--TRAM .tp__leg-mode,.tp__leg--LIGHT_RAIL .tp__leg-mode{background:var(--green-light);color:var(--green)}
  .tp__leg--DRIVING .tp__leg-mode{background:var(--blue-light);color:var(--blue)}
  .tp__leg-route{font-size:15px;font-weight:700;font-variation-settings:'wght' 700;color:var(--text);margin-bottom:2px}
  .tp__leg-stops{font-size:var(--text-xs);color:var(--text-muted)}
  .tp__leg-duration{font-size:var(--text-xs);color:var(--text-muted);margin-top:4px;font-weight:600;font-variation-settings:'wght' 600}

  /* ── Alts ── */
  .tp__alts{padding:14px 22px;background:var(--off-white);border-top:1px solid var(--border);display:flex;gap:10px;overflow-x:auto}
  .tp__alt-chip{flex-shrink:0;padding:6px 14px;border-radius:99px;border:2px solid var(--border);background:var(--white);font-family:var(--font);font-size:var(--text-xs)!important;font-weight:700;font-variation-settings:'wght' 700;color:var(--text);cursor:pointer;transition:all .2s;white-space:nowrap}
  .tp__alt-chip:hover{border-color:var(--navy);color:var(--navy)}
  .tp__alt-chip.active{background:var(--navy);color:var(--white);border-color:var(--navy)}
  .tp__alt-chip .dur{font-weight:400;font-variation-settings:'wght' 400;color:var(--text-muted);margin-left:4px}
  .tp__alt-chip.active .dur{color:rgba(255,255,255,.6)}

  /* ── States ── */
  .tp__loading{text-align:center;padding:48px 24px;color:var(--text-muted);font-size:var(--text-sm)}
  .tp__spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--navy);border-radius:50%;animation:tpSpin .8s linear infinite;margin:0 auto 12px}
  @keyframes tpSpin{to{transform:rotate(360deg)}}
  .tp__error{text-align:center;padding:24px;color:var(--red);font-size:var(--text-sm);font-weight:600;font-variation-settings:'wght' 600;background:var(--red-light);border-radius:var(--radius);margin-bottom:16px}
  .tp__row{display:flex;gap:10px}.tp__row>*{flex:1}
  .tp__footer{text-align:center;padding:20px;font-size:var(--text-xs);color:var(--text-muted)}

  @media(max-width:768px){
    .tp__results{grid-template-columns:1fr}
    .tp__map-col{min-height:250px}
  }
  @media(max-width:520px){
    .tp__summary{flex-direction:column;align-items:flex-start;padding:14px 16px}
    .tp__leg-timeline{width:60px;min-width:60px}
    .tp__leg-detail{padding:14px 14px 14px 0}
    .tp__row{flex-direction:column;gap:0}
  }
</style>

<body>
<div id="nlTopbar"></div>
<div id="pageWrap" style="display:none;">
<div class="page" style="max-width:1100px;">

  <div class="tp__modes">
    <button class="tp__mode-btn active" data-mode="fixture" onclick="setMode('fixture')">Match Day Travel</button>
    <button class="tp__mode-btn" data-mode="manual" onclick="setMode('manual')">Manual Journey</button>
  </div>

  <!-- ══ FIXTURE MODE ══ -->
  <div id="fixtureMode">
    <div class="tp__panel">
      <div class="tp__panel-title">Select Your Club</div>
      <div class="tp__field">
        <div class="tp__ac-wrap" id="fixClubWrap">
          <img class="tp__ac-crest" id="fixClubCrest" src="" alt="" onerror="this.onerror=null;this.style.display='none';">
          <input class="tp__input" type="text" id="fixClubInput" placeholder="Start typing a club name…" autocomplete="off">
          <div class="tp__ac-list" id="fixClubAC"></div>
        </div>
      </div>
    </div>

    <!-- Fixture list (appears after club selected) -->
    <div id="fixFixtureArea"></div>

    <!-- Journey config (appears after fixture selected) -->
    <div id="fixJourneyConfig" style="display:none;">
      <div class="tp__panel">
        <div class="tp__panel-title">Journey Options</div>

        <!-- TO / FROM toggle -->
        <div class="tp__field">
          <label class="tp__label">Direction</label>
          <div class="tp__dir-toggle">
            <button class="tp__dir-btn active" data-dir="to" onclick="setDirection('to')">🚆 Travel TO match</button>
            <button class="tp__dir-btn" data-dir="from" onclick="setDirection('from')">🏠 Travel FROM match</button>
          </div>
        </div>

        <!-- Pre-match slider (Travel TO) -->
        <div class="tp__field" id="preMatchSlider">
          <label class="tp__label">Arrive before kick-off</label>
          <div class="tp__slider-row">
            <input class="tp__slider" type="range" id="arriveBeforeSlider" min="15" max="120" step="5" value="60"
              oninput="document.getElementById('arriveBeforeVal').textContent=this.value+' min'">
            <span class="tp__slider-val" id="arriveBeforeVal">60 min</span>
          </div>
        </div>

        <!-- Post-match slider (Travel FROM) -->
        <div class="tp__field" id="postMatchSlider" style="display:none;">
          <label class="tp__label">Extra time after full-time</label>
          <div class="tp__slider-row">
            <input class="tp__slider" type="range" id="extraAfterSlider" min="0" max="120" step="5" value="0"
              oninput="updatePostSliderLabel()">
            <span class="tp__slider-val" id="extraAfterVal">Depart at FT</span>
          </div>
          <div class="tp__slider-note" id="postMatchNote"></div>
        </div>

        <!-- Transport mode -->
        <div class="tp__field">
          <label class="tp__label">Travel by</label>
          <div class="tp__transport" id="fixTransport">
            <button class="tp__transport-btn active" data-mode="TRANSIT" onclick="setTransport(this,'fix')">🚆 Public transport</button>
            <button class="tp__transport-btn" data-mode="DRIVE" onclick="setTransport(this,'fix')">🚗 Drive</button>
            <button class="tp__transport-btn" data-mode="WALK" onclick="setTransport(this,'fix')">🚶 Walk</button>
          </div>
        </div>

        <button class="btn btn--primary" style="width:100%;" id="fixSearchBtn" onclick="doFixtureSearch()">Find journey</button>
      </div>
    </div>
  </div>

  <!-- ══ MANUAL MODE ══ -->
  <div id="manualMode" style="display:none;">
    <div class="tp__panel">
      <div class="tp__panel-title">Plan a Journey</div>
      <div class="tp__field">
        <label class="tp__label">From</label>
        <div class="tp__ac-wrap" id="manFromClubWrap">
          <img class="tp__ac-crest" id="manFromCrest" src="" alt="" onerror="this.onerror=null;this.style.display='none';">
          <input class="tp__input" type="text" id="manFromInput" placeholder="Club name, postcode, or address" autocomplete="off">
          <div class="tp__ac-list" id="manFromAC"></div>
        </div>
      </div>
      <div class="tp__field">
        <label class="tp__label">To</label>
        <div class="tp__ac-wrap" id="manToClubWrap">
          <img class="tp__ac-crest" id="manToCrest" src="" alt="" onerror="this.onerror=null;this.style.display='none';">
          <input class="tp__input" type="text" id="manToInput" placeholder="Club name, postcode, or address" autocomplete="off">
          <div class="tp__ac-list" id="manToAC"></div>
        </div>
      </div>
      <div class="tp__field">
        <label class="tp__label">Travel by</label>
        <div class="tp__transport" id="manTransport">
          <button class="tp__transport-btn active" data-mode="TRANSIT" onclick="setTransport(this,'man')">🚆 Public transport</button>
          <button class="tp__transport-btn" data-mode="DRIVE" onclick="setTransport(this,'man')">🚗 Drive</button>
          <button class="tp__transport-btn" data-mode="WALK" onclick="setTransport(this,'man')">🚶 Walk</button>
        </div>
      </div>
      <div class="tp__field">
        <label class="tp__label">When</label>
        <div class="tp__row">
          <div class="tp__select-wrap">

              <option value="now">Leave now</option>
              <option value="choose">Choose time</option>
            </select>
          </div>
          <input class="tp__input" type="datetime-local" id="manTimeInput" style="display:none;">
        </div>
      </div>
      <button class="btn btn--primary" style="width:100%;margin-top:8px;" id="manSearchBtn" onclick="doManualSearch()" disabled>Find journey</button>
    </div>
  </div>

  <!-- ══ RESULTS ══ -->
  <div id="resultsArea"></div>
  <div class="tp__footer">Powered by Google Maps Platform & National League Services</div>
</div>

<script>
var CLUBS_META_URL='https://raw.githubusercontent.com/thenationalleague/tools/refs/heads/main/assets/data/clubs-meta.json';
var CREST_BASE='https://raw.githubusercontent.com/thenationalleague/tools/refs/heads/main/assets/crests/';
var FALLBACK_CREST=CREST_BASE+'National%20League%20rose.png';
var NLS_BASE='https://multi-club-matches.football.web.gc.nationalleagueservices.co.uk/v2';
var SEASON_ID=2025;
var COMP_IDS=[89,373,372];

var clubs=[];
var fixSelectedClub=null;
var fixSelectedMatch=null;
var fixDirection='to'; // 'to' or 'from'
var manFromClub=null;
var manToClub=null;
var RouteClass=null;
var MapClass=null;
var routeMap=null;
var allRoutes=[];
var activeRouteIdx=0;
var gmapsReady=false;

// ── Google Maps ──
async function initGoogleMaps(){
  try{
    var routesLib=await google.maps.importLibrary('routes');
    RouteClass=routesLib.Route;
    var mapsLib=await google.maps.importLibrary('maps');
    MapClass=mapsLib.Map;
    gmapsReady=true;
  }catch(err){
    console.error('Google Maps load error:',err);
  }
}

// ── Clubs ──
function loadClubs(){
  fetch(CLUBS_META_URL).then(function(r){return r.json()}).then(function(data){
    clubs=(data.clubs||[]).map(function(c){
      return{name:c.name||'',code:c.code||'',short:c.short||'',stadium:c.stadium||'',division:c.division||'',optaID:c.optaID||'',postcode:c.postcode||'',colors:c.colors||{}};
    }).sort(function(a,b){return a.name.localeCompare(b.name)});
  }).catch(function(){clubs=[]});
}
function getCrestUrl(n){return CREST_BASE+encodeURIComponent(n)+'.png'}
function clubAddress(c){return c.postcode?c.stadium+', '+c.postcode:c.stadium+', '+(c.short||c.name)+', UK'}

// ── Club autocomplete ──
function setupClubAC(inputId,listId,wrapId,onSelect){
  var input=document.getElementById(inputId);
  var list=document.getElementById(listId);
  input.addEventListener('input',function(){filterClubList(this.value,listId,onSelect);onSelect(null)});
  input.addEventListener('focus',function(){if(!this.value.trim())filterClubList('',listId,onSelect)});
  document.addEventListener('click',function(e){if(!e.target.closest('#'+wrapId))list.classList.remove('show')});
}
function filterClubList(q,listId,onSelect){
  var list=document.getElementById(listId);
  q=(q||'').toLowerCase().trim();
  var f=clubs;
  if(q)f=clubs.filter(function(c){return c.name.toLowerCase().indexOf(q)!==-1||(c.short&&c.short.toLowerCase().indexOf(q)!==-1)||(c.code&&c.code.toLowerCase()===q)});
  if(!f.length){list.innerHTML='<div class="tp__ac-item" style="color:var(--text-muted);justify-content:center;">No clubs found</div>';list.classList.add('show');return}
  list.innerHTML=f.slice(0,15).map(function(c){
    return'<div class="tp__ac-item" data-club="'+c.name.replace(/"/g,'&quot;')+'"><img src="'+getCrestUrl(c.name)+'" alt="" onerror="this.onerror=null;this.src=\''+FALLBACK_CREST+'\'"><span class="name">'+c.name+'</span><span class="ground">'+c.stadium+'</span><span class="div-badge">'+c.division+'</span></div>';
  }).join('');
  list.classList.add('show');
  list.querySelectorAll('.tp__ac-item[data-club]').forEach(function(item){
    item.addEventListener('click',function(){
      var club=clubs.find(function(c){return c.name===item.getAttribute('data-club')});
      onSelect(club);list.classList.remove('show');
    });
  });
}

// ── Fix: club selection → load fixtures ──
function selectFixClub(club){
  fixSelectedClub=club;
  fixSelectedMatch=null;
  document.getElementById('fixJourneyConfig').style.display='none';
  var input=document.getElementById('fixClubInput'),crest=document.getElementById('fixClubCrest'),wrap=document.getElementById('fixClubWrap');
  if(club){
    input.value=club.name;crest.src=getCrestUrl(club.name);crest.style.display='block';wrap.classList.add('has-crest');
    fetchFixtures(club);
  }else{
    crest.style.display='none';wrap.classList.remove('has-crest');
    document.getElementById('fixFixtureArea').innerHTML='';
  }
}

function fetchFixtures(club){
  var area=document.getElementById('fixFixtureArea');
  area.innerHTML='<div class="tp__loading"><div class="tp__spinner"></div>Loading fixtures…</div>';
  if(!club.optaID){area.innerHTML='<div class="tp__error">No Opta ID for this club.</div>';return}
  var promises=COMP_IDS.map(function(compID){
    return fetch(NLS_BASE+'/matches/?seasonID='+SEASON_ID+'&competitionID='+compID+'&sort=kickOffDateUTC&page.size=100&page.number=1').then(function(r){return r.json()}).catch(function(){return{data:[]}});
  });
  Promise.all(promises).then(function(results){
    var all=[];results.forEach(function(r){if(r.data)all=all.concat(r.data)});
    var teamID=club.optaID;
    var upcoming=all.filter(function(m){
      var a=m.attributes;var p=(a.matchPeriod||'').toLowerCase();
      return(p==='prematch'||p===''||p==='fixture')&&((a.homeTeam&&a.homeTeam.teamID===teamID)||(a.awayTeam&&a.awayTeam.teamID===teamID));
    }).sort(function(a,b){return new Date(nd(a.attributes.kickOffDateUTC))-new Date(nd(b.attributes.kickOffDateUTC))});
    if(!upcoming.length){area.innerHTML='<div class="tp__error">No upcoming fixtures for '+club.name+'.</div>';return}
    var html='<div class="tp__panel"><div class="tp__panel-title">Upcoming Fixtures</div><div class="tp__fix-list">';
    upcoming.slice(0,10).forEach(function(m,i){
      var a=m.attributes;
      var isHome=a.homeTeam&&a.homeTeam.teamID===teamID;
      var opp=isHome?a.awayTeam:a.homeTeam;
      var oppClub=clubs.find(function(c){return c.optaID===(opp?opp.teamID:'')});
      var ko=new Date(nd(a.kickOffDateUTC));
      html+='<div class="tp__fix-item" data-idx="'+i+'" onclick="selectFixture('+i+')">';
      html+='<img src="'+getCrestUrl(opp?opp.name:(oppClub?oppClub.name:''))+'" alt="" onerror="this.onerror=null;this.src=\''+FALLBACK_CREST+'\'">';
      html+='<div class="info"><div class="teams">'+(isHome?club.name+' vs '+(opp?opp.name:'TBC'):(opp?opp.name:'TBC')+' vs '+club.name)+'</div>';
      html+='<div class="meta">'+fmtDate(ko)+' — '+fmtTime(ko)+(oppClub?' · '+oppClub.stadium:'')+'</div></div>';
      html+='<span class="badge badge--'+(isHome?'home':'away')+'">'+(isHome?'Home':'Away')+'</span>';
      html+='</div>';
    });
    html+='</div></div>';
    area.innerHTML=html;
    // Store matches for selection
    area._matches=upcoming.slice(0,10);
  }).catch(function(err){area.innerHTML='<div class="tp__error">Failed to load fixtures.</div>';console.error(err)});
}

function selectFixture(idx){
  var area=document.getElementById('fixFixtureArea');
  var matches=area._matches;
  if(!matches||!matches[idx])return;
  fixSelectedMatch=matches[idx];
  // Highlight selected
  area.querySelectorAll('.tp__fix-item').forEach(function(el,i){el.classList.toggle('selected',i===idx)});
  // Show journey config
  document.getElementById('fixJourneyConfig').style.display='block';
  // Update post-match note
  updatePostMatchNote();
  // Scroll to config
  document.getElementById('fixJourneyConfig').scrollIntoView({behavior:'smooth',block:'start'});
}

// ── Route requests ──
function doFixtureSearch(){
  if(!fixSelectedMatch||!fixSelectedClub)return;
  var a=fixSelectedMatch.attributes;
  var teamID=fixSelectedClub.optaID;
  var isHome=a.homeTeam&&a.homeTeam.teamID===teamID;
  var oppID=isHome?a.awayTeam.teamID:a.homeTeam.teamID;
  var oppClub=clubs.find(function(c){return c.optaID===oppID});

  var myAddr=clubAddress(fixSelectedClub);
  var oppAddr=oppClub?clubAddress(oppClub):(isHome?(a.awayTeam.name||''):(a.homeTeam.name||''));

  var origin,destination,destLabel;
  if(fixDirection==='to'){
    // Travel TO: my ground → opponent's ground (or my ground for home, but still makes sense for the journey)
    origin=myAddr;
    destination=oppAddr;
    destLabel=oppClub?oppClub.short||oppClub.name:destination;
  }else{
    // Travel FROM: opponent's ground → my ground
    origin=oppAddr;
    destination=myAddr;
    destLabel=fixSelectedClub.short||fixSelectedClub.name;
  }

  var travelMode=getTransportMode('fix');
  var ko=new Date(nd(a.kickOffDateUTC));
  var targetTime;

  if(fixDirection==='to'){
    var minsBefore=parseInt(document.getElementById('arriveBeforeSlider').value,10);
    targetTime=new Date(ko.getTime()-minsBefore*60000);
  }else{
    var extraAfter=parseInt(document.getElementById('extraAfterSlider').value,10);
    targetTime=new Date(ko.getTime()+120*60000+extraAfter*60000); // KO + 2h + extra
  }

  requestRoute(origin,destination,travelMode,targetTime,fixDirection,destLabel,fixSelectedClub.short||fixSelectedClub.name);
}

function doManualSearch(){
  var fi=document.getElementById('manFromInput').value.trim();
  var ti=document.getElementById('manToInput').value.trim();
  var origin=manFromClub?clubAddress(manFromClub):fi;
  var destination=manToClub?clubAddress(manToClub):ti;
  var travelMode=getTransportMode('man');
  var dep=null;
  if(document.getElementById('manWhenSelect').value==='choose'){var dt=document.getElementById('manTimeInput').value;if(dt)dep=new Date(dt)}
  else dep=new Date();
  requestRoute(origin,destination,travelMode,dep,'to',manToClub?manToClub.short||manToClub.name:ti,null);
}

async function requestRoute(origin,destination,travelMode,targetTime,direction,destLabel,originLabel){
  var results=document.getElementById('resultsArea');
  results.innerHTML='<div class="tp__loading"><div class="tp__spinner"></div>Finding the best route…</div>';
  if(!RouteClass){results.innerHTML='<div class="tp__error">Routes API not loaded. Ensure Routes API is enabled in Google Cloud.</div>';return}

  var request={
    origin:origin,
    destination:destination,
    travelMode:travelMode,
    computeAlternativeRoutes:true,
    units:google.maps.UnitSystem.METRIC,
    fields:['legs','localizedValues','travelAdvisory','polyline']
  };

  if(travelMode==='TRANSIT'){
    if(direction==='to'){
      // For travel TO, we ideally want arrivalTime but the JS API may not support it
      // Use departureTime as fallback
      request.departureTime=targetTime||new Date();
    }else{
      request.departureTime=targetTime||new Date();
    }
    request.transitPreference={routingPreference:'FEWER_TRANSFERS'};
  }else if(targetTime){
    request.departureTime=targetTime;
  }

  try{
    var response=await RouteClass.computeRoutes(request);
    var routes=response.routes||[];
    if(!routes.length){results.innerHTML='<div class="tp__error">No routes found. Try a different search.</div>';return}
    allRoutes=routes;activeRouteIdx=0;
    renderResults(routes,0,originLabel||origin,destLabel||destination);
  }catch(err){
    console.error('Route error:',err);
    results.innerHTML='<div class="tp__error">Could not find a route. '+(err.message||'')+'</div>';
  }
}

// ── Consolidate walking steps ──
function consolidateSteps(steps){
  if(!steps||!steps.length)return[];
  var out=[];
  var walkBuffer=null;

  steps.forEach(function(step){
    var mode=classifyStep(step);
    if(mode==='WALKING'){
      if(!walkBuffer){
        walkBuffer={travelMode:'WALK',_mode:'WALKING',_totalMeters:0,_totalSeconds:0,_instructions:[],_localizedValues:step.localizedValues};
      }
      walkBuffer._totalMeters+=(step.distanceMeters||0);
      var dur=step.localizedValues&&step.localizedValues.staticDuration?step.localizedValues.staticDuration.text:'';
      // Parse seconds from duration string if available
      if(step.staticDuration){
        var s=parseInt(String(step.staticDuration).replace('s',''),10);
        if(!isNaN(s))walkBuffer._totalSeconds+=s;
      }
      if(step.navigationInstruction&&step.navigationInstruction.instructions){
        walkBuffer._instructions.push(stripHtml(step.navigationInstruction.instructions));
      }
    }else{
      // Flush walk buffer
      if(walkBuffer){out.push(walkBuffer);walkBuffer=null}
      out.push(step);
    }
  });
  if(walkBuffer)out.push(walkBuffer);
  return out;
}

// ── Render results (map + board) ──
function renderResults(routes,idx,originLabel,destLabel){
  var results=document.getElementById('resultsArea');
  var route=routes[idx];
  var leg=route.legs[0];

  var durText='';
  if(route.localizedValues&&route.localizedValues.duration)durText=route.localizedValues.duration.text||'';
  else if(leg.localizedValues&&leg.localizedValues.duration)durText=leg.localizedValues.duration.text||'';

  var html='<div class="tp__results">';

  // Map column
  html+='<div class="tp__map-col"><div id="routeMap"></div></div>';

  // Board column
  html+='<div class="tp__board-col">';
  html+='<div class="tp__summary"><div class="tp__summary-route">'+abbreviate(originLabel)+'<span class="arrow">→</span>'+abbreviate(destLabel)+'</div><div class="tp__summary-duration">'+durText+'</div></div>';
  html+='<div class="tp__board">';

  var consolidated=consolidateSteps(leg.steps);

  consolidated.forEach(function(step){
    var mode=step._mode||classifyStep(step);
    var modeLabel=getModeLabel(mode);
    var depTime='',arrTime='',routeDesc='',stopsDesc='',durT='',distT='';

    if(step._mode==='WALKING'){
      // Consolidated walk
      routeDesc='Walk';
      distT=formatDistance(step._totalMeters);
      if(step._totalSeconds)durT=formatDuration(step._totalSeconds);
      else if(step._localizedValues&&step._localizedValues.staticDuration)durT=step._localizedValues.staticDuration.text;
    }else if(step.transitDetails){
      var td=step.transitDetails;var sd=td.stopDetails||{};
      if(sd.departureTime)depTime=fmtISO(sd.departureTime);
      if(sd.arrivalTime)arrTime=fmtISO(sd.arrivalTime);
      var line=td.transitLine||{};
      var lName=line.nameShort||line.name||'';
      var depStop=sd.departureStop?sd.departureStop.name:'';
      var arrStop=sd.arrivalStop?sd.arrivalStop.name:'';
      routeDesc=lName+(arrStop?' to '+arrStop:'');
      stopsDesc=depStop+' → '+arrStop;
      if(td.stopCount)stopsDesc+=' · '+td.stopCount+' stops';
      if(line.vehicle&&line.vehicle.type){mode=line.vehicle.type;modeLabel=getModeLabel(mode)}
    }else{
      routeDesc=step.navigationInstruction?stripHtml(step.navigationInstruction.instructions):'';
      if(step.localizedValues&&step.localizedValues.staticDuration)durT=step.localizedValues.staticDuration.text;
      if(step.distanceMeters)distT=formatDistance(step.distanceMeters);
    }

    if(!durT&&step.localizedValues){
      if(step.localizedValues.staticDuration)durT=step.localizedValues.staticDuration.text;
      else if(step.localizedValues.duration)durT=step.localizedValues.duration.text;
    }
    if(!distT&&step.localizedValues&&step.localizedValues.distance)distT=step.localizedValues.distance.text;

    html+='<div class="tp__leg tp__leg--'+mode+'">';
    html+='<div class="tp__leg-timeline"><div class="dot"></div>';
    if(depTime)html+='<div class="tp__leg-time">'+depTime+'</div>';
    html+='<div class="line"></div>';
    if(arrTime)html+='<div class="tp__leg-time-end">'+arrTime+'</div>';
    html+='</div>';
    html+='<div class="tp__leg-detail"><div class="tp__leg-mode">'+modeLabel+'</div>';
    if(routeDesc)html+='<div class="tp__leg-route">'+routeDesc+'</div>';
    if(stopsDesc)html+='<div class="tp__leg-stops">'+stopsDesc+'</div>';
    if(distT&&!stopsDesc)html+='<div class="tp__leg-stops">'+distT+'</div>';
    if(durT)html+='<div class="tp__leg-duration">'+durT+'</div>';
    html+='</div></div>';
  });

  // Alternatives
  if(routes.length>1){
    html+='<div class="tp__alts">';
    routes.forEach(function(r,i){
      var rDur='';if(r.localizedValues&&r.localizedValues.duration)rDur=r.localizedValues.duration.text||'';
      var chip='Route '+(i+1);
      if(r.legs&&r.legs[0]&&r.legs[0].steps){
        for(var s=0;s<r.legs[0].steps.length;s++){
          var st=r.legs[0].steps[s];
          if(st.transitDetails&&st.transitDetails.stopDetails&&st.transitDetails.stopDetails.departureTime){
            chip=fmtISO(st.transitDetails.stopDetails.departureTime);break;
          }
        }
      }
      html+='<div class="tp__alt-chip'+(i===idx?' active':'')+'" onclick="switchRoute('+i+',\''+esc(originLabel)+'\',\''+esc(destLabel)+'\')">'+chip;
      if(rDur)html+='<span class="dur">'+rDur+'</span>';
      html+='</div>';
    });
    html+='</div>';
  }

  html+='</div></div></div>'; // board, board-col, results

  results.innerHTML=html;

  // Render map
  renderMap(route);
}

function switchRoute(i,o,d){activeRouteIdx=i;renderResults(allRoutes,i,o,d)}

// ── Map ──
function renderMap(route){
  var mapDiv=document.getElementById('routeMap');
  if(!mapDiv||!MapClass)return;

  routeMap=new MapClass(mapDiv,{
    zoom:6,
    center:{lat:52.5,lng:-1.5},
    mapId:'nl-travel-map',
    disableDefaultUI:true,
    zoomControl:true
  });

  // Draw polyline from route
  if(route.polyline&&route.polyline.encodedPolyline){
    var path=google.maps.geometry?google.maps.geometry.encoding.decodePath(route.polyline.encodedPolyline):null;
    if(path){
      var pl=new google.maps.Polyline({path:path,strokeColor:'#223b7c',strokeWeight:4,strokeOpacity:0.8,map:routeMap});
      var bounds=new google.maps.LatLngBounds();
      path.forEach(function(p){bounds.extend(p)});
      routeMap.fitBounds(bounds,{top:40,right:40,bottom:40,left:40});
    }
  }

  // Fallback: if no polyline, try to fit to leg start/end
  if(route.legs&&route.legs[0]){
    var l=route.legs[0];
    if(l.startLocation&&l.endLocation){
      var bounds=new google.maps.LatLngBounds();
      bounds.extend(l.startLocation);
      bounds.extend(l.endLocation);
      if(!route.polyline||!route.polyline.encodedPolyline)routeMap.fitBounds(bounds,{top:40,right:40,bottom:40,left:40});
    }
  }
}

// ── Helpers ──
function nd(s){if(!s)return'';return s.includes('T')?s:s.replace(' ','T')+'Z'}
function fmtDate(d){var D=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];return D[d.getDay()]+' '+d.getDate()+' '+M[d.getMonth()]}
function fmtTime(d){return pad(d.getHours())+':'+pad(d.getMinutes())}
function pad(n){return n<10?'0'+n:''+n}
function formatDuration(s){var sec=parseInt(s,10);if(isNaN(sec))return s;var h=Math.floor(sec/3600);var m=Math.floor((sec%3600)/60);return h>0?h+'h '+m+'min':m+' min'}
function formatDistance(m){return m>=1000?(m/1000).toFixed(1)+' km':m+' m'}
function fmtISO(v){if(!v)return'';if(typeof v==='string'){var d=new Date(v);return isNaN(d)?v:fmtTime(d)}if(v.text)return v.text;if(v instanceof Date)return fmtTime(v);return''}
function classifyStep(s){if(s.travelMode==='WALK'||s.travelMode==='WALKING')return'WALKING';if(s.travelMode==='DRIVE'||s.travelMode==='DRIVING')return'DRIVING';if(s.transitDetails){var l=s.transitDetails.transitLine||{};if(l.vehicle&&l.vehicle.type)return l.vehicle.type;return'RAIL'}return'WALKING'}
function getModeLabel(m){var L={WALKING:'🚶 Walk',WALK:'🚶 Walk',DRIVING:'🚗 Drive',DRIVE:'🚗 Drive',BUS:'🚌 Bus',INTERCITY_BUS:'🚌 Coach',RAIL:'🚆 Train',HEAVY_RAIL:'🚆 Train',COMMUTER_TRAIN:'🚆 Train',HIGH_SPEED_TRAIN:'🚄 Train',LONG_DISTANCE_TRAIN:'🚆 Train',SUBWAY:'🚇 Underground',METRO_RAIL:'🚇 Metro',TRAM:'🚊 Tram',LIGHT_RAIL:'🚊 Light rail',FERRY:'⛴ Ferry'};return L[m]||m}
function stripHtml(h){if(!h)return'';var t=document.createElement('div');t.innerHTML=h;return t.textContent||t.innerText||''}
function abbreviate(s){if(!s)return'';return s.length>25?s.substring(0,23)+'…':s}
function esc(s){return(s||'').replace(/'/g,"\\'").replace(/"/g,'&quot;')}
