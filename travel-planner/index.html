// ── Search — single entry point for fixture and custom selections alike ──
function doFixSearch(){
  if(!sel){
    var el=document.getElementById(fixClub?'fixFixtureArea':'fixClubWrap');
    if(el){el.classList.add('tp__shake');setTimeout(function(){el.classList.remove('tp__shake')},400)}
    return;
  }
  // Custom start point needs an address before we call the API
  var customVal=custAddrVal();
  if(fixPreset==='custom'&&!customVal){
    var w=document.getElementById('fixCustomAddrWrap');
    if(w){w.classList.add('tp__shake');setTimeout(function(){w.classList.remove('tp__shake')},400)}
    NL.toast('Add the custom address first');
    return;
  }

  var btn=document.getElementById('fixBtn');
  btn.classList.add('btn--loading');btn.textContent='Searching…';

  var homeClub=sel.home,awayClub=sel.away;
  var homeGroundAddr=homeClub?addr(homeClub):((sel.homeName||'Home')+', UK');
  var homeStadiumLabel=homeClub?(homeClub.stadium||homeClub.short||homeClub.name):(sel.homeName||'Home');

  var ko=sel.ko,ftEst=new Date(ko.getTime()+72e5),opts={};
  if(fixDir==='to'){
    // No pre-KO slider: searches target kick-off itself, and the KO buffer
    // strip on results shows the margin each route actually gives.
    opts.arrivalTime=ko.toISOString();
  }else{
    var ea=+document.getElementById('extraAfter').value;
    opts.departureTime=new Date(ftEst.getTime()+ea*6e4).toISOString();
  }
  searchCtx={ko:ko,ftEst:ftEst,dir:fixDir,tm:fixTM,driveDep:null};
  _lastRun=doFixSearch;

  // DRIVING mode
  if(fixTM==='drive'){
    var useCustom=fixPreset==='custom'&&customVal;
    var awayPoint=useCustom?customVal:(awayClub?addr(awayClub):homeGroundAddr);
    var awayLabelTxt=useCustom?customVal:(awayClub?(awayClub.stadium||awayClub.short):(sel.awayName||'Away'));
    var awayIconCh=useCustom?'📍':'🚗';
    var dOrigin=awayPoint;
    var dDest=homeGroundAddr;
    var dOL=awayIconCh+' '+awayLabelTxt;
    var dDL='🏟 '+homeStadiumLabel;
    if(fixDir==='from'){dOrigin=homeGroundAddr;dDest=awayPoint;dOL='🏟 '+homeStadiumLabel;dDL=awayIconCh+' '+awayLabelTxt}
    lastOL=dOL;lastDL=dDL;
    doDriveSearch(dOrigin,dDest,opts,dOL,dDL).finally(function(){btn.classList.remove('btn--loading');updateDirText()});
    return;
  }

  // TRANSIT mode
  var awayAddrs=[];
  if(fixPreset==='custom'){awayAddrs.push(customVal)}
  else if(awayClub&&awayClub.station&&awayClub.station.length>1){awayClub.station.forEach(function(sn,i){awayAddrs.push(stationAddr(awayClub,i))})}
  else if(awayClub){awayAddrs.push(stationAddr(awayClub))}
  else{
    // Away side unknown to clubs-meta (e.g. TBC) — a station search has nothing to aim at
    btn.classList.remove('btn--loading');updateDirText();
    NL.toast('No station data for the away side — use a custom start point');
    return;
  }

  var awayStLabel=awayClub?stationLabel(awayClub):(sel.awayName||'Away Station');
  var awayIcon,awayDescLabel;
  if(fixPreset==='custom'){awayDescLabel=customVal||'Custom';awayIcon='📍 '}
  else{awayDescLabel=awayStLabel;awayIcon='🚉 '}

  var sw2=null;
  if(fixPreset!=='custom'){sw2=fixDir==='to'?'first':'last'}

  var pairs=awayAddrs.map(function(aa){
    if(fixDir==='to') return{o:aa,d:homeGroundAddr};
    else return{o:homeGroundAddr,d:aa};
  });

  var oL=(fixDir==='to'?awayIcon+awayDescLabel:'🏟 '+homeStadiumLabel);
  var dL=(fixDir==='to'?'🏟 '+homeStadiumLabel:awayIcon+awayDescLabel);
  lastSearch={o:pairs[0].o,d:pairs[0].d,oL:oL,dL:dL,opts:opts};
  lastOL=oL;lastDL=dL;

  doMultiRoute(pairs,'TRANSIT',opts,oL,dL,getEnabledModes(),sw2).finally(function(){btn.classList.remove('btn--loading');updateDirText()});
}

// ── Error handling: plain English + retry ──
var _lastRun=null;
function tpRetry(){if(_lastRun)_lastRun()}
function friendlyErr(e){
  var m=(e&&e.message)||'';
  if(/failed to fetch|networkerror|load failed|network/i.test(m))return'Couldn’t reach the route service. Check your connection and try again.';
  if(/geocod|not found|invalid.*address|address.*invalid/i.test(m))return'Couldn’t find one of the addresses. Check the custom address and try again.';
  if(/api key|permission|denied|quota|exhausted/i.test(m))return'The route service refused the request. Try again in a minute.';
  return'Route search failed. Try again in a moment.';
}
function errHTML(e){
  var raw=(e&&e.message)||'';
  return'<div class="tp__error"><div class="tp__error-msg">'+NL.escHtml(friendlyErr(e))+'</div>'
    +(raw?'<div class="tp__error-raw">'+NL.escHtml(raw)+'</div>':'')
    +'<button type="button" class="btn btn--primary" onclick="tpRetry()">Try again</button></div>';
}

// ── KO buffer — "will I make kick-off?" computed per route ──
function routeArrDate(r){
  // Effective arrival: last transit arrival + any trailing walk (unless hidden)
  if(!r.legs||!r.legs[0]||!r.legs[0].steps)return null;
  var steps=r.legs[0].steps,lastArr=null,trailingWalk=0;
  for(var i=steps.length-1;i>=0;i--){
    var s=steps[i];
    if(s.transitDetails&&s.transitDetails.stopDetails&&s.transitDetails.stopDetails.arrivalTime){lastArr=new Date(s.transitDetails.stopDetails.arrivalTime);break}
    if(s.travelMode==='WALK'&&s.staticDuration){trailingWalk+=parseInt(String(s.staticDuration).replace('s',''),10)||0}
  }
  if(!lastArr)return null;
  if(lastSkipWalk!=='last')lastArr=new Date(lastArr.getTime()+trailingWalk*1000);
  return lastArr;
}
function bufMins(r){
  if(!searchCtx)return null;
  if(searchCtx.dir==='to'){var a=routeArrDate(r);return a?Math.round((searchCtx.ko-a)/6e4):null}
  var d=firstDepTime(r);return d?Math.round((new Date(d)-searchCtx.ftEst)/6e4):null;
}
function bufStripHTML(b,extraSub){
  // b = minutes before KO (dir 'to') or after est. FT (dir 'from'); null = unknown
  if(b===null||!searchCtx)return'';
  if(searchCtx.dir==='to'){
    var cls=b>=30?'ok':b>=0?'tight':'late';
    var big=b>=0?('Arrives '+b+' min before kick-off'):('Arrives '+(-b)+' min after kick-off');
    var sub=b>=30?'Comfortable margin':b>=0?'Tight — no margin for delays':'Misses kick-off — pick an earlier route';
    if(extraSub)sub=extraSub+' · '+sub;
    return'<div class="tp__kobuf tp__kobuf--'+cls+'"><span class="big">'+big+'</span><span class="sub">'+sub+'</span></div>';
  }
  var txt=b>=0?('Departs '+b+' min after estimated full-time'):('Departs '+(-b)+' min before estimated full-time');
  return'<div class="tp__kobuf tp__kobuf--info"><span class="big">'+txt+'</span><span class="sub">'+(extraSub||'Assumes a 2-hour match')+'</span></div>';
}
function bufChipHTML(r){
  if(!searchCtx||searchCtx.dir!=='to')return'';
  var b=bufMins(r);if(b===null)return'';
  var cls=b>=30?'ok':b>=0?'tight':'late';
  return'<span class="chip-buf chip-buf--'+cls+'">'+(b>=0?'KO −'+b+'m':'KO +'+(-b)+'m')+'</span>';
}

// ── Driving search ──
var DFM='routes.duration,routes.distanceMeters,routes.staticDuration,routes.polyline.encodedPolyline,routes.routeLabels,routes.travelAdvisory,routes.legs.startLocation,routes.legs.endLocation,routes.legs.duration,routes.legs.staticDuration,routes.legs.steps.navigationInstruction,routes.legs.steps.localizedValues,routes.legs.steps.polyline.encodedPolyline,routes.description';

async function doDriveSearch(origin,dest,opts,oL,dL){
  var ra=document.getElementById('resultsArea');
  ra.innerHTML='<div class="tp__loading"><div class="tp__spinner"></div>Finding driving routes…</div>';
  try{
    var body={origin:{address:origin},destination:{address:dest},travelMode:'DRIVE',routingPreference:'TRAFFIC_AWARE',computeAlternativeRoutes:true,languageCode:'en-GB',units:'METRIC',routeModifiers:{avoidTolls:false}};
    if(opts.departureTime)body.departureTime=opts.departureTime;
    else if(opts.arrivalTime){
      // DRIVE doesn't support arrivalTime — assume departing 3h before the
      // target arrival. This assumption is DISCLOSED on the results (KO strip).
      body.departureTime=new Date(new Date(opts.arrivalTime).getTime()-108e5).toISOString();
    }
    if(searchCtx&&body.departureTime)searchCtx.driveDep=new Date(body.departureTime);
    var r=await fetch(RU,{method:'POST',headers:{'Content-Type':'application/json','X-Goog-Api-Key':GK,'X-Goog-FieldMask':DFM},body:JSON.stringify(body)});
    if(!r.ok){var e=await r.json().catch(function(){return{}});throw new Error((e.error&&e.error.message)||'API error '+r.status)}
    var data=await r.json();
    if(!data.routes||!data.routes.length){ra.innerHTML='<div class="tp__error"><div class="tp__error-msg">No driving routes found between those two points.</div><button type="button" class="btn btn--primary" onclick="tpRetry()">Try again</button></div>';return}
    allR=data.routes.slice(0,3);aIdx=0;lastSkipWalk=null;
    renderDrive(allR,0,oL,dL);
  }catch(e){ra.innerHTML=errHTML(e)}
}

function renderDrive(routes,idx,oL,dL){
  var ra=document.getElementById('resultsArea'),r=routes[idx];
  var dur=r.duration?fmtDur(r.duration):'';
  var dist=r.distanceMeters?fmtDist(r.distanceMeters):'';

  // Estimated arrival for a drive route = assumed departure + duration
  function driveEta(rt){
    if(!searchCtx||!searchCtx.driveDep||!rt.duration)return null;
    var sec=parseInt(String(rt.duration).replace('s',''),10);
    return isNaN(sec)?null:new Date(searchCtx.driveDep.getTime()+sec*1000);
  }

  var h='<div class="tp__results"><div class="tp__map-col"><div id="routeMap"></div></div><div class="tp__board-col">';
  h+='<div class="tp__summary">';
  h+='<div class="tp__summary-route">🚗 '+abbr(oL.replace(/^🚗 |^🏟 |^📍 /,''))+'<span class="arrow">→</span>'+abbr(dL.replace(/^🚗 |^🏟 |^📍 /,''))+'</div>';
  h+='<div class="tp__summary-duration">'+dur+(dist?' · '+dist:'')+'</div>';
  if(searchCtx)h+='<div class="tp__summary-depart">'+(searchCtx.driveDep?'Departs '+ft(searchCtx.driveDep)+' · ':'')+'Kick-off '+ft(searchCtx.ko)+'</div>';
  h+='</div>';

  // KO buffer for the active route, with the departure assumption said out loud
  if(searchCtx&&searchCtx.driveDep){
    var eta=driveEta(r);
    if(eta){
      if(searchCtx.dir==='to'){
        var b=Math.round((searchCtx.ko-eta)/6e4);
        h+=bufStripHTML(b,'If you leave at '+ft(searchCtx.driveDep));
      }else{
        var bf=Math.round((searchCtx.driveDep-searchCtx.ftEst)/6e4);
        h+=bufStripHTML(bf,'Assumes a 2-hour match · Home by ~'+ft(eta));
      }
    }
  }

  h+='<div class="tp__drive-results">';
  routes.forEach(function(rt,i){
    var rd=rt.duration?fmtDur(rt.duration):'';
    var rdist=rt.distanceMeters?fmtDist(rt.distanceMeters):'';
    var rtoll=rt.travelAdvisory&&rt.travelAdvisory.tollInfo;
    var rdesc=rt.description||'';
    var reta=driveEta(rt);

    // Extract major road names from steps
    var roads=extractRoads(rt);

    h+='<div class="tp__drive-card'+(i===idx?' active':'')+'" role="button" tabindex="0" onclick="swDrive('+i+',\''+esc(oL)+'\',\''+esc(dL)+'\')">';
    h+='<div class="tp__drive-head"><span class="tp__drive-dur">'+(i===0?'🟢 Fastest':'Route '+(i+1))+' · '+rd+'</span><span class="tp__drive-dist">'+rdist+'</span></div>';
    if(reta&&searchCtx.dir==='to')h+='<div class="tp__drive-meta">ETA '+ft(reta)+' · kick-off '+ft(searchCtx.ko)+'</div>';
    if(rdesc)h+='<div class="tp__drive-via">via '+rdesc+'</div>';
    h+=roadBadgesHTML(roads);
    if(rtoll)h+='<div class="tp__drive-toll">💰 Tolls on this route</div>';
    h+='</div>';
  });
  h+='</div>';

  h+='</div></div>';
  ra.innerHTML=h;drawDriveMap(routes,idx);
  ra.scrollIntoView({behavior:'smooth',block:'start'});
}

// Extract major road names in route order with type classification
function extractRoads(route){
  if(!route.legs||!route.legs[0]||!route.legs[0].steps)return[];
  var seen={},roads=[];
  route.legs[0].steps.forEach(function(s){
    if(s.navigationInstruction&&s.navigationInstruction.instructions){
      var txt=s.navigationInstruction.instructions;
      // Match M-roads, A-roads (including A1(M) pattern), B-roads
      var matches=txt.match(/[MAB]\d+(?:\(M\))?/g);
      if(matches){matches.forEach(function(rd){
        if(!seen[rd]){
          seen[rd]=true;
          var type='b';
          if(/^M\d/.test(rd)||/\(M\)/.test(rd))type='m';
          else if(/^A\d/.test(rd))type='a';
          roads.push({name:rd,type:type});
        }
      })}
    }
  });
  return roads;
}

function roadBadgesHTML(roads){
  if(!roads||!roads.length)return'';
  return'<div class="tp__drive-roads">'+roads.map(function(r){
    return'<span class="tp__road-badge tp__road-badge--'+r.type+'">'+r.name+'</span>';
  }).join('')+'</div>';
}

// Resolve a CSS variable to its computed hex/rgb value. Used wherever the
// Google Maps API needs literal colour strings (it doesn't accept var()).
function tpCssVar(name){return getComputedStyle(document.documentElement).getPropertyValue(name).trim();}

// Driving map style now lives in nl-utils.js as NL.mapStyle.drive (promoted
// in v1.5). Future map variants (satellite, transit) belong alongside.

// Draw map for driving — all routes shown, active one bold, road-focused style
function drawDriveMap(routes,activeIdx){
  var el=document.getElementById('routeMap');if(!el||!mapOK)return;
  gMap=new google.maps.Map(el,{zoom:6,center:{lat:52.5,lng:-1.5},disableDefaultUI:true,zoomControl:true});
  var driveStyled=new google.maps.StyledMapType(NL.mapStyle.drive,{name:'Drive'});
  gMap.mapTypes.set('drive',driveStyled);
  gMap.setMapTypeId('drive');
  var bounds=new google.maps.LatLngBounds();

  // Draw inactive routes first (underneath) — grey
  routes.forEach(function(rt,i){
    if(i===activeIdx)return;
    if(rt.polyline&&rt.polyline.encodedPolyline){
      try{
        var p=google.maps.geometry.encoding.decodePath(rt.polyline.encodedPolyline);
        var poly=new google.maps.Polyline({path:p,strokeColor:tpCssVar('--text-muted'),strokeWeight:4,strokeOpacity:.35,map:gMap,zIndex:1});
        p.forEach(function(pt){bounds.extend(pt)});
        (function(idx){poly.addListener('click',function(){swDrive(idx,lastOL,lastDL)})})(i);
      }catch(e){}
    }
  });

  // Draw active route on top — NL red
  var ar=routes[activeIdx];
  if(ar&&ar.polyline&&ar.polyline.encodedPolyline){
    try{
      var p=google.maps.geometry.encoding.decodePath(ar.polyline.encodedPolyline);
      new google.maps.Polyline({path:p,strokeColor:tpCssVar('--primary'),strokeWeight:5,strokeOpacity:.9,map:gMap,zIndex:10});
      p.forEach(function(pt){bounds.extend(pt)});
    }catch(e){}
  }

  if(!bounds.isEmpty())gMap.fitBounds(bounds,{top:50,right:50,bottom:50,left:50});

  // Origin/destination markers (legacy Marker — no mapId on driving map)
  if(ar&&ar.legs&&ar.legs[0]){
    var lg=ar.legs[0];
    if(lg.startLocation&&lg.startLocation.latLng){
      new google.maps.Marker({position:{lat:lg.startLocation.latLng.latitude,lng:lg.startLocation.latLng.longitude},map:gMap,title:'Start'});
    }
    if(lg.endLocation&&lg.endLocation.latLng){
      new google.maps.Marker({position:{lat:lg.endLocation.latLng.latitude,lng:lg.endLocation.latLng.longitude},map:gMap,title:'Destination'});
    }
  }
}

function swDrive(i,o,d){aIdx=i;renderDrive(allR,i,o,d)}

// ── Multi-station route: parallel API calls, merged results ──
async function doMultiRoute(pairs,tm,opts,oL,dL,modes,skipWalk){
  // pairs = [{o,d}, ...] — one per station address
  // For single-station clubs this is just [{o,d}] — same as before
  if(pairs.length===1){
    doRoute(pairs[0].o,pairs[0].d,tm,opts,oL,dL,modes,skipWalk);
    return;
  }
  var ra=document.getElementById('resultsArea');
  ra.innerHTML='<div class="tp__loading"><div class="tp__spinner"></div>Searching '+pairs.length+' stations…</div>';
  var isToMode=!!opts.arrivalTime;
  try{
    // Fire all station queries in parallel
    var results=await Promise.all(pairs.map(function(p){
      return callAPI(p.o,p.d,tm,opts,modes).catch(function(){return{routes:[]}});
    }));
    // Merge all routes into one pool
    var collected=[];
    results.forEach(function(data){
      if(data.routes)collected=collected.concat(data.routes);
    });
    if(!collected.length){ra.innerHTML='<div class="tp__error"><div class="tp__error-msg">No routes found from any of the away side’s stations.</div><div class="tp__error-raw">Public transport may not cover this journey at that time — try Drive mode or a custom start point.</div><button type="button" class="btn btn--primary" onclick="tpRetry()">Try again</button></div>';return}

    // Expand search: try earlier/later departures from each station
    for(var pass=0;pass<2;pass++){
      var dd=dedupeRoutes(collected,isToMode);if(dd.length>=4)break;
      var edge=findEdgeDeparture(dd,isToMode?'earliest':'latest');if(!edge)break;
      var no={};
      if(isToMode)no.arrivalTime=new Date(new Date(edge).getTime()-18e5).toISOString();
      else no.departureTime=new Date(new Date(edge).getTime()+3e5).toISOString();
      try{
        var moreResults=await Promise.all(pairs.map(function(p){
          return callAPI(p.o,p.d,tm,no,modes).catch(function(){return{routes:[]}});
        }));
        moreResults.forEach(function(data){
          if(data.routes)collected=collected.concat(data.routes);
        });
      }catch(e){break}
    }
    allR=dedupeRoutes(collected,isToMode);aIdx=0;lastSkipWalk=skipWalk||null;render(allR,0,oL,dL);
  }catch(e){ra.innerHTML=errHTML(e)}
}

async function doRoute(o,d,tm,opts,oL,dL,modes,skipWalk){
  var ra=document.getElementById('resultsArea');
  ra.innerHTML='<div class="tp__loading"><div class="tp__spinner"></div>Finding routes…</div>';
  var isToMode=!!opts.arrivalTime; // TO = arrivalTime, FROM = departureTime
  try{
    var data=await callAPI(o,d,tm,opts,modes);
    if(!data.routes||!data.routes.length){ra.innerHTML='<div class="tp__error"><div class="tp__error-msg">No routes found for that journey.</div><div class="tp__error-raw">Public transport may not cover it at that time — try Drive mode or a custom start point.</div><button type="button" class="btn btn--primary" onclick="tpRetry()">Try again</button></div>';return}
    var collected=data.routes.slice();
    for(var pass=0;pass<2;pass++){
      var dd=dedupeRoutes(collected,isToMode);if(dd.length>=4)break;
      var edge=findEdgeDeparture(dd,isToMode?'earliest':'latest');if(!edge)break;
      var no={};
      if(isToMode)no.arrivalTime=new Date(new Date(edge).getTime()-18e5).toISOString();
      else no.departureTime=new Date(new Date(edge).getTime()+3e5).toISOString();
      try{var mr=await callAPI(o,d,tm,no,modes);if(mr.routes)collected=collected.concat(mr.routes)}catch(e){break}
    }
    allR=dedupeRoutes(collected,isToMode);aIdx=0;lastSkipWalk=skipWalk||null;render(allR,0,oL,dL);
  }catch(e){ra.innerHTML=errHTML(e)}
}

function findEdgeDeparture(routes,which){
  // Find earliest or latest first-transit-departure across all routes
  var deps=[];
  routes.forEach(function(r){
    var d=firstDepTime(r);
    if(d)deps.push(d);
  });
  if(!deps.length)return null;
  deps.sort();
  return which==='earliest'?deps[0]:deps[deps.length-1];
}

function firstDepTime(r){
  if(!r.legs||!r.legs[0]||!r.legs[0].steps)return'';
  for(var i=0;i<r.legs[0].steps.length;i++){
    var s=r.legs[0].steps[i];
    if(s.transitDetails&&s.transitDetails.stopDetails&&s.transitDetails.stopDetails.departureTime)
      return s.transitDetails.stopDetails.departureTime;
  }
  return'';
}

function dedupeRoutes(routes,isToMode){
  function durSec(r){
    if(!r.duration)return 99999;
    return parseInt(String(r.duration).replace('s',''),10)||99999;
  }
  // Build a mode signature: sorted list of vehicle types used in transit legs
  function modeSig(r){
    if(!r.legs||!r.legs[0]||!r.legs[0].steps)return'';
    var modes=[];
    r.legs[0].steps.forEach(function(s){
      if(s.transitDetails&&s.transitDetails.transitLine&&s.transitDetails.transitLine.vehicle){
        var t=s.transitDetails.transitLine.vehicle.type;
        if(modes.indexOf(t)===-1)modes.push(t);
      }
    });
    return modes.sort().join('+');
  }
  var groups={};
  routes.forEach(function(r){
    var dep=firstDepTime(r);
    var key=(dep?dep.substring(0,16):'no-transit')+'|'+modeSig(r);
    if(!groups[key]||durSec(r)<durSec(groups[key])){
      groups[key]=r;
    }
  });
  var unique=Object.keys(groups).map(function(k){return groups[k]});
  if(isToMode){
    unique.sort(function(a,b){return(firstDepTime(b)||'').localeCompare(firstDepTime(a)||'')});
  }else{
    unique.sort(function(a,b){return(firstDepTime(a)||'').localeCompare(firstDepTime(b)||'')});
  }
  return unique.slice(0,4);
}

// Get transit mode names for a route (for chips)
function routeModeNames(r){
  if(!r.legs||!r.legs[0]||!r.legs[0].steps)return'';
  var seen={},names=[];
  r.legs[0].steps.forEach(function(s){
    if(s.transitDetails&&s.transitDetails.transitLine&&s.transitDetails.transitLine.vehicle){
      var t=s.transitDetails.transitLine.vehicle.type;
      var n=vShort(t);
      if(!seen[n]){seen[n]=true;names.push(n)}
    }
  });
  return names.join(', ');
}

// ── Consolidate walks ──
function consol(steps){if(!steps)return[];var out=[],wb=null;steps.forEach(function(s){if(s.travelMode==='WALK'){if(!wb)wb={travelMode:'WALK',_w:[]};wb._w.push(s)}else{if(wb){out.push(wb);wb=null}out.push(s)}});if(wb)out.push(wb);return out}

// ── Render ──
function render(routes,idx,oL,dL){
  var ra=document.getElementById('resultsArea'),r=routes[idx];
  if(!r.legs||!r.legs[0]){ra.innerHTML='<div class="tp__error">Invalid route.</div>';return}
  var leg=r.legs[0],dur=r.duration?fmtDur(r.duration):'',dist=r.distanceMeters?fmtDist(r.distanceMeters):'';

  // Find overall departure time from first transit step
  var overallDep='';
  var steps=consol(leg.steps);
  _currentSteps=steps; // store for leg zoom
  for(var si=0;si<(leg.steps||[]).length;si++){
    var ts=leg.steps[si];
    if(ts.transitDetails&&ts.transitDetails.stopDetails&&ts.transitDetails.stopDetails.departureTime){
      overallDep=fI(ts.transitDetails.stopDetails.departureTime);break;
    }
  }

  // Check for overnight journey — look for 4h+ gap between consecutive transit legs
  var overnight=false;
  var transitTimes=[];
  (leg.steps||[]).forEach(function(s){
    if(s.transitDetails&&s.transitDetails.stopDetails){
      var sd=s.transitDetails.stopDetails;
      if(sd.departureTime)transitTimes.push({type:'dep',t:new Date(sd.departureTime)});
      if(sd.arrivalTime)transitTimes.push({type:'arr',t:new Date(sd.arrivalTime)});
    }
  });
  // Check gaps between arrival of one leg and departure of next
  var lastArr=null;
  (leg.steps||[]).forEach(function(s){
    if(s.transitDetails&&s.transitDetails.stopDetails){
      var sd=s.transitDetails.stopDetails;
      if(lastArr&&sd.departureTime){
        var gap=new Date(sd.departureTime).getTime()-lastArr.getTime();
        if(gap>4*36e5)overnight=true; // 4+ hour gap
      }
      if(sd.arrivalTime)lastArr=new Date(sd.arrivalTime);
    }
  });

  // Also find the last transit arrival time
  var overallArr='';
  for(var ai=(leg.steps||[]).length-1;ai>=0;ai--){
    var as=leg.steps[ai];
    if(as.transitDetails&&as.transitDetails.stopDetails&&as.transitDetails.stopDetails.arrivalTime){
      overallArr=fI(as.transitDetails.stopDetails.arrivalTime);break;
    }
  }

  // Extract fare info from leg localizedValues
  var fareText='';
  if(leg.localizedValues&&leg.localizedValues.transitFare&&leg.localizedValues.transitFare.text){
    fareText=leg.localizedValues.transitFare.text;
  }

  var h='<div class="tp__results"><div class="tp__map-col"><div id="routeMap"></div></div><div class="tp__board-col">';
  h+='<div class="tp__summary">';
  var oClean=abbr(oL.replace(/^(?:🚗|🏟|🚉|📍)\s*/u,''));
  var dClean=abbr(dL.replace(/^(?:🚗|🏟|🚉|📍)\s*/u,''));
  h+='<div class="tp__summary-route"><div>Depart '+oClean+'</div><div>Arrive '+dClean+'</div></div>';
  h+='<div class="tp__summary-duration">'+dur+(dist?' · '+dist:'')+(fareText?' · '+fareText:'')+'</div>';
  if(overallDep||overallArr||searchCtx){
    var timeStr='';
    if(overallDep)timeStr+='Departs '+overallDep;
    if(overallDep&&overallArr)timeStr+=' · ';
    if(overallArr)timeStr+='Arrives '+overallArr;
    if(searchCtx)timeStr+=(timeStr?' · ':'')+'Kick-off '+ft(searchCtx.ko);
    h+='<div class="tp__summary-depart">'+timeStr+'</div>';
  }
  if(overnight)h+='<div class="tp__summary-depart" style="color:var(--amber-light);">⚠️ Requires overnight stay — no same-day route available</div>';
  h+='</div>';

  // KO buffer strip — leads the board with "will I make kick-off?"
  h+=bufStripHTML(bufMins(r));

  // Route alternatives — above the board, sticky
  if(routes.length>1){
    h+='<div class="tp__alts tp__alts--sticky">';
    routes.forEach(function(rt,i){
      var rd=rt.duration?fmtDur(rt.duration):'',chip='Route '+(i+1);
      if(rt.legs&&rt.legs[0]&&rt.legs[0].steps){for(var j=0;j<rt.legs[0].steps.length;j++){var st=rt.legs[0].steps[j];if(st.transitDetails&&st.transitDetails.stopDetails&&st.transitDetails.stopDetails.departureTime){chip=fI(st.transitDetails.stopDetails.departureTime);break}}}
      var mNames=routeModeNames(rt);
      h+='<div class="tp__alt-chip'+(i===idx?' active':'')+'" role="button" tabindex="0" onclick="sw('+i+',\''+esc(oL)+'\',\''+esc(dL)+'\')"><div class="chip-time">'+chip+(rd?' <span class="dur">'+rd+'</span>':'')+'</div>'+(mNames?'<div class="chip-modes">'+mNames+'</div>':'')+bufChipHTML(rt)+'</div>';
    });
    h+='</div>';
  }

  // Board in scroll container
  h+='<div class="tp__board-scroll"><div class="tp__board">';

  // Helper: get vehicle type from a transit step
  function stepVT(st){if(!st||!st.transitDetails||!st.transitDetails.transitLine||!st.transitDetails.transitLine.vehicle)return'';return st.transitDetails.transitLine.vehicle.type}
  function isRail(vt){return vt==='RAIL'||vt==='HEAVY_RAIL'||vt==='COMMUTER_TRAIN'||vt==='HIGH_SPEED_TRAIN'||vt==='LONG_DISTANCE_TRAIN'}
  // Format stop: rail gets CRS code, others get (Tram)/(Metro)/(Bus)
  var agencyAlias={
    'Strathclyde Partnership for Transport':'Subway',
    'Transport for Greater Manchester':'Metrolink',
    'Nexus':'Tyne & Wear Metro'
  };
  function fmtStop(name,vt,agency){
    if(!name)return'';
    if(isRail(vt))return addCRS(name);
    if(vt==='SUBWAY'||vt==='METRO_RAIL'){
      if(!agency)return name;
      return name+' ('+(agencyAlias[agency]||agency)+')';
    }
    if(vt==='TRAM'||vt==='LIGHT_RAIL')return name+' (Tram)';
    if(vt==='BUS'||vt==='INTERCITY_BUS')return name+' (Bus)';
    return name;
  }
  function stepAgency(st){try{var a=st.transitDetails.transitLine.agencies;return(a&&a[0]&&a[0].name)||''}catch(e){return''}}

  var destName=dL.replace(/^🏟 |^🚉 |^📍 /,'');
  var dIcon=dL.match(/^(🏟|🚉|📍)/);dIcon=dIcon?dIcon[0]+' ':'';

  // Calculate adjusted arrive time (add last walk duration to last transit arrival)
  var arriveBookendTime='';
  if(lastSkipWalk!=='last'&&overallArr){
    var lastWalkMins=0;
    if(steps.length>0&&steps[steps.length-1]._w){
      steps[steps.length-1]._w.forEach(function(ws){
        if(ws.staticDuration){var sec=parseInt(String(ws.staticDuration).replace('s',''),10)||0;lastWalkMins+=Math.ceil(sec/60)}
        else if(ws.localizedValues&&ws.localizedValues.staticDuration&&ws.localizedValues.staticDuration.text){
          var m=ws.localizedValues.staticDuration.text.match(/(\d+)/);if(m)lastWalkMins+=parseInt(m[1],10);
        }
      });
    }
    if(lastWalkMins>0){
      // Find last transit arrival as Date, add walk
      for(var ai2=(leg.steps||[]).length-1;ai2>=0;ai2--){
        var as2=leg.steps[ai2];
        if(as2.transitDetails&&as2.transitDetails.stopDetails&&as2.transitDetails.stopDetails.arrivalTime){
          var arrDate=new Date(as2.transitDetails.stopDetails.arrivalTime);
          arrDate.setMinutes(arrDate.getMinutes()+lastWalkMins);
          arriveBookendTime=ft(arrDate);break;
        }
      }
    }
    if(!arriveBookendTime)arriveBookendTime=overallArr;
  }

  for(var si2=0;si2<steps.length;si2++){
    var s=steps[si2];
    var cls=sClass(s),dep='',arr='',durT='',distT='';
    var lineCol='',lineTxt='',pillLabel='',mainText='',subText='';

    if(s._w){
      var totalDist=0,totalDurSec=0;
      s._w.forEach(function(ws){
        // Sum durations in seconds for accurate total
        if(ws.staticDuration){var sec=parseInt(String(ws.staticDuration).replace('s',''),10)||0;totalDurSec+=sec}
        if(ws.localizedValues&&ws.localizedValues.distance&&ws.localizedValues.distance.text)distT=ws.localizedValues.distance.text;
        // Parse distance correctly — "0.2 km" → 200m, "85 m" → 85m
        var dm=0;
        try{
          var dtxt=String(ws.localizedValues.distance.text);
          if(dtxt.indexOf('km')!==-1){
            dm=Math.round(parseFloat(dtxt)*1000);
          }else{
            dm=parseInt(dtxt.replace(/[^0-9]/g,''),10)||0;
          }
        }catch(e){}
        totalDist+=dm;
      });
      // Build total distance and duration text from summed values
      distT=totalDist>=1000?(totalDist/1000).toFixed(1)+' km':totalDist+' m';
      durT=totalDurSec>=60?Math.round(totalDurSec/60)+' mins':'1 min';

      var walkDesc='Walk';
      var nextStep=steps[si2+1];
      var prevStep=si2>0?steps[si2-1]:null;
      var isLast=!nextStep;
      var isFirstWalk=(si2===0);

      // Times for walk legs: first walk = backward from next transit dep; last walk = forward from prev transit arr
      if(isFirstWalk){
        for(var ni=si2+1;ni<steps.length;ni++){
          var nT=steps[ni];
          if(nT.transitDetails&&nT.transitDetails.stopDetails&&nT.transitDetails.stopDetails.departureTime){
            var nDep=new Date(nT.transitDetails.stopDetails.departureTime);
            arr=fI(nDep);dep=fI(new Date(nDep.getTime()-totalDurSec*1000));
            break;
          }
        }
      }else if(isLast){
        for(var pi=si2-1;pi>=0;pi--){
          var pT=steps[pi];
          if(pT.transitDetails&&pT.transitDetails.stopDetails&&pT.transitDetails.stopDetails.arrivalTime){
            var pArr=new Date(pT.transitDetails.stopDetails.arrivalTime);
            dep=fI(pArr);arr=fI(new Date(pArr.getTime()+totalDurSec*1000));
            break;
          }
        }
      }

      // Hide very short terminal walks (<150m) — essentially "you've arrived"
      if((isFirstWalk||isLast)&&totalDist<150&&totalDist>0)continue;

      // Skip first walk if departing from station AND first transit leg is rail-type
      if(isFirstWalk&&lastSkipWalk==='first'){
        var firstVT=stepVT(nextStep);
        if(isRail(firstVT)||firstVT==='SUBWAY'||firstVT==='METRO_RAIL')continue;
        // Not rail — show the walk (station preset but bus route, user needs to see it)
      }
      // Skip last walk if arriving at station AND last transit leg is rail-type
      if(isLast&&lastSkipWalk==='last'){
        var lastVT=stepVT(prevStep);
        if(isRail(lastVT)||lastVT==='SUBWAY'||lastVT==='METRO_RAIL')continue;
      }

      // Check if this is a same-station transfer (arrive and depart same place)
      var prevArrName='',nextDepName='';
      if(prevStep&&prevStep.transitDetails&&prevStep.transitDetails.stopDetails&&prevStep.transitDetails.stopDetails.arrivalStop)
        prevArrName=prevStep.transitDetails.stopDetails.arrivalStop.name||'';
      if(nextStep&&nextStep.transitDetails&&nextStep.transitDetails.stopDetails&&nextStep.transitDetails.stopDetails.departureStop)
        nextDepName=nextStep.transitDetails.stopDetails.departureStop.name||'';

      // Same station → show connection time
      if(prevArrName&&nextDepName&&prevArrName.toLowerCase()===nextDepName.toLowerCase()){
        var connMins='';
        var prevArrTime=prevStep&&prevStep.transitDetails&&prevStep.transitDetails.stopDetails?prevStep.transitDetails.stopDetails.arrivalTime:null;
        var nextDepTime2=nextStep&&nextStep.transitDetails&&nextStep.transitDetails.stopDetails?nextStep.transitDetails.stopDetails.departureTime:null;
        if(prevArrTime&&nextDepTime2){
          var gapMs=new Date(nextDepTime2).getTime()-new Date(prevArrTime).getTime();
          connMins=Math.round(gapMs/6e4);
        }
        var stationCRS=getCRS(prevArrName);
        var stationDisp=stationCRS?prevArrName+' ('+stationCRS+')':prevArrName;
        h+='<div class="tp__walk-connector"><div class="wc-times"></div><div class="wc-rail"><span class="wc-dot"></span></div><div class="wc-text">🔄 '+(connMins?connMins+'-minute connection at '+stationDisp:'Connection at '+stationDisp)+'</div></div>';
        continue;
      }

      // Different stations between two transit legs = interchange walk
      var isInterchange=prevStep&&nextStep&&prevStep.transitDetails&&nextStep.transitDetails;

      if(isLast){
        walkDesc='Walk to '+destName;
      }else if(nextStep&&nextStep.transitDetails&&nextStep.transitDetails.stopDetails&&nextStep.transitDetails.stopDetails.departureStop){
        walkDesc='Walk to '+fmtStop(nextStep.transitDetails.stopDetails.departureStop.name,stepVT(nextStep),stepAgency(nextStep));
      }else if(prevStep&&prevStep.transitDetails&&prevStep.transitDetails.stopDetails&&prevStep.transitDetails.stopDetails.arrivalStop){
        walkDesc='Walk from '+fmtStop(prevStep.transitDetails.stopDetails.arrivalStop.name,stepVT(prevStep),stepAgency(prevStep));
      }

      // Short interchange walk between different stops — show connection time + walk
      if(isInterchange&&totalDist<500){
        var connMins2='';
        var pArrT=prevStep&&prevStep.transitDetails&&prevStep.transitDetails.stopDetails?prevStep.transitDetails.stopDetails.arrivalTime:null;
        var nDepT=nextStep&&nextStep.transitDetails&&nextStep.transitDetails.stopDetails?nextStep.transitDetails.stopDetails.departureTime:null;
        if(pArrT&&nDepT){connMins2=Math.round((new Date(nDepT).getTime()-new Date(pArrT).getTime())/6e4)}
        h+='<div class="tp__walk-connector"><div class="wc-times"></div><div class="wc-rail"><span class="wc-dot"></span></div><div class="wc-text">🔄 '+(connMins2?connMins2+'-minute connection · ':'')+walkDesc+(distT?' · '+distT:'')+'</div></div>';
        continue;
      }

      if(totalDist<300&&totalDist>0){
        h+='<div class="tp__walk-connector"><div class="wc-times"></div><div class="wc-rail"><span class="wc-dot"></span></div><div class="wc-text">🚶 '+walkDesc+(distT?' · '+distT:'')+(durT?' · '+durT:'')+'</div></div>';
        continue;
      }
      pillLabel='🚶 Walk';
      mainText=walkDesc;
      subText=(distT||'')+(durT?' · '+durT:'');
    }else if(s.transitDetails){
      var td=s.transitDetails,sd=td.stopDetails||{};
      if(sd.departureTime)dep=fI(sd.departureTime);
      if(sd.arrivalTime)arr=fI(sd.arrivalTime);
      var ds=sd.departureStop||{},as=sd.arrivalStop||{},ln=td.transitLine||{};
      var lnName=ln.nameShort||ln.name||'';
      var hs=td.headsign||'';
      if(ln.vehicle&&ln.vehicle.type)cls=vC(ln.vehicle.type);
      if(ln.color)lineCol=ln.color;
      if(ln.textColor)lineTxt=ln.textColor;
      if(s.localizedValues&&s.localizedValues.staticDuration)durT=s.localizedValues.staticDuration.text;

      // Pill = emoji + line name (e.g. "🚆 Northern", "🚇 Metro")
      var vtype=ln.vehicle?ln.vehicle.type:'RAIL';
      var emoji=vEmoji(vtype);
      pillLabel=lnName?(emoji+' '+lnName):vL(vtype);

      // Main text = boarding → alighting with CRS (rail) or type label (tram/metro/bus)
      var agName=(ln.agencies&&ln.agencies[0]&&ln.agencies[0].name)||'';
      mainText=fmtStop(ds.name||'',vtype,agName)+(as.name?' → '+fmtStop(as.name,vtype,agName):'');

      // Sub text = vehicle type ∙ stop count ∙ towards headsign ∙ duration
      var parts=[];
      var shortType=vShort(vtype);
      if(td.stopCount)parts.push(shortType+' \u2022 '+td.stopCount+' stops');
      else parts.push(shortType);
      if(hs)parts.push('towards '+hs);
      if(durT)parts.push(durT);
      subText=parts.join(' · ');
    }else{
      if(s.navigationInstruction)mainText=s.navigationInstruction.instructions||'';
      if(s.localizedValues&&s.localizedValues.staticDuration)durT=s.localizedValues.staticDuration.text;
      if(s.localizedValues&&s.localizedValues.distance)distT=s.localizedValues.distance.text;
      pillLabel='🚶 Walk';
      mainText=(distT||'')+(durT?' · '+durT:'');
    }

    var dotStyle=lineCol?' style="border-color:'+lineCol+'"':'';
    var modeStyle=lineCol?' style="background:'+lineCol+';color:'+(lineTxt||'var(--white)')+'"':'';

    h+='<div class="tp__leg tp__leg--'+cls+'" role="button" tabindex="0" title="Show this leg on the map" onclick="zoomToStep('+si2+')" style="cursor:pointer">';
    h+='<div class="tp__leg-times">';
    h+=dep?'<div class="tp__leg-time">'+dep+'</div>':'<div></div>';
    h+=arr?'<div class="tp__leg-time-end">'+arr+'</div>':'<div></div>';
    h+='</div>';
    h+='<div class="tp__leg-rail"><div class="dot"'+dotStyle+'></div>';
    h+='<div class="line"'+(lineCol?' style="background:'+lineCol+'"':'')+'></div>';
    h+='</div>';
    h+='<div class="tp__leg-detail"><div class="tp__leg-mode"'+modeStyle+'>'+pillLabel+'</div>';
    if(mainText)h+='<div class="tp__leg-route">'+mainText+'</div>';
    if(subText)h+='<div class="tp__leg-stops">'+subText+'</div>';
    h+='</div></div>';
  }

  // Arrive bookend
  h+='<div class="tp__leg"><div class="tp__leg-times">'+(arriveBookendTime?'<div class="tp__leg-time">'+arriveBookendTime+'</div>':'')+'</div><div class="tp__leg-rail"></div><div class="tp__leg-detail" style="font-weight:800;font-size:var(--text-xs);color:var(--navy)">'+dIcon+'Arrive '+destName+'</div></div>';

  h+='</div></div>'; // close board + board-scroll
  h+='</div></div>'; // close board-col + results
  ra.innerHTML=h;drawMap(r);
  ra.scrollIntoView({behavior:'smooth',block:'start'});
}
function sw(i,o,d){aIdx=i;render(allR,i,o,d)}

// Store current consolidated steps for leg zoom
var _currentSteps=[];
var _highlightPoly=null;

function zoomToStep(stepIdx){
  if(!gMap||!_currentSteps[stepIdx])return;
  var s=_currentSteps[stepIdx];
  var bounds=new google.maps.LatLngBounds();
  var paths=[];

  if(s._w){
    s._w.forEach(function(ws){
      if(ws.polyline&&ws.polyline.encodedPolyline){
        try{var p=google.maps.geometry.encoding.decodePath(ws.polyline.encodedPolyline);p.forEach(function(pt){bounds.extend(pt)});paths=paths.concat(p)}catch(e){}
      }
    });
  }else if(s.polyline&&s.polyline.encodedPolyline){
    try{var p=google.maps.geometry.encoding.decodePath(s.polyline.encodedPolyline);p.forEach(function(pt){bounds.extend(pt)});paths=paths.concat(p)}catch(e){}
  }

  if(bounds.isEmpty()){
    if(s.startLocation&&s.startLocation.latLng)bounds.extend({lat:s.startLocation.latLng.latitude,lng:s.startLocation.latLng.longitude});
    if(s.endLocation&&s.endLocation.latLng)bounds.extend({lat:s.endLocation.latLng.latitude,lng:s.endLocation.latLng.longitude});
  }

  if(!bounds.isEmpty()){
    gMap.fitBounds(bounds,{top:60,right:60,bottom:60,left:60});
    // Clear previous glow
    if(_highlightPoly){_highlightPoly.forEach(function(p){p.setMap(null)});_highlightPoly=null}
    // Draw glow using the leg's own colour
    if(paths.length){
      var glowCol=tpCssVar('--navy'); // default navy
      if(s.transitDetails&&s.transitDetails.transitLine&&s.transitDetails.transitLine.color)glowCol=s.transitDetails.transitLine.color;
      _highlightPoly=[
        new google.maps.Polyline({path:paths,strokeColor:glowCol,strokeWeight:18,strokeOpacity:.12,map:gMap,zIndex:90}),
        new google.maps.Polyline({path:paths,strokeColor:glowCol,strokeWeight:11,strokeOpacity:.22,map:gMap,zIndex:91})
      ];
    }
  }
}

// ── Map (styled via Cloud Map ID: a47d3923fb8143cb8894dc48) ──

function drawMap(r){
  var el=document.getElementById('routeMap');if(!el||!mapOK)return;
  gMap=new google.maps.Map(el,{zoom:6,center:{lat:52.5,lng:-1.5},disableDefaultUI:true,zoomControl:true,mapId:'a47d3923fb8143cb8894dc48'});
  var bounds=new google.maps.LatLngBounds();
  // Step polylines with colours
  if(r.legs&&r.legs[0]&&r.legs[0].steps){
    r.legs[0].steps.forEach(function(s){
      if(s.polyline&&s.polyline.encodedPolyline){
        try{
          var col=tpCssVar('--text-muted'),w=2;
          if(s.travelMode==='TRANSIT'){col=tpCssVar('--navy');w=4;if(s.transitDetails&&s.transitDetails.transitLine&&s.transitDetails.transitLine.color)col=s.transitDetails.transitLine.color}
          var p=google.maps.geometry.encoding.decodePath(s.polyline.encodedPolyline);
          new google.maps.Polyline({path:p,strokeColor:col,strokeWeight:w,strokeOpacity:.9,map:gMap});
          p.forEach(function(pt){bounds.extend(pt)});
        }catch(e){}
      }
    });
  }
  // Fallback to route polyline
  if(bounds.isEmpty()&&r.polyline&&r.polyline.encodedPolyline){
    try{var p=google.maps.geometry.encoding.decodePath(r.polyline.encodedPolyline);new google.maps.Polyline({path:p,strokeColor:tpCssVar('--navy'),strokeWeight:4,map:gMap});p.forEach(function(pt){bounds.extend(pt)})}catch(e){}
  }
  if(!bounds.isEmpty())gMap.fitBounds(bounds,{top:50,right:50,bottom:50,left:50});

  var gInfoWindow=new google.maps.InfoWindow();
  // Helper: coloured circle marker content
  function circlePin(col,size){
    var d=document.createElement('div');
    d.style.cssText='width:'+size+'px;height:'+size+'px;border-radius:50%;background:'+col+';border:2px solid var(--white);box-shadow:0 1px 3px rgba(0,0,0,.3)';
    return d;
  }

  // Add markers at boarding/alighting stops
  if(r.legs&&r.legs[0]&&r.legs[0].steps){
    r.legs[0].steps.forEach(function(s){
      if(s.transitDetails&&s.transitDetails.stopDetails){
        var sd=s.transitDetails.stopDetails;
        var ln=s.transitDetails.transitLine||{};
        var col=ln.color||tpCssVar('--navy');
        var lnName=ln.nameShort||ln.name||'';
        if(sd.departureStop&&sd.departureStop.location&&sd.departureStop.location.latLng){
          var dLoc=sd.departureStop.location.latLng;
          var dm=new google.maps.marker.AdvancedMarkerElement({
            position:{lat:dLoc.latitude,lng:dLoc.longitude},
            map:gMap,title:sd.departureStop.name,
            content:circlePin(col,10)
          });
          dm.addListener('click',function(){gInfoWindow.setContent('<div style="font-family:var(--font);font-size:var(--text-sm);font-weight:600;padding:2px">'+sd.departureStop.name+(lnName?' · '+lnName:'')+'</div>');gInfoWindow.open(gMap,dm)});
        }
        if(sd.arrivalStop&&sd.arrivalStop.location&&sd.arrivalStop.location.latLng){
          var aLoc=sd.arrivalStop.location.latLng;
          var am=new google.maps.marker.AdvancedMarkerElement({
            position:{lat:aLoc.latitude,lng:aLoc.longitude},
            map:gMap,title:sd.arrivalStop.name,
            content:circlePin(col,10)
          });
          am.addListener('click',function(){gInfoWindow.setContent('<div style="font-family:var(--font);font-size:var(--text-sm);font-weight:600;padding:2px">'+sd.arrivalStop.name+(lnName?' · '+lnName:'')+'</div>');gInfoWindow.open(gMap,am)});
        }
      }
    });
  }
  // Origin/destination markers
  if(r.legs&&r.legs[0]){
    var lg=r.legs[0];
    if(lg.startLocation&&lg.startLocation.latLng){
      new google.maps.marker.AdvancedMarkerElement({position:{lat:lg.startLocation.latLng.latitude,lng:lg.startLocation.latLng.longitude},map:gMap,title:'Start'});
    }
    if(lg.endLocation&&lg.endLocation.latLng){
      new google.maps.marker.AdvancedMarkerElement({position:{lat:lg.endLocation.latLng.latitude,lng:lg.endLocation.latLng.longitude},map:gMap,title:'Destination'});
    }
  }
}

// ── Helpers ──
function nd(s){return s?(s.includes('T')?s:s.replace(' ','T')+'Z'):''}
function fd(d){return['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()]+' '+d.getDate()+' '+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()]}
function ft(d){return NL.formatTime(d)}
function fmtDur(s){return s?NL.formatDuration(s):''}
function fmtDist(m){return m>=1000?(m/1000).toFixed(1)+' km':m+' m'}
function fI(v){if(!v)return'';var d=new Date(v);return isNaN(d)?String(v):ft(d)}
function sClass(s){if(s._w||s.travelMode==='WALK')return'walk';if(s.travelMode==='DRIVE')return'drive';if(s.transitDetails){var l=s.transitDetails.transitLine||{};if(l.vehicle)return vC(l.vehicle.type);return'train'}return'walk'}
function sLabel(s){if(s._w||s.travelMode==='WALK')return'🚶 Walk';if(s.travelMode==='DRIVE')return'🚗 Drive';if(s.transitDetails){var l=s.transitDetails.transitLine||{};if(l.vehicle)return vL(l.vehicle.type);return'🚆 Transit'}return'🚶 Walk'}
function vC(t){return{BUS:'bus',INTERCITY_BUS:'bus',RAIL:'train',HEAVY_RAIL:'train',COMMUTER_TRAIN:'train',HIGH_SPEED_TRAIN:'train',LONG_DISTANCE_TRAIN:'train',SUBWAY:'subway',METRO_RAIL:'subway',TRAM:'tram',LIGHT_RAIL:'tram',FERRY:'train'}[t]||'train'}
function vL(t){return{BUS:'🚌 Bus',INTERCITY_BUS:'🚌 Coach',RAIL:'🚆 Train',HEAVY_RAIL:'🚆 Train',COMMUTER_TRAIN:'🚆 Train',HIGH_SPEED_TRAIN:'🚄 Train',LONG_DISTANCE_TRAIN:'🚆 Train',SUBWAY:'🚇 Metro',METRO_RAIL:'🚇 Metro',TRAM:'🚊 Tram',LIGHT_RAIL:'🚊 Tram',FERRY:'⛴ Ferry'}[t]||'🚆 Transit'}
function vEmoji(t){return{BUS:'🚌',INTERCITY_BUS:'🚌',RAIL:'🚆',HEAVY_RAIL:'🚆',COMMUTER_TRAIN:'🚆',HIGH_SPEED_TRAIN:'🚄',LONG_DISTANCE_TRAIN:'🚆',SUBWAY:'🚇',METRO_RAIL:'🚇',TRAM:'🚊',LIGHT_RAIL:'🚊',FERRY:'⛴'}[t]||'🚆'}
function vShort(t){return{BUS:'Bus',INTERCITY_BUS:'Coach',RAIL:'Train',HEAVY_RAIL:'Train',COMMUTER_TRAIN:'Train',HIGH_SPEED_TRAIN:'Train',LONG_DISTANCE_TRAIN:'Train',SUBWAY:'Metro',METRO_RAIL:'Metro',TRAM:'Tram',LIGHT_RAIL:'Tram',FERRY:'Ferry'}[t]||'Transit'}
function abbr(s){return s&&s.length>35?s.substring(0,33)+'…':s||''}
function esc(s){return(s||'').replace(/'/g,"\\'").replace(/"/g,'&quot;')}

// ── URL state sync (single flow; legacy mode=manual links restore via home/away/ko) ──
var _urlSuppressed=false; // suppress syncURL during readURL restoration
function syncURL(){
  if(_urlSuppressed)return;
  var p=new URLSearchParams();
  if(sel&&sel.custom){
    if(sel.home)p.set('home',sel.home.code);
    if(sel.away)p.set('away',sel.away.code);
    var koVal=document.getElementById('cfKO').value;
    if(koVal)p.set('ko',koVal);
  }else{
    if(fixClub)p.set('club',fixClub.code);
    if(sel&&sel.matchID)p.set('fix',sel.matchID);
  }
  p.set('dir',fixDir);
  p.set('tm',fixTM);
  p.set('preset',fixPreset);
  if(fixPreset==='custom'){var cv=custAddrVal();if(cv)p.set('addr',cv)}
  if(fixDir==='from')p.set('post',document.getElementById('extraAfter').value);
  var qs=p.toString();
  var newURL=window.location.pathname+(qs?'?'+qs:'');
  history.replaceState(null,'',newURL);
}

function readURL(){
  var p=new URLSearchParams(window.location.search);
  if(!p.has('mode')&&!p.has('club')&&!p.has('home'))return; // no URL state to restore
  _urlSuppressed=true;

  // Direction
  var dir=p.get('dir')||'to';
  fixDir=dir;
  document.querySelectorAll('#fixtureMode .tp__dir-btn').forEach(function(b){var on=b.getAttribute('data-dir')===dir;b.classList.toggle('active',on);b.setAttribute('aria-pressed',on?'true':'false')});
  document.getElementById('postSlider').style.display=dir==='from'?'block':'none';

  // Preset
  var preset=p.get('preset')||'station';
  fixPreset=preset;
  document.querySelectorAll('#fixPresets .tp__preset').forEach(function(b){var on=b.getAttribute('data-p')===preset;b.classList.toggle('active',on);b.setAttribute('aria-pressed',on?'true':'false')});
  document.getElementById('fixCustomAddrWrap').style.display=preset==='custom'?'block':'none';
  if(preset==='custom'){
    if(!_acMounted)showAddrFallback();
    if(p.has('addr')){
      document.getElementById('fixCustomAddr').value=p.get('addr');
      var t=document.getElementById('fixCustomAddrText');if(t)t.value=p.get('addr');
    }
  }

  // Transport mode
  var tm=p.get('tm')||'transit';
  fixTM=tm;
  document.querySelectorAll('#fixModeToggle .tp__mode-pill').forEach(function(b){var on=b.getAttribute('data-tm')===tm;b.classList.toggle('active',on);b.setAttribute('aria-pressed',on?'true':'false')});

  if(p.has('post')){document.getElementById('extraAfter').value=p.get('post');upPostLbl()}
  // Legacy `arr` (pre-KO slider) is ignored — the KO buffer replaced it

  // Custom fixture (also catches legacy mode=manual links)
  if(p.has('home')&&p.has('away')&&p.has('ko')){
    var hc=clubs.find(function(cl){return cl.code===p.get('home')});
    var ac=clubs.find(function(cl){return cl.code===p.get('away')});
    if(hc&&ac){
      cfHome=hc;cfAway=ac;
      document.getElementById('cfKO').value=p.get('ko');
      if(cfHomePicker)cfHomePicker.setValue(hc.name);
      if(cfAwayPicker)cfAwayPicker.setValue(ac.name);
      var body=document.getElementById('cfBody');
      if(body&&body.style.display==='none')toggleCF();
      cfSel();
    }
  }

  // Club + fixture — loadFix is async; match selection happens in its callback
  var clubCode=p.get('club');
  var matchID=p.get('fix');
  if(clubCode){
    var c=clubs.find(function(cl){return cl.code===clubCode});
    if(c){
      _pendingMatchID=(sel&&sel.custom)?null:(matchID||null);
      selFC(c);
      if(fixClubPicker)fixClubPicker.setValue(c.name);
    }
  }
  updateDirText();updateBanner();
  _urlSuppressed=false;
}

// Pending match ID for fixture restore — set by readURL, consumed by loadFix
var _pendingMatchID=null;

// ── Keyboard: Enter/Space activates any role="button" element (fixtures, chips, legs, drive cards) ──
document.addEventListener('keydown',function(e){
  if(e.key!=='Enter'&&e.key!==' ')return;
  var t=e.target;
  if(t&&t.getAttribute&&t.getAttribute('role')==='button'&&t.tagName!=='BUTTON'){e.preventDefault();t.click()}
});

// ── Init ──
window.nlAuthReady=function(){
  loadClubs();loadCRS();initMap();
  // Custom-fixture default KO: today, 15:00 weekend or 19:45 weekday
  var now=new Date();
  var day=now.getDay();
  var isWeekend=(day===0||day===6);
  var hh=isWeekend?'15':'19';
  var mm=isWeekend?'00':'45';
  var yyyy=now.getFullYear();
  var mo=String(now.getMonth()+1).padStart(2,'0');
  var dd=String(now.getDate()).padStart(2,'0');
  document.getElementById('cfKO').value=yyyy+'-'+mo+'-'+dd+'T'+hh+':'+mm;

  // Hook inputs for URL sync + selection updates
  var ea=document.getElementById('extraAfter');
  if(ea)ea.addEventListener('change',syncURL);
  var ca=document.getElementById('fixCustomAddr');
  if(ca)ca.addEventListener('change',function(){updateBanner();syncURL()});
  var cat=document.getElementById('fixCustomAddrText');
  if(cat)cat.addEventListener('change',function(){document.getElementById('fixCustomAddr').value=cat.value.trim();updateBanner();syncURL()});
  var ck=document.getElementById('cfKO');
  if(ck)ck.addEventListener('change',function(){cfSel();syncURL()});

  // Wait for the local `clubs` array (needed to resolve full club objects with
  // postcode/station/optaID from a picked name), then mount the shared pickers
  // and restore URL / localStorage. No artificial boot delay — poll from now.
  var waitForClubs=setInterval(function(){
    if(clubs.length>0){
      clearInterval(waitForClubs);
      fixClubPicker=NL.clubPicker('#fixClubWrap',{season:'all',freetext:false,placeholder:'Start typing a club name…',onSelect:function(pick){selFC(clubs.find(function(c){return c.name===pick.name})||null)}});
      cfHomePicker=NL.clubPicker('#cfHomeW',{season:'all',freetext:false,placeholder:'Home club…',onSelect:function(pick){cfHome=clubs.find(function(c){return c.name===pick.name})||null;cfSel();syncURL()}});
      cfAwayPicker=NL.clubPicker('#cfAwayW',{season:'all',freetext:false,placeholder:'Away club…',onSelect:function(pick){cfAway=clubs.find(function(c){return c.name===pick.name})||null;cfSel();syncURL()}});
      // The component's clear (×) doesn't fire onSelect, so also reset downstream state on clear.
      [['#fixClubWrap',function(){selFC(null)}],
       ['#cfHomeW',function(){cfHome=null;syncURL()}],
       ['#cfAwayW',function(){cfAway=null;syncURL()}]].forEach(function(pr){var b=document.querySelector(pr[0]+' .club-picker__clear');if(b)b.addEventListener('click',pr[1])});
      if(window.location.search){readURL()}
      else{restoreLastClub()}
    }
  },100);
};

// Remember last selected club
function saveLastClub(code){
  try{localStorage.setItem('nl_tp_club',code)}catch(e){}
}
function restoreLastClub(){
  try{
    var code=localStorage.getItem('nl_tp_club');
    if(!code)return;
    var c=clubs.find(function(cl){return cl.code===code});
    if(c){selFC(c);if(fixClubPicker)fixClubPicker.setValue(c.name)}
  }catch(e){}
}
