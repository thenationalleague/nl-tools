<style>
  .tp{max-width:1100px;margin:0 auto;padding:clamp(16px,2vw,32px) clamp(12px,2vw,24px) 60px}
  .tp__modes{display:flex;margin-bottom:16px;background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  .tp__mode-btn{flex:1;padding:10px 12px;border:none;background:var(--white);font-family:var(--font);font-size:var(--text-xs)!important;font-weight:800;font-variation-settings:'wght' 800;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);cursor:pointer;border-bottom:3px solid transparent;transition:all .15s}
  .tp__mode-btn.active{color:var(--navy);border-bottom-color:var(--navy);background:var(--off-white)}
  .tp__panel{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:16px}
  .tp__panel-title{font-size:var(--text-xs);font-weight:800;font-variation-settings:'wght' 800;text-transform:uppercase;letter-spacing:.04em;color:var(--navy);margin-bottom:14px}
  .tp__field{margin-bottom:12px}.tp__field:last-child{margin-bottom:0}
  .tp__label{display:block;font-size:var(--text-xs);font-weight:700;font-variation-settings:'wght' 700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);margin-bottom:4px}
  .tp__input,.tp__select{width:100%;padding:8px 12px;border:2px solid var(--border);border-radius:var(--radius);font-family:var(--font);font-size:var(--text-sm)!important;color:var(--text);background:var(--white);transition:border-color .15s;appearance:none}
  .tp__input:focus,.tp__select:focus{outline:none;border-color:var(--navy)}
  .tp__select-wrap{position:relative}.tp__select-wrap::after{content:"▾";position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--text-muted);pointer-events:none}

  /* AC — uses brand .club-picker from nl-brand.css.
     Bridge: .tp__ac-wrap maps to .club-picker, .tp__ac-list maps to .club-picker__dropdown, etc.
     Only tool-specific additions here. */
  .tp__ac-wrap{position:relative}
  .tp__ac-crest{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:24px;height:24px;object-fit:contain;pointer-events:none;display:none;z-index:2}
  .tp__ac-wrap.has-crest .tp__input{padding-left:42px}
  .tp__ac-list{position:absolute;top:100%;left:0;right:0;background:var(--white);border:1px solid var(--border);border-radius:0 0 var(--radius) var(--radius);box-shadow:var(--shadow);max-height:240px;overflow-y:auto;z-index:100;display:none;margin-top:2px}
  .tp__ac-list.show{display:block}
  .tp__ac-item{display:flex;align-items:center;gap:10px;padding:9px 12px;cursor:pointer;font-size:var(--text-sm);border-bottom:1px solid var(--border);transition:background .1s}
  .tp__ac-item:last-child{border-bottom:none}
  .tp__ac-item:hover{background:var(--off-white)}
  .tp__ac-item img{width:24px;height:24px;object-fit:contain}
  .tp__ac-item .name{flex:1;font-weight:600;font-variation-settings:'wght' 600}
  .tp__ac-item .ground{font-size:var(--text-xs);color:var(--text-muted);text-transform:uppercase;letter-spacing:.03em;margin-left:auto}

  /* Direction toggle */
  .tp__dir-toggle{display:flex;border-radius:var(--radius);overflow:hidden;border:2px solid var(--border);margin-bottom:12px}
  .tp__dir-btn{flex:1;padding:8px;border:none;background:var(--white);font-family:var(--font);font-size:var(--text-xs)!important;font-weight:800;font-variation-settings:'wght' 800;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);cursor:pointer;transition:all .15s}
  .tp__dir-btn.active{background:var(--navy);color:var(--white)}

  /* Origin preset */
  .tp__presets{display:flex;gap:6px;margin-bottom:8px}
  .tp__preset{padding:5px 10px;border:2px solid var(--border);border-radius:99px;background:var(--white);font-family:var(--font);font-size:var(--text-xs)!important;font-weight:700;font-variation-settings:'wght' 700;color:var(--text-muted);cursor:pointer;transition:all .15s;white-space:nowrap}
  .tp__preset.active{border-color:var(--navy);background:var(--navy);color:var(--white)}
  .tp__preset:hover:not(.active){border-color:var(--navy);color:var(--navy)}

  /* Transit toggles */
  .tp__transit-toggles{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
  .tp__tt{padding:5px 10px;border:2px solid var(--border);border-radius:99px;background:var(--white);font-family:var(--font);font-size:var(--text-xs)!important;font-weight:700;font-variation-settings:'wght' 700;color:var(--text-muted);cursor:pointer;transition:all .15s}
  .tp__tt.on{border-color:var(--navy);background:var(--navy);color:var(--white)}
  .tp__tt:hover:not(.on){border-color:var(--navy)}

  /* Slider */
  .tp__slider-row{display:flex;align-items:center;gap:10px}
  .tp__slider{flex:1;accent-color:var(--navy)}
  .tp__slider-val{font-size:var(--text-xs);font-weight:700;font-variation-settings:'wght' 700;color:var(--navy);min-width:55px;text-align:right}
  .tp__slider-note{font-size:var(--text-xs);color:var(--text-muted);margin-top:3px;font-style:italic}

  /* Fixture list */
  .tp__fix-list{max-height:260px;overflow-y:auto}
  .tp__fix-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border:2px solid var(--border);border-radius:var(--radius);margin-bottom:6px;cursor:pointer;transition:all .15s}
  .tp__fix-item:hover{border-color:var(--navy)}.tp__fix-item.selected{border-color:var(--navy);background:var(--off-white)}
  .tp__fix-item img{width:24px;height:24px;object-fit:contain}
  .tp__fix-item .info{flex:1}
  .tp__fix-item .teams{font-size:var(--text-sm);font-weight:700;font-variation-settings:'wght' 700}
  .tp__fix-item .meta{font-size:var(--text-xs);color:var(--text-muted);margin-top:2px}
  .tp__fix-item .badge{font-size:var(--text-xs);font-weight:800;text-transform:uppercase;padding:2px 7px;border-radius:99px}
  .tp__fix-item .badge--away{background:var(--amber-light);color:var(--amber)}
  .tp__fix-item .badge--home{background:var(--green-light);color:var(--green)}

  /* Results */
  .tp__results{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
  .tp__map-col{min-height:350px;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
  .tp__map-col #routeMap{width:100%;height:100%;min-height:350px}
  .tp__board-col{min-width:0;display:flex;flex-direction:column;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}

  /* Summary */
  .tp__summary{background:var(--navy);color:var(--white);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px}
  .tp__summary-route{font-size:var(--text-sm);font-weight:800;font-variation-settings:'wght' 800}
  .tp__summary-route .arrow{color:rgba(255,255,255,.4);margin:0 6px}
  .tp__summary-duration{font-size:var(--text-xs);font-weight:600;font-variation-settings:'wght' 600;background:rgba(255,255,255,.15);padding:3px 10px;border-radius:99px}
  .tp__summary-depart{font-size:var(--text-xs);color:rgba(255,255,255,.6);width:100%}

  /* Alts — sticky between summary and board */
  .tp__alts{padding:8px 14px;background:var(--off-white);border-bottom:1px solid var(--border);display:flex;gap:6px;overflow-x:auto;flex-shrink:0}
  .tp__alts--sticky{position:sticky;top:0;z-index:10}
  .tp__alt-chip{flex-shrink:0;padding:6px 12px;border-radius:10px;border:2px solid var(--border);background:var(--white);font-family:var(--font);cursor:pointer;transition:all .15s;white-space:nowrap;text-align:center}
  .tp__alt-chip:hover{border-color:var(--navy);color:var(--navy)}
  .tp__alt-chip.active{background:var(--navy);color:var(--white);border-color:var(--navy)}
  .chip-time{font-size:var(--text-xs);font-weight:800;font-variation-settings:'wght' 800;color:var(--text);line-height:1.3}
  .chip-time .dur{font-weight:400;color:var(--text-muted);margin-left:3px;font-size:var(--text-xs)}
  .chip-modes{font-size:var(--text-xs);font-weight:600;font-variation-settings:'wght' 600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.03em;line-height:1.2}
  .tp__alt-chip.active .chip-time{color:var(--white)}
  .tp__alt-chip.active .chip-time .dur{color:rgba(255,255,255,.6)}
  .tp__alt-chip.active .chip-modes{color:rgba(255,255,255,.6)}

  /* Board scroll container */
  .tp__board-scroll{flex:1;max-height:55vh;overflow-y:auto;-webkit-overflow-scrolling:touch}

  /* Board — COMPACT */
  .tp__board{background:var(--white);overflow:hidden}
  .tp__leg{display:flex;border-bottom:1px solid var(--border)}.tp__leg:last-child{border-bottom:none}
  .tp__leg-timeline{width:54px;min-width:54px;display:flex;flex-direction:column;align-items:center;padding:10px 0}
  .tp__leg-time{font-size:var(--text-xs);font-weight:800;font-variation-settings:'wght' 800;color:var(--text);z-index:1}
  .tp__leg-timeline .line{flex:1;width:2px;background:var(--border);margin:3px 0}
  .tp__leg-time-end{font-size:var(--text-xs);font-weight:600;font-variation-settings:'wght' 600;color:var(--text-muted);z-index:1}
  .tp__leg-timeline .dot{width:10px;height:10px;border-radius:50%;border:2.5px solid var(--navy);background:var(--white);z-index:1;margin-bottom:2px}
  .tp__leg--walk .dot{border-color:var(--text-muted)}
  .tp__leg--bus .dot{border-color:var(--amber)}
  .tp__leg--train .dot{border-color:var(--navy)}
  .tp__leg--subway .dot{border-color:var(--primary)}
  .tp__leg--tram .dot{border-color:var(--green)}
  .tp__leg-detail{flex:1;padding:8px 14px 8px 0}
  .tp__leg-mode{display:inline-flex;align-items:center;gap:4px;font-size:var(--text-xs);font-weight:800;font-variation-settings:'wght' 800;text-transform:uppercase;letter-spacing:.05em;padding:2px 7px;border-radius:99px;margin-bottom:3px}
  .tp__leg--walk .tp__leg-mode{background:var(--off-white);color:var(--text-muted)}
  .tp__leg--bus .tp__leg-mode{background:var(--amber-light);color:var(--amber)}
  .tp__leg--train .tp__leg-mode{background:var(--blue-light);color:var(--blue)}
  .tp__leg--subway .tp__leg-mode{background:var(--red-light);color:var(--primary)}
  .tp__leg--tram .tp__leg-mode{background:var(--green-light);color:var(--green)}
  .tp__leg-route{font-size:var(--text-sm);font-weight:700;font-variation-settings:'wght' 700;color:var(--text);margin-bottom:1px;line-height:1.3}
  .tp__leg-stops{font-size:var(--text-xs);color:var(--text-muted);line-height:1.3}
  .tp__leg-duration{font-size:var(--text-xs);color:var(--text-muted);font-weight:600;font-variation-settings:'wght' 600}
  /* Compact walk connector */
  .tp__walk-connector{display:flex;align-items:center;gap:8px;padding:4px 14px 4px 54px;border-bottom:1px solid var(--border);font-size:var(--text-xs);color:var(--text-muted);font-weight:600;font-variation-settings:'wght' 600}
  .tp__walk-connector:last-child{border-bottom:none}
  .tp__walk-connector .wc-dot{width:6px;height:6px;border-radius:50%;background:var(--border);flex-shrink:0}
  .tp__walk-connector .wc-line{width:16px;height:1px;background:var(--border);flex-shrink:0}

  .tp__loading{text-align:center;padding:36px 20px;color:var(--text-muted);font-size:var(--text-sm)}
  .tp__spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--navy);border-radius:50%;animation:tpSpin .8s linear infinite;margin:0 auto 10px}
  @keyframes tpSpin{to{transform:rotate(360deg)}}
  .tp__error{text-align:center;padding:20px;color:var(--red);font-size:var(--text-xs);font-weight:600;background:var(--red-light);border-radius:var(--radius);margin-bottom:12px}
  .tp__btn-full{width:100%}
  .tp__footer{text-align:center;padding:16px;font-size:var(--text-xs);color:var(--text-muted)}
  .tp__row{display:flex;gap:8px}.tp__row>*{flex:1}
  @media(max-width:768px){.tp__results{grid-template-columns:1fr}.tp__map-col{min-height:220px}}
  @media(max-width:520px){.tp__summary{flex-direction:column;align-items:flex-start}.tp__leg-timeline{width:48px;min-width:48px}.tp__row{flex-direction:column;gap:0}}
</style>
</head>
<body>
<div id="pageWrap" style="display:none;">
<div id="nlTopbar"></div>
<div class="tp">

  <div class="tp__modes">
    <button class="tp__mode-btn active" data-mode="fixture" onclick="setMode('fixture')">Match Day Travel</button>
    <button class="tp__mode-btn" data-mode="manual" onclick="setMode('manual')">Manual Journey</button>
  </div>

  <!-- FIXTURE -->
  <div id="fixtureMode">
    <div class="tp__panel">
      <div class="tp__panel-title">Select Your Club</div>
      <div class="tp__field">
        <div class="tp__ac-wrap" id="fixClubWrap">
          <img class="tp__ac-crest" id="fixClubCrest" src="" alt="" onerror="this.onerror=null;this.style.display='none';">
          <input class="tp__input" type="text" id="fixClubInput" placeholder="Start typing a club name…" autocomplete="off">
          <div class="tp__ac-list" id="fixClubAC"></div>
        </div>
      </div>
    </div>
    <div id="fixFixtureArea"></div>
    <div id="fixConfig" style="display:none;">
      <div class="tp__panel">
        <div class="tp__panel-title">Journey Options</div>

        <div class="tp__field">
          <label class="tp__label">Direction</label>
          <div class="tp__dir-toggle">
            <button class="tp__dir-btn active" data-dir="to" onclick="setDir('to')">🚆 Travel TO</button>
            <button class="tp__dir-btn" data-dir="from" onclick="setDir('from')">🏠 Travel FROM</button>
          </div>
        </div>

        <div class="tp__field">
          <label class="tp__label">Start / end point</label>
          <div class="tp__presets" id="fixPresets">
            <button class="tp__preset active" data-p="stadium" onclick="setPreset('stadium')">🏟 Stadium</button>
            <button class="tp__preset" data-p="station" onclick="setPreset('station')">🚉 Railway Station</button>
            <button class="tp__preset" data-p="custom" onclick="setPreset('custom')">📍 Custom</button>
          </div>
          <input class="tp__input" type="text" id="fixCustomAddr" placeholder="Enter postcode or address…" style="display:none;" autocomplete="off">
        </div>

        <div class="tp__field" id="preSlider">
          <label class="tp__label">Arrive before kick-off</label>
          <div class="tp__slider-row">
            <input class="tp__slider" type="range" id="arrBefore" min="15" max="120" step="5" value="60" oninput="document.getElementById('arrBeforeV').textContent=this.value+' min'">
            <span class="tp__slider-val" id="arrBeforeV">60 min</span>
          </div>
        </div>
        <div class="tp__field" id="postSlider" style="display:none;">
          <label class="tp__label">Extra time after full-time</label>
          <div class="tp__slider-row">
            <input class="tp__slider" type="range" id="extraAfter" min="0" max="120" step="5" value="0" oninput="upPostLbl()">
            <span class="tp__slider-val" id="extraAfterV">Depart at FT</span>
          </div>
          <div class="tp__slider-note" id="postNote"></div>
        </div>

        <button class="btn btn--primary tp__btn-full" id="fixBtn" onclick="doFixSearch()">Find journey</button>
      </div>
    </div>
  </div>

  <!-- MANUAL — Custom Fixture Builder -->
  <div id="manualMode" style="display:none;">
    <div class="tp__panel">
      <div class="tp__panel-title">Custom Fixture</div>
      <div class="tp__field"><label class="tp__label">Home club</label>
        <div class="tp__ac-wrap" id="manHomeW"><img class="tp__ac-crest" id="manHomeCr" src="" alt="" onerror="this.onerror=null;this.style.display='none';"><input class="tp__input" type="text" id="manHomeI" placeholder="Home club…" autocomplete="off"><div class="tp__ac-list" id="manHomeAC"></div></div>
      </div>
      <div class="tp__field"><label class="tp__label">Away club</label>
        <div class="tp__ac-wrap" id="manAwayW"><img class="tp__ac-crest" id="manAwayCr" src="" alt="" onerror="this.onerror=null;this.style.display='none';"><input class="tp__input" type="text" id="manAwayI" placeholder="Away club…" autocomplete="off"><div class="tp__ac-list" id="manAwayAC"></div></div>
      </div>
      <div class="tp__field"><label class="tp__label">Kick-off</label>
        <input class="tp__input" type="datetime-local" id="manKO">
      </div>
      <div class="tp__field">
        <label class="tp__label">Direction</label>
        <div class="tp__dir-toggle">
          <button class="tp__dir-btn active" data-dir="to" onclick="setManDir('to')">🚆 Travel TO</button>
          <button class="tp__dir-btn" data-dir="from" onclick="setManDir('from')">🏠 Travel FROM</button>
        </div>
      </div>
      <div class="tp__field">
        <label class="tp__label">Start / end point</label>
        <div class="tp__presets" id="manPresets">
          <button class="tp__preset active" data-p="stadium" onclick="setManPreset('stadium')">🏟 Stadium</button>
          <button class="tp__preset" data-p="station" onclick="setManPreset('station')">🚉 Station</button>
          <button class="tp__preset" data-p="custom" onclick="setManPreset('custom')">📍 Custom</button>
        </div>
        <input class="tp__input" type="text" id="manCustomAddr" placeholder="Enter postcode or address…" style="display:none;" autocomplete="off">
      </div>
      <div class="tp__field" id="manPreSlider">
        <label class="tp__label">Arrive before kick-off</label>
        <div class="tp__slider-row">
          <input class="tp__slider" type="range" id="manArrBefore" min="15" max="120" step="5" value="60" oninput="document.getElementById('manArrBeforeV').textContent=this.value+' min'">
          <span class="tp__slider-val" id="manArrBeforeV">60 min</span>
        </div>
      </div>
      <div class="tp__field" id="manPostSlider" style="display:none;">
        <label class="tp__label">Extra time after full-time</label>
        <div class="tp__slider-row">
          <input class="tp__slider" type="range" id="manExtraAfter" min="0" max="120" step="5" value="0" oninput="upManPostLbl()">
          <span class="tp__slider-val" id="manExtraAfterV">Depart at FT</span>
        </div>
        <div class="tp__slider-note" id="manPostNote"></div>
      </div>
      <button class="btn btn--primary tp__btn-full" style="margin-top:6px;" id="manBtn" onclick="doManSearch()">Find journey</button>
    </div>
  </div>

  <div id="resultsArea"></div>
  <div class="tp__footer">Powered by Google Maps Platform & National League Services</div>
</div>
</div>

<script>
var GK='AIzaSyA1qH6K4vtUW8YbMKetK16q2GQaZ2EDXRs';
var RU='https://routes.googleapis.com/directions/v2:computeRoutes';
var CMU='https://raw.githubusercontent.com/thenationalleague/tools/refs/heads/main/assets/data/clubs-meta.json';
var STN_URL='https://raw.githubusercontent.com/thenationalleague/tools/refs/heads/main/assets/data/stations.json';
var CB='https://raw.githubusercontent.com/thenationalleague/tools/refs/heads/main/assets/crests/';
var FC=CB+'National%20League%20rose.png';

function loadCRS(){fetch(STN_URL).then(function(r){return r.json()}).then(function(data){data.forEach(function(s){var name=s.stationName,code=s.crsCode;if(!name||!code)return;crsLookup[name.toLowerCase()]=code;if(name.toLowerCase().indexOf('london ')===0)crsLookup[name.substring(7).toLowerCase()]=code;if(name.toLowerCase().indexOf(' international')!==-1){crsLookup[name.replace(/ International/i,'').toLowerCase()]=code;if(name.toLowerCase().indexOf('london ')===0)crsLookup[name.substring(7).replace(/ International/i,'').toLowerCase()]=code}})}).catch(function(){})}
function getCRS(n){if(!n)return'';var k=n.toLowerCase().replace(/ railway station$/,'').replace(/ station$/,'').replace(/ rail$/,'').trim();var c=crsLookup[k]||crsLookup[n.toLowerCase()]||'';if(c)return c;
// Fallback: try matching as a suffix — only if exactly one match (unambiguous)
if(k.length>=5){var keys=Object.keys(crsLookup),matches=[];for(var i=0;i<keys.length;i++){if(keys[i].length>k.length&&keys[i].indexOf(' '+k)===keys[i].length-k.length-1)matches.push(crsLookup[keys[i]])}if(matches.length===1)return matches[0]}

function addr(c){

  if(c.postcode)return c.postcode+', UK';

}
function stationAddr(c,idx){
  // Return Google-geocodable address for a club's station
  // idx selects which station (0-based) for multi-station clubs; defaults to 0
  if(c.station&&c.station.length){
    var sn=c.station[idx||0]||c.station[0];
    return sn+' Station, UK';
  }
  // Fallback if no station data
  return(c.short||c.name)+' Railway Station, UK';
}
function stationLabel(c){
  // Human-readable label for preset button: "Southend Central / Victoria"
  if(!c.station||!c.station.length)return(c.short||c.name)+' Station';
  if(c.station.length===1)return c.station[0];
  // Multi: abbreviate — show both separated by /
  return c.station.join(' / ');
}

var FM='routes.duration,routes.distanceMeters,routes.polyline.encodedPolyline,routes.legs.duration,routes.legs.startLocation,routes.legs.endLocation,routes.legs.localizedValues,routes.legs.steps.travelMode,routes.legs.steps.staticDuration,routes.legs.steps.polyline.encodedPolyline,routes.legs.steps.startLocation,routes.legs.steps.endLocation,routes.legs.steps.navigationInstruction,routes.legs.steps.localizedValues,routes.legs.steps.transitDetails.stopDetails,routes.legs.steps.transitDetails.transitLine,routes.legs.steps.transitDetails.headsign,routes.legs.steps.transitDetails.stopCount,routes.legs.steps.transitDetails.localizedValues';

async function callAPI(origin,dest,tm,opts,modes){
  var body={origin:{address:origin},destination:{address:dest},travelMode:tm,computeAlternativeRoutes:true,languageCode:'en-GB',units:'METRIC'};
  if(tm==='TRANSIT'){
    if(opts.arrivalTime)body.arrivalTime=opts.arrivalTime;
    else if(opts.departureTime)body.departureTime=opts.departureTime;
    var prefs={routingPreference:'FEWER_TRANSFERS'};
    if(modes&&modes.length>0&&modes.length<5)prefs.allowedTravelModes=modes;
    body.transitPreferences=prefs;
  }else{
    if(opts.departureTime)body.departureTime=opts.departureTime;
  }
  var r=await fetch(RU,{method:'POST',headers:{'Content-Type':'application/json','X-Goog-Api-Key':GK,'X-Goog-FieldMask':FM},body:JSON.stringify(body)});
  if(!r.ok){var e=await r.json().catch(function(){return{}});throw new Error((e.error&&e.error.message)||'API error '+r.status)}
  return r.json();
}

// ── Fix search ──
function doFixSearch(){
  if(!fixMatch||!fixClub)return;
  var a=fixMatch.attributes,tid=fixClub.optaID;
  var isH=a.homeTeam&&a.homeTeam.teamID===tid;
  var oppID=isH?a.awayTeam.teamID:a.homeTeam.teamID;
  var opp=clubs.find(function(c){return c.optaID===oppID});

  // Identify home and away clubs for this fixture
  var homeClub=isH?fixClub:opp;
  var awayClub=isH?opp:fixClub;

  // Home ground is always the match venue (fixed end)
  var homeGroundAddr=homeClub?addr(homeClub):(a.homeTeam.name+', UK');
  var homeStadiumLabel=homeClub?(homeClub.stadium||homeClub.short||homeClub.name):'Home';

  // Away club start point depends on preset
  var customAddrVal=document.getElementById('fixCustomAddr')?document.getElementById('fixCustomAddr').value.trim():'';

  // Build list of away addresses to query (multi-station support)
  var awayAddrs=[];
  if(fixPreset==='station'&&awayClub&&awayClub.station&&awayClub.station.length>1){
    awayClub.station.forEach(function(sn,i){awayAddrs.push(stationAddr(awayClub,i))});
  }else{
    var singleAddr=awayClub?(fixPreset==='station'?stationAddr(awayClub):fixPreset==='custom'?customAddrVal:addr(awayClub)):'';
    awayAddrs.push(singleAddr);
  }

  var awayStadiumLabel=awayClub?(awayClub.stadium||awayClub.short||awayClub.name):'Away';
  var awayStLabel=awayClub?stationLabel(awayClub):'Away Station';

  var awayIcon,awayDescLabel;
  if(fixPreset==='station'){awayDescLabel=awayStLabel;awayIcon='🚉 '}
  else if(fixPreset==='custom'){awayDescLabel=customAddrVal||'Custom';awayIcon='📍 '}
  else{awayDescLabel=awayStadiumLabel;awayIcon='🏟 '}

  var ko=new Date(nd(a.kickOffDateUTC)),opts={};
  if(fixDir==='to'){
    var mb=+document.getElementById('arrBefore').value;
    opts.arrivalTime=new Date(ko.getTime()-mb*6e4).toISOString();
  }else{
    var ea=+document.getElementById('extraAfter').value;
    opts.departureTime=new Date(ko.getTime()+72e5+ea*6e4).toISOString();
  }

  // Station preset: skip the walk at the away club's end
  var sw=null;
  if(fixPreset==='station'){
    sw=fixDir==='to'?'first':'last';
  }

  // Build origin/dest pairs for each away address
  var pairs=awayAddrs.map(function(aa){
    if(fixDir==='to') return{o:aa,d:homeGroundAddr};
    else return{o:homeGroundAddr,d:aa};
  });

  var oL=(fixDir==='to'?awayIcon+awayDescLabel:'🏟 '+homeStadiumLabel);
  var dL=(fixDir==='to'?'🏟 '+homeStadiumLabel:awayIcon+awayDescLabel);
  lastSearch={o:pairs[0].o,d:pairs[0].d,oL:oL,dL:dL,opts:opts};

  doMultiRoute(pairs,'TRANSIT',opts,oL,dL,getEnabledModes(),sw);
}

// ── Multi-station route: parallel API calls, merged results ──
async function doMultiRoute(pairs,tm,opts,oL,dL,modes,skipWalk){
  // pairs = [{o,d}, ...] — one per station address
  // For single-station clubs this is just [{o,d}] — same as before
  if(pairs.length===1){
    doRoute(pairs[0].o,pairs[0].d,tm,opts,oL,dL,modes,skipWalk);
    return;
  }
  var ra=document.getElementById('resultsArea');
  ra.innerHTML='<div class="tp__loading"><div class="tp__spinner"></div>Searching '+pairs.length+' stations…</div>';
  var isToMode=!!opts.arrivalTime;
  try{
    // Fire all station queries in parallel
    var results=await Promise.all(pairs.map(function(p){
      return callAPI(p.o,p.d,tm,opts,modes).catch(function(){return{routes:[]}});
    }));
    // Merge all routes into one pool
    var collected=[];
    results.forEach(function(data){
      if(data.routes)collected=collected.concat(data.routes);
    });
    if(!collected.length){ra.innerHTML='<div class="tp__error">No routes found across any station.</div>';return}

    // Expand search: try earlier/later departures from each station
    for(var pass=0;pass<2;pass++){
      var dd=dedupeRoutes(collected,isToMode);if(dd.length>=4)break;
      var edge=findEdgeDeparture(dd,isToMode?'earliest':'latest');if(!edge)break;
      var no={};
      if(isToMode)no.arrivalTime=new Date(new Date(edge).getTime()-18e5).toISOString();
      else no.departureTime=new Date(new Date(edge).getTime()+3e5).toISOString();
      try{
        var moreResults=await Promise.all(pairs.map(function(p){
          return callAPI(p.o,p.d,tm,no,modes).catch(function(){return{routes:[]}});
        }));
        moreResults.forEach(function(data){
          if(data.routes)collected=collected.concat(data.routes);
        });
      }catch(e){break}
    }
    allR=dedupeRoutes(collected,isToMode);aIdx=0;lastSkipWalk=skipWalk||null;render(allR,0,oL,dL);
  }catch(e){ra.innerHTML='<div class="tp__error">'+e.message+'</div>'}
}

async function doRoute(o,d,tm,opts,oL,dL,modes,skipWalk){
  var ra=document.getElementById('resultsArea');
  ra.innerHTML='<div class="tp__loading"><div class="tp__spinner"></div>Finding routes…</div>';
  var isToMode=!!opts.arrivalTime; // TO = arrivalTime, FROM = departureTime
  try{
    var data=await callAPI(o,d,tm,opts,modes);
    if(!data.routes||!data.routes.length){ra.innerHTML='<div class="tp__error">No routes found.</div>';return}
    var collected=data.routes.slice();
    for(var pass=0;pass<2;pass++){
      var dd=dedupeRoutes(collected,isToMode);if(dd.length>=4)break;
      var edge=findEdgeDeparture(dd,isToMode?'earliest':'latest');if(!edge)break;
      var no={};
      if(isToMode)no.arrivalTime=new Date(new Date(edge).getTime()-18e5).toISOString();
      else no.departureTime=new Date(new Date(edge).getTime()+3e5).toISOString();
      try{var mr=await callAPI(o,d,tm,no,modes);if(mr.routes)collected=collected.concat(mr.routes)}catch(e){break}
    }
    allR=dedupeRoutes(collected,isToMode);aIdx=0;lastSkipWalk=skipWalk||null;render(allR,0,oL,dL);
  }catch(e){ra.innerHTML='<div class="tp__error">'+e.message+'</div>'}
}

function findEdgeDeparture(routes,which){
  // Find earliest or latest first-transit-departure across all routes
  var deps=[];
  routes.forEach(function(r){
    var d=firstDepTime(r);
    if(d)deps.push(d);
  });
  if(!deps.length)return null;
  deps.sort();
  return which==='earliest'?deps[0]:deps[deps.length-1];
}

function firstDepTime(r){
  if(!r.legs||!r.legs[0]||!r.legs[0].steps)return'';
  for(var i=0;i<r.legs[0].steps.length;i++){
    var s=r.legs[0].steps[i];
    if(s.transitDetails&&s.transitDetails.stopDetails&&s.transitDetails.stopDetails.departureTime)
      return s.transitDetails.stopDetails.departureTime;
  }
  return'';
}

function dedupeRoutes(routes,isToMode){
  function durSec(r){
    if(!r.duration)return 99999;
    return parseInt(String(r.duration).replace('s',''),10)||99999;
  }
  // Build a mode signature: sorted list of vehicle types used in transit legs
  function modeSig(r){
    if(!r.legs||!r.legs[0]||!r.legs[0].steps)return'';
    var modes=[];
    r.legs[0].steps.forEach(function(s){
      if(s.transitDetails&&s.transitDetails.transitLine&&s.transitDetails.transitLine.vehicle){
        var t=s.transitDetails.transitLine.vehicle.type;
        if(modes.indexOf(t)===-1)modes.push(t);
      }
    });
    return modes.sort().join('+');
  }
  var groups={};
  routes.forEach(function(r){
    var dep=firstDepTime(r);
    var key=(dep?dep.substring(0,16):'no-transit')+'|'+modeSig(r);
    if(!groups[key]||durSec(r)<durSec(groups[key])){
      groups[key]=r;
    }
  });
  var unique=Object.keys(groups).map(function(k){return groups[k]});
  if(isToMode){
    unique.sort(function(a,b){return(firstDepTime(b)||'').localeCompare(firstDepTime(a)||'')});
  }else{
    unique.sort(function(a,b){return(firstDepTime(a)||'').localeCompare(firstDepTime(b)||'')});
  }
  return unique.slice(0,4);
}

// Get transit mode names for a route (for chips)
function routeModeNames(r){
  if(!r.legs||!r.legs[0]||!r.legs[0].steps)return'';
  var seen={},names=[];
  r.legs[0].steps.forEach(function(s){
    if(s.transitDetails&&s.transitDetails.transitLine&&s.transitDetails.transitLine.vehicle){
      var t=s.transitDetails.transitLine.vehicle.type;
      var n=vShort(t);
      if(!seen[n]){seen[n]=true;names.push(n)}
    }
  });
  return names.join(', ');
}

// ── Consolidate walks ──
function consol(steps){if(!steps)return[];var out=[],wb=null;steps.forEach(function(s){if(s.travelMode==='WALK'){if(!wb)wb={travelMode:'WALK',_w:[]};wb._w.push(s)}else{if(wb){out.push(wb);wb=null}out.push(s)}});if(wb)out.push(wb);return out}

// ── Render ──
function render(routes,idx,oL,dL){
  var ra=document.getElementById('resultsArea'),r=routes[idx];
  if(!r.legs||!r.legs[0]){ra.innerHTML='<div class="tp__error">Invalid route.</div>';return}
  var leg=r.legs[0],dur=r.duration?fmtDur(r.duration):'',dist=r.distanceMeters?fmtDist(r.distanceMeters):'';

  // Find overall departure time from first transit step
  var overallDep='';
  var steps=consol(leg.steps);
  for(var si=0;si<(leg.steps||[]).length;si++){
    var ts=leg.steps[si];
    if(ts.transitDetails&&ts.transitDetails.stopDetails&&ts.transitDetails.stopDetails.departureTime){
      overallDep=fI(ts.transitDetails.stopDetails.departureTime);break;
    }
  }

  // Check for overnight journey — look for 4h+ gap between consecutive transit legs
  var overnight=false;
  var transitTimes=[];
  (leg.steps||[]).forEach(function(s){
    if(s.transitDetails&&s.transitDetails.stopDetails){
      var sd=s.transitDetails.stopDetails;
      if(sd.departureTime)transitTimes.push({type:'dep',t:new Date(sd.departureTime)});
      if(sd.arrivalTime)transitTimes.push({type:'arr',t:new Date(sd.arrivalTime)});
    }
  });
  // Check gaps between arrival of one leg and departure of next
  var lastArr=null;
  (leg.steps||[]).forEach(function(s){
    if(s.transitDetails&&s.transitDetails.stopDetails){
      var sd=s.transitDetails.stopDetails;
      if(lastArr&&sd.departureTime){
        var gap=new Date(sd.departureTime).getTime()-lastArr.getTime();
        if(gap>4*36e5)overnight=true; // 4+ hour gap
      }
      if(sd.arrivalTime)lastArr=new Date(sd.arrivalTime);
    }
  });

  // Also find the last transit arrival time
  var overallArr='';
  for(var ai=(leg.steps||[]).length-1;ai>=0;ai--){
    var as=leg.steps[ai];
    if(as.transitDetails&&as.transitDetails.stopDetails&&as.transitDetails.stopDetails.arrivalTime){
      overallArr=fI(as.transitDetails.stopDetails.arrivalTime);break;
    }
  }

  // Extract fare info from leg localizedValues
  var fareText='';
  if(leg.localizedValues&&leg.localizedValues.transitFare&&leg.localizedValues.transitFare.text){
    fareText=leg.localizedValues.transitFare.text;
  }

  var h='<div class="tp__results"><div class="tp__map-col"><div id="routeMap"></div></div><div class="tp__board-col">';
  h+='<div class="tp__summary">';
  h+='<div class="tp__summary-route">Depart '+abbr(oL)+'<span class="arrow">→</span>Arrive '+abbr(dL)+'</div>';
  h+='<div class="tp__summary-duration">'+dur+(dist?' · '+dist:'')+(fareText?' · '+fareText:'')+'</div>';
  if(overallDep||overallArr){
    var timeStr='';
    if(overallDep)timeStr+='Departs '+overallDep;
    if(overallDep&&overallArr)timeStr+=' · ';
    if(overallArr)timeStr+='Arrives '+overallArr;
    h+='<div class="tp__summary-depart">'+timeStr+'</div>';
  }
  if(overnight)h+='<div class="tp__summary-depart" style="color:var(--amber-light);">⚠️ Requires overnight stay — no same-day route available</div>';
  h+='</div>';

  // Route alternatives — above the board, sticky
  if(routes.length>1){
    h+='<div class="tp__alts tp__alts--sticky">';
    routes.forEach(function(rt,i){
      var rd=rt.duration?fmtDur(rt.duration):'',chip='Route '+(i+1);
      if(rt.legs&&rt.legs[0]&&rt.legs[0].steps){for(var j=0;j<rt.legs[0].steps.length;j++){var st=rt.legs[0].steps[j];if(st.transitDetails&&st.transitDetails.stopDetails&&st.transitDetails.stopDetails.departureTime){chip=fI(st.transitDetails.stopDetails.departureTime);break}}}
      var mNames=routeModeNames(rt);
      h+='<div class="tp__alt-chip'+(i===idx?' active':'')+'" onclick="sw('+i+',\''+esc(oL)+'\',\''+esc(dL)+'\')"><div class="chip-time">'+chip+(rd?' <span class="dur">'+rd+'</span>':'')+'</div>'+(mNames?'<div class="chip-modes">'+mNames+'</div>':'')+'</div>';
    });
    h+='</div>';
  }

  // Board in scroll container
  h+='<div class="tp__board-scroll"><div class="tp__board">';

  // Helper: get vehicle type from a transit step
  function stepVT(st){if(!st||!st.transitDetails||!st.transitDetails.transitLine||!st.transitDetails.transitLine.vehicle)return'';return st.transitDetails.transitLine.vehicle.type}
  function isRail(vt){return vt==='RAIL'||vt==='HEAVY_RAIL'||vt==='COMMUTER_TRAIN'||vt==='HIGH_SPEED_TRAIN'||vt==='LONG_DISTANCE_TRAIN'}
  // Format stop: rail gets CRS code, others get (Tram)/(Metro)/(Bus)
  function fmtStop(name,vt){
    if(!name)return'';
    if(isRail(vt))return addCRS(name);
    if(vt==='TRAM'||vt==='LIGHT_RAIL')return name+' (Tram)';
    if(vt==='SUBWAY'||vt==='METRO_RAIL')return name+' (Metro)';
    if(vt==='BUS'||vt==='INTERCITY_BUS')return name+' (Bus)';
    return name;
  }

  // Depart bookend
  var originName=oL.replace(/^🏟 |^🚉 |^📍 /,'');
  var destName=dL.replace(/^🏟 |^🚉 |^📍 /,'');
  var oIcon=oL.match(/^(🏟|🚉|📍)/);oIcon=oIcon?oIcon[0]+' ':'';
  var dIcon=dL.match(/^(🏟|🚉|📍)/);dIcon=dIcon?dIcon[0]+' ':'';

  // Calculate adjusted depart time (subtract first walk duration from first transit departure)
  var departBookendTime='';
  if(lastSkipWalk!=='first'&&overallDep){
    // Find first walk duration in minutes
    var firstWalkMins=0;
    if(steps.length>0&&steps[0]._w){
      steps[0]._w.forEach(function(ws){
        if(ws.staticDuration){var sec=parseInt(String(ws.staticDuration).replace('s',''),10)||0;firstWalkMins+=Math.ceil(sec/60)}
        else if(ws.localizedValues&&ws.localizedValues.staticDuration&&ws.localizedValues.staticDuration.text){
          var m=ws.localizedValues.staticDuration.text.match(/(\d+)/);if(m)firstWalkMins+=parseInt(m[1],10);
        }
      });
    }
    if(firstWalkMins>0&&leg.steps&&leg.steps[0]){
      // Find first transit departure as Date, subtract walk
      for(var di=0;di<(leg.steps||[]).length;di++){
        var ds2=leg.steps[di];
        if(ds2.transitDetails&&ds2.transitDetails.stopDetails&&ds2.transitDetails.stopDetails.departureTime){
          var depDate=new Date(ds2.transitDetails.stopDetails.departureTime);
          depDate.setMinutes(depDate.getMinutes()-firstWalkMins);
          departBookendTime=ft(depDate);break;
        }
      }
    }
    if(!departBookendTime)departBookendTime=overallDep;
  }

  // Calculate adjusted arrive time (add last walk duration to last transit arrival)
  var arriveBookendTime='';
  if(lastSkipWalk!=='last'&&overallArr){
    var lastWalkMins=0;
    if(steps.length>0&&steps[steps.length-1]._w){
      steps[steps.length-1]._w.forEach(function(ws){
        if(ws.staticDuration){var sec=parseInt(String(ws.staticDuration).replace('s',''),10)||0;lastWalkMins+=Math.ceil(sec/60)}
        else if(ws.localizedValues&&ws.localizedValues.staticDuration&&ws.localizedValues.staticDuration.text){
          var m=ws.localizedValues.staticDuration.text.match(/(\d+)/);if(m)lastWalkMins+=parseInt(m[1],10);
        }
      });
    }
    if(lastWalkMins>0){
      // Find last transit arrival as Date, add walk
      for(var ai2=(leg.steps||[]).length-1;ai2>=0;ai2--){
        var as2=leg.steps[ai2];
        if(as2.transitDetails&&as2.transitDetails.stopDetails&&as2.transitDetails.stopDetails.arrivalTime){
          var arrDate=new Date(as2.transitDetails.stopDetails.arrivalTime);
          arrDate.setMinutes(arrDate.getMinutes()+lastWalkMins);
          arriveBookendTime=ft(arrDate);break;
        }
      }
    }
    if(!arriveBookendTime)arriveBookendTime=overallArr;
  }

  h+='<div class="tp__walk-connector" style="font-weight:800;color:var(--navy);font-size:11px"><span class="wc-dot" style="background:var(--navy)"></span><span class="wc-line" style="background:var(--navy)"></span>'+oIcon+'Depart '+originName+(departBookendTime?' · '+departBookendTime:'')+'</div>';

  for(var si2=0;si2<steps.length;si2++){
    var s=steps[si2];
    var cls=sClass(s),dep='',arr='',durT='',distT='';
    var lineCol='',lineTxt='',pillLabel='',mainText='',subText='';

    if(s._w){
      var totalDist=0;
      s._w.forEach(function(ws){
        if(ws.localizedValues&&ws.localizedValues.staticDuration&&ws.localizedValues.staticDuration.text)durT=durT||ws.localizedValues.staticDuration.text;
        if(ws.localizedValues&&ws.localizedValues.distance&&ws.localizedValues.distance.text)distT=distT||ws.localizedValues.distance.text;
        var dm=0;try{dm=parseInt(String(ws.localizedValues.distance.text).replace(/[^0-9]/g,''),10)}catch(e){}
        if(ws.localizedValues&&ws.localizedValues.distance&&ws.localizedValues.distance.text&&ws.localizedValues.distance.text.indexOf('km')!==-1)dm=dm*1000;
        totalDist+=dm;
      });

      var walkDesc='Walk';
      var nextStep=steps[si2+1];
      var prevStep=si2>0?steps[si2-1]:null;
      var isLast=!nextStep;
      var isFirstWalk=(si2===0);

      // Skip first walk if departing from station AND first transit leg is rail-type
      if(isFirstWalk&&lastSkipWalk==='first'){
        var firstVT=stepVT(nextStep);
        if(isRail(firstVT)||firstVT==='SUBWAY'||firstVT==='METRO_RAIL')continue;
        // Not rail — show the walk (station preset but bus route, user needs to see it)
      }
      // Skip last walk if arriving at station AND last transit leg is rail-type
      if(isLast&&lastSkipWalk==='last'){
        var lastVT=stepVT(prevStep);
        if(isRail(lastVT)||lastVT==='SUBWAY'||lastVT==='METRO_RAIL')continue;
      }

      // Check if this is a same-station transfer (arrive and depart same place)
      var prevArrName='',nextDepName='';
      if(prevStep&&prevStep.transitDetails&&prevStep.transitDetails.stopDetails&&prevStep.transitDetails.stopDetails.arrivalStop)
        prevArrName=prevStep.transitDetails.stopDetails.arrivalStop.name||'';
      if(nextStep&&nextStep.transitDetails&&nextStep.transitDetails.stopDetails&&nextStep.transitDetails.stopDetails.departureStop)
        nextDepName=nextStep.transitDetails.stopDetails.departureStop.name||'';

      // Same station → just show transfer time, very thin
      if(prevArrName&&nextDepName&&prevArrName.toLowerCase()===nextDepName.toLowerCase()){
        h+='<div class="tp__walk-connector" style="font-size:9px;color:var(--text-muted)"><span class="wc-dot"></span><span class="wc-line"></span>🔄 '+(durT||'Transfer')+'</div>';
        continue;
      }

      // Different stations between two transit legs = interchange walk
      var isInterchange=prevStep&&nextStep&&prevStep.transitDetails&&nextStep.transitDetails;

      if(isLast){
        walkDesc='Walk to '+destName;
      }else if(nextStep&&nextStep.transitDetails&&nextStep.transitDetails.stopDetails&&nextStep.transitDetails.stopDetails.departureStop){
        walkDesc='Walk to '+fmtStop(nextStep.transitDetails.stopDetails.departureStop.name,stepVT(nextStep));
      }else if(prevStep&&prevStep.transitDetails&&prevStep.transitDetails.stopDetails&&prevStep.transitDetails.stopDetails.arrivalStop){
        walkDesc='Walk from '+fmtStop(prevStep.transitDetails.stopDetails.arrivalStop.name,stepVT(prevStep));
      }

      // Short interchange walk between different stops
      if(isInterchange&&totalDist<500){
        h+='<div class="tp__walk-connector"><span class="wc-dot"></span><span class="wc-line"></span>🔄 '+walkDesc+(distT?' · '+distT:'')+(durT?' · '+durT:'')+'</div>';
        continue;
      }

      if(totalDist<300&&totalDist>0){
        h+='<div class="tp__walk-connector"><span class="wc-dot"></span><span class="wc-line"></span>🚶 '+walkDesc+(distT?' · '+distT:'')+(durT?' · '+durT:'')+'</div>';
        continue;
      }
      pillLabel='🚶 Walk';
      mainText=walkDesc;
      subText=(distT||'')+(durT?' · '+durT:'');
    }else if(s.transitDetails){
      var td=s.transitDetails,sd=td.stopDetails||{};
      if(sd.departureTime)dep=fI(sd.departureTime);
      if(sd.arrivalTime)arr=fI(sd.arrivalTime);
      var ds=sd.departureStop||{},as=sd.arrivalStop||{},ln=td.transitLine||{};
      var lnName=ln.nameShort||ln.name||'';
      var hs=td.headsign||'';
      if(ln.vehicle&&ln.vehicle.type)cls=vC(ln.vehicle.type);
      if(ln.color)lineCol=ln.color;
      if(ln.textColor)lineTxt=ln.textColor;
      if(s.localizedValues&&s.localizedValues.staticDuration)durT=s.localizedValues.staticDuration.text;

      // Pill = emoji + line name (e.g. "🚆 Northern", "🚇 Metro")
      var vtype=ln.vehicle?ln.vehicle.type:'RAIL';
      var emoji=vEmoji(vtype);
      pillLabel=lnName?(emoji+' '+lnName):vL(vtype);

      // Main text = boarding → alighting with CRS (rail) or type label (tram/metro/bus)
      mainText=fmtStop(ds.name||'',vtype)+(as.name?' → '+fmtStop(as.name,vtype):'');

      // Sub text = vehicle type ∙ stop count ∙ towards headsign ∙ duration
      var parts=[];
      var shortType=vShort(vtype);
      if(td.stopCount)parts.push(shortType+' \u2022 '+td.stopCount+' stops');
      else parts.push(shortType);
      if(hs)parts.push('towards '+hs);
      if(durT)parts.push(durT);
      subText=parts.join(' · ');
    }else{
      if(s.navigationInstruction)mainText=s.navigationInstruction.instructions||'';
      if(s.localizedValues&&s.localizedValues.staticDuration)durT=s.localizedValues.staticDuration.text;
      if(s.localizedValues&&s.localizedValues.distance)distT=s.localizedValues.distance.text;
      pillLabel='🚶 Walk';
      mainText=(distT||'')+(durT?' · '+durT:'');
    }

    var dotStyle=lineCol?' style="border-color:'+lineCol+'"':'';
    var modeStyle=lineCol?' style="background:'+lineCol+';color:'+(lineTxt||'#fff')+'"':'';

    h+='<div class="tp__leg tp__leg--'+cls+'">';
    h+='<div class="tp__leg-timeline"><div class="dot"'+dotStyle+'></div>';
    if(dep)h+='<div class="tp__leg-time">'+dep+'</div>';
    h+='<div class="line"'+(lineCol?' style="background:'+lineCol+'"':'')+'></div>';
    if(arr)h+='<div class="tp__leg-time-end">'+arr+'</div>';
    h+='</div><div class="tp__leg-detail"><div class="tp__leg-mode"'+modeStyle+'>'+pillLabel+'</div>';
    if(mainText)h+='<div class="tp__leg-route">'+mainText+'</div>';
    if(subText)h+='<div class="tp__leg-stops">'+subText+'</div>';
    h+='</div></div>';
  }

  // Arrive bookend
  h+='<div class="tp__walk-connector" style="font-weight:800;color:var(--navy);font-size:11px"><span class="wc-dot" style="background:var(--navy)"></span><span class="wc-line" style="background:var(--navy)"></span>'+dIcon+'Arrive '+destName+(arriveBookendTime?' · '+arriveBookendTime:'')+'</div>';

  h+='</div></div>'; // close board + board-scroll
  h+='</div></div>'; // close board-col + results
  ra.innerHTML=h;drawMap(r);
}
function sw(i,o,d){aIdx=i;render(allR,i,o,d)}

// ── Map ──
function drawMap(r){
  var el=document.getElementById('routeMap');if(!el||!mapOK)return;
  gMap=new google.maps.Map(el,{zoom:6,center:{lat:52.5,lng:-1.5},disableDefaultUI:true,zoomControl:true});
  var bounds=new google.maps.LatLngBounds();
  // Step polylines with colours
  if(r.legs&&r.legs[0]&&r.legs[0].steps){
    r.legs[0].steps.forEach(function(s){
      if(s.polyline&&s.polyline.encodedPolyline){
        try{
          var col='#999',w=2;
          if(s.travelMode==='TRANSIT'){col='#223b7c';w=4;if(s.transitDetails&&s.transitDetails.transitLine&&s.transitDetails.transitLine.color)col=s.transitDetails.transitLine.color}
          var p=google.maps.geometry.encoding.decodePath(s.polyline.encodedPolyline);
          new google.maps.Polyline({path:p,strokeColor:col,strokeWeight:w,strokeOpacity:.9,map:gMap});
          p.forEach(function(pt){bounds.extend(pt)});
        }catch(e){}
      }
    });
  }
  // Fallback to route polyline
  if(bounds.isEmpty()&&r.polyline&&r.polyline.encodedPolyline){
    try{var p=google.maps.geometry.encoding.decodePath(r.polyline.encodedPolyline);new google.maps.Polyline({path:p,strokeColor:'#223b7c',strokeWeight:4,map:gMap});p.forEach(function(pt){bounds.extend(pt)})}catch(e){}
  }
  if(!bounds.isEmpty())gMap.fitBounds(bounds,40);

  // Add markers at boarding/alighting stops
  if(r.legs&&r.legs[0]&&r.legs[0].steps){
    r.legs[0].steps.forEach(function(s){
      if(s.transitDetails&&s.transitDetails.stopDetails){
        var sd=s.transitDetails.stopDetails;
        var ln=s.transitDetails.transitLine||{};
        var col=ln.color||'#223b7c';
        // Departure stop marker
        if(sd.departureStop&&sd.departureStop.location&&sd.departureStop.location.latLng){
          var dLoc=sd.departureStop.location.latLng;
          new google.maps.Marker({
            position:{lat:dLoc.latitude,lng:dLoc.longitude},
            map:gMap,
            title:sd.departureStop.name,
            icon:{path:google.maps.SymbolPath.CIRCLE,scale:5,fillColor:col,fillOpacity:1,strokeColor:'#fff',strokeWeight:2}
          });
        }
        // Arrival stop marker
        if(sd.arrivalStop&&sd.arrivalStop.location&&sd.arrivalStop.location.latLng){
          var aLoc=sd.arrivalStop.location.latLng;
          new google.maps.Marker({
            position:{lat:aLoc.latitude,lng:aLoc.longitude},
            map:gMap,
            title:sd.arrivalStop.name,
            icon:{path:google.maps.SymbolPath.CIRCLE,scale:5,fillColor:col,fillOpacity:1,strokeColor:'#fff',strokeWeight:2}
          });
        }
      }
    });
  }
  // Origin/destination markers
  if(r.legs&&r.legs[0]){
    var lg=r.legs[0];
    if(lg.startLocation&&lg.startLocation.latLng){
      new google.maps.Marker({position:{lat:lg.startLocation.latLng.latitude,lng:lg.startLocation.latLng.longitude},map:gMap,title:'Start'});
    }
    if(lg.endLocation&&lg.endLocation.latLng){
      new google.maps.Marker({position:{lat:lg.endLocation.latLng.latitude,lng:lg.endLocation.latLng.longitude},map:gMap,title:'Destination'});
    }
  }
}

// ── Helpers ──
function nd(s){return s?(s.includes('T')?s:s.replace(' ','T')+'Z'):''}
function fd(d){return['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()]+' '+d.getDate()+' '+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()]}
function ft(d){return pad(d.getHours())+':'+pad(d.getMinutes())}
function pad(n){return n<10?'0'+n:''+n}
function fmtDur(s){if(!s)return'';var sec=parseInt(String(s).replace('s',''),10);if(isNaN(sec))return s;var h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60);return h?h+'h '+m+'min':m+' min'}
function fmtDist(m){return m>=1000?(m/1000).toFixed(1)+' km':m+' m'}
function fI(v){if(!v)return'';var d=new Date(v);return isNaN(d)?String(v):ft(d)}
function sClass(s){if(s._w||s.travelMode==='WALK')return'walk';if(s.travelMode==='DRIVE')return'drive';if(s.transitDetails){var l=s.transitDetails.transitLine||{};if(l.vehicle)return vC(l.vehicle.type);return'train'}return'walk'}
function sLabel(s){if(s._w||s.travelMode==='WALK')return'🚶 Walk';if(s.travelMode==='DRIVE')return'🚗 Drive';if(s.transitDetails){var l=s.transitDetails.transitLine||{};if(l.vehicle)return vL(l.vehicle.type);return'🚆 Transit'}return'🚶 Walk'}
function vC(t){return{BUS:'bus',INTERCITY_BUS:'bus',RAIL:'train',HEAVY_RAIL:'train',COMMUTER_TRAIN:'train',HIGH_SPEED_TRAIN:'train',LONG_DISTANCE_TRAIN:'train',SUBWAY:'subway',METRO_RAIL:'subway',TRAM:'tram',LIGHT_RAIL:'tram',FERRY:'train'}[t]||'train'}
function vL(t){return{BUS:'🚌 Bus',INTERCITY_BUS:'🚌 Coach',RAIL:'🚆 Train',HEAVY_RAIL:'🚆 Train',COMMUTER_TRAIN:'🚆 Train',HIGH_SPEED_TRAIN:'🚄 Train',LONG_DISTANCE_TRAIN:'🚆 Train',SUBWAY:'🚇 Metro',METRO_RAIL:'🚇 Metro',TRAM:'🚊 Tram',LIGHT_RAIL:'🚊 Tram',FERRY:'⛴ Ferry'}[t]||'🚆 Transit'}
function vEmoji(t){return{BUS:'🚌',INTERCITY_BUS:'🚌',RAIL:'🚆',HEAVY_RAIL:'🚆',COMMUTER_TRAIN:'🚆',HIGH_SPEED_TRAIN:'🚄',LONG_DISTANCE_TRAIN:'🚆',SUBWAY:'🚇',METRO_RAIL:'🚇',TRAM:'🚊',LIGHT_RAIL:'🚊',FERRY:'⛴'}[t]||'🚆'}
function vShort(t){return{BUS:'Bus',INTERCITY_BUS:'Coach',RAIL:'Train',HEAVY_RAIL:'Train',COMMUTER_TRAIN:'Train',HIGH_SPEED_TRAIN:'Train',LONG_DISTANCE_TRAIN:'Train',SUBWAY:'Metro',METRO_RAIL:'Metro',TRAM:'Tram',LIGHT_RAIL:'Tram',FERRY:'Ferry'}[t]||'Transit'}
function abbr(s){return s&&s.length>35?s.substring(0,33)+'…':s||''}
function esc(s){return(s||'').replace(/'/g,"\\'").replace(/"/g,'&quot;')}

// ── URL state sync ──
var _urlSuppressed=false; // suppress syncURL during readURL restoration
function syncURL(){
  if(_urlSuppressed)return;
  var p=new URLSearchParams();
  // Which mode?
  var mode=document.getElementById('manualMode').style.display==='none'?'fixture':'manual';
  p.set('mode',mode);

  if(mode==='fixture'){
    if(fixClub)p.set('club',fixClub.code);
    if(fixMatch&&fixMatch.id)p.set('fix',fixMatch.id);
    p.set('dir',fixDir);
    p.set('preset',fixPreset);
    if(fixPreset==='custom'){var cv=document.getElementById('fixCustomAddr').value.trim();if(cv)p.set('addr',cv)}
    if(fixDir==='to'){p.set('arr',document.getElementById('arrBefore').value)}
    else{p.set('post',document.getElementById('extraAfter').value)}
  }else{
    if(manHomeClub)p.set('home',manHomeClub.code);
    if(manAwayClub)p.set('away',manAwayClub.code);
    var koVal=document.getElementById('manKO').value;
    if(koVal)p.set('ko',koVal);
    p.set('dir',manDir);
    p.set('preset',manPreset);
    if(manPreset==='custom'){var mv=document.getElementById('manCustomAddr').value.trim();if(mv)p.set('addr',mv)}
    if(manDir==='to'){p.set('arr',document.getElementById('manArrBefore').value)}
    else{p.set('post',document.getElementById('manExtraAfter').value)}
  }
  var qs=p.toString();
  var newURL=window.location.pathname+(qs?'?'+qs:'');
  history.replaceState(null,'',newURL);
}

function readURL(){
  var p=new URLSearchParams(window.location.search);
  if(!p.has('mode'))return; // no URL state to restore
  _urlSuppressed=true;

  var mode=p.get('mode')||'fixture';
  // Switch tab (without triggering syncURL)
  document.querySelectorAll('.tp__mode-btn').forEach(function(b){b.classList.toggle('active',b.getAttribute('data-mode')===mode)});
  document.getElementById('fixtureMode').style.display=mode==='fixture'?'block':'none';
  document.getElementById('manualMode').style.display=mode==='manual'?'block':'none';

  if(mode==='fixture'){
    // Direction
    var dir=p.get('dir')||'to';
    fixDir=dir;
    document.querySelectorAll('#fixtureMode .tp__dir-btn').forEach(function(b){b.classList.toggle('active',b.getAttribute('data-dir')===dir)});
    document.getElementById('preSlider').style.display=dir==='to'?'block':'none';
    document.getElementById('postSlider').style.display=dir==='from'?'block':'none';

    // Preset
    var preset=p.get('preset')||'stadium';
    fixPreset=preset;
    document.querySelectorAll('#fixPresets .tp__preset').forEach(function(b){b.classList.toggle('active',b.getAttribute('data-p')===preset)});
    document.getElementById('fixCustomAddr').style.display=preset==='custom'?'block':'none';
    if(preset==='custom'&&p.has('addr'))document.getElementById('fixCustomAddr').value=p.get('addr');

    // Sliders
    if(p.has('arr')){document.getElementById('arrBefore').value=p.get('arr');document.getElementById('arrBeforeV').textContent=p.get('arr')+' min'}
    if(p.has('post')){document.getElementById('extraAfter').value=p.get('post');upPostLbl()}

    // Club — triggers loadFix, which is async. Match selection happens in callback.
    var clubCode=p.get('club');
    var matchID=p.get('fix');
    if(clubCode){
      var c=clubs.find(function(cl){return cl.code===clubCode});
      if(c){
        _pendingMatchID=matchID||null;
        selFC(c);
      }
    }
  }else{
    // Manual mode
    var dir=p.get('dir')||'to';
    manDir=dir;
    document.querySelectorAll('#manualMode .tp__dir-btn').forEach(function(b){b.classList.toggle('active',b.getAttribute('data-dir')===dir)});
    document.getElementById('manPreSlider').style.display=dir==='to'?'block':'none';
    document.getElementById('manPostSlider').style.display=dir==='from'?'block':'none';

    var preset=p.get('preset')||'stadium';
    manPreset=preset;
    document.querySelectorAll('#manPresets .tp__preset').forEach(function(b){b.classList.toggle('active',b.getAttribute('data-p')===preset)});
    document.getElementById('manCustomAddr').style.display=preset==='custom'?'block':'none';
    if(preset==='custom'&&p.has('addr'))document.getElementById('manCustomAddr').value=p.get('addr');

    if(p.has('ko'))document.getElementById('manKO').value=p.get('ko');

    if(p.has('arr')){document.getElementById('manArrBefore').value=p.get('arr');document.getElementById('manArrBeforeV').textContent=p.get('arr')+' min'}
    if(p.has('post')){document.getElementById('manExtraAfter').value=p.get('post');upManPostLbl()}

    var homeCode=p.get('home'),awayCode=p.get('away');
    if(homeCode){var hc=clubs.find(function(cl){return cl.code===homeCode});if(hc)selManHome(hc)}
    if(awayCode){var ac=clubs.find(function(cl){return cl.code===awayCode});if(ac)selManAway(ac)}
  }
  _urlSuppressed=false;
}

// Pending match ID for fixture restore — set by readURL, consumed by loadFix
var _pendingMatchID=null;

// ── Init ──
window.nlAuthReady=function(){
  loadClubs();loadCRS();initMap();
  // Set default KO: today, 15:00 weekend or 19:45 weekday
  var now=new Date();
  var day=now.getDay(); // 0=Sun, 6=Sat
  var isWeekend=(day===0||day===6);
  var hh=isWeekend?'15':'19';
  var mm=isWeekend?'00':'45';
  var yyyy=now.getFullYear();
  var mo=String(now.getMonth()+1).padStart(2,'0');
  var dd=String(now.getDate()).padStart(2,'0');
  document.getElementById('manKO').value=yyyy+'-'+mo+'-'+dd+'T'+hh+':'+mm;
  setTimeout(function(){
    setupAC('fixClubInput','fixClubAC','fixClubWrap',selFC);
    setupAC('manHomeI','manHomeAC','manHomeW',selManHome);
    setupAC('manAwayI','manAwayAC','manAwayW',selManAway);
    // Hook sliders and inputs for URL sync
    ['arrBefore','extraAfter','manArrBefore','manExtraAfter'].forEach(function(id){
      var el=document.getElementById(id);
      if(el)el.addEventListener('change',syncURL);
    });
    ['fixCustomAddr','manCustomAddr','manKO'].forEach(function(id){
      var el=document.getElementById(id);
      if(el)el.addEventListener('change',syncURL);
    });
    // Read URL params after clubs have loaded (loadClubs is async)
    var waitForClubs=setInterval(function(){
      if(clubs.length>0){clearInterval(waitForClubs);readURL()}
    },100);
  },1500);
};
</script>
