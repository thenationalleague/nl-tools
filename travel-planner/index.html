<style>

<script>
var GKEY='AIzaSyA1qH6K4vtUW8YbMKetK16q2GQaZ2EDXRs';
var ROUTES_URL='https://routes.googleapis.com/directions/v2:computeRoutes';
var CLUBS_META_URL='https://raw.githubusercontent.com/thenationalleague/tools/refs/heads/main/assets/data/clubs-meta.json';
var CREST_BASE='https://raw.githubusercontent.com/thenationalleague/tools/refs/heads/main/assets/crests/';
var FALLBACK_CREST=CREST_BASE+'National%20League%20rose.png';
var NLS='https://multi-club-matches.football.web.gc.nationalleagueservices.co.uk/v2';
var SID=2025,CIDS=[89,373,372];

var clubs=[],fixClub=null,fixMatch=null,fixDir='to',manFC=null,manTC=null;
var gMap=null,gPolyline=null,allRoutes=[],activeIdx=0,mapReady=false;

// ── Google Maps (for map only) ──
async function initMap(){
  try{
    await google.maps.importLibrary('maps');
    await google.maps.importLibrary('geometry');
    mapReady=true;
  }catch(e){console.warn('Map init:',e)}
}

// ── Clubs ──
function loadClubs(){
  fetch(CLUBS_META_URL).then(function(r){return r.json()}).then(function(d){
    clubs=(d.clubs||[]).map(function(c){return{name:c.name||'',code:c.code||'',short:c.short||'',stadium:c.stadium||'',division:c.division||'',optaID:c.optaID||'',postcode:c.postcode||'',colors:c.colors||{}}}).sort(function(a,b){return a.name.localeCompare(b.name)});
  }).catch(function(){clubs=[]});
}
function crestUrl(n){return CREST_BASE+encodeURIComponent(n)+'.png'}
function addr(c){return c.postcode?c.stadium+', '+c.postcode:c.stadium+', '+(c.short||c.name)+', UK'}

// ── Club AC ──
function setupAC(iid,lid,wid,cb){
  var inp=document.getElementById(iid),list=document.getElementById(lid);
  inp.addEventListener('input',function(){filterAC(this.value,lid,cb);cb(null)});
  inp.addEventListener('focus',function(){if(!this.value.trim())filterAC('',lid,cb)});
  document.addEventListener('click',function(e){if(!e.target.closest('#'+wid))list.classList.remove('show')});
}
function filterAC(q,lid,cb){
  var list=document.getElementById(lid);q=(q||'').toLowerCase().trim();
  var f=q?clubs.filter(function(c){return c.name.toLowerCase().indexOf(q)!==-1||(c.short&&c.short.toLowerCase().indexOf(q)!==-1)||(c.code&&c.code.toLowerCase()===q)}):clubs;
  if(!f.length){list.innerHTML='<div class="tp__ac-item" style="color:var(--text-muted);justify-content:center;">No clubs found</div>';list.classList.add('show');return}
  list.innerHTML=f.slice(0,15).map(function(c){return'<div class="tp__ac-item" data-c="'+c.name.replace(/"/g,'&quot;')+'"><img src="'+crestUrl(c.name)+'" alt="" onerror="this.onerror=null;this.src=\''+FALLBACK_CREST+'\'"><span class="name">'+c.name+'</span><span class="ground">'+c.stadium+'</span><span class="div-badge">'+c.division+'</span></div>'}).join('');
  list.classList.add('show');
  list.querySelectorAll('[data-c]').forEach(function(el){el.addEventListener('click',function(){
    var club=clubs.find(function(c){return c.name===el.getAttribute('data-c')});
    cb(club);list.classList.remove('show');
  })});
}

// ── Fix club → fixtures ──
function selFixClub(c){
  fixClub=c;fixMatch=null;document.getElementById('fixJourneyConfig').style.display='none';
  var inp=document.getElementById('fixClubInput'),cr=document.getElementById('fixClubCrest'),w=document.getElementById('fixClubWrap');
  if(c){inp.value=c.name;cr.src=crestUrl(c.name);cr.style.display='block';w.classList.add('has-crest');loadFix(c)}
  else{cr.style.display='none';w.classList.remove('has-crest');document.getElementById('fixFixtureArea').innerHTML=''}
}
function loadFix(club){
  var area=document.getElementById('fixFixtureArea');
  area.innerHTML='<div class="tp__loading"><div class="tp__spinner"></div>Loading fixtures…</div>';
  if(!club.optaID){area.innerHTML='<div class="tp__error">No Opta ID for this club.</div>';return}
  Promise.all(CIDS.map(function(cid){
    return fetch(NLS+'/matches/?seasonID='+SID+'&competitionID='+cid+'&sort=kickOffDateUTC&page.size=100&page.number=1').then(function(r){return r.json()}).catch(function(){return{data:[]}});
  })).then(function(res){
    var all=[];res.forEach(function(r){if(r.data)all=all.concat(r.data)});
    var tid=club.optaID;
    var up=all.filter(function(m){var a=m.attributes,p=(a.matchPeriod||'').toLowerCase();return(p==='prematch'||!p||p==='fixture')&&((a.homeTeam&&a.homeTeam.teamID===tid)||(a.awayTeam&&a.awayTeam.teamID===tid))}).sort(function(a,b){return new Date(nd(a.attributes.kickOffDateUTC))-new Date(nd(b.attributes.kickOffDateUTC))});
    if(!up.length){area.innerHTML='<div class="tp__error">No upcoming fixtures.</div>';return}
    var h='<div class="tp__panel"><div class="tp__panel-title">Upcoming Fixtures</div><div class="tp__fix-list">';
    up.slice(0,10).forEach(function(m,i){
      var a=m.attributes,isH=a.homeTeam&&a.homeTeam.teamID===tid,opp=isH?a.awayTeam:a.homeTeam;
      var oc=clubs.find(function(c){return c.optaID===(opp?opp.teamID:'')});
      var ko=new Date(nd(a.kickOffDateUTC));
      h+='<div class="tp__fix-item" onclick="selFix('+i+')"><img src="'+crestUrl(opp?opp.name:(oc?oc.name:''))+'" alt="" onerror="this.onerror=null;this.src=\''+FALLBACK_CREST+'\'"><div class="info"><div class="teams">'+(isH?club.name+' vs '+(opp?opp.name:'TBC'):(opp?opp.name:'TBC')+' vs '+club.name)+'</div><div class="meta">'+fd(ko)+' — '+ft(ko)+(oc?' · '+oc.stadium:'')+'</div></div><span class="badge badge--'+(isH?'home':'away')+'">'+(isH?'Home':'Away')+'</span></div>';
    });
    h+='</div></div>';area.innerHTML=h;area._m=up.slice(0,10);
  }).catch(function(e){area.innerHTML='<div class="tp__error">Failed to load fixtures.</div>';console.error(e)});
}
function selFix(i){
  var area=document.getElementById('fixFixtureArea');
  if(!area._m||!area._m[i])return;
  fixMatch=area._m[i];
  area.querySelectorAll('.tp__fix-item').forEach(function(el,j){el.classList.toggle('selected',j===i)});
  document.getElementById('fixJourneyConfig').style.display='block';
  updatePostNote();
  document.getElementById('fixJourneyConfig').scrollIntoView({behavior:'smooth'});
}

// ── Direction ──
function setDirection(d){
  fixDir=d;
  document.querySelectorAll('.tp__dir-btn').forEach(function(b){b.classList.toggle('active',b.getAttribute('data-dir')===d)});
  document.getElementById('preMatchSlider').style.display=d==='to'?'block':'none';
  document.getElementById('postMatchSlider').style.display=d==='from'?'block':'none';
  if(d==='from')updatePostNote();
}
function updatePostLabel(){
  var v=+document.getElementById('extraAfterSlider').value;
  document.getElementById('extraAfterVal').textContent=v===0?'Depart at FT':'~'+v+'m after FT';
}
function updatePostNote(){
  if(!fixMatch)return;
  var ko=new Date(nd(fixMatch.attributes.kickOffDateUTC));
  document.getElementById('postNote').textContent='Assumes 2h match. Estimated FT: '+ft(new Date(ko.getTime()+72e5));
}

// ── Mode / transport ──
function setMode(m){
  document.querySelectorAll('.tp__mode-btn').forEach(function(b){b.classList.toggle('active',b.getAttribute('data-mode')===m)});
  document.getElementById('fixtureMode').style.display=m==='fixture'?'block':'none';
  document.getElementById('manualMode').style.display=m==='manual'?'block':'none';
  document.getElementById('resultsArea').innerHTML='';
}
function setTransport(b,p){document.getElementById(p+'Transport').querySelectorAll('.tp__transport-btn').forEach(function(x){x.classList.remove('active')});b.classList.add('active')}
function getTM(p){var a=document.getElementById(p+'Transport').querySelector('.tp__transport-btn.active');return a?a.getAttribute('data-mode'):'TRANSIT'}

// ── Manual ──
function selManFrom(c){manFC=c;var i=document.getElementById('manFromInput'),cr=document.getElementById('manFromCrest'),w=document.getElementById('manFromWrap');if(c){i.value=c.name+' ('+c.stadium+')';cr.src=crestUrl(c.name);cr.style.display='block';w.classList.add('has-crest')}else{cr.style.display='none';w.classList.remove('has-crest')}upManBtn()}
function selManTo(c){manTC=c;var i=document.getElementById('manToInput'),cr=document.getElementById('manToCrest'),w=document.getElementById('manToWrap');if(c){i.value=c.name+' ('+c.stadium+')';cr.src=crestUrl(c.name);cr.style.display='block';w.classList.add('has-crest')}else{cr.style.display='none';w.classList.remove('has-crest')}upManBtn()}
function upManBtn(){document.getElementById('manSearchBtn').disabled=!(document.getElementById('manFromInput').value.trim().length>=3&&document.getElementById('manToInput').value.trim().length>=3)}

// ── ROUTES REST API ──
var FIELD_MASK='routes.duration,routes.distanceMeters,routes.polyline.encodedPolyline,routes.legs.duration,routes.legs.steps.travelMode,routes.legs.steps.staticDuration,routes.legs.steps.polyline.encodedPolyline,routes.legs.steps.startLocation,routes.legs.steps.endLocation,routes.legs.steps.navigationInstruction,routes.legs.steps.localizedValues,routes.legs.steps.transitDetails';

async function callRoutes(origin,destination,travelMode,opts){
  var body={
    origin:{address:origin},
    destination:{address:destination},
    travelMode:travelMode,
    computeAlternativeRoutes:true,
    languageCode:'en-GB',
    units:'METRIC'
  };
  if(travelMode==='TRANSIT'){
    if(opts.arrivalTime)body.arrivalTime=opts.arrivalTime;
    else if(opts.departureTime)body.departureTime=opts.departureTime;
    body.transitPreferences={routingPreference:'FEWER_TRANSFERS'};
  }else{
    if(opts.departureTime)body.departureTime=opts.departureTime;
  }
  var resp=await fetch(ROUTES_URL,{
    method:'POST',
    headers:{'Content-Type':'application/json','X-Goog-Api-Key':GKEY,'X-Goog-FieldMask':FIELD_MASK},
    body:JSON.stringify(body)
  });
  if(!resp.ok){var err=await resp.json().catch(function(){return{}});throw new Error((err.error&&err.error.message)||'API error '+resp.status)}
  return resp.json();
}

// ── Fixture search ──
function doFixtureSearch(){
  if(!fixMatch||!fixClub)return;
  var a=fixMatch.attributes,tid=fixClub.optaID;
  var isH=a.homeTeam&&a.homeTeam.teamID===tid;
  var oppID=isH?a.awayTeam.teamID:a.homeTeam.teamID;
  var opp=clubs.find(function(c){return c.optaID===oppID});
  var myA=addr(fixClub),oppA=opp?addr(opp):(isH?a.awayTeam.name:a.homeTeam.name);
  var origin,dest,oLabel,dLabel;
  if(fixDir==='to'){origin=myA;dest=oppA;oLabel=fixClub.short||fixClub.name;dLabel=opp?opp.short||opp.name:dest}
  else{origin=oppA;dest=myA;oLabel=opp?opp.short||opp.name:origin;dLabel=fixClub.short||fixClub.name}
  var tm=getTM('fix'),ko=new Date(nd(a.kickOffDateUTC)),opts={};
  if(fixDir==='to'){
    var mb=+document.getElementById('arriveBeforeSlider').value;
    // Use arrivalTime for transit to get "latest departure that arrives on time"
    if(tm==='TRANSIT')opts.arrivalTime=new Date(ko.getTime()-mb*6e4).toISOString();
    else opts.departureTime=new Date(ko.getTime()-mb*6e4-72e5).toISOString(); // rough earlier departure for driving
  }else{
    var ea=+document.getElementById('extraAfterSlider').value;
    opts.departureTime=new Date(ko.getTime()+72e5+ea*6e4).toISOString();
  }
  doRoute(origin,dest,tm,opts,oLabel,dLabel);
}
function doManualSearch(){
  var fi=document.getElementById('manFromInput').value.trim(),ti=document.getElementById('manToInput').value.trim();
  var o=manFC?addr(manFC):fi,d=manTC?addr(manTC):ti;
  var tm=getTM('man'),opts={};
  if(document.getElementById('manWhenSelect').value==='choose'){var dt=document.getElementById('manTimeInput').value;if(dt)opts.departureTime=new Date(dt).toISOString()}
  else opts.departureTime=new Date().toISOString();
  doRoute(o,d,tm,opts,manFC?manFC.short||manFC.name:fi,manTC?manTC.short||manTC.name:ti);
}

async function doRoute(origin,dest,tm,opts,oLabel,dLabel){
  var ra=document.getElementById('resultsArea');
  ra.innerHTML='<div class="tp__loading"><div class="tp__spinner"></div>Finding the best route…</div>';
  try{
    var data=await callRoutes(origin,dest,tm,opts);
    if(!data.routes||!data.routes.length){ra.innerHTML='<div class="tp__error">No routes found.</div>';return}
    allRoutes=data.routes;activeIdx=0;
    renderAll(data.routes,0,oLabel,dLabel);
  }catch(e){
    console.error(e);
    ra.innerHTML='<div class="tp__error">'+e.message+'</div>';
  }
}

// ── Consolidate walks ──
function consolidate(steps){
  if(!steps)return[];
  var out=[],wb=null;
  steps.forEach(function(s){
    if(s.travelMode==='WALK'){
      if(!wb)wb={travelMode:'WALK',_m:0,_d:'',_steps:[]};
      wb._steps.push(s);
      if(s.localizedValues&&s.localizedValues.distance)wb._d=wb._d||s.localizedValues.distance.text;
    }else{
      if(wb){out.push(wb);wb=null}
      out.push(s);
    }
  });
  if(wb)out.push(wb);
  return out;
}

// ── Render ──
function renderAll(routes,idx,oL,dL){
  var ra=document.getElementById('resultsArea'),r=routes[idx];
  if(!r.legs||!r.legs[0]){ra.innerHTML='<div class="tp__error">Invalid route data.</div>';return}
  var leg=r.legs[0],dur=r.duration?fmtDur(r.duration):'',dist=r.distanceMeters?fmtDist(r.distanceMeters):'';

  var h='<div class="tp__results"><div class="tp__map-col"><div id="routeMap"></div></div><div class="tp__board-col">';
  h+='<div class="tp__summary"><div class="tp__summary-route">'+abbr(oL)+'<span class="arrow">→</span>'+abbr(dL)+'</div><div class="tp__summary-duration">'+dur+(dist?' · '+dist:'')+'</div></div>';
  h+='<div class="tp__board">';

  var steps=consolidate(leg.steps);
  steps.forEach(function(s){
    var cls=stepClass(s),ml=modeLabel(s);
    var dep='',arr='',route='',stops='',durT='',distT='';

    if(s._steps){
      // Consolidated walk
      route='Walk';
      s._steps.forEach(function(ws){
        if(ws.localizedValues){
          if(ws.localizedValues.distance&&ws.localizedValues.distance.text)distT=distT||ws.localizedValues.distance.text;
          if(ws.localizedValues.staticDuration&&ws.localizedValues.staticDuration.text)durT=durT||ws.localizedValues.staticDuration.text;
        }
      });
    }else if(s.transitDetails){
      var td=s.transitDetails,sd=td.stopDetails||{};
      if(sd.departureTime)dep=fmtISO(sd.departureTime);
      if(sd.arrivalTime)arr=fmtISO(sd.arrivalTime);
      var ds=sd.departureStop||{},as=sd.arrivalStop||{};
      var ln=td.transitLine||{};
      var lineName=ln.nameShort||ln.name||'';
      var headsign=td.headsign||'';
      route=lineName+(headsign?' → '+headsign:(as.name?' to '+as.name:''));
      stops=(ds.name||'')+(as.name?' → '+as.name:'');
      if(td.stopCount)stops+=' · '+td.stopCount+' stops';
      // Override mode from vehicle type
      if(ln.vehicle&&ln.vehicle.type){cls=vehClass(ln.vehicle.type);ml=vehLabel(ln.vehicle.type)}
    }else{
      if(s.navigationInstruction)route=s.navigationInstruction.instructions||'';
    }

    if(!durT&&s.localizedValues){
      if(s.localizedValues.staticDuration)durT=s.localizedValues.staticDuration.text;
    }
    if(!distT&&s.localizedValues&&s.localizedValues.distance)distT=s.localizedValues.distance.text;

    h+='<div class="tp__leg tp__leg--'+cls+'">';
    h+='<div class="tp__leg-timeline"><div class="dot"></div>';
    if(dep)h+='<div class="tp__leg-time">'+dep+'</div>';
    h+='<div class="line"></div>';
    if(arr)h+='<div class="tp__leg-time-end">'+arr+'</div>';
    h+='</div><div class="tp__leg-detail"><div class="tp__leg-mode">'+ml+'</div>';
    if(route)h+='<div class="tp__leg-route">'+route+'</div>';
    if(stops)h+='<div class="tp__leg-stops">'+stops+'</div>';
    if(distT&&!stops)h+='<div class="tp__leg-stops">'+distT+'</div>';
    if(durT)h+='<div class="tp__leg-duration">'+durT+'</div>';
    h+='</div></div>';
  });

  // Alts
  if(routes.length>1){
    h+='<div class="tp__alts">';
    routes.forEach(function(rt,i){
      var rd=rt.duration?fmtDur(rt.duration):'';
      var chip='Route '+(i+1);
      // Try get first transit departure time
      if(rt.legs&&rt.legs[0]&&rt.legs[0].steps){
        for(var j=0;j<rt.legs[0].steps.length;j++){
          var st=rt.legs[0].steps[j];
          if(st.transitDetails&&st.transitDetails.stopDetails&&st.transitDetails.stopDetails.departureTime){
            chip=fmtISO(st.transitDetails.stopDetails.departureTime);break;
          }
        }
      }
      h+='<div class="tp__alt-chip'+(i===idx?' active':'')+'" onclick="swRoute('+i+',\''+esc(oL)+'\',\''+esc(dL)+'\')">'+chip+(rd?'<span class="dur">'+rd+'</span>':'')+'</div>';
    });
    h+='</div>';
  }
  h+='</div></div></div>';
  ra.innerHTML=h;
  drawMap(r);
}
function swRoute(i,o,d){activeIdx=i;renderAll(allRoutes,i,o,d)}

// ── Map ──
function drawMap(route){
  var el=document.getElementById('routeMap');
  if(!el||!mapReady)return;
  gMap=new google.maps.Map(el,{zoom:6,center:{lat:52.5,lng:-1.5},disableDefaultUI:true,zoomControl:true});
  if(gPolyline){gPolyline.setMap(null);gPolyline=null}
  // Draw route polyline
  if(route.polyline&&route.polyline.encodedPolyline){
    try{
      var path=google.maps.geometry.encoding.decodePath(route.polyline.encodedPolyline);
      gPolyline=new google.maps.Polyline({path:path,strokeColor:'#223b7c',strokeWeight:4,strokeOpacity:0.8,map:gMap});
      var b=new google.maps.LatLngBounds();
      path.forEach(function(p){b.extend(p)});
      gMap.fitBounds(b,40);
    }catch(e){console.warn('Polyline error:',e)}
  }
  // Also draw step-level polylines for colour coding
  if(route.legs&&route.legs[0]&&route.legs[0].steps){
    var bounds=new google.maps.LatLngBounds();
    route.legs[0].steps.forEach(function(s){
      if(s.polyline&&s.polyline.encodedPolyline){
        try{
          var col='#5a6a82';
          if(s.travelMode==='TRANSIT'){
            col='#223b7c';
            if(s.transitDetails&&s.transitDetails.transitLine&&s.transitDetails.transitLine.color)col=s.transitDetails.transitLine.color;
          }else if(s.travelMode==='WALK')col='#999999';
          var p=google.maps.geometry.encoding.decodePath(s.polyline.encodedPolyline);
          new google.maps.Polyline({path:p,strokeColor:col,strokeWeight:s.travelMode==='WALK'?2:4,strokeOpacity:0.9,map:gMap,geodesic:true});
          p.forEach(function(pt){bounds.extend(pt)});
        }catch(e){}
      }
    });
    if(!bounds.isEmpty())gMap.fitBounds(bounds,40);
  }
}

// ── Helpers ──
function nd(s){if(!s)return'';return s.includes('T')?s:s.replace(' ','T')+'Z'}
function fd(d){return['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()]+' '+d.getDate()+' '+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()]}
function ft(d){return pad(d.getHours())+':'+pad(d.getMinutes())}
function pad(n){return n<10?'0'+n:''+n}
function fmtDur(s){if(!s)return'';var sec=parseInt(String(s).replace('s',''),10);if(isNaN(sec))return s;var h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60);return h?h+'h '+m+'min':m+' min'}
function fmtDist(m){return m>=1000?(m/1000).toFixed(1)+' km':m+' m'}
function fmtISO(v){if(!v)return'';var d=new Date(v);return isNaN(d)?String(v):ft(d)}
function stepClass(s){if(s._steps||s.travelMode==='WALK')return'walk';if(s.travelMode==='DRIVE')return'drive';if(s.transitDetails){var l=s.transitDetails.transitLine||{};if(l.vehicle)return vehClass(l.vehicle.type);return'train'}return'walk'}
function modeLabel(s){if(s._steps||s.travelMode==='WALK')return'🚶 Walk';if(s.travelMode==='DRIVE')return'🚗 Drive';if(s.transitDetails){var l=s.transitDetails.transitLine||{};if(l.vehicle)return vehLabel(l.vehicle.type);return'🚆 Transit'}return'🚶 Walk'}
function vehClass(t){var m={BUS:'bus',INTERCITY_BUS:'bus',RAIL:'train',HEAVY_RAIL:'train',COMMUTER_TRAIN:'train',HIGH_SPEED_TRAIN:'train',LONG_DISTANCE_TRAIN:'train',SUBWAY:'subway',METRO_RAIL:'subway',TRAM:'tram',LIGHT_RAIL:'tram',FERRY:'train'};return m[t]||'train'}
function vehLabel(t){var m={BUS:'🚌 Bus',INTERCITY_BUS:'🚌 Coach',RAIL:'🚆 Train',HEAVY_RAIL:'🚆 Train',COMMUTER_TRAIN:'🚆 Train',HIGH_SPEED_TRAIN:'🚄 Train',LONG_DISTANCE_TRAIN:'🚆 Train',SUBWAY:'🚇 Underground',METRO_RAIL:'🚇 Metro',TRAM:'🚊 Tram',LIGHT_RAIL:'🚊 Light rail',FERRY:'⛴ Ferry'};return m[t]||'🚆 Transit'}
function abbr(s){return s&&s.length>25?s.substring(0,23)+'…':s||''}
function esc(s){return(s||'').replace(/'/g,"\\'").replace(/"/g,'&quot;')}

// ── Init ──

  document.getElementById('pageWrap').style.display='block';

  document.getElementById('manToInput').addEventListener('input',function(){if(manTC){manTC=null;document.getElementById('manToCrest').style.display='none';document.getElementById('manToWrap').classList.remove('has-crest')}upManBtn()});
  setTimeout(function(){
    setupAC('fixClubInput','fixClubAC','fixClubWrap',selFixClub);
    setupAC('manFromInput','manFromAC','manFromWrap',selManFrom);
    setupAC('manToInput','manToAC','manToWrap',selManTo);
  },1500);
};
