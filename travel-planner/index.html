<style>

  .tp__select-wrap{position:relative}.tp__select-wrap::after{content:"▾";position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--text-muted);pointer-events:none;font-size:14px}

  .tp__ac-list{position:absolute;top:100%;left:0;right:0;background:var(--white);border:2px solid var(--navy);border-top:none;border-radius:0 0 var(--radius) var(--radius);max-height:240px;overflow-y:auto;z-index:100;display:none}

  .tp__leg-stops{font-size:var(--text-xs);color:var(--text-muted)}
  .tp__leg-duration{font-size:var(--text-xs);color:var(--text-muted);margin-top:4px;font-weight:600;font-variation-settings:'wght' 600}
  .tp__alts{padding:14px 22px;background:var(--off-white);border-top:1px solid var(--border);display:flex;gap:10px;overflow-x:auto}
  .tp__alt-chip{flex-shrink:0;padding:6px 14px;border-radius:99px;border:2px solid var(--border);background:var(--white);font-family:var(--font);font-size:var(--text-xs)!important;font-weight:700;font-variation-settings:'wght' 700;color:var(--text);cursor:pointer;transition:all .2s;white-space:nowrap}
  .tp__alt-chip:hover{border-color:var(--navy);color:var(--navy)}
  .tp__alt-chip.active{background:var(--navy);color:var(--white);border-color:var(--navy)}
  .tp__alt-chip .dur{font-weight:400;font-variation-settings:'wght' 400;color:var(--text-muted);margin-left:4px}
  .tp__alt-chip.active .dur{color:rgba(255,255,255,.6)}
  .tp__loading{text-align:center;padding:48px 24px;color:var(--text-muted);font-size:var(--text-sm)}
  .tp__spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--navy);border-radius:50%;animation:tpSpin .8s linear infinite;margin:0 auto 12px}
  @keyframes tpSpin{to{transform:rotate(360deg)}}

<body>

<div id="nlTopbar"></div>

<div id="pageWrap" style="display:none;">

      <div class="tp__field">

<script>
var CLUBS_META_URL='https://raw.githubusercontent.com/thenationalleague/tools/refs/heads/main/assets/data/clubs-meta.json';
var CREST_BASE='https://raw.githubusercontent.com/thenationalleague/tools/refs/heads/main/assets/crests/';
var FALLBACK_CREST=CREST_BASE+'National%20League%20rose.png';
var NLS_BASE='https://multi-club-matches.football.web.gc.nationalleagueservices.co.uk/v2';
var SEASON_ID=2025;
var COMP_IDS=[89,373,372];

var clubs=[];
var currentMode='fixture';
var fixSelectedClub=null;
var fixNextMatch=null;
var manFromClub=null;
var manToClub=null;
var RouteClass=null;
var allRoutes=[];
var activeRouteIdx=0;
var gmapsReady=false;

// ── Google Maps init ──
async function initGoogleMaps(){
  try{
    var routesLib=await google.maps.importLibrary('routes');
    RouteClass=routesLib.Route;
    gmapsReady=true;
    updateButtons();
  }catch(err){
    console.error('Failed to load Routes library:',err);
    document.getElementById('resultsArea').innerHTML='<div class="tp__error">Failed to load Google Maps. Ensure Routes API is enabled in your Google Cloud project.</div>';
  }
}

// ── Clubs ──
function loadClubs(){
  fetch(CLUBS_META_URL).then(function(r){return r.json()}).then(function(data){
    clubs=(data.clubs||[]).map(function(c){
      return{name:c.name||'',code:c.code||'',short:c.short||'',stadium:c.stadium||'',division:c.division||'',optaID:c.optaID||'',postcode:c.postcode||'',colors:c.colors||{}};
    }).sort(function(a,b){return a.name.localeCompare(b.name)});
  }).catch(function(){clubs=[]});
}

function getCrestUrl(n){return CREST_BASE+encodeURIComponent(n)+'.png'}

// ── Club autocomplete ──
function setupClubAC(inputId,listId,wrapId,crestId,onSelect){
  var input=document.getElementById(inputId);
  var list=document.getElementById(listId);
  input.addEventListener('input',function(){filterClubList(this.value,listId,onSelect);onSelect(null)});
  input.addEventListener('focus',function(){if(this.value.length===0)filterClubList('',listId,onSelect)});
  document.addEventListener('click',function(e){if(!e.target.closest('#'+wrapId))list.classList.remove('show')});
}

function filterClubList(query,listId,onSelect){
  var list=document.getElementById(listId);
  var q=query.toLowerCase().trim();
  var filtered=clubs;
  if(q.length>0){
    filtered=clubs.filter(function(c){
      return c.name.toLowerCase().indexOf(q)!==-1||(c.short&&c.short.toLowerCase().indexOf(q)!==-1)||(c.stadium&&c.stadium.toLowerCase().indexOf(q)!==-1)||(c.code&&c.code.toLowerCase()===q);
    });
  }
  if(filtered.length===0){
    list.innerHTML='<div class="tp__ac-item" style="color:var(--text-muted);justify-content:center;">No clubs found</div>';
    list.classList.add('show');return;
  }
  list.innerHTML=filtered.slice(0,15).map(function(c){
    return'<div class="tp__ac-item" data-club="'+c.name.replace(/"/g,'&quot;')+'"><img src="'+getCrestUrl(c.name)+'" alt="" onerror="this.onerror=null;this.src=\''+FALLBACK_CREST+'\'"><span class="name">'+c.name+'</span><span class="ground">'+c.stadium+'</span><span class="div-badge">'+c.division+'</span></div>';
  }).join('');
  list.classList.add('show');
  list.querySelectorAll('.tp__ac-item[data-club]').forEach(function(item){
    item.addEventListener('click',function(){
      var club=clubs.find(function(c){return c.name===item.getAttribute('data-club')});
      onSelect(club);list.classList.remove('show');
    });
  });
}

// ── Selections ──
function selectFixClub(club){
  fixSelectedClub=club;
  var input=document.getElementById('fixClubInput'),crest=document.getElementById('fixClubCrest'),wrap=document.getElementById('fixClubWrap');
  if(club){input.value=club.name;crest.src=getCrestUrl(club.name);crest.style.display='block';wrap.classList.add('has-crest');fetchNextFixture(club)}
  else{crest.style.display='none';wrap.classList.remove('has-crest');fixNextMatch=null;document.getElementById('fixFixtureArea').innerHTML=''}
  updateButtons();
}
function selectManFrom(club){
  manFromClub=club;
  var input=document.getElementById('manFromInput'),crest=document.getElementById('manFromCrest'),wrap=document.getElementById('manFromClubWrap');
  if(club){input.value=club.name+' ('+club.stadium+')';crest.src=getCrestUrl(club.name);crest.style.display='block';wrap.classList.add('has-crest')}
  else{crest.style.display='none';wrap.classList.remove('has-crest')}
  updateButtons();
}
function selectManTo(club){
  manToClub=club;
  var input=document.getElementById('manToInput'),crest=document.getElementById('manToCrest'),wrap=document.getElementById('manToClubWrap');
  if(club){input.value=club.name+' ('+club.stadium+')';crest.src=getCrestUrl(club.name);crest.style.display='block';wrap.classList.add('has-crest')}
  else{crest.style.display='none';wrap.classList.remove('has-crest')}
  updateButtons();
}

// ── Fixture lookup ──
function fetchNextFixture(club){
  var area=document.getElementById('fixFixtureArea');
  area.innerHTML='<div class="tp__loading"><div class="tp__spinner"></div>Finding next fixture…</div>';
  if(!club.optaID){area.innerHTML='<div class="tp__error">No Opta ID for this club — try manual mode.</div>';return}
  var promises=COMP_IDS.map(function(compID){
    return fetch(NLS_BASE+'/matches/?seasonID='+SEASON_ID+'&competitionID='+compID+'&sort=kickOffDateUTC&page.size=100&page.number=1').then(function(r){return r.json()}).catch(function(){return{data:[]}});
  });
  Promise.all(promises).then(function(results){
    var allMatches=[];
    results.forEach(function(r){if(r.data)allMatches=allMatches.concat(r.data)});
    var teamID=club.optaID;
    var upcoming=allMatches.filter(function(m){
      var a=m.attributes;var period=(a.matchPeriod||'').toLowerCase();
      var isUp=period==='prematch'||period===''||period==='fixture';
      var involves=(a.homeTeam&&a.homeTeam.teamID===teamID)||(a.awayTeam&&a.awayTeam.teamID===teamID);
      return isUp&&involves;
    }).sort(function(a,b){return new Date(normaliseDate(a.attributes.kickOffDateUTC))-new Date(normaliseDate(b.attributes.kickOffDateUTC))});
    if(upcoming.length===0){area.innerHTML='<div class="tp__error">No upcoming fixtures found for '+club.name+'.</div>';fixNextMatch=null;updateButtons();return}
    var match=upcoming[0];fixNextMatch=match;
    var a=match.attributes;var isHome=a.homeTeam&&a.homeTeam.teamID===teamID;
    var opponent=isHome?a.awayTeam:a.homeTeam;var venue=isHome?'Home':'Away';
    var ko=new Date(normaliseDate(a.kickOffDateUTC));var koStr=formatDate(ko)+' — '+formatTime(ko);
    var oppClub=clubs.find(function(c){return c.optaID===opponent.teamID});
    area.innerHTML='<div class="tp__fixture"><img class="tp__fixture-crest" src="'+getCrestUrl(opponent.name||(oppClub?oppClub.name:''))+'" alt="" onerror="this.onerror=null;this.src=\''+FALLBACK_CREST+'\'"><div class="tp__fixture-info"><div class="tp__fixture-teams">'+(isHome?club.name+' vs '+(opponent.name||'TBC'):(opponent.name||'TBC')+' vs '+club.name)+'</div><div class="tp__fixture-meta">'+koStr+(oppClub?' · '+oppClub.stadium:'')+'</div></div><span class="tp__fixture-badge">'+venue+'</span></div>';
    updateButtons();
  }).catch(function(err){area.innerHTML='<div class="tp__error">Failed to load fixtures.</div>';console.error(err)});
}

// ── Helpers ──
function normaliseDate(s){if(!s)return'';return s.includes('T')?s:s.replace(' ','T')+'Z'}
function formatDate(d){var days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];var months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];return days[d.getDay()]+' '+d.getDate()+' '+months[d.getMonth()]}
function formatTime(d){return pad(d.getHours())+':'+pad(d.getMinutes())}
function pad(n){return n<10?'0'+n:''+n}
function formatDuration(s){var sec=parseInt(s,10);if(isNaN(sec))return s;var h=Math.floor(sec/3600);var m=Math.floor((sec%3600)/60);return h>0?h+'h '+m+'min':m+' min'}
function formatDistance(m){return m>=1000?(m/1000).toFixed(1)+' km':m+' m'}

// ── Mode/transport ──
function setMode(mode){
  currentMode=mode;
  document.querySelectorAll('.tp__mode-btn').forEach(function(b){b.classList.toggle('active',b.getAttribute('data-mode')===mode)});
  document.getElementById('fixtureMode').style.display=mode==='fixture'?'block':'none';
  document.getElementById('manualMode').style.display=mode==='manual'?'block':'none';
  document.getElementById('resultsArea').innerHTML='';
}
function setTransport(btn,prefix){
  document.getElementById(prefix+'Transport').querySelectorAll('.tp__transport-btn').forEach(function(b){b.classList.remove('active')});
  btn.classList.add('active');
}
function getTransportMode(prefix){
  var active=document.getElementById(prefix+'Transport').querySelector('.tp__transport-btn.active');
  return active?active.getAttribute('data-mode'):'TRANSIT';
}
function updateButtons(){
  document.getElementById('fixSearchBtn').disabled=!(document.getElementById('fixOriginInput').value.trim().length>=3&&fixSelectedClub&&fixNextMatch&&gmapsReady);
  document.getElementById('manSearchBtn').disabled=!(document.getElementById('manFromInput').value.trim().length>=3&&document.getElementById('manToInput').value.trim().length>=3&&gmapsReady);
}

// ── Route requests ──
function doFixtureSearch(){
  if(!fixNextMatch||!fixSelectedClub)return;
  var origin=document.getElementById('fixOriginInput').value.trim();
  var a=fixNextMatch.attributes;var teamID=fixSelectedClub.optaID;
  var isHome=a.homeTeam&&a.homeTeam.teamID===teamID;
  var destClub=isHome?fixSelectedClub:clubs.find(function(c){return c.optaID===(isHome?a.awayTeam.teamID:a.homeTeam.teamID)});
  var destination=destClub?(destClub.postcode?destClub.stadium+', '+destClub.postcode:destClub.stadium+', '+destClub.name):(a.homeTeam.name||'stadium');
  var travelMode=getTransportMode('fix');
  var arriveMinsBefore=parseInt(document.getElementById('fixArriveSlider').value,10);
  var ko=new Date(normaliseDate(a.kickOffDateUTC));
  var arriveBy=new Date(ko.getTime()-arriveMinsBefore*60000);
  requestRoute(origin,destination,travelMode,arriveBy,destClub?destClub.name:null);
}

function doManualSearch(){
  var fromInput=document.getElementById('manFromInput').value.trim();
  var toInput=document.getElementById('manToInput').value.trim();
  var travelMode=getTransportMode('man');
  var origin=manFromClub?(manFromClub.postcode?manFromClub.stadium+', '+manFromClub.postcode:manFromClub.stadium+', '+manFromClub.name):fromInput;
  var destination=manToClub?(manToClub.postcode?manToClub.stadium+', '+manToClub.postcode:manToClub.stadium+', '+manToClub.name):toInput;
  var departureTime=null;
  if(document.getElementById('manWhenSelect').value==='choose'){var dt=document.getElementById('manTimeInput').value;if(dt)departureTime=new Date(dt)}
  else departureTime=new Date();
  requestRoute(origin,destination,travelMode,departureTime,manToClub?manToClub.name:null);
}

async function requestRoute(origin,destination,travelMode,targetTime,destClubName){
  var results=document.getElementById('resultsArea');
  results.innerHTML='<div class="tp__loading"><div class="tp__spinner"></div>Finding the best route…</div>';
  if(!RouteClass){results.innerHTML='<div class="tp__error">Google Routes library not loaded. Ensure Routes API is enabled.</div>';return}

  var request={
    origin:origin,
    destination:destination,
    travelMode:travelMode,
    computeAlternativeRoutes:true,
    languageCode:'en-GB',
    units:google.maps.UnitSystem.METRIC,
    fields:['legs','localizedValues','travelAdvisory']
  };

  if(travelMode==='TRANSIT'){
    request.departureTime=targetTime||new Date();
    request.transitPreference={routingPreference:'FEWER_TRANSFERS'};
  }else if(targetTime){
    request.departureTime=targetTime;
  }

  try{
    var response=await RouteClass.computeRoutes(request);
    var routes=response.routes||[];
    if(!routes||routes.length===0){results.innerHTML='<div class="tp__error">No routes found. Try a different origin or destination.</div>';return}
    allRoutes=routes;activeRouteIdx=0;
    renderJourney(routes,0,origin,destClubName||destination);
  }catch(err){
    console.error('Route failed:',err);
    results.innerHTML='<div class="tp__error">Could not find a route. '+(err.message||'')+'</div>';
  }
}

// ── Render ──
function renderJourney(routes,idx,originLabel,destLabel){
  var results=document.getElementById('resultsArea');
  var route=routes[idx];var leg=route.legs[0];
  var durText='';
  if(route.localizedValues&&route.localizedValues.duration)durText=route.localizedValues.duration.text||'';
  else if(leg.localizedValues&&leg.localizedValues.duration)durText=leg.localizedValues.duration.text||'';
  else if(route.duration)durText=formatDuration(String(route.duration).replace('s',''));

  var html='<div class="tp__summary"><div class="tp__summary-route">'+abbreviate(originLabel)+'<span class="arrow">→</span>'+abbreviate(destLabel)+'</div><div class="tp__summary-duration">'+durText+'</div></div>';
  html+='<div class="tp__board">';

  if(leg.steps&&leg.steps.length>0){
    leg.steps.forEach(function(step){
      var mode=classifyStep(step);var modeLabel=getModeLabel(mode);
      var depTime='',arrTime='',routeDesc='',stopsDesc='',durT='',distT='';

      if(step.transitDetails){
        var td=step.transitDetails;var sd=td.stopDetails||{};
        if(sd.departureTime)depTime=fmtISO(sd.departureTime);
        if(sd.arrivalTime)arrTime=fmtISO(sd.arrivalTime);
        var line=td.transitLine||{};
        var lName=line.nameShort||line.name||'';
        var depStop=sd.departureStop?sd.departureStop.name:'';
        var arrStop=sd.arrivalStop?sd.arrivalStop.name:'';
        routeDesc=lName+(arrStop?' to '+arrStop:'');
        stopsDesc=depStop+' → '+arrStop;
        if(td.stopCount)stopsDesc+=' · '+td.stopCount+' stops';
        if(line.vehicle&&line.vehicle.type){mode=line.vehicle.type;modeLabel=getModeLabel(mode)}
      }else{
        routeDesc=step.navigationInstruction?stripHtml(step.navigationInstruction.instructions):'';
      }

      if(step.localizedValues){
        if(step.localizedValues.staticDuration)durT=step.localizedValues.staticDuration.text||'';
        if(!durT&&step.localizedValues.duration)durT=step.localizedValues.duration.text||'';
      }
      if(step.localizedValues&&step.localizedValues.distance)distT=step.localizedValues.distance.text||'';
      else if(step.distanceMeters)distT=formatDistance(step.distanceMeters);

      html+='<div class="tp__leg tp__leg--'+mode+'">';
      html+='<div class="tp__leg-timeline"><div class="dot"></div>';
      if(depTime)html+='<div class="tp__leg-time">'+depTime+'</div>';
      html+='<div class="line"></div>';
      if(arrTime)html+='<div class="tp__leg-time-end">'+arrTime+'</div>';
      html+='</div>';
      html+='<div class="tp__leg-detail"><div class="tp__leg-mode">'+modeLabel+'</div>';
      if(routeDesc)html+='<div class="tp__leg-route">'+routeDesc+'</div>';
      if(stopsDesc)html+='<div class="tp__leg-stops">'+stopsDesc+'</div>';
      if(distT&&!stopsDesc)html+='<div class="tp__leg-stops">'+distT+'</div>';
      if(durT)html+='<div class="tp__leg-duration">'+durT+'</div>';
      html+='</div></div>';
    });
  }

  if(routes.length>1){
    html+='<div class="tp__alts">';
    routes.forEach(function(r,i){
      var rDur='';if(r.localizedValues&&r.localizedValues.duration)rDur=r.localizedValues.duration.text||'';
      var chipLabel='Route '+(i+1);
      if(r.legs&&r.legs[0]&&r.legs[0].steps){
        for(var s=0;s<r.legs[0].steps.length;s++){
          var st=r.legs[0].steps[s];
          if(st.transitDetails&&st.transitDetails.stopDetails&&st.transitDetails.stopDetails.departureTime){
            chipLabel=fmtISO(st.transitDetails.stopDetails.departureTime);break;
          }
        }
      }
      html+='<div class="tp__alt-chip'+(i===idx?' active':'')+'" onclick="switchRoute('+i+',\''+escHtml(originLabel)+'\',\''+escHtml(destLabel)+'\')">'+chipLabel;
      if(rDur)html+='<span class="dur">'+rDur+'</span>';
      html+='</div>';
    });
    html+='</div>';
  }
  html+='</div>';
  results.innerHTML=html;
}

function switchRoute(idx,o,d){activeRouteIdx=idx;renderJourney(allRoutes,idx,o,d)}

// ── Step helpers ──
function fmtISO(v){
  if(!v)return'';
  if(typeof v==='string'){var d=new Date(v);return isNaN(d)?v:formatTime(d)}
  if(v.text)return v.text;
  if(v instanceof Date)return formatTime(v);
  return'';
}
function classifyStep(s){
  if(s.travelMode==='WALK'||s.travelMode==='WALKING')return'WALKING';
  if(s.travelMode==='DRIVE'||s.travelMode==='DRIVING')return'DRIVING';
  if(s.transitDetails){var l=s.transitDetails.transitLine||{};if(l.vehicle&&l.vehicle.type)return l.vehicle.type;return'RAIL'}
  return'WALKING';
}
function getModeLabel(m){
  var L={WALKING:'🚶 Walk',WALK:'🚶 Walk',DRIVING:'🚗 Drive',DRIVE:'🚗 Drive',BUS:'🚌 Bus',INTERCITY_BUS:'🚌 Coach',RAIL:'🚆 Train',HEAVY_RAIL:'🚆 Train',COMMUTER_TRAIN:'🚆 Train',HIGH_SPEED_TRAIN:'🚄 Train',LONG_DISTANCE_TRAIN:'🚆 Train',SUBWAY:'🚇 Underground',METRO_RAIL:'🚇 Metro',TRAM:'🚊 Tram',LIGHT_RAIL:'🚊 Light rail',FERRY:'⛴ Ferry'};
  return L[m]||m;
}
function stripHtml(h){if(!h)return'';var t=document.createElement('div');t.innerHTML=h;return t.textContent||t.innerText||''}
function abbreviate(s){if(!s)return'';return s.length>30?s.substring(0,28)+'…':s}
function escHtml(s){return(s||'').replace(/'/g,"\\'").replace(/"/g,'&quot;')}

// ── Wiring ──
function wireInputListeners(){
  document.getElementById('fixOriginInput').addEventListener('input',updateButtons);
  document.getElementById('manFromInput').addEventListener('input',function(){
    if(manFromClub){manFromClub=null;document.getElementById('manFromCrest').style.display='none';document.getElementById('manFromClubWrap').classList.remove('has-crest')}
    updateButtons();
  });
  document.getElementById('manToInput').addEventListener('input',function(){
    if(manToClub){manToClub=null;document.getElementById('manToCrest').style.display='none';document.getElementById('manToClubWrap').classList.remove('has-crest')}
    updateButtons();
  });
}

window.nlAuthReady=function(session){
  document.getElementById('pageWrap').style.display='block';
  loadClubs();initGoogleMaps();wireInputListeners();
  setTimeout(function(){
    setupClubAC('fixClubInput','fixClubAC','fixClubWrap','fixClubCrest',selectFixClub);
    setupClubAC('manFromInput','manFromAC','manFromClubWrap','manFromCrest',selectManFrom);
    setupClubAC('manToInput','manToAC','manToClubWrap','manToCrest',selectManTo);
  },1500);
};
