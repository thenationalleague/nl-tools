  NL Travel Planner v40.4
  Changelog:
  v40.4| 16/08/2026 | Durations delegate to the canon: fmtDur() now wraps
       |            | NL.formatDuration (nl-utils v1.33), whose compound
       |            | "1h 30min" convention was lifted from this very helper
       |            | (second caller: nls-monitor, PR #808). One behaviour
       |            | tightening: exact hours render "1h" not "1h 0min", and
       |            | unparseable input renders the canon '—' rather than
       |            | echoing the raw string.
  v40.3| 16/08/2026 | Time formatting delegates to the canon: ft() now wraps
       |            | NL.formatTime (nl-utils v1.31, promoted from three
       |            | hand-rolled copies incl. this one); local pad() removed.
  v40.2| 25/07/2026 | Toolbar refinement (user-reported wrap + follow-up):
       |            | - At ~1100px the four toolbar groups + button overflowed
       |            |   the row, dropping "Find journey" onto a lonely second
       |            |   line. ALL option groups (mode, direction, depart-from)
       |            |   now stack their two choices vertically — every column
       |            |   is the same 92px height, labels align on one line, and
       |            |   the button rises to match (min-height 92px) so the band
       |            |   sits on one line. Pills/chips left-aligned in stacks.
       |            |   Mobile (<=640px) keeps the full-width 46px button row.
  v40.1| 25/07/2026 | Journey Options toolbar (demo-approved layout B):
       |            | - Mode, direction and depart-from now sit in one labelled
       |            |   band with "Find journey" pushed to the far right at its
       |            |   natural size (was a full-width slab; the direction toggle
       |            |   no longer stretches to fill the row).
       |            | - Custom-address inputs moved below the toolbar, full width.
       |            | - ≤640px the action drops to its own full-width row and the
       |            |   divider hides — mobile stacking unchanged in effect.
       |            | - Removed now-unused .tp__controls-row and .tp__btn-full.
  v40.0| 24/07/2026 | Single-flow redesign (demo-approved: 1A + KO buffer + merge):
       |            | - Manual Journey tab removed. One flow: fixture list stays
       |            |   box-bound (scrolls in its panel); "Plan a custom fixture"
       |            |   sits pinned beneath it and expands home/away pickers + KO
       |            |   inline. Both paths feed ONE normalised selection (`sel`)
       |            |   and ONE Journey Options panel — the duplicated man* control
       |            |   stack (~150 lines) is gone, as is the setDir/setManDir
       |            |   cross-flip bug class.
       |            | - Journey banner (P0 fix): "Travel plan — from X to Y" above
       |            |   the options, amber variant on your own home game ("this
       |            |   plans the visiting side's route") with a custom-start
       |            |   escape hatch. Preset label is now "Depart from"/"Return to".
       |            | - "Arrive before kick-off" slider removed. Transit searches
       |            |   target kick-off itself; results lead with a KO buffer strip
       |            |   ("Arrives 53 min before kick-off", green/amber/red) and
       |            |   each route chip carries its own "KO −Nm" badge. Returns get
       |            |   an info strip ("Departs Nm after estimated full-time").
       |            | - Drive mode: est. arrival + KO buffer computed from the
       |            |   (now disclosed) assumed departure; cards show leave→ETA.
       |            | - A11y: fixture rows/alt chips/drive cards/board legs are
       |            |   keyboard-operable (role=button + tabindex + delegated
       |            |   Enter/Space), toggles carry aria-pressed, results area is
       |            |   aria-live, sliders get for/id labels, presets meet 44px.
       |            | - Errors: friendlyErr() translation + Retry button on all
       |            |   search failures; custom preset validates address before
       |            |   calling the API; plain-text address fallback if Places
       |            |   fails to load. Removed the 1.5s boot delay.
       |            | - URL state: single-mode params (club/fix or home/away/ko);
       |            |   legacy mode=manual links still restore. `arr` param retired.
       |            | - Dead code removed: duplicate getEnabledModes, setTransport,
       |            |   .tp__tt/.tp__select/.tp__modes CSS, stale .pac-container
       |            |   styles (old Autocomplete API).
  v39.6| 24/07/2026 | Fixture-list venue fix + direction-wording pass:
       |            | - Fixture preview meta showed the OPPONENT's stadium on
       |            |   home games (always oc.stadium). Now venue club =
       |            |   isH?club:oc, so home fixtures show your own ground.
       |            | - Direction toggle relabelled "Travel to match" /
       |            |   "Return from match" (was Travel TO/FROM).
       |            | - "Start / end point" label + Find button now follow the
       |            |   direction (Start/End point, Find journey/Find return
       |            |   journey) via updateDirText(); loading .finally resets
       |            |   through it too.
       |            | - setDir() scoped to #fixtureMode (was flipping the
       |            |   Manual-mode direction toggle's visual state too).
       |            | - cU()/cUf() now delegate to NL.clubs.crestUrl (canon);
       |            |   map info-window font sans-serif → var(--font).
  v39.5| 13/07/2026 | clubs-meta now sourced from NL.clubs.load() (canon,
       |            | session-memoised) instead of a local fetch(CMU). The
       |            | local flattened clubs array + journey math are unchanged;
       |            | only the raw data source moved. Removed the unused CMU const.
  v39.4| 12/07/2026 | Fixture-list crests now load 96px thumbnails
       |            | (assets/crests/thumbs/) with a thumb→full-res→rose
       |            | onerror fallback. cU() returns the thumb URL; new cUf()
       |            | builds the full-res URL for the fallback.
  v39.3| 12/07/2026 | Club fields migrated to the shared NL.clubPicker
       |            | (nl-utils). Removed the local club-picker markup, the
       |            | setupAC/fAC autocomplete, and the picker-DOM halves of
       |            | selFC/selManHome/selManAway — the component owns the input,
       |            | crest and dropdown now. season:'all' (manual mode routes to
       |            | any club) + freetext:false (a typed non-roster name has no
       |            | stadium/postcode/station to geocode). KEPT the local
       |            | loadClubs/clubs array/CMU/cU/FC/CB and all journey math:
       |            | each pick is re-resolved to the flattened local club by name
       |            | so addr()/stationAddr()/optaID resolution are unchanged.
       |            | Restore paths (URL + last-club) now call picker.setValue to
       |            | repaint the field. Minor: dropdown subtitle is now the
       |            | club's division (was stadium) — the component default.
  v39.2| 11/07/2026 | Fixture loader now pages through the whole NLS feed
       |            | (was page.number=1 only → first 100 matches of the
       |            | competition, so a club surfaced in just ~8 fixtures) and
       |            | the slice(0,10) display cap is removed. A club now lists
       |            | its full season (46 fixtures) instead of a partial tail.
  v39.1| 03/05/2026 | Brand sweep:
       |            | - CSS swaps: #fff → var(--white) on btn-loading
       |            |   spinner; #1a2a44, #ccc on B-road badge → var(--text),
       |            |   var(--border).
       |            | - Added tpCssVar() helper to resolve brand tokens at
       |            |   runtime for the Google Maps API (which only accepts
       |            |   literal hex strings, not var()). Used to swap five
       |            |   hardcoded hex strokeColors on Polylines and one
       |            |   marker-border colour: #999 → --text-muted, #9e0000 →
       |            |   --primary, #223b7c (×3) → --navy, #fff → --white.
       |            | - Documented in-place exceptions:
       |            |   * UK road-sign identity colours (motorway blue,
       |            |     A-road green/yellow) on .tp__road-badge--m/--a.
       |            |   * Google Maps style array (DRIVE_MAP_STYLE) — Google
       |            |     consumes literal hex; theme palette retained as a
       |            |     cohesive map identity.
  v39.0| 03/05/2026 | Major UX pass:
       |            | - Driving mode: Train/Drive toggle, summary cards with tolls
       |            |   and up to 2 alternatives. Route polyline on map.
       |            | - Combined mode+direction row (compact pill layout).
       |            | - Clickable map markers with info windows (station name).
       |            | - Scroll to results after search.
       |            | - Button loading state during API calls.
       |            | - Validation shake on missing fields.
       |            | - Clear (×) button on all club pickers.
       |            | - KO time quick presets (Sat 3pm, Tue 7:45pm etc).
       |            | - Remember last club via localStorage.
       |            | - Map bounds padding increased for mobile.
  v38.0| 03/05/2026 | Tool key fix. Stadium preset removed. Places Autocomplete.
       |            | Cloud Map ID styling. AdvancedMarkerElement.
  v37.1| 02/05/2026 | addr() uses postcode only for geocoding.
  v37.0| 02/05/2026 | Shareable URL state.
-->

    {date:'24 Jul 2026',version:'v4.0',items:['One flow: the Manual Journey tab is gone — plan a custom fixture right beneath the fixture list, using the same journey options as a real fixture.','Every journey now says whose it is: "Travel plan — from Altrincham to LNER Community Stadium", with an amber note when your home game means you\'re planning the visitors\' route (and a custom start point to plan your own).','Results lead with the answer: "Arrives 53 min before kick-off" in green, amber or red, and each alternative route shows its own margin. The "arrive before kick-off" slider is gone — searches aim at kick-off and the buffer does the talking.','Driving results now show estimated arrival against kick-off and state the assumed departure time (previously a silent three-hours-before guess).','Keyboard and screen-reader access: fixtures, route chips, journey legs and drive routes can all be reached and activated without a mouse, and toggles announce their state.','Friendlier failures: plain-English error messages with a Try again button, the custom address is checked before searching, and a plain text box appears if Google\'s address suggestions fail to load.','Old share links still open; the pre-kick-off arrival setting in them is simply ignored.']},

<style>
  .tp{max-width:1100px;margin:0 auto;padding:clamp(16px,2vw,32px) clamp(12px,2vw,24px) 60px}
  .tp__panel{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:16px}
  .tp__panel-title{font-size:var(--text-xs);font-weight:800;font-variation-settings:'wght' 800;text-transform:uppercase;letter-spacing:.04em;color:var(--navy);margin-bottom:14px}
  .tp__field{margin-bottom:12px}.tp__field:last-child{margin-bottom:0}
  .tp__label{display:block;font-size:var(--text-xs);font-weight:700;font-variation-settings:'wght' 700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);margin-bottom:4px}
  .tp__input{width:100%;padding:8px 12px;border:2px solid var(--border);border-radius:var(--radius);font-family:var(--font);font-size:var(--text-sm)!important;color:var(--text);background:var(--white);transition:border-color .15s;appearance:none}
  .tp__input:focus{outline:none;border-color:var(--navy)}

  /* Journey banner — states whose journey is being planned (P0 fix) */
  .tp__jbanner{background:var(--blue-light);border-left:4px solid var(--navy);border-radius:var(--radius);padding:10px 12px;margin-bottom:14px}
  .tp__jbanner .t{font-size:var(--text-sm);font-weight:800;font-variation-settings:'wght' 800;color:var(--navy)}
  .tp__jbanner .s{font-size:var(--text-xs);color:var(--text-muted);margin-top:2px}
  /* = canon .banner banner--amber; local because --warn is a modifier of the
     structured journey banner above (left accent + .t/.s title/sub children
     baked into the render), not a standalone notice strip — repointing means
     markup surgery on the journey cards. */
  .tp__jbanner--warn{background:var(--amber-light);border-left-color:var(--amber)}
  .tp__jbanner--warn .t{color:var(--amber)}

  /* KO buffer strip — will-I-make-kick-off headline on results */
  .tp__kobuf{padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--border)}
  .tp__kobuf .big{font-size:var(--text-sm);font-weight:800;font-variation-settings:'wght' 800}
  .tp__kobuf .sub{font-size:var(--text-xs);margin-left:auto;text-align:right}
  .tp__kobuf--ok{background:var(--green-light);color:var(--green)}
  .tp__kobuf--tight{background:var(--amber-light);color:var(--amber)}
  .tp__kobuf--late{background:var(--red-light);color:var(--red)}
  .tp__kobuf--info{background:var(--blue-light);color:var(--navy)}
  .chip-buf{display:block;font-size:var(--text-xs);font-weight:800;font-variation-settings:'wght' 800;margin-top:1px}
  .chip-buf--ok{color:var(--green)}.chip-buf--tight{color:var(--amber)}.chip-buf--late{color:var(--red)}
  .tp__alt-chip.active .chip-buf{color:rgba(255,255,255,.85)}

  /* Custom fixture builder — pinned beneath the (box-bound) fixture list */
  .tp__cf-link{width:100%;min-height:44px;border:none;background:none;font-family:var(--font);font-size:var(--text-sm)!important;color:var(--text-muted);cursor:pointer;padding:4px;text-align:center}
  .tp__cf-link b{color:var(--navy)}
  .tp__cf-link:hover b{text-decoration:underline}

  /* Keyboard focus — every operable element gets a visible ring */
  .tp [role="button"]:focus-visible,.tp button:focus-visible,.tp input:focus-visible{outline:3px solid var(--navy);outline-offset:2px}

  /* AC — club-picker uses brand flex layout (crest + input as siblings).
     Only override: hide crest by default, show when club is selected. */
  .club-picker__crest{display:none}
  .club-picker.has-crest .club-picker__crest{display:block}

  /* Journey Options toolbar — one labelled band: mode · direction · depart-from · action.
     Groups wrap when space runs out; ≤640px the action drops to a full-width row. */
  .tp__toolbar{display:flex;align-items:flex-end;gap:12px 14px;flex-wrap:wrap;margin-bottom:12px}
  .tp__tb-group{display:flex;flex-direction:column;gap:5px}
  .tp__tb-group .tp__label{margin-bottom:0}
  .tp__tb-group .tp__presets{margin-bottom:0}
  .tp__tb-sep{width:1px;background:var(--border);align-self:stretch}
  .tp__tb-push{margin-left:auto}
  .tp__tb-push .btn{min-height:92px} /* matches the stacked direction toggle (2×44 + border) */
  @media(max-width:640px){
    .tp__tb-push{margin-left:0;width:100%}
    .tp__tb-push .btn{width:100%;min-height:46px}
    .tp__tb-sep{display:none}
  }
  /* All option groups stack their two choices vertically — every toolbar column
     lands at the same 92px height, labels align on one line, and the action
     fits beside them at matching height on desktop widths */
  .tp__dir-toggle{display:flex;flex-direction:column;border-radius:var(--radius);overflow:hidden;border:2px solid var(--border)}
  .tp__dir-btn{text-align:left}
  .tp__mode-toggle{flex-direction:column}
  .tp__mode-pill{text-align:left}
  .tp__tb-group .tp__presets{flex-direction:column;align-items:stretch;gap:4px}
  .tp__preset{text-align:left}
  .tp__dir-btn{flex:1;padding:10px 12px;border:none;background:var(--white);font-family:var(--font);font-size:var(--text-xs)!important;font-weight:800;font-variation-settings:'wght' 800;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);cursor:pointer;transition:all .15s;min-height:44px;white-space:nowrap}
  .tp__dir-btn.active{background:var(--navy);color:var(--white)}
  .tp__mode-toggle{display:flex;border-radius:var(--radius);overflow:hidden;border:2px solid var(--border)}
  .tp__mode-pill{padding:10px 14px;border:none;background:var(--white);font-family:var(--font);font-size:var(--text-xs)!important;font-weight:800;font-variation-settings:'wght' 800;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);cursor:pointer;transition:all .15s;min-height:44px;white-space:nowrap}
  .tp__mode-pill.active{background:var(--navy);color:var(--white)}
  .tp__mode-pill:hover:not(.active){background:var(--off-white);color:var(--navy)}

  /* Club picker clear button */
  .club-picker__clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:24px;height:24px;border:none;background:none;font-size:var(--text-base);color:var(--text-muted);cursor:pointer;padding:0;line-height:1;display:none;z-index:3}
  .club-picker__clear:hover{color:var(--text)}
  .club-picker.has-crest .club-picker__clear{display:block}
  .club-picker__wrap{position:relative}

  /* Validation shake */
  @keyframes tpShake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}
  .tp__shake{animation:tpShake .3s;border-color:var(--red)!important}

  /* Button loading state */
  .btn--loading{pointer-events:none;opacity:.7}
  .btn--loading::after{content:'';display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:var(--white);border-radius:50%;animation:tpSpin .6s linear infinite;margin-left:8px;vertical-align:middle}

  /* KO quick presets — 44px touch floor */
  .tp__ko-presets{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
  .tp__ko-preset{padding:8px 12px;min-height:44px;border:1px solid var(--border);border-radius:99px;background:var(--white);font-family:var(--font);font-size:var(--text-xs)!important;font-weight:700;font-variation-settings:'wght' 700;color:var(--text-muted);cursor:pointer;transition:all .15s}
  .tp__ko-preset:hover{border-color:var(--navy);color:var(--navy)}

  /* Drive results card */
  .tp__drive-results{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  .tp__drive-card{padding:16px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s}
  .tp__drive-card:last-child{border-bottom:none}
  .tp__drive-card:hover{background:var(--off-white)}
  .tp__drive-card.active{background:var(--off-white);border-left:3px solid var(--navy)}
  .tp__drive-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
  .tp__drive-dur{font-size:var(--text-sm);font-weight:800;font-variation-settings:'wght' 800;color:var(--text)}
  .tp__drive-dist{font-size:var(--text-xs);color:var(--text-muted);font-weight:600}
  .tp__drive-meta{font-size:var(--text-xs);color:var(--text-muted)}
  .tp__drive-toll{display:inline-flex;align-items:center;gap:3px;font-size:var(--text-xs);font-weight:700;color:var(--amber);background:var(--amber-light);padding:2px 8px;border-radius:99px;margin-top:4px}
  .tp__drive-via{font-size:var(--text-xs);color:var(--text-muted);margin-top:2px}
  .tp__drive-roads{display:flex;flex-wrap:wrap;gap:3px;margin-top:5px}
  .tp__road-badge{display:inline-block;padding:2px 7px;border-radius:3px;font-size:var(--text-xs);font-weight:800;font-variation-settings:'wght' 800;letter-spacing:.02em;line-height:1.4}
  /* UK road sign identity colours — read from brand canon (--road-sign-*).
     Promoted to brand in nl-brand.css v2.19; was widget-internal before. */
  .tp__road-badge--m{background:var(--road-sign-m);color:var(--white)}

  /* Origin preset — 44px touch floor */

  /* Results */

  .tp__map-col{min-height:350px;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}

  /* Summary */

  .tp__summary-depart{font-size:var(--text-xs);color:rgba(255,255,255,.6);width:100%}

  /* Alts — sticky between summary and board */

  .tp__alt-chip{flex-shrink:0;padding:6px 12px;border-radius:10px;border:2px solid var(--border);background:var(--white);font-family:var(--font);cursor:pointer;transition:all .15s;white-space:nowrap;text-align:center}

  /* Board — COMPACT */
  .tp__board{background:var(--white);overflow:hidden}

  .tp__leg-time-end{font-size:var(--text-xs);font-weight:600;font-variation-settings:'wght' 600;color:var(--text-muted);line-height:1.2}
  .tp__leg-rail{width:14px;min-width:14px;display:flex;flex-direction:column;align-items:center;padding:10px 0}
  .tp__leg-rail .dot{width:10px;height:10px;border-radius:50%;border:2.5px solid var(--navy);background:var(--white);flex-shrink:0;z-index:1}
  .tp__leg-rail .line{flex:1;width:2px;background:var(--border);margin:2px 0 0;min-height:8px}
  .tp__leg--walk .dot{border-color:var(--text-muted)}
  .tp__leg--bus .dot{border-color:var(--amber)}
  .tp__leg--train .dot{border-color:var(--navy)}
  .tp__leg--subway .dot{border-color:var(--primary)}
  .tp__leg--tram .dot{border-color:var(--green)}
  .tp__leg-detail{flex:1;padding:8px 14px 8px 8px;text-align:left;min-width:0}
  .tp__leg-mode{display:inline-flex;align-items:center;gap:4px;font-size:var(--text-xs);font-weight:800;font-variation-settings:'wght' 800;text-transform:uppercase;letter-spacing:.05em;padding:2px 7px;border-radius:99px;margin-bottom:3px}
  .tp__leg--walk .tp__leg-mode{background:var(--off-white);color:var(--text-muted)}
  .tp__leg--bus .tp__leg-mode{background:var(--amber-light);color:var(--amber)}
  .tp__leg--train .tp__leg-mode{background:var(--blue-light);color:var(--blue)}
  .tp__leg--subway .tp__leg-mode{background:var(--red-light);color:var(--primary)}
  .tp__leg--tram .tp__leg-mode{background:var(--green-light);color:var(--green)}
  .tp__leg-route{font-size:var(--text-sm);font-weight:700;font-variation-settings:'wght' 700;color:var(--text);margin-bottom:1px;line-height:1.3}
  .tp__leg-stops{font-size:var(--text-xs);color:var(--text-muted);line-height:1.3}
  .tp__leg-duration{font-size:var(--text-xs);color:var(--text-muted);font-weight:600;font-variation-settings:'wght' 600}
  /* Compact walk connector — uses same 3-column structure as legs */
  .tp__walk-connector{display:flex;align-items:stretch;border-bottom:1px solid var(--border);font-size:var(--text-xs);color:var(--text-muted);font-weight:600;font-variation-settings:'wght' 600}
  .tp__walk-connector:last-child{border-bottom:none}
  .tp__walk-connector .wc-times{width:44px;min-width:44px;padding:0 8px 0 10px}
  .tp__walk-connector .wc-rail{width:14px;min-width:14px;position:relative;display:flex;align-items:center;justify-content:center}
  .tp__walk-connector .wc-rail::before{content:"";position:absolute;top:0;bottom:0;left:50%;transform:translateX(-50%);width:2px;background:var(--border)}
  .tp__walk-connector .wc-dot{width:6px;height:6px;border-radius:50%;background:var(--border);position:relative;z-index:1;flex-shrink:0}
  .tp__walk-connector .wc-text{flex:1;padding:4px 14px 4px 8px;display:flex;align-items:center;min-width:0}

  .tp__loading{text-align:center;padding:36px 20px;color:var(--text-muted);font-size:var(--text-sm)}
  .tp__spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--navy);border-radius:50%;animation:tpSpin .8s linear infinite;margin:0 auto 10px}
  @keyframes tpSpin{to{transform:rotate(360deg)}}
  .tp__error{text-align:center;padding:20px;color:var(--red);font-size:var(--text-xs);font-weight:600;background:var(--red-light);border-radius:var(--radius);margin-bottom:12px}
  .tp__error .tp__error-msg{font-size:var(--text-sm);font-weight:700;font-variation-settings:'wght' 700;margin-bottom:4px}
  .tp__error .tp__error-raw{color:var(--text-muted);font-weight:400;margin-bottom:10px;word-break:break-word}
  .tp__error .btn{min-height:44px}
  #fixCustomAddrWrap{margin-bottom:12px}
  .tp__footer{text-align:center;padding:16px;font-size:var(--text-xs);color:var(--text-muted)}
  .tp__row{display:flex;gap:8px}.tp__row>*{flex:1}
  @media(max-width:768px){.tp__results{grid-template-columns:1fr}.tp__map-col{min-height:220px}}
  @media(max-width:520px){.tp__summary{flex-direction:column;align-items:flex-start}.tp__leg-times{width:40px;min-width:40px;padding-left:8px}.tp__walk-connector .wc-times{width:40px;min-width:40px;padding-left:8px}.tp__row{flex-direction:column;gap:0}}
</style>

<body>
<div id="pageWrap" style="display:none;">
<div id="nlTopbar"></div>
<div class="tp">

  <!-- SINGLE FLOW — fixtures + custom fixture builder feed the same Journey Options -->
  <div id="fixtureMode">
    <div class="tp__panel">
      <div class="tp__panel-title">Select Your Club</div>
      <div class="tp__field">
        <div id="fixClubWrap"></div>
      </div>
    </div>
    <div id="fixFixtureArea"></div>

    <!-- Custom fixture builder — pinned below the box-bound fixture list -->
    <div class="tp__panel" id="cfPanel">
      <button type="button" class="tp__cf-link" id="cfToggle" aria-expanded="false" onclick="toggleCF()">Can't find your fixture? <b>Plan a custom one</b></button>
      <div id="cfBody" style="display:none;margin-top:12px">
        <div class="tp__field"><label class="tp__label">Home club (venue)</label>
          <div id="cfHomeW"></div>
        </div>
        <div class="tp__field"><label class="tp__label">Away club (travelling side)</label>
          <div id="cfAwayW"></div>
        </div>
        <div class="tp__field"><label class="tp__label" for="cfKO">Kick-off</label>
          <input class="tp__input" type="datetime-local" id="cfKO">
          <div class="tp__ko-presets">
            <button type="button" class="tp__ko-preset" onclick="setKOPreset(6,12,30)">Sat 12.30pm</button>
            <button type="button" class="tp__ko-preset" onclick="setKOPreset(6,15,0)">Sat 3pm</button>
            <button type="button" class="tp__ko-preset" onclick="setKOPreset(6,17,30)">Sat 5.30pm</button>
            <button type="button" class="tp__ko-preset" onclick="setKOPreset(2,19,45)">Tue 7.45pm</button>
            <button type="button" class="tp__ko-preset" onclick="setKOPreset(3,19,45)">Wed 7.45pm</button>
            <button type="button" class="tp__ko-preset" onclick="setKOPreset(5,19,45)">Fri 7.45pm</button>
          </div>
        </div>
      </div>
    </div>

    <div id="fixConfig" style="display:none;">
      <div class="tp__panel">
        <div class="tp__panel-title">Journey Options</div>
        <div id="jBanner"></div>

        <div class="tp__toolbar">
          <div class="tp__tb-group">
            <span class="tp__label">Mode</span>
            <div class="tp__mode-toggle" id="fixModeToggle">
              <button class="tp__mode-pill active" data-tm="transit" aria-pressed="true" onclick="setFixTM('transit')">🚆 Train</button>
              <button class="tp__mode-pill" data-tm="drive" aria-pressed="false" onclick="setFixTM('drive')">🚗 Drive</button>
            </div>
          </div>
          <div class="tp__tb-group">
            <span class="tp__label">Direction</span>
            <div class="tp__dir-toggle">
              <button class="tp__dir-btn active" data-dir="to" aria-pressed="true" onclick="setDir('to')">➡️ Travel to match</button>
              <button class="tp__dir-btn" data-dir="from" aria-pressed="false" onclick="setDir('from')">⬅️ Return from match</button>
            </div>
          </div>
          <div class="tp__tb-sep"></div>
          <div class="tp__tb-group" id="fixPresetField">
            <span class="tp__label" id="fixPresetLabel">Depart from</span>
            <div class="tp__presets" id="fixPresets">
              <button class="tp__preset active" data-p="station" aria-pressed="true" onclick="setPreset('station')">🚉 Railway Station</button>
              <button class="tp__preset" data-p="custom" aria-pressed="false" onclick="setPreset('custom')">📍 Custom</button>
            </div>
          </div>
          <div class="tp__tb-push">
            <button class="btn btn--primary" id="fixBtn" onclick="doFixSearch()">Find journey</button>
          </div>
        </div>

        <div id="fixCustomAddrWrap" style="display:none">
          <input type="hidden" id="fixCustomAddr">
          <input class="tp__input" type="text" id="fixCustomAddrText" placeholder="Postcode or address" autocomplete="street-address" style="display:none">
        </div>

        <div class="tp__field" id="postSlider" style="display:none;">
          <label class="tp__label" for="extraAfter">Extra time after full-time</label>
          <div class="tp__slider-row">
            <input class="tp__slider" type="range" id="extraAfter" min="0" max="120" step="5" value="0" oninput="upPostLbl()">
            <span class="tp__slider-val" id="extraAfterV" aria-hidden="true">Depart at FT</span>
          </div>
          <div class="tp__slider-note" id="postNote"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="resultsArea" aria-live="polite"></div>
  <div class="tp__footer">Powered by Google Maps Platform & National League Services</div>
</div>
</div>

<script>
var GK='AIzaSyA1qH6K4vtUW8YbMKetK16q2GQaZ2EDXRs';
var RU='https://routes.googleapis.com/directions/v2:computeRoutes';
var STN_URL='/assets/data/stations.json';
var CB='/assets/crests/';
var FC=CB+'National%20League%20rose.png';
var NLS='https://multi-club-matches.football.web.gc.nationalleagueservices.co.uk/v2';
var SID=2026,CIDS=[89,373,372];

var clubs=[],fixClub=null,fixDir='to',fixPreset='station',fixTM='transit';
var sel=null; // normalised selection: {custom,matchID,home,away,homeName,awayName,ko:Date,userIsHome}
var cfHome=null,cfAway=null; // custom fixture builder picks
var fixClubPicker=null,cfHomePicker=null,cfAwayPicker=null; /* NL.clubPicker controllers */
var gMap=null,gPoly=null,allR=[],aIdx=0,mapOK=false;
var crsLookup={}; // station name → CRS code
var lastSkipWalk=null; // 'first','last', or null
var lastSearch=null;
var lastOL='',lastDL=''; // for route switcher map redraw
var searchCtx=null; // {ko:Date,ftEst:Date,dir,tm,driveDep:Date|null} — set per search, drives KO buffer
var _acMounted=false; // Places autocomplete element mounted OK

async function initMap(){try{await google.maps.importLibrary('maps');await google.maps.importLibrary('geometry');await google.maps.importLibrary('marker');await google.maps.importLibrary('places');mapOK=true;initPlacesAC()}catch(e){}finally{if(!_acMounted)showAddrFallback()}}

function initPlacesAC(){
  // Attach Google Places Autocomplete (new API) to the custom address wrapper
  if(!google.maps.places||!google.maps.places.PlaceAutocompleteElement)return;
  var input=document.getElementById('fixCustomAddr');
  var wrap=document.getElementById('fixCustomAddrWrap');
  if(!input||!wrap||wrap.querySelector('gmp-place-autocomplete'))return;
  try{
    var ac=new google.maps.places.PlaceAutocompleteElement({
      includedRegionCodes:['gb']
    });
    ac.style.width='100%';
    wrap.appendChild(ac);
    _acMounted=true;
    ac.addEventListener('gmp-select',async function(ev){
      try{
        var place=ev.placePrediction.toPlace();
        await place.fetchFields({fields:['formattedAddress','displayName','location']});
        var addr=place.formattedAddress||place.displayName||'';
        input.value=addr;
        input.dispatchEvent(new Event('change'));
        updateBanner();
        syncURL();
      }catch(e){}
    });
  }catch(e){}
}

// If Places never mounts (Maps API blocked/failed), fall back to a plain text input
function showAddrFallback(){
  var t=document.getElementById('fixCustomAddrText');
  if(t)t.style.display='block';
}
function custAddrVal(){
  var h=document.getElementById('fixCustomAddr'),t=document.getElementById('fixCustomAddrText');
  return((h&&h.value)||(t&&t.style.display!=='none'&&t.value)||'').trim();
}

function loadClubs(){NL.clubs.load().then(function(d){clubs=(d.clubs||[]).map(function(c){return{name:c.name||'',code:c.code||'',short:c.short||'',stadium:c.stadium_name||'',division:c.division||'',optaID:c.optaID||'',postcode:(c.address&&typeof c.address==='object'?c.address.postcode:c.postcode)||'',colors:c.colors||{},station:c.station||[]}}).sort(function(a,b){return a.name.localeCompare(b.name)})}).catch(function(){})}
function loadCRS(){fetch(STN_URL).then(function(r){return r.json()}).then(function(data){data.forEach(function(s){var name=s.stationName,code=s.crsCode;if(!name||!code)return;crsLookup[name.toLowerCase()]=code;if(name.toLowerCase().indexOf('london ')===0)crsLookup[name.substring(7).toLowerCase()]=code;if(name.toLowerCase().indexOf(' international')!==-1){crsLookup[name.replace(/ International/i,'').toLowerCase()]=code;if(name.toLowerCase().indexOf('london ')===0)crsLookup[name.substring(7).replace(/ International/i,'').toLowerCase()]=code}})}).catch(function(){})}
function getCRS(n){if(!n)return'';var k=n.toLowerCase().replace(/ railway station$/,'').replace(/ station$/,'').replace(/ rail$/,'').trim();var c=crsLookup[k]||crsLookup[n.toLowerCase()]||'';if(c)return c;
// Fallback: try matching as a suffix — only if exactly one match (unambiguous)
if(k.length>=5){var keys=Object.keys(crsLookup),matches=[];for(var i=0;i<keys.length;i++){if(keys[i].length>k.length&&keys[i].indexOf(' '+k)===keys[i].length-k.length-1)matches.push(crsLookup[keys[i]])}if(matches.length===1)return matches[0]}
return''}
function addCRS(n){var c=getCRS(n);return c?n+' ('+c+')':n}
function cU(n){return NL.clubs.crestUrl(n,'thumb')}   // 96px thumbnail for small list crests (canon helper)
function cUf(n){return NL.clubs.crestUrl(n)}          // full-res crest — thumb onerror fallback (canon helper)
function addr(c){
  // Postcode alone geocodes reliably to the ground's area without stadium name confusion
  if(c.postcode)return c.postcode+', UK';
  return c.stadium+', '+(c.short||c.name)+', UK';
}
function stationAddr(c,idx){
  // Return Google-geocodable address for a club's station
  // idx selects which station (0-based) for multi-station clubs; defaults to 0
  if(c.station&&c.station.length){
    var sn=c.station[idx||0]||c.station[0];
    return sn+' Station, UK';
  }
  // Fallback if no station data
  return(c.short||c.name)+' Railway Station, UK';
}
function stationLabel(c){
  // Human-readable label for preset button: "Southend Central / Victoria"
  if(!c.station||!c.station.length)return(c.short||c.name)+' Station';
  if(c.station.length===1)return c.station[0];
  // Multi: abbreviate — show both separated by /
  return c.station.join(' / ');
}

// ── AC ── (local autocomplete replaced by shared NL.clubPicker — see nlAuthReady)

// ── Fix club → fixtures ──
function selFC(c){
  fixClub=c;
  if(sel&&sel.custom){
    // A custom fixture stays selected — your club only affects the home-game warning
    updateBanner();
  }else{
    sel=null;document.getElementById('fixConfig').style.display='none';
  }
  if(c){updatePresetLabels();loadFix(c);saveLastClub(c.code)}else{document.getElementById('fixFixtureArea').innerHTML=''}

async function callAPI(origin,dest,tm,opts,modes){
