<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matchday Travel Map — NL Tools</title>
<!--
  NL Matchday Travel Map v1.9
  v1.9 — Make the pulse dots actually visible: white fill + solid navy ring,
         larger (4.5 default / 6 selected), positioned on creation. The v1.8
         dots were tiny white-on-colour and hard to spot; the motion was running
         but not readable. Selected line slimmed slightly so dots sit clear.
  v1.8 — Pulse rebuilt as real marker dots travelling via Marker.setPosition.
  v1.7 — (superseded) Rebuilt icons array each frame — still froze on device.
  v1.6 — (superseded) Kept flow lines on map, hid dimmed via opacity.
  v1.5 — Pulse speed/size fix: 0.16%/frame was sub-pixel on short routes (read
         as static). Bumped to 0.4%/frame with denser (55px), larger dots so
         motion is visible on short and long legs alike.
  v1.4 — When a fixture is highlighted, only the SELECTED route keeps pulsing;
         all dimmed routes go static.
  v1.3 — Slower pulse.
  v1.2 — Click any fixture (panel or route) to highlight it and dim the rest.
         Animated pulse marches along each route toward the home ground to
         show direction of travel.
  v1.1 — Flat, label-light basemap so route lines dominate (was swamped by
         the planner's motorway styling).
  v1.0 — Initial standalone graphic tool derived from the Travel Planner (v39.1).
  Paste a matchday's fixtures (Home <tab> Away, one per line) and it draws
  every away side's road route to the home ground on a single national map.

  Self-contained: no Firebase / auth-guard / portal wiring. Brand tokens are
  inlined as a fallback and nl-brand.css is linked as progressive enhancement
  when served under /tools/. Club data + crests come from the same public
  sources the Travel Planner uses. Google Maps drive style matches the planner.
-->

<!-- Inlined brand-token fallback so the page renders acceptably even if
     nl-brand.css can't load (e.g. opened as a bare file). Linked brand CSS
     below wins when present. -->
<style>
  :root{
    --primary:#9e0000; --navy:#223b7c;
    --red:#d4380d; --green:#1a7030; --amber:#c96f15; --blue:#1565c0; --purple:#6a1b9a;
    --proj-1:#223b7c; --proj-2:#9e0000; --proj-3:#1a7030; --proj-4:#c96f15;
    --proj-5:#6a1b9a; --proj-6:#1565c0; --proj-7:#1a2f63; --proj-8:#374151;
    --white:#ffffff; --off-white:#f4f6f9;
    --text:#1a2a44; --text-muted:#5a6a82; --border:#dde3ed;
    --radius:6px; --shadow:0 2px 12px rgba(10,22,40,.10);
    --font:'carbona-variable','carbona','Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    --text-xs:12px; --text-sm:14px;
  }
  *{box-sizing:border-box}
  body{margin:0}
</style>

  })({key:GKEY,v:"weekly"});

<style>
  .mm{max-width:1280px;margin:0 auto;padding:clamp(14px,2vw,28px) clamp(12px,2vw,22px) 48px}
  .mm__head{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:16px}
  .mm__title{font-family:var(--font);font-weight:800;font-variation-settings:'wght' 800;color:var(--navy);font-size:clamp(20px,2.4vw,28px);line-height:1.1;margin:0}
  .mm__sub{font-family:var(--font);font-size:var(--text-sm);color:var(--text-muted);margin:4px 0 0}

  .mm__input-panel{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:16px}
  .mm__label{display:block;font-family:var(--font);font-size:var(--text-xs);font-weight:800;font-variation-settings:'wght' 800;text-transform:uppercase;letter-spacing:.05em;color:var(--navy);margin-bottom:8px}
  .mm__textarea{width:100%;min-height:120px;resize:vertical;padding:10px 12px;border:2px solid var(--border);border-radius:var(--radius);font-family:'SFMono-Regular',ui-monospace,Menlo,Consolas,monospace;font-size:13px;line-height:1.5;color:var(--text);background:var(--white);white-space:pre;overflow-x:auto}
  .mm__textarea:focus{outline:none;border-color:var(--navy)}
  .mm__row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
  .mm__date{padding:8px 12px;border:2px solid var(--border);border-radius:var(--radius);font-family:var(--font);font-size:var(--text-sm);color:var(--text)}
  .mm__hint{font-family:var(--font);font-size:var(--text-xs);color:var(--text-muted);margin-top:8px}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border:none;border-radius:var(--radius);font-family:var(--font);font-size:var(--text-sm);font-weight:800;font-variation-settings:'wght' 800;text-transform:uppercase;letter-spacing:.03em;cursor:pointer;transition:all .15s;min-height:42px}
  .btn--primary{background:var(--primary);color:var(--white)}
  .btn--primary:hover{filter:brightness(1.08)}
  .btn--ghost{background:var(--white);color:var(--navy);border:2px solid var(--border)}
  .btn--ghost:hover{border-color:var(--navy)}
  .btn--loading{pointer-events:none;opacity:.7}
  .btn--loading::after{content:'';display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.35);border-top-color:var(--white);border-radius:50%;animation:mmSpin .6s linear infinite}
  @keyframes mmSpin{to{transform:rotate(360deg)}}

  .mm__warn{margin-top:10px;padding:8px 12px;border-radius:var(--radius);background:var(--amber);background:color-mix(in srgb,var(--amber) 12%,var(--white));border:1px solid var(--amber);color:var(--amber);font-family:var(--font);font-size:var(--text-xs);font-weight:600}

  /* Results grid: map + side panel */
  .mm__grid{display:grid;grid-template-columns:1fr 380px;gap:16px;align-items:start}
  .mm__grid.mm__grid--nopanel{grid-template-columns:1fr}
  .mm__map-wrap{position:relative;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);background:var(--off-white)}
  #mmMap{width:100%;height:min(72vh,780px);min-height:440px}
  .mm__map-badge{position:absolute;top:12px;left:12px;background:var(--navy);color:var(--white);font-family:var(--font);padding:8px 14px;border-radius:var(--radius);box-shadow:var(--shadow);z-index:5;max-width:70%}
  .mm__map-badge .mb-title{font-size:var(--text-sm);font-weight:800;font-variation-settings:'wght' 800;line-height:1.2}
  .mm__map-badge .mb-meta{font-size:var(--text-xs);opacity:.85;margin-top:2px}

  .mm__panel{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;max-height:min(72vh,780px)}
  .mm__panel-head{padding:12px 14px;background:var(--navy);color:var(--white);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .mm__panel-head .ph-t{font-family:var(--font);font-size:var(--text-xs);font-weight:800;font-variation-settings:'wght' 800;text-transform:uppercase;letter-spacing:.05em}
  .mm__panel-head .ph-tot{font-family:var(--font);font-size:var(--text-sm);font-weight:800;font-variation-settings:'wght' 800}
  .mm__panel-scroll{overflow-y:auto;-webkit-overflow-scrolling:touch}

  .mm__leg{display:flex;gap:10px;padding:11px 14px;border-bottom:1px solid var(--border);align-items:flex-start;cursor:pointer;transition:background .12s}
  .mm__leg:last-child{border-bottom:none}
  .mm__leg:hover{background:var(--off-white)}
  .mm__leg.active{background:#eef1f7}
  .mm__leg--err{cursor:default}
  .mm__leg--err:hover{background:none}
  .mm__leg-sw{width:6px;align-self:stretch;border-radius:3px;flex-shrink:0;transition:width .12s}
  .mm__leg.active .mm__leg-sw{width:9px}
  .mm__leg-body{flex:1;min-width:0}
  .mm__leg-teams{font-family:var(--font);font-size:var(--text-sm);font-weight:700;font-variation-settings:'wght' 700;color:var(--text);line-height:1.25;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .mm__leg-teams img{width:20px;height:20px;object-fit:contain;flex-shrink:0}
  .mm__leg-teams .arw{color:var(--text-muted);font-weight:400}
  .mm__leg-meta{font-family:var(--font);font-size:var(--text-xs);color:var(--text-muted);margin-top:3px;font-weight:600}
  .mm__leg-roads{display:flex;flex-wrap:wrap;gap:3px;margin-top:5px}
  .mm__road-badge{display:inline-block;padding:1px 6px;border-radius:3px;font-family:var(--font);font-size:10px;font-weight:800;font-variation-settings:'wght' 800;letter-spacing:.02em;line-height:1.4}
  .mm__road-badge--m{background:#0b5c2f;color:var(--white)}
  .mm__road-badge--a{background:#e8d21e;color:#111}
  .mm__road-badge--b{background:var(--white);color:var(--text);border:1px solid var(--border)}
  .mm__leg--err .mm__leg-teams{color:var(--red)}
  .mm__leg-err{font-family:var(--font);font-size:var(--text-xs);color:var(--red);margin-top:3px;font-weight:600}

  .mm__loading{text-align:center;padding:48px 20px;color:var(--text-muted);font-family:var(--font);font-size:var(--text-sm)}
  .mm__spinner{width:30px;height:30px;border:3px solid var(--border);border-top-color:var(--navy);border-radius:50%;animation:mmSpin .8s linear infinite;margin:0 auto 12px}
  .mm__footer{text-align:center;padding:18px;font-family:var(--font);font-size:var(--text-xs);color:var(--text-muted)}

  @media(max-width:900px){.mm__grid{grid-template-columns:1fr}.mm__panel{max-height:none}#mmMap{height:56vh}}
</style>

<body>
<div class="mm">

  <div class="mm__head">
    <div>
      <h1 class="mm__title">Matchday Travel Map</h1>
      <p class="mm__sub">Paste a matchday's fixtures — draws every away side's road route to the home ground.</p>
    </div>
  </div>

  <div class="mm__input-panel">
    <label class="mm__label" for="mmInput">Fixtures &mdash; one per line, <strong>Home&nbsp;&nbsp;&nbsp;Away</strong> (tab, spaces or "v" separated)</label>
    <textarea id="mmInput" class="mm__textarea" spellcheck="false" placeholder="Aldershot Town		Woking
Barrow		AFC Fylde
Boreham Wood		Wealdstone"></textarea>
    <div class="mm__row">
      <input type="text" id="mmDate" class="mm__date" placeholder="Matchday label (e.g. Sat 15 Aug)" style="flex:1;min-width:180px">
      <button class="btn btn--primary" id="mmDrawBtn" onclick="draw()">Draw routes</button>
      <button class="btn btn--ghost" id="mmPanelBtn" onclick="togglePanel()" style="display:none">Hide list</button>
    </div>
    <div class="mm__hint">Away side (right-hand club) travels to the home side's ground. Ground-to-ground by road. Click any fixture to highlight its route.</div>
    <div id="mmWarn"></div>
  </div>

  <div id="mmResults"></div>

  <div class="mm__footer">Powered by Google Maps Platform &amp; National League Services</div>
</div>

<script>
// ── Data sources (same public endpoints the Travel Planner uses) ──
var GK='AIzaSyA1qH6K4vtUW8YbMKetK16q2GQaZ2EDXRs';
var RU='https://routes.googleapis.com/directions/v2:computeRoutes';
var CMU='https://raw.githubusercontent.com/thenationalleague/tools/refs/heads/main/assets/data/clubs-meta.json';
var CB='https://raw.githubusercontent.com/thenationalleague/tools/refs/heads/main/assets/crests/';
var FC=CB+'National%20League%20rose.png';
var DFM='routes.duration,routes.distanceMeters,routes.polyline.encodedPolyline,routes.legs.steps.navigationInstruction';

// Route colour palette — brand --proj-1..8 cycled (distinct hues so overlapping
// journeys stay readable at a dozen routes).
var PALETTE=['#223b7c','#9e0000','#1a7030','#c96f15','#6a1b9a','#1565c0','#1a2f63','#374151'];

var clubs=[],mapOK=false,gMap=null,panelHidden=false,lastLegs=null,lastLabel='';
var routeObjs=[],selectedIdx=null,flowRAF=null,flowPhase=0;

// ── Boot ──
async function boot(){
  try{
    await google.maps.importLibrary('maps');
    await google.maps.importLibrary('geometry');
    await google.maps.importLibrary('marker');
    mapOK=true;
  }catch(e){mapOK=false;}
  try{
    var r=await fetch(CMU);var d=await r.json();
    clubs=(d.clubs||[]).map(function(c){
      return{
        name:c.name||'',
        short:c.short||'',
        code:c.code||'',
        postcode:(c.address&&typeof c.address==='object'?c.address.postcode:c.postcode)||'',
        stadium:c.stadium||''
      };
    });
  }catch(e){clubs=[];}
}
boot();

// ── Club matching ──
function norm(s){return(s||'').toLowerCase().replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim();}
function matchClub(raw){
  var q=norm(raw);
  if(!q)return null;
  // exact name / short / code
  var c=clubs.find(function(x){return norm(x.name)===q});
  if(c)return c;
  c=clubs.find(function(x){return norm(x.short)===q||x.code.toLowerCase()===q});
  if(c)return c;
  // contains (either direction), pick longest overlap to avoid "united" clashes
  var cand=clubs.filter(function(x){var n=norm(x.name);return n.indexOf(q)!==-1||q.indexOf(n)!==-1;});
  if(cand.length===1)return cand[0];
  if(cand.length>1){
    cand.sort(function(a,b){return Math.abs(norm(a.name).length-q.length)-Math.abs(norm(b.name).length-q.length)});
    return cand[0];
  }
  return null;
}

// ── Parse the pasted block ──
function parseFixtures(text){
  var out=[];
  text.split(/\r?\n/).forEach(function(line){
    var t=line.trim();
    if(!t)return;
    var home='',away='';
    // Prefer explicit " v " / " vs " separator
    var vm=t.match(/^(.*?)\s+(?:v|vs|V|VS)\s+(.*)$/);
    if(vm){home=vm[1];away=vm[2];}
    else{
      // Split on tabs or runs of 2+ spaces; first token = home, last = away
      var parts=t.split(/\t+|\s{2,}/).map(function(s){return s.trim();}).filter(Boolean);
      if(parts.length>=2){home=parts[0];away=parts[parts.length-1];}
    }
    out.push({raw:t,homeRaw:home,awayRaw:away,home:matchClub(home),away:matchClub(away)});
  });
  return out;
}

// ── Address helper (postcode geocodes cleanly, same as planner) ──
function addr(c){return c.postcode?c.postcode+', UK':(c.stadium||c.short||c.name)+', UK';}
function cU(n){return CB+encodeURIComponent(n)+'.png';}

// ── Formatting ──
function fmtMiles(m){if(m==null)return'';return Math.round(m/1609.34)+' mi';}
function fmtDur(s){if(!s)return'';var sec=parseInt(String(s).replace('s',''),10);if(isNaN(sec))return'';var h=Math.floor(sec/3600),mn=Math.round((sec%3600)/60);return h?h+'h '+(mn<10?'0':'')+mn+'m':mn+'m';}

// ── Road extraction (M/A/B, in route order) — from the Travel Planner ──
function extractRoads(route){
  if(!route.legs||!route.legs[0]||!route.legs[0].steps)return[];
  var seen={},roads=[];
  route.legs[0].steps.forEach(function(s){
    if(s.navigationInstruction&&s.navigationInstruction.instructions){
      var matches=s.navigationInstruction.instructions.match(/[MAB]\d+(?:\(M\))?/g);
      if(matches)matches.forEach(function(rd){
        if(!seen[rd]){seen[rd]=true;
          var type='b';
          if(/^M\d/.test(rd)||/\(M\)/.test(rd))type='m';
          else if(/^A\d/.test(rd))type='a';
          roads.push({name:rd,type:type});
        }
      });
    }
  });
  return roads.slice(0,6);
}
function roadBadges(roads){
  if(!roads.length)return'';
  return'<div class="mm__leg-roads">'+roads.map(function(r){return'<span class="mm__road-badge mm__road-badge--'+r.type+'">'+r.name+'</span>';}).join('')+'</div>';
}

// ── Fetch one driving route (away ground → home ground) ──
async function routeFor(away,home){
  var body={origin:{address:addr(away)},destination:{address:addr(home)},travelMode:'DRIVE',routingPreference:'TRAFFIC_UNAWARE',computeAlternativeRoutes:false,languageCode:'en-GB',units:'IMPERIAL'};
  var r=await fetch(RU,{method:'POST',headers:{'Content-Type':'application/json','X-Goog-Api-Key':GK,'X-Goog-FieldMask':DFM},body:JSON.stringify(body)});
  if(!r.ok){var e=await r.json().catch(function(){return{};});throw new Error((e.error&&e.error.message)||('API '+r.status));}
  var d=await r.json();
  if(!d.routes||!d.routes.length)throw new Error('No route');
  return d.routes[0];
}

// ── Main draw ──
async function draw(){
  var btn=document.getElementById('mmDrawBtn');
  var warn=document.getElementById('mmWarn');
  warn.innerHTML='';
  var fixtures=parseFixtures(document.getElementById('mmInput').value);
  if(!fixtures.length){warn.innerHTML='<div class="mm__warn">Paste at least one fixture.</div>';return;}
  if(!clubs.length){warn.innerHTML='<div class="mm__warn">Club data still loading — try again in a moment.</div>';return;}

  // Report unmatched
  var bad=fixtures.filter(function(f){return !f.home||!f.away;});
  if(bad.length){
    warn.innerHTML='<div class="mm__warn">Couldn’t match '+bad.length+' line(s): '+
      bad.map(function(f){var m=[];if(!f.home)m.push('home "'+esc(f.homeRaw)+'"');if(!f.away)m.push('away "'+esc(f.awayRaw)+'"');return m.join(' &amp; ');}).join('; ')+
      '. They’ll be skipped.</div>';
  }
  var valid=fixtures.filter(function(f){return f.home&&f.away;});
  if(!valid.length){warn.innerHTML+='<div class="mm__warn">No matchable fixtures to draw.</div>';return;}

  lastLabel=document.getElementById('mmDate').value.trim();
  btn.classList.add('btn--loading');
  document.getElementById('mmResults').innerHTML='<div class="mm__loading"><div class="mm__spinner"></div>Plotting '+valid.length+' route'+(valid.length>1?'s':'')+'…</div>';

  // Fetch all routes in parallel
  var legs=await Promise.all(valid.map(async function(f,i){
    var colour=PALETTE[i%PALETTE.length];
    try{
      var route=await routeFor(f.away,f.home);
      return{f:f,colour:colour,route:route,miles:route.distanceMeters,dur:route.duration,roads:extractRoads(route),err:null};
    }catch(e){
      return{f:f,colour:colour,route:null,err:e.message||'failed'};
    }
  }));

  lastLegs=legs;
  btn.classList.remove('btn--loading');
  render(legs);
}

// ── Render map + side panel ──
function render(legs){
  var ok=legs.filter(function(l){return l.route;});
  var totalMiles=ok.reduce(function(a,l){return a+(l.miles||0);},0);

  var h='<div class="mm__grid'+(panelHidden?' mm__grid--nopanel':'')+'" id="mmGrid">';
  h+='<div class="mm__map-wrap">';
  if(lastLabel)h+='<div class="mm__map-badge"><div class="mb-title">'+esc(lastLabel)+'</div><div class="mb-meta">'+ok.length+' fixtures · '+Math.round(totalMiles/1609.34).toLocaleString()+' away miles</div></div>';
  h+='<div id="mmMap"></div></div>';

  if(!panelHidden){
    h+='<div class="mm__panel"><div class="mm__panel-head"><span class="ph-t">Away journeys</span><span class="ph-tot">'+Math.round(totalMiles/1609.34).toLocaleString()+' mi</span></div><div class="mm__panel-scroll">';
    legs.forEach(function(l,idx){
      var f=l.f;
      h+='<div class="mm__leg'+(l.err?' mm__leg--err':'')+'" data-idx="'+idx+'"'+(l.route?' onclick="selectRoute('+idx+')"':'')+'>';
      h+='<div class="mm__leg-sw" style="background:'+l.colour+'"></div>';
      h+='<div class="mm__leg-body">';
      h+='<div class="mm__leg-teams"><img src="'+cU(f.away.name)+'" onerror="this.onerror=null;this.src=\''+FC+'\'"><span>'+esc(f.away.short||f.away.name)+'</span><span class="arw">→</span><img src="'+cU(f.home.name)+'" onerror="this.onerror=null;this.src=\''+FC+'\'"><span>'+esc(f.home.short||f.home.name)+'</span></div>';
      if(l.err){h+='<div class="mm__leg-err">Route unavailable ('+esc(l.err)+')</div>';}
      else{
        h+='<div class="mm__leg-meta">'+fmtMiles(l.miles)+' · '+fmtDur(l.dur)+'</div>';
        h+=roadBadges(l.roads);
      }
      h+='</div></div>';
    });
    h+='</div></div>';
  }
  h+='</div>';
  document.getElementById('mmResults').innerHTML=h;
  document.getElementById('mmPanelBtn').style.display='inline-flex';
  document.getElementById('mmPanelBtn').textContent=panelHidden?'Show list':'Hide list';
  drawMap(legs);
  document.getElementById('mmResults').scrollIntoView({behavior:'smooth',block:'start'});
}

// ── Draw the routes on the map (planner's drive style) ──
// Deliberately flat basemap: land + roads reduced to near-uniform pale grey,
// no road/motorway emphasis or labels, so the coloured route lines are the
// only thing with weight. Faint town labels kept for geographic orientation.
var DRIVE_STYLE=[
  {elementType:"geometry",stylers:[{color:"#f2f4f7"}]},
  {elementType:"labels.icon",stylers:[{visibility:"off"}]},
  {elementType:"labels.text.stroke",stylers:[{color:"#f2f4f7"},{weight:2}]},
  {elementType:"labels.text.fill",stylers:[{color:"#aab0c0"}]},
  {featureType:"administrative",elementType:"geometry",stylers:[{visibility:"off"}]},
  {featureType:"administrative.land_parcel",stylers:[{visibility:"off"}]},
  {featureType:"administrative.neighborhood",stylers:[{visibility:"off"}]},
  {featureType:"administrative.province",elementType:"labels",stylers:[{visibility:"off"}]},
  {featureType:"administrative.locality",elementType:"labels.text.fill",stylers:[{color:"#9098a8"}]},
  {featureType:"poi",stylers:[{visibility:"off"}]},
  {featureType:"road",elementType:"geometry",stylers:[{color:"#e7ebf1"}]},
  {featureType:"road",elementType:"labels",stylers:[{visibility:"off"}]},
  {featureType:"road.highway",elementType:"geometry",stylers:[{color:"#dfe4ec"}]},
  {featureType:"road.arterial",elementType:"geometry",stylers:[{color:"#e7ebf1"}]},
  {featureType:"road.local",elementType:"geometry",stylers:[{color:"#eef1f5"}]},
  {featureType:"transit",stylers:[{visibility:"off"}]},
  {featureType:"water",elementType:"geometry.fill",stylers:[{color:"#dce3ec"}]},
  {featureType:"water",elementType:"labels",stylers:[{visibility:"off"}]},
  {featureType:"landscape.man_made",stylers:[{visibility:"off"}]}
];

function crestMarker(pos,name,z){
  return new google.maps.Marker({
    position:pos,map:gMap,zIndex:z,
    icon:{url:cU(name),scaledSize:new google.maps.Size(26,26),anchor:new google.maps.Point(13,13)},
    title:name
  });
}

// Pulse dots that physically travel along each route (via Marker.setPosition)
// toward the home ground. This replaces the earlier polyline-symbol animation,
// which stopped repainting on some devices once a route was highlighted. Moving
// a real marker's position repaints reliably everywhere.
var NDOTS=4;             // dots per route (a short "train" that reads as flow)
var FLOW_SPEED=0.0035;   // fraction of route length advanced per frame

// High-contrast pulse dot: white fill + solid navy ring so it reads clearly on
// any coloured route line and against the pale basemap.
function pulseDot(scale){
  return new google.maps.Marker({
    map:gMap,zIndex:20,clickable:false,optimized:false,
    icon:{path:google.maps.SymbolPath.CIRCLE,scale:scale,fillColor:'#ffffff',fillOpacity:1,strokeColor:'#223b7c',strokeOpacity:1,strokeWeight:2}
  });
}

// Cumulative distance along the path so we can map a 0..1 fraction to a LatLng.
function measurePath(path){
  var cum=[0];
  for(var i=1;i<path.length;i++){
    cum[i]=cum[i-1]+google.maps.geometry.spherical.computeDistanceBetween(path[i-1],path[i]);
  }
  return cum;
}
// Position at fraction f (0=away ground, 1=home ground) along route o.
function posAt(o,f){
  if(!o.total)return o.path[0];
  var target=f*o.total,cum=o.cum,i=1;
  while(i<cum.length&&cum[i]<target)i++;
  if(i>=o.path.length)return o.path[o.path.length-1];
  var seg=cum[i]-cum[i-1],fr=seg>0?(target-cum[i-1])/seg:0;
  return google.maps.geometry.spherical.interpolate(o.path[i-1],o.path[i],fr);
}

function drawMap(legs){
  var el=document.getElementById('mmMap');
  if(!el||!mapOK){if(el)el.innerHTML='<div class="mm__loading">Map failed to load.</div>';return;}
  if(flowRAF){cancelAnimationFrame(flowRAF);flowRAF=null;}
  routeObjs=[];selectedIdx=null;flowPhase=0;
  gMap=new google.maps.Map(el,{zoom:6,center:{lat:53.2,lng:-1.8},disableDefaultUI:true,zoomControl:true,styles:DRIVE_STYLE});
  var bounds=new google.maps.LatLngBounds();

  legs.forEach(function(l,idx){
    if(!l.route||!l.route.polyline||!l.route.polyline.encodedPolyline)return;
    try{
      var path=google.maps.geometry.encoding.decodePath(l.route.polyline.encodedPolyline);
      // white halo under each line for separation
      var halo=new google.maps.Polyline({path:path,strokeColor:'#ffffff',strokeWeight:7,strokeOpacity:.7,map:gMap,zIndex:1});
      var base=new google.maps.Polyline({path:path,strokeColor:l.colour,strokeWeight:4,strokeOpacity:.95,map:gMap,zIndex:2});
      path.forEach(function(pt){bounds.extend(pt);});
      var away=crestMarker(path[0],l.f.away.name,5);
      var home=crestMarker(path[path.length-1],l.f.home.name,6);
      var cum=measurePath(path);
      var dots=[];for(var d=0;d<NDOTS;d++)dots.push(pulseDot(4.5));
      var o={idx:idx,colour:l.colour,halo:halo,base:base,away:away,home:home,path:path,cum:cum,total:cum[cum.length-1],dots:dots,hidden:false};
      // Position dots immediately so they're visible before the first frame.
      for(var k=0;k<dots.length;k++)dots[k].setPosition(posAt(o,k/dots.length));
      routeObjs.push(o);
      base.addListener('click',function(){selectRoute(idx);});
    }catch(e){}
  });

  if(!bounds.isEmpty())gMap.fitBounds(bounds,{top:60,right:40,bottom:40,left:40});
  gMap.addListener('click',function(){if(selectedIdx!==null){selectedIdx=null;applyHighlight();}});

  applyHighlight();
  flowTick();
}

// Advance every visible route's pulse dots one step along the path each frame.
function flowTick(){
  flowPhase=(flowPhase+FLOW_SPEED)%1;
  routeObjs.forEach(function(o){
    if(o.hidden)return;
    for(var k=0;k<o.dots.length;k++){
      var f=(flowPhase+k/o.dots.length)%1;
      o.dots[k].setPosition(posAt(o,f));
    }
  });
  flowRAF=requestAnimationFrame(flowTick);
}

// Click a fixture (panel or map) to highlight its route; click again / the map
// background to clear. Dims every other route so the chosen journey stands out.
function selectRoute(idx){
  selectedIdx=(selectedIdx===idx)?null:idx;
  applyHighlight();
  if(selectedIdx!==null){
    var el=document.querySelector('.mm__leg[data-idx="'+selectedIdx+'"]');
    if(el)el.scrollIntoView({block:'nearest',behavior:'smooth'});
  }
}

function applyHighlight(){
  routeObjs.forEach(function(o){
    var sel=selectedIdx===o.idx;
    var dim=selectedIdx!==null&&!sel;
    o.base.setOptions({strokeWeight:sel?5:(dim?3:4),strokeOpacity:dim?.2:.98,zIndex:sel?50:2});
    o.halo.setOptions({strokeWeight:sel?9:7,strokeOpacity:dim?.15:.7,zIndex:sel?49:1});
    // With nothing selected, every route's dots flow. Once a fixture is
    // highlighted, only the selected route's dots stay visible + moving; dimmed
    // routes hide their dots (and are skipped by flowTick). Dots sit above the
    // line (zIndex) and grow on the selected route so the motion is obvious.
    o.hidden=dim;
    o.dots.forEach(function(m){
      m.setVisible(!dim);
      m.setZIndex(sel?60:20);
      var ic=m.getIcon();ic.scale=sel?6:4.5;m.setIcon(ic);
    });
    if(o.away)o.away.setOpacity(dim?.3:1);
    if(o.home)o.home.setOpacity(dim?.35:1);
    if(o.away)o.away.setZIndex(sel?52:5);
    if(o.home)o.home.setZIndex(sel?53:6);
  });
  document.querySelectorAll('.mm__leg').forEach(function(el){
    var i=+el.getAttribute('data-idx');
    el.classList.toggle('active',selectedIdx!==null&&i===selectedIdx);
  });
}

function togglePanel(){
  panelHidden=!panelHidden;
  if(lastLegs)render(lastLegs);
}

// ── util ──
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

// Ctrl/Cmd+Enter to draw
document.getElementById('mmInput').addEventListener('keydown',function(e){
  if((e.metaKey||e.ctrlKey)&&e.key==='Enter')draw();
});
</script>
