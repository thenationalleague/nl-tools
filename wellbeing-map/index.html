          '<label>Buttons in this block — ' + outs.length + '</label>' +
          (outs.length ? '<div class="wm-btns">' + outs.map(function (e, i) {
            return '<div class="wm-btnrow">' +
              '<button type="button" class="wm-btnrow__t" data-pick="' + esc(eKey(e)) + '">' +
                '<span class="wm-row__d wm-row__d--' + esc(byId(e.to).kind) + '"></span>' +
                '<span>' + esc(e.label || byId(e.to).label) + '</span>' +
              '</button>' +
              '<button type="button" class="wm-mini" data-up="' + esc(eKey(e)) + '"' +
                (i === 0 ? ' disabled' : '') + ' title="Move up" aria-label="Move up">&uarr;</button>' +
              '<button type="button" class="wm-mini" data-down="' + esc(eKey(e)) + '"' +
                (i === outs.length - 1 ? ' disabled' : '') + ' title="Move down" aria-label="Move down">&darr;</button>' +
              '<button type="button" class="wm-mini wm-mini--x" data-drop="' + esc(eKey(e)) + '"' +
                ' title="Remove this button" aria-label="Remove this button">&times;</button>' +
              '</div>';
          }).join('') + '</div>'
            : '<p class="wm-hint">No buttons yet.</p>') +
        '</div>' +

        '<div class="wm-f">' +
          '<label for="nAddBtn">Add a button</label>' +
          (spare.length
            ? '<select id="nAddBtn">' +
                '<option value="">Choose a page…</option>' +
                spare.map(function (o) {
                  return '<option value="' + esc(o.id) + '">' + esc(o.label) + '</option>';
                }).join('') + '</select>' +
              '<p class="wm-hint" style="margin-top:6px">Not listed? Add the page first with ' +
              '<b>+ Add a page</b>, then come back.</p>'
            : '<p class="wm-hint">Every page is already in this block.</p>') +
        '</div>' +

        /* The other half of the relationship. A block's buttons say where it
           leads; this says which pages carry it, which is the thing that was
           impossible to see or change before. */
        '<div class="wm-f">' +
          '<label>On which pages — ' + carriers.length + ' of ' + pages.length + '</label>' +
          (pages.length
            ? '<div class="wm-outs">' +
                '<button class="wm-mini wm-mini--w" type="button" id="nAllPages">' +
                  'On every page</button>' +
                '<button class="wm-mini wm-mini--w" type="button" id="nNoPages">' +
                  'Off every page</button>' +
              '</div>' +
              '<div class="wm-checks">' + pages.map(function (o) {
                return '<label class="wm-check"><input type="checkbox" data-carry="' +
                  esc(o.id) + '"' + (o.shows.indexOf(n.id) > -1 ? ' checked' : '') +
                  '><span>' + esc(o.label) + '</span></label>';
              }).join('') + '</div>'
            : '<p class="wm-hint">No pages yet.</p>') +
        '</div>' +

        '<div class="wm-f">' +
          '<label>What this block is</label>' +
          '<div id="rtMount"></div>' +
        '</div>' +

        '<div class="wm-f">' +
          '<label class="wm-check"><input type="checkbox" id="nBlock" checked>' +
          '<span>Treat this as a shared block. Untick it to turn it into an ordinary ' +
          'page you can point arrows at.</span></label>' +
        '</div>' +

        '<button class="wm-danger" id="nDel" type="button">Delete this block</button>';

      document.getElementById('nLab').addEventListener('input', function () {
        n.label = this.value; renderNodes(); save();
      });
      Array.prototype.forEach.call(el.side.querySelectorAll('[data-pick]'), function (b) {
        b.addEventListener('click', function () {
          select({ type: 'edge', id: b.getAttribute('data-pick') });
        });
      });
      Array.prototype.forEach.call(el.side.querySelectorAll('[data-up],[data-down]'), function (b) {
        b.addEventListener('click', function () {
          moveButton(b.getAttribute('data-up') || b.getAttribute('data-down'),
            b.hasAttribute('data-up') ? -1 : 1);
        });
      });
      Array.prototype.forEach.call(el.side.querySelectorAll('[data-drop]'), function (b) {
        b.addEventListener('click', function () {
          var k = b.getAttribute('data-drop');
          S.edges = S.edges.filter(function (x) { return eKey(x) !== k; });
          render(); save();
        });
      });
      var add = document.getElementById('nAddBtn');
      if (add) add.addEventListener('change', function () {
        if (!this.value) return;
        connect(n.id, this.value);
        S.sel = { type: 'node', id: n.id };
        render(); save();
        window.NL.toast('Button added', 'success');
      });
      Array.prototype.forEach.call(el.side.querySelectorAll('[data-carry]'), function (b) {
        b.addEventListener('change', function () {
          var page = byId(b.getAttribute('data-carry'));
          if (!page) return;
          var at = page.shows.indexOf(n.id);
          if (this.checked && at === -1) page.shows.push(n.id);
          if (!this.checked && at > -1) page.shows.splice(at, 1);
          render(); save();
        });
      });
      var allP = document.getElementById('nAllPages');
      if (allP) allP.addEventListener('click', function () {
        pages.forEach(function (o) {
          if (o.shows.indexOf(n.id) === -1) o.shows.push(n.id);
        });
        render(); save();
        window.NL.toast('On every page', 'success');
      });
      var noP = document.getElementById('nNoPages');
      if (noP) noP.addEventListener('click', function () {
        pages.forEach(function (o) {
          var at = o.shows.indexOf(n.id);
          if (at > -1) o.shows.splice(at, 1);
        });
        render(); save();
        window.NL.toast('Taken off every page', 'success');
      });
      document.getElementById('nBlock').addEventListener('change', function () {
        n.locked = false; n._h = 0; render(); save();
        window.NL.toast('Now an ordinary page', 'success');
      });
      document.getElementById('nDel').addEventListener('click', function () { removeNode(n.id); });

      rt = window.NL.richText(document.getElementById('rtMount'), {
        value: n.body, compact: true,
        placeholder: 'What this block is, and where it sits…',
        onChange: function (clean) { n.body = clean; save(); }
      });
      return;
    }

    el.side.innerHTML =
      '<h2>Page</h2>' +
      '<p class="wm-hint">' + (n.hash
        ? 'Live now at <a class="wm-live" href="/wellbeing/' + esc(n.hash) +
          '" target="_blank" rel="noopener">/wellbeing/' + esc(n.hash) + '</a>'
        : 'A new page. It does not exist on the live site yet.') + '</p>' +

      '<div class="wm-f">' +
        '<label for="nLab">Name on the box</label>' +
        '<input type="text" id="nLab" value="' + esc(n.label) + '">' +
      '</div>' +

      '<div class="wm-f">' +
        '<label for="nTitle">Heading on the page</label>' +
        '<input type="text" id="nTitle" value="' + esc(n.title) + '">' +
      '</div>' +

      '<div class="wm-f">' +
        '<label for="nKicker">Small label above the heading</label>' +
        '<input type="text" id="nKicker" value="' + esc(n.kicker) + '" placeholder="e.g. Topic">' +
      '</div>' +

      '<div class="wm-f">' +
        '<label for="nKind">How urgent is this page</label>' +
        '<select id="nKind">' + KIND_ORDER.filter(function (k) { return k !== 'shared'; })
          .map(function (k) {
            return '<option value="' + k + '"' + (n.kind === k ? ' selected' : '') + '>' +
              esc(KIND_OPTION[k] || KIND_LABEL[k]) + '</option>';
          }).join('') + '</select>' +
      '</div>' +

      '<div class="wm-f">' +
        '<label for="nZone">Which band</label>' +
        '<select id="nZone">' + S.zones.map(function (z) {
          return '<option value="' + esc(z.id) + '"' + (n.zone === z.id ? ' selected' : '') + '>' +
            esc(z.label) + '</option>';
        }).join('') + '</select>' +
      '</div>' +

      /* Where it goes sits above the words. Structure is what these two are
         here to argue about; the copy is long, and scrolling past it to find
         the connections buried the point. */
      /* Both directions, both clickable. Arrows out of a block are not drawn on
         the canvas until something is focused, so before this the only way to
         reach one was to catch it mid-hover — and an arrow pointing IN could not
         be reached at all. Selecting the box now holds its arrows on the canvas
         AND lists every one of them here. */
      '<div class="wm-f">' +
        '<label>Goes to</label>' +
        (outs.length
          ? '<div class="wm-btns">' + outs.map(function (e) {
              return arrowRow(e, byId(e.to), 'to');
            }).join('') + '</div>'
          : '<p class="wm-hint">Nowhere yet. Drag from the circle on the box.</p>') +
      '</div>' +

      '<div class="wm-f">' +
        '<label>Arrives from</label>' +
        (inn.length
          ? '<div class="wm-btns">' + inn.map(function (e) {
              return arrowRow(e, byId(e.from), 'from');
            }).join('') + '</div>'
          : '<p class="wm-hint">Nothing points here</p>') +
      '</div>' +

      '<p class="wm-hint" style="margin-top:-6px">Click one to change its wording, ' +
        '&times; to remove it. They stay drawn on the canvas while this box is ' +
        'selected.</p>' +

      '<div class="wm-f">' +
        '<label>Blocks on this page</label>' +
        (blocks.length ? blocks.map(function (b) {
          return '<label class="wm-check"><input type="checkbox" data-shows="' +
            esc(b.id) + '"' + (n.shows.indexOf(b.id) > -1 ? ' checked' : '') +
            '><span>' + esc(b.label) + '</span></label>';
        }).join('')
          : '<p class="wm-hint">There are no blocks in this map yet. Press ' +
            '<b>+ Add a block</b> to make one.</p>') +
      '</div>' +

      '<div class="wm-f">' +
        '<label>The words on this page</label>' +
        '<div id="rtMount"></div>' +
      '</div>' +

      /* Blue-sky work needs to be able to say "what if this were the menu" —
         and to take the header or footer out entirely. Nothing here is fixed. */
      '<div class="wm-f">' +
        '<label class="wm-check"><input type="checkbox" id="nBlock">' +
        '<span>Treat this as a shared block — one component on every page, ' +
        'drawn with its buttons listed inside it.</span></label>' +
      '</div>' +

      '<button class="wm-danger" id="nDel" type="button">Delete this page</button>';

    /* Wiring. Text fields update as you type; the box on the canvas keeps up. */
    document.getElementById('nLab').addEventListener('input', function () {
      n.label = this.value; renderNodes(); renderEdges(); save();
    });
    document.getElementById('nTitle').addEventListener('input', function () {
      n.title = this.value; save();
    });
    document.getElementById('nKicker').addEventListener('input', function () {
      n.kicker = this.value; save();
    });
    document.getElementById('nKind').addEventListener('change', function () {
      n.kind = this.value; renderNodes(); renderEdges(); save();
    });
    document.getElementById('nZone').addEventListener('change', function () {
      n.zone = this.value; tidy(); render(); save();
    });
    Array.prototype.forEach.call(el.side.querySelectorAll('[data-shows]'), function (b) {
      b.addEventListener('change', function () {
        var id = b.getAttribute('data-shows');
        var at = n.shows.indexOf(id);
        if (this.checked && at === -1) n.shows.push(id);
        if (!this.checked && at > -1) n.shows.splice(at, 1);
        render(); save();
      });
    });
    Array.prototype.forEach.call(el.side.querySelectorAll('[data-pick]'), function (b) {
      b.addEventListener('click', function () {
        select({ type: 'edge', id: b.getAttribute('data-pick') });
      });
    });
    Array.prototype.forEach.call(el.side.querySelectorAll('[data-drop]'), function (b) {
      b.addEventListener('click', function () {
        var k = b.getAttribute('data-drop');
        S.edges = S.edges.filter(function (x) { return eKey(x) !== k; });
        render(); save();
        window.NL.toast('Arrow removed', 'success');
      });
    });
    document.getElementById('nBlock').addEventListener('change', function () {
      n.locked = true; n._h = 0; render(); save();
      window.NL.toast('Now a shared block', 'success');
    });
    document.getElementById('nDel').addEventListener('click', function () { removeNode(n.id); });

    rt = window.NL.richText(document.getElementById('rtMount'), {
      value: n.body,
      compact: true,
      placeholder: 'The words that go on this page…',
      onChange: function (clean) { n.body = clean; renderNodes(); save(); }
    });
  }

  /* ── Mutations ────────────────────────────────────────────────────────── */
  function freshId(base) {
    var slug = (base || 'new-page').toLowerCase().replace(/[^a-z0-9]+/g, '-')
      .replace(/^-|-$/g, '') || 'new-page';
    var id = slug, i = 2;
    while (byId(id)) { id = slug + '-' + i; i++; }
    return id;
  }

  /* First grid slot in a band that nothing already occupies. Used by the
     toolbar button, which — unlike a right-click — carries no opinion about
     where the page should go. Tidying instead would throw away any positions
     somebody had arranged by hand. */
  function freeSpot(zoneId) {
    var z = S.zones.filter(function (x) { return x.id === zoneId; })[0] || S.zones[0];
    var mine = S.nodes.filter(function (n) { return n.zone === zoneId; });
    var blockW = 0;
    mine.filter(function (n) { return n.locked; }).forEach(function (n) {
      blockW = Math.max(blockW, wOf(n));
    });
    var x0 = blockW ? X0 + blockW + GAP_X : X0;
    var clash = function (x, y) {
      return S.nodes.some(function (n) {
        return x < n.x + wOf(n) + 8 && n.x < x + NODE_W + 8 &&
               y < n.y + hOf(n) + 8 && n.y < y + NODE_H + 8;
      });
    };
    var top = (z._top || 14) + BAND_TOP;   /* bands may be unmeasured on an empty canvas */
    for (var row = 0; row < 40; row++) {
      var y = top + row * (NODE_H + GAP_Y);
      for (var x = x0; x + NODE_W <= CANVAS_W - 8; x += NODE_W + GAP_X) {
        if (!clash(x, y)) return { x: snap(x), y: snap(y) };
      }
    }
    return { x: snap(x0), y: snap(top) };
  }

  /* The blocks that every existing page shows. A new page inherits those. */
  function commonBlocks() {
    var pages = S.nodes.filter(function (n) { return !n.locked; });
    if (!pages.length) {
      return S.nodes.filter(function (n) { return n.locked; })
        .map(function (n) { return n.id; });
    }
    return S.nodes.filter(function (b) {
      return b.locked && pages.every(function (p) { return p.shows.indexOf(b.id) > -1; });
    }).map(function (b) { return b.id; });
  }

  function addBlock(cx, cy) {
    var z = zoneAt(cy);
    var b = {
      id: freshId('new-block'), zone: z.id, kind: 'shared', locked: true,
      title: 'New block', label: 'New block', hash: null, kicker: 'A shared block',
      body: '', shows: [],
      x: Math.max(8, Math.min(snap(cx - BLOCK_W / 2), CANVAS_W - BLOCK_W - 8)),
      y: Math.max(8, snap(cy - 60))
    };
    S.nodes.push(b);
    S.sel = { type: 'node', id: b.id };
    render(); save();
    var f = document.getElementById('nLab');
    if (f) { f.focus(); f.select(); }
    window.NL.toast('New block added — name it, then add its buttons', 'success');
  }

  function addNode(cx, cy) {
    var z = zoneAt(cy);
    var n = {
      id: freshId('new-page'), zone: z.id,
      kind: z.id === 'flow' ? 'everyday' : 'wayin',
      locked: false, title: 'New page', label: 'New page', hash: null, kicker: '',
      body: '',
      /* A new page starts with whatever every other page already carries, so it
         arrives dressed like its neighbours rather than bare. */
      shows: commonBlocks(),
      x: Math.max(8, Math.min(snap(cx - NODE_W / 2), CANVAS_W - NODE_W - 8)),
      y: Math.max(8, snap(cy - NODE_H / 2))
    };
    S.nodes.push(n);
    S.sel = { type: 'node', id: n.id };
    render(); save();
    var f = document.getElementById('nLab');
    if (f) { f.focus(); f.select(); }
    window.NL.toast('New page added — give it a name', 'success');
  }

  function duplicateNode(id) {
    var src = byId(id);
    if (!src) return;
    var copy = JSON.parse(JSON.stringify(src));
    copy.id = freshId(src.label + ' copy');
    copy.label = src.label + ' (copy)';
    copy.hash = null;
    copy.x = Math.min(src.x + GRID * 2, CANVAS_W - NODE_W - 8);
    copy.y = src.y + GRID * 2;
    S.nodes.push(copy);
    S.sel = { type: 'node', id: copy.id };
    render(); save();
  }

  function removeNode(id) {
    var n = byId(id);
    if (!n) return;
    var links = S.edges.filter(function (e) { return e.from === id || e.to === id; }).length;
    var detail = links
      ? links + (links === 1 ? ' arrow' : ' arrows') + ' will go with it.'
      : 'It has no arrows attached.';
    /* Shared blocks used to refuse. Blue-sky work needs to be able to take the
       header or the footer out and see what is left, and Reset puts it back. */
    if (n.locked) detail = 'This is a shared block on every page. ' + detail;

    window.NL.confirm(
      'Delete "' + n.label + '"?',
      { title: n.locked ? 'Delete shared block' : 'Delete page', detail: detail,
        confirmText: 'Delete' }
    ).then(function (ok) {
      if (!ok) return;
      S.nodes = S.nodes.filter(function (x) { return x.id !== id; });
      S.edges = S.edges.filter(function (e) { return e.from !== id && e.to !== id; });
      /* A deleted block has to come off the pages that carried it, or they keep
         a reference to something that no longer exists — invisible until the
         next load quietly dropped it. */
      S.nodes.forEach(function (x) {
        var at = x.shows.indexOf(id);
        if (at > -1) x.shows.splice(at, 1);
      });
      S.sel = null; render(); save();
      window.NL.toast('Page deleted', 'success');
    });
  }

  /* Reorder a block's buttons. Order is what somebody reads down the widget,
     so it is part of the design, not an implementation detail. Swaps with the
     neighbouring button of the SAME block, leaving other arrows alone. */
  function moveButton(key, dir) {
    var idx = -1;
    for (var i = 0; i < S.edges.length; i++) if (eKey(S.edges[i]) === key) { idx = i; break; }
    if (idx === -1) return;
    var from = S.edges[idx].from;
    var swap = -1;
    if (dir < 0) {
      for (var a = idx - 1; a >= 0; a--) if (S.edges[a].from === from) { swap = a; break; }
    } else {
      for (var b = idx + 1; b < S.edges.length; b++) if (S.edges[b].from === from) { swap = b; break; }
    }
    if (swap === -1) return;
    var tmp = S.edges[idx];
    S.edges[idx] = S.edges[swap];
    S.edges[swap] = tmp;
    render(); save();
  }

  function connect(from, to) {
    if (from === to) return;
    if (S.edges.some(function (e) { return e.from === from && e.to === to; })) {
      window.NL.toast('That arrow already exists', 'error');
      return;
    }
    var src = byId(from);
    S.edges.push({
      from: from, to: to, label: '',
      kind: src && src.locked ? 'shared' : 'editorial'
    });
    S.sel = { type: 'edge', id: from + '>' + to };
    render(); save();
  }

  /* ── Dragging a box, and dragging an arrow out of one ──────────────────── */
  var drag = null;

  function canvasPoint(ev) {
    var r = el.canvas.getBoundingClientRect();
    return { x: (ev.clientX - r.left) / zoom, y: (ev.clientY - r.top) / zoom };
  }

  el.nodes.addEventListener('pointerdown', function (ev) {
    var port = ev.target.closest('[data-port]');
    var box = ev.target.closest('.wm-node');
    if (!box) return;
    var n = byId(box.getAttribute('data-id'));
    if (!n) return;

    closeCtx();
    if (ev.target.closest('[data-row]')) return;   /* handled as an arrow click */

    if (port) {
      ev.preventDefault();
      drag = { mode: 'link', from: n.id, at: canvasPoint(ev) };
      el.nodes.setPointerCapture(ev.pointerId);
      return;
    }

    select({ type: 'node', id: n.id });

    var p = canvasPoint(ev);
    drag = { mode: 'move', id: n.id, dx: p.x - n.x, dy: p.y - n.y, moved: false };
    box.classList.add('is-drag');
    el.nodes.setPointerCapture(ev.pointerId);
  });

  el.nodes.addEventListener('pointermove', function (ev) {
    if (!drag) return;
    var p = canvasPoint(ev);

    if (drag.mode === 'move') {
      var n = byId(drag.id);
      if (!n) return;
      n.x = Math.max(8, Math.min(snap(p.x - drag.dx), CANVAS_W - NODE_W - 8));
      n.y = Math.max(8, snap(p.y - drag.dy));
      drag.moved = true;
      var box = el.nodes.querySelector('[data-id="' + cssEsc(n.id) + '"]');
      if (box) { box.style.left = n.x + 'px'; box.style.top = n.y + 'px'; }
      renderEdges();
      return;
    }

    /* Drawing a new arrow: a dashed line to the pointer, and the box under
       the pointer lights up green so it is obvious what you are about to hit. */
    drag.at = p;
    var over = document.elementFromPoint(ev.clientX, ev.clientY);
    var hit = over && over.closest ? over.closest('.wm-node') : null;
    Array.prototype.forEach.call(el.nodes.querySelectorAll('.wm-node--drop'), function (b) {
      b.classList.remove('wm-node--drop');
    });
    if (hit && hit.getAttribute('data-id') !== drag.from) hit.classList.add('wm-node--drop');
    drag.over = hit ? hit.getAttribute('data-id') : null;
    renderEdges();
    drawGhost(drag);
  });

  function drawGhost(d) {
    var a = byId(d.from);
    if (!a) return;
    var ghost = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    ghost.setAttribute('d', 'M' + (a.x + wOf(a)) + ' ' + (a.y + hOf(a)) +
      'L' + d.at.x + ' ' + d.at.y);
    ghost.setAttribute('stroke', 'var(--primary)');
    ghost.setAttribute('stroke-width', '2');
    ghost.setAttribute('stroke-dasharray', '6 4');
    el.edges.appendChild(ghost);
  }

  el.nodes.addEventListener('pointerup', function (ev) {
    if (!drag) return;
    var d = drag; drag = null;

    Array.prototype.forEach.call(el.nodes.querySelectorAll('.is-drag, .wm-node--drop'),
      function (b) { b.classList.remove('is-drag'); b.classList.remove('wm-node--drop'); });

    if (d.mode === 'link') {
      if (d.over) connect(d.from, d.over);
      else render();
      return;
    }

    if (d.moved) {
      var n = byId(d.id);
      /* Dropped in a different band? Then it belongs to that band now. */
      var z = zoneAt(n.y + hOf(n) / 2);
      if (z && z.id !== n.zone) {
        n.zone = z.id;
        window.NL.toast('Moved to "' + z.label + '"', 'success');
      }
      /* And it lands inside that band rather than on top of its heading. The
         band grows downwards to take it if it needs to. */
      if (z) n.y = Math.max(n.y, z._top + BAND_TOP);
      render(); save();
    }
    void ev;
  });

  el.nodes.addEventListener('pointercancel', function () { drag = null; render(); });

  function cssEsc(s) { return String(s).replace(/"/g, '\\"'); }

  /* Clicking an arrow selects it. The wide transparent path makes that
     possible without asking anybody to hit a two-pixel line. */
  el.edges.addEventListener('click', function (ev) {
    var hit = ev.target.getAttribute && ev.target.getAttribute('data-edge');
    if (hit) select({ type: 'edge', id: hit });
  });

  /* A row inside a shared block IS an arrow, so clicking it selects that
     arrow — same panel, same delete button. */
  el.nodes.addEventListener('click', function (ev) {
    var row = ev.target.closest ? ev.target.closest('[data-row]') : null;
    if (row) {
      ev.stopPropagation();
      select({ type: 'edge', id: row.getAttribute('data-row') });
    }
  });

  /* Hover to answer "where does this go". Rows narrow it to one destination;
     the block as a whole shows all of them at once. */
  el.nodes.addEventListener('pointerover', function (ev) {
    if (drag) return;
    var box = ev.target.closest ? ev.target.closest('.wm-node') : null;
    var row = ev.target.closest ? ev.target.closest('[data-row]') : null;
    var id = box ? box.getAttribute('data-id') : null;
    var key = row ? row.getAttribute('data-row') : null;
    if (id !== hoverId || key !== hoverEdge) {
      hoverId = id; hoverEdge = key;
      renderNodes(); renderEdges();
    }
  });

  el.nodes.addEventListener('pointerout', function (ev) {
    if (drag) return;
    if (ev.relatedTarget && ev.relatedTarget.closest &&
        ev.relatedTarget.closest('.wm-node')) return;
    if (hoverId !== null || hoverEdge !== null) {
      hoverId = null; hoverEdge = null;
      renderNodes(); renderEdges();
    }
  });

  function select(sel) {
    S.sel = sel;
    renderNodes(); renderEdges(); renderSide();
  }

  /* ── Right-click ──────────────────────────────────────────────────────── */
  function closeCtx() { el.ctx.classList.remove('is-open'); }

  /* Bound to the scroll area rather than the canvas: at anything below 100%
     the canvas does not fill the window, and a right-click in the grey beyond
     its edge fell through to the browser's own menu — which looks exactly like
     the tool being broken. The point is clamped back inside instead. */
  el.wrap.addEventListener('contextmenu', function (ev) {
    ev.preventDefault();
    var box = ev.target.closest ? ev.target.closest('.wm-node') : null;
    var p = canvasPoint(ev);
    p.x = Math.max(8, Math.min(p.x, CANVAS_W - NODE_W - 8));
    p.y = Math.max(8, Math.min(p.y, canvasH - NODE_H - 8));
    var items = [];

    if (box) {
      var n = byId(box.getAttribute('data-id'));
      select({ type: 'node', id: n.id });
      items.push({ label: 'Edit the words', fn: function () { if (rt) rt.focus(); } });
      items.push({ label: 'Make a copy', fn: function () { duplicateNode(n.id); } });
      items.push({ sep: true });
      items.push({ label: n.locked ? 'Delete this block' : 'Delete this page',
        danger: true, fn: function () { removeNode(n.id); } });
    } else {
      items.push({ label: 'Add a page here', fn: function () { addNode(p.x, p.y); } });
      items.push({ label: 'Add a block here', fn: function () { addBlock(p.x, p.y); } });
      items.push({ sep: true });
      items.push({ label: 'Tidy everything up', fn: doTidy });
    }

    el.ctx.innerHTML = items.map(function (it, i) {
      if (it.sep) return '<hr>';
      if (it.note) return '<p>' + esc(it.note) + '</p>';
      return '<button type="button" data-i="' + i + '"' +
        (it.danger ? ' class="is-danger"' : '') + '>' + esc(it.label) + '</button>';
    }).join('');

    Array.prototype.forEach.call(el.ctx.querySelectorAll('button'), function (b) {
      b.addEventListener('click', function () {
        closeCtx();
        var it = items[Number(b.getAttribute('data-i'))];
        if (it && it.fn) it.fn();
      });
    });

    /* Keep the menu on screen. */
    el.ctx.classList.add('is-open');
    var w = el.ctx.offsetWidth, h = el.ctx.offsetHeight;
    el.ctx.style.left = Math.min(ev.clientX, window.innerWidth - w - 8) + 'px';
    el.ctx.style.top = Math.min(ev.clientY, window.innerHeight - h - 8) + 'px';
  });

  document.addEventListener('pointerdown', function (ev) {
    if (!el.ctx.contains(ev.target)) closeCtx();
  });

  el.wrap.addEventListener('pointerdown', function (ev) {
    if (ev.target === el.wrap || ev.target === el.canvas || ev.target === el.stage ||
        (ev.target.classList && ev.target.classList.contains('wm-band'))) {
      select(null);
    }
  });

  /* ── Keyboard ─────────────────────────────────────────────────────────── */
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape') { closeCtx(); return; }

    var typing = /^(INPUT|SELECT|TEXTAREA)$/.test(ev.target.tagName) ||
      ev.target.isContentEditable;
    if (typing || !S.sel) return;

    if (ev.key === 'Delete' || ev.key === 'Backspace') {
      ev.preventDefault();
      if (S.sel.type === 'node') removeNode(S.sel.id);
      else {
        S.edges = S.edges.filter(function (x) { return eKey(x) !== S.sel.id; });
        S.sel = null; render(); save();
      }
      return;
    }

    if (S.sel.type === 'node' && ev.key.indexOf('Arrow') === 0) {
      var n = byId(S.sel.id);
      if (!n || n.locked) return;
      ev.preventDefault();
      var step = ev.shiftKey ? GRID * 4 : GRID;
      if (ev.key === 'ArrowLeft') n.x = Math.max(8, n.x - step);
      if (ev.key === 'ArrowRight') n.x = Math.min(CANVAS_W - NODE_W - 8, n.x + step);
      if (ev.key === 'ArrowUp') n.y = Math.max(8, n.y - step);
      if (ev.key === 'ArrowDown') n.y = n.y + step;
      render(); save();
    }
  });

  /* ── Toolbar ──────────────────────────────────────────────────────────── */
  /* Two passes: the first render is what tells us how tall each box actually
     is, and only then can tidy space the rows correctly. */
  function layOut() {
    render();
    tidy();
    render();
  }

  function doTidy() {
    layOut(); save();
    window.NL.toast('Tidied up', 'success');
  }

  /* Fit is fit-to-WIDTH. It briefly fitted both, which meant a taller map made
     everything shrink to stay on one screen — small text in return for saving a
     scroll, which is the wrong trade for a map you sit and read. The bands are
     deliberately roomy now and vertical scrolling is expected. */
  function fit() {
    var want = (el.wrap.clientWidth - 24) / CANVAS_W;
    zoom = ZOOMS.reduce(function (best, z) {
      return z <= want && z > best ? z : best;
    }, ZOOMS[0]);
    if (want >= 1) zoom = 1;
    applyZoom();
  }

  function nudgeZoom(dir) {
    var i = ZOOMS.indexOf(zoom);
    if (i === -1) i = ZOOMS.length - 1;
    zoom = ZOOMS[Math.max(0, Math.min(ZOOMS.length - 1, i + dir))];
    applyZoom();
  }

  document.getElementById('bAdd').addEventListener('click', function () {
    var spot = freeSpot('flow');
    addNode(spot.x + NODE_W / 2, spot.y + NODE_H / 2);
  });
  document.getElementById('bAddBlock').addEventListener('click', function () {
    var spot = freeSpot('flow');
    addBlock(spot.x + BLOCK_W / 2, spot.y + 60);
  });
  document.getElementById('bTidy').addEventListener('click', doTidy);
  document.getElementById('zFit').addEventListener('click', fit);
  document.getElementById('zIn').addEventListener('click', function () { nudgeZoom(1); });
  document.getElementById('zOut').addEventListener('click', function () { nudgeZoom(-1); });

  document.getElementById('bExport').addEventListener('click', function () {
    var name = 'wellbeing-map-' + new Date().toISOString().slice(0, 10) + '.json';
    window.NL.download(name, JSON.stringify(payload(), null, 2), 'application/json');
    window.NL.toast('Exported to your Downloads folder', 'success');
  });

  document.getElementById('bImport').addEventListener('click', function () {
    window.NL.confirm(
      'Loading a file replaces everything on screen.',
      {
        title: 'Import a map',
        detail: 'If you want to keep what is here, press Cancel and Export first.',
        confirmText: 'Choose a file'
      }
    ).then(function (ok) { if (ok) el.file.click(); });
  });

  el.file.addEventListener('change', function () {
    var f = el.file.files && el.file.files[0];
    if (!f) return;
    var reader = new FileReader();
    reader.onload = function () {
      var data;
      try { data = JSON.parse(String(reader.result)); }
      catch (err) {
        window.NL.toast('That file is not a map — it is not readable as JSON', 'error');
        return;
      }
      if (!data || data.format !== 'nl-wellbeing-map' || !Array.isArray(data.nodes)) {
        window.NL.toast('That file is not a Wellbeing map export', 'error');
        return;
      }
      adopt(data);
      layOut(); save();
      window.NL.toast('Loaded ' + data.nodes.length + ' pages from ' + f.name, 'success');
    };
    reader.onerror = function () { window.NL.toast('Could not read that file', 'error'); };
    reader.readAsText(f);
    el.file.value = '';
  });

  /* Two ways to start over, and they are different exercises. "Back to the live
     structure" is for arguing with what exists. "Empty canvas" is for designing
     the section you would build if it did not, which is a conversation the tool
     could not host while the live structure was the only starting point. */
  /* Fetch a starting map, once, and remember it. */
  function fetchStarter(file) {
    if (seeds[file]) return Promise.resolve(seeds[file]);
    return fetch(file, { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw new Error(file + ' ' + r.status);
        return r.json();
      })
      .then(function (data) { seeds[file] = data; return data; });
  }

  function startFrom(file, name) {
    fetchStarter(file)
      .then(function (data) {
        adopt(JSON.parse(JSON.stringify(data)), { tidy: true });
        S.label = data.label || name;
        layOut(); fit(); setFrom(); save();
        window.NL.toast('Loaded ' + (data.label || name), 'success');
      })
      .catch(function () {
        window.NL.toast('Could not load that starting map', 'error');
      });
  }

  function pickStartingMap() {
    var ctrl = window.NL.modal({
      title: 'Starting map',
      size: 'md',
      body:
        '<p class="confirm-text">' +
          (S.label ? 'You are working from <b>' + esc(S.label) + '</b>. ' : '') +
          'Choosing any of these throws away every change on screen — press ' +
          '<b>Cancel</b> and <b>Export</b> first if you want to keep it.</p>' +
        '<div class="wm-picks">' +
          STARTERS.map(function (st) {
            return '<button class="wm-pick" type="button" data-start="' + esc(st.file) +
              '" data-name="' + esc(st.name) + '">' +
              '<b>' + esc(st.name) + '</b><span>' + esc(st.note) + '</span></button>';
          }).join('') +
          '<button class="wm-pick" type="button" data-empty="1">' +
            '<b>Empty canvas</b><span>Nothing at all. Build the section you would build ' +
            'from scratch, in the bands.</span></button>' +
        '</div>',
      buttons: [{ label: 'Cancel', onClick: function (c) { c.close(); } }]
    });

    Array.prototype.forEach.call(document.querySelectorAll('[data-start]'), function (b) {
      b.addEventListener('click', function () {
        ctrl.close();
        startFrom(b.getAttribute('data-start'), b.getAttribute('data-name'));
      });
    });
    var empty = document.querySelector('[data-empty]');
    if (empty) empty.addEventListener('click', function () {
      ctrl.close();
      adopt({ zones: (seed && seed.zones) || S.zones, nodes: [], edges: [] }, { tidy: true });
      S.label = 'an empty canvas';
      layOut(); fit(); setFrom(); save();
      window.NL.toast('Empty canvas — press + Add a page to begin', 'success');
    });
  }

  document.getElementById('bReset').addEventListener('click', pickStartingMap);
  document.getElementById('from').addEventListener('click', pickStartingMap);

  /* Everything at once. Off by default — the whole reason the map is readable is
     that a block's arrows stay in the block — but a walkthrough needs the full
     picture on screen rather than one that answers when asked. */
  document.getElementById('bAll').addEventListener('click', function () {
    S.showAll = !S.showAll;
    this.setAttribute('aria-pressed', S.showAll ? 'true' : 'false');
    render(); save();
    window.NL.toast(S.showAll
      ? 'Every arrow is drawn, including the ones inside blocks'
      : 'Block arrows tucked back into their blocks', 'success');
  });

  /* ── The explainer ────────────────────────────────────────────────────── */
  function help() {
    window.NL.modal({
      title: 'How this works',
      size: 'md',
      body:
        '<div class="wm-help">' +
        '<p class="wm-hint" style="margin:0 0 14px"><b>' + VERSION + '</b>, updated ' +
        UPDATED + '. ' + esc(NL_CHANGELOG[0].note) + ' If the version in the top-left ' +
        'does not match this, you are looking at a cached copy — hold Shift and press ' +
        'reload.</p>' +

        '<h3>What this is</h3>' +
        '<p>A sketchpad for the Wellbeing section. Every box is a page, every arrow is a ' +
        'route from one page to another, and inside each box are the words that page ' +
        'carries. Move things, rename things, rewrite things.</p>' +
        '<p><b>Nothing you do here changes the live pages.</b> Richard makes the real ' +
        'changes by hand, once you have agreed them.</p>' +

        '<h3>Saving, and the one thing to watch</h3>' +
        '<ul>' +
        '<li>Your work saves itself as you go. The top-right corner tells you when.</li>' +
        '<li>It saves into <b>this browser on this computer only</b>. A different computer, ' +
        'a different browser, or clearing your history, and it will not be there.</li>' +
        '<li>So when you finish a session, press <b>Export</b>. That puts one file in your ' +
        'Downloads folder. Email it to Richard.</li>' +
        '<li><b>Import</b> loads a file back in. It replaces what is on screen, so export ' +
        'first if you want to keep it.</li>' +
        '<li><b>The button in the top-left says which map you are on</b> — press it to ' +
        'switch. There are three: the live structure as it is today, the parked ' +
        '<b>concepts version</b> so the two ways of triaging can be compared side by ' +
        'side, and a completely empty canvas to design from scratch. <b>Start again</b> ' +
        'opens the same choice.</li>' +
        '<li><b>All arrows</b> draws everything at once, including the arrows a block ' +
        'normally keeps inside itself. Useful for walking somebody through a whole ' +
        'journey without leaving anything out; messy for designing, which is why it is ' +
        'off to begin with.</li>' +
        '</ul>' +

        '<h3>Doing things</h3>' +
        '<ul>' +
        '<li><b>Move a box</b> — drag it. Drop it in another band to move it there.</li>' +
        '<li><b>Change a box</b> — click it. The panel on the right holds its name and ' +
        'its words.</li>' +
        '<li><b>Draw an arrow</b> — press the small circle at the bottom-right of a box ' +
        'and drag onto another box.</li>' +
        '<li><b>Remove an arrow</b> — click the arrow, then Delete this arrow.</li>' +
        '<li><b>Add a page</b> — press <b>+ Add a page</b> at the top. It appears in the ' +
        'first free space. Or right-click exactly where you want it.</li>' +
        '<li><b>Delete a page</b> — click it, then <b>Delete this page</b> at the bottom of ' +
        'the panel. Or right-click it.</li>' +
        '<li><b>Tidy up</b> — puts every box back on the grid if it has got messy.</li>' +
        '</ul>' +

        '<h3>Reading the colours</h3>' +
        '<p>Colour means one thing only: <b>how urgent the page is</b>. It is the same ' +
        'ladder a visitor already sees on the statements on the live site.</p>' +
        '<ul>' +
        '<li><b>Red</b> — somebody may not be safe right now.</li>' +
        '<li><b>Amber</b> — urgent, needs to talk today, but not a threat to life.</li>' +
        '<li><b>Yellow</b> — everyday support. Most topics start here.</li>' +
        '<li><b>Blue</b> — about somebody else rather than yourself.</li>' +
        '<li><b>Navy</b> is a way in and <b>grey</b> is a service directory. Neither is a ' +
        'rung on the ladder.</li>' +
        '</ul>' +
        '<p>An arrow takes the colour of where it <i>ends up</i>, so a red arrow means that ' +
        'route finishes somewhere urgent. If you disagree with a page’s colour, change ' +
        'it — that is the argument this is for.</p>' +

        '<h3>Following the arrows</h3>' +
        '<ul>' +
        '<li><b>Hover over a box</b> and everything it does not touch fades. What it ' +
        'points at, and what points at it, light up — and the arrows pulse in the ' +
        'direction they lead, so you can see which way round a route goes.</li>' +
        '<li><b>Click a box</b> and its arrows stay drawn, including the ones a block ' +
        'normally keeps to itself. The panel lists every arrow in and out: click one to ' +
        'change its wording, &times; to remove it.</li>' +
        '<li><b>Two pages pointing at each other</b> are drawn as two lines side by ' +
        'side, pulsing opposite ways. That is how you spot a route that goes both ' +
        'ways rather than one that only looks like it.</li>' +
        '<li><b>Grey blocks list their own buttons.</b> The header, the footer and the ' +
        'topic buttons appear on every page, so instead of firing twelve arrows across ' +
        'the diagram they list where each button goes. Hover the block to see all of them ' +
        'at once, or hover one row for just that one.</li>' +
        '<li><b>The twelve topic buttons are not a limit.</b> Click the block and use ' +
        '<b>Add a button</b>, or drag from the circle on the block onto a page. The ' +
        'arrows beside each button move it up or down the list, and &times; takes it out. ' +
        'Click a button to change its wording.</li>' +
        '<li><b>Nothing is fixed.</b> Any box can be dragged or deleted, blocks included, ' +
        'and any page can be turned into a shared block — or back — with the tick box at ' +
        'the bottom of its panel. Start again puts it all back.</li>' +
        '<li><b>Blocks go on and come off pages.</b> The four statements, the topic ' +
        'buttons and the &ldquo;Supporting someone&rdquo; buttons are all the same kind ' +
        'of thing: a component that sits on some pages and not others. A page&rsquo;s ' +
        'panel ticks any block on or off; a block&rsquo;s panel shows which pages carry ' +
        'it, and can put it on or take it off all of them at once. Press <b>+ Add a ' +
        'block</b> to make a new one.</li>' +
        '<li>Each page box says how many words it holds, so it is easy to see what is ' +
        'thin.</li>' +
        '</ul>' +
        '</div>',
      buttons: [{ label: 'Got it', className: 'btn--primary', autofocus: true,
        onClick: function (c) { c.close(); } }]
    });
  }
  document.getElementById('bHelp').addEventListener('click', help);
  document.getElementById('ver').textContent = VERSION;
  document.title = 'Wellbeing map ' + VERSION + ' — The National League';

  /* ── Am I stale? ──────────────────────────────────────────────────────────
     GitHub Pages ignores the repo's _headers file, so this page can sit in a
     cache for a few minutes after a deploy with nothing on screen to say so —
     which is exactly the confusion the version chip is there to end.

     So the page asks. It refetches its own HTML, bypassing the cache, and
     reads the VERSION out of it. If that is not the version running, it says
     so and offers a reload. No second file to keep in step: the page is its
     own manifest, so this cannot drift. */
  function checkFresh() {
    fetch(location.pathname + '?fresh=' + VERSION, { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.text() : null; })
      .then(function (html) {
        if (!html) return;
        var m = html.match(/var VERSION = '(v[0-9.]+)'/);
        if (!m || m[1] === VERSION) return;

        var bar = document.createElement('p');
        bar.className = 'wm-stale';
        bar.innerHTML = '<b>You are looking at an old copy.</b> This is ' +
          esc(VERSION) + '; ' + esc(m[1]) + ' has been published. Your work is ' +
          'saved and will still be here afterwards.' +
          ' <button type="button" id="bFresh">Load ' + esc(m[1]) + '</button>';
        document.body.insertBefore(bar, document.querySelector('.wm-say'));
        document.getElementById('bFresh').addEventListener('click', function () {
          location.replace(location.pathname + '?v=' + m[1]);
        });
      })
      .catch(function () { /* offline, or opened from a file — nothing to say */ });
  }

  /* ── Boot ─────────────────────────────────────────────────────────────── */
  function boot() {
    fetch('map-live.json', { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw new Error('seed ' + r.status);
        return r.json();
      })
      .then(function (data) {
        seed = data;
        S.zones = data.zones || [];

        var saved = null;
        try { saved = JSON.parse(localStorage.getItem(STORE) || 'null'); }
        catch (err) { saved = null; }

        seeds['map-live.json'] = data;

        if (saved && Array.isArray(saved.nodes) && saved.nodes.length) {
          adopt(saved);
          stamp('Picked up where you left off');
        } else {
          adopt(JSON.parse(JSON.stringify(seed)), { tidy: true });
          S.label = seed.label || 'The live structure';
          stamp('Started from the live structure');
        }
        setFrom();
        document.getElementById('bAll')
          .setAttribute('aria-pressed', S.showAll ? 'true' : 'false');

        layOut();
        fit();

        /* First visit gets the explainer without having to find the (i). */
        try {
          if (!localStorage.getItem(SEEN)) { localStorage.setItem(SEEN, '1'); help(); }
        } catch (err) { /* private browsing — no harm done */ }
      })
      .catch(function (err) {
        el.side.innerHTML = '<h2>Could not load the map</h2>' +
          '<p class="wm-hint">map-live.json did not load, so there is nothing to draw. ' +
          'Reload the page; if it keeps happening, tell Richard.</p>' +
          '<div class="wm-locked">' + esc(String(err.message || err)) + '</div>';
        stamp('<b>Not loaded</b>');
      });
  }

  window.addEventListener('resize', function () {
    if (zoom < 1) fit();
  });

  boot();
  checkFresh();
}());
</script>

</body>
</html>
