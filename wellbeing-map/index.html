<!DOCTYPE html>
<!--
  NL Tools — Wellbeing map
  Version: v1.14 (30/07/2026)
  File: /wellbeing-map/index.html

  An editable map of the public Wellbeing section: every page as a box, every
  route as an arrow, and the page's own words inside the box. Built so that
  Martyn and Benny can reshape the structure and rewrite the copy without
  going near any code, then send the result back as one file.

  WHAT THIS PAGE IS NOT
  It is not connected to the live site. Nothing typed here changes
  /wellbeing/. Richard applies changes by hand. That is deliberate: a
  sketchpad that could publish would need auth, an audit trail and a review
  step, and none of that is what this is for.

  NOT GATED. There is no auth-guard, no Firebase and no RTDB — same as
  /wellbeing/ and /club-contacts/. It carries noindex, nofollow because the
  copy inside it is draft, and some of it is about suicide and self-harm.
  Anybody with the URL can open it, which is a decision taken knowingly:
  the two people who need it do not have to think about logging in.

  WHERE THE STARTING MAPS COME FROM
  wellbeing-map/map-live.json and map-concepts.json, both generated by
  scripts/build-wellbeing-map.js from the real markup of wellbeing/index.html
  and wellbeing/concepts/wellbeing-navigation.html. Re-run that script whenever
  either page changes so the maps keep starting from reality. Start again loads
  whichever one you pick.

  They are named map-* rather than seed-* because .gitignore blocks seed-*.json
  on purpose: this repo is public and data exports must never be committed.
  These carry no personal data.

  WHAT IS DELIBERATELY LEFT OUT OF THE DIAGRAM
  Drawn literally, the section has 200-plus links, almost all of them the same
  three shared blocks repeated on fifteen pages. They are drawn once here, as
  locked boxes, with a flag on each page saying it shows them. What is left is
  the ten or so links somebody actually chose to write, which is the flow
  worth arguing about.

  CANON
  Brand tokens from /system/nl-brand.css and helpers from /system/nl-utils.js.
  The copy editor is NL.richText — bold, italic, bullets, links, nothing else,
  with paste forced to plain text. Dialogs are NL.confirm / NL.modal, never
  native confirm(). No colour here is a raw hex value.

  CHANGELOG
  v1.14 (30/07/2026) — Hovering or clicking one button inside a block lit the
    whole block: all ten topic arrows at once, when the question being asked was
    about one of them. Focus is narrowest-wins now — a button beats the block it
    sits in — so pointing at "Depression and low mood" shows that route and
    nothing else, and its neighbours in the list step back rather than looking
    equally live. Selecting an arrow does the same thing: it lights its own two
    ends instead of leaving the map flat.
  v1.13 (30/07/2026) — Blocks became a proper kind of thing rather than three
    special cases.

    A page used to carry three fixed booleans — showsTopics, nextStep,
    showsFooter — which could only ever describe the three blocks that existed
    when they were written. A new block could not be put on a page at all, and on
    a blank canvas there was no way to make anything but pages. A page now carries
    a list of the blocks it shows, and there is an "+ Add a block" button and a
    right-click entry to match "+ Add a page". A page's panel ticks any block on
    or off; a block's panel says which pages carry it, with the same tick boxes
    from the other direction plus put-it-on-every-page and take-it-off-every-page.
    Old maps translate their booleans on import.

    The seed changed to match, because the live page was being flattened. What
    was one "Topics widget" block of twelve buttons is now two, since the page
    renders them under two headings as two components: the ten topics, and the
    two under "Supporting someone, or looking for a service". And "Your next
    step" — the same box at the foot of ten pages — was a tick box, which meant
    its words could not be read or edited anywhere. It is a block now, with the
    support-directory link as its button. Six blocks on the live map, five on the
    concepts one.
  v1.12 (30/07/2026) — Bands crept. Their geometry was derived from whatever
    their highest box happened to be, through a Math.min that could only move a
    band UP and a Math.max that could only make it taller. So every drag ratcheted
    a band a little higher and it never came back — on an empty canvas the header
    eventually climbed off the top of the page, and the sections appeared to pull
    up around the boxes as you moved between them.

    Bands own their geometry now. The first starts at a fixed 14px and each one
    stacks under the last; a band is as tall as its contents need or as tall as
    somebody has made it, whichever is greater; and when a band moves, its boxes
    move with it. A box dropped near the top of a band lands under the band's
    heading rather than on it.

    Added a control on each section heading to make it taller or shorter by a
    row-block at a time. Everything below shifts by the same amount, the order is
    kept, and the top of the first section does not move. A section will not go
    shorter than the things inside it. The chosen height is saved and exported.
  v1.11 (30/07/2026) — The concepts version has been loadable since v1.6, but only
    through "Start again" — which is not a button anybody presses when they want
    to compare two things, because it sounds like it throws their work away. The
    chip in the top-left that names the current map is now the switch, and says
    so. Start again opens the same choice.

    Added "All arrows": draws everything at once, including the arrows a block
    normally keeps inside itself. Off by default, because a block holding its own
    arrows is the whole reason the map is readable — but demonstrating a journey
    end to end needs the complete picture on screen, not one that answers when
    asked. The setting is remembered.
  v1.10 (30/07/2026) — The two halves of a two-way pair were nudged apart along
    an axis — sideways for a mostly-vertical run, up and down for a horizontal
    one. That only gives the full separation when the line happens to be
    axis-aligned: the perpendicular gap falls away with the tilt. Measured, a
    14px nudge came out at 14px flat and 7.1px on a steep diagonal, which is
    thinner than the lines themselves now are, so one half sat under the other.

    The offset now runs along the line's own perpendicular, so the gap is the
    same whatever the angle. One subtlety worth recording: the reverse edge
    points the opposite way, which flips its perpendicular for free — so both
    edges take the SAME positive nudge and end up on opposite sides, keeping to
    their own right. Flipping the sign per edge as well, which is what it did at
    first, cancels that out and lands both lines exactly on top of each other.
    Measured again: 13.3px to 18px across five angles, against 7.1px before.
  v1.9 (30/07/2026) — Arrows you could not get hold of. An arrow out of a block
    is not drawn until something is focused, so the only way to reach one was to
    catch it mid-hover; an arrow pointing IN could not be reached at all, because
    the panel listed inbound arrows as dead text. Selecting a box now holds all
    its arrows on the canvas — blocks included — and the panel lists every one in
    both directions as a row you can click to reword or × to remove. Hover and
    selection are now different things on purpose: hover mutes the rest of the
    map and runs the flow dashes, selection just holds the arrows, so the canvas
    does not grey out or keep moving while you are reading and typing.

    And the lines were too thin to carry the pulse. Every width is up — a focused
    arrow more so — and a block's pale grey arrow darkens to navy when focused,
    which was the worst case for white dashes and is exactly the arrow you are
    looking at after clicking a block. The dashes are longer and a little faster.
  v1.8 (30/07/2026) — Direction of travel. Hovering a box now sends white dashes
    riding along its arrows towards the end each one points at, so a route reads
    as flowing rather than merely being coloured in. Hover only, deliberately:
    twelve arrows pulsing permanently would be horrible to sit in front of, and
    this is a wellbeing tool. It also honours prefers-reduced-motion by dropping
    the flow line entirely rather than leaving a static dashed overlay, which
    would just read as a broken arrow.

    The thing this makes visible: two pages that point at each other used to draw
    one line on top of another, so a two-way route looked exactly like a one-way
    one. Each half of a pair now takes its own side, a few pixels apart, with its
    own arrowhead and its own flow direction. The panel says "and back again"
    when an arrow has a twin.
  v1.7 (30/07/2026) — Everything about a third bigger: boxes, type on the canvas,
    gaps, band padding, and the labels in the panel. The catch was that growing
    the boxes also grew the canvas, so fit-to-width shrank it all straight back
    and the increase cancelled itself out; the pages now sit three across rather
    than five, which keeps the canvas narrow enough that Fit lands near 90%. The
    map is taller as a result, which is the trade that was asked for.

    Also a real bug rather than a size: a button inside a block is a flex item
    with no min-width, so it refused to shrink below its own text and burst out
    through the right-hand edge of the block — "Depression and low mood" hung
    outside the box. It now shrinks, and wraps rather than truncating, because
    these are a few words each and the point of them is to be read.
  v1.6 (30/07/2026) — Everything has more room: taller boxes, more space between
    rows, deeper bands. Fit is fit-to-width again, because fitting the height too
    meant a taller map shrank to stay on one screen — small text in exchange for
    saving a scroll, which is the wrong way round for a map you sit and read.
    Vertical scrolling is expected now. Start again offers a third starting
    point: the parked concepts version, generated from
    /wellbeing/concepts/wellbeing-navigation.html, so the two structures can be
    compared side by side rather than described at each other. It is a genuinely
    different shape — three postures first, then what you want help with, and the
    topic grid as a page of its own rather than a widget on every page — so the
    generator now handles a source with no persistent nav, and treats an in-page
    menu as a block. The top-right corner says which map you are working from.
  v1.5 (30/07/2026) — Two things the tool could not do. The topics widget was
    effectively fixed at twelve buttons: rows could be deleted but nothing could
    be added, because a block had no port and its panel was read-only. The panel
    is now an editable list — add a button from a dropdown or by dragging the
    block's port onto a page, move buttons up and down the list, take them out —
    and this is the section most likely to grow. Second, nothing is locked any
    more. Every box can be dragged and deleted, blocks included, and any page can
    be turned into a shared block or back with a tick box. Start again (was
    Reset) now offers a completely empty canvas as well as the live structure, so
    the section can be designed from nothing rather than only argued with.
  v1.4 (30/07/2026) — Adding a page has a button. It was only on the right-click
    menu, which is no way to reach a primary action, and the right-click itself
    was bound to the canvas — so below 100% zoom, where the canvas does not fill
    the window, right-clicking the grey beyond its edge fell through to the
    browser's own menu and looked like the tool was broken. It is bound to the
    whole scrolling area now, with the point clamped back inside. The button
    drops the new page in the first free slot rather than tidying, so nothing
    anybody positioned by hand gets thrown away.
  v1.3 (30/07/2026) — Box heights are measured rather than assumed. A two-line
    name made a box taller than the 72px the layout assumed, so tall boxes hung
    out of their band and their arrows joined at the wrong point; every box now
    reports its real height and the bands, rows and arrows use it. The topics
    widget has moved into the pages band, sitting at the left of the pages it
    feeds — a band of its own left it marooned in an almost-empty strip. Shared
    blocks generally now stack down the left of their band. Bullets in a
    block's description in the panel no longer hang outside the grey box.
  v1.2 (30/07/2026) — The version and its date are on screen, next to the
    title and again in the explainer. GitHub Pages ignores the repo's _headers
    file, so an updated page can sit behind a cached copy for a few minutes
    with nothing to tell you which one you are looking at. Now there is.
  v1.1 (30/07/2026) — Colour now encodes one thing: urgency, on the same
    red/amber/yellow/blue ladder the live site shows a visitor. It previously
    mixed urgency with category, so the palette could not be read as a scale.
    Shared blocks list their own buttons instead of firing arrows at every
    destination — twelve topic arrows was the tangled web this was meant to
    replace — and those arrows are drawn only while the block, a row, or a
    destination is under the pointer. Hovering any box now mutes everything it
    does not touch. In the panel, "Goes to" and "Arrives from" moved above the
    copy. Fit fits both dimensions rather than just the width.
  v1.0 (30/07/2026) — Initial build. Five zones on one canvas, drag with grid
    snap, right-click to add and delete, port-to-port arrows, per-node copy
    editor, tidy, export/import, reset to seed, and an explainer behind (i).
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wellbeing map — The National League</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Internal sketchpad for the structure and copy of the Wellbeing section.">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32x32.png">

  <link rel="stylesheet" href="/system/nl-brand.css?v=37">
  <script src="/system/nl-utils.js?v=31"></script>

  <style>
  /* ── Shell ────────────────────────────────────────────────────────────── */
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--off-white); color: var(--text);
    font-family: var(--font); display: flex; flex-direction: column;
    overflow: hidden;
  }

  .wm-top {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    background: var(--navy); color: var(--white);
    padding: 10px 18px; flex: none;
  }
  .wm-brand { display: flex; align-items: center; gap: 11px; }
  .wm-brand img { width: 30px; height: 30px; object-fit: contain; }
  .wm-brand b {
    display: block; font-weight: 900; font-size: var(--text-base);
    text-transform: uppercase; letter-spacing: var(--tracking-tight); line-height: 1.1;
  }
  .wm-brand span {
    display: block; font-size: var(--text-xs); font-weight: 700;
    text-transform: uppercase; letter-spacing: var(--tracking-wide);
    color: var(--navy-200); white-space: nowrap;
  }
  /* Its own chip rather than a clause in the caps kicker: a version number is
     the one thing on this page somebody needs to read at a glance to know
     whether they are looking at a cached copy. */
  .wm-ver {
    flex: none; font-size: var(--text-xs); font-weight: 900;
    background: var(--navy-700); color: var(--white);
    border: 1px solid var(--navy-400); border-radius: var(--radius-pill);
    padding: 4px 10px; white-space: nowrap;
  }

  .wm-status {
    font-size: var(--text-xs); color: var(--navy-200); margin-left: auto;
    white-space: nowrap;
  }
  .wm-status b { color: var(--white); font-weight: 700; }
  .wm-acts { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .wm-btn {
    font-family: inherit; font-size: var(--text-xs); font-weight: 700;
    background: var(--navy-600); color: var(--white);
    border: 1px solid var(--navy-400); border-radius: var(--radius);
    padding: 7px 12px; cursor: pointer; min-height: 34px;
  }
  .wm-btn:hover { background: var(--navy-700); }
  .wm-btn:focus-visible { outline: 2px solid var(--white); outline-offset: 1px; }
  .wm-btn--i { font-weight: 900; width: 34px; padding: 0; }
  /* Adding a page was only on the right-click menu, which is no way to reach a
     primary action — especially on a trackpad, and especially for somebody who
     has not been told the gesture exists. */
  .wm-btn--go { background: var(--primary); border-color: var(--primary-300); }
  .wm-btn--go:hover { background: var(--primary-600); }
  /* A block is a different sort of thing from a page, so its button looks
     different from the page one rather than sitting next to it as a twin. */
  .wm-btn--blk { background: var(--navy-800); border-color: var(--navy-200); }
  .wm-btn--blk:hover { background: var(--navy-900); }
  .wm-btn[aria-pressed="true"] {
    background: var(--white); color: var(--navy); border-color: var(--white);
  }
  .wm-zoom { display: flex; gap: 4px; align-items: center; }
  .wm-zoom .wm-btn { width: 30px; padding: 0; font-size: var(--text-sm); }

  /* The explainer strip is on the page, not behind a button. The people using
     this are not going to hunt for reassurance that they cannot break the
     live site — they need to see it. */
  .wm-say {
    flex: none; margin: 0; padding: 9px 18px;
    background: var(--amber-light); border-bottom: 1px solid var(--amber);
    font-size: var(--text-xs); color: var(--text);
  }
  .wm-say b { font-weight: 900; }

  .wm-body { flex: 1; display: flex; min-height: 0; }

  /* ── Canvas ───────────────────────────────────────────────────────────── */
  .wm-wrap { flex: 1; overflow: auto; position: relative; min-width: 0; }
  .wm-stage { position: relative; }
  .wm-canvas {
    position: relative; transform-origin: 0 0;
    background:
      linear-gradient(var(--navy-50) 1px, transparent 1px) 0 0 / 20px 20px,
      linear-gradient(90deg, var(--navy-50) 1px, transparent 1px) 0 0 / 20px 20px,
      var(--white);
  }

  .wm-band {
    position: absolute; left: 12px; right: 12px;
    border: 1px dashed var(--navy-200); border-radius: var(--radius-lg);
    background: var(--navy-50);
  }
  /* One flex row rather than two absolutely-positioned labels: the hint used
     to start at a fixed 190px, so a longer band title ran straight through it. */
  .wm-band__hd {
    position: absolute; top: 9px; left: 16px; right: 16px;
    display: flex; align-items: baseline; gap: 14px; min-width: 0;
  }
  .wm-band__t {
    flex: none; font-size: var(--text-xs); font-weight: 900; text-transform: uppercase;
    letter-spacing: var(--tracking-wide); color: var(--navy-600); white-space: nowrap;
  }
  .wm-band__h {
    flex: 1; min-width: 0; font-size: var(--text-xs); color: var(--text-muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  /* Grow a section by a whole row-block at a time; everything below moves down
     by the same amount and the top of the first band never shifts. */
  .wm-band__z { flex: none; display: flex; gap: 4px; }
  .wm-band__z button {
    width: 26px; height: 26px; font-family: inherit; font-size: 15px; font-weight: 900;
    line-height: 1; background: var(--white); color: var(--navy);
    border: 1px solid var(--navy-200); border-radius: var(--radius-sm); cursor: pointer;
  }
  .wm-band__z button:hover { background: var(--navy-100); border-color: var(--navy); }
  .wm-band--locked { background: var(--navy-100); border-style: solid; }

  /* Pointer handling here needed two fixes, both of them long-standing.

     The SVG spans the whole canvas, and an <svg> captures pointer events across
     its whole box — so every click on empty canvas was landing on it rather than
     on the band underneath, which is why clicking blank space to deselect did
     nothing. It is transparent to the pointer now.

     And within it, only the invisible wide path should be clickable. The drawn
     paths — line, halo, flow dashes — sit above it, and an SVG stroke captures
     pointer events, so the topmost decoration swallowed the click and the
     generous 16px hit band only worked where you MISSED the line. */
  .wm-edges { position: absolute; inset: 0; overflow: visible; pointer-events: none; }
  .wm-edges path { fill: none; }
  .wm-edges .wm-hit {
    stroke: transparent; stroke-width: 16; cursor: pointer; pointer-events: stroke;
  }
  .wm-lab {
    font-family: var(--font); font-size: 14px; font-weight: 700;
    fill: var(--navy-700); paint-order: stroke;
    stroke: var(--white); stroke-width: 4px; stroke-linejoin: round;
    pointer-events: none;
  }

  /* Nodes. Colour carries meaning: red is a threat to life, amber is urgent,
     grey is a shared block that appears on every page.

     Two deliberate departures from how a normal page in this repo is styled,
     both because this is a zoomable diagram rather than a document:

     - The left border is thickened to 6px. The whole border already carries
       the kind colour, but at 0.5 zoom a 2px border renders as one pixel and
       the severity encoding disappears. The rail survives being zoomed out,
       which is the point of colour-coding urgency at all.
     - Type inside a node is fixed px, not the --text-* tokens. Those tokens
       are clamp()ed against the viewport; inside a fixed 180px box on a
       transformed canvas that makes text overflow its box on a wide screen.
       Everything outside the canvas — toolbar, inspector, dialogs — uses the
       tokens as normal. */
  .wm-node {
    position: absolute; box-sizing: border-box;
    width: 234px; min-height: 114px;
    background: var(--white); border: 2px solid var(--navy-300);
    border-left-width: 6px; border-radius: var(--radius);
    padding: 11px 13px 28px; cursor: grab; user-select: none;
    box-shadow: 0 1px 3px var(--navy-100);
  }
  .wm-node:focus-visible { outline: 2px solid var(--navy); outline-offset: 2px; }
  .wm-node.is-drag { cursor: grabbing; box-shadow: var(--shadow); z-index: 30; }
  .wm-node.is-sel { border-color: var(--navy); box-shadow: 0 0 0 3px var(--navy-200); z-index: 20; }
  .wm-node__n {
    font-size: 17px; font-weight: 900; line-height: 1.22; overflow-wrap: break-word;
  }
  .wm-node__k {
    font-size: 13px; font-weight: 700; text-transform: uppercase;
    letter-spacing: var(--tracking-wide); color: var(--text-muted); margin-top: 4px;
  }
  .wm-node__f {
    position: absolute; left: 13px; bottom: 7px;
    display: flex; gap: 6px; align-items: center; flex-wrap: wrap;
  }
  .wm-chip {
    font-size: 12px; font-weight: 900; line-height: 1;
    padding: 4px 7px; border-radius: var(--radius-sm);
    background: var(--navy-100); color: var(--navy-700);
  }
  .wm-chip--words { background: var(--green-light); color: var(--green); }
  .wm-chip--empty { background: var(--amber-light); color: var(--amber-deep); }

  /* One ladder, one meaning. These are the same four colours the live site
     already shows a visitor on its statements, in the same order, plus two
     deliberately neutral structural kinds. --wm-yellow is a local token for
     the same reason /wellbeing/ declares one: canon has no yellow between
     --amber and --green. Fair canon candidate. */
  :root { --wm-yellow: #efb700; }

  .wm-node--crisis   { border-color: var(--red); }
  .wm-node--urgent   { border-color: var(--amber); }
  .wm-node--everyday { border-color: var(--wm-yellow); }
  .wm-node--other    { border-color: var(--blue); }
  .wm-node--wayin    { border-color: var(--navy); }
  .wm-node--services { border-color: var(--navy-300); }
  .wm-node--shared   { border-color: var(--navy-400); background: var(--navy-50); }

  /* A shared block lists its own buttons instead of firing arrows across the
     canvas at each destination. Twelve topic arrows WAS the tangled web — the
     block is the honest picture, because on the real site it is one component
     with a list of buttons in it. Hover the block, or a row, to see where it
     reaches. */
  .wm-node--block { padding-bottom: 8px; }
  .wm-rows { margin-top: 9px; border-top: 1px solid var(--navy-200); }
  .wm-rows--two { display: grid; grid-template-columns: 1fr 1fr; column-gap: 18px; }
  .wm-node__note { margin: 9px 0 0; font-size: 14px; color: var(--text-muted); line-height: 1.35; }
  .wm-row {
    display: flex; align-items: flex-start; gap: 8px;
    padding: 5px 3px; border-bottom: 1px solid var(--navy-100);
    font-size: 14px; line-height: 1.3; cursor: pointer;
  }
  .wm-row:last-child { border-bottom: 0; }
  .wm-row:hover { background: var(--navy-100); }
  .wm-row.is-sel { background: var(--navy-200); }
  .wm-row.is-hot { background: var(--navy-100); }
  .wm-row__d {
    width: 10px; height: 10px; border-radius: 50%; flex: none;
    margin-top: 4px; background: var(--navy-300);
  }
  .wm-row__d--crisis   { background: var(--red); }
  .wm-row__d--urgent   { background: var(--amber); }
  .wm-row__d--everyday { background: var(--wm-yellow); }
  .wm-row__d--other    { background: var(--blue); }
  .wm-row__d--wayin    { background: var(--navy); }
  /* min-width:0 is the fix. Without it the label is a flex item that refuses to
     shrink below its content, so a button called "Depression and low mood" broke
     out of the right-hand edge of the block. And it wraps rather than truncating:
     these are a few words each and the point is to read them. */
  .wm-row__t { min-width: 0; flex: 1; overflow-wrap: break-word; }
  .wm-row__g { flex: none; color: var(--text-muted); font-weight: 700; }

  /* Hovering a box mutes everything it does not touch. Reading a diagram is
     mostly asking "what does THIS connect to", and dimming answers that
     faster than any amount of arrow-tracing. */
  .wm-node.is-dim { opacity: 0.28; }
  /* When one button is in focus, its neighbours in the same block step back so
     the block does not read as though all of it is lit. */
  .wm-node--block.has-one .wm-row:not(.is-hot):not(.is-sel) { opacity: 0.4; }
  .wm-node.is-lit { box-shadow: 0 0 0 4px var(--navy-100), 0 2px 10px var(--navy-200); }
  .wm-edges .is-dim { opacity: 0.12; }

  /* Direction of travel. White dashes ride along the top of the line towards
     the end it points at, so a hovered route reads as flowing rather than just
     being coloured in. Only ever on hover: this is a wellbeing tool and
     permanent motion on twelve arrows would be horrible to sit in front of.

     A pair that goes both ways is drawn as two lines a few pixels apart, each
     flowing its own way — which is the bit that was invisible before. */
  .wm-flow {
    stroke: var(--white); stroke-dasharray: 11 13; stroke-linecap: round;
    animation: wmFlow 1.05s linear infinite;
  }
  @keyframes wmFlow {
    from { stroke-dashoffset: 0; }
    to   { stroke-dashoffset: -24; }
  }
  /* No motion means no flow line at all — a static dashed overlay would just
     look like a broken arrow. The arrowhead still shows the direction. */
  @media (prefers-reduced-motion: reduce) {
    .wm-flow { display: none; }
  }

  /* The port: press it and drag to another box to draw an arrow. */
  .wm-port {
    position: absolute; right: -12px; bottom: -12px;
    width: 26px; height: 26px; border-radius: 50%;
    background: var(--navy); border: 2px solid var(--white);
    cursor: crosshair; display: grid; place-items: center;
    color: var(--white); font-size: 14px; font-weight: 900; line-height: 1;
  }
  .wm-port:hover { background: var(--primary); }
  .wm-node--drop { border-color: var(--green); box-shadow: 0 0 0 3px var(--green-light); }

  /* ── Inspector ────────────────────────────────────────────────────────── */
  .wm-side {
    flex: none; width: 344px; background: var(--white);
    border-left: 1px solid var(--border); overflow-y: auto; padding: 16px;
  }
  .wm-side h2 {
    margin: 0 0 3px; font-size: var(--text-base); font-weight: 900;
  }
  .wm-side .wm-hint { margin: 0 0 16px; font-size: var(--text-sm); color: var(--text-muted); }
  .wm-f { margin-bottom: 13px; }
  /* :not(.wm-check) — a tick box's own <label> is a direct child of .wm-f too,
     and it is a sentence to read, not a field name to scan. */
  .wm-f > label:not(.wm-check) {
    display: block; font-size: var(--text-sm); font-weight: 900;
    text-transform: uppercase; letter-spacing: var(--tracking-wide);
    color: var(--text-muted); margin-bottom: 4px;
  }
  .wm-f input[type=text], .wm-f select {
    width: 100%; box-sizing: border-box; font-family: inherit;
    font-size: var(--text-base); padding: 9px 11px; color: var(--text);
    border: 1px solid var(--border); border-radius: var(--radius);
    background: var(--white); min-height: 38px;
  }
  .wm-f input[type=text]:focus, .wm-f select:focus {
    outline: none; border-color: var(--navy); box-shadow: var(--focus-ring);
  }
  .wm-check { display: flex; gap: 9px; align-items: flex-start; margin-bottom: 9px; }
  .wm-check input { margin: 2px 0 0; width: 17px; height: 17px; flex: none; }
  .wm-check span { font-size: var(--text-base); line-height: 1.4; }
  .wm-f .fmt-edit { min-height: 210px; max-height: 460px; overflow-y: auto; }

  .wm-out { display: flex; flex-wrap: wrap; gap: 6px; }
  .wm-outs { display: flex; gap: 6px; margin-bottom: 8px; }
  /* Scoped to .wm-outs so it beats .wm-mini's fixed 32px square, which is
     defined further down the stylesheet and was winning on source order. */
  .wm-outs .wm-mini {
    width: auto; flex: 1; padding: 8px 6px; font-size: var(--text-xs);
    white-space: nowrap;
  }
  /* A long list of pages should not push the copy editor off the bottom. */
  .wm-checks { max-height: 260px; overflow-y: auto; padding-right: 4px; }
  .wm-out__x {
    display: inline-flex; align-items: center; gap: 6px;
    font-family: inherit; font-size: var(--text-xs); font-weight: 700;
    background: var(--navy-50); color: var(--navy-700);
    border: 1px solid var(--navy-200); border-radius: var(--radius-pill);
    padding: 5px 10px; cursor: pointer;
  }
  .wm-out__x:hover { background: var(--red-light); border-color: var(--red); color: var(--red-deep); }
  .wm-out__x b { font-weight: 900; }

  .wm-btns { display: flex; flex-direction: column; gap: 4px; }
  .wm-btnrow { display: flex; gap: 4px; align-items: stretch; }
  .wm-btnrow__t {
    flex: 1; min-width: 0; display: flex; align-items: center; gap: 7px;
    font-family: inherit; font-size: var(--text-sm); text-align: left;
    background: var(--white); color: var(--text);
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: 7px 10px; cursor: pointer; min-height: 36px;
  }
  .wm-btnrow__t:hover { border-color: var(--navy); background: var(--navy-50); }
  .wm-btnrow__t span:last-child { min-width: 0; overflow-wrap: break-word; }
  .wm-btnrow__t em {
    font-style: normal; color: var(--text-muted); font-size: var(--text-sm);
  }
  .wm-mini {
    flex: none; width: 32px; font-family: inherit; font-size: var(--text-sm);
    font-weight: 700; background: var(--white); color: var(--navy);
    border: 1px solid var(--border); border-radius: var(--radius); cursor: pointer;
  }
  .wm-mini:hover:not(:disabled) { background: var(--navy-50); border-color: var(--navy); }
  .wm-mini:disabled { opacity: 0.35; cursor: default; }
  .wm-mini--x { color: var(--red-deep); }
  .wm-mini--x:hover { background: var(--red-light); border-color: var(--red); }

  .wm-live {
    display: inline-block; font-size: var(--text-xs); font-weight: 700;
    color: var(--navy); text-decoration: underline;
    text-decoration-thickness: 2px; text-underline-offset: 2px;
  }
  .wm-danger {
    font-family: inherit; font-size: var(--text-sm); font-weight: 700;
    background: var(--white); color: var(--red-deep);
    border: 1px solid var(--red); border-radius: var(--radius);
    padding: 9px 13px; cursor: pointer; width: 100%; min-height: 40px;
    margin-top: 6px;
  }
  .wm-danger:hover { background: var(--red-light); }
  .wm-locked {
    background: var(--navy-50); border: 1px solid var(--navy-200);
    border-radius: var(--radius); padding: 11px 13px;
    font-size: var(--text-sm); color: var(--text); line-height: 1.4;
  }
  /* A block's description is authored HTML, so it arrives with real lists in
     it. Without these the markers sat outside the panel. */
  .wm-locked p { margin: 0 0 8px; }
  .wm-locked p:last-child { margin-bottom: 0; }
  .wm-locked ul { margin: 6px 0 8px; padding-left: 19px; }
  .wm-locked li { margin-bottom: 3px; }

  /* ── Right-click menu ─────────────────────────────────────────────────── */
  .wm-ctx {
    position: fixed; z-index: 200; min-width: 196px;
    background: var(--white); border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: var(--shadow); padding: 5px;
    display: none;
  }
  .wm-ctx.is-open { display: block; }
  .wm-ctx button {
    display: block; width: 100%; text-align: left; font-family: inherit;
    font-size: var(--text-sm); background: none; border: 0; cursor: pointer;
    padding: 9px 11px; border-radius: var(--radius-sm); color: var(--text);
    min-height: 38px;
  }
  .wm-ctx button:hover { background: var(--navy-50); }
  .wm-ctx button.is-danger { color: var(--red-deep); }
  .wm-ctx button.is-danger:hover { background: var(--red-light); }
  .wm-ctx p {
    margin: 0; padding: 9px 11px; font-size: var(--text-xs);
    color: var(--text-muted); line-height: 1.4;
  }
  .wm-ctx hr { border: 0; border-top: 1px solid var(--border); margin: 4px 0; }

  .wm-stale {
    flex: none; margin: 0; padding: 10px 18px;
    background: var(--red-light); border-bottom: 2px solid var(--red);
    color: var(--red-deep); font-size: var(--text-sm);
  }
  .wm-stale b { font-weight: 900; }
  .wm-stale button {
    font-family: inherit; font-size: var(--text-xs); font-weight: 900;
    background: var(--red-deep); color: var(--white); border: 0;
    border-radius: var(--radius); padding: 6px 12px; margin-left: 6px;
    cursor: pointer; min-height: 32px;
  }

  /* The starting maps are a real choice, not a yes/no — so they are laid out as
     things to read and pick between rather than crammed into dialog buttons. */
  .wm-picks { display: flex; flex-direction: column; gap: 9px; margin-top: 4px; }
  .wm-pick {
    display: block; width: 100%; text-align: left; font-family: inherit;
    background: var(--white); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 12px 14px; cursor: pointer;
  }
  .wm-pick:hover { border-color: var(--navy); background: var(--navy-50); }
  .wm-pick b {
    display: block; font-size: var(--text-base); font-weight: 900;
    color: var(--text); margin-bottom: 3px;
  }
  .wm-pick span {
    display: block; font-size: var(--text-sm); color: var(--text-muted); line-height: 1.4;
  }

  /* Its own chip, not part of the save status: the save status rewrites itself
     every few seconds, so anything sharing that slot vanished on the next save. */
  /* A button, not a caption. Switching between the live structure and the
     concepts version was only reachable through "Start again" — a button nobody
     presses when they want to compare two things, because it sounds like it
     throws work away. */
  .wm-from {
    flex: none; font-family: inherit; font-size: var(--text-xs); font-weight: 700;
    color: var(--navy-100); white-space: nowrap; cursor: pointer;
    background: none; border: 1px solid var(--navy-400);
    border-radius: var(--radius-pill); padding: 5px 11px; min-height: 30px;
  }
  .wm-from:hover { background: var(--navy-700); color: var(--white); }
  .wm-from:focus-visible { outline: 2px solid var(--white); outline-offset: 1px; }
  .wm-from b { color: var(--white); font-weight: 900; }
  .wm-from span { opacity: 0.75; }

  .wm-noscript {
    margin: 40px auto; max-width: 560px; padding: 20px;
    background: var(--white); border: 2px solid var(--red);
    border-radius: var(--radius); font-size: var(--text-sm);
  }

  .wm-help h3 { margin: 18px 0 6px; font-size: var(--text-base); font-weight: 900; }
  .wm-help h3:first-child { margin-top: 0; }
  .wm-help p, .wm-help li { font-size: var(--text-sm); line-height: 1.55; }
  .wm-help ul { margin: 6px 0; padding-left: 20px; }
  .wm-help li { margin-bottom: 5px; }

  @media (max-width: 900px) {
    .wm-body { flex-direction: column; }
    .wm-side { width: auto; border-left: 0; border-top: 1px solid var(--border); max-height: 46%; }
  }
  </style>
</head>
<body>

<noscript>
  <div class="wm-noscript">
    <p><b>This page needs JavaScript.</b> It is a drawing tool, so there is no
      sensible version of it without scripting. The public Wellbeing section at
      <a href="/wellbeing/">/wellbeing/</a> works with scripting switched off —
      this internal sketchpad does not.</p>
  </div>
</noscript>

<header class="wm-top">
  <span class="wm-brand">
    <img src="/assets/crests/National League rose white.png" alt="">
    <span>
      <b>Wellbeing map</b>
      <span>Internal sketchpad</span>
    </span>
  </span>

  <span class="wm-ver" id="ver" title="Which version you are looking at"></span>
  <button class="wm-from" id="from" type="button"
    title="Switch between the live structure and the concepts version"></button>

  <span class="wm-acts">
    <span class="wm-zoom">
      <button class="wm-btn" id="zOut" type="button" title="Zoom out" aria-label="Zoom out">&minus;</button>
      <button class="wm-btn" id="zFit" type="button" title="Fit to window">Fit</button>
      <button class="wm-btn" id="zIn" type="button" title="Zoom in" aria-label="Zoom in">+</button>
    </span>
    <button class="wm-btn wm-btn--go" id="bAdd" type="button">+ Add a page</button>
    <button class="wm-btn wm-btn--blk" id="bAddBlock" type="button">+ Add a block</button>
    <button class="wm-btn" id="bAll" type="button" aria-pressed="false">All arrows</button>
    <button class="wm-btn" id="bTidy" type="button">Tidy up</button>
    <button class="wm-btn" id="bExport" type="button">Export</button>
    <button class="wm-btn" id="bImport" type="button">Import</button>
    <button class="wm-btn" id="bReset" type="button">Start again</button>
    <button class="wm-btn wm-btn--i" id="bHelp" type="button" title="How this works" aria-label="How this works">i</button>
  </span>

  <span class="wm-status" id="status"></span>
</header>

<p class="wm-say">
  <b>This is a sketchpad.</b> Nothing here changes the live pages at
  <a href="/wellbeing/" target="_blank" rel="noopener">nl.tools/wellbeing</a>.
  Your work saves into this browser as you go — press <b>Export</b> to send it
  to Richard. Press <b>i</b> for the full explanation.
</p>

<div class="wm-body">
  <div class="wm-wrap" id="wrap">
    <div class="wm-stage" id="stage">
      <div class="wm-canvas" id="canvas">
        <div id="bands"></div>
        <svg class="wm-edges" id="edges" aria-hidden="true"></svg>
        <div id="nodes"></div>
      </div>
    </div>
  </div>

  <aside class="wm-side" id="side"></aside>
</div>

<div class="wm-ctx" id="ctx" role="menu"></div>
<input type="file" id="file" accept="application/json,.json" hidden>

<script>
/* =====================================================================
   Wellbeing map — the whole tool.

   Deliberately one file with no build step, like every other page in this
   repo. It leans on canon for the things canon already does: NL.richText for
   the copy editor, NL.confirm / NL.modal for dialogs, NL.toast for feedback,
   NL.download for the export, NL.sanitiseHtml on every import.
   ===================================================================== */
(function () {
  'use strict';

  /* ── Geometry ─────────────────────────────────────────────────────────── */
  var NODE_W = 234, NODE_H = 114;
  var BLOCK_W = 360, BLOCK_W2 = 430, ROW_H = 24;  /* shared blocks list their buttons */
  var GAP_X = 28, GAP_Y = 50;
  var X0 = 48, BAND_TOP = 70, BAND_BOT = 36, BAND_GAP = 34;
  var PER_ROW = 3, GRID = 20;
  /* Room for the widest block down the left, plus PER_ROW pages beside it. */
  var CANVAS_W = X0 + BLOCK_W2 + GAP_X + PER_ROW * (NODE_W + GAP_X);

  /* On screen next to the title, so it is always possible to tell which
     version is in front of you. Bump both when you change this file. */
  var VERSION = 'v1.14';
  var UPDATED = '30 July 2026';

  var NL_CHANGELOG = [
    { v: 'v1.14', d: '30/07/2026', note: 'Pointing at one button in a block shows '
      + 'that one route, not everything the block reaches.' },
    { v: 'v1.13', d: '30/07/2026', note: 'Blocks are a proper kind of thing: add one '
      + 'anywhere, and put it on or take it off any page.' },
    { v: 'v1.12', d: '30/07/2026', note: 'Sections stay put: the top of the first '
      + 'is fixed, and each can be made taller or shorter a block at a time.' },
    { v: 'v1.11', d: '30/07/2026', note: 'Switch between the live and concepts maps '
      + 'from the top-left, and "All arrows" draws the complete journey.' },
    { v: 'v1.10', d: '30/07/2026', note: 'Two-way pairs keep the same gap at any '
      + 'angle, so neither line hides under the other.' },
    { v: 'v1.9', d: '30/07/2026', note: 'Clicking a box holds its arrows on screen '
      + 'and lists every one in and out, both clickable. Heavier lines and a '
      + 'stronger pulse.' },
    { v: 'v1.8', d: '30/07/2026', note: 'Hovered arrows pulse in the direction they '
      + 'lead, and a route that goes both ways is drawn as two lines pulsing '
      + 'opposite ways.' },
    { v: 'v1.7', d: '30/07/2026', note: 'Everything about a third bigger, and a '
      + 'block\u2019s buttons stay inside the block instead of bursting out of it.' },
    { v: 'v1.6', d: '30/07/2026', note: 'Roomier bands, and Start again offers the '
      + 'concepts version as a starting map alongside the live one.' },
    { v: 'v1.5', d: '30/07/2026', note: 'The twelve topic buttons are no longer a '
      + 'ceiling: add, reorder and remove them. Nothing is fixed any more, and '
      + 'Start again offers an empty canvas.' },
    { v: 'v1.4', d: '30/07/2026', note: 'There is an "Add a page" button. Right-click '
      + 'now works anywhere in the window, not only over the canvas.' },
    { v: 'v1.3', d: '30/07/2026', note: 'Boxes no longer spill out of their band, '
      + 'the topics widget sits beside the pages it feeds, and bullets stay inside '
      + 'the grey panel.' },
    { v: 'v1.2', d: '30/07/2026', note: 'Version and date shown on screen.' },
    { v: 'v1.1', d: '30/07/2026', note: 'Colour means urgency only. Shared blocks '
      + 'list their buttons instead of fanning arrows. Hover to focus. Connections '
      + 'above the copy in the panel.' },
    { v: 'v1.0', d: '30/07/2026', note: 'Initial build.' }
  ];

  var STORE = 'nl-wellbeing-map-v1';
  var SEEN = 'nl-wellbeing-map-seen';
  var ZOOMS = [0.5, 0.6, 0.7, 0.8, 0.9, 1];

  /* Boxes are laid out grouped by kind, in this order, so the urgent routes
     always end up at the top-left of their band.

     Kind is the only thing colour encodes, and it reads as a ladder: not safe
     now, urgent today, everyday support, about someone else. Way in and
     services sit outside the ladder and are neutral on purpose. */
  var KIND_ORDER = ['shared', 'wayin', 'crisis', 'urgent', 'everyday', 'other', 'services'];
  var KIND_LABEL = {
    shared:   'Shared block',
    wayin:    'Way in',
    crisis:   'Not safe now',
    urgent:   'Urgent today',
    everyday: 'Everyday support',
    other:    'About someone else',
    services: 'Services'
  };
  var KIND_OPTION = {
    wayin:    'Way in — navy',
    crisis:   'Not safe now — red',
    urgent:   'Urgent today — amber',
    everyday: 'Everyday support — yellow',
    other:    'About someone else — blue',
    services: 'Services — grey'
  };
  /* Legacy kinds from a map exported before the colours were put on one
     ladder. Without this an old file loses its colours silently. */
  var KIND_ALIAS = { topic: 'everyday', guide: 'everyday', triage: 'wayin' };

  /* ── State ────────────────────────────────────────────────────────────── */
  var S = { zones: [], nodes: [], edges: [], sel: null, label: '', showAll: false };
  var seed = null;              /* the live structure, loaded at boot */
  var seeds = {};               /* every starting map fetched so far */

  /* Two starting points, because there are two things worth arguing about:
     what the section is now, and what the parked concept proposed instead. */
  var STARTERS = [
    { file: 'map-live.json', name: 'The live structure',
      note: 'The section exactly as it is today: four statements on the front door, '
          + 'and the topic grid on every page.' },
    { file: 'map-concepts.json', name: 'The concepts version',
      note: 'The parked proposal: three postures first, then what you want help with, '
          + 'and the topics as a page of their own rather than a widget everywhere.' }
  ];
  var zoom = 1;
  var canvasH = 600;
  var hoverId = null;         /* box under the pointer — drives the dimming */
  var hoverEdge = null;       /* one button inside a block, if that is narrower */
  var rt = null;              /* the NL.richText controller, mounted once */
  var saveTimer = null;

  var el = {
    wrap:   document.getElementById('wrap'),
    stage:  document.getElementById('stage'),
    canvas: document.getElementById('canvas'),
    bands:  document.getElementById('bands'),
    edges:  document.getElementById('edges'),
    nodes:  document.getElementById('nodes'),
    side:   document.getElementById('side'),
    ctx:    document.getElementById('ctx'),
    file:   document.getElementById('file'),
    status: document.getElementById('status'),
    from:   document.getElementById('from')
  };

  var esc = function (s) { return window.NL.escHtml(String(s == null ? '' : s)); };
  var byId = function (id) {
    for (var i = 0; i < S.nodes.length; i++) if (S.nodes[i].id === id) return S.nodes[i];
    return null;
  };
  var eKey = function (e) { return e.from + '>' + e.to; };
  var snap = function (n) { return Math.round(n / GRID) * GRID; };
  var out = function (id) {
    return S.edges.filter(function (e) { return e.from === id; });
  };

  /* Shared blocks are wider and as tall as their list of buttons, so every
     bit of geometry has to ask rather than assume.

     Past six buttons the list goes to two columns. That halves the height of
     the topics block — and it is the more faithful picture anyway, because the
     thing it stands for is a grid of cards on the real page, not a list. */
  function colsOf(n) { return n.locked && out(n.id).length > 6 ? 2 : 1; }
  function wOf(n) { return n.locked ? (colsOf(n) === 2 ? BLOCK_W2 : BLOCK_W) : NODE_W; }

  /* Measured, not assumed. A two-line name makes a box taller than NODE_H, and
     when the geometry assumed 72px everywhere the taller boxes hung out of
     their band and their arrows joined at the wrong place. Every box reports
     its real height after each render, and layout uses that. */
  function hOf(n) {
    if (n._h) return n._h;
    if (!n.locked) return NODE_H;
    var rows = Math.ceil(Math.max(out(n.id).length, 1) / colsOf(n));
    return 52 + rows * ROW_H + 8;
  }

  function measureNodes() {
    var changed = false;
    Array.prototype.forEach.call(el.nodes.children, function (box) {
      var n = byId(box.getAttribute('data-id'));
      if (!n) return;
      var h = box.offsetHeight;
      if (h && Math.abs((n._h || 0) - h) > 0.5) { n._h = h; changed = true; }
    });
    return changed;
  }

  /* ── Persistence ──────────────────────────────────────────────────────── */
  function stamp(text) { el.status.innerHTML = text; }

  /* Which starting map this began from. Persisted, so a reload still says. */
  function setFrom() {
    el.from.innerHTML = S.label
      ? 'From <b>' + esc(S.label) + '</b> <span>&middot; switch</span>'
      : 'Choose a starting map';
  }

  function save() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      try {
        localStorage.setItem(STORE, JSON.stringify(payload()));
        var t = new Date();
        stamp('Saved in this browser · <b>' +
          String(t.getHours()).padStart(2, '0') + ':' +
          String(t.getMinutes()).padStart(2, '0') + '</b>');
      } catch (err) {
        stamp('<b>Not saved</b> — this browser refused. Export to be safe.');
      }
    }, 350);
  }

  function payload() {
    return {
      format: 'nl-wellbeing-map',
      formatVersion: 1,
      label: S.label || '',
      showAll: !!S.showAll,
      savedAt: new Date().toISOString(),
      zones: S.zones,
      nodes: S.nodes,
      edges: S.edges
    };
  }

  /* Everything arriving from outside — the seed, localStorage, an imported
     file — comes through here. Copy is sanitised, geometry is made sane, and
     edges pointing at boxes that do not exist are dropped. */
  function legacyShows(n) {
    if (n.locked) return [];
    var on = ['_header'];
    if (n.showsTopics !== false) on.push('_statements', '_topics', '_support');
    if (n.nextStep) on.push('_nextstep');
    if (n.showsFooter !== false) on.push('_footer');
    return on;
  }

  function adopt(data, opts) {
    opts = opts || {};
    var zones = (Array.isArray(data.zones) && data.zones.length ? data.zones : S.zones)
      .map(function (z) {
        /* h is a deliberate height somebody set with the section controls; the
           underscored fields are working geometry and are recomputed. */
        return { id: z.id, label: z.label, hint: z.hint, h: z.h || 0 };
      });
    var nodes = (data.nodes || []).map(function (n) {
      return {
        id: String(n.id),
        zone: n.zone || 'flow',
        kind: n.kind || 'topic',
        locked: !!n.locked,
        title: n.title || n.label || n.id,
        label: n.label || n.title || n.id,
        hash: n.hash || null,
        kicker: n.kicker || '',
        body: window.NL.sanitiseHtml(n.body || ''),
        /* Which shared blocks this page shows. Older maps carried three fixed
           booleans instead, which could only ever describe the three blocks
           that existed when they were written — so a new block could not be put
           on a page at all. Those are translated here. */
        shows: Array.isArray(n.shows) ? n.shows.slice() : legacyShows(n),
        x: typeof n.x === 'number' ? n.x : null,
        y: typeof n.y === 'number' ? n.y : null
      };
    });
    var have = {};
    nodes.forEach(function (n) { have[n.id] = 1; });
    nodes.forEach(function (n) {
      n.shows = (n.shows || []).filter(function (id) {
        var b = nodes.filter(function (o) { return o.id === id; })[0];
        return b && b.locked && id !== n.id;
      });
    });

    var seen = {};
    var edges = (data.edges || []).filter(function (e) {
      if (!have[e.from] || !have[e.to] || e.from === e.to) return false;
      var k = e.from + '>' + e.to;
      if (seen[k]) return false;
      seen[k] = 1;
      return true;
    }).map(function (e) {
      return { from: e.from, to: e.to, label: e.label || '', kind: e.kind || 'editorial' };
    });

    /* A map saved before the widget moved in with the pages still names the
       band it used to live in. Move it across and drop the empty band, or the
       old layout would persist for anybody who had already opened this. */
    var migrated = false;
    nodes.forEach(function (n) {
      if (n.zone === 'topicsnav') { n.zone = 'flow'; migrated = true; }
    });
    if (migrated) zones = zones.filter(function (z) { return z.id !== 'topicsnav'; });

    S.zones = zones; S.nodes = nodes; S.edges = edges; S.sel = null;
    if (data.label) S.label = data.label;
    S.showAll = !!data.showAll;
    if (opts.tidy || migrated || nodes.some(function (n) { return n.x === null; })) {
      nodes.forEach(function (n) { n._h = 0; });
      tidy();
    }
  }

  /* ── Layout ───────────────────────────────────────────────────────────── */

  /* Boxes are ordered by kind so the urgent routes always end up top-left,
     then packed greedily into rows. Packing matters more than it sounds: a
     row per kind made the canvas 1400px tall, which means a map you have to
     scroll to see, which defeats the object of drawing it. The one forced
     break is before the topics, so the ten of them read as a block rather
     than trailing off the end of the crisis pages. */
  function byKindThenLabel(a, b) {
    var rank = function (n) {
      var i = KIND_ORDER.indexOf(n.kind);
      return i === -1 ? KIND_ORDER.length : i;
    };
    return rank(a) - rank(b) || a.label.localeCompare(b.label);
  }

  /* Shared blocks stack down the left of their band; the pages fill the space
     to their right. In the pages band that reads as the topics widget beside
     the pages it feeds, which is what it is. */
  /* Bands own their geometry; boxes live inside them. It used to be the other
     way round — a band's top was derived from whatever its highest box happened
     to be, through a Math.min that could only ever move UP. So every drag
     ratcheted the band a little higher, it never came back down, and on an empty
     canvas the header eventually climbed off the top of the page. Its height had
     the same one-way problem in reverse: Math.max meant it could only grow.

     Now the first band starts at a fixed 14px and each one stacks under the
     last. A band is as tall as it needs to be for its contents, or as tall as
     somebody has explicitly made it, whichever is greater. When a band moves,
     its boxes move with it, so nothing drifts out of the band it belongs to. */
  var BAND_STEP = NODE_H + GAP_Y;   /* one row-block: the unit bands grow by */

  function bandContentHeight(mine, top) {
    var deepest = 0;
    mine.forEach(function (n) {
      deepest = Math.max(deepest, (n.y - top) + hOf(n));
    });
    return Math.max(BAND_TOP + NODE_H, deepest) + BAND_BOT;
  }

  function layoutBands() {
    var y = 14;
    S.zones.forEach(function (z) {
      var mine = S.nodes.filter(function (n) { return n.zone === z.id; });
      var oldTop = z._top == null ? y : z._top;

      /* Take the boxes with it, so a band moving never leaves them behind. */
      var delta = y - oldTop;
      if (delta) mine.forEach(function (n) { n.y = Math.round(n.y + delta); });

      z._top = y;
      z._h = Math.max(z.h || 0, bandContentHeight(mine, y));
      y += z._h + BAND_GAP;
    });
    canvasH = y + 14;
  }

  /* Make a band a row-block taller or shorter. Everything below shifts by the
     same amount, which is the point: the sections keep their order and the top
     of the first one never moves. */
  function resizeBand(id, dir) {
    var z = S.zones.filter(function (x) { return x.id === id; })[0];
    if (!z) return;
    var mine = S.nodes.filter(function (n) { return n.zone === z.id; });
    var floor = bandContentHeight(mine, z._top);
    var was = Math.max(z.h || 0, floor);
    z.h = Math.max(floor, was + dir * BAND_STEP);
    render(); save();
    if (dir < 0 && z.h === was) {
      window.NL.toast('That is as short as it goes with what is in it', 'error');
    }
  }

  function tidy() {
    /* Stack the bands first so every band has a top, lay the boxes out inside
       them, then stack again now the contents are known. */
    layoutBands();

    S.zones.forEach(function (z) {
      var mine = S.nodes.filter(function (n) { return n.zone === z.id; });
      var blocks = mine.filter(function (n) { return n.locked; }).sort(byKindThenLabel);
      var pages = mine.filter(function (n) { return !n.locked; }).sort(byKindThenLabel);

      var top = z._top + BAND_TOP;
      var blockY = top, colW = 0;
      blocks.forEach(function (b) {
        b.x = X0; b.y = Math.round(blockY);
        blockY += hOf(b) + GAP_Y;
        colW = Math.max(colW, wOf(b));
      });

      var px = blocks.length ? X0 + colW + GAP_X : X0;
      var perRow = Math.max(1,
        Math.floor((CANVAS_W - px - 8 + GAP_X) / (NODE_W + GAP_X)));

      var rowY = top, i = 0;
      while (i < pages.length) {
        var row = pages.slice(i, i + perRow), tallest = 0;
        row.forEach(function (n, ci) {
          /* Rounded: band heights come from measured box heights, which are not
             whole numbers, and a box on a half pixel renders soft. */
          n.x = Math.round(px + ci * (NODE_W + GAP_X));
          n.y = Math.round(rowY);
          tallest = Math.max(tallest, hOf(n));
        });
        rowY += tallest + GAP_Y;
        i += perRow;
      }
    });

    layoutBands();
  }

  function zoneAt(cy) {
    var best = S.zones[S.zones.length - 1];
    for (var i = 0; i < S.zones.length; i++) {
      var z = S.zones[i];
      if (cy >= z._top && cy <= z._top + z._h) return z;
      if (cy < z._top) { best = z; break; }
    }
    return best;
  }

  /* ── Render ───────────────────────────────────────────────────────────── */
  function applyZoom() {
    el.canvas.style.width = CANVAS_W + 'px';
    el.canvas.style.height = canvasH + 'px';
    el.canvas.style.transform = 'scale(' + zoom + ')';
    el.stage.style.width = Math.round(CANVAS_W * zoom) + 'px';
    el.stage.style.height = Math.round(canvasH * zoom) + 'px';
  }

  function render() {
    /* Order matters and is easy to get wrong. Boxes are drawn first because
       that is the only way to learn how tall they turned out; the bands are
       stacked from those heights; and stacking can MOVE boxes, since a band
       carries its contents with it. So the boxes have to be repositioned
       afterwards — without that step the bands moved and the boxes stayed put,
       which left them floating above their own section. */
    renderNodes();
    measureNodes();
    layoutBands();
    placeNodes();
    renderBands();
    renderEdges();
    applyZoom();
    renderSide();
  }

  /* Push current positions back onto boxes already in the DOM. Cheaper than a
     second full render, and it cannot disturb focus or a text cursor. */
  function placeNodes() {
    Array.prototype.forEach.call(el.nodes.children, function (box) {
      var n = byId(box.getAttribute('data-id'));
      if (!n) return;
      if (box.style.left !== n.x + 'px') box.style.left = n.x + 'px';
      if (box.style.top !== n.y + 'px') box.style.top = n.y + 'px';
    });
  }

  function renderBands() {
    el.bands.innerHTML = bandsHtml();
    Array.prototype.forEach.call(el.bands.querySelectorAll('[data-taller],[data-shorter]'),
      function (b) {
        b.addEventListener('click', function (ev) {
          ev.stopPropagation();
          resizeBand(b.getAttribute('data-taller') || b.getAttribute('data-shorter'),
            b.hasAttribute('data-taller') ? 1 : -1);
        });
      });
  }

  function bandsHtml() {
    return S.zones.map(function (z) {
      var locked = z.id === 'header' || z.id === 'footer' || z.id === 'topicsnav';
      return '<div class="wm-band' + (locked ? ' wm-band--locked' : '') + '"' +
        ' style="top:' + z._top + 'px;height:' + z._h + 'px">' +
        '<span class="wm-band__hd">' +
          '<span class="wm-band__t">' + esc(z.label) + '</span>' +
          '<span class="wm-band__h">' + esc(z.hint || '') + '</span>' +
          '<span class="wm-band__z">' +
            '<button type="button" data-shorter="' + esc(z.id) + '" title="Make this ' +
              'section shorter" aria-label="Make ' + esc(z.label) + ' shorter">&minus;</button>' +
            '<button type="button" data-taller="' + esc(z.id) + '" title="Make this ' +
              'section taller" aria-label="Make ' + esc(z.label) + ' taller">+</button>' +
          '</span>' +
        '</span>' +
        '</div>';
    }).join('');
  }

  /* Which boxes and arrows the current hover or selection touches. Everything
     else gets dimmed. */
  /* Just the two ends of one arrow. Used when the pointer or the selection is
     on a single button rather than on a box as a whole. */
  function oneEdgeFocus(key, hovering) {
    var e = S.edges.filter(function (x) { return eKey(x) === key; })[0];
    if (!e) return null;
    var nodes = {}, edges = {};
    nodes[e.from] = 'self';
    nodes[e.to] = 'to';
    edges[key] = 1;
    return { id: e.from, nodes: nodes, edges: edges, hovering: hovering, one: key };
  }

  function focusSet() {
    /* A block holds a dozen buttons, and pointing at one of them is a question
       about THAT route — not about everything the block reaches. Narrowest wins:
       one button beats the block it sits in. */
    if (hoverEdge) return oneEdgeFocus(hoverEdge, true);

    /* Hover AND selection both put a box in focus, but they are not the same
       thing. Hover is a glance: it mutes everything else and runs the flow
       dashes. Selection is work: it holds the box's arrows on screen — including
       the ones a block normally keeps to itself — so they can be clicked and
       edited, without greying out the map you are trying to read while typing. */
    var id = hoverId || (S.sel && S.sel.type === 'node' ? S.sel.id : null);
    if (!id) {
      /* A selected arrow lights its own two ends and nothing else. */
      if (S.sel && S.sel.type === 'edge') return oneEdgeFocus(S.sel.id, false);
      return null;
    }
    var nodes = {}, edges = {};
    nodes[id] = 'self';
    S.edges.forEach(function (e) {
      if (e.from === id) { edges[eKey(e)] = 1; nodes[e.to] = nodes[e.to] || 'to'; }
      if (e.to === id) { edges[eKey(e)] = 1; nodes[e.from] = nodes[e.from] || 'from'; }
    });
    return { id: id, nodes: nodes, edges: edges, hovering: !!hoverId };
  }

  function renderNodes() {
    var focus = focusSet();

    el.nodes.innerHTML = S.nodes.map(function (n) {
      var selected = S.sel && S.sel.type === 'node' && S.sel.id === n.id;
      var words = textLen(n.body);
      var state = '';
      if (focus) {
        state = focus.nodes[n.id]
          ? (focus.nodes[n.id] === 'self' ? '' : ' is-lit')
          : (focus.hovering ? ' is-dim' : '');
      }

      var body;
      if (n.locked) {
        /* A block lists its buttons. Each row is the arrow, so it is clickable
           and deletable exactly like an arrow on the canvas. */
        var rows = out(n.id);
        body =
          '<div class="wm-node__n">' + esc(n.label) + '</div>' +
          '<div class="wm-node__k">On every page · ' + rows.length +
            (rows.length === 1 ? ' button' : ' buttons') + '</div>' +
          '<span class="wm-port" data-port="' + esc(n.id) +
            '" title="Drag onto a page to add a button">&#8599;</span>' +
          '<div class="wm-rows' + (colsOf(n) === 2 ? ' wm-rows--two' : '') + '">' +
          (rows.length ? rows.map(function (e) {
            var to = byId(e.to);
            var rSel = S.sel && S.sel.type === 'edge' && S.sel.id === eKey(e);
            var rHot = focus && focus.one === eKey(e);
            return '<div class="wm-row' + (rSel ? ' is-sel' : '') +
              (rHot ? ' is-hot' : '') + '" data-row="' +
              esc(eKey(e)) + '" title="' + esc((e.label || to.label) + ' → ' + to.label) + '">' +
              '<span class="wm-row__d wm-row__d--' + esc(to.kind) + '"></span>' +
              '<span class="wm-row__t">' + esc(e.label || to.label) + '</span>' +
              '<span class="wm-row__g">&rarr;</span>' +
              '</div>';
          }).join('') : '<p class="wm-node__note">Nothing links out of this block</p>') +
          '</div>';
      } else {
        body =
          '<div class="wm-node__n">' + esc(n.label) + '</div>' +
          '<div class="wm-node__k">' + esc(KIND_LABEL[n.kind] || n.kind) + '</div>' +
          '<div class="wm-node__f">' +
            '<span class="wm-chip ' + (words ? 'wm-chip--words' : 'wm-chip--empty') + '">' +
              (words ? words + ' words' : 'No words yet') + '</span>' +
            (n.shows.length
              ? '<span class="wm-chip">+' + n.shows.length +
                (n.shows.length === 1 ? ' block' : ' blocks') + '</span>'
              : '') +
          '</div>' +
          '<span class="wm-port" data-port="' + esc(n.id) +
            '" title="Drag to another box to draw an arrow">&#8599;</span>';
      }

      var oneHere = focus && focus.one && n.locked &&
        focus.one.indexOf(n.id + '>') === 0;
      return '<div class="wm-node wm-node--' + esc(n.kind) + (n.locked ? ' wm-node--block' : '') +
        (oneHere ? ' has-one' : '') + (selected ? ' is-sel' : '') + state + '"' +
        ' data-id="' + esc(n.id) + '" data-zone="' + esc(n.zone) + '" tabindex="0" role="button"' +
        ' aria-label="' + esc(n.label) + ', ' + esc(KIND_LABEL[n.kind] || n.kind) + '"' +
        ' style="left:' + n.x + 'px;top:' + n.y + 'px;width:' + wOf(n) + 'px' +
        (n.locked ? '' : ';min-height:' + NODE_H + 'px') + '">' +
        body + '</div>';
    }).join('');
  }

  function textLen(html) {
    var d = document.createElement('div');
    d.innerHTML = html || '';
    var t = (d.textContent || '').trim();
    return t ? t.split(/\s+/).length : 0;
  }

  /* Does the opposite arrow exist too? */
  function isTwoWay(e) {
    return S.edges.some(function (o) { return o.from === e.to && o.to === e.from; });
  }

  function anchors(a, b, nudge) {
    var aw = wOf(a), ah = hOf(a), bw = wOf(b), bh = hOf(b);
    var acx = a.x + aw / 2, acy = a.y + ah / 2;
    var bcx = b.x + bw / 2, bcy = b.y + bh / 2;
    var dx = bcx - acx, dy = bcy - acy;
    var p;
    if (Math.abs(dy) >= Math.abs(dx)) {
      p = dy > 0
        ? { x1: acx, y1: a.y + ah, x2: bcx, y2: b.y, v: true }
        : { x1: acx, y1: a.y, x2: bcx, y2: b.y + bh, v: true };
    } else {
      p = dx > 0
        ? { x1: a.x + aw, y1: acy, x2: b.x, y2: bcy, v: false }
        : { x1: a.x, y1: acy, x2: b.x + bw, y2: bcy, v: false };
    }
    return nudge ? offset(p, nudge) : p;
  }

  /* Shift a line sideways by `n`, along its own perpendicular rather than along
     an axis. Nudging purely in x (or y) only gives the full separation when the
     line happens to be axis-aligned: the perpendicular gap falls away with the
     tilt, and on a steep diagonal a 14px nudge measured barely 7px, so one half
     of a two-way pair sat under the other. This keeps the gap identical at any
     angle. */
  function offset(p, n) {
    var dx = p.x2 - p.x1, dy = p.y2 - p.y1;
    var len = Math.sqrt(dx * dx + dy * dy);
    if (!len) return p;
    var ox = (-dy / len) * n, oy = (dx / len) * n;
    return { x1: p.x1 + ox, y1: p.y1 + oy, x2: p.x2 + ox, y2: p.y2 + oy, v: p.v };
  }

  /* Control points for the arrow, kept as data so a label can be positioned
     along the actual curve rather than guessed at from the straight line. */
  function control(p) {
    var k = Math.min(90, Math.max(24, Math.abs(p.v ? p.y2 - p.y1 : p.x2 - p.x1) / 2));
    var s = (p.v ? p.y2 > p.y1 : p.x2 > p.x1) ? k : -k;
    return p.v
      ? [{ x: p.x1, y: p.y1 }, { x: p.x1, y: p.y1 + s },
         { x: p.x2, y: p.y2 - s }, { x: p.x2, y: p.y2 }]
      : [{ x: p.x1, y: p.y1 }, { x: p.x1 + s, y: p.y1 },
         { x: p.x2 - s, y: p.y2 }, { x: p.x2, y: p.y2 }];
  }

  function curve(p) {
    var c = control(p);
    return 'M' + c[0].x + ' ' + c[0].y + 'C' + c[1].x + ' ' + c[1].y +
      ' ' + c[2].x + ' ' + c[2].y + ' ' + c[3].x + ' ' + c[3].y;
  }

  function atT(c, t) {
    var u = 1 - t;
    var a = u * u * u, b = 3 * u * u * t, d = 3 * u * t * t, e = t * t * t;
    return {
      x: a * c[0].x + b * c[1].x + d * c[2].x + e * c[3].x,
      y: a * c[0].y + b * c[1].y + d * c[2].y + e * c[3].y
    };
  }

  /* Arrow colour follows the DESTINATION, not the source: what matters when
     you look at this map is whether a route ends somewhere urgent. */
  /* Widths went up across the board: at the zoom the map sits at, the old ones
     rendered barely more than a hairline, which is also why the flow dashes were
     too subtle to read. A focused arrow gets thicker again, and a block's grey
     arrow darkens to navy when focused — white dashes on pale grey were the
     worst case of all, and those are exactly the arrows you look at after
     clicking a block. */
  function edgeTone(e, focused) {
    var to = byId(e.to);
    if (to && to.kind === 'crisis') {
      return { c: 'var(--red)', halo: 'var(--red-light)', w: 3.6, m: 'aRed' };
    }
    if (to && to.kind === 'urgent') {
      return { c: 'var(--amber)', halo: 'var(--amber-light)', w: 3.4, m: 'aAmber' };
    }
    if (e.kind === 'topic' || e.kind === 'shared') {
      return focused
        ? { c: 'var(--navy-600)', halo: 'var(--navy-100)', w: 2.8, m: 'aNavy' }
        : { c: 'var(--navy-300)', halo: 'var(--navy-100)', w: 2.2, m: 'aGrey' };
    }
    return { c: 'var(--navy-600)', halo: 'var(--navy-100)', w: 3, m: 'aNavy' };
  }

  function marker(id, colour) {
    return '<marker id="' + id + '" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6"' +
      ' markerHeight="6" orient="auto-start-reverse">' +
      '<path d="M0 0 L10 5 L0 10 z" fill="' + colour + '"/></marker>';
  }

  /* Is this point behind a box? Labels use it to find clear air. */
  function overBox(x, y) {
    return S.nodes.some(function (n) {
      return x > n.x - 6 && x < n.x + wOf(n) + 6 &&
             y > n.y - 14 && y < n.y + hOf(n) + 6;
    });
  }

  function renderEdges() {
    var defs = '<defs>' +
      marker('aRed', 'var(--red)') + marker('aAmber', 'var(--amber)') +
      marker('aNavy', 'var(--navy-600)') + marker('aGrey', 'var(--navy-300)') +
      '</defs>';

    var parts = [];
    var labels = [];
    var fanned = {};   /* how many labelled arrows already leave this box */
    var focus = focusSet();

    S.edges.forEach(function (e) {
      var a = byId(e.from), b = byId(e.to);
      if (!a || !b) return;
      var selected = S.sel && S.sel.type === 'edge' && S.sel.id === eKey(e);
      var inFocus = focus && focus.edges[eKey(e)];

      /* An arrow out of a shared block is not drawn. Twelve of them fanning
         out of the topics widget was the hairball. The block lists them
         instead, and they are drawn only while that block — or the row, or the
         destination — is under the pointer. Ask, and you see them.

         Unless "All arrows" is on: walking somebody through the whole journey
         needs the complete picture on screen at once, hairball and all, and
         that is a different job from designing it. */
      if (a.locked && !inFocus && !selected && !S.showAll) return;

      /* Each half of a two-way pair keeps to its own right. The offset runs
         along the line's own perpendicular, and the reverse edge points the
         opposite way, so the same positive nudge puts the two on opposite sides
         automatically. Flipping the sign per edge as well — which is what this
         did at first — cancels that out and lands both on top of each other. */
      var two = isTwoWay(e);
      var p = anchors(a, b, two ? 9 : 0);
      var d = curve(p), t = edgeTone(e, inFocus || selected);
      var dim = focus && focus.hovering && !inFocus ? ' class="is-dim"' : '';

      parts.push('<path class="wm-hit" d="' + d + '" data-edge="' + esc(eKey(e)) + '"></path>');
      /* Connected arrows get a soft under-stroke rather than an rgba glow —
         the brand has no overlay tokens, so the light end of the ladder does
         the job. */
      if (inFocus || selected) {
        parts.push('<path d="' + d + '" stroke="' + t.halo + '" stroke-width="' +
          (t.w + 8) + '" stroke-linecap="round"></path>');
      }
      parts.push('<path' + dim + ' d="' + d + '" stroke="' + t.c + '" stroke-width="' +
        (selected || inFocus ? t.w + 1.4 : t.w) + '" marker-end="url(#' + t.m + ')"' +
        (selected ? ' stroke-dasharray="7 4"' : '') + '></path>');

      /* The travelling dashes, on hover only — holding a selection should not
         leave the canvas moving while somebody is reading or typing. */
      if (inFocus && !selected && focus.hovering) {
        parts.push('<path class="wm-flow" d="' + d + '" stroke-width="' +
          (t.w + 0.6).toFixed(1) + '"></path>');
      }

      /* Labels only where the wording is the point — the statements and the
         threat-to-life answers — plus whatever is selected. Every arrow
         labelled is a diagram nobody can read.

         Four arrows leaving the same box at the same angle put four labels in
         the same place, so each one is pushed further along its own curve than
         the last. That fans them out down the bundle instead of stacking them.
         Labels are collected and drawn last so no arrow can cross one. */
      /* No label on an arrow out of a block unless it is the selected one: the
         row already names the destination, and so does the box it lands on, so
         a label there is the same words three times. */
      var show = selected || e.kind === 'answer' || (inFocus && !a.locked);
      if (show && e.label) {
        var i = fanned[e.from] || 0;
        fanned[e.from] = i + 1;
        /* Boxes are HTML sitting above the SVG, so a label whose spot falls
           behind one is rendered as a fragment poking out from either side —
           which reads as a glitch. Try a few points along the curve and give up
           rather than draw half a word; the wording is in the panel regardless. */
        var c = control(p), at = null;
        /* A two-way pair has one edge each way, so both labels get index 0 and
           landed on top of each other. Send each along a different part of the
           curve, matching the side its line took. */
        var base = 0.34 + i * 0.14;
        if (two) base = e.from < e.to ? 0.3 : 0.66;
        var tries = [base, 0.22, 0.5, 0.78, 0.9];
        for (var ti = 0; ti < tries.length; ti++) {
          var cand = atT(c, Math.min(0.92, tries[ti]));
          if (!overBox(cand.x, cand.y)) { at = cand; break; }
        }
        if (at) {
          /* Clamped and shortened: a long label centred near the canvas edge ran
             off it, and the full wording is in the panel anyway. */
          var lx = Math.max(90, Math.min(at.x, CANVAS_W - 90));
          var text = e.label.length > 46 ? e.label.slice(0, 44).trim() + '…' : e.label;
          labels.push('<text class="wm-lab" x="' + lx.toFixed(1) + '" y="' +
            (at.y - 6).toFixed(1) + '" text-anchor="middle">' + esc(text) + '</text>');
        }
      }
    });

    el.edges.setAttribute('viewBox', '0 0 ' + CANVAS_W + ' ' + canvasH);
    el.edges.setAttribute('width', CANVAS_W);
    el.edges.setAttribute('height', canvasH);
    el.edges.innerHTML = defs + parts.join('') + labels.join('');
  }

  /* ── Inspector ────────────────────────────────────────────────────────── */
  function renderSide() {
    if (!S.sel) return sideEmpty();
    if (S.sel.type === 'edge') return sideEdge();
    return sideNode();
  }

  function sideEmpty() {
    el.side.innerHTML =
      '<h2>Nothing selected</h2>' +
      '<p class="wm-hint">Click a box to change its name or its words.</p>' +
      '<div class="wm-locked">' +
        '<p style="margin:0 0 8px"><b>Moving things.</b> Drag a box. Drop it in a different ' +
        'band and it changes band.</p>' +
        '<p style="margin:0 0 8px"><b>Drawing an arrow.</b> Press the small circle at the ' +
        'bottom-right of a box and drag onto another box.</p>' +
        '<p style="margin:0 0 8px"><b>Adding a page.</b> Press <b>+ Add a page</b> at the ' +
        'top, or right-click where you want it.</p>' +
        '<p style="margin:0 0 8px"><b>Removing one.</b> Click it, then Delete this page.</p>' +
        '<p style="margin:0"><b>Grey boxes are shared blocks.</b> The header, footer and ' +
        'topic buttons appear on every page, so they are drawn once with their buttons ' +
        'listed inside. They can still be moved, edited and deleted.</p>' +
      '</div>';
    rt = null;
  }

  function sideEdge() {
    var e = S.edges.filter(function (x) { return eKey(x) === S.sel.id; })[0];
    if (!e) { S.sel = null; return sideEmpty(); }
    var a = byId(e.from), b = byId(e.to);

    var twoWay = isTwoWay(e);
    el.side.innerHTML =
      '<h2>Arrow</h2>' +
      '<p class="wm-hint">' + esc(a.label) + ' &rarr; ' + esc(b.label) +
        (twoWay ? ' <b>&mdash; and back again</b>' : '') + '</p>' +
      (twoWay ? '<p class="wm-hint">These two pages point at each other. On the canvas ' +
        'that is drawn as two lines side by side; hover either page and they pulse in ' +
        'opposite directions.</p>' : '') +
      '<div class="wm-f">' +
        '<label for="eLab">Words on the arrow</label>' +
        '<input type="text" id="eLab" value="' + esc(e.label) + '" ' +
          'placeholder="e.g. I do not feel safe right now">' +
      '</div>' +
      '<p class="wm-hint">This is the wording somebody taps to get from one page to the ' +
        'other — a button, or a link inside a sentence.</p>' +
      '<button class="wm-danger" id="eDel" type="button">Delete this arrow</button>';

    document.getElementById('eLab').addEventListener('input', function () {
      e.label = this.value; renderEdges(); save();
    });
    document.getElementById('eDel').addEventListener('click', function () {
      S.edges = S.edges.filter(function (x) { return eKey(x) !== eKey(e); });
      S.sel = null; render(); save();
      window.NL.toast('Arrow deleted', 'success');
    });
    rt = null;
  }

  /* One row for an arrow in either direction: the name is the button that
     selects it, the × removes it. */
  function arrowRow(e, other, dir) {
    return '<div class="wm-btnrow">' +
      '<button type="button" class="wm-btnrow__t" data-pick="' + esc(eKey(e)) + '">' +
        '<span class="wm-row__d wm-row__d--' + esc(other.kind) + '"></span>' +
        '<span>' + (dir === 'from' ? '&larr; ' : '') + esc(other.label) +
          (e.label ? ' <em>' + esc(e.label) + '</em>' : '') + '</span>' +
      '</button>' +
      '<button type="button" class="wm-mini wm-mini--x" data-drop="' + esc(eKey(e)) + '"' +
        ' title="Remove this arrow" aria-label="Remove this arrow">&times;</button>' +
      '</div>';
  }

  function sideNode() {
    var n = byId(S.sel.id);
    if (!n) { S.sel = null; return sideEmpty(); }

    var outs = out(n.id);
    var inn = S.edges.filter(function (e) { return e.to === n.id; });
    var blocks = S.nodes.filter(function (o) { return o.locked && o.id !== n.id; });

    if (n.locked) {
      /* Twelve topic buttons was never meant to be a ceiling — this is the
         section most likely to grow. So the list is editable: add a button,
         move one up or down (order is what somebody reads down the widget),
         or take one out. Click a row to change its wording. */
      var spare = S.nodes.filter(function (o) {
        return o.id !== n.id && !outs.some(function (e) { return e.to === o.id; });
      }).sort(function (a, b) { return a.label.localeCompare(b.label); });
      var pages = S.nodes.filter(function (o) { return !o.locked; })
        .sort(function (a, b) { return a.label.localeCompare(b.label); });
      var carriers = pages.filter(function (o) { return o.shows.indexOf(n.id) > -1; });

      el.side.innerHTML =
        '<h2>' + esc(n.label) + '</h2>' +
        '<p class="wm-hint">A shared block: one component that appears on every page.</p>' +

        '<div class="wm-f">' +
          '<label for="nLab">Name on the block</label>' +
          '<input type="text" id="nLab" value="' + esc(n.label) + '">' +
        '</div>' +

        '<div class="wm-f">' +
