<!DOCTYPE html>
<!--
  NL Tools — Wellbeing map
  Version: v1.1 (30/07/2026)
  File: /wellbeing-map/index.html

  An editable map of the public Wellbeing section: every page as a box, every
  route as an arrow, and the page's own words inside the box. Built so that
  Martyn and Benny can reshape the structure and rewrite the copy without
  going near any code, then send the result back as one file.

  WHAT THIS PAGE IS NOT
  It is not connected to the live site. Nothing typed here changes
  /wellbeing/. Richard applies changes by hand. That is deliberate: a
  sketchpad that could publish would need auth, an audit trail and a review
  step, and none of that is what this is for.

  NOT GATED. There is no auth-guard, no Firebase and no RTDB — same as
  /wellbeing/ and /club-contacts/. It carries noindex, nofollow because the
  copy inside it is draft, and some of it is about suicide and self-harm.
  Anybody with the URL can open it, which is a decision taken knowingly:
  the two people who need it do not have to think about logging in.

  WHERE THE STARTING MAP COMES FROM
  wellbeing-map/seed.json, generated by scripts/build-wellbeing-map.js from
  the real markup of wellbeing/index.html. Re-run that script whenever the
  live section changes so the map keeps starting from reality. Reset goes
  back to that seed.

  WHAT IS DELIBERATELY LEFT OUT OF THE DIAGRAM
  Drawn literally, the section has 200-plus links, almost all of them the same
  three shared blocks repeated on fifteen pages. They are drawn once here, as
  locked boxes, with a flag on each page saying it shows them. What is left is
  the ten or so links somebody actually chose to write, which is the flow
  worth arguing about.

  CANON
  Brand tokens from /system/nl-brand.css and helpers from /system/nl-utils.js.
  The copy editor is NL.richText — bold, italic, bullets, links, nothing else,
  with paste forced to plain text. Dialogs are NL.confirm / NL.modal, never
  native confirm(). No colour here is a raw hex value.

  CHANGELOG
  v1.1 (30/07/2026) — Colour now encodes one thing: urgency, on the same
    red/amber/yellow/blue ladder the live site shows a visitor. It previously
    mixed urgency with category, so the palette could not be read as a scale.
    Shared blocks list their own buttons instead of firing arrows at every
    destination — twelve topic arrows was the tangled web this was meant to
    replace — and those arrows are drawn only while the block, a row, or a
    destination is under the pointer. Hovering any box now mutes everything it
    does not touch. In the panel, "Goes to" and "Arrives from" moved above the
    copy. Fit fits both dimensions rather than just the width.
  v1.0 (30/07/2026) — Initial build. Five zones on one canvas, drag with grid
    snap, right-click to add and delete, port-to-port arrows, per-node copy
    editor, tidy, export/import, reset to seed, and an explainer behind (i).
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wellbeing map — The National League</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Internal sketchpad for the structure and copy of the Wellbeing section.">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32x32.png">

  <link rel="stylesheet" href="/system/nl-brand.css?v=26">
  <script src="/system/nl-utils.js?v=27"></script>

  <style>
  /* ── Shell ────────────────────────────────────────────────────────────── */
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--off-white); color: var(--text);
    font-family: var(--font); display: flex; flex-direction: column;
    overflow: hidden;
  }

  .wm-top {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    background: var(--navy); color: var(--white);
    padding: 10px 18px; flex: none;
  }
  .wm-brand { display: flex; align-items: center; gap: 11px; }
  .wm-brand img { width: 30px; height: 30px; object-fit: contain; }
  .wm-brand b {
    display: block; font-weight: 900; font-size: var(--text-base);
    text-transform: uppercase; letter-spacing: var(--tracking-tight); line-height: 1.1;
  }
  .wm-brand span {
    display: block; font-size: var(--text-xs); font-weight: 700;
    text-transform: uppercase; letter-spacing: var(--tracking-wide);
    color: var(--navy-200);
  }
  .wm-status {
    font-size: var(--text-xs); color: var(--navy-200); margin-left: auto;
    white-space: nowrap;
  }
  .wm-status b { color: var(--white); font-weight: 700; }
  .wm-acts { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .wm-btn {
    font-family: inherit; font-size: var(--text-xs); font-weight: 700;
    background: var(--navy-600); color: var(--white);
    border: 1px solid var(--navy-400); border-radius: var(--radius);
    padding: 7px 12px; cursor: pointer; min-height: 34px;
  }
  .wm-btn:hover { background: var(--navy-700); }
  .wm-btn:focus-visible { outline: 2px solid var(--white); outline-offset: 1px; }
  .wm-btn--i { font-weight: 900; width: 34px; padding: 0; }
  .wm-zoom { display: flex; gap: 4px; align-items: center; }
  .wm-zoom .wm-btn { width: 30px; padding: 0; font-size: var(--text-sm); }

  /* The explainer strip is on the page, not behind a button. The people using
     this are not going to hunt for reassurance that they cannot break the
     live site — they need to see it. */
  .wm-say {
    flex: none; margin: 0; padding: 9px 18px;
    background: var(--amber-light); border-bottom: 1px solid var(--amber);
    font-size: var(--text-xs); color: var(--text);
  }
  .wm-say b { font-weight: 900; }

  .wm-body { flex: 1; display: flex; min-height: 0; }

  /* ── Canvas ───────────────────────────────────────────────────────────── */
  .wm-wrap { flex: 1; overflow: auto; position: relative; min-width: 0; }
  .wm-stage { position: relative; }
  .wm-canvas {
    position: relative; transform-origin: 0 0;
    background:
      linear-gradient(var(--navy-50) 1px, transparent 1px) 0 0 / 20px 20px,
      linear-gradient(90deg, var(--navy-50) 1px, transparent 1px) 0 0 / 20px 20px,
      var(--white);
  }

  .wm-band {
    position: absolute; left: 12px; right: 12px;
    border: 1px dashed var(--navy-200); border-radius: var(--radius-lg);
    background: var(--navy-50);
  }
  .wm-band__t {
    position: absolute; top: 10px; left: 16px;
    font-size: var(--text-xs); font-weight: 900; text-transform: uppercase;
    letter-spacing: var(--tracking-wide); color: var(--navy-600);
  }
  .wm-band__h {
    position: absolute; top: 10px; left: 190px; right: 16px;
    font-size: var(--text-xs); color: var(--text-muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .wm-band--locked { background: var(--navy-100); border-style: solid; }

  .wm-edges { position: absolute; inset: 0; overflow: visible; }
  .wm-edges path { fill: none; }
  .wm-hit { stroke: transparent; stroke-width: 16; cursor: pointer; }
  .wm-lab {
    font-family: var(--font); font-size: 11px; font-weight: 700;
    fill: var(--navy-700); paint-order: stroke;
    stroke: var(--white); stroke-width: 4px; stroke-linejoin: round;
    pointer-events: none;
  }

  /* Nodes. Colour carries meaning: red is a threat to life, amber is urgent,
     grey is a shared block that appears on every page.

     Two deliberate departures from how a normal page in this repo is styled,
     both because this is a zoomable diagram rather than a document:

     - The left border is thickened to 6px. The whole border already carries
       the kind colour, but at 0.5 zoom a 2px border renders as one pixel and
       the severity encoding disappears. The rail survives being zoomed out,
       which is the point of colour-coding urgency at all.
     - Type inside a node is fixed px, not the --text-* tokens. Those tokens
       are clamp()ed against the viewport; inside a fixed 180px box on a
       transformed canvas that makes text overflow its box on a wide screen.
       Everything outside the canvas — toolbar, inspector, dialogs — uses the
       tokens as normal. */
  .wm-node {
    position: absolute; box-sizing: border-box;
    width: 180px; min-height: 72px;
    background: var(--white); border: 2px solid var(--navy-300);
    border-left-width: 6px; border-radius: var(--radius);
    padding: 8px 10px 22px; cursor: grab; user-select: none;
    box-shadow: 0 1px 3px var(--navy-100);
  }
  .wm-node:focus-visible { outline: 2px solid var(--navy); outline-offset: 2px; }
  .wm-node.is-drag { cursor: grabbing; box-shadow: var(--shadow); z-index: 30; }
  .wm-node.is-sel { border-color: var(--navy); box-shadow: 0 0 0 3px var(--navy-200); z-index: 20; }
  .wm-node__n {
    font-size: 13px; font-weight: 900; line-height: 1.22; overflow-wrap: break-word;
  }
  .wm-node__k {
    font-size: 10px; font-weight: 700; text-transform: uppercase;
    letter-spacing: var(--tracking-wide); color: var(--text-muted); margin-top: 3px;
  }
  .wm-node__f {
    position: absolute; left: 10px; bottom: 5px;
    display: flex; gap: 5px; align-items: center;
  }
  .wm-chip {
    font-size: 9px; font-weight: 900; line-height: 1;
    padding: 3px 5px; border-radius: var(--radius-sm);
    background: var(--navy-100); color: var(--navy-700);
  }
  .wm-chip--words { background: var(--green-light); color: var(--green); }
  .wm-chip--empty { background: var(--amber-light); color: var(--amber-deep); }

  /* One ladder, one meaning. These are the same four colours the live site
     already shows a visitor on its statements, in the same order, plus two
     deliberately neutral structural kinds. --wm-yellow is a local token for
     the same reason /wellbeing/ declares one: canon has no yellow between
     --amber and --green. Fair canon candidate. */
  :root { --wm-yellow: #efb700; }

  .wm-node--crisis   { border-color: var(--red); }
  .wm-node--urgent   { border-color: var(--amber); }
  .wm-node--everyday { border-color: var(--wm-yellow); }
  .wm-node--other    { border-color: var(--blue); }
  .wm-node--wayin    { border-color: var(--navy); }
  .wm-node--services { border-color: var(--navy-300); }
  .wm-node--shared   { border-color: var(--navy-400); background: var(--navy-50); cursor: default; }
  .wm-node--shared.is-drag { cursor: default; }

  /* A shared block lists its own buttons instead of firing arrows across the
     canvas at each destination. Twelve topic arrows WAS the tangled web — the
     block is the honest picture, because on the real site it is one component
     with a list of buttons in it. Hover the block, or a row, to see where it
     reaches. */
  .wm-node--block { padding-bottom: 8px; }
  .wm-rows { margin-top: 7px; border-top: 1px solid var(--navy-200); }
  .wm-rows--two { display: grid; grid-template-columns: 1fr 1fr; column-gap: 12px; }
  .wm-node__note { margin: 7px 0 0; font-size: 11px; color: var(--text-muted); line-height: 1.3; }
  .wm-row {
    display: flex; align-items: center; gap: 6px;
    padding: 3px 2px; border-bottom: 1px solid var(--navy-100);
    font-size: 11px; line-height: 1.25; cursor: pointer;
  }
  .wm-row:last-child { border-bottom: 0; }
  .wm-row:hover { background: var(--navy-100); }
  .wm-row.is-sel { background: var(--navy-200); }
  .wm-row__d { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--navy-300); }
  .wm-row__d--crisis   { background: var(--red); }
  .wm-row__d--urgent   { background: var(--amber); }
  .wm-row__d--everyday { background: var(--wm-yellow); }
  .wm-row__d--other    { background: var(--blue); }
  .wm-row__d--wayin    { background: var(--navy); }
  .wm-row__t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .wm-row__g { margin-left: auto; color: var(--text-muted); font-weight: 700; }

  /* Hovering a box mutes everything it does not touch. Reading a diagram is
     mostly asking "what does THIS connect to", and dimming answers that
     faster than any amount of arrow-tracing. */
  .wm-node.is-dim { opacity: 0.28; }
  .wm-node.is-lit { box-shadow: 0 0 0 4px var(--navy-100), 0 2px 10px var(--navy-200); }
  .wm-edges .is-dim { opacity: 0.12; }

  /* The port: press it and drag to another box to draw an arrow. */
  .wm-port {
    position: absolute; right: -9px; bottom: -9px;
    width: 20px; height: 20px; border-radius: 50%;
    background: var(--navy); border: 2px solid var(--white);
    cursor: crosshair; display: grid; place-items: center;
    color: var(--white); font-size: 11px; font-weight: 900; line-height: 1;
  }
  .wm-port:hover { background: var(--primary); }
  .wm-node--drop { border-color: var(--green); box-shadow: 0 0 0 3px var(--green-light); }

  /* ── Inspector ────────────────────────────────────────────────────────── */
  .wm-side {
    flex: none; width: 344px; background: var(--white);
    border-left: 1px solid var(--border); overflow-y: auto; padding: 16px;
  }
  .wm-side h2 {
    margin: 0 0 3px; font-size: var(--text-base); font-weight: 900;
  }
  .wm-side .wm-hint { margin: 0 0 16px; font-size: var(--text-xs); color: var(--text-muted); }
  .wm-f { margin-bottom: 13px; }
  /* :not(.wm-check) — a tick box's own <label> is a direct child of .wm-f too,
     and it is a sentence to read, not a field name to scan. */
  .wm-f > label:not(.wm-check) {
    display: block; font-size: var(--text-xs); font-weight: 900;
    text-transform: uppercase; letter-spacing: var(--tracking-wide);
    color: var(--text-muted); margin-bottom: 4px;
  }
  .wm-f input[type=text], .wm-f select {
    width: 100%; box-sizing: border-box; font-family: inherit;
    font-size: var(--text-sm); padding: 8px 10px; color: var(--text);
    border: 1px solid var(--border); border-radius: var(--radius);
    background: var(--white); min-height: 38px;
  }
  .wm-f input[type=text]:focus, .wm-f select:focus {
    outline: none; border-color: var(--navy); box-shadow: var(--focus-ring);
  }
  .wm-check { display: flex; gap: 9px; align-items: flex-start; margin-bottom: 9px; }
  .wm-check input { margin: 2px 0 0; width: 17px; height: 17px; flex: none; }
  .wm-check span { font-size: var(--text-sm); line-height: 1.35; }
  .wm-f .fmt-edit { min-height: 210px; max-height: 460px; overflow-y: auto; }

  .wm-out { display: flex; flex-wrap: wrap; gap: 6px; }
  .wm-out__x {
    display: inline-flex; align-items: center; gap: 6px;
    font-family: inherit; font-size: var(--text-xs); font-weight: 700;
    background: var(--navy-50); color: var(--navy-700);
    border: 1px solid var(--navy-200); border-radius: var(--radius-pill);
    padding: 5px 10px; cursor: pointer;
  }
  .wm-out__x:hover { background: var(--red-light); border-color: var(--red); color: var(--red-deep); }
  .wm-out__x b { font-weight: 900; }

  .wm-live {
    display: inline-block; font-size: var(--text-xs); font-weight: 700;
    color: var(--navy); text-decoration: underline;
    text-decoration-thickness: 2px; text-underline-offset: 2px;
  }
  .wm-danger {
    font-family: inherit; font-size: var(--text-sm); font-weight: 700;
    background: var(--white); color: var(--red-deep);
    border: 1px solid var(--red); border-radius: var(--radius);
    padding: 9px 13px; cursor: pointer; width: 100%; min-height: 40px;
    margin-top: 6px;
  }
  .wm-danger:hover { background: var(--red-light); }
  .wm-locked {
    background: var(--navy-50); border: 1px solid var(--navy-200);
    border-radius: var(--radius); padding: 11px 13px;
    font-size: var(--text-sm); color: var(--text); line-height: 1.4;
  }

  /* ── Right-click menu ─────────────────────────────────────────────────── */
  .wm-ctx {
    position: fixed; z-index: 200; min-width: 196px;
    background: var(--white); border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: var(--shadow); padding: 5px;
    display: none;
  }
  .wm-ctx.is-open { display: block; }
  .wm-ctx button {
    display: block; width: 100%; text-align: left; font-family: inherit;
    font-size: var(--text-sm); background: none; border: 0; cursor: pointer;
    padding: 9px 11px; border-radius: var(--radius-sm); color: var(--text);
    min-height: 38px;
  }
  .wm-ctx button:hover { background: var(--navy-50); }
  .wm-ctx button.is-danger { color: var(--red-deep); }
  .wm-ctx button.is-danger:hover { background: var(--red-light); }
  .wm-ctx p {
    margin: 0; padding: 9px 11px; font-size: var(--text-xs);
    color: var(--text-muted); line-height: 1.4;
  }
  .wm-ctx hr { border: 0; border-top: 1px solid var(--border); margin: 4px 0; }

  .wm-noscript {
    margin: 40px auto; max-width: 560px; padding: 20px;
    background: var(--white); border: 2px solid var(--red);
    border-radius: var(--radius); font-size: var(--text-sm);
  }

  .wm-help h3 { margin: 18px 0 6px; font-size: var(--text-base); font-weight: 900; }
  .wm-help h3:first-child { margin-top: 0; }
  .wm-help p, .wm-help li { font-size: var(--text-sm); line-height: 1.55; }
  .wm-help ul { margin: 6px 0; padding-left: 20px; }
  .wm-help li { margin-bottom: 5px; }

  @media (max-width: 900px) {
    .wm-body { flex-direction: column; }
    .wm-side { width: auto; border-left: 0; border-top: 1px solid var(--border); max-height: 46%; }
  }
  </style>
</head>

<noscript>

<div class="wm-body">

<script>
/* =====================================================================
   Wellbeing map — the whole tool.

   Deliberately one file with no build step, like every other page in this
   repo. It leans on canon for the things canon already does: NL.richText for
   the copy editor, NL.confirm / NL.modal for dialogs, NL.toast for feedback,
   NL.download for the export, NL.sanitiseHtml on every import.
   ===================================================================== */
(function () {
  'use strict';

  /* ── Geometry ─────────────────────────────────────────────────────────── */
  var NODE_W = 180, NODE_H = 72;
  var BLOCK_W = 256, BLOCK_W2 = 310, ROW_H = 18;  /* shared blocks list their buttons */
  var GAP_X = 22, GAP_Y = 20;
  var X0 = 36, BAND_TOP = 34, BAND_BOT = 12, BAND_GAP = 12;
  var PER_ROW = 6, GRID = 20;
  var CANVAS_W = X0 + PER_ROW * (NODE_W + GAP_X);

  var STORE = 'nl-wellbeing-map-v1';
  var SEEN = 'nl-wellbeing-map-seen';
  var ZOOMS = [0.5, 0.6, 0.7, 0.8, 0.9, 1];

  /* Boxes are laid out grouped by kind, in this order, so the urgent routes
     always end up at the top-left of their band.

     Kind is the only thing colour encodes, and it reads as a ladder: not safe
     now, urgent today, everyday support, about someone else. Way in and
     services sit outside the ladder and are neutral on purpose. */
  var KIND_ORDER = ['shared', 'wayin', 'crisis', 'urgent', 'everyday', 'other', 'services'];
  var KIND_LABEL = {
    shared:   'Shared block',
    wayin:    'Way in',
    crisis:   'Not safe now',
    urgent:   'Urgent today',
    everyday: 'Everyday support',
    other:    'About someone else',
    services: 'Services'
  };
  var KIND_OPTION = {
    wayin:    'Way in — navy',
    crisis:   'Not safe now — red',
    urgent:   'Urgent today — amber',
    everyday: 'Everyday support — yellow',
    other:    'About someone else — blue',
    services: 'Services — grey'
  };
  /* Legacy kinds from a map exported before the colours were put on one
     ladder. Without this an old file loses its colours silently. */
  var KIND_ALIAS = { topic: 'everyday', guide: 'everyday', triage: 'wayin' };

  /* ── State ────────────────────────────────────────────────────────────── */
  var S = { zones: [], nodes: [], edges: [], sel: null };
  var seed = null;
  var zoom = 1;
  var canvasH = 600;
  var hoverId = null;         /* box under the pointer — drives the dimming */
  var rt = null;              /* the NL.richText controller, mounted once */
  var saveTimer = null;

  var el = {
    wrap:   document.getElementById('wrap'),
    stage:  document.getElementById('stage'),
    canvas: document.getElementById('canvas'),
    bands:  document.getElementById('bands'),
    edges:  document.getElementById('edges'),
    nodes:  document.getElementById('nodes'),
    side:   document.getElementById('side'),
    ctx:    document.getElementById('ctx'),
    file:   document.getElementById('file'),
    status: document.getElementById('status')
  };

  var esc = function (s) { return window.NL.escHtml(String(s == null ? '' : s)); };
  var byId = function (id) {
    for (var i = 0; i < S.nodes.length; i++) if (S.nodes[i].id === id) return S.nodes[i];
    return null;
  };
  var eKey = function (e) { return e.from + '>' + e.to; };
  var snap = function (n) { return Math.round(n / GRID) * GRID; };
  var out = function (id) {
    return S.edges.filter(function (e) { return e.from === id; });
  };

  /* Shared blocks are wider and as tall as their list of buttons, so every
     bit of geometry has to ask rather than assume.

     Past six buttons the list goes to two columns. That halves the height of
     the topics block — and it is the more faithful picture anyway, because the
     thing it stands for is a grid of cards on the real page, not a list. */
  function colsOf(n) { return n.locked && out(n.id).length > 6 ? 2 : 1; }
  function wOf(n) { return n.locked ? (colsOf(n) === 2 ? BLOCK_W2 : BLOCK_W) : NODE_W; }
  function hOf(n) {
    if (!n.locked) return NODE_H;
    var rows = Math.ceil(Math.max(out(n.id).length, 1) / colsOf(n));
    return 52 + rows * ROW_H + 8;
  }

  /* ── Persistence ──────────────────────────────────────────────────────── */
  function stamp(text) { el.status.innerHTML = text; }

  function save() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      try {
        localStorage.setItem(STORE, JSON.stringify(payload()));
        var t = new Date();
        stamp('Saved in this browser · <b>' +
          String(t.getHours()).padStart(2, '0') + ':' +
          String(t.getMinutes()).padStart(2, '0') + '</b>');
      } catch (err) {
        stamp('<b>Not saved</b> — this browser refused. Export to be safe.');
      }
    }, 350);
  }

  function payload() {
    return {
      format: 'nl-wellbeing-map',
      formatVersion: 1,
      savedAt: new Date().toISOString(),
      zones: S.zones,
      nodes: S.nodes,
      edges: S.edges
    };
  }

  /* Everything arriving from outside — the seed, localStorage, an imported
     file — comes through here. Copy is sanitised, geometry is made sane, and
     edges pointing at boxes that do not exist are dropped. */
  function adopt(data, opts) {
    opts = opts || {};
    var zones = Array.isArray(data.zones) && data.zones.length ? data.zones : S.zones;
    var nodes = (data.nodes || []).map(function (n) {
      return {
        id: String(n.id),
        zone: n.zone || 'flow',
        kind: n.kind || 'topic',
        locked: !!n.locked,
        title: n.title || n.label || n.id,
        label: n.label || n.title || n.id,
        hash: n.hash || null,
        kicker: n.kicker || '',
        body: window.NL.sanitiseHtml(n.body || ''),
        nextStep: !!n.nextStep,
        showsTopics: n.showsTopics !== false,
        showsFooter: n.showsFooter !== false,
        x: typeof n.x === 'number' ? n.x : null,
        y: typeof n.y === 'number' ? n.y : null
      };
    });
    var have = {};
    nodes.forEach(function (n) { have[n.id] = 1; });

    var seen = {};
    var edges = (data.edges || []).filter(function (e) {
      if (!have[e.from] || !have[e.to] || e.from === e.to) return false;
      var k = e.from + '>' + e.to;
      if (seen[k]) return false;
      seen[k] = 1;
      return true;
    }).map(function (e) {
      return { from: e.from, to: e.to, label: e.label || '', kind: e.kind || 'editorial' };
    });

    S.zones = zones; S.nodes = nodes; S.edges = edges; S.sel = null;
    if (opts.tidy || nodes.some(function (n) { return n.x === null; })) tidy();
  }

  /* ── Layout ───────────────────────────────────────────────────────────── */

  /* Boxes are ordered by kind so the urgent routes always end up top-left,
     then packed greedily into rows. Packing matters more than it sounds: a
     row per kind made the canvas 1400px tall, which means a map you have to
     scroll to see, which defeats the object of drawing it. The one forced
     break is before the topics, so the ten of them read as a block rather
     than trailing off the end of the crisis pages. */
  function rowsFor(nodes) {
    var byKind = function (n) {
      var i = KIND_ORDER.indexOf(n.kind);
      return i === -1 ? KIND_ORDER.length : i;
    };
    var sorted = nodes.slice().sort(function (a, b) {
      return byKind(a) - byKind(b) || a.label.localeCompare(b.label);
    });
    var lead = sorted.filter(function (n) { return n.kind !== 'topic'; });
    var topics = sorted.filter(function (n) { return n.kind === 'topic'; });

    var rows = [];
    [lead, topics].forEach(function (group) {
      var rest = group.slice();
      while (rest.length) rows.push(rest.splice(0, PER_ROW));
    });
    return rows;
  }

  function tidy() {
    var y = 14;
    S.zones.forEach(function (z) {
      var rows = rowsFor(S.nodes.filter(function (n) { return n.zone === z.id; }));

      var rowY = y + BAND_TOP;
      rows.forEach(function (row) {
        var x = X0, tallest = 0;
        row.forEach(function (n) {
          n.x = x; n.y = rowY;
          x += wOf(n) + GAP_X;
          tallest = Math.max(tallest, hOf(n));
        });
        rowY += tallest + GAP_Y;
      });

      z._top = y;
      z._h = Math.max(rowY - GAP_Y, y + BAND_TOP + NODE_H) - y + BAND_BOT;
      y += z._h + BAND_GAP;
    });
    canvasH = y + 14;
  }

  /* Bands are only recomputed on tidy; dragging a box into another band
     changes which zone it belongs to but must not shuffle everything else. */
  function measureBands() {
    var y = 14;
    S.zones.forEach(function (z) {
      var mine = S.nodes.filter(function (n) { return n.zone === z.id; });
      var top = mine.length ? Math.min.apply(null, mine.map(function (n) { return n.y; })) : y + BAND_TOP;
      var bot = mine.length ? Math.max.apply(null, mine.map(function (n) { return n.y + hOf(n); })) : top;
      z._top = Math.min(z._top == null ? top - BAND_TOP : z._top, top - BAND_TOP);
      z._h = Math.max(z._h || 0, bot - z._top + BAND_BOT);
      y = z._top + z._h + BAND_GAP;
    });
    canvasH = Math.max(canvasH, y + 14);
  }

  function zoneAt(cy) {
    var best = S.zones[S.zones.length - 1];
    for (var i = 0; i < S.zones.length; i++) {
      var z = S.zones[i];
      if (cy >= z._top && cy <= z._top + z._h) return z;
      if (cy < z._top) { best = z; break; }
    }
    return best;
  }

  /* ── Render ───────────────────────────────────────────────────────────── */
  function applyZoom() {
    el.canvas.style.width = CANVAS_W + 'px';
    el.canvas.style.height = canvasH + 'px';
    el.canvas.style.transform = 'scale(' + zoom + ')';
    el.stage.style.width = Math.round(CANVAS_W * zoom) + 'px';
    el.stage.style.height = Math.round(canvasH * zoom) + 'px';
  }

  function render() {
    measureBands();
    renderBands();
    renderNodes();
    renderEdges();
    applyZoom();
    renderSide();
  }

  function renderBands() {
    el.bands.innerHTML = S.zones.map(function (z) {
      var locked = z.id === 'header' || z.id === 'footer' || z.id === 'topicsnav';
      return '<div class="wm-band' + (locked ? ' wm-band--locked' : '') + '"' +
        ' style="top:' + z._top + 'px;height:' + z._h + 'px">' +
        '<span class="wm-band__t">' + esc(z.label) + '</span>' +
        '<span class="wm-band__h">' + esc(z.hint || '') + '</span>' +
        '</div>';
    }).join('');
  }

  /* Which boxes and arrows the current hover or selection touches. Everything
     else gets dimmed. */
  function focusSet() {
    var id = hoverId || (S.sel && S.sel.type === 'node' ? S.sel.id : null);
    if (!id) return null;
    var nodes = {}, edges = {};
    nodes[id] = 'self';
    S.edges.forEach(function (e) {
      if (e.from === id) { edges[eKey(e)] = 1; nodes[e.to] = nodes[e.to] || 'to'; }
      if (e.to === id) { edges[eKey(e)] = 1; nodes[e.from] = nodes[e.from] || 'from'; }
    });
    return { id: id, nodes: nodes, edges: edges };
  }

  function renderNodes() {
    var focus = focusSet();

    el.nodes.innerHTML = S.nodes.map(function (n) {
      var selected = S.sel && S.sel.type === 'node' && S.sel.id === n.id;
      var words = textLen(n.body);
      var state = '';
      if (focus) state = focus.nodes[n.id] ? (focus.nodes[n.id] === 'self' ? '' : ' is-lit') : ' is-dim';

      var body;
      if (n.locked) {
        /* A block lists its buttons. Each row is the arrow, so it is clickable
           and deletable exactly like an arrow on the canvas. */
        var rows = out(n.id);
        body =
          '<div class="wm-node__n">' + esc(n.label) + '</div>' +
          '<div class="wm-node__k">On every page · ' + rows.length +
            (rows.length === 1 ? ' button' : ' buttons') + '</div>' +
          '<div class="wm-rows' + (colsOf(n) === 2 ? ' wm-rows--two' : '') + '">' +
          (rows.length ? rows.map(function (e) {
            var to = byId(e.to);
            var rSel = S.sel && S.sel.type === 'edge' && S.sel.id === eKey(e);
            return '<div class="wm-row' + (rSel ? ' is-sel' : '') + '" data-row="' +
              esc(eKey(e)) + '" title="' + esc((e.label || to.label) + ' → ' + to.label) + '">' +
              '<span class="wm-row__d wm-row__d--' + esc(to.kind) + '"></span>' +
              '<span class="wm-row__t">' + esc(e.label || to.label) + '</span>' +
              '<span class="wm-row__g">&rarr;</span>' +
              '</div>';
          }).join('') : '<p class="wm-node__note">Nothing links out of this block</p>') +
          '</div>';
      } else {
        body =
          '<div class="wm-node__n">' + esc(n.label) + '</div>' +
          '<div class="wm-node__k">' + esc(KIND_LABEL[n.kind] || n.kind) + '</div>' +
          '<div class="wm-node__f">' +
            '<span class="wm-chip ' + (words ? 'wm-chip--words' : 'wm-chip--empty') + '">' +
              (words ? words + ' words' : 'No words yet') + '</span>' +
            (n.showsTopics ? '<span class="wm-chip">Topics</span>' : '') +
          '</div>' +
          '<span class="wm-port" data-port="' + esc(n.id) +
            '" title="Drag to another box to draw an arrow">&#8599;</span>';
      }

      return '<div class="wm-node wm-node--' + esc(n.kind) + (n.locked ? ' wm-node--block' : '') +
        (selected ? ' is-sel' : '') + state + '"' +
        ' data-id="' + esc(n.id) + '" tabindex="0" role="button"' +
        ' aria-label="' + esc(n.label) + ', ' + esc(KIND_LABEL[n.kind] || n.kind) + '"' +
        ' style="left:' + n.x + 'px;top:' + n.y + 'px;width:' + wOf(n) + 'px' +
        (n.locked ? '' : ';min-height:' + NODE_H + 'px') + '">' +
        body + '</div>';
    }).join('');
  }

  function textLen(html) {
    var d = document.createElement('div');
    d.innerHTML = html || '';
    var t = (d.textContent || '').trim();
    return t ? t.split(/\s+/).length : 0;
  }

  function anchors(a, b) {
    var aw = wOf(a), ah = hOf(a), bw = wOf(b), bh = hOf(b);
    var acx = a.x + aw / 2, acy = a.y + ah / 2;
    var bcx = b.x + bw / 2, bcy = b.y + bh / 2;
    var dx = bcx - acx, dy = bcy - acy;
    if (Math.abs(dy) >= Math.abs(dx)) {
      return dy > 0
        ? { x1: acx, y1: a.y + ah, x2: bcx, y2: b.y, v: true }
        : { x1: acx, y1: a.y, x2: bcx, y2: b.y + bh, v: true };
    }
    return dx > 0
      ? { x1: a.x + aw, y1: acy, x2: b.x, y2: bcy, v: false }
      : { x1: a.x, y1: acy, x2: b.x + bw, y2: bcy, v: false };
  }

  /* Control points for the arrow, kept as data so a label can be positioned
     along the actual curve rather than guessed at from the straight line. */
  function control(p) {
    var k = Math.min(90, Math.max(24, Math.abs(p.v ? p.y2 - p.y1 : p.x2 - p.x1) / 2));
    var s = (p.v ? p.y2 > p.y1 : p.x2 > p.x1) ? k : -k;
    return p.v
      ? [{ x: p.x1, y: p.y1 }, { x: p.x1, y: p.y1 + s },
         { x: p.x2, y: p.y2 - s }, { x: p.x2, y: p.y2 }]
      : [{ x: p.x1, y: p.y1 }, { x: p.x1 + s, y: p.y1 },
         { x: p.x2 - s, y: p.y2 }, { x: p.x2, y: p.y2 }];
  }

  function curve(p) {
    var c = control(p);
    return 'M' + c[0].x + ' ' + c[0].y + 'C' + c[1].x + ' ' + c[1].y +
      ' ' + c[2].x + ' ' + c[2].y + ' ' + c[3].x + ' ' + c[3].y;
  }

  function atT(c, t) {
    var u = 1 - t;
    var a = u * u * u, b = 3 * u * u * t, d = 3 * u * t * t, e = t * t * t;
    return {
      x: a * c[0].x + b * c[1].x + d * c[2].x + e * c[3].x,
      y: a * c[0].y + b * c[1].y + d * c[2].y + e * c[3].y
    };
  }

  /* Arrow colour follows the DESTINATION, not the source: what matters when
     you look at this map is whether a route ends somewhere urgent. */
  function edgeTone(e) {
    var to = byId(e.to);
    if (to && to.kind === 'crisis') {
      return { c: 'var(--red)', halo: 'var(--red-light)', w: 2.6, m: 'aRed' };
    }
    if (to && to.kind === 'urgent') {
      return { c: 'var(--amber)', halo: 'var(--amber-light)', w: 2.4, m: 'aAmber' };
    }
    if (e.kind === 'topic' || e.kind === 'shared') {
      return { c: 'var(--navy-300)', halo: 'var(--navy-100)', w: 1.5, m: 'aGrey' };
    }
    return { c: 'var(--navy-600)', halo: 'var(--navy-100)', w: 2, m: 'aNavy' };
  }

  function marker(id, colour) {
    return '<marker id="' + id + '" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6"' +
      ' markerHeight="6" orient="auto-start-reverse">' +
      '<path d="M0 0 L10 5 L0 10 z" fill="' + colour + '"/></marker>';
  }

  function renderEdges() {
    var defs = '<defs>' +
      marker('aRed', 'var(--red)') + marker('aAmber', 'var(--amber)') +
      marker('aNavy', 'var(--navy-600)') + marker('aGrey', 'var(--navy-300)') +
      '</defs>';

    var parts = [];
    var labels = [];
    var fanned = {};   /* how many labelled arrows already leave this box */
    var focus = focusSet();

    S.edges.forEach(function (e) {
      var a = byId(e.from), b = byId(e.to);
      if (!a || !b) return;
      var selected = S.sel && S.sel.type === 'edge' && S.sel.id === eKey(e);
      var inFocus = focus && focus.edges[eKey(e)];

      /* An arrow out of a shared block is not drawn. Twelve of them fanning
         out of the topics widget was the hairball. The block lists them
         instead, and they are drawn only while that block — or the row, or the
         destination — is under the pointer. Ask, and you see them. */
      if (a.locked && !inFocus && !selected) return;

      var p = anchors(a, b), d = curve(p), t = edgeTone(e);
      var dim = focus && !inFocus ? ' class="is-dim"' : '';

      parts.push('<path class="wm-hit" d="' + d + '" data-edge="' + esc(eKey(e)) + '"></path>');
      /* Connected arrows get a soft under-stroke rather than an rgba glow —
         the brand has no overlay tokens, so the light end of the ladder does
         the job. */
      if (inFocus || selected) {
        parts.push('<path d="' + d + '" stroke="' + t.halo + '" stroke-width="' +
          (t.w + 6) + '" stroke-linecap="round"></path>');
      }
      parts.push('<path' + dim + ' d="' + d + '" stroke="' + t.c + '" stroke-width="' +
        (selected || inFocus ? t.w + 1 : t.w) + '" marker-end="url(#' + t.m + ')"' +
        (selected ? ' stroke-dasharray="7 4"' : '') + '></path>');

      /* Labels only where the wording is the point — the statements and the
         threat-to-life answers — plus whatever is selected. Every arrow
         labelled is a diagram nobody can read.

         Four arrows leaving the same box at the same angle put four labels in
         the same place, so each one is pushed further along its own curve than
         the last. That fans them out down the bundle instead of stacking them.
         Labels are collected and drawn last so no arrow can cross one. */
      /* No label on an arrow out of a block unless it is the selected one: the
         row already names the destination, and so does the box it lands on, so
         a label there is the same words three times. */
      var show = selected || e.kind === 'answer' || (inFocus && !a.locked);
      if (show && e.label) {
        var i = fanned[e.from] || 0;
        fanned[e.from] = i + 1;
        var at = atT(control(p), Math.min(0.82, 0.34 + i * 0.14));
        labels.push('<text class="wm-lab" x="' + at.x.toFixed(1) + '" y="' +
          (at.y - 6).toFixed(1) + '" text-anchor="middle">' + esc(e.label) + '</text>');
      }
    });

    el.edges.setAttribute('viewBox', '0 0 ' + CANVAS_W + ' ' + canvasH);
    el.edges.setAttribute('width', CANVAS_W);
    el.edges.setAttribute('height', canvasH);
    el.edges.innerHTML = defs + parts.join('') + labels.join('');
  }

  /* ── Inspector ────────────────────────────────────────────────────────── */
  function renderSide() {
    if (!S.sel) return sideEmpty();
    if (S.sel.type === 'edge') return sideEdge();
    return sideNode();
  }

  function sideEmpty() {
    el.side.innerHTML =
      '<h2>Nothing selected</h2>' +
      '<p class="wm-hint">Click a box to change its name or its words.</p>' +
      '<div class="wm-locked">' +
        '<p style="margin:0 0 8px"><b>Moving things.</b> Drag a box. Drop it in a different ' +
        'band and it changes band.</p>' +
        '<p style="margin:0 0 8px"><b>Drawing an arrow.</b> Press the small circle at the ' +
        'bottom-right of a box and drag onto another box.</p>' +
        '<p style="margin:0 0 8px"><b>Adding or removing.</b> Right-click anywhere.</p>' +
        '<p style="margin:0"><b>Grey boxes are locked.</b> The header, footer and topic ' +
        'buttons appear on every page, so they are drawn once and cannot be moved.</p>' +
      '</div>';
    rt = null;
  }

  function sideEdge() {
    var e = S.edges.filter(function (x) { return eKey(x) === S.sel.id; })[0];
    if (!e) { S.sel = null; return sideEmpty(); }
    var a = byId(e.from), b = byId(e.to);

    el.side.innerHTML =
      '<h2>Arrow</h2>' +
      '<p class="wm-hint">' + esc(a.label) + ' &rarr; ' + esc(b.label) + '</p>' +
      '<div class="wm-f">' +
        '<label for="eLab">Words on the arrow</label>' +
        '<input type="text" id="eLab" value="' + esc(e.label) + '" ' +
          'placeholder="e.g. I do not feel safe right now">' +
      '</div>' +
      '<p class="wm-hint">This is the wording somebody taps to get from one page to the ' +
        'other — a button, or a link inside a sentence.</p>' +
      '<button class="wm-danger" id="eDel" type="button">Delete this arrow</button>';

    document.getElementById('eLab').addEventListener('input', function () {
      e.label = this.value; renderEdges(); save();
    });
    document.getElementById('eDel').addEventListener('click', function () {
      S.edges = S.edges.filter(function (x) { return eKey(x) !== eKey(e); });
      S.sel = null; render(); save();
      window.NL.toast('Arrow deleted', 'success');
    });
    rt = null;
  }

  function sideNode() {
    var n = byId(S.sel.id);
    if (!n) { S.sel = null; return sideEmpty(); }

    var outs = out(n.id);
    var inn = S.edges.filter(function (e) { return e.to === n.id; });

    if (n.locked) {
      el.side.innerHTML =
        '<h2>' + esc(n.label) + '</h2>' +
        '<p class="wm-hint">A shared block. Locked.</p>' +
        '<div class="wm-locked">' + n.body + '</div>' +
        '<div class="wm-f" style="margin-top:14px">' +
          '<label>Goes to</label>' +
          '<div class="wm-out">' + (outs.length ? outs.map(function (e) {
            return '<span class="wm-out__x" style="cursor:default"><b>' +
              esc(byId(e.to).label) + '</b></span>';
          }).join('') : '<span class="wm-hint">Nowhere</span>') + '</div>' +
        '</div>' +
        '<p class="wm-hint">This block is on every page, so it is drawn once. To change ' +
          'which pages show it, click a page box and use its tick boxes.</p>';
      rt = null;
      return;
    }

    el.side.innerHTML =
      '<h2>Page</h2>' +
      '<p class="wm-hint">' + (n.hash
        ? 'Live now at <a class="wm-live" href="/wellbeing/' + esc(n.hash) +
          '" target="_blank" rel="noopener">/wellbeing/' + esc(n.hash) + '</a>'
        : 'A new page. It does not exist on the live site yet.') + '</p>' +

      '<div class="wm-f">' +
        '<label for="nLab">Name on the box</label>' +
        '<input type="text" id="nLab" value="' + esc(n.label) + '">' +
      '</div>' +

      '<div class="wm-f">' +
        '<label for="nTitle">Heading on the page</label>' +
        '<input type="text" id="nTitle" value="' + esc(n.title) + '">' +
      '</div>' +

      '<div class="wm-f">' +
        '<label for="nKicker">Small label above the heading</label>' +
        '<input type="text" id="nKicker" value="' + esc(n.kicker) + '" placeholder="e.g. Topic">' +
      '</div>' +

      '<div class="wm-f">' +
        '<label for="nKind">How urgent is this page</label>' +
        '<select id="nKind">' + KIND_ORDER.filter(function (k) { return k !== 'shared'; })
          .map(function (k) {
            return '<option value="' + k + '"' + (n.kind === k ? ' selected' : '') + '>' +
              esc(KIND_OPTION[k] || KIND_LABEL[k]) + '</option>';
          }).join('') + '</select>' +
      '</div>' +

      '<div class="wm-f">' +
        '<label for="nZone">Which band</label>' +
        '<select id="nZone">' + S.zones.map(function (z) {
          return '<option value="' + esc(z.id) + '"' + (n.zone === z.id ? ' selected' : '') + '>' +
            esc(z.label) + '</option>';
        }).join('') + '</select>' +
      '</div>' +

      /* Where it goes sits above the words. Structure is what these two are
         here to argue about; the copy is long, and scrolling past it to find
         the connections buried the point. */
      '<div class="wm-f">' +
        '<label>Goes to</label>' +
        '<div class="wm-out" id="outs">' + (outs.length ? outs.map(function (e) {
          return '<button class="wm-out__x" type="button" data-drop="' + esc(eKey(e)) + '">' +
            '<b>' + esc(byId(e.to).label) + '</b> &times;</button>';
        }).join('') : '<span class="wm-hint">Nowhere yet. Drag from the circle on the box.</span>') +
        '</div>' +
      '</div>' +

      '<div class="wm-f">' +
        '<label>Arrives from</label>' +
        '<div class="wm-out">' + (inn.length ? inn.map(function (e) {
          return '<span class="wm-out__x" style="cursor:default"><b>' +
            esc(byId(e.from).label) + '</b></span>';
        }).join('') : '<span class="wm-hint">Nothing points here</span>') + '</div>' +
      '</div>' +

      '<div class="wm-f">' +
        '<label>Shared blocks on this page</label>' +
        '<label class="wm-check"><input type="checkbox" id="nTopics"' +
          (n.showsTopics ? ' checked' : '') + '><span>Shows the topic buttons</span></label>' +
        '<label class="wm-check"><input type="checkbox" id="nNext"' +
          (n.nextStep ? ' checked' : '') + '><span>Shows the &ldquo;Your next step&rdquo; box</span></label>' +
        '<label class="wm-check"><input type="checkbox" id="nFoot"' +
          (n.showsFooter ? ' checked' : '') + '><span>Shows the footer numbers</span></label>' +
      '</div>' +

      '<div class="wm-f">' +
        '<label>The words on this page</label>' +
        '<div id="rtMount"></div>' +
      '</div>' +

      '<button class="wm-danger" id="nDel" type="button">Delete this page</button>';

    /* Wiring. Text fields update as you type; the box on the canvas keeps up. */
    document.getElementById('nLab').addEventListener('input', function () {
      n.label = this.value; renderNodes(); renderEdges(); save();
    });
    document.getElementById('nTitle').addEventListener('input', function () {
      n.title = this.value; save();
    });
    document.getElementById('nKicker').addEventListener('input', function () {
      n.kicker = this.value; save();
    });
    document.getElementById('nKind').addEventListener('change', function () {
      n.kind = this.value; renderNodes(); renderEdges(); save();
    });
    document.getElementById('nZone').addEventListener('change', function () {
      n.zone = this.value; tidy(); render(); save();
    });
    ['nTopics:showsTopics', 'nNext:nextStep', 'nFoot:showsFooter'].forEach(function (pair) {
      var bits = pair.split(':');
      document.getElementById(bits[0]).addEventListener('change', function () {
        n[bits[1]] = this.checked; renderNodes(); save();
      });
    });
    Array.prototype.forEach.call(el.side.querySelectorAll('[data-drop]'), function (b) {
      b.addEventListener('click', function () {
        var k = b.getAttribute('data-drop');
        S.edges = S.edges.filter(function (x) { return eKey(x) !== k; });
        render(); save();
      });
    });
    document.getElementById('nDel').addEventListener('click', function () { removeNode(n.id); });

    rt = window.NL.richText(document.getElementById('rtMount'), {
      value: n.body,
      compact: true,
      placeholder: 'The words that go on this page…',
      onChange: function (clean) { n.body = clean; renderNodes(); save(); }
    });
  }

  /* ── Mutations ────────────────────────────────────────────────────────── */
  function freshId(base) {
    var slug = (base || 'new-page').toLowerCase().replace(/[^a-z0-9]+/g, '-')
      .replace(/^-|-$/g, '') || 'new-page';
    var id = slug, i = 2;
    while (byId(id)) { id = slug + '-' + i; i++; }
    return id;
  }

  function addNode(cx, cy) {
    var z = zoneAt(cy);
    var n = {
      id: freshId('new-page'), zone: z.id,
      kind: z.id === 'flow' ? 'topic' : 'guide',
      locked: false, title: 'New page', label: 'New page', hash: null, kicker: '',
      body: '', nextStep: true, showsTopics: true, showsFooter: true,
      x: Math.max(8, Math.min(snap(cx - NODE_W / 2), CANVAS_W - NODE_W - 8)),
      y: Math.max(8, snap(cy - NODE_H / 2))
    };
    S.nodes.push(n);
    S.sel = { type: 'node', id: n.id };
    render(); save();
    var f = document.getElementById('nLab');
    if (f) { f.focus(); f.select(); }
    window.NL.toast('New page added — give it a name', 'success');
  }

  function duplicateNode(id) {
    var src = byId(id);
    if (!src || src.locked) return;
    var copy = JSON.parse(JSON.stringify(src));
    copy.id = freshId(src.label + ' copy');
    copy.label = src.label + ' (copy)';
    copy.hash = null;
    copy.x = Math.min(src.x + GRID * 2, CANVAS_W - NODE_W - 8);
    copy.y = src.y + GRID * 2;
    S.nodes.push(copy);
    S.sel = { type: 'node', id: copy.id };
    render(); save();
  }

  function removeNode(id) {
    var n = byId(id);
    if (!n) return;
    if (n.locked) {
      window.NL.toast('Shared blocks cannot be deleted', 'error');
      return;
    }
    var links = S.edges.filter(function (e) { return e.from === id || e.to === id; }).length;
    window.NL.confirm(
      'Delete "' + n.label + '"?',
      {
        title: 'Delete page',
        detail: links
          ? links + (links === 1 ? ' arrow' : ' arrows') + ' will go with it.'
          : 'It has no arrows attached.',
        confirmText: 'Delete'
      }
    ).then(function (ok) {
      if (!ok) return;
      S.nodes = S.nodes.filter(function (x) { return x.id !== id; });
      S.edges = S.edges.filter(function (e) { return e.from !== id && e.to !== id; });
      S.sel = null; render(); save();
      window.NL.toast('Page deleted', 'success');
    });
  }

  function connect(from, to) {
    if (from === to) return;
    if (S.edges.some(function (e) { return e.from === from && e.to === to; })) {
      window.NL.toast('That arrow already exists', 'error');
      return;
    }
    var src = byId(from);
    S.edges.push({
      from: from, to: to, label: '',
      kind: src && src.locked ? 'shared' : 'editorial'
    });
    S.sel = { type: 'edge', id: from + '>' + to };
    render(); save();
  }

  /* ── Dragging a box, and dragging an arrow out of one ──────────────────── */
  var drag = null;

  function canvasPoint(ev) {
    var r = el.canvas.getBoundingClientRect();
    return { x: (ev.clientX - r.left) / zoom, y: (ev.clientY - r.top) / zoom };
  }

  el.nodes.addEventListener('pointerdown', function (ev) {
    var port = ev.target.closest('[data-port]');
    var box = ev.target.closest('.wm-node');
    if (!box) return;
    var n = byId(box.getAttribute('data-id'));
    if (!n) return;

    closeCtx();
    if (ev.target.closest('[data-row]')) return;   /* handled as an arrow click */

    if (port) {
      ev.preventDefault();
      drag = { mode: 'link', from: n.id, at: canvasPoint(ev) };
      el.nodes.setPointerCapture(ev.pointerId);
      return;
    }

    select({ type: 'node', id: n.id });
    if (n.locked) return;

    var p = canvasPoint(ev);
    drag = { mode: 'move', id: n.id, dx: p.x - n.x, dy: p.y - n.y, moved: false };
    box.classList.add('is-drag');
    el.nodes.setPointerCapture(ev.pointerId);
  });

  el.nodes.addEventListener('pointermove', function (ev) {
    if (!drag) return;
    var p = canvasPoint(ev);

    if (drag.mode === 'move') {
      var n = byId(drag.id);
      if (!n) return;
      n.x = Math.max(8, Math.min(snap(p.x - drag.dx), CANVAS_W - NODE_W - 8));
      n.y = Math.max(8, snap(p.y - drag.dy));
      drag.moved = true;
      var box = el.nodes.querySelector('[data-id="' + cssEsc(n.id) + '"]');
      if (box) { box.style.left = n.x + 'px'; box.style.top = n.y + 'px'; }
      renderEdges();
      return;
    }

    /* Drawing a new arrow: a dashed line to the pointer, and the box under
       the pointer lights up green so it is obvious what you are about to hit. */
    drag.at = p;
    var over = document.elementFromPoint(ev.clientX, ev.clientY);
    var hit = over && over.closest ? over.closest('.wm-node') : null;
    Array.prototype.forEach.call(el.nodes.querySelectorAll('.wm-node--drop'), function (b) {
      b.classList.remove('wm-node--drop');
    });
    if (hit && hit.getAttribute('data-id') !== drag.from) hit.classList.add('wm-node--drop');
    drag.over = hit ? hit.getAttribute('data-id') : null;
    renderEdges();
    drawGhost(drag);
  });

  function drawGhost(d) {
    var a = byId(d.from);
    if (!a) return;
    var ghost = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    ghost.setAttribute('d', 'M' + (a.x + wOf(a)) + ' ' + (a.y + hOf(a)) +
      'L' + d.at.x + ' ' + d.at.y);
    ghost.setAttribute('stroke', 'var(--primary)');
    ghost.setAttribute('stroke-width', '2');
    ghost.setAttribute('stroke-dasharray', '6 4');
    el.edges.appendChild(ghost);
  }

  el.nodes.addEventListener('pointerup', function (ev) {
    if (!drag) return;
    var d = drag; drag = null;

    Array.prototype.forEach.call(el.nodes.querySelectorAll('.is-drag, .wm-node--drop'),
      function (b) { b.classList.remove('is-drag'); b.classList.remove('wm-node--drop'); });

    if (d.mode === 'link') {
      if (d.over) connect(d.from, d.over);
      else render();
      return;
    }

    if (d.moved) {
      var n = byId(d.id);
      /* Dropped in a different band? Then it belongs to that band now. */
      var z = zoneAt(n.y + NODE_H / 2);
      if (z && z.id !== n.zone) {
        n.zone = z.id;
        window.NL.toast('Moved to "' + z.label + '"', 'success');
      }
      render(); save();
    }
    void ev;
  });

  el.nodes.addEventListener('pointercancel', function () { drag = null; render(); });

  function cssEsc(s) { return String(s).replace(/"/g, '\\"'); }

  /* Clicking an arrow selects it. The wide transparent path makes that
     possible without asking anybody to hit a two-pixel line. */
  el.edges.addEventListener('click', function (ev) {
    var hit = ev.target.getAttribute && ev.target.getAttribute('data-edge');
    if (hit) select({ type: 'edge', id: hit });
  });

  /* A row inside a shared block IS an arrow, so clicking it selects that
     arrow — same panel, same delete button. */
  el.nodes.addEventListener('click', function (ev) {
    var row = ev.target.closest ? ev.target.closest('[data-row]') : null;
    if (row) {
      ev.stopPropagation();
      select({ type: 'edge', id: row.getAttribute('data-row') });
    }
  });

  /* Hover to answer "where does this go". Rows narrow it to one destination;
     the block as a whole shows all of them at once. */
  el.nodes.addEventListener('pointerover', function (ev) {
    if (drag) return;
    var box = ev.target.closest ? ev.target.closest('.wm-node') : null;
    var id = box ? box.getAttribute('data-id') : null;
    if (id !== hoverId) { hoverId = id; renderNodes(); renderEdges(); }
  });

  el.nodes.addEventListener('pointerout', function (ev) {
    if (drag) return;
    if (ev.relatedTarget && ev.relatedTarget.closest &&
        ev.relatedTarget.closest('.wm-node')) return;
    if (hoverId !== null) { hoverId = null; renderNodes(); renderEdges(); }
  });

  function select(sel) {
    S.sel = sel;
    renderNodes(); renderEdges(); renderSide();
  }

  /* ── Right-click ──────────────────────────────────────────────────────── */
  function closeCtx() { el.ctx.classList.remove('is-open'); }

  el.canvas.addEventListener('contextmenu', function (ev) {
    ev.preventDefault();
    var box = ev.target.closest ? ev.target.closest('.wm-node') : null;
    var p = canvasPoint(ev);
    var items = [];

    if (box) {
      var n = byId(box.getAttribute('data-id'));
      select({ type: 'node', id: n.id });
      if (n.locked) {
        items.push({ note: 'This is a shared block. It is on every page, so it cannot be ' +
          'moved or deleted here.' });
      } else {
        items.push({ label: 'Edit the words', fn: function () {
          if (rt) rt.focus();
        } });
        items.push({ label: 'Make a copy', fn: function () { duplicateNode(n.id); } });
        items.push({ sep: true });
        items.push({ label: 'Delete this page', danger: true, fn: function () { removeNode(n.id); } });
      }
    } else {
      items.push({ label: 'Add a page here', fn: function () { addNode(p.x, p.y); } });
      items.push({ sep: true });
      items.push({ label: 'Tidy everything up', fn: doTidy });
    }

    el.ctx.innerHTML = items.map(function (it, i) {
      if (it.sep) return '<hr>';
      if (it.note) return '<p>' + esc(it.note) + '</p>';
      return '<button type="button" data-i="' + i + '"' +
        (it.danger ? ' class="is-danger"' : '') + '>' + esc(it.label) + '</button>';
    }).join('');

    Array.prototype.forEach.call(el.ctx.querySelectorAll('button'), function (b) {
      b.addEventListener('click', function () {
        closeCtx();
        var it = items[Number(b.getAttribute('data-i'))];
        if (it && it.fn) it.fn();
      });
    });

    /* Keep the menu on screen. */
    el.ctx.classList.add('is-open');
    var w = el.ctx.offsetWidth, h = el.ctx.offsetHeight;
    el.ctx.style.left = Math.min(ev.clientX, window.innerWidth - w - 8) + 'px';
    el.ctx.style.top = Math.min(ev.clientY, window.innerHeight - h - 8) + 'px';
  });

  document.addEventListener('pointerdown', function (ev) {
    if (!el.ctx.contains(ev.target)) closeCtx();
  });

  el.wrap.addEventListener('pointerdown', function (ev) {
    if (ev.target === el.wrap || ev.target === el.canvas || ev.target === el.stage ||
        (ev.target.classList && ev.target.classList.contains('wm-band'))) {
      select(null);
    }
  });

  /* ── Keyboard ─────────────────────────────────────────────────────────── */
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape') { closeCtx(); return; }

    var typing = /^(INPUT|SELECT|TEXTAREA)$/.test(ev.target.tagName) ||
      ev.target.isContentEditable;
    if (typing || !S.sel) return;

    if (ev.key === 'Delete' || ev.key === 'Backspace') {
      ev.preventDefault();
      if (S.sel.type === 'node') removeNode(S.sel.id);
      else {
        S.edges = S.edges.filter(function (x) { return eKey(x) !== S.sel.id; });
        S.sel = null; render(); save();
      }
      return;
    }

    if (S.sel.type === 'node' && ev.key.indexOf('Arrow') === 0) {
      var n = byId(S.sel.id);
      if (!n || n.locked) return;
      ev.preventDefault();
      var step = ev.shiftKey ? GRID * 4 : GRID;
      if (ev.key === 'ArrowLeft') n.x = Math.max(8, n.x - step);
      if (ev.key === 'ArrowRight') n.x = Math.min(CANVAS_W - NODE_W - 8, n.x + step);
      if (ev.key === 'ArrowUp') n.y = Math.max(8, n.y - step);
      if (ev.key === 'ArrowDown') n.y = n.y + step;
      render(); save();
    }
  });

  /* ── Toolbar ──────────────────────────────────────────────────────────── */
  function doTidy() {
    tidy(); render(); save();
    window.NL.toast('Tidied up', 'success');
  }

  /* Fit means the whole map is on screen, both ways. Fitting only the width
     left the bottom band below the fold, which is the one thing "Fit" is
     supposed to rule out. */
  function fit() {
    var want = Math.min((el.wrap.clientWidth - 24) / CANVAS_W,
                        (el.wrap.clientHeight - 24) / canvasH);
    zoom = ZOOMS.reduce(function (best, z) {
      return z <= want && z > best ? z : best;
    }, ZOOMS[0]);
    if (want >= 1) zoom = 1;
    applyZoom();
  }

  function nudgeZoom(dir) {
    var i = ZOOMS.indexOf(zoom);
    if (i === -1) i = ZOOMS.length - 1;
    zoom = ZOOMS[Math.max(0, Math.min(ZOOMS.length - 1, i + dir))];
    applyZoom();
  }

  document.getElementById('bTidy').addEventListener('click', doTidy);
  document.getElementById('zFit').addEventListener('click', fit);
  document.getElementById('zIn').addEventListener('click', function () { nudgeZoom(1); });
  document.getElementById('zOut').addEventListener('click', function () { nudgeZoom(-1); });

  document.getElementById('bExport').addEventListener('click', function () {
    var name = 'wellbeing-map-' + new Date().toISOString().slice(0, 10) + '.json';
    window.NL.download(name, JSON.stringify(payload(), null, 2), 'application/json');
    window.NL.toast('Exported to your Downloads folder', 'success');
  });

  document.getElementById('bImport').addEventListener('click', function () {
    window.NL.confirm(
      'Loading a file replaces everything on screen.',
      {
        title: 'Import a map',
        detail: 'If you want to keep what is here, press Cancel and Export first.',
        confirmText: 'Choose a file'
      }
    ).then(function (ok) { if (ok) el.file.click(); });
  });

  el.file.addEventListener('change', function () {
    var f = el.file.files && el.file.files[0];
    if (!f) return;
    var reader = new FileReader();
    reader.onload = function () {
      var data;
      try { data = JSON.parse(String(reader.result)); }
      catch (err) {
        window.NL.toast('That file is not a map — it is not readable as JSON', 'error');
        return;
      }
      if (!data || data.format !== 'nl-wellbeing-map' || !Array.isArray(data.nodes)) {
        window.NL.toast('That file is not a Wellbeing map export', 'error');
        return;
      }
      adopt(data);
      render(); save();
      window.NL.toast('Loaded ' + data.nodes.length + ' pages from ' + f.name, 'success');
    };
    reader.onerror = function () { window.NL.toast('Could not read that file', 'error'); };
    reader.readAsText(f);
    el.file.value = '';
  });

  document.getElementById('bReset').addEventListener('click', function () {
    window.NL.confirm(
      'Put everything back to how the live site is today?',
      {
        title: 'Reset',
        detail: 'Every change you have made here is thrown away. Export first if you ' +
          'want to keep it.',
        confirmText: 'Reset'
      }
    ).then(function (ok) {
      if (!ok || !seed) return;
      adopt(JSON.parse(JSON.stringify(seed)), { tidy: true });
      render(); save();
      window.NL.toast('Back to the live structure', 'success');
    });
  });

  /* ── The explainer ────────────────────────────────────────────────────── */
  function help() {
    window.NL.modal({
      title: 'How this works',
      size: 'md',
      body:
        '<div class="wm-help">' +
        '<h3>What this is</h3>' +
        '<p>A sketchpad for the Wellbeing section. Every box is a page, every arrow is a ' +
        'route from one page to another, and inside each box are the words that page ' +
        'carries. Move things, rename things, rewrite things.</p>' +
        '<p><b>Nothing you do here changes the live pages.</b> Richard makes the real ' +
        'changes by hand, once you have agreed them.</p>' +

        '<h3>Saving, and the one thing to watch</h3>' +
        '<ul>' +
        '<li>Your work saves itself as you go. The top-right corner tells you when.</li>' +
        '<li>It saves into <b>this browser on this computer only</b>. A different computer, ' +
        'a different browser, or clearing your history, and it will not be there.</li>' +
        '<li>So when you finish a session, press <b>Export</b>. That puts one file in your ' +
        'Downloads folder. Email it to Richard.</li>' +
        '<li><b>Import</b> loads a file back in. It replaces what is on screen, so export ' +
        'first if you want to keep it.</li>' +
        '<li><b>Reset</b> puts everything back to how the live site is today.</li>' +
        '</ul>' +

        '<h3>Doing things</h3>' +
        '<ul>' +
        '<li><b>Move a box</b> — drag it. Drop it in another band to move it there.</li>' +
        '<li><b>Change a box</b> — click it. The panel on the right holds its name and ' +
        'its words.</li>' +
        '<li><b>Draw an arrow</b> — press the small circle at the bottom-right of a box ' +
        'and drag onto another box.</li>' +
        '<li><b>Remove an arrow</b> — click the arrow, then Delete this arrow.</li>' +
        '<li><b>Add or delete a page</b> — right-click.</li>' +
        '<li><b>Tidy up</b> — puts every box back on the grid if it has got messy.</li>' +
        '</ul>' +

        '<h3>Reading the colours</h3>' +
        '<p>Colour means one thing only: <b>how urgent the page is</b>. It is the same ' +
        'ladder a visitor already sees on the statements on the live site.</p>' +
        '<ul>' +
        '<li><b>Red</b> — somebody may not be safe right now.</li>' +
        '<li><b>Amber</b> — urgent, needs to talk today, but not a threat to life.</li>' +
        '<li><b>Yellow</b> — everyday support. Most topics start here.</li>' +
        '<li><b>Blue</b> — about somebody else rather than yourself.</li>' +
        '<li><b>Navy</b> is a way in and <b>grey</b> is a service directory. Neither is a ' +
        'rung on the ladder.</li>' +
        '</ul>' +
        '<p>An arrow takes the colour of where it <i>ends up</i>, so a red arrow means that ' +
        'route finishes somewhere urgent. If you disagree with a page’s colour, change ' +
        'it — that is the argument this is for.</p>' +

        '<h3>Following the arrows</h3>' +
        '<ul>' +
        '<li><b>Hover over a box</b> and everything it does not touch fades. What it ' +
        'points at, and what points at it, light up.</li>' +
        '<li><b>Grey blocks list their own buttons.</b> The header, the footer and the ' +
        'topic buttons appear on every page, so instead of firing twelve arrows across ' +
        'the diagram they list where each button goes. Hover the block to see all of them ' +
        'at once, or hover one row for just that one. Click a row to reword or remove ' +
        'that button.</li>' +
        '<li>Each page box says how many words it holds, so it is easy to see what is ' +
        'thin.</li>' +
        '</ul>' +
        '</div>',
      buttons: [{ label: 'Got it', className: 'btn--primary', autofocus: true,
        onClick: function (c) { c.close(); } }]
    });
  }
  document.getElementById('bHelp').addEventListener('click', help);

  /* ── Boot ─────────────────────────────────────────────────────────────── */
  function boot() {
    fetch('seed.json', { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw new Error('seed ' + r.status);
        return r.json();
      })
      .then(function (data) {
        seed = data;
        S.zones = data.zones || [];

        var saved = null;
        try { saved = JSON.parse(localStorage.getItem(STORE) || 'null'); }
        catch (err) { saved = null; }

        if (saved && Array.isArray(saved.nodes) && saved.nodes.length) {
          adopt(saved);
          stamp('Picked up where you left off');
        } else {
          adopt(JSON.parse(JSON.stringify(seed)), { tidy: true });
          stamp('Started from the live structure');
        }

        render();
        fit();

        /* First visit gets the explainer without having to find the (i). */
        try {
          if (!localStorage.getItem(SEEN)) { localStorage.setItem(SEEN, '1'); help(); }
        } catch (err) { /* private browsing — no harm done */ }
      })
      .catch(function (err) {
        el.side.innerHTML = '<h2>Could not load the map</h2>' +
          '<p class="wm-hint">seed.json did not load, so there is nothing to draw. ' +
          'Reload the page; if it keeps happening, tell Richard.</p>' +
          '<div class="wm-locked">' + esc(String(err.message || err)) + '</div>';
        stamp('<b>Not loaded</b>');
      });
  }

  window.addEventListener('resize', function () {
    if (zoom < 1) fit();
  });

  boot();
}());
</script>

</body>
</html>
