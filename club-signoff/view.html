<!doctype html>
<html lang="en">
<head>
<!--
  NL Tools — Club submission, public view
  Version: v0.2 (04/08/2026)
  File: /club-signoff/view.html

  A club's contacts submission at /club-signoff/view.html?club=SAL, laid out
  the same way the sign-off page lays one out, but showing the record exactly
  as stored. Nothing is tidied, merged, defaulted or interpreted: a name typed
  in caps shows in caps, someone entered twice appears twice, a blank job title
  reads as blank. That is the point of this page.

  PUBLIC, deliberately and on request. No auth-guard, no token. These records
  carry personal mobile numbers, personal email addresses, and people the club
  marked not for publication. noindex keeps it out of search results, which
  limits discovery but is not access control.

  Invite tokens are NOT exposed: the club is found by matching the `club` field
  inside each submission, so app-data/ops-club-contacts/invites stays
  admin-only.

  CHANGELOG
  04/08/2026 v0.2 — Laid out rather than dumped as JSON.
  04/08/2026 v0.1 — Initial public raw view.
-->

<body>

<div class="rw" id="wrap"><p class="fallback">Loading&hellip;</p></div>

<script>
(function () {
  'use strict';

  var META = '/assets/data/clubs-meta.json';
  var code = (new URLSearchParams(location.search).get('club') || '').trim().toUpperCase();
  var wrap = document.getElementById('wrap');
  var esc  = NL.escHtml;

  /* Handbook order, with anything unexpected falling through to the end. */
  var ORDER = ['Leadership', 'Directors', 'Executive', 'Club secretary',
    'Matchday & safety', 'Safeguarding & welfare', 'Medical', 'Media & marketing',
    'Programme', 'Commercial', 'Ticketing', 'Finance', 'Community',
    'Team operations', 'Other'];

  var LISTS = [['secretary','Club secretary'], ['safety','Safety officer'],
    ['slo','Supporter liaison officer'], ['dlo','Disability liaison officer'],
    ['plo','Police liaison officer'], ['medical','Medical'], ['media','Media'],
    ['programme','Programme'], ['commercial','Commercial'], ['ticketing','Ticketing'],
    ['finance','Finance']];

  var SOC = [['x','X'], ['facebook','Facebook'], ['instagram','Instagram'],
    ['tiktok','TikTok'], ['youtube','YouTube'], ['linkedin','LinkedIn']];

  function msg(t) { wrap.innerHTML = '<p class="fallback">' + esc(t) + '</p>'; }

  /* Blank means blank. Showing "Not held" would be us interpreting. */
  function row(label, value) {
    return '<div class="row"><dt>' + esc(label) + '</dt><dd>' +
      (value || '<span class="empty">(blank)</span>') + '</dd></div>';
  }
  /* Live RTDB stores leads as {areaKey: [personId]} — bare id strings. The
     export tool expands them to {id, name}, which is what this page was written
     against, so against the real database every list rendered blank. Accept
     both shapes and resolve an id back to the person. */
  function leadNames(rec, key) {
    var raw = (rec.leads || {})[key] || [];
    var byId = {};
    (rec.people || []).forEach(function (p) { if (p.id) { byId[p.id] = p; } });
    return raw.map(function (n) {
      if (typeof n === 'string') {
        var p = byId[n];
        return p ? fullName(p) : '';
      }
      return (n && (n.name || (byId[n.id] ? fullName(byId[n.id]) : ''))) || '';
    }).filter(Boolean);
  }

  function fullName(p) {
    return (p.name || [p.firstName, p.lastName].filter(Boolean).join(' ') || '').trim();
  }

  Promise.all([
    db.ref('app-data/ops-club-contacts/submissions').once('value'),
    fetch(META + '?cb=' + Date.now()).then(function (r) { return r.json(); })
  ]).then(function (res) {
    var subs = res[0].val() || {}, meta = res[1];
    var list = meta.clubs || meta;
    if (!Array.isArray(list)) {
      list = Object.keys(list).map(function (k) {
        var o = list[k]; o.name = o.name || k; return o;
      });
    }
    var byClub = {};
    Object.keys(subs).forEach(function (t) {
      var c = subs[t] && subs[t].club;
      if (c) { byClub[c] = subs[t]; }
    });

    if (!code) { return index(list, byClub); }
    var hit = list.filter(function (c) {
      return String(c.code || '').toUpperCase() === code;
    })[0];
    if (!hit) { return msg('No club with the code ' + code + '.'); }
    var rec = byClub[hit.name];
    if (!rec) { return msg('No submission held for ' + hit.name + '.'); }
    show(hit, rec, list, byClub);
  }).catch(function (err) {
    msg('Could not load that club.');
    console.error('[club-view]', err);
  });

  function index(list, byClub) {
    var have = list.filter(function (c) { return byClub[c.name]; })
      .sort(function (a, b) { return a.name.localeCompare(b.name); });
    wrap.innerHTML =
      '<div class="ri-hero"><div class="ri-hero__t">' +
      '<div class="kicker">National League &middot; Club directory 2026-27</div>' +
      '<h1>Club submissions</h1><p>' + have.length + ' held, shown exactly as ' +
      'each club entered them.</p></div></div>' +
      '<div class="body"><div class="block"><h2>Pick a club</h2>' +
      '<p class="block__lede">Or add ?club=CODE to the address.</p>' +
      '<div class="picker">' + have.map(function (c) {
        return '<a href="?club=' + esc(c.code) + '">' + esc(c.code) + ' ' + esc(c.name) + '</a>';
      }).join('') + '</div></div></div>';
  }

  function show(hit, rec, list, byClub) {
    var info = rec.info || {}, people = rec.people || [];

    var addr = [info.addr1, info.addr2, info.town, info.county, info.postcode]
      .filter(function (x) { return (x || '').trim(); }).map(esc).join(', ');
    var soc = SOC.filter(function (s) { return (info[s[0]] || '').trim(); })
      .map(function (s) {
        return '<a href="' + esc(info[s[0]]) + '">' + s[1] + '</a>';
      }).join('');

    /* People stay in submission order, and anyone entered twice appears twice. */
    var seq = people.slice().sort(function (a, b) {
      var ai = ORDER.indexOf(((a.roles || [])[0] || {}).section);
      var bi = ORDER.indexOf(((b.roles || [])[0] || {}).section);
      if (ai < 0) { ai = 99; } if (bi < 0) { bi = 99; }
      return ai - bi;
    });

    var switcher = list.filter(function (c) { return byClub[c.name]; })
      .sort(function (a, b) { return a.name.localeCompare(b.name); })
      .map(function (c) {
        return '<option value="' + esc(c.code) + '"' +
          (c.code === hit.code ? ' selected' : '') + '>' + esc(c.name) + '</option>';
      }).join('');

    wrap.innerHTML =
      '<div class="ri-hero">' +
      '<img id="crest" class="ri-hero__crest" alt="" hidden>' +
      '<div class="ri-hero__t">' +
      '<div class="kicker">National League &middot; Club directory 2026-27</div>' +
      '<h1>' + esc(hit.name) + '</h1>' +
      '<p>Submitted ' + (rec.submittedAt ? esc(NL.formatDate(rec.submittedAt)) : 'unknown') +
      (rec.submittedBy && rec.submittedBy.name ? ' by ' + esc(rec.submittedBy.name) : '') +
      '.</p></div></div>' +

      '<div class="asis"><div><b>Exactly as submitted.</b> Nothing here has been ' +
      'tidied, merged or corrected, so capitalisation, blanks and repeated entries ' +
      'are the club&rsquo;s own.</div>' +
      '<select class="switch" id="switch" aria-label="Choose a club">' + switcher +
      '</select></div>' +

      '<div class="body">' +

      '<section class="block"><h2>Ground</h2>' +
        row('Stadium', esc(info.stadium || '')) +
        row('Stadium sponsor', esc(info.stadiumSponsor || '')) +
        row('Address', addr) +
        row('Capacity', esc(info.capacity || '')) +
        row('Seated', esc(info.seated || '')) +
        row('Pitch', [info.pitchDims, info.pitchType].filter(Boolean).map(esc).join(' &middot; ')) +
        row('Nearest station', esc(info.station || '') +
          (info.stationDistance ? ' <span class="muted">' + esc(info.stationDistance) + ' miles</span>' : '')) +
        row('County FA', esc(info.countyFA || '')) +
      '</section>' +

      '<section class="block"><h2>Sponsors</h2>' +
        row('Club', esc(info.spClub || '')) + row('Shirt front', esc(info.spFront || '')) +
        row('Shirt back', esc(info.spBack || '')) + row('Sleeve', esc(info.spSleeve || '')) +
        row('Shorts', esc(info.spShorts || '')) + row('Other', esc(info.spExtra || '')) +
      '</section>' +

      '<section class="block"><h2>Contacting the club</h2>' +
        row('Switchboard', esc(info.phone || '')) +
        row('Main email', info.mainEmail
          ? '<a href="mailto:' + esc(info.mainEmail) + '">' + esc(info.mainEmail) + '</a>' : '') +
        row('Website', esc(info.website || '')) +
        row('Social', soc ? '<div class="socials">' + soc + '</div>' : '') +
      '</section>' +

      '<section class="block"><h2>Departmental inboxes</h2>' +
        (Object.keys(rec.inboxes || {}).length
          ? Object.keys(rec.inboxes).map(function (k) {
              var bx = rec.inboxes[k] || {};
              return row(bx.dept || k, esc(bx.email || '') +
                (bx.phone ? ' <span class="muted">' + esc(bx.phone) + '</span>' : ''));
            }).join('')
          : '<p class="empty" style="margin:0;">(none)</p>') +
      '</section>' +

      '<section class="block"><h2>People</h2>' +
        '<p class="block__lede">' + people.length + ' entries, in the order the club ' +
        'sent them. Anyone entered more than once appears more than once.</p>' +
        '<ul class="people">' + seq.map(personCard).join('') + '</ul>' +
      '</section>' +

      /* Mailing lists last: they are built out of the people above, they are our own
         internal routing, and they are not published in the directory. */
      '<section class="block"><h2>Mailing lists</h2>' +
        '<p class="block__lede">Internal routing for our email, not published in the ' +
        'directory.</p>' +
        LISTS.map(function (L) {
          return row(L[1], leadNames(rec, L[0]).map(esc).join(' &middot; '));
        }).join('') +
      '</section>' +

      '</div>';

    var crest = document.getElementById('crest');
    if (crest) {
      crest.alt = hit.name + ' crest';
      crest.hidden = false;
      NL.clubs.wireCrestImg(crest, hit.name, true);
      crest.src = NL.clubs.crestUrl(hit.name);
    }
    document.getElementById('switch').addEventListener('change', function (ev) {
      location.search = '?club=' + ev.target.value;
    });
  }

  function personCard(p) {
    var roles = (p.roles || []).map(function (r) {
      return '<li class="rle"><span class="rle__dept">' + esc(r.section || 'Other') + '</span>' +
        ((r.title || '').trim()
          ? '<span class="rle__title">' + esc(r.title) + '</span>'
          : '<span class="rle__title rle__title--none">(no job title)</span>') + '</li>';
    }).join('');

    var cts = (p.emails || []).filter(Boolean).map(function (em) {
      return '<div class="ct"><a href="mailto:' + esc(em) + '">' + esc(em) + '</a></div>';
    }).concat((p.phones || []).filter(function (ph) { return (ph.number || '').trim(); })
      .map(function (ph) {
        return '<div class="ct">' + esc(ph.number) +
          (ph.ext ? ' ext ' + esc(ph.ext) : '') + '</div>';
      }));
    if (!cts.length) { cts.push('<div class="ct"><span class="empty">(no contact details)</span></div>'); }
    if (p.hideContact) {
      cts.push('<p class="hidden-note"><span class="pill pill--info">Not for publication</span></p>');
    }

    return '<li class="pcard">' +
      '<div class="pcard__top"><span class="pcard__name">' +
      (fullName(p) ? esc(fullName(p)) : '<span class="empty">(no name)</span>') +
      '</span></div>' +
      '<div class="pcard__body"><ul class="roles">' + roles + '</ul>' +
      '<div class="pcard__ct">' + cts.join('') + '</div></div></li>';
  }
})();
</script>
</body>
</html>
