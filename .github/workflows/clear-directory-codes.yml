name: Button · Clear retired Club Directory codes

# ONE-OFF, 11/11/2026. Deleted again straight after its run; the record of
# what it did is system/retired/club-directory-codes.md.
#
# The Directory's own codes were retired today (PR #1478): the function is
# gone and no rule honours their claim. This clears what they left behind:
#   - app-data/ops-club-directory/config/editors, config/readers, config/reader
#     (the code lists) and authRequests, authGrants, rate (the handshake's
#     scratch nodes);
#   - Firebase Authentication users whose id is cd-reader, cd-rd-*, cd-ed-* or
#     cd-admin-*. Only clubDirectoryAuth ever minted a cd- id
#     (grep createCustomToken in functions/).
# Everything deleted is saved first to the private bucket
# nl-tools-monthly-backups under retired/. The log is public: counts only.
#
# Identity Toolkit: GET v1/projects/{p}/accounts:batchGet (maxResults ≤ 1000,
# users[].localId, nextPageToken) and POST v1/projects/{p}/accounts:batchDelete
# ({ localIds, force }, answers { errors }), per
# https://googleapis.github.io/google-api-python-client/docs/dyn/identitytoolkit_v1.projects.accounts.html

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'report = count only. clear = delete.'
        required: true
        default: report
        type: choice
        options: [report, clear]
      confirm:
        description: 'Type "clear" to allow clear mode.'
        required: false
        default: ''

permissions:
  contents: read
  id-token: write

jobs:
  clear:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MODE: ${{ inputs.mode }}
      DB: https://nl-tools-default-rtdb.europe-west1.firebasedatabase.app
    steps:
      - name: Check the confirmation
        if: inputs.mode == 'clear'
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "clear" ]; then echo "::error::Clear mode needs the confirm box to say exactly: clear"; exit 1; fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Count, save and clear
        run: |
          set -euo pipefail
          export TOKEN=$(gcloud auth print-access-token)
          node --input-type=module - <<'JS'
          const { TOKEN, DB, MODE } = process.env;
          const H = { Authorization: 'Bearer ' + TOKEN };
          async function call(url, opts = {}) {
            const r = await fetch(url, { ...opts, headers: { ...H, ...(opts.headers || {}) } });
            if (!r.ok) throw new Error(`${opts.method || 'GET'} ${url.split('?')[0]} → HTTP ${r.status}: ${(await r.text()).slice(0, 300)}`);
            return r;
          }
          const ROOT = 'app-data/ops-club-directory';
          const NODES = ['config/editors', 'config/readers', 'config/reader', 'authRequests', 'authGrants', 'rate'];
          const saved = { nodes: {}, users: [] };
          const lines = [`## Retired Club Directory codes – ${MODE}`, ''];

          for (const n of NODES) {
            const v = await (await call(`${DB}/${ROOT}/${n}.json`)).json();
            saved.nodes[n] = v;
            const count = v && typeof v === 'object' ? Object.keys(v).length : (v == null ? 0 : 1);
            lines.push(`- ${n}: ${v == null ? 'already empty' : count + ' entr' + (count === 1 ? 'y' : 'ies')}`);
          }

          const IT = 'https://identitytoolkit.googleapis.com/v1/projects/nl-tools/accounts';
          const RETIRED = /^cd-(reader$|rd-|ed-|admin-)/;
          let page = '', total = 0;
          do {
            const q = new URLSearchParams({ maxResults: '1000' });
            if (page) q.set('nextPageToken', page);
            const r = await (await call(`${IT}:batchGet?${q}`)).json();
            for (const u of r.users || []) { total++; if (RETIRED.test(u.localId)) saved.users.push(u.localId); }
            page = r.nextPageToken || '';
          } while (page);
          lines.push(`- Sign-in accounts: ${saved.users.length} of ${total} belong to the retired codes`);

          if (MODE !== 'clear') {
            lines.push('', 'Nothing deleted. Run again with mode clear and type clear to delete these.');
          } else {
            const stamp = new Date().toISOString().replace(/[:.]/g, '-');
            const name = `retired/${stamp}/club-directory-codes.json`;
            await call(`https://storage.googleapis.com/upload/storage/v1/b/nl-tools-monthly-backups/o?uploadType=media&name=${encodeURIComponent(name)}`,
              { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(saved) });
            lines.push('', `Saved first to nl-tools-monthly-backups/${name}.`);
            for (const n of NODES) {
              if (saved.nodes[n] == null) continue;
              await call(`${DB}/${ROOT}/${n}.json`, { method: 'DELETE' });
            }
            for (const n of NODES) {
              const left = await (await call(`${DB}/${ROOT}/${n}.json`)).json();
              if (left != null) throw new Error(`${n} is still there after deleting.`);
            }
            lines.push('- Database entries deleted, and checked gone.');
            for (let i = 0; i < saved.users.length; i += 1000) {
              const r = await (await call(`${IT}:batchDelete`, { method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ localIds: saved.users.slice(i, i + 1000), force: true }) })).json();
              if (r.errors && r.errors.length) throw new Error(`${r.errors.length} accounts could not be deleted.`);
            }
            lines.push(`- ${saved.users.length} sign-in accounts deleted.`);
            const now = Date.now();
            await call(`${DB}/admin/audit/${now}_${Math.random().toString(36).slice(2, 8)}.json`, { method: 'PUT',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ action: 'retired_codes_cleared', detail: `Club Directory codes: ${NODES.filter((n) => saved.nodes[n] != null).join(', ')}; ${saved.users.length} sign-in accounts`,
                uid: 'github-actions', name: 'Button · Clear retired Club Directory codes', email: '', ts: now, at: new Date(now).toISOString() }) });
          }
          const text = lines.join('\n');
          console.log(text);
          (await import('node:fs')).appendFileSync(process.env.GITHUB_STEP_SUMMARY, text + '\n');
          JS
