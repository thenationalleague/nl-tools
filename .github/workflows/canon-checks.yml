name: canon-checks

# Safety rail for the shared canon: proves the NL.* helpers return the right
# answer and that clubs-meta.json is structurally valid. Zero dependencies, so
# no npm install step is needed.

on:
  pull_request:
    paths:
      - 'system/nl-utils.js'
      - 'assets/data/clubs-meta.json'
      - 'assets/crests/**'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/canon-checks.yml'
  push:
    branches: [main]
    paths:
      - 'system/nl-utils.js'
      - 'assets/data/clubs-meta.json'
      - 'assets/crests/**'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/canon-checks.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Canon helper tests + clubs-meta structural check
        run: npm test
      - name: clubs-meta full report (warnings surfaced, non-blocking)
        run: npm run validate:clubs
