name: canon-checks

# Safety rail for the shared canon: proves the NL.* helpers return the right
# answer, that clubs-meta.json is structurally valid, that every tool's wiring
# still matches the template, and that every workflow file in this repo
# actually parses. Zero dependencies, so no npm install step is needed.
#
# The path filter below deliberately includes the canon files themselves —
# nl-brand.css, nl-topbar.js, auth-guard.js, the template and lint-tools.sh.
# Until 30/07/2026 it only watched nl-utils.js, so a change to the template
# could ship with no checks at all. That is how the template came to carry a
# duplicated tool title, and how six graphics sub-pages lost their ?v= without
# anything failing.
#
# embeds/** joined the list on 11/08/2026. tests/nl-cup-live.test.mjs reads the
# built embed bundle, so from that point a change under embeds/ could break a
# test that this workflow would never have run — the same shape of hole, one
# directory over.

on:
  pull_request:
    paths:
      - 'system/**'
      - 'graphics/_shared/**'
      - 'assets/data/clubs-meta.json'
      - 'assets/data/competitions-meta.json'
      - 'assets/crests/**'
      - 'embeds/**'
      - 'tests/**'
      - 'package.json'
      - 'scripts/**'
      - '**/index.html'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'system/**'
      - 'graphics/_shared/**'
      - 'assets/data/clubs-meta.json'
      - 'assets/data/competitions-meta.json'
      - 'assets/crests/**'
      - 'embeds/**'
      - 'tests/**'
      - 'package.json'
      - 'scripts/**'
      - '**/index.html'
      - '.github/workflows/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Workflow files parse
        run: |
          python3 -c 'import yaml' 2>/dev/null || pip install --quiet pyyaml
          python3 scripts/check-workflows.py

      - name: Canon helper tests + clubs-meta structural check
        run: npm test

      # --strict exits 1 on any drift that is not an accepted exception in
      # system/_template/.lint-waivers, so wiring drift fails the PR instead of
      # only being mentioned at the top of a Claude Code session.
      - name: Tool wiring matches the template
        run: bash system/lint-tools.sh --strict
      - name: clubs-meta full report (warnings surfaced, non-blocking)
        run: npm run validate:clubs
