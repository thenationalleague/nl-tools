name: canon-checks

# Safety rail for the shared canon: proves the NL.* helpers return the right
# answer, that clubs-meta.json is structurally valid, and that every workflow
# file in this repo actually parses. Zero dependencies, so no npm install step
# is needed.

on:
  pull_request:
    paths:
      - 'system/nl-utils.js'
      - 'assets/data/clubs-meta.json'
      - 'assets/crests/**'
      - 'tests/**'
      - 'package.json'
      - 'scripts/check-workflows.py'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'system/nl-utils.js'
      - 'assets/data/clubs-meta.json'
      - 'assets/crests/**'
      - 'tests/**'
      - 'package.json'
      - 'scripts/check-workflows.py'
      - '.github/workflows/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Workflow files parse
        run: |
          python3 -c 'import yaml' 2>/dev/null || pip install --quiet pyyaml
          python3 scripts/check-workflows.py

      - name: Canon helper tests + clubs-meta structural check
        run: npm test
      - name: clubs-meta full report (warnings surfaced, non-blocking)
        run: npm run validate:clubs
