# Weekly check on the external support-service links published at /wellbeing.
#
# A dead link on a mental health crisis page is worse than a missing one, and
# these services do move (PAPYRUS's line was HOPELINEUK before it became
# HOPELINE247). This job reads the URLs straight out of wellbeing/index.html so
# it can never drift from what is actually published, checks each one, and opens
# a GitHub issue when any of them stops returning 200.
#
# It deliberately does not fail the build. A flaky third-party site should raise
# a flag for a human, not turn the repository red.

name: Wellbeing link check

on:
  schedule:
    - cron: '0 8 * * 1'   # Mondays, 08:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: wellbeing-linkcheck
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the published support links
        id: check
        run: |
          set -uo pipefail

          # Every external https link in the wellbeing page, deduplicated.
          mapfile -t urls < <(
            grep -oE 'href="https://[^"]+"' wellbeing/index.html \
              | sed 's/^href="//; s/"$//' \
              | sort -u
          )

          if [ "${#urls[@]}" -eq 0 ]; then
            echo "No external links found in wellbeing/index.html — that is itself suspicious."
            echo "failed=no-links-found" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Checking ${#urls[@]} links."
          failures=""

          for u in "${urls[@]}"; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' \
                        -L --retry 2 --retry-delay 5 --max-time 30 \
                        -A 'NL-Tools-linkcheck/1.0 (+https://nl.tools/wellbeing)' \
                        "$u" 2>/dev/null || echo "000")
            printf '%s  %s\n' "$code" "$u"
            if [ "$code" != "200" ]; then
              failures="${failures}- \`${code}\` ${u}"$'\n'
            fi
          done

          if [ -n "$failures" ]; then
            {
              echo "failed<<WELLBEING_EOF"
              printf '%s' "$failures"
              echo "WELLBEING_EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Open an issue if anything is broken
        if: steps.check.outputs.failed != ''
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED: ${{ steps.check.outputs.failed }}
        run: |
          set -euo pipefail
          TITLE="Wellbeing: a support link is not responding"

          body=$(cat <<'INTRO'
One or more of the support-service links published on **/wellbeing** did not
return `200` on the weekly check.

These appear on pages people reach when they are struggling, so a broken link
matters more here than elsewhere. Please confirm the service's current address
and update `wellbeing/index.html`.

**Not responding:**

INTRO
          )
          body="${body}"$'\n'"${FAILED}"$'\n'"Checked by \`.github/workflows/wellbeing-linkcheck.yml\`."

          existing=$(gh issue list --state open --search "$TITLE in:title" \
                       --json number --jq '.[0].number // empty')

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$TITLE" --body "$body"
          fi
