name: Deploy Cloud Functions

# Deploys everything in functions/ to the nl-tools Firebase project: the NL Cup
# footage proxy, the account role writes, the Programme Packs passcode trigger
# and the Club Directory passcode trigger. Runs when any of them changes, or on
# demand ("Run workflow").
#
# Renamed from deploy-footage-proxy.yml on 04/08/2026 — it has deployed every
# function since the day it was written (--only functions, not a named one), so
# the old name sent anyone asking "why did my trigger deploy" to the wrong file.
# Auth reuses the same Workload Identity Federation secrets as the GA pipeline —
# no terminal needed. One-time IAM grant + API enable required (see functions/README.md).

on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'firebase.json'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install function dependencies
        working-directory: functions
        run: npm install

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Deploy functions
        run: npx --yes firebase-tools@latest deploy --only functions --project nl-tools --non-interactive --force
