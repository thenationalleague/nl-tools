name: Auto · Test database rules

# Runs the database rules against the Firebase emulator, so a rules change is
# proven before anyone presses the publish button. Written 12/11/2026: the
# rules tests in tests/emulator/ needed Java and the emulator on someone's
# machine, nobody here has a terminal, and the build sandbox cannot download
# the emulator — so the tests that guard who may change access were written
# and never run. Here they run on every pull request that touches the rules,
# and the check shows on the PR.
#
# Not part of canon-checks: those are zero-dependency and gate every PR. This
# needs Java and firebase-tools, so it runs only when the rules or these tests
# change, or when pressed.
#
# Only database-only tests are listed. Add a file to TESTS when a new one is
# written; one that needs the storage or auth emulator needs --only widened.

on:
  pull_request:
    paths:
      - system/rtdb/rules.snapshot.json
      - system/storage/rules.snapshot.rules
      - tests/emulator/**
      - .github/workflows/test-rules.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STORAGE_TESTS: storage-league-rules.mjs
      TESTS: access-grants-rules.mjs users-rules.mjs programme-rules.mjs commercial-benchmarking-rules.mjs attendance-handbook-rules.mjs manage-batch1-rules.mjs manage-batch2-rules.mjs exposure-rules.mjs uw-codes-rules.mjs
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install the emulator and the test library (outside the repo)
        run: |
          mkdir -p "$RUNNER_TEMP/emu" && cd "$RUNNER_TEMP/emu"
          npm init -y >/dev/null
          npm i --no-audit --no-fund firebase-tools@13 @firebase/rules-unit-testing@3 firebase@10 >/dev/null
          printf '{"emulators":{"database":{"port":9000},"storage":{"port":9199},"ui":{"enabled":false}},"storage":{"rules":"storage.rules"}}' > firebase.json
          # The storage emulator will not start without a rules file named in
          # firebase.json; each test loads the real rules itself.
          cp "$GITHUB_WORKSPACE/system/storage/rules.snapshot.rules" storage.rules

      - name: Run the rules tests
        run: |
          cd "$RUNNER_TEMP/emu"
          status=0
          for f in $TESTS; do
            cp "$GITHUB_WORKSPACE/tests/emulator/$f" .
            echo "::group::$f"
            NL_REPO="$GITHUB_WORKSPACE" npx firebase emulators:exec --project demo-rules \
              --only database "node $f" || status=1
            echo "::endgroup::"
          done
          for f in $STORAGE_TESTS; do
            cp "$GITHUB_WORKSPACE/tests/emulator/$f" .
            echo "::group::$f"
            NL_REPO="$GITHUB_WORKSPACE" npx firebase emulators:exec --project demo-rules \
              --only database,storage "node $f" || status=1
            echo "::endgroup::"
          done
          exit $status
