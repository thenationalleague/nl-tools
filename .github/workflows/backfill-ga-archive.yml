name: Backfill GA hourly archive

# One-off / on-demand workflow to populate ga-hourly-archive.json with
# historical GA4 data going back further than the rolling 90-day window
# the nightly fetch maintains.
#
# Use this once to seed the archive (e.g. start_date = 2024-11-08, the
# site launch). Re-run with a narrower range only if you specifically
# need to re-pull a date period (e.g. GA4 backdated some events).
#
# The script is idempotent — it overwrites only the date range you ask
# for, preserving everything outside it.

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Backfill start date (YYYY-MM-DD)'
        required: true
        default: '2024-11-08'
      end_date:
        description: 'Backfill end date (YYYY-MM-DD, blank = today)'
        required: false
        default: ''

permissions:
  contents: write
  id-token: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm dependencies
        run: npm install

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Backfill archive
        env:
          GA_PROPERTY_ID:  ${{ secrets.GA_PROPERTY_ID }}
          BACKFILL_START:  ${{ github.event.inputs.start_date }}
          BACKFILL_END:    ${{ github.event.inputs.end_date }}
        run: node scripts/backfill-ga-hourly-archive.js

      - name: Commit archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/ga-hourly-archive.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: backfill GA hourly archive (${{ github.event.inputs.start_date }} → ${{ github.event.inputs.end_date }})"
          for i in 1 2 3; do
            if git push; then
              echo "Push succeeded on attempt $i"
              exit 0
            fi
            echo "Push attempt $i failed - fetching and rebasing"
            git fetch origin main
            git rebase origin/main || { echo "Rebase failed - bailing"; exit 1; }
          done
          echo "All 3 push attempts failed"
          exit 1
