name: Sync Apps Script

# Pulls the live Apps Script project into gas/ so the repo copy stops being a
# promise and becomes a mirror by construction.
#
# WHY THIS EXISTS
# Every file in gas/ carries the line "In-repo mirror of the Apps Script file
# (keep in lockstep with the live project)". Nothing enforced that. Apps Script
# is hand-pasted and hand-deployed, so it was the only layer in the system where
# the repo could differ arbitrarily from what is running and no check would
# notice — while handling invites, access requests, attendance fixture sync and
# onboarding emails. Eight pages still call it, including the login page.
#
# WHAT IT DOES
# `clasp pull` writes the live project's files into gas/, then commits ONLY if
# something changed. A commit appearing here means someone edited the live
# project directly — which is the signal that was missing.
#
# It does NOT push. Deliberately: this is a mirror, not a deploy path. Making it
# two-way would mean a bad merge could rewrite a running backend, and the repo
# has no test that could catch that. Deploying stays a human action in the Apps
# Script editor until the migration to Cloud Functions finishes the job.
#
# SETUP (one-off, both from a browser)
#   1. Secret CLASP_CREDENTIALS — the contents of ~/.clasprc.json produced by
#      `clasp login`. If you have no CLI, the same JSON can be generated by
#      anyone who does, on any machine; it is a refresh token, not a password.
#   2. Secret GAS_SCRIPT_ID — the script ID from the Apps Script editor URL:
#      script.google.com/home/projects/<THIS BIT>/edit
#
# Until both secrets exist the job exits early and does nothing, so merging this
# is safe with no configuration.

on:
  schedule:
    # Daily, offset off the hour so it does not queue behind the 03:00 index job.
    - cron: '40 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-gas
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Check secrets are configured
        id: gate
        env:
          CLASP_CREDENTIALS: ${{ secrets.CLASP_CREDENTIALS }}
          GAS_SCRIPT_ID: ${{ secrets.GAS_SCRIPT_ID }}
        run: |
          if [ -z "$CLASP_CREDENTIALS" ] || [ -z "$GAS_SCRIPT_ID" ]; then
            echo "CLASP_CREDENTIALS and/or GAS_SCRIPT_ID not set — nothing to do."
            echo "See the header of this workflow for the two-step setup."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.gate.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install clasp
        if: steps.gate.outputs.ready == 'true'
        run: npm install -g @google/clasp

      - name: Authenticate
        if: steps.gate.outputs.ready == 'true'
        env:
          CLASP_CREDENTIALS: ${{ secrets.CLASP_CREDENTIALS }}
        run: printf '%s' "$CLASP_CREDENTIALS" > ~/.clasprc.json

      - name: Pull the live project
        if: steps.gate.outputs.ready == 'true'
        env:
          GAS_SCRIPT_ID: ${{ secrets.GAS_SCRIPT_ID }}
        run: |
          mkdir -p gas
          # .clasp.json is written here rather than committed: it carries the
          # script ID, which is not secret but is also not useful in the repo
          # and would be one more thing to keep in step by hand.
          printf '{"scriptId":"%s","rootDir":"gas"}\n' "$GAS_SCRIPT_ID" > .clasp.json
          clasp pull
          rm -f .clasp.json
          # clasp writes appsscript.json (the manifest). Keep it — a change to
          # scopes or the runtime is exactly the kind of drift worth seeing.
          ls -la gas/

      - name: Commit if the live project has drifted
        if: steps.gate.outputs.ready == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gas/
          if git diff --cached --quiet; then
            echo "Apps Script matches the repo — no drift."
            exit 0
          fi
          echo "DRIFT: the live Apps Script project differs from gas/."
          git diff --cached --stat
          git commit -m "chore: sync Apps Script from the live project"
          for i in 1 2 3; do
            if git push; then exit 0; fi
            git fetch origin main && git rebase origin/main || exit 1
          done
          exit 1
