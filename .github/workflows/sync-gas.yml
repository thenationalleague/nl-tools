name: Sync Apps Script

# Pulls the live Apps Script project into gas/ so the repo copy stops being a
# promise and becomes a mirror by construction.
#
# WHY THIS EXISTS
# Every file in gas/ carries the line "In-repo mirror of the Apps Script file
# (keep in lockstep with the live project)". Nothing enforced that. Apps Script
# is hand-pasted and hand-deployed, so it was the only layer in the system where
# the repo could differ arbitrarily from what is running and no check would
# notice — while handling invites, access requests, attendance fixture sync and
# onboarding emails. Eight pages still call it, including the login page.
#
# WHAT IT DOES
# `clasp pull` writes the live project's files into gas/, then commits ONLY if
# something changed. A commit appearing here means someone edited the live
# project directly — which is the signal that was missing.
#
# It does NOT push. Deliberately: this is a mirror, not a deploy path. Making it
# two-way would mean a bad merge could rewrite a running backend, and the repo
# has no test that could catch that. Deploying stays a human action in the Apps
# Script editor until the migration to Cloud Functions finishes the job.
#
# SETUP (one-off, all from a browser)
#   ONE secret: CLASP_CREDENTIALS — the contents of ~/.clasprc.json produced by
#   `clasp login` (use @google/clasp@3.3.0, matching the pin below).
#
#   No local CLI needed, but the login is fiddlier than it looks. clasp always
#   redirects OAuth to http://localhost:8888 — v3's --no-localhost flag is
#   documented but does nothing, and v2's works only via the `oob` flow Google
#   switched off in 2022. So in Google Cloud Shell (shell.cloud.google.com):
#     1. tab 1: npx @google/clasp@3.3.0 login      → prints an auth URL
#     2. open it in a browser, authorise as the project's OWNER account
#     3. the browser lands on localhost:8888 and fails — copy that whole URL
#     4. tab 2: curl "<that URL>"                  → hands the code to tab 1
#     5. tab 1 completes and writes ~/.clasprc.json; cat it, paste into the
#        secret. The token never leaves Cloud Shell.
#
#   It is a refresh token, not a password. Revoke at myaccount.google.com →
#   Security → Third-party apps.
#
# The script ID is deliberately NOT a secret. It names the project but grants
# nothing without authorisation — the same class of identifier as the Firebase
# projectId already sitting in every page of this repo. Keeping it in plain
# sight means one thing to configure instead of two, and a typo in a hidden
# field cannot silently break the sync.
#
# Until CLASP_CREDENTIALS exists the job exits early and does nothing, so
# merging this is safe with no configuration.

env:
  # NL Tools consolidated Apps Script project.
  GAS_SCRIPT_ID: 1Uiyk661Fasxn4h1Bhtd6rgkmn3XhkzsZJuJ9eCrr4aio2i0f7f53RtEZ

on:
  schedule:
    # Daily, offset off the hour so it does not queue behind the 03:00 index job.
    - cron: '40 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-gas
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Check the credential is configured
        id: gate
        env:
          CLASP_CREDENTIALS: ${{ secrets.CLASP_CREDENTIALS }}
        run: |
          if [ -z "$CLASP_CREDENTIALS" ]; then
            echo "CLASP_CREDENTIALS not set — nothing to do."
            echo "See the header of this workflow for the setup."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.gate.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install clasp
        if: steps.gate.outputs.ready == 'true'
        # Pinned. The credential file format is clasp's own, so the version that
        # WROTE ~/.clasprc.json and the version that reads it here have to agree
        # — an unpinned major upgrade would break the sync silently, at 04:40,
        # on the one layer that exists to catch silent breakage.
        run: npm install -g @google/clasp@3.3.0

      - name: Authenticate
        if: steps.gate.outputs.ready == 'true'
        env:
          CLASP_CREDENTIALS: ${{ secrets.CLASP_CREDENTIALS }}
        run: printf '%s' "$CLASP_CREDENTIALS" > ~/.clasprc.json

      - name: Pull the live project
        if: steps.gate.outputs.ready == 'true'
        run: |
          mkdir -p gas
          # .clasp.json is generated per-run rather than committed. clasp
          # rewrites this file as it works, so a committed copy would produce
          # spurious diffs on every run; the script ID it needs is the env var
          # above, which IS in the repo.
          printf '{"scriptId":"%s","rootDir":"gas"}\n' "$GAS_SCRIPT_ID" > .clasp.json
          clasp pull
          rm -f .clasp.json
          # clasp writes appsscript.json (the manifest). Keep it — a change to
          # scopes or the runtime is exactly the kind of drift worth seeing.
          ls -la gas/

      - name: Commit if the live project has drifted
        if: steps.gate.outputs.ready == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gas/
          if git diff --cached --quiet; then
            echo "Apps Script matches the repo — no drift."
            exit 0
          fi
          echo "DRIFT: the live Apps Script project differs from gas/."
          git diff --cached --stat
          git commit -m "chore: sync Apps Script from the live project"
          for i in 1 2 3; do
            if git push; then exit 0; fi
            git fetch origin main && git rebase origin/main || exit 1
          done
          exit 1
