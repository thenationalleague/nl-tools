name: Probe FA Full-Time

# Can a GitHub runner read fulltime.thefa.com? The Cloud Function route is
# refused by Cloudflare's bot challenge from Google's address space
# (11/09/2026). This runs scripts/fulltime-probe.js — a plain fetch and a
# headless-Chrome fetch of one division's table — and writes what each got to
# the run summary. Read-only, no credentials. Run it from the Actions tab.

on:
  workflow_dispatch:
    inputs:
      division:
        description: "Full-Time selectedDivision (default: Academy North)"
        default: "355815748"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install puppeteer-core
        run: npm install --no-save puppeteer-core

      - name: Probe
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          FT_DIVISION: ${{ inputs.division }}
        run: node scripts/fulltime-probe.js
