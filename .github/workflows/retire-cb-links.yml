name: Button · Retire Commercial Benchmarking links

# ONE-OFF (13/11/2026). Remove in the next PR once it has run.
#
# Commercial Benchmarking gave each club a private link,
# /commercial-benchmarking/link.html?t=<token>, backed by a copy of the
# club's row at app-data/ops-commercial-benchmarking/links/<token>. Retired
# 13/11/2026 (Richard: "blitz it and we reissue codes"): clubs now open the
# dashboard at /commercial-benchmarking/club/ with their club code. The page
# change and the rules change ship in the same PR; this clears the data.
# See system/retired/commercial-benchmarking-links.md.
#
# report (default): counts only, nothing written. Actions logs on this repo
#   are public, so no token, code or person is ever printed. It does print
#   the names of benchmarking clubs the club codes do not recognise: those
#   names are already public (aggregates/roster is readable by anyone) and
#   are what Richard needs to fix a code record.
# retire: type "retire" in the confirm box. In order, stopping at the first
#   failure:
#     1. save the links node to the private bucket, retired/<date>/
#     2. copy each club's confirmation onto its own row (clubs/<club>/confirm)
#        where the row has none
#     3. delete the links node, and check it is gone
#     4. write one audit line

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'report = count only. retire = save, copy confirmations, delete.'
        required: true
        default: report
        type: choice
        options: [report, retire]
      confirm:
        description: 'Type "retire" to allow retire mode.'
        required: false
        default: ''

permissions:
  contents: read
  id-token: write

jobs:
  retire:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DB: https://nl-tools-default-rtdb.europe-west1.firebasedatabase.app
      ROOT: app-data/ops-commercial-benchmarking
      BUCKET: nl-tools-monthly-backups
      MODE: ${{ inputs.mode }}
    steps:
      - name: Check the confirmation
        if: inputs.mode == 'retire' && inputs.confirm != 'retire'
        run: |
          echo "::error::Retire mode needs the confirm box to say exactly: retire"
          exit 1

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Read what is there
        run: |
          set -euo pipefail
          TOKEN=$(gcloud auth print-access-token)
          get() {
            code=$(curl -sS -o "$2" -w '%{http_code}' -H "Authorization: Bearer $TOKEN" "$DB/$1.json")
            if [ "$code" != "200" ]; then echo "::error::RTDB read of one node failed with HTTP $code"; exit 1; fi
          }
          get "$ROOT/links" links.json
          get "$ROOT/clubs" clubs.json
          get "$ROOT/aggregates/roster" roster.json
          get "app-data/club-codes/clubs" codes.json
          if [ "$(cat codes.json)" = "null" ]; then get "app-data/club-codes/config/clubs" codes.json; fi

      - name: Report, and retire if asked
        run: |
          set -euo pipefail
          TOKEN=$(gcloud auth print-access-token) node - <<'JS'
          const fs = require('fs');
          const load = (f) => JSON.parse(fs.readFileSync(f, 'utf8')) || {};
          const links = load('links.json'), clubs = load('clubs.json'), codes = load('codes.json');
          const roster = Array.isArray(load('roster.json')) ? load('roster.json') : [];
          const fold = (s) => String(s == null ? '' : s).trim().toLowerCase();

          const tokens = Object.keys(links);
          const confirmedLinks = tokens.filter((t) => links[t] && links[t].confirm && links[t].confirm.confirmed);
          console.log(`Links: ${tokens.length}. Confirmed through a link: ${confirmedLinks.length}.`);
          console.log(`Club rows: ${Object.keys(clubs).length}. Already confirmed on the row: ${Object.keys(clubs).filter((k) => clubs[k] && clubs[k].confirm).length}.`);

          /* Does each benchmarking club have a club code the page will match?
             The page and the rules compare the code's club name with the row
             key, case-folded; the rules cannot trim, so a name that only
             matches once trimmed would load the page and then be refused. */
          const names = Object.keys(codes).map((k) => (codes[k] && codes[k].name) || '');
          const exact = new Set(names.map((n) => String(n).toLowerCase()));
          const trimmed = new Set(names.map(fold));
          let ok = 0; const spaced = [], missing = [];
          roster.forEach((e) => {
            const c = e && e.club; if (!c) return;
            if (exact.has(String(c).toLowerCase())) ok++;
            else if (trimmed.has(fold(c))) spaced.push(c);
            else missing.push(c);
          });
          console.log(`Roster clubs with a matching club code: ${ok} of ${roster.length}.`);
          if (spaced.length) console.log(`Code name has stray spaces (fix in Access → Codes): ${spaced.join(', ')}`);
          if (missing.length) console.log(`No club code under this name (fix in Access → Codes): ${missing.join(', ')}`);

          (async () => {
            if (process.env.MODE !== 'retire') { console.log('Report only: nothing written.'); return; }
            const H = { Authorization: `Bearer ${process.env.TOKEN}`, 'Content-Type': 'application/json' };
            const now = Date.now(), date = new Date(now).toISOString().slice(0, 10);

            // 1. Save first. Nothing is deleted unless this succeeds.
            const name = encodeURIComponent(`retired/${date}/commercial-benchmarking-links.json`);
            const up = await fetch(`https://storage.googleapis.com/upload/storage/v1/b/${process.env.BUCKET}/o?uploadType=media&name=${name}`,
              { method: 'POST', headers: H, body: JSON.stringify(links) });
            if (!up.ok) { console.log(`::error::Saving to the bucket failed with HTTP ${up.status}. Nothing deleted.`); process.exit(1); }
            console.log(`Saved to gs://${process.env.BUCKET}/retired/${date}/commercial-benchmarking-links.json`);

            // 2. Confirmations onto the club's own row, where it has none.
            let copied = 0, noRow = 0;
            for (const t of confirmedLinks) {
              const c = links[t].club;
              if (!c || !clubs[c]) { noRow++; continue; }
              if (clubs[c].confirm) continue;
              const r = await fetch(`${process.env.DB}/${process.env.ROOT}/clubs/${encodeURIComponent(c)}/confirm.json`,
                { method: 'PUT', headers: H, body: JSON.stringify(links[t].confirm) });
              if (!r.ok) { console.log(`::error::Copying a confirmation failed with HTTP ${r.status}. Nothing deleted.`); process.exit(1); }
              copied++;
            }
            console.log(`Confirmations copied onto club rows: ${copied}. With no row to copy to: ${noRow}.`);

            // 3. Delete, then check.
            const del = await fetch(`${process.env.DB}/${process.env.ROOT}/links.json`, { method: 'DELETE', headers: H });
            if (!del.ok) { console.log(`::error::Delete failed with HTTP ${del.status}.`); process.exit(1); }
            const after = await (await fetch(`${process.env.DB}/${process.env.ROOT}/links.json?shallow=true`, { headers: H })).json();
            if (after !== null) { console.log('::error::The links node is still there.'); process.exit(1); }
            console.log('Links node deleted, and checked gone.');

            // 4. One audit line.
            const entry = { action: 'cb_links_retired', detail: `Commercial Benchmarking links retired: ${tokens.length} (saved to the private bucket); confirmations copied: ${copied}`, uid: 'system', name: 'NL Tools', email: '', ts: now, at: new Date(now).toISOString() };
            await fetch(`${process.env.DB}/admin/audit/${now}_cb_links.json`, { method: 'PUT', headers: H, body: JSON.stringify(entry) });
          })().catch((e) => { console.log(`::error::${e.message}`); process.exit(1); });
          JS
