name: Button · Retire Claudio's data

# ONE-OFF (13/11/2026). Remove in the next PR once it has run.
#
# Claudio was retired on 30/10/2026 (system/retired/claudio.md) and left
# three things in the database: everyone's chat history, a usage node the
# page read and nothing wrote, and the real daily usage figures Apps Script
# wrote at the database root. The Roadmap item "Claudio's leftovers" (decided
# 13/11/2026) deletes them, chat history included: it may hold HR questions.
#
# report (default): counts only, nothing written. Actions logs on this repo
#   are public, so it prints numbers, never a name, a uid or a message.
# retire: type "retire" in the confirm box. In order, stopping at the first
#   failure:
#     1. save all three nodes, as one file, to the private bucket,
#        retired/<date>/claudio-data.json
#     2. delete each node, and check each is gone
#     3. write one audit line

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'report = count only. retire = save, then delete.'
        required: true
        default: report
        type: choice
        options: [report, retire]
      confirm:
        description: 'Type "retire" to allow retire mode.'
        required: false
        default: ''

permissions:
  contents: read
  id-token: write

jobs:
  retire:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DB: https://nl-tools-default-rtdb.europe-west1.firebasedatabase.app
      BUCKET: nl-tools-monthly-backups
      MODE: ${{ inputs.mode }}
    steps:
      - name: Check the confirmation
        if: inputs.mode == 'retire' && inputs.confirm != 'retire'
        run: |
          echo "::error::Retire mode needs the confirm box to say exactly: retire"
          exit 1

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Report, and retire if asked
        run: |
          set -euo pipefail
          TOKEN=$(gcloud auth print-access-token) node - <<'JS'
          const NODES = ['app-data/staff-claudio/conversations', 'app-data/staff-claudio/usage', 'claudio'];
          const H = { Authorization: `Bearer ${process.env.TOKEN}`, 'Content-Type': 'application/json' };
          const url = (p, q) => `${process.env.DB}/${p}.json${q || ''}`;
          const count = (o) => (o && typeof o === 'object' ? Object.keys(o).length : 0);

          (async () => {
            const got = {};
            for (const p of NODES) {
              const r = await fetch(url(p), { headers: H });
              if (!r.ok) { console.log(`::error::Reading one node failed with HTTP ${r.status}. Nothing written.`); process.exit(1); }
              got[p] = await r.json();
            }
            const conv = got[NODES[0]] || {};
            const people = Object.keys(conv);
            const chats = people.reduce((n, u) => n + count(conv[u]), 0);
            const messages = people.reduce((n, u) => n + Object.values(conv[u] || {}).reduce((m, c) => m + count(c && c.messages), 0), 0);
            const rootUsage = (got.claudio && got.claudio.usage) || {};
            const days = Object.values(rootUsage).reduce((n, d) => n + count(d), 0);
            const bytes = Buffer.byteLength(JSON.stringify(got));
            console.log(`Chat history: ${people.length} people, ${chats} conversations, ${messages} messages.`);
            console.log(`Usage the page read (never written): ${count(got[NODES[1]])} people.`);
            console.log(`Usage at the database root: ${count(rootUsage)} people, ${days} person-days. Other keys under claudio/: ${count(got.claudio) - (got.claudio && got.claudio.usage ? 1 : 0)}.`);
            console.log(`All three together: ${Math.round(bytes / 1024)} KB.`);

            if (process.env.MODE !== 'retire') { console.log('Report only: nothing written.'); return; }
            const held = NODES.filter((p) => got[p] !== null);
            if (!held.length) { console.log('Nothing to retire: all three are already empty.'); return; }
            const now = Date.now(), date = new Date(now).toISOString().slice(0, 10);

            // 1. Save first. Nothing is deleted unless this succeeds.
            const name = encodeURIComponent(`retired/${date}/claudio-data.json`);
            const up = await fetch(`https://storage.googleapis.com/upload/storage/v1/b/${process.env.BUCKET}/o?uploadType=media&name=${name}`,
              { method: 'POST', headers: H, body: JSON.stringify(got) });
            if (!up.ok) { console.log(`::error::Saving to the bucket failed with HTTP ${up.status}. Nothing deleted.`); process.exit(1); }
            console.log(`Saved to gs://${process.env.BUCKET}/retired/${date}/claudio-data.json`);

            // 2. Delete each, then check each.
            for (const p of held) {
              const del = await fetch(url(p), { method: 'DELETE', headers: H });
              if (!del.ok) { console.log(`::error::Deleting one node failed with HTTP ${del.status}.`); process.exit(1); }
              const after = await (await fetch(url(p, '?shallow=true'), { headers: H })).json();
              if (after !== null) { console.log('::error::A node is still there after its delete.'); process.exit(1); }
            }
            console.log(`Deleted ${held.length} node(s), and checked gone.`);

            // 3. One audit line.
            const entry = { action: 'claudio_data_retired', detail: `Claudio's data retired: ${chats} conversations, ${days} usage days (saved to the private bucket)`, uid: 'system', name: 'NL Tools', email: '', ts: now, at: new Date(now).toISOString() };
            await fetch(url(`admin/audit/${now}_claudio_data`), { method: 'PUT', headers: H, body: JSON.stringify(entry) });
          })().catch((e) => { console.log(`::error::${e.message}`); process.exit(1); });
          JS
