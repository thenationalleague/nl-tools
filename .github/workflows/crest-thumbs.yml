name: Build image asset tiers

# Keeps the downscaled tiers in sync with their full-size sources:
#   assets/crests/thumbs   (96px)   assets/crests/medium   (256px)
#   assets/divisions/medium (256px)
# Add or remove a crest or division badge and the matching tier file is
# regenerated (or pruned) automatically — you never touch a tier folder by hand.
#
# The graphics tools draw these small (crests at 36-50px, division badges at
# ~180-240px) but were fetching the full-size art, which is how a table on a
# slow connection exported with crests missing. Sponsors are deliberately NOT
# tiered: they are already ~65KB and draw at ~516px, so a 256px tier would
# upscale them.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'assets/crests/*.png'
      - 'assets/divisions/*.png'
      - 'scripts/build-crest-thumbs.py'
      - '.github/workflows/crest-thumbs.yml'

permissions:
  contents: write

concurrency:
  group: crest-thumbs
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Pillow
        run: |
          python -m pip install --upgrade pip
          pip install Pillow

      - name: Sync with origin/main (clean tree)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main

      - name: Build image asset tiers
        run: python3 -u scripts/build-crest-thumbs.py

      - name: Commit & push if changed
        run: |
          TIERS="assets/crests/thumbs assets/crests/medium assets/divisions/medium"
          if [ -z "$(git status --porcelain $TIERS)" ]; then
            echo "Image asset tiers already up to date"
            exit 0
          fi
          git add -A $TIERS
          git commit -m "Rebuild image asset tiers (crests + divisions)"
          git fetch origin main
          git pull --rebase origin main
          git push origin HEAD:main
