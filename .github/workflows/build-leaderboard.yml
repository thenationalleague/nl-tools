name: Build predictor leaderboard

# Pre-computes the Score Predictor's leaderboard into the nl-widgets database.
#
# The widget currently builds its standings in the browser from `users` and
# `predictions` read at tree root, and that root read is what makes every fan's
# id listable. Until a pre-aggregated table exists, the security rules cannot be
# tightened without both tables going blank — see embeds/auth-hardening-plan.md
# §4. This job is that table.
#
# It writes only what the leaderboard already displays in public: a name, a
# crest, three numbers. No jwtIds — the script refuses to write if one appears.
#
# Standings become periodic rather than live. They only change when matches
# finish, so a quarter of an hour is well inside the resolution anyone notices.
# GitHub's scheduler is best-effort and runs late under load; that is acceptable
# here and would not be for anything a fan is waiting on.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Compute and print without writing to the database'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write   # exchange the GitHub OIDC token for a Google credential

# A run that overlaps its predecessor would write the same node twice. The
# newer run has fresher results, so let it cancel the older one.
concurrency:
  group: build-leaderboard
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # No key, and no SDK. The NL Google org blocks service-account key
      # creation, so this reuses the federation the GA pipeline already uses:
      # GitHub's OIDC token is exchanged for a short-lived Google credential.
      #
      # token_format: access_token matters. The default writes an "external
      # account" credentials file, which firebase-admin refuses to parse — it
      # only understands service-account and authorized-user files. A bearer
      # token works against the database's REST API, which is what the script
      # uses, so no admin SDK is installed at all.
      #
      # The service account behind this needs Firebase Realtime Database Admin
      # on nl-widgets, granted in that project's IAM. A cross-project grant, no
      # new pool.
      - name: Authenticate to Google Cloud
        id: auth
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/firebase.database,https://www.googleapis.com/auth/userinfo.email

      - name: Build and write the leaderboard
        env:
          # Expires within the hour. Admin-level access, which bypasses the
          # security rules — that is how it writes a node no client may write.
          GOOGLE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          if [ "${{ steps.auth.outcome }}" != "success" ]; then
            # Skip rather than fail on the schedule: while the IAM grant is
            # missing this would go red every 15 minutes and train everyone to
            # ignore a red cross on this repo. A manual run still fails loudly,
            # which is when someone is actually looking.
            echo "::warning::No Google credential — grant the CI service account Firebase Realtime Database Admin on nl-widgets. Skipping."
            [ "${{ github.event_name }}" = "workflow_dispatch" ] && exit 1
            exit 0
          fi
          node scripts/build-leaderboard.js ${{ inputs.dry_run && '--dry-run' || '' }}
