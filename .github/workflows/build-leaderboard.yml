name: Build predictor leaderboard

# Pre-computes the Score Predictor's leaderboard into the nl-widgets database.
#
# The widget currently builds its standings in the browser from `users` and
# `predictions` read at tree root, and that root read is what makes every fan's
# id listable. Until a pre-aggregated table exists, the security rules cannot be
# tightened without both tables going blank — see embeds/auth-hardening-plan.md
# §4. This job is that table.
#
# It writes only what the leaderboard already displays in public: a name, a
# crest, three numbers. No jwtIds — the script refuses to write if one appears.
#
# Standings become periodic rather than live. They only change when matches
# finish, so a quarter of an hour is well inside the resolution anyone notices.
# GitHub's scheduler is best-effort and runs late under load; that is acceptable
# here and would not be for anything a fan is waiting on.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Compute and print without writing to the database'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write   # exchange the GitHub OIDC token for a Google credential

# A run that overlaps its predecessor would write the same node twice. The
# newer run has fresher results, so let it cancel the older one.
concurrency:
  group: build-leaderboard
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # --no-save, matching render-handbook-pdf: the aggregator is the only
      # thing in this repo that needs the admin SDK, and it is a large tree.
      - name: Install the Firebase admin SDK
        run: npm install --no-save firebase-admin@^12

      # No key. The NL Google org blocks service-account key creation, so this
      # reuses the same federation the GA pipeline already uses: GitHub's OIDC
      # token is exchanged for a short-lived Google credential. The service
      # account behind it needs Firebase Realtime Database Admin on nl-widgets,
      # granted in that project's IAM — a cross-project grant, no new pool.
      - name: Authenticate to Google Cloud
        id: auth
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Build and write the leaderboard
        env:
          # Optional fallback for an environment without federation. If set it
          # wins; it is a credential, so repository secret only, never
          # committed. Either way the credential has admin access, which
          # bypasses the security rules — that is how it writes a node no
          # client is allowed to write.
          NL_WIDGETS_SA_KEY: ${{ secrets.NL_WIDGETS_SA_KEY }}
        run: |
          if [ -z "$NL_WIDGETS_SA_KEY" ] && [ "${{ steps.auth.outcome }}" != "success" ]; then
            # Skip rather than fail on the schedule: until the IAM grant is in
            # place this would go red every 15 minutes and train everyone to
            # ignore a red cross on this repo. A manual run still fails loudly,
            # which is when someone is actually looking.
            echo "::warning::No Google credential — grant the CI service account Firebase Realtime Database Admin on nl-widgets. Skipping."
            [ "${{ github.event_name }}" = "workflow_dispatch" ] && exit 1
            exit 0
          fi
          node scripts/build-leaderboard.js ${{ inputs.dry_run && '--dry-run' || '' }}
