name: WP5 history rewrite (one-shot)

# Strips the July 2026 personal-data exposure from ALL git history and
# force-pushes every branch. Manual dispatch only. Safe to re-run: it
# aborts without pushing unless the rewritten main's tree is byte-identical
# to the pre-rewrite main (i.e. the live site is provably unchanged).
#
# Procedure validated in full locally on 25/07/2026 (3,190 commits; strip
# list from a complete scan of 11,654 historical objects). After this runs,
# ask GitHub Support to purge cached/unreferenced objects — the rewrite
# alone does not remove GitHub's server-side copies of old commits.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type REWRITE-HISTORY to confirm'
        required: true

permissions:
  contents: write

concurrency:
  group: wp5-history-rewrite
  cancel-in-progress: false

jobs:
  rewrite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Guard - explicit confirmation
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "REWRITE-HISTORY" ]; then
            echo "Confirmation phrase not provided - aborting."; exit 1
          fi

      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch all branches as local heads
        run: git fetch origin '+refs/heads/*:refs/heads/*'

      - name: Install git-filter-repo
        run: pip install --quiet git-filter-repo

      - name: Record pre-rewrite state and save clean pages
        run: |
          git checkout -q main
          ORIG_TREE=$(git rev-parse 'HEAD^{tree}')
          echo "ORIG_TREE=$ORIG_TREE" >> "$GITHUB_ENV"
          echo "Pre-rewrite main: $(git rev-parse HEAD) tree: $ORIG_TREE"
          mkdir -p /tmp/keep/club-directory /tmp/keep/dazn-vip /tmp/keep/meeting-notes
          cp club-directory/index.html /tmp/keep/club-directory/
          cp dazn-vip/index.html       /tmp/keep/dazn-vip/
          cp meeting-notes/index.html  /tmp/keep/meeting-notes/

      - name: Rewrite history (strip personal-data paths from all refs)
        run: |
          git filter-repo --force --invert-paths \
            --path club-directory/exported \
            --path dazn-vip/dazn-vip.seed.json \
            --path dazn-vip/non-clubs-seed.json \
            --path dazn-vip/app-data-with-media-dazn-vip.json \
            --path handbook/handbook-content.json \
            --path club-directory/index.html \
            --path dazn-vip/index.html \
            --path meeting-notes/index.html

      - name: Restore current clean pages on main
        run: |
          git checkout -q main
          mkdir -p club-directory dazn-vip meeting-notes
          cp /tmp/keep/club-directory/index.html club-directory/
          cp /tmp/keep/dazn-vip/index.html       dazn-vip/
          cp /tmp/keep/meeting-notes/index.html  meeting-notes/
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add club-directory/index.html dazn-vip/index.html meeting-notes/index.html
          git commit -m "Restore current club-directory, dazn-vip and meeting-notes pages

          History rewrite (25/07/2026): historical versions of these three pages
          contained personal contact data and were stripped from all commits along
          with the deleted data files. These are the current, sanitised versions,
          re-added unchanged."

      - name: VERIFY - tree identical and stripped paths gone (abort otherwise)
        run: |
          NEW_TREE=$(git rev-parse 'HEAD^{tree}')
          echo "new tree: $NEW_TREE / expected: $ORIG_TREE"
          if [ "$NEW_TREE" != "$ORIG_TREE" ]; then
            echo "TREE MISMATCH - the site would change. Aborting without pushing."; exit 1
          fi
          LEFT=$(git rev-list --objects --all | grep -cE 'club-directory/exported|dazn-vip/(dazn-vip\.seed|non-clubs-seed|app-data-with-media)|handbook/handbook-content' || true)
          if [ "$LEFT" != "0" ]; then
            echo "Stripped paths still reachable ($LEFT) - aborting."; exit 1
          fi
          echo "Verification passed."

      - name: Force-push all rewritten branches
        run: |
          git remote remove origin 2>/dev/null || true
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push --force origin 'refs/heads/*:refs/heads/*'
          echo "Done. New main: $(git rev-parse main)"
