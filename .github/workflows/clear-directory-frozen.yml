name: Button · Clear Club Directory frozen copies

# ONE-OFF, 11/11/2026. Deleted again straight after its run; the record of
# what it did is system/retired/club-directory-codes.md.
#
# Deletes two Club Directory leftovers nothing reads any more:
#   - app-data/ops-club-directory/editions — frozen copies Publish used to
#     take, before the change log and undo existed (stopped 11/11/2026);
#   - app-data/ops-club-directory/bake — the record of the one-off build that
#     first filled the directory.
# The daily and monthly database backups do the editions' job better.
# Everything is saved first to the private bucket nl-tools-monthly-backups
# under retired/. The log is public: counts only.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'report = count only. clear = delete.'
        required: true
        default: report
        type: choice
        options: [report, clear]
      confirm:
        description: 'Type "clear" to allow clear mode.'
        required: false
        default: ''

permissions:
  contents: read
  id-token: write

jobs:
  clear:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MODE: ${{ inputs.mode }}
      DB: https://nl-tools-default-rtdb.europe-west1.firebasedatabase.app
    steps:
      - name: Check the confirmation
        if: inputs.mode == 'clear'
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "clear" ]; then echo "::error::Clear mode needs the confirm box to say exactly: clear"; exit 1; fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Count, save and clear
        run: |
          set -euo pipefail
          export TOKEN=$(gcloud auth print-access-token)
          node --input-type=module - <<'JS'
          const { TOKEN, DB, MODE } = process.env;
          async function call(url, opts = {}) {
            const r = await fetch(url, { ...opts, headers: { Authorization: 'Bearer ' + TOKEN, ...(opts.headers || {}) } });
            if (!r.ok) throw new Error(`${opts.method || 'GET'} ${url.split('?')[0]} → HTTP ${r.status}: ${(await r.text()).slice(0, 300)}`);
            return r;
          }
          const ROOT = 'app-data/ops-club-directory';
          const NODES = ['editions', 'bake'];
          const saved = {};
          const lines = [`## Club Directory frozen copies – ${MODE}`, ''];
          for (const n of NODES) {
            const raw = await (await call(`${DB}/${ROOT}/${n}.json`)).text();
            const v = JSON.parse(raw);
            saved[n] = v;
            const count = v && typeof v === 'object' ? Object.keys(v).length : 0;
            lines.push(`- ${n}: ${v == null ? 'already empty' : count + ' entries, ' + Math.round(raw.length / 1024) + ' KB'}`);
          }
          if (MODE !== 'clear') {
            lines.push('', 'Nothing deleted. Run again with mode clear and type clear to delete these.');
          } else {
            const name = `retired/${new Date().toISOString().replace(/[:.]/g, '-')}/club-directory-frozen-copies.json`;
            await call(`https://storage.googleapis.com/upload/storage/v1/b/nl-tools-monthly-backups/o?uploadType=media&name=${encodeURIComponent(name)}`,
              { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(saved) });
            lines.push('', `Saved first to nl-tools-monthly-backups/${name}.`);
            for (const n of NODES) if (saved[n] != null) await call(`${DB}/${ROOT}/${n}.json`, { method: 'DELETE' });
            for (const n of NODES) {
              if ((await (await call(`${DB}/${ROOT}/${n}.json`)).json()) != null) throw new Error(`${n} is still there after deleting.`);
            }
            lines.push('- Deleted, and checked gone.');
            const now = Date.now();
            await call(`${DB}/admin/audit/${now}_${Math.random().toString(36).slice(2, 8)}.json`, { method: 'PUT',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ action: 'retired_data_cleared', detail: 'Club Directory: editions (frozen copies) and bake',
                uid: 'github-actions', name: 'Button · Clear Club Directory frozen copies', email: '', ts: now, at: new Date(now).toISOString() }) });
          }
          const text = lines.join('\n');
          console.log(text);
          (await import('node:fs')).appendFileSync(process.env.GITHUB_STEP_SUMMARY, text + '\n');
          JS
