name: Fixtures & results graphics

# Makes the fixtures and results cards for National, North, South and the
# NL Cup on its own, and drops them into the media Shared Drive
# (Graphics/<date> <competition> <Fixtures|Results>/) and Firebase Storage.
#
#   Fixtures  10am UK, two days before a round's first game: the whole round.
#   Matchday  4am UK on each day of a round that spans more than one day:
#             that day's games only (Saturday without the Friday game).
#   Results   one card per day per competition, as soon as every game that
#             day is full time or abandoned (A - A) — checked every 15
#             minutes from midday UK. A day with a late kick-off (the 17:30
#             on a 3pm Saturday) also gets an "early" card once the 3pm games
#             are done. A score corrected after a card has gone sends the
#             card again as v2.
#   Tables    with every results card: the league table, or Cup groups A–D,
#             once the feed's table has caught up with the scores.
#
# Rules for round numbers: assets/data/rounds-<season>.json. Rendering:
# scripts/build-fixtures-graphics.js. Delivery: scripts/deliver-fixtures-graphics.js.
#
# TO TEST: Actions → Fixtures & results graphics → Run workflow. Pick what,
# which competition and a date to pretend is today. "Dry run" (on by
# default) sends nothing anywhere: the PNGs are a download at the bottom of
# the run page. A dry run also ignores what has already been delivered, so
# a past date can be rendered again as often as you like.

on:
  schedule:
    # GitHub's timer runs late around the top of the hour, so these sit off it.
    # Fixtures: both lines fire; the job proceeds in any that is 10am UK or
    # later (09:03 UTC is 10:03 in summer, too early in winter).
    - cron: '3 9,10 * * *'
    # Matchday: today's games only, from 4am UK (03:03 UTC is 04:03 in
    # summer, too early in winter). Same once-only record.
    - cron: '3 3,4 * * *'
    # Results: 12:07–23:52 UTC covers every finish, Sunday lunchtime to late midweek.
    - cron: '7,22,37,52 12-23 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'What to make'
        type: choice
        options: [results, fixtures, matchday]
        default: results
      division:
        description: 'Competition'
        type: choice
        options: [all, National, North, South, Cup]
        default: all
      today:
        description: 'Pretend today is (YYYY-MM-DD). Leave blank for the real today. Fixtures are made for two days after this.'
        required: false
        default: ''
      dry_run:
        description: 'Dry run – make the PNGs but send nothing to Drive or Storage'
        type: boolean
        default: true
      tables_anyway:
        description: 'Testing a past date? Tick to draw the tables anyway (they show the current standings)'
        type: boolean
        default: false
      before_late:
        description: 'Testing a past date with a late kick-off? Tick to make the early card, as if the late game had not started'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: fixtures-graphics
  cancel-in-progress: false

env:
  # The "Graphics" folder in the media Shared Drive. Not a secret: the ID
  # grants nothing on its own; the service account's Content manager role
  # on that folder is what lets this job write there.
  DRIVE_FOLDER_ID: 1v3jZ1HjJutR6JepAgh1kueaFm-CAArNg

jobs:
  graphics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Decide what this run is for
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          IN_MODE: ${{ inputs.mode }}
          IN_DIVISION: ${{ inputs.division }}
          IN_TODAY: ${{ inputs.today }}
          IN_DRY: ${{ inputs.dry_run }}
          IN_TABLES_ANYWAY: ${{ inputs.tables_anyway }}
          IN_BEFORE_LATE: ${{ inputs.before_late }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "mode=$IN_MODE" >> "$GITHUB_OUTPUT"
            echo "division=$IN_DIVISION" >> "$GITHUB_OUTPUT"
            echo "today=$IN_TODAY" >> "$GITHUB_OUTPUT"
            echo "dry=$IN_DRY" >> "$GITHUB_OUTPUT"
            echo "tables_anyway=$IN_TABLES_ANYWAY" >> "$GITHUB_OUTPUT"
            echo "before_late=$IN_BEFORE_LATE" >> "$GITHUB_OUTPUT"
            echo "go=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "division=all" >> "$GITHUB_OUTPUT"
          echo "today=" >> "$GITHUB_OUTPUT"
          echo "dry=false" >> "$GITHUB_OUTPUT"
          if [ "$SCHEDULE" = "3 9,10 * * *" ]; then
            echo "mode=fixtures" >> "$GITHUB_OUTPUT"
            # From 10am UK on. "Exactly the 10 o'clock hour" meant a run GitHub
            # started late (it does, by hours on a bad day) made no card at
            # all. Both lines can now proceed after 10; the once-only record
            # stops the second making the card again.
            if [ "$(TZ=Europe/London date +%-H)" -ge 10 ]; then echo "go=true" >> "$GITHUB_OUTPUT"
            else echo "Before 10am UK — the later fixtures line handles today."; echo "go=false" >> "$GITHUB_OUTPUT"; fi
          elif [ "$SCHEDULE" = "3 3,4 * * *" ]; then
            echo "mode=matchday" >> "$GITHUB_OUTPUT"
            if [ "$(TZ=Europe/London date +%-H)" -ge 4 ]; then echo "go=true" >> "$GITHUB_OUTPUT"
            else echo "Before 4am UK — the later matchday line handles today."; echo "go=false" >> "$GITHUB_OUTPUT"; fi
          else
            echo "mode=results" >> "$GITHUB_OUTPUT"
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      # Every folder a graphic loads an image from must be listed here. The
      # table's sponsor logo lives in assets/partners; leaving it out held
      # back every table on the first test (09/10/2026). Files sitting
      # directly in a listed folder's parents (the white rose in
      # assets/crests/) come along automatically.
      - name: Checkout (only what the cards need)
        if: steps.plan.outputs.go == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            graphics
            scripts
            system
            assets/data
            assets/divisions
            assets/crests/medium
            assets/partners

      - name: Setup Node
        if: steps.plan.outputs.go == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Same keyless federation as the other jobs. token_format: access_token
      # with explicit scopes, because Drive is not covered by the default
      # cloud-platform scope.
      - name: Authenticate to Google
        id: auth
        if: steps.plan.outputs.go == 'true' && steps.plan.outputs.dry != 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive,https://www.googleapis.com/auth/devstorage.read_write

      - name: List cards already delivered
        if: steps.plan.outputs.go == 'true' && steps.plan.outputs.dry != 'true'
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          TODAY: ${{ steps.plan.outputs.today }}
        run: |
          set -euo pipefail
          SEASON=$(node -e "const m=require('./scripts/build-fixtures-graphics.js');const t=process.argv[1]||new Date().toLocaleDateString('en-CA',{timeZone:'Europe/London'});console.log(m.seasonLabel(m.seasonStart(m.addDays(t,2))))" "$TODAY")
          node scripts/deliver-fixtures-graphics.js delivered "$SEASON" > done.txt
          echo "$(wc -l < done.txt) cards already delivered for $SEASON"

      - name: Make the cards that are due
        id: make
        if: steps.plan.outputs.go == 'true'
        env:
          MODE: ${{ steps.plan.outputs.mode }}
          DIVISION: ${{ steps.plan.outputs.division }}
          TODAY: ${{ steps.plan.outputs.today }}
          TABLES_ANYWAY: ${{ steps.plan.outputs.tables_anyway }}
          BEFORE_LATE: ${{ steps.plan.outputs.before_late }}
        run: |
          set -euo pipefail
          ARGS=(--mode "$MODE" --division "$DIVISION" --out build/fixtures-graphics)
          [ -n "$TODAY" ] && ARGS+=(--today "$TODAY")
          [ -f done.txt ] && ARGS+=(--done done.txt)
          [ "${TABLES_ANYWAY:-}" = "true" ] && ARGS+=(--tables-anyway)
          [ "${BEFORE_LATE:-}" = "true" ] && ARGS+=(--before-late)
          node scripts/build-fixtures-graphics.js "${ARGS[@]}"
          echo "made=$(node -e "console.log(require('./build/fixtures-graphics/manifest.json').cards.length)")" >> "$GITHUB_OUTPUT"

      # Most results checks find nothing due; only keep a download when a
      # card was made, or when the run failed part-way and there is
      # something to look at.
      - name: Keep the PNGs on this run page
        if: always() && steps.plan.outputs.go == 'true' && steps.make.outputs.made != '0'
        uses: actions/upload-artifact@v4
        with:
          name: fixtures-graphics-${{ steps.plan.outputs.mode }}-${{ github.run_number }}
          path: build/fixtures-graphics
          if-no-files-found: ignore
          retention-days: 14

      - name: Send to Drive and Storage
        if: steps.plan.outputs.go == 'true' && steps.plan.outputs.dry != 'true' && steps.make.outputs.made != '0'
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: node scripts/deliver-fixtures-graphics.js upload build/fixtures-graphics

      # A card whose crest or badge never loaded was left out above. The rest
      # have gone; this turns the run red so the email says something is wrong.
      - name: Fail if a card was held back
        if: steps.plan.outputs.go == 'true' && steps.make.outcome == 'success'
        run: |
          node -e "const m=require('./build/fixtures-graphics/manifest.json');if(m.held.length){m.held.forEach(h=>console.log('::error::Held back '+h.id+' – missing '+h.missing.join(', ')));process.exit(1)}"
