name: Button · Tidy waiting and declined accounts

# One-off (14/11/2026). Accounts waiting for approval, and declined ones,
# were left holding a club, a club role and the tools asked for, which the
# database rules read. This clears those three on every waiting or declined
# account and nothing else. Report first: it counts and changes nothing.
# Then run with mode tidy and type tidy. Remove this file and
# scripts/tidy-waiting-accounts.mjs in the next PR once it has run.
# The log is public: counts only.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'report = count only. tidy = clear them.'
        required: true
        default: report
        type: choice
        options: [report, tidy]
      confirm:
        description: 'Type "tidy" to allow tidy mode.'
        required: false
        default: ''

permissions:
  contents: read
  id-token: write

jobs:
  tidy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DB: https://nl-tools-default-rtdb.europe-west1.firebasedatabase.app
      MODE: ${{ inputs.mode }}
    steps:
      - name: Refuse tidy without the word
        if: inputs.mode == 'tidy' && inputs.confirm != 'tidy'
        run: |
          echo "::error::Type tidy in the confirm box to run tidy mode."
          exit 1
      - uses: actions/checkout@v4
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - name: Count, and tidy if asked
        run: |
          set -euo pipefail
          TOKEN=$(gcloud auth print-access-token) node scripts/tidy-waiting-accounts.mjs
