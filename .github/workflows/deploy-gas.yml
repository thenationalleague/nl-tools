name: Deploy Apps Script

# Pushes gas/ INTO the live Apps Script project and redeploys the existing Web
# App, so a backend change ships from a reviewed diff instead of a paste.
#
# WHY THIS EXISTS
# ---------------
# sync-gas.yml made the repo see the backend. It did not make the repo able to
# change it, so editing still meant opening the Apps Script editor and pasting
# — and that asymmetry immediately produced exactly the failure it was supposed
# to end: the nl.tools domain migration was done in the repo copy in July and
# never pasted, so the live backend went on sending emails with the old
# github.io URLs for a month while the repo looked correct. A mirror you can
# only read is a mirror that quietly disagrees.
#
# This closes the loop. gas/ becomes the source of truth for the consolidated
# project, reviewed in a diff like every other file here.
#
# DELIBERATELY MANUAL
# -------------------
# workflow_dispatch only, never on push. This rewrites a running backend that
# serves the login page, invites, access requests, attendance fixture sync and
# the AI proxies. A bad merge must not be able to do that as a side effect of
# landing something unrelated. Someone presses the button, having read the
# diff. Same rule, and the same confirm box, as deploy-rtdb-rules.yml.
#
# THE GUARD THAT MAKES TWO-WAY SAFE
# ---------------------------------
# `clasp push` overwrites every file in the project. If someone edited the live
# project since the last sync, pushing would silently revert their work — the
# same class of loss this workflow exists to prevent, pointed the other way.
#
# So it pulls live first and compares it against THE LAST STATE WE PUT THERE OR
# LAST SAW THERE, recorded as a content fingerprint in `gas/.deployed`.
#
# This is the third shape of this guard. The first two were both wrong, and both
# wrong in a way that only showed up in use:
#
#   1. Compared live against THE BRANCH, and refused on any difference. That
#      refused precisely when there was something to deploy — the first real run
#      was blocked by the three files the PR had deliberately changed. A deploy
#      that cannot run when the repo has changes is not a deploy.
#
#   2. Compared live against the last commit made by sync-gas.yml. Better, but a
#      successful deploy CHANGES LIVE and so invalidates the baseline it just
#      checked against — and only the nightly sync ever wrote that baseline. So
#      every deploy after the first failed until 04:40 the next morning,
#      reporting an editor change that had never happened.
#
# gas/.deployed fixes both by being explicit rather than inferred: a sha256 over
# the files clasp manages, as they were when we last put them there or last saw
# them there. Both workflows write it — this one after a successful push,
# sync-gas.yml after it commits drift — so it is always the answer to "what do
# we believe is running?".
#
# A fingerprint rather than a commit SHA because a commit cannot contain its own
# SHA, so the sync could never record itself.
#
# When live matches it, nobody has touched the editor and the repo is free to be
# ahead, which is the normal and intended state. When live does NOT match it,
# someone edited the project directly and pushing would overwrite them.
#
# THE BASELINE HAS TO BE UPDATED BY THIS WORKFLOW TOO. Second version of this
# guard, and the second thing it got wrong: a successful deploy CHANGES LIVE, so
# it invalidates the very baseline it just checked against. Only the nightly
# sync wrote that baseline, which meant every deploy after the first one failed
# until 04:40 the next morning — reporting an editor change that had never
# happened.
#
# So on success this job records the new baseline itself. After a push, live and
# the repo match by definition, and saying so is the honest thing to record.
#
# KEEPING THE /exec URL
# ---------------------
# Every tool page calls a fixed /exec URL. `clasp deploy` with no arguments
# mints a NEW deployment and a new URL, the pages keep hitting the old code,
# and the change appears to do nothing — the single most common way an Apps
# Script deploy "fails" while reporting success.
#
# The deployment ID is the AKfycb… segment of that /exec URL, which is already
# in the repo as NL.endpoints.gas. It is read from there rather than configured
# separately, so the thing being deployed to is by construction the thing the
# pages call. The run then checks that ID actually exists in `clasp deployments`
# before deploying, and stops if it does not.

env:
  # NL Tools consolidated Apps Script project — same project as sync-gas.yml.
  GAS_SCRIPT_ID: 1Uiyk661Fasxn4h1Bhtd6rgkmn3XhkzsZJuJ9eCrr4aio2i0f7f53RtEZ

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish" to confirm you have read the diff'
        required: true
        default: ''
      description:
        description: 'Optional deployment note (shown in Apps Script version history)'
        required: false
        default: ''

permissions:
  # write, because a successful deploy records the new baseline (see above).
  contents: write

concurrency:
  # Never let a push and a pull run at once — they write the same directory
  # against the same project.
  group: gas-sync
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Refuse unless confirmed
        if: ${{ github.event.inputs.confirm != 'publish' }}
        run: |
          echo "::error::Type 'publish' in the confirm box to run this."
          exit 1

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # Full history: the guard finds the last sync commit by message, and
          # a shallow clone cannot see it.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install clasp
        # Pinned to match sync-gas.yml. The credential file format is clasp's
        # own, so the version that WROTE ~/.clasprc.json and the versions that
        # read it have to agree.
        run: npm install -g @google/clasp@3.3.0

      - name: Authenticate
        env:
          CLASP_CREDENTIALS: ${{ secrets.CLASP_CREDENTIALS }}
        run: |
          if [ -z "$CLASP_CREDENTIALS" ]; then
            echo "::error::CLASP_CREDENTIALS is not set. See sync-gas.yml for the setup."
            exit 1
          fi
          printf '%s' "$CLASP_CREDENTIALS" > ~/.clasprc.json
          if ! python3 -c "import json,sys; json.load(open(sys.argv[1]))" ~/.clasprc.json 2>/dev/null; then
            echo "::error::CLASP_CREDENTIALS is not valid JSON ($(wc -c < ~/.clasprc.json) bytes, $(wc -l < ~/.clasprc.json) lines)."
            echo "  Usually a copy-paste artefact — see the setup notes in sync-gas.yml."
            exit 1
          fi

      # ── The guard ──────────────────────────────────────────────────────────
      - name: Refuse if someone has edited the live project since the last sync
        run: |
          # Fingerprint of the files clasp manages: content only, order
          # independent, and computable from a working tree without needing a
          # commit — which a SHA-based marker could not be, since a commit
          # cannot contain its own SHA.
          gas_fingerprint() {
            ( cd "$1" 2>/dev/null || exit 0
              find . -maxdepth 1 -type f \( -name '*.js' -o -name 'appsscript.json' \) \
                | sed 's|^\./||' | LC_ALL=C sort \
                | while read -r f; do printf '%s %s\n' "$f" "$(sha256sum "$f" | cut -d' ' -f1)"; done
            ) | sha256sum | cut -d' ' -f1
          }

          EXPECTED=$(tr -d ' \n\r' < gas/.deployed 2>/dev/null || true)
          if [ -z "$EXPECTED" ]; then
            echo "::error::gas/.deployed is empty or missing."
            echo "  It must hold the fingerprint of what is currently live."
            echo "  Run 'Sync Apps Script' — it pulls live and writes this file."
            exit 1
          fi

          mkdir -p /tmp/gas-live
          printf '{"scriptId":"%s","rootDir":"/tmp/gas-live"}\n' "$GAS_SCRIPT_ID" > .clasp.json
          clasp pull
          rm -f .clasp.json

          ACTUAL=$(gas_fingerprint /tmp/gas-live)
          echo "believed live: $EXPECTED"
          echo "actually live: $ACTUAL"

          if [ "$EXPECTED" = "$ACTUAL" ]; then
            echo ""
            echo "Live is what we last put there. Nobody has edited the project directly."
            echo "This deploy will push:"
            diff -rq --exclude='*.md' --exclude='.deployed' /tmp/gas-live gas || true
          else
            echo "::error::The live Apps Script project is not what we last put there."
            echo ""
            echo "  Someone edited it in the editor. Pushing now would overwrite that."
            echo ""
            echo "  Run the 'Sync Apps Script' workflow, read the diff, merge the commit"
            echo "  it makes, then run this again. Do not force past it — that commit IS"
            echo "  the evidence of what would have been lost."
            echo ""
            echo "  Read the diff, though: the sync also RESTORES anything the repo has"
            echo "  deliberately deleted that live still has."
            exit 1
          fi

      - name: Push gas/ into the project
        run: |
          printf '{"scriptId":"%s","rootDir":"gas"}\n' "$GAS_SCRIPT_ID" > .clasp.json
          clasp push --force
          rm -f .clasp.json

      # ── Redeploy the EXISTING web app, never a new one ─────────────────────
      - name: Redeploy the existing Web App deployment
        run: |
          printf '{"scriptId":"%s","rootDir":"gas"}\n' "$GAS_SCRIPT_ID" > .clasp.json

          # The deployment ID is the AKfycb… segment of the /exec URL the pages
          # call. Read it from nl-utils.js so this can only ever deploy to the
          # thing the site is actually pointed at.
          DEPLOY_ID=$(grep -oE 'https://script\.google\.com/macros/s/[A-Za-z0-9_-]+/exec' system/nl-utils.js \
                      | head -1 | sed -E 's#.*/macros/s/([A-Za-z0-9_-]+)/exec#\1#')
          if [ -z "$DEPLOY_ID" ]; then
            echo "::error::Could not read NL.endpoints.gas out of system/nl-utils.js."
            exit 1
          fi
          echo "Target deployment (from NL.endpoints.gas): $DEPLOY_ID"

          # Prove it exists before deploying. Without this, a typo or a rotated
          # URL would make clasp mint a brand-new deployment with a brand-new
          # /exec, which no page calls — a silent no-op that reports success.
          clasp deployments > /tmp/deployments.txt || true
          cat /tmp/deployments.txt
          if ! grep -q "$DEPLOY_ID" /tmp/deployments.txt; then
            echo "::error::$DEPLOY_ID is not among this project's deployments (listed above)."
            echo "  The code HAS been pushed, but nothing has been redeployed, so the"
            echo "  live /exec URL is still serving the previous version."
            echo "  Reconcile NL.endpoints.gas with the real deployment, then re-run."
            exit 1
          fi

          NOTE="${{ github.event.inputs.description }}"
          [ -n "$NOTE" ] || NOTE="Deployed from ${GITHUB_REF_NAME} @ ${GITHUB_SHA:0:7}"
          clasp deploy --deploymentId "$DEPLOY_ID" --description "$NOTE"
          rm -f .clasp.json

          echo "Deployed. The /exec URL is unchanged, so every page picks this up."

      # Live now matches this commit, because we just made it so. Record that,
      # or the next run checks against a baseline this deploy has superseded.
      - name: Record what is now live
        run: |
          # Fingerprint of the files clasp manages: content only, order
          # independent, and computable from a working tree without needing a
          # commit — which a SHA-based marker could not be, since a commit
          # cannot contain its own SHA.
          gas_fingerprint() {
            ( cd "$1" 2>/dev/null || exit 0
              find . -maxdepth 1 -type f \( -name '*.js' -o -name 'appsscript.json' \) \
                | sed 's|^\./||' | LC_ALL=C sort \
                | while read -r f; do printf '%s %s\n' "$f" "$(sha256sum "$f" | cut -d' ' -f1)"; done
            ) | sha256sum | cut -d' ' -f1
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          gas_fingerprint gas > gas/.deployed
          git add gas/.deployed
          if git diff --cached --quiet; then
            echo "gas/.deployed already names this commit."
            exit 0
          fi
          git commit -m "chore: record the pushed Apps Script state"
          for i in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Recorded."
              exit 0
            fi
            git fetch origin main && git rebase origin/main || exit 1
          done
          echo "::error::Deploy SUCCEEDED but gas/.deployed could not be pushed."
          echo "  Live IS updated. Run 'Sync Apps Script' before the next deploy, or"
          echo "  the guard refuses against a fingerprint that is now wrong."
          exit 1

      - name: What to check
        run: |
          echo "Push and redeploy completed."
          echo ""
          echo "The next scheduled 'Sync Apps Script' run should report NO drift."
          echo "If it commits something, the push did not take and that commit"
          echo "is the evidence of what the project actually holds."
