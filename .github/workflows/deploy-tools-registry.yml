name: Deploy tools registry

# Publishes system/rtdb/tools-registry.snapshot.json to RTDB tools/ — the node
# that drives BOTH the portal cards AND auth-guard's access defaults.
#
# The registry was the last thing still pasted into the console by hand, and
# it failed the way hand-pasting always fails here: on 16/08/2026 the live
# tools/ops-estate record turned out to contain an entire stale copy of the
# registry, nested one level too deep, sitting there for weeks. Rules,
# Storage rules and Apps Script all left the console this weekend for the
# same reason. This closes the set.
#
# Report mode (default) deletes nothing and diffs live against the snapshot —
# run it any time drift is suspected. Publish replaces the whole node with the
# snapshot, which is the contract: the file in git IS the registry. A record
# that exists only in live is therefore a DELETION on publish, so publish
# refuses if any exist unless allow_deletions is ticked — the same
# refuse-rather-than-pick-a-winner stance as the Apps Script deploy.
#
# AUTO MODE (20/10/2026). A merge that changes the snapshot now publishes by
# itself. A new tool used to sit unpublished until someone remembered to run
# this by hand — and until then auth-guard turned away everyone except the
# superadmin, who skips the check, so the person launching it never saw the
# fault. Auto mode is deliberately narrower than publish:
#   - it writes only the records this push changed, plus any record missing
#     from live, one record at a time. It never replaces the whole node, so a
#     setting changed live in the portal on some other tool is left alone;
#   - it never deletes. A record removed from the snapshot is reported, and
#     deleting it stays a manual publish with allow_deletions ticked.
# After any publish, a check re-reads live and FAILS the run if a snapshot
# record is missing or did not land as written — GitHub emails the person who
# merged. "Published" has to mean "people can open it".

on:
  push:
    branches: [main]
    paths:
      - system/rtdb/tools-registry.snapshot.json
  workflow_dispatch:
    inputs:
      mode:
        description: 'report = diff only. publish = write the snapshot to RTDB.'
        required: true
        default: report
        type: choice
        options: [report, publish]
      confirm:
        description: 'Type "publish" to allow publish mode. Ignored for report.'
        required: false
        default: ''
      allow_deletions:
        description: 'Publish even if live holds records the snapshot does not (they will be DELETED).'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: tools-registry
  cancel-in-progress: false

jobs:
  registry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MODE: ${{ github.event_name == 'push' && 'auto' || inputs.mode }}
      DB: https://nl-tools-default-rtdb.europe-west1.firebasedatabase.app
    steps:
      - name: Check the confirmation
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'publish'
        run: |
          if [ "${{ inputs.confirm }}" != "publish" ]; then
            echo "::error::Publish mode needs the confirm box to say exactly: publish"
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Fetch the live registry
        run: |
          set -euo pipefail
          TOKEN=$(gcloud auth print-access-token)
          code=$(curl -sS -o live.json -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" \
            "https://nl-tools-default-rtdb.europe-west1.firebasedatabase.app/tools.json")
          if [ "$code" != "200" ]; then
            echo "::error::RTDB read failed with HTTP $code. If 401/403: the service"
            echo "::error::account needs the 'Firebase Realtime Database Admin' role"
            echo "::error::(IAM console → the GCP_SERVICE_ACCOUNT principal → add role)."
            cat live.json; exit 1
          fi
          echo "live registry: $(wc -c < live.json) bytes"

      - name: Diff live against the snapshot
        id: diff
        run: |
          set -euo pipefail
          node - <<'EOF'
          const fs = require('fs');
          const live = JSON.parse(fs.readFileSync('live.json', 'utf8')) || {};
          const snap = JSON.parse(fs.readFileSync('system/rtdb/tools-registry.snapshot.json', 'utf8'));

          const stable = (v) => JSON.stringify(v, Object.keys(flatten(v)).sort());
          function flatten(v, p = '', out = {}) {
            if (v && typeof v === 'object') { for (const k of Object.keys(v)) flatten(v[k], p + '/' + k, out); }
            else out[p] = v;
            return out;
          }

          const liveKeys = Object.keys(live).sort();
          const snapKeys = Object.keys(snap).sort();
          const onlyLive = liveKeys.filter(k => !(k in snap));
          const onlySnap = snapKeys.filter(k => !(k in live));
          const differ = [];
          for (const k of snapKeys.filter(k => k in live)) {
            const a = flatten(live[k]), b = flatten(snap[k]);
            const fields = new Set([...Object.keys(a), ...Object.keys(b)]);
            const changes = [...fields].filter(f => JSON.stringify(a[f]) !== JSON.stringify(b[f]))
              .map(f => `${f}: ${JSON.stringify(a[f])} → ${JSON.stringify(b[f])}`);
            if (changes.length) differ.push({ k, changes });
          }

          const lines = [];
          lines.push(`live: ${liveKeys.length} records · snapshot: ${snapKeys.length} records`);
          if (onlyLive.length) {
            lines.push('', `ONLY IN LIVE — publish would DELETE these (${onlyLive.length}):`);
            onlyLive.forEach(k => lines.push(`  - ${k}`));
          }
          if (onlySnap.length) {
            lines.push('', `ONLY IN SNAPSHOT — publish would CREATE these (${onlySnap.length}):`);
            onlySnap.forEach(k => lines.push(`  + ${k}`));
          }
          if (differ.length) {
            lines.push('', `DIFFER — publish would UPDATE these (${differ.length}):`);
            differ.forEach(d => { lines.push(`  ~ ${d.k}`); d.changes.forEach(c => lines.push(`      ${c}`)); });
          }
          if (!onlyLive.length && !onlySnap.length && !differ.length) {
            lines.push('', 'No drift. Live matches the snapshot exactly.');
          }
          const report = lines.join('\n');
          console.log(report);
          fs.writeFileSync('diff-report.txt', report);
          fs.writeFileSync('deletions.txt', String(onlyLive.length));
          EOF
          {
            echo "## Tools registry — \`$MODE\`"
            echo
            echo '```'
            cat diff-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Work out what this push changed
        if: env.MODE == 'auto'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # The snapshot as it was before this push. Missing (first push of a
          # branch, or history unavailable) means "nothing known to have
          # changed" — only records absent from live get written then.
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
             && git fetch --quiet --depth=1 origin "$BEFORE" \
             && git show "$BEFORE:system/rtdb/tools-registry.snapshot.json" > before.json 2>/dev/null; then
            echo "Compared against $BEFORE."
          else
            echo '{}' > before.json
            echo "::warning::No previous snapshot to compare against — writing only records missing from live."
          fi
          node - <<'EOF'
          const fs = require('fs');
          const live   = JSON.parse(fs.readFileSync('live.json', 'utf8')) || {};
          const before = JSON.parse(fs.readFileSync('before.json', 'utf8')) || {};
          const snap   = JSON.parse(fs.readFileSync('system/rtdb/tools-registry.snapshot.json', 'utf8'));
          const same = (a, b) => JSON.stringify(sort(a)) === JSON.stringify(sort(b));
          function sort(v) {
            if (Array.isArray(v)) return v.map(sort);
            if (v && typeof v === 'object') return Object.keys(v).sort().reduce((o, k) => (o[k] = sort(v[k]), o), {});
            return v;
          }
          const changed = Object.keys(snap).filter(k => k in before && !same(before[k], snap[k]));
          const added   = Object.keys(snap).filter(k => !(k in before) && Object.keys(before).length);
          const missing = Object.keys(snap).filter(k => !(k in live));
          const write   = [...new Set([...changed, ...added, ...missing])].sort();
          const removed = Object.keys(before).filter(k => !(k in snap));
          // Trailing newline: `while read` drops a final line without one, which is
          // how the first auto run skipped the last record (20/10/2026).
          fs.writeFileSync('to-write.txt', write.length ? write.join('\n') + '\n' : '');
          const out = ['', `Auto publish will write ${write.length} record(s):`];
          write.forEach(k => out.push(`  ${k}${missing.includes(k) ? '  (missing from live)' : ''}`));
          if (removed.length) {
            out.push('', 'Removed from the snapshot but NOT deleted from live (run publish with allow_deletions to delete):');
            removed.forEach(k => out.push(`  - ${k}`));
          }
          console.log(out.join('\n'));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, '\n```' + out.join('\n') + '\n```\n');
          EOF

      - name: Publish the changed records
        if: env.MODE == 'auto'
        run: |
          set -euo pipefail
          if [ ! -s to-write.txt ]; then echo "Nothing to write."; exit 0; fi
          TOKEN=$(gcloud auth print-access-token)
          while read -r key || [ -n "$key" ]; do
            [ -n "$key" ] || continue
            node -e 'const s=require("./system/rtdb/tools-registry.snapshot.json");process.stdout.write(JSON.stringify(s[process.argv[1]]))' "$key" > record.json
            code=$(curl -sS -o put-result.json -w '%{http_code}' -X PUT \
              -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
              --data @record.json "$DB/tools/$key.json")
            if [ "$code" != "200" ]; then
              echo "::error::Writing tools/$key failed with HTTP $code"; cat put-result.json; exit 1
            fi
            echo "Wrote tools/$key"
          done < to-write.txt

      - name: Publish the snapshot
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'publish'
        run: |
          set -euo pipefail
          if [ "$(cat deletions.txt)" != "0" ] && [ "${{ inputs.allow_deletions }}" != "true" ]; then
            echo "::error::Live holds records the snapshot does not (see the diff above)."
            echo "::error::Publishing would delete them. Either add them to the snapshot"
            echo "::error::via a PR, or re-run with allow_deletions ticked if they should go."
            exit 1
          fi
          TOKEN=$(gcloud auth print-access-token)
          code=$(curl -sS -o put-result.json -w '%{http_code}' -X PUT \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            --data @system/rtdb/tools-registry.snapshot.json \
            "https://nl-tools-default-rtdb.europe-west1.firebasedatabase.app/tools.json")
          if [ "$code" != "200" ]; then
            echo "::error::RTDB write failed with HTTP $code"; cat put-result.json; exit 1
          fi
          echo "Published. tools/ now matches the snapshot exactly."
          echo "The portal reflects it on next load — no cache in the way, auth-guard re-reads per page."

      - name: Check every tool is live
        if: env.MODE != 'report'
        run: |
          set -euo pipefail
          TOKEN=$(gcloud auth print-access-token)
          code=$(curl -sS -o after.json -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" "$DB/tools.json")
          if [ "$code" != "200" ]; then
            echo "::error::Could not re-read the live registry to check it (HTTP $code)."; exit 1
          fi
          node - <<'EOF'
          const fs = require('fs');
          const live = JSON.parse(fs.readFileSync('after.json', 'utf8')) || {};
          const snap = JSON.parse(fs.readFileSync('system/rtdb/tools-registry.snapshot.json', 'utf8'));
          const wrote = fs.existsSync('to-write.txt')
            ? fs.readFileSync('to-write.txt', 'utf8').split('\n').filter(Boolean)
            : Object.keys(snap); // a full publish wrote everything
          const sort = v => Array.isArray(v) ? v.map(sort)
            : (v && typeof v === 'object') ? Object.keys(v).sort().reduce((o, k) => (o[k] = sort(v[k]), o), {}) : v;
          const same = (a, b) => JSON.stringify(sort(a)) === JSON.stringify(sort(b));
          const errors = [], warnings = [];
          for (const [k, rec] of Object.entries(snap)) {
            if (!(k in live)) { errors.push(`${k} (${rec.label}) is not live — nobody but the superadmin can open it.`); continue; }
            if (!same(live[k], rec)) {
              (wrote.includes(k) ? errors : warnings).push(
                wrote.includes(k) ? `${k} (${rec.label}) did not land as written.`
                                  : `${k} (${rec.label}) differs in live from the snapshot (changed in the portal?). Left alone.`);
            }
            // A finished tool that no role gets by default can only be reached by
            // per-person grants. Usually a mistake; sometimes deliberate.
            const roles = Object.entries(rec.defaults || {}).filter(([r, l]) => r !== 'superadmin' && l !== 'off');
            if (wrote.includes(k) && !rec.status && !roles.length && rec.audience !== 'meta') {
              warnings.push(`${k} (${rec.label}) is finished but no role gets it by default — only people granted it by name.`);
            }
          }
          const lines = ['', 'Check after publishing:'];
          if (!errors.length) lines.push(`  All ${Object.keys(snap).length} tools are live.`);
          errors.forEach(e => { lines.push('  ✗ ' + e); console.log('::error::' + e); });
          warnings.forEach(w => { lines.push('  ! ' + w); console.log('::warning::' + w); });
          console.log(lines.join('\n'));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, '\n```' + lines.join('\n') + '\n```\n');
          if (errors.length) process.exit(1);
          EOF
