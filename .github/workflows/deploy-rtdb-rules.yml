name: Deploy RTDB rules

# Publishes the RTDB rules snapshots to their databases.
#
#   system/rtdb/rules.snapshot.json             → nl-tools    (staff + club tools)
#   system/rtdb/nl-widgets.rules.snapshot.json  → nl-widgets  (fan data)
#
# TWO PROJECTS, ON PURPOSE
# -----------------------
# Fan traffic is anonymous, public-read and unbounded; staff data is users,
# roles, club records and PII. Keeping them in separate databases means a
# fan-side mistake cannot reach staff data and fan bandwidth cannot exhaust the
# tools' quota. That split is deliberate and worth keeping.
#
# What was NOT deliberate is that only one half had a deploy path. The
# nl-widgets rules — governing every fan vote, prediction and registration —
# lived at embeds/nl-widgets.rules.json and were pasted into the console by
# hand, with nothing checking the repo copy matched what was running. That is
# the same drift found in the Apps Script mirror one project over, and it is
# fixed the same way: the file in git IS the rules.
#
# Why this exists
# ---------------
# Rules were deployed by pasting the whole document into the Firebase console.
# That has two problems. It needs a person at a keyboard with console access,
# and it makes the console the source of truth while the repo holds a snapshot
# that is only as current as the last person who remembered to update it. A
# console edit that never came back to the repo is invisible until the next
# paste silently reverts it.
#
# Deploying from the repo inverts that: the file in git IS the rules, reviewed
# in a diff like everything else, and drift becomes impossible rather than
# merely unlikely.
#
# Deliberately manual
# -------------------
# workflow_dispatch only, never on push. Rules govern every tool in the
# project, and a bad merge should not be able to lock 72 clubs out of their
# own data as a side effect of landing something unrelated. Someone presses
# the button, having read the diff.
#
# Run it from the Actions tab: "Deploy RTDB rules" then "Run workflow".
# No terminal required.
#
# Auth reuses the same Workload Identity Federation secrets as the functions
# and GA pipelines.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish" to confirm you have read the diff'
        required: true
        default: ''
      target:
        description: 'Which database'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - nl-tools
          - nl-widgets

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Refuse unless confirmed
        if: ${{ github.event.inputs.confirm != 'publish' }}
        run: |
          echo "::error::Type 'publish' in the confirm box to run this."
          exit 1

      - name: Checkout repo
        uses: actions/checkout@v4

      # A malformed rules file is rejected by the API anyway, but failing here
      # gives a readable error instead of a deploy log full of JSON.
      - name: Check the rules parse
        run: |
          python3 -c "
          import json
          d = json.load(open('system/rtdb/rules.snapshot.json'))
          assert 'rules' in d, 'nl-tools: no top-level rules key'
          print('nl-tools parse OK —', len(d['rules']['app-data']), 'app-data nodes')

          w = json.load(open('system/rtdb/nl-widgets.rules.snapshot.json'))
          assert 'rules' in w, 'nl-widgets: no top-level rules key'
          # Fan data is public-facing. A default-open root there would expose
          # every registration and vote, so it is asserted rather than trusted.
          assert w['rules'].get('.read') is False, 'nl-widgets: root .read must be false'
          assert w['rules'].get('.write') is False, 'nl-widgets: root .write must be false'
          print('nl-widgets parse OK —', len(w['rules']) - 2, 'nodes, root denied by default')
          "

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      # The committed firebase.json already points database.rules at the
      # nl-tools snapshot, so this needs no config of its own.
      - name: Deploy nl-tools rules
        if: ${{ github.event.inputs.target == 'both' || github.event.inputs.target == 'nl-tools' }}
        run: |
          npx --yes firebase-tools@latest deploy --only database \
            --project nl-tools --non-interactive --force

      # A throwaway config passed with --config, NOT an overwrite of the
      # committed firebase.json: that file also carries the functions block
      # deploy-functions.yml depends on, and a workflow that quietly rewrites
      # a committed file is how the next person ends up debugging a ghost.
      - name: Deploy nl-widgets rules
        if: ${{ github.event.inputs.target == 'both' || github.event.inputs.target == 'nl-widgets' }}
        run: |
          printf '{"database":{"rules":"system/rtdb/nl-widgets.rules.snapshot.json"}}\n' \
            > /tmp/firebase-widgets.json
          npx --yes firebase-tools@latest deploy --only database \
            --config /tmp/firebase-widgets.json \
            --project nl-widgets --non-interactive --force
