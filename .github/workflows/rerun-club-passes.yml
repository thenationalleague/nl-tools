name: Button · Re-run club passes

# ONE-OFF (13/11/2026). Remove in the next PR once it has run.
#
# Club logins went live at 22:25 on 12/11/2026 (functions/pass-claims.js):
# when a pass is written, a Club card puts its club on the person's account,
# so club pages open with no code. It runs when a pass is WRITTEN, so a Club
# card issued before it was deployed never got its club, and that person is
# still asked for a code. The same goes for passEntries (step 5), deployed at
# 23:36: it lines up a person's tool entries when their pass is written.
#
# This touches every issued Club card (one field, `rerun`, the time of the
# run) so both functions run once for each. Nothing about the pass changes.
#
# report (default): counts only. Actions logs on this repo are public, so no
# name, email or uid is ever printed.
# rerun: type "rerun" in the confirm box.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'report = count only. rerun = touch every Club card.'
        required: true
        default: report
        type: choice
        options: [report, rerun]
      confirm:
        description: 'Type "rerun" to allow rerun mode.'
        required: false
        default: ''

permissions:
  contents: read
  id-token: write

jobs:
  rerun:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DB: https://nl-tools-default-rtdb.europe-west1.firebasedatabase.app
      MODE: ${{ inputs.mode }}
    steps:
      - name: Check the confirmation
        if: inputs.mode == 'rerun' && inputs.confirm != 'rerun'
        run: |
          echo "::error::Rerun mode needs the confirm box to say exactly: rerun"
          exit 1

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Count, and touch if asked
        run: |
          set -euo pipefail
          TOKEN=$(gcloud auth print-access-token)
          code=$(curl -sS -o users.json -w '%{http_code}' -H "Authorization: Bearer $TOKEN" "$DB/users.json")
          if [ "$code" != "200" ]; then echo "::error::RTDB read failed with HTTP $code"; exit 1; fi
          TOKEN="$TOKEN" node - <<'JS'
          const fs = require('fs');
          const users = JSON.parse(fs.readFileSync('users.json', 'utf8')) || {};
          const club = Object.keys(users).filter((uid) => {
            const p = users[uid] && users[uid].pass;
            return p && p.base === 'club' && p.club;
          });
          console.log(`Issued Club cards: ${club.length}`);
          /* All in one async function: a script read from stdin is not a
             function, so a bare `return` there is a syntax error (the first
             run, 13/11/2026, died on exactly that). */
          (async () => {
            if (process.env.MODE !== 'rerun') { console.log('Report only: nothing written.'); return; }
            const now = Date.now();
            let ok = 0, bad = 0;
            for (const uid of club) {
              const r = await fetch(`${process.env.DB}/users/${encodeURIComponent(uid)}/pass.json`, {
                method: 'PATCH',
                headers: { Authorization: `Bearer ${process.env.TOKEN}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ rerun: now })
              });
              if (r.ok) ok++; else bad++;
            }
            console.log(`Touched: ${ok}. Failed: ${bad}.`);
            const key = `${now}_rerun`;
            const entry = { action: 'passes_rerun', detail: `Club cards re-run: ${ok}`, uid: 'system', name: 'NL Tools', email: '', ts: now, at: new Date(now).toISOString() };
            await fetch(`${process.env.DB}/admin/audit/${key}.json`, {
              method: 'PUT', headers: { Authorization: `Bearer ${process.env.TOKEN}`, 'Content-Type': 'application/json' }, body: JSON.stringify(entry)
            });
            if (bad) process.exit(1);
          })();
          JS
