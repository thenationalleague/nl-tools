name: Render handbook PDF (v1.5)

# Regenerates handbook/handbook.pdf from the PUBLISHED edition so the reader's
# Download PDF button serves a real file (CDN-style), not a print dialog.
# Cheap no-op when pdf-meta.json already matches the live publishedEditionId.
# Run manually (workflow_dispatch, optionally force=true) for an immediate render.
#
# As of 05/08/2026 pressing Publish dispatches this workflow directly, via the
# handbookRenderOnPublish function — so a published edition renders in about two
# minutes rather than whenever the next hour came round. See functions/handbook.js.
#
# The hourly schedule stays anyway, and deliberately. It is the fallback for a
# dispatch that never lands (expired token, GitHub API outage, the function not
# yet deployed), and until a real publish has been seen to trigger a render it is
# the thing actually guaranteeing the PDF is current. Dropping it to daily is the
# follow-up once the doorbell has proved itself in production — not before, or a
# silent failure would go a full day unnoticed instead of an hour.

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Re-render even if the PDF is already current"
        type: boolean
        default: false
  schedule:
    - cron: "25 * * * *"

permissions:
  contents: write

concurrency:
  group: render-handbook-pdf
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install puppeteer-core + pdf-lib + fontkit + wawoff2
        run: npm install --no-save puppeteer-core pdf-lib @pdf-lib/fontkit wawoff2

      - name: Install fonttools (variable-font instancing for the band weight)
        run: python3 -m pip install --quiet fonttools

      - name: Sync with origin/main (clean tree)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main

      - name: Serve repo under /
        run: |
          # The site is served from the domain root (nl.tools/handbook/...), so
          # the checkout IS the web root here — no /tools prefix.
          (python3 -m http.server 8899 &)
          sleep 1
          curl -sf -o /dev/null http://127.0.0.1:8899/handbook/print.html

      - name: Render PDF
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          FORCE: ${{ inputs.force && '1' || '' }}
        run: node scripts/render-handbook-pdf.js

      - name: Commit & push if changed
        run: |
          # Scope the check to the files this job commits — a stray untracked
          # dir (e.g. node_modules from the npm install) must not push a no-op
          # run into a doomed empty commit.
          git status --porcelain handbook/handbook.pdf handbook/pdf-meta.json
          if [ -z "$(git status --porcelain handbook/handbook.pdf handbook/pdf-meta.json)" ]; then
            echo "No changes to commit"
            exit 0
          fi
          git add -f handbook/handbook.pdf handbook/pdf-meta.json
          git commit -m "Render handbook.pdf for published edition"
          # Another run may have pushed while we were building.
          git fetch origin main
          git pull --rebase origin main
          git push origin HEAD:main
