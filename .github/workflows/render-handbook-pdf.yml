name: Render handbook PDF (v1.5)

# Regenerates handbook/handbook.pdf from the PUBLISHED edition so the reader's
# Download PDF button serves a real file (CDN-style), not a print dialog.
# Cheap no-op when pdf-meta.json already matches the live publishedEditionId —
# so the hourly schedule only does real work after a publish. Run manually
# (workflow_dispatch, optionally force=true) for an immediate render.

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Re-render even if the PDF is already current"
        type: boolean
        default: false
  schedule:
    - cron: "25 * * * *"

permissions:
  contents: write
  # Workload Identity Federation, same pattern as rebuild-index.yml. The job
  # needs a credential of its own now that the handbook is heading behind the
  # club-code gate — see system/club-code-plan.md §1.0a.
  id-token: write

concurrency:
  group: render-handbook-pdf
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install puppeteer-core + pdf-lib + fontkit + wawoff2 + firebase-admin
        run: npm install --no-save puppeteer-core pdf-lib @pdf-lib/fontkit wawoff2 firebase-admin@^14

      # The renderer reads the edition (admin, bypassing rules) and hands the
      # headless page a custom token to sign in with (rules apply to it, as they
      # do to a club). Both come from this one service account. If this step is
      # skipped or the role is missing the script logs it and carries on
      # unauthenticated, which is what it did before — so this cannot be the
      # thing that breaks a currently-green render.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Install fonttools (variable-font instancing for the band weight)
        run: python3 -m pip install --quiet fonttools

      - name: Sync with origin/main (clean tree)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main

      - name: Serve repo under /
        run: |
          # The site is served from the domain root (nl.tools/handbook/...), so
          # the checkout IS the web root here — no /tools prefix.
          (python3 -m http.server 8899 &)
          sleep 1
          curl -sf -o /dev/null http://127.0.0.1:8899/handbook/print.html

      - name: Render PDF
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          FORCE: ${{ inputs.force && '1' || '' }}
        run: node scripts/render-handbook-pdf.js

      - name: Commit & push if changed
        run: |
          # Scope the check to the files this job commits — a stray untracked
          # dir (e.g. node_modules from the npm install) must not push a no-op
          # run into a doomed empty commit.
          git status --porcelain handbook/handbook.pdf handbook/pdf-meta.json
          if [ -z "$(git status --porcelain handbook/handbook.pdf handbook/pdf-meta.json)" ]; then
            echo "No changes to commit"
            exit 0
          fi
          git add -f handbook/handbook.pdf handbook/pdf-meta.json
          git commit -m "Render handbook.pdf for published edition"
          # Another run may have pushed while we were building.
          git fetch origin main
          git pull --rebase origin main
          git push origin HEAD:main
