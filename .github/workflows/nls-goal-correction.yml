name: Button · Fix a missing goalscorer

# Names the scorer of a goal NLS has no scorer for, so the player rows, the
# scorer table and every player tool count it. NLS itself is not changed —
# send the same fix to Stats Perform; once it lands at source, the ingester
# stops applying the correction by itself (it only ever fills the gap
# between the score and the goals the feed names).
#
# Writes to nl-tools RTDB nls-corrections/<matchID>/<minute>-<playerID>. The
# hourly ingester run rebuilds the match within the hour. Nothing is written
# to this repository: it is public, and the corrections are data.
#
# Inputs carry IDs only — never names — because run inputs on a public repo
# are visible. Find the IDs with the NL Data connector: get_results with
# missingScorers: true gives the matchID; get_player gives playerID and the
# club's teamID.
#
# One line per fix, several lines (or ; between them) in one run. teamID is
# always the PLAYER'S OWN club:
#   <matchID> <playerID> <teamID> <minute> goal|penalty|og   a goal
#   <matchID> <playerID> <teamID> start|bench                 a team-sheet place
#   <matchID> <onID> <teamID> <minute> sub <offID>            a substitution
# e.g. g2660055 p106177 t285 26 og
#      g2660611 p235426 t803 85 sub p678528

on:
  workflow_dispatch:
    inputs:
      goals:
        description: 'One per line or ;-separated. Goal: matchID playerID teamID minute goal|penalty|og. Sheet: matchID playerID teamID start|bench. Sub: matchID onID teamID minute sub offID'
        required: true
      action:
        description: 'add, or remove to take a correction back out'
        type: choice
        options: [add, remove]
        default: add

permissions:
  contents: read
  id-token: write

concurrency:
  group: nls-goal-correction
  cancel-in-progress: false

jobs:
  correct:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DB: https://nl-tools-default-rtdb.europe-west1.firebasedatabase.app
      GOALS: ${{ inputs.goals }}
      ACTION: ${{ inputs.action }}
    steps:
      - name: Check every line before writing any
        id: parse
        run: |
          set -euo pipefail
          node - <<'JS'
          const fs = require('fs');
          const lines = process.env.GOALS.split(/[;\n]+/).map(l => l.trim()).filter(Boolean);
          const types = { goal: 'goal', penalty: 'penalty', pen: 'penalty', og: 'own goal', own: 'own goal', 'own goal': 'own goal' };
          const out = []; const bad = [];
          lines.forEach((l) => {
            let m = l.match(/^(g\d+)\s+(p\d+)\s+(t\d+)\s+(\d{1,3})(?:\+\d+)?\s+(goal|penalty|pen|og|own goal|own)$/i);
            if (m) {
              out.push({ matchID: m[1], key: m[4] + '-' + m[2],
                value: { playerID: m[2], teamID: m[3], minute: Number(m[4]), type: types[m[5].toLowerCase()] } });
              return;
            }
            m = l.match(/^(g\d+)\s+(p\d+)\s+(t\d+)\s+(start|bench)$/i);
            if (m) {
              out.push({ matchID: m[1], key: m[4].toLowerCase() + '-' + m[2],
                value: { playerID: m[2], teamID: m[3], type: m[4].toLowerCase() } });
              return;
            }
            m = l.match(/^(g\d+)\s+(p\d+)\s+(t\d+)\s+(\d{1,3})(?:\+\d+)?\s+sub\s+(p\d+)$/i);
            if (m) {
              out.push({ matchID: m[1], key: 'sub-' + m[4] + '-' + m[2],
                value: { playerID: m[2], offID: m[5], teamID: m[3], minute: Number(m[4]), type: 'sub' } });
              return;
            }
            bad.push(l);
          });
          if (bad.length || !out.length) {
            bad.forEach(b => console.log('::error::Not understood: "' + b + '" — see the formats at the top of this workflow'));
            if (!out.length) console.log('::error::No corrections found in the input.');
            process.exit(1);
          }
          fs.writeFileSync('corrections.json', JSON.stringify(out));
          out.forEach(c => console.log(c.matchID + '  ' + c.value.playerID + ' (' + c.value.teamID + ') ' +
            (c.value.minute != null ? c.value.minute + "' " : '') + c.value.type + (c.value.offID ? ' for ' + c.value.offID : '')));
          JS

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Write the corrections
        run: |
          set -euo pipefail
          TOKEN=$(gcloud auth print-access-token)
          node - <<'JS' > requests.txt
          const c = JSON.parse(require('fs').readFileSync('corrections.json', 'utf8'));
          c.forEach(x => console.log(x.matchID + '/' + x.key + '\t' + JSON.stringify(x.value)));
          JS
          while IFS=$'\t' read -r path body; do
            if [ "$ACTION" = "remove" ]; then
              code=$(curl -sS -o resp.json -w '%{http_code}' -X DELETE \
                -H "Authorization: Bearer $TOKEN" "$DB/nls-corrections/$path.json")
            else
              code=$(curl -sS -o resp.json -w '%{http_code}' -X PUT \
                -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
                -d "$body" "$DB/nls-corrections/$path.json")
            fi
            if [ "$code" != "200" ]; then
              echo "::error::$ACTION $path failed with HTTP $code"; cat resp.json; exit 1
            fi
            echo "$ACTION  $path"
          done < requests.txt
          echo "Done. The hourly ingester run (about quarter to the hour) rebuilds these matches."
