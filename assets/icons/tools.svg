    NL Tools: Tool Icon Sprite Sheet
    Version: v1.0 (13/11/2026)
    One icon per tool for the portal cards, replacing the registry emojis.
    The symbol id IS the tool key: <use href="/assets/icons/tools.svg#ops-attendance">.
    tests/tool-icons.test.mjs fails if a registry tool has no symbol.

    Drawings: Tabler Icons (outline set), https://tabler.io/icons
    MIT License, Copyright (c) 2020-2026 Pawel Kuna. Each symbol names the
    Tabler icon it is. Stroke width 1.75 (Tabler's 2 reads heavy at the
    size the portal shows them); colour from currentColor.
    To change a tool's icon, pick another from the Tabler outline set and
    paste its paths here under the same id.
  -->
