<svg xmlns="http://www.w3.org/2000/svg" style="display:none;">
  <!--
    NL Tools — Tool Icon Sprite Sheet
    Version: v1.0 (13/11/2026)
    One drawn icon per tool, replacing the registry's emojis on the portal
    (Richard, 13/11/2026: emojis look meek, and every device draws them
    differently). The symbol id IS the tool key, so a tool needs no new
    registry field: <use href="/assets/icons/tools.svg#ops-attendance">.
    tests/tool-icons.test.mjs fails if a registry tool has no symbol.

    Design:
    - 48x48 viewBox, larger than the UI sprite's 24: these are shown big.
    - Stroked 2.5, round caps and joins, no fill; colour from currentColor.
    - One accent per icon (a dot, a strip, a line), drawn in
      the custom property ti-accent: the page sets it (League red on the
      portal), and it falls back to currentColor anywhere that does not.
    - Every icon different: two tools never share a picture.
  -->
  <!-- Graphics -->
  <symbol id="staff-graphics" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="10" width="34" height="28" rx="3"/><circle cx="17" cy="19" r="3.5" fill="var(--ti-accent, currentColor)" stroke="none"/><path d="M7 33l10-10 8 8 5-5 11 11"/></symbol>
  <!-- Content Plan -->
  <symbol id="media-content-plan" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="10" width="34" height="31" rx="3"/><path d="M7 18h34M16 6v8M32 6v8"/><path d="M17 29l5 5 9-10" stroke="var(--ti-accent, currentColor)"/></symbol>
  <!-- Fixture Management -->
  <symbol id="ops-fixture-management" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="10" width="34" height="31" rx="3"/><path d="M7 18h34M16 6v8M32 6v8"/><path d="M15 26h17l-4-4M33 34H16l4 4" stroke="var(--ti-accent, currentColor)"/></symbol>
  <!-- Local Media -->
  <symbol id="media-local-media" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="18" y="5" width="12" height="23" rx="6"/><path d="M18 13h5M18 18h5" stroke="var(--ti-accent, currentColor)"/><path d="M11 22a13 13 0 0 0 26 0M24 35v7M17 42h14"/></symbol>
  <!-- Access -->
  <symbol id="ops-people" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="11" y="39" width="26" height="5" rx="1" fill="var(--ti-accent, currentColor)" stroke="none"/><rect x="11" y="12" width="26" height="32" rx="3"/><path d="M20 12V6h8v6"/><circle cx="24" cy="23" r="4"/><path d="M17 34c1.5-4 4-5.5 7-5.5s5.5 1.5 7 5.5"/></symbol>
  <!-- Judgements -->
  <symbol id="ops-judgements" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M24 9v32M15 41h18M9 14h30M9 14l-5 12M9 14l5 12M39 14l-5 12M39 14l5 12"/><path d="M4 26a5 5 0 0 0 10 0zM34 26a5 5 0 0 0 10 0z"/><circle cx="24" cy="8" r="3" fill="var(--ti-accent, currentColor)" stroke="none"/></symbol>
  <!-- Save of the Month -->
  <symbol id="media-save-of-the-month" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="14" y="38" width="19" height="6" rx="1.5" fill="var(--ti-accent, currentColor)" stroke="none"/><path d="M16 38V17a3 3 0 0 1 6 0v8M22 25V11a3 3 0 0 1 6 0v14M28 25V13a3 3 0 0 1 6 0v13M34 26v-6a3 3 0 0 1 6 0v8c0 6-3 10-8 10H16"/><path d="M16 31l-5-5a3 3 0 0 0-4.5 4l9.5 10"/></symbol>
  <!-- Fan Widgets -->
  <symbol id="ops-fan-widgets" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="9" width="36" height="30" rx="3"/><path d="M6 16h36"/><path d="M24 34s-8-4.5-8-10a4 4 0 0 1 8-1.5 4 4 0 0 1 8 1.5c0 5.5-8 10-8 10z" fill="var(--ti-accent, currentColor)" stroke="none"/></symbol>
  <!-- Brand Exposure -->
  <symbol id="ops-brand-exposure" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15V8h7M35 8h7v7M42 33v7h-7M13 40H6v-7"/><rect x="12" y="20" width="24" height="8" rx="1.5" fill="var(--ti-accent, currentColor)" stroke="none"/><path d="M12 33h24"/></symbol>
  <!-- Matchday Live -->
  <symbol id="media-matchday-live" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="14" width="27" height="20" rx="3"/><path d="M32 21l11-6v18l-11-6z"/><circle cx="12" cy="21" r="3" fill="var(--ti-accent, currentColor)" stroke="none"/></symbol>
  <!-- Commercial Benchmarking -->
  <symbol id="ops-commercial-benchmarking" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="16" cy="17" r="10"/><path d="M19.5 13a3.5 3.5 0 0 0-6.5 1.8V22h7M11 18.5h6"/><path d="M6 42h37M29 42v-8M35 42V27"/><path d="M41 42V20" stroke="var(--ti-accent, currentColor)"/></symbol>
  <!-- Financial Benchmarking -->
  <symbol id="ops-financial-benchmarking" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7v34h34"/><path d="M15 34v-6M23 34v-10M31 34v-8M39 34V20"/><path d="M13 21l8-7 8 5 10-10" stroke="var(--ti-accent, currentColor)"/></symbol>
  <!-- Data -->
  <symbol id="ops-data" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M24 24V8a16 16 0 0 1 16 16z" fill="var(--ti-accent, currentColor)" stroke="none"/><circle cx="24" cy="24" r="16"/><path d="M24 8v16h16"/></symbol>
  <!-- Website Archive -->
  <symbol id="staff-website-archive" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="8" width="36" height="10" rx="2"/><path d="M9 18v19a3 3 0 0 0 3 3h24a3 3 0 0 0 3-3V18"/><path d="M19 26h10" stroke="var(--ti-accent, currentColor)"/></symbol>
  <!-- Responsibilities -->
  <symbol id="media-responsibilities" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 16h8a4 4 0 1 1 8 0h9v9a4 4 0 1 1 0 8v8H9v-8a4 4 0 1 0 0-8z"/><circle cx="21" cy="29" r="3" fill="var(--ti-accent, currentColor)" stroke="none"/></symbol>
  <!-- Programme Packs -->
  <symbol id="media-programme" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M24 12c-5-3-11-4-17-3v29c6-1 12 0 17 3 5-3 11-4 17-3V9c-6-1-12 0-17 3zM24 12v29"/><path d="M11 16h8M11 21h8M29 16h8" stroke="var(--ti-accent, currentColor)"/></symbol>
  <!-- Handbook -->
  <symbol id="ops-handbook" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M27 6v13l3-2.5 3 2.5V6" fill="var(--ti-accent, currentColor)" stroke="none"/><path d="M13 6h23a2 2 0 0 1 2 2v34H16a3 3 0 0 1-3-3z"/><path d="M13 39a3 3 0 0 1 3-3h22"/></symbol>
  <!-- Document Library -->
  <symbol id="ops-document-library" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 15v25a3 3 0 0 0 3 3h20"/><path d="M15 6h15l8 8v22a2 2 0 0 1-2 2H15a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2z"/><path d="M30 6v8h8"/><path d="M18 22h14M18 28h10" stroke="var(--ti-accent, currentColor)"/></symbol>
  <!-- Newsletter -->
  <symbol id="staff-newsletter" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="11" y="13" width="20" height="6" fill="var(--ti-accent, currentColor)" stroke="none"/><path d="M6 9h30v31H9a3 3 0 0 1-3-3zM36 17h6v20a3 3 0 0 1-6 0"/><path d="M11 26h8M11 32h8M24 26h7M24 32h7"/></symbol>
  <!-- Estate -->
  <symbol id="ops-estate" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="24" cy="24" r="17"/><path d="M31 17l-4 10-10 4 4-10z"/><path d="M31 17l-10 4 6 6z" fill="var(--ti-accent, currentColor)" stroke="none"/></symbol>
  <!-- Attendance -->
  <symbol id="ops-attendance" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="6" height="5" rx="1" fill="var(--ti-accent, currentColor)" stroke="none"/><rect x="36" y="4" width="6" height="5" rx="1" fill="var(--ti-accent, currentColor)" stroke="none"/><path d="M9 9v12M39 9v12"/><path d="M5 25c0-4 8.5-6 19-6s19 2 19 6v10c0 4-8.5 6-19 6S5 39 5 35z"/><path d="M5 25c0 4 8.5 6 19 6s19-2 19-6"/></symbol>
  <!-- NLServices API -->
  <symbol id="ops-nls-monitor" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="8" width="38" height="26" rx="3"/><path d="M18 42h12M24 34v8"/><path d="M10 22h7l3-6 5 12 3-6h10" stroke="var(--ti-accent, currentColor)"/></symbol>
  <!-- Social Output -->
  <symbol id="media-social-output" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 19v10h7l15 9V10L14 19z"/><path d="M14 29l3 10h5l-2-9"/><path d="M35 18a8 8 0 0 1 0 12M39 13a15 15 0 0 1 0 22" stroke="var(--ti-accent, currentColor)"/></symbol>
  <!-- DAZN Viewership -->
  <symbol id="media-dazn" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 4l6 5 6-5"/><rect x="5" y="9" width="38" height="27" rx="3"/><path d="M12 36l-2 5M36 36l2 5"/><path d="M20 16v13l11-6.5z" fill="var(--ti-accent, currentColor)" stroke="none"/></symbol>
  <!-- Vacancies -->
  <symbol id="ops-vacancies" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="15" width="36" height="26" rx="3"/><path d="M18 15v-4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v4M6 26h36"/><rect x="20.5" y="23" width="7" height="7" rx="1.5" fill="var(--ti-accent, currentColor)" stroke="none"/></symbol>
  <!-- Style Guide -->
  <symbol id="staff-style-guide" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M24 6C14 6 6 13.5 6 23s7 17 16 17c3 0 4-2 3-4-1-2.5 0-5 3-5h5c5 0 9-3.5 9-8C42 13 34 6 24 6z"/><circle cx="15" cy="21" r="2.8" fill="var(--ti-accent, currentColor)" stroke="none"/><circle cx="22" cy="13" r="2.8" fill="currentColor" stroke="none"/><circle cx="31" cy="13" r="2.8" fill="var(--ti-accent, currentColor)" stroke="none"/><circle cx="36" cy="21" r="2.8" fill="currentColor" stroke="none"/></symbol>
  <!-- Club Kits -->
  <symbol id="ops-club-kits" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M24 12v28" stroke="var(--ti-accent, currentColor)"/><path d="M17 7L7 13l4 9 5-2v20h16V20l5 2 4-9-10-6c-1 3-4 5-7 5s-6-2-7-5z"/></symbol>
  <!-- Travel Planner -->
  <symbol id="staff-travel-planner" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 7a7 7 0 0 1 7 7c0 6-7 12-7 12S7 20 7 14a7 7 0 0 1 7-7z"/><circle cx="14" cy="14" r="2.5"/><path d="M14 31c0 5 5 7 11 6s11-1 11 3" stroke-dasharray="1 5" stroke="var(--ti-accent, currentColor)"/><circle cx="37" cy="40" r="3.5" fill="var(--ti-accent, currentColor)" stroke="none"/></symbol>
  <!-- Club Codes -->
  <symbol id="ops-club-codes" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="15" cy="24" r="8"/><circle cx="15" cy="24" r="3" fill="var(--ti-accent, currentColor)" stroke="none"/><path d="M23 24h19M36 24v6M41 24v5"/></symbol>
