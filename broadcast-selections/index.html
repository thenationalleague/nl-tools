  distance-decay shape (~1.7× a club's norm at 20mi falling to ~0.7× at
  350mi, fitted on every unpicked Sat 3pm), host home level × a
  near-flat home shape; expected gate is the sum. Level per club, shape
  shared — ~11 away datapoints per club fits a level, not a curve. The
  point: derby picks stop reading as triumphs when their away number is
  mostly proximity.

  <style>

  :root {
    /* Cartographic one-offs — the only page-local colours. Everything
       else on this page speaks nl-brand.css tokens directly. */
    --land: #e3e8e0;
    --coast: #b9c4b6;
    --sea-grid: #e2e7ee;
  }

  body { background: var(--off-white); color: var(--text); font-family: var(--font); margin: 0; padding: 0; }
  /* Hosted-page furniture — inert in the artifact, which has no topbar.
     Both rules are tracked canon overrides: the profile cluster is auth
     furniture on a sessionless page, and the container padding tightens
     for a data-dense page (source-order override, per the brand doc). */
  #nlTopbar .topbar__profile { display: none; }
  .page { padding-top: 14px; padding-bottom: 44px; }
  /* Audience + sign-out, rendered into the topbar's extras.right slot on a
     grant (hosted only — the artifact has no gate, so these match nothing).
     Ground is the topbar's --primary; mixes follow nl-topbar's own pattern. */
  #bselTopRight { margin-left: auto; display: flex; align-items: center; gap: 12px; }
  #bselWho { color: color-mix(in srgb, var(--white) 75%, var(--primary)); font-size: var(--text-xs); font-weight: 700; font-variation-settings: 'wght' 700; text-transform: uppercase; letter-spacing: var(--tracking-wide); white-space: nowrap; }
  #bselOut { background: none; border: 1px solid color-mix(in srgb, var(--white) 35%, var(--primary)); color: var(--white); border-radius: var(--radius-sm); padding: 5px 12px; font-family: var(--font); font-size: var(--text-xs); font-weight: 700; font-variation-settings: 'wght' 700; letter-spacing: var(--tracking-wide); cursor: pointer; white-space: nowrap; }
  #bselOut:hover { border-color: var(--white); }
  @media (max-width: 520px) { #bselWho { display: none; } }
  header h1 { font-size: var(--text-lg); font-weight: 900; font-variation-settings: 'wght' 900; letter-spacing: -0.02em; margin: 0 0 14px; text-wrap: balance; }

  #divbar { flex-wrap: wrap; margin-bottom: 8px; }
  #divbar[hidden] { display: none; }
  #divbar > button { display: inline-flex; align-items: center; gap: 6px; }
  #divbar .plg { height: 15px; width: auto; }
  .avgs td .dlg { height: 15px; width: auto; vertical-align: -2px; margin-right: 7px; }
  #divbar > button:focus-visible, .gwbar button:focus-visible { outline: none; box-shadow: var(--focus-ring); }

  /* Weekend strip: a justified one-off, not a .chip-group — an unbounded,
     scrolling set of dated pills carrying counts. Sizes from the scale. */
  .gwbar { display: flex; gap: 6px; margin: 0 0 10px; flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; }
  .gwbar button {
    flex: 0 0 auto; white-space: nowrap;
    font: inherit; font-weight: 600; font-variation-settings: 'wght' 600; font-size: var(--text-sm); color: var(--text);
    background: var(--white); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 5px 10px; cursor: pointer; line-height: 1.3;
  }
  .gwbar button small { font-weight: 400; color: var(--text-muted); font-size: var(--text-xs); margin-left: 4px; }
  .gwbar button.zero { opacity: 0.5; }
  .gwbar { cursor: grab; user-select: none; }
  .gwbar button[aria-pressed="true"] { background: var(--navy); color: var(--white); border-color: var(--navy); }
  .gwbar button[aria-pressed="true"] small { color: var(--white); opacity: 0.75; }

  #upbar { margin: -2px 0 10px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  #lensChip { display: inline-flex; align-items: center; gap: 7px; background: var(--text); color: var(--off-white); border-radius: 999px; font-size: var(--text-xs); font-weight: 700; font-variation-settings: 'wght' 700; letter-spacing: var(--tracking-wide); text-transform: uppercase; padding: 5px 7px 5px 12px; }
  #lensChip[hidden] { display: none; }
  #lensChip button { appearance: none; background: none; border: none; color: var(--off-white); font: inherit; cursor: pointer; padding: 0 4px; opacity: 0.8; }
  #lensChip button:hover { opacity: 1; }
  #upbar button { appearance: none; background: var(--white); border: 1px solid var(--border); border-radius: 999px; color: var(--text-muted); font-family: var(--font); font-size: var(--text-xs); font-weight: 700; font-variation-settings: 'wght' 700; letter-spacing: var(--tracking-wide); text-transform: uppercase; padding: 5px 12px; cursor: pointer; }
  #upbar button[aria-pressed="true"] { background: var(--text); border-color: var(--text); color: var(--off-white); }

  .stage { display: grid; grid-template-columns: clamp(380px, 34vw, 540px) minmax(0, 1fr); gap: clamp(16px, 1.5vw, 28px); align-items: start; }

    /* Phone: the map rides sticky and compact so tapping a card shows its
       trek highlight without scrolling away from the cards. */
    .mapbox { position: sticky; top: 0; z-index: 2; }
    .mapbox svg { height: 42vh; width: auto; max-width: 100%; margin: 0 auto; }

  .tbltop { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin: 0 0 8px; }
  /* Four tabs outgrow a phone: the bar scrolls inside itself instead of
     spilling the layout, and tab padding tightens below 480px. (These
     rules live in the shared section — the tab styles above are swapped
     for canon .tabs on the hosted build.) */
  #modebar { margin-bottom: 0; max-width: 100%; overflow-x: auto; scrollbar-width: none; }
  #modebar::-webkit-scrollbar { display: none; }
  #modebar > button { flex: 0 0 auto; white-space: nowrap; }
  @media (max-width: 480px) { #modebar > button { padding: 6px 8px; } }
  .headline { margin-bottom: 10px; }

  .mapbox { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 10px; }
  .mapbox svg { display: block; width: 100%; height: auto; }

  .rows { display: flex; flex-direction: column; gap: 5px; }
  /* Wide screens: two card columns, so a whole weekend fits on a 1080-tall
     viewport instead of scrolling a single stack. (Must follow the base
     .rows rule — equal specificity, source order decides.) */
  @media (min-width: 1400px) { .rows { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; align-items: start; } }
  .row.up { opacity: 0.62; }
  .row.up.active { opacity: 1; }
  .uphead { font-size: var(--text-xs); font-weight: 700; font-variation-settings: 'wght' 700; letter-spacing: var(--tracking-wider); text-transform: uppercase; color: var(--text-muted); border-top: 1px dashed var(--border); padding-top: 10px; margin-top: 6px; grid-column: 1 / -1; }
  .row {
    display: flex; align-items: stretch; gap: 9px;
    background: var(--white); border: 1px solid var(--border);
    border-left: 3px solid var(--dcol, var(--border)); border-radius: var(--radius);
    padding: 6px 9px; cursor: pointer;
  }
  .row .lg { flex: 0 0 36px; display: flex; align-items: center; justify-content: center; }
  .row .lg img { max-width: 36px; max-height: 42px; }
  .row .rbody { flex: 1; min-width: 0; }
  /* Selection keeps the division's identity: a tint of its own colour and
     a soft glow, never an outline that overrides the left border. */
  .row.active {
    background: color-mix(in srgb, var(--dcol, var(--border)) 8%, var(--white));
    border-color: color-mix(in srgb, var(--dcol, var(--border)) 45%, var(--border));
    border-left-color: var(--dcol, var(--border));
    box-shadow: 0 2px 12px color-mix(in srgb, var(--dcol, var(--border)) 30%, transparent);
  }
  .row .when { font-size: var(--text-xs); color: var(--text-muted); line-height: 1.4; margin-bottom: 2px; }
  .rqchip { display: inline-block; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 0 5px; margin-left: 5px; font-size: 10px; font-weight: 700; font-variation-settings: 'wght' 700; letter-spacing: var(--tracking-wide); text-transform: uppercase; color: var(--text-muted); }
  /* Full season transposed: divisions across the top in their band
     colours, measures down the side — matching Week by week. rqst rides
     as a column; its header opens the rqst tab. */
  #divTable thead th.band { text-align: center; }
  #divTable .bandlogo { height: 15px; width: auto; vertical-align: -3px; margin-right: 6px; }
  #divTable .bandlogo--pl { filter: brightness(0) invert(1); }
  #divTable th.rqcol, #rqTable th.rqcol { color: var(--text-muted); cursor: pointer; }
  #divTable tr.sect td { border-top-color: color-mix(in srgb, var(--text-muted) 40%, var(--border)); }
  /* Season + rqst: the transposed table is narrow, so on desktop the map
     rides beside it instead of below. */
  @media (min-width: 1200px) {
    .page--split { display: grid; grid-template-columns: minmax(360px, 44%) minmax(0, 1fr); gap: 8px 26px; align-items: start; }
    .page--split > header { grid-column: 1 / -1; }
    .page--split .avgs { grid-column: 1; grid-row: 2 / 4; margin-bottom: 0; }
    .page--split #divbar { grid-column: 2; grid-row: 2; margin-bottom: 0; }
    .page--split .stage { grid-column: 2; grid-row: 3; }

  /* The summary pins to the scrollbox foot: the table caps at 30vh, and
     the total effect is the line that must never scroll away. */
  #gatesTable tfoot td { position: sticky; bottom: 0; background: var(--white); border-top: 1px solid var(--border); font-weight: 700; font-variation-settings: 'wght' 700; }

  .row .tieline { display: flex; align-items: baseline; gap: 8px; }
  .row .tie { flex: 1; min-width: 0; font-size: var(--text-base); font-weight: 600; font-variation-settings: 'wght' 600; line-height: 1.35; }
  .row .tie span { color: var(--text-muted); font-weight: 400; font-variation-settings: 'wght' 400; }
  .row .mi { font-size: var(--text-sm); font-weight: 600; font-variation-settings: 'wght' 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .row .next {
    display: flex; align-items: stretch; gap: 10px;
    font-size: var(--text-xs); color: var(--text-muted); line-height: 1.6;
    border-top: 1px dashed var(--border); padding-top: 5px; margin-top: 2px;
  }
  .row .next .nlab { display: flex; align-items: center; font-size: var(--text-xs); font-weight: 700; font-variation-settings: 'wght' 700; letter-spacing: var(--tracking-wide); text-transform: uppercase; border-right: 1px solid var(--border); padding-right: 10px; }
  .row .next .nlines { flex: 1; min-width: 0; }
  .row .next b { color: var(--text); font-weight: 600; font-variation-settings: 'wght' 600; }
  .row .next .cup { color: var(--primary); font-weight: 600; }
  .row .gline { font-size: var(--text-xs); color: var(--text-muted); border-top: 1px dashed var(--border); padding-top: 5px; margin-top: 2px; }
  .row .gline b { color: var(--text); font-weight: 600; font-variation-settings: 'wght' 600; }

  .avgs { margin-top: 10px; }
  .avgs h2 { font-size: var(--text-xs); font-weight: 700; font-variation-settings: 'wght' 700; letter-spacing: var(--tracking-wider); text-transform: uppercase; color: var(--text-muted); margin: 0 0 8px; }
  /* Two rules serve the freeze panes below: border-collapse must be separate
     (collapsed borders are painted by the table and stay behind when a stuck
     cell moves), and the table itself must NOT carry overflow: hidden — any
     overflow other than visible makes an element the sticky scrollport, which
     would trap the stuck cells on the non-scrolling table. The border and
     radius live on the scroll wrappers instead. */
  .avgs table { width: 100%; border-collapse: separate; border-spacing: 0; background: var(--white); font-size: var(--text-sm); }
  .avgs th, .avgs td { padding: 5px 10px; text-align: right; font-variant-numeric: tabular-nums; }
  .avgs th:first-child, .avgs td:first-child { text-align: left; }
  .avgs thead th { color: var(--text-muted); font-weight: 800; font-variation-settings: 'wght' 800; font-size: var(--text-xs); letter-spacing: var(--tracking-tight); text-transform: uppercase; border-bottom: 1px solid var(--border); }
  .avgs tbody tr + tr td { border-top: 1px solid var(--border); }
  .avgs td:first-child { font-weight: 600; font-variation-settings: 'wght' 600; }
  .avgs thead th.band { text-align: center; border-left: 1px solid var(--border); }
  #divTable thead tr:nth-child(2) th { text-align: right; }
  #divTable thead tr:nth-child(2) th:nth-child(1),
  #divTable thead tr:nth-child(2) th:nth-child(3),
  #divTable thead tr:nth-child(2) th:nth-child(5),
  #divTable tbody td:nth-child(5), #divTable tbody td:nth-child(7), #divTable tbody td:nth-child(9) { border-left: 1px solid var(--border); }
  #divWrap, #weekWrap { border: 1px solid var(--border); border-radius: var(--radius-lg); }
  .avgs .scrollbox { max-height: clamp(320px, 46vh, 620px); overflow-y: auto; }
  /* Gates alone runs shorter on desktop so table AND charts share a 16:9
     screen without page scroll; the table scrolls inside itself. */
  @media (min-width: 841px) { #gatesWrap.scrollbox { max-height: clamp(240px, 30vh, 430px); } }
  /* Freeze panes. Sticky sits on the CELLS — Chromium ignores position:
     sticky on thead/tr, which is why a sticky-thead rule did nothing on
     phones. The two header rows pin to the scrollbox top (the band row's
     height is fixed so the second row knows its offset); the Weekend /
     Division column pins left. The vertical seam is a box-shadow, not a
     border-right: it paints on the same pixel as the following cell's
     .bl border at rest, and travels with the stuck cell when scrolled. */
  /* The 30px here and the second row's top must agree: the band row is
     pinned to that height so the row beneath knows its offset. */
  #weekTable thead th { position: sticky; top: 0; z-index: 2; background: var(--white); white-space: nowrap; }
  #weekTable thead tr:first-child th { height: 30px; box-sizing: border-box; padding-top: 0; padding-bottom: 0; vertical-align: middle; }
  #weekTable thead tr:nth-child(2) th { top: 30px; }
  #weekTable tbody td:first-child, #divTable tbody td:first-child, #clubTable tbody td:first-child {
    position: sticky; left: 0; z-index: 1; background: var(--white);
    white-space: nowrap; box-shadow: 1px 0 0 var(--border);
  }
  #weekTable thead tr:first-child th:first-child, #divTable thead tr:first-child th:first-child, #clubTable thead tr:first-child th:first-child {
    position: sticky; left: 0; z-index: 3; background: var(--white); box-shadow: 1px 0 0 var(--border);
  }
  #clubTable thead th, #gatesTable thead th { position: sticky; top: 0; z-index: 2; background: var(--white); white-space: nowrap; cursor: pointer; user-select: none; }
  #clubTable thead th.sorted, #gatesTable thead th.sorted { color: var(--text); }
  #gatesTable td:first-child { white-space: nowrap; }
  #gatesTable .dim { color: var(--text-muted); font-weight: 400; }
  #gatesTable tbody tr.gpick { cursor: pointer; }
  #gatesTable tbody tr.gopen td { background: color-mix(in srgb, var(--primary) 8%, var(--white)); }
  /* Gates stage: on this tab the chart IS the stage — the map had nothing
     to say about attendance, so it steps aside with the cards and league
     chips. One card spanning both stage columns; panels stack full width
     and share the distance axis (labels on the bottom panel only). */
  #gatesStage { grid-column: 1 / -1; position: relative; background: var(--white); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 12px 16px 14px; }
  .gxtop { display: flex; align-items: center; justify-content: space-between; gap: 8px 14px; flex-wrap: wrap; margin: 0 0 2px; }
  .gxwho { font-size: var(--text-base); font-weight: 800; font-variation-settings: 'wght' 800; }
  /* The club dropdown is canon .nl-select — width alone is tool layout. */
  #gxClub { max-width: 46vw; }
  #gatesStage .gxheads { display: flex; gap: 6px 26px; flex-wrap: wrap; margin: 2px 0 4px; font-size: var(--text-sm); }
  #gatesStage .gxheads b { font-variant-numeric: tabular-nums; }
  #gatesStage .gxred { color: var(--primary); }
  #gatesStage .gxd { display: inline-block; padding: 0 6px; border-radius: var(--radius-sm); font-variant-numeric: tabular-nums; font-weight: 700; font-variation-settings: 'wght' 700; }
  /* Panels sit side by side on desktop (2-up fixture, 3-up club), each
     with its OWN mile labels — a shared bottom axis dies the moment the
     bottom panel scrolls below the fold. Stacks itself on a phone. */
  #gatesStage .gxcharts { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 6px 22px; }
  /* Width caps keep panel height in check so table + charts share a 16:9
     screen; the single landing chart may run wider than the pairs. */

  #gatesStage .gx1 figure { max-width: 760px; }
  #gatesStage .gxt { font-size: var(--text-sm); font-weight: 800; font-variation-settings: 'wght' 800; letter-spacing: var(--tracking-tight); text-transform: uppercase; }
  #gatesStage .gxfig { font-size: var(--text-base); margin: 2px 0 0; }
  #gatesStage .gxfig b { font-variant-numeric: tabular-nums; }
  #gatesStage .gxsub, #rqWrap .gxsub { color: var(--text-muted); font-size: var(--text-xs); margin: 1px 0 5px; }
  /* Chart primitives are shared by the gates stage and the rqst strip. */
  #gatesStage .notch, #rqStrip .notch { stroke: var(--text-muted); stroke-width: 1; opacity: .7; }
  #gatesStage svg, #rqStrip svg { width: 100%; height: auto; display: block; }

  #rqStrip .meantick { stroke: var(--text); stroke-width: 2; opacity: .8; }

  #haBar, #seasonBar { display: flex; gap: 6px; }

  #clubTable tbody tr { cursor: pointer; }

      /* The dashed baseline stops the solid curve reading as an error:
         the dots are the host's real gates with their ACTUAL visitors,
         so a big-following visitor's curve rightly floats above them —
         the dashed typical-visitor line explains the cloud, and the gap
         between the lines is this visitor's premium. */
      charts += panel("Gate",
        "<b>" + fmtN(g.t) + "</b> actual · ~" + ex10(xt) + " expected" + dl(g.t, xt),
        f.h + "'s home Saturday 3pms (" + ptsT.length + ") by opponent distance · solid = with " + f.a + " visiting · dashed = a typical visitor",
        svgScatter({ pts: ptsT, lo: H.lo, hi: H.hi, curve: x => H.S[f.h] * H.D(x) + A.S[f.a] * A.D(x),
          curve2: x => H.S[f.h] * H.D(x) + medS * A.D(x), xMax,
          mark: { mi: f.mi, y: g.t, exp: xt,
            tip: "<b>This game</b> · gate " + fmtN(g.t) + " · " + f.mi + "mi",
            expTip: "Expected ~" + ex10(xt) + " gate at " + f.mi + "mi" } }));
    }
    body.innerHTML = top("<b>" + f.day + "</b> " + f.t + " · " + f.h + " v " + f.a) +
      (heads ? '<div class="gxheads">' + heads + "</div>" : "") +
      '<div class="gxcharts">' + charts + "</div>";
    return;
  }

  /* Landing — the league's distance effect itself. */
  const pts = [];
  for (const c in A.per) for (const r of A.per[c]) pts.push({ mi: r.mi, y: r.y / A.S[c], tip: tipTxt(r) + " · " + (r.y / A.S[c]).toFixed(1) + "× usual" });
  body.innerHTML = top("The league's distance effect") + '<div class="gxcharts gx1">' +
    panel("Away support by distance", "", "every unpicked Saturday-3pm away crowd, as a multiple of the visiting club's usual take · tap a game or pick a club",
      svgScatter({ pts, lo: A.lo, hi: A.hi, curve: A.D, refY: 1, W: window.matchMedia("(max-width: 840px)").matches ? 460 : 980, Hh: 300, fs: 13, yCap: 4, yFmt: v => (v % 1 ? v.toFixed(1) : v) + "×" })) +
    "</div>";
}

/* Dot tips: every plotted glyph pairs with an invisible r13 hit circle
   carrying its text — a finger-sized target, shown on hover or tap,
   positioned at the dot and clamped inside the card. Delegated on the
   stage so chart re-renders never re-wire anything. */
const gxTip = document.getElementById("gxTip");
let gxHot = null;
function gxShowTip(hit) {
  gxHideTip();
  const el = hit.previousElementSibling;
  if (el && el.classList.contains("pt")) { el.classList.add("hot"); gxHot = el; }
  gxTip.innerHTML = hit.dataset.tip;
  gxTip.hidden = false;
  const hr = hit.getBoundingClientRect();
  const cx = hr.left + hr.width / 2 + window.scrollX, cy = hr.top + hr.height / 2 + window.scrollY;
  const maxL = window.scrollX + document.documentElement.clientWidth - gxTip.offsetWidth - 4;
  gxTip.style.left = Math.max(window.scrollX + 4, Math.min(cx - gxTip.offsetWidth / 2, maxL)) + "px";
  const above = cy - gxTip.offsetHeight - 12;
  gxTip.style.top = (above > window.scrollY ? above : cy + 16) + "px";
}
function gxHideTip() { gxTip.hidden = true; if (gxHot) { gxHot.classList.remove("hot"); gxHot = null; } }
/* One tip for every chart on the page, delegated at document level —
   the gates stage and the rqst strip both re-render freely. */
document.addEventListener("pointerover", e => { const h = e.target.closest && e.target.closest("[data-tip]"); if (h) gxShowTip(h); });
document.addEventListener("pointerout", e => { if (e.target.closest && e.target.closest("[data-tip]")) gxHideTip(); });
document.addEventListener("click", e => { const h = e.target.closest && e.target.closest("[data-tip]"); if (h) gxShowTip(h); else gxHideTip(); });
/* The club dropdown is rebuilt with the stage, so its change handler is
   delegated too. Choosing a club clears any tapped fixture. */
document.addEventListener("change", e => {
  if (e.target.id !== "gxClub") return;
  gatesClub = e.target.value || null;
  gatesOpen = null;
  render();
});

/* The rqst tab: baseline vs broadcast vs request, per Richard. Three
   tiers, one mile axis. Weekend fixtures is every weekend league game in
   the data (the UP array is weekend-only by design) — it runs a little
   LONGER than the all-pairings base (+6% mean here) because leagues
   save the short trips for midweek, which is itself worth seeing.
   Broadcast picks are the moved set, rqst the flagged subset. The strip
   plots all three as dot lanes; the stage map shows the flagged treks. */
function renderRqstPanel() {
  const nlAll = FX.concat(UPX).filter(f => f.div === "NL");
  const picks = FX.filter(f => f.div === "NL");
  const rq = FX.filter(f => f.rq);
  const b = DATA.BASE.NL;
  const mk = (label, list, cls) => {
    const mi = list.map(f => f.mi);
    return { label, cls, list, n: list.length, md: Math.round(median(mi)), m: Math.round(mean(mi)) };
  };
  const tiers = [mk("Weekend fixtures", nlAll), mk("Broadcast picks", picks), mk("rqst", rq, "rqcol")];
  const sign = d => (d >= 0 ? "+" : "") + d + "%";
  const pv = (v, base) => Math.round((v - base) / base * 100);
  let h = "<thead><tr><th></th>" + tiers.map(t => "<th" + (t.cls ? ' class="' + t.cls + '"' : "") + ">" + t.label + "</th>").join("") + "</tr></thead><tbody>";
  const row = (label, cell) => { h += "<tr><td>" + label + "</td>" + tiers.map(cell).join("") + "</tr>"; };
  row("Games", t => "<td>" + t.n + "</td>");
  row("Median mi", t => "<td>" + t.md + "</td>");
  row("Mean mi", t => "<td>" + t.m + "</td>");
  row("vs base (median)", t => { const d = pv(t.md, b.med); return '<td style="' + heatPct(d) + '">' + sign(d) + "</td>"; });
  row("vs base (mean)", t => { const d = pv(t.m, b.mean); return '<td style="' + heatPct(d) + '">' + sign(d) + "</td>"; });
  document.getElementById("rqTable").innerHTML = h + "</tbody>";
  document.getElementById("rqStrip").innerHTML = rqStripSvg(tiers) +
    '<div class="gxsub">each dot a game, by trip distance · vertical line = the tier\'s mean · tap a dot for the game</div>';
}
function rqStripSvg(tiers) {
  const W = window.matchMedia("(max-width: 840px)").matches ? 460 : 660, fs = 14;
  const laneH = 50, T = 6, B = 26, L = 10, R = 10;
  const Hh = T + tiers.length * laneH + B;
  const iw = W - L - R;
  const xMax = Math.max(100, Math.ceil(Math.max(...tiers[0].list.map(f => f.mi)) / 50) * 50);
  const X = mi => (L + mi / xMax * iw).toFixed(1);
  const axisY = T + tiers.length * laneH;
  let s = '<svg viewBox="0 0 ' + W + " " + Hh + '" style="font-size:' + fs + 'px" role="img">';
  s += '<line class="axis" x1="' + L + '" y1="' + axisY + '" x2="' + (W - R) + '" y2="' + axisY + '"/>';
  s += '<text class="tick" x="' + L + '" y="' + (axisY + 18) + '" text-anchor="middle">0</text>';
  const xStep = xMax > 250 ? 100 : 50;
  for (let xv = xStep; xv <= xMax; xv += xStep) {
    const last = xv + xStep > xMax;
    s += '<line class="notch" x1="' + X(xv) + '" y1="' + axisY + '" x2="' + X(xv) + '" y2="' + (axisY + 4) + '"/>';
    s += '<text class="tick" x="' + (last ? W - 2 : X(xv)) + '" y="' + (axisY + 18) + '" text-anchor="' + (last ? "end" : "middle") + '">' + xv + (last ? "mi" : "") + "</text>";
  }
  tiers.forEach((t, li) => {
    const y0 = T + li * laneH;
    if (li) s += '<line class="axis" opacity=".4" x1="' + L + '" y1="' + y0 + '" x2="' + (W - R) + '" y2="' + y0 + '"/>';
    s += '<text class="tick lanelab" x="' + L + '" y="' + (y0 + 14) + '">' + t.label + " · mean " + t.m + "mi</text>";
    t.list.forEach((f, i) => {
      const cy = y0 + 28 + ((i * 37) % 15);
      const cls = t.cls ? "pt picked" : (li === 1 ? "pt" : "pt faint");
      const r = t.cls ? 4 : (li === 1 ? 3.2 : 2.4);
      const tip = "<b>" + f.day + "</b> " + f.t + " · " + f.h + " v " + f.a + " · " + f.mi + "mi" + (f.rq ? " · rqst" : (f.u ? "" : " · pick"));
      s += '<circle class="' + cls + '" cx="' + X(f.mi) + '" cy="' + cy + '" r="' + r + '"/>' +
        '<circle class="hit" cx="' + X(f.mi) + '" cy="' + cy + '" r="11" data-tip="' + tip + '"/>';
    });
    s += '<line class="meantick" x1="' + X(t.m) + '" y1="' + (y0 + 18) + '" x2="' + X(t.m) + '" y2="' + (y0 + laneH - 4) + '"/>';
  });
  return s + "</svg>";
}

const niceCeil = v => {
  const p = 10 ** Math.floor(Math.log10(v));
  for (const m of [1, 1.5, 2, 2.5, 3, 4, 5, 7.5]) if (m * p >= v) return m * p;
  return 10 * p;
};
const kFmt = v => v >= 1000 ? (v / 1000) % 1 ? (v / 1000).toFixed(1) + "k" : (v / 1000) + "k" : String(v);
/* Hand-rolled scatter at stage size: points {mi, y, tip?}, a curve
   sampled over the fitted range (plus a clamped stub out to the marked
   game if it sits shorter than any baseline trip — flat there because
   the model refuses to extrapolate), hollow dot = expected at this
   distance, filled = actual, dashed drop between them making the gap
   visible. Pass xMax to align stacked panels on one distance axis;
   xAxis:false suppresses the tick labels on the upper panel. */
function svgScatter(o) {
  const W = o.W || 460, Hh = o.Hh || 260, L = 44, R = 10, T = 10, B = 24;
  const iw = W - L - R, ih = Hh - T - B;
  const cp = [], cp2 = [];
  const a = Math.min(o.lo, o.mark ? o.mark.mi : o.lo), b = Math.max(o.hi, o.mark ? o.mark.mi : o.hi);
  for (let i = 0; i <= 64; i++) {
    const x = a + (b - a) * i / 64;
    if (o.curve) cp.push({ mi: x, y: o.curve(x) });
    if (o.curve2) cp2.push({ mi: x, y: o.curve2(x) });
  }
  const xMax = o.xMax || Math.max(100, Math.ceil(Math.max(...o.pts.map(p => p.mi), o.mark ? o.mark.mi : 0) / 50) * 50);
  const ys = o.pts.map(p => p.y).concat(cp.map(p => p.y), cp2.map(p => p.y), o.mark && o.mark.y != null ? [o.mark.y] : [], o.mark ? [o.mark.exp] : []);
  let yTop = niceCeil(Math.max(...ys) * 1.05);
  /* yCap stops one freak game stretching the scale and squashing the
     cloud; capped dots pin to the top edge and their tip tells the truth. */
  if (o.yCap && yTop > o.yCap) yTop = o.yCap;
  const fmt = o.yFmt || kFmt;
  const X = mi => (L + mi / xMax * iw).toFixed(1), Y = v => (T + ih - v / yTop * ih).toFixed(1);
  const hit = (cx, cy, tip) => tip ? '<circle class="hit" cx="' + cx + '" cy="' + cy + '" r="13" data-tip="' + tip + '"/>' : "";
  /* Tick text inherits the svg's font-size, so it holds a readable size
     whatever width the panel renders at for its viewBox. */
  let s = '<svg viewBox="0 0 ' + W + " " + Hh + '" style="font-size:' + (o.fs || 14) + 'px" role="img">';
  s += '<line class="axis" x1="' + L + '" y1="' + (T + ih) + '" x2="' + (W - R) + '" y2="' + (T + ih) + '"/>';
  s += '<line class="axis" x1="' + L + '" y1="' + T + '" x2="' + L + '" y2="' + (T + ih) + '"/>';
  for (const yv of [yTop / 2, yTop]) {
    s += '<line class="axis" opacity=".55" x1="' + L + '" y1="' + Y(yv) + '" x2="' + (W - R) + '" y2="' + Y(yv) + '"/>';
    s += '<text class="tick" x="' + (L - 6) + '" y="' + (+Y(yv) + 4) + '" text-anchor="end">' + fmt(yv) + "</text>";
  }
  if (o.refY != null)
    s += '<line class="refline" x1="' + L + '" y1="' + Y(o.refY) + '" x2="' + (W - R) + '" y2="' + Y(o.refY) + '"/>';
  const xStep = xMax > 250 ? 100 : 50;
  s += '<text class="tick" x="' + L + '" y="' + (T + ih + 18) + '" text-anchor="middle">0</text>';
  for (let xv = xStep; xv <= xMax; xv += xStep) {
    const last = xv + xStep > xMax; /* anchored inboard: "300mi" was clipping */
    s += '<line class="notch" x1="' + X(xv) + '" y1="' + (T + ih) + '" x2="' + X(xv) + '" y2="' + (T + ih + 4) + '"/>';
    s += '<text class="tick" x="' + (last ? W - 2 : X(xv)) + '" y="' + (T + ih + 18) + '" text-anchor="' + (last ? "end" : "middle") + '">' + xv + (last ? "mi" : "") + "</text>";
  }
  for (const p of o.pts) {
    const cx = X(p.mi), cy = Y(Math.min(p.y, yTop));
    s += '<circle class="' + (p.k ? "pt picked" : "pt") + '" cx="' + cx + '" cy="' + cy + '" r="' + (p.k ? 4.2 : 3.5) + '"/>' + hit(cx, cy, p.tip);
  }
  if (cp2.length) s += '<path class="curveb" d="M' + cp2.map(p => X(p.mi) + " " + Y(p.y)).join("L") + '"/>';
  if (cp.length) s += '<path class="curve" d="M' + cp.map(p => X(p.mi) + " " + Y(p.y)).join("L") + '"/>';
  if (o.mark) {
    const mx = X(o.mark.mi);
    if (o.mark.y != null)
      s += '<line class="drop" x1="' + mx + '" y1="' + Y(o.mark.exp) + '" x2="' + mx + '" y2="' + Y(o.mark.y) + '"/>';
    s += '<circle class="expmark" cx="' + mx + '" cy="' + Y(o.mark.exp) + '" r="4.2"/>' + hit(mx, Y(o.mark.exp), o.mark.expTip);
    if (o.mark.y != null)
      s += '<circle class="actmark" cx="' + mx + '" cy="' + Y(o.mark.y) + '" r="5.5"/>' + hit(mx, Y(o.mark.y), o.mark.tip);
  }
  return s + "</svg>";
}

/* By club — who gets the brunt. One row per club of the toggled league(s),
   zero-pick clubs included (an untouched club is part of the spread). Miles
   land on the AWAY side only, and means throughout — per-club samples are a
   handful of trips, and a mean compares cleanly with the club's own
   baseline: the mean away trip its fixture list already owes it (distance
   to every divisional rival — pure geography). "vs base" is the honest
   burden column and the default sort: a far-flung club whose moved trips
   match its normal trips reads near 0%. Slot columns count games either
   venue (a Friday home game still takes the Saturday), batched so a rogue
   kick-off folds into its batch, and a lens only shows slots it uses. */
const SLOTS = [
  ["fri", "Fri", "Friday", f => f.day.startsWith("Fri")],
  ["satE", "Sat E", "Saturday before 3pm", f => f.day.startsWith("Sat") && f.t < "15:00"],
  ["satL", "Sat L", "Saturday after 3pm", f => f.day.startsWith("Sat") && f.t > "15:00"],
  ["sun", "Sun", "Sunday", f => f.day.startsWith("Sun")],
  ["mon", "Mon", "Monday", f => f.day.startsWith("Mon")]
];
const havMi = (a, b) => { const t = x => x * Math.PI / 180;
  const h = Math.sin(t(b.lat - a.lat) / 2) ** 2 + Math.cos(t(a.lat)) * Math.cos(t(b.lat)) * Math.sin(t(b.lng - a.lng) / 2) ** 2;
  return 2 * 6371e3 * Math.asin(Math.sqrt(h)) / 1609.344; };
function renderClubTable() {
  const agg = {};
  for (const name in CLUBS) {
    const c = CLUBS[name];
    if (divSel === "ALL" || c.div === divSel)
      agg[name] = { name, div: c.div, moved: 0, away: 0, trips: [],
        a_fri: 0, a_satE: 0, a_satL: 0, a_sun: 0, a_mon: 0,
        h_fri: 0, h_satE: 0, h_satL: 0, h_sun: 0, h_mon: 0 };
  }
  FX.forEach(f => {
    const slot = SLOTS.find(s => s[3](f));
    for (const [name, isAway] of [[f.h, false], [f.a, true]]) {
      const c = agg[name]; if (!c) continue;
      c.moved++;
      if (isAway) { c.away++; c.trips.push(f.mi); }
      /* Both venues tallied; the Home/Away switcher picks which set the
         slot columns show. Away slot sums = Away; home = Moved - Away. */
      if (slot) c[(isAway ? "a_" : "h_") + slot[0]]++;
    }
  });
  const rows = Object.values(agg);
  rows.forEach(r => {
    /* Baseline: a double round-robin visits every divisional rival once,
       so the club's normal away trip is its mean distance to them. */
    const others = Object.values(CLUBS).filter(c => c.div === r.div && c !== CLUBS[r.name]);
    r.base = Math.round(mean(others.map(c => havMi(CLUBS[r.name], c))));
    r.avgMi = r.trips.length ? Math.round(mean(r.trips)) : null;
    r.vsBase = r.avgMi === null ? null : Math.round((r.avgMi - r.base) / r.base * 100);
    const gs = gateStats && gateStats[r.name];
    r.gateD = gs && gs.hP.length && gs.gN.length ? Math.round((mean(gs.hP) / mean(gs.gN) - 1) * 100) : null;
    r.awayD = gs && gs.aP.length && gs.brN.length ? Math.round((mean(gs.aP) / mean(gs.brN) - 1) * 100) : null;
  });
  const slotKeys = new Set(SLOTS.map(s => s[0]));
  const slotOf = (r, k) => clubHA === "both" ? r["a_" + k] + r["h_" + k] : r["a_" + k];
  const val = (r, k) => {
    if (k === "name") return r.name;
    const v = slotKeys.has(k) ? slotOf(r, k) : r[k];
    return v === null ? -999 : v;
  };
  rows.sort((a, b) => {
    const x = val(a, clubSort.k), y = val(b, clubSort.k);
    const c = (typeof x === "string") ? x.localeCompare(y) : x - y;
    return c ? c * clubSort.d : a.name.localeCompare(b.name);
  });
  const scale = k => {
    const vs = rows.filter(r => r[k] !== null).map(r => r[k]);
    return vs.length ? [Math.min(...vs), Math.max(...vs)] : [0, 1];
  };
  const [avLo, avHi] = scale("avgMi"), [bsLo, bsHi] = scale("base");
  const liveSlots = SLOTS.filter(s => rows.some(r => slotOf(r, s[0]) > 0));
  const slotHi = Object.fromEntries(liveSlots.map(s => [s[0], Math.max(1, ...rows.map(r => slotOf(r, s[0])))]));
  const COLS = [["name", "Club", ""], ["moved", "Moved", "Games moved (either venue)"],
    ["away", "Away", "Moved games travelled to"], ["avgMi", "Avg move", "Mean moved away trip"],
    ["base", "Base", "Mean away trip the fixture list owes them — every divisional rival once, midweek fixtures included"],
    ["vsBase", "vs base", "Moved trips against the club's own normal"],
    ...liveSlots.map(s => [s[0], s[1], s[2] + (clubHA === "both" ? " games, either venue" : " " + clubHA + " games")]),
    ...(gateStats ? [["gateD", "Gate Δ", "Picked home gates vs the club's unpicked-Saturday average"],
                     ["awayD", "Away Δ", "Away fans at picked trips vs their unpicked average"]] : [])];
  const mi = (v, lo, hi) => '</td><td style="' + (v === null ? "" : heat(v, lo, hi)) + '">' + (v === null ? "—" : v);
  const sign = v => (v >= 0 ? "+" : "") + v + "%";
  const ct = document.getElementById("clubTable");
  ct.innerHTML = "<thead><tr>" + COLS.map(([k, label, tip]) =>
    '<th data-k="' + k + '"' + (tip ? ' title="' + tip + '"' : "") +
    (k === clubSort.k ? ' class="sorted"' : "") + ">" + label + (k === clubSort.k ? (clubSort.d < 0 ? " ▾" : " ▴") : "") + "</th>"
  ).join("") + "</tr></thead><tbody>" + rows.map(r =>
    '<tr data-name="' + r.name.replace(/"/g, "&quot;") + '"' + (r.name === clubLens ? ' class="lensed"' : "") + "><td>" + crest(r.name, r.div) + r.name + "</td><td>" + r.moved + "</td><td>" + r.away +
    mi(r.avgMi, avLo, avHi) + mi(r.base, bsLo, bsHi) +
    '</td><td style="' + (r.vsBase === null ? "" : heatPct(r.vsBase)) + '">' + (r.vsBase === null ? "—" : sign(r.vsBase)) +
    liveSlots.map(s => { const v = slotOf(r, s[0]);
      return '</td><td style="' + (v ? heat(v, 0, slotHi[s[0]]) : "") + '">' + (v || "—"); }).join("") +
    (gateStats ?
      '</td><td style="' + (r.gateD === null ? "" : heatPctUp(r.gateD)) + '">' + (r.gateD === null ? "—" : sign(r.gateD)) +
      '</td><td style="' + (r.awayD === null ? "" : heatPctUp(r.awayD)) + '">' + (r.awayD === null ? "—" : sign(r.awayD))
      : "") +
    "</td></tr>"
  ).join("") + "</tbody>";
  [...ct.querySelectorAll("thead th")].forEach(th => th.addEventListener("click", () => {
    const k = th.dataset.k;
    if (clubSort.k === k) clubSort.d = -clubSort.d;
    else clubSort = { k, d: k === "name" ? 1 : -1 };
    renderClubTable();
  }));
  /* Tap a row: the stage becomes that club's season. Tap it again to clear. */
  [...ct.querySelectorAll("tbody tr")].forEach(tr => tr.addEventListener("click", () => {
    const name = tr.dataset.name;
    clubLens = (clubLens === name ? null : name);
    activeFx = -1;
    try { clubLens ? localStorage.setItem("tbf-lens", clubLens) : localStorage.removeItem("tbf-lens"); } catch (e) {}
    render();
  }));
}

function render() {
  [...divbar.children].forEach(b => { const on = b.dataset.k === divSel; b.setAttribute("aria-pressed", String(on)); b.classList.toggle("active", on); });

  const weekends = allWeekends;
  if (!weekends.includes(weIdx)) {
    const today = new Date().toISOString().slice(0, 10);
    const withGames = weekends.filter(we => shownFx(we).length);
    weIdx = withGames.find(we => we >= today) || withGames[withGames.length - 1] || weekends[0];
  }
  gwbar.innerHTML = "";
  weekends.forEach(we => {
    const n = shownFx(we).length;
    const b = document.createElement("button");
    b.setAttribute("role", "tab");
    b.setAttribute("aria-pressed", String(we === weIdx));
    if (!n) b.classList.add("zero");
    b.innerHTML = weLabel(we) + "<small>" + n + "</small>";
    b.addEventListener("click", () => { if (dragMoved) return; weIdx = we; activeFx = -1; try { localStorage.setItem("tbf-we", we); } catch (e) {} render(); });
    gwbar.appendChild(b);
  });
  const sel = gwbar.querySelector('[aria-pressed="true"]');
  if (sel && !gwbar.dataset.scrolled) { sel.scrollIntoView({ inline: "center", block: "nearest" }); gwbar.dataset.scrolled = "1"; }

  /* The tab is the lens for the whole stage, not just the table.
     week   — the selected weekend, as ever (one index space: picked block
              first, then on demand the rest of the round; f.u keys the
              muted treatment downstream).
     season — every pick for the toggled league at once: the fabric. Dots
              not pills, tap a trek to inspect one card.
     club   — no club chosen: the fabric again; a chosen club: their
              season — away treks bold, home moved games dimmed (the
              opponent's trek), and the unpicked toggle scoped to them. */
  /* The venue switcher scopes the lens stage too: Away = their journeys,
     Home = games at their ground, Both = the lot. */
  const lensGames = list => list.filter(f =>
    clubHA === "away" ? f.a === clubLens : (f.h === clubLens || f.a === clubLens));
  const inDiv = f => divSel === "ALL" || f.div === divSel;
  let fx;
  if (mode === "week") fx = shownFx(weIdx).concat(showUp ? shownUp(weIdx) : []);
  else if (mode === "club" && clubLens) fx = lensGames(FX).concat(showUp ? lensGames(UPX) : []);
  else if (mode === "gates") fx = FX.filter(f => f.div === "NL");
  /* rqst mode: the stage is the flagged games' fabric, nothing else. */
  else if (mode === "rqst") fx = FX.filter(f => f.rq);
  else fx = FX.filter(inDiv);
  const fabric = mode !== "week" && !(mode === "club" && clubLens);   // gates mode: NL fabric
  const pos = fx.map(f => { const c = CLUBS[f.h]; const [x, y] = proj(c.lat, c.lng); return { x, y }; });
  for (let pass = 0; pass < 4; pass++) {
    for (let i = 0; i < pos.length; i++) for (let j = i + 1; j < pos.length; j++) {
      /* Unpicked games and the fabric draw dots at true spots — only
         pills push. */
      if (fabric || fx[i].u || fx[j].u) continue;
      const dx = pos[j].x - pos[i].x, dy = pos[j].y - pos[i].y, d = Math.hypot(dx, dy), min = 48;
      if (d < min && d > 0) { const push = (min - d) / 2, ux = dx / d, uy = dy / d;
        pos[i].x -= ux * push; pos[i].y -= uy * push; pos[j].x += ux * push; pos[j].y += uy * push; }
    }
  }

  trekLayer.innerHTML = ""; markerLayer.innerHTML = "";
  /* A lens club's home moved games are the opponent's trek — drawn, but
     quieter than the club's own journeys. */
  const lensHome = f => mode === "club" && clubLens && clubHA === "both" && !f.u && f.h === clubLens;
  fx.forEach((f, i) => {
    if (i === activeFx) return;
    const home = pos[i], away = proj(CLUBS[f.a].lat, CLUBS[f.a].lng);
    if (f.u) {
      /* Same weight and opacity as a picked trek, ink instead of wire —
         the round reads as one fabric, colour alone says picked/not. */
      el("line", { x1: home.x, y1: home.y, x2: away[0], y2: away[1], stroke: "var(--text)", "stroke-width": 1.25, "stroke-dasharray": "5 4", opacity: 0.2 }, trekLayer);
      el("circle", { cx: away[0], cy: away[1], r: 3, fill: "var(--text)", opacity: 0.28 }, trekLayer);
      return;
    }
    /* The fabric speaks division colour, thicker and a little stronger —
       84 green treks argue harder than 84 faint red ones. */
    const tc = fabric ? DIVMETA[f.div].col : "var(--primary)";
    el("line", { x1: home.x, y1: home.y, x2: away[0], y2: away[1], stroke: tc, "stroke-width": fabric ? 1.75 : 1.25, "stroke-dasharray": "5 4", opacity: fabric ? 0.32 : (lensHome(f) ? 0.1 : 0.2) }, trekLayer);
    el("circle", { cx: away[0], cy: away[1], r: 3, fill: tc, opacity: fabric ? 0.42 : (lensHome(f) ? 0.14 : 0.28) }, trekLayer);
  });
  if (activeFx >= 0 && fx[activeFx]) {
    const f = fx[activeFx];
    /* A selected unpicked game speaks ink, not wire — red stays the story;
       in the fabric the selection wears its division's colour. */
    const hue = fabric ? DIVMETA[f.div].col : (f.u ? "var(--text)" : "var(--primary)");
    const home = pos[activeFx], away = proj(CLUBS[f.a].lat, CLUBS[f.a].lng);
    el("line", { x1: home.x, y1: home.y, x2: away[0], y2: away[1], stroke: hue, "stroke-width": 2, "stroke-dasharray": "5 4" }, trekLayer);
    el("circle", { cx: away[0], cy: away[1], r: 5, fill: hue }, trekLayer);
    const mx = (home.x + away[0]) / 2, my = (home.y + away[1]) / 2;
    const label = f.mi + " mi", lw = label.length * 7.4 + 12;
    el("rect", { x: mx - lw / 2, y: my - 11, width: lw, height: 20, rx: 10, fill: hue }, trekLayer);
    /* On an ink chip the text must be paper — ink flips light in the
       artifact's dark theme, where a fixed white would vanish. */
    const t = el("text", { x: mx, y: my + 4, "text-anchor": "middle", "font-size": 12, fill: fabric ? textFor(DIVMETA[f.div].col) : (f.u ? "var(--off-white)" : "var(--white)"), class: "mchip" }, trekLayer);
    t.textContent = label;
  }
  /* Every route gets a fat invisible hit line — the dotted trek itself is
     tappable. Drawn below the marker layer so pills win where they overlap. */
  fx.forEach((f, i) => {
    const home = pos[i], away = proj(CLUBS[f.a].lat, CLUBS[f.a].lng);
    const hit = el("line", { x1: home.x, y1: home.y, x2: away[0], y2: away[1],
      stroke: "#000", "stroke-opacity": 0, "stroke-width": 16, "pointer-events": "stroke", cursor: "pointer" }, trekLayer);
    hit.addEventListener("click", ev => { ev.stopPropagation(); selectFx(i, true); });
  });
  fx.forEach((f, i) => {
    const p = pos[i], home = CLUBS[f.h], away = CLUBS[f.a];
    const dim = !(activeFx < 0 || activeFx === i);
    if (f.u) {
      /* Unpicked: a small grey dot at the home ground — the card carries the
         names, the geography carries the point. Same hover/tap wiring. */
      const g = el("g", { cursor: "pointer", opacity: dim ? 0.35 : 1 }, markerLayer);
      el("circle", { cx: p.x, cy: p.y, r: activeFx === i ? 5 : 3.5, fill: "var(--text)", "fill-opacity": activeFx === i ? 1 : 0.55, stroke: "var(--white)", "stroke-width": 1.5 }, g);
      el("title", {}, g).textContent = f.h + " v " + f.a + " — " + f.day + ", " + f.t + " (" + DIVS[f.div] + ", not selected)";
      if (HOVERABLE) g.addEventListener("mouseenter", () => { if (activeFx !== i) { activeFx = i; render(); } });
      g.addEventListener("click", ev => { ev.stopPropagation(); selectFx(i, true); });
      return;
    }
    if (fabric) {
      /* The fabric speaks division colour at the home ground; the trek and
         the tap carry the rest. */
      const g = el("g", { cursor: "pointer", opacity: dim ? 0.35 : 1 }, markerLayer);
      el("circle", { cx: p.x, cy: p.y, r: activeFx === i ? 5 : 3.5, fill: DIVMETA[f.div].col, stroke: "var(--white)", "stroke-width": 1.5 }, g);
      el("title", {}, g).textContent = f.h + " v " + f.a + " — " + f.day + ", " + f.t + " (" + DIVS[f.div] + ")";
      if (HOVERABLE) g.addEventListener("mouseenter", () => { if (activeFx !== i) { activeFx = i; render(); } });
      g.addEventListener("click", ev => { ev.stopPropagation(); selectFx(i, true); });
      return;
    }
    const g = el("g", { cursor: "pointer", opacity: dim ? 0.35 : 1 }, markerLayer);
    const PW = 44, PH = 18, hw = PW / 2;
    const cid = "pc" + i;
    const cp = el("clipPath", { id: cid }, el("defs", {}, g));
    el("rect", { x: p.x - hw, y: p.y - PH / 2, width: PW, height: PH, rx: PH / 2 }, cp);
    const halves = el("g", { "clip-path": "url(#" + cid + ")" }, g);
    el("rect", { x: p.x - hw, y: p.y - PH / 2, width: hw, height: PH, fill: home.c }, halves);
    el("rect", { x: p.x, y: p.y - PH / 2, width: hw, height: PH, fill: away.c }, halves);
    el("line", { x1: p.x, y1: p.y - PH / 2, x2: p.x, y2: p.y + PH / 2, stroke: "var(--white)", "stroke-width": 1 }, halves);
    el("rect", { x: p.x - hw, y: p.y - PH / 2, width: PW, height: PH, rx: PH / 2, fill: "none", stroke: "var(--white)", "stroke-width": 2 }, g);
    const th = el("text", { x: p.x - hw / 2, y: p.y + 2.8, "text-anchor": "middle", "font-size": 7.5, fill: textFor(home.c), class: "moniker" }, g);
    th.textContent = home.i;
    const ta = el("text", { x: p.x + hw / 2, y: p.y + 2.8, "text-anchor": "middle", "font-size": 7.5, fill: textFor(away.c), class: "moniker" }, g);
    ta.textContent = away.i;
    el("title", {}, g).textContent = f.h + " v " + f.a + " — " + f.day + ", " + f.t + " (" + DIVS[f.div] + ")";
    if (HOVERABLE) g.addEventListener("mouseenter", () => { if (activeFx !== i) { activeFx = i; render(); } });
    g.addEventListener("click", ev => { ev.stopPropagation(); selectFx(i, true); });
  });

  const rows = document.getElementById("rows");
  rows.innerHTML = "";
  let upHeaded = false;
  fx.forEach((f, i) => {
    /* The fabric shows one card at a time — the one under the finger. */
    if (fabric && i !== activeFx) return;
    if (f.u && !upHeaded) {
      upHeaded = true;
      const h = document.createElement("div");
      h.className = "uphead";
      h.textContent = "Not selected · " + fx.filter(x => x.u).length;
      rows.appendChild(h);
    }
    const d = document.createElement("div");
    d.className = "row" + (f.u ? " up" : "") + (activeFx === i ? " active" : "");
    d.style.setProperty("--dcol", DIVMETA[f.div].col);
    d.title = DIVS[f.div] + (f.u ? " — not selected" : "");
    /* 2025/26 NL cards carry the gate once the node has loaded. Picked
       games read against the club's unpicked-Saturday baselines; unpicked
       ones just state their numbers — they ARE the baseline. */
    const g = SEASON_KEY === "2025-26" && GATES && f.gid ? GATES[f.gid] : null;
    let gline = "";
    if (g) {
      const st = gateStats || {};
      const hp = !f.u && st[f.h] && st[f.h].gN.length ? Math.round((g.t / mean(st[f.h].gN) - 1) * 100) : null;
      const ap = !f.u && g.a != null && st[f.a] && st[f.a].brN.length ? Math.round((g.a / mean(st[f.a].brN) - 1) * 100) : null;
      const sgn = v => (v >= 0 ? "+" : "") + v + "%";
      gline = '<div class="gline">Gate <b>' + g.t.toLocaleString("en-GB") + "</b>" +
        (hp === null ? "" : " (" + sgn(hp) + " vs usual)") +
        (g.a == null ? "" : " · Away <b>" + g.a.toLocaleString("en-GB") + "</b>" + (ap === null ? "" : " (" + sgn(ap) + ")")) +
        "</div>";
    }
    d.innerHTML =
      '<div class="lg">' + dlogo(f.div, "", DIVS[f.div]) + "</div>" +
      '<div class="rbody"><div class="when"><b>' + f.day + "</b> · " + f.t +
      (f.rq ? ' <span class="rqchip">rqst</span>' : "") + "</div>" +
      '<div class="tieline"><div class="tie">' + f.h + ' <span>v</span> ' + f.a + '</div><div class="mi">' + f.mi + " mi</div></div>" +
      (f.u ? "" :
      '<div class="next"><span class="nlab">Next<br>up</span><div class="nlines">' + fmtNext(f.h, f.nh) + fmtNext(f.a, f.na) + "</div></div>") +
      gline +
      "</div>";
    if (HOVERABLE) d.addEventListener("mouseenter", () => { if (activeFx !== i) { activeFx = i; render(); } });
    d.addEventListener("click", () => selectFx(i, false));
    rows.appendChild(d);
  });

  upTog.setAttribute("aria-pressed", String(showUp));
  upTog.classList.toggle("active", showUp);
  gwbar.hidden = mode !== "week";
  /* The strip above the map holds every stage control: unpicked toggle,
     venue switcher (club mode — it scopes the table's slot columns AND the
     lensed stage), and the Viewing chip. */
  document.getElementById("upbar").hidden = mode === "season" || mode === "gates" || mode === "rqst";
  upTog.hidden = mode === "club" && !clubLens;
  const chip = document.getElementById("lensChip");
  chip.hidden = !(mode === "club" && clubLens);
  if (clubLens) document.getElementById("lensName").textContent = clubLens;

  /* Picks vs the division season baseline — the whole season's picks,
     every division, whatever is toggled: this is the headline comparison. */
  const mG = document.getElementById("mGates");
  mG.hidden = !gateStats;
  if (mode === "gates" && !gateStats) mode = "week";
  const hasRq = FX.some(f => f.rq);
  const mR = document.getElementById("mRqst");
  mR.hidden = !hasRq;
  if (mode === "rqst" && !hasRq) mode = "week";
  mR.setAttribute("aria-pressed", String(mode === "rqst")); mR.classList.toggle("active", mode === "rqst");
  document.querySelector(".page").classList.toggle("page--split", mode === "season" || mode === "rqst");
  const mS = document.getElementById("mSeason"), mW = document.getElementById("mWeek"), mC = document.getElementById("mClub");
  mS.setAttribute("aria-pressed", String(mode === "season")); mS.classList.toggle("active", mode === "season");
  mW.setAttribute("aria-pressed", String(mode === "week")); mW.classList.toggle("active", mode === "week");
  mC.setAttribute("aria-pressed", String(mode === "club")); mC.classList.toggle("active", mode === "club");
  mG.setAttribute("aria-pressed", String(mode === "gates")); mG.classList.toggle("active", mode === "gates");
  document.getElementById("divWrap").hidden = mode !== "season";
  document.getElementById("weekWrap").hidden = mode !== "week";
  document.getElementById("clubWrap").hidden = mode !== "club";
  document.getElementById("gatesWrap").hidden = mode !== "gates";
  document.getElementById("rqWrap").hidden = mode !== "rqst";
  document.getElementById("haBar").hidden = mode !== "club";
  /* Gates mode swaps the whole stage: the chart card replaces the map,
     cards and league chips (this tab is NL-only, the chips do nothing). */
  document.getElementById("gatesStage").hidden = mode !== "gates";
  document.querySelector(".mapbox").hidden = mode === "gates";
  document.querySelector(".sched").hidden = mode === "gates";
  divbar.hidden = mode === "gates" || mode === "rqst";
  [...document.querySelectorAll("#haBar button")].forEach(b => b.setAttribute("aria-pressed", String(b.dataset.ha === clubHA)));
  [...document.querySelectorAll("#seasonBar button")].forEach(b => b.setAttribute("aria-pressed", String(b.dataset.season === SEASON_KEY)));
  if (mode === "gates") {
    renderGatesTable();
    renderGatesStage();
  } else if (mode === "rqst") {
    renderRqstPanel();
  } else if (mode === "club") {
    renderClubTable();
  } else if (mode === "season") {
    /* Transposed, per Richard: divisions across the top wearing their
       band colours like Week by week; measures run down the side. The
       narrow table shares the desktop screen with the map (.page--split).
       rqst rides as a muted column; its header opens the rqst tab. */
    const dt = document.getElementById("divTable");
    const pctN = (v, base) => Math.round((v - base) / base * 100);
    const tiers = Object.keys(DIVS).map(k => {
      const picks = FX.filter(f => f.div === k);
      const b = DATA.BASE[k];
      if (!picks.length || !b) return null;
      const mi = picks.map(f => f.mi);
      const wknds = new Set(picks.map(f => f.we)).size;
      return { k, n: mi.length, wknds, perW: mi.length / wknds,
        md: Math.round(median(mi)), m: Math.round(mean(mi)), b };
    }).filter(Boolean);
    const rq = FX.filter(f => f.rq);
    if (rq.length && DATA.BASE.NL) {
      const mi = rq.map(f => f.mi), wknds = new Set(rq.map(f => f.we)).size;
      tiers.push({ k: "rqst", n: mi.length, wknds, perW: mi.length / wknds,
        md: Math.round(median(mi)), m: Math.round(mean(mi)), b: DATA.BASE.NL, rq: 1 });
    }
    const perWs = tiers.map(c => c.perW);
    const pLo = Math.min(...perWs), pHi = Math.max(...perWs);
    const sign = d => (d >= 0 ? "+" : "") + d + "%";
    let dh = "<thead><tr><th></th>" + tiers.map(c => c.rq
      ? '<th class="band rqcol" role="button" tabindex="0">rqst</th>'
      : '<th class="band" style="background:' + DIVMETA[c.k].col + ';color:var(--white)">' +
        dlogo(c.k, "bandlogo" + (c.k === "PL" ? " bandlogo--pl" : "")) + DIVS[c.k] + "</th>").join("") + "</tr></thead><tbody>";
    const mrow = (label, cell, cls) => { dh += "<tr" + (cls ? ' class="' + cls + '"' : "") + "><td>" + label + "</td>" + tiers.map(cell).join("") + "</tr>"; };
    mrow("Picks", c => "<td>" + c.n + "</td>");
    mrow("Weekends", c => "<td>" + c.wknds + "</td>");
    mrow("Per weekend", c => '<td style="' + heat(c.perW, pLo, pHi) + '">' + c.perW.toFixed(1) + "</td>");
    mrow("Base median mi", c => '<td class="dim">' + c.b.med + "</td>", "sect");
    mrow("Base mean mi", c => '<td class="dim">' + c.b.mean + "</td>");
    mrow("Picked median mi", c => "<td>" + c.md + "</td>", "sect");
    mrow("Picked mean mi", c => "<td>" + c.m + "</td>");
    mrow("Δ median", c => { const d = pctN(c.md, c.b.med); return '<td style="' + heatPct(d) + '">' + sign(d) + "</td>"; }, "sect");
    mrow("Δ mean", c => { const d = pctN(c.m, c.b.mean); return '<td style="' + heatPct(d) + '">' + sign(d) + "</td>"; });
    dt.innerHTML = dh + "</tbody>";
    const rc = dt.querySelector("th.rqcol");
    if (rc) rc.addEventListener("click", () => { mode = "rqst"; try { localStorage.setItem("tbf-mode", mode); } catch (e) {} render(); });
  } else {
    /* Divisions side by side — per toggled league, in league order: games
       moved and the median trip that weekend. Each measure shades on one
       scale shared across the columns so leagues compare with each other,
       not just within themselves. */
    const wt = document.getElementById("weekTable");
    const divsOn = Object.keys(DIVS);
    const cell = list => {
      if (!list.length) return null;
      const mi = list.map(f => f.mi);
      return { n: list.length, mn: Math.round(mean(mi)) };
    };
    const grid = allWeekends.map(we => ({
      we,
      per: divsOn.map(k => cell(FX.filter(f => f.we === we && f.div === k))),
      all: cell(FX.filter(f => f.we === we))
    }));
    const cells = grid.flatMap(r => r.per.filter(Boolean));
    const hiN = Math.max(...cells.map(c => c.n));
    const miles = cells.map(c => c.mn);
    const mLo = Math.min(...miles), mHi = Math.max(...miles);
    /* Band headers wear the division's own colour, white lettering on all
       (Richard's call), and each mark keeps its original artwork — only
       the PL lion goes white, being the band's own purple otherwise. */
    let wh = "<thead><tr><th rowspan=2>Weekend</th>" +
      divsOn.map(k => '<th colspan=3 class="band" style="background:' + DIVMETA[k].col + ';color:var(--white)">' +
        dlogo(k, "bandlogo" + (k === "PL" ? " bandlogo--pl" : "")) + DIVS[k] + "</th>").join("") +
      '<th colspan=2 class="band">All</th></tr><tr>' +
      divsOn.map(() => '<th class=bl title="Games moved">G</th><th title="Mean miles per moved game">Mi</th><th>vs rnd</th>').join("") +
      '<th class=bl title="Games moved">G</th><th title="Mean miles per moved game">Mi</th></tr></thead><tbody>';
    /* Means only, per Richard — a weekend's picks are 2-5 games, and a
       median of three numbers dressed up as a second statistic misled
       more than it informed. Medians live on in Full season, where the
       samples are the whole campaign. vs rnd: the moved games' mean
       against the mean over ALL the division's games that weekend —
       near 0% means the mileage was the weekend's pairings, not the
       picking. */
    const signW = v => (v >= 0 ? "+" : "") + v + "%";
    const leagueBand = (c, k, we) => {
      if (!c) return "<td class=bl>—</td><td>—</td><td>—</td>";
      const rnd = (DATA.RND[k] || {})[we];
      const v = rnd ? Math.round((c.mn - rnd.mn) / rnd.mn * 100) : null;
      return '<td class=bl style="' + heat(c.n, 0, hiN) + '">' + c.n +
        '</td><td style="' + heat(c.mn, mLo, mHi) + '">' + c.mn +
        '</td><td style="' + (v === null ? "" : heatPct(v)) + '">' + (v === null ? "—" : signW(v)) + "</td>";
    };
    const allBand = c => c
      ? '<td class="bl dim">' + c.n + '</td><td class="dim">' + c.mn + "</td>"
      : "<td class=bl>—</td><td>—</td>";
    grid.forEach(r => {
      /* Empty weekends dim by colour, not tr opacity: a translucent row
         would let scrolled cells ghost through its sticky date cell. */
      wh += '<tr data-we="' + r.we + '" class="' + (r.we === weIdx ? "now " : "") + (r.all ? "" : "mt") + '"' +
        "><td>" + weLabel(r.we) + "</td>" +
        r.per.map((c, i) => leagueBand(c, divsOn[i], r.we)).join("") + allBand(r.all) + "</tr>";
    });
    wt.innerHTML = wh + "</tbody>";
    [...wt.querySelectorAll("tr[data-we]")].forEach(tr =>
      tr.addEventListener("click", () => { weIdx = tr.dataset.we; activeFx = -1; try { localStorage.setItem("tbf-we", weIdx); } catch (e) {} render(); }));
  }
}

svg.addEventListener("click", () => { if (activeFx >= 0) { activeFx = -1; render(); } });
render();
</script>
<script>
  NL.codeGate.ensure({
    mount: document.getElementById("bselGate"),
    title: "Broadcast Travel",
    sub: "Enter your access code.",
    numeric: false,
    length: 6,
    verify: NL.codeGate.viaFunction("app-data/pub-broadcast-selections"),
    claim: "bsel"
  }).then(function (s) {
    document.getElementById("bselGate").remove();
    /* The audience name and sign-out live in the topbar itself, via its
       extras.right slot — a re-render picks them up. No second bar. */
    window.NL_TOOL.extras = { right:
      '<span id="bselTopRight">' +
        '<span id="bselWho">' + NL.escHtml((s && s.name) || "Code holder") + '</span>' +
        '<button id="bselOut" type="button">Sign out</button>' +
      '</span>' };
    NL.renderTopbar(null);
    document.getElementById("bselOut").addEventListener("click", function () {
      NL.codeGate.signOut().then(function () { location.reload(); });
    });
    document.querySelector(".page").hidden = false;
    /* Gates: 2025/26 NL attendance figures live behind the sign-in — a
       node only the bsel claim can read. Fire-and-forget; the page works
       without it and fills in when it lands. */
    if (window.firebase && firebase.database) {
      firebase.database().ref("app-data/pub-broadcast-selections/gates/2025-26").once("value")
        .then(function (snap) { window.__setGates(snap.val()); })
        ["catch"](function () {});
    }
  });
</script>
</body>
