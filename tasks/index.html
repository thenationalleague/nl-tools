<!DOCTYPE html>
<!--
  NL Tools — Intake
  Version: v7.0
  Date: 13/08/2026
  File: /tasks/index.html

  Internal request intake. Captures requests that arrive by phone, corridor,
  email or message — with source, channel, date and priority — so there is a
  record of load and its origin. Personal/team tool: role defaults are off,
  access is granted per-user.

  Storage (RTDB):
    app-data/staff-tasks/requests/<id>     one logged request
    app-data/staff-tasks/config/categories category list (editable in-tool)
    app-data/staff-tasks/items|projects    legacy NL Tasks data (v6.x) — kept
                                           in place, no longer read or written

  CHANGELOG
  v7.0 (13/08/2026) — Rebuilt as Intake:
    * Replaces NL Tasks (v6.4) wholesale. The old tool (projects, kanban,
      gantt, my-day) was unused; v6.x code recoverable from git history.
    * New model: a request = requester + channel + date raised + description
      + category + priority + owner + status + date closed.
    * Views: open queue (priority then oldest first), closed archive,
      load summary (by requester and by channel) with CSV export.
    * Same toolKey (staff-tasks) so portal card and auth wiring carry over;
      access model changes to per-user grants (role defaults off).
    * No notifications, no workflow engine, no integrations — deliberate.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Intake — NL Tools</title>

  <!-- Brand stylesheet (lint canonical: ?v=35) -->
  <link rel="stylesheet" href="/system/nl-brand.css?v=35">

  <!-- Firebase 10.12.0 SDK (compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

  <!-- Firebase init -->
  <script>
    firebase.initializeApp({
      apiKey:            "AIzaSyC3az3OMnU7TdqlaWp8yrO_EjgZ36l-mXU",
      authDomain:        "nl-tools.firebaseapp.com",
      databaseURL:       "https://nl-tools-default-rtdb.europe-west1.firebasedatabase.app",
      projectId:         "nl-tools",
      storageBucket:     "nl-tools.firebasestorage.app",
      messagingSenderId: "801354670005",
      appId:             "1:801354670005:web:05d8ebad3e7e63610d03fc"
    });
    var db = firebase.database();
  </script>

  <!-- Tool identity + changelog. Keep window.NL_TOOL and var NL_TOOL_KEY
       in sync — auth-guard reads NL_TOOL_KEY, nl-topbar reads window.NL_TOOL. -->
  <script>
    window.NL_TOOL = {
      title: 'Intake',
      toolKey: 'staff-tasks'
    };
    var NL_TOOL_KEY = 'staff-tasks';

    window.NL_CHANGELOG = [
      {
        date: '13/08/2026',
        version: 'v7.0',
        items: [
          'Rebuilt as Intake — a request log replacing NL Tasks.',
          'Log who asked, how it arrived, when, category, priority, owner.',
          'Open queue, closed archive, and a load summary with CSV export.'
        ]
      }
    ];

    /* auth-guard fires this once the session is verified + pageWrap is
       revealed. Boot the main app from here so RTDB reads happen with a
       live auth token. Do NOT read RTDB before this fires. */
    window.nlAuthReady = function (userData) {
      window.NL = window.NL || {};
      window.NL.session = userData;
      if (window.TOOL && window.TOOL.boot) {
        window.TOOL.boot(userData);
      } else {
        window._toolDeferredSession = userData;
      }
    };
  </script>

  <!-- NL system scripts (lint canonical: ?v=30 / ?v=8 / ?v=10) -->
  <script src="/system/nl-utils.js?v=30"></script>
  <script src="/system/nl-topbar.js?v=8"></script>
  <script src="/system/auth-guard.js?v=10"></script>

<style>
  /* #pageWrap default hide is in nl-brand.css; auth-guard reveals with
     style.display = 'block'. Don't clear with '' — would re-trigger the
     brand rule and re-hide the page. */

  .queue-row { cursor: pointer; }

  .req-desc {
    max-width: 34ch;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* Priority + status pills (tool-local variants on the brand .pill base) */
  .pill--p1 { background: var(--red-light);   color: var(--red-deep); }
  .pill--p2 { background: var(--amber-light); color: var(--amber-deep); }
  .pill--p3 { background: var(--navy-100);    color: var(--navy-600); }

  .summary-grid {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 24px;
    align-items: start;
  }
  @media (max-width: 760px) {
    .summary-grid { grid-template-columns: 1fr; }
  }

  .cat-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 6px 0;
    border-bottom: 1px solid var(--navy-100);
  }
  .cat-row:last-child { border-bottom: none; }
</style>
</head>
<body>

<!-- Topbar — auto-rendered by /system/nl-topbar.js from window.NL_TOOL -->
<div id="nlTopbar"></div>

<div id="pageWrap">
  <div class="page">

    <div class="filter-bar">
      <div class="tabs" id="viewTabs">
        <button class="tab active" data-view="queue">Queue</button>
        <button class="tab" data-view="archive">Archive</button>
        <button class="tab" data-view="load">Load</button>
      </div>
      <button class="btn btn--primary" id="btnLog">Log request</button>
    </div>

    <section id="viewQueue"></section>
    <section id="viewArchive" hidden></section>
    <section id="viewLoad" hidden></section>

  </div>
</div>

<!-- Main app -->
<script>
(function () {
  'use strict';

  var PATH = 'app-data/staff-tasks';

  var CHANNELS = ['Phone', 'In person', 'Email', 'Message', 'Meeting', 'Other'];
  var DEFAULT_CATEGORIES = ['Broadcast', 'Digital', 'Media', 'Clubs', 'Data', 'Admin', 'Strategic'];
  var PRIORITIES = { p1: 'P1', p2: 'P2', p3: 'P3' };
  var STATUSES   = { open: 'Open', waiting: 'Waiting', closed: 'Closed' };

  var SESSION = null;
  var REQUESTS = {};        /* id → request */
  var CATEGORIES = DEFAULT_CATEGORIES.slice();
  var VIEW = 'queue';

  /* ── Boot ────────────────────────────────────────────────────────────── */

  window.TOOL = window.TOOL || {};
  window.TOOL.boot = function (session) {
    SESSION = session;

    NL.ensureAuth().then(function () {
      db.ref(PATH + '/requests').on('value', function (snap) {
        REQUESTS = snap.val() || {};
        render();
      });
      db.ref(PATH + '/config/categories').on('value', function (snap) {
        var v = snap.val();
        if (Array.isArray(v) && v.length) CATEGORIES = v;
        else if (v && typeof v === 'object') CATEGORIES = Object.values(v);
      });
    }).catch(function (e) {
      NL.toast(e.message, 'error');
    });

    document.getElementById('btnLog').addEventListener('click', function () {
      openForm(null);
    });

    document.getElementById('viewTabs').addEventListener('click', function (e) {
      var tab = e.target.closest('.tab');
      if (!tab) return;
      VIEW = tab.dataset.view;
      document.querySelectorAll('#viewTabs .tab').forEach(function (t) {
        t.classList.toggle('active', t === tab);
      });
      render();
    });
  };

  if (window._toolDeferredSession) {
    window.TOOL.boot(window._toolDeferredSession);
    delete window._toolDeferredSession;
  }

  /* ── Data helpers ────────────────────────────────────────────────────── */

  function all() {
    return Object.keys(REQUESTS).map(function (id) {
      var r = Object.assign({}, REQUESTS[id]);
      r._id = id;
      return r;
    });
  }

  function openList() {
    return all().filter(function (r) { return r.status !== 'closed'; })
      .sort(function (a, b) {
        if (a.priority !== b.priority) return a.priority < b.priority ? -1 : 1;
        return (a.dateRaised || '') < (b.dateRaised || '') ? -1 : 1;
      });
  }

  function closedList() {
    return all().filter(function (r) { return r.status === 'closed'; })
      .sort(function (a, b) { return (b.dateClosed || '') < (a.dateClosed || '') ? -1 : 1; });
  }

  function isAdmin() {
    return SESSION && (SESSION.level === 'admin' || SESSION.role === 'superadmin');
  }

  function todayISO() {
    var d = new Date();
    return d.getFullYear() + '-' +
      String(d.getMonth() + 1).padStart(2, '0') + '-' +
      String(d.getDate()).padStart(2, '0');
  }

  function uniqueValues(field) {
    var seen = {};
    all().forEach(function (r) {
      var v = (r[field] || '').trim();
      if (v) seen[v] = true;
    });
    return Object.keys(seen).sort();
  }

  /* ── Rendering ───────────────────────────────────────────────────────── */

  function render() {
    document.getElementById('viewQueue').hidden   = VIEW !== 'queue';
    document.getElementById('viewArchive').hidden = VIEW !== 'archive';
    document.getElementById('viewLoad').hidden    = VIEW !== 'load';
    if (VIEW === 'queue')   renderTable('viewQueue', openList(), false);
    if (VIEW === 'archive') renderTable('viewArchive', closedList(), true);
    if (VIEW === 'load')    renderLoad();
  }

  function pill(cls, label) {
    return '<span class="pill pill--' + cls + '">' + NL.escHtml(label) + '</span>';
  }

  function statusPill(r) {
    if (r.status === 'closed')  return pill('expired', 'Closed');
    if (r.status === 'waiting') return pill('pending', 'Waiting');
    return pill('approved', 'Open');
  }

  function renderTable(elId, rows, closed) {
    var el = document.getElementById(elId);

    if (!rows.length) {
      el.innerHTML =
        '<div class="empty-state">' +
          '<div class="empty-state__icon">' + (closed ? '🗄️' : '📥') + '</div>' +
          '<div class="empty-state__title">' + (closed ? 'Nothing closed yet' : 'Queue is empty') + '</div>' +
        '</div>';
      return;
    }

    var html = '<div class="table-wrap"><table class="table table--compact"><thead><tr>' +
      '<th>Priority</th><th>Requester</th><th>Channel</th><th>' + (closed ? 'Closed' : 'Raised') + '</th>' +
      '<th>Description</th><th>Category</th><th>Owner</th><th>Status</th>' +
      '</tr></thead><tbody>';

    rows.forEach(function (r) {
      html += '<tr class="queue-row" data-id="' + NL.escHtml(r._id) + '">' +
        '<td>' + pill(r.priority || 'p2', PRIORITIES[r.priority] || 'P2') + '</td>' +
        '<td>' + NL.escHtml(r.requester || '—') + '</td>' +
        '<td>' + NL.escHtml(r.channel || '—') + '</td>' +
        '<td>' + NL.escHtml(NL.formatDateShort(closed ? (r.dateClosed || r.dateRaised) : r.dateRaised) || '—') + '</td>' +
        '<td><span class="req-desc" title="' + NL.escHtml(r.description || '') + '">' + NL.escHtml(r.description || '—') + '</span></td>' +
        '<td>' + NL.escHtml(r.category || '—') + '</td>' +
        '<td>' + NL.escHtml(r.owner || '—') + '</td>' +
        '<td>' + statusPill(r) + '</td>' +
        '</tr>';
    });

    html += '</tbody></table></div>';
    el.innerHTML = html;

    el.querySelectorAll('.queue-row').forEach(function (tr) {
      tr.addEventListener('click', function () {
        var r = REQUESTS[tr.dataset.id];
        if (r) openForm(Object.assign({ _id: tr.dataset.id }, r));
      });
    });
  }

  function renderLoad() {
    var el = document.getElementById('viewLoad');
    var rows = all();
    var open = rows.filter(function (r) { return r.status !== 'closed'; });

    /* Group by requester and by channel */
    var byReq = {}, byChan = {};
    rows.forEach(function (r) {
      var k = (r.requester || 'Unknown').trim() || 'Unknown';
      byReq[k] = byReq[k] || { open: 0, closed: 0, last: '' };
      byReq[k][r.status === 'closed' ? 'closed' : 'open']++;
      if ((r.dateRaised || '') > byReq[k].last) byReq[k].last = r.dateRaised || '';
      var c = r.channel || 'Unknown';
      byChan[c] = (byChan[c] || 0) + 1;
    });

    var html =
      '<div class="stats">' +
        '<div class="stat"><div class="stat__num">' + open.length + '</div><div class="stat__label">Open</div></div>' +
        '<div class="stat"><div class="stat__num">' + open.filter(function (r) { return r.priority === 'p1'; }).length + '</div><div class="stat__label">P1 open</div></div>' +
        '<div class="stat"><div class="stat__num">' + (rows.length - open.length) + '</div><div class="stat__label">Closed</div></div>' +
        '<div class="stat"><div class="stat__num">' + rows.length + '</div><div class="stat__label">All time</div></div>' +
      '</div>';

    html += '<div class="summary-grid">';

    /* By requester */
    html += '<div><div class="section-head"><h2>By requester</h2></div>';
    var reqKeys = Object.keys(byReq).sort(function (a, b) {
      var ta = byReq[a].open + byReq[a].closed, tb = byReq[b].open + byReq[b].closed;
      return tb - ta;
    });
    if (!reqKeys.length) {
      html += '<div class="empty-state"><div class="empty-state__text">No requests logged.</div></div>';
    } else {
      html += '<div class="table-wrap"><table class="table table--compact"><thead><tr>' +
        '<th>Requester</th><th class="ta-right">Open</th><th class="ta-right">Closed</th><th class="ta-right">Total</th><th>Last raised</th>' +
        '</tr></thead><tbody>';
      reqKeys.forEach(function (k) {
        var s = byReq[k];
        html += '<tr><td>' + NL.escHtml(k) + '</td>' +
          '<td class="ta-right">' + s.open + '</td>' +
          '<td class="ta-right">' + s.closed + '</td>' +
          '<td class="ta-right">' + (s.open + s.closed) + '</td>' +
          '<td>' + NL.escHtml(NL.formatDateShort(s.last) || '—') + '</td></tr>';
      });
      html += '</tbody></table></div>';
    }
    html += '</div>';

    /* By channel + actions */
    html += '<div><div class="section-head"><h2>By channel</h2></div>';
    var chanKeys = Object.keys(byChan).sort(function (a, b) { return byChan[b] - byChan[a]; });
    if (chanKeys.length) {
      html += '<div class="table-wrap"><table class="table table--compact"><tbody>';
      chanKeys.forEach(function (c) {
        html += '<tr><td>' + NL.escHtml(c) + '</td><td class="ta-right">' + byChan[c] + '</td></tr>';
      });
      html += '</tbody></table></div>';
    }
    html += '<p style="margin-top:16px;">' +
      '<button class="btn btn--ghost btn--sm" id="btnExport">Export CSV</button>' +
      (isAdmin() ? ' <button class="btn btn--ghost btn--sm" id="btnCats">Edit categories</button>' : '') +
      '</p></div>';

    html += '</div>';
    el.innerHTML = html;

    var ex = document.getElementById('btnExport');
    if (ex) ex.addEventListener('click', exportCsv);
    var bc = document.getElementById('btnCats');
    if (bc) bc.addEventListener('click', openCategories);
  }

  /* ── Log / edit form ─────────────────────────────────────────────────── */

  function optionList(values, selected) {
    return values.map(function (v) {
      var val = typeof v === 'object' ? v.value : v;
      var lab = typeof v === 'object' ? v.label : v;
      return '<option value="' + NL.escHtml(val) + '"' + (val === selected ? ' selected' : '') + '>' +
        NL.escHtml(lab) + '</option>';
    }).join('');
  }

  function datalist(id, values) {
    return '<datalist id="' + id + '">' + values.map(function (v) {
      return '<option value="' + NL.escHtml(v) + '">';
    }).join('') + '</datalist>';
  }

  function openForm(existing) {
    var isEdit = !!existing;
    var r = existing || {
      requester: '', channel: 'Phone', dateRaised: todayISO(), description: '',
      category: CATEGORIES[0] || '', priority: 'p2',
      owner: (SESSION && SESSION.name) || '', status: 'open', dateClosed: ''
    };

    var cats = CATEGORIES.slice();
    if (r.category && cats.indexOf(r.category) === -1) cats.push(r.category);

    var body =
      '<div class="form-grid">' +
        '<div class="form-group"><label>Requester <span class="req">*</span></label>' +
          '<input id="fReq" list="dlReq" value="' + NL.escHtml(r.requester) + '" placeholder="Who asked">' +
          datalist('dlReq', uniqueValues('requester')) + '</div>' +
        '<div class="form-group"><label>Channel</label>' +
          '<select id="fChan">' + optionList(CHANNELS, r.channel) + '</select></div>' +
        '<div class="form-group"><label>Date raised</label>' +
          '<input id="fDate" type="date" value="' + NL.escHtml(r.dateRaised || '') + '"></div>' +
        '<div class="form-group"><label>Priority</label>' +
          '<select id="fPrio">' + optionList([
            { value: 'p1', label: 'P1 — urgent' },
            { value: 'p2', label: 'P2 — normal' },
            { value: 'p3', label: 'P3 — low' }
          ], r.priority) + '</select></div>' +
        '<div class="form-group span2"><label>Description <span class="req">*</span></label>' +
          '<textarea id="fDesc" rows="3">' + NL.escHtml(r.description) + '</textarea></div>' +
        '<div class="form-group"><label>Category</label>' +
          '<select id="fCat">' + optionList(cats, r.category) + '</select></div>' +
        '<div class="form-group"><label>Owner</label>' +
          '<input id="fOwner" list="dlOwner" value="' + NL.escHtml(r.owner) + '">' +
          datalist('dlOwner', uniqueValues('owner')) + '</div>' +
        (isEdit ?
          '<div class="form-group"><label>Status</label>' +
            '<select id="fStatus">' + optionList([
              { value: 'open', label: 'Open' },
              { value: 'waiting', label: 'Waiting' },
              { value: 'closed', label: 'Closed' }
            ], r.status) + '</select></div>' +
          '<div class="form-group"><label>Date closed</label>' +
            '<input id="fClosed" type="date" value="' + NL.escHtml(r.dateClosed || '') + '"></div>'
        : '') +
      '</div>';

    var buttons = [];
    if (isEdit && isAdmin()) {
      buttons.push({ label: 'Delete', className: 'btn--danger', onClick: function (ctrl) {
        NL.confirm('Delete this request?', { variant: 'danger', confirmText: 'Delete' })
          .then(function (yes) {
            if (!yes) return;
            NL.ensureAuth().then(function () {
              return db.ref(PATH + '/requests/' + existing._id).remove();
            }).then(function () {
              NL.toast('Deleted', 'success');
              ctrl.close();
            }).catch(function (e) { NL.toast(e.message, 'error'); });
          });
      } });
    }
    buttons.push({ label: 'Cancel', className: 'btn--ghost', onClick: function (c) { c.close(); } });
    buttons.push({ label: isEdit ? 'Save' : 'Log it', className: 'btn--primary', onClick: function (ctrl) {
      saveForm(ctrl, existing);
    } });

    NL.modal({
      title: isEdit ? 'Request' : 'Log request',
      body: body,
      footerSplit: isEdit && isAdmin(),
      buttons: buttons
    });
  }

  function saveForm(ctrl, existing) {
    function val(id) {
      var el = ctrl.el.querySelector('#' + id);
      return el ? el.value.trim() : '';
    }

    var data = {
      requester:  val('fReq'),
      channel:    val('fChan'),
      dateRaised: val('fDate') || todayISO(),
      description: val('fDesc'),
      category:   val('fCat'),
      priority:   val('fPrio') || 'p2',
      owner:      val('fOwner'),
      status:     existing ? (val('fStatus') || 'open') : 'open',
      dateClosed: existing ? val('fClosed') : '',
      updatedAt:  firebase.database.ServerValue.TIMESTAMP
    };

    if (!data.requester) { NL.toast('Requester is required', 'error'); return; }
    if (!data.description) { NL.toast('Description is required', 'error'); return; }

    /* Closing stamps today unless a date was given; reopening clears it. */
    if (data.status === 'closed' && !data.dateClosed) data.dateClosed = todayISO();
    if (data.status !== 'closed') data.dateClosed = '';

    NL.ensureAuth().then(function () {
      if (existing) {
        return db.ref(PATH + '/requests/' + existing._id).update(data);
      }
      data.createdBy = SESSION.uid;
      data.createdAt = firebase.database.ServerValue.TIMESTAMP;
      return db.ref(PATH + '/requests').push(data);
    }).then(function () {
      NL.toast(existing ? 'Saved' : 'Logged', 'success');
      ctrl.close();
    }).catch(function (e) {
      NL.toast(e.message, 'error');
    });
  }

  /* ── Categories ──────────────────────────────────────────────────────── */

  function openCategories() {
    var wrap = document.createElement('div');

    function redraw() {
      wrap.innerHTML = CATEGORIES.map(function (c, i) {
        return '<div class="cat-row"><span>' + NL.escHtml(c) + '</span>' +
          '<button class="btn btn--ghost btn--sm" data-i="' + i + '">Remove</button></div>';
      }).join('') || '<p class="confirm-text">No categories.</p>';
      wrap.querySelectorAll('button[data-i]').forEach(function (b) {
        b.addEventListener('click', function () {
          CATEGORIES.splice(Number(b.dataset.i), 1);
          persistCats();
          redraw();
        });
      });
    }
    redraw();

    NL.modal({
      title: 'Categories',
      size: 'sm',
      body: wrap,
      buttons: [
        { label: 'Add category', className: 'btn--ghost', onClick: function () {
          NL.prompt('Category name').then(function (v) {
            if (!v || !v.trim()) return;
            v = v.trim();
            if (CATEGORIES.indexOf(v) === -1) {
              CATEGORIES.push(v);
              persistCats();
            }
            redraw();
          });
        } },
        { label: 'Done', className: 'btn--primary', onClick: function (c) { c.close(); } }
      ]
    });
  }

  function persistCats() {
    NL.ensureAuth().then(function () {
      return db.ref(PATH + '/config/categories').set(CATEGORIES);
    }).catch(function (e) { NL.toast(e.message, 'error'); });
  }

  /* ── CSV export ──────────────────────────────────────────────────────── */

  function exportCsv() {
    var rows = [['Requester', 'Channel', 'Date raised', 'Description', 'Category', 'Priority', 'Owner', 'Status', 'Date closed']];
    all().sort(function (a, b) { return (a.dateRaised || '') < (b.dateRaised || '') ? -1 : 1; })
      .forEach(function (r) {
        rows.push([
          r.requester || '', r.channel || '', r.dateRaised || '', r.description || '',
          r.category || '', PRIORITIES[r.priority] || '', r.owner || '',
          STATUSES[r.status] || '', r.dateClosed || ''
        ]);
      });
    NL.download('intake-' + todayISO() + '.csv', NL.csv(rows), 'text/csv');
    NL.writeAudit('intake-csv-export', { count: rows.length - 1 });
  }

})();
</script>

</body>
</html>
