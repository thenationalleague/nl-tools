<!DOCTYPE html>
<!--
  NL Tools — {{TOOL_TITLE}}
  Version: v0.1 ({{TOOL_DATE}})
  File: /tools/{{TOOL_SLUG}}/index.html

  {{TOOL_DESCRIPTION}}

  Storage (RTDB):
    app-data/{{TOOL_KEY}}/...      tool-owned data
    tools/{{TOOL_KEY}}             tool registration (label, defaults)

  Access (resolved by auth-guard from tools/{{TOOL_KEY}}/defaults in
  the nl-tools RTDB — no hardcoded registry):
    role X + access Y → ...

  Brand canon (read BEFORE writing any CSS in this file):
    system/_template/BRAND_GUIDE.md   written rules
    /tools/style-guide/               live component preview
  Don't reinvent buttons, pills, tables, modals etc. — they exist as
  utility classes in /tools/system/nl-brand.css. Use them.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TOOL_TITLE}} — NL Tools</title>

  <!-- Brand stylesheet (lint canonical: ?v=14) -->
  <link rel="stylesheet" href="/tools/system/nl-brand.css?v=14">

  <!-- Firebase 10.12.0 SDK (compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

  <!-- Firebase init -->
  <script>
    firebase.initializeApp({
      apiKey:            "AIzaSyC3az3OMnU7TdqlaWp8yrO_EjgZ36l-mXU",
      authDomain:        "nl-tools.firebaseapp.com",
      databaseURL:       "https://nl-tools-default-rtdb.europe-west1.firebasedatabase.app",
      projectId:         "nl-tools",
      storageBucket:     "nl-tools.firebasestorage.app",
      messagingSenderId: "801354670005",
      appId:             "1:801354670005:web:05d8ebad3e7e63610d03fc"
    });
    var db = firebase.database();
  </script>

  <!-- Tool identity + changelog. Keep window.NL_TOOL and var NL_TOOL_KEY
       in sync — auth-guard reads NL_TOOL_KEY, nl-topbar reads window.NL_TOOL. -->
  <script>
    window.NL_TOOL = {
      title: '{{TOOL_TITLE}}',
      toolKey: '{{TOOL_KEY}}'
    };
    var NL_TOOL_KEY = '{{TOOL_KEY}}';

    window.NL_CHANGELOG = [
      {
        date: '{{TOOL_DATE}}',
        version: 'v0.1',
        items: [
          'Initial build.'
        ]
      }
    ];

    /* auth-guard fires this once the session is verified + pageWrap is
       revealed. Boot the main app from here so RTDB reads happen with a
       live auth token. Do NOT read RTDB before this fires. */
    window.nlAuthReady = function (userData) {
      window.NL = window.NL || {};
      window.NL.session = userData;
      if (window.TOOL && window.TOOL.boot) {
        window.TOOL.boot(userData);
      } else {
        window._toolDeferredSession = userData;
      }
    };
  </script>

  <!-- NL system scripts (lint canonical: ?v=7 / ?v=7 / ?v=8) -->
  <script src="/tools/system/nl-utils.js?v=7"></script>
  <script src="/tools/system/nl-topbar.js?v=7"></script>
  <script src="/tools/system/auth-guard.js?v=8"></script>

<style>
  /* #pageWrap default hide is in nl-brand.css; auth-guard reveals with
     style.display = 'block'. Don't clear with '' — would re-trigger the
     brand rule and re-hide the page. */

  /* Tool-specific styles go here. Before adding anything:
     1. Check /tools/style-guide/ — buttons, pills, tables, stats, tabs,
        modals, toasts, form panels, page headers, empty states are
        already utility classes. Use them, don't reimplement.
     2. For one-off needs, use TOKENS not hardcoded values:
        - sizes: var(--text-xs|sm|base|md|lg|xl)
        - colours: var(--primary|navy|text|text-muted|off-white|border…)
        - radii: var(--radius|radius-sm|radius-lg|radius-pill)
        - tracking: var(--tracking-tight|wide|wider)
        - elevation: var(--shadow)
     3. Scope every selector under #pageWrap (or your tool's root id) so
        styles can't leak to the host topbar etc.
     Rules in full: system/_template/BRAND_GUIDE.md */
</style>
</head>
<body>

<!-- Topbar — auto-rendered by /tools/system/nl-topbar.js from window.NL_TOOL -->
<div id="nlTopbar"></div>

<div id="pageWrap">
  <div class="page">

    <!-- Page content goes here. The whole pageWrap stays hidden until
         auth-guard reveals it, so you don't need to handle the
         not-yet-authed state in markup. -->

    <header style="margin-bottom:24px;">
      <h1 style="color:var(--navy);">{{TOOL_TITLE}}</h1>
      <p style="color:var(--text-muted);">{{TOOL_DESCRIPTION}}</p>
    </header>

    <section>
      <!-- ... -->
    </section>

  </div>
</div>

<!-- Main app -->
<script>
(function () {
  'use strict';

  /* Public boot entry point — called by nlAuthReady once the session is
     verified. Don't read RTDB before this fires. */
  window.TOOL = window.TOOL || {};
  window.TOOL.boot = function (session) {
    /* Example: wait for a live auth token before any RTDB read.
       NL.ensureAuth lives in nl-utils.js — use it for tools that boot
       async (e.g. fetch + render after auth). */
    if (!window.NL || !NL.ensureAuth) {
      console.warn('[{{TOOL_SLUG}}] NL.ensureAuth missing — check nl-utils.js is loaded');
    }
    /* NL.ensureAuth().then(function () { ... read RTDB here ... }); */

    /* For now just confirm we booted: */
    console.log('[{{TOOL_SLUG}}] booted with session', session);
  };

  /* If auth-guard fired before this script loaded, replay the session. */
  if (window._toolDeferredSession) {
    window.TOOL.boot(window._toolDeferredSession);
    delete window._toolDeferredSession;
  }
})();
</script>

</body>
</html>
