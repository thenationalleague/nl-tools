<!-- ============================================================
     CLUB DIRECTORY — embeddable widget for thenationalleague.org.uk
     Source of truth. Copy/paste into the CMS custom HTML block, or
     use the hosted bundle (embeds/club-directory.js).

     What it is
     ----------
     A crest grid of every club in one division, each card linking out
     to that club's own website. No auth, no Firebase, no SSO — this
     is the one embed in the family that is genuinely static, so it
     paints on first frame and has nothing to sign into.

     Division
     --------
     Defaults to the National division (24 clubs). The host page can
     ask for another by putting the division name on the marker div:
       <div data-nl-clubs="North"></div>
     …or, when the HTML is pasted directly, on the root element's
     data-division attribute. Accepted: National / North / South.

     Data
     ----
     Seeded inline with the current season's clubs so the grid is
     never empty and never waits on a network round trip, then
     upgraded in place from the canonical assets/data/clubs-meta.json
     the moment it lands. That means promotion and relegation are
     picked up automatically each summer — the CMS block does not get
     re-pasted for a season change. If the fetch fails, the seed is
     what the fan sees, which is the previous season's line-up rather
     than an empty box.

     Design
     ------
     Every card carries its club's own colour, chosen from clubs-meta
     (first colour that is not white), as a rule under the crest and
     as the hover fill, with the label ink flipped off that colour's
     luminance using the same pickTextColor threshold as the score
     predictor's hero card. Column count steps on CONTAINER width, not
     viewport width — an embed does not own the viewport, and the same
     block sits in a full-bleed page and a narrow content column.

     Changelog:
       04/08/2026  v1.2  The "24 clubs · 2026-27 season" strip goes — the
                         page it sits on already says which division and
                         which season this is, and a count of what is
                         directly below it is not information. Every card
                         now reserves two lines for the club name whether
                         it needs them or not: a two-line name made its
                         card taller, which the grid absorbed by squeezing
                         that card's crest well, so badges in the same row
                         sat at different heights.
       04/08/2026  v1.1  North and South seeded too, so all three divisions
                         paint on the first frame rather than only National.
       04/08/2026  v1.0  First build. 24 National clubs, crest grid,
                         club-coloured cards linking to club websites.
     ============================================================ -->

<div id="nlClubs" data-division="National">
  <ul class="nlcd__grid" id="nlcd-grid"></ul>
</div>

<style>
  /* Carbona Variable */
  @font-face {
    font-family: "carbona-variable";
    src: url("https://use.typekit.net/af/184cf2/0000000000000000774c3175/31/l?primer=7cdcb44be4a7db8877ffa5c0007b8dd865b3bbc383831fe2ea177f62257a9191&fvd=n4&v=3") format("woff2"),
         url("https://use.typekit.net/af/184cf2/0000000000000000774c3175/31/d?primer=7cdcb44be4a7db8877ffa5c0007b8dd865b3bbc383831fe2ea177f62257a9191&fvd=n4&v=3") format("woff");
    font-display: swap; font-style: normal; font-weight: 200 900; font-stretch: normal;
  }

  #nlClubs {
    /* Values mirror the NL canon (system/nl-brand.css) — embeds can't load
       the portal stylesheet, so the tokens are inlined verbatim. */
    --primary:#9e0000; --primary-600:#7e0000;
    --navy:#223b7c;
    --white:#ffffff; --off-white:#f4f6f9;
    --text:#1a2a44; --text-muted:#5a6a82;
    --border:#dde3ed;
    --radius:6px;

    font-family:'carbona-variable','carbona',sans-serif;
    font-size:15px; line-height:1.45;
    font-variation-settings:'wght' 400;
    color:var(--text); -webkit-font-smoothing:antialiased;
    max-width:1180px; margin:24px auto; padding:0 12px;

    /* The grid steps on the width of THIS block, not the window — the same
       embed has to work full-bleed and inside a narrow article column. */
    container-type:inline-size;
  }
  #nlClubs, #nlClubs *, #nlClubs *::before, #nlClubs *::after { box-sizing:border-box; }

  /* Grid ------------------------------------------------------------- */
  /* Two columns is the floor and the no-container-query fallback; 24 clubs
     divide evenly by 2, 3 and 4, so no row is ever left with one orphan. */
  #nlClubs .nlcd__grid {
    list-style:none; margin:0; padding:0;
    display:grid; gap:14px;
    grid-template-columns:repeat(2, minmax(0, 1fr));
  }
  @container (min-width: 560px) {
    #nlClubs .nlcd__grid { grid-template-columns:repeat(3, minmax(0, 1fr)); }
  }
  @container (min-width: 860px) {
    #nlClubs .nlcd__grid { gap:18px; grid-template-columns:repeat(4, minmax(0, 1fr)); }
  }

  /* Card ------------------------------------------------------------- */
  #nlClubs .nlcd__card {
    --club:var(--navy); --club-ink:var(--white);
    display:flex; flex-direction:column;
    height:100%;
    background:var(--white);
    border:1px solid var(--border); border-radius:var(--radius);
    overflow:hidden; text-decoration:none; color:inherit;
    transition:transform .16s ease, box-shadow .16s ease, border-color .16s ease;
  }
  #nlClubs .nlcd__card:hover,
  #nlClubs .nlcd__card:focus-visible {
    transform:translateY(-3px);
    border-color:var(--club);
    box-shadow:0 8px 22px rgba(10,22,40,.14);
  }
  #nlClubs .nlcd__card:focus-visible {
    outline:3px solid var(--primary); outline-offset:2px;
  }

  /* Crest well — a whisper of the club's colour behind the badge so a card
     reads as that club before the name is even legible. */
  /* flex:none + min-height:0 are what actually hold the square. Without them
     a flex item's automatic minimum is its content's min-content height, and
     for a portrait crest (Barrow is 207x256) that is taller than the width —
     so the well quietly grew past 1:1, took the row's slack that margin-top:
     auto was supposed to absorb, and left badges in the same row sitting at
     different heights. */
  #nlClubs .nlcd__crest {
    position:relative; flex:none; min-height:0;
    display:flex; align-items:center; justify-content:center;
    aspect-ratio:1 / 1; padding:16%;
    background:radial-gradient(circle at 50% 46%,
      color-mix(in srgb, var(--club) 10%, var(--white)) 0%,
      var(--white) 74%);
  }
  /* Fills the well and letterboxes inside it, so a portrait crest and a
     round one occupy the same box and land on the same centre line. */
  #nlClubs .nlcd__crest img {
    width:100%; height:100%; min-height:0;
    object-fit:contain; display:block;
    transition:transform .16s ease;
  }
  #nlClubs .nlcd__card:hover .nlcd__crest img,
  #nlClubs .nlcd__card:focus-visible .nlcd__crest img { transform:scale(1.05); }

  /* Fallback when a crest PNG is missing — the club's three-letter code in
     its own colour, rather than a broken-image glyph. */
  #nlClubs .nlcd__code {
    font-size:26px; letter-spacing:.04em;
    font-weight:900; font-variation-settings:'wght' 900;
    color:var(--club);
  }

  /* Label ------------------------------------------------------------ */
  #nlClubs .nlcd__foot {
    margin-top:auto;
    display:flex; align-items:center; gap:8px;
    padding:10px 12px 11px;
    border-top:3px solid var(--club);
    background:var(--white);
    transition:background-color .16s ease, color .16s ease;
  }
  #nlClubs .nlcd__card:hover .nlcd__foot,
  #nlClubs .nlcd__card:focus-visible .nlcd__foot {
    background:var(--club); color:var(--club-ink);
  }
  /* The two reserved name lines are held here rather than on the name
     itself, so a one-line club banks the spare line UNDER its nickname
     instead of opening a gap between name and nickname. Two name lines
     (17.5px each) + the nickname (16px) + its 2px offset. */
  #nlClubs .nlcd__names { min-width:0; flex:1; min-height:53px; }
  /* Two lines is the ceiling as well as the reserve — a third line would
     make one card taller than the rest of its row all over again, so a long
     name clamps instead of growing. Nothing in the three divisions actually
     reaches it at any width. */
  #nlClubs .nlcd__name {
    display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2;
    overflow:hidden;
    font-size:14px; line-height:1.25;
    font-weight:800; font-variation-settings:'wght' 800;
    overflow-wrap:break-word;
  }
  #nlClubs .nlcd__nick {
    display:block; margin-top:2px;
    font-size:11px; letter-spacing:.05em; text-transform:uppercase;
    font-weight:700; font-variation-settings:'wght' 700;
    color:var(--text-muted);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    transition:color .16s ease;
  }
  #nlClubs .nlcd__card:hover .nlcd__nick,
  #nlClubs .nlcd__card:focus-visible .nlcd__nick { color:inherit; }

  #nlClubs .nlcd__arrow {
    flex:none; width:15px; height:15px;
    opacity:.4; transition:opacity .16s ease, transform .16s ease;
  }
  #nlClubs .nlcd__card:hover .nlcd__arrow,
  #nlClubs .nlcd__card:focus-visible .nlcd__arrow {
    opacity:1; transform:translate(2px, -2px);
  }

  @media (prefers-reduced-motion: reduce) {
    #nlClubs .nlcd__card,
    #nlClubs .nlcd__crest img,
    #nlClubs .nlcd__foot,
    #nlClubs .nlcd__arrow { transition:none; }
    #nlClubs .nlcd__card:hover,
    #nlClubs .nlcd__card:focus-visible { transform:none; }
    #nlClubs .nlcd__card:hover .nlcd__crest img,
    #nlClubs .nlcd__card:focus-visible .nlcd__crest img { transform:none; }
    #nlClubs .nlcd__card:hover .nlcd__arrow,
    #nlClubs .nlcd__card:focus-visible .nlcd__arrow { transform:none; }
  }

  #nlClubs .nlcd__empty {
    grid-column:1 / -1;
    padding:32px 16px; text-align:center;
    background:var(--white); border:1px solid var(--border); border-radius:var(--radius);
    color:var(--text-muted); font-size:14px;
    font-weight:600; font-variation-settings:'wght' 600;
  }

  @container (max-width: 460px) {
    #nlClubs .nlcd__crest { padding:13%; }
    #nlClubs .nlcd__name { font-size:13px; }
    #nlClubs .nlcd__names { min-height:50px; }   /* 13px name lines */
    /* The arrow is a hover affordance and there is no hover on a phone, so
       at this width it is only costing the name 23px — which is the
       difference between "Hampton & Richmond Borough" fitting on two lines
       and being clipped on the third. */
    #nlClubs .nlcd__arrow { display:none; }
  }
</style>

<script>
(function () {

  if (!root) return;

  var META_URL  = REPO + 'assets/data/clubs-meta.json';

  // Seed — the current season's line-up for all three divisions, so the grid

  // clubs-meta.json; the live file overwrites it the moment it lands.

  var SEED_SEASON = '2026';

      ["Hebburn Town","HEB","The Hornets","hebburntownfc.com","#FFD500","#000000","#000000"],

      ["King's Lynn Town","KLT","The Linnets","kltown.co.uk","#4C6FA8","#EBB82E","#FFFFFF"],

      ["Merthyr Town","MER","The Martyrs","merthyrtownfc.co.uk","#FFFFFF","#000000","#000000"],

      ["Oxford City","OXC","The Hoops","oxfordcityfc.co.uk","#FFFFFF","#031C43","#000000"],

      ["Scarborough Athletic","SCA","The Seadogs","scarboroughathletic.com","#E21C34","#FFFFFF","#FFFFFF"],
      ["South Shields","SSH","The Mariners","southshieldsfc.co.uk","#8E1D41","#81C4DD","#FFFFFF"],
      ["Southport","SPT","The Sandgrounders","southportfc.net","#F3AE1C","#000000","#000000"],

      ["Worksop Town","WRK","The Tigers","worksoptownfc.co.uk","#272123","#FFDE17","#FFFFFF"]
    ],
    South: [
      ["AFC Totton","TOT","The Stags","afctotton.com","#0B5EAC","#FFFFFF","#FFFFFF"],
      ["Billericay Town","BIL","The Blues","billericaytownfc.co.uk","#0042FF","#FFFFFF","#FFFFFF"],

      ["Chesham United","CHU","The Generals","cheshamunited.co.uk","#970045","#81C4DD","#FFFFFF"],
      ["Dagenham & Redbridge","DAG","The Daggers","daggers.co.uk","#E3010B","#181852","#FFFFFF"],
      ["Dorking Wanderers","DOR","Wanderers","dorkingwanderers.com","#F20E14","#FFFFFF","#FFFFFF"],
      ["Dover Athletic","DOV","The Whites","doverathletic.com","#FFFFFF","#000000","#000000"],
      ["Ebbsfleet United","EBB","The Fleet","ebbsfleetunited.co.uk","#F20E14","#FFFFFF","#FFFFFF"],
      ["Farnborough","FAB","Boro","farnboroughfc.co.uk","#EBD10A","#06207D","#000000"],
      ["Farnham Town","FHT","Town","farnhamtownfc.co.uk","#50052B","#12B4E7","#FFFFFF"],
      ["Folkestone Invicta","FOL","The Seasiders","folkestoneinvictafc.co.uk","#FA8D1F","#000000","#000000"],
      ["Hampton & Richmond Borough","HRB","The Beavers","hamrichfc.com","#051736","#AD0000","#FFFFFF"],
      ["Hemel Hempstead Town","HHT","The Tudors","hemelfc.com","#F11717","#FFFFFF","#FFFFFF"],
      ["Horsham","HRS","The Hornets","horshamfc.co.uk","#007B3B","#FFBF00","#FFFFFF"],
      ["Maidenhead United","MHU","The Magpies","maidenheadunitedfc.org","#000000","#FFFFFF","#FFFFFF"],
      ["Maidstone United","MSU","The Stones","maidstoneunited.co.uk","#F0A500","#000000","#000000"],
      ["Salisbury","SAL","The Whites","salisburyfc.co.uk","#FFFFFF","#000000","#000000"],
      ["Slough Town","SLO","The Rebels","sloughtownfc.net","#FC9E0A","#071546","#000000"],
      ["Tonbridge Angels","TON","The Angels","tonbridgeangels.co.uk","#1A2DA3","#FFFFFF","#FFFFFF"],
      ["Torquay United","TOR","The Gulls","torquayunited.com","#F3DC21","#142849","#000000"],
      ["Truro City","TRU","The Tinners","trurocity.co.uk","#C13136","#FFFFFF","#FFFFFF"],
      ["Walton & Hersham","WAH","The Swans","waltonhershamfc.com","#FF0000","#FFFFFF","#FFFFFF"],
      ["Weston-super-Mare","WSM","The Seagulls","wsmafc.co.uk","#FFFFFF","#000000","#000000"]
    ]
  };

  // The marker div on the host page wins, so one hosted bundle serves all
  // three divisions without the CMS block carrying any markup of its own.
  var host = root.parentNode && root.parentNode.closest
    ? root.parentNode.closest('[data-nl-clubs]') : null;
  var division = (host && host.getAttribute('data-nl-clubs'))
    || root.getAttribute('data-division') || 'National';
  division = String(division).trim() || 'National';

  var grid = document.getElementById('nlcd-grid');

  /* ---------- helpers ---------- */

  function escHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function isHex(h) { return /^#[0-9a-fA-F]{6}$/.test(String(h || '')); }

  // Gamma-encoded luminance, same measure and threshold the score predictor
  // uses on its hero panels — keep the family consistent.
  function lum(hex) {
    var c = String(hex).replace('#', '');
    var r = parseInt(c.slice(0, 2), 16),
        g = parseInt(c.slice(2, 4), 16),
        b = parseInt(c.slice(4, 6), 16);
    return (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255;
  }
  function pickTextColor(hex) {
    return isHex(hex) && lum(hex) > 0.68 ? '#1a2a44' : '#ffffff';
  }

  // First colour that isn't effectively white. White-on-white would erase the
  // rule and the hover fill, so a white-primary club (Fylde, Barrow, Gateshead)
  // falls through to its second colour. Navy only if a club has nothing usable.
  function accentFor(colors) {
    var order = [colors.primary, colors.secondary, colors.tertiary];
    for (var i = 0; i < order.length; i++) {
      if (isHex(order[i]) && lum(order[i]) <= 0.93) return order[i];
    }
    return '#223b7c';
  }

  function siteUrl(domain) {
    var d = String(domain || '').trim().replace(/^https?:\/\//i, '').replace(/\/+$/, '');
    return d ? 'https://' + d : '';
  }

  function crestUrl(base, name) { return base + encodeURIComponent(name) + '.png'; }

  /* ---------- render ---------- */

  function cardHTML(c) {
    var accent = accentFor(c.colors || {});
    var url    = siteUrl(c.domain);
    var label  = c.name + (url ? ' — visit ' + url.replace(/^https:\/\//, '') : '');
    var tag    = url ? 'a' : 'span';
    var attrs  = url
      ? ' href="' + escHtml(url) + '" target="_blank" rel="noopener noreferrer"'
      : '';

    return '<li>' +
      '<' + tag + ' class="nlcd__card"' + attrs +
        ' style="--club:' + accent + ';--club-ink:' + pickTextColor(accent) + '"' +
        ' aria-label="' + escHtml(label) + '">' +
        '<span class="nlcd__crest">' +
          '<img src="' + escHtml(crestUrl(CREST_URL, c.name)) + '"' +
              ' alt="' + escHtml(c.name) + ' crest" loading="lazy" decoding="async"' +
              ' data-full="' + escHtml(crestUrl(CREST_FULL, c.name)) + '"' +
              ' data-code="' + escHtml(c.code || '') + '">' +
        '</span>' +
        '<span class="nlcd__foot">' +
          '<span class="nlcd__names">' +
            '<span class="nlcd__name">' + escHtml(c.name) + '</span>' +
            (c.nickname ? '<span class="nlcd__nick">' + escHtml(c.nickname) + '</span>' : '') +
          '</span>' +
          (url ? '<svg class="nlcd__arrow" viewBox="0 0 16 16" fill="none" aria-hidden="true">' +
                   '<path d="M4.5 11.5 11.5 4.5M5.5 4.5h6v6" stroke="currentColor"' +
                   ' stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>' +
                 '</svg>' : '') +
        '</span>' +
      '</' + tag + '>' +
    '</li>';
  }

  // Two-step crest fallback: 256px tier, then the full-res original, then the
  // club's code. Each step clears its own handler so a missing file can't
  // spin the browser through a retry loop.
  function wireCrests() {
    Array.prototype.forEach.call(grid.querySelectorAll('.nlcd__crest img'), function (img) {
      img.addEventListener('error', function () {
        var full = img.getAttribute('data-full');
        if (full && img.src !== full) { img.src = full; return; }
        var code = img.getAttribute('data-code') || '';
        var span = document.createElement('span');
        span.className = 'nlcd__code';
        span.textContent = code;
        if (img.parentNode) img.parentNode.replaceChild(span, img);
      });
    });
  }

  function render(clubs) {
    if (!clubs.length) return;
    clubs = clubs.slice().sort(function (a, b) { return a.name.localeCompare(b.name); });
    grid.innerHTML = clubs.map(cardHTML).join('');
    wireCrests();
  }

  // An unrecognised division seeds nothing and waits for clubs-meta, rather
  // than flashing some other division's clubs — a wrong list that then swaps
  // is worse than a moment of nothing.
  function fromSeed() {
    return (SEED[division] || []).map(function (r) {
      return {
        name: r[0], code: r[1], nickname: r[2], domain: r[3],
        colors: { primary: r[4], secondary: r[5], tertiary: r[6] }
      };
    });
  }

  /* ---------- boot ---------- */

  render(fromSeed());

  // Upgrade from the canonical file. Promotion and relegation land here on
  // their own — the CMS block is never re-pasted for a season rollover.
  fetch(META_URL, { cache: 'no-cache' })
    .then(function (r) {
      if (!r.ok) throw new Error('clubs-meta ' + r.status);
      return r.json();
    })
    .then(function (meta) {
      var season = (meta.seasons && meta.seasons.current) || SEED_SEASON;
      var live = (meta.clubs || []).filter(function (c) {
        return c && c.seasons && c.seasons[season] === division;
      });
      if (live.length) render(live);
    })
    .catch(function (e) {
      if (window.console && console.warn) {
        console.warn('[NL Club Directory] clubs-meta unavailable.', e);
      }
      // Seeded divisions still have their grid; an unseeded one has nothing,
      // and an empty box with no explanation reads as a broken page.
      if (!grid.children.length) {
        grid.innerHTML = '<li class="nlcd__empty">Club list unavailable right now. ' +
          'Please try again shortly.</li>';
      }
    });
})();
</script>
