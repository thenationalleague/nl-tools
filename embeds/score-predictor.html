<!-- ============================================================
     SCORE PREDICTOR — embeddable widget for thenationalleague.org.uk
     Source of truth. Copy/paste into the CMS custom HTML block.

     - JWT identity from _gc_sa_sso_access (sso.sportsalliance.com)
     - One-time team registration (immutable team lock)
     - RTDB (shared nl-widgets project, named Firebase app):
         users/{jwtId}   — teamId/teamName/crestUrl/forename/surnameInitial only
         predictions/{jwtId}/{matchday}/{matchId}
     - Per-row KO lock hardens inputs into numbers
     - No points, no multipliers, no prizes. Counting model:
         primary   = correct results (W/D/L)
         tiebreak  = exact scorelines
     - Own club's fixture renders as a showcase hero card at the top:
       canon navy strip, then the matchup split into two panels in each
       club's own colours from clubs-meta.json (soft — other fixtures
       always available below, boxed by kick-off time with one
       "Predictions lock in…" countdown per KO group)
     - Predictions open 168h before KO, lock 60min before KO; KOs
       beyond the window are hidden ("opens on" card instead)
     - Scores set with − / + steppers only (0–9), no free text.
       Submit is WYSIWYG: every open match goes in at its displayed
       value (untouched 0–0s called out in a confirm first), so 0–0
       is a first-class pick
     - Per-side W/D/L letter boxes on every open pick: grey D at 0–0,
       green W / red L as the scoreline moves
     - Leaderboard: cumulative, filterable by month + supported club;
       names shown as forename + surname initial
     - Club v club table: accuracy % (correct results ÷ settled
       predictions), min 20 settled predictions to rank
     - All colours mirror NL canon (nl-brand.css values inlined);
       header is navy with the division wide lockup + club crest

     Sim controls:
       (no param)        → real clock, sim bar hidden (production)
       ?sim=bar          → sim bar visible, live clock
       ?sim=<datetime>   → sim bar visible, frozen at that moment
       ?sim=off          → real clock, bar hidden (explicit form)

     Changelog:
       02/08/2026  v2.4  W/D/L text pill replaced with fixed-width
                         per-side letter boxes (grey D → green W /
                         red L) on team lines + hero panels — rows no
                         longer widen when a pick is set.
       02/08/2026  v2.3  0–0 confirm softened: fires only when EVERY
                         submitted fixture is an untouched 0–0 (and
                         there's more than one) — partial submits with
                         some deliberate 0–0s go through silently.
       02/08/2026  v2.2  Hero split into home/away club-colour panels
                         under a canon navy strip; scores in white
                         drop-shadowed windows; W/D/L chips on set
                         picks; KO time is the group header only
                         ("15:00 kick-offs", singular when one) with
                         per-row KO eyebrows removed; "Predictions
                         lock in…" wording everywhere; WYSIWYG submit
                         makes 0–0 a first-class pick (untouched rows
                         confirmed before writing); leaderboard gets
                         labelled Results / Exact / Games columns and
                         loses the explainer waffle.
       02/08/2026  v2.1  NL canon sweep (no gold, ladder hovers, canon
                         focus ring, accent-live pulse); navy header with
                         division wide lockup + club crest (Enterprise
                         logo/green removed — the lockup carries the
                         sponsor); club-colour hero showcase card;
                         KO-time group boxes with per-KO countdown;
                         60min pre-KO lock; steppers replace free-text
                         inputs (0–9); future KOs hidden; matchPeriod
                         now authoritative for post/live; NLS refetch
                         every 2min while play is in flight; seasonID
                         derived from clubs-meta; registration eyebrow
                         removed, display name bolded.
       02/08/2026  v2.0  Rollout model — counting leaderboard (results
                         first, exacts tiebreak), month + club filters,
                         club accuracy table, hero own-club card,
                         removed ×3 multiplier + joker remnants,
                         stopped writing email to RTDB, sim bar now
                         opt-in via ?sim.

     Scoped under #nlPredictor; BEM .nlsp__ prefix; Carbona inline;
     no external <script src> tags (CMS strips them).
     ============================================================ -->

<div id="nlPredictor">
  <div class="nlsp__sponsor" id="nlsp-sponsor"></div>
  <div class="nlsp__banner" id="nlsp-banner" hidden>Loading predictor…</div>
  <div class="nlsp__screen" id="nlsp-register" hidden></div>
  <div class="nlsp__screen" id="nlsp-main" hidden>
    <div id="nlsp-datebar"></div>
    <div id="nlsp-hero"></div>
    <div id="nlsp-statusbar"></div>
    <div id="nlsp-fixtures"></div>
    <div id="nlsp-submitbar"></div>
    <div id="nlsp-reset"></div>
    <div id="nlsp-table"></div>
    <div id="nlsp-clubtable"></div>
  </div>
  <div class="nlsp__gate" id="nlsp-gate"></div>
  <div id="nlsp-sim"></div>
  <div class="nlsp__modal" id="nlsp-modal" hidden></div>
</div>

<style>
  /* Carbona Variable */
  @font-face {
    font-family: "carbona-variable";
    src: url("https://use.typekit.net/af/184cf2/0000000000000000774c3175/31/l?primer=7cdcb44be4a7db8877ffa5c0007b8dd865b3bbc383831fe2ea177f62257a9191&fvd=n4&v=3") format("woff2"),
         url("https://use.typekit.net/af/184cf2/0000000000000000774c3175/31/d?primer=7cdcb44be4a7db8877ffa5c0007b8dd865b3bbc383831fe2ea177f62257a9191&fvd=n4&v=3") format("woff");
    font-display: swap; font-style: normal; font-weight: 200 900; font-stretch: normal;
  }

  #nlPredictor {
    /* Values mirror the NL canon (system/nl-brand.css) — embeds can't load
       the portal stylesheet, so the tokens are inlined verbatim. Ladder
       stops are the canonical "lighter/darker"; no gold, no rgba overlays. */
    --primary:#9e0000; --primary-50:#fcf4f2; --primary-300:#dfa197;
    --primary-600:#7e0000; --primary-700:#600000;
    --navy:#223b7c; --navy-600:#192e63;
    --red:#d4380d; --red-light:#fff1ec;
    --green:#1a7030; --green-light:#edf7ee;
    --amber:#c96f15; --amber-light:#fef6ec;
    --accent-live:#4ade80;
    --white:#ffffff; --off-white:#f4f6f9;
    --text:#1a2a44; --text-muted:#5a6a82;
    --border:#dde3ed;
    --radius:6px;
    --shadow:0 2px 12px rgba(10,22,40,.10);
    --focus-ring:0 0 0 3px color-mix(in srgb, var(--primary) 18%, transparent);

    font-family:'carbona-variable','carbona',sans-serif;
    font-size:15px; line-height:1.45;
    font-variation-settings:'wght' 400;
    color:var(--text); -webkit-font-smoothing:antialiased;
    max-width:680px; margin:24px auto; padding:0 12px;
  }
  #nlPredictor, #nlPredictor *, #nlPredictor *::before, #nlPredictor *::after { box-sizing:border-box; }

  /* Banner */
  #nlPredictor .nlsp__banner {
    background:var(--amber-light); border:1px solid var(--amber); color:var(--amber);
    padding:8px 12px; border-radius:var(--radius); font-size:13px; margin-bottom:14px;
    font-variation-settings:'wght' 600;
  }
  #nlPredictor .nlsp__banner.is-err { background:var(--red-light);   border-color:var(--red);   color:var(--red); }
  #nlPredictor .nlsp__banner.is-ok  { background:var(--green-light); border-color:var(--green); color:var(--green); }

  /* Gate card — covers loading + signed-out, replaces the previous overlay/blur approach */
  #nlPredictor .nlsp__gate {
    padding:48px 16px;
    display:flex; justify-content:center;
  }
  #nlPredictor .nlsp__gate-card {
    background:var(--white); border:1px solid var(--border); border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:28px 28px 24px;
    max-width:380px; width:100%;
    text-align:center;
  }
  #nlPredictor .nlsp__gate-card img.nlsp__gate-mark {
    height:56px; width:auto; display:block; margin:0 auto 18px;
    max-width:200px; object-fit:contain;
  }
  #nlPredictor .nlsp__gate-card h2 {
    margin:0 0 6px;
    font-size:20px; font-weight:900; font-variation-settings:'wght' 900;
    color:var(--text);
  }
  #nlPredictor .nlsp__gate-card p {
    margin:0 0 18px;
    color:var(--text-muted); font-size:14px;
    font-weight:500; font-variation-settings:'wght' 500;
  }
  #nlPredictor .nlsp__gate-card .nlsp__btn { width:100%; padding:12px 22px; }
  #nlPredictor .nlsp__gate-spinner {
    width:22px; height:22px; margin:0 auto 12px;
    border:2px solid var(--border); border-top-color:var(--primary);
    border-radius:50%;
    animation:nlsp-spin .8s linear infinite;
  }
  @keyframes nlsp-spin { to { transform:rotate(360deg); } }

  /* Header — division wide lockup (left), title (centred), club crest (right).
     NL canon: navy surface, white text, brand-red hairline. The wide lockup
     carries its own white rounded card, so it sits straight on the navy. */
  #nlPredictor .nlsp__sponsor {
    display:grid; grid-template-columns:1fr auto 1fr; align-items:center;
    background:var(--navy); color:var(--white);
    padding:12px 16px; border-radius:var(--radius) var(--radius) 0 0;
    border-bottom:2px solid var(--primary);
    gap:12px; min-height:54px;
  }
  #nlPredictor .nlsp__sponsor-left  { display:flex; align-items:center; gap:10px; justify-self:start; }
  #nlPredictor .nlsp__sponsor-right { display:flex; align-items:center; gap:8px;  justify-self:end; }
  #nlPredictor .nlsp__sponsor img.nlsp__sponsor-wide {
    height:34px; width:auto; display:block; object-fit:contain;
  }
  #nlPredictor .nlsp__sponsor img.nlsp__sponsor-team {
    height:30px; width:30px; display:block; object-fit:contain;
    background:var(--white); border-radius:4px; padding:1px;
  }
  #nlPredictor .nlsp__sponsor .nlsp__sponsor-title {
    font-size:15px; color:var(--white);
    text-transform:uppercase; letter-spacing:1.5px;
    font-weight:900; font-variation-settings:'wght' 900;
    line-height:1;
    text-align:center;
    justify-self:center;
  }
  @media (max-width:520px) {
    #nlPredictor .nlsp__sponsor {
      padding:10px 12px; min-height:48px;
      grid-template-columns:1fr auto 1fr;
      gap:8px;
    }
    #nlPredictor .nlsp__sponsor img.nlsp__sponsor-wide { height:26px; }
    #nlPredictor .nlsp__sponsor img.nlsp__sponsor-team { height:24px; width:24px; }
    #nlPredictor .nlsp__sponsor .nlsp__sponsor-title { font-size:11px; letter-spacing:1px; }
  }

  /* Date selector — horizontally scrollable strip of matchday pills.
     Click-drag enabled on desktop via JS (enableDragScroll). */
  #nlPredictor .nlsp__datebar {
    display:flex; gap:6px;
    padding:14px 2px 8px;
    overflow-x:auto; overflow-y:hidden;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
    cursor:grab;
    user-select:none;
  }
  #nlPredictor .nlsp__datebar.is-dragging { cursor:grabbing; }
  #nlPredictor .nlsp__datebar.is-dragging button { pointer-events:none; }
  #nlPredictor .nlsp__datebar::-webkit-scrollbar { display:none; }
  #nlPredictor .nlsp__datebar button {
    flex:none;
    font-family:inherit; font-size:11px;
    text-transform:uppercase; letter-spacing:1px;
    padding:7px 12px; border-radius:999px; cursor:pointer;
    background:var(--white); color:var(--text-muted);
    border:1px solid var(--border);
    font-weight:800; font-variation-settings:'wght' 800;
    white-space:nowrap;
    transition:all .15s ease;
  }
  #nlPredictor .nlsp__datebar button:hover {
    color:var(--primary); border-color:var(--primary);
  }
  #nlPredictor .nlsp__datebar button.is-active {
    background:var(--text); color:var(--white); border-color:var(--text);
  }
  #nlPredictor .nlsp__datebar button.is-today {
    border-color:var(--primary);
  }

  /* Hero — compressed: greeting ribbon + date */
  #nlPredictor .nlsp__hero { padding:10px 0 8px; }
  #nlPredictor .nlsp__hero .nlsp__greetline {
    font-size:11px; text-transform:uppercase; letter-spacing:1.5px;
    color:var(--text-muted);
    font-weight:800; font-variation-settings:'wght' 800;
    margin-bottom:6px;
  }
  #nlPredictor .nlsp__hero h1 {
    font-size:24px; line-height:1.15; margin:0;
    font-weight:900; font-variation-settings:'wght' 900;
  }

  /* Status bar — single thin line above fixtures */
  #nlPredictor .nlsp__status {
    display:flex; justify-content:space-between; align-items:baseline;
    padding:6px 2px; margin-bottom:8px;
    font-size:12px; color:var(--text-muted);
    font-weight:700; font-variation-settings:'wght' 700;
    text-transform:uppercase; letter-spacing:1px;
    border-bottom:1px solid var(--border);
  }
  #nlPredictor .nlsp__status .nlsp__count b { color:var(--text); font-weight:900; font-variation-settings:'wght' 900; }
  #nlPredictor .nlsp__status .nlsp__savetick {
    color:var(--green); opacity:0; transition:opacity .25s ease;
    font-weight:800; font-variation-settings:'wght' 800;
  }
  #nlPredictor .nlsp__status .nlsp__savetick.is-on { opacity:1; }

  /* Empty state (no matches on selected date / pre-season / post-season) */
  #nlPredictor .nlsp__empty {
    padding:32px 24px;
    text-align:center;
    background:var(--white);
    border:1px solid var(--border);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    margin:8px 0 12px;
  }
  #nlPredictor .nlsp__empty-title {
    font-size:16px; color:var(--text);
    font-weight:900; font-variation-settings:'wght' 900;
    margin-bottom:6px;
  }
  #nlPredictor .nlsp__empty-body {
    font-size:13px; color:var(--text-muted);
    font-weight:500; font-variation-settings:'wght' 500;
  }

  /* Fixture rows — stacked layout: meta strip, then home team line, away team line */
  #nlPredictor .nlsp__row {
    position:relative;
    padding:8px 10px;
    border-bottom:1px solid var(--border);
    background:var(--white);
    border-left:3px solid transparent;
    display:grid; row-gap:2px;
  }
  #nlPredictor .nlsp__row:first-child { border-top:1px solid var(--border); }

  /* Hero card — the fan's own club's fixture as a proper showcase. Canon
     navy top strip (Your club · KO · lock countdown), then the matchup split
     into TWO club-colour panels — home club's primary left, away club's
     right (from clubs-meta.json, navy fallback) — so the opponent's colours
     always share the card. Oversized boxed crests; scores sit in white
     drop-shadowed windows; text flips dark/light off each panel's luminance.
     Deliberately NOT a .nlsp__row, so verdict tints never fight the club
     colours. Soft emphasis only: every other fixture stays available below. */
  #nlPredictor .nlsp__hero-card {
    position:relative;
    background:var(--white);
    border:1px solid var(--border); border-radius:var(--radius);
    box-shadow:var(--shadow);
    overflow:hidden;
    margin-bottom:14px;
  }
  #nlPredictor .nlsp__hero-card.is-void { opacity:.8; }
  #nlPredictor .nlsp__hero-top {
    display:flex; align-items:center; gap:10px;
    background:var(--navy); color:var(--white);
    padding:10px 14px;
  }
  #nlPredictor .nlsp__herotag {
    font-size:10px; text-transform:uppercase; letter-spacing:1.5px;
    color:inherit;
    font-weight:900; font-variation-settings:'wght' 900;
    white-space:nowrap;
  }
  #nlPredictor .nlsp__hero-top .nlsp__meta {
    flex:1; padding-right:0; color:inherit; opacity:.92; min-height:0;
  }
  #nlPredictor .nlsp__hero-card .nlsp__meta .nlsp__pickline,
  #nlPredictor .nlsp__hero-card .nlsp__meta .nlsp__pickline b,
  #nlPredictor .nlsp__hero-card .nlsp__meta .nlsp__lock,
  #nlPredictor .nlsp__hero-card .nlsp__meta .nlsp__ftlabel,
  #nlPredictor .nlsp__hero-card .nlsp__meta .nlsp__livelbl,
  #nlPredictor .nlsp__hero-card .nlsp__meta .nlsp__voidlbl,
  #nlPredictor .nlsp__hero-card .nlsp__countdown { color:inherit; }
  #nlPredictor .nlsp__heromatch {
    position:relative;
    display:grid; grid-template-columns:1fr 1fr;
  }
  #nlPredictor .nlsp__heroside {
    display:flex; flex-direction:column; align-items:center; gap:10px;
    text-align:center; min-width:0;
    padding:16px 12px 18px;
  }
  #nlPredictor .nlsp__heroside img {
    width:72px; height:72px; object-fit:contain;
    background:var(--white); border-radius:10px; padding:7px;
    box-shadow:var(--shadow);
  }
  #nlPredictor .nlsp__heroname {
    font-size:14px; line-height:1.2;
    text-transform:uppercase; letter-spacing:.5px;
    font-weight:900; font-variation-settings:'wght' 900;
    color:inherit;
  }
  #nlPredictor .nlsp__herov {
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:28px; height:28px;
    display:flex; align-items:center; justify-content:center;
    background:var(--white); color:var(--text-muted);
    border-radius:50%; box-shadow:var(--shadow);
    font-size:12px;
    font-weight:900; font-variation-settings:'wght' 900;
    text-transform:lowercase;
    z-index:1;
  }
  /* Scores in white windows — bigger, unmissable on any club colour */
  #nlPredictor .nlsp__hero-card .nlsp__step .nlsp__stepval,
  #nlPredictor .nlsp__hero-card .nlsp__teamscore {
    background:var(--white); color:var(--text);
    min-width:48px; padding:3px 8px;
    font-size:26px; text-align:center;
    border-radius:8px;
    box-shadow:0 3px 10px rgba(10,22,40,.25);
  }
  #nlPredictor .nlsp__hero-card .nlsp__teamscore.is-pred { color:var(--text-muted); }
  #nlPredictor .nlsp__hero-card .nlsp__step { gap:8px; }
  #nlPredictor .nlsp__hero-card .nlsp__step button { width:36px; height:36px; font-size:18px; }
  #nlPredictor .nlsp__hero-card .nlsp__editcontrols {
    margin:0; padding:12px; justify-content:center;
  }
  /* On the hero the EDIT affordance is a visible inline button under the
     matchup (the absolute pill would collide with the countdown chip). */
  #nlPredictor .nlsp__hero-card .nlsp__rowedit {
    position:static; display:block; margin:10px auto 12px; opacity:1;
  }
  @media (max-width:520px) {
    #nlPredictor .nlsp__heroside img { width:56px; height:56px; padding:5px; }
    #nlPredictor .nlsp__heroname { font-size:12px; }
    #nlPredictor .nlsp__hero-card .nlsp__step button { width:32px; height:32px; }
    #nlPredictor .nlsp__hero-card .nlsp__step .nlsp__stepval,
    #nlPredictor .nlsp__hero-card .nlsp__teamscore { font-size:22px; min-width:42px; }
  }

  /* KO group boxes — fixtures sharing a kick-off time, one countdown each */
  #nlPredictor .nlsp__kogroup {
    background:var(--white);
    border:1px solid var(--border); border-radius:var(--radius);
    margin-bottom:12px;
    overflow:hidden;
  }
  #nlPredictor .nlsp__kohead {
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:8px 12px;
    background:var(--off-white);
    border-bottom:1px solid var(--border);
    font-size:11px; color:var(--text-muted);
    text-transform:uppercase; letter-spacing:1px;
    font-weight:800; font-variation-settings:'wght' 800;
  }
  #nlPredictor .nlsp__countdown { color:var(--primary); white-space:nowrap; }
  #nlPredictor .nlsp__kostatus { color:var(--text-muted); white-space:nowrap; }
  #nlPredictor .nlsp__kostatus.is-live { color:var(--green); }
  #nlPredictor .nlsp__kogroup .nlsp__row:last-child { border-bottom:none; }

  /* No row background tint for live — just the pulse on the meta strip */
  #nlPredictor .nlsp__row.is-exact { background:var(--amber-light); }
  #nlPredictor .nlsp__row.is-right { background:var(--green-light); }
  #nlPredictor .nlsp__row.is-wrong { background:var(--off-white); }
  #nlPredictor .nlsp__row.is-editing { border-left-color:var(--primary); }

  /* Meta strip (KO time / live dot / FT verdict) on top */
  #nlPredictor .nlsp__meta {
    display:flex; align-items:center; gap:8px;
    font-size:11px; color:var(--text-muted);
    text-transform:uppercase; letter-spacing:1px;
    font-weight:800; font-variation-settings:'wght' 800;
    padding-right:60px; /* leave room for the hover EDIT pill */
    min-height:16px;
  }
  #nlPredictor .nlsp__meta .nlsp__livedot {
    width:7px; height:7px; border-radius:50%; background:var(--accent-live);
    animation:nlsp-pulse 1.4s infinite;
  }
  #nlPredictor .nlsp__meta .nlsp__livelbl { color:var(--green); }
  #nlPredictor .nlsp__meta .nlsp__ftlabel { color:var(--green); }
  #nlPredictor .nlsp__meta .nlsp__voidlbl { color:var(--text-muted); }
  #nlPredictor .nlsp__meta .nlsp__lock    { color:var(--text-muted); }
  #nlPredictor .nlsp__row.is-void { opacity:.7; }
  #nlPredictor .nlsp__meta .nlsp__pickline { color:var(--text-muted); }
  #nlPredictor .nlsp__meta .nlsp__pickline b { color:var(--text); font-weight:900; font-variation-settings:'wght' 900; }
  @keyframes nlsp-pulse {
    0%   { box-shadow:0 0 0 0 color-mix(in srgb, var(--accent-live) 60%, transparent); }
    70%  { box-shadow:0 0 0 6px color-mix(in srgb, var(--accent-live) 0%, transparent); }
    100% { box-shadow:0 0 0 0 color-mix(in srgb, var(--accent-live) 0%, transparent); }
  }
  /* Verdict pill — solid bg, white text. Exact = amber "champion" treatment
     with a slight bump in size + a tiny star prefix. Right result = green.
     Wrong gets no pill. Always right-aligned in the meta strip. */
  #nlPredictor .nlsp__pts {
    margin-left:auto; padding:3px 12px; border-radius:999px;
    font-size:14px; letter-spacing:.6px;
    color:var(--white);
    font-weight:900; font-variation-settings:'wght' 900;
    display:inline-flex; align-items:center; gap:5px;
    white-space:nowrap;
  }
  #nlPredictor .nlsp__pts.is-exact {
    background:var(--amber); color:var(--white);
    font-size:15px; padding:4px 14px;
    box-shadow:0 1px 4px color-mix(in srgb, var(--amber) 35%, transparent);
  }
  #nlPredictor .nlsp__pts.is-exact::before { content:'\2605'; font-size:13px; line-height:1; }
  #nlPredictor .nlsp__pts.is-right { background:var(--green); color:var(--white); }
  #nlPredictor .nlsp__pts.is-wrong {
    background:var(--white); color:var(--text-muted);
    border:1px solid var(--border);
  }

  /* Team line — full row width with score on the right */
  #nlPredictor .nlsp__teamline {
    display:flex; align-items:center; gap:10px;
    font-size:14px; color:var(--text);
    font-weight:800; font-variation-settings:'wght' 800;
    text-transform:uppercase; letter-spacing:.5px;
    min-height:30px;
  }
  #nlPredictor .nlsp__teamline img {
    width:24px; height:24px; flex:none; border-radius:3px;
    background:var(--white); object-fit:contain;
  }
