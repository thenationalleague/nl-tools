<!-- ============================================================
     SCORE PREDICTOR — embeddable widget for thenationalleague.org.uk
     Source of truth. Copy/paste into the CMS custom HTML block.

     - JWT identity from _gc_sa_sso_access (sso.sportsalliance.com)
     - One-time team registration (immutable team lock)
     - RTDB (dedicated nl-score-predictor project, named Firebase app):
         users/{jwtId}
         predictions/{jwtId}/{matchday}/{matchId}
     - Auto-save on blur; per-row KO lock harden inputs into numbers
     - Own-team match scores ×3 (no joker)
     - League table: forename + surname initial + crest + total

     Sim controls (visible by default during dev):
       (no param) → show the sim bar with 4 time snapshots
       ?sim=1     → show the sim bar (explicit form, same as default)
       ?sim=pre   → freeze sim at 12:00 BST (pre-KO), bar hidden
       ?sim=live  → freeze sim at 16:00 BST (in-play), bar hidden
       ?sim=post  → freeze sim at 18:00 BST (post-FT), bar hidden
       ?sim=demo  → tick from 14:59:50 BST in real time, bar hidden
       ?sim=off   → real clock, bar hidden (production)

     Scoped under #nlPredictor; BEM .nlsp__ prefix; Carbona inline;
     no external <script src> tags (CMS strips them).
     ============================================================ -->

<div id="nlPredictor">
  <div class="nlsp__sponsor" id="nlsp-sponsor"></div>
  <div class="nlsp__banner" id="nlsp-banner" hidden>Loading predictor…</div>
  <div class="nlsp__screen" id="nlsp-register" hidden></div>
  <div class="nlsp__screen" id="nlsp-main" hidden>
    <div id="nlsp-datebar"></div>
    <div id="nlsp-hero"></div>
    <div id="nlsp-statusbar"></div>
    <div id="nlsp-fixtures"></div>
    <div id="nlsp-submitbar"></div>
    <div id="nlsp-reset"></div>
    <div id="nlsp-table"></div>
  </div>
  <div class="nlsp__gate" id="nlsp-gate"></div>
  <div class="nlsp__footer" id="nlsp-footer"></div>
  <div id="nlsp-sim"></div>
  <div class="nlsp__modal" id="nlsp-modal" hidden></div>
</div>

<style>
  /* Carbona Variable */
  @font-face {
    font-family: "carbona-variable";
    src: url("https://use.typekit.net/af/184cf2/0000000000000000774c3175/31/l?primer=7cdcb44be4a7db8877ffa5c0007b8dd865b3bbc383831fe2ea177f62257a9191&fvd=n4&v=3") format("woff2"),
         url("https://use.typekit.net/af/184cf2/0000000000000000774c3175/31/d?primer=7cdcb44be4a7db8877ffa5c0007b8dd865b3bbc383831fe2ea177f62257a9191&fvd=n4&v=3") format("woff");
    font-display: swap; font-style: normal; font-weight: 200 900; font-stretch: normal;
  }

  #nlPredictor {
    --primary:#9e0000; --navy:#223b7c;
    --red:#d4380d; --red-light:#fff1ec;
    --green:#1a7030; --green-light:#edf7ee;
    --amber:#c96f15; --amber-light:#fef6ec;
    --info:#3b82f6; --info-light:#eef2ff;
    --gold:#b8860b; --gold-light:#fff5d4;
    --white:#ffffff; --off-white:#f4f6f9;
    --text:#1a2a44; --text-muted:#5a6a82;
    --border:#dde3ed;
    --radius:6px;
    --shadow:0 2px 12px rgba(10,22,40,.10);

    font-family:'carbona-variable','carbona',sans-serif;
    font-size:15px; line-height:1.45;
    font-variation-settings:'wght' 400;
    color:var(--text); -webkit-font-smoothing:antialiased;
    max-width:680px; margin:24px auto; padding:0 12px;
  }
  #nlPredictor, #nlPredictor *, #nlPredictor *::before, #nlPredictor *::after { box-sizing:border-box; }

  /* Hide native number-input spinners just in case */
  #nlPredictor input[type="number"]::-webkit-outer-spin-button,
  #nlPredictor input[type="number"]::-webkit-inner-spin-button { -webkit-appearance:none; margin:0; }
  #nlPredictor input[type="number"] { -moz-appearance:textfield; appearance:textfield; }

  /* Banner */
  #nlPredictor .nlsp__banner {
    background:var(--amber-light); border:1px solid var(--amber); color:var(--amber);
    padding:8px 12px; border-radius:var(--radius); font-size:13px; margin-bottom:14px;
    font-variation-settings:'wght' 600;
  }
  #nlPredictor .nlsp__banner.is-err { background:var(--red-light);   border-color:var(--red);   color:var(--red); }
  #nlPredictor .nlsp__banner.is-ok  { background:var(--green-light); border-color:var(--green); color:var(--green); }

  /* Gate card — covers loading + signed-out, replaces the previous overlay/blur approach */
  #nlPredictor .nlsp__gate {
    padding:48px 16px;
    display:flex; justify-content:center;
  }
  #nlPredictor .nlsp__gate-card {
    background:var(--white); border:1px solid var(--border); border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:28px 28px 24px;
    max-width:380px; width:100%;
    text-align:center;
  }
  #nlPredictor .nlsp__gate-card img.nlsp__gate-mark {
    height:56px; width:auto; display:block; margin:0 auto 18px;
    max-width:200px; object-fit:contain;
  }
  #nlPredictor .nlsp__gate-card h2 {
    margin:0 0 6px;
    font-size:20px; font-weight:900; font-variation-settings:'wght' 900;
    color:var(--text);
  }
  #nlPredictor .nlsp__gate-card p {
    margin:0 0 18px;
    color:var(--text-muted); font-size:14px;
    font-weight:500; font-variation-settings:'wght' 500;
  }
  #nlPredictor .nlsp__gate-card .nlsp__btn { width:100%; padding:12px 22px; }
  #nlPredictor .nlsp__gate-spinner {
    width:22px; height:22px; margin:0 auto 12px;
    border:2px solid var(--border); border-top-color:var(--primary);
    border-radius:50%;
    animation:nlsp-spin .8s linear infinite;
  }
  @keyframes nlsp-spin { to { transform:rotate(360deg); } }

  /* Sponsor header — Enterprise (left), title (centred), comp + team crests (right) */
  #nlPredictor .nlsp__sponsor {
    display:grid; grid-template-columns:1fr auto 1fr; align-items:center;
    background:#000; color:#fff;
    padding:12px 16px; border-radius:var(--radius) var(--radius) 0 0;
    border-bottom:2px solid #34ab56;
    gap:12px; min-height:54px;
  }
  #nlPredictor .nlsp__sponsor-left  { display:flex; align-items:center; gap:10px; justify-self:start; }
  #nlPredictor .nlsp__sponsor-right { display:flex; align-items:center; gap:8px;  justify-self:end; }
  #nlPredictor .nlsp__sponsor img.nlsp__sponsor-logo {
    height:26px; width:auto; display:block; object-fit:contain;
  }
  #nlPredictor .nlsp__sponsor img.nlsp__sponsor-comp {
    height:30px; width:auto; display:block; object-fit:contain;
  }
  #nlPredictor .nlsp__sponsor img.nlsp__sponsor-team {
    height:30px; width:30px; display:block; object-fit:contain;
    background:#fff; border-radius:4px; padding:1px;
  }
  #nlPredictor .nlsp__sponsor .nlsp__sponsor-title {
    font-size:15px; color:#fff;
    text-transform:uppercase; letter-spacing:1.5px;
    font-weight:900; font-variation-settings:'wght' 900;
    line-height:1;
    text-align:center;
    justify-self:center;
  }
  @media (max-width:520px) {
    #nlPredictor .nlsp__sponsor {
      padding:10px 12px; min-height:48px;
      grid-template-columns:1fr auto 1fr;
      gap:8px;
    }
    #nlPredictor .nlsp__sponsor img.nlsp__sponsor-logo { height:20px; }
    #nlPredictor .nlsp__sponsor img.nlsp__sponsor-comp,
    #nlPredictor .nlsp__sponsor img.nlsp__sponsor-team { height:24px; }
    #nlPredictor .nlsp__sponsor img.nlsp__sponsor-team { width:24px; }
    #nlPredictor .nlsp__sponsor .nlsp__sponsor-title { font-size:11px; letter-spacing:1px; }
  }

  /* Footer — small Enterprise logo only */
  #nlPredictor .nlsp__footer {
    display:flex; align-items:center; justify-content:center;
    padding:16px 0 4px; margin-top:12px;
    border-top:1px solid var(--border);
  }
  #nlPredictor .nlsp__footer img {
    height:22px; width:auto; display:block; opacity:.65;
  }

  /* Date selector — horizontally scrollable strip of matchday pills.
     Click-drag enabled on desktop via JS (enableDragScroll). */
  #nlPredictor .nlsp__datebar {
    display:flex; gap:6px;
    padding:14px 2px 8px;
    overflow-x:auto; overflow-y:hidden;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
    cursor:grab;
    user-select:none;
  }
  #nlPredictor .nlsp__datebar.is-dragging { cursor:grabbing; }
  #nlPredictor .nlsp__datebar.is-dragging button { pointer-events:none; }
  #nlPredictor .nlsp__datebar::-webkit-scrollbar { display:none; }
  #nlPredictor .nlsp__datebar button {
    flex:none;
    font-family:inherit; font-size:11px;
    text-transform:uppercase; letter-spacing:1px;
    padding:7px 12px; border-radius:999px; cursor:pointer;
    background:var(--white); color:var(--text-muted);
    border:1px solid var(--border);
    font-weight:800; font-variation-settings:'wght' 800;
    white-space:nowrap;
    transition:all .15s ease;
  }
  #nlPredictor .nlsp__datebar button:hover {
    color:var(--primary); border-color:var(--primary);
  }
  #nlPredictor .nlsp__datebar button.is-active {
    background:var(--text); color:var(--white); border-color:var(--text);
  }
  #nlPredictor .nlsp__datebar button.is-today {
    border-color:var(--primary);
  }

  /* Hero — compressed: greeting ribbon + date */
  #nlPredictor .nlsp__hero { padding:10px 0 8px; }
  #nlPredictor .nlsp__hero .nlsp__greetline {
    font-size:11px; text-transform:uppercase; letter-spacing:1.5px;
    color:var(--text-muted);
    font-weight:800; font-variation-settings:'wght' 800;
    margin-bottom:6px;
  }
  #nlPredictor .nlsp__hero h1 {
    font-size:24px; line-height:1.15; margin:0;
    font-weight:900; font-variation-settings:'wght' 900;
  }

  /* Status bar — single thin line above fixtures */
  #nlPredictor .nlsp__status {
    display:flex; justify-content:space-between; align-items:baseline;
    padding:6px 2px; margin-bottom:8px;
    font-size:12px; color:var(--text-muted);
    font-weight:700; font-variation-settings:'wght' 700;
    text-transform:uppercase; letter-spacing:1px;
    border-bottom:1px solid var(--border);
  }
  #nlPredictor .nlsp__status .nlsp__count b { color:var(--text); font-weight:900; font-variation-settings:'wght' 900; }
  #nlPredictor .nlsp__status .nlsp__savetick {
    color:var(--green); opacity:0; transition:opacity .25s ease;
    font-weight:800; font-variation-settings:'wght' 800;
  }
  #nlPredictor .nlsp__status .nlsp__savetick.is-on { opacity:1; }

  /* Fixture rows — stacked layout: meta strip, then home team line, away team line */
  #nlPredictor .nlsp__row {
    position:relative;
    padding:8px 10px;
    border-bottom:1px solid var(--border);
    background:var(--white);
    border-left:3px solid transparent;
    display:grid; row-gap:2px;
  }
  #nlPredictor .nlsp__row:first-child { border-top:1px solid var(--border); }
  #nlPredictor .nlsp__row.is-mult { border-left-color:var(--gold); }
  /* No row background tint for live — just the pulse on the meta strip */
  #nlPredictor .nlsp__row.is-exact { background:color-mix(in srgb, var(--gold) 10%, var(--white)); }
  #nlPredictor .nlsp__row.is-right { background:color-mix(in srgb, var(--green) 6%, var(--white)); }
  #nlPredictor .nlsp__row.is-wrong { background:color-mix(in srgb, var(--text-muted) 4%, var(--white)); }
  #nlPredictor .nlsp__row.is-editing { border-left-color:var(--primary); }
  #nlPredictor .nlsp__row.is-editing input { border-color:var(--primary); }

  /* Meta strip (KO time / live dot / FT verdict) on top */
  #nlPredictor .nlsp__meta {
    display:flex; align-items:center; gap:8px;
    font-size:11px; color:var(--text-muted);
    text-transform:uppercase; letter-spacing:1px;
    font-weight:800; font-variation-settings:'wght' 800;
    padding-right:60px; /* leave room for the hover EDIT pill */
    min-height:16px;
  }
  #nlPredictor .nlsp__meta .nlsp__livedot {
    width:7px; height:7px; border-radius:50%; background:var(--red);
    animation:nlsp-pulse 1.4s infinite;
  }
  #nlPredictor .nlsp__meta .nlsp__livelbl { color:var(--red); }
  #nlPredictor .nlsp__meta .nlsp__ftlabel { color:var(--green); }
  #nlPredictor .nlsp__meta .nlsp__voidlbl { color:var(--text-muted); }
  #nlPredictor .nlsp__meta .nlsp__lock    { color:var(--text-muted); }
  #nlPredictor .nlsp__row.is-void { opacity:.7; }
  #nlPredictor .nlsp__meta .nlsp__pickline { color:var(--text-muted); }
  #nlPredictor .nlsp__meta .nlsp__pickline b { color:var(--text); font-weight:900; font-variation-settings:'wght' 900; }
  @keyframes nlsp-pulse {
    0%   { box-shadow:0 0 0 0 color-mix(in srgb, var(--red) 50%, transparent); }
    70%  { box-shadow:0 0 0 6px color-mix(in srgb, var(--red) 0%, transparent); }
    100% { box-shadow:0 0 0 0 color-mix(in srgb, var(--red) 0%, transparent); }
  }
  /* Points pill — solid bg, white text. Exact = gold "champion" treatment
     with a slight bump in size + a tiny star prefix. Right result = green.
     Wrong = quiet muted chip. Always right-aligned in the meta strip. */
  #nlPredictor .nlsp__pts {
    margin-left:auto; padding:3px 12px; border-radius:999px;
    font-size:14px; letter-spacing:.6px;
    color:var(--white);
    font-weight:900; font-variation-settings:'wght' 900;
    display:inline-flex; align-items:center; gap:5px;
    white-space:nowrap;
  }
  #nlPredictor .nlsp__pts.is-exact {
    background:var(--gold); color:var(--white);
    font-size:15px; padding:4px 14px;
    box-shadow:0 1px 4px color-mix(in srgb, var(--gold) 35%, transparent);
  }
  #nlPredictor .nlsp__pts.is-exact::before { content:'\2605'; font-size:13px; line-height:1; }
  #nlPredictor .nlsp__pts.is-right { background:#0f5022; color:var(--white); }
  #nlPredictor .nlsp__pts.is-wrong {
    background:var(--white); color:var(--text-muted);
    border:1px solid var(--border);
  }

  /* Team line — full row width with score on the right */
  #nlPredictor .nlsp__teamline {
    display:flex; align-items:center; gap:10px;
    font-size:14px; color:var(--text);
    font-weight:800; font-variation-settings:'wght' 800;
    text-transform:uppercase; letter-spacing:.5px;
    min-height:30px;
  }
  #nlPredictor .nlsp__teamline img {
    width:24px; height:24px; flex:none; border-radius:3px;
    background:var(--white); object-fit:contain;
  }
  #nlPredictor .nlsp__teamline .nlsp__tname {
    flex:1; min-width:0;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  #nlPredictor .nlsp__tname-short { display:none; }
  @media (max-width:520px) {
    #nlPredictor .nlsp__tname-full  { display:none; }
    #nlPredictor .nlsp__tname-short { display:inline; }
  }
  /* Score cell on the right of each team line */
  #nlPredictor .nlsp__teamscore {
    flex:none; min-width:36px;
    text-align:right;
    font-size:20px;
    font-weight:900; font-variation-settings:'wght' 900;
    color:var(--text);
  }
  #nlPredictor .nlsp__teamscore.is-pred { color:var(--text-muted); }
  #nlPredictor .nlsp__teamscore input {
    width:48px; height:34px; padding:0 6px;
    text-align:center; font-family:inherit;
    font-size:18px; font-weight:900; font-variation-settings:'wght' 900;
    color:var(--text); background:var(--off-white);
    border:1px solid var(--border); border-radius:var(--radius);
  }
  #nlPredictor .nlsp__teamscore input:focus {
    outline:none; background:var(--white); border-color:var(--primary);
    box-shadow:0 0 0 3px color-mix(in srgb, var(--primary) 25%, transparent);
  }
  #nlPredictor .nlsp__teamscore input::placeholder { color:var(--text-muted); opacity:.4; }

  /* Hover-revealed EDIT pill — top-right of the row */
  #nlPredictor .nlsp__rowedit {
    position:absolute; right:10px; top:6px;
    font:inherit; font-size:10px;
    font-weight:700; font-variation-settings:'wght' 700;
    text-transform:uppercase; letter-spacing:1px;
    background:var(--white); color:var(--text-muted);
    border:1px solid var(--border); border-radius:4px;
    padding:3px 7px; cursor:pointer;
    opacity:0; transition:opacity .15s ease, color .15s ease, border-color .15s ease;
  }
  #nlPredictor .nlsp__row:hover .nlsp__rowedit,
  #nlPredictor .nlsp__rowedit:focus-visible { opacity:1; }
  #nlPredictor .nlsp__rowedit:hover { color:var(--primary); border-color:var(--primary); }
  @media (hover:none) {
    #nlPredictor .nlsp__rowedit { opacity:.55; }
  }

  /* Per-row SAVE / CANCEL controls */
  #nlPredictor .nlsp__editcontrols {
    display:flex; gap:8px; justify-content:flex-end;
    margin-top:6px;
  }
  #nlPredictor .nlsp__editcontrols button {
    font:inherit; font-size:11px;
    font-weight:800; font-variation-settings:'wght' 800;
    text-transform:uppercase; letter-spacing:1px;
    padding:6px 14px; border-radius:var(--radius); cursor:pointer;
    transition:background .15s ease, color .15s ease, border-color .15s ease;
  }
  #nlPredictor .nlsp__editcontrols .nlsp__btn-save {
    background:var(--primary); color:var(--white); border:1px solid var(--primary);
  }
  #nlPredictor .nlsp__editcontrols .nlsp__btn-save:hover  { background:color-mix(in srgb, var(--primary) 80%, black); }
  #nlPredictor .nlsp__editcontrols .nlsp__btn-save:disabled {
    background:#cccccc; color:#888888; border-color:#cccccc; cursor:not-allowed;
  }
  #nlPredictor .nlsp__editcontrols .nlsp__btn-cancel {
    background:var(--white); color:var(--text-muted); border:1px solid var(--border);
  }
  #nlPredictor .nlsp__editcontrols .nlsp__btn-cancel:hover { color:var(--text); border-color:var(--text-muted); }

  /* Reset all predictions — subtle text link between fixtures and leaderboard */
  #nlPredictor .nlsp__reset {
    display:flex; justify-content:flex-end;
    padding:8px 4px 14px;
  }
  #nlPredictor .nlsp__resetbtn {
    font:inherit; font-size:11px;
    font-weight:700; font-variation-settings:'wght' 700;
    text-transform:uppercase; letter-spacing:1px;
    background:transparent; border:none; padding:4px 0;
    color:var(--text-muted); cursor:pointer;
    text-decoration:underline; text-underline-offset:3px;
    transition:color .15s ease;
  }
  #nlPredictor .nlsp__resetbtn:hover { color:var(--red); }

  /* Submit bar — shown when there are awaiting rows ready to commit */
  #nlPredictor .nlsp__submitbar {
    display:flex; gap:12px; align-items:center;
    padding:12px 14px; margin:14px 0 18px;
    background:var(--white); border:1px solid var(--border); border-radius:var(--radius);
    box-shadow:var(--shadow);
  }
  #nlPredictor .nlsp__submitbar .nlsp__submitmsg {
    font-size:13px; color:var(--text-muted);
    font-weight:700; font-variation-settings:'wght' 700;
  }
  #nlPredictor .nlsp__submitbar .nlsp__submitmsg b { color:var(--text); font-weight:900; font-variation-settings:'wght' 900; }

  /* Custom confirm modal */
  #nlPredictor .nlsp__modal[hidden] { display:none; }
  #nlPredictor .nlsp__modal {
    position:fixed; inset:0; z-index:1000;
    display:flex; align-items:center; justify-content:center;
    padding:20px;
    background:rgba(10,22,40,.45);
  }
  #nlPredictor .nlsp__modal-card {
    background:var(--white); border:1px solid var(--border); border-radius:var(--radius);
    box-shadow:0 12px 36px rgba(10,22,40,.25);
    padding:22px 24px; max-width:380px; width:100%;
    font-family:'carbona-variable','carbona',sans-serif;
  }
  #nlPredictor .nlsp__modal-card h3 {
    margin:0 0 6px;
    font-size:18px; font-weight:900; font-variation-settings:'wght' 900;
    color:var(--text);
  }
  #nlPredictor .nlsp__modal-card p {
    margin:0 0 18px;
    font-size:14px; color:var(--text-muted);
    font-weight:500; font-variation-settings:'wght' 500;
  }
  #nlPredictor .nlsp__modal-actions {
    display:flex; justify-content:flex-end; gap:8px;
  }
  #nlPredictor .nlsp__modal-actions button {
    font:inherit; font-size:13px;
    font-weight:800; font-variation-settings:'wght' 800;
    text-transform:uppercase; letter-spacing:1px;
    padding:8px 16px; border-radius:var(--radius); cursor:pointer;
  }
  #nlPredictor .nlsp__modal-cancel {
    background:var(--white); color:var(--text-muted); border:1px solid var(--border);
  }
  #nlPredictor .nlsp__modal-cancel:hover { color:var(--text); border-color:var(--text-muted); }
  #nlPredictor .nlsp__modal-confirm {
    background:var(--primary); color:var(--white); border:1px solid var(--primary);
  }
  #nlPredictor .nlsp__modal-confirm:hover { background:color-mix(in srgb, var(--primary) 80%, black); }

  /* Registration */
  #nlPredictor .nlsp__register-card {
    background:var(--white); border:1px solid var(--border); border-radius:var(--radius);
    padding:24px; box-shadow:var(--shadow);
  }
  #nlPredictor .nlsp__register-card label {
    display:block; font-size:13px; margin:18px 0 6px;
    font-weight:800; font-variation-settings:'wght' 800;
  }
  #nlPredictor .nlsp__register-card select {
    width:100%; padding:10px 12px; font-size:15px; font-family:inherit;
    color:var(--text); background:var(--white);
    border:1px solid var(--border); border-radius:var(--radius);
    font-weight:600; font-variation-settings:'wght' 600;
  }
  #nlPredictor .nlsp__register-card select:focus {
    outline:none; border-color:var(--primary);
    box-shadow:0 0 0 3px color-mix(in srgb, var(--primary) 25%, transparent);
  }
  #nlPredictor .nlsp__lockwarn {
    margin:18px 0; padding:10px 12px;
    background:var(--amber-light); border:1px solid var(--amber); color:var(--amber);
    font-size:13px; border-radius:var(--radius);
    font-weight:700; font-variation-settings:'wght' 700;
  }
  #nlPredictor .nlsp__btn {
    font-family:inherit; font-size:15px;
    font-weight:900; font-variation-settings:'wght' 900;
    padding:10px 22px; border:none; border-radius:var(--radius);

  // ---------- sponsor + footer (always visible) ----------
  var ENTERPRISE_LOGO_URL = 'https://raw.githubusercontent.com/thenationalleague/tools/main/assets/partners/Enterprise.png';
  function renderSponsor() {

    var teamCrest = (r && r.crestUrl)
      ? '<img class="nlsp__sponsor-team" src="' + $h(r.crestUrl) + '" alt="' + $h(teamName || 'My team') + '" ' +
          'title="' + $h(teamName) + ' · ' + $h(compName_) + '" ' +

  function renderFooter() {
    footerEl.innerHTML =
      '<img src="' + ENTERPRISE_LOGO_URL + '" alt="Enterprise" ' +
        'onerror="this.onerror=null;this.style.display=\'none\';">';
  }
  // NOTE: renderSponsor() / renderFooter() can't run here at script-load
  // because they read state.registration + call userCompId() / compLogoUrl(),
  // and `var state = {...}` plus those helpers are defined further down.
  // Hoisting makes `state` available as `undefined`, which throws on read.
  // Initial paint happens from boot() instead, after all helpers are defined.

  // ---------- helpers ----------
  function $h(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
  });}
  function readCookie(name) {
    var p = (document.cookie || '').split('; ');
    for (var i = 0; i < p.length; i++) if (p[i].indexOf(name + '=') === 0) return p[i].slice(name.length + 1);
    return null;
  }
  function decodeJwtPayload(jwt) {
    if (!jwt) return null;
    var parts = jwt.split('.'); if (parts.length !== 3) return null;
    try {
      var s = parts[1].replace(/-/g, '+').replace(/_/g, '/');
      while (s.length % 4) s += '=';
      return JSON.parse(decodeURIComponent(escape(atob(s))));
    } catch (e) { return null; }
  }
  function loadScript(src) {
    return new Promise(function (resolve, reject) {
      var s = document.createElement('script');
      s.src = src; s.async = false;
      s.onload  = function () { resolve(); };
      s.onerror = function () { reject(new Error('Failed to load ' + src)); };
      document.head.appendChild(s);
    });
  }
  function loadFirebase() {
    return FB_SDK.reduce(function (p, name) {
      return p.then(function () { return loadScript(FB_SDK_URL + name); });
    }, Promise.resolve());
  }
  function normaliseUtc(s) {
    if (!s) return null;
    var iso = s.indexOf('T') >= 0 ? s : s.replace(' ', 'T') + 'Z';
    return new Date(iso);
  }
  function fmtBST(d) {
    if (!d) return '';
    return d.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit', timeZone:'Europe/London' });
  }
  function teamLabel(t) { return t.shortName || t.name || ''; }
  function showBanner(msg, kind) {
    banner.className = 'nlsp__banner' + (kind === 'err' ? ' is-err' : kind === 'ok' ? ' is-ok' : '');
    banner.textContent = msg; banner.hidden = false;
  }
  function hideBanner() { banner.hidden = true; }
  // Show a green confirmation banner that auto-dismisses after a short
  // window. Used for save / reset confirmations.
  function setBannerOK(msg) {
    showBanner(msg, 'ok');
    setTimeout(function () {
      if (banner.textContent === msg) hideBanner();
    }, 2200);
  }
  // Brief "Saved" toast at the top of the widget (replaces the old savetick
  // pinned to the now-removed status bar).

  function crestImg(url, alt, size) {
    var s = size || 26;
    if (!url) return '<span style="display:inline-block;width:' + s + 'px;height:' + s + 'px;flex:none;"></span>';
    return '<img src="' + $h(url) + '" alt="' + $h(alt || '') + '" ' +
           'onerror="this.onerror=null;this.style.visibility=\'hidden\';">';

  // ---------- sim mode (URL-driven) ----------
  // Returns a Date to use as the simulated 'now', or null for the real clock.
  // ?sim=2025-08-09T14:00:00Z (or any value parseable by new Date()) freezes
  // the sim at that moment. ?sim=off explicitly disables. No param => null.
  function parseSimMode() {
    var p = new URLSearchParams(window.location.search).get('sim');
    if (p == null) return null;
    var l = p.toLowerCase();
    if (l === 'off' || l === 'none' || l === '0' || l === 'false') return null;
    var d = new Date(p);
    if (!isNaN(d.getTime())) return d;
    return null;
  }

  // ---------- state ----------
  var fbApp = null, fbDb = null, fbAuth = null;
  var state = {
    user: null, fbAuthed: false,
    allMatches: [],     // every fixture for the season (paginated full fetch)
    matches: [],        // filtered subset for the currently-active matchday
    registration: null,
    allPredsRaw: {},    // full RTDB predictions tree { jwtId: { matchday: { matchId: ... } } }
    predictions: {},    // current user, current matchday
    allPreds: {},       // every user, current matchday only (used by leaderboard)
    drafts: {},
    editing: {},
    allUsers: {},
    selectedMatchday: null, // explicit override from the date selector; null = derive
    sim: { fixed: null }     // explicit sim 'now' time; null = real clock
  };

  // ---------- sim clock ----------
  function simNow() {
    return state.sim.fixed ? new Date(state.sim.fixed.getTime()) : new Date();
  }
  function setSimFixed(d) {
    state.sim.fixed = d;
    recomputeMatchday();
    renderAll();
  }
  function clearSimFixed() { setSimFixed(null); }
  function renderAll() {
    renderDatebar(); renderSimBar(); renderHero();
    renderFixtures(); renderSubmitbar(); renderReset(); renderTable();
  }

  // ---------- matchday derivation ----------
  // BST/GMT calendar date — keeps a 23:00 BST kickoff on the right matchday
  // even though the API timestamps are UTC.
  function bstDateOf(d) {
    if (!d) return '';
    return d.toLocaleDateString('en-CA', { timeZone: 'Europe/London' });
  }
  function matchMatchdayKey(m) { return bstDateOf(koOf(m)); }
  function uniqueMatchdayKeys() {
    var compId = userCompId();
    var seen = {};
    (state.allMatches || []).forEach(function (m) {
      if (compId && m.attributes.competitionID !== compId) return;
      var k = matchMatchdayKey(m); if (k) seen[k] = true;
    });
    return Object.keys(seen).sort();
  }
  // Default: today (in BST) if any matches today, else next upcoming matchday.
  // Always computed from REAL today — sim time doesn't auto-shift the default.
  function defaultMatchdayKey() {
    var today = bstDateOf(new Date());
    var keys = uniqueMatchdayKeys();
    if (keys.indexOf(today) !== -1) return today;
    for (var i = 0; i < keys.length; i++) {
      if (keys[i] > today) return keys[i];
    }
    return keys[keys.length - 1] || today;
  }
  // The matchday actually being shown
  function currentMatchdayKey() {
    return state.selectedMatchday || defaultMatchdayKey();
  }
  function setSelectedMatchday(key) {
    state.selectedMatchday = key;
    recomputeMatchday();
    renderAll();
  }
  function recomputeMatchday() {
    var key = currentMatchdayKey();
    var compId = userCompId();
    state.matches = (state.allMatches || []).filter(function (m) {
      if (compId && m.attributes.competitionID !== compId) return false;
      return matchMatchdayKey(m) === key;
    }).sort(function (a, b) { return dateOf(a).localeCompare(dateOf(b)); });
    recomputePredictionsFromRaw();
  }
  function recomputePredictionsFromRaw() {
    if (!state.user) return;
    var key = currentMatchdayKey();
    state.predictions = (state.allPredsRaw[state.user.id] && state.allPredsRaw[state.user.id][key]) || {};
    state.allPreds = {};
    Object.keys(state.allPredsRaw).forEach(function (jwtId) {
      state.allPreds[jwtId] = (state.allPredsRaw[jwtId] && state.allPredsRaw[jwtId][key]) || {};
    });
  }

  // ---------- match state ----------
  function dateOf(m) {
    var a = (m && m.attributes) || {};
    return String(a.kickOffDateUTC || a.kickoffDateUTC || a.kickOffDate || a.kickoffDate || a.date || '');
  }
  function koOf(m) { return normaliseUtc(dateOf(m)); }
  function periodOf(m) { return ((m && m.attributes && m.attributes.matchPeriod) || '').toLowerCase(); }
  function stateOf(m, now) {
    // matchPeriod from the API takes priority for postponed / abandoned
    var p = periodOf(m);
    if (p === 'postponed') return 'postponed';
    if (p === 'abandoned') return 'abandoned';
    var ko = koOf(m); if (!ko) return 'unknown';
    var diffMin = (now - ko) / 60000;
    var hoursUntil = -diffMin / 60;
    if (diffMin < 0 && hoursUntil > EDIT_WINDOW_HOURS) return 'future'; // > 7 days away
    if (diffMin < 0) return 'pre';                                       // editable window
    if (diffMin < IN_PLAY_MIN) return 'live';
    return 'post';
  }
  function outcome(h, a) { return h > a ? 'H' : (h < a ? 'A' : 'D'); }
  function basePoints(predH, predA, realH, realA) {
    if (predH == null || predA == null || realH == null || realA == null) return null;
    if (predH === realH && predA === realA) return 3;
    if (outcome(predH, predA) === outcome(realH, realA)) return 1;
    return 0;
  }
  function isOwnTeamMatch(m, reg) {
    return reg && (m.attributes.homeTeam.teamID === reg.teamId || m.attributes.awayTeam.teamID === reg.teamId);
  }
  function multiplierFor(m, reg) { return isOwnTeamMatch(m, reg) ? OWN_TEAM_MULT : 1; }
  function totalForUser(jwtId, now) {
    var preds = (jwtId === state.user.id) ? state.predictions : (state.allPreds[jwtId] || {});
    var reg   = (jwtId === state.user.id) ? state.registration : state.allUsers[jwtId];
    var total = 0, settled = 0;
    for (var i = 0; i < state.matches.length; i++) {
      var m = state.matches[i];
      if (stateOf(m, now) !== 'post') continue;
      var p = preds[m.id]; if (!p) continue;
      var base = basePoints(p.home, p.away, m.attributes.homeTeam.score, m.attributes.awayTeam.score);
      if (base == null) continue;
      total += base * multiplierFor(m, reg);
      settled += 1;
    }
    return { total: total, settled: settled };
  }

  // ---------- fetch fixtures ----------
  // ---------- multi-competition lookup ----------
  // Build a teamId -> competitionID map by walking allMatches.
  var teamCompCache = null;
  function buildTeamCompMap() {
    teamCompCache = {};
    (state.allMatches || []).forEach(function (m) {
      var c = m.attributes.competitionID;
      if (m.attributes.homeTeam && m.attributes.homeTeam.teamID) teamCompCache[m.attributes.homeTeam.teamID] = c;
      if (m.attributes.awayTeam && m.attributes.awayTeam.teamID) teamCompCache[m.attributes.awayTeam.teamID] = c;
    });

  function teamCompId(teamId) {
    if (!teamCompCache) buildTeamCompMap();

  }
  function userCompId() {
    if (!state.registration) return null;

  function compLogoUrl(compId) {
    var c = COMPS[compId] || COMPS[DEFAULT_COMP_ID];
    return 'https://raw.githubusercontent.com/thenationalleague/tools/main/assets/divisions/' + c.logoFile;
  }
  function compName(compId) {
    var c = COMPS[compId] || COMPS[DEFAULT_COMP_ID];

  }

  // ---------- fetch fixtures (all 3 competitions in parallel) ----------
  function fetchFixtures() {
    return Promise.all(COMP_IDS.map(fetchCompetition))
      .then(function (results) {
        var all = [].concat.apply([], results);
        // Sort by KO; matchday/comp filtering happens in recomputeMatchday()
        return all.sort(function (a, b) { return dateOf(a).localeCompare(dateOf(b)); });
      });
  }
  function fetchCompetition(compId) {
    var all = [];
    function page(n) {
      var url = API_BASE + '/matches/?competitionID=' + compId + '&seasonID=' + SEASON_ID +
                '&sort=kickOffDateUTC&page.number=' + n + '&page.size=100';
      return fetch(url, { credentials:'omit' })
        .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status + ' (comp ' + compId + ')'); return r.json(); })
        .then(function (json) {
          var d = (json && json.data) || [];
          all = all.concat(d);
          var total = json && json.meta && json.meta.totalCount;
          if (d.length === 100 && (total == null || all.length < total) && n < MAX_PAGES) return page(n + 1);
        });
    }
    return page(1).then(function () { return all; });
  }

  // ---------- registration ----------
  // Returns the full team list across all 3 NL divisions, grouped by competition.
  function teamOptionsByComp() {
    var byComp = {}; // compId -> { teamId -> teamObj }
    (state.allMatches || []).forEach(function (m) {
      var c = m.attributes.competitionID;
      if (!byComp[c]) byComp[c] = {};
      [m.attributes.homeTeam, m.attributes.awayTeam].forEach(function (t) {
        if (!byComp[c][t.teamID]) {
          byComp[c][t.teamID] = { id: t.teamID, name: t.name, shortName: t.shortName, crest: t.crest, compId: c };
        }

    });
    // Convert to ordered arrays per comp, comps in fixed order
    var grouped = [];
    COMP_IDS.forEach(function (c) {
      if (!byComp[c]) return;
      var arr = Object.keys(byComp[c]).map(function (id) { return byComp[c][id]; });
      arr.sort(function (a, b) { return a.name.localeCompare(b.name); });
      grouped.push({ compId: c, name: COMPS[c].name, teams: arr });
    });
    return grouped;
  }
  // Flat list of every team (used to find a team by id at submit time).
  function allTeamsFlat() {
    var grouped = teamOptionsByComp();
    var flat = [];
    grouped.forEach(function (g) { flat = flat.concat(g.teams); });

  function renderRegistration() {

    // Try to default-select the user's TC favourite team if it exists across any division

      if (hit) defaultId = hit.id;
    }
    var optgroupHTML = grouped.map(function (g) {
      return '<optgroup label="' + $h(g.name) + '">' +
        g.teams.map(function (o) {
          return '<option value="' + $h(o.id) + '"' + (o.id === defaultId ? ' selected' : '') + '>' + $h(o.name) + '</option>';
        }).join('') +
      '</optgroup>';
    }).join('');
    register.innerHTML =
      '<div class="nlsp__register-card">' +
        '<div class="nlsp__hero" style="padding:0;">' +
          '<div class="nlsp__kicker">National League Predictor</div>' +
          '<h1>Welcome, ' + $h(state.user.forename) + '</h1>' +
        '</div>' +
        '<p style="color:var(--text-muted);font-size:14px;margin:6px 0 0;">' +
          'Pick your team from the National, North or South division. Your team\'s match each week scores <b style="color:var(--gold);">×3</b>.' +
        '</p>' +
        '<label for="nlsp-team-select">Your team</label>' +
        '<select id="nlsp-team-select">' +
          '<option value="">— choose a team —</option>' +
          optgroupHTML +
        '</select>' +
        '<div class="nlsp__lockwarn">This locks for the season. Pick carefully — you can\'t change your team later.</div>' +
        '<button class="nlsp__btn" id="nlsp-register-btn"' + (defaultId ? '' : ' disabled') + '>Confirm and lock my team</button>' +
      '</div>';

    var sel = document.getElementById('nlsp-team-select');
    var btn = document.getElementById('nlsp-register-btn');
    sel.addEventListener('change', function () { btn.disabled = !sel.value; });
    btn.addEventListener('click', function () {
      var teamId = sel.value; if (!teamId) return;
      var team = flat.filter(function (o) { return o.id === teamId; })[0];
      if (!team) return;
      btn.disabled = true; btn.textContent = 'Saving…';
      var payload = {
        teamId: team.id, teamName: team.name, crestUrl: team.crest || '',
        forename: state.user.forename, surnameInitial: state.user.surnameInitial,
        email: state.user.email || '',
        registeredAt: firebase.database.ServerValue.TIMESTAMP
      };
      fbDb.ref('users/' + state.user.id).set(payload).catch(function (err) {
        btn.disabled = false; btn.textContent = 'Confirm and lock my team';
        showBanner('Could not save registration: ' + err.message, 'err');
      });
    });
  }

  // ---------- date selector (matchday navigator) ----------
  // Horizontally scrollable strip of every matchday in the season. Default
  // selection is today (in BST) if any matches today, otherwise the next
  // upcoming matchday. Click a pill to navigate; the active pill scrolls
  // into view automatically.
  function renderDatebar() {
    var keys = uniqueMatchdayKeys();
    if (!keys.length) { datebarEl.innerHTML = ''; return; }
    var active = currentMatchdayKey();
    var today  = bstDateOf(new Date());
    datebarEl.className = 'nlsp__datebar';
    datebarEl.innerHTML = keys.map(function (k) {
      var d = new Date(k + 'T12:00:00Z');
      var label = d.toLocaleDateString('en-GB', { weekday:'short', day:'numeric', month:'short', timeZone:'Europe/London' });
      var cls = '';
      if (k === active) cls += ' is-active';
      if (k === today)  cls += ' is-today';
      return '<button data-md="' + $h(k) + '" class="' + cls.trim() + '">' + $h(label) + '</button>';
    }).join('');
    Array.prototype.forEach.call(datebarEl.querySelectorAll('button'), function (b) {
      b.addEventListener('click', function () {
        setSelectedMatchday(b.getAttribute('data-md'));
      });
    });
    enableDragScroll(datebarEl);
    // Centre the active pill in view
    var activeBtn = datebarEl.querySelector('button.is-active');
    if (activeBtn && activeBtn.scrollIntoView) {
      try { activeBtn.scrollIntoView({ behavior:'auto', inline:'center', block:'nearest' }); } catch (e) {}
    }
  }

  // Hold-and-drag horizontal scroll for any container. Doesn't interfere
  // with native click on child buttons unless the user actually drags
  // (>5px movement) — in which case the subsequent click is suppressed.
  function enableDragScroll(el) {
    if (el.__nlspDragWired) return;
    el.__nlspDragWired = true;
    var down = false, startX = 0, startScroll = 0, scrolledBy = 0;
    el.addEventListener('mousedown', function (e) {
      if (e.button !== 0) return;
      down = true; scrolledBy = 0;
      startX = e.pageX;
      startScroll = el.scrollLeft;
      el.classList.add('is-dragging');
    });
    document.addEventListener('mousemove', function (e) {
      if (!down) return;
      var dx = e.pageX - startX;
      // Only move once past a 12px deadzone — and only suppress the click
      // if we've actually moved the scroll position.
      if (Math.abs(dx) > 12) {
        e.preventDefault();
        var newScroll = startScroll - dx;
        if (newScroll !== el.scrollLeft) {
          el.scrollLeft = newScroll;
          scrolledBy = Math.abs(el.scrollLeft - startScroll);
        }
      }
    });
    document.addEventListener('mouseup', function () {
      if (!down) return;
      down = false;
      el.classList.remove('is-dragging');
    });
    // Suppress the synthetic click only when the drag actually scrolled
    // the container by more than a couple of pixels. A normal click — even
    // with tiny incidental cursor jitter — passes straight through.
    el.addEventListener('click', function (e) {
      if (scrolledBy > 4) { e.stopPropagation(); e.preventDefault(); }
      scrolledBy = 0;
    }, true);
  }

  // ---------- hero ----------
  // Greeting ribbon (small caps) + matchday date. The ×3 boost is no longer
  // surfaced here — it's surfaced via the gold left-edge on the own-team
  // fixture row plus a tooltip on that row.
  function renderHero() {
    var key = currentMatchdayKey();
    var midday = new Date(key + 'T12:00:00Z');
    var dateLabel = midday.toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'long', timeZone:'Europe/London' });
    // Greeting drops the team name now that the team crest lives in the header.
    var parts = [ $h((state.user.forename || '').toUpperCase()) ];
    hero.className = 'nlsp__hero';
    hero.innerHTML =
      '<div class="nlsp__greetline">' + parts.join(' · ') + '</div>' +
      '<h1>' + $h(dateLabel) + '</h1>';
  }

  // ---------- status bar ----------
  // The X/12 PREDICTED status bar is removed. The submit-bar count + the
  // per-row state already convey the same info more naturally.
  function renderStatus() { statusbar.innerHTML = ''; }

  // ---------- fixture rendering ----------
  function renderFixtures() {
    if (!state.matches.length) {
      fixtures.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-muted);font-size:13px;">No National Division fixtures on ' + $h(currentMatchdayKey()) + '.</div>';
      return;
    }
    var now = simNow();
    fixtures.innerHTML = state.matches.map(function (m) { return rowHTML(m, now); }).join('');
    wireRow();
  }

  function rowHTML(m, now) {
    var a = m.attributes;
    var s = stateOf(m, now);
    var ko = koOf(m);
    var reg = state.registration;
    var isOwn = isOwnTeamMatch(m, reg);
    var p = state.predictions[m.id];
    var d = state.drafts[m.id];

    // Pre-KO has three sub-states: empty, submitted, editing
    var preState = '';
    if (s === 'pre') {
      if (!p) preState = 'empty';
      else if (state.editing[m.id]) preState = 'editing';
      else preState = 'submitted';
    }

    // -------- Meta strip (top of row) --------
    var meta = '';
    var rowMod = '';
    if (s === 'future') {
      // > 7 days from KO — predictions not yet open
      var dayLabel = ko.toLocaleDateString('en-GB', { weekday:'short', day:'numeric', month:'short' });
      meta = '<span class="nlsp__lock">Opens ' + $h(dayLabel) + '</span>';
    } else if (s === 'pre') {
      meta = '<span>' + $h(fmtBST(ko)) + '</span>';
    } else if (s === 'live') {
      // Pulse dot + LIVE label + your prediction inline
      var pickLive = (p && p.home != null) ? '<span class="nlsp__pickline">Prediction <b>' + p.home + '–' + p.away + '</b></span>' : '';
      meta = '<span class="nlsp__livedot" aria-hidden="true"></span><span class="nlsp__livelbl">Live</span>' + pickLive;
    } else if (s === 'post') {
      var realH = a.homeTeam.score, realA = a.awayTeam.score;
      if (p && p.home != null) {
        var b = basePoints(p.home, p.away, realH, realA);
        var mult = multiplierFor(m, reg);
        var pts = (b == null) ? null : b * mult;
        var verdictWord = b === 3 ? 'Exact' : b === 1 ? 'Right result' : 'Wrong';
        var ptsCls, modCls;
        if (b === 3) { ptsCls = 'is-exact'; modCls = 'is-exact'; }
        else if (b === 1) { ptsCls = 'is-right'; modCls = 'is-right'; }
        else { ptsCls = 'is-wrong'; modCls = 'is-wrong'; }
        rowMod = ' ' + modCls;
        meta =
          '<span class="nlsp__ftlabel">FT</span>' +
          '<span class="nlsp__pickline">Your pick <b>' + p.home + '–' + p.away + '</b> · ' + verdictWord + '</span>' +
          '<span class="nlsp__pts ' + ptsCls + '">+' + (pts != null ? pts : 0) + '</span>';
      } else {
        meta = '<span class="nlsp__ftlabel">FT</span><span class="nlsp__pickline" style="opacity:.7;">No prediction</span>';
      }
    } else if (s === 'postponed') {
      meta = '<span class="nlsp__voidlbl">Postponed</span><span class="nlsp__pickline" style="opacity:.7;">Prediction voided</span>';
      rowMod = ' is-void';
    } else if (s === 'abandoned') {
      meta = '<span class="nlsp__voidlbl">Abandoned</span><span class="nlsp__pickline" style="opacity:.7;">Prediction voided</span>';
      rowMod = ' is-void';
    }

    // -------- Score cell renderer (per side) --------
    function scoreCell(side) {
      var real, cls = 'nlsp__teamscore';
      if (s === 'pre' && (preState === 'empty' || preState === 'editing')) {
        var fromDraft = (d && d[side] != null) ? d[side] : (p && p[side] != null ? p[side] : '');
        return '<div class="' + cls + '">' +
          '<input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="2" autocomplete="off" placeholder="–" data-side="' + side + '" data-m="' + $h(m.id) + '" value="' + $h(fromDraft) + '" aria-label="' + $h((side === 'home' ? a.homeTeam : a.awayTeam).name + ' score') + '">' +
        '</div>';
      }
      if (s === 'pre' && preState === 'submitted') {
        return '<div class="' + cls + ' is-pred">' + (p && p[side] != null ? p[side] : '–') + '</div>';
      }
      // live: show user's prediction (muted) since we don't have live scores
      if (s === 'live') {
        return '<div class="' + cls + ' is-pred">' + (p && p[side] != null ? p[side] : '–') + '</div>';
      }
      if (s === 'future' || s === 'postponed' || s === 'abandoned') {
        return '<div class="' + cls + ' is-pred">–</div>';
      }
      // post: show the real final score
      real = (side === 'home' ? a.homeTeam : a.awayTeam).score;
      return '<div class="' + cls + '">' + (real != null ? real : '?') + '</div>';
    }

    // -------- Team line --------
    function teamLine(t, side) {
      var full  = t.name || t.shortName || '';
      var short = t.shortName || t.name || '';
      return '<div class="nlsp__teamline">' +
        crestImg(t.crest, full) +
        '<span class="nlsp__tname">' +
          '<span class="nlsp__tname-full">'  + $h(full)  + '</span>' +
          '<span class="nlsp__tname-short">' + $h(short) + '</span>' +
        '</span>' +
        scoreCell(side) +
      '</div>';
    }

    // -------- Row-level affordances --------
    var rowAffordance = '';
    if (s === 'pre' && preState === 'submitted') {
      rowAffordance = '<button class="nlsp__rowedit" data-edit="' + $h(m.id) + '" aria-label="Edit prediction">Edit</button>';
    } else if (s === 'pre' && preState === 'editing') {
      var d2 = state.drafts[m.id] || {};
      var canSave = (d2.home != null && d2.away != null);
      rowAffordance =
        '<div class="nlsp__editcontrols">' +
          '<button class="nlsp__btn-cancel" data-canceledit="' + $h(m.id) + '">Cancel</button>' +
          '<button class="nlsp__btn-save"   data-savedit="'   + $h(m.id) + '"' + (canSave ? '' : ' disabled') + '>Save</button>' +
        '</div>';
    }

    var rowCls = 'nlsp__row';
    if (isOwn) rowCls += ' is-mult';
    if (s === 'live') rowCls += ' is-live';
    if (preState === 'editing') rowCls += ' is-editing';
    rowCls += rowMod;
    var rowTitle = isOwn && reg
      ? ' title="Your ' + (reg.teamName || 'team') + ' predictions score triple."'
      : '';

    return '<div class="' + rowCls + '"' + rowTitle + '>' +
      '<div class="nlsp__meta">' + meta + '</div>' +
      teamLine(a.homeTeam, 'home') +
      teamLine(a.awayTeam, 'away') +
      rowAffordance +
    '</div>';
  }

  function wireRow() {
    Array.prototype.forEach.call(fixtures.querySelectorAll('input[data-m]'), function (inp) {
      inp.addEventListener('input', function () {
        var cleaned = inp.value.replace(/[^0-9]/g, '').slice(0, 2);
        if (cleaned !== inp.value) inp.value = cleaned;
        var mid = inp.getAttribute('data-m');
        var side = inp.getAttribute('data-side');
        state.drafts[mid] = state.drafts[mid] || {};
        state.drafts[mid][side] = (cleaned === '' ? null : Math.max(0, Math.min(20, parseInt(cleaned, 10))));
        renderSubmitbar(); renderStatus();
      });
      inp.addEventListener('keydown', function (e) {
        // Enter on a row in edit mode triggers Save (explicit confirm).
        if (e.key === 'Enter') {
          var mid = inp.getAttribute('data-m');
          if (state.editing[mid]) saveEdited(mid);
          else inp.blur();
        }
      });
    });

    // Per-row Edit (re-open a submitted row)
    Array.prototype.forEach.call(fixtures.querySelectorAll('button[data-edit]'), function (b) {
      b.addEventListener('click', function () {
        var mid = b.getAttribute('data-edit');
        state.editing[mid] = true;
        var existing = state.predictions[mid];
        if (existing) state.drafts[mid] = { home: existing.home, away: existing.away };
        renderFixtures(); renderSubmitbar(); renderStatus();
        var first = fixtures.querySelector('input[data-m="' + mid + '"][data-side="home"]');
        if (first) { first.focus(); first.select && first.select(); }
      });
    });

    // Cancel edit — discard draft, return to locked view
    Array.prototype.forEach.call(fixtures.querySelectorAll('button[data-canceledit]'), function (b) {
      b.addEventListener('click', function () {
        var mid = b.getAttribute('data-canceledit');
        delete state.editing[mid];
        delete state.drafts[mid];
        renderFixtures(); renderSubmitbar(); renderStatus();
      });
    });

    // Save edited prediction — explicit commit
    Array.prototype.forEach.call(fixtures.querySelectorAll('button[data-savedit]'), function (b) {
      b.addEventListener('click', function () {
        var mid = b.getAttribute('data-savedit');
        saveEdited(mid);
      });
    });
  }

  function saveEdited(mid) {
    var d = state.drafts[mid]; if (!d) return;
    if (d.home == null || d.away == null) return;
    var m = state.matches.filter(function (x) { return x.id === mid; })[0];
    if (!m || stateOf(m, simNow()) !== 'pre') return;

    // Clear edit state up front so concurrent RTDB listener re-renders don't
    // race against us and leave the row stuck in the editor (this was the
    // actual save-doesn't-close bug — listener fired before .then() and saw
    // state.editing[mid] still true).
    delete state.editing[mid];

    var existing = state.predictions[mid];
    if (existing && existing.home === d.home && existing.away === d.away) {
      delete state.drafts[mid];
      renderFixtures(); renderSubmitbar(); renderReset();
      return;
    }
    var payload = {
      home: d.home, away: d.away, joker: false,
      submittedAt: firebase.database.ServerValue.TIMESTAMP
    };
    fbDb.ref('predictions/' + state.user.id + '/' + currentMatchdayKey() + '/' + mid).update(payload)
      .then(function () {
        delete state.drafts[mid];
        flashSaveTick();
        renderFixtures(); renderSubmitbar(); renderReset();
      })
      .catch(function (err) {
        // Restore edit state if RTDB rejected the write
        state.editing[mid] = true;
        renderFixtures();
        showBanner('Save failed: ' + err.message, 'err');
      });
  }

  // Returns the matchIds that are 'awaiting' (no committed prediction, still pre-KO)
  function awaitingIds() {
    var now = simNow();
    var ids = [];
    state.matches.forEach(function (m) {
      if (stateOf(m, now) !== 'pre') return;
      if (state.predictions[m.id]) return; // already submitted
      ids.push(m.id);
    });
    return ids;
  }
  // Of those awaiting, count how many have a complete (home + away) draft
  function awaitingReadyCount() {
    return awaitingIds().reduce(function (n, mid) {
      var d = state.drafts[mid];
      return n + ((d && d.home != null && d.away != null) ? 1 : 0);
    }, 0);
  }

  function renderSubmitbar() {
    var await_ids = awaitingIds();
    if (!await_ids.length) { submitb.innerHTML = ''; return; }
    var ready = awaitingReadyCount();
    var canSubmit = (ready === await_ids.length);
    submitb.innerHTML =
      '<div class="nlsp__submitbar">' +
        '<div class="nlsp__submitmsg">' +
          '<b>' + ready + '/' + await_ids.length + '</b> filled — ' +
          (canSubmit ? 'ready to submit' : 'fill in every match to submit') +
        '</div>' +
        '<button class="nlsp__btn" id="nlsp-submit"' + (canSubmit ? '' : ' disabled') +
          ' style="margin-left:auto;">Submit predictions</button>' +
      '</div>';
    var btn = document.getElementById('nlsp-submit');
    if (btn) btn.addEventListener('click', submitAllAwaiting);
  }

  function submitAllAwaiting() {
    var ids = awaitingIds();
    var updates = {};
    var ts = firebase.database.ServerValue.TIMESTAMP;
    ids.forEach(function (mid) {
      var d = state.drafts[mid];
      if (!d || d.home == null || d.away == null) return;
      updates[mid] = { home: d.home, away: d.away, joker: false, submittedAt: ts };
    });
    if (Object.keys(updates).length === 0) return;
    var btn = document.getElementById('nlsp-submit');
    if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }
    fbDb.ref('predictions/' + state.user.id + '/' + currentMatchdayKey()).update(updates)
      .then(function () {
        Object.keys(updates).forEach(function (mid) { delete state.drafts[mid]; });
        flashSaveTick();
      })
      .catch(function (err) {
        showBanner('Submit failed: ' + err.message, 'err');
        if (btn) { btn.disabled = false; btn.textContent = 'Submit predictions'; }
      });
  }

  // ---------- custom confirm modal ----------
  // Replaces window.confirm() for actions like "Reset all predictions".
  var modalEl = document.getElementById('nlsp-modal');
  function showConfirm(opts) {
    return new Promise(function (resolve) {
      modalEl.innerHTML =
        '<div class="nlsp__modal-card" role="dialog" aria-modal="true">' +
          '<h3>' + $h(opts.title || 'Are you sure?') + '</h3>' +
          (opts.message ? '<p>' + $h(opts.message) + '</p>' : '') +
          '<div class="nlsp__modal-actions">' +
            '<button class="nlsp__modal-cancel"  type="button">' + $h(opts.cancel || 'Cancel') + '</button>' +
            '<button class="nlsp__modal-confirm" type="button">' + $h(opts.confirm || 'Confirm') + '</button>' +
          '</div>' +
        '</div>';
      modalEl.hidden = false;
      function close(result) {
        modalEl.hidden = true;
        modalEl.innerHTML = '';
        resolve(result);
      }
      modalEl.querySelector('.nlsp__modal-cancel').addEventListener('click', function () { close(false); });
      modalEl.querySelector('.nlsp__modal-confirm').addEventListener('click', function () { close(true); });
      // Click backdrop = cancel
      modalEl.addEventListener('click', function (e) { if (e.target === modalEl) close(false); }, { once: true });
    });
  }

  // ---------- reset all predictions ----------
  // Shown only while every match is still pre-KO — once any has kicked off,
  // the matchday is effectively settled in stages and "reset all" stops
  // making sense.
  function allMatchesPreKO() {
    var now = simNow();
    for (var i = 0; i < state.matches.length; i++) {
      var s = stateOf(state.matches[i], now);
      // future / pre = not yet kicked off, so still resettable.
      // live / post / postponed / abandoned all freeze the matchday.
      if (s !== 'pre' && s !== 'future') return false;
    }
    return state.matches.length > 0;
  }
  function renderReset() {
    var hasAny = Object.keys(state.predictions).length > 0;
    if (!hasAny || !allMatchesPreKO()) { resetEl.innerHTML = ''; return; }
    resetEl.className = 'nlsp__reset';
    resetEl.innerHTML = '<button class="nlsp__resetbtn" id="nlsp-reset-btn">Reset all predictions</button>';
    var btn = document.getElementById('nlsp-reset-btn');
    if (btn) btn.addEventListener('click', function () {
      showConfirm({
        title:   'Reset all predictions?',
        message: 'Wipes every prediction you\'ve made for this matchday. This can\'t be undone.',
        confirm: 'Reset',
        cancel:  'Cancel'
      }).then(function (ok) {
        if (!ok) return;
        btn.disabled = true; btn.textContent = 'Resetting…';
        // The RTDB rules only grant .write at $matchId, not at the parent
        // $matchday. So deleting the whole subtree at once 403s. We instead
        // do a multi-path update of nulls — each individual delete is
        // allowed by the per-$matchId .write rule.
        var nulls = {};
        Object.keys(state.predictions).forEach(function (mid) { nulls[mid] = null; });
        if (Object.keys(nulls).length === 0) {
          state.drafts = {}; state.editing = {};
          setBannerOK('Nothing to reset.');
          return;
        }
        fbDb.ref('predictions/' + state.user.id + '/' + currentMatchdayKey()).update(nulls)
          .then(function () {
            state.drafts = {}; state.editing = {};
            setBannerOK('All predictions reset.');
          })
          .catch(function (err) {
            showBanner('Reset failed: ' + err.message, 'err');
            btn.disabled = false; btn.textContent = 'Reset all predictions';
          });
      });
    });
  }

  // ---------- league table ----------
  function renderTable() {
    if (!state.matches.length) { tableEl.innerHTML = ''; return; }
    var now = simNow();
    var myComp = userCompId();
    var userIds = Object.keys(state.allUsers);
    if (state.user && userIds.indexOf(state.user.id) === -1 && state.registration) userIds.push(state.user.id);

    var rows = userIds.map(function (uid) {
      var reg = (uid === state.user.id) ? state.registration : state.allUsers[uid];
      var t = totalForUser(uid, now);
      return { uid: uid, reg: reg, total: t.total, settled: t.settled };
    }).filter(function (r) {
      if (!r.reg) return false;
      // Per-division leaderboard — only fans whose team is in your competition
      if (!myComp) return true;
      var theirComp = teamCompId(r.reg.teamId);
      return !theirComp || theirComp === myComp;
    }).sort(function (a, b) { return b.total - a.total; });

    if (!rows.length) { tableEl.innerHTML = ''; return; }

    var inner =
      '<div class="nlsp__tablehead">' +
        '<div class="nlsp__kicker">Leaderboard</div>' +
        '<div class="nlsp__tsub">' +
          (rows[0].settled ? rows[0].settled + ' settled · ' : '') +
          rows.length + ' player' + (rows.length === 1 ? '' : 's') +
        '</div>' +
      '</div>' +
      rows.map(function (r, i) {
        var name = $h(r.reg.forename) + ' ' + $h(r.reg.surnameInitial || '');
        var cls = 'nlsp__trow' + (r.uid === state.user.id ? ' is-you' : '');
        return '<div class="' + cls + '">' +
          '<span class="nlsp__rank">' + (i + 1) + '</span>' +
          crestImg(r.reg.crestUrl, r.reg.teamName, 22) +
          '<span>' + name + (r.uid === state.user.id ? ' <span class="nlsp__youlbl">(you)</span>' : '') + '</span>' +
          '<span class="nlsp__pts">' + r.total + '</span>' +
        '</div>';
      }).join('');

    tableEl.className = 'nlsp__table';
    tableEl.innerHTML = inner;
  }

  // ---------- sim bar (dev) ----------
  // ---------- sim bar (datetime picker) ----------
  // Lets you pick any moment as 'now' so you can preview pre-KO, in-play,
  // post-FT or even mid-season states. The datetime-local value is treated
  // as the user's local time; new Date(<value>) handles the conversion.
  function pad2(n) { n = String(n); return n.length < 2 ? '0' + n : n; }
  function dateInputValue(d) {
    if (!d) return '';
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  }
  function timeInputValue(d) {
    if (!d) return '';
    return pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  }
  function renderSimBar() {
    var d = simNow();
    var live = state.sim.fixed
      ? 'Sim · ' + d.toLocaleString('en-GB', { weekday:'short', day:'numeric', month:'short', hour:'2-digit', minute:'2-digit', timeZone:'Europe/London' }) + ' BST'
      : 'Live clock';
    simEl.className = 'nlsp__simbar';
    // Separate date + time inputs — datetime-local has a quirk where typing
    // a single digit into the minutes field auto-completes (e.g. "4" -> "04")
    // and prevents you typing "45". Splitting it gives you natural typing.
    simEl.innerHTML =
      '<span class="nlsp__simlbl">Sim now</span>' +
      '<input type="date" id="nlsp-sim-date" value="' + $h(dateInputValue(d)) + '">' +
      '<input type="time" id="nlsp-sim-time" value="' + $h(timeInputValue(d)) + '" step="60">' +
      '<button id="nlsp-sim-now" class="nlsp__sim-now-btn">Now</button>' +
      '<span class="nlsp__clock">' + $h(live) + '</span>';
    var dateInput = document.getElementById('nlsp-sim-date');
    var timeInput = document.getElementById('nlsp-sim-time');
    function commit() {
      var dv = dateInput.value || dateInputValue(d);
      var tv = timeInput.value || timeInputValue(d);
      if (!dv) return;
      var picked = new Date(dv + 'T' + (tv || '12:00'));
      if (isNaN(picked.getTime())) return;
      setSimFixed(picked);
    }
    dateInput.addEventListener('change', commit);
    timeInput.addEventListener('change', commit);
    document.getElementById('nlsp-sim-now').addEventListener('click', clearSimFixed);
  }

  // ---------- RTDB listeners ----------
  function listenAll() {
    fbDb.ref('users').on('value', function (snap) {
      state.allUsers = snap.val() || {};
      state.registration = state.allUsers[state.user.id] || null;
      if (!state.registration) {
        hideGate();
        renderRegistration();
      } else {
        hideGate();
        register.hidden = true; main.hidden = false;
        // Registration may have just landed — sponsor + matchday filtering
        // both depend on user comp, so refresh sponsor and recompute the
        // matchday view before rendering.
        renderSponsor();
        recomputeMatchday();
        renderDatebar(); renderHero(); renderFixtures(); renderSubmitbar(); renderReset(); renderTable(); renderSimBar();
      }
    });
    fbDb.ref('predictions').on('value', function (snap) {
      state.allPredsRaw = snap.val() || {};
      recomputePredictionsFromRaw();
      if (!main.hidden) {
        renderFixtures(); renderSubmitbar(); renderReset(); renderTable();
      }
    });
  }

  // ---------- signed-out experience ----------
  // ---------- gate card (loading + signed-out) ----------
  var gateEl = document.getElementById('nlsp-gate');

  function renderGateLoading() {
    gateEl.hidden = false;
    register.hidden = true;
    main.hidden = true;
    hideBanner();
    gateEl.innerHTML =
      '<div class="nlsp__gate-card">' +
        '<img class="nlsp__gate-mark" src="' + NLPLUS_LOGO_URL + '" alt="NL+" ' +
          'onerror="this.onerror=null;this.style.display=\'none\';">' +
        '<div class="nlsp__gate-spinner" aria-hidden="true"></div>' +
        '<h2>Score Predictor</h2>' +
        '<p>Loading…</p>' +
      '</div>';
  }
  function renderGateSignIn() {
    gateEl.hidden = false;
    register.hidden = true;
    main.hidden = true;
    hideBanner();
    gateEl.innerHTML =
      '<div class="nlsp__gate-card">' +
        '<img class="nlsp__gate-mark" src="' + NLPLUS_LOGO_URL + '" alt="NL+" ' +
          'onerror="this.onerror=null;this.style.display=\'none\';">' +
        '<h2>Sign in with NL+ to play for free</h2>' +
        '<p>Pick scores for every match. Your team’s game is worth triple. Climb the leaderboard.</p>' +
        '<a class="nlsp__btn" href="' + $h(signInHref()) + '">Sign in with NL+</a>' +
      '</div>';
  }
  function hideGate() { gateEl.hidden = true; gateEl.innerHTML = ''; }

  function signInHref() {
    // Match the URL pattern the NL site itself uses when bouncing fans
    // through SA SSO (verified against a live header sign-in link).
    //
    // Both returnvisitorurl and successredirecturl point to the current
    // page so the fan lands back on the predictor regardless of which
    // subdomain hosted the embed (www, beta, etc.).
    var here = '';
    try { here = window.location.href; } catch (e) {}
    var enc = encodeURIComponent(here);
    return 'https://signin.thenationalleague.org.uk/auth/login' +
      '?tenantid=' + encodeURIComponent(SSO_TENANT_ID) +
      '&returnvisitorurl=' + enc +
      '&successredirecturl=' + enc +
      '&loginSuccess=true' +
      '&mandatory=false';
  }

  // ---------- boot ----------
  // The SSO cookie is sometimes not yet on document.cookie at initial script
  // execution (Nuxt hydration / SSO middleware writes it asynchronously). We
  // poll for up to ~4s before deciding the user is signed out. During that
  // window the gate card sits there with a spinner + "Loading…".
  function tryDecodeClaims() {
    var jwt = readCookie('_gc_sa_sso_access');
    return decodeJwtPayload(jwt);
  }
  function waitForJwt(maxMs) {
    return new Promise(function (resolve) {
      var c = tryDecodeClaims();
      if (c && c.id) return resolve(c);
      var start = Date.now();
      var iv = setInterval(function () {
        var got = tryDecodeClaims();
        if (got && got.id) { clearInterval(iv); resolve(got); return; }
        if (Date.now() - start >= maxMs) { clearInterval(iv); resolve(null); }
      }, 200);
    });
  }

  (function boot() {
    // Paint sponsor + footer immediately — brand frame visible during loading
    // and signed-out states. Safe to call here because all helpers are now
    // defined.
    renderSponsor();
    renderFooter();
    renderGateLoading();
    waitForJwt(4000).then(function (claims) {
      if (!claims || !claims.id) { renderGateSignIn(); return; }
      // Don't hideGate() yet — let it stay through Firebase init + fixtures
      // fetch. The first listenAll listener firing hides it.
      startSignedIn(claims);
    });
  })();

  function startSignedIn(claims) {
    state.user = {
      id: claims.id,
      forename: claims.forename || 'there',
      surname:  claims.surname  || '',
      surnameInitial: (claims.surname || '').charAt(0).toUpperCase(),
      email:    claims.email    || '',
      favTeamName: claims.favourite_team || null
    };

    state.sim.mode = parseSimMode();
    if (state.sim.mode) {
      state.sim.index = state.sim.mode.index;
      if (state.sim.mode.autoDemo) startDemo();
    }

    Promise.all([
      loadFirebase().then(function () {
        var exists = firebase.apps && firebase.apps.some(function (a) { return a.name === APP_NAME; });
        fbApp  = exists ? firebase.app(APP_NAME) : firebase.initializeApp(FIREBASE_CONFIG, APP_NAME);
        fbAuth = firebase.auth(fbApp);
        fbDb   = firebase.database(fbApp);
        return fbAuth.signInAnonymously();
      }).then(function () { state.fbAuthed = true; }),
      fetchFixtures().then(function (ms) {
        state.allMatches = ms;
        teamCompCache = null; // invalidate so it rebuilds from fresh data
      })
    ]).then(function () {
      hideBanner();
      // If a sim datetime came from the URL, apply it before first render
      var simParam = parseSimMode();
      if (simParam) state.sim.fixed = simParam;
      recomputeMatchday();
      listenAll();
    }).catch(function (err) {
      showBanner('Could not start the predictor: ' + (err && err.message ? err.message : err), 'err');
    });
  }
})();
</script>
