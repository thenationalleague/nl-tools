  ============================================================================
  NL MATCH HUB  —  standalone full-page matchday replay
  ============================================================================
  One matchday, three lenses sharing ONE timeline model — side by side on
  desktop (cards | map | ticker), switched one-at-a-time on mobile:
    • MAP    — full-bleed England+Wales map, pins are mini-scoreboards,
               goals pull the camera into the ground and update in situ.
    • CARDS  — responsive grid of match cards (crests · live score · scorers).
    • TICKER — vidiprinter strip, events typed in real-minute order.

  DELIVERY: a self-contained, FULL-PAGE HTML app (its own document, own
  viewport) — a full-screen experience on mobile, not a CMS-inline card.
  Served at its own URL and iframed where it needs embedding. This is NOT part
  of the gated tools system: no auth-guard, no Firebase gate, no nl-brand.css,
  no topbar/portal wiring. It only BORROWS the Carbona font + brand colour
  tokens (declared inline). Everything is inline; no external scripts.

  MODE: REPLAY of a FINISHED matchday. The real-minute clock already models a
  live clock, so "live later" is a DATA SWAP (point window.__DATA__ at a live
  feed), not a rebuild. Match state is DERIVED from a single wall clock.

  DATA: window.__DATA__ below is REAL National League data — Round 39
  (2026-03-21): fixtures, final scores, scorers, minutes and red cards from the
  season events export, with club identity (coords/colours) joined from the
  canonical assets/data/clubs-meta.json by optaID, and full 24-team standings.
  All fixtures reconcile 100% to their results. A production build can swap this
  __DATA__ block (or point it at a live feed) — the timeline model is unchanged.

<div id="nlHub" aria-label="National League Match Hub">
  <div class="nlh__topbar">
    <div class="nlh__brandrow">
      <span class="nlh__wordmark">MATCH&nbsp;HUB</span>
      <span class="nlh__round" id="nlhRound"></span>
      <button class="nlh__loadbtn" id="nlhLoadBtn">Choose matchday</button>
    </div>
    <div class="nlh__switch" role="tablist" aria-label="View">
      <button class="nlh__seg is-active" data-view="map"    role="tab">Map</button>
      <button class="nlh__seg"           data-view="cards"  role="tab">Cards</button>
      <button class="nlh__seg"           data-view="ticker" role="tab">Ticker</button>
    </div>
  </div>

  <!-- Desktop: three panels live at once (cards | map | ticker).
       Mobile: the topbar switcher shows one at a time. -->
  <div class="nlh__main">
    <!-- CARDS -->
    <section class="nlh__view nlh__cards" data-view="cards">
      <div class="nlh__panelhead">Matches</div>
      <div class="nlh__grid" id="nlhGrid"></div>
    </section>
    <!-- MAP — the dark island -->
    <section class="nlh__view nlh__stage is-active" data-view="map" id="nlhStage">
      <div class="nlh__mapzoom" id="nlhMapZoom">
        <svg class="nlh__mapsvg" id="nlhMapSvg" viewBox="0 0 1000 1333" preserveAspectRatio="xMidYMid meet" aria-hidden="true"></svg>
        <div class="nlh__pins" id="nlhPins"></div>
      </div>
      <div class="nlh__beat" id="nlhBeat" hidden></div>
      <!-- hero lower third — the persistent score updater during focus -->
      <div class="nlh__hero" id="nlhHero" hidden></div>
      <!-- goal takeover — team-colour wipe that runs before the lockup lands -->
      <div class="nlhfx" id="nlhFx"></div>
    </section>
    <!-- TICKER -->
    <section class="nlh__view nlh__ticker" data-view="ticker">
      <div class="nlh__panelhead">Vidiprinter</div>
      <ol class="nlh__feed" id="nlhFeed"></ol>
    </section>
    <!-- LIVE TABLE — its own column on wide desktop; narrower screens use the sheet -->
    <section class="nlh__tablecol">
      <div class="nlh__panelhead">Table · <span id="nlhTableColState"></span></div>
      <div class="nlh__tablecolwrap"><table class="nlh__table"><tbody id="nlhTableColBody"></tbody></table></div>
    </section>
  </div>

  <!-- FT league-table sheet — overlays the whole hub -->
  <div class="nlh__sheet" id="nlhSheet" hidden>
    <div class="nlh__sheetcard">
      <div class="nlh__sheethead">
        <span id="nlhSheetTitle">League table</span>
        <button class="nlh__sheetclose" id="nlhSheetClose" aria-label="Close table">&times;</button>
      </div>
      <div class="nlh__tablewrap"><table class="nlh__table"><tbody id="nlhTableBody"></tbody></table></div>
    </div>
  </div>

  <!-- Matchday setup — pick any completed date, join at any time, set the pace -->
  <div class="nlh__setup" id="nlhSetup" hidden>
    <div class="nlh__setupcard">
      <div class="nlh__setuphead"><span>Choose a matchday</span><button class="nlh__sheetclose" id="nlhSetupClose" aria-label="Close">&times;</button></div>
      <div class="nlh__fieldrow">
        <label class="nlh__field">Date<input type="date" id="nlhSetDate"></label>
        <label class="nlh__field">Competition<select id="nlhSetComp">
          <option value="nl">National League</option>
          <option value="north">National North</option>
          <option value="south">National South</option>
        </select></label>
      </div>
      <div class="nlh__fieldrow">
        <label class="nlh__field">Join the day<select id="nlhSetStart">
          <option value="">From the build-up</option>
          <option value="clock">At a time on the clock</option>
        </select></label>
        <label class="nlh__field" id="nlhSetTimeWrap" hidden>Clock time<input type="time" id="nlhSetTime" value="14:55"></label>
      </div>
      <label class="nlh__field">Pace — one match minute takes<select id="nlhSetPace">
        <option value="0.5">Half a second</option>
        <option value="1" selected>One second</option>
        <option value="2">Two seconds</option>
        <option value="60">Real time (a full minute)</option>
      </select></label>
      <label class="nlh__check"><input type="checkbox" id="nlhSetReal" checked> Real kick-off times — matches stagger through the day</label>
      <div class="nlh__setupfoot">
        <span class="nlh__setupstatus" id="nlhSetStatus"></span>
        <button class="nlh__setupgo" id="nlhSetGo">Load</button>
      </div>
    </div>
  </div>

  <div class="nlh__comm" id="nlhComm" aria-live="polite">
    <span class="nlh__commdot"></span>
    <span class="nlh__commtext" id="nlhCommText"></span>
  </div>

  <div class="nlh__controls">
    <button class="nlh__play" id="nlhPlay" aria-label="Play">
      <svg class="nlh__ico-play"  viewBox="0 0 24 24" width="20" height="20"><path d="M8 5v14l11-7z"/></svg>
      <svg class="nlh__ico-pause" viewBox="0 0 24 24" width="20" height="20" hidden><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
    </button>
    <div class="nlh__scrub" id="nlhScrub"><div class="nlh__scrubfill" id="nlhScrubFill"></div></div>
    <span class="nlh__clock" id="nlhClock">0'</span>
    <button class="nlh__restart" id="nlhRestart" aria-label="Restart" title="Restart">
      <svg viewBox="0 0 24 24" width="17" height="17"><path d="M12 5V2L7 7l5 5V8a5 5 0 1 1-5 5H5a7 7 0 1 0 7-8z"/></svg>
    </button>
    <button class="nlh__speed" id="nlhSpeed" title="Playback speed">1&times;</button>
  </div>

  <div class="nlh__foot">
    <span id="nlhFootTable" class="nlh__footlink">League table</span>
    <span class="nlh__footnote">Replay · <span id="nlhFootDate">Sat 21 Mar 2026</span> <span class="nlh__ver" id="nlhVer"></span></span>
  </div>
</div>

      url("https://use.typekit.net/af/184cf2/0000000000000000774c3175/31/d?primer=7cdcb44be4a7db8877ffa5c0007b8dd865b3bbc383831fe2ea177f62257a9191&fvd=n4&v=3") format("woff");
  font-display:swap;font-style:normal;font-weight:200 900;font-stretch:normal;
}

html,body{margin:0;padding:0;height:100%;background:#f4f6f9}
body{overflow:hidden}

#nlHub{
  /* ==== MATCH HUB CANON — tokens derived from nl-brand.css (inline: this
       page only BORROWS the brand, it is not a gated tool). Light chrome;
       the map keeps its night-navy island look via the --ink-* set. ==== */
  --primary:#9e0000; --primary-600:#7e0000; --primary-700:#600000;
  --blue-light:#eef2ff;
  --navy:#223b7c; --navy-100:#e2e6f0; --navy-300:#9baac9; --navy-600:#192e63; --navy-800:#091533; --navy-900:#03081b;
  --red:#d4380d; --green:#1a7030; --green-light:#edf7ee; --amber:#c96f15; --blue:#1565c0;
  --live:#4ade80;
  /* light chrome (page + panels) */
  --bg:#f4f6f9; --surface:#ffffff; --line:#dde3ed; --text:#1a2a44; --muted:#5a6a82;
  /* the dark island — the map and its overlays only */
  --ink:#060b18; --ink-2:#0f1a30; --ink-line:#243352; --ink-text:#eef2f9; --ink-muted:#9fb0cc;
  /* NL position bands (league-table cells) */
  --pos-champ:#7F99DC; --pos-po:#3760C8; --pos-releg:#192C5C;
  /* fluid type scale — brand clamps, one register up (broadcast size) */
  --fs-xs:clamp(11px,.6vw + 8px,14px);
  --fs-sm:clamp(13px,.75vw + 9px,16px);
  --fs-base:clamp(15px,.85vw + 11px,18px);
  --fs-md:clamp(17px,1vw + 12px,22px);
  --fs-lg:clamp(21px,1.2vw + 15px,28px);
  --radius:10px; --radius-lg:14px;
  --shadow:0 2px 12px rgba(10,22,40,.08);

  box-sizing:border-box;
  font-family:"carbona-variable","carbona",system-ui,sans-serif;
  font-variation-settings:"wght" 400;
  -webkit-font-smoothing:antialiased;
  position:relative;
  width:100%; max-width:1700px; margin:0 auto;
  height:100vh; height:100dvh;
  display:flex; flex-direction:column;
  color:var(--text);
  background:var(--bg);
  overflow:hidden;
}
#nlHub *,#nlHub *::before,#nlHub *::after{box-sizing:border-box}
#nlHub button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
/* our display:flex rules out-specify the UA [hidden] default — restore it */
#nlHub [hidden]{display:none!important}

/* ===== Topbar ===== */
#nlHub .nlh__topbar{flex:0 0 auto;display:flex;flex-direction:column;gap:10px;padding:max(14px,env(safe-area-inset-top)) 18px 12px;background:var(--surface);border-bottom:1px solid var(--line)}
#nlHub .nlh__brandrow{display:flex;align-items:baseline;gap:12px}
#nlHub .nlh__wordmark{font-variation-settings:"wght" 900;font-weight:900;letter-spacing:.10em;font-size:var(--fs-lg);color:var(--navy)}
#nlHub .nlh__round{font-variation-settings:"wght" 700;font-weight:700;color:var(--muted);font-size:var(--fs-xs);letter-spacing:.07em;text-transform:uppercase}
#nlHub .nlh__loadbtn{margin-left:auto;align-self:center;font-size:var(--fs-xs);font-variation-settings:"wght" 800;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--navy);border:1px solid var(--line);border-radius:999px;padding:6px 13px;background:var(--surface);transition:background .15s}
#nlHub .nlh__loadbtn:hover{background:var(--navy-100)}
#nlHub .nlh__switch{display:flex;gap:4px;background:var(--navy-100);padding:4px;border-radius:999px}
#nlHub .nlh__seg{flex:1;padding:9px 0;border-radius:999px;font-size:var(--fs-sm);font-variation-settings:"wght" 800;font-weight:800;letter-spacing:.04em;color:var(--muted);transition:.18s}
#nlHub .nlh__seg.is-active{background:var(--primary);color:#fff}

/* ===== Main area: one view at a time on mobile, three panels on desktop ===== */
#nlHub .nlh__main{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
#nlHub .nlh__view{display:none;flex-direction:column;min-height:0}
#nlHub .nlh__view.is-active{display:flex;flex:1 1 auto}
#nlHub .nlh__panelhead{display:none;flex:0 0 auto;font-size:var(--fs-xs);font-variation-settings:"wght" 800;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:2px 4px 10px}

/* ===== Stage (the dark island) ===== */
/* the island: NL crimson sea, pale NL blue land */
#nlHub .nlh__stage{position:relative;flex:1 1 auto;min-height:0;color:var(--ink-text);background:radial-gradient(120% 90% at 50% 8%,var(--primary) 0%,var(--primary-700) 78%);overflow:hidden}

/* ===== Map ===== */
#nlHub .nlh__mapzoom{position:absolute;inset:0;transform-origin:0 0;transition:transform 1.05s cubic-bezier(.3,0,.15,1);will-change:transform}
#nlHub .nlh__mapsvg{position:absolute;inset:0;width:100%;height:100%}
#nlHub .nlh__mapsvg path{fill:var(--blue-light);stroke:var(--navy-300);stroke-width:2.2;stroke-linejoin:round;transition:fill .5s ease,stroke .5s ease}
#nlHub .nlh__pins{position:absolute;inset:0}
/* The pin is an ANCHOR: a 0x0 point fixed at the ground's TRUE geography,
   marked by an ALWAYS-VISIBLE dot. The board floats beside it (map-callout
   style — minimum stand-off, so the dot is never hidden under its own
   card) on a short stem; the solver keeps boards apart AND keeps every
   stem clear of foreign cards. */
#nlHub .nlh__pin{position:absolute;width:0;height:0}
#nlHub .nlh__pindot{position:absolute;left:-4.5px;top:-4.5px;width:9px;height:9px;border-radius:50%;background:var(--navy);box-shadow:0 0 0 2px #fff;opacity:.95;transition:opacity .45s ease,box-shadow .45s ease}
#nlHub .nlh__pinstem{position:absolute;left:-0.75px;top:0;width:1.5px;background:#56679a;transform-origin:0 0;opacity:.65;transition:opacity .45s ease,height .9s cubic-bezier(.3,0,.15,1),transform .9s cubic-bezier(.3,0,.15,1)}
#nlHub .nlh__pinwrap{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;transform:translate(calc(-50% + var(--ox,0px)),calc(-50% + var(--oy,0px)));transition:transform .9s cubic-bezier(.3,0,.15,1),opacity .45s ease}
/* FOCUS MODE — boards and stems fade away, dots dim (the hero's glows),
   the camera zooms the ground and the hero lower third takes over. */
#nlHub .nlh__stage.is-focus .nlh__mapsvg path{fill:#dde3f3;stroke:#a9b5d2}
#nlHub .nlh__stage.is-focus .nlh__pinwrap,#nlHub .nlh__stage.is-focus .nlh__pinstem{opacity:0;pointer-events:none}
#nlHub .nlh__stage.is-focus .nlh__pindot{opacity:.3}
#nlHub .nlh__stage.is-focus .nlh__pin.is-hero .nlh__pindot{opacity:1;box-shadow:0 0 0 2px #0a1428,0 0 16px 4px var(--hero-col,#fff)}
/* the board: one compact broadcast strip — crest score – score crest │ min */
#nlHub .nlh__pinboard{display:flex;align-items:stretch;background:var(--ink-2);border-radius:6px;box-shadow:0 2px 8px rgba(0,0,0,.5),0 0 0 1px var(--ink-line);overflow:hidden}
#nlHub .nlh__pinside{display:flex;align-items:center;gap:4px;padding:4px 6px}
#nlHub .nlh__pinside img,#nlHub .nlh__crestfb{width:16px;height:16px;object-fit:contain;border-radius:2px;flex:0 0 auto}
#nlHub .nlh__crestfb{display:flex;align-items:center;justify-content:center;font-size:7px;font-variation-settings:"wght" 900;font-weight:900;color:#fff}
#nlHub .nlh__pinsc{font-variation-settings:"wght" 900;font-weight:900;font-size:13px;min-width:10px;text-align:center;font-variant-numeric:tabular-nums;color:#fff}
#nlHub .nlh__pindash{align-self:center;color:var(--ink-muted);font-size:11px;font-variation-settings:"wght" 800;font-weight:800;margin:0 -3px}
#nlHub .nlh__pinmin{display:flex;align-items:center;padding:0 7px;font-size:10px;font-variation-settings:"wght" 800;font-weight:800;letter-spacing:.02em;color:var(--ink-muted);background:#0a1428;border-left:1px solid var(--ink-line);white-space:nowrap}
#nlHub .nlh__pinmin.is-live{color:#04310f;background:var(--live);border-left-color:var(--live)}
#nlHub .nlh__pinmin.is-ft{color:#eafff0;background:var(--green);border-left-color:var(--green)}
#nlHub .nlh__pin.is-goal .nlh__pinboard{animation:nlhPulse .7s ease}
@keyframes nlhPulse{0%{transform:scale(1)}35%{transform:scale(1.34);box-shadow:0 0 0 3px var(--hero-col,var(--live))}100%{transform:scale(1)}}
/* the ground beacon — the dot pulses in team colour on the reveal */
#nlHub .nlh__pin.is-goal .nlh__pindot{animation:nlhDotPulse 1s ease}
@keyframes nlhDotPulse{0%{transform:scale(1)}35%{transform:scale(2.1);box-shadow:0 0 0 3px var(--hero-col,var(--live)),0 0 20px 8px var(--hero-col,var(--live))}100%{transform:scale(1)}}

/* ===== HERO lower third — the persistent score updater during focus.
   Kicker (LIVE / GOAL / kick-off slot) · names in type beside crests ·
   rolling digits · foot line = venue (tease) or scorer + GOAL time
   (reveal). No current-clock time here — the goal minute is the only
   time shown. Fixed size, never zoom-scaled. ===== */
#nlHub .nlh__hero{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);z-index:6;pointer-events:none;max-width:94%}
#nlHub .nlh__ha{min-width:min(460px,92vw);border-radius:10px;overflow:hidden;box-shadow:0 12px 30px rgba(0,0,0,.5)}
#nlHub .nlh__hakick{display:flex;justify-content:flex-start;padding:6px 14px;background:#16234a;color:#fff;font-size:12px;font-variation-settings:"wght" 800;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
#nlHub .nlh__habar{display:flex;align-items:center;justify-content:center;gap:13px;background:#0d1730;padding:12px 18px}
#nlHub .nlh__habar img,#nlHub .nlh__habar .nlh__crestfb{width:34px;height:34px;object-fit:contain}
#nlHub .nlh__hanm{font-size:19px;font-variation-settings:"wght" 900;font-weight:900;letter-spacing:.04em;color:#fff;text-transform:uppercase}
#nlHub .nlh__hasc{display:flex;align-items:center;gap:6px;font-size:42px;line-height:1;font-variation-settings:"wght" 900;font-weight:900;font-variant-numeric:tabular-nums;color:#fff;padding:0 8px}
#nlHub .nlh__hadash{font-size:24px;color:var(--ink-muted)}
#nlHub .nlh__hav{font-size:28px;color:var(--ink-muted);font-variation-settings:"wght" 800;font-weight:800}
#nlHub .nlh__hafoot{padding:7px 14px;background:#0a1428;color:var(--ink-muted);font-size:14px;font-variation-settings:"wght" 600;font-weight:600}
#nlHub .nlh__hafoot b{color:#fff;font-variation-settings:"wght" 900;font-weight:900}
#nlHub .nlh__digit{display:inline-block;height:1.12em;overflow:hidden;min-width:.66em;text-align:center}
#nlHub .nlh__digit .reel{display:block}
#nlHub .nlh__digit .reel i{display:block;height:1.12em;font-style:normal}
#nlHub .nlh__digit .reel.roll{animation:nlhOdo .7s cubic-bezier(.3,1,.25,1) .3s both}
@keyframes nlhOdo{to{transform:translateY(-1.12em)}}

/* ===== GOAL TAKEOVER — the marquee beat. A skewed band in the scoring
   team's colour wipes the stage carrying a giant GOAL wordmark and the
   scoreline strap, holds a breath, then exits — the lower third is
   standing there as the colour clears. ===== */
#nlHub .nlhfx{position:absolute;inset:0;z-index:7;pointer-events:none;display:none;overflow:hidden}
#nlHub .nlhfx.run{display:block}
#nlHub .nlhfx__band{position:absolute;top:-12%;bottom:-12%;left:-45%;width:190%;background:var(--hero-col,#9e0000);transform:translateX(-135%) skewX(-12deg)}
#nlHub .nlhfx.run .nlhfx__band{animation:nlhFxBand 2.3s cubic-bezier(.6,0,.2,1) both}
@keyframes nlhFxBand{0%{transform:translateX(-135%) skewX(-12deg)}24%{transform:translateX(0) skewX(-12deg)}66%{transform:translateX(0) skewX(-12deg)}100%{transform:translateX(135%) skewX(-12deg)}}
#nlHub .nlhfx__wm{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(58vh,420px);opacity:0}
#nlHub .nlhfx.run .nlhfx__wm{animation:nlhFxWm 2.3s ease both}
@keyframes nlhFxWm{0%{opacity:0}18%{opacity:.16}62%{opacity:.16}88%{opacity:0}100%{opacity:0}}
#nlHub .nlhfx__word{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;opacity:0}
#nlHub .nlhfx.run .nlhfx__word{animation:nlhFxWord 2.3s ease both}
@keyframes nlhFxWord{0%{opacity:0;transform:scale(.86)}16%{opacity:1;transform:scale(1)}64%{opacity:1;transform:scale(1)}86%{opacity:0;transform:scale(1.05)}100%{opacity:0}}
#nlHub .nlhfx__goal{font-size:clamp(64px,13vw,150px);line-height:.95;font-variation-settings:"wght" 900;font-weight:900;letter-spacing:.05em;text-transform:uppercase}
#nlHub .nlhfx__line{font-size:clamp(15px,2.4vw,22px);font-variation-settings:"wght" 800;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
/* score tick-over — digits roll/pop when they change (pins + cards) */
#nlHub .nlh__pinsc.is-tick,#nlHub .nlh__cardteam .sc.is-tick{animation:nlhTick .5s cubic-bezier(.2,.9,.2,1)}
@keyframes nlhTick{0%{transform:translateY(-.66em) scale(.5);opacity:.15;color:var(--live)}55%{transform:translateY(.05em) scale(1.35);color:var(--live)}100%{transform:none}}

/* Beat cards (KO/HT/2nd half/FT) */
#nlHub .nlh__beat{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;animation:nlhBeatIn .3s ease;background:rgba(3,8,27,.35)}
@keyframes nlhBeatIn{from{opacity:0}to{opacity:1}}
#nlHub .nlh__beat span{font-variation-settings:"wght" 900;font-weight:900;letter-spacing:.16em;font-size:clamp(30px,3.5vw,44px);text-transform:uppercase;padding:16px 30px;border:2px solid rgba(255,255,255,.25);border-radius:12px;background:rgba(10,20,40,.6)}

/* ===== Cards — dense: minute pill sits beside the two team rows, scorers
   only take a row when there are any ===== */
#nlHub .nlh__grid{flex:1 1 auto;min-height:0;overflow-y:auto;padding:14px;display:grid;grid-template-columns:1fr 1fr;gap:12px;align-content:start}
#nlHub .nlh__card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:9px 11px;display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"teams min" "scorers scorers";gap:6px 10px;align-items:center}
#nlHub .nlh__cardteams{grid-area:teams;display:flex;flex-direction:column;gap:5px;min-width:0}
#nlHub .nlh__cardmin{grid-area:min}
#nlHub .nlh__scorers:empty{display:none}
#nlHub .nlh__cardmin{font-size:var(--fs-xs);font-variation-settings:"wght" 800;font-weight:800;padding:2px 9px;border-radius:999px;background:var(--navy-100);border:1px solid var(--line);color:var(--navy-600);letter-spacing:.03em}
#nlHub .nlh__cardmin.is-live{color:#04310f;background:var(--live);border-color:var(--live)}
#nlHub .nlh__cardmin.is-ft{color:#eafff0;background:var(--green);border-color:var(--green)}
#nlHub .nlh__cardteam{display:flex;align-items:center;gap:9px}
#nlHub .nlh__cardteam img,#nlHub .nlh__cardteam .nlh__crestfb{width:24px;height:24px;object-fit:contain}
#nlHub .nlh__cardteam .nm{flex:1;font-size:var(--fs-base);font-variation-settings:"wght" 700;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#nlHub .nlh__cardteam .sc{font-variation-settings:"wght" 900;font-weight:900;font-size:var(--fs-md);font-variant-numeric:tabular-nums;min-width:16px;text-align:right}
#nlHub .nlh__cardteam.win .sc{color:var(--primary)}
#nlHub .nlh__cardteam.lose{opacity:.55}
#nlHub .nlh__scorers{grid-area:scorers;border-top:1px solid var(--line);padding-top:7px;display:flex;flex-wrap:wrap;gap:3px 12px}
#nlHub .nlh__scorer{font-size:var(--fs-xs);color:var(--muted);font-variation-settings:"wght" 600;font-weight:600}
#nlHub .nlh__scorer .m{color:var(--text);opacity:.65}
#nlHub .nlh__scorer.og .m::after{content:" OG"}

/* ===== Ticker ===== */
/* the coloured left edge is a data encoding (scoring team's colour), kept thin */
#nlHub .nlh__feed{list-style:none;margin:0;padding:14px;flex:1 1 auto;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
/* quiet, flat list — colour edge + hairline separators, not a stack of cards */
#nlHub .nlh__line{background:transparent;border:0;border-left:3px solid var(--line);border-bottom:1px solid var(--line);border-radius:0;padding:8px 10px;font-size:var(--fs-sm);line-height:1.35;animation:nlhLineIn .28s ease;display:flex;gap:9px;align-items:center}
@keyframes nlhLineIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#nlHub .nlh__line .lm{font-variation-settings:"wght" 900;font-weight:900;font-variant-numeric:tabular-nums;color:var(--muted);min-width:34px;text-align:right}
#nlHub .nlh__line .lcr{width:24px;height:24px;object-fit:contain;flex:0 0 auto;border-radius:3px}
#nlHub .nlh__line .lt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
#nlHub .nlh__line .lwho{color:var(--muted);font-size:var(--fs-xs);font-variation-settings:"wght" 600;font-weight:600}
#nlHub .nlh__line .ltag{font-variation-settings:"wght" 900;font-weight:900;font-size:10px;letter-spacing:.06em;padding:2px 6px;border-radius:4px;flex:0 0 auto;color:#04120a;min-width:46px;display:inline-flex;align-items:center;justify-content:center}
#nlHub .nlh__line .lteam{font-variation-settings:"wght" 900;font-weight:900}
#nlHub .nlh__line .lscore{font-variation-settings:"wght" 700;font-weight:700;font-variant-numeric:tabular-nums;color:var(--text)}
#nlHub .nlh__line .lscore b{font-variation-settings:"wght" 900;font-weight:900;color:var(--navy-900)}
#nlHub .nlh__line .lscore .lsub{font-variation-settings:"wght" 600;font-weight:600;color:var(--muted)}
#nlHub .nlh__line .lsub{color:var(--muted)}
#nlHub .nlh__line.goal{border-left-color:var(--live)}
#nlHub .nlh__line.goal .ltag{background:var(--live)}
#nlHub .nlh__line.red{border-left-color:var(--red)}
#nlHub .nlh__line.red .ltag{background:var(--red);color:#fff}
#nlHub .nlh__line.ft{border-left-color:var(--navy)}
#nlHub .nlh__line.ft .ltag{background:var(--navy);color:#fff}
#nlHub .nlh__line.ft .win{color:var(--navy-900);font-variation-settings:"wght" 900;font-weight:900}
#nlHub .nlh__line.divider{background:transparent;border:0;border-radius:0;justify-content:center;padding:2px 0;color:var(--muted);font-variation-settings:"wght" 800;font-weight:800;letter-spacing:.16em;font-size:var(--fs-xs);text-transform:uppercase}
#nlHub .nlh__line.divider::before,#nlHub .nlh__line.divider::after{content:"";flex:1;height:1px;background:var(--line);align-self:center}
#nlHub .nlh__line .caret{border-right:2px solid var(--text);animation:nlhCaret .7s steps(1) infinite}
@keyframes nlhCaret{50%{border-color:transparent}}

/* ===== FT sheet ===== */
#nlHub .nlh__sheet{position:absolute;inset:0;z-index:8;display:flex;align-items:flex-end;justify-content:center;background:rgba(3,8,27,.45)}
#nlHub .nlh__sheetcard{width:100%;max-width:760px;max-height:88%;background:var(--surface);color:var(--text);border-top:2px solid var(--primary);border-radius:var(--radius-lg) var(--radius-lg) 0 0;padding:14px 16px 16px;animation:nlhSheetUp .3s ease;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 -8px 30px rgba(10,22,40,.25)}
@keyframes nlhSheetUp{from{transform:translateY(100%)}to{transform:none}}
#nlHub .nlh__sheethead{display:flex;justify-content:space-between;align-items:center;font-size:var(--fs-sm);font-variation-settings:"wght" 800;font-weight:800;letter-spacing:.04em;color:var(--muted);margin-bottom:10px}
#nlHub .nlh__sheetclose{font-size:24px;line-height:1;color:var(--muted)}
#nlHub .nlh__tablewrap{overflow-y:auto}
#nlHub .nlh__table{width:100%;border-collapse:collapse;font-size:var(--fs-sm);font-variant-numeric:tabular-nums}
#nlHub .nlh__table tr{transition:transform .5s cubic-bezier(.2,.8,.2,1)}
#nlHub .nlh__table td{padding:7px 6px;border-bottom:1px solid var(--line)}
#nlHub .nlh__table .pos{width:28px;color:var(--muted);text-align:center;font-variation-settings:"wght" 800;font-weight:800}
#nlHub .nlh__table .cl{display:flex;align-items:center;gap:8px}
#nlHub .nlh__table .cl img,#nlHub .nlh__table .nlh__crestfb{width:20px;height:20px;object-fit:contain}
#nlHub .nlh__table .nm{font-variation-settings:"wght" 700;font-weight:700}
#nlHub .nlh__table .pts{text-align:right;font-variation-settings:"wght" 900;font-weight:900}
#nlHub .nlh__table td.num{text-align:center;color:var(--muted)}
/* NL position bands as filled cells (canon --pos-* pairings) */
#nlHub .nlh__table tr.champ td.pos{background:var(--pos-champ);color:#000}
#nlHub .nlh__table tr.po td.pos{background:var(--pos-po);color:#fff}
#nlHub .nlh__table tr.releg td.pos{background:var(--pos-releg);color:#fff}
#nlHub .nlh__table tr.moved .nm::after{content:"▲";color:var(--green);font-size:10px;margin-left:6px}

<script>
(function () {
  "use strict";
  var D = window.__DATA__;
  if (!D) return;

  var CREST_BASE = "https://raw.githubusercontent.com/thenationalleague/tools/main/assets/crests/";
  var BUILD = "34";   // bump on each deploy; the footer shows ?v=… if present, else this
  var HALF = 45, BREAK = 15, FT_RMIN = HALF + BREAK + HALF; // 105

  // ---- helpers -------------------------------------------------------------
  var $  = function (id) { return document.getElementById(id); };
  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
  function crestURL(name){ return CREST_BASE + encodeURIComponent(name) + ".png"; }
  function club(k){ return D.clubs[k] || {name:k,short:k,col:{p:"#666",s:"#fff",t:"#fff"},lat:53,lng:-2}; }
  // crest <img> with coloured-disc fallback (crests can't be verified in CI)
  function crestHTML(k, cls){
    var c = club(k), init = (c.short||c.name).slice(0,3).toUpperCase();
    var fb = "this.onerror=null;this.outerHTML='<span class=\\'nlh__crestfb "+(cls||"")+"\\' style=\\'background:"+c.col.p+";color:"+ideal(c.col.p)+"\\'>"+init+"</span>';";
    return '<img class="'+(cls||"")+'" src="'+crestURL(c.name)+'" alt="'+esc(c.name)+'" onerror="'+fb+'">';
  }
  // pick black/white text for a bg (also used for near-white crest fallback legibility)
  function ideal(hex){
    var m = /^#?([0-9a-f]{6})$/i.exec(hex||""); if(!m) return "#fff";
    var n=parseInt(m[1],16), r=n>>16, g=(n>>8)&255, b=n&255;
    return (0.299*r+0.587*g+0.114*b) > 150 ? "#111" : "#fff";
  }
  // near-white club colour → fall back to secondary for washes/legibility
  function washCol(c){ return ideal(c.p)==="#111" && c.s ? c.s : c.p; }

  // ---- timeline model ------------------------------------------------------
  // real-minute of an event, HT break folded in, plus its slot's KO offset
  function koOffset(fx){ return fx._ko || 0; } // 0 in sync mode; real slot offsets in stagger mode
  // real-minute of an event (15-min HT break folded in); a 45' goal sits at the
  // end of the first half (not in the HT window)
  function evRmin(ev, fx){ var m=ev.min; return koOffset(fx) + (m < HALF ? m : (m===HALF ? HALF-0.08 : m + BREAK)) + (ev._ro||0); }
  // stoppage-aware minute label: 2nd half > 90 → "90+n", 1st half > 45 → "45+n"
  function dispMin(m, half){
    if (half===1) return m>HALF ? "45+"+(m-HALF) : ""+m;
    return m>90 ? "90+"+(m-90) : ""+m;
  }
  // goal-minute label for scorers/tickers/sting — stoppage shown as "90+8", not "98"
  function minLabel(m){ return m>90 ? "90+"+(m-90) : (""+m); }
  // per-fixture KO offset + full-time rmin (sits AFTER the last event, so
  // stoppage goals play out before "FT"). Recomputed by computeDerived()
  // whenever a matchday loads or the timing mode changes.
  var maxFt = FT_RMIN;
  function computeTimeline(){
    var base=Infinity;
    D.fixtures.forEach(function(fx){ fx._koms=Date.parse(fx.date)||0; if(fx._koms<base) base=fx._koms; });
    st.baseKOms = base===Infinity ? 0 : base;
    // sync: every match kicks off together (the original replay treatment).
    // stagger: real KO slots — a 12:30 game is deep into its second half
    // by the time the 15:00s kick off, exactly like a real afternoon.
    D.fixtures.forEach(function(fx){ fx._ko = st.stagger ? Math.round((fx._koms-st.baseKOms)/60000) : 0; });
    // SAME-MINUTE events get a tiny deterministic stagger so each one plays
    // out in full (tease → takeover → reveal), back to back — without this,
    // a second goal in the identical minute could never fire its moment
    var seenR={};
    D.fixtures.forEach(function(fx){ fx.events.forEach(function(ev){
      ev._ro=0;
      var base=evRmin(ev,fx).toFixed(2);
      var k=seenR[base]||0; seenR[base]=k+1;
      ev._ro=k*0.05;
    }); });
    D.fixtures.forEach(function(fx){
      var last=0; fx.events.forEach(function(ev){ last=Math.max(last, evRmin(ev,fx)); });
      fx._ft = Math.max(koOffset(fx)+FT_RMIN, last+2);
    });
    maxFt = D.fixtures.reduce(function(m,fx){ return fx.pp?m:Math.max(m, fx._ft); }, FT_RMIN);
  }

  // per-fixture derived state at global time T (real-minutes since first KO)
  function stateOf(fx, T){
    var local = T - koOffset(fx);
    if (fx.pp) return {phase:"pp", label:"P-P", live:false};
    if (local < 0)          return {phase:"pre", label:fx.slot, live:false};
    if (local < HALF)       return {phase:"1h", label:dispMin(Math.max(1,Math.floor(local)),1)+"'", live:true};
    if (local < HALF+BREAK) return {phase:"ht", label:"HT", live:true};
    if (local < fx._ft)     return {phase:"2h", label:dispMin(Math.floor(local-BREAK),2)+"'", live:true};
    return {phase:"ft", label:"FT", live:false};
  }
  // running score at T (own goals credited to the other side)
  function scoreAt(fx, T){
    var h=0,a=0;
    fx.events.forEach(function(ev){
      if (ev.type!=="goal") return;
      if (evRmin(ev,fx) > T) return;
      var forHome = (ev.team===fx.home) !== !!ev.og; // XOR own-goal flip
      if (forHome) h++; else a++;
    });
    return {h:h,a:a};
  }
  function scorersAt(fx, side, T){ // side 'h'|'a' → array of {name,min,og,pen}
    return fx.events.filter(function(ev){
      if (ev.type!=="goal" || evRmin(ev,fx)>T) return false;
      var forHome=(ev.team===fx.home)!==!!ev.og;
      return side==="h" ? forHome : !forHome;
    }).map(function(ev){ return {name:ev.name,min:ev.min,og:ev.og,pen:ev.pen}; });
  }
  function maxT(){ return maxFt + 4; }
  // shared matchday wall clock. Sync mode: one match-minute clock for all.
  // Stagger mode: the real time of day ("15:07"), since matches are on
  // their own clocks — the HT fold means T tracks true wall minutes.
  function clockLabel(T){
    if (st.stagger){
      if (T >= maxFt) return "FT";
      return new Date(st.baseKOms + T*60000).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit",timeZone:"Europe/London"});
    }
    if (T <= 0) return "0'";
    if (T < HALF) return Math.floor(T)+"'";
    if (T < HALF+BREAK) return "HT";
    if (T < maxFt) return dispMin(Math.floor(T-BREAK),2)+"'";
    return "FT";
  }

  // sorted list of every timeline "moment" (events + phase beats) for lull-skip
  var MOMENTS = [];
  function computeMoments(){
    MOMENTS = [];
    D.fixtures.forEach(function(fx){
      if (fx.pp) return;
      fx.events.forEach(function(ev){ MOMENTS.push(evRmin(ev,fx)); });
      MOMENTS.push(fx._ft);
      if (st.stagger) MOMENTS.push(koOffset(fx));
    });
    (st.stagger ? [0,maxFt] : [0,HALF,HALF+BREAK,maxFt]).forEach(function(m){ MOMENTS.push(m); });
    MOMENTS = MOMENTS.filter(function(v,i,a){return a.indexOf(v)===i;}).sort(function(x,y){return x-y;});
  }
  function nextMoment(T){
    for (var i=0;i<MOMENTS.length;i++){ if (MOMENTS[i] > T+0.001) return MOMENTS[i]; }
    return maxT();
  }

  // ---- map projection (preserve England+Wales shape into the 3:4 stage) ----
  var proj = (function(){
    var midLat = 53, k = Math.cos(midLat*Math.PI/180); // lng compression
    var xs = D.gb.map(function(p){return p[0]*k;}), ys = D.gb.map(function(p){return p[1];});
    var minX=Math.min.apply(0,xs), maxX=Math.max.apply(0,xs);
    var minY=Math.min.apply(0,ys), maxY=Math.max.apply(0,ys);
    var cX=(minX+maxX)/2, cY=(minY+maxY)/2;
    var boxW=3, boxH=4, pad=0.90;
    var scale = Math.min(boxW/(maxX-minX), boxH/(maxY-minY)) * pad;
    return function(lng,lat){
      var x = boxW/2 + (lng*k - cX)*scale;
      var y = boxH/2 - (lat  - cY)*scale;
      return { nx:x/boxW, ny:y/boxH }; // normalised 0..1 within stage
    };
  })();

  // ---- state ---------------------------------------------------------------
  var st = { T:0, playing:false, rate:1, view:"map", raf:0, last:0,
             fired:{}, ftShown:false, feedBuilt:{}, beatShown:{},
             suspend:null, kickoff:null, koShown:false, _bag:{}, _lastPick:{}, _typeIv:0,
             _commUntil:0, _commQ:null, _commDrT:0,
             // timing mode: secPerMin = seconds one match-minute takes (the
             // speed button still multiplies on top); stagger = real KO slots
             secPerMin:1, stagger:false, baseKOms:0 };
  function evId(fx,ev){ return fx.gc+"_"+ev.type+"_"+ev.min+"_"+(ev.name||""); }
  // desktop = three panels live at once (cards | map | ticker); the map is
  // always on screen there, so stings/beats/zooms fire regardless of st.view
  var mqDesk = window.matchMedia("(min-width:1100px)");
  function isDesk(){ return mqDesk.matches; }
  function mapVisible(){ return isDesk() || st.view==="map"; }

  // ---- MAP: static outline + pins ------------------------------------------
  function buildMap(){
    var d = D.gb.map(function(p,i){ var q=proj(p[0],p[1]); return (i?"L":"M")+(q.nx*1000).toFixed(1)+" "+(q.ny*1333).toFixed(1); }).join(" ")+" Z";
    $("nlhMapSvg").innerHTML = '<path d="'+d+'"/>';
    // each pin = an ANCHOR at the ground's true position (dot), plus a
    // scoreboard that may float away to avoid overlaps, tied back by a stem
    var pins = D.fixtures.map(function(fx){
      return '<div class="nlh__pin" id="pin_'+fx.gc+'">'+
               '<span class="nlh__pinstem"></span>'+
               '<span class="nlh__pindot"></span>'+
               '<div class="nlh__pinwrap">'+
                 '<div class="nlh__pinboard">'+
                   '<div class="nlh__pinside">'+crestHTML(fx.home)+'<span class="nlh__pinsc" data-h></span></div>'+
                   '<span class="nlh__pindash">–</span>'+
                   '<div class="nlh__pinside"><span class="nlh__pinsc" data-a></span>'+crestHTML(fx.away)+'</div>'+
                   '<span class="nlh__pinmin" data-min></span>'+
                 '</div>'+
               '</div>'+
             '</div>';
    }).join("");
    $("nlhPins").innerHTML = pins;
    layoutPins();
  }
  // Anchor every pin at the ground's TRUE position (contain-fit to the SVG
  // outline, any stage aspect). Boards stand OFF their dots (map-callout
  // style — the dot is always visible, the stem short) and the solver keeps
  // boards apart AND keeps every stem clear of foreign cards.
  function layoutPins(){
    var stage=$("nlhStage"); if(!stage) return;
    var W=stage.clientWidth, H=stage.clientHeight;
    if(!W || !H){ requestAnimationFrame(layoutPins); return; }
    var mapAspect=3/4, mw,mh,ox,oy;
    if (W/H > mapAspect){ mh=H; mw=H*mapAspect; ox=(W-mw)/2; oy=0; }
    else { mw=W; mh=W/mapAspect; ox=0; oy=(H-mh)/2; }
    var nodes = D.fixtures.map(function(fx){
      var el=$("pin_"+fx.gc); if(!el) return null;
      var c=club(fx.home), q=proj(c.lng,c.lat);
      var board=el.querySelector(".nlh__pinboard");
      var ax=Math.max(10,Math.min(W-10, ox+q.nx*mw));
      var ay=Math.max(10,Math.min(H-10, oy+q.ny*mh));
      return { el:el, ax:ax, ay:ay, w:(board&&board.offsetWidth)||96, h:((board&&board.offsetHeight)||24)+2 };
    }).filter(function(n){ return n; });
    // CANDIDATE-RING placement — displacement is BOUNDED by construction.
    // Each board may only sit on a small ring of positions around its own
    // dot (due-north preferred, three modest radii, ~30-70px max) and
    // greedily picks the spot that best avoids: overlapping another card,
    // covering anyone's dot, or touching a stem. Markers stay NEAR their
    // grounds — less distance, less to touch — so a bad interaction can
    // nudge a board around its dot but never fling it across the map.
    var DIRS=[[0,-1],[0.72,-0.72],[-0.72,-0.72],[1,0],[-1,0],[0.72,0.72],[-0.72,0.72],[0,1]];
    var DIRPEN=[0,4,4,9,9,15,15,20];
    nodes.forEach(function(n){ n.r1=n.h/2+16; n.x=n.ax; n.y=n.ay-n.r1; });

      }
      return false;
    }
    function placeCost(n,cx,cy){
      var c=0;
      for(var i=0;i<nodes.length;i++){
        var o=nodes[i]; if(o===n) continue;
        var ox=Math.min(cx+n.w/2,o.x+o.w/2)-Math.max(cx-n.w/2,o.x-o.w/2);
        var oy=Math.min(cy+n.h/2,o.y+o.h/2)-Math.max(cy-n.h/2,o.y-o.h/2);
        if(ox>-8&&oy>-8) c+=Math.max(0.5,ox+8)*Math.max(0.5,oy+8)*0.06;      // overlap + breathing room

        if(segHits(n.ax,n.ay,cx,cy, o.x,o.y,o.w+14,o.h+14)) c+=350;          // my stem under their card
        if(segHits(o.ax,o.ay,o.x,o.y, cx,cy,n.w+14,n.h+14)) c+=350;          // their stem under my card
      }
      return c;
    }
    for(var sweep=0; sweep<5; sweep++){
      nodes.forEach(function(n){
        var best=null;
        for(var ri=0; ri<3; ri++){
          var R=n.r1+ri*22;
          for(var di=0; di<DIRS.length; di++){
            var cx=Math.max(n.w/2+4,Math.min(W-n.w/2-4, n.ax+DIRS[di][0]*R));
            var cy=Math.max(n.h/2+4,Math.min(H-n.h/2-4, n.ay+DIRS[di][1]*R));
            var cc=placeCost(n,cx,cy)+ri*10+DIRPEN[di];
            if(!best||cc<best.c) best={c:cc,x:cx,y:cy};
          }
        }
        n.x=best.x; n.y=best.y;
      });
    }
    nodes.forEach(function(n){
      n.el.style.left=(n.ax/W*100).toFixed(3)+"%";
      n.el.style.top =(n.ay/H*100).toFixed(3)+"%";
      var wrap=n.el.querySelector(".nlh__pinwrap"), stem=n.el.querySelector(".nlh__pinstem");
      var dx=n.x-n.ax, dy=n.y-n.ay;

  // straight-line miles between two grounds (derby / long-slog detection)
  function haversineMi(a,b){
    var toR=Math.PI/180, s=Math.sin((b.lat-a.lat)*toR/2), t=Math.sin((b.lng-a.lng)*toR/2);
    var h=s*s+Math.cos(a.lat*toR)*Math.cos(b.lat*toR)*t*t;
    return 2*3959*Math.asin(Math.sqrt(h));
  }
  // "win today and, if results go their way…" — reserved for the second half
  // of the season (P >= 23), and always caveated: others play today too
  function stakesClause(fx){
    var pr=D.prior, n=Object.keys(pr||{}).length;
    if(fx.ko) return null;   // knockout games move nothing in the table
    if(!pr || !pr[fx.home] || pr[fx.home].P<23) return null;
    function rows(boost){
      return Object.keys(pr).map(function(q){var p=pr[q];return {k:q,Pts:p.Pts+(q===boost?3:0),GD:p.GF-p.GA,GF:p.GF};})
        .sort(function(a,b){return b.Pts-a.Pts||b.GD-a.GD||b.GF-a.GF||club(a.k).name.localeCompare(club(b.k).name);});
    }
    var base=rows(null), pos0={}; base.forEach(function(r,i){pos0[r.k]=i+1;});
    var best=null;
    [fx.home,fx.away].forEach(function(k){
      var after=rows(k), p1=0; after.forEach(function(r,i){ if(r.k===k) p1=i+1; });
      var p0=pos0[k], cl=club(k), out=null, w=0;
      if(p0!==1 && p1===1)            { out=cl.name+" could go top with a win today — if results go their way."; w=3; }
      else if(p0>7 && p1<=7)          { out="Win today and, if results go their way, "+cl.name+" would climb into the play-off places."; w=2; }
      else if(p0>n-3 && p1<=n-3)      { out="A win could lift "+cl.name+" out of the drop zone — if results elsewhere go their way."; w=2; }
      if(out && (!best || w>best.w)) best={s:out,w:w};
    });
    return best && best.s;
  }
  // ONE extra colour clause per preview, weighted: h2h, derby extremes,
  // stakes maths, the referee. Keeps previews tight.
  function previewExtra(fx,h,a){
    var opts=[];
    var hc=h2hClause(fx); if(hc) opts.push({w:(fx.h2h&&fx.h2h.p<=1)?8:4, s:hc});
    var mi=(h.lat&&a.lat)?haversineMi(h,a):null;
    if(mi!=null && mi<=16)       opts.push({w:6,s:"A proper local affair, this — barely "+Math.max(5,Math.round(mi/5)*5)+" miles between the two grounds."});
    else if(mi!=null && mi>=180) opts.push({w:6,s:"Quite the trek for the visiting fans — the best part of "+Math.round(mi/25)*25+" miles to get here."});
    var stk=stakesClause(fx); if(stk) opts.push({w:4,s:stk});
    if(fx.ref) opts.push({w:2,s:fx.ref+" is the man in the middle"+(fx.refY>=4.5?" — and the cards tend to flow when he officiates":"")+"."});
    if(!opts.length || Math.random()>0.85) return null;
    var tot=opts.reduce(function(nn,o){return nn+o.w;},0), x=Math.random()*tot, ch=opts[0];
    for(var i=0;i<opts.length;i++){ x-=opts[i].w; if(x<=0){ch=opts[i];break;} }
    return ch.s;
  }
  // all-time head-to-head (National League meetings only — these clubs have EFL
  // history too, so we never claim "first ever meeting")
  function h2hClause(fx){
    var H=club(fx.home), A=club(fx.away), x=fx.h2h; if(!x || x.p==null) return "";
    var dr=function(n){ return n+(n===1?" draw":" draws"); };
    // CUR = first year of the current season ("2025-26" → 2025); h2h now
    // includes this season's reverse fixture, so "last season" vs "earlier
    // this season" is decided by x.l against CUR
    var CUR=parseInt(D.season,10)||0;
    var when=(x.l===CUR)?"earlier this season":"last season";
    if(x.p===0) return "These two have never met in the National League.";
    if(x.p===1){
      if(x.l>=CUR-1){
        if(x.lr==="A") return H.short+" will want to put right the league defeat "+when+" — the only time these two have met at this level.";
        if(x.lr==="H") return A.short+" out for revenge after the meeting "+when+", the only one between them in the National League.";
        return "Honours shared in their only National League meeting, "+when+".";
      }
      return "They've met just the once in this division, back in "+x.l+".";
    }
    var opts=[];

  // "afternoon" vs "evening" — decided by the day's earliest kick-off slot

  // ---- LIVE league table ----------------------------------------------------
  // Standings AS THEY STAND at the current moment: D.prior is the start-of-day
  // table; in-play scores count as provisional results (P ticks up, points
  // move with every goal — liveTable). Arrows show movement vs the START OF
  // DAY only. Any movement markers a source table carries (e.g. the NLS
  // table's startDayPosition arrows, which refer to the PREVIOUS matchday)

  function priorRank(){
    var arr=Object.keys(D.prior).map(function(k){var p=D.prior[k];return{k:k,Pts:p.Pts,GD:p.GF-p.GA,GF:p.GF};})
      .sort(function(a,b){return b.Pts-a.Pts||b.GD-a.GD||b.GF-a.GF;});

      var cls = i===0?"champ":(i>=1&&i<=4?"po":(i>=n-3?"releg":""));
      var moved = was[r.k]!==undefined && was[r.k]!==i;
      var dir = moved && was[r.k]<i ? "down":"";
      return '<tr class="'+cls+(moved?" moved "+dir:"")+'">'+
        '<td class="pos">'+(i+1)+'</td>'+
        '<td><span class="cl">'+crestHTML(r.k)+'<span class="nm">'+esc(club(r.k).short)+'</span></span></td>'+
        '<td class="num">'+r.P+'</td><td class="num">'+(r.GD>0?"+":"")+r.GD+'</td>'+
        '<td class="pts">'+r.Pts+'</td></tr>';

  // cinematic zoom: fly the map into a fixture's ground, then back out

    if(!zoom||!stage||!pin) return;
    var W=stage.clientWidth, H=stage.clientHeight;
    var px=(parseFloat(pin.style.left)||50)/100*W, py=(parseFloat(pin.style.top)||50)/100*H;
    var Z=2.4, dx=W/2-px*Z, dy=H*0.42-py*Z;   // seat the ground a touch above centre

  // a single fixture never over-zooms. Computed from the pins' anchors.
  var baseView={z:1,dx:0,dy:0};
  function computeBaseView(){
    var stage=$("nlhStage"); if(!stage) return;
    var W=stage.clientWidth, H=stage.clientHeight;
    var xs=[], ys=[];
    D.fixtures.forEach(function(fx){
      var el=$("pin_"+fx.gc); if(!el||!el.style.left) return;

    var minY=Math.min.apply(0,ys), maxY=Math.max.apply(0,ys);

  // ---- playback loop -------------------------------------------------------
  function tick(ts){
    if (!st.playing) return;
    if (!st.last) st.last=ts;
    // KICKOFF PREVIEWS — float ground to ground, one at a time, before the action
    if (st.kickoff){
      if (ts>=st.kickoff.until){
        var ki=st.kickoff.i;
        if (ki>=KO_ORDER.length){ st.kickoff=null; focusReset(); st.last=ts; }   // done — action begins
        else {
          var kfx=KO_ORDER[ki], kseg=kickoffSegs(kfx);
          setFocus(kfx);   // same focus treatment as goals — grey out, glide in
          typeSegs(kseg,"beat");
          var kchars=kseg.reduce(function(n,s){return n+s.t.length;},0);
          var kdur = st.rate>=2 ? 2200 : Math.min(9000, 2400 + kchars*24);   // real reading pace, not a skim
          st.kickoff={ i:ki+1, until: ts + kdur };

      st.raf=requestAnimationFrame(tick); return;
    }
    // goal suspense — freeze the clock through the tease, the reveal, and a dwell
    if (st.suspend){
      if (ts>=st.suspend.until){
        if (st.suspend.phase==="tease"){
          var hold=revealGoal(st.suspend.g);
          // dwell = the full read of reveal (+storyline), plus camera-settle padding
          st.suspend={ g:st.suspend.g, phase:"hold", until: ts + hold + (st.rate===2?500:1100) };
        } else {
          st.suspend=null;
          // another goal imminent → hold the camera and pan straight there
          if (!nextGoalAt(st.T, st.T+3)) focusReset();

    var prevT=st.T;

    // acceleration only in sync mode — a simulated real afternoon keeps
    // its honest clock

    if (st.rate<4){
      var g=nextGoalAt(prevT, target);
      if (g){
        st.T=g.rmin-0.0015;

        beginSuspense(g, ts);

      }
    }
    st.T=target;
    fireCrossed(prevT, st.T, true);        // 4× (or no goal ahead): goals fire instantly
    paint();
    if (st.T>=maxT()){
      pause();
      if(!st.ftShown){ st.ftShown=true;
        commSay(buildSegs(pick(C_OUTRO,"out"),{},[]),"beat",1);   // wind-down line, not a hard stop
        setTimeout(showFinalTable, 2600);                         // let it breathe, then surface the table
      }

    }

  }
  function play(){

    $("nlhPlay").setAttribute("aria-label","Pause");

  }
  function pause(){

  function restart(){

  function seek(frac){

    D.fixtures.forEach(function(fx){ fx.events.forEach(function(ev){ if(evRmin(ev,fx)<=st.T) st.fired[evId(fx,ev)]=1; }); });

  // ---- MATCHDAY LOADER ------------------------------------------------------
  // Client-side, no build step: the same public NLS feed the site's widgets
  // already consume from the browser, plus clubs-meta (identity) and the
  // all-time results master (h2h — big file, fetched lazily, cached for the
  // session, skipped gracefully if unreachable). Mirrors the field mapping in

  // tallies, streaks, ref card rates — that need ~450 history fetches).
  var NLS_API="https://multi-club-matches.football.web.gc.nationalleagueservices.co.uk/v2";
  var META_URL="https://raw.githubusercontent.com/thenationalleague/tools/main/assets/data/clubs-meta.json";
  var ALLTIME_URL="https://raw.githubusercontent.com/thenationalleague/site/main/results.json";
  var BASELINE_URL="https://raw.githubusercontent.com/thenationalleague/tools/main/assets/data/table-baselines.json";
  var COMPS={nl:{id:89,name:"National League"},north:{id:373,name:"National League North"},south:{id:372,name:"National League South"}};

  function fetchJSON(u){ return fetch(u).then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); }); }

  function pnameOf(p){ var n=(p&&p.playerName)||{}; return n.knownName||n.customKnownName||((n.firstName?n.firstName+" ":"")+(n.lastName||"")).trim()||"Unknown"; }

    var w=0,l=0,wl=0,ub=0,i;
    for(i=g.length-1;i>=0;i--){ if(g[i].gf>g[i].ga)w++; else break; }
    for(i=g.length-1;i>=0;i--){ if(g[i].gf<g[i].ga)l++; else break; }
    for(i=g.length-1;i>=0;i--){ if(g[i].gf<=g[i].ga)wl++; else break; }
    for(i=g.length-1;i>=0;i--){ if(g[i].gf>=g[i].ga)ub++; else break; }
    return {wins:w,losses:l,winless:wl,unbeaten:ub};
  }
  function h2hFromAll(homeName,awayName,homeID,awayID,dateStr,seasonYr,hist){
    var p=0,hw=0,aw=0,d=0,f=null,l=null,lr=null,lastDate="",seen={};
    function add(fwd,hg,ag,yr,dte){
      p++; f=f==null?yr:Math.min(f,yr); l=l==null?yr:Math.max(l,yr);
      var drew=hg===ag, thw=drew?null:(fwd?hg>ag:hg<ag);

      if(dte>=lastDate){ lastDate=dte; lr=drew?"D":(thw?"H":"A"); }
    }

      var yr=Number(String(s.season).slice(0,4));
      Object.keys(s.divisions||{}).forEach(function(k){
        ((s.divisions[k]||{}).matches||[]).forEach(function(m){
          var he=m.home_entity||m.home, ae=m.away_entity||m.away;
          var fwd=he===homeName&&ae===awayName, rev=he===awayName&&ae===homeName;
          if((!fwd&&!rev)||!m.date||m.date>=dateStr) return;
          seen[m.date]=1; add(fwd,m.home_goals,m.away_goals,yr,m.date);

      });
    });
    hist.forEach(function(m){ // this season's meetings NLS knows but the file may not
      var a=m.attributes,hID=a.homeTeam.teamID,aID=a.awayTeam.teamID;
      var fwd=hID===homeID&&aID===awayID, rev=hID===awayID&&aID===homeID;
      if(!fwd&&!rev) return;

  }
  async function loadMatchday(o){
    var C=COMPS[o.comp||"nl"];

    o.status("Fetching the season's matches…");
    var list=[], url=NLS_API+"/matches/?competitionID="+C.id+"&seasonID="+season+"&sort=-kickOffDateUTC&page.number=1&page.size=100";
    while(url){ var j=await fetchJSON(url); list=list.concat(j.data||[]); url=j.links&&j.links.next; }

    var per=function(m){return (m.attributes.matchPeriod||"").toLowerCase();};
    var done=["fulltime","postmatch"];
    var roundL=list.filter(function(m){return dOf(m)===o.date&&done.indexOf(per(m))>=0;});
    var ppL=list.filter(function(m){return dOf(m)===o.date&&per(m)==="postponed";});
    if(!roundL.length) throw new Error("No completed "+C.name+" matches on "+o.date+".");
    var hist=list.filter(function(m){return dOf(m)<o.date&&done.indexOf(per(m))>=0;})
      .sort(function(a,b){return (a.attributes.kickOffDateUTC||"")<(b.attributes.kickOffDateUTC||"")?-1:1;});
    // prior table + form/split streaks + clean-sheet drought (score-derived)
    var rows={},seq={};
    hist.forEach(function(m){
      var a=m.attributes,h=a.homeTeam.teamID,w=a.awayTeam.teamID,hs=a.homeTeam.score,as=a.awayTeam.score;
      if(hs==null||as==null) return;
      // beyond 46 games = play-offs (NLS serves them under the league
      // competitionID) — the league table is done, they contribute nothing
      var hr=rows[h],wr=rows[w];
      if((hr&&hr.P>=46)||(wr&&wr.P>=46)) return;
      [[h,hs,as,"h"],[w,as,hs,"a"]].forEach(function(x){
        var r=rows[x[0]]=rows[x[0]]||{P:0,W:0,D:0,L:0,GF:0,GA:0,Pts:0};
        r.P++;r.GF+=x[1];r.GA+=x[2];
        if(x[1]>x[2]){r.W++;r.Pts+=3;}else if(x[1]===x[2]){r.D++;r.Pts++;}else r.L++;
        (seq[x[0]]=seq[x[0]]||[]).push({ha:x[3],gf:x[1],ga:x[2]});
      });
    });
    o.status("Fetching club identity…");
    _meta=_meta||await fetchJSON(META_URL);
    var byOpta={}; _meta.clubs.forEach(function(c){ if(c.optaID) byOpta[c.optaID]=c; });
    var table=Object.keys(rows).map(function(k){var r=rows[k];return {k:k,Pts:r.Pts,GD:r.GF-r.GA,GF:r.GF};})
      .sort(function(a,b){return b.Pts-a.Pts||b.GD-a.GD||b.GF-a.GF||((byOpta[a.k]||{}).name||a.k).localeCompare((byOpta[b.k]||{}).name||b.k);});
    var posMap={}; table.forEach(function(r,i){posMap[r.k]=i+1;});
    // OFFICIAL baseline preferred: if the nightly archive holds this exact
    // date (2026-27 onwards), its table wins — points deductions included.
    // Derived-from-results remains the source for older dates (NB 2025-26
    // had no deductions, so derived is exact there anyway).
    var officialRows=null;
    try{
      o.status("Checking the official baseline archive…");
      if(!_baselines) _baselines=await fetchJSON(BASELINE_URL);
      var bd=_baselines.days&&_baselines.days[o.date];
      var bc=bd&&String(bd.season)===String(season)&&bd.competitions&&bd.competitions[o.comp||"nl"];
      if(bc&&bc.rows&&bc.rows.length>=20){
        officialRows=bc.rows;
        officialRows.forEach(function(r){ posMap[r.teamID]=r.pos; });
      }
    }catch(e){ /* archive unreachable — derived table stands */ }
    var nDone=0;
    o.status("Fetching match detail… (0/"+roundL.length+")");
    var details=await Promise.all(roundL.map(function(m){
      return fetchJSON(NLS_API+"/matches/"+m.id).then(function(d){ o.status("Fetching match detail… ("+(++nDone)+"/"+roundL.length+")"); return d; });
    }));
    if(!_alltime&&!_alltimeFailed){
      try{ o.status("Fetching head-to-head history… (one-off, ~2MB)"); _alltime=await fetchJSON(ALLTIME_URL); }
      catch(e){ _alltimeFailed=true; }
    }
    o.status("Building the matchday…");
    var usedTeams={};
    var fixtures=details.map(function(d){
      var at=d.data.attributes,teams=at.matchTeams||[];
      var homeID=at.homeTeamID,awayID=at.awayTeamID;
      var home=null,away=null;
      teams.forEach(function(t){ if(t.teamID===homeID)home=t; if(t.teamID===awayID)away=t; });
      if(!home||!away) throw new Error("Bad match data for "+at.matchID);
      usedTeams[homeID]=1; usedTeams[awayID]=1;
      var events=[];
      teams.forEach(function(t){
        var other=(t===home)?away:home, subOnAt={};
        ((t.events&&t.events.subs)||[]).forEach(function(w){ var s=w.substitutionEvents; if(s&&s.subOnID) subOnAt[s.subOnID]=evMinOf(w); });
        ((t.events&&t.events.goals)||[]).forEach(function(w){
          var g=w.goalEvents; if(!g) return;
          var type=String(g.goalType||"").toLowerCase(), own=type.indexOf("own")>=0, pen=type.indexOf("pen")>=0;
          var ev={min:evMinOf(w),type:"goal",team:own?other.teamID:t.teamID,name:pnameOf(g.player)};
          if(own) ev.og=true;
          if(pen) ev.pen=true;
          if(!own&&g.playerID!=null){ var on=subOnAt[g.playerID]; if(on!=null&&on<=ev.min) ev.cameo=on; }
          events.push(ev);
        });
        ((t.events&&t.events.bookings)||[]).forEach(function(w){
          var b=w.bookingEvents; if(!b) return;
          var card=String(b.cardType||b.card||"").toLowerCase();
          if(card.indexOf("red")<0&&card!=="secondyellow") return;
          var ev={min:evMinOf(w),type:"red",team:t.teamID,name:pnameOf(b.player)};
          if(card==="secondyellow") ev.sec=true;
          events.push(ev);
        });
      });
      events.sort(function(a,b){return a.min-b.min;});
      var ko=(at.kickOffUTC||"").replace(" ","T")+"Z";
      var hM=byOpta[homeID]||{},aM=byOpta[awayID]||{};
      var fxOut={
        gc:at.matchID, home:homeID, away:awayID, hs:home.score, as:away.score,
        date:ko, slot:new Date(ko).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit",timeZone:"Europe/London"}),
        pp:false, att:(at.matchDetails&&at.matchDetails.attendance)||null,
        ref:(at.matchDetails&&at.matchDetails.refereeName)||at.refereeName||null,
        h2h:h2hFromAll(hM.name||"",aM.name||"",homeID,awayID,o.date,season,hist),
        events:events
      };
      // play-offs (and any knockout tie) are matchType "Cup" — mark them so
      // the live table, arrows and stakes/race storylines leave them alone
      if(String(at.matchType||"").toLowerCase().indexOf("cup")>=0) fxOut.ko=true;
      return fxOut;
    });
    ppL.forEach(function(m){
      var a=m.attributes,ko=(a.kickOffDateUTC||"").replace(" ","T")+"Z";
      usedTeams[a.homeTeam.teamID]=1; usedTeams[a.awayTeam.teamID]=1;
      fixtures.push({gc:m.id,home:a.homeTeam.teamID,away:a.awayTeam.teamID,hs:null,as:null,date:ko,
        slot:new Date(ko).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit",timeZone:"Europe/London"}),pp:true,events:[]});
    });
    fixtures.sort(function(a,b){return a.date.localeCompare(b.date)||((byOpta[a.home]||{}).name||"").localeCompare((byOpta[b.home]||{}).name||"");});
    Object.keys(rows).forEach(function(k){usedTeams[k]=1;});
    if(officialRows) officialRows.forEach(function(r){usedTeams[r.teamID]=1;});
    var clubs={};
    Object.keys(usedTeams).forEach(function(k){
      var c=byOpta[k], s=seq[k]||[], all=trailStreaks(s);
      var hS=trailStreaks(s.filter(function(g){return g.ha==="h";})), aS=trailStreaks(s.filter(function(g){return g.ha==="a";}));
      var cs=0; for(var i=s.length-1;i>=0;i--){ if(s[i].ga>0)cs++; else break; }
      clubs[k]={ name:c?c.name:k, short:c?(c.short||c.name):k, nick:c?(c.nickname||c.short||c.name):k,
        lat:c?c.lat:53, lng:c?c.lng:-2,
        venue:c?(c.stadium_sponsor_name||c.stadium_name||c.short):k,
        col:{p:(c&&c.colors&&c.colors.primary)||"#666", s:(c&&c.colors&&c.colors.secondary)||"#fff", t:(c&&c.colors&&c.colors.tertiary)||"#fff"},
        pos:posMap[k]||null,
        winless:all.winless, unbeaten:all.unbeaten, wins:all.wins, losses:all.losses,
        split:{hWinless:hS.winless,hUnbeaten:hS.unbeaten,aWinless:aS.winless,aUnbeaten:aS.unbeaten},
        ident:{cs:cs} };
    });
    var priorOut={};
    if(officialRows){
      officialRows.forEach(function(r){ priorOut[r.teamID]={P:r.P,W:r.W,D:r.D,L:r.L,GF:r.GF,GA:r.GA,Pts:r.Pts}; });
    } else {
      Object.keys(rows).forEach(function(k){ var r=rows[k]; priorOut[k]={P:r.P,W:r.W,D:r.D,L:r.L,GF:r.GF,GA:r.GA,Pts:r.Pts}; });
    }
    var played=(officialRows?officialRows.map(function(r){return r.P;}):Object.keys(rows).map(function(k){return rows[k].P;})).sort(function(a,b){return a-b;});
    var roundNo=played.length?played[Math.floor(played.length/2)]+1:1;
    var label=(_meta.seasons&&_meta.seasons.list&&_meta.seasons.list[String(season)]&&_meta.seasons.list[String(season)].label)||(season+"-"+String(season+1).slice(2));
    // ---- swap in and restart the day ----
    D.round=roundNo; D.season=label; D.competition=C.name; D.clubs=clubs; D.prior=priorOut; D.fixtures=fixtures;
    pause(); hideSheet();
    st.stagger=!!o.stagger||!!o.startTime;   // a clock-time start implies real KO slots
    st.secPerMin=o.secPerMin||1;
    computeDerived();
    buildMap(); buildCards();
    setRoundLabel(); renderTable();
    $("nlhFootDate").textContent=new Date(o.date+"T12:00:00Z")
      .toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short",year:"numeric",timeZone:"UTC"}).replace(/,/g,"");
    if(o.startTime){
      // wall-clock start: minutes from the first KO of the day, TZ-safe via
      // the London-local label of the base kick-off
      var baseLbl=new Date(st.baseKOms).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit",timeZone:"Europe/London"});
      var toM=function(s){return (+s.slice(0,2))*60+(+s.slice(3,5));};
      var T=Math.max(0,toM(o.startTime)-toM(baseLbl));
      seek(Math.min(1,T/maxT())); play();
    } else {
      restart();
    }
  }

  // ---- wiring --------------------------------------------------------------
  function setRoundLabel(){
    $("nlhRound").textContent = D.competition+" · MD"+D.round+" · "+D.season;
  }
  function boot(){
    setRoundLabel();
    try{ $("nlhVer").textContent = "v"+((new URLSearchParams(location.search).get("v"))||BUILD); }catch(e){ $("nlhVer").textContent="v"+BUILD; }
    computeDerived();
    buildMap(); buildCards();
    setView("map"); paint(); renderTable();
    commStatic(C_IDLE);

    document.querySelectorAll("#nlHub .nlh__seg").forEach(function(b){
      b.addEventListener("click", function(){ setView(b.getAttribute("data-view")); });
    });
    $("nlhPlay").addEventListener("click", function(){ st.playing?pause():play(); });
    $("nlhRestart").addEventListener("click", restart);
    $("nlhSpeed").addEventListener("click", function(){
      st.rate = st.rate===1?2:st.rate===2?4:1;
      $("nlhSpeed").textContent = st.rate+"×";
    });
    var scrub=$("nlhScrub");
    scrub.addEventListener("click", function(e){
      var r=scrub.getBoundingClientRect(); seek((e.clientX-r.left)/r.width);
    });
    $("nlhFootTable").addEventListener("click", toggleTable);
    if (mqWide.matches) hubEl().classList.add("show-tablecol");   // wide desktop: the column IS the table by default
    $("nlhSheetClose").addEventListener("click", hideSheet);
    $("nlhSheet").addEventListener("click", function(e){ if(e.target===$("nlhSheet")) hideSheet(); });

    // matchday setup dialog
    var setup=$("nlhSetup");
    $("nlhLoadBtn").addEventListener("click", function(){
      var di=$("nlhSetDate");
      if(!di.value) di.value=((D.fixtures[0]&&D.fixtures[0].date)||"").slice(0,10);
      di.max=new Date().toISOString().slice(0,10);
      var stat=$("nlhSetStatus"); stat.textContent=""; stat.className="nlh__setupstatus";
      setup.hidden=false;
    });
    $("nlhSetupClose").addEventListener("click", function(){ setup.hidden=true; });
    setup.addEventListener("click", function(e){ if(e.target===setup) setup.hidden=true; });
    $("nlhSetStart").addEventListener("change", function(){ $("nlhSetTimeWrap").hidden = this.value!=="clock"; });
    $("nlhSetGo").addEventListener("click", function(){
      var btn=$("nlhSetGo"), stat=$("nlhSetStatus");
      var dateV=$("nlhSetDate").value;
      if(!dateV){ stat.textContent="Pick a date first."; stat.className="nlh__setupstatus is-error"; return; }
      btn.disabled=true; stat.className="nlh__setupstatus";
      loadMatchday({
        date:dateV, comp:$("nlhSetComp").value,
        startTime: $("nlhSetStart").value==="clock" ? $("nlhSetTime").value : null,
        secPerMin: parseFloat($("nlhSetPace").value)||1,
        stagger: $("nlhSetReal").checked,
        status: function(m){ stat.textContent=m; }
      }).then(function(){ btn.disabled=false; setup.hidden=true; })
        .catch(function(e){ btn.disabled=false; stat.textContent=(e&&e.message)||"Couldn't load that matchday."; stat.className="nlh__setupstatus is-error"; });
    });

    var rt; window.addEventListener("resize", function(){ clearTimeout(rt); rt=setTimeout(layoutPins,120); });
    window.addEventListener("orientationchange", function(){ setTimeout(layoutPins,300); });
    // crossing the mobile/desktop breakpoint re-lays the map and paints all panels
    var onMode=function(){ setTimeout(function(){ layoutPins(); paint(); },60); };
    if (mqDesk.addEventListener) mqDesk.addEventListener("change", onMode); else mqDesk.addListener(onMode);
    requestAnimationFrame(layoutPins); // ensure aligned once the stage has real dimensions
  }
  boot();
})();
</script>
</body>
</html>
