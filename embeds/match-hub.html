  ============================================================================
  NL MATCH HUB  —  standalone full-page matchday replay
  ============================================================================
  One matchday, three lenses the fan flips between, sharing ONE timeline model:
    • MAP    — full-bleed England+Wales map, pins are mini-scoreboards,
               goals erupt as full-screen stings.
    • CARDS  — responsive grid of match cards (crests · live score · scorers).
    • TICKER — vidiprinter strip, events typed in real-minute order.

  DELIVERY: a self-contained, FULL-PAGE HTML app (its own document, own
  viewport) — a full-screen experience on mobile, not a CMS-inline card.
  Served at its own URL and iframed where it needs embedding. This is NOT part
  of the gated tools system: no auth-guard, no Firebase gate, no nl-brand.css,
  no topbar/portal wiring. It only BORROWS the Carbona font + brand colour
  tokens (declared inline). Everything is inline; no external scripts.

  MODE: REPLAY of a FINISHED matchday. The real-minute clock already models a
  live clock, so "live later" is a DATA SWAP (point window.__DATA__ at a live
  feed), not a rebuild. Match state is DERIVED from a single wall clock.

  DATA: window.__DATA__ below is REAL National League data — Round 39
  (2026-03-21): fixtures, final scores, scorers, minutes and red cards from the
  season events export, with club identity (coords/colours) joined from the
  canonical assets/data/clubs-meta.json by optaID, and full 24-team standings.
  All fixtures reconcile 100% to their results. A production build can swap this
  __DATA__ block (or point it at a live feed) — the timeline model is unchanged.

  CHANGELOG
    v0.1.0 (2026-07-11) — Initial v1: switcher + shared timeline engine +
                          map / cards / ticker views, replay playback, goal
                          stings, FT league-table sheet. Sample data inlined.
    v0.2.0 (2026-07-11) — Full-page rework: real HTML document + viewport
                          meta (fixes tiny/floating on mobile), fills the
                          viewport (100dvh) instead of a 460px card, map is
                          full-bleed with aspect-independent pin alignment
                          (layoutPins + resize), safe-area insets.
    v0.3.0 (2026-07-11) — Brand + polish pass: real Carbona @font-face (the
                          v1 token was a placeholder — font never loaded);
                          NL-navy surface palette; REAL England+Wales coastline
                          (Natural Earth, clipped at the border, 138 pts);
                          scores tick over on change; goal sting made dramatic
                          (crests fly in, score slams); map pins de-overlap
                          (force relaxation); ticker shows the scoring team
                          (crest + colour), adds per-match FT lines, and puts
                          newest at the top.
    v0.4.0 (2026-07-11) — Live commentary engine: radio-style captions with a
                          big varied phrase pool. Each goal gets a two-beat
                          treatment — a TEASE ("a goal at Damson Park… but who?")
                          while the score is held hidden, then a REVEAL naming
                          the team + scorer. Context-aware by situation (opener /
                          equaliser / go-ahead / extends / consolation / OG).
                          Also narrates KO / HT / FT and red cards.
    v0.5.0 (2026-07-11) — REAL DATA. Wired in National League Round 39
                          (2026-03-21) from the events-enabled season export:
                          real fixtures, scores, scorers, minutes and reds (100%
                          reconcile), full 24-team prior standings for the FT
                          table, identity from clubs-meta. Timeline now handles
                          stoppage — per-match FT sits after the last event and
                          labels show "90+n" (up to 108').
    v0.6.0 (2026-07-11) — Commentary depth: teams referred to by FULL name as a
                          collective ("Woking have levelled"); each reveal now
                          DWELLS (longer hold) before play resumes; and an
                          occasional context line drawn from the live table +
                          season form — go-top / leapfrog, rare-away-win watch,
                          rescue-a-point comebacks (trailing since the Nth),
                          win-drought watch, consecutive-scorer streaks. Needs
                          pos/winless/unbeaten (per club) + strk (per goal) in
                          the data. NOTE: the export only has "F. Surname" for
                          players — full first names aren't available.
    v0.7.0 (2026-07-11) — Cinematic zoom: on the map, each goal's TEASE now
                          flies the map into that ground (score still hidden),
                          holds through the reveal, then zooms back out.
    v0.8.0 (2026-07-11) — Reveal polish: the scoreline now ODOMETER-rolls the
                          scoring digit (old→new) in the sting; reveals name the
                          team once then use the collective ("they lead 2–1")
                          and let the crest/pins carry the scoreline instead of
                          repeating the club; and full-time now winds down with
                          an outro line before the table eases up (no hard cut).
    v0.8.1 (2026-07-11) — Fix odometer: the animation was moving the clipping
                          window, so the old digit lifted away and the new one
                          never appeared. Now an inner reel rolls inside a fixed
                          window — the new score lands correctly.
    v0.8.2 (2026-07-11) — Ticker goal lines: drop the redundant leading team
                          name (the crest shows it); line is now crest · scorer
                          · scoreline, with the SCORING side of the score bold
                          white and the other side dimmed.
    v0.9.0 (2026-07-11) — Version badge in the footer (shows ?v=… or the build
                          number) so you can confirm what's loaded. More form
                          storylines: win streaks ("eyeing a 3rd win on the
                          spin"), ending a losing run, unbeaten-run watch — off
                          injected wins/losses per club. (Head-to-head history
                          still to come — needs the master results JSON.)
    v0.9.1 (2026-07-11) — Collective-noun fixes in the tease pool ("have {team}
                          doubled up", "are {team} running riot"). New swing
                          storyline: come-from-behind to lead ("turned this right
                          around — from behind to in front").
    v0.10.0 (2026-07-11) — Big context + presentation pass. KICKOFF previews:
                          before the action, the map floats ground to ground
                          (ordered by KO time, ties alphabetical) with a team-
                          news line for each ("the hosts chasing a 3rd straight
                          win, the visitors desperate to end a losing run").
                          Two-phase sting: the full-screen fires EARLY as we
                          float in — neutral colour, score hidden — then washes
                          to the scoring team's colour with a glow and the score
                          rolls over; longer dwell after. New storylines: brace/
                          hat-trick; smarter margins (restore vs stretch vs
                          rout); six-pointers; title/play-off/drop-race stakes.
    v0.10.1 (2026-07-11) — Kickoff previews use club NICKNAMES ("The Iron",
                          "The Shrimpers"); each preview holds longer so it can
                          be read. Sting + table crests get object-fit:contain
                          so non-square crests keep their aspect (no stretch).
    v0.11.0 (2026-07-11) — HEAD-TO-HEAD history in the kickoff previews, from
                          the master all-time results (thenationalleague/site
                          results.json), matched by home/away ENTITY. Per R39
                          pairing: meetings, who holds the edge, honours-even,
                          fixtures dating back decades, "met just once". NL-only
                          data, so it never claims "first ever meeting". Preview
                          hold now scales to line length so longer ones breathe.
    v0.12.0 (2026-07-11) — Goal-timing layer. Reveals mention the timing
                          directly: stoppage ("deep into stoppage time — the
                          96th minute!"), on the stroke of half-time, straight
                          after the restart, and early goals. Timing storylines
                          for the big moments: a late/stoppage winner or
                          equaliser from a level score ("what a time to strike —
                          this could be the winner", "a priceless point pinched
                          at the very last").
    v0.13.0 (2026-07-11) — Timing + sting rework. Finer timing windows (opening
                          five, stroke of half-time, after the restart, hour
                          mark, closing stages, and stoppage graded 90+1/2 =
                          "into", 90+3-5 = "deep into", 90+6 = "last kick" — so
                          90+1 is no longer "deep"). Goal minute now shows 90+n
                          (e.g. 90+8) on the sting, ticker and cards. Sting: the
                          word GOAL only appears on the reveal (not the tease);
                          scores sit in boxes and the scoring box rolls its digit
                          and turns white→gold (held), replacing the green text.
    v0.13.1 (2026-07-11) — Fixes: (1) rolled score now lands centred in the box
                          (reel was being flex-centred). (2) Commentary bar is a
                          FIXED height and scrolls internally, so a growing/
                          wrapping caption no longer shoves the map (no jump).

                          always names the draws ("Halifax have the edge — 9
                          wins to 5, with 7 draws"); adds a last-meeting angle
                          ("out to avenge last season's defeat", "first meeting
                          at this level since 2019").

<style>
/* ===== Carbona (inline @font-face; brand typeface) ===== */
@font-face{
  font-family:"carbona-variable";
  src:url("https://use.typekit.net/af/184cf2/0000000000000000774c3175/31/l?primer=7cdcb44be4a7db8877ffa5c0007b8dd865b3bbc383831fe2ea177f62257a9191&fvd=n4&v=3") format("woff2"),
      url("https://use.typekit.net/af/184cf2/0000000000000000774c3175/31/d?primer=7cdcb44be4a7db8877ffa5c0007b8dd865b3bbc383831fe2ea177f62257a9191&fvd=n4&v=3") format("woff");
  font-display:swap;font-style:normal;font-weight:200 900;font-stretch:normal;
}

html,body{margin:0;padding:0;height:100%;background:#060b18}
body{overflow:hidden}

#nlHub{
  /* brand tokens (inline — this page only BORROWS them, it is not a tool) */
  --primary:#9e0000; --primary-600:#7e0000;
  --navy:#223b7c; --navy-800:#091533; --navy-900:#03081b;
  --green:#1a7030; --amber:#c96f15; --blue:#1565c0;
  --gold:#b8860b; --live:#4ade80;
  --ink:#060b18;        /* deep NL-navy stage bg (brand navy family)  */
  --ink-2:#0f1a30;      /* raised surface (navy-tinted)               */
  --line:#243352;       /* hairlines on dark (navy)                   */
  --text:#eef2f9; --muted:#9fb0cc;
  --pos-champ:#7F99DC; --pos-po:#3760C8; --pos-releg:#192C5C;

  box-sizing:border-box;
  font-family:"carbona-variable","carbona",system-ui,sans-serif;
  font-variation-settings:"wght" 400;
  -webkit-font-smoothing:antialiased;
  /* full-page app: fill the viewport on mobile, centred phone column on desktop */
  width:100%; max-width:560px; margin:0 auto;
  height:100vh; height:100dvh;
  display:flex; flex-direction:column;
  color:var(--text);
  background:var(--ink);
  overflow:hidden;
}
#nlHub *,#nlHub *::before,#nlHub *::after{box-sizing:border-box}
#nlHub button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
/* our display:flex rules out-specify the UA [hidden] default — restore it */
#nlHub [hidden]{display:none!important}

/* ===== Topbar ===== */
#nlHub .nlh__topbar{flex:0 0 auto;padding:max(12px,env(safe-area-inset-top)) 14px 10px;background:linear-gradient(180deg,var(--navy-900),var(--ink));border-bottom:1px solid var(--line)}
#nlHub .nlh__brandrow{display:flex;align-items:baseline;gap:9px;margin-bottom:10px}
#nlHub .nlh__wordmark{font-variation-settings:"wght" 900;font-weight:900;letter-spacing:.10em;font-size:17px}
#nlHub .nlh__round{font-variation-settings:"wght" 700;color:var(--muted);font-size:11px;letter-spacing:.07em;text-transform:uppercase}
#nlHub .nlh__switch{display:flex;gap:4px;background:var(--ink-2);padding:4px;border-radius:999px}
#nlHub .nlh__seg{flex:1;padding:7px 0;border-radius:999px;font-size:12.5px;font-variation-settings:"wght" 800;font-weight:800;letter-spacing:.04em;color:var(--muted);transition:.18s}
#nlHub .nlh__seg.is-active{background:var(--primary);color:#fff}

/* ===== Stage ===== */
#nlHub .nlh__stage{position:relative;flex:1 1 auto;min-height:0;width:100%;background:radial-gradient(120% 90% at 50% 8%,#101a30 0%,var(--ink) 70%);overflow:hidden}
#nlHub .nlh__view{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .22s}
#nlHub .nlh__view.is-active{opacity:1;visibility:visible}

/* ===== Map ===== */
#nlHub .nlh__mapzoom{position:absolute;inset:0;transform-origin:0 0;transition:transform .9s cubic-bezier(.35,0,.15,1);will-change:transform}
#nlHub .nlh__mapsvg{position:absolute;inset:0;width:100%;height:100%}
#nlHub .nlh__mapsvg path{fill:#0e1a33;stroke:#2b3d63;stroke-width:2.2;stroke-linejoin:round}
#nlHub .nlh__pins{position:absolute;inset:0}
#nlHub .nlh__pin{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;transition:top .3s,left .3s}
#nlHub .nlh__pinboard{display:flex;align-items:center;gap:0;background:var(--ink-2);border:1px solid var(--line);border-radius:7px;box-shadow:0 3px 10px rgba(0,0,0,.5);overflow:hidden}
#nlHub .nlh__pinside{display:flex;align-items:center;gap:3px;padding:2px 4px}
#nlHub .nlh__pinside img,#nlHub .nlh__crestfb{width:15px;height:15px;object-fit:contain;border-radius:2px;flex:0 0 auto}
#nlHub .nlh__crestfb{display:flex;align-items:center;justify-content:center;font-size:7px;font-variation-settings:"wght" 900;font-weight:900;color:#fff}
#nlHub .nlh__pinsc{font-variation-settings:"wght" 900;font-weight:900;font-size:12px;min-width:9px;text-align:center;font-variant-numeric:tabular-nums}
#nlHub .nlh__pindiv{width:1px;align-self:stretch;background:var(--line)}
#nlHub .nlh__pinmin{font-variation-settings:"wght" 800;font-weight:800;font-size:9px;padding:1px 5px;border-radius:999px;background:#0a1428;color:var(--muted);border:1px solid var(--line);letter-spacing:.03em;white-space:nowrap}
#nlHub .nlh__pinmin.is-live{color:#031;background:var(--live);border-color:var(--live)}
#nlHub .nlh__pinmin.is-ft{color:#eafff0;background:var(--green);border-color:var(--green)}
#nlHub .nlh__pin.is-goal .nlh__pinboard{animation:nlhPulse .7s ease}
@keyframes nlhPulse{0%{transform:scale(1)}35%{transform:scale(1.34);box-shadow:0 0 0 3px var(--live)}100%{transform:scale(1)}}
/* score tick-over — digits roll/pop when they change (pins + cards) */
#nlHub .nlh__pinsc.is-tick,#nlHub .nlh__cardteam .sc.is-tick{animation:nlhTick .5s cubic-bezier(.2,.9,.2,1)}
@keyframes nlhTick{0%{transform:translateY(-.66em) scale(.5);opacity:.15;color:var(--live)}55%{transform:translateY(.05em) scale(1.35);color:var(--live)}100%{transform:none}}

/* Goal sting (full-stage, dramatic — crests fly in, score slams) */
#nlHub .nlh__sting{position:absolute;inset:0;z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px;overflow:hidden;transition:background .55s ease}
#nlHub .nlh__sting::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 44%,rgba(255,255,255,.30),transparent 46%);opacity:0}
#nlHub .nlh__sting.revealing::before{animation:nlhFlash .6s ease-out both}
#nlHub .nlh__sting.revealing{box-shadow:inset 0 0 120px 10px rgba(255,255,255,.10)}
@keyframes nlhFlash{0%{opacity:0;transform:scale(.2)}28%{opacity:1}100%{opacity:0;transform:scale(1.7)}}
/* "GOAL" is empty during the tease; it only appears (and pops) on the reveal */
#nlHub .nlh__sting-goal{position:relative;font-variation-settings:"wght" 900;font-weight:900;letter-spacing:.2em;font-size:34px;color:#fff;min-height:1.1em}
#nlHub .nlh__sting.revealing .nlh__sting-goal{animation:nlhGoalPop .5s cubic-bezier(.2,1.35,.3,1) both}
@keyframes nlhGoalPop{0%{transform:scale(.3) rotate(-7deg);opacity:0}60%{transform:scale(1.16) rotate(1deg)}100%{transform:none;opacity:1}}
#nlHub .nlh__sting-crests{position:relative;display:flex;align-items:center;gap:22px}
#nlHub .nlh__sting-crests img,#nlHub .nlh__sting-crests .nlh__crestfb{width:52px;height:52px;object-fit:contain;filter:drop-shadow(0 4px 10px rgba(0,0,0,.6))}
#nlHub .nlh__sting-crests .home{animation:nlhFlyL .55s cubic-bezier(.2,.9,.25,1) both}
#nlHub .nlh__sting-crests .away{animation:nlhFlyR .55s cubic-bezier(.2,.9,.25,1) both}
@keyframes nlhFlyL{0%{transform:translateX(-130px) rotate(-28deg);opacity:0}100%{transform:none;opacity:1}}
@keyframes nlhFlyR{0%{transform:translateX(130px) rotate(28deg);opacity:0}100%{transform:none;opacity:1}}
#nlHub .nlh__sting-score{position:relative;font-variation-settings:"wght" 900;font-weight:900;font-size:60px;line-height:1;font-variant-numeric:tabular-nums;display:flex;gap:12px;align-items:center}
#nlHub .nlh__sting-score .sdash{color:#fff;opacity:.85}
/* each score sits in its own BOX; the scoring box rolls its digit and its
   background goes white → gold (held), so the change is clear and lasts */
#nlHub .nlh__scorebox{display:inline-block;vertical-align:middle;min-width:1.05em;height:1.32em;padding:0 .14em;background:#f4f6f9;color:#0a1020;border-radius:.12em;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.45)}
#nlHub .nlh__scorebox .reel{display:block}   /* reel sits flush at the top of the box */
#nlHub .nlh__scorebox i{display:flex;align-items:center;justify-content:center;height:1.32em;font-style:normal}  /* each digit centred in its cell */
#nlHub .nlh__scorebox.rolling .reel{animation:nlhOdo .8s cubic-bezier(.3,1,.25,1) .3s both}
#nlHub .nlh__scorebox.rolling{animation:nlhBoxGold 1.5s ease .3s both}
@keyframes nlhOdo{0%{transform:translateY(0)}100%{transform:translateY(-1.32em)}}
@keyframes nlhBoxGold{0%{background:#f4f6f9}22%{background:#f5c400}100%{background:#f5c400}}
#nlHub .nlh__sting-scorer{position:relative;font-variation-settings:"wght" 800;font-weight:800;font-size:17px;animation:nlhRise .5s ease .2s both}
@keyframes nlhRise{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
#nlHub .nlh__sting-scorer .m{color:#fff;opacity:.8;margin-right:6px}
#nlHub .nlh__sting-tag{position:relative;font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-variation-settings:"wght" 800;font-weight:800;opacity:.75;animation:nlhRise .5s ease .28s both}

/* Beat cards (KO/HT/2nd half/FT) */
#nlHub .nlh__beat{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;animation:nlhStingIn .3s ease;background:rgba(3,8,27,.35)}
#nlHub .nlh__beat span{font-variation-settings:"wght" 900;font-weight:900;letter-spacing:.16em;font-size:30px;text-transform:uppercase;padding:14px 26px;border:2px solid rgba(255,255,255,.25);border-radius:12px;background:rgba(10,20,40,.6)}

/* ===== Cards ===== */
#nlHub .nlh__cards{overflow-y:auto;padding:12px}
#nlHub .nlh__grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#nlHub .nlh__card{background:var(--ink-2);border:1px solid var(--line);border-radius:10px;padding:9px;display:flex;flex-direction:column;gap:7px}
#nlHub .nlh__cardhd{display:flex;justify-content:space-between;align-items:center}
#nlHub .nlh__cardmin{font-size:9.5px;font-variation-settings:"wght" 800;font-weight:800;padding:1px 6px;border-radius:999px;background:#0a1428;border:1px solid var(--line);color:var(--muted);letter-spacing:.03em}
#nlHub .nlh__cardmin.is-live{color:#031;background:var(--live);border-color:var(--live)}
#nlHub .nlh__cardmin.is-ft{color:#eafff0;background:var(--green);border-color:var(--green)}
#nlHub .nlh__cardteam{display:flex;align-items:center;gap:6px}
#nlHub .nlh__cardteam img,#nlHub .nlh__cardteam .nlh__crestfb{width:18px;height:18px;object-fit:contain}
#nlHub .nlh__cardteam .nm{flex:1;font-size:12px;font-variation-settings:"wght" 700;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#nlHub .nlh__cardteam .sc{font-variation-settings:"wght" 900;font-weight:900;font-size:16px;font-variant-numeric:tabular-nums;min-width:12px;text-align:right}
#nlHub .nlh__cardteam.win .nm,#nlHub .nlh__cardteam.win .sc{color:#fff}
#nlHub .nlh__cardteam.lose{opacity:.62}
#nlHub .nlh__scorers{border-top:1px solid var(--line);padding-top:6px;min-height:14px;display:flex;flex-wrap:wrap;gap:2px 10px}
#nlHub .nlh__scorer{font-size:9.5px;color:var(--muted);font-variation-settings:"wght" 600;font-weight:600}
#nlHub .nlh__scorer .m{color:var(--text);opacity:.65}
#nlHub .nlh__scorer.og .m::after{content:" OG"}

/* ===== Ticker ===== */
#nlHub .nlh__ticker{overflow:hidden}
#nlHub .nlh__feed{list-style:none;margin:0;padding:10px 12px;height:100%;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
#nlHub .nlh__line{background:var(--ink-2);border:1px solid var(--line);border-left:3px solid var(--line);border-radius:8px;padding:7px 10px;font-size:12.5px;line-height:1.3;animation:nlhLineIn .28s ease;display:flex;gap:7px;align-items:center}
@keyframes nlhLineIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#nlHub .nlh__line .lm{font-variation-settings:"wght" 900;font-weight:900;font-variant-numeric:tabular-nums;color:var(--muted);min-width:26px;text-align:right}
#nlHub .nlh__line .lcr{width:20px;height:20px;object-fit:contain;flex:0 0 auto;border-radius:3px}
#nlHub .nlh__line .lt{flex:1;min-width:0}
#nlHub .nlh__line .ltag{font-variation-settings:"wght" 900;font-weight:900;font-size:9px;letter-spacing:.06em;padding:2px 5px;border-radius:4px;flex:0 0 auto;color:#04120a}
#nlHub .nlh__line .lteam{font-variation-settings:"wght" 900;font-weight:900}
#nlHub .nlh__line .lscore{font-variation-settings:"wght" 700;font-weight:700;font-variant-numeric:tabular-nums;color:var(--text)}
#nlHub .nlh__line .lscore b{font-variation-settings:"wght" 900;font-weight:900;color:#fff}
#nlHub .nlh__line .lscore .lsub{font-variation-settings:"wght" 600;font-weight:600;color:var(--muted)}
#nlHub .nlh__line .lsub{color:var(--muted)}
#nlHub .nlh__line.goal{border-left-color:var(--live)}
#nlHub .nlh__line.goal .ltag{background:var(--live)}
#nlHub .nlh__line.red{border-left-color:#ff5a5a}

<script>
(function () {
  "use strict";
  var D = window.__DATA__;
  if (!D) return;

  var CREST_BASE = "https://raw.githubusercontent.com/thenationalleague/tools/main/assets/crests/";
  var BUILD = "18";   // bump on each deploy; the footer shows ?v=… if present, else this
  var HALF = 45, BREAK = 15, FT_RMIN = HALF + BREAK + HALF; // 105

  // ---- helpers -------------------------------------------------------------
  var $  = function (id) { return document.getElementById(id); };
  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
  function crestURL(name){ return CREST_BASE + encodeURIComponent(name) + ".png"; }
  function club(k){ return D.clubs[k] || {name:k,short:k,col:{p:"#666",s:"#fff",t:"#fff"},lat:53,lng:-2}; }
  // crest <img> with coloured-disc fallback (crests can't be verified in CI)
  function crestHTML(k, cls){
    var c = club(k), init = (c.short||c.name).slice(0,3).toUpperCase();
    var fb = "this.onerror=null;this.outerHTML='<span class=\\'nlh__crestfb "+(cls||"")+"\\' style=\\'background:"+c.col.p+";color:"+ideal(c.col.p)+"\\'>"+init+"</span>';";
    return '<img class="'+(cls||"")+'" src="'+crestURL(c.name)+'" alt="'+esc(c.name)+'" onerror="'+fb+'">';
  }
  // pick black/white text for a bg (also used for near-white crest fallback legibility)
  function ideal(hex){
    var m = /^#?([0-9a-f]{6})$/i.exec(hex||""); if(!m) return "#fff";
    var n=parseInt(m[1],16), r=n>>16, g=(n>>8)&255, b=n&255;
    return (0.299*r+0.587*g+0.114*b) > 150 ? "#111" : "#fff";
  }
  // near-white club colour → fall back to secondary for washes/legibility
  function washCol(c){ return ideal(c.p)==="#111" && c.s ? c.s : c.p; }

  // ---- timeline model ------------------------------------------------------
  // real-minute of an event, HT break folded in, plus its slot's KO offset
  function koOffset(fx){ return fx._ko || 0; } // all 0 (synchronised replay)
  // real-minute of an event (15-min HT break folded in); a 45' goal sits at the
  // end of the first half (not in the HT window)
  function evRmin(ev, fx){ var m=ev.min; return koOffset(fx) + (m < HALF ? m : (m===HALF ? HALF-0.08 : m + BREAK)); }
  // stoppage-aware minute label: 2nd half > 90 → "90+n", 1st half > 45 → "45+n"
  function dispMin(m, half){
    if (half===1) return m>HALF ? "45+"+(m-HALF) : ""+m;
    return m>90 ? "90+"+(m-90) : ""+m;
  }
  // goal-minute label for scorers/tickers/sting — stoppage shown as "90+8", not "98"
  function minLabel(m){ return m>90 ? "90+"+(m-90) : (""+m); }
  // per-fixture full-time rmin sits AFTER its last event, so stoppage-time goals
  // (min up to 108') play out before that match reads "FT"
  D.fixtures.forEach(function(fx){
    var last=0; fx.events.forEach(function(ev){ last=Math.max(last, evRmin(ev,fx)); });
    fx._ft = Math.max(koOffset(fx)+FT_RMIN, last+2);
  });
  var maxFt = D.fixtures.reduce(function(m,fx){ return Math.max(m, fx._ft); }, FT_RMIN);

  // per-fixture derived state at global time T (real-minutes since first KO)
  function stateOf(fx, T){
    var local = T - koOffset(fx);
    if (fx.pp) return {phase:"pp", label:"P-P", live:false};
    if (local < 0)          return {phase:"pre", label:fx.slot, live:false};
    if (local < HALF)       return {phase:"1h", label:dispMin(Math.max(1,Math.floor(local)),1)+"'", live:true};
    if (local < HALF+BREAK) return {phase:"ht", label:"HT", live:true};
    if (local < fx._ft)     return {phase:"2h", label:dispMin(Math.floor(local-BREAK),2)+"'", live:true};
    return {phase:"ft", label:"FT", live:false};
  }
  // running score at T (own goals credited to the other side)
  function scoreAt(fx, T){
    var h=0,a=0;
    fx.events.forEach(function(ev){
      if (ev.type!=="goal") return;
      if (evRmin(ev,fx) > T) return;
      var forHome = (ev.team===fx.home) !== !!ev.og; // XOR own-goal flip
      if (forHome) h++; else a++;
    });
    return {h:h,a:a};
  }
  function scorersAt(fx, side, T){ // side 'h'|'a' → array of {name,min,og}
    return fx.events.filter(function(ev){
      if (ev.type!=="goal" || evRmin(ev,fx)>T) return false;
      var forHome=(ev.team===fx.home)!==!!ev.og;
      return side==="h" ? forHome : !forHome;
    }).map(function(ev){ return {name:ev.name,min:ev.min,og:ev.og}; });
  }
  function maxT(){ return maxFt + 4; }
  // shared matchday wall clock (stoppage-aware)
  function clockLabel(T){
    if (T <= 0) return "0'";
    if (T < HALF) return Math.floor(T)+"'";
    if (T < HALF+BREAK) return "HT";
    if (T < maxFt) return dispMin(Math.floor(T-BREAK),2)+"'";
    return "FT";
  }

  // sorted list of every timeline "moment" (events + phase beats) for lull-skip
  var MOMENTS = [];
  D.fixtures.forEach(function(fx){
    fx.events.forEach(function(ev){ MOMENTS.push(evRmin(ev,fx)); });
  });
  D.fixtures.forEach(function(fx){ MOMENTS.push(fx._ft); });
  [0,HALF,HALF+BREAK,maxFt].forEach(function(m){ MOMENTS.push(m); });
  MOMENTS = MOMENTS.filter(function(v,i,a){return a.indexOf(v)===i;}).sort(function(x,y){return x-y;});
  function nextMoment(T){
    for (var i=0;i<MOMENTS.length;i++){ if (MOMENTS[i] > T+0.001) return MOMENTS[i]; }
    return maxT();
  }

  // ---- map projection (preserve England+Wales shape into the 3:4 stage) ----
  var proj = (function(){
    var midLat = 53, k = Math.cos(midLat*Math.PI/180); // lng compression
    var xs = D.gb.map(function(p){return p[0]*k;}), ys = D.gb.map(function(p){return p[1];});
    var minX=Math.min.apply(0,xs), maxX=Math.max.apply(0,xs);
    var minY=Math.min.apply(0,ys), maxY=Math.max.apply(0,ys);
    var cX=(minX+maxX)/2, cY=(minY+maxY)/2;
    var boxW=3, boxH=4, pad=0.90;
    var scale = Math.min(boxW/(maxX-minX), boxH/(maxY-minY)) * pad;
    return function(lng,lat){
      var x = boxW/2 + (lng*k - cX)*scale;
      var y = boxH/2 - (lat  - cY)*scale;
      return { nx:x/boxW, ny:y/boxH }; // normalised 0..1 within stage
    };
  })();

  // ---- state ---------------------------------------------------------------
  var st = { T:0, playing:false, rate:1, view:"map", raf:0, last:0,
             fired:{}, ftShown:false, feedBuilt:{}, beatShown:{},
             suspend:null, kickoff:null, koShown:false, _pick:{}, _typeIv:0 };
  function evId(fx,ev){ return fx.gc+"_"+ev.type+"_"+ev.min+"_"+(ev.name||""); }

  // ---- MAP: static outline + pins ------------------------------------------
  function buildMap(){
    var d = D.gb.map(function(p,i){ var q=proj(p[0],p[1]); return (i?"L":"M")+(q.nx*1000).toFixed(1)+" "+(q.ny*1333).toFixed(1); }).join(" ")+" Z";
    $("nlhMapSvg").innerHTML = '<path d="'+d+'"/>';
    var pins = D.fixtures.map(function(fx){
      return '<div class="nlh__pin" id="pin_'+fx.gc+'">'+
               '<div class="nlh__pinboard">'+
                 '<div class="nlh__pinside">'+crestHTML(fx.home)+'<span class="nlh__pinsc" data-h></span></div>'+
                 '<div class="nlh__pindiv"></div>'+
                 '<div class="nlh__pinside"><span class="nlh__pinsc" data-a></span>'+crestHTML(fx.away)+'</div>'+
               '</div>'+
               '<div class="nlh__pinmin" data-min></div>'+
             '</div>';
    }).join("");
    $("nlhPins").innerHTML = pins;
    layoutPins();
  }
  // Position pins to match the SVG outline's contain-fit ("meet"), so they
  // stay aligned to the coastline at ANY stage aspect (full-bleed, any device).
  function layoutPins(){
    var stage=$("nlhStage"); if(!stage) return;
    var W=stage.clientWidth, H=stage.clientHeight;
    if(!W || !H){ requestAnimationFrame(layoutPins); return; }
    var mapAspect=3/4, mw,mh,ox,oy;
    if (W/H > mapAspect){ mh=H; mw=H*mapAspect; ox=(W-mw)/2; oy=0; }
    else { mw=W; mh=W/mapAspect; ox=0; oy=(H-mh)/2; }
    // true geographic positions, then relax so overlapping boards give each other space
    var nodes = D.fixtures.map(function(fx){
      var el=$("pin_"+fx.gc), c=club(fx.home), q=proj(c.lng,c.lat);
      return { el:el, x:ox+q.nx*mw, y:oy+q.ny*mh, w:(el&&el.offsetWidth)||74, h:(el&&el.offsetHeight)||38 };
    }).filter(function(n){return n.el;});
    var gap=7;
    for (var pass=0; pass<80; pass++){
      for (var i=0;i<nodes.length;i++) for (var j=i+1;j<nodes.length;j++){
        var a=nodes[i], b=nodes[j], dx=b.x-a.x, dy=b.y-a.y;
        var needX=(a.w+b.w)/2+gap-Math.abs(dx), needY=(a.h+b.h)/2+gap-Math.abs(dy);
        if (needX>0 && needY>0){ // boxes overlap — push apart along the shallower axis
          if (needX<needY){ var sx=(dx<0?-1:1)*needX/2; a.x-=sx; b.x+=sx; }
          else            { var sy=(dy<0?-1:1)*needY/2; a.y-=sy; b.y+=sy; }
        }
      }
      nodes.forEach(function(n){ n.x=Math.max(n.w/2+2,Math.min(W-n.w/2-2,n.x)); n.y=Math.max(n.h/2+2,Math.min(H-n.h/2-2,n.y)); });
    }
    nodes.forEach(function(n){ n.el.style.left=(n.x/W*100).toFixed(3)+"%"; n.el.style.top=(n.y/H*100).toFixed(3)+"%"; });
  }
  // set text; play the tick-over animation only on an increment (i.e. a goal)
  function tickText(el, val){
    if(!el) return;
    var s=String(val), prev=el.textContent;
    if (prev===s) return;
    el.textContent=s;
    if (prev!=="" && /^\d+$/.test(prev) && Number(s)>Number(prev)){
      el.classList.remove("is-tick"); void el.offsetWidth; el.classList.add("is-tick");
    }
  }
  function paintPins(){
    D.fixtures.forEach(function(fx){
      var pin=$("pin_"+fx.gc); if(!pin) return;
      var sc=scoreAt(fx,st.T), s=stateOf(fx,st.T);
      tickText(pin.querySelector("[data-h]"), s.phase==="pre" ? "" : sc.h);
      tickText(pin.querySelector("[data-a]"), s.phase==="pre" ? "" : sc.a);
      var min=pin.querySelector("[data-min]");
      min.textContent = s.label;
      min.className = "nlh__pinmin"+(s.phase==="ft"?" is-ft":s.live?" is-live":"");
    });
  }

  // ---- CARDS ---------------------------------------------------------------
  function buildCards(){
    $("nlhGrid").innerHTML = D.fixtures.map(function(fx){
      return '<div class="nlh__card" id="card_'+fx.gc+'">'+
        '<div class="nlh__cardhd"><span class="nlh__cardmin" data-min></span></div>'+
        row(fx,"h")+row(fx,"a")+
        '<div class="nlh__scorers" data-scorers></div></div>';
    }).join("");
    function row(fx,side){
      var k = side==="h"?fx.home:fx.away, c=club(k);
      return '<div class="nlh__cardteam" data-side="'+side+'">'+crestHTML(k)+
             '<span class="nm">'+esc(c.short)+'</span><span class="sc" data-sc></span></div>';
    }
  }
  function paintCards(){
    D.fixtures.forEach(function(fx){
      var card=$("card_"+fx.gc); if(!card) return;
      var sc=scoreAt(fx,st.T), s=stateOf(fx,st.T);
      var min=card.querySelector("[data-min]");
      min.textContent=s.phase==="pre"?fx.slot:s.label;
      min.className="nlh__cardmin"+(s.phase==="ft"?" is-ft":s.live?" is-live":"");
      card.querySelectorAll(".nlh__cardteam").forEach(function(t){
        var side=t.getAttribute("data-side"), v=side==="h"?sc.h:sc.a, ov=side==="h"?sc.a:sc.h;
        tickText(t.querySelector("[data-sc]"), s.phase==="pre"?"":v);
        t.classList.toggle("win",  s.phase!=="pre" && v>ov);
        t.classList.toggle("lose", s.phase!=="pre" && v<ov);
      });
      var box=card.querySelector("[data-scorers]");
      var hs=scorersAt(fx,"h",st.T), as=scorersAt(fx,"a",st.T);
      box.innerHTML = hs.concat(as).length ?
        [].concat(
          hs.map(function(g){return sc_("h",g);}),
          as.map(function(g){return sc_("a",g);})
        ).join("") : "";
      function sc_(sd,g){ return '<span class="nlh__scorer'+(g.og?" og":"")+'">'+esc(g.name)+' <span class="m">'+minLabel(g.min)+"'"+'</span></span>'; }
    });
  }

  // ---- TICKER --------------------------------------------------------------
  // ordered feed items: KO/HT/FT dividers + each event, all in rmin order
  var FEED = (function(){
    var items = [];
    items.push({rmin:0, kind:"divider", text:"Kick-off"});
    D.fixtures.forEach(function(fx){
      fx.events.forEach(function(ev){
        items.push({rmin:evRmin(ev,fx), kind:ev.type, ev:ev, fx:fx});
      });
      items.push({rmin:fx._ft-0.02, kind:"ft", fx:fx});   // per-match full-time result
    });
    items.push({rmin:HALF+0.5, kind:"divider", text:"Half-time"});
    items.push({rmin:HALF+BREAK+0.01, kind:"divider", text:"Second half"});
    items.push({rmin:maxFt, kind:"divider", text:"Full-time"});
    return items.map(function(it,i){it._id="f"+i;return it;}).sort(function(a,b){return a.rmin-b.rmin;});
  })();
  function lineHTML(it){
    if (it.kind==="divider") return '<li class="nlh__line divider" data-id="'+it._id+'">'+esc(it.text)+'</li>';
    var fx=it.fx, h=club(fx.home), a=club(fx.away);
    if (it.kind==="ft"){
      var f=scoreAt(fx, fx._ft);
      var hw=f.h>f.a?' class="win"':'', aw=f.a>f.h?' class="win"':'';
      return '<li class="nlh__line ft" data-id="'+it._id+'"><span class="lm">FT</span><span class="ltag">FT</span>'+
        crestHTML(fx.home,"lcr")+'<span class="lt"><span'+hw+'>'+esc(h.short)+'</span> <span class="lscore">'+f.h+'–'+f.a+
        '</span> <span'+aw+'>'+esc(a.short)+'</span></span>'+crestHTML(fx.away,"lcr")+'</li>';
    }
    var ev=it.ev, mm=minLabel(ev.min)+"'";
    if (it.kind==="goal"){
      var forHome=(ev.team===fx.home)!==!!ev.og;       // which side the goal counts for
      var team=forHome?h:a, sc=scoreAt(fx, it.rmin);
      // crest already says who — drop the leading team name; denote the scoring
      // side in the scoreline (bold + white), the other side dimmed
      var scoreLn = forHome
        ? '<b>'+esc(h.short)+' '+sc.h+'</b><span class="lsub">–'+sc.a+' '+esc(a.short)+'</span>'
        : '<span class="lsub">'+esc(h.short)+' '+sc.h+'–</span><b>'+sc.a+' '+esc(a.short)+'</b>';
      return '<li class="nlh__line goal" data-id="'+it._id+'" style="border-left-color:'+washCol(team.col)+'">'+
        '<span class="lm">'+mm+'</span><span class="ltag">GOAL</span>'+crestHTML(forHome?fx.home:fx.away,"lcr")+
        '<span class="lt">'+esc(ev.name)+(ev.og?' <span class="lsub">(OG)</span>':'')+
        ' · <span class="lscore">'+scoreLn+'</span></span></li>';
    }
    var rteam=ev.team===fx.home?h:a;                    // red card
    return '<li class="nlh__line red" data-id="'+it._id+'"><span class="lm">'+mm+'</span><span class="ltag">RED</span>'+

      var out="", left=shown;
      for(var i=0;i<segs.length;i++){ var s=segs[i], take=Math.max(0,Math.min(s.t.length,left)); left-=s.t.length;
        var txt=esc(s.t.slice(0,take)); if(!txt) continue; out+= s.b?'<span class="cbold">'+txt+'</span>':txt; }
      box.innerHTML=out+(shown<total?'<span class="ccar"></span>':'');
      box.scrollTop=box.scrollHeight;   // keep the caret in view within the fixed bar
    }
    render();
    var speed=Math.max(8, 24/(st.rate||1));
    st._typeIv=setInterval(function(){ shown+=2; if(shown>=total){shown=total;clearInterval(st._typeIv);} render(); }, speed);
  }
  function commStatic(str){ clearInterval(st._typeIv); $("nlhComm").className="nlh__comm"; $("nlhCommText").textContent=str; }

  // ---- stings & beats (map view) ------------------------------------------
  function scoreBox(o,n,roll){ return '<span class="nlh__scorebox'+(roll?" rolling":"")+'"><span class="reel"><i>'+o+'</i>'+(roll?'<i>'+n+'</i>':'')+'</span></span>'; }
  // TEASE: full-screen fires EARLY as we float in — neutral colour, current score
  // in white boxes, NO "GOAL" word yet (that only lands on the reveal)
  function stingTease(fx){
    if (st.view!=="map") return;
    var h=club(fx.home), a=club(fx.away), sc=scoreAt(fx, st.T);
    var el=$("nlhSting"); el.classList.remove("revealing");
    el.style.background = "radial-gradient(120% 90% at 50% 42%, #223052 0%, rgba(6,10,22,.94) 72%)";  // neutral
    el.innerHTML =
      '<div class="nlh__sting-goal" id="nlhStingGoal"></div>'+
      '<div class="nlh__sting-crests">'+crestHTML(fx.home,"home")+crestHTML(fx.away,"away")+'</div>'+
      '<div class="nlh__sting-score" id="nlhStingScore">'+scoreBox(sc.h,sc.h,false)+'<span class="sdash">–</span>'+scoreBox(sc.a,sc.a,false)+'</div>'+
      '<div class="nlh__sting-scorer" id="nlhStingScorer" style="visibility:hidden">·</div>'+
      '<div class="nlh__sting-tag">'+esc(h.short)+' v '+esc(a.short)+'</div>';
    el.hidden=false;
  }
  // REVEAL: "GOAL" appears, card washes to the scoring team's colour, the scoring
  // box rolls its digit and turns gold, and the scorer (with 90+n minute) lands
  function stingReveal(fx, ev){
    if (st.view!=="map") return;
    var el=$("nlhSting"); if(el.hidden) stingTease(fx);
    var sc=scoreAt(fx, evRmin(ev,fx)), forHome=(ev.team===fx.home)!==!!ev.og;
    var oldH=sc.h-(forHome?1:0), oldA=sc.a-(forHome?0:1);
    el.classList.add("revealing");
    el.style.background = "radial-gradient(120% 90% at 50% 40%,"+washCol(club(ev.team).col)+" 0%, rgba(6,10,22,.92) 72%)";
    var gl=$("nlhStingGoal"); if(gl) gl.innerHTML="G&nbsp;O&nbsp;A&nbsp;L";
    var se=$("nlhStingScore"); if(se) se.innerHTML = scoreBox(oldH,sc.h,forHome)+'<span class="sdash">–</span>'+scoreBox(oldA,sc.a,!forHome);
    var scr=$("nlhStingScorer"); if(scr){ scr.style.visibility="visible"; scr.innerHTML='<span class="m">'+minLabel(ev.min)+"'"+'</span>'+esc(ev.name)+(ev.og?" (OG)":""); }
    var pin=$("pin_"+fx.gc); if(pin){ pin.classList.add("is-goal"); setTimeout(function(){pin.classList.remove("is-goal");},700); }
  }
  function stingHide(){ var el=$("nlhSting"); el.hidden=true; el.classList.remove("revealing"); }
  function fireBeat(text){
    if (st.view!=="map") return;
    var el=$("nlhBeat"); el.innerHTML="<span>"+esc(text)+"</span>"; el.hidden=false;
    clearTimeout(st._beatT);
    st._beatT=setTimeout(function(){ el.hidden=true; }, st.playing? Math.max(700,1500/st.rate) : 1600);
  }

  var BEATS = [{r:0,t:"Kick-off",c:"ko"},{r:HALF,t:"Half-time",c:"ht"},{r:HALF+BREAK,t:"Second half",c:"2h"},{r:maxFt,t:"Full-time",c:"ft"}];
  // earliest not-yet-fired GOAL with rmin in (a,b]
  function nextGoalAt(a,b){
    var best=null;
    D.fixtures.forEach(function(fx){ fx.events.forEach(function(ev){
      if(ev.type!=="goal") return;
      var r=evRmin(ev,fx);
      if(r>a && r<=b && !st.fired[evId(fx,ev)] && (!best||r<best.rmin)) best={fx:fx,ev:ev,rmin:r,id:evId(fx,ev)};
    }); });
    return best;
  }
  // beats + reds fire on crossing; goals only when instantGoals (4× — no tease)
  function fireCrossed(prevT, T, instantGoals){
    D.fixtures.forEach(function(fx){ fx.events.forEach(function(ev){
      var r=evRmin(ev,fx), id=evId(fx,ev);
      if(r<=prevT || r>T || st.fired[id]) return;
      if(ev.type==="red"){ st.fired[id]=1; if(st.playing) typeSegs(redSegs(fx,ev),"red"); }
      else if(ev.type==="goal" && instantGoals){ st.fired[id]=1; stingReveal(fx,ev); clearTimeout(st._stingT); st._stingT=setTimeout(stingHide, Math.max(1400,2600/st.rate)); if(st.playing) typeSegs(revealSegs(fx,ev),"reveal-goal"); }
    }); });
    BEATS.forEach(function(b){
      if(b.r>=prevT && b.r<=T && !st.beatShown[b.r]){ st.beatShown[b.r]=1; fireBeat(b.t); if(st.playing) typeSegs(buildSegs(pick(C_BEAT[b.c],"bc"+b.c),{},[]),"beat"); }
    });
  }
  // goal suspense: hold the score, TEASE it, REVEAL, then DWELL so it can be read
  function beginSuspense(g, ts){
    st.fired[g.id]=1;
    st.suspend={ g:g, phase:"tease", until: ts + (st.rate===2?1800:2900) };
    if (st.view==="map"){ zoomTo(g.fx); stingTease(g.fx); }  // float in + neutral full-screen, ready
    typeSegs(teaseSegs(g.fx,g.ev),"tease");
  }
  function revealGoal(g){
    st.T = g.rmin + 0.0015;          // the score now includes this goal
    paint();                          // pins/cards tick over on the reveal
    stingReveal(g.fx, g.ev);          // neutral card washes to team colour + score rolls
    var c=goalCtx(g.fx,g.ev), segs=baseRevealSegs(c), story=storylineSegs(c);
    if(story) segs=segs.concat([{t:"  "}]).concat(story);   // occasional context line
    typeSegs(segs, "reveal-goal");
    return !!story;                    // storyline present → linger a bit longer
  }

  // ---- FT league table (prior + this matchday, FLIP re-sort) ---------------
  function computeTable(T){
    var rows={};
    Object.keys(D.prior).forEach(function(k){ var p=D.prior[k]; rows[k]={k:k,P:p.P,W:p.W,D:p.D,L:p.L,GF:p.GF,GA:p.GA,Pts:p.Pts}; });
    D.fixtures.forEach(function(fx){
      if (stateOf(fx,T).phase!=="ft") return;
      var sc=scoreAt(fx,T);
      [[fx.home,sc.h,sc.a],[fx.away,sc.a,sc.h]].forEach(function(x){
        var r=rows[x[0]]; if(!r) return;
        r.P++; r.GF+=x[1]; r.GA+=x[2];
        if (x[1]>x[2]){ r.W++; r.Pts+=3; } else if (x[1]===x[2]){ r.D++; r.Pts+=1; } else r.L++;
      });
    });
    return Object.keys(rows).map(function(k){var r=rows[k];r.GD=r.GF-r.GA;return r;})
      .sort(function(a,b){ return b.Pts-a.Pts || b.GD-a.GD || b.GF-a.GF || club(a.k).name.localeCompare(club(b.k).name); });
  }
  function priorRank(){
    var arr=Object.keys(D.prior).map(function(k){var p=D.prior[k];return{k:k,Pts:p.Pts,GD:p.GF-p.GA,GF:p.GF};})
      .sort(function(a,b){return b.Pts-a.Pts||b.GD-a.GD||b.GF-a.GF;});
    var m={}; arr.forEach(function(r,i){m[r.k]=i;}); return m;
  }
  function renderTable(){
    var final=computeTable(maxT()), was=priorRank(), n=final.length;
    $("nlhSheetRound").textContent = D.round;
    $("nlhTableBody").innerHTML = final.map(function(r,i){
      var cls = i===0?"champ":(i>=1&&i<=4?"po":(i>=n-3?"releg":""));
      var moved = was[r.k]!==undefined && was[r.k]!==i;
      var dir = moved && was[r.k]<i ? "down":"";
      return '<tr class="'+cls+(moved?" moved "+dir:"")+'">'+
        '<td class="pos">'+(i+1)+'</td>'+
        '<td><span class="cl">'+crestHTML(r.k)+'<span class="nm">'+esc(club(r.k).short)+'</span></span></td>'+
        '<td class="num">'+r.P+'</td><td class="num">'+(r.GD>0?"+":"")+r.GD+'</td>'+
        '<td class="pts">'+r.Pts+'</td></tr>';
    }).join("");
  }
  function showSheet(){ renderTable(); $("nlhSheet").hidden=false; }
  function hideSheet(){ $("nlhSheet").hidden=true; }

  // ---- render dispatch -----------------------------------------------------
  function paint(){
    $("nlhClock").textContent = clockLabel(st.T);
    $("nlhScrubFill").style.width = (st.T/maxT()*100)+"%";
    if (st.view==="map")    paintPins();
    else if (st.view==="cards")  paintCards();
    else if (st.view==="ticker") paintFeed();
  }
  // cinematic zoom: fly the map into a fixture's ground, then back out
  function zoomTo(fx){
    var zoom=$("nlhMapZoom"), stage=$("nlhStage"), pin=$("pin_"+fx.gc);
    if(!zoom||!stage||!pin) return;
    var W=stage.clientWidth, H=stage.clientHeight;
    var px=(parseFloat(pin.style.left)||50)/100*W, py=(parseFloat(pin.style.top)||50)/100*H;
    var Z=2.4, dx=W/2-px*Z, dy=H*0.42-py*Z;   // seat the ground a touch above centre
    zoom.style.transform="translate("+dx.toFixed(1)+"px,"+dy.toFixed(1)+"px) scale("+Z+")";
  }
  function zoomReset(){ var z=$("nlhMapZoom"); if(z) z.style.transform="none"; }
  function setView(v){
    st.view=v;
    zoomReset();
    var stage=$("nlhStage");
    stage.querySelectorAll(".nlh__view").forEach(function(el){ el.classList.toggle("is-active", el.getAttribute("data-view")===v); });
    document.querySelectorAll("#nlHub .nlh__seg").forEach(function(b){ b.classList.toggle("is-active", b.getAttribute("data-view")===v); });
    stingHide(); $("nlhBeat").hidden=true;
    if (v==="map") layoutPins();
    paint();
  }

  // ---- playback loop -------------------------------------------------------
  function tick(ts){
    if (!st.playing) return;
    if (!st.last) st.last=ts;
    // KICKOFF PREVIEWS — float ground to ground, one at a time, before the action
    if (st.kickoff){
      if (ts>=st.kickoff.until){
        var ki=st.kickoff.i;
        if (ki>=KO_ORDER.length){ st.kickoff=null; zoomReset(); st.last=ts; }   // done — action begins
        else {
          var kfx=KO_ORDER[ki], kseg=kickoffSegs(kfx);
          if (st.view==="map") zoomTo(kfx);
          typeSegs(kseg,"beat");
          var kchars=kseg.reduce(function(n,s){return n+s.t.length;},0);
          var kdur = st.rate>=2 ? 1500 : Math.min(6800, 2600 + kchars*15);   // scale to reading length
          st.kickoff={ i:ki+1, until: ts + kdur };
        }
      }
      st.raf=requestAnimationFrame(tick); return;
    }
    // goal suspense — freeze the clock through the tease, the reveal, and a dwell
    if (st.suspend){
      if (ts>=st.suspend.until){
        if (st.suspend.phase==="tease"){
          var story=revealGoal(st.suspend.g);
          st.suspend={ g:st.suspend.g, phase:"hold", until: ts + (st.rate===2?2400:4000) + (story?2000:0) };
        } else {
          st.suspend=null; zoomReset(); stingHide();   // dwell over — zoom back out, drop the card, resume
        }
        st.last=ts;
      }
      st.raf=requestAnimationFrame(tick); return;
    }
    var dt=(ts-st.last)/1000; st.last=ts;
    var prevT=st.T;
    // ~1 match-min/sec × rate; accelerate through goalless lulls
    var gap=nextMoment(st.T)-st.T, eff=st.rate*(gap>4?6:1);
    var target=Math.min(prevT + dt*eff, maxT());
    // <4×: stop just before the next goal so the tease can hide the score
    if (st.rate<4){
      var g=nextGoalAt(prevT, target);
      if (g){
        st.T=g.rmin-0.0015;
        fireCrossed(prevT, st.T, false);   // fire any beats/reds up to the goal
        beginSuspense(g, ts);
        paint();
        st.raf=requestAnimationFrame(tick); return;
      }
    }
    st.T=target;
    fireCrossed(prevT, st.T, true);        // 4× (or no goal ahead): goals fire instantly
    paint();
    if (st.T>=maxT()){
      pause();
      if(!st.ftShown){ st.ftShown=true;
        typeSegs(buildSegs(pick(C_OUTRO,"out"),{},[]),"beat");   // wind-down line, not a hard stop
        setTimeout(showSheet, 2600);                              // let it breathe, then ease the table up
      }
      return;
    }
    st.raf=requestAnimationFrame(tick);
  }
  function play(){
    if (st.T>=maxT()) return restart();
    st.playing=true; st.last=0;
    $("nlhPlay").querySelector(".nlh__ico-play").hidden=true;
    $("nlhPlay").querySelector(".nlh__ico-pause").hidden=false;
    $("nlhPlay").setAttribute("aria-label","Pause");
    if (st.T===0 && !st.koShown){ st.koShown=true; st.kickoff={ i:0, until:0 }; }  // team-news build-up
    st.raf=requestAnimationFrame(tick);
  }
  function pause(){
    st.playing=false; cancelAnimationFrame(st.raf);
    $("nlhPlay").querySelector(".nlh__ico-play").hidden=false;
    $("nlhPlay").querySelector(".nlh__ico-pause").hidden=true;
    $("nlhPlay").setAttribute("aria-label","Play");
  }
  function restart(){
    pause(); st.T=0; st.fired={}; st.feedBuilt={}; st.beatShown={}; st.ftShown=false; st.suspend=null; st.kickoff=null; st.koShown=false;
    $("nlhFeed").innerHTML=""; hideSheet(); stingHide(); $("nlhBeat").hidden=true; zoomReset();
    commStatic(C_IDLE);
    paint(); play();
  }
  function seek(frac){
    pause(); st.suspend=null; st.kickoff=null; st.koShown=true; zoomReset(); stingHide(); st.T=Math.max(0,Math.min(frac,1))*maxT();
    // rebuild derived-once state so nothing double-fires on resume
    st.fired={}; st.beatShown={}; st.feedBuilt={}; $("nlhFeed").innerHTML="";
    D.fixtures.forEach(function(fx){ fx.events.forEach(function(ev){ if(evRmin(ev,fx)<=st.T) st.fired[evId(fx,ev)]=1; }); });
    BEATS.forEach(function(b){ if(b.r<=st.T) st.beatShown[b.r]=1; });
    st.ftShown = st.T>=maxT();
    commStatic(st.T<=0?C_IDLE:(st.T>=maxT()?"Full-time across the division.":"Replay paused — press play to resume."));
    paint();
  }

  // ---- wiring --------------------------------------------------------------
  function boot(){
    $("nlhRound").textContent = D.competition+" · MD"+D.round+" · "+D.season;
    try{ $("nlhVer").textContent = "v"+((new URLSearchParams(location.search).get("v"))||BUILD); }catch(e){ $("nlhVer").textContent="v"+BUILD; }
    buildMap(); buildCards();
    setView("map"); paint();
    commStatic(C_IDLE);

    document.querySelectorAll("#nlHub .nlh__seg").forEach(function(b){
      b.addEventListener("click", function(){ setView(b.getAttribute("data-view")); });
    });
    $("nlhPlay").addEventListener("click", function(){ st.playing?pause():play(); });
    $("nlhRestart").addEventListener("click", restart);
    $("nlhSpeed").addEventListener("click", function(){
      st.rate = st.rate===1?2:st.rate===2?4:1;
      $("nlhSpeed").textContent = st.rate+"×";
    });
    var scrub=$("nlhScrub");
    scrub.addEventListener("click", function(e){
      var r=scrub.getBoundingClientRect(); seek((e.clientX-r.left)/r.width);
    });
    $("nlhFootTable").addEventListener("click", function(){ renderTable(); $("nlhSheet").hidden=false; });
    $("nlhSheetClose").addEventListener("click", hideSheet);
    $("nlhSheet").addEventListener("click", function(e){ if(e.target===$("nlhSheet")) hideSheet(); });

    var rt; window.addEventListener("resize", function(){ clearTimeout(rt); rt=setTimeout(layoutPins,120); });
    window.addEventListener("orientationchange", function(){ setTimeout(layoutPins,300); });
    requestAnimationFrame(layoutPins); // ensure aligned once the stage has real dimensions
  }
  boot();
})();
</script>
</body>
</html>
