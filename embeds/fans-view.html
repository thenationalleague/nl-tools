<!-- ============================================================================
     fans-view.html — "The Fans' View" club-by-club article browser
     ----------------------------------------------------------------------------
     Fan-facing embed for the Urban Zoo CMS. A horizontal rail of club crests;
     picking one opens that club's summer feature in full, with the CMS
     formatting and inline images preserved.

     Data comes from assets/data/fans-view.json, built by
     scripts/build-fans-view.js (which re-fetches the rich HTML the search index
     throws away). Clubs whose piece has not run yet are shown greyed out and
     stay in the rail, so the set is always the full 72.

     CMS invariants (see embeds/widget-handover.md):
       - No <script src> anywhere. The CMS strips them. Everything is inline.
       - Inline <style> and inline <script> survive; fetch() is fine.
       - Crests and data are absolute nl.tools URLs.

     A standalone build (data + crests inlined as data URIs, for sharing as a
     single file) is produced by:
       node scripts/build-fans-view.js --standalone <out.html>

     ----------------------------------------------------------------------------
     CHANGELOG
     v1.0 (06/08/2026)
       - Initial version. Crest rail grouped by division, club-coloured article
         panel, greyed-out placeholders for clubs still to come.
     ========================================================================= -->

<style>
  .fv-root {
    /* Brand tokens are not available inside the CMS, so the handful this embed
       needs are declared locally, matching system/nl-brand.css. */
    --fv-primary: #9e0000;
    --fv-navy:    #223b7c;
    --fv-ink:     #14181f;
    --fv-muted:   #5a6a82;
    --fv-border:  #dde3ed;
    --fv-surface: #ffffff;
    --fv-sunken:  #f5f7fa;
    --fv-radius:  6px;
    --fv-accent:  var(--fv-navy);
    --fv-accent-ink: var(--fv-navy);

    font-family: "carbona-variable", "Inter", -apple-system, BlinkMacSystemFont,
                 "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--fv-ink);
    background: var(--fv-surface);
    max-width: 1100px;
    margin: 0 auto;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .fv-root *, .fv-root *::before, .fv-root *::after { box-sizing: border-box; }

  /* ---------- masthead ---------- */
  .fv-head { padding: 4px 4px 14px; }
  .fv-kicker {
    font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
    color: var(--fv-primary); margin: 0 0 4px;
  }
  .fv-title { font-size: clamp(24px, 3vw, 34px); font-weight: 800; margin: 0 0 6px; letter-spacing: -.01em; }
  .fv-standfirst { margin: 0; color: var(--fv-muted); font-size: 15px; max-width: 62ch; }
  .fv-note {
    margin: 12px 0 0; padding: 10px 12px; border: 1px solid var(--fv-border);
    border-radius: var(--fv-radius);
    background: var(--fv-sunken); color: var(--fv-muted); font-size: 13px;
  }

  /* ---------- division filter ---------- */
  .fv-divs { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 4px 12px; }
  .fv-div {
    font: inherit; font-size: 12px; font-weight: 700; letter-spacing: .02em;
    padding: 6px 12px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--fv-border); background: var(--fv-surface); color: var(--fv-muted);
  }
  .fv-div:hover { border-color: #c3ccdb; color: var(--fv-ink); }
  .fv-div[aria-pressed="true"] { background: var(--fv-navy); border-color: var(--fv-navy); color: #fff; }
  .fv-div:focus-visible { outline: 2px solid var(--fv-navy); outline-offset: 2px; }
  .fv-div em { font-style: normal; opacity: .7; font-weight: 600; }

  /* ---------- crest rail ---------- */
  .fv-railwrap { position: relative; border-top: 1px solid var(--fv-border); border-bottom: 1px solid var(--fv-border); }
  .fv-rail {
    display: flex; align-items: flex-start; gap: 2px;
    overflow-x: auto; scroll-snap-type: x proximity;
    padding: 10px 40px; margin: 0;
    scrollbar-width: thin; scrollbar-color: var(--fv-border) transparent;
  }
  .fv-rail::-webkit-scrollbar { height: 8px; }
  .fv-rail::-webkit-scrollbar-thumb { background: var(--fv-border); border-radius: 999px; }

  .fv-crest {
    flex: 0 0 auto; scroll-snap-align: center;
    width: 86px; height: 92px; padding: 8px 4px 6px;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    background: none; border: 0; border-radius: var(--fv-radius);
    cursor: pointer; font: inherit; color: inherit; text-align: center;
    position: relative; transition: background .12s ease, transform .12s ease;
  }
  .fv-crest:hover { background: var(--fv-sunken); }
  .fv-crest:focus-visible { outline: 2px solid var(--fv-navy); outline-offset: 2px; }
  .fv-crest img {
    width: 44px; height: 44px; object-fit: contain;
    filter: none; transition: filter .15s ease, opacity .15s ease;
  }
  .fv-crest span {
    font-size: 11px; line-height: 1.25; color: var(--fv-muted);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  /* Clubs still to come: legible but visibly inactive. */
  .fv-crest.is-empty img { filter: grayscale(1); opacity: .38; }
  .fv-crest.is-empty span { color: #97a3b6; }
  .fv-crest[aria-selected="true"] {
    background: var(--fv-sunken);
    box-shadow: inset 0 -3px 0 0 var(--fv-club, var(--fv-navy));
  }
  .fv-crest[aria-selected="true"] span { color: var(--fv-ink); font-weight: 700; }

  .fv-nav {
    position: absolute; top: 0; bottom: 0; width: 36px;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(to right, var(--fv-surface) 55%, rgba(255,255,255,0));
    border: 0; cursor: pointer; color: var(--fv-navy); font-size: 20px; line-height: 1;
  }
  .fv-nav--next { right: 0; transform: scaleX(-1); }
  .fv-nav:focus-visible { outline: 2px solid var(--fv-navy); outline-offset: -4px; }

  /* ---------- article panel ---------- */
  .fv-panel { padding: 22px 4px 8px; }
  .fv-panel[hidden] { display: none; }

  .fv-clubline { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .fv-clubline img { width: 52px; height: 52px; object-fit: contain; }
  .fv-clubname { font-size: 20px; font-weight: 800; margin: 0; letter-spacing: -.01em; }
  .fv-clubmeta { font-size: 12px; color: var(--fv-muted); margin: 2px 0 0; }
  .fv-tag {
    display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: .08em;
    text-transform: uppercase; padding: 3px 7px; border-radius: 3px;
    background: var(--fv-accent); color: #fff; vertical-align: 2px;
  }
  .fv-tag--welcome { background: var(--fv-navy); }

  .fv-hero { width: 100%; border-radius: var(--fv-radius); display: block; margin-bottom: 16px; }
  /* The club's colour arrives as a short editorial rule above the headline
     rather than a bar down the side — it reads as a section rule, and it is
     the one place the club colour is allowed to be loud. */
  .fv-headline {
    font-size: clamp(21px, 2.4vw, 30px); font-weight: 800; line-height: 1.18;
    margin: 0 0 8px; letter-spacing: -.015em;
  }
  .fv-headline::before {
    content: ""; display: block; width: 56px; height: 4px;
    background: var(--fv-accent); margin-bottom: 14px;
  }
  .fv-byline { font-size: 13px; color: var(--fv-muted); margin: 0 0 18px; }

  .fv-body { font-size: 17px; line-height: 1.62; max-width: 66ch; }
  .fv-body p { margin: 0 0 1.05em; }
  .fv-body h2, .fv-body h3 { font-weight: 800; line-height: 1.25; margin: 1.6em 0 .5em; }
  .fv-body h2 { font-size: 21px; }
  .fv-body h3 { font-size: 18px; }
  .fv-body a { color: var(--fv-accent-ink); text-underline-offset: 2px; }
  .fv-body img { max-width: 100%; height: auto; border-radius: var(--fv-radius); }
  .fv-body figure { margin: 1.4em 0; }
  .fv-body figcaption { font-size: 13px; color: var(--fv-muted); margin-top: 6px; }
  .fv-body blockquote {
    margin: 1.4em 0; padding: 2px 0 2px 16px;
    border-left: 3px solid var(--fv-accent); font-size: 19px; line-height: 1.45;
  }
  .fv-body ul, .fv-body ol { margin: 0 0 1.05em; padding-left: 1.3em; }
  .fv-body li { margin-bottom: .35em; }
  .fv-body iframe { max-width: 100%; }

  .fv-readmore {
    display: inline-block; margin-top: 6px; padding: 10px 16px;
    background: var(--fv-accent); color: #fff; text-decoration: none;
    border-radius: var(--fv-radius); font-weight: 700; font-size: 14px;
  }
  .fv-readmore:hover { filter: brightness(1.08); }

  .fv-empty { padding: 34px 4px; max-width: 60ch; }
  .fv-empty h2 { font-size: 20px; margin: 0 0 8px; font-weight: 800; }
  .fv-empty p { margin: 0; color: var(--fv-muted); font-size: 15px; }

  .fv-loading { padding: 40px 4px; color: var(--fv-muted); font-size: 15px; }

  @media (max-width: 600px) {
    .fv-rail { padding: 10px 12px; }
    .fv-nav { display: none; }
    .fv-crest { width: 74px; }
    .fv-crest img { width: 38px; height: 38px; }
    .fv-body { font-size: 16px; }
  }
</style>

<div class="fv-root" id="fvRoot">
  <div class="fv-head">
    <p class="fv-kicker" id="fvKicker">The Fans' View</p>
    <h2 class="fv-title">Every club, in their supporters' words</h2>
    <p class="fv-standfirst" id="fvStandfirst">Pick a crest to read that club's story of last season — and the one ahead.</p>
    <p class="fv-note" id="fvNote" hidden></p>
  </div>

  <div class="fv-divs" id="fvDivs"></div>

  <div class="fv-railwrap">
    <button class="fv-nav fv-nav--prev" id="fvPrev" type="button" aria-label="Scroll clubs left">&#8249;</button>
    <div class="fv-rail" id="fvRail" role="tablist" aria-label="Clubs"></div>
    <button class="fv-nav fv-nav--next" id="fvNext" type="button" aria-label="Scroll clubs right">&#8249;</button>
  </div>

  <div class="fv-panel" id="fvPanel" role="tabpanel" aria-live="polite">
    <p class="fv-loading" id="fvLoading">Loading…</p>
  </div>
</div>

<script>
(function () {
  'use strict';

  var DATA_URL = 'https://nl.tools/assets/data/fans-view.json';
  /* The standalone build replaces this literal with the whole payload. */
  var INLINE = null /*__FV_INLINE__*/;

  var root  = document.getElementById('fvRoot');
  var rail  = document.getElementById('fvRail');
  var divs  = document.getElementById('fvDivs');
  var panel = document.getElementById('fvPanel');
  var note  = document.getElementById('fvNote');

  var state = { data: null, clubs: [], activeIndex: -1, filter: '' };

  /* ---------- helpers ---------- */

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function slugify(name) {
    return String(name).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  }

  function hexToRgb(hex) {
    var m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(String(hex || ''));
    return m ? [parseInt(m[1], 16), parseInt(m[2], 16), parseInt(m[3], 16)] : null;
  }

  /* Relative luminance, for deciding whether a club colour can carry white
     text or needs darkening first. */
  function luminance(rgb) {
    var a = rgb.map(function (v) {
      v /= 255;
      return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
    });
    return 0.2126 * a[0] + 0.7152 * a[1] + 0.0722 * a[2];
  }

  function darken(rgb, amount) {
    return rgb.map(function (v) { return Math.round(v * (1 - amount)); });
  }

  function rgbCss(rgb) { return 'rgb(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ')'; }

  /* A club's usable accent. Several clubs play in white or yellow, so walk
     primary → secondary → tertiary for the first colour that is not
     near-white, then darken anything still too light to sit behind white
     text. Falls back to NL navy. */
  function accentFor(colors) {
    var order = ['primary', 'secondary', 'tertiary'];
    for (var i = 0; i < order.length; i++) {
      var rgb = hexToRgb(colors && colors[order[i]]);
      if (!rgb) continue;
      var lum = luminance(rgb);
      if (lum > 0.75) continue;                 /* white / near-white — skip */
      if (lum > 0.45) rgb = darken(rgb, 0.35);  /* yellow, sky blue, etc.    */
      return { fill: rgbCss(rgb), ink: rgbCss(darken(rgb, lum > 0.2 ? 0.2 : 0)) };
    }
    return { fill: '#223b7c', ink: '#223b7c' };
  }

  /* The bodies come from our own CMS, but they are injected as HTML, so strip
     anything executable before it reaches the page. */
  function sanitise(html) {
    var host = document.createElement('div');
    host.innerHTML = String(html || '');
    host.querySelectorAll('script, style, link, meta, object, embed, form').forEach(function (el) {
      el.remove();
    });
    host.querySelectorAll('*').forEach(function (el) {
      for (var i = el.attributes.length - 1; i >= 0; i--) {
        var attr = el.attributes[i];
        var name = attr.name.toLowerCase();
        if (name.indexOf('on') === 0) el.removeAttribute(attr.name);
        if ((name === 'href' || name === 'src') && /^\s*javascript:/i.test(attr.value)) {
          el.removeAttribute(attr.name);
        }
      }
    });
    host.querySelectorAll('a[href]').forEach(function (a) {
      a.target = '_blank';
      a.rel = 'noopener';
    });
    host.querySelectorAll('img').forEach(function (img) { img.loading = 'lazy'; });
    return host.innerHTML;
  }

  function formatDate(iso) {
    var d = new Date(iso);
    if (isNaN(d)) return '';
    return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
  }

  /* ---------- rail ---------- */

  var DIVISION_LABEL = {
    National: 'National League',
    North: 'National League North',
    South: 'National League South'
  };

  var DIVISIONS = ['National', 'North', 'South'];

  /* 72 crests is a long scroll, so the divisions double as a filter. Indices
     stay stable across filtering — hidden tiles are display:none, not
     re-rendered — so selection and keyboard order never drift. */
  function buildFilter() {
    var counts = {};
    state.data.clubs.forEach(function (c) { counts[c.division] = (counts[c.division] || 0) + 1; });

    var html = '<button class="fv-div" type="button" data-div="" aria-pressed="true">' +
               'All clubs <em>' + state.data.clubs.length + '</em></button>';
    DIVISIONS.forEach(function (d) {
      if (!counts[d]) return;
      html += '<button class="fv-div" type="button" data-div="' + d + '" aria-pressed="false">' +
              esc(DIVISION_LABEL[d] || d) + ' <em>' + counts[d] + '</em></button>';
    });
    divs.innerHTML = html;

    divs.addEventListener('click', function (e) {
      var btn = e.target.closest('.fv-div');
      if (btn) applyFilter(btn.dataset.div);
    });
  }

  function applyFilter(division) {
    state.filter = division || '';
    divs.querySelectorAll('.fv-div').forEach(function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.div === state.filter));
    });
    state.clubs.forEach(function (club, i) {
      var el = rail.querySelector('#fv-tab-' + i);
      if (el) el.style.display = (!state.filter || club.division === state.filter) ? '' : 'none';
    });
    if (state.activeIndex > -1) scrollTabIntoView(state.activeIndex);
  }

  function buildRail() {
    var html = '';
    var flat = [];

    DIVISIONS.forEach(function (div) {
      state.data.clubs.filter(function (c) { return c.division === div; }).forEach(function (club) {
        var i = flat.push(club) - 1;
        var accent = accentFor(club.colors);
        var empty = !club.article;
        html +=
          '<button class="fv-crest' + (empty ? ' is-empty' : '') + '" type="button" role="tab"' +
          ' id="fv-tab-' + i + '" data-index="' + i + '" aria-selected="false" tabindex="-1"' +
          ' style="--fv-club:' + accent.fill + '"' +
          ' title="' + esc(club.name) + (empty ? ' — feature still to come' : '') + '">' +
          '<img src="' + esc(club.crest) + '" alt="" loading="lazy">' +
          '<span>' + esc(club.short || club.name) + '</span>' +
          '</button>';
      });
    });

    state.clubs = flat;
    rail.innerHTML = html;

    rail.addEventListener('click', function (e) {
      var btn = e.target.closest('.fv-crest');
      if (btn) select(Number(btn.dataset.index), true);
    });

    rail.addEventListener('keydown', function (e) {
      var step = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
      if (!step && e.key !== 'Home' && e.key !== 'End') return;
      e.preventDefault();

      var visible = state.clubs
        .map(function (c, i) { return i; })
        .filter(function (i) { return !state.filter || state.clubs[i].division === state.filter; });
      if (!visible.length) return;

      var at = visible.indexOf(state.activeIndex);
      var next = e.key === 'Home' ? visible[0]
               : e.key === 'End' ? visible[visible.length - 1]
               : visible[Math.min(visible.length - 1, Math.max(0, (at < 0 ? 0 : at) + step))];

      select(next, true);
      var el = rail.querySelector('#fv-tab-' + next);
      if (el) el.focus();
    });
  }

  function scrollTabIntoView(i) {
    var el = rail.querySelector('#fv-tab-' + i);
    if (!el) return;
    var left = el.offsetLeft - (rail.clientWidth / 2) + (el.offsetWidth / 2);
    rail.scrollTo({ left: left, behavior: 'smooth' });
  }

  /* ---------- panel ---------- */

  function renderClub(club) {
    var accent = accentFor(club.colors);
    root.style.setProperty('--fv-accent', accent.fill);
    root.style.setProperty('--fv-accent-ink', accent.ink);

    var head =
      '<div class="fv-clubline">' +
        '<img src="' + esc(club.crest) + '" alt="' + esc(club.name) + ' crest">' +
        '<div>' +
          '<h3 class="fv-clubname">' + esc(club.name) + '</h3>' +
          '<p class="fv-clubmeta">' + esc(DIVISION_LABEL[club.division] || club.division) +
            (club.nickname ? ' &middot; ' + esc(club.nickname) : '') + '</p>' +
        '</div>' +
      '</div>';

    if (!club.article) {
      panel.innerHTML = head +
        '<div class="fv-empty">' +
          '<h2>Still to come</h2>' +
          '<p>' + esc(club.name) + ' has not had their piece published yet. It will appear here as soon as it runs.</p>' +
        '</div>';
      return;
    }

    var a = club.article;
    var isWelcome = a.type === 'welcome';
    var tag = '<span class="fv-tag' + (isWelcome ? ' fv-tag--welcome' : '') + '">' +
              (isWelcome ? 'Club guide' : "Fans' View") + '</span>';

    panel.innerHTML = head +
      (a.hero ? '<img class="fv-hero" src="' + esc(a.hero) + '" alt="" loading="lazy">' : '') +
      '<h2 class="fv-headline">' + esc(a.title) + '</h2>' +
      '<p class="fv-byline">' + tag + ' &nbsp; ' +
        (a.author ? esc(a.author) + ' &middot; ' : '') + esc(formatDate(a.published)) + '</p>' +
      '<div class="fv-body">' + sanitise(a.html) + '</div>' +
      '<a class="fv-readmore" href="' + esc(a.url) + '" target="_blank" rel="noopener">' +
        'Read on thenationalleague.org.uk</a>';
  }

  function select(i, updateHash) {
    var club = state.clubs[i];
    if (!club) return;
    /* Selecting a club the current filter hides (deep link, or a filter change
       that orphaned the selection) widens the filter rather than leaving the
       rail showing nothing highlighted. */
    if (state.filter && club.division !== state.filter) applyFilter('');
    if (state.activeIndex > -1) {
      var prev = rail.querySelector('#fv-tab-' + state.activeIndex);
      if (prev) { prev.setAttribute('aria-selected', 'false'); prev.tabIndex = -1; }
    }
    var el = rail.querySelector('#fv-tab-' + i);
    if (el) { el.setAttribute('aria-selected', 'true'); el.tabIndex = 0; }
    state.activeIndex = i;
    scrollTabIntoView(i);
    renderClub(club);
    if (updateHash && window.history && history.replaceState) {
      history.replaceState(null, '', '#fv-' + slugify(club.name));
    }
  }

  /* ---------- boot ---------- */

  function start(data) {
    state.data = data;
    var c = data.counts || {};

    document.getElementById('fvStandfirst').textContent =
      "Pick a crest to read that club's story of last season — and the one ahead. " +
      (c.fansView || 0) + ' of ' + (c.clubs || 0) + ' clubs so far.';

    if (data.plaintextFallback) {
      note.hidden = false;
      note.textContent = 'Preview build: article text is the plain-text copy held in the ' +
        'search index, so paragraph breaks are approximate and inline images are not ' +
        'included. The live build pulls the formatted CMS version.';
    }

    buildRail();
    buildFilter();

    var wanted = (location.hash || '').replace(/^#fv-/, '');
    var start = 0;
    if (wanted) {
      var found = state.clubs.findIndex(function (cl) { return slugify(cl.name) === wanted; });
      if (found > -1) start = found;
    } else {
      /* Open on the most recently published piece — the freshest thing we have. */
      var newest = -1, newestAt = '';
      state.clubs.forEach(function (cl, i) {
        if (cl.article && cl.article.published > newestAt) { newestAt = cl.article.published; newest = i; }
      });
      if (newest > -1) start = newest;
    }
    select(start, false);
  }

  document.getElementById('fvPrev').addEventListener('click', function () {
    rail.scrollBy({ left: -rail.clientWidth * 0.8, behavior: 'smooth' });
  });
  document.getElementById('fvNext').addEventListener('click', function () {
    rail.scrollBy({ left: rail.clientWidth * 0.8, behavior: 'smooth' });
  });

  if (INLINE) {
    start(INLINE);
  } else {
    fetch(DATA_URL, { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(start)
      .catch(function (err) {
        panel.innerHTML = '<div class="fv-empty"><h2>Not available</h2>' +
          '<p>The club features could not be loaded just now. Please try again shortly.</p></div>';
        if (window.console) console.error('fans-view:', err);
      });
  }
})();
</script>
