<div id="lab">
  <div class="lab__bar">
    <span class="lab__title">MATCH HUB LAB</span>
    <div class="lab__group"><span class="lab__lbl">State</span>
      <button class="lab__btn is-on" data-state="map">Full map</button>
      <button class="lab__btn" data-state="tease">Focus · tease</button>
      <button class="lab__btn" data-state="reveal">Focus · reveal</button>
    </div>
    <div class="lab__group"><span class="lab__lbl">Layout</span>
      <button class="lab__btn is-on" data-layout="onmap">On map + stems</button>
      <button class="lab__btn" data-layout="rails">Rails (previous)</button>
    </div>
    <div class="lab__group"><span class="lab__lbl">Hero</span>
      <button class="lab__btn is-on" data-hero="a">A · Lower third</button>
      <button class="lab__btn" data-hero="b">B · Centre card</button>
      <button class="lab__btn" data-hero="c">C · Pure type</button>
    </div>
    <button class="lab__btn lab__btn--go" id="labReplay">Replay the goal</button>
  </div>

  <div class="lab__stage" id="labStage">
    <div class="lab__zoom" id="labZoom">
      <svg class="lab__svg" id="labSvg" viewBox="0 0 1000 1333" preserveAspectRatio="xMidYMid meet" aria-hidden="true"></svg>
      <div class="lab__pins" id="labPins"></div>
    </div>
    <div class="lab__hero" id="labHero" hidden></div>
  </div>
  <div class="lab__note" id="labNote">Full map — dots mark every ground's true location; each scoreboard floats beside its dot on a short stem, and no stem ever runs beneath another card.</div>
</div>

  --line:#dde3ed;--text:#1a2a44;--muted:#5a6a82;
  box-sizing:border-box;font-family:"carbona-variable","carbona",system-ui,sans-serif;
  font-variation-settings:"wght" 400;-webkit-font-smoothing:antialiased;
  max-width:1100px;margin:0 auto;padding:14px;color:var(--text);
}
#lab *,#lab *::before,#lab *::after{box-sizing:border-box}
#lab button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}

.lab__bar{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:10px 0 14px}
.lab__title{font-variation-settings:"wght" 900;font-weight:900;letter-spacing:.1em;color:var(--navy);font-size:18px}
.lab__group{display:flex;align-items:center;gap:6px}
.lab__lbl{font-size:11px;font-variation-settings:"wght" 800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:2px}
.lab__btn{font-size:13px;font-variation-settings:"wght" 700;padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--muted)}
.lab__btn.is-on{background:var(--primary);border-color:var(--primary);color:#fff}
.lab__btn--go{background:var(--navy);border-color:var(--navy);color:#fff;margin-left:auto}
.lab__note{padding:10px 4px;font-size:14px;color:var(--muted)}

.lab__stage{position:relative;height:min(78vh,760px);border-radius:14px;overflow:hidden;color:var(--ink-text);
  background:radial-gradient(120% 90% at 50% 8%,#101a30 0%,var(--ink) 70%);box-shadow:0 2px 12px rgba(10,22,40,.08)}
.lab__zoom{position:absolute;inset:0;transform-origin:0 0;transition:transform 1.05s cubic-bezier(.3,0,.15,1);will-change:transform}
.lab__svg{position:absolute;inset:0;width:100%;height:100%}
.lab__svg path{fill:#0e1a33;stroke:#2b3d63;stroke-width:2.2;stroke-linejoin:round;transition:fill .5s,stroke .5s}
.lab__stage.is-focus .lab__svg path{fill:#0b1226;stroke:#22304f}
.lab__pins{position:absolute;inset:0}

/* pins: anchor dot at true geography; board docked in a side rail */
.lab__pin{position:absolute;width:0;height:0}
.lab__dot{position:absolute;left:-4.5px;top:-4.5px;width:9px;height:9px;border-radius:50%;background:var(--ink-text);
  box-shadow:0 0 0 2px #0a1428;opacity:.92;transition:opacity .45s,box-shadow .45s}
.lab__stem{position:absolute;left:-0.75px;top:0;width:1.5px;background:#4a5b85;transform-origin:0 0;opacity:.5;
  transition:opacity .45s}
#lab.v-nostems .lab__stem{opacity:0}
.lab__wrap{position:absolute;left:0;top:0;transform:translate(calc(-50% + var(--ox,0px)),calc(-50% + var(--oy,0px)));
  transition:transform .9s cubic-bezier(.3,0,.15,1),opacity .45s}
.lab__board{display:flex;align-items:stretch;background:var(--ink-2);border-radius:6px;overflow:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,.5),0 0 0 1px var(--ink-line)}
.lab__side{display:flex;align-items:center;gap:4px;padding:4px 6px}
.lab__side img,.lab__fb{width:16px;height:16px;object-fit:contain;border-radius:2px;flex:0 0 auto}
.lab__fb{display:flex;align-items:center;justify-content:center;font-size:7px;font-variation-settings:"wght" 900;color:#fff}
.lab__sc{font-variation-settings:"wght" 900;font-size:13px;min-width:10px;text-align:center;font-variant-numeric:tabular-nums;color:#fff}
.lab__dash{align-self:center;color:var(--ink-muted);font-size:11px;font-variation-settings:"wght" 800;margin:0 -3px}
.lab__min{display:flex;align-items:center;padding:0 7px;font-size:10px;font-variation-settings:"wght" 800;color:#04310f;
  background:var(--live);white-space:nowrap}
/* focus: rails + stems fade out, dots dim, hero dot glows */
.lab__stage.is-focus .lab__wrap,.lab__stage.is-focus .lab__stem{opacity:0;pointer-events:none}
.lab__stage.is-focus .lab__dot{opacity:.3}
.lab__stage.is-focus .lab__pin.is-hero .lab__dot{opacity:1;box-shadow:0 0 0 2px #0a1428,0 0 16px 4px var(--hero-col,#fff)}
.lab__pin.is-goal .lab__dot{animation:labDotPulse 1s ease}
@keyframes labDotPulse{0%{transform:scale(1)}35%{transform:scale(2.1);box-shadow:0 0 0 3px var(--hero-col,#4ade80),0 0 20px 8px var(--hero-col,#4ade80)}100%{transform:scale(1)}}

/* HERO score updater — three candidate styles (toolbar: Hero A/B/C).
   Drama from TYPE + STRUCTURE, not glow: team colour is used surgically
   (kicker strip / underline), Carbona 900 does the shouting, and the
   scoring digit rolls on the reveal. Fixed size — never zoom-scaled. */
.lab__hero{position:absolute;z-index:6;pointer-events:none;display:flex;flex-direction:column;align-items:center;max-width:94%}
.lab__hero.h-a{left:50%;bottom:22px;transform:translateX(-50%)}
.lab__hero.h-b,.lab__hero.h-c{left:50%;top:42%;transform:translate(-50%,calc(-100% - 18px))}
.lab__digit{display:inline-block;height:1.12em;overflow:hidden;min-width:.66em;text-align:center}
.lab__digit .reel{display:block}
.lab__digit .reel i{display:block;height:1.12em;font-style:normal}
.lab__digit .reel.roll{animation:labOdo .7s cubic-bezier(.3,1,.25,1) .3s both}
@keyframes labOdo{to{transform:translateY(-1.12em)}}
.lab__fbx{display:flex;align-items:center;justify-content:center;border-radius:4px;font-size:12px;font-variation-settings:"wght" 900;color:#fff}

/* A — broadcast lower third, anchored to the bottom of the stage */
.ha{min-width:min(480px,90vw);border-radius:10px;overflow:hidden;box-shadow:0 12px 30px rgba(0,0,0,.5)}
.ha__kick{display:flex;justify-content:space-between;gap:14px;padding:6px 14px;background:#16234a;color:#fff;
  font-size:12px;font-variation-settings:"wght" 800;letter-spacing:.14em;text-transform:uppercase}
.ha__bar{display:flex;align-items:center;justify-content:center;gap:13px;background:#0d1730;padding:12px 18px}
.ha__bar img,.ha__bar .lab__fbx{width:34px;height:34px;object-fit:contain}
.ha__nm{font-size:19px;font-variation-settings:"wght" 900;letter-spacing:.04em;color:#fff;text-transform:uppercase}
.ha__score{display:flex;align-items:center;gap:6px;font-size:42px;line-height:1;font-variation-settings:"wght" 900;font-variant-numeric:tabular-nums;color:#fff;padding:0 8px}
.ha__dash{font-size:24px;color:var(--ink-muted)}
.ha__foot{padding:7px 14px;background:#0a1428;color:var(--ink-muted);font-size:14px;font-variation-settings:"wght" 600}
.ha__foot b{color:#fff;font-variation-settings:"wght" 900}

/* B — stacked centre card over the ground */
.hb{display:flex;flex-direction:column;align-items:center;background:#0d1730;border-radius:14px;overflow:hidden;
  box-shadow:0 14px 34px rgba(0,0,0,.55);min-width:380px}
.hb__goal{width:100%;text-align:center;padding:7px 0 6px;font-size:13px;letter-spacing:.5em;text-indent:.5em;
  font-variation-settings:"wght" 900;color:#fff;background:#16234a;text-transform:uppercase}
.hb__main{display:flex;align-items:center;gap:22px;padding:16px 26px 4px}
.hb__team{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:96px}
.hb__team img,.hb__team .lab__fbx{width:46px;height:46px;object-fit:contain}
.hb__team span{font-size:13px;font-variation-settings:"wght" 800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-text)}
.hb__score{display:flex;align-items:center;gap:8px;font-size:54px;line-height:1;font-variation-settings:"wght" 900;font-variant-numeric:tabular-nums;color:#fff}
.hb__dash{font-size:30px;color:var(--ink-muted)}
.hb__min{padding:2px 0 12px;font-size:14px;font-variation-settings:"wght" 800;color:var(--live)}
.hb__foot{width:100%;text-align:center;padding:8px 16px;background:#0a1428;font-size:14px;color:var(--ink-muted)}
.hb__foot b{color:#fff;font-variation-settings:"wght" 900}

/* C — pure type on a soft scrim, no card at all */
.hc{display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center;padding:28px 46px;
  background:radial-gradient(62% 72% at 50% 50%,rgba(6,11,24,.9),rgba(6,11,24,0) 100%)}
.hc__goal{font-size:15px;letter-spacing:.55em;text-indent:.55em;font-variation-settings:"wght" 900;text-transform:uppercase}
.hc__line{display:flex;align-items:baseline;gap:14px;font-variation-settings:"wght" 900;color:#fff;text-transform:uppercase}
.hc__nm{font-size:26px;letter-spacing:.03em;padding-bottom:5px;border-bottom:4px solid transparent}
.hc__sc{font-size:44px;display:flex;gap:5px;font-variant-numeric:tabular-nums}
.hc__dash{font-size:26px;color:var(--ink-muted)}
.hc__sub{font-size:15px;color:var(--ink-text);opacity:.9}
.hc__sub b{font-variation-settings:"wght" 900}
@media (prefers-reduced-motion:reduce){ #lab *{animation-duration:.01ms!important;transition-duration:.01ms!important} }
</style>

<script>
(function(){
"use strict";
var D=window.__DATA__; if(!D) return;
var CREST="https://raw.githubusercontent.com/thenationalleague/tools/main/assets/crests/";
var $=function(id){return document.getElementById(id);};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function club(k){return D.clubs[k]||{name:k,short:k,col:{p:"#666"},lat:53,lng:-2};}
function ideal(hex){var m=/^#?([0-9a-f]{6})$/i.exec(hex||"");if(!m)return "#fff";
  var n=parseInt(m[1],16),r=n>>16,g=(n>>8)&255,b=n&255;return (0.299*r+0.587*g+0.114*b)>150?"#111":"#fff";}
function washCol(c){return ideal(c.p)==="#111"&&c.s?c.s:c.p;}
function crest(k,cls,fbCls){var c=club(k),init=(c.short||c.name).slice(0,3).toUpperCase();
  var fb="this.onerror=null;this.outerHTML='<span class=\\'"+fbCls+" "+(cls||"")+"\\' style=\\'background:"+c.col.p+";color:"+ideal(c.col.p)+"\\'>"+init+"</span>';";
  return '<img class="'+(cls||"")+'" src="'+CREST+encodeURIComponent(c.name)+'.png" alt="" onerror="'+fb+'">';}

// projection (identical maths to the hub)
var proj=(function(){
  var k=Math.cos(53*Math.PI/180);
  var xs=D.gb.map(function(p){return p[0]*k;}),ys=D.gb.map(function(p){return p[1];});
  var minX=Math.min.apply(0,xs),maxX=Math.max.apply(0,xs),minY=Math.min.apply(0,ys),maxY=Math.max.apply(0,ys);
  var cX=(minX+maxX)/2,cY=(minY+maxY)/2,scale=Math.min(3/(maxX-minX),4/(maxY-minY))*0.90;
  return function(lng,lat){return {nx:(1.5+(lng*k-cX)*scale)/3, ny:(2-(lat-cY)*scale)/4};};
})();

// demo scores = full-time R39; the featured goal for tease/reveal:
var FEAT=D.fixtures[0];                      // Woking v Aldershot
var FEAT_GOAL={min:12,name:"Joseph Gbode",team:"t300"};

function buildMap(){
  var d=D.gb.map(function(p,i){var q=proj(p[0],p[1]);return (i?"L":"M")+(q.nx*1000).toFixed(1)+" "+(q.ny*1333).toFixed(1);}).join(" ")+" Z";
  $("labSvg").innerHTML='<path d="'+d+'"/>';
  $("labPins").innerHTML=D.fixtures.map(function(fx){
    return '<div class="lab__pin" id="lp_'+fx.gc+'">'+
      '<span class="lab__stem"></span><span class="lab__dot"></span>'+
      '<div class="lab__wrap"><div class="lab__board">'+
        '<div class="lab__side">'+crest(fx.home,"","lab__fb")+'<span class="lab__sc">'+fx.hs+'</span></div>'+
        '<span class="lab__dash">–</span>'+
        '<div class="lab__side"><span class="lab__sc">'+fx.as+'</span>'+crest(fx.away,"","lab__fb")+'</div>'+
        '<span class="lab__min">FT</span>'+
      '</div></div></div>';
  }).join("");
  layout();
}

// Two layout modes. Both anchor a dot at TRUE geography.
//   onmap — boards float on the map near their dots; the solver keeps
//           boards apart AND keeps every stem clear of foreign boards
//           (stems never underlap a card), with a spring holding each
//           board tight to its dot so stems stay short.
//   rails — the earlier docked-columns treatment, kept for comparison.
var LAYOUT="onmap";
function layout(){
  var stage=$("labStage"),W=stage.clientWidth,H=stage.clientHeight;
  if(!W||!H){requestAnimationFrame(layout);return;}
  var mapAspect=3/4,mw,mh,ox,oy;
  if(W/H>mapAspect){mh=H;mw=H*mapAspect;ox=(W-mw)/2;oy=0;}else{mw=W;mh=W/mapAspect;ox=0;oy=(H-mh)/2;}
  var nodes=D.fixtures.map(function(fx){
    var el=$("lp_"+fx.gc); if(!el) return null;
    var c=club(fx.home),q=proj(c.lng,c.lat);
    var board=el.querySelector(".lab__board");
    return {el:el,ax:ox+q.nx*mw,ay:oy+q.ny*mh,w:(board&&board.offsetWidth)||96,h:((board&&board.offsetHeight)||26)};
  }).filter(Boolean);
  if(LAYOUT==="onmap") placeOnMap(nodes,W,H); else placeRails(nodes,W,H);
  nodes.forEach(function(n){
    n.el.style.left=(n.ax/W*100).toFixed(3)+"%";
    n.el.style.top=(n.ay/H*100).toFixed(3)+"%";
    var wrap=n.el.querySelector(".lab__wrap");
    var dx=n.x-n.ax,dy=n.y-n.ay;
    wrap.style.setProperty("--ox",dx.toFixed(1)+"px");
    wrap.style.setProperty("--oy",dy.toFixed(1)+"px");
    // stem stops at the board's own edge (never drawn beneath its card)
    var adx=Math.abs(dx),ady=Math.abs(dy);
    var cut=Math.min(adx>0.01?(n.w/2)/adx:1, ady>0.01?(n.h/2)/ady:1, 1);
    var ex=dx*(1-cut), ey=dy*(1-cut);
    var stem=n.el.querySelector(".lab__stem"),L=Math.sqrt(ex*ex+ey*ey);
    stem.style.height=L.toFixed(1)+"px";
    stem.style.transform="rotate("+(Math.atan2(dy,dx)*180/Math.PI-90).toFixed(1)+"deg)";
  });
}
function placeOnMap(nodes,W,H){
  var gap=8, margin=9;
  // every board stands OFF its dot (map-callout style: label above the
  // node, short visible stem) — the dot must never hide under its card
  nodes.forEach(function(n){ n.sx=n.ax; n.sy=n.ay-(n.h/2+18); n.x=n.sx; n.y=n.sy; });
  for(var pass=0;pass<160;pass++){
    var i,j;
    // boards repel boards
    for(i=0;i<nodes.length;i++) for(j=i+1;j<nodes.length;j++){
      var a=nodes[i],b=nodes[j],dx=b.x-a.x,dy=b.y-a.y;
      var needX=(a.w+b.w)/2+gap-Math.abs(dx), needY=(a.h+b.h)/2+gap-Math.abs(dy);
      if(needX>0&&needY>0){
        if(needX<needY){var sx=(dx<0?-1:1)*needX/2;a.x-=sx;b.x+=sx;}
        else{var sy=(dy<0?-1:1)*needY/2;a.y-=sy;b.y+=sy;}
      }
    }
    // stems repel FOREIGN boards — no card may sit over another's stem
    for(i=0;i<nodes.length;i++) for(j=0;j<nodes.length;j++){
      if(i===j) continue;
      var s=nodes[i],b2=nodes[j];
      var vx=s.x-s.ax,vy=s.y-s.ay,L2=vx*vx+vy*vy;
      if(L2<1) continue;
      var t=Math.max(0,Math.min(1,((b2.x-s.ax)*vx+(b2.y-s.ay)*vy)/L2));
      var cx=s.ax+vx*t,cy=s.ay+vy*t;
      var ddx=b2.x-cx,ddy=b2.y-cy;
      var bw=b2.w/2+margin,bh=b2.h/2+margin;
      var exn=ddx/bw,eyn=ddy/bh,d2=exn*exn+eyn*eyn;
      if(d2>=1) continue;
      var d=Math.sqrt(d2);
      if(d<0.03){ var Ln=Math.sqrt(L2); b2.x+=(-vy/Ln)*bw*0.5; b2.y+=(vx/Ln)*bh*0.5; }
      else{ var push=(1-d)/d*0.5; b2.x+=ddx*push; b2.y+=ddy*push; }
    }
    // spring toward the stand-off seat — keeps stems short but present
    nodes.forEach(function(n){ n.x+=(n.sx-n.x)*0.03; n.y+=(n.sy-n.y)*0.03; });
    // never closer to the dot than the stand-off radius
    nodes.forEach(function(n){
      var dx=n.x-n.ax,dy=n.y-n.ay,d=Math.sqrt(dx*dx+dy*dy),min=n.h/2+14;
      if(d<min){ if(d<0.5){ n.y=n.ay-min; } else { n.x=n.ax+dx/d*min; n.y=n.ay+dy/d*min; } }
    });
    nodes.forEach(function(n){ n.x=Math.max(n.w/2+4,Math.min(W-n.w/2-4,n.x)); n.y=Math.max(n.h/2+4,Math.min(H-n.h/2-4,n.y)); });
  }
}
function placeRails(nodes,W,H){
  var pad=10,gapY=8;
  var left=nodes.filter(function(n){return n.ax<W/2;}),right=nodes.filter(function(n){return n.ax>=W/2;});
  var space=Math.max.apply(0,nodes.map(function(n){return n.h;}))+gapY;
  var cap=Math.floor((H-2*pad)/space);
  function shift(from,to,side){
    from.sort(function(a,b){return side==="L"?b.ax-a.ax:a.ax-b.ax;});
    while(from.length>cap&&to.length<cap) to.push(from.shift());
  }
  shift(left,right,"L"); shift(right,left,"R");
  [[left,"L"],[right,"R"]].forEach(function(pair){
    var rail=pair[0],side=pair[1];
    rail.sort(function(a,b){return a.ay-b.ay;});
    var y=rail.map(function(n){return n.ay;}),i;
    for(i=1;i<y.length;i++) y[i]=Math.max(y[i],y[i-1]+space);
    if(y.length){ y[y.length-1]=Math.min(y[y.length-1],H-pad-rail[y.length-1].h/2);
      for(i=y.length-2;i>=0;i--) y[i]=Math.min(y[i],y[i+1]-space);
      y[0]=Math.max(y[0],pad+rail[0].h/2);
      for(i=1;i<y.length;i++) y[i]=Math.max(y[i],y[i-1]+space);
    }
    rail.forEach(function(n,idx){
      n.x=side==="L"?pad+n.w/2:W-pad-n.w/2;
      n.y=y[idx];
    });
  });
}

// camera + hero
function zoomTo(fx){
  var stage=$("labStage"),pin=$("lp_"+fx.gc);
  var W=stage.clientWidth,H=stage.clientHeight;
  var px=parseFloat(pin.style.left)/100*W,py=parseFloat(pin.style.top)/100*H;
  var Z=2.4;
  $("labZoom").style.transform="translate("+(W/2-px*Z).toFixed(1)+"px,"+(H*0.42-py*Z).toFixed(1)+"px) scale("+Z+")";
}
function zoomReset(){$("labZoom").style.transform="none";}
// ---- hero renderers (A lower third / B centre card / C pure type) ---------
var HERO="a", CUR="map";
function digit(o,n,roll){return '<span class="lab__digit"><span class="reel'+(roll?" roll":"")+'"><i>'+o+'</i>'+(roll?'<i>'+n+'</i>':'')+'</span></span>';}
function heroHTML(style,reveal){
  var h=club(FEAT.home),a=club(FEAT.away);
  var col=washCol(club(FEAT_GOAL.team).col),fg=ideal(col);
  var scH=digit(0,1,reveal), scA=digit(0,0,false);
  var kickCol=reveal?' style="background:'+col+';color:'+fg+'"':'';
  if(style==="a") return '<div class="ha">'+
    '<div class="ha__kick"'+kickCol+'><span>'+(reveal?"GOAL":"LIVE")+'</span><span>12&#39;</span></div>'+
    '<div class="ha__bar">'+crest(FEAT.home,"","lab__fbx")+'<span class="ha__nm">'+esc(h.short)+'</span>'+
      '<span class="ha__score">'+scH+'<span class="ha__dash">–</span>'+scA+'</span>'+
      '<span class="ha__nm">'+esc(a.short)+'</span>'+crest(FEAT.away,"","lab__fbx")+'</div>'+
    '<div class="ha__foot">'+(reveal?'<b>Joseph Gbode</b> — his second in two games':esc(h.venue||h.name))+'</div></div>';
  if(style==="b") return '<div class="hb">'+
    '<div class="hb__goal"'+kickCol+'>'+(reveal?"Goal":"Live")+'</div>'+
    '<div class="hb__main">'+
      '<div class="hb__team">'+crest(FEAT.home,"","lab__fbx")+'<span>'+esc(h.short)+'</span></div>'+
      '<span class="hb__score">'+scH+'<span class="hb__dash">–</span>'+scA+'</span>'+
      '<div class="hb__team">'+crest(FEAT.away,"","lab__fbx")+'<span>'+esc(a.short)+'</span></div>'+
    '</div><div class="hb__min">12&#39;</div>'+
    '<div class="hb__foot">'+(reveal?'<b>Joseph Gbode</b> · 12&#39;':esc(h.venue||h.name))+'</div></div>';
  return '<div class="hc">'+
    '<div class="hc__goal" style="color:'+(reveal?col:"transparent")+'">Goal</div>'+
    '<div class="hc__line">'+
      '<span class="hc__nm"'+(reveal?' style="border-bottom-color:'+col+'"':'')+'>'+esc(h.short)+'</span>'+
      '<span class="hc__sc">'+scH+'<span class="hc__dash">–</span>'+scA+'</span>'+
      '<span class="hc__nm">'+esc(a.short)+'</span>'+
    '</div>'+
    '<div class="hc__sub">'+(reveal?'<b>Joseph Gbode</b> · 12&#39;':esc(h.venue||h.name)+' · 12&#39;')+'</div></div>';
}
function heroShow(reveal){
  var el=$("labHero");
  el.hidden=false;
  el.className="lab__hero h-"+HERO+(reveal?" is-reveal":"");
  el.innerHTML=heroHTML(HERO,reveal);
  if(reveal){
    var pin=$("lp_"+FEAT.gc);
    pin.style.setProperty("--hero-col",washCol(club(FEAT_GOAL.team).col));
    pin.classList.remove("is-goal"); void pin.offsetWidth; pin.classList.add("is-goal");
  }
}
function heroHide(){$("labHero").hidden=true;}

var NOTES={
  map:"Full map — dots mark every ground's true location; each scoreboard floats beside its dot on a short stem, and no stem ever runs beneath another card.",
  tease:"Focus · tease — camera into the ground, rails fade, dots stay. Score unchanged: the suspense holds.",
  reveal:"Focus · reveal — the hero updater: team names in type, rolling digit, team colour used surgically. The dot pulses at the ground."
};
function setState(s){
  CUR=s;
  var stage=$("labStage"),pin=$("lp_"+FEAT.gc);
  document.querySelectorAll("[data-state]").forEach(function(b){b.classList.toggle("is-on",b.getAttribute("data-state")===s);});
  $("labNote").textContent=NOTES[s];
  if(s==="map"){ stage.classList.remove("is-focus"); pin.classList.remove("is-hero"); zoomReset(); heroHide(); return; }
  stage.classList.add("is-focus");
  pin.classList.add("is-hero");
  pin.style.setProperty("--hero-col",washCol(club(FEAT_GOAL.team).col));
  zoomTo(FEAT);
  heroShow(s==="reveal");
}
document.querySelectorAll("[data-state]").forEach(function(b){
  b.addEventListener("click",function(){setState(b.getAttribute("data-state"));});
});
document.querySelectorAll("[data-layout]").forEach(function(b){
  b.addEventListener("click",function(){
    LAYOUT=b.getAttribute("data-layout");
    document.querySelectorAll("[data-layout]").forEach(function(x){x.classList.toggle("is-on",x===b);});
    layout();   // boards glide between layouts on their transforms
  });
});
document.querySelectorAll("[data-hero]").forEach(function(b){
  b.addEventListener("click",function(){
    HERO=b.getAttribute("data-hero");
    document.querySelectorAll("[data-hero]").forEach(function(x){x.classList.toggle("is-on",x===b);});
    if(CUR!=="map") heroShow(CUR==="reveal");
  });
});
$("labReplay").addEventListener("click",function(){setState("reveal");});
var rt; window.addEventListener("resize",function(){clearTimeout(rt);rt=setTimeout(layout,120);});
buildMap();
})();
</script>
</body>
</html>
