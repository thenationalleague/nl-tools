<!-- ============================================================
     TEAM OF THE WEEK — fan nominations, embeddable widget for
     thenationalleague.org.uk. Sponsored by Enterprise.
     Source of truth. Copy/paste into the CMS custom HTML block.

     - JWT identity from _gc_sa_sso_access (sso.sportsalliance.com)
     - Supported club is read from the NL+ favourite_team claim on EVERY
       load — no confirm step, no season lock. Change it in the NL+
       profile, sign back in, and the widget follows. users/{jwtId} is
       kept only so a Team of the Week quote has a name against it.
     - RTDB (shared nl-widgets project, named Firebase app):
         users/{jwtId}
         motm/{jwtId}/{matchId}  -> { playerId, playerName, teamId, note, submittedAt }
     - Voting window: opens at FULL TIME (NLS matchPeriod), closes KO+24h.
       A match that never reaches full time never opens for voting.
     - Only the user's supported team's match is nominatable; the fan can
       pick from either side (own team or opposition player), but ONLY
       players who actually appeared — starters plus substitutes who came
       on, derived from events.subs[].substitutionEvents.subOnID, since
       playerStatus alone never says whether a sub got on.
     - No date picker and no standings table: at most one match is open at
       a time, and a public tally could contradict the club's own Team of
       the Week selection.
     - Player lists are lazy-fetched from /v2/matches/{matchId}.
     - Season comes from clubs-meta seasons.current, falling back to the
       date on a Jul-Jun cadence ("2026" = 1 Jul 2026 to 30 Jun 2027).

     URL params:
       ?sim=true|bar   -> show the sim clock bar (live clock)
       ?sim=<ISO>      -> freeze the clock at that datetime, bar shown
       (no param)      -> real clock, bar hidden (production)
       ?season=2025    -> force an older season, for testing

     Changelog:
       02/08/2026  v2.1  Framed as TEAM OF THE WEEK (sponsored by
                         Enterprise, whose black/green identity the
                         header keeps); fans "nominate" rather than
                         vote. Date picker removed — at most one match
                         is ever open, so the widget finds it and
                         otherwise explains the window and names the
                         next fixture. Unused substitutes are no longer
                         selectable: only starters plus subs who
                         actually came on (from substitution events,
                         with the minute). The selection gets full hero
                         treatment on the player's club colours, with
                         the fan's note shown back as the quote it could
                         become. Quotation ask rewritten with a worked
                         example. Player/label/disclaimer type sizes
                         raised throughout. Per-match standings removed
                         — it risked contradicting the club's own
                         selection.
       02/08/2026  v2.0  Supported club now read from the NL+ SSO claim on
                         every load — the confirm-and-lock registration and
                         its dropdown fallback are gone, with a "Not a X
                         fan? Update your details here" link in the hero.
                         Voting is gated on FULL TIME (NLS matchPeriod)
                         rather than KO+2.5h, and a match that never
                         finishes never opens for voting ('unresolved',
                         4h guard). Season comes from clubs-meta
                         seasons.current instead of a hardcoded constant,
                         with a date-derived fallback and ?season= for
                         testing. Sim bar is opt-in via ?sim, matching the
                         Score Predictor. Brand tokens replaced with the
                         canon block (no --gold/--info, no colour-mix
                         overlays, navy active chip, canon scrim/focus).
                         Published as a hosted bundle.
       31/07/2026  v1.0  Initial widget.

     Scoped under #nlMotm; BEM .nlsm__ prefix; Carbona inline;
     no external <script src> tags (CMS strips them). Brand tokens mirror
     system/nl-brand.css verbatim — same block as the Score Predictor.

     Published as a hosted bundle at nl.tools/embeds/motm.js by
     scripts/build-embeds.js, so the CMS carries a two-line snippet and a
     merge to main is the release. Do not hand-edit embeds/motm.js.
     ============================================================ -->

<div id="nlMotm">
  <div class="nlsm__sponsor" id="nlsm-sponsor"></div>
  <div class="nlsm__banner" id="nlsm-banner" hidden>Loading Team of the Week&hellip;</div>
  <div class="nlsm__screen" id="nlsm-register" hidden></div>
  <div class="nlsm__screen" id="nlsm-main" hidden>
    <div id="nlsm-hero"></div>
    <div id="nlsm-fixtures"></div>
  </div>
  <div class="nlsm__gate" id="nlsm-gate"></div>
  <div class="nlsm__footer" id="nlsm-footer"></div>
  <div id="nlsm-sim"></div>
  <div class="nlsm__modal" id="nlsm-modal" hidden></div>
</div>

<style>
  /* Carbona Variable */
  @font-face {
    font-family: "carbona-variable";
    src: url("https://use.typekit.net/af/184cf2/0000000000000000774c3175/31/l?primer=7cdcb44be4a7db8877ffa5c0007b8dd865b3bbc383831fe2ea177f62257a9191&fvd=n4&v=3") format("woff2"),
         url("https://use.typekit.net/af/184cf2/0000000000000000774c3175/31/d?primer=7cdcb44be4a7db8877ffa5c0007b8dd865b3bbc383831fe2ea177f62257a9191&fvd=n4&v=3") format("woff");
    font-display: swap; font-style: normal; font-weight: 200 900; font-stretch: normal;
  }

  #nlMotm {
    /* Values mirror the NL canon (system/nl-brand.css) — embeds can't load
       the portal stylesheet, so the tokens are inlined verbatim. Ladder
       stops are the canonical "lighter/darker"; no gold, no rgba overlays.
       Kept identical to the Score Predictor's block so the two widgets
       cannot drift apart. */
    --primary:#9e0000; --primary-50:#fcf4f2; --primary-300:#dfa197;
    --primary-600:#7e0000; --primary-700:#600000;
    --navy:#223b7c; --navy-600:#192e63;
    --red:#d4380d; --red-light:#fff1ec;
    --green:#1a7030; --green-light:#edf7ee;
    --amber:#c96f15; --amber-light:#fef6ec;
    --accent-live:#4ade80;
    --white:#ffffff; --off-white:#f4f6f9;
    --text:#1a2a44; --text-muted:#5a6a82;
    --border:#dde3ed;
    --radius:6px;
    --shadow:0 2px 12px rgba(10,22,40,.10);
    --focus-ring:0 0 0 3px color-mix(in srgb, var(--primary) 18%, transparent);

    font-family:'carbona-variable','carbona',sans-serif;
    font-size:15px; line-height:1.45;
    font-variation-settings:'wght' 400;
    color:var(--text); -webkit-font-smoothing:antialiased;
    max-width:680px; margin:24px auto; padding:0 12px;
  }
  #nlMotm, #nlMotm *, #nlMotm *::before, #nlMotm *::after { box-sizing:border-box; }

  /* Banner */
  #nlMotm .nlsm__banner {
    background:var(--amber-light); border:1px solid var(--amber); color:var(--amber);
    padding:8px 12px; border-radius:var(--radius); font-size:13px; margin-bottom:14px;
    font-variation-settings:'wght' 600;
  }
  #nlMotm .nlsm__banner.is-err { background:var(--red-light);   border-color:var(--red);   color:var(--red); }
  #nlMotm .nlsm__banner.is-ok  { background:var(--green-light); border-color:var(--green); color:var(--green); }

  /* Gate */
  #nlMotm .nlsm__gate {
    padding:48px 16px; display:flex; justify-content:center;
  }
  #nlMotm .nlsm__gate-card {
    background:var(--white); border:1px solid var(--border); border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:28px 28px 24px; max-width:380px; width:100%;
    text-align:center;
  }
  #nlMotm .nlsm__gate-card img.nlsm__gate-mark {
    height:56px; width:auto; display:block; margin:0 auto 18px;
    max-width:200px; object-fit:contain;
  }
  #nlMotm .nlsm__gate-card h2 {
    margin:0 0 6px;
    font-size:20px; font-weight:900; font-variation-settings:'wght' 900;
    color:var(--text);
  }
  #nlMotm .nlsm__gate-card p {
    margin:0 0 18px;
    color:var(--text-muted); font-size:14px;
    font-weight:500; font-variation-settings:'wght' 500;
  }
  #nlMotm .nlsm__gate-card .nlsm__btn { width:100%; padding:12px 22px; }
  #nlMotm .nlsm__gate-spinner {
    width:22px; height:22px; margin:0 auto 12px;
    border:2px solid var(--border); border-top-color:var(--primary);
    border-radius:50%;
    animation:nlsm-spin .8s linear infinite;
  }
  @keyframes nlsm-spin { to { transform:rotate(360deg); } }

  /* Sponsor header */
  /* Sponsor bar carries ENTERPRISE's identity, not NL brand tokens — this is
     sponsored content and the black/green is the sponsor's, so it is a
     deliberate one-off in the same way club colours are (see the identity
     palette policy atop nl-brand.css). Everything else in the widget uses
     the canon. */
  #nlMotm {
    --enterprise-bg:#000000;
    --enterprise-accent:#34ab56;
  }
  #nlMotm .nlsm__sponsor {
    display:grid; grid-template-columns:1fr auto 1fr; align-items:center;
    background:var(--enterprise-bg); color:var(--white);
    padding:12px 16px; border-radius:var(--radius) var(--radius) 0 0;
    border-bottom:2px solid var(--enterprise-accent);
    gap:12px; min-height:54px;
  }
  #nlMotm .nlsm__sponsor-left  { display:flex; align-items:center; gap:10px; justify-self:start; }
  #nlMotm .nlsm__sponsor-right { display:flex; align-items:center; gap:8px;  justify-self:end; }
  #nlMotm .nlsm__sponsor img.nlsm__sponsor-logo {
    height:26px; width:auto; display:block; object-fit:contain;
  }
  #nlMotm .nlsm__sponsor img.nlsm__sponsor-comp {
    height:30px; width:auto; display:block; object-fit:contain;
  }
  #nlMotm .nlsm__sponsor img.nlsm__sponsor-team {
    height:30px; width:30px; display:block; object-fit:contain;
    background:var(--white); border-radius:4px; padding:1px;
  }
  #nlMotm .nlsm__sponsor .nlsm__sponsor-title {
    font-size:15px; color:var(--white);
    text-transform:uppercase; letter-spacing:1.5px;
    font-weight:900; font-variation-settings:'wght' 900;
    line-height:1; text-align:center; justify-self:center;
  }
  @media (max-width:520px) {
    #nlMotm .nlsm__sponsor {
      padding:10px 12px; min-height:48px;
      grid-template-columns:1fr auto 1fr; gap:8px;
    }
    #nlMotm .nlsm__sponsor img.nlsm__sponsor-logo { height:20px; }
    #nlMotm .nlsm__sponsor img.nlsm__sponsor-comp,
    #nlMotm .nlsm__sponsor img.nlsm__sponsor-team { height:24px; }
    #nlMotm .nlsm__sponsor img.nlsm__sponsor-team { width:24px; }
    #nlMotm .nlsm__sponsor .nlsm__sponsor-title { font-size:11px; letter-spacing:1px; }
  }

  /* Footer */
  #nlMotm .nlsm__footer {
    display:flex; align-items:center; justify-content:center;
    padding:16px 0 4px; margin-top:12px;
    border-top:1px solid var(--border);
  }
  #nlMotm .nlsm__footer img { height:22px; width:auto; display:block; opacity:.65; }

  /* Datebar */
  /* Canon single-choice active state (.chip.active in nl-brand.css): navy */

  /* Hero */
  #nlMotm .nlsm__hero { padding:10px 0 8px; }
  #nlMotm .nlsm__hero .nlsm__greetline {
    font-size:11px; text-transform:uppercase; letter-spacing:1.5px;
    color:var(--text-muted);
    font-weight:800; font-variation-settings:'wght' 800;
    margin-bottom:6px;
  }
  #nlMotm .nlsm__hero h1 {
    font-size:24px; line-height:1.15; margin:0;
    font-weight:900; font-variation-settings:'wght' 900;
  }
  /* Supported club is not locked — this is the way out of it. */
  #nlMotm .nlsm__swapline {
    margin-top:6px;
    font-size:12px; color:var(--text-muted);
    font-weight:600; font-variation-settings:'wght' 600;
  }
  #nlMotm .nlsm__swapline a {
    color:var(--primary); text-decoration:underline; text-underline-offset:2px;
    font-weight:700; font-variation-settings:'wght' 700;
  }
  #nlMotm .nlsm__swapline a:hover { color:var(--primary-600); }

  /* Fixture row */
  #nlMotm .nlsm__row {
    position:relative;
    padding:10px 12px;
    border:1px solid var(--border);
    border-radius:var(--radius);
    background:var(--white);
    margin-bottom:10px;
    display:grid; row-gap:6px;
  }
  #nlMotm .nlsm__row.is-voting { border-color:var(--primary); }
  #nlMotm .nlsm__row.is-voted  { background:var(--green-light); }
  #nlMotm .nlsm__row.is-void   { opacity:.7; }

  #nlMotm .nlsm__meta {
    display:flex; align-items:center; gap:8px;
    font-size:11px; color:var(--text-muted);
    text-transform:uppercase; letter-spacing:1px;
    font-weight:800; font-variation-settings:'wght' 800;
    min-height:16px;
  }
  #nlMotm .nlsm__meta .nlsm__livedot {
    width:7px; height:7px; border-radius:50%; background:var(--accent-live);
    animation:nlsm-pulse 1.4s infinite;
  }
  #nlMotm .nlsm__meta .nlsm__livelbl { color:var(--green); }
  #nlMotm .nlsm__meta .nlsm__ftlabel { color:var(--green); }
  #nlMotm .nlsm__meta .nlsm__votelbl { color:var(--primary); }
  #nlMotm .nlsm__meta .nlsm__voidlbl { color:var(--text-muted); }
  #nlMotm .nlsm__meta .nlsm__lock    { color:var(--text-muted); }
  #nlMotm .nlsm__meta .nlsm__countdown { color:var(--text); }
  @keyframes nlsm-pulse {
    0%   { box-shadow:0 0 0 0 color-mix(in srgb, var(--accent-live) 60%, transparent); }
    70%  { box-shadow:0 0 0 6px color-mix(in srgb, var(--accent-live) 0%, transparent); }
    100% { box-shadow:0 0 0 0 color-mix(in srgb, var(--accent-live) 0%, transparent); }
  }

  /* Team line */
  #nlMotm .nlsm__teamline {
    display:flex; align-items:center; gap:10px;
    font-size:14px; color:var(--text);
    font-weight:800; font-variation-settings:'wght' 800;
    text-transform:uppercase; letter-spacing:.5px;
    min-height:30px;
  }
  #nlMotm .nlsm__teamline img {
    width:24px; height:24px; flex:none; border-radius:3px;
    background:var(--white); object-fit:contain;
  }
  #nlMotm .nlsm__teamline .nlsm__tname {
    flex:1; min-width:0;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  #nlMotm .nlsm__tname-short { display:none; }
  @media (max-width:520px) {
    #nlMotm .nlsm__tname-full  { display:none; }
    #nlMotm .nlsm__tname-short { display:inline; }
  }
  #nlMotm .nlsm__teamscore {
    flex:none; min-width:36px; text-align:right;
    font-size:20px;
    font-weight:900; font-variation-settings:'wght' 900;
    color:var(--text);
  }

  /* Voting picker */
  #nlMotm .nlsm__picker {
    margin-top:4px;
    display:grid; row-gap:10px;
  }
  #nlMotm .nlsm__picker > label {
    font-size:13px; text-transform:uppercase; letter-spacing:1.2px;
    color:var(--text-muted);
    font-weight:800; font-variation-settings:'wght' 800;
  }
  #nlMotm .nlsm__teampick {
    display:grid; grid-template-columns:1fr 1fr; gap:8px;
  }
  #nlMotm .nlsm__teamcol {
    background:var(--white); border:1px solid var(--border);
    border-radius:var(--radius); overflow:hidden;
    display:flex; flex-direction:column;
  }
  #nlMotm .nlsm__teamhead {
    display:flex; align-items:center; gap:6px;
    padding:8px 10px;
    background:var(--team-primary,var(--navy));
    color:var(--team-secondary,var(--white));
    font-size:12px; line-height:1.2;
    font-weight:900; font-variation-settings:'wght' 900;
    text-transform:uppercase; letter-spacing:.8px;
    min-height:32px;
  }
  #nlMotm .nlsm__teamhead img {
    width:18px; height:18px; object-fit:contain; flex:none;
    background:var(--white); border-radius:3px; padding:1px;
  }
  #nlMotm .nlsm__teamhead .nlsm__thname {
    flex:1 1 auto; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  #nlMotm .nlsm__plist { display:flex; flex-direction:column; }
  #nlMotm .nlsm__subdiv {
    padding:6px 10px 3px;
    font-size:11px; text-transform:uppercase; letter-spacing:1px;
    color:var(--text-muted);
    font-weight:800; font-variation-settings:'wght' 800;
    border-top:1px dashed var(--border);
    margin-top:2px;
  }
  #nlMotm .nlsm__player {
    -webkit-appearance:none; appearance:none;
    text-align:left; font:inherit;
    display:flex; align-items:center; gap:8px;
    padding:10px 10px; min-height:44px;
    background:transparent; border:none; border-top:1px solid var(--border);
    color:var(--text); cursor:pointer;
    font-size:14px; line-height:1.25;
    font-weight:700; font-variation-settings:'wght' 700;
  }
  #nlMotm .nlsm__plist > .nlsm__player:first-child,
  #nlMotm .nlsm__plist > .nlsm__subdiv + .nlsm__player {
    border-top:none;
  }
  #nlMotm .nlsm__player:hover { background:var(--off-white); }
  #nlMotm .nlsm__pshirt {
    flex:none; display:inline-block;
    min-width:24px; text-align:center;
    font-size:13px;
    font-weight:900; font-variation-settings:'wght' 900;
    color:var(--text-muted);
  }
  #nlMotm .nlsm__pname {
    flex:1 1 auto; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  #nlMotm .nlsm__player.is-sub .nlsm__pname { color:var(--text-muted); font-weight:600; font-variation-settings:'wght' 600; }
  #nlMotm .nlsm__player.is-selected {
    background:var(--primary-50);
    box-shadow:inset 3px 0 0 var(--primary);
  }
  #nlMotm .nlsm__player.is-selected .nlsm__pname,
  #nlMotm .nlsm__player.is-selected .nlsm__pshirt { color:var(--primary); }
  #nlMotm .nlsm__player:focus-visible {
    outline:2px solid var(--primary); outline-offset:-2px;
  }

  /* Optional note */
  #nlMotm .nlsm__note {
    display:grid; row-gap:4px;
  }
  #nlMotm .nlsm__note textarea {
    width:100%; box-sizing:border-box;
    padding:8px 10px; font-family:inherit; font-size:13px; line-height:1.4;
    color:var(--text); background:var(--white);
    border:1px solid var(--border); border-radius:var(--radius);
    resize:vertical; min-height:54px;
    font-weight:500; font-variation-settings:'wght' 500;
  }
  #nlMotm .nlsm__note textarea:focus {
    outline:none; border-color:var(--primary);
    box-shadow:var(--focus-ring);
  }
  #nlMotm .nlsm__notefoot {
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    font-size:12px; color:var(--text-muted);
    font-weight:600; font-variation-settings:'wght' 600;
  }
  #nlMotm .nlsm__notedisc { flex:1 1 auto; padding-right:8px; }
  #nlMotm .nlsm__notecount.is-max { color:var(--red); }

  /* Your-pick note recall (below summary) */

  #nlMotm .nlsm__pickactions {
    display:flex; gap:8px; justify-content:flex-end;
    align-items:center;
  }
  #nlMotm .nlsm__pickactions .nlsm__pickhint {
    margin-right:auto; font-size:13px; color:var(--text-muted);
    font-weight:600; font-variation-settings:'wght' 600;
  }
  #nlMotm .nlsm__pickactions button {
    font:inherit; font-size:11px;
    font-weight:800; font-variation-settings:'wght' 800;
    text-transform:uppercase; letter-spacing:1px;
    padding:7px 14px; border-radius:var(--radius); cursor:pointer;
  }
  #nlMotm .nlsm__btn-save {
    background:var(--primary); color:var(--white); border:1px solid var(--primary);
  }
  #nlMotm .nlsm__btn-save:hover  { background:var(--primary-600); }
  #nlMotm .nlsm__btn-save:disabled { background:var(--border); color:var(--text-muted); border-color:var(--border); cursor:not-allowed; }
  #nlMotm .nlsm__btn-cancel {
    background:var(--white); color:var(--text-muted); border:1px solid var(--border);
  }
  #nlMotm .nlsm__btn-cancel:hover { color:var(--text); border-color:var(--text-muted); }

  /* Voted summary */

  /* Selection hero — the pick, carried on the player's club colours. This is
     the payoff of the whole widget, so it gets the weight. --hero-bg is the
     club's own primary from clubs-meta; --hero-tx is the readable text token
     chosen for it. */
  #nlMotm .nlsm__pickhero {
    background:var(--hero-bg,var(--navy)); color:var(--hero-tx,var(--white));
    border-radius:var(--radius); overflow:hidden;
    margin-top:4px;
  }
  #nlMotm .nlsm__pickhero-top {
    display:flex; align-items:center; gap:10px;
    padding:9px 14px 0;
    font-size:11px; text-transform:uppercase; letter-spacing:1.4px;
    font-weight:800; font-variation-settings:'wght' 800;
    opacity:.85;
  }
  #nlMotm .nlsm__pickhero-top .nlsm__editmini {
    margin-left:auto;
    font:inherit; font-size:11px;
    text-transform:uppercase; letter-spacing:1px;
    background:transparent; border:none; padding:0;
    color:inherit; cursor:pointer; opacity:.9;
    text-decoration:underline; text-underline-offset:3px;
  }
  #nlMotm .nlsm__pickhero-top .nlsm__editmini:hover { opacity:1; }
  #nlMotm .nlsm__pickhero-body {
    display:flex; align-items:center; gap:14px;
    padding:10px 14px 14px;
  }
  #nlMotm .nlsm__pickhero-body img {
    width:52px; height:52px; flex:none; object-fit:contain;
  }
  #nlMotm .nlsm__pickhero-who { min-width:0; }
  #nlMotm .nlsm__pickhero-name {
    font-size:26px; line-height:1.1;
    font-weight:900; font-variation-settings:'wght' 900;
    letter-spacing:-.3px;
    overflow-wrap:anywhere;
  }
  #nlMotm .nlsm__pickhero-sub {
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    margin-top:4px;
    font-size:12px; text-transform:uppercase; letter-spacing:1px;
    font-weight:700; font-variation-settings:'wght' 700;
    opacity:.85;
  }
  #nlMotm .nlsm__pickhero-shirt {
    padding:1px 7px; border-radius:999px;
    background:var(--white); color:var(--text);
    font-weight:900; font-variation-settings:'wght' 900;
  }
  /* The fan's words shown back as the quote they could become. */
  #nlMotm .nlsm__pickhero-quote {
    margin:0; padding:12px 14px 14px;
    background:var(--white); color:var(--text);
    font-size:15px; line-height:1.5;
    font-weight:500; font-variation-settings:'wght' 500;
    font-style:italic;
    border-top:1px solid var(--border);
  }
  #nlMotm .nlsm__pickhero-quote::before { content:'\201C'; }
  #nlMotm .nlsm__pickhero-quote::after  { content:'\201D'; }

  var NOTE_MAX   = 280;

  // A season is named for the calendar year it STARTS in and runs 1 Jul to

  // from the date is the fallback if that fetch fails, and ?season=2025
  // forces an older one for testing.
  function deriveSeasonId(d) {
    var y = d.getFullYear();
    return (d.getMonth() + 1) >= 7 ? y : y - 1;
  }

    var v = new URLSearchParams(window.location.search).get('season');
    return /^\d{4}$/.test(v || '') ? Number(v) : null;
  }

  // Voting opens at FULL TIME and closes 24h after kick-off. A match that
  // never reaches full time never opens for voting at all.
  var VOTE_CLOSE_MIN = 24 * 60;
  // Past this, an in-play matchPeriod is not believed — an abandoned match
  // or a stalled feed would otherwise sit at "Live" forever.
  var STALE_LIVE_MIN = 240;

  // ---------- DOM refs ----------
  var banner    = document.getElementById('nlsm-banner');
  var register  = document.getElementById('nlsm-register');
  var main      = document.getElementById('nlsm-main');
  var hero      = document.getElementById('nlsm-hero');

  // ---------- sponsor + footer ----------
  var ENTERPRISE_LOGO_URL = 'https://raw.githubusercontent.com/thenationalleague/tools/main/assets/partners/Enterprise.png';
  function renderSponsor() {
    var r = state.registration;
    var compId = userCompId() || DEFAULT_COMP_ID;
    var compName_ = compName(compId);
    var teamName  = (r && r.teamName) || '';
    var compCrest = '<img class="nlsm__sponsor-comp" src="' + compLogoUrl(compId) + '" alt="' + $h(compName_) + '" ' +
                      'title="' + $h(compName_) + '" ' +
                      'onerror="this.onerror=null;this.style.display=\'none\';">';
    var teamCrest = (r && r.crestUrl)
      ? '<img class="nlsm__sponsor-team" src="' + $h(r.crestUrl) + '" alt="' + $h(teamName || 'My team') + '" ' +
          'title="' + $h(teamName) + ' &middot; ' + $h(compName_) + '" ' +
          'onerror="this.onerror=null;this.style.display=\'none\';">'
      : '';
    sponsorEl.innerHTML =
      '<div class="nlsm__sponsor-left">' +
        '<img class="nlsm__sponsor-logo" src="' + ENTERPRISE_LOGO_URL + '" alt="Enterprise" ' +
          'onerror="this.onerror=null;this.style.display=\'none\';">' +

  }

  // ---------- helpers ----------
  function $h(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {

  });}
  function readCookie(name) {
    var p = (document.cookie || '').split('; ');
    for (var i = 0; i < p.length; i++) if (p[i].indexOf(name + '=') === 0) return p[i].slice(name.length + 1);

  }
  function decodeJwtPayload(jwt) {
    if (!jwt) return null;
    var parts = jwt.split('.'); if (parts.length !== 3) return null;
    try {
      var s = parts[1].replace(/-/g, '+').replace(/_/g, '/');
      while (s.length % 4) s += '=';
      return JSON.parse(decodeURIComponent(escape(atob(s))));

  }

    return new Promise(function (resolve, reject) {
      var s = document.createElement('script');

  }

    return FB_SDK.reduce(function (p, name) {

    }, Promise.resolve());
  }

    if (!s) return null;
    var iso = s.indexOf('T') >= 0 ? s : s.replace(' ', 'T') + 'Z';
    return new Date(iso);
  }
  function fmtBST(d) {
    if (!d) return '';
    return d.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit', timeZone:'Europe/London' });
  }
  function fmtBSTDateShort(d) {
    if (!d) return '';
    return d.toLocaleDateString('en-GB', { weekday:'short', day:'numeric', month:'short', timeZone:'Europe/London' });
  }
  function showBanner(msg, kind) {
    banner.className = 'nlsm__banner' + (kind === 'err' ? ' is-err' : kind === 'ok' ? ' is-ok' : '');

  }

  function setBannerOK(msg) {
    showBanner(msg, 'ok');
    setTimeout(function () {
      if (banner.textContent === msg) hideBanner();
    }, 2200);
  }
  function crestImg(url, alt, size) {
    var s = size || 26;
    if (!url) return '<span style="display:inline-block;width:' + s + 'px;height:' + s + 'px;flex:none;"></span>';
    return '<img src="' + $h(url) + '" alt="' + $h(alt || '') + '" ' +
           'onerror="this.onerror=null;this.style.visibility=\'hidden\';">';
  }
  // Compact "in 1h 23m" / "in 45m" style countdown
  function relSoon(ms) {
    if (ms <= 0) return 'now';
    var mins = Math.round(ms / 60000);
    if (mins < 60) return 'in ' + mins + 'm';
    var h = Math.floor(mins / 60);
    var m = mins % 60;
    if (h < 24) return 'in ' + h + 'h' + (m ? ' ' + m + 'm' : '');
    var days = Math.round(h / 24);
    return 'in ' + days + 'd';
  }

  // ---------- sim mode (URL-driven, same contract as the Score Predictor) ----------
  //   (no param)      -> real clock, bar hidden (production)
  //   ?sim=true|bar   -> bar visible, live clock
  //   ?sim=<datetime> -> bar visible, clock frozen at that moment
  //   ?sim=off        -> real clock, bar hidden (explicit form)
  function parseSimMode() {
    var p = new URLSearchParams(window.location.search).get('sim');
    if (p == null) return { fixed: null, barEnabled: false };
    var l = p.toLowerCase();
    if (l === 'off' || l === 'none' || l === '0' || l === 'false') return { fixed: null, barEnabled: false };
    if (l === 'true' || l === 'bar' || l === '1' || l === 'on') return { fixed: null, barEnabled: true };
    var d = new Date(p);
    return { fixed: isNaN(d.getTime()) ? null : d, barEnabled: true };
  }

  // ---------- state ----------
  var fbApp = null, fbDb = null, fbAuth = null;
  var state = {
    user: null, fbAuthed: false,
    allMatches: [],
    matches: [],        // user-team-only matches for selected matchday (usually 1)
    registration: null,
    allVotesRaw: {},    // { jwtId: { matchId: { playerId, ... } } }
    myVotes: {},        // { matchId: vote }
    drafts: {},         // { matchId: playerId } — pending unsaved pick
    editing: {},        // { matchId: true } — re-open submitted vote
    pendingMid: null,   // matchId we're writing right now
    players: {},        // matchId -> { loading, error, list: [{playerId, name, teamId, teamName, shirt, position, status}] }
    clubsByOpta: {},    // teamID (e.g. 't434') -> { name, code, colors:{primary,secondary,tertiary}, ... }
    selectedMatchday: null,
    seasonId: null,     // from clubs-meta seasons.current (or derived / ?season)

  // Team palette from clubs-meta, with brand-safe fallback.
  function getTeamPalette(teamId) {
    var c = state.clubsByOpta[teamId];
    var cols = c && c.colors;
    return {
      primary:   (cols && cols.primary)   || 'var(--navy)',
      secondary: (cols && cols.secondary) || 'var(--white)',

  function fetchClubsMeta() {
    return fetch(CLUBS_META_URL, { credentials:'omit', cache:'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('clubs-meta ' + r.status); return r.json(); })
      .then(function (json) {
        var clubs = (json && json.clubs) || [];
        var map = {};
        clubs.forEach(function (c) { if (c && c.optaID) map[c.optaID] = c; });
        state.clubsByOpta = map;
        var cur = json && json.seasons && json.seasons.current;
        if (cur && /^\d{4}$/.test(String(cur))) state.seasonId = Number(cur);

      .catch(function () { state.clubsByOpta = {}; });
  }

  function simNow() {
    return state.sim.fixed ? new Date(state.sim.fixed.getTime()) : new Date();
  }
  function setSimFixed(d) { state.sim.fixed = d; recomputeMatch(); renderAll(); }
  function clearSimFixed() { setSimFixed(null); }
  function renderAll() {
    renderSimBar(); renderHero(); renderFixtures();
  }

  // ---------- which match are we voting on? ----------
  // There is no date picker. At most one of your club's matches can be open
  // for voting at a time (full time, within 24h of kick-off), so the widget
  // simply finds it. Outside that window there is nothing to choose between,
  // so the UI explains the window instead of offering navigation.
  function bstDateOf(d) {
    if (!d) return '';
    return d.toLocaleDateString('en-CA', { timeZone: 'Europe/London' });
  }
  function votableMatch() {
    var now = simNow();
    var reg = state.registration;
    if (!reg) return null;
    var open = (state.allMatches || []).filter(function (m) {
      return isOwnTeamMatch(m, reg) && stateOf(m, now) === 'voting';
    }).sort(function (a, b) { return dateOf(b).localeCompare(dateOf(a)); });
    return open[0] || null;
  }
  // Next fixture for your club, so "come back soon" can say when.
  function nextFixture() {
    var now = simNow();
    var reg = state.registration;
    if (!reg) return null;
    var up = (state.allMatches || []).filter(function (m) {
      var ko = koOf(m);
      return isOwnTeamMatch(m, reg) && ko && ko.getTime() > now.getTime();
    }).sort(function (a, b) { return dateOf(a).localeCompare(dateOf(b)); });
    return up[0] || null;
  }
  function recomputeMatch() {
    var m = votableMatch();
    state.matches = m ? [m] : [];
    recomputeMyVotes();
    if (m) ensurePlayers(m.id);
  }
  function recomputeMyVotes() {
    if (!state.user) return;
    state.myVotes = state.allVotesRaw[state.user.id] || {};
  }

  // ---------- match state ----------
  function dateOf(m) {
    var a = (m && m.attributes) || {};
    return String(a.kickOffDateUTC || a.kickoffDateUTC || a.kickOffDate || a.kickoffDate || a.date || '');
  }
  function koOf(m) { return normaliseUtc(dateOf(m)); }
  function periodOf(m) { return ((m && m.attributes && m.attributes.matchPeriod) || '').toLowerCase(); }
  // Voting is gated on the match actually being FINISHED, not on the clock:
  // NLS must report FullTime/PostMatch. A game that is abandoned, or whose
  // feed never publishes a final period, therefore never opens for voting —
  // there is no man of the match for a match that did not finish.
  function stateOf(m, now) {
    var p = periodOf(m);
    if (p === 'postponed') return 'postponed';
    if (p === 'abandoned') return 'abandoned';
    var ko = koOf(m); if (!ko) return 'unknown';
    var diffMin = (now - ko) / 60000;
    if (diffMin < 0) return 'pre';
    var isFT = (p === 'fulltime' || p === 'postmatch');
    if (!isFT) {

      // feed once we are well past any plausible finish.
      return diffMin > STALE_LIVE_MIN ? 'unresolved' : 'live';

  function activeSeasonId() {
    return seasonOverride() || state.seasonId || deriveSeasonId(simNow());
  }
  function isOwnTeamMatch(m, reg) {
    return reg && (m.attributes.homeTeam.teamID === reg.teamId || m.attributes.awayTeam.teamID === reg.teamId);
  }

  // ---------- multi-comp lookup ----------
  var teamCompCache = null;
  function buildTeamCompMap() {
    teamCompCache = {};
    (state.allMatches || []).forEach(function (m) {
      var c = m.attributes.competitionID;
      if (m.attributes.homeTeam && m.attributes.homeTeam.teamID) teamCompCache[m.attributes.homeTeam.teamID] = c;
      if (m.attributes.awayTeam && m.attributes.awayTeam.teamID) teamCompCache[m.attributes.awayTeam.teamID] = c;
    });

  function teamCompId(teamId) {
    if (!teamCompCache) buildTeamCompMap();
    return teamCompCache[teamId] || null;
  }
  function userCompId() {
    if (!state.registration) return null;
    return teamCompId(state.registration.teamId) || DEFAULT_COMP_ID;
  }
  function compLogoUrl(compId) {
    var c = COMPS[compId] || COMPS[DEFAULT_COMP_ID];
    return 'https://raw.githubusercontent.com/thenationalleague/tools/main/assets/divisions/' + c.logoFile;
  }
  function compName(compId) {
    var c = COMPS[compId] || COMPS[DEFAULT_COMP_ID];
    return c.name;
  }

  // ---------- fixtures fetch ----------
  function fetchFixtures() {
    return Promise.all(COMP_IDS.map(fetchCompetition))
      .then(function (results) {
        var all = [].concat.apply([], results);
        return all.sort(function (a, b) { return dateOf(a).localeCompare(dateOf(b)); });
      });
  }
  function fetchCompetition(compId) {
    var all = [];
    function page(n) {
      var url = API_BASE + '/matches/?competitionID=' + compId + '&seasonID=' + activeSeasonId() +
                '&sort=kickOffDateUTC&page.number=' + n + '&page.size=100';
      return fetch(url, { credentials:'omit' })
        .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status + ' (comp ' + compId + ')'); return r.json(); })
        .then(function (json) {
          var d = (json && json.data) || [];
          all = all.concat(d);
          var total = json && json.meta && json.meta.totalCount;
          if (d.length === 100 && (total == null || all.length < total) && n < MAX_PAGES) return page(n + 1);
        });
    }
    return page(1).then(function () { return all; });
  }

  // ---------- player list (lazy, per match) ----------
  function ensurePlayers(matchId) {
    var entry = state.players[matchId];
    if (entry && (entry.loading || entry.list)) return; // already loading or loaded
    state.players[matchId] = { loading: true };
    fetch(API_BASE + '/matches/' + matchId, { credentials:'omit' })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (json) {
        var teams = (json && json.data && json.data.attributes && json.data.attributes.matchTeams) || [];
        var list = [];
        teams.forEach(function (team) {
          var teamID = team.teamID;
          var teamName = (team.team && team.team.teamName) || '';
          // playerStatus only says Start|Sub — it does NOT say whether a sub
          // got on. The only source for that is the substitution events, so
          // build the set of players who actually came on and drop the rest:
          // an unused sub is not a candidate for man of the match.
          var cameOn = {}, onMinute = {};
          ((team.events && team.events.subs) || []).forEach(function (ev) {
            var se = ev && ev.substitutionEvents;
            if (!se || !se.subOnID) return;
            cameOn[se.subOnID] = true;
            onMinute[se.subOnID] = ev.formattedEventTime || (ev.eventMinute != null ? ev.eventMinute + "'" : '');
          });
          var starters = (team.players && team.players.Start) || [];
          var subsUsed = ((team.players && team.players.Sub) || []).filter(function (p) {
            return cameOn[p.playerID];
          });
          var all = starters.concat(subsUsed);
          all.forEach(function (p) {
            var pn = p.playerName || {};
            var name = pn.knownName || pn.customKnownName || ((pn.firstName || '') + ' ' + (pn.lastName || '')).trim();
            if (!name) name = 'Player ' + p.playerID;
            list.push({
              playerId:  p.playerID,
              name:      name,
              shirt:     p.shirtNumber,
              position:  (p.playerPosition === 'Substitute' && p.playerSubPosition) ? p.playerSubPosition : p.playerPosition,
              status:    p.playerStatus,
              onMinute:  onMinute[p.playerID] || '',
              teamId:    teamID,
              teamName:  teamName
            });
          });
        });
        state.players[matchId] = { list: list };
        renderFixtures();
      })
      .catch(function (err) {
        state.players[matchId] = { error: err.message || String(err) };
        renderFixtures();
      });
  }
  function findPlayer(matchId, playerId) {
    var entry = state.players[matchId];
    if (!entry || !entry.list) return null;
    for (var i = 0; i < entry.list.length; i++) {
      if (entry.list[i].playerId === playerId) return entry.list[i];
    }
    return null;
  }

  // ---------- registration ----------
  function teamOptionsByComp() {
    var byComp = {};
    (state.allMatches || []).forEach(function (m) {
      var c = m.attributes.competitionID;
      if (!byComp[c]) byComp[c] = {};
      [m.attributes.homeTeam, m.attributes.awayTeam].forEach(function (t) {
        if (!byComp[c][t.teamID]) {
          byComp[c][t.teamID] = { id: t.teamID, name: t.name, shortName: t.shortName, crest: t.crest, compId: c };
        }
      });
    });
    var grouped = [];
    COMP_IDS.forEach(function (c) {
      if (!byComp[c]) return;
      var arr = Object.keys(byComp[c]).map(function (id) { return byComp[c][id]; });
      arr.sort(function (a, b) { return a.name.localeCompare(b.name); });
      grouped.push({ compId: c, name: COMPS[c].name, teams: arr });
    });
    return grouped;
  }
  function allTeamsFlat() {
    var grouped = teamOptionsByComp();
    var flat = [];
    grouped.forEach(function (g) { flat = flat.concat(g.teams); });
    return flat;
  }
  // NL+ profile portal — where fans change their favourite team. After
  // updating it there they need to sign out and back in for the new
  // favourite_team JWT claim to reach this widget.
  var NLPLUS_PORTAL_URL = 'https://signin.thenationalleague.org.uk/';

  // The supported club is NOT locked for the season and is not stored as a
  // registration the fan has to confirm. It is read from the NL+ SSO
  // favourite_team claim on every load, so changing it in the NL+ profile
  // (then signing back in) is all it takes to follow a different club. The
  // widget keeps a users/{jwtId} record for the name/email a Team of the
  // Week quote needs, but nothing gates on it.
  function normClubName(s) {
    return String(s || '').toLowerCase()
      .replace(/&/g, 'and')
      .replace(/[^a-z0-9]+/g, ' ')
      .trim();
  }
  // clubs-meta short name for a teamID ('Forest Green'), used in the
  // "not a X fan?" prompt so it reads the way a fan would say it.
  function clubShort(teamId, fallback) {
    var c = state.clubsByOpta[teamId];
    return (c && (c.short || c.name)) || fallback || '';
  }
  // Match the JWT's favourite_team against this season's teams. Tries the
  // NLS name, then the clubs-meta name/short, all normalised — the claim is
  // free text set in another system, so exact equality is too brittle.
  function resolveTeamFromSso() {
    var fav = state.user && state.user.favTeamName;
    if (!fav) return null;
    var want = normClubName(fav);
    if (!want) return null;
    var flat = allTeamsFlat();
    for (var i = 0; i < flat.length; i++) {
      var t = flat[i];
      var meta = state.clubsByOpta[t.id] || {};
      var candidates = [t.name, t.shortName, meta.name, meta.short];
      for (var k = 0; k < candidates.length; k++) {
        if (candidates[k] && normClubName(candidates[k]) === want) {
          return { teamId: t.id, teamName: t.name, crestUrl: t.crest || '' };
        }
      }
    }
    return null;
  }
  // Keep a lightweight record of who voted — the Team of the Week article
  // quotes notes, which needs a name against them. Fire-and-forget: a
  // failure here must never block voting.
  function upsertUserRecord() {
    var r = state.registration;
    if (!r || !fbDb || !state.user) return;
    fbDb.ref('users/' + state.user.id).update({
      teamId: r.teamId, teamName: r.teamName, crestUrl: r.crestUrl,
      forename: state.user.forename, surnameInitial: state.user.surnameInitial,
      email: state.user.email || '',
      lastSeenAt: firebase.database.ServerValue.TIMESTAMP
    }).catch(function () {});
  }

  // Shown when favourite_team is missing, or names a club outside the
  // National, North and South divisions this season. There is no dropdown
  // fallback by design: the club has to come from NL+ so it stays in sync
  // with the rest of the fan's profile.
  function renderNoTeamCard() {
    main.hidden = true; register.hidden = false;
    var fav = state.user && state.user.favTeamName;
    var lead = fav
      ? 'Your NL+ favourite team (<b>' + $h(fav) + '</b>) isn\'t in the National, North or South divisions this season.'
      : 'Your NL+ profile doesn\'t have a favourite team set yet.';
    register.innerHTML =
      '<div class="nlsm__register-card">' +
        '<div class="nlsm__hero" style="padding:0;">' +
          '<div class="nlsm__greetline">Team of the Week</div>' +
          '<h1>Welcome, ' + $h(state.user.forename) + '</h1>' +
        '</div>' +
        '<p style="color:var(--text-muted);font-size:14px;margin:6px 0 18px;">' + lead +
          ' Set a National League club in your NL+ details, then sign out and back in to vote.</p>' +
        '<a class="nlsm__btn" style="display:block;text-align:center;text-decoration:none;" ' +
           'href="' + $h(NLPLUS_PORTAL_URL) + '">Update your details</a>' +
      '</div>';
  }

  // ---------- hero ----------
  function renderHero() {
    var m = state.matches[0];
    var ko = m ? koOf(m) : null;
    var dateLabel = ko
      ? ko.toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'long', timeZone:'Europe/London' })
      : 'Team of the Week';
    var r = state.registration;
    // The club is not locked — say so, and give them the way to change it.
    var swap = r
      ? '<div class="nlsm__swapline">Not a ' + $h(clubShort(r.teamId, r.teamName)) + ' fan? ' +
          '<a href="' + $h(NLPLUS_PORTAL_URL) + '">Update your details here</a></div>'
      : '';
    hero.className = 'nlsm__hero';
    hero.innerHTML =
      '<div class="nlsm__greetline">' + $h((state.user.forename || '').toUpperCase()) + '</div>' +
      '<h1>' + $h(dateLabel) + '</h1>' +
      swap;
  }

  // ---------- fixture rendering ----------
  function renderFixtures() {
    if (!state.matches.length) { fixtures.innerHTML = windowCardHTML(); return; }
    var now = simNow();
    fixtures.innerHTML = state.matches.map(function (m) { return rowHTML(m, now); }).join('');
    wireRow();
  }

  // Shown whenever nothing is open for voting. Explains the window rather
  // than offering navigation — there is nothing else to look at.
  function windowCardHTML() {
    var reg = state.registration;
    var club = reg ? clubShort(reg.teamId, reg.teamName) : 'your club';
    var nxt = nextFixture();
    var when = '';
    if (nxt) {
      var ko = koOf(nxt);
      var a = nxt.attributes;
      var opp = (a.homeTeam.teamID === reg.teamId) ? a.awayTeam : a.homeTeam;
      var homeAway = (a.homeTeam.teamID === reg.teamId) ? 'v' : 'away to';
      when =
        '<div class="nlsm__windownext">' +
          '<span class="nlsm__windownextlbl">Next up</span>' +
          '<span class="nlsm__windownextfix">' + $h(homeAway) + ' ' +
            $h(clubShort(opp.teamID, opp.shortName || opp.name)) + '</span>' +
          '<span class="nlsm__windownextko">' + $h(fmtBSTDateShort(ko)) + ' &middot; ' + $h(fmtBST(ko)) + '</span>' +
        '</div>';
    }
    return '<div class="nlsm__windowcard">' +
      '<h2>Nominations aren\'t open right now</h2>' +
      '<p>Pick a ' + $h(club) + ' player for Team of the Week once the final ' +
        'whistle goes — nominations stay open for a full day after kick-off. ' +
        'Come back after the next game.</p>' +
      when +
    '</div>';
  }

  function rowHTML(m, now) {
    var a = m.attributes;
    var s = stateOf(m, now);
    var ko = koOf(m);
    var voteClose = ko ? new Date(ko.getTime() + VOTE_CLOSE_MIN * 60000) : null;
    var existing = state.myVotes[m.id];
    var draft    = state.drafts[m.id];
    var editing  = state.editing[m.id];

    // Meta strip
    var meta = '';
    var rowMod = '';
    if (s === 'pre') {
      meta = '<span>' + $h(fmtBST(ko)) + '</span>' +
             '<span class="nlsm__lock">Nominations open at full time</span>';
    } else if (s === 'live') {
      meta = '<span class="nlsm__livedot" aria-hidden="true"></span><span class="nlsm__livelbl">Live</span>' +
             '<span class="nlsm__lock">Nominations open at full time</span>';
    } else if (s === 'unresolved') {
      // Kicked off long ago with no final period published — abandoned, or a
      // stalled feed. Never opens for voting; heals itself if NLS catches up.
      meta = '<span class="nlsm__voidlbl">Awaiting result</span>' +
             '<span class="nlsm__lock">Opens at full time</span>';
      rowMod = ' is-void';
    } else if (s === 'voting') {
      var closesIn = relSoon(voteClose - now);
      meta = '<span class="nlsm__votelbl">Nominations open</span>' +
             '<span class="nlsm__countdown">Closes ' + $h(closesIn) + '</span>';
      rowMod = ' is-voting';
    } else if (s === 'closed') {
      meta = '<span class="nlsm__ftlabel">Nominations closed</span>' +
             '<span class="nlsm__lock">Closed ' + $h(fmtBSTDateShort(voteClose)) + '</span>';
    } else if (s === 'postponed') {
      meta = '<span class="nlsm__voidlbl">Postponed</span><span style="opacity:.7;">No nomination</span>';
      rowMod = ' is-void';
    } else if (s === 'abandoned') {
      meta = '<span class="nlsm__voidlbl">Abandoned</span><span style="opacity:.7;">No nomination</span>';
      rowMod = ' is-void';
    }

    function scoreCell(side) {
      var real = (side === 'home' ? a.homeTeam : a.awayTeam).score;
      if (s === 'pre' || s === 'unresolved') return '<div class="nlsm__teamscore" style="color:var(--text-muted);">—</div>';
      return '<div class="nlsm__teamscore">' + (real != null ? real : '?') + '</div>';
    }
    function teamLine(t, side) {
      var full  = t.name || t.shortName || '';
      var short = t.shortName || t.name || '';
      return '<div class="nlsm__teamline">' +
        crestImg(t.crest, full) +
        '<span class="nlsm__tname">' +
          '<span class="nlsm__tname-full">'  + $h(full)  + '</span>' +
          '<span class="nlsm__tname-short">' + $h(short) + '</span>' +
        '</span>' +
        scoreCell(side) +
      '</div>';
    }

    // Action area
    var action = '';
    if (s === 'voting') {
      if (existing && !editing) {
        action = pickHeroHTML(m, existing, true);
      } else {
        var draftForPicker = draft || (existing ? { playerId: existing.playerId, note: existing.note || '' } : null);
        action = pickerHTML(m, draftForPicker, !!existing);
      }
    } else if (s === 'closed') {
      action = existing
        ? pickHeroHTML(m, existing, false)
        : '<div class="nlsm__lockcard">No nomination submitted — the window has closed.</div>';
    } else if (s === 'pre' || s === 'live' || s === 'unresolved') {
      // No action — the meta strip already says voting waits for full time.
    }

    var rowCls = 'nlsm__row';
    rowCls += rowMod;
    if (existing && s === 'voting' && !editing) rowCls += ' is-voted';

    return '<div class="' + rowCls + '">' +
      '<div class="nlsm__meta">' + meta + '</div>' +
      teamLine(a.homeTeam, 'home') +
      teamLine(a.awayTeam, 'away') +
      action +
    '</div>';
  }

  // The selection, given real hero treatment: the chosen player carried on
  // their club's colours, with the shirt number, how they featured, and the
  // fan's own words shown back as the quote they will be.
  function pickHeroHTML(m, vote, canChange) {
    var p = findPlayer(m.id, vote.playerId);
    var name = (p && p.name) || vote.playerName || vote.playerId;
    var teamId = (p && p.teamId) || vote.teamId;
    var a = m.attributes;
    var team = (a.homeTeam.teamID === teamId) ? a.homeTeam : a.awayTeam;
    var pal = getTeamPalette(teamId);
    var txt = pickTextColor(pal.primary);
    var shirt = (p && p.shirt != null) ? '#' + p.shirt : '';
    var role = '';
    if (p) {
      role = (p.status === 'Start')
        ? (p.position || 'Started')
        : ('Substitute' + (p.onMinute ? ' &middot; on ' + $h(p.onMinute) : ''));
    }
    return '<div class="nlsm__pickhero" style="--hero-bg:' + $h(pal.primary) + ';--hero-tx:' + $h(txt) + ';">' +
      '<div class="nlsm__pickhero-top">' +
        '<span class="nlsm__pickhero-lbl">' + (canChange ? 'Your nomination' : 'Your nomination') + '</span>' +
        (canChange ? '<button type="button" class="nlsm__editmini" data-edit="' + $h(m.id) + '">Change</button>' : '') +
      '</div>' +
      '<div class="nlsm__pickhero-body">' +
        (team.crest ? '<img src="' + $h(team.crest) + '" alt="" onerror="this.style.display=\'none\';">' : '') +
        '<div class="nlsm__pickhero-who">' +
          '<div class="nlsm__pickhero-name">' + $h(name) + '</div>' +
          '<div class="nlsm__pickhero-sub">' +
            (shirt ? '<span class="nlsm__pickhero-shirt">' + $h(shirt) + '</span>' : '') +
            '<span>' + (role || $h(team.shortName || team.name || '')) + '</span>' +
          '</div>' +
        '</div>' +
      '</div>' +
      (vote.note
        ? '<blockquote class="nlsm__pickhero-quote">' + $h(vote.note) + '</blockquote>'
        : '') +
    '</div>';
  }

  // Text colour that reads on an arbitrary club colour (canon-safe: only
  // ever returns a token, never a computed hex).
  function pickTextColor(hex) {
    var c = String(hex || '').replace('#', '');
    if (!/^[0-9a-fA-F]{6}$/.test(c)) return 'var(--white)';
    var r = parseInt(c.slice(0, 2), 16), g = parseInt(c.slice(2, 4), 16), b = parseInt(c.slice(4, 6), 16);
    return (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255 > 0.68 ? 'var(--text)' : 'var(--white)';
  }

  function pickerHTML(m, draft, hadVote) {
    var entry = state.players[m.id];
    if (!entry || entry.loading) {
      return '<div class="nlsm__lockcard"><span class="nlsm__inlinespin" aria-hidden="true"></span>Loading lineups...</div>';
    }
    if (entry.error) {
      return '<div class="nlsm__lockcard">Lineups not available yet. Check back soon.</div>';
    }
    var list = entry.list || [];
    if (!list.length) {
      return '<div class="nlsm__lockcard">Lineups not posted for this match.</div>';
    }
    var selectedPid = (draft && draft.playerId) || '';
    var noteVal     = (draft && draft.note) || '';
    var a = m.attributes;

    function teamCol(team) {
      var palette = getTeamPalette(team.teamID);
      var ps = list.filter(function (p) { return p.teamId === team.teamID; });
      // Starters first then subs (by shirt number within each group)
      ps.sort(function (x, y) {
        var sx = x.status === 'Start' ? 0 : 1;
        var sy = y.status === 'Start' ? 0 : 1;
        if (sx !== sy) return sx - sy;
        var nx = x.shirt == null ? 999 : x.shirt;
        var ny = y.shirt == null ? 999 : y.shirt;
        return nx - ny;
      });
      var seenSub = false;
      var rows = ps.map(function (p) {
        var isSub = p.status !== 'Start';
        var divider = '';
        if (isSub && !seenSub) { seenSub = true; divider = '<div class="nlsm__subdiv">Came on</div>'; }
        var shirt = p.shirt != null ? '#' + p.shirt : '';
        var cls = 'nlsm__player' + (isSub ? ' is-sub' : '') + (p.playerId === selectedPid ? ' is-selected' : '');
        return divider +
          '<button type="button" class="' + cls + '" ' +
              'data-pick="' + $h(m.id) + '" data-pid="' + $h(p.playerId) + '" ' +
              'aria-pressed="' + (p.playerId === selectedPid ? 'true' : 'false') + '">' +
            '<span class="nlsm__pshirt">' + $h(shirt) + '</span>' +
            '<span class="nlsm__pname">' + $h(p.name) + '</span>' +
            (isSub && p.onMinute ? '<span class="nlsm__pon">' + $h(p.onMinute) + '</span>' : '') +
          '</button>';
      }).join('');
      var teamLabel = team.shortName || team.name || '';
      return '<div class="nlsm__teamcol" style="--team-primary:' + $h(palette.primary) + ';--team-secondary:' + $h(palette.secondary) + ';">' +
        '<div class="nlsm__teamhead">' +
          (team.crest ? '<img src="' + $h(team.crest) + '" alt="" onerror="this.style.display=\'none\';">' : '') +
          '<span class="nlsm__thname">' + $h(teamLabel) + '</span>' +
        '</div>' +
        '<div class="nlsm__plist">' + (rows || '<div class="nlsm__subdiv" style="text-align:center;padding:10px 6px;">No squad listed</div>') + '</div>' +
      '</div>';
    }

    var hint = hadVote ? 'Tap a player to change your pick' : 'Anyone who played, either side';
    var noteLen = noteVal.length;
    var notedID = 'nlsm-note-' + m.id;
    return '<div class="nlsm__picker">' +
      '<label>Pick your nomination</label>' +
      '<div class="nlsm__teampick">' +
        teamCol(a.homeTeam) +
        teamCol(a.awayTeam) +
      '</div>' +
      '<div class="nlsm__note">' +
        '<label class="nlsm__notelbl" for="' + notedID + '">Why them? <span>Optional</span></label>' +
        '<p class="nlsm__noteexample">We pick the best lines for our Team of the Week article — ' +
          'yours could run alongside the player. For example:<br>' +
          '<em>&ldquo;Ran the midfield on his own and that block at 1&ndash;1 was worth a goal.&rdquo;</em></p>' +
        '<textarea id="' + notedID + '" data-note="' + $h(m.id) + '" ' +
          'maxlength="' + NOTE_MAX + '" rows="3" ' +
          'placeholder="What did they do that won it for you?">' +
          $h(noteVal) +
        '</textarea>' +
        '<div class="nlsm__notefoot">' +
          '<span class="nlsm__notedisc">Published with your first name and initial.</span>' +
          '<span class="nlsm__notecount' + (noteLen >= NOTE_MAX ? ' is-max' : '') + '" data-count="' + $h(m.id) + '">' + noteLen + '/' + NOTE_MAX + '</span>' +
        '</div>' +
      '</div>' +
      '<div class="nlsm__pickactions">' +
        '<span class="nlsm__pickhint">' + $h(hint) + '</span>' +
        (hadVote ? '<button type="button" class="nlsm__btn-cancel" data-cancel="' + $h(m.id) + '">Cancel</button>' : '') +
        '<button type="button" class="nlsm__btn-save" data-save="' + $h(m.id) + '"' + (selectedPid ? '' : ' disabled') + '>Save nomination</button>' +
      '</div>' +
    '</div>';
  }

  function wireRow() {
    Array.prototype.forEach.call(fixtures.querySelectorAll('button.nlsm__player[data-pick]'), function (btn) {
      btn.addEventListener('click', function () {
        var mid = btn.getAttribute('data-pick');
        var pid = btn.getAttribute('data-pid');
        var d = state.drafts[mid] || {};
        d.playerId = pid;
        state.drafts[mid] = d;
        // Update selection state in-place to avoid losing textarea focus.
        var others = fixtures.querySelectorAll('button.nlsm__player[data-pick="' + mid + '"]');
        Array.prototype.forEach.call(others, function (b) {
          var on = b.getAttribute('data-pid') === pid;
          b.classList.toggle('is-selected', on);
          b.setAttribute('aria-pressed', on ? 'true' : 'false');
        });
        var saveBtn = fixtures.querySelector('button[data-save="' + mid + '"]');
        if (saveBtn) saveBtn.disabled = false;
      });
    });
    Array.prototype.forEach.call(fixtures.querySelectorAll('textarea[data-note]'), function (ta) {
      ta.addEventListener('input', function () {
        var mid = ta.getAttribute('data-note');
        var v = ta.value || '';
        if (v.length > NOTE_MAX) { v = v.slice(0, NOTE_MAX); ta.value = v; }
        var d = state.drafts[mid] || {};
        d.note = v;
        state.drafts[mid] = d;
        var counter = fixtures.querySelector('[data-count="' + mid + '"]');
        if (counter) {
          counter.textContent = v.length + '/' + NOTE_MAX;
          counter.classList.toggle('is-max', v.length >= NOTE_MAX);
        }
      });
    });
    Array.prototype.forEach.call(fixtures.querySelectorAll('button[data-save]'), function (b) {
      b.addEventListener('click', function () {
        var mid = b.getAttribute('data-save');
        saveVote(mid);
      });
    });
    Array.prototype.forEach.call(fixtures.querySelectorAll('button[data-cancel]'), function (b) {
      b.addEventListener('click', function () {
        var mid = b.getAttribute('data-cancel');
        delete state.editing[mid];
        delete state.drafts[mid];
        renderFixtures();
      });
    });
    Array.prototype.forEach.call(fixtures.querySelectorAll('button[data-edit]'), function (b) {
      b.addEventListener('click', function () {
        var mid = b.getAttribute('data-edit');
        state.editing[mid] = true;
        var existing = state.myVotes[mid];
        if (existing) {
          state.drafts[mid] = {
            playerId: existing.playerId,
            note: existing.note || ''
          };
        }
        renderFixtures();
      });
    });
  }

  function saveVote(mid) {
    var d = state.drafts[mid] || {};
    var pid = d.playerId;
    if (!pid) return;
    var m = state.matches.filter(function (x) { return x.id === mid; })[0];
    if (!m) return;
    if (stateOf(m, simNow()) !== 'voting') {
      showBanner('Nominations have closed for this match.', 'err');
      return;
    }
    var p = findPlayer(mid, pid);
    if (!p) {
      showBanner('Player not in lineup.', 'err');
      return;
    }
    // Clear edit flag up front so the listener re-render doesn't leave the
    // row stuck in the picker after the write succeeds.
    delete state.editing[mid];
    state.pendingMid = mid;

    var note = (d.note || '').trim().slice(0, NOTE_MAX);
    var payload = {
      playerId:    pid,
      playerName:  p.name,
      teamId:      p.teamId,
      submittedAt: firebase.database.ServerValue.TIMESTAMP
    };
    if (note) payload.note = note;
    fbDb.ref('motm/' + state.user.id + '/' + mid).set(payload)
      .then(function () {
        delete state.drafts[mid];
        state.pendingMid = null;
        setBannerOK('Nomination saved');
        renderFixtures();
      })
      .catch(function (err) {
        state.editing[mid] = true;
        state.pendingMid = null;
        renderFixtures();
        showBanner('Nomination failed: ' + err.message, 'err');
      });
  }

  // ---------- sim bar ----------
  function pad2(n) { n = String(n); return n.length < 2 ? '0' + n : n; }
  function dateInputValue(d) {
    if (!d) return '';
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  }
  function timeInputValue(d) {
    if (!d) return '';
    return pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  }
  function renderSimBar() {
    if (!state.sim.barEnabled) { simEl.className = ''; simEl.innerHTML = ''; return; }
    var d = simNow();
    var live = state.sim.fixed
      ? 'Sim &middot; ' + d.toLocaleString('en-GB', { weekday:'short', day:'numeric', month:'short', hour:'2-digit', minute:'2-digit', timeZone:'Europe/London' }) + ' BST'
      : 'Live clock';
    simEl.className = 'nlsm__simbar';
    simEl.innerHTML =
      '<span class="nlsm__simlbl">Sim now</span>' +
      '<input type="date" id="nlsm-sim-date" value="' + $h(dateInputValue(d)) + '">' +
      '<input type="time" id="nlsm-sim-time" value="' + $h(timeInputValue(d)) + '" step="60">' +
      '<button id="nlsm-sim-now" class="nlsm__sim-now-btn">Now</button>' +
      '<span class="nlsm__clock">' + live + '</span>';
    var dateInput = document.getElementById('nlsm-sim-date');
    var timeInput = document.getElementById('nlsm-sim-time');
    function commit() {
      var dv = dateInput.value || dateInputValue(d);
      var tv = timeInput.value || timeInputValue(d);
      if (!dv) return;
      var picked = new Date(dv + 'T' + (tv || '12:00'));
      if (isNaN(picked.getTime())) return;
      setSimFixed(picked);
    }
    dateInput.addEventListener('change', commit);
    timeInput.addEventListener('change', commit);
    document.getElementById('nlsm-sim-now').addEventListener('click', clearSimFixed);
  }

  // ---------- RTDB listeners ----------
  // Only votes are listened to. The supported club comes from SSO on every
  // load, so there is no users/ subscription and nothing to wait for before
  // the UI can render.
  function listenAll() {
    fbDb.ref('motm').on('value', function (snap) {
      state.allVotesRaw = snap.val() || {};
      recomputeMyVotes();
      if (!main.hidden) {
        // Don't yank focus from a user mid-vote (textarea / player tap).
        // Their own save path re-renders explicitly when the write returns.
        var midEdit = fixtures.contains(document.activeElement);
        if (!midEdit) renderFixtures();
      }
    });
  }

  // ---------- gate ----------
  var gateEl = document.getElementById('nlsm-gate');
  function renderGateLoading() {
    gateEl.hidden = false;
    register.hidden = true;
    main.hidden = true;
    hideBanner();
    gateEl.innerHTML =
      '<div class="nlsm__gate-card">' +
        '<img class="nlsm__gate-mark" src="' + NLPLUS_LOGO_URL + '" alt="NL+" ' +
          'onerror="this.onerror=null;this.style.display=\'none\';">' +
        '<div class="nlsm__gate-spinner" aria-hidden="true"></div>' +
        '<h2>Team of the Week</h2>' +
        '<p>Loading...</p>' +
      '</div>';
  }
  function renderGateSignIn() {
    gateEl.hidden = false;
    register.hidden = true;
    main.hidden = true;
    hideBanner();
    gateEl.innerHTML =
      '<div class="nlsm__gate-card">' +
        '<img class="nlsm__gate-mark" src="' + NLPLUS_LOGO_URL + '" alt="NL+" ' +
          'onerror="this.onerror=null;this.style.display=\'none\';">' +
        '<h2>Sign in with NL+ to nominate</h2>' +
        '<p>Nominate a player for Team of the Week after every one of your team\'s games. Nominations open at full time.</p>' +
        '<a class="nlsm__btn" href="' + $h(signInHref()) + '">Sign in with NL+</a>' +
      '</div>';
  }
  function hideGate() { gateEl.hidden = true; gateEl.innerHTML = ''; }

  function signInHref() {
    var here = '';
    try { here = window.location.href; } catch (e) {}
    var enc = encodeURIComponent(here);
    return 'https://signin.thenationalleague.org.uk/auth/login' +
      '?tenantid=' + encodeURIComponent(SSO_TENANT_ID) +
      '&returnvisitorurl=' + enc +
      '&successredirecturl=' + enc +
      '&loginSuccess=true' +
      '&mandatory=false';
  }

  // ---------- boot ----------
  function tryDecodeClaims() {
    var jwt = readCookie('_gc_sa_sso_access');
    return decodeJwtPayload(jwt);
  }
  function waitForJwt(maxMs) {
    return new Promise(function (resolve) {
      var c = tryDecodeClaims();
      if (c && c.id) return resolve(c);
      var start = Date.now();
      var iv = setInterval(function () {
        var got = tryDecodeClaims();
        if (got && got.id) { clearInterval(iv); resolve(got); return; }
        if (Date.now() - start >= maxMs) { clearInterval(iv); resolve(null); }
      }, 200);
    });
  }

  (function boot() {
    renderSponsor();
    renderFooter();
    renderGateLoading();
    waitForJwt(4000).then(function (claims) {
      if (!claims || !claims.id) { renderGateSignIn(); return; }
      startSignedIn(claims);
    });
  })();

  function startSignedIn(claims) {
    // Parse sim up front: the season fallback derives from the sim clock, so
    // a frozen date must be in place before fixtures are requested.
    state.sim = parseSimMode();
    state.user = {
      id: claims.id,
      forename: claims.forename || 'there',
      surname:  claims.surname  || '',
      surnameInitial: (claims.surname || '').charAt(0).toUpperCase(),
      email:    claims.email    || '',
      favTeamName: claims.favourite_team || null
    };

    Promise.all([
      loadFirebase().then(function () {
        var exists = firebase.apps && firebase.apps.some(function (a) { return a.name === APP_NAME; });
        fbApp  = exists ? firebase.app(APP_NAME) : firebase.initializeApp(FIREBASE_CONFIG, APP_NAME);
        fbAuth = firebase.auth(fbApp);
        fbDb   = firebase.database(fbApp);
        return fbAuth.signInAnonymously();
      }).then(function () { state.fbAuthed = true; }),
      // clubs-meta first: it carries seasons.current, which the fixtures
      // request needs, and the club colours/short names the UI reads.
      fetchClubsMeta().then(function () {
        return fetchFixtures();
      }).then(function (ms) {
        state.allMatches = ms;
        teamCompCache = null;
      })
    ]).then(function () {
      hideBanner();
      // Club comes from the SSO claim, resolved against this season's teams.
      state.registration = resolveTeamFromSso();
      hideGate();
      if (!state.registration) { renderNoTeamCard(); return; }
      register.hidden = true; main.hidden = false;
      upsertUserRecord();
      renderSponsor();
      recomputeMatch();
      renderAll();
      listenAll();
      // Keep "voting opens / closes in Xm" labels fresh
      setInterval(function () {
        if (!main.hidden) {
          renderFixtures();
        }
      }, 60000);
    }).catch(function (err) {
      showBanner('Could not start Team of the Week: ' + (err && err.message ? err.message : err), 'err');
    });
  }
})();
</script>
