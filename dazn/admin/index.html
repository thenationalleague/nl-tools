<!DOCTYPE html>
<!--
  NL Tools — DAZN Viewing (staff)
  Version: v3.0 (12/10/2026)
  File: /dazn/admin/index.html

  CHANGELOG
    v3.0 (12/10/2026) — First build. Every club's DAZN season in one table;
      open a club to see exactly what that club sees on /dazn/. Admins
      import a season by pasting the "Matches" sheet.

  The club-facing page is /dazn/ (club access code). This is the League's
  view of the same data, behind auth-guard.

  IMPORT. Paste the Matches sheet, header row included. Nothing is written
  until every row parses and every club name matches clubs-meta; the season
  is derived from the dates rather than chosen from a dropdown, so a season
  cannot be filed under the wrong year by a mis-click. A re-import REPLACES
  that season — the sheet is the record, so the latest paste wins.
  The source file never goes in this repo: it is DAZN-confidential, and the
  repo is public.

  Storage (RTDB) — shape documented in /dazn/_data.js:
    app-data/media-dazn/seasons/<season>/...   matches, clubs, bench
    app-data/media-dazn/index/<season>         season list for both pages
    tools/media-dazn                           tool registration
  Access (auth-guard registry — see system/auth-guard.js):
    superadmin / admin → view + import
    staff              → view
    clubs              → off here; they use /dazn/ with their access code
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DAZN Viewing — NL Tools</title>

  <!-- Favicons. Static, not injected: nl-topbar.js adds these too, but a
       standalone page never loads it, and an icon that arrives with the JS
       leaves the tab blank until it does. /favicon.ico at the root is the
       backstop every browser asks for without being told. -->
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/favicon-16x16.png">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">

  <!-- Brand stylesheet (lint canonical: ?v=67) -->
  <link rel="stylesheet" href="/system/nl-brand.css?v=67">

  <!-- Firebase 10.12.0 SDK (compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

  <!-- Firebase init -->
  <script>
    firebase.initializeApp({
      apiKey:            "AIzaSyC3az3OMnU7TdqlaWp8yrO_EjgZ36l-mXU",
      authDomain:        "nl-tools.firebaseapp.com",
      databaseURL:       "https://nl-tools-default-rtdb.europe-west1.firebasedatabase.app",
      projectId:         "nl-tools",
      storageBucket:     "nl-tools.firebasestorage.app",
      messagingSenderId: "801354670005",
      appId:             "1:801354670005:web:05d8ebad3e7e63610d03fc"
    });
    var db = firebase.database();
  </script>

  <!-- Tool identity + changelog. Keep window.NL_TOOL and var NL_TOOL_KEY
       in sync — auth-guard reads NL_TOOL_KEY, nl-topbar reads window.NL_TOOL. -->
  <script>
    window.NL_TOOL = {
      title: 'DAZN Viewing',
      toolKey: 'media-dazn'
    };
    var NL_TOOL_KEY = 'media-dazn';

    window.NL_CHANGELOG = [
      {
        date: '12/10/2026',
        version: 'v3.0',
        items: [
          'First version. Every club’s DAZN views, minutes watched and UK availability for the season, with each club’s own view one click away.',
          'Admins import a season by pasting the Matches sheet from the DAZN workbook.'
        ]
      }
    ];

    /* auth-guard fires this once the session is verified + pageWrap is
       revealed. Boot the main app from here so RTDB reads happen with a
       live auth token. Do NOT read RTDB before this fires. */
    window.nlAuthReady = function (userData) {
      window.NL = window.NL || {};
      window.NL.session = userData;
      if (window.TOOL && window.TOOL.boot) {
        window.TOOL.boot(userData);
      } else {
        window._toolDeferredSession = userData;
      }
    };
  </script>

  <!-- NL system scripts (lint canonical: ?v=47 / ?v=1 / ?v=10 / ?v=16) -->
  <script src="/system/nl-utils.js?v=47"></script>
  <!-- GA4, one property for all of nl.tools. Cookieless, so no consent
       banner on any page; page views by path, no identity. Tool events go
       through NL.track(). See system/nl-analytics.js. -->
  <script src="/system/nl-analytics.js?v=1"></script>
  <script src="/system/nl-topbar.js?v=10"></script>
  <script src="/system/auth-guard.js?v=16"></script>

  <link rel="stylesheet" href="/dazn/_view.css?v=1">
  <script src="/dazn/_data.js?v=1"></script>
  <script src="/dazn/_view.js?v=1"></script>

<style>
  /* #pageWrap default hide is in nl-brand.css; auth-guard reveals with
     style.display = 'block'. Don't clear with '' — would re-trigger the
     brand rule and re-hide the page. */
  .dza-bar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 20px; }
  .dza-bar .dza-grow { flex: 1; }
  .dza-clubs tbody tr { cursor: pointer; }
  .dza-clubs tbody tr.is-open td { background: var(--blue-light) !important; }
  .dza-club-head { display: flex; align-items: center; gap: 12px; margin: 32px 0 16px; }
  .dza-club-head img { width: 40px; height: 40px; object-fit: contain; }
  .dza-club-head h2 { color: var(--navy); font-size: var(--text-lg); }
  .dza-import { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 28px; }
  .dza-import textarea { width: 100%; min-height: 140px; font-family: var(--font-mono); font-size: var(--text-xs); }
  .dza-import__actions { display: flex; gap: 10px; margin-top: 12px; }
  .dza-preview { margin-top: 16px; font-size: var(--text-sm); }
  .dza-preview ul { margin: 8px 0 0 18px; }
</style>
</head>
<body>

<!-- Topbar — auto-rendered by /system/nl-topbar.js from window.NL_TOOL -->
<div id="nlTopbar"></div>

<div id="pageWrap">
  <div class="page">

    <div class="dza-bar">
      <select class="nl-select" id="dzaSeason" aria-label="Season" hidden></select>
      <span class="dza-grow"></span>
      <a class="btn btn--ghost" href="/dazn/" target="_blank" rel="noopener">Club page</a>
      <button class="btn btn--navy" id="dzaImportBtn" type="button" hidden>Import a season</button>
    </div>

    <section class="dza-import" id="dzaImport" hidden>
      <div class="section-head"><h2>Import a season</h2></div>
      <div class="form-group">
        <label for="dzaPaste">Matches sheet, header row included</label>
        <textarea id="dzaPaste" spellcheck="false" placeholder="Select all on the Matches sheet, copy, paste here"></textarea>
      </div>
      <div class="dza-import__actions">
        <button class="btn btn--ghost" id="dzaCheck" type="button">Check</button>
        <button class="btn btn--primary" id="dzaWrite" type="button" disabled>Import</button>
      </div>
      <div class="dza-preview" id="dzaPreview"></div>
    </section>

    <div id="dzaBody"></div>
    <div id="dzaClub"></div>

  </div>
</div>

<!-- Main app -->
<script>
(function () {
  'use strict';

  var BASE = 'app-data/media-dazn';
  var D = window.DAZNData;
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return NL.escHtml(s); };
  var whole = new Intl.NumberFormat('en-GB', { maximumFractionDigits: 0 });
  var oneDp = new Intl.NumberFormat('en-GB', { minimumFractionDigits: 1, maximumFractionDigits: 1 });

  var S = { session: null, isAdmin: false, meta: null, byName: {}, names: {},
            index: {}, season: null, data: null, open: null, pending: null };

  function loading(text) {
    $('dzaBody').innerHTML = '<div class="empty-state"><div class="empty-state__title">' + esc(text) + '</div></div>';
    $('dzaClub').innerHTML = '';
  }

  /* ---- Seasons ------------------------------------------------------ */
  function loadIndex() {
    return db.ref(BASE + '/index').once('value').then(function (snap) {
      S.index = snap.val() || {};
      var keys = Object.keys(S.index).sort().reverse();
      var sel = $('dzaSeason');
      sel.innerHTML = keys.map(function (k) {
        return '<option value="' + esc(k) + '">' + esc(S.index[k].label || NL.season.label(S.meta, k)) + '</option>';
      }).join('');
      sel.hidden = keys.length < 2;
      if (!keys.length) {
        loading(S.isAdmin ? 'No seasons imported yet' : 'No figures yet');
        return;
      }
      var want = keys.indexOf(S.season) !== -1 ? S.season : keys[0];
      sel.value = want;
      return showSeason(want);
    });
  }

  function showSeason(key) {
    S.season = key;
    S.open = null;
    loading('Loading…');
    return db.ref(BASE + '/seasons/' + key).once('value').then(function (snap) {
      S.data = snap.val() || {};
      drawClubs();
    });
  }

  /* ---- Every club --------------------------------------------------- */
  function drawClubs() {
    var clubs = S.data.clubs || {};
    var rows = Object.keys(clubs).map(function (code) {
      var s = D.summarise(clubs[code].matches, code);
      return { code: code, name: S.names[code] || code, div: clubs[code].div, s: s };
    }).sort(function (a, b) { return b.s.views - a.s.views; });

    var body = rows.map(function (r) {
      return '<tr data-code="' + esc(r.code) + '"' + (S.open === r.code ? ' class="is-open"' : '') + '>' +
        '<td><span class="dz-opp">' + NL.clubs.crestImgHtml(r.name, 'thumb', { className: 'dz-crest' }) +
          '<span>' + esc(r.name) + '</span></span></td>' +
        '<td>' + esc(D.DIV_LABEL[r.div] || r.div || '') + '</td>' +
        '<td class="dz-num">' + r.s.games + '</td>' +
        '<td class="dz-num">' + whole.format(r.s.ukViews) + '</td>' +
        '<td class="dz-num">' + whole.format(r.s.intlViews) + '</td>' +
        '<td class="dz-num dz-strong">' + whole.format(r.s.views) + '</td>' +
        '<td class="dz-num">' + (r.s.avgUkPerUkShown == null ? '—' : whole.format(r.s.avgUkPerUkShown)) + '</td>' +
        '<td class="dz-num">' + (r.s.avgMins == null ? '—' : oneDp.format(r.s.avgMins)) + '</td>' +
      '</tr>';
    }).join('');

    $('dzaBody').innerHTML =
      '<div class="section-head"><h2>Clubs</h2></div>' +
      '<div class="table-wrap"><table class="table table--compact dz-table dza-clubs">' +
        '<thead><tr><th>Club</th><th>Division</th><th class="dz-num">Games</th>' +
          '<th class="dz-num">UK</th><th class="dz-num">International</th><th class="dz-num">Total</th>' +
          '<th class="dz-num">UK per UK-shown game</th><th class="dz-num">Avg mins</th></tr></thead>' +
        '<tbody>' + body + '</tbody></table></div>';
    NL.clubs.wireCrestImgs($('dzaBody'));
  }

  $('dzaBody').addEventListener('click', function (e) {
    var tr = e.target.closest('tr[data-code]');
    if (tr) openClub(tr.getAttribute('data-code'));
  });

  /* ---- One club, exactly as the club sees it ------------------------- */
  function openClub(code) {
    S.open = code;
    Array.prototype.forEach.call(document.querySelectorAll('.dza-clubs tr[data-code]'), function (tr) {
      tr.classList.toggle('is-open', tr.getAttribute('data-code') === code);
    });
    var club = (S.data.clubs || {})[code];
    var name = S.names[code] || code;
    var host = $('dzaClub');
    host.innerHTML =
      '<div class="dza-club-head">' + NL.clubs.crestImgHtml(name, 'thumb', { eager: true }) +
        '<h2>' + esc(name) + '</h2></div><div id="dzaClubBody"></div>';
    NL.clubs.wireCrestImgs(host);
    DAZNView.render($('dzaClubBody'), {
      code: code, name: name, games: club.matches,
      bench: (S.data.bench || {})[club.div] || null, div: club.div,
      nameOf: function (c) { return S.names[c]; }
    });
    host.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  /* ---- Import -------------------------------------------------------- */
  function codeOf(name) {
    var c = NL.clubs.byName(name);
    return c ? c.code : null;
  }

  function check() {
    S.pending = null;
    $('dzaWrite').disabled = true;
    var out = $('dzaPreview');
    var p = D.parsePaste($('dzaPaste').value);
    if (p.errors.length) { out.innerHTML = problems('Fix these in the sheet and paste again:', p.errors); return; }

    var b = D.buildSeason(p.rows, codeOf);
    if (b.unmatched.length) {
      out.innerHTML = problems('These club names are not in clubs-meta. Correct the spelling in the sheet:', b.unmatched);
      return;
    }
    if (b.errors.length) { out.innerHTML = problems('Fix these in the sheet and paste again:', b.errors); return; }

    /* The season comes from the dates, never from a control. One paste is
       one season; a sheet that spans two is a mistake to fix at source. */
    var seasons = {};
    p.rows.forEach(function (r) { seasons[NL.season.fromDate(NL.parseDate(r.date))] = true; });
    var keys = Object.keys(seasons);
    if (keys.length !== 1) {
      out.innerHTML = problems('The dates span more than one season (' +
        keys.map(function (k) { return NL.season.label(S.meta, k); }).join(', ') + '). Import one season at a time.', []);
      return;
    }
    var key = keys[0];
    var dates = p.rows.map(function (r) { return r.date; }).sort();
    var byDiv = {}, byAvail = { uk: 0, round: 0, moved: 0, intl: 0 };
    p.rows.forEach(function (r) { byDiv[r.div] = (byDiv[r.div] || 0) + 1; byAvail[r.avail]++; });

    S.pending = { key: key, season: b.season, games: p.rows.length };
    out.innerHTML =
      '<div class="banner banner--info"><strong>' + p.rows.length + ' games for ' + esc(NL.season.label(S.meta, key)) + '</strong>, ' +
        esc(NL.formatDateShort(dates[0])) + ' to ' + esc(NL.formatDateShort(dates[dates.length - 1])) + ', ' +
        Object.keys(b.season.clubs).length + ' clubs.' +
        '<ul>' +
          Object.keys(byDiv).map(function (d) { return '<li>' + esc(D.DIV_LABEL[d]) + ': ' + byDiv[d] + '</li>'; }).join('') +
          '<li>Shown in UK: ' + (byAvail.uk + byAvail.round + byAvail.moved) + ' · Saturday 3pm, international only: ' + byAvail.intl + '</li>' +
        '</ul>' +
        (S.index[key] ? '<p>Replaces the ' + (S.index[key].games || '') + ' games already held for this season.</p>' : '') +
      '</div>';
    $('dzaWrite').disabled = false;
  }

  function problems(lead, list) {
    return '<div class="banner banner--error">' + esc(lead) +
      (list.length ? '<ul>' + list.slice(0, 20).map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') +
        (list.length > 20 ? '<li>…and ' + (list.length - 20) + ' more</li>' : '') + '</ul>' : '') +
    '</div>';
  }

  function write() {
    var p = S.pending;
    if (!p) return;
    var label = NL.season.label(S.meta, p.key);
    var ask = S.index[p.key]
      ? NL.confirm('Replace ' + label + ' with these ' + p.games + ' games? Clubs see the new figures straight away.', { title: 'Replace season', variant: 'danger', confirmText: 'Replace' })
      : NL.confirm('Import ' + p.games + ' games for ' + label + '? Clubs can see their figures straight away.', { title: 'Import season', confirmText: 'Import' });
    ask.then(function (ok) {
      if (!ok) return;
      $('dzaWrite').disabled = true;
      var up = {};
      up['seasons/' + p.key] = p.season;
      up['index/' + p.key] = { label: label, games: p.games, importedAt: firebase.database.ServerValue.TIMESTAMP };
      return NL.ensureAuth().then(function () {
        return db.ref(BASE).update(up);
      }).then(function () {
        NL.toast(label + ' imported: ' + p.games + ' games.', 'success');
        S.pending = null;
        $('dzaPaste').value = '';
        $('dzaPreview').innerHTML = '';
        $('dzaImport').hidden = true;
        S.season = p.key;
        return loadIndex();
      });
    }).catch(function (e) {
      console.error('[dazn-admin]', e);
      $('dzaWrite').disabled = false;
      NL.toast('Import failed: ' + ((e && e.message) || 'unknown error'), 'error');
    });
  }

  $('dzaImportBtn').addEventListener('click', function () {
    var box = $('dzaImport');
    box.hidden = !box.hidden;
    if (!box.hidden) $('dzaPaste').focus();
  });
  $('dzaCheck').addEventListener('click', check);
  $('dzaWrite').addEventListener('click', write);
  $('dzaPaste').addEventListener('input', function () { S.pending = null; $('dzaWrite').disabled = true; });
  $('dzaSeason').addEventListener('change', function () { showSeason(this.value); });

  /* ---- Boot ---------------------------------------------------------- */
  window.TOOL = window.TOOL || {};
  window.TOOL.boot = function (session) {
    S.session = session;
    var role = NL.roles.norm(session && session.role);
    S.isAdmin = role === 'admin' || role === 'superadmin';
    $('dzaImportBtn').hidden = !S.isAdmin;
    loading('Loading…');
    NL.clubs.load().then(function (meta) {
      S.meta = meta;
      (meta.clubs || []).forEach(function (c) { S.names[c.code] = c.name; });
      return NL.ensureAuth();
    }).then(loadIndex).catch(function (e) {
      console.error('[dazn-admin]', e);
      loading('Figures could not be loaded. Reload the page to try again.');
    });
  };

  if (window._toolDeferredSession) {
    window.TOOL.boot(window._toolDeferredSession);
    delete window._toolDeferredSession;
  }
})();
</script>
</body>
</html>
