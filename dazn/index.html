<!DOCTYPE html>
<!--
  NL Tools — DAZN Viewership (club page)
  Version: v41.1 (30/10/2026)
  File: /dazn/index.html

  CHANGELOG
    v41.1 (30/10/2026) – UK availability and Venue are filter buttons; By game
      / By month are tabs (_view v42.1).
    v41.0 (19/10/2026) — Cards: Avg viewing time replaces Best game; no division
      comparison. Season picker moves into the club view's slicer row; By game
      opens first; the views footnote is gone (_view v41.0).
    v40.0 (16/10/2026) — Games table: kick-off in its own column (7.45pm);
      no hover text on Shown in UK (_view v40.0).
    v38.0 (16/10/2026) — Dashboard tidy (_view v38.0): month totals no longer
      cut off, AVG on the y-axis, UK share card dropped, games table with
      kick-off times, venue pills and tick / cross. Import stores each game's
      UK kick-off from the results feed (_data v38.0).
    v37.0 (16/10/2026) — By game's y-axis lines up with the columns when the
      chart scrolls (_view v37.0).
    v35.0 (15/10/2026) — By game shows the average as a dashed line
      (_view v35.0).
    v34.0 (15/10/2026) — Moved back to /dazn/: the club page is the tool's
      own address and the staff side sits on top at /dazn/admin/.
      /dazn/reader/ is a redirect here.
    v33.0 (15/10/2026) — New headline cards: Total views, Views per game
      (vs division), UK share, Hours watched, Best game (_view v33.0).
    v32.0 (15/10/2026) — Renamed DAZN Viewership; the Views card reads
      "Total views" (_view v32.0).
    v31.0 (15/10/2026) — By month on a real August–May calendar; By game
      columns fill the width; slicers only where they split the club's
      games (_view v31.0).
    v30.0 (15/10/2026) — Chart keeps a fixed height whatever the slicers
      do (_view v30.0).
    v29.0 (15/10/2026) — Season always shown, labelled. Chart y-axis and
      fixed scale, neutral venues, plain All (_view.js v29.0).
    v28.0 (15/10/2026) — Passes the club's not-played streams to the view,
      which names them under the games (_view.js v28.0).
    v27.0 (15/10/2026) — By month / By game chart and Top games context
      (_view.js v27.0); passes the season label for it.
    v26.0 (15/10/2026) — Clearer slicers and Home / Away written out
      (_view.js v26.0).
    v25.0 (15/10/2026) — The one-screen dashboard (_view.js v25.0). Page
      shell is canon .page and .toolbar; the local shell styles are gone.
    v16.0 (12/10/2026) — Club view (_view.js v16.0): filters for UK / INT,
      home / away and month; the division comparison as % either side of
      the average.
    v12.0 (12/10/2026) — Picks up the reworked club view (_view.js v12.0):
      sortable games, stacked UK / International bars, headline cards that
      no longer overflow.
    v6.0 (12/10/2026) — Moved from /dazn/ to /dazn/reader/, the access-code
      door beside the gated tool, as with the Handbook and Club Directory
      readers. /dazn/ is now the staff tool.
    v3.0 (12/10/2026) — First build. A club enters its access code and sees
      its own DAZN figures for the season: views split UK and international,
      minutes watched, every game DAZN showed with whether it was available
      in the UK, and how it compares with its division's average.

  THE GATE. The one club access code (system/club-code-plan.md), checked
  SERVER-SIDE: NL.codeGate.viaFunction posts it to the clubCodeAuth trigger
  under app-data/club-codes, which mints a token carrying `club: '<CODE>'`.
  The RTDB rules on app-data/media-dazn/seasons/<s>/clubs/$club open only
  where $club equals that claim, so a club cannot read another club's games
  however the page is tampered with. The gate is the screen; the rules are
  the boundary.

  What a club can read: its own club node, and each division's averages
  (bench/), which hold averages and game counts only — never another club's
  games. DAZN has agreed clubs may see their own figures (12/10/2026).

  A League holder of an access code (claim "NL") or a staff token ("*") has
  no club node to read, so it is pointed at /dazn/admin/ (the staff tool) instead.

  No auth-guard: that gates NL accounts, and this page is entered by code.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DAZN Viewership — The National League</title>
  <!-- Favicons. Static, not injected: nl-topbar.js adds these too, but a
       standalone page never loads it, and an icon that arrives with the JS
       leaves the tab blank until it does. /favicon.ico at the root is the
       backstop every browser asks for without being told. -->
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/favicon-16x16.png">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/system/nl-brand.css?v=72">
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <script>
    firebase.initializeApp({
      apiKey:            "AIzaSyC3az3OMnU7TdqlaWp8yrO_EjgZ36l-mXU",
      authDomain:        "nl-tools.firebaseapp.com",
      databaseURL:       "https://nl-tools-default-rtdb.europe-west1.firebasedatabase.app",
      projectId:         "nl-tools",
      storageBucket:     "nl-tools.firebasestorage.app",
      messagingSenderId: "801354670005",
      appId:             "1:801354670005:web:05d8ebad3e7e63610d03fc"
    });
  </script>
  <script src="/system/nl-utils.js?v=51"></script>
  <!-- GA4 for nl.tools — cookieless, no banner, no identity. See system/nl-analytics.js -->
  <script src="/system/nl-analytics.js?v=1"></script>
  <link rel="stylesheet" href="/dazn/_view.css?v=13">
  <script src="/dazn/_data.js?v=6"></script>
  <script src="/dazn/_view.js?v=20"></script>
</head>
<body>
  <!-- White bar: no NL account is behind this page (nl-brand v2.51). -->
  <header class="nl-idbar">
    <img class="nl-idbar__crest" id="dzCrest" src="/assets/crests/National%20League%20rose.png"
         alt="" width="42" height="42">
    <div class="nl-idbar__id">
      <div class="nl-idbar__title">DAZN Viewership</div>
      <div class="nl-idbar__sub" id="dzClub">The National League</div>
    </div>
    <div class="nl-idbar__actions">
      <button class="nl-idbar__btn" id="dzOut" type="button" hidden>Sign out</button>
    </div>
  </header>

  <div class="gate" id="dzGate"></div>

  <main class="page" id="dzShell" hidden>
    <div id="dzBody"></div>
  </main>

<script>
(function () {
  'use strict';

  var BASE = 'app-data/media-dazn';
  var db = firebase.database();
  var $ = function (id) { return document.getElementById(id); };
  var S = { code: null, seasons: [], idx: {} };

  function message(title, text) {
    $('dzBody').innerHTML = '<div class="empty-state"><div class="empty-state__title">' +
      NL.escHtml(title) + '</div>' + (text ? '<div class="empty-state__text">' + text + '</div>' : '') + '</div>';
  }

  function nameOf(code) {
    var c = NL.clubs.byCode(code);
    return c ? c.name : '';
  }

  function labelOf(k) { return (S.idx && S.idx[k] && S.idx[k].label) || NL.season.label(null, k); }

  function readClub(key) {
    return db.ref(BASE + '/seasons/' + key + '/clubs/' + S.code).once('value').then(function (snap) {
      var club = snap.val();
      return club && club.matches ? club : null;
    });
  }

  /* Open on the newest season this club has games in, not simply the newest
     season: a club that left the League (or has just joined) would
     otherwise land on an empty season with no picker to leave it by. */
  function firstSeasonWithGames(i) {
    if (i >= S.seasons.length) return Promise.resolve(S.seasons[0]);
    return readClub(S.seasons[i]).then(function (club) { return club ? S.seasons[i] : firstSeasonWithGames(i + 1); });
  }

  function showSeason(key) {
    message('Loading…');
    return readClub(key).then(function (club) {
      if (!club) {
        var others = S.seasons.filter(function (k) { return k !== key; });
        message('No DAZN games in ' + labelOf(key), others.map(function (k) {
          return '<button type="button" class="btn btn--primary btn--sm" data-season="' + NL.escHtml(k) + '">Show ' + NL.escHtml(labelOf(k)) + '</button>';
        }).join(' '));
        return;
      }
      DAZNView.render($('dzBody'), {
        code: S.code, name: nameOf(S.code), games: club.matches, notPlayed: club.notPlayed, div: club.div,
        seasonLabel: labelOf(key),
        nameOf: nameOf,
        /* The season picker rides in the view's slicer row. */
        seasons: S.seasons.map(function (k) { return [k, labelOf(k)]; }),
        season: key,
        onSeason: showSeason
      });
    }).catch(function (e) {
      console.error('[dazn]', e);
      message('Figures could not be loaded', 'Reload the page to try again.');
    });
  }

  function start(session) {
    $('dzGate').hidden = true;
    $('dzShell').hidden = false;
    $('dzOut').hidden = false;

    var code = session && session.role;
    if (!code || code === '*' || code === 'NL') {
      message('This page shows a club’s own figures',
        'League staff: every club is on <a href="/dazn/admin/">the staff page</a>.');
      return;
    }
    S.code = code;

    NL.clubs.load().catch(function () {}).then(function () {
      var name = nameOf(code) || (session && session.name) || code;
      $('dzClub').textContent = name;
      var crest = $('dzCrest');
      crest.src = NL.clubs.crestUrl(name, 'thumb');
      NL.clubs.wireCrestImg(crest, name);
      return db.ref(BASE + '/index').once('value');
    }).then(function (snap) {
      var idx = S.idx = (snap && snap.val()) || {};
      S.seasons = Object.keys(idx).sort().reverse();
      if (!S.seasons.length) { message('No figures yet'); return; }
      return firstSeasonWithGames(0).then(showSeason);
    }).catch(function (e) {
      console.error('[dazn]', e);
      message('Figures could not be loaded', 'Reload the page to try again.');
    });
  }

  $('dzBody').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-season]');
    if (b) showSeason(b.getAttribute('data-season'));
  });

  $('dzOut').addEventListener('click', function () {
    NL.codeGate.signOut().then(function () { location.reload(); });
  });

  NL.codeGate.ensure({
    mount: $('dzGate'),
    title: 'DAZN Viewership',
    sub: 'Enter your access code.',
    numeric: false,
    verify: NL.codeGate.viaFunction('app-data/club-codes', { tool: 'dazn' }),
    claim: 'club'
  }).then(start);
})();
</script>
</body>
</html>
