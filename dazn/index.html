<!DOCTYPE html>
<!--
  NL Tools — DAZN Viewership (staff)
  Version: v33.0 (15/10/2026)
  File: /dazn/index.html

  CHANGELOG
    v33.0 (15/10/2026) — New headline cards on the League and Club tabs:
      Total views, Views per game (vs division), UK share, Hours watched,
      Best game (_view v33.0, _data v33.0).
    v32.0 (15/10/2026) — Renamed DAZN Viewership; the Views card reads
      "Total views" (_view v32.0).
    v31.0 (15/10/2026) — By month on a real August–May calendar; By game
      columns fill the width; slicers only where they split the club's
      games (_view v31.0).
      Club tab: the empty-state "Pick a club" under the picker is gone.
    v30.0 (15/10/2026) — Chart keeps a fixed height whatever the slicers
      do (_view v30.0).
    v29.0 (15/10/2026) — Admin gains Edit games: pick a club, then set a
      neutral venue, correct UK availability, or leave a game out; the
      not-played list gains Count it. Each save writes an override under
      app-data/media-dazn/overrides/<season>/<id> (admin-only by the node's
      existing rules) and rewrites the season with it applied; the import
      re-applies every override, so a re-import never undoes an edit.
      Not-played streams are now stored in full so they can be counted
      back. The Season dropdown is always shown, even with one season.
    v28.0 (15/10/2026) — Three tabs (canon .tabs, the Club Directory pattern):
      League (division slicer, KPI row for the selection, every club), Club
      (canon NL.clubPicker; exactly what the club sees, via the same
      DAZNView.render), Admin (admin only: seasons held, streams left out as
      not played, the import). Tab and club ride in the hash (#club=ROC).
      The import now checks every stream against the NLS results for the
      season and leaves out games not played on that date (postponed, or
      abandoned and replayed); an abandoned game with no replay counts and
      is flagged. A failed or short NLS fetch stops the import. The
      "Club page" link and the click-to-open-below drill-down are gone.
    v27.0 (15/10/2026) — Club view gains the By month / By game chart switch
      and a context line on Top games (_view.js v27.0); passes the season
      label for it.
    v26.0 (15/10/2026) — The clubs list shows every club in clubs-meta for
      the season, including those DAZN never showed (greyed, not clickable),
      with a Division slicer. The Total row is labelled "Each game once":
      each club's figure is the full audience of its games, so the club rows
      add up to about twice the league.
    v25.0 (15/10/2026) — The club view is a one-screen dashboard (see
      _view.js v25.0). The clubs list is a fixed-height panel with a sticky
      header and a League total row (each game counted once, not once per
      side). Page chrome moves onto canon: .toolbar for the season bar,
      .form-panel for the import, .nl-crest for crests. The local number
      formatters, which had drifted from the view's own, are gone.
    v16.0 (12/10/2026) — Club view (_view.js v16.0): filters for UK / INT,
      home / away and month; the division comparison as % either side of
      the average.
    v12.0 (12/10/2026) — Clubs table sorts by any column (DAZNView.sortableTable),
      total views first. The club view gains sortable games, stacked UK /
      International bars and a three-across headline (see _view.js). Import
      panel: the heading repeating its own button is gone.
    v6.0 (12/10/2026) — Moved from /dazn/admin/ to /dazn/, and the club page
      from /dazn/ to /dazn/reader/. The tool's own URL is the gated tool and
      the access-code door is /reader/, as with the Handbook and the Club
      Directory: when clubs reach this through the portal instead, the tool
      stays where it is and /reader/ retires.
    v3.0 (12/10/2026) — First build. Every club's DAZN season in one table;
      open a club to see exactly what that club sees on /dazn/reader/. Admins
      import a season by pasting the "Matches" sheet.

  The club-facing page is /dazn/reader/ (club access code). This is the League's
  view of the same data, behind auth-guard.

  IMPORT. Paste the Matches sheet, header row included. Nothing is written
  until every row parses and every club name matches clubs-meta; the season
  is derived from the dates rather than chosen from a dropdown, so a season
  cannot be filed under the wrong year by a mis-click. A re-import REPLACES
  that season — the sheet is the record, so the latest paste wins.
  The source file never goes in this repo: it is DAZN-confidential, and the
  repo is public.

  Storage (RTDB) — shape documented in /dazn/_data.js:
    app-data/media-dazn/seasons/<season>/...   matches, clubs, bench
    app-data/media-dazn/index/<season>         season list for both pages
    tools/media-dazn                           tool registration
  Access (auth-guard registry — see system/auth-guard.js):
    superadmin / admin → view + import
    staff              → view
    clubs              → off here; they use /dazn/reader/ with their access code
-->

<div id="pageWrap">
  <div class="page">

    <!-- Three jobs, three tabs (a closed set, so canon .tabs): the league

<!-- Main app -->
<script>
(function () {
  'use strict';

  var BASE = 'app-data/media-dazn';
  var D = window.DAZNData;
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return NL.escHtml(s); };
  /* Club code → name, from clubs-meta (loaded at boot). */
  function nameOf(code) {
    var c = NL.clubs.byCode(code);
    return c ? c.name : '';
  }

  var S = { session: null, isAdmin: false, meta: null, byName: {},
            index: {}, season: null, data: null, open: null, pending: null };

  function loading(text) {
    $('dzaBody').innerHTML = '<div class="empty-state"><div class="empty-state__title">' + esc(text) + '</div></div>';
    $('dzaClubBody').innerHTML = '';
  }

  /* ---- Seasons ------------------------------------------------------ */
  function loadIndex() {
    return db.ref(BASE + '/index').once('value').then(function (snap) {
      S.index = snap.val() || {};
      var keys = Object.keys(S.index).sort().reverse();
      var sel = $('dzaSeason');
      sel.innerHTML = keys.map(function (k) {
        return '<option value="' + esc(k) + '">' + esc(S.index[k].label || NL.season.label(S.meta, k)) + '</option>';
      }).join('');
      /* Shown even with one season: the figures always say which season. */
      if (!keys.length) {
        loading(S.isAdmin ? 'No seasons imported yet' : 'No figures yet');
        drawSeasons();
        if (S.isAdmin) showPane('admin');
        return;
      }
      var want = keys.indexOf(S.season) !== -1 ? S.season : keys[0];
      sel.value = want;
      return showSeason(want);
    });
  }

  function showSeason(key) {
    S.season = key;
    loading('Loading…');
    return Promise.all([
      db.ref(BASE + '/seasons/' + key).once('value'),
      S.isAdmin ? db.ref(BASE + '/overrides/' + key).once('value') : null
    ]).then(function (got) {
      var snap = got[0];
      S.overrides = (got[1] && got[1].val()) || {};
      S.data = snap.val() || {};
      if (S.picker) S.picker.setSeason(key);
      if (S.editPicker) S.editPicker.setSeason(key);
      drawClubs();
      drawClub();
      drawSeasons();
      drawEdit();
    });
  }

  /* ---- Every club ---------------------------------------------------
     Every club in clubs-meta for the season, not only those DAZN showed:
     a club with no games is a finding, not a gap to hide. Division is the
     club's division that season, from clubs-meta. */
  function seasonClubs() {
    var clubs = (S.data && S.data.clubs) || {};
    var seen = {};
    var rows = NL.season.clubsFor(S.meta, S.season).map(function (c) {
      seen[c.code] = true;
      var d = clubs[c.code];
      return { code: c.code, name: c.name, div: c.division, has: !!d,
               s: d ? D.summarise(d.matches, c.code) : null };
    });
    /* A club with games but missing from that season's clubs-meta still
       shows, under the division the import recorded for it. */
    Object.keys(clubs).forEach(function (code) {
      if (seen[code]) return;
      rows.push({ code: code, name: nameOf(code) || code, div: clubs[code].div, has: true,
                  s: D.summarise(clubs[code].matches, code) });
    });
    return rows;
  }

  function drawClubs() {
    var F = DAZNView.fmt;
    var div = S.div || 'all';
    var rows = seasonClubs().filter(function (r) { return div === 'all' || r.div === div; });
    var none = rows.filter(function (r) { return !r.has; }).length;
    /* The Total row counts each game ONCE. Each club's figure is the whole
       audience of its games, so the club rows add up to about twice the
       league: every game is in two clubs' rows. */
    var games = D.values(S.data.matches).filter(function (m) { return div === 'all' || m.div === div; });
    var lg = D.summarise(games);
    var num = function (k) { return function (r) { return r.s ? r.s[k] : null; }; };
    var label = div === 'all' ? 'League' : (D.DIV_LABEL[div] || div);

    $('dzaBody').innerHTML =
      '<div class="dz-dash">' +
      '<div class="filter-bar dz-slicers">' +
        DAZNView.slicer('Division', DAZNView.chips('div',
          [['all', 'All'], ['National', 'National'], ['North', 'North'], ['South', 'South']], div)) +
      '</div>' +
      DAZNView.kpis(lg, null, false, { nameOf: nameOf }) +
      '<section class="form-panel dz-panel dz-panel--flush">' +
        '<div class="form-panel__head dz-panel__head"><span>Clubs</span>' +
          '<span>' + rows.length + ' clubs' + (none ? ' · ' + none + ' with no DAZN games' : '') + '</span></div>' +
        '<div class="form-panel__body dz-panel__body" id="dzaClubs"></div></section>' +
      '</div>';

    DAZNView.grid($('dzaClubs'), {
      height: 460,
      sort: { key: 'views', dir: -1 },
      cols: [
        { key: 'name', label: 'Club', get: function (r) { return r.name; } },
        { key: 'div', label: 'Division', cls: 'dz-sm-hide', get: function (r) { return D.DIV_LABEL[r.div] || r.div || ''; } },
        { key: 'games', label: 'Games', num: true, get: function (r) { return r.s ? r.s.games : 0; } },
        { key: 'uk', label: 'UK', num: true, cls: 'dz-sm-hide', get: num('ukViews') },
        { key: 'intl', label: 'INT', num: true, cls: 'dz-sm-hide', get: num('intlViews') },
        { key: 'views', label: 'Views', num: true, get: num('views') },
        { key: 'ukper', label: 'UK per UK game', num: true, cls: 'dz-sm-hide', get: num('avgUkPerUkShown') },
        { key: 'mins', label: 'Avg mins', num: true, cls: 'dz-sm-hide', get: num('avgMins') }
      ],
      rows: rows,
      row: function (r) {
        var v = function (k, f) { return r.s ? F[f](r.s[k]) : '—'; };
        return '<tr' + (r.has ? ' data-code="' + esc(r.code) + '" title="Open in the Club tab"' : ' class="dz-muted"') + '>' +
          '<td><span class="dz-opp">' + NL.clubs.crestImgHtml(r.name, 'thumb', { className: 'nl-crest' }) +
            '<span>' + esc(r.name) + '</span></span></td>' +
          '<td class="dz-sm-hide">' + esc(D.DIV_LABEL[r.div] || r.div || '') + '</td>' +
          '<td class="ta-right">' + (r.s ? F.n0(r.s.games) : '0') + '</td>' +
          '<td class="ta-right dz-sm-hide">' + v('ukViews', 'n0') + '</td>' +
          '<td class="ta-right dz-sm-hide">' + v('intlViews', 'n0') + '</td>' +
          '<td class="ta-right dz-strong">' + v('views', 'n0') + '</td>' +
          '<td class="ta-right dz-sm-hide">' + v('avgUkPerUkShown', 'n0') + '</td>' +
          '<td class="ta-right dz-sm-hide">' + v('avgMins', 'n1') + '</td>' +
        '</tr>';
      },
      total: '<tr><td>' + esc(label) + '</td><td class="dz-sm-hide">Each game once</td>' +
        '<td class="ta-right">' + F.n0(lg.games) + '</td>' +
        '<td class="ta-right dz-sm-hide">' + F.n0(lg.ukViews) + '</td>' +
        '<td class="ta-right dz-sm-hide">' + F.n0(lg.intlViews) + '</td>' +
        '<td class="ta-right">' + F.n0(lg.views) + '</td>' +
        '<td class="ta-right dz-sm-hide">' + F.n0(lg.avgUkPerUkShown) + '</td>' +
        '<td class="ta-right dz-sm-hide">' + F.n1(lg.avgMins) + '</td></tr>'
    });
  }

  $('dzaBody').addEventListener('click', function (e) {
    var chip = e.target.closest('.dz-slicers .chip[data-v]');
    if (chip) { S.div = chip.getAttribute('data-v'); drawClubs(); }
  });

  $('dzaBody').addEventListener('click', function (e) {
    var tr = e.target.closest('tr[data-code]');
    if (tr) openClub(tr.getAttribute('data-code'));
  });

  /* ---- Club tab: one club, exactly as that club sees it --------------
     The same DAZNView.render the club page calls, so this cannot drift
     from what a club gets. The picker is the canon NL.clubPicker, scoped to
     the season shown. */
  function drawClub() {
    var host = $('dzaClubBody');
    if (!S.open) {
      host.innerHTML = '';   /* the picker above already says "Pick a club" */
      return;
    }
    var club = (S.data.clubs || {})[S.open];
    if (!club) {
      host.innerHTML = '<div class="empty-state"><div class="empty-state__title">No DAZN games for ' +
        esc(nameOf(S.open) || S.open) + ' this season</div></div>';
      return;
    }
    DAZNView.render(host, {
      code: S.open, name: nameOf(S.open), games: club.matches, notPlayed: club.notPlayed,
      bench: (S.data.bench || {})[club.div] || null, div: club.div,
      seasonLabel: (S.index[S.season] && S.index[S.season].label) || NL.season.label(S.meta, S.season),
      nameOf: nameOf
    });
  }

  function openClub(code) {
    S.open = code;
    var c = NL.clubs.byCode(code);
    if (S.picker && c) S.picker.setValue(c.name);
    drawClub();
    showPane('club');
  }

  /* ---- Tabs ------------------------------------------------------------ */
  function showPane(name) {
    if (name === 'admin' && !S.isAdmin) name = 'league';
    Array.prototype.forEach.call(document.querySelectorAll('#dzaTabs .tab'), function (t) {
      var on = t.getAttribute('data-pane') === name;
      t.classList.toggle('active', on);
      t.setAttribute('aria-selected', String(on));
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-pane-body]'), function (p) {
      p.hidden = p.getAttribute('data-pane-body') !== name;
    });
    var h = '#' + name + (name === 'club' && S.open ? '=' + S.open : '');
    if (location.hash !== h) history.replaceState(null, '', h);
  }

  $('dzaTabs').addEventListener('click', function (e) {
    var t = e.target.closest('.tab[data-pane]');
    if (t) showPane(t.getAttribute('data-pane'));
  });

  /* ---- Admin: the seasons held --------------------------------------- */
  function drawSeasons() {
    var F = DAZNView.fmt;
    var keys = Object.keys(S.index || {}).sort().reverse();
    if (!keys.length) {
      $('dzaSeasons').innerHTML = '<div class="empty-state"><div class="empty-state__title">No seasons imported yet</div></div>';
      return;
    }
    $('dzaSeasons').innerHTML =
      '<section class="form-panel dz-panel dz-panel--flush">' +
        '<div class="form-panel__head dz-panel__head"><span>Seasons held</span></div>' +
        '<div class="form-panel__body dz-panel__body"><div class="table-wrap"><table class="table table--compact">' +
          '<thead><tr><th>Season</th><th class="ta-right">Games</th><th class="ta-right">Not played</th><th>Imported</th></tr></thead><tbody>' +
          keys.map(function (k) {
            var x = S.index[k];
            return '<tr><td>' + esc(x.label || NL.season.label(S.meta, k)) + '</td>' +
              '<td class="ta-right">' + F.n0(x.games) + '</td>' +
              '<td class="ta-right">' + (x.notPlayed == null ? '\u2014' : F.n0(x.notPlayed)) + '</td>' +
              '<td>' + (x.importedAt ? esc(NL.formatDateTime(x.importedAt)) : '\u2014') + '</td></tr>';
          }).join('') +
        '</tbody></table></div></div></section>' + notPlayedPanel();
  }

  /* The streams the import left out for the season shown, so a dropped
     game is visible rather than silent. */
  function notPlayedPanel() {
    var F = DAZNView.fmt;
    var np = (S.data && S.data.notPlayed) || {};
    var ids = Object.keys(np).sort();
    if (!ids.length) return '';
    return '<section class="form-panel dz-panel dz-panel--flush dza-section">' +
      '<div class="form-panel__head dz-panel__head"><span>Not played: left out of ' +
        esc((S.index[S.season] && S.index[S.season].label) || '') + '</span></div>' +
      '<div class="form-panel__body dz-panel__body"><div class="table-wrap"><table class="table table--compact">' +
        '<thead><tr><th>Date</th><th>Game</th><th class="ta-right">Views</th><th class="ta-right">Avg mins</th><th></th></tr></thead><tbody>' +
        ids.map(function (id) {
          var m = np[id];
          return '<tr><td>' + esc(NL.formatDateShort(m.date)) + '</td>' +
            '<td>' + esc((nameOf(m.home) || m.home) + ' v ' + (nameOf(m.away) || m.away)) + '</td>' +
            '<td class="ta-right">' + F.n0(m.views) + '</td>' +
            '<td class="ta-right">' + F.n1(m.views ? m.mins / m.views : null) + '</td>' +
            '<td class="ta-right">' + (m.ukViews != null ? '<button type="button" class="btn btn--ghost btn--sm" data-restore="' + esc(id) + '">Count it</button>' : '') + '</td></tr>';
        }).join('') +
      '</tbody></table></div></div></section>';
  }

  /* ---- Admin: edit games --------------------------------------------
     Corrections the sheet and the NLS check cannot know: a neutral venue
     (the play-off final at Wembley), UK availability, and whether a game
     counts. Each save writes an override under overrides/<season>/<id>,
     which a re-import re-applies, and rewrites the season with the edit
     applied (D.applyOverride keeps the game's three copies and the
     division averages in step). */
  function drawEdit() {
    var host = $('dzaEdit');
    if (!host) return;
    if (!S.editClub) { host.innerHTML = ''; return; }
    var code = S.editClub, F = DAZNView.fmt;
    var mine = function (m) { return m.home === code || m.away === code; };
    var rows = D.values(S.data.matches).filter(mine).map(function (m) { return { m: m, out: false }; })
      .concat(D.values(S.data.notPlayed).filter(mine).map(function (m) { return { m: m, out: true }; }))
      .sort(function (a, b) { return a.m.date < b.m.date ? -1 : a.m.date > b.m.date ? 1 : 0; });
    var idOf = function (m) { return D.matchId(m.date, m.home, m.away); };
    if (!rows.length) { host.innerHTML = '<div class="empty-state"><div class="empty-state__title">No DAZN games for ' + esc(nameOf(code) || code) + ' this season</div></div>'; return; }
    host.innerHTML = '<div class="table-wrap"><table class="table table--compact"><thead><tr>' +
      '<th>Date</th><th>Game</th><th class="ta-right">Views</th><th>Neutral venue</th><th>Shown in UK</th><th>Counted</th><th></th></tr></thead><tbody>' +
      rows.map(function (r) {
        var m = r.m, id = idOf(m), v = m.ukViews + m.intlViews, dis = r.out ? ' disabled' : '';
        return '<tr data-id="' + esc(id) + '"' + (r.out ? ' class="is-out"' : '') + '>' +
          '<td>' + esc(NL.formatDateShort(m.date)) + '</td>' +
          '<td>' + esc((nameOf(m.home) || m.home) + ' v ' + (nameOf(m.away) || m.away)) + '</td>' +
          '<td class="ta-right">' + F.n0(v) + '</td>' +
          '<td><input type="checkbox" data-k="neutral" aria-label="Neutral venue"' + (m.neutral ? ' checked' : '') + dis + '></td>' +
          '<td><select class="nl-select" data-k="avail" aria-label="Shown in UK"' + dis + '>' +
            '<option value="uk"' + (m.avail !== 'intl' ? ' selected' : '') + '>Yes</option>' +
            '<option value="intl"' + (m.avail === 'intl' ? ' selected' : '') + '>No</option></select></td>' +
          '<td><input type="checkbox" data-k="counted" aria-label="Counted"' + (r.out ? '' : ' checked') + '></td>' +
          '<td class="ta-right"><button type="button" class="btn btn--primary btn--sm" data-save disabled>Save</button></td>' +
        '</tr>';
      }).join('') + '</tbody></table></div>';
  }

  $('dzaEdit').addEventListener('change', function (e) {
    var tr = e.target.closest('tr[data-id]');
    if (tr) tr.querySelector('[data-save]').disabled = false;
  });

  $('dzaEdit').addEventListener('click', function (e) {
    var b = e.target.closest('[data-save]');
    if (!b) return;
    var tr = b.closest('tr[data-id]'), id = tr.getAttribute('data-id');
    var cur = (S.data.matches || {})[id], wasOut = !cur;
    var counted = tr.querySelector('[data-k="counted"]').checked;
    var delta = {};
    if (wasOut && counted) { delta.restored = true; delta.excluded = false; }
    if (!wasOut && !counted) delta.excluded = true;
    if (!wasOut && counted) {
      var neutral = tr.querySelector('[data-k="neutral"]').checked;
      var avail = tr.querySelector('[data-k="avail"]').value;
      if (!!cur.neutral !== neutral) delta.neutral = neutral;
      if ((cur.avail === 'intl' ? 'intl' : 'uk') !== avail) delta.avail = avail;
    }
    if (!Object.keys(delta).length) { b.disabled = true; return; }
    saveEdit(id, delta, b);
  });

  $('dzaSeasons').addEventListener('click', function (e) {
    var b = e.target.closest('[data-restore]');
    if (b) saveEdit(b.getAttribute('data-restore'), { restored: true, excluded: false }, b);
  });

  function saveEdit(id, delta, btn) {
    var key = S.season;
    var next = JSON.parse(JSON.stringify(S.data));
    D.applyOverride(next, id, delta);
    var merged = {};
    var prev = S.overrides[id] || {};
    Object.keys(prev).forEach(function (k) { merged[k] = prev[k]; });
    Object.keys(delta).forEach(function (k) { merged[k] = delta[k]; });
    var up = {};
    up['seasons/' + key] = next;
    up['overrides/' + key + '/' + id] = merged;
    up['index/' + key + '/games'] = Object.keys(next.matches || {}).length;
    up['index/' + key + '/notPlayed'] = Object.keys(next.notPlayed || {}).length;
    if (btn) btn.disabled = true;
    NL.ensureAuth().then(function () { return db.ref(BASE).update(up); }).then(function () {
      S.data = next;
      S.overrides[id] = merged;
      S.index[key].games = up['index/' + key + '/games'];
      S.index[key].notPlayed = up['index/' + key + '/notPlayed'];
      NL.toast('Saved. Clubs see the change straight away.', 'success');
      drawClubs(); drawClub(); drawSeasons(); drawEdit();
    }).catch(function (e) {
      console.error('[dazn-admin]', e);
      if (btn) btn.disabled = false;
      NL.toast('Not saved: ' + ((e && e.message) || 'unknown error'), 'error');
    });
  }

  /* ---- NLS results, to find streams of games that were never played ----
     Every match of the season in the three divisions (play-offs included,
     same competition IDs), straight from NLS: it answers CORS with *, and
     neither RTDB feed cache holds a past season. A division that fails, or
     comes back short of its own totalCount, stops the import: a partial
     list would mark a whole division "not played".
     CANON CANDIDATE (15/10/2026): brand-exposure/index.html loadResults
     fetches the same endpoint per season. Note that one swallows a failed
     competition, which is fine for its picker and fatal here. Promote a
     season-results helper on the next use, with the strict behaviour. */
  var NLS = 'https://multi-club-matches.football.web.gc.nationalleagueservices.co.uk/v2/matches/';
  var NLS_COMPS = { 89: 'National League', 373: 'National League North', 372: 'National League South' };

  function nlsSeason(seasonKey) {
    return Promise.all(Object.keys(NLS_COMPS).map(function (comp) {
      var all = [];
      function page(n) {
        var url = NLS + '?seasonID=' + encodeURIComponent(seasonKey) + '&competitionID=' + comp +
          '&sort=kickOffDateUTC&page.number=' + n + '&page.size=100';
        return fetch(url).then(function (r) {
          if (!r.ok) throw new Error(NLS_COMPS[comp] + ' results: HTTP ' + r.status);
          return r.json();
        }).then(function (j) {
          all = all.concat(j.data || []);
          var total = j.meta && j.meta.totalCount;
          if ((j.data || []).length && j.links && j.links.next && all.length < total) return page(n + 1);
          if (total != null && all.length < total) throw new Error(NLS_COMPS[comp] + ' results came back incomplete (' + all.length + ' of ' + total + ').');
          return all;
        });
      }
      return page(1);
    })).then(function (lists) { return [].concat.apply([], lists); });
  }

  function optaOf(name) {
    var c = NL.clubs.byName(name);
    return c ? c.optaID : null;
  }

  /* ---- Import -------------------------------------------------------- */
  function codeOf(name) {
    var c = NL.clubs.byName(name);
    return c ? c.code : null;
  }

  function check() {
    S.pending = null;
    $('dzaWrite').disabled = true;
    var out = $('dzaPreview');
    var p = D.parsePaste($('dzaPaste').value);
    if (p.errors.length) { out.innerHTML = problems('Fix these in the sheet and paste again:', p.errors); return; }

    var first = D.buildSeason(p.rows, codeOf);
    if (first.unmatched.length) {
      out.innerHTML = problems('These club names are not in clubs-meta. Correct the spelling in the sheet:', first.unmatched);
      return;
    }
    if (first.errors.length) { out.innerHTML = problems('Fix these in the sheet and paste again:', first.errors); return; }

    /* The season comes from the dates, never from a control. One paste is
       one season; a sheet that spans two is a mistake to fix at source. */
    var seasons = {};
    p.rows.forEach(function (r) { seasons[NL.season.fromDate(NL.parseDate(r.date))] = true; });
    var keys = Object.keys(seasons);
    if (keys.length !== 1) {
      out.innerHTML = problems('The dates span more than one season (' +
        keys.map(function (k) { return NL.season.label(S.meta, k); }).join(', ') + '). Import one season at a time.', []);
      return;
    }
    var key = keys[0];

    $('dzaCheck').disabled = true;
    out.innerHTML = '<div class="banner banner--info">Checking every game against the NLS results…</div>';
    Promise.all([nlsSeason(key), db.ref(BASE + '/overrides/' + key).once('value')]).then(function (got) {
      var nls = got[0], overrides = got[1].val() || {};
      var chk = D.checkPlayed(p.rows, optaOf, D.nlsIndex(nls));
      var b = D.buildSeason(chk.played, codeOf);
      if (!b.season) { out.innerHTML = problems('Fix these in the sheet and paste again:', b.errors); return; }
      var F = DAZNView.fmt;
      /* Not-played streams are kept in full (staff-only, and in each club's
         own node so the club page can name them), so Admin can count one
         back in if the check ever gets it wrong. */
      chk.notPlayed.forEach(function (r) {
        var rec = { date: r.date, home: codeOf(r.home), away: codeOf(r.away), div: r.div,
                    ukViews: r.ukViews, intlViews: r.intlViews, ukMins: r.ukMins, intlMins: r.intlMins, avail: r.avail };
        D.setNotPlayed(b.season, D.matchId(rec.date, rec.home, rec.away), rec);
      });
      /* Edits made in Admin survive a re-import: re-apply each one. */
      var edits = Object.keys(overrides);
      edits.forEach(function (id) { D.applyOverride(b.season, id, overrides[id]); });

      var rows = D.values(b.season.matches);
      var npCount = Object.keys(b.season.notPlayed || {}).length;
      var dates = rows.map(function (r) { return r.date; }).sort();
      var byDiv = {}, intl = 0;
      rows.forEach(function (r) { byDiv[r.div] = (byDiv[r.div] || 0) + 1; if (r.avail === 'intl') intl++; });

      S.pending = { key: key, season: b.season, games: rows.length, notPlayed: npCount };
      out.innerHTML =
        '<div class="banner banner--info"><strong>' + rows.length + ' games for ' + esc(NL.season.label(S.meta, key)) + '</strong>, ' +
          esc(NL.formatDateShort(dates[0])) + ' to ' + esc(NL.formatDateShort(dates[dates.length - 1])) + ', ' +
          Object.keys(b.season.clubs).length + ' clubs.' +
          '<ul>' +
            Object.keys(byDiv).map(function (d) { return '<li>' + esc(D.DIV_LABEL[d]) + ': ' + byDiv[d] + '</li>'; }).join('') +
            '<li>Shown in UK: ' + (rows.length - intl) + ' · not shown in UK: ' + intl + '</li>' +
          '</ul>' +
          (S.index[key] ? '<p>Replaces the ' + (S.index[key].games || '') + ' games already held for this season.</p>' : '') +
          (edits.length ? '<p>' + edits.length + ' saved ' + (edits.length === 1 ? 'edit is' : 'edits are') + ' re-applied.</p>' : '') +
        '</div>' +
        (chk.notPlayed.length
          ? '<div class="banner banner--amber">' + chk.notPlayed.length + ' streamed ' + (chk.notPlayed.length === 1 ? 'game was' : 'games were') +
            ' not played on that date (postponed or abandoned and replayed) and will be left out:<ul>' +
            chk.notPlayed.map(function (r) {
              var v = r.ukViews + r.intlViews;
              return '<li>' + esc(NL.formatDateShort(r.date)) + ' · ' + esc(r.home) + ' v ' + esc(r.away) + ' · ' +
                F.n0(v) + ' views, ' + F.n1(v ? (r.ukMins + r.intlMins) / v : null) + ' avg mins</li>';
            }).join('') + '</ul></div>'
          : '') +
        (chk.unchecked.length ? problems(chk.unchecked.length + ' games could not be checked (a club has no Opta ID in clubs-meta) and are kept.', []) : '');
      $('dzaWrite').disabled = false;
    }).catch(function (e) {
      console.error('[dazn-admin]', e);
      out.innerHTML = problems('The NLS results could not be checked, so nothing has been imported. Try again in a minute. ' + ((e && e.message) || ''), []);
    }).then(function () { $('dzaCheck').disabled = false; });
  }

  function problems(lead, list) {
    return '<div class="banner banner--error">' + esc(lead) +
      (list.length ? '<ul>' + list.slice(0, 20).map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') +
        (list.length > 20 ? '<li>…and ' + (list.length - 20) + ' more</li>' : '') + '</ul>' : '') +
    '</div>';
  }

  function write() {
    var p = S.pending;
    if (!p) return;
    var label = NL.season.label(S.meta, p.key);
    var ask = S.index[p.key]
      ? NL.confirm('Replace ' + label + ' with these ' + p.games + ' games? Clubs see the new figures straight away.', { title: 'Replace season', variant: 'danger', confirmText: 'Replace' })
      : NL.confirm('Import ' + p.games + ' games for ' + label + '? Clubs can see their figures straight away.', { title: 'Import season', confirmText: 'Import' });
    ask.then(function (ok) {
      if (!ok) return;
      $('dzaWrite').disabled = true;
      var up = {};
      up['seasons/' + p.key] = p.season;
      up['index/' + p.key] = { label: label, games: p.games, notPlayed: p.notPlayed, importedAt: firebase.database.ServerValue.TIMESTAMP };
      return NL.ensureAuth().then(function () {
        return db.ref(BASE).update(up);
      }).then(function () {
        NL.toast(label + ' imported: ' + p.games + ' games.', 'success');
        S.pending = null;
        $('dzaPaste').value = '';
        $('dzaPreview').innerHTML = '';
        S.season = p.key;
        return loadIndex();
      });
    }).catch(function (e) {
      console.error('[dazn-admin]', e);
      $('dzaWrite').disabled = false;
      NL.toast('Import failed: ' + ((e && e.message) || 'unknown error'), 'error');
    });
  }

  $('dzaCheck').addEventListener('click', check);
  $('dzaWrite').addEventListener('click', write);
  $('dzaPaste').addEventListener('input', function () { S.pending = null; $('dzaWrite').disabled = true; });
  $('dzaSeason').addEventListener('change', function () { showSeason(this.value); });

  /* ---- Boot ---------------------------------------------------------- */
  window.TOOL = window.TOOL || {};
  window.TOOL.boot = function (session) {
    S.session = session;
    var role = NL.roles.norm(session && session.role);
    S.isAdmin = role === 'admin' || role === 'superadmin';
    $('dzaTabAdmin').hidden = !S.isAdmin;
    /* #league, #club=ROC, #admin — where a reload or a shared link lands. */
    var h = (location.hash || '').replace(/^#/, '').split('=');
    if (h[0] === 'club' && h[1]) S.open = h[1].toUpperCase();
    showPane(h[0] === 'club' || h[0] === 'admin' ? h[0] : 'league');
    loading('Loading…');
    NL.clubs.load().then(function (meta) {
      S.meta = meta;
      S.picker = NL.clubPicker($('dzaPicker'), {
        mode: 'select', season: 'current', placeholder: 'Pick a club',
        onSelect: function (sel) {
          var c = (sel && sel.club) || NL.clubs.byName(sel && sel.name);
          if (!c || !c.code) return;
          S.open = c.code;
          drawClub();
          showPane('club');
        }
      });
      if (S.open && NL.clubs.byCode(S.open)) S.picker.setValue(NL.clubs.byCode(S.open).name);
      if (S.isAdmin) {
        S.editPicker = NL.clubPicker($('dzaEditPicker'), {
          mode: 'select', season: 'current', placeholder: 'Pick a club',
          onSelect: function (sel) {
            var c = (sel && sel.club) || NL.clubs.byName(sel && sel.name);
            if (!c || !c.code) return;
            S.editClub = c.code;
            drawEdit();
          }
        });
      }
      return NL.ensureAuth();
    }).then(loadIndex).catch(function (e) {
      console.error('[dazn-admin]', e);
      loading('Figures could not be loaded. Reload the page to try again.');
    });
  };

  if (window._toolDeferredSession) {
    window.TOOL.boot(window._toolDeferredSession);
    delete window._toolDeferredSession;
  }
})();
</script>
</body>
</html>
