<!DOCTYPE html>
<!--
  NL Tools — Audit log
  Version: v0.1 (12/11/2026)
  File: /audit/index.html

  Who did what, in every tool. Moved from the portal's admin area, where it
  was the Audit log tab, when that area closed (12/11/2026).

  Three ways in, one list:
    Everything   the newest entries, 20 at a time.
    A person     everything by or about them (?uid= opens it, as History
                 in People and cards links here), 20 at a time.
    An action or words   the last 500 entries (of everything, or of that
                 person), filtered here, as the portal's search did.

  Storage (RTDB), read only — entries are written by NL.writeAudit and the
  auto-audit hook in every tool:
    admin/audit                  every entry, keyed by time
    admin/audit-by-user/<uid>    the same entries, by the person who acted
                                 and the person acted on
    users                        names for the Person filter
    tools/ops-audit              this tool's registration

  Access: the rules let superadmin and League Admin read the log, as they
  read it in the portal; the registry opens the page to the same roles.

  Changelog
  v1.0 (12/11/2026) — Moved from the portal: everything, a person, an
    action, words. Entries read through NL.audit (nl-utils v1.52).
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audit log — NL Tools</title>
  <!-- Favicons. Static, not injected: nl-topbar.js adds these too, but a
       standalone page never loads it, and an icon that arrives with the JS
       leaves the tab blank until it does. /favicon.ico at the root is the
       backstop every browser asks for without being told. -->
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/favicon-16x16.png">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">

  <!-- Brand stylesheet (lint canonical: ?v=74) -->
  <link rel="stylesheet" href="/system/nl-brand.css?v=74">

  <!-- Firebase 10.12.0 SDK (compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

  <!-- Firebase init -->
  <script>
    firebase.initializeApp({
      apiKey:            "AIzaSyC3az3OMnU7TdqlaWp8yrO_EjgZ36l-mXU",
      authDomain:        "nl-tools.firebaseapp.com",
      databaseURL:       "https://nl-tools-default-rtdb.europe-west1.firebasedatabase.app",
      projectId:         "nl-tools",
      storageBucket:     "nl-tools.firebasestorage.app",
      messagingSenderId: "801354670005",
      appId:             "1:801354670005:web:05d8ebad3e7e63610d03fc"
    });
    var db = firebase.database();
  </script>

  <!-- Tool identity + changelog. Keep window.NL_TOOL and var NL_TOOL_KEY
       in sync — auth-guard reads NL_TOOL_KEY, nl-topbar reads window.NL_TOOL. -->
  <script>
    window.NL_TOOL = {
      title: 'Audit log',
      toolKey: 'ops-audit'
    };
    var NL_TOOL_KEY = 'ops-audit';

    window.NL_CHANGELOG = [
      {
        date: '12/11/2026',
        version: 'v1.0',
        items: [
          'The Audit log, moved from the portal’s admin area into its own tool.'
        ]
      }
    ];

    /* auth-guard fires this once the session is verified + pageWrap is
       revealed. Boot the main app from here so RTDB reads happen with a
       live auth token. Do NOT read RTDB before this fires. */
    window.nlAuthReady = function (userData) {
      window.NL = window.NL || {};
      window.NL.session = userData;
      if (window.TOOL && window.TOOL.boot) {
        window.TOOL.boot(userData);
      } else {
        window._toolDeferredSession = userData;
      }
    };
  </script>

  <!-- NL system scripts (lint canonical: ?v=58 / ?v=1 / ?v=13 / ?v=19) -->
  <script src="/system/nl-utils.js?v=58"></script>
  <!-- GA4, one property for all of nl.tools. Cookieless, so no consent
       banner on any page; page views by path, no identity. Tool events go
       through NL.track(). See system/nl-analytics.js. -->
  <script src="/system/nl-analytics.js?v=1"></script>
  <script src="/system/nl-topbar.js?v=13"></script>
  <script src="/system/auth-guard.js?v=19"></script>

<style>
  /* #pageWrap default hide is in nl-brand.css; auth-guard reveals with
     style.display = 'block'. Don't clear with '' — would re-trigger the
     brand rule and re-hide the page. */

  .al-note { font-size: var(--text-sm); color: var(--text-muted); }
  .al-more { display: flex; justify-content: center; padding: 16px 0; }
</style>
</head>
<body>

<!-- Topbar — auto-rendered by /system/nl-topbar.js from window.NL_TOOL -->
<div id="nlTopbar"></div>

<div id="pageWrap">
  <div class="page">

    <div class="toolbar">
      <div class="toolbar__left">
        <input class="toolbar__search" type="search" id="alSearch" placeholder="Search actions and details" aria-label="Search the log">
        <span id="alPerson"></span>
        <span id="alAction"></span>
      </div>
      <div class="toolbar__right"><span class="al-note" id="alNote"></span></div>
    </div>
    <div id="alList"><p class="al-note">Loading…</p></div>
    <div class="al-more" id="alMore" hidden><button class="btn btn--ghost btn--sm" type="button" id="alMoreBtn">Load 20 more</button></div>

  </div>
</div>

<!-- Main app -->
<script>
(function () {
  'use strict';

  var PAGE = 20, WIDE = 500;
  var S = { uid: null, action: null, q: '', rows: [], cursor: null, more: false, seq: 0 };
  var esc = NL.escHtml;

  /* Where to read: one person's index, or everything. */
  function source() {
    return db.ref(S.uid ? 'admin/audit-by-user/' + S.uid : 'admin/audit');
  }
  function entries(snap) {
    var out = [];
    snap.forEach(function (c) { var e = c.val(); if (e) { e._key = c.key; out.push(e); } });
    return out.reverse();
  }
  function hit(e) {
    if (S.action && e.action !== S.action) return false;
    if (!S.q) return true;
    return [e.action, NL.audit.label(e), e.detail, e.name, e.email, e.targetName, e.targetEmail]
      .join(' ').toLowerCase().indexOf(S.q) >= 0;
  }

  /* Filtered: the last 500, filtered here. Unfiltered: 20 at a time. */
  function load(fresh) {
    var seq = ++S.seq, filtered = !!(S.action || S.q);
    if (fresh) { S.rows = []; S.cursor = null; document.getElementById('alList').innerHTML = '<p class="al-note">Loading…</p>'; }
    var q = source().orderByKey();
    if (filtered) q = q.limitToLast(WIDE);
    else q = (S.cursor ? q.endBefore(S.cursor) : q).limitToLast(PAGE + 1);
    q.once('value').then(function (snap) {
      if (seq !== S.seq) return;
      var got = entries(snap);
      if (filtered) {
        S.rows = got.filter(hit);
        S.more = false;
      } else {
        S.more = got.length > PAGE;
        got = got.slice(0, PAGE);
        S.rows = S.rows.concat(got);
        if (got.length) S.cursor = got[got.length - 1]._key;
      }
      draw(filtered);
    }).catch(function (err) {
      document.getElementById('alList').innerHTML = '<p class="al-note">The log could not be loaded: ' + esc(err && err.message || String(err)) + '</p>';
    });
  }

  function draw(filtered) {
    document.getElementById('alList').innerHTML = S.rows.length
      ? NL.audit.table(S.rows)
      : '<div class="empty-state"><div class="empty-state__title">Nothing matches</div></div>';
    document.getElementById('alMore').hidden = !S.more;
    document.getElementById('alNote').textContent = filtered
      ? S.rows.length + ' in the last ' + WIDE + ' entries'
      : '';
  }

  window.TOOL = window.TOOL || {};
  window.TOOL.boot = function () {
    var person = NL.filterButton(document.getElementById('alPerson'), {
      label: 'Person', multiple: false, allLabel: 'Everyone', search: true, options: [],
      onChange: function (v) { S.uid = v; load(true); }
    });
    NL.filterButton(document.getElementById('alAction'), {
      label: 'Action', multiple: false, allLabel: 'Any',
      options: Object.keys(NL.audit.LABELS).map(function (a) { return { value: a, label: NL.audit.LABELS[a] }; })
        .sort(function (a, b) { return a.label.localeCompare(b.label); }),
      onChange: function (v) { S.action = v; load(true); }
    });
    var t;
    document.getElementById('alSearch').addEventListener('input', function (e) {
      clearTimeout(t);
      var v = e.target.value.trim().toLowerCase();
      t = setTimeout(function () { S.q = v; load(true); }, 250);
    });
    document.getElementById('alMoreBtn').addEventListener('click', function () { load(false); });

    S.uid = new URLSearchParams(location.search).get('uid') || null;
    NL.ensureAuth().then(function () {
      load(true);
      return db.ref('users').once('value');
    }).then(function (snap) {
      var all = snap.val() || {};
      person.setOptions(Object.keys(all).filter(function (k) { return all[k]; }).map(function (k) {
        return { value: k, label: all[k].name || all[k].email || k };
      }).sort(function (a, b) { return a.label.localeCompare(b.label); }));
      if (S.uid) person.set(S.uid);
    }).catch(function () {});
  };

  if (window._toolDeferredSession) {
    window.TOOL.boot(window._toolDeferredSession);
    delete window._toolDeferredSession;
  }
})();
</script>

</body>
</html>
