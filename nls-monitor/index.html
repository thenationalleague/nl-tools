<!--
  NL Tools — NLServices API Monitor
  Version: v1.2 (27/10/2026)
  v1.2 — Live is grouped by competition, each block under a section head with
         the canon competition pill (brand v2.72 .comp-pill, the content
         plan's colours) and its own match count; Quality's competition
         column is the same pill. A Tuesday night is thirty-odd matches and
         one undivided list was unreadable.
  v1.1 — An empty day is empty, not an error: NLS answers a list window with
         no matches as HTTP 404 "No matches found", which v1.0 showed as a
         Cup failure on every day without Cup games, and which also lost the
         Cup's calendar. The calendar is now asked for without a day window.
         Crests and match-state pills from canon, mapped as Matchday Live
         maps them, so a match reads the same in both tools.
  v1.0 — Rebuilt to read NLS itself. Every view now calls the NLServices API
         from the browser and shows what NLS says right now, gaps included;
         nothing here comes from our own store except one status line for
         our ingester. Four jobs, four tabs: Live (any matchday, refreshing
         while a match is in play, with each event's upstream entry time),
         Quality (per-match gaps to chase with Stats Perform: goals with no
         scorer, short team sheets, missing gate, referee or formation — one
         matchday or a whole division's season, exportable), Feed health
         (every endpoint probed: status, response time, rows, the fields we
         rely on, table freshness) and Raw (any NLS path, as-is). The old
         Tables & scorers tab is gone: it showed our ingester's tally, which
         is neither NLS as-is nor our accurate store, and had fallen behind
         both. v0.1–v0.15 (09/08–19/08/2026) read the ingester's nls/ nodes;
         see git history for that build.

  WHY IT READS NLS DIRECTLY
    Two things exist and must not blur. Our database is the ACCURATE record —
    NLS plus hand corrections (functions/nls/players.js applyCorrections).
    This page is the opposite: the RAW record, so a goal NLS has no scorer for
    looks missing here even after we have corrected it in our store. Reading
    our nodes would show our ingest, a minute behind and filtered through our
    shaping; calling NLS shows the source. The NLS API answers browsers
    directly — the fan embeds already depend on that.

    One deliberate exception: the verdict carries a single line on our
    ingester (nls/meta/ingest in nl-widgets), via the staff handshake below.
    If that handshake fails the line says so and nothing else is affected.

  HOW THE INGESTER LINE GETS IN
    Via the fanWidgetsAuth handshake (functions/fan-widgets.js): write a
    request, the trigger checks superadmin against the database, a custom
    token carrying a `staff` claim comes back, sign in to nl-widgets with it.
    The request/grant pair lives under app-data/ops-fan-widgets/ because Fan
    Widgets was the first tool to need it. CANON CANDIDATE (flagged
    09/08/2026): move it to a neutral path now there are two callers.

  Storage (RTDB): reads only.
    nl-tools:    app-data/ops-fan-widgets/authRequests|authGrants/<uid>
    nl-widgets:  nls/meta/ingest — the one ingester status line

  NLS REQUEST NOTES (learned the hard way in functions/nls/fetch.js)
    - The from/to window needs a LITERAL `+` for the space; the
      percent-encoded form is rejected. Colons stay encoded.
    - includePopulatedDates=true returns the season's matchday calendar on
      any list request, free. That drives the matchday picker.
    - Days are UTC days, because that is what from/to filters on.

  Access (auth-guard registry): superadmin only.
-->

<!-- Main app -->
<script>
(function () {
  'use strict';

  window.TOOL = window.TOOL || {};

  var NLS = 'https://multi-club-matches.football.web.gc.nationalleagueservices.co.uk/v2';
  var COMPS = [
    /* code = the canon competition code (.comp-pill--<code>), shown in

    { id: 372,  key: 'south', code: 'sou', label: 'National League South' },
    { id: 1275, key: 'cup',   code: 'nlc', label: 'National League Cup' }
  ];
  var LEAGUES = COMPS.slice(0, 3);
  var LIVE_POLL_MS = 30 * 1000;      // while anything is in play
  var DAY_POLL_MS = 2 * 60 * 1000;   // today, nothing in play
  var HEALTH_POLL_MS = 5 * 60 * 1000;
  var PAGE = 100;

  var esc = NL.escHtml;

  var state = {
    season: null,
    calendar: {},       // ymd -> { total, byComp: { key: n } }, from populatedDates
    ymd: null,
    day: {},            // compKey -> [row]
    dayErr: {},         // compKey -> message
    open: {},           // matchID -> true while its detail row is open
    tab: 'live',
    ingest: null,
    ingestErr: null,
    health: null,       // [{ probe result }]
    quality: { scope: 'day', rows: null, running: false, done: 0, total: 0, showAll: false, label: '' }
  };
  var details = {};     // matchID -> { at, res } — finished matches are kept for the session
  var pollTimer = null;
  var healthTimer = null;

  var els = {
    verdict: document.getElementById('nmVerdict'),
    tabs:    document.getElementById('nmTabs'),
    daybar:  document.getElementById('nmDaybar'),
    prev:    document.getElementById('nmPrev'),
    next:    document.getElementById('nmNext'),
    pick:    document.getElementById('nmDayPick'),
    dayNote: document.getElementById('nmDayNote'),
    live:    document.getElementById('nmLive'),
    quality: document.getElementById('nmQuality'),
    health:  document.getElementById('nmHealth'),
    raw:     document.getElementById('nmRaw')
  };

  /* The UTC day: NLS's from/to window filters on it. A local-time date would,
     after 23:00 BST, ask for tomorrow and show an empty matchday. */
  function todayYmd() { return new Date().toISOString().slice(0, 10); }

  // -------------------------------------------------------------------------
  // NLS requests
  // -------------------------------------------------------------------------

  /* Every request, timed. Resolves (never rejects) with what happened, because
     on this page a failure is a result to show, not an exception to swallow. */
  function nls(path) {
    var url = NLS + path;
    var t0 = performance.now();
    var ctrl = new AbortController();
    var timer = setTimeout(function () { ctrl.abort(); }, 20000);
    return fetch(url, { signal: ctrl.signal }).then(function (res) {
      return res.text().then(function (txt) {
        var json = null;
        try { json = txt ? JSON.parse(txt) : null; } catch (e) { /* shown as text */ }
        return { ok: res.ok, status: res.status, ms: Math.round(performance.now() - t0),
          json: json, text: txt, bytes: txt.length, url: url, path: path };
      });
    }).catch(function (err) {
      return { ok: false, status: 0, ms: Math.round(performance.now() - t0), json: null, text: '',
        bytes: 0, url: url, path: path,
        error: err && err.name === 'AbortError' ? 'Timed out after 20s' : ((err && err.message) || String(err)) };
    }).finally(function () { clearTimeout(timer); });
  }

  /* NLS answers a list window with nothing in it as HTTP 404 "No matches
     found" rather than an empty list — seen on 27/10/2026 for the Cup on a
     day without Cup games. That is an empty result, not a failure. */
  function noMatches(r) {
    if (r.status !== 404 || !r.json || !Array.isArray(r.json.errors)) return false;
    return r.json.errors.some(function (e) { return /no matches found/i.test((e && e.detail) || ''); });
  }

  function listData(r) {
    return noMatches(r) ? [] : ((r.json && r.json.data) || []);
  }

  function describe(r) {
    if (r.error) return r.error;
    var body = (r.text || '').replace(/\s+/g, ' ').trim().slice(0, 160);
    return 'HTTP ' + r.status + (body ? ' — ' + body : '');
  }

  /* A LITERAL `+` for the space: the endpoint rejects %20 here (fetch.js). */
  function dayWindow(ymd) {
    return 'from=' + ymd + '+00%3A00%3A00Z&to=' + ymd + '+23%3A59%3A59Z';
  }

  function dayPath(comp, ymd, extra) {
    return '/matches/?seasonID=' + state.season + '&competitionID=' + comp.id + '&' +
      dayWindow(ymd) + (extra || '') + '&page.size=' + PAGE;
  }

  function seasonList(comp) {
    var rows = [];
    function page(n) {
      return nls('/matches/?seasonID=' + state.season + '&competitionID=' + comp.id +
        '&sort=kickOffDateUTC&page.number=' + n + '&page.size=' + PAGE).then(function (r) {
        if (!r.ok && !noMatches(r)) throw new Error(comp.label + ' list: ' + describe(r));
        var data = listData(r);
        rows = rows.concat(data);
        var total = r.json && r.json.meta && r.json.meta.totalCount;
        if (data.length < PAGE || (total != null && rows.length >= total) || n >= 20) return rows;
        return page(n + 1);
      });
    }
    return page(1);
  }

  /* A finished match's detail is kept for the session — it can still change
     upstream (late scorers are the whole point of the Quality tab), so the
     Quality scan always refetches; only the Live tab's re-renders reuse it. */
  function detail(id, opts) {
    var hit = details[id];
    if (hit && !(opts && opts.fresh)) return Promise.resolve(hit.res);
    return nls('/matches/' + encodeURIComponent(id)).then(function (res) {
      details[id] = { at: Date.now(), res: res };
      return res;
    });
  }

  function mapLimit(items, limit, fn) {
    var i = 0;
    var out = new Array(items.length);
    function worker() {
      if (i >= items.length) return Promise.resolve();
      var k = i++;
      return Promise.resolve(fn(items[k], k)).then(function (v) { out[k] = v; return worker(); });
    }
    var workers = [];
    for (var w = 0; w < Math.min(limit, items.length); w++) workers.push(worker());
    return Promise.all(workers).then(function () { return out; });
  }

  // -------------------------------------------------------------------------
  // Shaping — only as much as display needs; Raw shows the rest
  // -------------------------------------------------------------------------

  /* NLS timestamps are UTC with no zone marker ("2026-10-24 14:00:00").
     NL.parseDate reads that shape as LOCAL time — right for every staff form,
     an hour wrong here all summer — so NLS strings are parsed here. Canon
     candidate if a second gated tool reads raw NLS: NL.parseDate(s, {utc:true}). */
  function utc(s) {
    if (!s) return null;
    var iso = String(s).indexOf('T') >= 0 ? String(s) : String(s).replace(' ', 'T') + 'Z';
    var d = new Date(iso);
    return isNaN(d.getTime()) ? null : d;
  }

  var DEAD = ['fulltime', 'postmatch', 'abandoned', 'postponed'];
  var LIVE = ['firsthalf', 'halftime', 'secondhalf', 'extratime', 'penalties'];
  function isLive(p) {
    p = String(p || '').toLowerCase();
    return DEAD.indexOf(p) < 0 && LIVE.some(function (v) { return p.indexOf(v) >= 0; });
  }
  function isFinished(p) {
    p = String(p || '').toLowerCase();
    return p === 'fulltime' || p === 'postmatch';
  }

  function shapeRow(m, comp) {
    var a = (m && m.attributes) || {};
    var h = a.homeTeam || {};
    var w = a.awayTeam || {};
    return {
      id: String(m.id || a.matchID),
      comp: comp,
      ko: utc(a.kickOffDateUTC || a.kickOffUTC),
      tbc: !!a.TBC,
      period: String(a.matchPeriod || a.period || ''),
      minute: a.formattedMatchTime || (a.matchMinutes != null ? a.matchMinutes + "'" : ''),
      home: h.name || h.shortName || '?',
      away: w.name || w.shortName || '?',
      homeID: h.teamID != null ? String(h.teamID) : null,
      awayID: w.teamID != null ? String(w.teamID) : null,
      hs: h.score, as: w.score,
      postponed: a.postponementReason || null,
      resultType: a.resultType || null
    };
  }

  function playerName(p) {
    var n = (p && (p.playerName || p)) || {};
    return String(n.knownName || n.customKnownName ||
      [n.firstName, n.lastName].filter(Boolean).join(' ') || '').trim() || null;
  }

  /* matchTeams is not ordered home-first; homeTeamID says which is which. */
  function sides(res) {
    var a = (res && res.json && res.json.data && res.json.data.attributes) || {};
    var teams = Array.isArray(a.matchTeams) ? a.matchTeams : [];
    var homeID = a.homeTeamID != null ? String(a.homeTeamID) : null;
    var home = teams.filter(function (t) { return String(t.teamID) === homeID; })[0] || teams[0] || {};
    var away = teams.filter(function (t) { return t !== home; })[0] || {};
    return { a: a, md: a.matchDetails || {}, home: home, away: away };
  }

  function sideFacts(t) {
    var p = t.players || {};
    var goals = (t.events && t.events.goals) || [];
    var named = goals.filter(function (e) { return e && e.goalEvents && e.goalEvents.playerID; }).length;
    var score = Number(t.score) || 0;
    return {
      xi: (p.Start || []).length,
      bench: (p.Sub || []).length,
      score: score,
      named: named,
      unnamed: Math.max(0, score - named),
      formation: t.formation ? String(t.formation) : ''
    };
  }

  /* The match-state pill, mapped the way Matchday Live maps it — FT info, HT
     pending, in play live with the minute, not started soon with the kick-off
     — so the same match reads the same in both tools. CANON CANDIDATE
     (27/10/2026): second tool with this mapping; promote as a helper over the
     canon pills if a third needs it. The raw period is in the tooltip. */
  function pill(row) {
    var p = row.period.toLowerCase();
    var t = ' title="' + esc(row.period || '') + '"';
    if (row.postponed || p === 'postponed') return '<span class="pill pill--postponed nm-pill"' + t + '>Postponed</span>';
    if (p === 'abandoned') return '<span class="pill pill--rejected nm-pill"' + t + '>Abandoned</span>';
    if (isFinished(p)) return '<span class="pill pill--info nm-pill"' + t + '>FT</span>';
    if (p.indexOf('halftime') >= 0) return '<span class="pill pill--pending nm-pill"' + t + '>HT</span>';
    if (isLive(p)) return '<span class="pill pill--live nm-pill"' + t + '>' + esc(row.minute || 'Live') + '</span>';
    return '<span class="pill pill--soon nm-pill"' + t + '>' + (row.ko ? esc(NL.formatTime(row.ko)) : 'Pre-match') + '</span>';
  }

  /* Crests from canon: clubs-meta keys crests by club name, so the NLS
     teamID goes through NL.clubs.byOpta first; a side not in clubs-meta (a
     cup guest) falls back to NLS's own name and hides if there is no file. */
  function compPill(comp) {
    return '<span class="comp-pill comp-pill--' + comp.code + '">' + esc(comp.code.toUpperCase()) + '</span>';
  }

  function crest(teamID, name) {
    var club = teamID ? NL.clubs.byOpta(teamID) : null;
    return NL.clubs.crestImgHtml(club ? club.name : name, 'thumb', { className: 'nl-crest' });
  }

  // -------------------------------------------------------------------------
  // Boot
  // -------------------------------------------------------------------------

  window.TOOL.boot = function (session) {
    resolveSeason().then(function () {
      return loadCalendar();
    }).then(function () {
      return selectDay(nearestMatchday());
    }).then(function () {
      /* After the day, so the match-detail probe has a finished match to use. */
      runHealth();
    });
    startIngesterLine(session && session.uid);
  };

  function resolveSeason() {
    return NL.clubs.load().then(function () {
      state.season = NL.season.current(NL.clubs.meta()) || String(NL.season.fromDate());
    }).catch(function () {
      state.season = String(NL.season.fromDate());
    });
  }

  /* includePopulatedDates returns every date in the season that has fixtures
     — the whole calendar, free. Asked with no day window first: a day window
     with nothing in it comes back 404 with no meta at all, which lost the
     Cup's calendar on any day without Cup games. The day-window form (what
     the ingester uses, so known to carry it) is the fallback. */
  function calendarFor(c) {
    return nls('/matches/?seasonID=' + state.season + '&competitionID=' + c.id +
      '&includePopulatedDates=true&page.size=1').then(function (r) {
      var pd = r.json && r.json.meta && r.json.meta.populatedDates;
      if (pd) return pd;
      return nls(dayPath(c, todayYmd(), '&includePopulatedDates=true')).then(function (r2) {
        return (r2.json && r2.json.meta && r2.json.meta.populatedDates) || null;
      });
    });
  }

  function loadCalendar() {
    return Promise.all(COMPS.map(function (c) {
      return calendarFor(c).then(function (pd) {
        Object.keys(pd || {}).forEach(function (ymd) {
          var v = pd[ymd];
          var n = Number(v && v.count != null ? v.count : v);
          if (!(n > 0)) return;
          var day = state.calendar[ymd] || (state.calendar[ymd] = { total: 0, byComp: {} });
          day.total += n;
          day.byComp[c.key] = n;
        });
      });
    }));
  }

  function matchdays() { return Object.keys(state.calendar).sort(); }

  /* Today if it has games, else the most recent past matchday, else the next. */
  function nearestMatchday() {
    var days = matchdays();
    var today = todayYmd();
    if (!days.length) return today;
    if (state.calendar[today]) return today;
    var past = days.filter(function (d) { return d < today; });
    return past.length ? past[past.length - 1] : days[0];
  }

  // -------------------------------------------------------------------------
  // The ingester line — the one thing here that is not NLS
  // -------------------------------------------------------------------------

  function startIngesterLine(uid) {
    if (!uid) { state.ingestErr = 'no session'; renderVerdict(); return; }
    handshake(uid).then(function (token) {
      return firebase.auth(widgetsApp).signInWithCustomToken(token);
    }).then(function () {
      firebase.database(widgetsApp).ref('nls/meta/ingest').on('value', function (s) {
        state.ingest = s.val();
        state.ingestErr = null;
        renderVerdict();
      }, function (err) {
        state.ingestErr = (err && err.message) || String(err);
        renderVerdict();
      });
    }).catch(function (err) {
      state.ingestErr = (err && err.message) || String(err);
      renderVerdict();
    });
  }

  /* Borrowed from Fan Widgets — see the file header and its canon note. */
  function handshake(uid) {
    var reqRef   = db.ref('app-data/ops-fan-widgets/authRequests/' + uid);
    var grantRef = db.ref('app-data/ops-fan-widgets/authGrants/' + uid);
    return NL.ensureAuth().then(function () {
      return grantRef.remove().catch(function () {});
    }).then(function () {
      return new Promise(function (resolve, reject) {
        var settled = false;
        var timer = setTimeout(function () {
          if (settled) return;
          settled = true; grantRef.off();
          reject(new Error('the staff token request timed out'));
        }, 30000);
        grantRef.on('value', function (snap) {
          var v = snap.val();
          if (!v || settled) return;
          settled = true; clearTimeout(timer); grantRef.off();
          grantRef.remove().catch(function () {});
          if (v.ok && v.customToken) resolve(v.customToken);
          else reject(new Error(v.error === 'not-superadmin' ? 'superadmin only' : ('token refused: ' + (v.error || 'unknown'))));
        });
        reqRef.set({ ts: Date.now() }).catch(function (e) {
          if (settled) return;
          settled = true; clearTimeout(timer); grantRef.off(); reject(e);
        });
      });
    });
  }

  function ingesterText() {
    if (state.ingestErr) return 'Our ingester: status unavailable (' + state.ingestErr + ').';
    var m = state.ingest;
    if (!m) return 'Our ingester: connecting…';
    var stale = m.lastSuccess && (Date.now() - m.lastSuccess) > 2 * 60 * 60 * 1000;
    return 'Our ingester v' + (m.version || '?') + ': last success ' +
      (m.lastSuccess ? NL.formatDateTime(m.lastSuccess, { seconds: true }) : 'never') +
      (stale ? ' — over two hours ago' : '') +
      ', ' + (m.errorCount || 0) + ' error' + (m.errorCount === 1 ? '' : 's') + ' on its last run.';
  }

  // -------------------------------------------------------------------------
  // Verdict — from the health probes
  // -------------------------------------------------------------------------

  function renderVerdict() {
    var h = state.health;
    var level = '', text = 'Checking NLS…';
    if (h) {
      var bad = h.filter(function (p) { return p.level === 'bad'; });
      var warn = h.filter(function (p) { return p.level === 'warn'; });
      var times = h.filter(function (p) { return p.res && p.res.ok; }).map(function (p) { return p.res.ms; }).sort(function (a, b) { return a - b; });
      var median = times.length ? times[Math.floor(times.length / 2)] : null;
      if (bad.length === h.length) { level = 'bad'; text = 'NLS is not answering — ' + describe(bad[0].res); }
      else if (bad.length) { level = 'bad'; text = bad.length + ' of ' + h.length + ' NLS checks failing — first: ' + bad[0].name; }
      else if (warn.length) { level = 'warn'; text = 'NLS answering, ' + warn.length + ' check' + (warn.length === 1 ? '' : 's') + ' with gaps'; }
      else { level = 'ok'; text = 'NLS answering normally' + (median != null ? ' — median ' + median + 'ms' : ''); }
    }
    els.verdict.className = 'verdict' + (level ? ' verdict--' + level : '');
    els.verdict.innerHTML = '<span class="verdict__dot"></span><span>' +
      '<span class="verdict__text">' + esc(text) + '</span><br>' +
      '<span class="verdict__sub">' + esc(ingesterText()) +
      (h ? ' Checked ' + esc(NL.formatDateTime(state.healthAt, { seconds: true })) + '.' : '') +
      '</span></span>';
  }

  // -------------------------------------------------------------------------
  // Day selection
  // -------------------------------------------------------------------------

  function dayLabel(ymd) {
    var d = new Date(ymd + 'T12:00:00Z');
    var c = state.calendar[ymd];
    return NL.formatDate(d) + (ymd === todayYmd() ? ' (today)' : '') +
      (c ? ' — ' + c.total + ' match' + (c.total === 1 ? '' : 'es') : '');
  }

  function renderDaybar() {
    var days = matchdays();
    if (state.ymd && days.indexOf(state.ymd) < 0) days = days.concat([state.ymd]).sort();
    els.pick.innerHTML = days.map(function (d) {
      return '<option value="' + esc(d) + '"' + (d === state.ymd ? ' selected' : '') + '>' + esc(dayLabel(d)) + '</option>';
    }).join('');
    var i = days.indexOf(state.ymd);
    els.prev.disabled = i <= 0;
    els.next.disabled = i < 0 || i >= days.length - 1;
    els.daybar.hidden = !(state.tab === 'live' || (state.tab === 'quality' && state.quality.scope === 'day'));
  }

  function selectDay(ymd) {
    state.ymd = ymd;
    state.day = {};
    state.dayErr = {};
    state.open = {};
    renderDaybar();
    els.live.innerHTML = '<p class="nm-note">Loading ' + esc(dayLabel(ymd)) + ' from NLS…</p>';
    return loadDay().then(function () {
      if (state.tab === 'quality' && state.quality.scope === 'day') scanQuality();
    });
  }

  function loadDay() {
    var ymd = state.ymd;
    return Promise.all(COMPS.map(function (c) {
      return nls(dayPath(c, ymd)).then(function (r) {
        if (ymd !== state.ymd) return;
        if (!r.ok && !noMatches(r)) { state.dayErr[c.key] = describe(r); return; }
        state.day[c.key] = listData(r).map(function (m) { return shapeRow(m, c); });
      });
    })).then(function () {
      if (ymd !== state.ymd) return;
      state.dayAt = Date.now();
      renderLive();
      schedulePoll();
    });
  }

  function dayRows() {
    var rows = [];
    COMPS.forEach(function (c) { rows = rows.concat(state.day[c.key] || []); });
    return rows.sort(function (a, b) {
      return ((a.ko && a.ko.getTime()) || 0) - ((b.ko && b.ko.getTime()) || 0) ||
        COMPS.indexOf(a.comp) - COMPS.indexOf(b.comp) || a.home.localeCompare(b.home);
    });
  }

  /* Fast while anything is in play; slow on today otherwise; never for a past
     day, which cannot change except by correction (Quality catches those). */
  function schedulePoll() {
    clearTimeout(pollTimer);
    var anyLive = dayRows().some(function (r) { return isLive(r.period); });
    var ms = anyLive ? LIVE_POLL_MS : (state.ymd === todayYmd() ? DAY_POLL_MS : 0);
    if (!ms) return;
    pollTimer = setTimeout(function () {
      if (document.hidden) { schedulePoll(); return; }
      loadDay().then(function () {
        Object.keys(state.open).forEach(function (id) {
          var row = dayRows().filter(function (r) { return r.id === id; })[0];
          if (row && !isFinished(row.period)) loadDetail(id, true);
        });
      });
    }, ms);
  }

  // -------------------------------------------------------------------------
  // Live
  // -------------------------------------------------------------------------

  function renderLive() {
    var rows = dayRows();
    var errs = Object.keys(state.dayErr);
    var html = '';
    if (errs.length) {
      html += '<div class="banner banner--error">' + errs.map(function (k) {
        var c = COMPS.filter(function (x) { return x.key === k; })[0];
        return esc(c.label) + ': ' + esc(state.dayErr[k]);
      }).join('<br>') + '</div>';
    }
    var live = rows.filter(function (r) { return isLive(r.period); }).length;
    html += '<p class="nm-note">' + rows.length + ' match' + (rows.length === 1 ? '' : 'es') +
      (live ? ', ' + live + ' in play — refreshing every 30s' : '') +
      (state.dayAt ? '. Read from NLS at ' + esc(NL.formatDateTime(state.dayAt, { seconds: true })) : '') +
      '.</p>';
    if (!rows.length) {
      els.live.innerHTML = html + (errs.length ? '' : emptyState('No matches', 'NLS lists nothing on this day.'));
      return;
    }
    /* One block per competition, in league order, each under its own
       heading with the competition pill — a Tuesday night is thirty-odd
       matches, and one undivided list of them is unreadable. */
    COMPS.forEach(function (c) {
      var list = rows.filter(function (r) { return r.comp === c; });
      if (!list.length) return;
      var inPlay = list.filter(function (r) { return isLive(r.period); }).length;
      html += '<div class="section-head nm-comp-head"><h2>' + compPill(c) + ' ' + esc(c.label) + '</h2>' +
        '<span class="muted">' + list.length + ' match' + (list.length === 1 ? '' : 'es') +
        (inPlay ? ', ' + inPlay + ' in play' : '') + '</span></div>';
      html += '<div class="table-wrap"><table class="table table--compact nm-table"><colgroup>' +
        '<col class="col-time"><col><col class="col-score"><col><col class="col-state">' +
        '</colgroup><thead><tr><th>KO</th><th class="ta-r">Home</th><th class="ta-c">Score</th><th>Away</th><th>State</th></tr></thead><tbody>';
      list.forEach(function (r) {
        var open = !!state.open[r.id];
        var score = (r.hs != null && r.as != null && (isLive(r.period) || isFinished(r.period)))
          ? r.hs + '–' + r.as : '–';
        html += '<tr class="nm-row' + (open ? ' is-open' : '') + '" data-id="' + esc(r.id) + '">' +
          '<td class="mono">' + (r.ko ? esc(NL.formatTime(r.ko)) : '—') + (r.tbc ? ' <span class="muted">TBC</span>' : '') + '</td>' +
          '<td class="ta-r">' + esc(r.home) + ' ' + crest(r.homeID, r.home) + '</td>' +
          '<td class="ta-c score">' + esc(score) + '</td>' +
          '<td>' + crest(r.awayID, r.away) + ' ' + esc(r.away) + '</td>' +
          '<td>' + pill(r) + '</td></tr>';
        if (open) html += '<tr class="nm-detail"><td colspan="5" id="nmDetail-' + esc(r.id) + '">' + detailHtml(r) + '</td></tr>';
      });
      html += '</tbody></table></div>';
    });
    els.live.innerHTML = html;
    NL.clubs.wireCrestImgs(els.live, true);
  }

  els.live.addEventListener('click', function (e) {
    var tr = e.target.closest('.nm-row');
    if (!tr) return;
    var id = tr.getAttribute('data-id');
    if (state.open[id]) { delete state.open[id]; renderLive(); return; }
    state.open[id] = true;
    renderLive();
    loadDetail(id, false);
  });

  function loadDetail(id, fresh) {
    var row = dayRows().filter(function (r) { return r.id === id; })[0];
    return detail(id, { fresh: fresh || (row && !isFinished(row.period)) }).then(function () {
      var cell = document.getElementById('nmDetail-' + id);
      if (cell && row) cell.innerHTML = detailHtml(row);
    });
  }

  function detailHtml(row) {
    var hit = details[row.id];
    if (!hit) return '<p class="nm-note">Loading match detail…</p>';
    var res = hit.res;
    if (!res.ok) return '<p class="nm-note">Detail failed: ' + esc(describe(res)) + '</p>';
    var s = sides(res);
    var hf = sideFacts(s.home), af = sideFacts(s.away);
    var facts = [
      'Venue ' + (s.a.venue || '—'),
      'Ref ' + (s.md.refereeName || s.a.refereeName || '—'),
      'Gate ' + (s.md.attendance != null ? s.md.attendance : '—'),
      'HT ' + (s.home.halfScore != null ? s.home.halfScore + '–' + s.away.halfScore : '—'),
      'XI ' + hf.xi + '/' + af.xi,
      'Bench ' + hf.bench + '/' + af.bench,
      'Formation ' + (hf.formation || '—') + ' / ' + (af.formation || '—'),
      'Scorers named ' + (hf.named + af.named) + ' of ' + (hf.score + af.score)
    ];
    var evs = timeline(s, row);
    var html = '<p class="nm-note">' + facts.map(esc).join(' · ') +
      ' · <span class="mono">' + esc(row.id) + '</span> · fetched ' +
      esc(NL.formatDateTime(hit.at, { seconds: true })) + '</p>';
    if (!evs.length) return html + '<p class="nm-note">No events entered.</p>';
    html += '<div>' + evs.map(function (ev) {
      return '<div class="ev ev--' + ev.kind + '"><span class="mono">' + esc(ev.minute) + '</span>' +
        '<span class="ev__type">' + esc(ev.type) + '</span>' +
        '<span>' + ev.what + '</span>' +
        '<span class="ev__when mono" title="Upstream entry time">' + (ev.entered ? 'entered ' + esc(NL.formatDateTime(ev.entered, { seconds: true })) : 'no entry time') + '</span></div>';
    }).join('') + '</div>';
    return html;
  }

  /* Every event from both sides, in match order. Goals are filed under the
     side that BENEFITED — an own goal sits with the team it counted for. */
  function timeline(s, row) {
    var out = [];
    [[s.home, row.home], [s.away, row.away]].forEach(function (pair) {
      var t = pair[0], team = pair[1];
      var ev = t.events || {};
      (ev.goals || []).forEach(function (e) {
        var g = (e && e.goalEvents) || {};
        var type = String(g.goalType || 'Goal');
        var who = playerName(g.player);
        out.push({ kind: 'goal', type: type, order: order(e), minute: e.formattedEventTime || (e.eventMinute != null ? e.eventMinute + "'" : '?'),
          entered: utc(e.eventTimestamp),
          what: esc(team) + ' — ' + (g.playerID ? esc(who || g.playerID) : '<span class="ev__flag">no scorer</span>') });
      });
      (ev.bookings || []).forEach(function (e) {
        var b = (e && e.bookingEvents) || {};
        var red = /red/i.test(b.card || '') || /red|second/i.test(b.cardType || '');
        out.push({ kind: red ? 'red' : 'card', type: b.card || 'Card', order: order(e),
          minute: e.formattedEventTime || (e.eventMinute != null ? e.eventMinute + "'" : '?'),
          entered: utc(e.eventTimestamp),
          what: esc(team) + ' — ' + (b.playerID ? esc(playerName(b.player) || b.playerID) : '<span class="ev__flag">no player</span>') });
      });
      (ev.subs || []).forEach(function (e) {
        var x = (e && e.substitutionEvents) || {};
        out.push({ kind: 'sub', type: 'Sub', order: order(e),
          minute: e.formattedEventTime || (e.eventMinute != null ? e.eventMinute + "'" : '?'),
          entered: utc(e.eventTimestamp),
          what: esc(team) + ' — ' + esc(playerName(x.subOnPlayer) || x.subOnID || '?') + ' on for ' + esc(playerName(x.subOffPlayer) || x.subOffID || '?') });
      });
    });
    return out.sort(function (a, b) { return a.order - b.order; });
  }

  function order(e) {
    var p = String((e && e.eventPeriod) || '').toLowerCase();
    var base = p.indexOf('extra') >= 0 ? 200 : 0;
    var m = Number(e && (e.eventMinute != null ? e.eventMinute : e.eventTime));
    return base + (isNaN(m) ? 999 : m);
  }

  // -------------------------------------------------------------------------
  // Quality — what NLS is missing, per match
  // -------------------------------------------------------------------------

  function renderQualityShell() {
    if (els.quality.dataset.built) return;
    els.quality.dataset.built = '1';
    els.quality.innerHTML =
      '<div class="filter-bar">' +
        '<select id="nmQScope" class="nl-select" aria-label="Scope">' +
          '<option value="day">The chosen matchday</option>' +
          COMPS.map(function (c) { return '<option value="' + c.key + '">Season so far — ' + esc(c.label) + '</option>'; }).join('') +
        '</select>' +
        '<button class="btn btn--primary btn--sm" id="nmQRun" type="button">Scan</button>' +
        '<label class="filter-label"><input type="checkbox" id="nmQAll"> Show matches with no gaps</label>' +
        '<button class="btn btn--ghost btn--sm" id="nmQCsv" type="button" disabled>Export CSV</button>' +
      '</div>' +
      '<div id="nmQOut"></div>';
    document.getElementById('nmQScope').addEventListener('change', function () {
      state.quality.scope = this.value;
      state.quality.rows = null;
      renderDaybar();
      renderQuality();
      if (this.value === 'day') scanQuality();
    });
    document.getElementById('nmQRun').addEventListener('click', scanQuality);
    document.getElementById('nmQAll').addEventListener('change', function () {
      state.quality.showAll = this.checked;
      renderQuality();
    });
    document.getElementById('nmQCsv').addEventListener('click', exportQuality);
  }

  function scanQuality() {
    var q = state.quality;
    if (q.running) return;
    var scope = q.scope;
    var pick;
    if (scope === 'day') {
      q.label = dayLabel(state.ymd);
      pick = Promise.resolve(dayRows());
    } else {
      var comp = COMPS.filter(function (c) { return c.key === scope; })[0];
      q.label = comp.label + ', season so far';
      pick = seasonList(comp).then(function (list) {
        return list.map(function (m) { return shapeRow(m, comp); });
      });
    }
    q.running = true; q.rows = []; q.done = 0; q.total = 0; q.error = null;
    renderQuality();
    pick.then(function (rows) {
      var finished = rows.filter(function (r) { return isFinished(r.period); });
      q.total = finished.length;
      renderQuality();
      return mapLimit(finished, 6, function (r) {
        return detail(r.id, { fresh: true }).then(function (res) {
          q.rows.push(assess(r, res));
          q.done += 1;
          if (q.done % 10 === 0 || q.done === q.total) renderQuality();
        });
      });
    }).catch(function (err) {
      q.error = (err && err.message) || String(err);
    }).then(function () {
      q.running = false;
      q.rows.sort(function (a, b) { return ((a.row.ko && a.row.ko.getTime()) || 0) - ((b.row.ko && b.row.ko.getTime()) || 0); });
      renderQuality();
    });
  }

  /* bad = a fact is wrong or missing (a goal with no scorer, no team sheet);
     warn = something useful is absent (short sheet, no gate, no referee). */
  function assess(row, res) {
    if (!res.ok) return { row: row, failed: describe(res), issues: [{ level: 'bad', text: 'detail failed: ' + describe(res) }] };
    var s = sides(res);
    var hf = sideFacts(s.home), af = sideFacts(s.away);
    var issues = [];
    [[hf, row.home], [af, row.away]].forEach(function (pair) {
      var f = pair[0], team = pair[1];
      if (f.unnamed) issues.push({ level: 'bad', kind: 'scorer', n: f.unnamed, text: team + ': ' + f.unnamed + ' goal' + (f.unnamed === 1 ? '' : 's') + ' without a scorer' });
      if (!f.xi) issues.push({ level: 'bad', kind: 'sheet', text: team + ': no team sheet' });
      else if (f.xi < 11) issues.push({ level: 'warn', kind: 'sheet', text: team + ': ' + f.xi + ' starters' });
      if (f.xi && !f.bench) issues.push({ level: 'warn', kind: 'bench', text: team + ': no bench' });
      if (f.xi && !f.formation) issues.push({ level: 'warn', kind: 'formation', text: team + ': no formation' });
    });
    if (s.md.attendance == null) issues.push({ level: 'warn', kind: 'gate', text: 'no gate' });
    if (!(s.md.refereeName || s.a.refereeName)) issues.push({ level: 'warn', kind: 'ref', text: 'no referee' });
    return { row: row, h: hf, a: af, issues: issues };
  }

  function renderQuality() {
    renderQualityShell();
    var q = state.quality;
    var out = document.getElementById('nmQOut');
    document.getElementById('nmQCsv').disabled = !(q.rows && q.rows.length && !q.running);
    if (!q.rows) {
      out.innerHTML = '<p class="nm-note">' + (q.scope === 'day' ? 'Scanning the chosen matchday…'
        : 'A season scan reads every finished match’s detail from NLS — a division is a few hundred requests and takes a minute or two.') + '</p>';
      return;
    }
    var html = '';
    if (q.error) html += '<div class="banner banner--error">' + esc(q.error) + '</div>';
    html += '<p class="nm-note">' + esc(q.label) + ': ' + (q.running
      ? 'checked ' + q.done + ' of ' + (q.total || '…') + ' finished matches…'
      : q.done + ' finished match' + (q.done === 1 ? '' : 'es') + ' checked against NLS') + '</p>';

    var count = function (kind) {
      return q.rows.reduce(function (n, r) {
        return n + r.issues.filter(function (i) { return i.kind === kind; }).reduce(function (m, i) { return m + (i.n || 1); }, 0);
      }, 0);
    };
    var flagged = q.rows.filter(function (r) { return r.issues.length; });
    var badMatches = q.rows.filter(function (r) { return r.issues.some(function (i) { return i.level === 'bad'; }); }).length;
    html += '<div class="stats">' + [
      stat(flagged.length, 'Matches with gaps', flagged.length ? 'warn' : 'ok'),
      stat(count('scorer'), 'Goals without a scorer', count('scorer') ? 'bad' : 'ok'),
      stat(count('sheet'), 'Missing or short team sheets', count('sheet') ? 'warn' : 'ok'),
      stat(count('gate'), 'No gate', count('gate') ? 'warn' : 'ok'),
      stat(count('ref'), 'No referee', count('ref') ? 'warn' : 'ok'),
      stat(badMatches, 'Matches with a missing fact', badMatches ? 'bad' : 'ok')
    ].join('') + '</div>';

    var list = q.showAll ? q.rows : flagged;
    if (!list.length) {
      out.innerHTML = html + (q.running ? '' : emptyState('No gaps',
        'Every finished match has its scorers, team sheets, gate and referee.'));
      return;
    }
    html += '<div class="table-wrap"><table class="table table--compact nm-table"><colgroup>' +
      '<col class="col-date"><col class="col-comp"><col><col class="col-score"><col style="width:45%">' +
      '</colgroup><thead><tr><th>Date</th><th>Comp</th><th>Match</th><th class="ta-c">Score</th><th>Gaps in NLS</th></tr></thead><tbody>';
    list.forEach(function (r) {
      html += '<tr><td class="mono">' + esc(r.row.ko ? NL.formatDateShort(r.row.ko) : '—') + '</td>' +
        '<td>' + compPill(r.row.comp) + '</td>' +
        '<td>' + esc(r.row.home) + ' v ' + esc(r.row.away) + '<br><a href="#" class="mono muted nm-raw-link" data-id="' + esc(r.row.id) + '">' + esc(r.row.id) + '</a></td>' +
        '<td class="ta-c score">' + esc(r.row.hs) + '–' + esc(r.row.as) + '</td>' +
        '<td>' + (r.issues.length ? r.issues.map(function (i) {
          return '<span class="q-' + i.level + '">' + esc(i.text) + '</span>';
        }).join(' · ') : '<span class="q-ok">complete</span>') + '</td></tr>';
    });
    html += '</tbody></table></div>';
    out.innerHTML = html;
  }

  els.quality.addEventListener('click', function (e) {
    var a = e.target.closest('.nm-raw-link');
    if (!a) return;
    e.preventDefault();
    showTab('raw');
    rawFetch('/matches/' + a.getAttribute('data-id'));
  });

  function exportQuality() {
    var q = state.quality;
    var rows = [['matchID', 'date', 'competition', 'home', 'away', 'score', 'goals without scorer', 'home starters', 'away starters', 'home bench', 'away bench', 'gaps']];
    (q.showAll ? q.rows : q.rows.filter(function (r) { return r.issues.length; })).forEach(function (r) {
      rows.push([r.row.id, r.row.ko ? r.row.ko.toISOString().slice(0, 10) : '', r.row.comp.label, r.row.home, r.row.away,
        r.row.hs + '-' + r.row.as,
        r.h ? r.h.unnamed + r.a.unnamed : '',
        r.h ? r.h.xi : '', r.a ? r.a.xi : '', r.h ? r.h.bench : '', r.a ? r.a.bench : '',
        r.issues.map(function (i) { return i.text; }).join('; ')]);
    });
    NL.download('nls-gaps-' + (q.scope === 'day' ? state.ymd : q.scope + '-' + state.season) + '.csv',
      NL.csv(rows, { bom: true }), 'text/csv');
  }

  function emptyState(title, text) {
    return '<div class="empty-state"><div class="empty-state__title">' + esc(title) + '</div>' +
      '<div class="empty-state__text">' + esc(text) + '</div></div>';
  }

  function stat(num, label, mod) {
    return '<div class="stat' + (mod ? ' stat--' + mod : '') + '">' +
      '<div class="stat__num">' + esc(num) + '</div>' +
      '<div class="stat__label">' + esc(label) + '</div></div>';
  }

  // -------------------------------------------------------------------------
  // Feed health — every endpoint we depend on, probed
  // -------------------------------------------------------------------------

  function missing(obj, fields) {
    return fields.filter(function (f) { return !obj || obj[f] === undefined; });
  }

  function runHealth() {
    clearTimeout(healthTimer);
    var today = todayYmd();
    var probes = [];
    COMPS.forEach(function (c) {
      probes.push({ name: c.label + ' — today’s list', path: dayPath(c, today, '&includePopulatedDates=true'),
        check: function (r) {
          var data = listData(r);
          var cal = r.json && r.json.meta && r.json.meta.populatedDates;
          var gone = data[0] ? missing(data[0].attributes, ['kickOffDateUTC', 'homeTeam', 'awayTeam', 'matchPeriod']) : [];
          return { rows: data.length + ' today', info: cal ? Object.keys(cal).length + ' matchdays in calendar' : 'no calendar',
            warn: gone.length ? 'missing ' + gone.join(', ') : (cal ? null : 'populatedDates absent') };
        } });
    });
    LEAGUES.forEach(function (c) {
      probes.push({ name: c.label + ' — table', path: '/league-tables/?competitionID=' + c.id + '&seasonID=' + state.season,
        check: function (r) {
          var data = (r.json && r.json.data) || [];
          var snap = r.json && r.json.meta && r.json.meta.snapshotDate;
          var gone = data[0] ? missing(data[0].attributes, ['position', 'teamName', 'played', 'points', 'goalsFor']) : [];
          return { rows: data.length + ' teams', info: snap ? 'snapshot ' + snap : 'no snapshotDate',
            warn: !data.length ? 'empty table' : (gone.length ? 'missing ' + gone.join(', ') : null) };
        } });
    });
    var sample = sampleFinished();
    if (sample) {
      probes.push({ name: 'Match detail — ' + sample.home + ' v ' + sample.away, path: '/matches/' + sample.id,
        check: function (r) {
          var a = (r.json && r.json.data && r.json.data.attributes) || null;
          var gone = missing(a, ['matchTeams', 'matchDetails', 'homeTeamID', 'period']);
          var t = (a && a.matchTeams && a.matchTeams[0]) || {};
          var inner = missing(t, ['players', 'events', 'score']);
          var all = gone.concat(inner);
          return { rows: (a && a.matchTeams ? a.matchTeams.length : 0) + ' sides', info: 'fields checked',
            warn: all.length ? 'missing ' + all.join(', ') : null };
        } });
    }
    return Promise.all(probes.map(function (p) {
      return nls(p.path).then(function (res) {
        var out = { name: p.name, path: p.path, res: res, level: 'bad', rows: '', info: describe(res) };
        if (noMatches(res)) {
          out.level = 'ok'; out.rows = '0 today';
          out.info = 'NLS answers an empty day with 404 “No matches found” — expected';
        } else if (res.ok && res.json) {
          var c = p.check(res);
          out.level = c.warn ? 'warn' : 'ok';
          out.rows = c.rows;
          out.info = c.warn ? c.warn + ' · ' + c.info : c.info;
        } else if (res.ok) {
          out.info = 'not JSON';
        }
        return out;
      });
    })).then(function (results) {
      state.health = results;
      state.healthAt = Date.now();
      renderVerdict();
      if (state.tab === 'health') renderHealth();
      healthTimer = setTimeout(runHealth, HEALTH_POLL_MS);
    });
  }

  function sampleFinished() {
    var rows = dayRows().filter(function (r) { return isFinished(r.period); });
    return rows[0] || null;
  }

  function renderHealth() {
    var h = state.health;
    if (!h) { els.health.innerHTML = '<p class="nm-note">Probing NLS…</p>'; return; }
    var html = '<div class="filter-bar"><button class="btn btn--primary btn--sm" id="nmHRun" type="button">Run checks now</button>' +
      '<span class="muted">Every five minutes while this page is open. Last run ' +
      esc(NL.formatDateTime(state.healthAt, { seconds: true })) + '.</span></div>';
    if (!h.some(function (p) { return /detail/i.test(p.name); })) {
      html += '<p class="nm-note">The match-detail check runs once a matchday with a finished match is loaded.</p>';
    }
    html += '<div class="table-wrap"><table class="table table--compact"><thead><tr>' +
      '<th>Endpoint</th><th>Result</th><th class="ta-r">Time</th><th>Rows</th><th>Detail</th></tr></thead><tbody>';
    h.forEach(function (p) {
      var label = p.level === 'ok' ? 'OK' : (p.level === 'warn' ? 'Gaps' : 'Failing');
      var cls = p.level === 'ok' ? 'pill--approved' : (p.level === 'warn' ? 'pill--pending' : 'pill--rejected');
      html += '<tr><td>' + esc(p.name) + '<br><a href="#" class="mono muted nm-raw-path" data-path="' + esc(p.path) + '">' + esc(p.path.slice(0, 70)) + (p.path.length > 70 ? '…' : '') + '</a></td>' +
        '<td><span class="pill ' + cls + ' nm-pill">' + label + '</span> <span class="mono muted">' + esc(p.res.status || '—') + '</span></td>' +
        '<td class="ta-r mono">' + esc(p.res.ms) + 'ms</td>' +
        '<td>' + esc(p.rows) + '</td>' +
        '<td class="muted">' + esc(p.info) + '</td></tr>';
    });
    html += '</tbody></table></div>';
    els.health.innerHTML = html;
    document.getElementById('nmHRun').addEventListener('click', function () {
      els.health.innerHTML = '<p class="nm-note">Probing NLS…</p>';
      runHealth().then(renderHealth);
    });
  }

  els.health.addEventListener('click', function (e) {
    var a = e.target.closest('.nm-raw-path');
    if (!a) return;
    e.preventDefault();
    showTab('raw');
    rawFetch(a.getAttribute('data-path'));
  });

  // -------------------------------------------------------------------------
  // Raw
  // -------------------------------------------------------------------------

  function renderRaw() {
    if (els.raw.dataset.built) return;
    els.raw.dataset.built = '1';
    els.raw.innerHTML =
      '<div class="filter-bar">' +
      '<div class="form-group nm-path"><label for="nmPath">NLS path</label>' +
      '<input id="nmPath" class="mono" value="' +
        esc('/matches/?seasonID=' + state.season + '&competitionID=89&page.size=5') + '"></div>' +
      '<button class="btn btn--primary btn--sm" id="nmGo" type="button">Fetch</button>' +
      '<button class="btn btn--ghost btn--sm" id="nmCopy" type="button">Copy response</button>' +
      '<button class="btn btn--ghost btn--sm" id="nmCopyUrl" type="button">Copy URL</button>' +
      '</div><p class="nm-note" id="nmRawMeta">Relative to ' + esc(NLS) + '</p>' +
      '<pre id="nmOut" class="mono nm-out"></pre>';
    document.getElementById('nmGo').addEventListener('click', function () {
      rawFetch(document.getElementById('nmPath').value);
    });
    document.getElementById('nmPath').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') rawFetch(this.value);
    });
    document.getElementById('nmCopy').addEventListener('click', function () {
      NL.copy(document.getElementById('nmOut').textContent);
    });
    document.getElementById('nmCopyUrl').addEventListener('click', function () {
      NL.copy(NLS + normalisePath(document.getElementById('nmPath').value));
    });
  }

  function normalisePath(p) {
    p = String(p || '').trim();
    if (p.indexOf(NLS) === 0) p = p.slice(NLS.length);
    return p.charAt(0) === '/' ? p : '/' + p;
  }

  function rawFetch(path) {
    renderRaw();
    path = normalisePath(path);
    document.getElementById('nmPath').value = path;
    var meta = document.getElementById('nmRawMeta');
    var out = document.getElementById('nmOut');
    meta.textContent = 'Fetching…';
    out.textContent = '';
    nls(path).then(function (r) {
      meta.textContent = (r.error ? r.error : 'HTTP ' + r.status) + ' · ' + r.ms + 'ms · ' +
        (r.bytes / 1024).toFixed(1) + ' KB · ' + NL.formatDateTime(Date.now(), { seconds: true });
      out.textContent = r.json ? JSON.stringify(r.json, null, 2) : (r.text || '');
    });
  }

  // -------------------------------------------------------------------------
  // Tabs and day bar
  // -------------------------------------------------------------------------

  function showTab(name) {
    state.tab = name;
    [].forEach.call(els.tabs.querySelectorAll('.tab'), function (t) {
      t.classList.toggle('active', t.getAttribute('data-tab') === name);
    });
    els.live.hidden = name !== 'live';
    els.quality.hidden = name !== 'quality';
    els.health.hidden = name !== 'health';
    els.raw.hidden = name !== 'raw';
    renderDaybar();
    if (name === 'live') renderLive();
    if (name === 'quality') {
      renderQuality();
      if (state.quality.scope === 'day' && !state.quality.rows && !state.quality.running) scanQuality();
    }
    if (name === 'health') renderHealth();
    if (name === 'raw') renderRaw();
  }

  els.tabs.addEventListener('click', function (e) {
    var btn = e.target.closest('.tab');
    if (btn) showTab(btn.getAttribute('data-tab'));
  });
  els.pick.addEventListener('change', function () { selectDay(this.value); });
  els.prev.addEventListener('click', function () {
    var days = matchdays(), i = days.indexOf(state.ymd);
    if (i > 0) selectDay(days[i - 1]);
  });
  els.next.addEventListener('click', function () {
    var days = matchdays(), i = days.indexOf(state.ymd);
    if (i >= 0 && i < days.length - 1) selectDay(days[i + 1]);
  });
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && state.ymd) schedulePoll();
  });

  els.tabs.querySelector('.tab').classList.add('active');

  /* If auth-guard fired before this script loaded, replay the session. */
  if (window._toolDeferredSession) {
    window.TOOL.boot(window._toolDeferredSession);
    delete window._toolDeferredSession;
  }
})();
</script>

</body>
