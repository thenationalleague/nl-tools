<!DOCTYPE html>
<!--
  NL Tools — NLServices API Monitor
  Version: v0.15 (19/08/2026)

  v0.15 — The whole state ledger in the Events feed, not just kick-offs.
         Half time, full time and the oddities (abandoned, extra time, a
         wobble back to pre-match) render from anchors/<id>/transitions —
         each is an observation with no event timestamp to correct against,
         so the observed time is the record and sits in the detected-at
         column. Flips into a half are deliberately not repeated: the
         kick-off line already carries them, corrected.
  v0.14 — Kick-offs appear in the Events feed. Synthetic and display-only:
         the RTDB stream stays append-only player events, because an anchor
         REVISES backwards and a feed entry must not silently change its
         headline time — so the lines are derived from anchors/ at render
         time and always show the current best kick-off, its source and
         confidence, and the measured list-flip lag. Anchor subscriptions
         now cover every match on the selected day rather than only live
         ones, so backfilled past days show their kick-offs too.
  v0.13 — The PERMISSION_DENIED guidance names the fix that exists: Actions →
         Deploy RTDB rules, target nl-widgets. It said "paste the block into
         the console by hand" — true when written, false since the rules
         workflow gained its nl-widgets target, and stale guidance in an
         error message is worse than none because it is read at exactly the
         moment someone will act on it.
  v0.12 — Live minutes come from the ingester's kick-off anchors, not from
         upstream's matchMinutes. NLS never emits kick-off, so the ingester
         synthesises it (anchors/<matchID>/<1H|2H> — list flip at low
         confidence, corrected backwards by event timestamps; method note
         v18.0). The pill shows the derived clock — elapsed since the anchor,
         floored, capped at 45'+n / 90'+n, frozen at the cap through half
         time — and its tooltip names the anchor's source and confidence,
         upstream's own minute for comparison, and the measured kick-off
         ingest lag where one exists. Falls back to upstream's minute
         wherever the model makes no claim (no anchor yet, extra time,
         penalties). The clock re-derives on the 15-second health tick —
         derived, never counted, so a reload loses nothing. Event rows
         gained the upstream entry time (tsUTC) as a tooltip on the
         detected-at column: the pair is the per-event ingest lag.
  v0.11 — Every timestamp is absolute and carries seconds — "18 Aug 2026,
         09:04:12", not "3h ago". Canon already had it: formatDateTime's
         {seconds:true}, so no canon change and no cache-bust. Relative time
         answers "is this recent", which is not a question anyone brings to a
         feed monitor; the questions here are "did this arrive before or after
         that run" and "how far behind the upstream timestamp were we", and
         both need the real clock. It was also destroying the precision the
         comparison depends on — two events 40 seconds apart both read "3h
         ago". The events column is monospaced so a run of them aligns.
  v0.10 — Substitutions name the player coming on. The feed sends the on-name
         as `playerName` (the key every event type uses for its subject) and
         the off-name as `playerOffName`; this page read a `playerOnName` that
         has never existed, so every sub read "? on for [name]". The half that
         worked is what made it hard to see — a resolving off-name looks like
         a feed problem rather than a key that was never there. Nothing
         upstream changed; `subOnPlayer` arrives populated.
  v0.9 — Run intervals come from NL.formatDuration (nl-utils v1.33), which
         this tool's humanInterval() was the flagged forerunner of (PR #808,
         second caller: travel-planner). Small visible improvement: the
         compound convention keeps the minutes its old rounding lost —
         intervals here run 60–7200s from meta config, so a 90-minute
         interval now reads "1h 30min" instead of "2 hr". A missing interval
         reads "an unknown interval" in the Overdue sentence and drops the
         "next in" clause entirely (canon's bare '—' fallback reads badly
         mid-sentence).
  v0.8 — Kick-off times come from NL.formatTime (nl-utils v1.31), the canon
         time-only formatter this tool's kickoffTime() was the flagged
         forerunner of (PR #808); the local split-the-last-word helper is
         gone.
  v0.7 — The day bar is a canon .filter-bar; the local .daybar block keeps
         only what canon does not provide (muted-text size, select width).
         Closes the last finding of PR #808, whose other two fixes landed
         with v0.6.
  v0.6 — The matchday dropdown's styling moved to canon as .nl-select
         (nl-brand.css v2.39, second use: Fan Widgets). The markup now
         carries the class and the local .daybar select rule keeps only
         layout (min-width) — the look is unchanged, it just has one
         source now.
  File: /nls-monitor/index.html

  Live view of the NLS → RTDB ingester: run health, today's matches, the event
  stream and the derived tables and scorers.

  WHY THIS EXISTS
    Step 1 of the ingester build order is "the ingester writes, nothing reads —
    run a full matchday and inspect the nodes". Inspecting them meant exporting
    JSON out of the Firebase console by hand, which is slow, easy to get wrong,
    and impossible to do while a matchday is actually happening. This is the
    inspection tool that step calls for.

    It is deliberately a MONITOR, not a consumer. Nothing here is a step
    towards a fan-facing widget, nothing depends on it, and deleting it would
    break nothing. That keeps step 1's property intact: `nls/` still has no
    consumer, so a mistake in it is invisible to fans.

  WHERE THE DATA IS
    `nls/` lives in the SEPARATE nl-widgets project, alongside the fan data and
    the feed/ fixture cache. This page therefore runs two Firebase apps: the
    default one for the nl-tools staff session, and a second named app for
    nl-widgets. It reads live over websockets rather than polling — watching a
    Saturday tick over is the point.

  HOW IT GETS IN
    Via the fanWidgetsAuth handshake (functions/fan-widgets.js): write a
    request, the trigger checks superadmin against the database, a custom token
    carrying a `staff` claim comes back, sign in to nl-widgets with it.

    That handshake lives under app-data/ops-fan-widgets/ because Fan Widgets
    was the first tool to need it. This is the second, and the mechanism is not
    really Fan Widgets' — the server gate is "is this uid a superadmin", with
    the path incidental. CANON CANDIDATE: move the request/grant pair to a
    neutral path and repoint the trigger, now there are two callers. Not done
    here because it means redeploying the trigger and editing a working tool,
    which is not this PR's business.

  Storage (RTDB):
    nl-tools:    app-data/ops-fan-widgets/authRequests|authGrants/<uid>
                 borrowed handshake, see above
    nl-widgets:  nls/meta/ingest              run health, incl. failureReasons
                 nls/meta/calendar/<comp>     which days have fixtures
                 nls/live/index/<comp>/<ymd>  the ingester's last-run day
                 nls/fixtures/<comp>/<ymd>    any other day, from the hourly run
                 nls/events/<ymd>             the event stream
                 nls/anchors/<matchID>        synthetic kick-off records (1H/2H)
                 nls/derived/tables|scorers|coverage/<comp>
                 (nls/seen is never read — internal dedup guard)

  ANY DAY, NOT JUST TODAY
    The rules grant reads per day and never at the parent, so nothing can
    discover which days exist — you have to name one. That is correct for
    bandwidth and licensing and useless for browsing, so the ingester writes
    meta/calendar/<comp> from the populatedDates NLS returns free on every list
    request, and the day bar is driven from it. live/index only ever exists for
    the day the ingester last ran; every other day comes from fixtures/.

  Access (auth-guard registry — see system/auth-guard.js):
    superadmin only. The underlying handshake refuses anyone else server-side,
    so a lower role would reach the page and then fail at sign-in; the registry
    entry stops it being visible in the first place.
-->

<style>
  /* #pageWrap default hide is in nl-brand.css; auth-guard reveals with
     style.display = 'block'. Don't clear with '' — would re-trigger the
     brand rule and re-hide the page. */

  /* Stat-card state modifiers, per the contract in nl-brand.css: layout comes
     from canon, colour is the tool's to set. */
  .stat--ok .stat__num     { color: var(--green); }
  .stat--warn .stat__num   { color: var(--amber); }
  .stat--warn              { border-left: 4px solid var(--amber); }
  .stat--bad .stat__num    { color: var(--red); }
  .stat--bad               { border-left: 4px solid var(--red); }

  /* The headline verdict. One line, readable from across a desk, because the
     question this page answers most often is "is it working right now". */
  .verdict {
    display: flex; align-items: flex-start; gap: .75rem;
    padding: 1rem 1.25rem; border-radius: var(--radius-lg);
    border: 1px solid var(--border); background: var(--navy-50);
    margin-bottom: 1.25rem;
  }
  /* Dot rides the headline, not the box centre — with a two-line banner a
     centred dot floats between the lines and reads as misalignment. */
  .verdict__dot { width: 14px; height: 14px; border-radius: 50%; flex: 0 0 auto; margin-top: .45em; }
  /* Deliberately a wide step between these two. The headline is the answer to
     "is it working", and on a Saturday it wants reading from across a desk;
     the sub-line is detail you lean in for. A close pair would make them read
     as one undifferentiated block. */
  .verdict__text { font-weight: 700; font-size: var(--text-lg); line-height: 1.3; }
  .verdict__sub  { color: var(--text-muted); font-size: var(--text-sm); }
  .verdict--ok   { background: var(--green-light); border-color: var(--green); }
  .verdict--ok   .verdict__dot { background: var(--green); }
  .verdict--warn { background: var(--amber-light); border-color: var(--amber); }
  .verdict--warn .verdict__dot { background: var(--amber); }
  /* --red, never --primary: brand red is identity, --red is the error
     semantic, and a monitor's "broken" banner is the last place to blur them. */
  .verdict--bad  { background: var(--red-light); border-color: var(--red); }
  .verdict--bad  .verdict__dot { background: var(--red); }

  /* Day navigation: a canon .filter-bar holding prev/next plus a dropdown of
     real matchdays (the canon .nl-select, promoted there from this very block
     in brand v2.39). Only the width is local — enough room for
     "day — N fixtures" without the bar jumping as the label changes. */
  .daybar .muted { font-size: var(--text-sm); }
  .daybar select { min-width: 15rem; }

  /* Fixed widths so every division's score column sits in the same place.
     table-layout: fixed is what makes the colgroup binding rather than
     advisory — without it the browser still sizes from content. */
  .matches { table-layout: fixed; width: 100%; }
  .matches .col-time  { width: 4.5rem; }
  .matches .col-score { width: 7rem; }
  .matches .col-state { width: 5.5rem; }
  .matches .col-flag  { width: 2.5rem; }
  .matches .ta-r { text-align: right; }
  .matches .ta-c { text-align: center; }
  /* Wrap, never ellipsise: "Scunt… United" told you less than letting
     Scunthorpe take a second line. Overflow stays hidden as the backstop for
     a genuinely unbreakable string. */
  .matches td { overflow: hidden; }
  .nm-pill { font-size: var(--text-xs); padding: 2px 7px; white-space: nowrap; }
  /* Penalty shoot-out on its own line, small — inline it forced the score
     column wide enough to truncate on anything narrower than a desktop. */
  .score__pens { display: block; font-weight: 400; font-size: var(--text-xs); }
  .matches .divrow th {
    text-align: left; padding-top: 1rem;
    border-bottom: 1px solid var(--border);
  }
  .matches tr:first-child .divrow th, .matches .divrow:first-child th { padding-top: 0; }

  @media (max-width: 640px) {
    .matches .col-time { width: 3.4rem; }
    .matches .col-flag { width: 1.4rem; }
    .matches .col-score { width: 4rem; }
    .matches .col-state { width: 3.9rem; }
  }

  .comp-block { margin-bottom: 1.5rem; }
  .comp-block__head {
    display: flex; align-items: baseline; gap: .6rem;
    margin: 0 0 .5rem; font-weight: 700;
  }
  .comp-block__count { color: var(--text-muted); font-weight: 400; font-size: var(--text-sm); }
  /* Inside the navy division band the muted grey was unreadable — the count
     needs the band's own light step, and a gap from the label. */
  .matches .divrow .comp-block__count { color: var(--navy-100); margin-left: .6rem; }

  .score { font-variant-numeric: tabular-nums; font-weight: 700; white-space: nowrap; }
  .crest { width: 20px; height: 20px; object-fit: contain; vertical-align: -4px; margin-right: .35rem; }
  .muted { color: var(--text-muted); }
  .mono  { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .875em; }

  /* The event feed. Ordered by detectedAt, never by match minute — a goal
     entered late would otherwise jump into the middle of the feed. */
  .ev { display: grid; grid-template-columns: 7rem 1fr auto; gap: .5rem 1rem;
        padding: .6rem 0; border-bottom: 1px solid var(--border); align-items: baseline; }
  .ev:last-child { border-bottom: 0; }
  /* One secondary size across the page; the label role is carried by weight,
     caps, tracking and colour rather than by a fourth almost-identical size. */
  .ev__type { font-weight: 700; font-size: var(--text-xs); text-transform: uppercase; letter-spacing: .06em; }
  .ev--goal .ev__type         { color: var(--green); }
  .ev--booking .ev__type      { color: var(--amber-deep); }
  .ev--substitution .ev__type { color: var(--blue); }
  .ev--lineup .ev__type       { color: var(--navy-600); }
  .ev--withdrawal .ev__type   { color: var(--red); }
  .ev--kick-off .ev__type     { color: var(--navy); }
  .ev--half-time .ev__type    { color: var(--amber-deep); }
  .ev--full-time .ev__type    { color: var(--navy-600); }
  .ev--retracted { opacity: .55; }
  .ev--retracted .ev__what { text-decoration: line-through; }
  .ev__when { color: var(--text-muted); font-size: var(--text-sm); white-space: nowrap; }

  @media (max-width: 640px) {
    .ev { grid-template-columns: 1fr; gap: .15rem; }
    .ev__when { grid-column: 1; }
  }

  .nm-note    { color: var(--text-muted); font-size: var(--text-sm); margin-top: .4rem; }
  .nm-subhead { color: var(--text-muted); font-size: var(--text-sm); margin: .75rem 0 .25rem;
                font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
  /* Scorers are two short columns; a full-width table floats the tally into
     the middle of the page with a football pitch of nothing between. */
  .scorers-table { max-width: 28rem; }
  .nm-path { min-width: 22rem; }
  .nm-out  { white-space: pre-wrap; word-break: break-word; }
</style>

<!-- Main app -->
<script>
(function () {
  'use strict';

  window.TOOL = window.TOOL || {};

  var ROOT = 'nls';
  var COMPS = [
    { key: 'nl',    label: 'National League' },
    { key: 'north', label: 'National North' },
    { key: 'south', label: 'National South' },
    { key: 'cup',   label: 'National League Cup' }
  ];

  /* THE SAME UTC DAY THE INGESTER KEYS ON. Node paths use the UTC date because
     that is what the NLS from/to window filters on. Deriving it from UK local
     time here would, on any evening after 23:00 BST, ask for tomorrow's node
     and show an empty page for a matchday that is happening. */
  function todayYmd() { return new Date().toISOString().slice(0, 10); }

  var wdb = null;                       // nl-widgets database handle
  var state = {
    ingest: null,
    calendar: {},          // compKey -> { ymd: count }, from meta/calendar
    index: {},             // today's live rows (only ever written for today)
    fixtures: {},          // the chosen day's rows, from fixtures/<comp>/<ymd>
    events: {},
    anchors: {},           // matchID -> { '1H': record, '2H': record }
    ymd: todayYmd(),
    dayPinned: false   // true once a day is chosen, so the calendar stops moving it
  };
  var dayRefs = [];        // live refs for the chosen day, detached on change
  var anchorRefs = {};     // matchID -> ref; grows as rows go live, cleared with the day
  var tab = 'today';

  var els = {
    verdict: document.getElementById('nmVerdict'),
    stats:   document.getElementById('nmStats'),
    tabs:    document.getElementById('nmTabs'),
    daybar:  document.getElementById('nmDaybar'),
    prev:    document.getElementById('nmPrev'),
    next:    document.getElementById('nmNext'),
    pick:    document.getElementById('nmDayPick'),
    dayNote: document.getElementById('nmDayNote'),
    today:   document.getElementById('nmToday'),
    events:  document.getElementById('nmEvents'),
    derived: document.getElementById('nmDerived'),
    raw:     document.getElementById('nmRaw')
  };

  /* nl-utils loads synchronously in the head; a fallback that skipped
     escaping would be an XSS hole pretending to be resilience. */
  var esc = NL.escHtml;

  // -------------------------------------------------------------------------
  // Boot
  // -------------------------------------------------------------------------

  window.TOOL.boot = function (session) {
    var uid = session && session.uid;
    if (!uid) { verdict('bad', 'No session', 'Try reloading the page.'); return; }

    handshake(uid).then(function (token) {
      return firebase.auth(widgetsApp).signInWithCustomToken(token);
    }).then(function () {
      wdb = firebase.database(widgetsApp);
    }).then(function () {
      els.stats.hidden = false;
      els.tabs.hidden = false;
      listen();
    }).catch(function (err) {
      var msg = (err && err.message) ? err.message : String(err);
      verdict('bad', 'Could not read nl-widgets', msg);
      /* PERMISSION_DENIED here is almost always the rules, not the token.
         nl-widgets rules ship from the repo like everything else — Actions →
         Deploy RTDB rules, target nl-widgets — so a denied read means that
         has not been run since the nls/ block last changed. This comment and
         the message below said "paste into the console by hand" until
         19/08/2026, months after the workflow gained its nl-widgets target,
         and the stale advice duly misdirected a session. */
      if (/permission_denied/i.test(msg)) {
        verdict('bad', 'Permission denied on nls/',
          'The nls/ rules have not been published since they last changed — Actions → “Deploy RTDB rules”, target nl-widgets, type publish.');
      }
    });
  };

  /* Borrowed from the Fan Widgets tool — see the file header for why, and for
     the canon-promotion note. Write a request, wait for the grant, clean up. */
  function handshake(uid) {
    var reqRef   = db.ref('app-data/ops-fan-widgets/authRequests/' + uid);
    var grantRef = db.ref('app-data/ops-fan-widgets/authGrants/' + uid);
    return NL.ensureAuth().then(function () {
      return grantRef.remove().catch(function () {});
    }).then(function () {
      return new Promise(function (resolve, reject) {
        var settled = false;
        var timer = setTimeout(function () {
          if (settled) return;
          settled = true; grantRef.off();
          reject(new Error('The server did not respond within 30s. The fanWidgetsAuth function may not be deployed.'));
        }, 30000);

        grantRef.on('value', function (snap) {
          var v = snap.val();
          if (!v || settled) return;
          settled = true; clearTimeout(timer); grantRef.off();
          grantRef.remove().catch(function () {});
          if (v.ok && v.customToken) resolve(v.customToken);
          else reject(new Error(v.error === 'not-superadmin'
            ? 'This tool is superadmin only.'
            : ('Token request failed: ' + (v.error || 'unknown'))));
        });

        reqRef.set({ ts: Date.now() }).catch(function (e) {
          if (settled) return;
          settled = true; clearTimeout(timer); grantRef.off(); reject(e);
        });
      });
    });
  }

  // -------------------------------------------------------------------------
  // Live subscriptions — websockets, not polling. Watching a Saturday tick
  // over is the whole point of the ingester, so this page should show it.
  // -------------------------------------------------------------------------

  function listen() {
    wdb.ref(ROOT + '/meta/ingest').on('value', function (s) {
      state.ingest = s.val();
      renderHealth();
    }, onErr);

    /* The season matchday calendar, written by the ingester from the free
       `populatedDates` NLS returns on every list request. It is the only way
       to discover WHICH days have fixtures: the rules grant reads per day and
       never at the parent, so without this you would be guessing at dates. */
    COMPS.forEach(function (c) {
      wdb.ref(ROOT + '/meta/calendar/' + c.key).on('value', function (s) {
        var v = s.val();
        state.calendar[c.key] = (v && v.days) || {};
        /* Land on a day that has games. Opening on an empty today and leaving
           someone to hunt for a matchday is a date picker pretending to be an
           answer. Only until the day is pinned by an actual choice — after
           that, a late-arriving calendar must not yank the page away. */
        if (!state.dayPinned) {
          var best = nearestMatchday();
          if (best && best !== state.ymd) { selectDay(best); return; }
        }
        renderDaybar();
      }, function () { /* absent until the first successful run */ });
    });

    selectDay(state.ymd);

    /* Re-check the verdict on a timer as well as on data: "no successful run
       for six minutes" is a state that arrives through the passage of time,
       not through a write, so a purely event-driven page would sit there
       looking green while the ingester was dead. The derived clock rides the
       same tick — it too is a function of the wall clock, not of a write,
       and 15s keeps a floor-to-the-minute display at worst 15s late. */
    setInterval(function () {
      renderHealth();
      if (tab === 'today' && anyLive()) renderToday();
    }, 15000);
  }

  /* Subscribing to a day means detaching the last one. Without this, moving
     back through a season would leave a listener attached per day visited,
     each still billing egress on every write. */
  function detachDay() {
    dayRefs.forEach(function (r) { r.off(); });
    dayRefs = [];
    Object.keys(anchorRefs).forEach(function (id) { anchorRefs[id].off(); });
    anchorRefs = {};
  }

  function selectDay(ymd) {
    detachDay();
    state.ymd = ymd;
    state.index = {};
    state.fixtures = {};
    state.events = {};
    state.anchors = {};

    COMPS.forEach(function (c) {
      /* Exactly the granted slices — <comp>/<ymd>, never the parent. That
         depth is deliberate: a consumer names the day it wants rather than
         subscribing to the season.

         Two sources, because they hold different things. live/index is only
         ever written for the day the ingester last ran, and carries the live
         minute; fixtures/ is the season, written hourly, and is what any past
         or future day has. Live wins where both exist. */
      var idx = wdb.ref(ROOT + '/live/index/' + c.key + '/' + ymd);
      idx.on('value', function (s) {
        state.index[c.key] = s.val() || {};
        syncAnchorSubs();
        if (tab === 'today') renderToday();
      }, onErr);
      dayRefs.push(idx);

      var fx = wdb.ref(ROOT + '/fixtures/' + c.key + '/' + ymd);
      fx.on('value', function (s) {
        state.fixtures[c.key] = s.val() || {};
        syncAnchorSubs();
        if (tab === 'today') renderToday();
      }, onErr);
      dayRefs.push(fx);
    });

    var ev = wdb.ref(ROOT + '/events/' + ymd);
    ev.on('value', function (s) {
      state.events = s.val() || {};
      if (tab === 'events') renderEvents();
      renderHealth();
    }, onErr);
    dayRefs.push(ev);

    renderDaybar();
    renderToday();
    if (tab === 'events') renderEvents();
  }

  /* One merged view of the chosen day — fixtures/ as the base, live rows on
     top — shared by the table renderer, the anchor subscriber and the tick. */
  function dayRows(compKey) {
    return Object.assign({}, state.fixtures[compKey] || {}, state.index[compKey] || {});
  }

  /* Anchor subscriptions cover EVERY match on the selected day, not just the
     live ones — the backfill gives past matchdays their derived kick-offs,
     and the Events tab renders kick-off lines from these records whatever
     state the match is in now. anchors/ is granted per match — like every
     nls/ read, you name what you want — and the node is a few hundred bytes,
     so a full card costs little. A read failure here means the anchors grant
     has not been published yet (Actions → Deploy RTDB rules); the page just
     shows upstream's minute and no kick-off lines, so it is not fatal. */
  function syncAnchorSubs() {
    COMPS.forEach(function (c) {
      var rows = dayRows(c.key);
      Object.keys(rows).forEach(function (id) {
        if (anchorRefs[id]) return;
        var ref = wdb.ref(ROOT + '/anchors/' + id);
        anchorRefs[id] = ref;
        ref.on('value', function (s) {
          state.anchors[id] = s.val();
          if (tab === 'today') renderToday();
          if (tab === 'events') renderEvents();
        }, function () { /* no grant yet — upstream minute stands in */ });
      });
    });
  }

  /* The anchor records rendered as feed lines. Synthetic and display-only:
     the RTDB event stream stays append-only player events, while an anchor
     REVISES backwards — so kick-off lines are derived at render time and
     always show the current best time rather than a superseded one. Slotted
     into the feed by when the anchor was first observed (the flip), which is
     the same "when we knew" semantic detectedAt carries. */
  function anchorEventRows() {
    var names = {};
    COMPS.forEach(function (c) {
      var rows = dayRows(c.key);
      Object.keys(rows).forEach(function (id) {
        var r = rows[id];
        names[id] = ((r.home && r.home.name) || '?') + ' v ' + ((r.away && r.away.name) || '?');
      });
    });
    var out = [];
    Object.keys(state.anchors || {}).forEach(function (id) {
      var a = state.anchors[id];
      if (!a) return;
      ['1H', '2H'].forEach(function (slot) {
        var rec = a[slot];
        if (!rec || !rec.anchorUTC) return;
        out.push({
          type: 'kick-off',
          slot: slot,
          anchorUTC: rec.anchorUTC,
          source: rec.source,
          confidence: rec.confidence,
          ingestLagMs: rec.ingestLagMs,
          fixture: names[id] || id,
          detectedAt: Date.parse(rec.listFlipUTC || rec.anchorUTC)
        });
      });
      /* The rest of the ledger. Flips INTO a half are skipped here — the
         kick-off line above already carries them, corrected — so what's left
         is half time, full time, and the oddities (abandoned, extra time, a
         wobble back to pre-match), each an observation and shown as one. */
      (Array.isArray(a.transitions) ? a.transitions : []).forEach(function (t) {
        if (!t || !t.to || t.to === 'firsthalf' || t.to === 'secondhalf') return;
        out.push({
          type: t.to === 'halftime' ? 'half-time'
            : t.to === 'fulltime' ? 'full-time'
              : t.to === 'postmatch' ? 'post-match' : t.to,
          fixture: names[id] || id,
          from: t.from || null,
          detectedAt: Date.parse(t.observedUTC)
        });
      });
    });
    return out;
  }

  function anyLive() {
    return COMPS.some(function (c) {
      var rows = dayRows(c.key);
      return Object.keys(rows).some(function (id) { return rows[id].live; });
    });
  }

  /* Every date that has fixtures in any competition, ascending. */
  function allMatchdays() {
    var set = {};
    COMPS.forEach(function (c) {
      Object.keys(state.calendar[c.key] || {}).forEach(function (d) {
        set[d] = (set[d] || 0) + state.calendar[c.key][d];
      });
    });
    return Object.keys(set).sort().map(function (d) { return { ymd: d, count: set[d] }; });
  }

  /* Today if it has games; otherwise the most recent day that did — results
     are more use than an empty page — and only if there is no past at all,
     the next day coming. */
  function nearestMatchday() {
    var days = allMatchdays();
    if (!days.length) return null;
    var t = todayYmd();
    if (days.some(function (d) { return d.ymd === t; })) return t;
    var past = days.filter(function (d) { return d.ymd < t; });
    if (past.length) return past[past.length - 1].ymd;
    return days[0].ymd;
  }

  function renderDaybar() {
    var days = allMatchdays();
    els.daybar.hidden = false;

    if (!days.length) {
      els.pick.innerHTML = '<option>No calendar yet</option>';
      els.pick.disabled = true;
      els.prev.disabled = els.next.disabled = true;
      els.dayNote.textContent =
        'The matchday calendar arrives with the first successful run.';
      return;
    }

    els.pick.disabled = false;
    els.pick.innerHTML = days.map(function (d) {
      return '<option value="' + esc(d.ymd) + '"' + (d.ymd === state.ymd ? ' selected' : '') + '>' +
        esc(NL.formatDateShort(d.ymd)) + ' — ' + d.count + ' match' + (d.count === 1 ? '' : 'es') +
        '</option>';
    }).join('');

    var i = days.findIndex(function (d) { return d.ymd === state.ymd; });
    var before = days.filter(function (d) { return d.ymd < state.ymd; });
    var after  = days.filter(function (d) { return d.ymd > state.ymd; });
    els.prev.disabled = !before.length;
    els.next.disabled = !after.length;
    els.prev.dataset.ymd = before.length ? before[before.length - 1].ymd : '';
    els.next.dataset.ymd = after.length ? after[0].ymd : '';

    els.dayNote.textContent = i === -1
      ? 'No fixtures on this date — ' + days.length + ' matchdays in the season.'
      : (days.length + ' matchdays in the season');
  }

  els.prev.addEventListener('click', function () {
    if (this.dataset.ymd) { state.dayPinned = true; selectDay(this.dataset.ymd); }
  });
  els.next.addEventListener('click', function () {
    if (this.dataset.ymd) { state.dayPinned = true; selectDay(this.dataset.ymd); }
  });
  els.pick.addEventListener('change', function () { state.dayPinned = true; selectDay(this.value); });

  function onErr(err) {
    var msg = (err && err.message) ? err.message : String(err);
    verdict('bad', 'Read failed', msg);
  }

  // -------------------------------------------------------------------------
  // Health
  // -------------------------------------------------------------------------

  function verdict(level, text, sub) {
    els.verdict.className = 'verdict verdict--' + level;
    els.verdict.innerHTML =
      '<span class="verdict__dot"></span><span>' +
      '<span class="verdict__text">' + esc(text) + '</span><br>' +
      '<span class="verdict__sub">' + esc(sub || '') + '</span></span>';
  }

  function renderHealth() {
    var m = state.ingest;
    if (!m) {
      verdict('warn', 'No run recorded yet',
        'nls/meta/ingest is empty. The scheduled functions may not have run since deploying.');
      els.stats.innerHTML = '';
      return;
    }

    var now = Date.now();
    var sinceRun = now - (m.lastRun || 0);
    var allFailed = (m.errorCount || 0) >= COMPS.length;
    var active = m.mode === 'live' || m.mode === 'prematch' || m.mode === 'cooldown';

    if (allFailed) {
      /* The reason, on screen. It used to say "check Cloud Logging", which was
         both a worse tool and — until the logger field name was fixed — a
         pointer to a line that had had its cause clobbered. */
      var reasons = m.failureReasons || {};
      var first = Object.keys(reasons).map(function (k) { return reasons[k]; })[0];
      verdict('bad', 'Upstream unreachable',
        first || 'Every competition fetch failed on the last run. RTDB and scheduling are fine — this is the NLServices API.');
    } else if (active && !m.lastSuccess) {
      verdict('bad', 'Running, but nothing has succeeded', 'No successful ingest recorded.');
    } else if (active && (now - m.lastSuccess) > 5 * 60 * 1000) {
      verdict('bad', 'Stale during a live window',
        'Last success ' + NL.formatDateTime(m.lastSuccess, { seconds: true }) +
        '. Anything reading this is showing old data.');
    } else if (m.errorCount) {
      verdict('warn', 'Partial failure',
        (m.failedCompetitions || []).join(', ') + ' failed; the rest were written and the failed one keeps its last known value.');
    } else if (sinceRun > Math.max(2 * (m.intervalSec || 3600) * 1000, 5 * 60 * 1000)) {
      /* Canon formatDuration answers '—' for a missing interval; this
         sentence needs a word there ('every —' reads like a typo), so the
         caller supplies it. */
      verdict('warn', 'Overdue',
        'Last run ' + NL.formatDateTime(m.lastRun, { seconds: true }) +
        ', but it asked to run every ' +
        (m.intervalSec ? NL.formatDuration(m.intervalSec) : 'an unknown interval') + '.');
    } else {
      verdict('ok', modeLabel(m.mode),
        'Last run ' + NL.formatDateTime(m.lastRun, { seconds: true }) +
        (m.intervalSec ? ' · next in ' + NL.formatDuration(m.intervalSec) : '') +
        ' · season ' + esc(m.season) + ' · took ' + (m.durationMs || 0) + 'ms');
    }

    els.stats.innerHTML = [
      stat(m.matchesToday || 0, 'Matches today'),
      stat(m.liveCount || 0, 'In play', m.liveCount ? 'ok' : ''),
      stat(m.detailFetched || 0, 'Detail fetched last run'),
      stat(m.eventsCreated || 0, 'Events last run', m.eventsCreated ? 'ok' : ''),
      stat(Object.keys(state.events || {}).length, 'Events today'),
      stat(m.errorCount || 0, 'Errors', (m.errorCount ? 'bad' : 'ok'))
    ].join('');
  }

  function stat(num, label, mod) {
    return '<div class="stat' + (mod ? ' stat--' + mod : '') + '">' +
      '<div class="stat__num">' + esc(num) + '</div>' +
      '<div class="stat__label">' + esc(label) + '</div></div>';
  }

  function modeLabel(mode) {
    if (mode === 'live') return 'Live — polling every minute';
    if (mode === 'prematch') return 'Pre-match — collecting team news';
    if (mode === 'cooldown') return 'Post-match — catching late entries';
    return 'Idle — nothing due';
  }

  // -------------------------------------------------------------------------
  // Today
  // -------------------------------------------------------------------------

  function renderToday() {
    /* ONE TABLE FOR EVERY DIVISION, with fixed column widths.
       Rendering a table per competition let each one size its own columns
       from its own content, so the score column landed in a different place
       in every block and the eye had to re-find it four times. Divisions are
       header rows inside one table instead. */
    var blocks = [];

    COMPS.forEach(function (c) {
      /* Merge the two sources. fixtures/ is the season and is what any day
         other than the ingester's last run has; live/index carries the live
         minute and only ever exists for that run's day. Live wins on the
         matches it has, so a past day still renders and today still ticks. */
      var rows = Object.values(dayRows(c.key));
      if (!rows.length) return;
      rows.sort(function (a, b) { return String(a.ko).localeCompare(String(b.ko)); });
      blocks.push({ comp: c, rows: rows });
    });

    if (!blocks.length) { els.today.innerHTML = emptyDay(); return; }

    var html = '<div class="table-wrap"><table class="table table--compact matches">' +
      '<colgroup>' +
        '<col class="col-time"><col class="col-team"><col class="col-score">' +
        '<col class="col-team"><col class="col-state"><col class="col-flag">' +
      '</colgroup><tbody>';

    blocks.forEach(function (b) {
      html += '<tr class="divrow"><th colspan="6">' + esc(b.comp.label) +
        '<span class="comp-block__count">' + b.rows.length + ' match' +
        (b.rows.length === 1 ? '' : 'es') + '</span></th></tr>';

      b.rows.forEach(function (r) {
        html += '<tr>' +
          '<td class="muted mono">' + esc(NL.formatTime(r.ko)) + '</td>' +
          '<td class="ta-r">' + side(r.home) + '</td>' +
          '<td class="score ta-c">' + scoreOf(r) + '</td>' +
          '<td>' + side(r.away, true) + '</td>' +
          '<td>' + periodPill(r) + '</td>' +
          '<td class="muted mono">' + (r.lineupComplete ? 'XI' : '') + '</td>' +
          '</tr>';
      });
    });

    els.today.innerHTML = html + '</tbody></table></div>';
  }

  /* Three different reasons a day can be blank, and conflating them is how a
     working ingester gets reported as broken. */
  function emptyDay() {
    var m = state.ingest;
    var known = allMatchdays().some(function (d) { return d.ymd === state.ymd; });

    if (m && m.errorCount >= COMPS.length) {
      return '<div class="empty-state">Nothing has been written for any day yet — ' +
        'every fetch on the last run failed, so this is not "no fixtures".</div>';
    }
    if (known) {
      return '<div class="empty-state">' + esc(NL.formatDateShort(state.ymd)) +
        ' has fixtures upstream, but nothing has been written for it. The season ' +
        'fixture node is filled by the hourly run.</div>';
    }
    return '<div class="empty-state">No fixtures on ' + esc(NL.formatDateShort(state.ymd)) +
      '. Use the matchday dropdown to jump to a day that has some.</div>';
  }

  function side(t, after) {
    if (!t) return '';
    var crest = t.crest
      ? '<img class="crest" src="' + esc(t.crest) + '" alt="" onerror="this.style.display=\'none\'">'
      : '';
    return after ? crest + esc(t.name) : esc(t.name) + ' ' + crest;
  }

  /* En-dash for a match that has not produced a score, matching the display
     convention the rest of the repo uses. The period is the master switch —
     a finished match's minute is already null by the time it reaches here,
     because the ingester stripped it. */
  function scoreOf(r) {
    if (r.postponed) return 'P–P';
    if (r.period === 'abandoned') return 'A–A';
    var h = r.home && r.home.score, a = r.away && r.away.score;
    if (h == null || a == null) return '<span class="muted">v</span>';
    var s = esc(h) + '–' + esc(a);
    if (r.home.penScore != null) {
      s += '<span class="score__pens muted">' + esc(r.home.penScore) + '–' + esc(r.away.penScore) + ' pens</span>';
    }
    return s;
  }

  /* THE CLOCK IS DERIVED, NEVER COUNTED. elapsed = now \u2212 anchorUTC, +45:00 in
     the second half; floored to minutes; capped at 45'+n / 90'+n and frozen
     at the cap through half time. Clock state lives on the anchor record
     (functions/nls/anchors.js holds the method and its tests), so a reload
     of this page loses nothing. Null wherever the model makes no claim \u2014
     no anchor yet, extra time, penalties \u2014 and the caller falls back to
     upstream's minute. */
  function anchorClock(anchors, period) {
    if (!anchors) return null;
    var a1 = anchors['1H'] && Date.parse(anchors['1H'].anchorUTC);
    var a2 = anchors['2H'] && Date.parse(anchors['2H'].anchorUTC);
    var m;
    if (period === 'firsthalf' && a1) {
      m = Math.max(0, Math.floor((Date.now() - a1) / 60000));
      return { text: m > 45 ? "45'+" + (m - 45) : m + "'", rec: anchors['1H'] };
    }
    if (period === 'halftime' && a1) {
      return { text: "45'", rec: anchors['1H'] };
    }
    if (period === 'secondhalf' && a2) {
      m = 45 + Math.max(0, Math.floor((Date.now() - a2) / 60000));
      return { text: m > 90 ? "90'+" + (m - 90) : m + "'", rec: anchors['2H'] };
    }
    return null;
  }

  function periodPill(r) {
    if (r.live) {
      var clock = anchorClock(state.anchors[r.id], r.period);
      if (clock) {
        /* The tooltip is the inspection surface: which anchor the minute
           hangs off, what upstream claims alongside, and \u2014 where an event
           has corrected a list flip \u2014 the measured kick-off ingest lag. */
        var tip = 'Clock from the ' + (clock.rec.source || '?') + ' anchor (' +
          (clock.rec.confidence || '?') + ' confidence) \u00b7 upstream says ' +
          (r.formattedMinute || (r.minute != null ? r.minute + "'" : '\u2014'));
        if (clock.rec.ingestLagMs > 0) {
          tip += ' \u00b7 list flip trailed kick-off by ' +
            NL.formatDuration(Math.round(clock.rec.ingestLagMs / 1000));
        }
        return '<span class="pill nm-pill pill--live" title="' + esc(tip) + '">' +
          esc(clock.text) + '</span>';
      }
      return '<span class="pill nm-pill pill--live">' + esc(r.formattedMinute || r.minute + "'") + '</span>';
    }
    if (r.postponed) return '<span class="pill nm-pill pill--postponed" title="Postponed">P\u2013P</span>';
    if (r.finished) return '<span class="pill nm-pill">FT</span>';
    return '<span class="pill nm-pill pill--pending">' + esc(r.period || 'pre') + '</span>';
  }

  // -------------------------------------------------------------------------
  // Events
  // -------------------------------------------------------------------------

  function renderEvents() {
    var list = Object.values(state.events || {}).concat(anchorEventRows());
    if (!list.length) {
      /* Empty here is usually correct rather than broken, and saying which is
         the difference between a tool and a shrug. Events exist only for days
         the ingester actually watched: they are detected by diffing one poll
         against the last, so they cannot be backfilled for a day that has
         already happened. */
      els.events.innerHTML = '<div class="empty-state">No events for ' +
        esc(NL.formatDateShort(state.ymd)) + '. Events are detected live by ' +
        'comparing one poll to the last, so a day the ingester did not watch ' +
        'has none and cannot be given any retrospectively.</div>';
      return;
    }

    /* ORDERED BY detectedAt, NEVER BY MINUTE. A goal scored at 67' can reach
       the feed at 15:52 because an official was slow entering it; sorting by
       the match minute would drop it into the middle of the feed as though it
       had just been missed. detectedAt is when we first saw it, which is the
       only honest order for a feed. */
    list.sort(function (a, b) { return (b.detectedAt || 0) - (a.detectedAt || 0); });

    els.events.innerHTML = list.map(function (e) {
      var who = e.playerName || e.teamName || '';
      var what = '';
      if (e.type === 'goal') {
        what = who + (e.isPenalty ? ' (pen)' : '') + (e.isOwnGoal ? ' (og)' : '') +
          ' — ' + e.homeTeam + ' ' + e.homeScore + '\u2013' + e.awayScore + ' ' + e.awayTeam;
      } else if (e.type === 'booking') {
        what = who + ' — ' + (e.cardType || 'card');
      } else if (e.type === 'substitution') {
        /* The player coming ON is `playerName`, not `playerOnName` — an event
           record names its subject in `playerName` whatever the type, exactly
           as goals and bookings do above, and the substitution adds
           `playerOffName` for the second person. There is no `playerOnName`
           key and never was, so reading one rendered '?' for every sub since
           the events feed shipped. Half a symptom is worse than none: the off
           name resolved, which made the feed look like it was working on data
           that was arriving fine all along. */
        what = (who || '?') + ' on for ' + (e.playerOffName || '?');
      } else if (e.type === 'lineup') {
        what = (e.teamName || '') + ' team news' + (e.formation ? ' — ' + e.formation : '');
      } else if (e.type === 'withdrawal') {
        what = who + ' withdrawn from the XI';
      } else if (e.type === 'kick-off') {
        /* Synthetic, from the anchor record — see anchorEventRows. */
        what = (e.slot === '2H' ? 'Second half under way' : 'Kick-off') + ' — ' +
          e.fixture + ' · derived ' + NL.formatDateTime(e.anchorUTC, { seconds: true }) +
          ' (' + (e.source || '?') + ', ' + (e.confidence || '?') + ')' +
          (e.ingestLagMs > 0
            ? ' · list flip lagged by ' + NL.formatDuration(Math.round(e.ingestLagMs / 1000))
            : '');
      } else if (e.fixture) {
        /* A ledger transition — half time, full time, or an oddity. The
           observation time is the whole record, and it sits in the
           detected-at column where it belongs. */
        what = e.fixture + (e.from ? ' (from ' + e.from + ')' : '');
      }
      var minute = e.formattedMinute ? ' <span class="muted mono">' + esc(e.formattedMinute) + '</span>' : '';
      return '<div class="ev ev--' + esc(e.type) + (e.retracted ? ' ev--retracted' : '') + '">' +
        '<span class="ev__type">' + esc(e.type) + '</span>' +
        '<span class="ev__what">' + esc(what) + minute +
          (e.retracted ? ' <span class="muted">(retracted upstream)</span>' : '') + '</span>' +
        /* ABSOLUTE, TO THE SECOND — not '3h ago'. This column exists to be
           compared: against the upstream eventTimestamp, against the ingest
           run that should have caught it, against another event in the same
           list. Relative time answers "is this recent", which is not a
           question anyone brings to a feed monitor, and it silently loses the
           precision the comparison needs — two events 40 seconds apart both
           read '3h ago'. Where the record carries the upstream entry time
           (tsUTC), it rides the tooltip: this time against that one IS the
           per-event ingest lag. */
        '<span class="ev__when mono"' +
          (e.tsUTC ? ' title="' + esc('Entered upstream ' +
            NL.formatDateTime(e.tsUTC, { seconds: true })) + '"' : '') + '>' +
          esc(NL.formatDateTime(e.detectedAt, { seconds: true })) + '</span>' +
        '</div>';
    }).join('');
  }

  // -------------------------------------------------------------------------
  // Derived
  // -------------------------------------------------------------------------

  function renderDerived() {
    els.derived.innerHTML = '<div class="loading-row">Loading tables and scorers…</div>';
    Promise.all(COMPS.map(function (c) {
      return Promise.all([
        wdb.ref(ROOT + '/derived/tables/' + c.key).once('value'),
        wdb.ref(ROOT + '/derived/scorers/' + c.key).once('value'),
        wdb.ref(ROOT + '/derived/coverage/' + c.key).once('value')
      ]).then(function (snaps) {
        return { comp: c, table: snaps[0].val(), scorers: snaps[1].val(), cov: snaps[2].val() };
      });
    })).then(function (all) {
      var html = all.map(derivedBlock).join('');
      els.derived.innerHTML = html ||
        '<div class="empty-state">Nothing derived yet. Tables come from the ' +
        'hourly run; scorers accumulate from goals detected live, so they stay ' +
        'empty until the ingester has watched a matchday.</div>';
    }).catch(function (e) {
      els.derived.innerHTML = '<div class="empty-state">Could not read derived nodes: ' + esc(e.message) + '</div>';
    });
  }

  function derivedBlock(d) {
    if (!d.table && !d.scorers && !d.cov) return '';
    var html = '<div class="comp-block"><div class="comp-block__head">' + esc(d.comp.label);

    /* `basis` is the honest bit: 'official' is a settled table, 'official+live'
       has in-play matches applied on top and will move again. */
    if (d.table && d.table.basis) {
      html += '<span class="comp-block__count">' + esc(d.table.basis) +
        (d.table.liveMatchesApplied ? ' · ' + d.table.liveMatchesApplied + ' in play' : '') + '</span>';
    }
    html += '</div>';

    var rows = (d.table && d.table.rows) || [];
    if (rows.length) {
      html += '<div class="table-wrap"><table class="table table--compact"><thead><tr>' +
        '<th>#</th><th>Team</th><th>P</th><th>GD</th><th>Pts</th></tr></thead><tbody>' +
        rows.slice(0, 6).map(function (r) {
          return '<tr><td>' + esc(r.pos) + '</td><td>' + esc(r.team) + '</td><td>' + esc(r.played) +
            '</td><td>' + esc(r.goalDifference) + '</td><td><strong>' + esc(r.points) + '</strong></td></tr>';
        }).join('') + '</tbody></table></div>';
    } else if (d.table && d.table.groups) {
      html += '<div class="muted">' + Object.keys(d.table.groups).length + ' cup group(s) recorded.</div>';
    }

    var sc = Object.values(d.scorers || {})
      .sort(function (a, b) { return b.goals - a.goals; }).slice(0, 5);
    if (!sc.length) {
      html += '<div class="nm-note">No scorers yet — ' +
        'the tally is built from goals detected live, not fetched.</div>';
    }
    if (sc.length) {
      html += '<div class="nm-subhead">Top scorers — from detected events</div>' +
        '<div class="table-wrap"><table class="table table--compact scorers-table"><tbody>' +
        sc.map(function (s) {
          return '<tr><td>' + esc(s.scorer) + '</td><td>' + esc(s.goals) +
            (s.penalties ? ' <span class="muted">(' + esc(s.penalties) + ' pen)</span>' : '') + '</td></tr>';
        }).join('') + '</tbody></table></div>';
    }

    /* The coverage gap, shown rather than hidden. A scorer tally that silently
       under-reports because clubs never entered goal events is worse than one
       that says so. */
    if (d.cov) {
      var gap = d.cov.goalsUnaccounted || 0;
      var pending = d.cov.pendingBackfillDays || 0;
      /* Two very different things, and calling both "unaccounted" blamed the
         upstream for matches we had simply never fetched. */
      var why = pending
        ? ' — <strong>' + gap + ' still to load</strong> (' + pending +
          ' matchday' + (pending === 1 ? '' : 's') + ' left to backfill)'
        : (gap ? ' — <strong>' + gap + ' with no scorer recorded upstream</strong>' : '');
      html += '<div class="nm-note">' +
        esc(d.cov.goalsAccounted) + ' of ' + esc(d.cov.goalsScored) + ' goals have a named scorer' +
        why + '</div>';
    }

    return html + '</div>';
  }

  // -------------------------------------------------------------------------
  // Raw — the escape hatch, so an unexpected shape can be read without going
  // to the Firebase console.
  // -------------------------------------------------------------------------

  function renderRaw() {
    if (els.raw.dataset.built) return;
    els.raw.dataset.built = '1';
    els.raw.innerHTML =
      '<div class="filter-bar">' +
      '<label class="filter-label" for="nmPath">Path under nls/</label>' +
      '<input id="nmPath" class="mono nm-path" value="meta/ingest">' +
      '<button class="btn btn--primary btn--sm" id="nmGo" type="button">Read</button>' +
      '<button class="btn btn--ghost btn--sm" id="nmCopy" type="button">Copy</button>' +
      '</div><pre id="nmOut" class="mono nm-out"></pre>';

    var out = document.getElementById('nmOut');
    var path = document.getElementById('nmPath');

    document.getElementById('nmGo').addEventListener('click', function () {
      var p = String(path.value || '').replace(/^\/+|\/+$/g, '');
      /* seen/ is the internal dedup guard and is granted to nobody. Saying so
         is friendlier than letting the read fail with PERMISSION_DENIED. */
      if (/^seen(\/|$)/.test(p)) {
        out.textContent = 'nls/seen is an internal dedup guard and is deliberately not readable.';
        return;
      }
      out.textContent = 'Reading nls/' + p + '…';
      wdb.ref(ROOT + '/' + p).once('value').then(function (s) {
        out.textContent = JSON.stringify(s.val(), null, 2) || 'null';
      }).catch(function (e) { out.textContent = e.message; });
    });

    document.getElementById('nmCopy').addEventListener('click', function () {
      NL.copy(out.textContent).then(function () { NL.toast('Copied', 'success'); });
    });
  }

  // -------------------------------------------------------------------------
  // Tabs
  // -------------------------------------------------------------------------

  els.tabs.addEventListener('click', function (e) {
    var btn = e.target.closest('.tab');
    if (!btn) return;
    tab = btn.dataset.tab;
    [].forEach.call(els.tabs.querySelectorAll('.tab'), function (t) {
      t.classList.toggle('active', t === btn);
    });
    els.today.hidden = tab !== 'today';
    els.events.hidden = tab !== 'events';
    els.derived.hidden = tab !== 'derived';
    els.raw.hidden = tab !== 'raw';
    if (tab === 'today') renderToday();
    if (tab === 'events') renderEvents();
    if (tab === 'derived') renderDerived();
    if (tab === 'raw') renderRaw();
  });
  els.tabs.querySelector('.tab').classList.add('active');

  /* If auth-guard fired before this script loaded, replay the session. */
  if (window._toolDeferredSession) {
    window.TOOL.boot(window._toolDeferredSession);
    delete window._toolDeferredSession;
  }
})();
</script>

</body>
</html>
