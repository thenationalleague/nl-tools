<!DOCTYPE html>
<!--
  club-roster/index.html  v1.1
  Public club ROSTER collection — GUIDED WIZARD (capability-URL pattern).
  Sibling of club-data. Gathers a club's people directory for club-directory.

  v1.1 (16/06/2026) — rebuilt from the v1.0 single page into a stepped wizard,
  per club feedback ("too much manual work, not enough handholding"):
    - Step 1 You · Step 2 Shared inboxes (add → pick function → email/phone,
      ext optional) · Steps 3–N one DEPARTMENT GROUP per screen (paired 2-up:
      Ownership&board, Exec&secretary, Finance, Commercial&ticketing,
      Media&community, Matchday&team-ops, Medical&safeguarding, Liaison
      officers, Anyone else) · final COVERAGE GRID then submit.
    - A persistent stepper shows done / current / upcoming the whole way.
    - People entered BY DEPARTMENT, so mailing-list membership DERIVES
      (section -> list) — no per-person list ticking. The end grid is a pure
      coverage check (green = someone given, amber = empty -> tap to jump back).
    - Starts blank (no prefill), localStorage-backed draft, write-once submit.
  Submission shape: { club, yourName, yourEmail, submittedAt,
    inboxes:{<listKey>:{email,phone,ext}}, people:[{section,roleKey?,name,
    title,email,phone,ext}] }. Section keys + list keys mirror club-directory
    so a later (manual, review-gated) import maps straight across.
  NOT a gated tool (no auth-guard) — out of lint-tools scope by design.
-->

<style>
  body { margin:0; background: var(--off-white); color: var(--text); }
  .rw { max-width: 820px; margin: 0 auto; padding: 0 0 40px; }
  .ri-gate { text-align:center; padding: 80px 20px; color: var(--text-muted); }

  /* Hero */
  .ri-hero { background: linear-gradient(135deg, var(--navy) 0%, var(--navy-600) 60%, var(--primary) 160%); color: var(--white); padding: 22px 24px; display: flex; align-items: center; gap: 16px; }
  .ri-hero__crest { width: 56px; height: 56px; object-fit: contain; background: var(--white); border-radius: 8px; padding: 5px; flex-shrink: 0; }
  .ri-hero__t h1 { margin: 0; font-size: 22px; font-variation-settings:'wght' 900; color: var(--white); }
  .ri-hero__t .kicker { font-size: 11px; text-transform: uppercase; letter-spacing: .14em; color: var(--navy-100); }

  /* Stepper */
  .ri-stepper { position: sticky; top: 0; z-index: 5; background: var(--white); border-bottom: 1px solid var(--border); padding: 12px 16px 0; }
  .ri-stepbar { height: 5px; background: var(--navy-50); border-radius: 3px; overflow: hidden; margin-bottom: 10px; }
  .ri-stepbar__fill { height: 100%; background: var(--primary); border-radius: 3px; transition: width .25s; }
  .ri-steps { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: thin; }
  .ri-step { flex: none; font-size: 11.5px; padding: 5px 11px; border-radius: 20px; cursor: pointer; white-space: nowrap; border: 1px solid var(--border); background: var(--off-white); color: var(--text-muted); display: flex; align-items: center; gap: 6px; }
  .ri-step.is-done { color: var(--green); border-color: var(--green); background: var(--white); }
  .ri-step.is-current { background: var(--navy); border-color: var(--navy); color: #fff; font-variation-settings:'wght' 700; }
  .ri-step__tick { font-size: 11px; }

  /* Body / cards */
  .ri-body { padding: 22px 18px 0; }
  .ri-stephead { margin: 0 0 4px; font-size: 20px; color: var(--navy); font-variation-settings:'wght' 900; }
  .ri-stepsub { color: var(--text-muted); font-size: 14px; margin: 0 0 20px; line-height: 1.55; }
  .ri-card { background: var(--white); border:1px solid var(--border); border-top: 3px solid var(--primary); border-radius: 10px; padding: 18px 20px; margin-bottom: 16px; box-shadow: 0 1px 3px var(--navy-50); }
  .ri-card > h2 { margin: 0 0 3px; font-size: 15px; color: var(--navy); font-variation-settings:'wght' 800; }
  .ri-card__sub { font-size: 12.5px; color: var(--text-muted); margin: 0 0 14px; line-height: 1.5; }

  input:focus, select:focus { outline: none; border-color: var(--navy); box-shadow: var(--focus-ring); }
  .ri-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: end; }
  @media (max-width: 620px) { .ri-grid { grid-template-columns: 1fr; } }
  label { display:block; font-size: 11px; text-transform: uppercase; letter-spacing:.07em; font-variation-settings:'wght' 800; color: var(--text-muted); margin: 0 0 4px; }
  input[type=text], input[type=email], input[type=tel], select {
    width: 100%; box-sizing: border-box; font-family: var(--font); font-size: 14px;
    border: 1px solid var(--border); border-radius: 6px; padding: 9px 11px; background: var(--white); color: var(--text);
  }

  /* Person rows */
  .ri-person { border: 1px solid var(--border); border-radius: 9px; padding: 14px; margin-bottom: 10px; background: var(--off-white); }
  .ri-person__hd { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .ri-person__n { font-variation-settings:'wght' 800; color: var(--navy); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
  .ri-del { background: none; border: 1px solid var(--border); color: var(--text-muted); border-radius: 6px; padding: 4px 10px; font-size: 12px; cursor: pointer; font-family: var(--font); }
  .ri-del:hover { border-color: var(--red); color: var(--red); }
  .ri-phone { display: grid; grid-template-columns: 1fr 80px; gap: 8px; }
  .btn-add { background: var(--white); border: 1px dashed var(--navy-300); color: var(--navy); border-radius: 8px; padding: 10px; width: 100%; font-family: var(--font); font-size: 13px; font-variation-settings:'wght' 700; cursor: pointer; }
  .btn-add:hover { background: var(--navy-50); }
  .ri-none { display:flex; gap:8px; align-items:center; font-size: 13px; color: var(--text-muted); margin-top: 4px; cursor: pointer; }
  .ri-none input { width:16px; height:16px; }
  .ri-empty { font-size: 13px; color: var(--text-muted); font-style: italic; padding: 4px 0 10px; }

  /* Coverage grid */
  .ri-cov { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px,1fr)); gap: 8px; }
  .ri-cov__cell { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; font-size: 13px; cursor: pointer; background: var(--white); }
  .ri-cov__cell.is-ok { border-color: var(--green); }
  .ri-cov__cell.is-gap { border-color: var(--amber); background: var(--amber-light); }
  .ri-cov__list { font-variation-settings:'wght' 700; color: var(--navy); }
  .ri-cov__st { font-size: 11.5px; margin-top: 3px; }
  .ri-cov__cell.is-ok .ri-cov__st { color: var(--green); }
  .ri-cov__cell.is-gap .ri-cov__st { color: var(--amber-deep); }

  /* Footer nav */
  .ri-nav { position: sticky; bottom: 0; background: var(--white); border-top: 1px solid var(--border); padding: 12px 18px; display: flex; align-items: center; gap: 12px; }
  .ri-nav__spacer { flex: 1; }
  .ri-saved { font-size: 12px; color: var(--green); opacity: 0; transition: opacity .2s; }
  .ri-saved.show { opacity: 1; }
  .ri-status { font-size: 13px; color: var(--red); }
</style>
</head>
<body>
<div class="rw">
  <div id="riGate" class="ri-gate">Checking your link…</div>
  <div id="riApp" style="display:none;">
    <div class="ri-hero">
      <img class="ri-hero__crest" id="riCrest" alt="" src="" onerror="this.onerror=null;this.src='https://raw.githubusercontent.com/thenationalleague/tools/refs/heads/main/assets/crests/National%20League%20rose.png';">
      <div class="ri-hero__t"><div class="kicker">The National League · 2026/27 · Club roster</div><h1 id="riClub">Club roster</h1></div>
    </div>
    <div class="ri-stepper">
      <div class="ri-stepbar"><div class="ri-stepbar__fill" id="riBar"></div></div>
      <div class="ri-steps" id="riSteps"></div>
    </div>
    <div class="ri-body" id="riStep"></div>
    <div class="ri-nav">
      <button class="btn btn--ghost" id="riBack">← Back</button>
      <span class="ri-status" id="riStatus"></span>
      <span class="ri-nav__spacer"></span>
      <span class="ri-saved" id="riSaved">Saved ✓</span>
      <button class="btn btn--navy" id="riNext">Next →</button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* ---- Canon mirrored from club-directory (keep in sync) ---- */
  var LISTS = [
    ['chairs','Chairs'], ['ceos','Chief executives'], ['secretaries','Club secretaries'],
    ['finance','Finance leads'], ['commercial','Commercial leads'], ['ticketing','Ticketing managers'],
    ['media','Media officers'], ['safety','Safety officers'], ['medical','Medical leads'],
    ['safeguarding','Safeguarding leads'], ['community','Community leads'],
    ['dlo','DLO'], ['plo','PLO'], ['cslo','CSLO']
  ];
  var LIST_LABEL = {}; LISTS.forEach(function (l) { LIST_LABEL[l[0]] = l[1]; });

  // Department (section) -> the mailing list it feeds (for derived coverage).
  var SECTION_LIST = {
    'Leadership':'chairs', 'Executive':'ceos', 'Club secretary':'secretaries',
    'Finance':'finance', 'Commercial':'commercial', 'Ticketing':'ticketing',
    'Media & marketing':'media', 'Matchday & safety':'safety', 'Medical':'medical',
    'Community':'community', 'Safeguarding & welfare':'safeguarding'
  };
  var SECTION_SUB = {
    'Leadership':'Chair, vice chair, president, owner',
    'Directors':'Board directors',
    'Executive':'Chief executive and senior management',
    'Club secretary':'Administration and fixture compliance',
    'Finance':'Financial reporting and treasury',
    'Commercial':'Sponsorship, partnerships and retail',
    'Ticketing':'Ticket office and box office',
    'Media & marketing':'Press, programme, social and marketing',
    'Matchday & safety':'Safety officer and matchday operations',
    'Medical':'Doctor, physiotherapist, therapist',
    'Team operations':'Kit, equipment and team logistics',
    'Community':'Community engagement and outreach',
    'Safeguarding & welfare':'Named safeguarding lead for children and adults at risk',
    'Other':"Anyone who doesn't fit the areas above"
  };
  // Liaison officers — role-by-role (each maps to its own list where one exists).
  var LIAISON = [
    ['DLO','Disability Liaison Officer','dlo'],
    ['PLO','Police Liaison Officer','plo'],
    ['CSLO','Competition Sponsorship Liaison Officer','cslo'],
    ['SLO','Supporter Liaison Officer', null]
  ];

  var STEPS = [
    { id:'you',     label:'You',                 kind:'you' },
    { id:'inboxes', label:'Shared inboxes',       kind:'inboxes' },
    { id:'g1', label:'Ownership & board',         kind:'depts', sections:['Leadership','Directors'] },
    { id:'g2', label:'Executive & secretary',     kind:'depts', sections:['Executive','Club secretary'] },
    { id:'g3', label:'Finance',                   kind:'depts', sections:['Finance'] },
    { id:'g4', label:'Commercial & ticketing',    kind:'depts', sections:['Commercial','Ticketing'] },
    { id:'g5', label:'Media & community',         kind:'depts', sections:['Media & marketing','Community'] },
    { id:'g6', label:'Matchday & team ops',       kind:'depts', sections:['Matchday & safety','Team operations'] },
    { id:'g7', label:'Medical & safeguarding',    kind:'depts', sections:['Medical','Safeguarding & welfare'] },
    { id:'liaison', label:'Liaison officers',     kind:'liaison' },
    { id:'g8', label:'Anyone else',               kind:'depts', sections:['Other'] },
    { id:'review',  label:'Check & submit',       kind:'review' }
  ];

  /* ---- State ---- */
  var token = new URLSearchParams(location.search).get('t') || '';
  var LS_KEY = 'nl-club-roster-' + token;
  var db = firebase.database();
  var clubName = null;
  var cur = 0;
  var data = { yourName:'', yourEmail:'', inboxes:{}, people:[] };

  function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function el(id){ return document.getElementById(id); }
  function gate(msg){ el('riGate').textContent = msg; }

  if (!/^[A-Za-z0-9_-]{20,}$/.test(token)) { gate('This link isn’t valid. Please use the link the League sent to your club.'); return; }

  db.ref('app-data/ops-club-roster/invites/' + token).once('value').then(function (snap) {
    var inv = snap.val();
    if (!inv || !inv.club) { gate('This link isn’t valid or has expired. Please contact the League.'); return; }
    clubName = inv.club;
    return db.ref('app-data/ops-club-roster/submissions/' + token).once('value').then(function (s) {
      var prev = s.val();
      el('riClub').textContent = clubName;
      el('riCrest').src = 'https://raw.githubusercontent.com/thenationalleague/tools/refs/heads/main/assets/crests/' + encodeURIComponent(clubName) + '.png';
      el('riGate').style.display = 'none';
      el('riApp').style.display = '';
      if (prev) { renderLocked(prev); return; }
      var draft = loadDraft();
      if (draft) data = Object.assign({ yourName:'', yourEmail:'', inboxes:{}, people:[] }, draft);
      bindNav();
      renderSteps(); renderStep();
    });
  }).catch(function () { gate('Could not check this link — please try again shortly.'); });

  /* ---- Stepper ---- */
  function renderSteps() {
    el('riSteps').innerHTML = STEPS.map(function (s, i) {
      var cls = i < cur ? 'is-done' : (i === cur ? 'is-current' : '');
      return '<div class="ri-step ' + cls + '" data-step="' + i + '">' +
        (i < cur ? '<span class="ri-step__tick">✓</span>' : '') + esc(s.label) + '</div>';
    }).join('');
    el('riBar').style.width = Math.round((cur / (STEPS.length - 1)) * 100) + '%';
    var active = el('riSteps').querySelector('.is-current');
    if (active && active.scrollIntoView) active.scrollIntoView({ inline: 'center', block: 'nearest' });
  }

  /* ---- Render the current step ---- */
  function renderStep() {
    var step = STEPS[cur];
    var host = el('riStep');
    el('riStatus').textContent = '';
    el('riBack').style.visibility = cur === 0 ? 'hidden' : 'visible';
    el('riNext').textContent = (cur === STEPS.length - 1) ? 'Submit to the League' : 'Next →';

    if (step.kind === 'you') {
      host.innerHTML =
        '<h2 class="ri-stephead">Who’s filling this in?</h2>' +
        '<p class="ri-stepsub">So we know who to come back to with any questions. Your progress is saved on this device as you go — you can close this and return to the same link later.</p>' +
        '<div class="ri-card"><div class="ri-grid">' +
          '<div><label>Your name</label><input type="text" id="f_yourName" value="' + esc(data.yourName) + '"></div>' +
          '<div><label>Your email</label><input type="email" id="f_yourEmail" value="' + esc(data.yourEmail) + '"></div>' +
        '</div></div>';
    } else if (step.kind === 'inboxes') {
      host.innerHTML =
        '<h2 class="ri-stephead">Shared department email addresses</h2>' +
        '<p class="ri-stepsub">First, any <b>shared</b> addresses that belong to a function rather than a person — e.g. <code>commercial@</code>, <code>tickets@</code> — and stay the same when staff change. Add one per function. Skip this entirely if you only use people’s own addresses (you’ll add those next). A phone and extension are optional.</p>' +
        '<div class="ri-card"><div id="riInboxRows"></div>' +
        '<button type="button" class="btn-add" id="riAddInbox">+ Add a shared address</button></div>';
      var rows = el('riInboxRows');
      Object.keys(data.inboxes).forEach(function (k) { rows.appendChild(inboxRow(k, data.inboxes[k])); });
      if (!rows.children.length) rows.appendChild(inboxRow('', {}));
      el('riAddInbox').addEventListener('click', function () { rows.appendChild(inboxRow('', {})); markSaved(); });
    } else if (step.kind === 'depts') {
      host.innerHTML =
        '<h2 class="ri-stephead">' + esc(step.label) + '</h2>' +
        '<p class="ri-stepsub">Add the people at your club in ' + (step.sections.length > 1 ? 'these areas' : 'this area') + '. Leave an area marked “no one” if it doesn’t apply.</p>' +
        step.sections.map(deptCard).join('');
      step.sections.forEach(wireDeptCard);
    } else if (step.kind === 'liaison') {
      host.innerHTML =
        '<h2 class="ri-stephead">Liaison officers</h2>' +
        '<p class="ri-stepsub">Named contacts for specific League functions. Fill in whichever apply — DLO, PLO and CSLO are expected at every club; SLO is optional.</p>' +
        '<div class="ri-card">' + LIAISON.map(liaisonRow).join('') + '</div>';
    } else if (step.kind === 'review') {
      renderReview(host);
    }
  }

  /* ---- Inbox row (function select + email + phone + ext) ---- */
  function inboxRow(key, ib) {
    var row = document.createElement('div');
    row.className = 'ri-person';
    row.innerHTML =
      '<div class="ri-person__hd"><span class="ri-person__n">Shared address</span>' +
        '<button type="button" class="ri-del">Remove</button></div>' +
      '<div class="ri-grid">' +
        '<div><label>Function</label><select data-ib="key">' +
          '<option value="">— choose —</option>' +
          LISTS.map(function (l) { return '<option value="' + l[0] + '"' + (l[0] === key ? ' selected' : '') + '>' + esc(l[1]) + '</option>'; }).join('') +
        '</select></div>' +
        '<div><label>Shared email</label><input type="email" data-ib="email" value="' + esc(ib.email || '') + '"></div>' +
        '<div class="ri-phone"><div><label>Phone (optional)</label><input type="tel" data-ib="phone" value="' + esc(ib.phone || '') + '"></div>' +
          '<div><label>Ext (opt.)</label><input type="text" maxlength="8" data-ib="ext" value="' + esc(ib.ext || '') + '"></div></div>' +
      '</div>';
    row.querySelector('.ri-del').addEventListener('click', function () { row.parentNode.removeChild(row); markSaved(); });
    return row;
  }

  /* ---- Department card with people rows + "no one" toggle ---- */
  function deptCard(section) {
    return '<div class="ri-card" data-section="' + esc(section) + '">' +
      '<h2>' + esc(section) + '</h2>' +
      '<p class="ri-card__sub">' + esc(SECTION_SUB[section] || '') + '</p>' +
      '<div class="ri-people"></div>' +
      '<button type="button" class="btn-add ri-addperson">+ Add a person</button>' +
      '<label class="ri-none"><input type="checkbox" class="ri-noneck"> No one in this area at our club</label>' +
    '</div>';
  }
  function wireDeptCard(section) {
    var card = el('riStep').querySelector('[data-section="' + cssesc(section) + '"]');
    var holder = card.querySelector('.ri-people');
    var existing = data.people.filter(function (p) { return p.section === section; });
    existing.forEach(function (p) { holder.appendChild(personRow(section, p)); });
    var noneck = card.querySelector('.ri-noneck');
    function refresh() {
      var has = holder.children.length > 0;
      card.querySelector('.ri-addperson').style.display = noneck.checked ? 'none' : '';
      holder.style.display = noneck.checked ? 'none' : '';
    }
    card.querySelector('.ri-addperson').addEventListener('click', function () { holder.appendChild(personRow(section, {})); markSaved(); });
    noneck.addEventListener('change', function () {
      if (noneck.checked) { holder.innerHTML = ''; }
      refresh(); markSaved();
    });
    if (!existing.length) noneck.checked = false;
    refresh();
  }
  function personRow(section, p) {
    var row = document.createElement('div');
    row.className = 'ri-person'; row.setAttribute('data-prow','1');
    row.innerHTML =
      '<div class="ri-person__hd"><span class="ri-person__n">' + esc(section) + '</span>' +
        '<button type="button" class="ri-del">Remove</button></div>' +
      '<div class="ri-grid">' +
        '<div><label>Full name</label><input type="text" data-p="name" value="' + esc(p.name || '') + '"></div>' +
        '<div><label>Role / job title</label><input type="text" data-p="title" value="' + esc(p.title || '') + '"></div>' +
        '<div><label>Email</label><input type="email" data-p="email" value="' + esc(p.email || '') + '"></div>' +
        '<div class="ri-phone"><div><label>Phone</label><input type="tel" data-p="phone" value="' + esc(p.phone || '') + '"></div>' +
          '<div><label>Ext (opt.)</label><input type="text" maxlength="8" data-p="ext" value="' + esc(p.ext || '') + '"></div></div>' +
      '</div>';
    row.querySelector('.ri-del').addEventListener('click', function () {
      var card = row.closest('[data-section]'); row.parentNode.removeChild(row); markSaved();
    });
    return row;
  }
  function liaisonRow(L) {
    var existing = data.people.filter(function (p) { return p.section === 'Liaison officers' && p.roleKey === L[0]; })[0] || {};
    return '<div class="ri-person" data-role="' + L[0] + '">' +
      '<div class="ri-person__n" style="margin-bottom:10px;">' + esc(L[0]) + ' · ' + esc(L[1]) + '</div>' +
      '<div class="ri-grid">' +
        '<div><label>Name</label><input type="text" data-l="name" value="' + esc(existing.name || '') + '"></div>' +
        '<div><label>Email</label><input type="email" data-l="email" value="' + esc(existing.email || '') + '"></div>' +
        '<div class="ri-phone"><div><label>Phone</label><input type="tel" data-l="phone" value="' + esc(existing.phone || '') + '"></div>' +
          '<div><label>Ext (opt.)</label><input type="text" maxlength="8" data-l="ext" value="' + esc(existing.ext || '') + '"></div></div>' +
      '</div></div>';
  }

  /* ---- Read current step's DOM into `data` ---- */
  function syncStep() {
    var step = STEPS[cur];
    if (step.kind === 'you') {
      data.yourName = (el('f_yourName') || {}).value ? el('f_yourName').value.trim() : data.yourName;
      data.yourEmail = (el('f_yourEmail') || {}).value ? el('f_yourEmail').value.trim() : data.yourEmail;
    } else if (step.kind === 'inboxes') {
      data.inboxes = {};
      Array.prototype.forEach.call(el('riStep').querySelectorAll('.ri-person'), function (row) {
        var g = function (k) { var n = row.querySelector('[data-ib="' + k + '"]'); return n ? n.value.trim() : ''; };
        var key = g('key'); if (!key) return;
        var ib = { email: g('email'), phone: g('phone'), ext: g('ext') };
        if (ib.email || ib.phone) data.inboxes[key] = ib;
      });
    } else if (step.kind === 'depts') {
      step.sections.forEach(function (section) {
        data.people = data.people.filter(function (p) { return p.section !== section; });
        var card = el('riStep').querySelector('[data-section="' + cssesc(section) + '"]');
        if (!card) return;
        Array.prototype.forEach.call(card.querySelectorAll('[data-prow]'), function (row) {
          var g = function (k) { var n = row.querySelector('[data-p="' + k + '"]'); return n ? n.value.trim() : ''; };
          var person = { section: section, name: g('name'), title: g('title'), email: g('email'), phone: g('phone'), ext: g('ext') };
          if (person.name || person.email || person.phone) data.people.push(person);
        });
      });
    } else if (step.kind === 'liaison') {
      data.people = data.people.filter(function (p) { return p.section !== 'Liaison officers'; });
      Array.prototype.forEach.call(el('riStep').querySelectorAll('[data-role]'), function (row) {
        var g = function (k) { var n = row.querySelector('[data-l="' + k + '"]'); return n ? n.value.trim() : ''; };
        var roleKey = row.getAttribute('data-role');
        if (g('name') || g('email') || g('phone')) {
          var label = (LIAISON.filter(function (x) { return x[0] === roleKey; })[0] || [])[1] || roleKey;
          data.people.push({ section: 'Liaison officers', roleKey: roleKey, title: label, name: g('name'), email: g('email'), phone: g('phone'), ext: g('ext') });
        }
      });
    }
  }

  /* ---- Coverage / review ---- */
  function listCovered(key) {
    // direct section->list
    var sects = Object.keys(SECTION_LIST).filter(function (s) { return SECTION_LIST[s] === key; });
    var hit = data.people.some(function (p) { return sects.indexOf(p.section) !== -1; });
    if (hit) return true;
    // liaison roles
    var li = LIAISON.filter(function (x) { return x[2] === key; })[0];
    if (li) return data.people.some(function (p) { return p.section === 'Liaison officers' && p.roleKey === li[0]; });
    return false;
  }
  function renderReview(host) {
    var covered = LISTS.filter(function (l) { return listCovered(l[0]); }).length;
    var nPeople = data.people.length, nInbox = Object.keys(data.inboxes).length;
    host.innerHTML =
      '<h2 class="ri-stephead">Check &amp; submit</h2>' +
      '<p class="ri-stepsub">You’ve given us <b>' + nPeople + '</b> ' + (nPeople === 1 ? 'person' : 'people') + ' and <b>' + nInbox + '</b> shared ' + (nInbox === 1 ? 'address' : 'addresses') + '. The grid shows which mailing lists are covered — tap an amber one to jump back and add someone. Gaps are fine if that role genuinely doesn’t apply.</p>' +
      '<div class="ri-card"><h2>Mailing-list coverage</h2><p class="ri-card__sub">' + covered + ' of ' + LISTS.length + ' lists have someone.</p>' +
      '<div class="ri-cov">' + LISTS.map(function (l) {
        var ok = listCovered(l[0]);
        return '<div class="ri-cov__cell ' + (ok ? 'is-ok' : 'is-gap') + '" data-coverlist="' + l[0] + '">' +
          '<div class="ri-cov__list">' + esc(l[1]) + '</div>' +
          '<div class="ri-cov__st">' + (ok ? '✓ covered' : '— no one yet') + '</div></div>';
      }).join('') + '</div></div>';
    Array.prototype.forEach.call(host.querySelectorAll('[data-coverlist]'), function (c) {
      c.addEventListener('click', function () { jumpToList(c.getAttribute('data-coverlist')); });
    });
  }
  // Jump back to the step that feeds a given list.
  function jumpToList(key) {
    var sects = Object.keys(SECTION_LIST).filter(function (s) { return SECTION_LIST[s] === key; });
    var li = LIAISON.filter(function (x) { return x[2] === key; })[0];
    var targetSection = sects[0];
    var idx = -1;
    if (li) { idx = stepIndexById('liaison'); }
    else if (targetSection) {
      for (var i = 0; i < STEPS.length; i++) { if (STEPS[i].sections && STEPS[i].sections.indexOf(targetSection) !== -1) { idx = i; break; } }
    }
    if (idx >= 0) goTo(idx);
  }
  function stepIndexById(id) { for (var i = 0; i < STEPS.length; i++) if (STEPS[i].id === id) return i; return -1; }

  /* ---- Navigation ---- */
  function bindNav() {
    el('riNext').addEventListener('click', function () {
      if (cur === STEPS.length - 1) { submit(); return; }
      if (cur === 0) { syncStep(); if (!data.yourName || !data.yourEmail) { el('riStatus').textContent = 'Please add your name and email.'; return; } }
      goTo(cur + 1);
    });
    el('riBack').addEventListener('click', function () { if (cur > 0) goTo(cur - 1); });
    el('riSteps').addEventListener('click', function (e) {
      var s = e.target.closest('[data-step]'); if (!s) return;
      goTo(parseInt(s.getAttribute('data-step'), 10));
    });
    el('riStep').addEventListener('input', markSaved);
    el('riStep').addEventListener('change', markSaved);
  }
  function goTo(idx) { syncStep(); saveDraft(); cur = idx; renderSteps(); renderStep(); window.scrollTo(0, 0); }

  /* ---- Draft persistence ---- */
  var saveTimer = null;
  function markSaved() { clearTimeout(saveTimer); saveTimer = setTimeout(function () { syncStep(); saveDraft(true); }, 500); }
  function saveDraft(flash) {
    try { localStorage.setItem(LS_KEY, JSON.stringify(data)); if (flash) { var s = el('riSaved'); s.classList.add('show'); setTimeout(function () { s.classList.remove('show'); }, 1000); } } catch (e) {}
  }
  function loadDraft() { try { var r = localStorage.getItem(LS_KEY); return r ? JSON.parse(r) : null; } catch (e) { return null; } }

  /* ---- Submit (write-once) ---- */
  function submit() {
    syncStep();
    if (!data.yourName || !data.yourEmail) { goTo(0); el('riStatus').textContent = 'Please add your name and email.'; return; }
    if (!data.people.length && !Object.keys(data.inboxes).length) { el('riStatus').textContent = 'Please add at least one person or shared address before submitting.'; return; }
    var rec = { club: clubName, yourName: data.yourName, yourEmail: data.yourEmail, inboxes: data.inboxes, people: data.people, submittedAt: Date.now() };
    var btn = el('riNext'); btn.disabled = true; btn.textContent = 'Submitting…';
    db.ref('app-data/ops-club-roster/submissions/' + token).set(rec).then(function () {
      try { localStorage.removeItem(LS_KEY); } catch (e) {}
      renderLocked(rec);
    }).catch(function (e) {
      btn.disabled = false; btn.textContent = 'Submit to the League';
      el('riStatus').textContent = 'Submission failed: ' + (e.message || e);
    });
  }

  /* ---- Locked read-only view ---- */
  function renderLocked(rec) {
    el('riApp').querySelector('.ri-stepper').style.display = 'none';
    el('riApp').querySelector('.ri-nav').style.display = 'none';
    var bySection = {};
    (rec.people || []).forEach(function (p) { (bySection[p.section] = bySection[p.section] || []).push(p); });
    var inboxKeys = Object.keys(rec.inboxes || {});
    var when = rec.submittedAt ? new Date(rec.submittedAt).toLocaleString('en-GB', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' }) : '';
    function contact(p){ return esc([p.email, p.phone && (p.phone + (p.ext ? ' ext ' + p.ext : ''))].filter(Boolean).join(' · ') || 'no contact details'); }
    el('riStep').innerHTML =
      '<div class="ri-card" style="border-top-color:var(--green);">' +
        '<h2 style="color:var(--green);">✓ Submitted &amp; locked</h2>' +
        '<p class="ri-card__sub">Received by the League' + (when ? ' on ' + esc(when) : '') + '. Your roster is shown below for reference. To change anything, please contact the League and we’ll re-open your form.</p></div>' +
      (inboxKeys.length ? '<div class="ri-card"><h2>Shared addresses</h2>' + inboxKeys.map(function (k) {
        var ib = rec.inboxes[k]; return '<div style="font-size:13px;padding:3px 0;"><b style="color:var(--navy);">' + esc(LIST_LABEL[k] || k) + '</b> — ' + esc([ib.email, ib.phone].filter(Boolean).join(' · ')) + '</div>';
      }).join('') + '</div>' : '') +
      Object.keys(bySection).map(function (sec) {
        return '<div class="ri-card"><h2>' + esc(sec) + '</h2>' + bySection[sec].map(function (p) {
          return '<div style="padding:4px 0;font-size:13px;"><b>' + esc(p.name || '(unnamed)') + '</b>' + (p.title ? ' · ' + esc(p.title) : '') + '<br><span style="color:var(--text-muted);">' + contact(p) + '</span></div>';
        }).join('') + '</div>';
      }).join('');
  }

  // CSS.escape fallback for attribute selectors with spaces/ampersands.
  function cssesc(s) { return (window.CSS && CSS.escape) ? CSS.escape(s) : String(s).replace(/["\\\]#.:&\s]/g, '\\$&'); }
})();
</script>
</body>
</html>
