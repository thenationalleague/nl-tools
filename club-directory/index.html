  v0.15 — Complete UI consistency overhaul based on v0.14 feedback. No feature

          NEW COMPONENT LANGUAGE
          Five button variants defined at the top of the CSS:
          - .btn.btn--navy   — navy fill, main affirmative (Save, Copy, etc)
          - .btn.btn--ghost — outline, contextual (Cancel, Edit, Back)
          - .btn.btn--danger    — red fill, destructive (Delete)
          - .btn.btn--link      — text-only, low emphasis (all/none controls)
          - .btn.btn--toggle    — tab/state (Directory, People tab, heads mode)
          Plus .btn--toggle-dark (persona bar), .btn--sm / .btn--lg size mods,
          .btn-icon (round 26px structural), .btn-add (dashed-border creation).

          Four pill variants:
          - .pill.pill--count       — neutral metadata, goes coloured only when .is-active
          - .pill.pill--status[-good|-warn|-error] — meaning = colour
          - .pill.pill--marker      — meaningful flag (dept head badge)
          - .pill.pill--identifier  — neutral label (division, role key)

          MIGRATED CLASSES (old → new)
          .mc-save-btn, .mc-primary-btn, .lb-copybtn, .mc-add-person-btn → btn btn--navy
          .mc-cancel-btn, .mc-dept-edit-btn, .mc-person-card-btn → btn btn--ghost
          .mc-danger-btn, .mc-person-panel__danger → btn btn--danger
          .lb-linkbtn → btn btn--link
          .demo-bar__btn, .lb-mode-btn, .mc-picker-pill → btn btn--toggle
          .persona-btn → btn btn--toggle-dark
          .mc-dept-add-btn → btn-add
          .mc-assignment-remove, .mc-person-panel__close, .lb-omit-btn → btn-icon
          .mc-tab-count → pill pill--count (gains .is-active when tab is current)
          .mc-status-pill + modifiers → pill pill--status*
          .mc-person-panel__dept-head-pill, .mc-assignment-headpill → pill pill--marker
          .mc-checklist-roleKey → pill pill--identifier
          .mc-div-pill (division colour coding) → pill pill--identifier (neutral)
          .mc-dept-warning → pill pill--status pill--status-warn

          Old CSS rules for migrated classes are still in the file but unused —
          flagged for cleanup in a later pass.

     Local-only extensions kept below: .btn--link (anchor-styled),

       local .btn base       dropped, brand .btn handles it
       local .btn--primary   was navy, call sites renamed to .btn--navy
       local .btn--secondary was ghost, call sites renamed to .btn--ghost

  .btn--link {
    background: none; border: none; padding: 4px 6px;
    font-size: var(--text-sm); font-weight: 600; font-variation-settings: 'wght' 600;
    text-transform: none; letter-spacing: normal;
    color: var(--navy); text-decoration: underline;
    cursor: pointer; font-family: var(--font);
  }
  .btn--link:hover:not(:disabled) { color: var(--primary); }

  .btn--toggle {
    background: none; color: var(--text);
    border-color: transparent;
    font-weight: 600; font-variation-settings: 'wght' 600;
  }
  .btn--toggle:hover:not([aria-pressed="true"]) { background: var(--off-white); }
  .btn--toggle[aria-pressed="true"] { background: var(--navy); color: var(--white); }

  .btn--toggle-dark {
    background: none; color: var(--navy-200);
    border: 1px solid var(--navy-300);
    font-weight: 600; font-variation-settings: 'wght' 600;
    padding: 3px 10px; font-size: var(--text-xs);

  .btn--toggle-dark:hover:not([aria-pressed="true"]) { border-color: var(--white); color: var(--white); }
  .btn--toggle-dark[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: var(--white); }

  .btn--lg { padding: 13px 24px; font-size: var(--text-sm); }

  /* Icon button — round, no text, structural */
  .btn-icon {
    background: none;
    border: 1px solid var(--border);
    width: 26px; height: 26px;
    border-radius: 50%;

    font-size: 14px; line-height: 1;

    display: inline-flex; align-items: center; justify-content: center;

  .btn-icon:hover { border-color: var(--navy); color: var(--navy); }

    background: var(--red); border-color: var(--red); color: var(--white);

    background: var(--off-white); color: var(--text-muted);

    /* border-bottom acts as the short red underline — only as wide as the text */
  }

  /* Joined rows (Directors/Co-Chairs) — identical to regular rows, no special colour */
  .s2-joined-row td { /* no overrides — use regular row styling */ }

  /* ================================================================
     CLUB PAGE — handbook facts surfaced (v0.21)
     The s2-club card gains: club-colour accent bar (inline style), hero
     with nickname/stadium/contact chips, facts grid, kit + sponsors
     panels, correction line. People table unchanged below.
     ================================================================ */
  .s2-header__main { min-width: 0; flex: 1; }
  .cp-stadium { font-size: 14px; font-variation-settings: 'wght' 700; margin-top: 8px; }
  .cp-contact { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .cp-contact__label {
    flex-basis: 100%; margin-bottom: 1px;
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em;
    font-variation-settings: 'wght' 800; color: var(--navy-200);
  }
  .cp-chip {
    display: inline-flex; align-items: center; font-size: 12px;
    padding: 4px 11px; border-radius: 999px;
    background: var(--navy-600); color: var(--white); text-decoration: none;
  }
  a.cp-chip:hover { background: var(--navy-700); text-decoration: none; }
  .mc-details__note { font-size: 12px; color: var(--text-muted); margin-top: 12px; line-height: 1.5; }
  .mc-details__note a { color: var(--navy); }
  /* Mailing-list checkboxes in the person editor. */
  .mc-mlists { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 18px; }
  @media (max-width: 520px) { .mc-mlists { grid-template-columns: 1fr; } }
  .mc-mlist {
    display: flex; align-items: center; gap: 7px;
    font-size: 13px; color: var(--text-muted);
    padding: 3px 0; cursor: pointer; min-width: 0;
  }
  .mc-mlist.is-on { color: var(--text); }
  .mc-mlist > span { flex: 1; min-width: 0; }
  .mc-mlist__req { color: var(--primary); font-weight: 900; }
  .mc-mlist__auto {
    font-size: 9px; text-transform: uppercase; letter-spacing: 0.06em;
    font-variation-settings: 'wght' 700;
    color: var(--navy); background: var(--navy-50);
    border: 1px solid var(--navy-200); border-radius: 999px;
    padding: 0 6px;
  }
  .cp-facts {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    gap: 1px; background: var(--border); border-bottom: 1px solid var(--border);
  }
  .cp-fact { background: var(--white); padding: 14px 18px; }
  .cp-fact__label {
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em;
    font-variation-settings: 'wght' 800; color: var(--text-muted);
  }
  .cp-fact__value { font-size: 15px; font-variation-settings: 'wght' 700; margin-top: 4px; }
  .cp-fact__sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .cp-strips {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 1px; background: var(--border); border-bottom: 1px solid var(--border);
  }
  .cp-panel { background: var(--white); padding: 16px 18px; }
  .cp-panel__hd {
    display: inline-block; font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.18em; font-variation-settings: 'wght' 800;
    color: var(--navy); padding-bottom: 6px; margin-bottom: 10px;
    border-bottom: 2px solid var(--primary);
  }
  .cp-kit { display: flex; gap: 28px; flex-wrap: wrap; }
  .cp-kit__col { font-size: 13px; }
  .cp-kit__hd { font-variation-settings: 'wght' 800; font-size: 12px; margin-bottom: 6px; }
  .cp-kit__col div { padding: 2px 0; }
  .cp-kit__col div span, .cp-sponsors div span {
    display: inline-block; min-width: 72px; color: var(--text-muted);
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em;
  }
  .cp-sponsors div { font-size: 13px; padding: 3px 0; }
  .cp-sponsors div span { min-width: 150px; }
  .cp-correction {
    font-size: 12px; color: var(--text-muted);
    padding: 10px 18px; background: var(--off-white);
    border-bottom: 1px solid var(--border);
  }
  .cp-empty { padding: 36px 20px; text-align: center; color: var(--text-muted); font-size: 14px; }

  /* ---- Completion dashboard (v0.23) ---- */
  .cp-meter { display: inline-block; width: 90px; height: 8px; border-radius: 4px; background: var(--navy-100); overflow: hidden; vertical-align: middle; }
  .cp-meter__bar { height: 100%; border-radius: 4px; transition: width 0.2s; }
  .cp-meter__label { font-size: 12px; font-variation-settings: 'wght' 700; color: var(--text-muted); margin-left: 8px; vertical-align: middle; }
  .cp-dash-meter { margin: 4px 0 8px; }
  .cp-dash-h3 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.14em; color: var(--navy); margin: 22px 0 10px; }
  .cp-checks { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 6px; }
  .cp-check { display: flex; align-items: center; gap: 8px; padding: 9px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; background: var(--white); }
  .cp-check__icon { width: 18px; height: 18px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; color: var(--white); flex-shrink: 0; }
  .cp-check--ok  .cp-check__icon { background: var(--green); }
  .cp-check--gap .cp-check__icon { background: var(--red); }
  .cp-check--gap { border-color: var(--red); }
  .cp-check__label { font-variation-settings: 'wght' 600; }
  .cp-check__hint { font-size: 11px; color: var(--text-muted); margin-left: auto; }
  .cp-rollup { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
  .cp-rollup__item { display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: var(--amber-light); border: 1px solid var(--amber); border-radius: 8px; }
  .cp-rollup__n { font-size: 22px; font-variation-settings: 'wght' 900; color: var(--amber-deep); }
  .cp-rollup__lbl { font-size: 13px; }
  .cp-dash-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .cp-dash-table th { text-align: left; font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-muted); padding: 8px 12px; border-bottom: 2px solid var(--border); }
  .cp-dash-table td { padding: 9px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  .cp-dash-row { cursor: pointer; }
  .cp-dash-row:hover td { background: var(--off-white); }
  .cp-dash-meter-cell { white-space: nowrap; }
  .cp-dash-gaps { color: var(--text-muted); font-size: 12px; }

  /* ================================================================
     LISTING 1 — Card Grid
     ================================================================ */
  .l1-division { margin-bottom: 32px; }
  /* Division headers — navy uppercase with red underline, matches section-header language elsewhere */
  .l1-div-hd {
    font-size: 12px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    font-weight: 800;
    font-variation-settings: 'wght' 800;
    padding: 0 0 6px 0;
    display: inline-flex;
    align-items: baseline;
    gap: 10px;
    color: var(--navy);
    margin: 0 0 18px 0;
    border-bottom: 2px solid var(--primary);
  }
  .l1-div-hd .pill { vertical-align: baseline; }
  /* Club-editor "your club" hero — big full-width card on directory landing */
  .l1-hero {
    background: linear-gradient(135deg, var(--navy) 0%, var(--navy-600) 100%);
    color: var(--white);
    padding: 24px 28px;
    border-radius: 8px;
    margin-bottom: 24px;
    display: grid;
    grid-template-columns: 64px 1fr auto;
    gap: 18px;
    align-items: center;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .l1-hero:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(10,22,40,0.2); }
  .l1-hero__crest {
    width: 64px; height: 64px; background: var(--white);
    border-radius: 6px; padding: 6px;
    object-fit: contain;
  }
  .l1-hero__kicker {
    font-size: 10px; text-transform: uppercase;
    letter-spacing: 0.22em; opacity: 0.7;
    font-weight: 700; font-variation-settings: 'wght' 700;
  }
  .l1-hero__name {
    font-size: 22px;
    font-weight: 800; font-variation-settings: 'wght' 800;
    margin-top: 2px;
    letter-spacing: -0.01em;
  }
  .l1-hero__meta {
    font-size: 13px; opacity: 0.8; margin-top: 2px;
  }
  .l1-hero .btn--navy {
    background: var(--primary);
  }
  .l1-hero .btn--navy:hover { background: var(--primary-600); }
  @media (max-width: 700px) {
    .l1-hero {
      grid-template-columns: 56px 1fr;
      padding: 18px;
    }
    .l1-hero__crest { width: 56px; height: 56px; }
    .l1-hero .btn--navy {
      grid-column: 1 / -1;
      justify-content: center;
    }
    .l1-hero__name { font-size: 18px; }
  }

  .l1-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
  .l1-card {
    background: var(--white); border: 1px solid var(--border);
    border-radius: 6px; padding: 14px 16px;
    cursor: pointer; transition: all 0.15s;
    display: flex; gap: 12px; align-items: center;
    min-height: 72px;
  }
  .l1-card:hover { border-color: var(--navy); transform: translateY(-1px); box-shadow: 0 2px 8px rgba(10,22,40,0.08); }
  .l1-crest { width: 40px; height: 40px; flex-shrink: 0; object-fit: contain; }
  .l1-card-body { flex: 1; min-width: 0; }
  .l1-card h3 {
    margin: 0; font-size: 15px;
    font-weight: 700; font-variation-settings: 'wght' 700;
    letter-spacing: -0.01em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .l1-stadium {
    font-size: 12px; color: var(--text-muted);
    margin-top: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* ================================================================
     LIST BUILDER (staff view)
     ================================================================ */
  .demo-bar__btn--staff {
    background: var(--off-white);
    color: var(--primary) !important;
    font-weight: 700;
    font-variation-settings: 'wght' 700;
  }
  .demo-bar__btn--staff[aria-pressed="true"] {
    background: var(--primary) !important;
    color: var(--white) !important;
  }

  .lb-intro { margin-bottom: 20px; }
  .lb-intro h2 { margin: 0; font-size: 22px; font-weight: 900; font-variation-settings: 'wght' 900; letter-spacing: -0.01em; }
  .lb-intro p { margin: 4px 0 0 0; font-size: 14px; color: var(--text-muted); }

  .lb-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 20px;
  }
  .lb-panel {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px 18px;
    max-height: 480px;
    display: flex;
    flex-direction: column;
  }
  .lb-panel-hd {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 10px;
    border-bottom: 2px solid var(--primary);
    margin-bottom: 12px;
  }
  .lb-panel-hd h3 {
    margin: 0;
    font-size: 11px;
    font-weight: 700;
    font-variation-settings: 'wght' 700;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--navy);
  }
  .lb-panel-actions { display: flex; gap: 4px; }
  .lb-linkbtn {
    background: none; border: none; padding: 2px 6px;
    font-family: var(--font); font-size: 11px;
    color: var(--navy); cursor: pointer;
    text-decoration: underline;
    font-weight: 600;
    font-variation-settings: 'wght' 600;
  }
  .lb-linkbtn:hover { color: var(--primary); }

  .lb-panel > div:last-child { flex: 1; overflow-y: auto; padding-right: 4px; }

  /* Roles */
  .lb-section-group { margin-bottom: 10px; }
  .lb-section-row {
    display: flex; align-items: center; gap: 8px;
    padding: 4px 0;
    cursor: pointer;
    user-select: none;
  }
  .lb-section-row input[type="checkbox"] { margin: 0; cursor: pointer; }
  .lb-section-row label {
    font-size: 12px;
    font-weight: 700;
    font-variation-settings: 'wght' 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text);
    cursor: pointer;
    flex: 1;
  }
  .lb-section-count {
    font-size: 10px;
    color: var(--text-muted);
    font-weight: 600;
    font-variation-settings: 'wght' 600;
  }
  .lb-section-toggle {
    background: none; border: none; padding: 0;
    color: var(--text-muted); cursor: pointer;
    font-family: var(--font); font-size: 12px;
    width: 18px; text-align: center;
  }
  .lb-roles-in-section {
    margin-left: 22px;
    padding: 4px 0 2px;
    display: grid;
    gap: 2px;
  }
  .lb-role-row {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px;
    padding: 1px 0;
    cursor: pointer;
    user-select: none;
  }
  .lb-role-row input[type="checkbox"] { margin: 0; cursor: pointer; }
  .lb-role-row label { cursor: pointer; color: var(--text); flex: 1; }
  .lb-collapsed .lb-roles-in-section { display: none; }

  /* Divisions */
  .lb-division-group { margin-bottom: 14px; }
  .lb-division-row {
    display: flex; align-items: center; gap: 8px;
    padding: 4px 0;
    user-select: none;
  }
  .lb-division-row input[type="checkbox"] { margin: 0; cursor: pointer; }
  .lb-division-row label {
    font-size: 12px;
    font-weight: 700;
    font-variation-settings: 'wght' 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    cursor: pointer;
    flex: 1;
  }
  .lb-div-badge {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    margin-right: 6px;
    vertical-align: middle;
  }
  .lb-div-badge--national { background: var(--navy); }
  .lb-div-badge--north { background: var(--amber); }
  .lb-div-badge--south { background: var(--green); }
  .lb-division-stats {
    font-size: 10px; color: var(--text-muted);
    font-weight: 600; font-variation-settings: 'wght' 600;
  }
  .lb-clubs-in-div {
    margin-left: 22px;
    display: grid; gap: 2px;
  }
  .lb-club-search {
    margin: 4px 0 6px 22px;
    width: calc(100% - 22px);
    font-family: var(--font); font-size: 12px;
    padding: 5px 8px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--white);
  }
  .lb-club-search:focus { outline: none; border-color: var(--navy); }
  .lb-club-row {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px;
    padding: 1px 0;
    cursor: pointer;
    user-select: none;
  }
  .lb-club-row.is-hidden { display: none; }
  .lb-club-row label { cursor: pointer; flex: 1; }
  .lb-club-row input[type="checkbox"] { margin: 0; cursor: pointer; }
  .lb-division-div-collapsed .lb-clubs-in-div,
  .lb-division-div-collapsed .lb-club-search { display: none; }

  /* Results */
  .lb-results {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }

  /* Mode bar — heads-only vs whole dept */
  .lb-modebar {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 12px;
  }
  .lb-modebar__group {
    display: inline-flex;
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
    padding: 3px;
    gap: 2px;
  }
  .lb-mode-btn {
    background: none; border: none;
    padding: 7px 14px;
    font-family: var(--font);
    font-size: 12px;
    font-weight: 600;
    font-variation-settings: 'wght' 600;
    color: var(--text);
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.12s;
  }
  .lb-mode-btn:hover { background: var(--off-white); }
  .lb-mode-btn[aria-pressed="true"] {
    background: var(--navy);
    color: var(--white);
  }

  /* Warnings panel above results */
  .lb-warnings {
    background: var(--amber-light);
    border: 1px solid color-mix(in srgb, var(--amber) 35%, white);
    border-radius: 8px;
    padding: 14px 16px;
    margin-bottom: 12px;
  }
  .lb-warnings__hd {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    font-weight: 800;
    font-variation-settings: 'wght' 800;
    color: var(--amber-deep);
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .lb-warnings__item {
    font-size: 13px;
    color: var(--text);
    margin-bottom: 6px;
    line-height: 1.6;
  }
  .lb-warnings__item:last-child { margin-bottom: 0; }

  .lb-warnings__item b { color: var(--amber-deep); font-weight: 700; font-variation-settings: 'wght' 700; }
  .lb-warnings__crests {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-top: 6px;
  }
  .lb-warning-crest {
    display: inline-flex; align-items: center; gap: 5px;
    background: var(--white);
    border: 1px solid color-mix(in srgb, var(--amber) 35%, white);
    border-radius: 14px;
    padding: 2px 9px 2px 2px;
    font-size: 11px;
    color: var(--text);
    font-weight: 500;
    font-variation-settings: 'wght' 500;
  }
  .lb-warning-crest img { width: 20px; height: 20px; flex-shrink: 0; object-fit: contain; }

  /* Club crests in results */
  .lb-club-cell {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .lb-club-cell img { width: 22px; height: 22px; flex-shrink: 0; object-fit: contain; }

  /* Omit button + omitted row */
  .lb-col-omit { width: 36px; text-align: center; padding-right: 10px !important; }
  .lb-omit-btn {
    background: none;
    border: 1px solid var(--border);
    width: 22px; height: 22px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 12px;
    line-height: 1;
    color: var(--text-muted);
    padding: 0;
    transition: all 0.12s;
  }
  .lb-omit-btn:hover { border-color: var(--red); color: var(--red); }
  .lb-omit-btn[aria-pressed="true"] {
    background: var(--red);
    border-color: var(--red);
    color: var(--white);
  }
  .lb-row-omitted td {
    color: color-mix(in srgb, var(--text-muted) 50%, white) !important;
    text-decoration: line-through;
  }
  .lb-row-omitted .lb-club-cell img { opacity: 0.35; filter: grayscale(100%); }
  .lb-row-omitted td a { color: color-mix(in srgb, var(--text-muted) 50%, white) !important; pointer-events: none; }
  .lb-row-omitted .lb-omit-btn { text-decoration: none; }
  .lb-row-omitted .lb-no-email { color: color-mix(in srgb, var(--text-muted) 50%, white) !important; }

  .lb-results-hd {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px;
    background: var(--off-white);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
    gap: 10px;
  }
  .lb-results-stats { display: flex; align-items: baseline; gap: 8px; }
  .lb-count {
    font-size: 26px;
    font-weight: 900;
    font-variation-settings: 'wght' 900;
    color: var(--navy);
    line-height: 1;
  }
  .lb-count-sub { font-size: 12px; color: var(--text-muted); }

  .lb-results-actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .lb-copybtn {
    background: var(--navy);
    color: var(--white);
    border: none;
    padding: 7px 14px;
    border-radius: var(--radius);
    font-family: var(--font);
    font-size: 11px;
    font-weight: 700;
    font-variation-settings: 'wght' 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    cursor: pointer;
    transition: all 0.12s;
  }
  .lb-copybtn:hover { background: var(--navy-600); }
  .lb-copybtn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn.is-copied { background: var(--green) !important; }
  .btn.is-copied:hover { background: var(--green) !important; }

  .lb-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .lb-table th {
    text-align: left; padding: 10px 18px; background: transparent;
    font-size: 9px; font-weight: 700; font-variation-settings: 'wght' 700;
    text-transform: uppercase; letter-spacing: 0.14em;
    color: var(--text-muted);
    border-bottom: 1px solid var(--border);
  }
  .lb-table td { padding: 9px 18px; border-bottom: 1px solid var(--border); vertical-align: top; }
  .lb-table td a { color: var(--navy); }
  .lb-col-role { width: 22%; font-weight: 600; font-variation-settings: 'wght' 600; color: var(--text-muted); font-size: 12px; }
  .lb-col-name { width: 22%; font-weight: 700; font-variation-settings: 'wght' 700; }
  .lb-col-club { width: 20%; font-weight: 500; font-variation-settings: 'wght' 500; }
  .lb-col-email { width: 22%; font-size: 12px; }
  .lb-col-phone { width: 14%; font-size: 12px; color: var(--text-muted); }
  .lb-no-email { color: var(--red); font-style: italic; font-size: 11px; }

  .lb-empty {
    padding: 60px 20px;
    text-align: center;
    color: var(--text-muted);
    font-size: 14px;
  }

  @media (max-width: 800px) {
    .lb-grid { grid-template-columns: 1fr; }
    .lb-panel { max-height: 380px; }
    .lb-results-hd { flex-direction: column; align-items: stretch; }
    .lb-col-phone { display: none; }
  }

  /* ================================================================
     DEMO PERSONA BAR (top strip — removed in production)
     ================================================================ */
  .persona-bar {
    background: var(--text);
    color: var(--white);
    padding: 6px 16px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    flex-wrap: wrap;
  }
  .persona-bar__label {
    color: rgba(255,255,255,0.55);
    text-transform: uppercase;
    letter-spacing: 0.15em;
    font-weight: 700;
    font-variation-settings: 'wght' 700;
    font-size: 9px;
  }
  .persona-btn {
    background: none;
    border: 1px solid rgba(255,255,255,0.18);
    color: rgba(255,255,255,0.75);
    padding: 3px 10px;
    font-family: var(--font);
    font-size: 11px;
    font-weight: 600;
    font-variation-settings: 'wght' 600;
    border-radius: 3px;
    cursor: pointer;
    transition: all 0.12s;
  }
  .persona-btn:hover { border-color: rgba(255,255,255,0.4); color: var(--white); }
  .persona-btn[aria-pressed="true"] {
    background: var(--primary);
    border-color: var(--primary);
    color: var(--white);
  }
  .persona-btn span {
    color: rgba(255,255,255,0.5);
    font-size: 10px;
    font-weight: 400;
    font-variation-settings: 'wght' 400;
    margin-left: 3px;
  }
  .persona-btn[aria-pressed="true"] span { color: rgba(255,255,255,0.8); }

  /* Elements gated by persona — hidden by default, shown when enabled */
  .persona-gated { display: none; }
  .persona-gated.is-shown { display: inline-flex; }

  /* Club page topbar with back link + manage button */
  .club-topbar {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
  }
  .club-topbar #manageMyClubBtn {
    margin-left: auto;  /* when shown, pushes to right; when hidden, nothing to push */
    /* Use brand red for "Manage my club" to make it distinctive from the navy */
    background: var(--primary);
  }
  .club-topbar #manageMyClubBtn:hover { background: var(--primary-600); }

  /* ================================================================
     MANAGE CONTACTS (v0.9 — two-surface model)
     ================================================================ */

  /* Club picker table (admin-only landing) */
  .mc-picker-intro { margin-bottom: 20px; }
  .mc-picker-intro h2 { margin: 0; font-size: 22px; font-weight: 900; font-variation-settings: 'wght' 900; letter-spacing: -0.01em; }
  .mc-picker-intro p { margin: 4px 0 0 0; font-size: 14px; color: var(--text-muted); }

  .mc-picker-filter {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    display: flex;
    gap: 10px;
    align-items: center;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }
  .mc-picker-filter input {
    flex: 1; min-width: 180px;
    font-family: var(--font); font-size: 13px;
    padding: 6px 10px;
    border: 1px solid var(--border);
    border-radius: 4px;
  }
  .mc-picker-filter input:focus { outline: none; border-color: var(--navy); }
  .mc-picker-pill {
    font-size: 11px;
    font-weight: 700;
    font-variation-settings: 'wght' 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 5px 10px;
    border: 1px solid var(--border);
    background: var(--white);
    color: var(--text);
    border-radius: 3px;
    cursor: pointer;
    transition: all 0.12s;
  }
  .mc-picker-pill[aria-pressed="true"] {
    background: var(--navy);
    color: var(--white);
    border-color: var(--navy);
  }

  .mc-clubs-table {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  .mc-clubs-table table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .mc-clubs-table th {
    text-align: left; padding: 10px 14px; background: var(--off-white);
    font-size: 9px; font-weight: 700; font-variation-settings: 'wght' 700;
    text-transform: uppercase; letter-spacing: 0.14em;
    color: var(--text-muted);
    border-bottom: 1px solid var(--border);
  }
  .mc-clubs-table td { padding: 10px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  .mc-clubs-table tbody tr { cursor: pointer; transition: background 0.1s; }
  .mc-clubs-table tbody tr:hover { background: var(--off-white); }
  .mc-club-cell { display: flex; align-items: center; gap: 10px; }
  .mc-club-cell img { width: 22px; height: 22px; flex-shrink: 0; object-fit: contain; }
  .mc-club-cell span { font-weight: 700; font-variation-settings: 'wght' 700; }
  .mc-div-pill {
    font-size: 10px; padding: 2px 7px; border-radius: 2px; color: var(--white);
    font-weight: 700; font-variation-settings: 'wght' 700; letter-spacing: 0.1em;
  }
  .mc-div-pill--national { background: var(--navy); }
  .mc-div-pill--north { background: var(--amber); }
  .mc-div-pill--south { background: var(--green); }
  .mc-status-pill {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 11px; padding: 3px 8px; border-radius: 3px;
    background: var(--off-white); color: var(--text-muted);
  }
  .mc-status-pill--warn { background: var(--amber-light); color: var(--amber-deep); }
  .mc-status-pill--good { background: var(--green-light); color: var(--green); }
  .mc-action-col { text-align: right; }
  .mc-action-col a {
    font-size: 12px; color: var(--primary); font-weight: 700;
    font-variation-settings: 'wght' 700;
  }

  /* Editor header */
  .mc-back-bar {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 16px;
  }
  .mc-back-bar .btn { margin: 0; }
  .mc-title h2 {
    margin: 0; font-size: 20px;
    font-weight: 900; font-variation-settings: 'wght' 900;
    display: flex; align-items: center; gap: 10px;
  }
  .mc-title h2 img { width: 28px; height: 28px; object-fit: contain; }
  .mc-title .mc-title-sub { font-size: 13px; color: var(--text-muted); margin-top: 2px; }

  /* Demo banner */
  .mc-demo-banner {
    background: var(--amber-light);
    border: 1px solid color-mix(in srgb, var(--amber) 35%, white);
    border-radius: 6px;
    padding: 10px 14px;
    font-size: 12px;
    color: var(--amber-deep);
    margin-bottom: 16px;
    line-height: 1.5;
  }
  .mc-demo-banner b { font-weight: 700; font-variation-settings: 'wght' 700; }

  /* Two-surface tabbed layout */
  .mc-surface-tabs {
    display: flex;
    gap: 4px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 16px;
  }
  .mc-surface-tab {
    background: none;
    border: none;
    padding: 10px 18px;
    font-family: var(--font);
    font-size: 13px;
    font-weight: 700;
    font-variation-settings: 'wght' 700;
    color: var(--text-muted);
    cursor: pointer;
    position: relative;
    top: 1px;
    border-bottom: 2px solid transparent;
    transition: all 0.12s;
  }
  .mc-surface-tab:hover { color: var(--text); }
  .mc-surface-tab[aria-selected="true"] {
    color: var(--navy);
    border-bottom-color: var(--primary);
  }
  .mc-surface-tab .mc-tab-count {
    display: inline-block;
    font-size: 10px;
    background: var(--off-white);
    color: var(--text-muted);
    padding: 1px 7px;
    border-radius: 10px;
    margin-left: 6px;
    font-weight: 600;
    font-variation-settings: 'wght' 600;
  }
  .mc-surface-tab[aria-selected="true"] .mc-tab-count {
    background: var(--navy);
    color: var(--white);
  }

  /* Surface panels */
  .mc-surface { display: none; }
  .mc-surface.is-active { display: block; }

  /* ========== SURFACE 1: People list ========== */
  .mc-people-actions {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  .mc-people-search {
    flex: 1; min-width: 220px;
    font-family: var(--font); font-size: 13px;
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--white);
  }
  .mc-people-search:focus { outline: none; border-color: var(--navy); }

  .mc-add-person-btn {
    background: var(--navy);
    color: var(--white);
    border: none;
    padding: 8px 16px;
    border-radius: 4px;
    font-family: var(--font); font-size: 12px;
    font-weight: 700; font-variation-settings: 'wght' 700;
    text-transform: uppercase; letter-spacing: 0.08em;
    cursor: pointer;
    transition: background 0.12s;
  }
  .mc-add-person-btn:hover { background: var(--navy-600); }

  .mc-people-list {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  .mc-person-card {
    display: flex;
    gap: 14px;
    padding: 16px 18px;
    border-bottom: 1px solid var(--border);
    align-items: flex-start;
    cursor: pointer;
    transition: background 0.1s;
  }
  .mc-person-card:last-child { border-bottom: none; }
  .mc-person-card:hover { background: var(--off-white); }
  .mc-person-card.is-selected {
    background: color-mix(in srgb, var(--navy) 8%, white);
    box-shadow: inset 3px 0 0 var(--navy);
  }
  .mc-person-card__avatar {
    flex: 0 0 42px; width: 42px; height: 42px;
    border-radius: 50%;
    background: var(--navy-100); color: var(--navy);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-variation-settings: 'wght' 800;
    letter-spacing: 0.02em;
  }
  .mc-person-card-main { flex: 1; min-width: 0; }
  .mc-person-card__top { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .mc-person-card-name {
    font-variation-settings: 'wght' 800;
    font-size: 16px; color: var(--text); line-height: 1.2;
  }
  .mc-person-card__role {
    font-size: 12px; color: var(--text-muted);
    font-variation-settings: 'wght' 600;
  }
  .mc-person-card-contact {
    font-size: 13px;
    color: var(--text-muted);
    margin-top: 5px;
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
  }
  .mc-person-card-contact a { color: var(--navy); font-variation-settings: 'wght' 600; }
  .mc-person-card__nocontact { font-style: italic; }
  .mc-person-card-depts {
    margin-top: 10px;
    display: flex; flex-wrap: wrap; gap: 6px;
  }
  .mc-person-card__tag {
    font-size: 11px; line-height: 1.4;
    background: var(--off-white);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 3px 9px;
    color: var(--text);
  }
  .mc-person-card__tag b {
    font-variation-settings: 'wght' 700;
    color: var(--navy);
  }
  /* Primary role — filled navy so it reads as the headline; others stay light. */
  .mc-person-card__tag--primary {
    background: var(--navy); border-color: var(--navy); color: #fff;
  }
  .mc-person-card__tag--primary b { color: #fff; }
  .mc-person-card__tag--none {
    background: transparent; border: 1px dashed var(--border);
    color: var(--text-muted); font-style: italic;
  }
  .mc-person-card-actions {
    display: flex;
    gap: 6px;
  }
  .mc-person-card-btn {
    background: none;
    border: 1px solid var(--border);
    padding: 5px 11px;
    font-family: var(--font); font-size: 11px;
    font-weight: 600; font-variation-settings: 'wght' 600;
    color: var(--text);
    border-radius: 3px;
    cursor: pointer;
    transition: all 0.12s;
  }
  .mc-person-card-btn:hover { border-color: var(--navy); color: var(--navy); }
  .mc-person-card-btn--danger:hover { border-color: var(--red); color: var(--red); }

  /* Right-side slide-out panel for editing a person */
  .mc-person-panel-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.35);
    z-index: 150;
    animation: fadein 0.15s;
  }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  @keyframes modalpop { from { opacity: 0; transform: translate(-50%, -48%) scale(0.98); } to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
  .mc-person-panel {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 820px;
    max-width: 94vw;
    max-height: 90vh;
    background: var(--white);
    border-radius: 12px;
    box-shadow: 0 24px 64px rgba(0,0,0,0.28);
    overflow: hidden;
    z-index: 160;
    display: flex;
    flex-direction: column;
    animation: modalpop 0.16s ease-out;
  }
  .mc-person-panel__hd {
    padding: 18px 22px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }
  .mc-person-panel__hd h3 {
    margin: 0;
    font-size: 16px;
    font-weight: 900; font-variation-settings: 'wght' 900;
  }
  .mc-person-panel__hd-sub {
    font-size: 11px; color: var(--text-muted);
    margin-top: 2px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-weight: 700;
    font-variation-settings: 'wght' 700;
  }
  .mc-person-panel__close {
    background: none; border: none;
    font-size: 20px; line-height: 1;
    color: var(--text-muted);
    cursor: pointer;
    padding: 0 6px;
  }
  .mc-person-panel__close:hover { color: var(--text); }

  .mc-person-panel__body {
    flex: 1;
    padding: 22px;
    overflow-y: auto;
  }
  .mc-person-panel__field { margin-bottom: 14px; }
  .mc-person-panel__field label {
    display: block;
    font-size: 11px;
    font-weight: 700; font-variation-settings: 'wght' 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-muted);
    margin-bottom: 5px;
  }
  .mc-person-panel__field input {
    width: 100%;
    font-family: var(--font); font-size: 14px;
    padding: 8px 11px;
    border: 1px solid var(--border);
    border-radius: 4px;
  }
  .mc-person-panel__field input:focus { outline: none; border-color: var(--navy); }

  .mc-person-panel__depts-section {
    margin-top: 22px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .mc-person-panel__depts-section h4 {
    margin: 0 0 10px 0;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--navy);
    font-weight: 700; font-variation-settings: 'wght' 700;
  }
  .mc-person-panel__dept {
    font-size: 13px;
    color: var(--text);
    padding: 8px 12px;
    background: var(--off-white);
    border-radius: 4px;
    margin-bottom: 5px;
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }
  .mc-person-panel__dept-info {
    flex: 1;
    min-width: 0;
    line-height: 1.4;
  }
  .mc-person-panel__dept b {
    color: var(--navy);
    font-weight: 700; font-variation-settings: 'wght' 700;
  }
  .mc-person-panel__depts-empty {
    font-size: 12px; color: var(--text-muted);
    font-style: italic;
    padding: 10px 0;
  }
  .mc-person-panel__help {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 8px;
    line-height: 1.5;
  }

  /* ---- Person modal: role rows ---- */
  .mc-role-row {
    background: var(--off-white);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 12px;
    margin-bottom: 8px;
  }
  .mc-role-row__main {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .mc-role-row__section { flex: 0 0 38%; }
  .mc-role-row__title { flex: 1; min-width: 0; }
  .mc-role-row__main select,
  .mc-role-row__main input[type="text"] {
    font-family: var(--font); font-size: 13px;
    padding: 7px 9px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--white);
  }
  .mc-role-row__main select:focus,
  .mc-role-row__main input:focus { outline: none; border-color: var(--navy); }
  .mc-role-row__remove-spacer { display: inline-block; width: 28px; }
  .mc-role-row__opts {
    display: flex;
    gap: 16px;
    align-items: center;
    flex-wrap: wrap;
    margin-top: 8px;
    font-size: 12px;
    color: var(--text);
  }
  .mc-role-row__opt { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; }
  .mc-role-row__opt.is-disabled { color: var(--text-muted); cursor: not-allowed; }
  .mc-role-row__flags { display: inline-flex; gap: 12px; flex-wrap: wrap; }
  .mc-role-row__flag { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; }
  /* ---- Person modal: contacts (two columns — email | phone) ---- */
  .mc-contacts-cols {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
  }
  @media (max-width: 520px) { .mc-contacts-cols { grid-template-columns: 1fr; } }
  .mc-contacts-col__hd {
    font-size: 11px; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 0.08em;
    font-variation-settings: 'wght' 700;
    margin-bottom: 8px;
  }
  .mc-contact-row {
    display: flex; align-items: center; gap: 6px;
    margin-bottom: 8px;
  }
  .mc-contact-row__value { flex: 1; min-width: 0; }
  .mc-contact-row input[type="email"],
  .mc-contact-row input[type="tel"],
  .mc-contact-row input[type="text"] {
    font-family: var(--font); font-size: 13px;
    padding: 7px 9px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--white);
  }
  .mc-contact-row input:focus { outline: none; border-color: var(--navy); }
  .mc-contact-row input::placeholder { color: var(--navy-300); opacity: 1; }
  .mc-contacts-col__empty {
    font-size: 12px; color: var(--text-muted);
    font-style: italic; margin-bottom: 8px;
  }
  .mc-contacts-col .btn { display: inline-flex; margin-top: 4px; }
  /* On its own line, well clear of the +Add button above it. */
  .mc-person-panel__nonebox {
    display: flex; align-items: center; gap: 6px;
    margin-top: 16px;
    font-size: 12px; color: var(--text-muted);
    cursor: pointer;
  }

  .mc-person-panel__ftr {
    padding: 14px 22px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    background: var(--off-white);
  }
  .mc-person-panel__danger {
    background: none; border: none;
    color: var(--red);
    font-family: var(--font); font-size: 12px;
    font-weight: 600; font-variation-settings: 'wght' 600;
    cursor: pointer;
    padding: 6px 8px;
    text-decoration: underline;
  }
  .mc-person-panel__danger:hover { color: var(--red-deep); }

  .mc-person-panel__ftr .mc-save-btn,
  .mc-person-panel__ftr .mc-cancel-btn {
    font-family: var(--font); font-size: 12px;
    font-weight: 700; font-variation-settings: 'wght' 700;
    text-transform: uppercase; letter-spacing: 0.08em;
    padding: 7px 16px; border-radius: 4px;
    cursor: pointer;
  }
  .mc-save-btn {
    background: var(--navy); color: var(--white); border: none;
  }
  .mc-save-btn:hover { background: var(--navy-600); }
  .mc-cancel-btn {
    background: none; color: var(--text-muted);
    border: 1px solid var(--border);
  }
  .mc-cancel-btn:hover { border-color: var(--text-muted); color: var(--text); }

  /* Club details card (admin only) */
  .mc-details {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px 24px;
    margin-bottom: 16px;
  }
  .mc-field-row {
    display: grid;
    grid-template-columns: 180px 1fr;
    gap: 16px;
    padding: 6px 0;
    align-items: baseline;
  }
  .mc-field-label {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--text-muted); font-weight: 700; font-variation-settings: 'wght' 700;
  }
  .mc-field-value { font-size: 14px; }
  .mc-field-value--muted { color: var(--text-muted); font-style: italic; }
  .mc-field-input {
    width: 100%; font-family: var(--font); font-size: 14px;
    padding: 7px 10px;
    border: 1px solid var(--border);
    border-radius: 4px;
  }
  .mc-field-input:focus { outline: none; border-color: var(--navy); }

  /* Confirm dialog (shared) */
  .mc-confirm-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 200;
    padding: 20px;
  }
  .mc-confirm-box {
    background: var(--white);
    border-radius: 8px;
    padding: 24px 28px;
    max-width: 460px;
    width: 100%;
    box-shadow: 0 12px 48px rgba(0,0,0,0.25);
  }
  .mc-confirm-box h4 {
    margin: 0 0 10px 0;
    font-size: 16px;
    font-weight: 900; font-variation-settings: 'wght' 900;
  }
  .mc-confirm-box p {
    margin: 0 0 14px 0;
    font-size: 14px;
    color: var(--text);
    line-height: 1.6;
  }
  .mc-confirm-box p.mc-confirm-sub {
    color: var(--text-muted);
    font-size: 13px;
  }
  .mc-confirm-box-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 16px;

    .l1-grid { grid-template-columns: 1fr; }

</div>

  { key: 'slo',          label: 'SLO',                  match: function(sec, fn){ return fn === 'slo'; } }
];
var MAILING_LISTS_BY_KEY = (function(){ var m = {}; MAILING_LISTS.forEach(function(l){ m[l.key] = l; }); return m; })();

function roleMatchesList(role, list) {
  var fn = role['function'] || functionForTitle(role.title, role.section);
  return !!list.match(role.section, fn);
}
/* Default membership for a roles array (used live in the editor from roleRows,
   and from a stored person's roles). */
function listDerivedFromRoles(roles, listKey) {
  var list = MAILING_LISTS_BY_KEY[listKey];
  if (!list) return false;
  return (roles || []).some(function(r){ return roleMatchesList(r, list); });
}
/* Effective membership = explicit override if set, else the role-derived default. */
function effectiveOnList(roles, overrides, listKey) {
  if (overrides && Object.prototype.hasOwnProperty.call(overrides, listKey)) return !!overrides[listKey];
  return listDerivedFromRoles(roles, listKey);
}
function personOnList(person, listKey) {
  return effectiveOnList(person.roles, person.listOverrides, listKey);
}
/* Required lists a club has nobody on. */
function clubListGaps(club) {
  return MAILING_LISTS.filter(function(l){ return l.required; })
    .filter(function(l){ return !(club.people || []).some(function(p){ return personOnList(p, l.key); }); });
}

/* Expand a club's people[] into a list of (person, roleTitles[]) groups per section.
   If a person has >1 role in the same section they collapse into ONE entry with
   roleTitles joined by " / " at render time. */
function peopleBySection(club) {
  var out = {};
  for (var i = 0; i < club.people.length; i++) {
    var p = club.people[i];
    // bucket this person's roles by section
    var bucket = {};
    for (var j = 0; j < p.roles.length; j++) {
      var r = p.roles[j];
      if (!bucket[r.section]) bucket[r.section] = [];
      bucket[r.section].push(r.title);
    }
    for (var section in bucket) {
      if (!out[section]) out[section] = [];
      out[section].push({ person: p, roleTitles: bucket[section] });
    }
  }
  return out;
}

function joinRoles(titles) {

function townFromAddr(addr) {
  if (!addr) return '';

}

/* Phone helpers. Storage: UK numbers as bare 11 digits (no spaces); overseas
   kept verbatim with a leading +. Display: UK 11-digit grouped ##### ### ###;
   overseas and unusual lengths shown as-is. */
function normalisePhone(v) {
  v = (v || '').trim();
  if (!v) return '';
  if (v.charAt(0) === '+') return v.replace(/[^\d+]/g, '');
  return v.replace(/\D/g, '');
}
function formatPhone(v) {
  v = (v || '').trim();
  if (!v) return '';
  if (v.charAt(0) === '+') return v;            // overseas: leave as entered
  var d = v.replace(/\D/g, '');
  // UK grouping depends on the area-code length. Mobiles and most geographic
  // landlines are 5-3-3; the metropolitan 4-digit codes (0121, 0161, …) are
  // 4-3-4; the 02x 3-digit codes (020, 023, …) are 3-4-4; non-geographic
  // 03/08/09 are 4-3-4. Unknown lengths are shown as entered.
  if (d.length === 11) {
    if (d.slice(0, 2) === '07') return d.slice(0, 5) + ' ' + d.slice(5, 8) + ' ' + d.slice(8);      // mobile
    if (d.slice(0, 2) === '02') return d.slice(0, 3) + ' ' + d.slice(3, 7) + ' ' + d.slice(7);      // 020 7946 0123
    if (/^01(1\d|\d1)/.test(d)) return d.slice(0, 4) + ' ' + d.slice(4, 7) + ' ' + d.slice(7);      // 0121 234 5678
    if (/^0[389]/.test(d))      return d.slice(0, 4) + ' ' + d.slice(4, 7) + ' ' + d.slice(7);      // 0300 / 0800 / 09xx
    return d.slice(0, 5) + ' ' + d.slice(5, 8) + ' ' + d.slice(8);                                   // 01234 567 890
  }
  return v;                                     // unusual length: show as-is
}

function contactBits(p) {
  var bits = [];
  if (p.phone) bits.push('<span>' + esc(formatPhone(p.phone)) + '</span>');
  if (p.email) bits.push('<a href="mailto:' + esc(p.email) + '">' + esc(p.email) + '</a>');
  return bits;
}

/* Handbook facts grid — surfaced on first click into a club (assessment
   10/06/2026: the data felt buried). All values come from clubs-meta;
   empty fields are omitted, so ground-grading clubs just show less. */
function renderClubFacts(name) {
  var m = clubMeta(name);
  var facts = [];
  function fact(label, val, sub) {
    if (!val) return;
    facts.push('<div class="cp-fact"><div class="cp-fact__label">' + esc(label) + '</div>' +
      '<div class="cp-fact__value">' + esc(val) + '</div>' +
      (sub ? '<div class="cp-fact__sub">' + esc(sub) + '</div>' : '') +
    '</div>');
  }
  // Sponsor name only when there's a sponsor; never the unsponsored name too.
  fact('Stadium', m.stadium_sponsor_name || m.stadium_name);
  // Address sits high — it's one of the first things people look for.
  fact('Address', m.address, m.postcode || null);
  fact('Capacity',
    m.capacity != null ? Number(m.capacity).toLocaleString('en-GB') : null,
    m.capacity_seated != null ? Number(m.capacity_seated).toLocaleString('en-GB') + ' seated' : null);
  if (m.pitch && (m.pitch.dimensions || m.pitch.type)) {
    fact('Pitch', m.pitch.dimensions || m.pitch.type, m.pitch.dimensions ? (m.pitch.type || null) : null);
  }
  fact('Nearest station', Array.isArray(m.station) ? m.station.join(', ') : m.station);
  fact('FA membership', m.fa_membership);
  return facts.length ? '<div class="cp-facts">' + facts.join('') + '</div>' : '';
}

    var rows = '';

      if (k[key]) rows += '<div><span>' + labels[i] + '</span>' + esc(k[key]) + '</div>';
    });
    return rows ? '<div class="cp-kit__col"><div class="cp-kit__hd">' + esc(label) + '</div>' + rows + '</div>' : '';
  }
  var kitCols =
    kitCol('Home kit', kit.home, ['shirts', 'shorts', 'socks'], ['Shirts', 'Shorts', 'Socks']) +
    kitCol('Away kit', kit.away, ['shirts', 'shorts', 'socks'], ['Shirts', 'Shorts', 'Socks']) +
    kitCol('Goalkeeper', kit.gk, ['first', 'second'], ['First', 'Second']);
  if (kitCols) {
    blocks.push('<div class="cp-panel"><div class="cp-panel__hd">Kit</div><div class="cp-kit">' + kitCols + '</div></div>');
  }

  var sp = m.sponsors || {};
  var spRows = '';
  if (sp.main_club)   spRows += '<div><span>Main club sponsor</span>' + esc(sp.main_club) + '</div>';
  if (sp.main_shirt)  spRows += '<div><span>Main shirt sponsor</span>' + esc(sp.main_shirt) + '</div>';
  if (sp.left_sleeve) spRows += '<div><span>Left sleeve</span>' + esc(sp.left_sleeve) + '</div>';
  if (spRows) {
    blocks.push('<div class="cp-panel"><div class="cp-panel__hd">Sponsors</div><div class="cp-sponsors">' + spRows + '</div></div>');
  }
  return blocks.length ? '<div class="cp-strips">' + blocks.join('') + '</div>' : '';
}

function renderClubStyle2(club) {
  var bySec = peopleBySection(club);
  var rows = '';
  SECTION_ORDER.forEach(function(s) {
    if (!bySec[s]) return;
    var entries = bySec[s] || [];

    // Full-width section header row (inner span carries the underline so it only
    // underlines the text, not the whole table width)
    rows += '<tr class="s2-sec-row"><td colspan="4"><span class="s2-sec-hd">' + esc(s) + '</span></td></tr>';

    // Split entries into (a) names-joined and (b) regular
    // For each names-joined role title, collapse matching entries into one row.
    // Everyone else renders as a normal row.
    var joinedByTitle = {};   // e.g. "Director" -> [person, person, ...]
    var regularEntries = [];

    entries.forEach(function(e) {
      // Find the first (and likely only) role in this entry's roleTitles that's a joined-role type
      var joinedTitle = null;
      for (var i = 0; i < e.roleTitles.length; i++) {
        if (NAMES_JOINED_ROLES[e.roleTitles[i]]) {
          joinedTitle = e.roleTitles[i];
          break;
        }
      }
      // If this entry's ONLY role in this section is a names-joined type, collapse it
      if (joinedTitle && e.roleTitles.length === 1) {
        if (!joinedByTitle[joinedTitle]) joinedByTitle[joinedTitle] = [];
        joinedByTitle[joinedTitle].push(e.person);
      } else {
        regularEntries.push(e);
      }
    });

    // Render joined rows first (Directors/Co-Chairs sit at the top of their section)
    Object.keys(joinedByTitle).forEach(function(title) {
      var people = joinedByTitle[title];
      var names = people.map(function(p) { return esc(p.name); }).join(', ');
      var pluralTitle = NAMES_JOINED_ROLES[title];
      rows += '<tr class="s2-joined-row">' +
        '<td class="s2-role">' + esc(pluralTitle) + '</td>' +
        '<td class="s2-name" colspan="3">' + names + '</td>' +
      '</tr>';
    });

    // Render individual rows — alphabetical by name.
    regularEntries.sort(function(a, b) {
      return (a.person.name || '').localeCompare(b.person.name || '');
    });
    regularEntries.forEach(function(e) {
      var p = e.person;
      var roleLabel = joinRoles(e.roleTitles);
      var email = personEmails(p).map(function(em) {
        return '<a href="mailto:' + esc(em) + '">' + esc(em) + '</a>';
      }).join('<br>');
      rows += '<tr data-person-id="' + esc(p._id || '') + '">' +
        '<td class="s2-role">' + esc(roleLabel) + '</td>' +
        '<td class="s2-name">' + esc(p.name) + '</td>' +
        '<td class="s2-phone">' + esc(formatPhone(p.phone||'')) + '</td>' +
        '<td class="s2-email">' + email + '</td>' +
      '</tr>';
    });
  });
  var m = clubMeta(club.name);
  var accent = (m.colors && m.colors.primary) || 'var(--navy)';
  var divFull = DIVISION_FULL_NAMES[divisionOf(club.name)] || divisionOf(club.name);
  var stadiumLine = stadiumDisplay(club.name);

  var chips = '';
  if (club.phone)   chips += '<span class="cp-chip">' + esc(formatPhone(club.phone)) + '</span>';
  if (club.email)   chips += '<a class="cp-chip" href="mailto:' + esc(club.email) + '">' + esc(club.email) + '</a>';
  if (club.website) chips += '<a class="cp-chip" href="https://' + esc(club.website) + '" target="_blank" rel="noopener">' + esc(club.website) + '</a>';

  var peopleHtml;
  if (!rows) {
    peopleHtml = '<div class="cp-empty">No contacts listed for ' + esc(club.name) + ' yet.' +
      (state.persona === 'club-editor' && EDITOR_CLUB === club.name
        ? ' Use “Manage my club” above to add your people.'
        : '') +
    '</div>';
  } else {
    peopleHtml = '<table class="s2-table">' +
      '<thead><tr><th>Role</th><th>Name</th><th>Phone</th><th>Email</th></tr></thead>' +
      '<tbody>' + rows + '</tbody>' +
    '</table>';
  }

  return '<div class="s2-club" style="border-top:4px solid ' + esc(accent) + ';">' +
    '<div class="s2-header">' +
      '<img class="s2-crest" src="' + crestUrl(club.name) + '" alt="" onerror="this.onerror=null;this.src=\'' + fallbackCrest() + '\'">' +
      '<div class="s2-header__main">' +
        '<h2>' + esc(club.name) + '<span class="s2-div">' + esc(divFull) + '</span></h2>' +
        (stadiumLine ? '<div class="cp-stadium">' + esc(stadiumLine) + '</div>' : '') +
        (chips ? '<div class="cp-contact"><span class="cp-contact__label">Club correspondence</span>' + chips + '</div>' : '') +
      '</div>' +
    '</div>' +
    renderClubFacts(club.name) +
    renderClubKitAndSponsors(club.name) +
    '<div class="cp-correction">Club details above are managed by the League. Spotted an error? ' +
      '<a href="' + correctionMailto(club.name) + '">Request a correction</a>.</div>' +
    peopleHtml +
  '</div>';
}

function firstPersonWithMainRole(club, roleTitle) {
  for (var i = 0; i < club.people.length; i++) {
    var p = club.people[i];
    for (var j = 0; j < p.roles.length; j++) {
      if (p.roles[j].main && p.roles[j].title === roleTitle) return p;
    }
  }
  return null;
}
function firstPersonInSection(club, section) {
  for (var i = 0; i < club.people.length; i++) {
    var p = club.people[i];
    for (var j = 0; j < p.roles.length; j++) {
      if (p.roles[j].section === section) return p;
    }
  }
  return null;
}

// In production these come from the user's role.
function isClubPersona() { return state.persona === 'club-editor' || state.persona === 'club-viewer'; }
function personaCan(capability) {
  var p = state.persona;
  /* Live editing needs the RTDB corpus (phase C). Until the one-off seed
     import runs, manage capabilities are off for everyone — superadmin
     sees the import banner on the directory listing instead. */
  if (!RTDB.seeded && (capability === 'manageContacts' || capability === 'manageOwnClub' || capability === 'editClubDetails')) {
    return false;
  }
  switch (capability) {
    case 'listBuilder':    return p === 'staff' || p === 'admin';
    case 'manageContacts': return p === 'admin';
    case 'manageOwnClub':  return p === 'club-editor' || p === 'admin';
    case 'editClubDetails': return p === 'admin';
    case 'viewActivity':   return p === 'admin';
    case 'viewDashboard':  return p === 'club-editor' || p === 'club-viewer' || p === 'staff' || p === 'admin';
    case 'dataCleanup':    return !!(window.NL && NL.session && NL.session.role === 'superadmin');
    default: return false;
  }
}

/* Global people search — match across ALL clubs by name, role title or email.
   Returns up to `cap` hits, each with the club + the person's primary role. */
function searchPeople(q, cap) {
  q = (q || '').trim().toLowerCase();
  if (!q) return [];
  cap = cap || 60;
  var hits = [];
  for (var ci = 0; ci < window.CLUBS.length && hits.length < cap; ci++) {
    var c = window.CLUBS[ci];
    for (var pi = 0; pi < c.people.length && hits.length < cap; pi++) {
      var p = c.people[pi];
      var name = (p.name || '').toLowerCase();
      var roleHit = (p.roles || []).some(function(r){ return (r.title || '').toLowerCase().indexOf(q) !== -1; });
      var emailHit = personEmails(p).some(function(em){ return em.toLowerCase().indexOf(q) !== -1; });
      if (name.indexOf(q) === -1 && !roleHit && !emailHit) continue;
      var pr = mainRole(p);
      hits.push({ club: c.name, person: p, roleLabel: pr && pr.title ? pr.title : '' });
    }
  }
  return hits;
}

function filteredClubs() {
  var q = state.searchQuery.trim().toLowerCase();
  if (!q) return window.CLUBS;
  return window.CLUBS.filter(function(c) {
    if (c.name.toLowerCase().indexOf(q) !== -1) return true;
    if ((addressOf(c.name)||'').toLowerCase().indexOf(q) !== -1) return true;
    return c.people.some(function(p) {
      if ((p.name||'').toLowerCase().indexOf(q) !== -1) return true;
      return p.roles.some(function(r) { return r.title.toLowerCase().indexOf(q) !== -1; });
    });
  });
}

/* ---- Back-button anchoring (History API) ----
   Navigation is state-driven; without this the browser Back button leaves the
   tool entirely (→ portal). We snapshot the meaningful view (scene + club +
   manage surface) and push a history entry whenever it changes, so Back steps
   list ↔ club ↔ section within the tool. Hooked at the three leaf renderers
   (showScene / renderClubPicker / renderEditor); dedup by hash means ordinary
   re-renders (after an edit) never push. */
var _navSuppress = false;
function navSnapshot() {
  return {
    nav: true,
    viewMode: state.viewMode || 'directory',
    viewing: state.viewing || null,
    editingClub: (state.manage && state.manage.editingClub) || null,
    surface: (state.manage && state.manage.surface) || 'people'
  };
}
function navHash(s) {
  if (s.viewMode === 'manage') {
    return s.editingClub
      ? '#manage/' + encodeURIComponent(s.editingClub) + '/' + (s.surface || 'people')
      : '#manage';
  }
  if (s.viewMode && s.viewMode !== 'directory') return '#' + s.viewMode;
  if (s.viewing) return '#club/' + encodeURIComponent(s.viewing);
  return '#';
}
function syncHistory() {
  if (_navSuppress) return;
  var s = navSnapshot();
  var hash = navHash(s);
  var cur = history.state;
  if (cur && cur.nav && navHash(cur) === hash) return;          // unchanged — no push
  if (!cur || !cur.nav) history.replaceState(s, '', hash);      // seed the base entry
  else history.pushState(s, '', hash);
}
function applyNav(s) {
  _navSuppress = true;
  state.viewMode = s.viewMode || 'directory';
  state.viewing = s.viewing || null;
  if (state.manage) {
    state.manage.editingClub = s.editingClub || null;
    if (s.surface) state.manage.surface = s.surface;
    // Drop any transient edit state when moving via the back/forward buttons.
    state.manage.editingPersonId = null;
    state.manage.personDraft = null;
    state.manage.editingDetails = null;
  }
  showScene();
  _navSuppress = false;
}
window.addEventListener('popstate', function(e) {
  applyNav((e.state && e.state.nav) ? e.state
    : { viewMode: 'directory', viewing: null, editingClub: null, surface: 'people' });
});

function showScene() {
  var listing = document.getElementById('scene-listing');
  var club = document.getElementById('scene-club');
  var builder = document.getElementById('scene-builder');
  var manage = document.getElementById('scene-manage');
  var audit = document.getElementById('scene-audit');
  var cleanup = document.getElementById('scene-cleanup');
  [listing, club, builder, manage, audit, cleanup].forEach(function(s){ s.classList.remove('scene--active'); });

  var dashboard = document.getElementById('scene-dashboard');
  dashboard.classList.remove('scene--active');
  if (state.viewMode === 'dashboard') {
    dashboard.classList.add('scene--active');
    renderDashboardScene();
  } else if (state.viewMode === 'cleanup') {
    cleanup.classList.add('scene--active');
    renderCleanupScene();
  } else if (state.viewMode === 'audit') {
    audit.classList.add('scene--active');
    renderAuditScene();
  } else if (state.viewMode === 'manage') {
    manage.classList.add('scene--active');
    renderManage();
  } else if (state.viewMode === 'builder') {
    builder.classList.add('scene--active');
    renderBuilder();
  } else if (state.viewing) {
    club.classList.add('scene--active');
    renderClub();
    updateManageMyClubButton();
  } else {
    listing.classList.add('scene--active');
    renderListing();
  }

  // Keep view-mode button pressed states in sync with state.viewMode
  var group = document.getElementById('clubStyleGroup');
  if (group) {
    group.querySelectorAll('[data-view-mode]').forEach(function(b) {
      b.setAttribute('aria-pressed', b.getAttribute('data-view-mode') === state.viewMode ? 'true' : 'false');
    });

  updatePersonaGatedElements();
  syncHistory();
  window.scrollTo(0, 0);
}

function updatePersonaGatedElements() {

/* ================================================================
   LIST BUILDER
   ================================================================ */

/* Recipients by mailing list: one row per person who is on any selected list
   at a selected club. Shaped like the department rows so the results table,
   dedup and export all work unchanged. Contact = the person (lists are about
   reaching the human, not a role inbox). */
function lbResultsByList() {
  var lists = state.lb.selectedLists || {};
  if (!Object.keys(lists).length) return [];
  var clubs = state.lb.selectedClubs;
  var allClubs = Object.keys(clubs).length === 0;   // no club filter = every club
  var out = [];
  window.CLUBS.forEach(function(c) {
    if (!allClubs && !clubs[c.name]) return;
    c.people.forEach(function(p) {
      var on = MAILING_LISTS.filter(function(l){ return lists[l.key] && personOnList(p, l.key); });
      if (!on.length) return;
      var labels = on.map(function(l){ return l.label; });
      var key = c.name + '|' + (p.name || '') + '|lists';
      out.push({
        key: key, club: c.name, division: divisionOf(c.name),
        section: labels.join(', '), person: p, vacant: false,
        roleTitles: labels, roleContacts: [], omitted: !!state.lb.omittedKeys[key]
      });
    });
  });
  out.sort(function(a, b) {
    if (a.club !== b.club) return a.club.localeCompare(b.club);
    return (a.person.name || '').localeCompare(b.person.name || '');
  });
  return out;
}

function lbResults() {
  if (state.lb.buildBy === 'list') return lbResultsByList();
  var depts = state.lb.selectedDepts;
  var clubs = state.lb.selectedClubs;
  var anyDept = Object.keys(depts).length > 0;
  var anyClub = Object.keys(clubs).length > 0;
  if (!anyDept || !anyClub) return [];

  var out = [];
  window.CLUBS.forEach(function(c) {
    if (!clubs[c.name]) return;
    c.people.forEach(function(p) {
      var matched = {};        // section -> [role titles]
      var matchedContacts = {}; // section -> [role-level contacts]
      p.roles.forEach(function(r) {
        if (!depts[r.section]) return;
        var sectionMeta = SECTIONS_BY_KEY[r.section];
        if (!sectionMeta) return;

        if (sectionMeta.type === 'checklist') {
          var subFilter = state.lb.checklistRoleFilter[r.section];
          var roleKey = r.roleKey || null;
          if (subFilter) {
            if (!roleKey) { if (!subFilter.__other) return; }
            else { if (!subFilter[roleKey]) return; }
          }
        } else if (sectionMeta.type === 'joined-names') {
          /* Directors — include all */
        } else {
          var flagF = state.lb.flagFilter[r.section];
          if (flagF && Object.keys(flagF).length) {
            var roleFlags = r.flags || {};
            var matchesAnyFlag = Object.keys(flagF).some(function(fk){ return roleFlags[fk]; });
            if (!matchesAnyFlag) return;
          }
        }

        if (!matched[r.section]) { matched[r.section] = []; matchedContacts[r.section] = []; }
        matched[r.section].push(r.title);
        (r.contacts || []).forEach(function(rc){ matchedContacts[r.section].push(rc); });
      });
      Object.keys(matched).forEach(function(section) {
        var key = c.name + '|' + (p.name||'') + '|' + section;
        out.push({
          key: key,
          club: c.name,
          division: divisionOf(c.name),
          section: section,
          person: p,
          vacant: false,
          roleTitles: matched[section],
          roleContacts: matchedContacts[section],
          omitted: !!state.lb.omittedKeys[key]
        });
      });
    });
  });

  out.sort(function(a, b) {
    var sa = SECTION_ORDER.indexOf(a.section);
    var sb = SECTION_ORDER.indexOf(b.section);
    if (sa !== sb) return sa - sb;
    if (a.club !== b.club) return a.club.localeCompare(b.club);
    var an = a.person ? (a.person.name||'') : a.vacantTitle;
    var bn = b.person ? (b.person.name||'') : b.vacantTitle;
    return an.localeCompare(bn);
  });
  return out;
}

/* Resolve a result's contact points for the current contactMode.
   role mode: prefer the role-level inbox, fall back to the person's
   preferred. person mode: the reverse. Vacant rows only have role
   contacts. Returns { emails:[], phone:'' }. */
function resolveResultContacts(r) {
  function emailsOf(list) { return (list||[]).filter(function(c){return c.type==='email'&&c.value;}).map(function(c){return c.value;}); }
  function phoneOf(list)  { var c=(list||[]).filter(function(x){return x.type==='phone'&&x.value;})[0]; return c?c.value:''; }
  var roleEmails = emailsOf(r.roleContacts);
  var rolePhone = phoneOf(r.roleContacts);
  var personEmailList = r.person ? personEmails(r.person) : [];
  var personPhone = r.person ? (preferredContact(r.person,'phone')||'') : '';
  var emails, phone;
  if (state.lb.contactMode === 'role') {
    emails = roleEmails.length ? roleEmails : personEmailList;
    phone  = rolePhone || personPhone;
  } else {
    emails = personEmailList.length ? personEmailList : roleEmails;
    phone  = personPhone || rolePhone;
  }
  return { emails: emails, phone: phone };
}

/* Collapse results to one row per human (and one per vacant post),
   unioning their matched roles + resolved contacts. Used for export. */
function lbDedupedRows(includeOmitted) {
  var results = lbResults().filter(function(r){ return includeOmitted || !r.omitted; });
  var map = {}; var order = [];
  results.forEach(function(r) {
    var key = r.person ? (r.club + '|p|' + r.person._id) : (r.club + '|v|' + r.vacantTitle);
    if (!map[key]) {
      map[key] = { name: r.person ? (r.person.name||'') : (r.vacantTitle + ' (vacant)'),
        club: r.club, division: r.division, vacant: r.vacant,
        sections: [], roleLabels: [], emails: [], phones: [] };
      order.push(key);
    }
    var row = map[key];
    if (row.sections.indexOf(r.section) === -1) row.sections.push(r.section);
    r.roleTitles.forEach(function(t){ if (row.roleLabels.indexOf(t) === -1) row.roleLabels.push(t); });
    var rc = resolveResultContacts(r);
    rc.emails.forEach(function(e){ if (row.emails.indexOf(e) === -1) row.emails.push(e); });
    if (rc.phone && row.phones.indexOf(rc.phone) === -1) row.phones.push(rc.phone);
  });
  return order.map(function(k){ return map[k]; });
}

/* Total people on a list across every club — shown as a count per list. */
function listMemberCount(listKey) {

  window.CLUBS.forEach(function(c) {

}

function renderBuilderDepts() {
  // The builder is mailing-list-first; department mode is retired from the UI.
  if (state.lb.buildBy === 'list') { renderBuilderLists(); return; }
  var root = document.getElementById('lbDepts');
  var html = SECTION_ORDER.map(function(section) {
    var meta = SECTIONS_BY_KEY[section];
    var id = 'lb-dept-' + section.replace(/[^a-z0-9]+/gi,'-');
    var checked = state.lb.selectedDepts[section] ? 'checked' : '';
    var selected = !!state.lb.selectedDepts[section];

    // Small label to the right of the dept name showing section type
    var typeNote = '';
    if (meta) {
      if (meta.type === 'joined-names') typeNote = ' <span class="lb-section-count">(names only)</span>';
      else if (meta.type === 'checklist') typeNote = ' <span class="lb-section-count">(role checklist)</span>';
    }

    // If this is a checklist section AND it's selected, expose sub-role tickboxes
    var subFilters = '';
    if (meta && meta.type === 'checklist' && selected) {
      var filter = state.lb.checklistRoleFilter[section] || {};
      // Default behaviour: all required + optional ticked, free-text NOT ticked
      var filterIsEmpty = Object.keys(filter).length === 0;

      var roles = (meta.requiredRoles || []).concat(meta.optionalRoles || []);
      var subRows = roles.map(function(rk) {
        var isOptional = (meta.optionalRoles || []).indexOf(rk) !== -1;
        var label = (meta.roleLabels && meta.roleLabels[rk]) || rk;
        var chkId = 'lb-subrole-' + rk;
        var isChecked = filterIsEmpty ? true : !!filter[rk];
        return '<div class="lb-role-row">' +
          '<input type="checkbox" id="' + chkId + '" data-checklist-section="' + esc(section) + '" data-checklist-role="' + esc(rk) + '"' + (isChecked?' checked':'') + '>' +
          '<label for="' + chkId + '">' + esc(rk) + ' — ' + esc(label) + (isOptional ? ' <span class="lb-section-count">(optional)</span>' : '') + '</label>' +
        '</div>';
      }).join('');

      // Free-text extras tickbox
      var otherChecked = filterIsEmpty ? false : !!filter.__other;
      subRows += '<div class="lb-role-row">' +
        '<input type="checkbox" id="lb-subrole-other" data-checklist-section="' + esc(section) + '" data-checklist-role="__other"' + (otherChecked?' checked':'') + '>' +
        '<label for="lb-subrole-other">Other liaison roles <span class="lb-section-count">(free-text extras)</span></label>' +
      '</div>';

      subFilters = '<div class="lb-roles-in-section">' + subRows + '</div>';
    }

    // If this is a section with flag keys (e.g. Media -> programmeEditor), expose them too
    var flagFiltersHtml = '';
    if (meta && meta.flagKeys && meta.flagKeys.length && selected) {
      var ff = state.lb.flagFilter[section] || {};
      var flagRows = meta.flagKeys.map(function(fk) {
        var chkId = 'lb-flag-' + section.replace(/[^a-z0-9]+/gi,'-') + '-' + fk.key;
        var isChecked = !!ff[fk.key];
        return '<div class="lb-role-row">' +
          '<input type="checkbox" id="' + chkId + '" data-flag-section="' + esc(section) + '" data-flag-key="' + esc(fk.key) + '"' + (isChecked ? ' checked' : '') + '>' +
          '<label for="' + chkId + '">Also: <b>' + esc(fk.label) + '</b> <span class="lb-section-count">(narrow to roles with this flag)</span></label>' +
        '</div>';
      }).join('');
      flagFiltersHtml = '<div class="lb-roles-in-section">' + flagRows + '</div>';
    }

    return '<div class="lb-section-group">' +
      '<div class="lb-section-row">' +
        '<input type="checkbox" id="' + id + '" data-dept="' + esc(section) + '" ' + checked + '>' +
        '<label for="' + id + '">' + esc(section) + '</label>' +
        typeNote +
      '</div>' +
      subFilters +
      flagFiltersHtml +
    '</div>';
  }).join('');
  root.innerHTML = html;
}

/* The clubs the builder is working over — the club filter, or all clubs when
   none are ticked. */
function builderClubSet() {
  var sel = state.lb.selectedClubs;
  if (Object.keys(sel).length) return window.CLUBS.filter(function(c){ return sel[c.name]; });
  return window.CLUBS.slice();
}
/* Coverage for a list over a club set: how many have someone, which don't. */
function coverageForList(listKey, clubs) {
  var missing = [];
  clubs.forEach(function(c) {
    if (!(c.people || []).some(function(p){ return personOnList(p, listKey); })) missing.push(c.name);
  });
  return { covered: clubs.length - missing.length, total: clubs.length, missing: missing };
}

/* Coverage warning: quietly flag the clubs with nobody on a selected list —
   crest + name, no fuss. Never blocks: the list still copies as-is. */
function renderBuilderWarnings() {
  var root = document.getElementById('lbWarnings');
  var selected = MAILING_LISTS.filter(function(l){ return state.lb.selectedLists[l.key]; });
  if (!selected.length) { root.innerHTML = ''; return; }
  var clubs = builderClubSet();
  var items = selected.map(function(l) {
    var cov = coverageForList(l.key, clubs);
    if (!cov.missing.length) return '';
    var crests = cov.missing.slice(0, 30).map(function(cn) {
      return '<span class="lb-warning-crest">' +
        '<img src="' + crestUrl(cn) + '" alt="" onerror="this.onerror=null;this.src=\'' + fallbackCrest() + '\'">' +
        esc(cn) +
      '</span>';
    }).join('');
    var more = cov.missing.length > 30 ? ' <span style="color:var(--amber-deep);font-size:11px;">+' + (cov.missing.length - 30) + ' more</span>' : '';
    var n = cov.missing.length;
    return '<div class="lb-warnings__item">' +
      '<b>' + n + ' club' + (n===1?'':'s') + '</b> with nobody on <b>' + esc(l.label) + '</b>' +
      '<div class="lb-warnings__crests">' + crests + more + '</div>' +
    '</div>';
  }).filter(Boolean).join('');
  if (!items) { root.innerHTML = ''; return; }
  root.innerHTML = '<div class="lb-warnings">' +
    '<div class="lb-warnings__hd">⚠ Coverage gaps</div>' +
    items +
  '</div>';
}

function renderBuilderResults() {

  var byList = state.lb.buildBy === 'list';

    ? (byList ? 'pick mailing lists and clubs above' : 'pick departments and clubs above')
