  .filter(function(k){ return k !== 'Other'; });  // Other is catch-all, no head
var REQUIRED_HEAD_SECTIONS = HEAD_SECTIONS.filter(function(k){ return !OPTIONAL_HEAD_SECTIONS[k]; });

/* Per-section free-text title SUGGESTIONS for the person modal's role rows.
   Backed by a <datalist> — free text is always still allowed. Liaison
   officers derive from the section's roleLabels (DLO/PLO/CSLO/SLO); the
   rest are short, sensible lists inferred from functionForTitle()'s map. */
var TITLE_SUGGESTIONS = {
  'Leadership':            ['Chair', 'Vice Chair', 'President', 'Owner'],
  'Directors':            ['Director', 'Non-Executive Director'],
  'Executive':            ['Chief Executive', 'Managing Director', 'General Manager'],
  'Club secretary':        ['Club Secretary', 'Fixture Secretary', 'Assistant Secretary'],
  'Finance':              ['Finance Director', 'Financial Controller', 'Treasurer'],
  'Commercial':           ['Commercial Director', 'Commercial Manager', 'Ticketing Manager'],
  'Media & marketing':     ['Press Officer', 'Programme Editor', 'Marketing Manager', 'Social Media Manager'],
  'Matchday & safety':     ['Safety Officer', 'Operations Manager', 'Kit Manager'],
  'Medical':              ['Club Doctor', 'Physiotherapist', 'Sports Therapist'],
  'Community':            ['Community Manager', 'Community Officer'],
  'Safeguarding & welfare':['Safeguarding Lead', 'Welfare Officer'],
  'Other':                ['Volunteer Coordinator']
};
function titleSuggestionsFor(section) {
  var meta = SECTIONS_BY_KEY[section];
  if (meta && meta.roleLabels) {
    /* Liaison officers: full label list (DLO/PLO/CSLO/SLO). */
    var keys = (meta.requiredRoles || []).concat(meta.optionalRoles || []);
    return keys.map(function(rk){ return meta.roleLabels[rk] || rk; });
  }
  return TITLE_SUGGESTIONS[section] || [];
}
/* Liaison roles still carry a legacy roleKey (DLO/PLO/CSLO/SLO) so the
   department-surface checklist + list-builder liaison filter keep matching
   modal-created roles. Derived from the auto-computed function. */
var FUNCTION_TO_ROLEKEY = { dlo: 'DLO', plo: 'PLO', cslo: 'CSLO', slo: 'SLO' };
function roleKeyForRole(section, title) {
  if (section !== 'Liaison officers') return null;
  return FUNCTION_TO_ROLEKEY[functionForTitle(title, section)] || null;
}

function esc(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, function(c) {
    return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
  });
}
function crestUrl(name) {
  return 'https://raw.githubusercontent.com/thenationalleague/tools/refs/heads/main/assets/crests/' +
    encodeURIComponent(name) + '.png';
}
function fallbackCrest() {
  return 'https://raw.githubusercontent.com/thenationalleague/tools/refs/heads/main/assets/crests/National%20League%20rose.png';
}

/* Expand a club's people[] into a list of (person, roleTitles[]) groups per section.
   If a person has >1 role in the same section they collapse into ONE entry with
   roleTitles joined by " / " at render time. */
function peopleBySection(club) {
  var out = {};
  for (var i = 0; i < club.people.length; i++) {
    var p = club.people[i];
    // bucket this person's roles by section
    var bucket = {};
    var headBySection = {};
    for (var j = 0; j < p.roles.length; j++) {
      var r = p.roles[j];
      if (!bucket[r.section]) bucket[r.section] = [];
      bucket[r.section].push(r.title);
      if (r.deptHead) headBySection[r.section] = true;
    }
    for (var section in bucket) {
      if (!out[section]) out[section] = [];
      out[section].push({ person: p, roleTitles: bucket[section], isHead: !!headBySection[section] });
    }
  }
  return out;
}

function joinRoles(titles) {
  return titles.join(' / ');
}

function townFromAddr(addr) {
  if (!addr) return '';
  var parts = addr.split(',').map(function(s){ return s.trim(); });
  if (parts.length >= 2) return parts[parts.length - 2];
  return parts[0] || '';
}

// Best-effort extraction of stadium name from the raw address string.
// First comma-separated token is usually the stadium. Filters out tokens
// that are clearly not stadium names (clubs that start their address with
// the club name itself, like "Hartlepool United FC"). Returns empty string
// if nothing usable.

// Look up a club's static identity/handbook record (postcode, address,
// division, stadium, FA membership, kit, sponsors, etc.) from clubs-meta.
// Source of truth lives in /assets/data/clubs-meta.json — inlined as
// window.CLUBS_META at page load. The directory record (window.CLUBS)
// holds only contact details (phone/email/website/people).
function clubMeta(name) {
  return (window.CLUBS_META && window.CLUBS_META[name]) || {};
}
// Convenience: prefer current sponsor branding when set, fall back to the
// permanent stadium name, and last to deriving it from the address.
function stadiumOf(name) {
  var m = clubMeta(name);
  return m.stadium_sponsor_name || m.stadium_name || '';
}
// Returns "Glanford Park / Attis Arena" when both are set; otherwise just one.
function stadiumDisplay(name) {
  var m = clubMeta(name);
  if (m.stadium_name && m.stadium_sponsor_name && m.stadium_sponsor_name !== m.stadium_name) {
    return m.stadium_name + ' / ' + m.stadium_sponsor_name;
  }
  return m.stadium_name || m.stadium_sponsor_name || '';
}
function addressOf(name) { return clubMeta(name).address || ''; }
function divisionOf(name) { return clubMeta(name).division || ''; }
function faOf(name) { return clubMeta(name).fa_membership || ''; }

function mainRole(p) {
  for (var i = 0; i < p.roles.length; i++) if (p.roles[i].main) return p.roles[i];
  return p.roles[0];
}

function contactBits(p) {
  var bits = [];
  if (p.phone) bits.push('<span>' + esc(p.phone) + '</span>');
  if (p.email) bits.push('<a href="mailto:' + esc(p.email) + '">' + esc(p.email) + '</a>');
  return bits;
}

/* ================= STYLE 2 — Dense table =================
   Section headers: full-width navy bar with red section label + pluralised noun.
   Directors and Co-Chairs render as a single joined-names row.
   Other roles render one row per person. */

// Roles that are "names-joined" — one row per section, title pluralised, names comma-separated
var NAMES_JOINED_ROLES = { 'Director': 'Directors', 'Co-Chair': 'Co-Chairs' };

/* Locked clubs-meta fields are corrected by the League, not edited here.
   The mailto gives clubs a zero-friction way to flag an error. */
var CORRECTION_EMAIL = 'info@thenationalleague.org.uk';

function correctionMailto(name) {
  var subject = 'Club Directory correction — ' + name;
  var body = 'Club: ' + name +
    '\nField to correct: ' +
    '\nCurrent value: ' +
    '\nCorrect value: ' +
    '\nSource / evidence: ';
  return 'mailto:' + CORRECTION_EMAIL +
    '?subject=' + encodeURIComponent(subject) +
    '&body=' + encodeURIComponent(body);
}

/* Handbook facts grid — surfaced on first click into a club (assessment
   10/06/2026: the data felt buried). All values come from clubs-meta;
   empty fields are omitted, so ground-grading clubs just show less. */
function renderClubFacts(name) {
  var m = clubMeta(name);
  var facts = [];
  function fact(label, val, sub) {
    if (!val) return;
    facts.push('<div class="cp-fact"><div class="cp-fact__label">' + esc(label) + '</div>' +
      '<div class="cp-fact__value">' + esc(val) + '</div>' +
      (sub ? '<div class="cp-fact__sub">' + esc(sub) + '</div>' : '') +
    '</div>');
  }
  if (m.stadium_name && m.stadium_sponsor_name && m.stadium_sponsor_name !== m.stadium_name) {
    fact('Stadium', m.stadium_name, 'currently ' + m.stadium_sponsor_name);
  } else {
    fact('Stadium', m.stadium_name || m.stadium_sponsor_name);
  }
  fact('Capacity',
    m.capacity != null ? Number(m.capacity).toLocaleString('en-GB') : null,
    m.capacity_seated != null ? Number(m.capacity_seated).toLocaleString('en-GB') + ' seated' : null);
  if (m.pitch && (m.pitch.dimensions || m.pitch.type)) {
    fact('Pitch', m.pitch.dimensions || m.pitch.type, m.pitch.dimensions ? (m.pitch.type || null) : null);
  }
  fact('Nearest station', Array.isArray(m.station) ? m.station.join(', ') : m.station);
  fact('Address', m.address, m.postcode || null);
  fact('FA membership', m.fa_membership);
  return facts.length ? '<div class="cp-facts">' + facts.join('') + '</div>' : '';
}

/* Kit + sponsors panels (handbook data). Omitted entirely when empty. */
function renderClubKitAndSponsors(name) {
  var m = clubMeta(name);
  var blocks = [];

  var kit = m.kit || {};
  function kitCol(label, k, keys, labels) {
    if (!k) return '';
    var rows = '';
    keys.forEach(function(key, i) {
      if (k[key]) rows += '<div><span>' + labels[i] + '</span>' + esc(k[key]) + '</div>';
    });
    return rows ? '<div class="cp-kit__col"><div class="cp-kit__hd">' + esc(label) + '</div>' + rows + '</div>' : '';
  }
  var kitCols =
    kitCol('Home kit', kit.home, ['shirts', 'shorts', 'socks'], ['Shirts', 'Shorts', 'Socks']) +
    kitCol('Away kit', kit.away, ['shirts', 'shorts', 'socks'], ['Shirts', 'Shorts', 'Socks']) +
    kitCol('Goalkeeper', kit.gk, ['first', 'second'], ['First', 'Second']);
  if (kitCols) {
    blocks.push('<div class="cp-panel"><div class="cp-panel__hd">Kit</div><div class="cp-kit">' + kitCols + '</div></div>');
  }

  var sp = m.sponsors || {};
  var spRows = '';
  if (sp.main_club)   spRows += '<div><span>Main club sponsor</span>' + esc(sp.main_club) + '</div>';
  if (sp.main_shirt)  spRows += '<div><span>Main shirt sponsor</span>' + esc(sp.main_shirt) + '</div>';
  if (sp.left_sleeve) spRows += '<div><span>Left sleeve</span>' + esc(sp.left_sleeve) + '</div>';
  if (spRows) {
    blocks.push('<div class="cp-panel"><div class="cp-panel__hd">Sponsors</div><div class="cp-sponsors">' + spRows + '</div></div>');
  }
  return blocks.length ? '<div class="cp-strips">' + blocks.join('') + '</div>' : '';
}

function renderClubStyle2(club) {
  var bySec = peopleBySection(club);
  var vacBySec = {};
  (club.vacant || []).forEach(function(v) {
    (vacBySec[v.section] = vacBySec[v.section] || []).push(v);
  });
  var rows = '';
  SECTION_ORDER.forEach(function(s) {
    if (!bySec[s] && !vacBySec[s]) return;
    var entries = bySec[s] || [];

    // Full-width section header row (inner span carries the underline so it only
    // underlines the text, not the whole table width)
    rows += '<tr class="s2-sec-row"><td colspan="4"><span class="s2-sec-hd">' + esc(s) + '</span></td></tr>';

    // Split entries into (a) names-joined and (b) regular
    // For each names-joined role title, collapse matching entries into one row.
    // Everyone else renders as a normal row.
    var joinedByTitle = {};   // e.g. "Director" -> [person, person, ...]
    var regularEntries = [];

    entries.forEach(function(e) {
      // Find the first (and likely only) role in this entry's roleTitles that's a joined-role type
      var joinedTitle = null;
      for (var i = 0; i < e.roleTitles.length; i++) {
        if (NAMES_JOINED_ROLES[e.roleTitles[i]]) {
          joinedTitle = e.roleTitles[i];
          break;
        }
      }
      // If this entry's ONLY role in this section is a names-joined type, collapse it
      if (joinedTitle && e.roleTitles.length === 1) {
        if (!joinedByTitle[joinedTitle]) joinedByTitle[joinedTitle] = [];
        joinedByTitle[joinedTitle].push(e.person);
      } else {
        regularEntries.push(e);
      }
    });

    // Render joined rows first (Directors/Co-Chairs sit at the top of their section)
    Object.keys(joinedByTitle).forEach(function(title) {
      var people = joinedByTitle[title];
      var names = people.map(function(p) { return esc(p.name); }).join(', ');
      var pluralTitle = NAMES_JOINED_ROLES[title];
      rows += '<tr class="s2-joined-row">' +
        '<td class="s2-role">' + esc(pluralTitle) + '</td>' +
        '<td class="s2-name" colspan="3">' + names + '</td>' +
      '</tr>';
    });

    // Vacant assignments: role exists, contact route known, nobody named.
    (vacBySec[s] || []).forEach(function(v) {
      var vEmail = (v.contacts || []).filter(function(c) { return c.type === 'email' && c.value; })
        .map(function(c) { return '<a href="mailto:' + esc(c.value) + '">' + esc(c.value) + '</a>'; }).join('<br>');
      var vPhone = ((v.contacts || []).filter(function(c) { return c.type === 'phone' && c.value; })[0] || {}).value || '';
      rows += '<tr>' +
        '<td class="s2-role">' + esc(v.title) + '</td>' +
        '<td class="s2-name"><span class="pill pill--status pill--status-warn">vacant</span></td>' +
        '<td class="s2-phone">' + esc(vPhone) + '</td>' +
        '<td class="s2-email">' + vEmail + '</td>' +
      '</tr>';
    });

    // Render individual rows
    regularEntries.forEach(function(e) {
      var p = e.person;
      var roleLabel = joinRoles(e.roleTitles);
      var email = personEmails(p).map(function(em) {
        return '<a href="mailto:' + esc(em) + '">' + esc(em) + '</a>';
      }).join('<br>');
      var headBadge = e.isHead ? ' <span class="pill pill--marker">Head</span>' : '';
      rows += '<tr>' +
        '<td class="s2-role">' + esc(roleLabel) + '</td>' +
        '<td class="s2-name">' + esc(p.name) + headBadge + '</td>' +
        '<td class="s2-phone">' + esc(p.phone||'') + '</td>' +
        '<td class="s2-email">' + email + '</td>' +
      '</tr>';
    });
  });
  var m = clubMeta(club.name);
  var accent = (m.colors && m.colors.primary) || 'var(--navy)';
  var divFull = DIVISION_FULL_NAMES[divisionOf(club.name)] || divisionOf(club.name);
  var stadiumLine = stadiumDisplay(club.name);

  var chips = '';
  if (club.phone)   chips += '<span class="cp-chip">' + esc(club.phone) + '</span>';
  if (club.email)   chips += '<a class="cp-chip" href="mailto:' + esc(club.email) + '">' + esc(club.email) + '</a>';
  if (club.website) chips += '<a class="cp-chip" href="https://' + esc(club.website) + '" target="_blank" rel="noopener">' + esc(club.website) + '</a>';

  var peopleHtml;
  if (!rows) {
    peopleHtml = '<div class="cp-empty">No contacts listed for ' + esc(club.name) + ' yet.' +
      (state.persona === 'club-editor' && EDITOR_CLUB === club.name
        ? ' Use “Manage my club” above to add your people.'
        : '') +
    '</div>';
  } else {
    peopleHtml = '<table class="s2-table">' +
      '<thead><tr><th>Role</th><th>Name</th><th>Phone</th><th>Email</th></tr></thead>' +
      '<tbody>' + rows + '</tbody>' +
    '</table>';
  }

  return '<div class="s2-club" style="border-top:4px solid ' + esc(accent) + ';">' +
    '<div class="s2-header">' +
      '<img class="s2-crest" src="' + crestUrl(club.name) + '" alt="" onerror="this.onerror=null;this.src=\'' + fallbackCrest() + '\'">' +
      '<div class="s2-header__main">' +
        '<h2>' + esc(club.name) + '<span class="s2-div">' + esc(divFull) + '</span></h2>' +
        (m.nickname ? '<div class="cp-nickname">' + esc(m.nickname) + '</div>' : '') +
        (stadiumLine ? '<div class="cp-stadium">' + esc(stadiumLine) + '</div>' : '') +
        (chips ? '<div class="cp-contact">' + chips + '</div>' : '') +
      '</div>' +
    '</div>' +
    renderClubFacts(club.name) +
    renderClubKitAndSponsors(club.name) +
    '<div class="cp-correction">Club details above are managed by the League. Spotted an error? ' +
      '<a href="' + correctionMailto(club.name) + '">Request a correction</a>.</div>' +
    peopleHtml +
  '</div>';
}


/* ================= LISTING ================= */
function firstPersonWithMainRole(club, roleTitle) {
  for (var i = 0; i < club.people.length; i++) {
    var p = club.people[i];
    for (var j = 0; j < p.roles.length; j++) {
      if (p.roles[j].main && p.roles[j].title === roleTitle) return p;
    }
  }
  return null;
}
function firstPersonInSection(club, section) {
  for (var i = 0; i < club.people.length; i++) {
    var p = club.people[i];
    for (var j = 0; j < p.roles.length; j++) {
      if (p.roles[j].section === section) return p;
    }
  }
  return null;
}

function renderListStyle1(clubs) {
  var byDiv = { National:[], North:[], South:[] };
  clubs.forEach(function(c){ byDiv[divisionOf(c.name)].push(c); });
  ['National','North','South'].forEach(function(d){ byDiv[d].sort(function(a,b){return a.name.localeCompare(b.name);}); });

  var html = '';
  ['National','North','South'].forEach(function(d) {
    if (!byDiv[d].length) return;
    var cards = byDiv[d].map(function(c) {
      var stadium = stadiumOf(c.name);
      var awaiting = !c.people.length
        ? '<span class="pill pill--status pill--status-warn" style="margin-top:4px;">awaiting contacts</span>'
        : '';
      return '<div class="l1-card" data-club="' + esc(c.name) + '">' +
        '<img class="l1-crest" src="' + crestUrl(c.name) + '" alt="" onerror="this.onerror=null;this.src=\'' + fallbackCrest() + '\'">' +
        '<div class="l1-card-body">' +
          '<h3>' + esc(c.name) + '</h3>' +
          (stadium ? '<div class="l1-stadium">' + esc(stadium) + '</div>' : '') +
          awaiting +
        '</div>' +
      '</div>';
    }).join('');
    html += '<div class="l1-division">' +
      '<div><div class="l1-div-hd">' + esc(DIVISION_FULL_NAMES[d] || d) + ' <span class="pill pill--count">' + byDiv[d].length + ' clubs</span></div></div>' +
      '<div class="l1-grid">' + cards + '</div>' +
    '</div>';
  });
  return html;
}

// In production these come from the user's role.
function isClubPersona() { return state.persona === 'club-editor' || state.persona === 'club-viewer'; }
function personaCan(capability) {
  var p = state.persona;
  /* Live editing needs the RTDB corpus (phase C). Until the one-off seed
     import runs, manage capabilities are off for everyone — superadmin
     sees the import banner on the directory listing instead. */
  if (!RTDB.seeded && (capability === 'manageContacts' || capability === 'manageOwnClub' || capability === 'editClubDetails')) {
    return false;
  }
  switch (capability) {
    case 'listBuilder':    return p === 'staff' || p === 'admin';
    case 'manageContacts': return p === 'admin';
    case 'manageOwnClub':  return p === 'club-editor' || p === 'admin';
    case 'editClubDetails': return p === 'admin';
    case 'viewActivity':   return p === 'admin';
    case 'viewDashboard':  return p === 'club-editor' || p === 'club-viewer' || p === 'staff' || p === 'admin';
    case 'dataCleanup':    return !!(window.NL && NL.session && NL.session.role === 'superadmin');
    default: return false;
  }
}

function filteredClubs() {
  var q = state.searchQuery.trim().toLowerCase();
  if (!q) return window.CLUBS;
  return window.CLUBS.filter(function(c) {
    if (c.name.toLowerCase().indexOf(q) !== -1) return true;
    if ((addressOf(c.name)||'').toLowerCase().indexOf(q) !== -1) return true;
    return c.people.some(function(p) {
      if ((p.name||'').toLowerCase().indexOf(q) !== -1) return true;
      return p.roles.some(function(r) { return r.title.toLowerCase().indexOf(q) !== -1; });
    });
  });
}

function renderAuditScene() {
  var root = document.getElementById('audit-root');
  root.innerHTML = '<p style="color:var(--text-muted);padding:20px 0;">Loading activity…</p>';
  NL.ensureAuth()
    .then(function() {
      return firebase.database().ref(RTDB_BASE + '/audit').orderByChild('ts').limitToLast(200).once('value');
    })
    .then(function(snap) {
      var rows = [];
      snap.forEach(function(ch) { rows.push(ch.val()); });
      rows.reverse();
      var html = '<div class="lb-intro"><h2>Directory activity</h2>' +
        '<p>Every change to club contacts and people, newest first (last ' + rows.length + ').</p></div>';
      if (!rows.length) {
        root.innerHTML = html + '<p style="color:var(--text-muted);">No directory changes recorded yet.</p>';
        return;
      }
      html += '<div style="display:grid;gap:6px;">' + rows.map(function(r) {
        var when = r.ts ? new Date(r.ts).toLocaleString('en-GB', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '—';
        return '<div style="display:flex;gap:14px;align-items:baseline;padding:10px 14px;background:var(--white);border:1px solid var(--border);border-radius:8px;flex-wrap:wrap;">' +
          '<span style="font-size:12px;color:var(--text-muted);white-space:nowrap;">' + esc(when) + '</span>' +
          '<span class="pill pill--identifier">' + esc(r.club || '—') + '</span>' +
          '<span style="flex:1;min-width:200px;font-size:14px;">' + esc(r.detail || r.action || '') + '</span>' +
          '<span style="font-size:12px;color:var(--text-muted);">' + esc(r.email || r.uid || '') + '</span>' +
        '</div>';
      }).join('') + '</div>';
      root.innerHTML = html;
    })
    .catch(function(err) {
      root.innerHTML = '<p style="color:var(--red);padding:20px 0;">Could not load activity — ' + esc(err.message || String(err)) + '</p>';
    });
}

function renderClub() {
  var club = window.CLUBS.filter(function(c){return c.name===state.viewing;})[0];
  var root = document.getElementById('club-root');

function showScene() {
  var listing = document.getElementById('scene-listing');
  var club = document.getElementById('scene-club');
  var builder = document.getElementById('scene-builder');
  var manage = document.getElementById('scene-manage');
  var audit = document.getElementById('scene-audit');
  var cleanup = document.getElementById('scene-cleanup');
  [listing, club, builder, manage, audit, cleanup].forEach(function(s){ s.classList.remove('scene--active'); });

  var dashboard = document.getElementById('scene-dashboard');
  dashboard.classList.remove('scene--active');
  if (state.viewMode === 'dashboard') {
    dashboard.classList.add('scene--active');
    renderDashboardScene();
  } else if (state.viewMode === 'cleanup') {
    cleanup.classList.add('scene--active');
    renderCleanupScene();
  } else if (state.viewMode === 'audit') {
    audit.classList.add('scene--active');
    renderAuditScene();
  } else if (state.viewMode === 'manage') {
    manage.classList.add('scene--active');
    renderManage();
  } else if (state.viewMode === 'builder') {
    builder.classList.add('scene--active');
    renderBuilder();
  } else if (state.viewing) {
    club.classList.add('scene--active');
    renderClub();
    updateManageMyClubButton();
  } else {
    listing.classList.add('scene--active');
    renderListing();
  }

  // Keep view-mode button pressed states in sync with state.viewMode
  var group = document.getElementById('clubStyleGroup');
  if (group) {
    group.querySelectorAll('[data-view-mode]').forEach(function(b) {
      b.setAttribute('aria-pressed', b.getAttribute('data-view-mode') === state.viewMode ? 'true' : 'false');
    });
  }

  updatePersonaGatedElements();
  window.scrollTo(0, 0);
}

function updatePersonaGatedElements() {
  document.querySelectorAll('.persona-gated').forEach(function(el) {
    var cap = el.getAttribute('data-requires');
    if (!cap) return;
    if (personaCan(cap)) el.classList.add('is-shown');
    else el.classList.remove('is-shown');
  });

  // Hide the whole view-switcher bar when persona only has Directory access.
  // No point showing a single-button "switcher".
  var clubStyleGroup = document.getElementById('clubStyleGroup');
  if (clubStyleGroup) {
    var hasOtherView = personaCan('listBuilder') || personaCan('manageContacts');
    clubStyleGroup.style.display = hasOtherView ? '' : 'none';
  }
}

function updateManageMyClubButton() {
  var btn = document.getElementById('manageMyClubBtn');
  if (!btn) return;
  // Only show if (a) persona can manage own club AND (b) currently viewing their club
  // For admin, show on any club page. For club-editor, only on their assigned club.
  var canShow = false;
  if (state.persona === 'admin' && state.viewing) canShow = true;
  if (isClubPersona() && state.viewing === EDITOR_CLUB) canShow = true;
  btn.style.display = canShow ? 'inline-flex' : 'none';
}

/* ================================================================
   LIST BUILDER
   ================================================================ */

/* Results calculation.
   For each selected club × selected department:
     - if mode === 'heads', include only people where some role in that section has deptHead=true
     - if mode === 'whole', include everyone who has any role in that section
   Returns rows with a stable `key` for per-row omit tracking. */
function lbResults() {
  var depts = state.lb.selectedDepts;
  var clubs = state.lb.selectedClubs;
  var anyDept = Object.keys(depts).length > 0;
  var anyClub = Object.keys(clubs).length > 0;
  if (!anyDept || !anyClub) return [];

  var out = [];
  window.CLUBS.forEach(function(c) {
    if (!clubs[c.name]) return;
    c.people.forEach(function(p) {
      // Hidden people never surface in generated lists/exports. (The future
      // public site will further restrict to visibility === 'public'.)
      if (p.visibility === 'hidden') return;
      var matched = {};        // section -> [role titles]
      var matchedContacts = {}; // section -> [role-level contacts]
      p.roles.forEach(function(r) {
        if (!depts[r.section]) return;
        var sectionMeta = SECTIONS_BY_KEY[r.section];
        if (!sectionMeta) return;

        if (sectionMeta.type === 'checklist') {
          var subFilter = state.lb.checklistRoleFilter[r.section];
          var roleKey = r.roleKey || null;
          if (subFilter) {
            if (!roleKey) { if (!subFilter.__other) return; }
            else { if (!subFilter[roleKey]) return; }
          } else {
            if (!roleKey && state.lb.mode === 'heads') return;
          }
        } else if (sectionMeta.type === 'joined-names') {
          /* Directors — include all */
        } else {
          if (state.lb.mode === 'heads' && !r.deptHead) return;
          var flagF = state.lb.flagFilter[r.section];
          if (flagF && Object.keys(flagF).length) {
            var roleFlags = r.flags || {};
            var matchesAnyFlag = Object.keys(flagF).some(function(fk){ return roleFlags[fk]; });
            if (!matchesAnyFlag) return;
          }
        }

        if (!matched[r.section]) { matched[r.section] = []; matchedContacts[r.section] = []; }
        matched[r.section].push(r.title);
        (r.contacts || []).forEach(function(rc){ matchedContacts[r.section].push(rc); });
      });
      Object.keys(matched).forEach(function(section) {
        var key = c.name + '|' + (p.name||'') + '|' + section;
        out.push({
          key: key,
          club: c.name,
          division: divisionOf(c.name),
          section: section,
          person: p,
          vacant: false,
          roleTitles: matched[section],
          roleContacts: matchedContacts[section],
          omitted: !!state.lb.omittedKeys[key]
        });
      });
    });

    /* Vacant roles: the function exists with a contact route but no named
       person. Included so a mailout to "all programme editors" reaches the
       clubs where the post is open. */
    (c.vacant || []).forEach(function(v) {
      if (!depts[v.section]) return;
      var key = c.name + '|<vacant>|' + v.section + '|' + v.title;
      out.push({
        key: key,
        club: c.name,
        division: divisionOf(c.name),
        section: v.section,
        person: null,
        vacant: true,
        vacantTitle: v.title,
        roleTitles: [v.title],
        roleContacts: v.contacts || [],
        omitted: !!state.lb.omittedKeys[key]
      });
    });
  });

  out.sort(function(a, b) {
    var sa = SECTION_ORDER.indexOf(a.section);
    var sb = SECTION_ORDER.indexOf(b.section);
    if (sa !== sb) return sa - sb;
    if (a.club !== b.club) return a.club.localeCompare(b.club);
    var an = a.person ? (a.person.name||'') : a.vacantTitle;
    var bn = b.person ? (b.person.name||'') : b.vacantTitle;
    return an.localeCompare(bn);
  });
  return out;
}

/* Resolve a result's contact points for the current contactMode.
   role mode: prefer the role-level inbox, fall back to the person's
   preferred. person mode: the reverse. Vacant rows only have role
   contacts. Returns { emails:[], phone:'' }. */
function resolveResultContacts(r) {
  function emailsOf(list) { return (list||[]).filter(function(c){return c.type==='email'&&c.value;}).map(function(c){return c.value;}); }
  function phoneOf(list)  { var c=(list||[]).filter(function(x){return x.type==='phone'&&x.value;})[0]; return c?c.value:''; }
  var roleEmails = emailsOf(r.roleContacts);
  var rolePhone = phoneOf(r.roleContacts);
  var personEmailList = r.person ? personEmails(r.person) : [];
  var personPhone = r.person ? (preferredContact(r.person,'phone')||'') : '';
  var emails, phone;
  if (state.lb.contactMode === 'role') {
    emails = roleEmails.length ? roleEmails : personEmailList;
    phone  = rolePhone || personPhone;
  } else {
    emails = personEmailList.length ? personEmailList : roleEmails;
    phone  = personPhone || rolePhone;
  }
  return { emails: emails, phone: phone };
}

/* Collapse results to one row per human (and one per vacant post),
   unioning their matched roles + resolved contacts. Used for export. */
function lbDedupedRows(includeOmitted) {
  var results = lbResults().filter(function(r){ return includeOmitted || !r.omitted; });
  var map = {}; var order = [];
  results.forEach(function(r) {
    var key = r.person ? (r.club + '|p|' + r.person._id) : (r.club + '|v|' + r.vacantTitle);
    if (!map[key]) {
      map[key] = { name: r.person ? (r.person.name||'') : (r.vacantTitle + ' (vacant)'),
        club: r.club, division: r.division, vacant: r.vacant,
        sections: [], roleLabels: [], emails: [], phones: [] };
      order.push(key);
    }
    var row = map[key];
    if (row.sections.indexOf(r.section) === -1) row.sections.push(r.section);
    r.roleTitles.forEach(function(t){ if (row.roleLabels.indexOf(t) === -1) row.roleLabels.push(t); });
    var rc = resolveResultContacts(r);
    rc.emails.forEach(function(e){ if (row.emails.indexOf(e) === -1) row.emails.push(e); });
    if (rc.phone && row.phones.indexOf(rc.phone) === -1) row.phones.push(rc.phone);
  });
  return order.map(function(k){ return map[k]; });
}

/* For warnings: find clubs missing a dept head in a given section.
   Returns [{ section, missingClubs: [...] }] for each selected section.
   Only runs in heads mode. */
function lbMissingHeads() {
  // Two kinds of warning:
  // 1. Hierarchical section, mode=heads: clubs missing a dept head
  // 2. Checklist section: clubs missing a required role (regardless of mode)
  var depts = Object.keys(state.lb.selectedDepts);
  if (!depts.length) return [];
  var selectedClubs = Object.keys(state.lb.selectedClubs);
  if (!selectedClubs.length) return [];

  var results = [];
  depts.forEach(function(section) {
    var meta = SECTIONS_BY_KEY[section];
    if (!meta) return;

    if (meta.type === 'checklist') {
      // For each required role in the checklist, find clubs missing that role
      meta.requiredRoles.forEach(function(roleKey) {
        // Only warn for required roles the user has included in their sub-filter (or all if not filtered)
        var subFilter = state.lb.checklistRoleFilter[section];
        if (subFilter && !subFilter[roleKey]) return;
        var missing = [];
        selectedClubs.forEach(function(clubName) {
          var club = window.CLUBS.filter(function(c){ return c.name === clubName; })[0];
          if (!club) return;
          var has = club.people.some(function(p) {
            return p.roles.some(function(r){ return r.section === section && r.roleKey === roleKey; });
          });
          if (!has) missing.push(club);
        });
        if (missing.length) {
          var label = (meta.roleLabels && meta.roleLabels[roleKey]) || roleKey;
          results.push({ section: section, roleKey: roleKey, label: label + ' (' + roleKey + ')', missingClubs: missing });
        }
      });
      return;
    }

    // Hierarchical section — warn only in heads-only mode + only for required heads
    if (state.lb.mode !== 'heads') return;
    if (REQUIRED_HEAD_SECTIONS.indexOf(section) === -1) return;
    var missingH = [];
    selectedClubs.forEach(function(clubName) {
      var club = window.CLUBS.filter(function(c){ return c.name === clubName; })[0];
      if (!club) return;
      var hasHead = club.people.some(function(p) {
        return p.roles.some(function(r){ return r.section === section && r.deptHead; });
      });
      if (!hasHead) missingH.push(club);
    });
    if (missingH.length) results.push({ section: section, label: section + ' dept head', missingClubs: missingH });
  });
  return results;
}

function renderBuilderDepts() {
  var root = document.getElementById('lbDepts');
  var html = SECTION_ORDER.map(function(section) {
    var meta = SECTIONS_BY_KEY[section];
    var id = 'lb-dept-' + section.replace(/[^a-z0-9]+/gi,'-');
    var checked = state.lb.selectedDepts[section] ? 'checked' : '';
    var selected = !!state.lb.selectedDepts[section];

    // Small label to the right of the dept name showing section type
    var typeNote = '';
    if (meta) {
      if (meta.type === 'joined-names') typeNote = ' <span class="lb-section-count">(names only)</span>';
      else if (meta.type === 'checklist') typeNote = ' <span class="lb-section-count">(role checklist)</span>';
      else if (HEAD_SECTIONS.indexOf(section) === -1) typeNote = ' <span class="lb-section-count">(no head)</span>';
    }

    // If this is a checklist section AND it's selected, expose sub-role tickboxes
    var subFilters = '';
    if (meta && meta.type === 'checklist' && selected) {
      var filter = state.lb.checklistRoleFilter[section] || {};
      // Default behaviour: all required + optional ticked, free-text NOT ticked
      var filterIsEmpty = Object.keys(filter).length === 0;

      var roles = (meta.requiredRoles || []).concat(meta.optionalRoles || []);
      var subRows = roles.map(function(rk) {
        var isOptional = (meta.optionalRoles || []).indexOf(rk) !== -1;
        var label = (meta.roleLabels && meta.roleLabels[rk]) || rk;
        var chkId = 'lb-subrole-' + rk;
        var isChecked = filterIsEmpty ? true : !!filter[rk];
        return '<div class="lb-role-row">' +
          '<input type="checkbox" id="' + chkId + '" data-checklist-section="' + esc(section) + '" data-checklist-role="' + esc(rk) + '"' + (isChecked?' checked':'') + '>' +
          '<label for="' + chkId + '">' + esc(rk) + ' — ' + esc(label) + (isOptional ? ' <span class="lb-section-count">(optional)</span>' : '') + '</label>' +
        '</div>';
      }).join('');

      // Free-text extras tickbox
      var otherChecked = filterIsEmpty ? false : !!filter.__other;
      subRows += '<div class="lb-role-row">' +
        '<input type="checkbox" id="lb-subrole-other" data-checklist-section="' + esc(section) + '" data-checklist-role="__other"' + (otherChecked?' checked':'') + '>' +
        '<label for="lb-subrole-other">Other liaison roles <span class="lb-section-count">(free-text extras)</span></label>' +
      '</div>';

      subFilters = '<div class="lb-roles-in-section">' + subRows + '</div>';
    }

    // If this is a section with flag keys (e.g. Media -> programmeEditor), expose them too
    var flagFiltersHtml = '';
    if (meta && meta.flagKeys && meta.flagKeys.length && selected) {
      var ff = state.lb.flagFilter[section] || {};
      var flagRows = meta.flagKeys.map(function(fk) {
        var chkId = 'lb-flag-' + section.replace(/[^a-z0-9]+/gi,'-') + '-' + fk.key;
        var isChecked = !!ff[fk.key];
        return '<div class="lb-role-row">' +
          '<input type="checkbox" id="' + chkId + '" data-flag-section="' + esc(section) + '" data-flag-key="' + esc(fk.key) + '"' + (isChecked ? ' checked' : '') + '>' +
          '<label for="' + chkId + '">Also: <b>' + esc(fk.label) + '</b> <span class="lb-section-count">(narrow to roles with this flag)</span></label>' +
        '</div>';
      }).join('');
      flagFiltersHtml = '<div class="lb-roles-in-section">' + flagRows + '</div>';
    }

    return '<div class="lb-section-group">' +
      '<div class="lb-section-row">' +
        '<input type="checkbox" id="' + id + '" data-dept="' + esc(section) + '" ' + checked + '>' +
        '<label for="' + id + '">' + esc(section) + '</label>' +
        typeNote +
      '</div>' +
      subFilters +
      flagFiltersHtml +
    '</div>';
  }).join('');
  root.innerHTML = html;
}

function renderBuilderDivisions() {
  var root = document.getElementById('lbDivisions');
  var divs = ['National','North','South'];

  var html = divs.map(function(d) {
    var divClubs = window.CLUBS.filter(function(c){ return divisionOf(c.name) === d; })
                               .sort(function(a,b){ return a.name.localeCompare(b.name); });
    var selCount = divClubs.filter(function(c){ return state.lb.selectedClubs[c.name]; }).length;
    var totCount = divClubs.length;
    var collapsed = state.lb.collapsedDivisions[d];

    var clubRows = divClubs.map(function(c) {
      var id = 'lb-club-' + c.name.replace(/[^a-z0-9]+/gi,'-');
      var checked = state.lb.selectedClubs[c.name] ? 'checked' : '';
      return '<div class="lb-club-row">' +
        '<input type="checkbox" id="' + id + '" data-club="' + esc(c.name) + '" ' + checked + '>' +
        '<label for="' + id + '">' + esc(c.name) + '</label>' +
      '</div>';
    }).join('');

    var divId = 'lb-div-' + d;
    var allSelected = selCount === totCount && totCount > 0;

    return '<div class="lb-division-group' + (collapsed ? ' lb-division-div-collapsed' : '') + '" data-division="' + d + '">' +
      '<div class="lb-division-row">' +
        '<input type="checkbox" id="' + divId + '" class="lb-division-check" data-division="' + d + '"' +
          (allSelected ? ' checked' : '') + '>' +
        '<label for="' + divId + '">' +
          esc(DIVISION_FULL_NAMES[d] || d) +
        '</label>' +
        '<span class="lb-division-stats">' + selCount + ' / ' + totCount + '</span>' +
        '<button class="lb-section-toggle" data-division-toggle="' + d + '">' + (collapsed ? '▸' : '▾') + '</button>' +
      '</div>' +
      '<input type="search" class="lb-club-search" placeholder="filter ' + d + ' clubs..." data-division-search="' + d + '" value="' + esc(state.lb.clubSearch[d] || '') + '">' +
      '<div class="lb-clubs-in-div">' + clubRows + '</div>' +
    '</div>';
  }).join('');
  root.innerHTML = html;

  // indeterminate states
  divs.forEach(function(d) {
    var divClubs = window.CLUBS.filter(function(c){ return divisionOf(c.name) === d; });
    var selCount = divClubs.filter(function(c){ return state.lb.selectedClubs[c.name]; }).length;
    var totCount = divClubs.length;
    var cb = root.querySelector('.lb-division-check[data-division="' + d + '"]');
    if (cb) cb.indeterminate = selCount > 0 && selCount < totCount;
  });
}

function renderBuilderWarnings() {
  var root = document.getElementById('lbWarnings');
  var missing = lbMissingHeads();
  if (!missing.length) { root.innerHTML = ''; return; }
  var items = missing.map(function(m) {
    var n = m.missingClubs.length;
    var crests = m.missingClubs.slice(0, 30).map(function(c) {
      return '<span class="lb-warning-crest">' +
        '<img src="' + crestUrl(c.name) + '" alt="" onerror="this.onerror=null;this.src=\'' + fallbackCrest() + '\'">' +
        esc(c.name) +
      '</span>';
    }).join('');
    var more = m.missingClubs.length > 30 ? ' <span style="color:var(--amber-deep);font-size:11px;">+' + (m.missingClubs.length - 30) + ' more</span>' : '';
    return '<div class="lb-warnings__item">' +
      '<b>' + n + ' club' + (n===1?'':'s') + '</b> missing <b>' + esc(m.label) + '</b> — ' +
      'these clubs <b>will not appear</b> in the list.' +
      '<div class="lb-warnings__crests">' + crests + more + '</div>' +
    '</div>';
  }).join('');
  root.innerHTML = '<div class="lb-warnings">' +
    '<div class="lb-warnings__hd">⚠ Missing contacts</div>' +
    items +
  '</div>';
}

function renderBuilderResults() {
  var results = lbResults();
  var active = results.filter(function(r){ return !r.omitted; });

  var countEl = document.getElementById('lbCount');
  var subEl = document.getElementById('lbCountSub');
  var resultsRoot = document.getElementById('lbResults');

  var deduped = lbDedupedRows(false);
  countEl.textContent = deduped.length;
  var withEmail = deduped.filter(function(r){ return r.emails.length; }).length;
  var omittedCount = results.length - active.length;
  var omitSuffix = omittedCount ? ' · ' + omittedCount + ' omitted' : '';
  subEl.textContent = results.length === 0
    ? 'pick departments and clubs above'
    : ((deduped.length === 1 ? 'person/post' : 'people/posts') + ' · ' + withEmail + ' contactable' + omitSuffix);

  // enable/disable copy buttons
  document.querySelectorAll('.lb-copybtn').forEach(function(b){
    b.disabled = active.length === 0;
  });

  if (results.length === 0) {
    resultsRoot.innerHTML = '<div class="lb-empty">Pick at least one department and one club to see matches.</div>';
    return;
  }

  var rows = results.map(function(r) {
    var rc = resolveResultContacts(r);
    var emailCell = rc.emails.length
      ? rc.emails.map(function(em){ return '<a href="mailto:' + esc(em) + '">' + esc(em) + '</a>'; }).join('<br>')
      : '<span class="lb-no-email">no contact route</span>';
    var nameCell = r.vacant
      ? '<span class="pill pill--status pill--status-warn">vacant</span> ' + esc(r.vacantTitle)
      : esc(r.person.name);
    return '<tr class="' + (r.omitted ? 'lb-row-omitted' : '') + '" data-key="' + esc(r.key) + '">' +
      '<td class="lb-col-omit">' +
        '<button class="btn-icon" data-omit-key="' + esc(r.key) + '" aria-pressed="' + (r.omitted ? 'true' : 'false') + '" title="' + (r.omitted ? 'Include row' : 'Omit row') + '">' +
        (r.omitted ? '+' : '\u00d7') +
        '</button>' +
      '</td>' +
      '<td class="lb-col-role">' + esc(r.section) + (state.lb.mode === 'whole' || r.vacant ? ' \u00b7 ' + esc(r.roleTitles.join(' / ')) : '') + '</td>' +
      '<td class="lb-col-name">' + nameCell + '</td>' +
      '<td class="lb-col-club">' +
        '<div class="lb-club-cell">' +
          '<img src="' + crestUrl(r.club) + '" alt="" onerror="this.onerror=null;this.src=\'' + fallbackCrest() + '\'">' +
          '<span>' + esc(r.club) + '</span>' +
        '</div>' +
      '</td>' +
      '<td class="lb-col-email">' + emailCell + '</td>' +
      '<td class="lb-col-phone">' + esc(rc.phone || '') + '</td>' +
    '</tr>';
  }).join('');

  resultsRoot.innerHTML = '<table class="lb-table">' +
    '<thead><tr><th></th><th>Department</th><th>Name</th><th>Club</th><th>Email</th><th>Phone</th></tr></thead>' +
    '<tbody>' + rows + '</tbody></table>';
}

function formatForCopy(format) {
  var rows = lbDedupedRows(false);
  var withEmail = rows.filter(function(r){ return r.emails.length; });

  if (format === 'named') {
    /* one address per person — their preferred (first) email */
    return withEmail.map(function(r) {
      return '"' + (r.name||'').replace(/"/g,'') + '" <' + r.emails[0] + '>';
    }).join('; ');
  }
  if (format === 'plain') {
    /* every distinct email across the selection, de-duplicated */
    var seen = {}; var all = [];
    withEmail.forEach(function(r){ r.emails.forEach(function(e){ if(!seen[e]){seen[e]=1; all.push(e);} }); });
    return all.join('; ');
  }
  if (format === 'csv') {
    var header = 'Name,Club,Division,Roles,Emails,Phone';
    var lines = rows.map(function(r) {
      function q(s){ s = s == null ? '' : String(s); return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s; }
      return [q(r.name), q(r.club), q(r.division),
              q(r.roleLabels.join(' / ')),
              q(r.emails.join(' ')), q(r.phones.join(' '))].join(',');
    });
    return [header].concat(lines).join('\n');
  }
  return '';
}

function copyToClipboard(text, btn) {
  function flashCopied() {
    var original = btn.textContent;
    btn.classList.add('is-copied');
    btn.textContent = '✓ Copied';
    setTimeout(function() {
      btn.classList.remove('is-copied');
      btn.textContent = original;
    }, 1600);
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(flashCopied, function(err) {
      console.warn('clipboard write failed:', err);
      alert('Copy failed. Please copy manually from the list below.');
    });
  } else {
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); flashCopied(); }
    catch(err) { alert('Copy not supported in this browser.'); }
    document.body.removeChild(ta);
  }
}

      '<button class="btn btn--toggle btn--sm" data-div-filter="North"' + (divFilter==='North' ? ' aria-pressed="true"' : '') + '>North</button>' +
      '<button class="btn btn--toggle btn--sm" data-div-filter="South"' + (divFilter==='South' ? ' aria-pressed="true"' : '') + '>South</button>' +
    '</div>' +
    '<div class="mc-clubs-table">' +
      '<table>' +
        '<thead><tr>' +
          '<th>Club</th><th>Division</th><th>People</th><th>Status</th><th></th>' +
        '</tr></thead>' +
        '<tbody>' + (rows || '<tr><td colspan="5" style="padding:40px;text-align:center;color:var(--text-muted);">No clubs match</td></tr>') + '</tbody>' +

/* ---------- Surface 1: People ---------- */
function renderPeopleSurface(club) {
  var q = (state.manage.peopleSearch || '').toLowerCase().trim();
  var people = club.people.slice().sort(function(a, b) {
    return (a.name||'').localeCompare(b.name||'');
  });

  // Build the HTML for each person row
  var rowsHtml = people.map(function(p) {
    var nameLower = (p.name||'').toLowerCase();
    var emailLower = (p.email||'').toLowerCase();
    if (q && nameLower.indexOf(q) === -1 && emailLower.indexOf(q) === -1) return '';

    var contactParts = [];
    if (p.email) contactParts.push('<a href="mailto:' + esc(p.email) + '" onclick="event.stopPropagation();">' + esc(p.email) + '</a>');
    if (p.phone) contactParts.push(esc(p.phone));

    // Summarise departments
    var deptMap = {};
    p.roles.forEach(function(r) {
      if (!deptMap[r.section]) deptMap[r.section] = [];
      deptMap[r.section].push(r.title);
    });
    var deptParts = Object.keys(deptMap).map(function(section) {
      var roles = deptMap[section].join(' / ');
      return '<b>' + esc(section) + '</b>: ' + esc(roles);
    });

    var selectedClass = (state.manage.editingPersonId === p._id) ? ' is-selected' : '';
    var visBadge = p.visibility === 'public'
      ? ' <span class="mc-vis-badge mc-vis-badge--public">Public</span>'
      : (p.visibility === 'hidden' ? ' <span class="mc-vis-badge mc-vis-badge--hidden">Hidden</span>' : '');

    return '<div class="mc-person-card' + selectedClass + '" data-person-id="' + esc(p._id) + '">' +
      '<div class="mc-person-card-main">' +
        '<div class="mc-person-card-name">' + esc(p.name||'(unnamed)') + visBadge + '</div>' +
        (contactParts.length ? '<div class="mc-person-card-contact">' + contactParts.join(' · ') + '</div>' : '') +
        (deptParts.length ? '<div class="mc-person-card-depts">' + deptParts.join(' · ') + '</div>' : '<div class="mc-person-card-depts"><i>No department assignments</i></div>') +
      '</div>' +
      '<div class="mc-person-card-actions">' +
        '<button class="btn btn--ghost btn--sm" data-edit-person="' + esc(p._id) + '">Edit</button>' +
      '</div>' +
    '</div>';
  }).filter(Boolean).join('');

  if (!rowsHtml) {
    rowsHtml = '<div style="padding:40px;text-align:center;color:var(--text-muted);font-size:13px;">' +
      (q ? 'No people match "' + esc(q) + '"' : 'No people yet. Click Add Person to add the first.') +
    '</div>';
  }

  return '<div class="mc-people-actions">' +
    '<input type="search" class="mc-people-search" placeholder="Search people by name or email..." id="mcPeopleSearch" value="' + esc(state.manage.peopleSearch||'') + '">' +
    '<button class="btn btn--navy" id="mcAddPersonBtn">+ Add person</button>' +
  '</div>' +
  '<div class="mc-people-list">' + rowsHtml + '</div>';
}

/* ---------- Person side-panel ---------- */
/* Seed a person draft (roleRows + contactRows + name + note) from an
   existing person, or empty for a new one. The modal is now self-sufficient:
   roles and contacts are edited inline, no separate tab needed. */
function seedPersonDraft(person) {
  if (!person) {
    return {
      name: '', note: '', visibility: 'staff',
      roleRows: [{ section: SECTION_ORDER[0], title: '', deptHead: false, flags: {} }],
      primaryRoleIdx: 0,
      // New people start with a blank email + phone row already on show, so
      // contact details are encouraged rather than an afterthought. If a type
      // is genuinely unknown the editor ticks "No email/phone on file" — save
      // requires one or the other (no silent blanks).
      contactRows: [
        { type: 'email', value: '', label: '', preferred: true },
        { type: 'phone', value: '', label: '', preferred: true }
      ],
      noEmail: false, noPhone: false
    };
  }
  ensureContacts(person);
  var roleRows = (person.roles || []).map(function(r) {
    return {
      section: r.section || SECTION_ORDER[0],
      title: r.title || '',
      deptHead: !!r.deptHead,
      flags: Object.assign({}, r.flags || {})
    };
  });
  if (!roleRows.length) roleRows = [{ section: SECTION_ORDER[0], title: '', deptHead: false, flags: {} }];
  var primaryRoleIdx = (person.roles || []).findIndex(function(r){ return r.main; });
  if (primaryRoleIdx === -1) primaryRoleIdx = 0;
  var contactRows = (person.contacts || []).filter(function(c){ return c.type === 'email' || c.type === 'phone'; })
    .map(function(c) {
      return { type: c.type, value: c.value || '', label: c.label || '', preferred: !!c.preferred };
    });
  return { name: person.name || '', note: person.note || '',
           visibility: person.visibility || 'staff',
           noEmail: !!person.noEmail, noPhone: !!person.noPhone,
           roleRows: roleRows, primaryRoleIdx: primaryRoleIdx, contactRows: contactRows };
}

/* Render one editable role row in the person modal. */
function renderRoleRow(club, draft, r, i) {
  var meta = SECTIONS_BY_KEY[r.section] || {};
  var isHeadSection = HEAD_SECTIONS.indexOf(r.section) !== -1;
  var datalistId = 'mcRoleTitles_' + i;
  var suggestions = titleSuggestionsFor(r.section).map(function(s) {
    return '<option value="' + esc(s) + '"></option>';
  }).join('');

  var sectionOpts = SECTION_ORDER.map(function(key) {
    var label = (SECTIONS_BY_KEY[key] && SECTIONS_BY_KEY[key].key) || key;
    return '<option value="' + esc(key) + '"' + (key === r.section ? ' selected' : '') + '>' + esc(label) + '</option>';
  }).join('');

  // Department-head clash: another person already holds head of this section?
  var headWarn = '';
  if (isHeadSection && r.deptHead) {
    var clash = club.people.filter(function(p) {
      if (!state.manage.editingPersonId || p._id === state.manage.editingPersonId) return false;
      return (p.roles || []).some(function(pr){ return pr.section === r.section && pr.deptHead; });
    })[0];
    if (clash) {
      headWarn = '<div class="mc-role-row__warn">⚠ ' + esc(clash.name) +
        ' is currently head of ' + esc(r.section) + ' — saving will replace them.</div>';
    }
  }

  // Section flag checkboxes (e.g. Media & marketing -> programmeEditor)
  var flagsHtml = '';
  if (meta.flagKeys && meta.flagKeys.length) {
    flagsHtml = '<div class="mc-role-row__flags">' + meta.flagKeys.map(function(fk) {
      var on = r.flags && r.flags[fk.key] ? ' checked' : '';
      return '<label class="mc-role-row__flag" title="' + esc(fk.description || '') + '">' +
        '<input type="checkbox" data-role-flag-idx="' + i + '" data-flag-key="' + esc(fk.key) + '"' + on + '> ' +
        esc(fk.label) + '</label>';
    }).join('') + '</div>';
  }

  var headChecked = r.deptHead ? ' checked' : '';
  var headDisabled = isHeadSection ? '' : ' disabled';
  var primaryChecked = (draft.primaryRoleIdx === i) ? ' checked' : '';

  return '<div class="mc-role-row" data-role-idx="' + i + '">' +
    '<div class="mc-role-row__main">' +
      '<select class="mc-role-row__section" data-role-section-idx="' + i + '">' + sectionOpts + '</select>' +
      '<input class="mc-role-row__title" type="text" list="' + datalistId + '" data-role-title-idx="' + i + '" ' +
        'value="' + esc(r.title) + '" placeholder="Role title">' +
      '<datalist id="' + datalistId + '">' + suggestions + '</datalist>' +
      (draft.roleRows.length > 1
        ? '<button class="btn-icon btn-icon--danger mc-role-row__remove" data-remove-role-idx="' + i + '" title="Remove role">×</button>'
        : '<span class="mc-role-row__remove-spacer"></span>') +
    '</div>' +
    '<div class="mc-role-row__opts">' +
      '<label class="mc-role-row__opt"><input type="radio" name="personPrimaryRole" data-primary-role-idx="' + i + '"' + primaryChecked + '> Primary</label>' +
      '<label class="mc-role-row__opt' + (isHeadSection ? '' : ' is-disabled') + '">' +
        '<input type="checkbox" data-role-head-idx="' + i + '"' + headChecked + headDisabled + '> Dept head</label>' +
      flagsHtml +
    '</div>' +
    headWarn +
  '</div>';
}

/* Render one editable contact row in the person modal. preferred is a
   radio scoped per type (one preferred email, one preferred phone). */
function renderContactRow(draft, c, i) {

function renderPersonPanel(club) {

/* Re-render only the OPEN panel's inner content, not the overlay/panel
   wrapper — so adding or removing a row doesn't tear down and recreate the
   panel element, which replayed its slide-in animation (the "flash"). The
   draft is kept in sync live by the input/change handlers, so re-rendering
   from it loses nothing. Falls back to a full editor render if the panel
   isn't mounted. */
function refreshPersonPanel() {
  var panel = document.getElementById('mcPersonPanel');
  var club = window.CLUBS.filter(function(c){ return c.name === state.manage.editingClub; })[0];
  if (!panel || !club) { renderEditor(document.getElementById('mc-root')); return; }
  panel.innerHTML = renderPersonPanelInner(club);

/* The panel's inner HTML (header + body + footer). Split out from
   renderPersonPanel so refreshPersonPanel() can swap it in place. */
function renderPersonPanelInner(club) {
  var isNew = state.manage.editingPersonId === 'new';
  var person = isNew ? null : club.people.filter(function(p){ return p._id === state.manage.editingPersonId; })[0];
  if (!isNew && !person) return '';

  var draft = state.manage.personDraft;
  // Backstop: if a bare/legacy draft slipped through, rebuild a full one.
  if (!draft || !Array.isArray(draft.roleRows) || !Array.isArray(draft.contactRows)) {
    draft = seedPersonDraft(person);
    state.manage.personDraft = draft;
  }

  var rolesHtml = draft.roleRows.map(function(r, i){ return renderRoleRow(club, draft, r, i); }).join('');
  var contactsHtml = draft.contactRows.length
    ? draft.contactRows.map(function(c, i){ return renderContactRow(draft, c, i); }).join('')
    : '<div class="mc-person-panel__depts-empty">No contacts yet — add an email or phone below.</div>';
  var vis = draft.visibility || 'staff';

  return '<div class="mc-person-panel__hd">' +
        '<div>' +
          '<h3>' + (isNew ? 'Add new person' : 'Edit person') + '</h3>' +
          '<div class="mc-person-panel__hd-sub">' + esc(club.name) + '</div>' +
        '</div>' +
        '<button class="btn-icon" id="mcPanelClose">×</button>' +
      '</div>' +
      '<div class="mc-person-panel__body">' +
        '<div class="mc-person-panel__field">' +
          '<label>Full name</label>' +
          '<input type="text" id="mcPanelName" value="' + esc(draft.name) + '" placeholder="e.g. Jane Smith">' +
        '</div>' +

        '<div class="mc-person-panel__field">' +
          '<label>Directory visibility</label>' +
          '<select id="mcPanelVisibility">' +
            '<option value="public"' + (vis === 'public' ? ' selected' : '') + '>Public — staff directory + public website</option>' +
            '<option value="staff"' + (vis === 'staff' ? ' selected' : '') + '>Staff only — internal directory (default)</option>' +
            '<option value="hidden"' + (vis === 'hidden' ? ' selected' : '') + '>Hidden — not shown anywhere</option>' +
          '</select>' +

/* ---------- Surface 2: Department assignments ---------- */
function renderDeptSurface(club) {
  var html = '';
  SECTION_ORDER.forEach(function(section) {
    html += renderDeptCard(club, section);
  });
  return html;
}

function renderDeptCard(club, section) {
  var meta = SECTIONS_BY_KEY[section];
  if (!meta) return '';

  // Collect (person, role) entries for this section
  var entries = [];
  club.people.forEach(function(p) {
    p.roles.forEach(function(r) {
      if (r.section === section) entries.push({ person: p, role: r });
    });
  });

  var isEditing = state.manage.editingDeptSection === section;
  var hasData = entries.length > 0;
  var isChecklist = meta.type === 'checklist';
  var isHeadSection = HEAD_SECTIONS.indexOf(section) !== -1;
  var isRequiredHead = REQUIRED_HEAD_SECTIONS.indexOf(section) !== -1;

  // Warning logic differs by section type
  var warning = '';
  var hasMissingRequired = false;
  if (isChecklist) {
    var missingKeys = (meta.requiredRoles || []).filter(function(rk) {
      return !entries.some(function(e){ return e.role.roleKey === rk; });
    });
    if (missingKeys.length) {
      hasMissingRequired = true;
      warning = '<span class="pill pill--status pill--status-warn">⚠ Missing: ' + missingKeys.join(', ') + '</span>';
    }
  } else if (isRequiredHead) {
    var missingHead = hasData && !entries.some(function(e){ return e.role.deptHead; });
    var multipleHeads = entries.filter(function(e){ return e.role.deptHead; }).length > 1;
    if (missingHead) { warning = '<span class="pill pill--status pill--status-warn">⚠ No dept head</span>'; hasMissingRequired = true; }
    else if (multipleHeads) warning = '<span class="pill pill--status pill--status-warn">⚠ Multiple heads</span>';
  }

  // Skip empty hierarchical sections that don't have a head concept (Directors with no directors etc)
  // Skip empty hierarchical sections that don't have a head concept, UNLESS
  // the section is explicitly alwaysShow (e.g. 'Other')
  if (!hasData && !isHeadSection && !isChecklist && !meta.alwaysShow) return '';

  var headerActions = '';
  if (!isEditing) {
    headerActions = '<button class="btn btn--ghost btn--sm" data-edit-dept-section="' + esc(section) + '">Edit</button>';
  }

  // Body — route by section type and edit state
  var body;
  if (isChecklist) {
    body = isEditing
      ? renderChecklistEditBody(club, section, meta, entries)
      : renderChecklistViewBody(section, meta, entries);
  } else {
    body = isEditing
      ? renderDeptEditBody(club, section, entries)
      : renderDeptViewBody(section, entries);
  }

  var subtitleHtml = meta.subtitle
    ? '<div class="mc-dept-subtitle">' + esc(meta.subtitle) + '</div>'
    : '';

  return '<div class="mc-dept-card' + (isEditing ? ' is-editing' : '') + (hasMissingRequired ? ' mc-dept-card--missing' : '') + '" data-section="' + esc(section) + '">' +
    '<div class="mc-dept-hd">' +
      '<div><h3 style="display:inline-block;">' + esc(section) + '</h3>' + warning + '</div>' +
      headerActions +
    '</div>' +
    subtitleHtml +
    body +
  '</div>';
}

/* ---- Checklist section body (view mode) ---- */
function renderChecklistViewBody(section, meta, entries) {
  // Render one row per required + optional slot, filled or empty
  var allSlots = (meta.requiredRoles || []).concat(meta.optionalRoles || []);
  var slotsHtml = allSlots.map(function(rk) {
    var isOpt = (meta.optionalRoles || []).indexOf(rk) !== -1;
    var label = (meta.roleLabels && meta.roleLabels[rk]) || rk;
    var filled = entries.filter(function(e){ return e.role.roleKey === rk; });

    if (!filled.length) {
      return '<div class="mc-assignment-row mc-checklist-slot' + (isOpt ? ' mc-checklist-slot--optional' : ' mc-checklist-slot--missing') + '">' +
        '<div class="mc-assignment-name"><span class="pill pill--identifier">' + esc(rk) + '</span> ' + esc(label) + '</div>' +
        '<div class="mc-assignment-role"><i style="color:var(--text-muted);">— not assigned' + (isOpt ? ' (optional)' : '') + ' —</i></div>' +
        '<div></div><div></div>' +
      '</div>';
    }

    return filled.map(function(e) {
      var p = e.person, r = e.role;
      return '<div class="mc-assignment-row mc-checklist-slot">' +
        '<div class="mc-assignment-name"><span class="pill pill--identifier">' + esc(rk) + '</span> ' + esc(p.name) + '</div>' +
        '<div class="mc-assignment-role">' + esc(r.title) + '</div>' +
        '<div></div><div></div>' +
      '</div>';
    }).join('');
  }).join('');

  // Plus any free-text extras (roleKey not set)
  var extras = entries.filter(function(e){ return !e.role.roleKey; });
  var extrasHtml = '';
  if (extras.length) {
    extrasHtml = '<div class="mc-checklist-extras-label">Other liaison roles</div>' +
      extras.map(function(e) {
        return '<div class="mc-assignment-row">' +
          '<div class="mc-assignment-name">' + esc(e.person.name) + '</div>' +
          '<div class="mc-assignment-role">' + esc(e.role.title) + '</div>' +
          '<div></div><div></div>' +
        '</div>';
      }).join('');
  }

  return slotsHtml + extrasHtml;
}

/* ---- Checklist section body (edit mode) ---- */
function renderChecklistEditBody(club, section, meta, entries) {
  var drafts = state.manage.checklistDrafts || {};

  // Build person options (alphabetical)
  var peopleSorted = club.people.slice().sort(function(a,b){return (a.name||'').localeCompare(b.name||'');});
  function personOptions(selectedId) {
    return '<option value="">— Pick a person —</option>' +
      peopleSorted.map(function(x) {
        return '<option value="' + esc(x._id) + '"' + (x._id === selectedId ? ' selected' : '') + '>' + esc(x.name) + '</option>';
      }).join('');
  }

  // One row per required + optional slot
  var allSlots = (meta.requiredRoles || []).concat(meta.optionalRoles || []);
  var slotRows = allSlots.map(function(rk) {
    var isOpt = (meta.optionalRoles || []).indexOf(rk) !== -1;
    var label = (meta.roleLabels && meta.roleLabels[rk]) || rk;
    var existing = entries.filter(function(e){ return e.role.roleKey === rk; })[0];
    var draftKey = 'slot|' + rk;
    if (!drafts[draftKey]) {
      drafts[draftKey] = {
        roleKey: rk,
        personId: existing ? existing.person._id : '',
        _originalPersonId: existing ? existing.person._id : null,
      };
    }
    var d = drafts[draftKey];
    var removeBtn = existing
      ? '<button class="btn-icon btn-icon--danger" data-clear-slot="' + esc(draftKey) + '" title="Clear">×</button>'
      : '<span></span>';
    return '<div class="mc-assignment-edit-row" data-draft-key="' + esc(draftKey) + '">' +
      '<div><span class="pill pill--identifier">' + esc(rk) + '</span> ' + esc(label) + (isOpt ? ' <span style="color:var(--text-muted);font-size:11px;">(optional)</span>' : '') + '</div>' +
      '<select data-checklist-draft-key="' + esc(draftKey) + '">' + personOptions(d.personId) + '</select>' +
      '<span></span>' +
      removeBtn +
    '</div>';
  }).join('');

  // Free-text extras (existing, editable) + optional add-new
  var extras = entries.filter(function(e){ return !e.role.roleKey; });
  var extrasRows = extras.map(function(e) {
    var p = e.person, r = e.role;
    var extraKey = 'extra|' + p._id + '|' + r.title;
    if (!drafts[extraKey]) {
      drafts[extraKey] = {
        isExtra: true,
        personId: p._id,
        roleTitle: r.title,
        _originalPersonId: p._id,
        _originalTitle: r.title,
      };
    }
    var d = drafts[extraKey];
    return '<div class="mc-assignment-edit-row" data-draft-key="' + esc(extraKey) + '">' +
      '<select data-checklist-draft-key="' + esc(extraKey) + '" data-draft-field="personId">' + personOptions(d.personId) + '</select>' +
      '<input type="text" data-checklist-draft-key="' + esc(extraKey) + '" data-draft-field="roleTitle" value="' + esc(d.roleTitle) + '" placeholder="Role title">' +
      '<span></span>' +
      '<button class="btn-icon btn-icon--danger" data-remove-extra="' + esc(extraKey) + '" title="Remove">×</button>' +
    '</div>';
  }).join('');

  // Add-new-extra row
  var addExtraHtml = '';
  if (state.manage.checklistAddDraft && state.manage.checklistAddDraft.section === section) {
    var nd = state.manage.checklistAddDraft;
    addExtraHtml = '<div class="mc-assignment-edit-row" style="border:1px dashed var(--primary);">' +
      '<select id="mcChecklistAddPerson">' + personOptions(nd.personId) + '</select>' +
      '<input type="text" id="mcChecklistAddTitle" value="' + esc(nd.roleTitle||'') + '" placeholder="Role title (e.g. Deputy DLO)">' +
      '<span></span>' +
      '<button class="btn-icon btn-icon--danger" id="mcChecklistAddCancel">×</button>' +
    '</div>';
  }

  state.manage.checklistDrafts = drafts;

  var addBtn = state.manage.checklistAddDraft
    ? ''
    : '<button class="btn-add" data-add-checklist-extra="' + esc(section) + '">+ Add other liaison role</button>';

  var extrasLabel = (extras.length || state.manage.checklistAddDraft) ? '<div class="mc-checklist-extras-label">Other liaison roles</div>' : '';

  var footer = '<div class="mc-dept-footer">' +
    '<button class="btn btn--ghost" data-cancel-dept="' + esc(section) + '">Cancel</button>' +
    '<button class="btn btn--navy" data-save-checklist="' + esc(section) + '">Save changes</button>' +
  '</div>';

  return slotRows + extrasLabel + extrasRows + addExtraHtml + addBtn + footer;
}

function renderDeptViewBody(section, entries) {
  if (!entries.length) {
    return '<div class="mc-dept-empty">No assignments yet.</div>';
  }
  var rows = entries.map(function(e) {
    var p = e.person, r = e.role;
    return '<div class="mc-assignment-row' + (r.deptHead ? ' is-head' : '') + '">' +
      '<div class="mc-assignment-name">' + esc(p.name) + '</div>' +
      '<div class="mc-assignment-role">' + esc(r.title) + '</div>' +
      (r.deptHead ? '<div class="pill pill--marker">Head</div>' : '<div></div>') +
      '<div></div>' +
    '</div>';
  }).join('');
  return rows;
}

function renderDeptEditBody(club, section, entries) {
  var drafts = state.manage.deptDrafts || {};
  var meta = SECTIONS_BY_KEY[section] || {};
  var flagKeys = meta.flagKeys || [];

  // Each existing assignment becomes an editable row
  var rowsHtml = entries.map(function(e) {
    var p = e.person, r = e.role;
    var key = p._id + '|' + r.title;
    if (!drafts[key]) {
      drafts[key] = {
        personId: p._id,
        roleTitle: r.title,
        deptHead: !!r.deptHead,
        flags: r.flags ? Object.assign({}, r.flags) : {},
        _originalTitle: r.title,
      };
    }
    var d = drafts[key];

    // Flag tickboxes (e.g. Programme editor on Media)
    var flagsHtml = '';
    if (flagKeys.length) {
      flagsHtml = '<div class="mc-flag-row">' + flagKeys.map(function(fk){
        var on = !!(d.flags && d.flags[fk.key]);
        return '<label class="mc-assignment-edit-headcheck" title="' + esc(fk.description || '') + '">' +
          '<input type="checkbox" data-draft-flag-key="' + esc(key) + '" data-flag-name="' + esc(fk.key) + '"' + (on ? ' checked' : '') + '>' +
          esc(fk.label) +
        '</label>';
      }).join('') + '</div>';
    }

    return '<div class="mc-assignment-edit-row" data-draft-key="' + esc(key) + '">' +
      '<select data-draft-key="' + esc(key) + '" data-draft-field="personId">' +
        club.people.slice().sort(function(a,b){return (a.name||'').localeCompare(b.name||'');}).map(function(x) {
          return '<option value="' + esc(x._id) + '"' + (x._id === d.personId ? ' selected' : '') + '>' + esc(x.name) + '</option>';
        }).join('') +
      '</select>' +
      '<input type="text" data-draft-key="' + esc(key) + '" data-draft-field="roleTitle" value="' + esc(d.roleTitle) + '" placeholder="Role title">' +
      '<label class="mc-assignment-edit-headcheck">' +
        '<input type="checkbox" data-draft-key="' + esc(key) + '" data-draft-field="deptHead"' + (d.deptHead ? ' checked' : '') + '>' +
        'Head' +
      '</label>' +
      '<button class="btn-icon btn-icon--danger" data-remove-draft-key="' + esc(key) + '" title="Remove assignment">×</button>' +
      flagsHtml +
    '</div>';
  }).join('');

  state.manage.deptDrafts = drafts;

  // Add-new row (if adding)
  var addHtml = '';
  if (state.manage.deptAddDraft && state.manage.deptAddDraft.section === section) {
    var nd = state.manage.deptAddDraft;
    var addFlagsHtml = '';
    if (flagKeys.length) {
      addFlagsHtml = '<div class="mc-flag-row">' + flagKeys.map(function(fk){
        var on = !!(nd.flags && nd.flags[fk.key]);
        return '<label class="mc-assignment-edit-headcheck" title="' + esc(fk.description || '') + '">' +
          '<input type="checkbox" data-add-flag="' + esc(fk.key) + '"' + (on ? ' checked' : '') + '>' +
          esc(fk.label) +
        '</label>';
      }).join('') + '</div>';
    }
    addHtml = '<div class="mc-assignment-edit-row" style="border: 1px dashed var(--primary);">' +
      '<select id="mcAddDraftPerson">' +
        '<option value="">— Pick a person —</option>' +
        club.people.slice().sort(function(a,b){return (a.name||'').localeCompare(b.name||'');}).map(function(x) {
          return '<option value="' + esc(x._id) + '"' + (x._id === nd.personId ? ' selected' : '') + '>' + esc(x.name) + '</option>';
        }).join('') +
      '</select>' +
      '<input type="text" id="mcAddDraftTitle" value="' + esc(nd.roleTitle||'') + '" placeholder="Role title (e.g. Press Officer)">' +
      '<label class="mc-assignment-edit-headcheck">' +
        '<input type="checkbox" id="mcAddDraftHead"' + (nd.deptHead ? ' checked' : '') + '>' +
        'Head' +
      '</label>' +
      '<button class="btn-icon btn-icon--danger" id="mcAddDraftCancel">×</button>' +
      addFlagsHtml +
    '</div>';
  }

  var footer = '<div class="mc-dept-footer">' +
    '<button class="btn btn--ghost" data-cancel-dept="' + esc(section) + '">Cancel</button>' +
    '<button class="btn btn--navy" data-save-dept="' + esc(section) + '">Save changes</button>' +
  '</div>';

  var addBtn = state.manage.deptAddDraft
    ? ''
    : '<button class="btn-add" data-add-to-dept="' + esc(section) + '">+ Assign a person to ' + esc(section) + '</button>';

  return (entries.length ? rowsHtml : '<div class="mc-dept-empty">No assignments yet. Add one below.</div>') +
    addHtml +
    addBtn +
    footer;
}

/* ---------- Club details ----------
   Address + FA membership are sourced from clubs-meta and are read-only here
   — they're identity/handbook data and only NL admins/super admins update them.
   Phone, email, website are contact details on the club record itself and
   are editable. */
function renderClubDetails(club) {
  var isEditing = !!state.manage.editingDetails;
  var d = state.manage.editingDetails || {};

  function editableRow(label, key) {
    var val = club[key];
    if (isEditing) {
      return '<div class="mc-field-row">' +
        '<div class="mc-field-label">' + label + '</div>' +
        '<div><input class="mc-field-input" data-details-field="' + key + '" value="' + esc(d[key] != null ? d[key] : (val || '')) + '"></div>' +
      '</div>';
    }
    return '<div class="mc-field-row">' +
      '<div class="mc-field-label">' + label + '</div>' +
      '<div class="mc-field-value' + (val ? '' : ' mc-field-value--muted') + '">' + (val ? esc(val) : 'not set') + '</div>' +
    '</div>';
  }

  function readOnlyRow(label, val, hint) {
    return '<div class="mc-field-row">' +
      '<div class="mc-field-label">' + label + '</div>' +
      '<div class="mc-field-value' + (val ? '' : ' mc-field-value--muted') + '">' +
        (val ? esc(val) : 'not set') +
        (hint ? ' <span style="opacity:.55;font-size:.85em;">— ' + esc(hint) + '</span>' : '') +
      '</div>' +
    '</div>';
  }

  var actions = isEditing
    ? '<div class="mc-dept-footer" style="border-top:none;padding-top:0;margin-top:10px;">' +
        '<button class="btn btn--ghost" id="mcDetailsCancel">Cancel</button>' +
        '<button class="btn btn--navy" id="mcDetailsSave">Save</button>' +
      '</div>'
    : '<div style="margin-top:14px;text-align:right;"><button class="btn btn--ghost btn--sm" id="mcDetailsEdit">Edit contact details</button></div>';

  return '<div class="mc-details">' +
    readOnlyRow('Address', addressOf(club.name), 'managed in clubs-meta') +
    editableRow('Phone', 'phone') +
    editableRow('Email', 'email') +
    editableRow('Website', 'website') +
    readOnlyRow('FA membership', faOf(club.name), 'managed in clubs-meta') +
    actions +
  '</div>';
}
