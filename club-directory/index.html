<!DOCTYPE html>
<!--
  NL Tools — Club Directory
  Version: v1.0 (05/08/2026)
  File: /club-directory/index.html

  The League's own view of the club directory, for anyone with a portal
  account. Read-only: corrections are made by the admin team in
  /club-directory/editor/, which is where the audit trail lives.

  WHAT HAPPENED TO THE OLD ONE
  ----------------------------
  This replaces a 6,264-line tool that predated most of the canon it should
  have been using — 50 bare font-weights against a variable face, 11 rgba
  overlays where the shade ladder belongs, 14 hard-coded px sizes against a
  clamp scale, 5 native confirm/alert calls, and 1,425 lines of local CSS.
  Rebuilding was cheaper than remediating.

  It also carried an "Import handbook seed data" button that wrote the 2025
  handbook parse into app-data/ops-club-directory/clubs — the same node the
  2026 directory lives in. Someone pressed it, and for an evening the editor
  showed 2025 people with no contact details while the bake silently refused
  to run because the node was not empty. The button is gone with the rest.

  Kept from that tool as ideas rather than code: the People Model v2
  assessment (a closed League-owned `function` key per role, held separately
  from the club's free-text title, and vacant posts modelled properly) and
  the required-list compliance scoring. Both belong in a later pass.

  Storage (RTDB):
    app-data/ops-club-directory/clubs        the directory (read)
    app-data/ops-club-directory/provenance   what the bake changed (read)

  Access (auth-guard registry):
    staff / admin / superadmin → access. Club users see their own club only,
    enforced by rules on clubs/$clubName, not by this page.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Club Directory — NL Tools</title>

  <link rel="stylesheet" href="/system/nl-brand.css?v=32">
  <link rel="stylesheet" href="/club-directory/_directory.css?v=16">

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

  <script>
    firebase.initializeApp({
      apiKey:            "AIzaSyC3az3OMnU7TdqlaWp8yrO_EjgZ36l-mXU",
      authDomain:        "nl-tools.firebaseapp.com",
      databaseURL:       "https://nl-tools-default-rtdb.europe-west1.firebasedatabase.app",
      projectId:         "nl-tools",
      storageBucket:     "nl-tools.firebasestorage.app",
      messagingSenderId: "801354670005",
      appId:             "1:801354670005:web:05d8ebad3e7e63610d03fc"
    });
    var db = firebase.database();
  </script>

  <script>
    window.NL_TOOL = {
      title: 'Club Directory',
      toolKey: 'ops-club-directory'
    };
    var NL_TOOL_KEY = 'ops-club-directory';

    window.NL_CHANGELOG = [
      {
        date: '5 August 2026',
        version: 'v1.0',
        items: [
          'Rebuilt on the shared club-directory presentation. The previous tool was 6,264 lines that predated most of the canon it should have been using, so this is a rebuild rather than a remediation.',
          'The "Import handbook seed data" button is gone. It wrote the 2025 handbook parse into the same RTDB node the 2026 directory lives in, which is how an evening was lost to a directory full of people nobody recognised.',
          'Read-only. Corrections happen in /club-directory/editor/, where every edit is attributable.'
        ]
      }
    ];

    window.nlAuthReady = function (userData) {
      window.NL = window.NL || {};
      window.NL.session = userData;
      if (window.TOOL && window.TOOL.boot) { window.TOOL.boot(userData); }
      else { window._toolDeferredSession = userData; }
    };
  </script>

  <script src="/system/nl-utils.js?v=29"></script>
  <script src="/system/nl-topbar.js?v=8"></script>
  <script src="/system/auth-guard.js?v=10"></script>
  <script src="/club-directory/_directory.js?v=16"></script>

<style>
  /* Staff see every club, including ones the admin team has not been through
     yet — internally it matters more to know a club is coming than to be
     protected from it. So the state is stated rather than the club hidden,
     which is the opposite of the reader's rule and deliberately so. */
  .cd-pickbar {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    margin: 0 0 4px;
  }
  .cd-pickbar select {
    font-family: var(--font); font-size: var(--text-sm);
    font-weight: 600; font-variation-settings: 'wght' 600;
    padding: 8px 11px; border: 1px solid var(--border);
    border-radius: var(--radius); background: var(--white); color: var(--text);
    max-width: 280px;
  }
  /* The state chip is the canon .pill — .pill--approved and .pill--pending
     already are green-on-green-light and amber-on-amber-light, which is
     exactly what "checked" and "not yet checked" want to look like. */
</style>
</head>
<body>

<div id="nlTopbar"></div>

<div id="pageWrap">
  <div class="page">
    <div class="cd-pickbar">
      <select id="pick" aria-label="Choose a club"></select>
      <span id="state"></span>
    </div>
    <div class="cd-search"><div class="cd-search__box">
      <svg class="cd-search__icon" width="17" height="17" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
      <input class="cd-search__in" id="q" placeholder="Search clubs, people and job titles"
        aria-label="Search">
    </div></div>
    <div id="out"></div>
  </div>
</div>

<script>
window.TOOL = (function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var esc = NL.escHtml;
  var ALL = {}, names = [];

  function ready(n) {
    var s = (ALL[n] || {}).signedOff;
    return !!(s && s.at);
  }

  function boot() {
    Promise.all([
      NL.clubs.load(),
      db.ref('app-data/ops-club-directory/clubs').once('value')
    ]).then(function (res) {
      ALL = res[1].val() || {};
      names = Object.keys(ALL).sort();
      if (!names.length) {
        $('out').innerHTML = '<p class="cd-empty">The directory has not been built yet. ' +
          'The admin team builds it from the club submissions in the editor.</p>';
        return;
      }
      $('pick').innerHTML = names.map(function (n) {
        return '<option value="' + esc(n) + '">' + esc(n) +
          (ready(n) ? '' : ' — not yet checked') + '</option>';
      }).join('');
      $('pick').addEventListener('change', function () { draw(this.value); });
      $('q').addEventListener('input', onSearch);
      var first = fromHash() || names[0];
      $('pick').value = first;
      draw(first);
      window.addEventListener('hashchange', function () {
        var n = fromHash();
        if (n) { $('pick').value = n; draw(n); }
      });
    }).catch(function (err) {
      $('out').innerHTML = '<p class="cd-empty">' + esc((err && err.message) || String(err)) + '</p>';
    });
  }

  function fromHash() {
    var h = decodeURIComponent((location.hash || '').replace(/^#/, ''));
    return names.indexOf(h) > -1 ? h : '';
  }

  function draw(name) {
    var rec = ALL[name];
    if (!rec) { return; }
    rec.club = rec.club || name;
    if (location.hash !== '#' + encodeURIComponent(name)) {
      history.replaceState(null, '', '#' + encodeURIComponent(name));
    }
    var done = ready(name);
    $('state').innerHTML = '<span class="pill pill--' + (done ? 'approved' : 'pending') + '">' +
      (done ? 'Checked' : 'Not yet checked') + '</span>';
    $('out').innerHTML = NLDirectory.renderClub(rec, {});
    var crest = document.getElementById('cdCrest');
    if (crest) {
      crest.alt = name + ' crest';
      crest.hidden = false;
      NL.clubs.wireCrestImg(crest, name, true);
      crest.src = NL.clubs.crestUrl(name, 'medium');
    }
  }

  function onSearch(e) {
    var hits = NLDirectory.search(ALL, e.target.value);
    if (!hits) { draw($('pick').value); return; }
    $('state').innerHTML = '';
    if (!hits.length) { $('out').innerHTML = '<p class="cd-empty">Nothing matched that.</p>'; return; }
    var byClub = {};
    hits.forEach(function (h) { (byClub[h.club] = byClub[h.club] || []).push(h.person); });
    $('out').innerHTML = Object.keys(byClub).sort().map(function (c) {
      return '<div class="cd-dept"><h3 class="cd-dept__h">' + esc(c) + '</h3><ul class="cd-rows">' +
        byClub[c].map(function (p) {
          return NLDirectory.personRow(p, (NLDirectory.rolesOf(p)[0] || {}).section, {});
        }).join('') + '</ul></div>';
    }).join('');
  }

  return { boot: boot };
}());

if (window._toolDeferredSession) { window.TOOL.boot(window._toolDeferredSession); }
</script>
</body>
</html>
