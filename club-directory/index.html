<!--
  NL Tools — Club Directory
  Version: v1.12 (06/10/2026)

  v1.12 (06/10/2026) — tabs reordered Directory, Mailing lists, Admin, and
  Directory opens first: reading a club is what most visits are for.
  · Overview becomes Admin, shown to League accounts only (a club user
    reads their own club, so other clubs' gaps are nothing they can act on).
  · "Checked" is gone everywhere — the column, the stat, the filter, the
    picker's "— not yet checked" suffix and the club's status pill. It
    tracked the seeding pass, which is over; signedOff is still written by
    the editor and simply no longer read here.
  · The audit asks "what will fail when someone uses this", ordered by how
    badly: no contact at all, no email (left out of every mailing list),
    lists unfilled — now meaning nobody ON the list has an email, the same
    rule the builder's coverage gaps use — no chair or CEO, no job title,
    empty club card, then the tidier's typo checks, renamed "To double-
    check" with each one listed in the tooltip. Column tooltips say what
    each counts. Opens on "Something missing"; each row has Fix, which opens
    the club in the editor.

  v1.11 (06/10/2026) — the mailing-list builder, rebuilt after a fresh-eyes
  review found it looked wrong and, worse, acted wrong:
  · No clubs ticked meant ALL clubs. Unticking the last of two clubs sent to
    72. Scope is now an explicit choice (All clubs / Choose clubs), and
    Choose with nothing ticked exports nothing.
  · Every filter change wiped the rows you had dropped by hand. Drops now
    persist until "Put all back", keyed by club and person.
  · Lists and departments sat side by side as lookalike pills with
    overlapping names (Commercial was both). They are now two views behind
    one switch — Named contact / Whole department — each saying in a line
    what it means; picks in both still combine.
  · "Chairs & chief executives" was not on the screen; presets now answer
    the three questions actually asked (secretaries, chairs and CEOs, media).
  · Pill counts ignored the club choice; they now count people at the
    clubs in scope.
  · "all" and "none" acted on different sets; Select all / Clear both act
    on the view showing. They were also btn--link, which is not a canon
    class, so they rendered as unstyled grey blocks.
  · A division could not lose one club. Each division folds open (canon
    .disclosure) to its clubs as ticks, with Add all / Remove all.
  · The count and copy buttons sit in a bar that sticks under the topbar,
    with the selection said in one sentence, so a phone shows the effect
    of each tick without scrolling.
  · Coverage gaps fold to one line until opened.
  · The selection lives in the address (#mail?…), so a monthly mailer is
    a bookmark and a selection can be sent to someone.

  v1.10 (06/10/2026) — the club chooser is built from canon. v1.9 kept the
  hidden panel of 72 pills (clubs are an open set, and an open set never gets
  a pill each) and added the divisions as bare text links. Now: the three
  divisions are .filter-pill toggles, any one club is added through
  NL.clubPicker, and the clubs picked that way show as active pills with
  their crest — click one to take it out. A whole division shows as its
  division pill rather than as its twenty-four clubs.

  v1.9 (06/10/2026) — three asks from people sending mail with it.
  · Whole divisions in one click. The club chooser carries National / North /
    South buttons that add (or, when already all in, remove) that division,
    so "Step 2 clubs" is North then South rather than 48 single clicks.
  · Departments as well as lists. "Every chair and chief executive" is not
    one of the eleven lists — those name one contact per job — so the board
    departments and the rest of the department taxonomy are offered as a
    second group of pills. A person in two picked groups is still one row.
  · One address per person in the export. A person holding several
    addresses (their own, plus secretary@ and commercial@) came out as one
    cell of addresses run together. The CSV now has Email — the address for
    the job you picked them for — and Other emails, "; "-separated. "For the
    job" is decided by the data first (an address scoped to that department
    in the editor), then by its mailbox name (commercial@ for the Commercial
    list, matched on the same synonyms as shared inboxes), then by the
    order the club gave them. Copy named and Copy addresses use that one
    address too; the others stay in the CSV.

  canon .table-wrap (brand v2.45); local .ov-tablewrap duplicate deleted.
  nl-brand ?v=44 -> ?v=45 (lockstep sweep).
  File: /club-directory/index.html

  The League's own view of the club directory, for anyone with a portal
  account. Read-only: corrections are made by the admin team in
  /club-directory/editor/, which is where the audit trail lives.

  v1.1 — THREE VIEWS INSTEAD OF ONE
  ---------------------------------
  v1.0 was a club browser and nothing else: pick a club, read it. That is the
  right thing to have, but it answers only the question you already knew to
  ask. The two questions actually being asked of this data every week were
  "which clubs still need work" and "give me every media contact in the
  National League so I can email them", and neither had an answer here.

    OVERVIEW      one row per club, what is outstanding, sortable by any
                  column. The point is to be able to say "these eleven clubs
                  have nobody on the safety list" without opening eleven clubs.
    MAILING LISTS the export. Pick lists, pick clubs, drop anyone you do not
                  want, copy or download. Rebuilt from the List builder in the
                  tool this replaced, which had the interaction model right.
    DIRECTORY     v1.0, unchanged.

  WHAT COUNTS AS AN ISSUE
  -----------------------
  Five things, and they are all things a human has to resolve — nothing here
  is a style preference:

    Flags        NLTidy.flagAttention — a domain one character from hotmail,
                 an address whose spelling fights the name, a phone number
                 that cannot be dialled, a job title entered twice. Derived
                 live on every draw, so a flag added to the tidier shows up
                 here without a rebake.
    No details   the club card is empty. Nothing held at all.
    No job title a person with roles but not one of them titled.
    No route     a person with neither an email nor a phone. They are in the
                 directory and cannot be contacted, which is the one failure
                 a directory cannot survive.
    Lists unset  a mailing list with nobody on it. Mail to it goes nowhere.

  The total is a sum, used only for the default sort. It is not a score and
  is deliberately not presented as one — a club with fourteen people will
  out-flag a club with four whatever the state of either.

  MAILING LISTS ARE NOT DEPARTMENTS
  ---------------------------------
  Eleven lists, a separate taxonomy from the fifteen departments, and the
  clubs answered them separately. SLO, DLO and PLO exist here and nowhere
  else. The taxonomy lives in _directory.js (v1.3) so the editor and this
  page cannot drift apart.

  SHARED MAILBOXES IN AN EXPORT
  -----------------------------
  34 clubs gave us departmental inboxes — commercial@, tickets@ — and those
  are frequently the address the club would rather you used. They are keyed
  by the club's own dept label, not by our list keys, so they are matched
  onto a list by that label against a small synonym table (INBOX_MATCH).
  A match is a guess and is labelled as one on screen: every inbox row is
  tagged "shared mailbox" and can be dropped like any other row. An inbox we
  cannot place simply is not offered.

  NOT-FOR-PUBLICATION DETAILS
  ---------------------------
  "Do not publish" is decided per address and per number as of v1.2, so a
  person can be publishing their club address while their mobile is held
  back. Two things follow for the export.

  It does not mean "do not write to". This page is behind auth-guard, the
  export is internal routing, and a secretary who asked not to be in the
  public directory still expects League mail. So withheld details are
  included, counted on screen, and there is a switch to leave them out.

  When that switch is off it drops the withheld LINES, not the person —
  dropping the person would lose the address they were happy to give us,
  which is the opposite of what the switch is for. Somebody left with
  nothing after that is dropped.

  Storage (RTDB):
    app-data/ops-club-directory/clubs        the directory (read)
    app-data/ops-club-directory/provenance   what the bake changed (read)

  Access (auth-guard registry):
    staff / admin / superadmin → access. Club users see their own club only,
    enforced by rules on clubs/$clubName, not by this page — which means a
    club user's export contains their own club and nothing else, correctly,
    without this page having to know that.
-->

<style>
  .cd-pickbar {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    margin: 0 0 4px;
  }
  .cd-pickbar select {
    font-family: var(--font); font-size: var(--text-sm);
    font-weight: 600; font-variation-settings: 'wght' 600;

  /* ---------------------------------------------------------- overview */
  .ov-filters {

  }

  .ov-table { width: 100%; }
  .ov-table th { white-space: nowrap; cursor: pointer; user-select: none; }
  .ov-table th[data-sort]:hover { color: var(--primary); }
  .ov-table th .ov-arrow { opacity: 0; margin-left: 4px; }
  .ov-table th.is-sorted .ov-arrow { opacity: 1; }
  .ov-table td { vertical-align: middle; }
  .ov-club {
    display: flex; align-items: center; gap: 9px; white-space: nowrap;
    font-variation-settings: 'wght' 700;
  }
  .ov-club img { width: 22px; height: 22px; object-fit: contain; flex: none; }
  .ov-club button {
    border: none; background: none; padding: 0; cursor: pointer;
    font: inherit; color: var(--navy); text-align: left;
    font-variation-settings: 'wght' 700;
  }
  .ov-club button:hover { color: var(--primary); text-decoration: underline; }
  .ov-n { font-variant-numeric: tabular-nums; text-align: right; }
  /* A zero is the good answer in every numeric column here, so it recedes
     and a non-zero carries the weight. Colour is not the only cue — the
     number itself already differs — so this stays decorative. */
  .ov-n--zero { color: var(--navy-300); }
  .ov-n--bad  { color: var(--red); font-variation-settings: 'wght' 800; }
  .ov-n--warn { color: var(--amber); font-variation-settings: 'wght' 800; }

  /* -------------------------------------------------------- list builder
     Canon pieces throughout: .chip-group for the two either/or questions
     (which kind of contact; all clubs or chosen ones), .filter-pill for the
     closed sets you tick (eleven lists, the departments), .disclosure for
     each division's clubs, NL.clubPicker to find one by name, .btn--ghost
     for every secondary action. What is left here is layout. */

    display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
    align-items: start; margin-bottom: 16px;

  .lb-actions { display: flex; gap: 6px; }
  .lb-hint { margin: 8px 0 10px; font-size: var(--text-sm); color: var(--text-muted); }
  .lb-pills { display: flex; flex-wrap: wrap; gap: 6px; }
  .lb-pills .filter-pill { font-size: var(--text-xs); padding: 5px 11px; }

    font-style: normal; opacity: 0.72; margin-left: 5px;
    font-variant-numeric: tabular-nums;

  .lb-scope { display: inline-flex; }
  .lb-pick { margin: 12px 0 8px; }

  .lb-divall { margin-left: auto; }

    display: flex; align-items: center; gap: 7px; padding: 3px 0;

  }

  .lb-clubopt img { width: 16px; height: 16px; object-fit: contain; flex: none; }

  /* The bar sticks under the 72px topbar at the canon in-page sticky level
     (50 — below the topbar and any open dropdown; see nl-brand v2.65). */
  .lb-bar {
    position: sticky; top: 72px; z-index: 50;
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px 16px; flex-wrap: wrap;
    background: var(--white); border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 10px 14px; margin-bottom: 16px;
  }
  .lb-bar__count { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1 1 320px; }
  .lb-bar__text { min-width: 0; }
  .lb-bar__summary { font-size: var(--text-sm); font-variation-settings: 'wght' 700; color: var(--navy); }
  .lb-putback { margin-left: 4px; }
  /* On a phone the bar is two short rows — the count with the selection
     clamped to two lines, then the two copy buttons — because a sticky bar
     that grows with the sentence ends up covering the controls it reports
     on. The CSV buttons stay in the page's own flow on wider screens only;
     a CSV is not something anyone opens on a phone. */
  @media (max-width: 640px) {
    .lb-bar { padding: 8px 10px; gap: 8px; }
    .lb-bar__count { flex-basis: 100%; }

      overflow: hidden;
    }
    .lb-count { font-size: 26px; }
    .lb-bar .lb-copy { width: 100%; }
    .lb-copy__main { flex: 1; }
    .lb-copy__csv { display: none; }
  }
  .lb-opts {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px;
    margin: 0 0 16px; padding: 12px 14px;
    background: var(--off-white); border-radius: var(--radius);

  .lb-opt { display: flex; align-items: center; gap: 8px; font-size: var(--text-sm); }
  .lb-opt input { width: 15px; height: 15px; accent-color: var(--navy); }
  .lb-opt span { color: var(--text-muted); }

  .lb-gaps {
    border: 1px solid var(--amber); background: var(--amber-light);
    border-radius: var(--radius); margin-bottom: 16px;
  }
  .lb-gaps > summary { color: var(--amber); }
  .lb-gaps > summary:hover { background: transparent; }
  .lb-gaps__body { padding: 0 14px 12px; }
  .lb-warn__item { font-size: var(--text-sm); margin-top: 8px; }
  .lb-warn__item:first-of-type { margin-top: 0; }
  .lb-warn__crests {
    display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 5px;
  }
  .lb-warn__crest {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: var(--text-xs); color: var(--text);
  }
  .lb-warn__crest img { width: 16px; height: 16px; object-fit: contain; }

  .lb-count {
    font-size: 30px; font-variation-settings: 'wght' 900; line-height: 1;
    color: var(--navy); font-variant-numeric: tabular-nums;
  }
  .lb-count__sub { font-size: var(--text-sm); color: var(--text-muted); }
  .lb-copy { display: flex; gap: 8px; flex-wrap: wrap; }
  .lb-table { width: 100%; }
  .lb-table td { vertical-align: top; }
  .lb-table tr.is-omitted td { opacity: 0.42; text-decoration: line-through; }
  .lb-table tr.is-omitted td:first-child { text-decoration: none; }
  .lb-omit {
    width: 26px; height: 26px; line-height: 1; padding: 0;
    border: 1px solid var(--border); background: var(--white);
    border-radius: 5px; cursor: pointer; color: var(--text-muted);
    font-family: var(--font); font-size: var(--text-sm);
  }
  .lb-omit:hover { border-color: var(--primary); color: var(--primary); }
  .lb-clubcell { display: flex; align-items: center; gap: 7px; }
  .lb-clubcell img { width: 18px; height: 18px; object-fit: contain; flex: none; }
  .lb-none { color: var(--text-muted); font-style: italic; }

      <button class="tab" data-pane="admin" id="tabAdmin" hidden>Admin</button>
    </div>

    <!-- ======================================================== MAILING LISTS -->
    <div class="ov-pane" id="pane-lists" hidden>
      <!-- The running total, pinned under the topbar for the whole pane, so
           the effect of every choice below is in view as it is made. -->
      <div class="lb-bar">
        <div class="lb-bar__count">
          <span class="lb-count" id="lbCount">0</span>
          <div class="lb-bar__text">
            <div class="lb-bar__summary" id="lbSummary"></div>
            <div class="lb-count__sub" id="lbCountSub"></div>
          </div>
        </div>
        <div class="lb-copy">
          <button class="btn btn--navy btn--sm lb-copy__main" data-copy="named">Copy named</button>
          <button class="btn btn--navy btn--sm lb-copy__main" data-copy="plain">Copy addresses</button>
          <button class="btn btn--ghost btn--sm lb-copy__csv" data-copy="csv">Copy as CSV</button>
          <button class="btn btn--ghost btn--sm lb-copy__csv" id="lbDownload">Download CSV</button>
        </div>
      </div>

      <div class="lb-grid">
        <section class="lb-panel">
          <div class="section-head"><h2>Who</h2></div>
          <div class="filter-pill-row lb-presets" id="lbPresets"></div>
          <div class="lb-row">
            <div class="chip-group" id="lbView" role="group" aria-label="Kind of contact">
              <button class="chip" data-view="list">Named contact<span class="lb-n"></span></button>
              <button class="chip" data-view="dept">Whole department<span class="lb-n"></span></button>
            </div>
            <div class="lb-actions">
              <button class="btn btn--ghost btn--sm" id="lbWhoAll">Select all</button>
              <button class="btn btn--ghost btn--sm" id="lbWhoNone">Clear</button>
            </div>
          </div>
          <p class="lb-hint" id="lbViewHint"></p>
          <div class="lb-pills" id="lbLists"></div>
          <div class="lb-pills" id="lbDepts" hidden></div>
        </section>
        <section class="lb-panel">
          <div class="section-head"><h2>Which clubs</h2></div>
          <div class="chip-group lb-scope" id="lbScope" role="group" aria-label="Which clubs">
            <button class="chip" data-scope="all" id="lbScopeAll">All clubs</button>
            <button class="chip" data-scope="some">Choose clubs</button>
          </div>
          <div id="lbChoose" hidden>
            <div class="lb-pick" id="lbPick"></div>
            <div class="lb-divs" id="lbDivs"></div>

      <div class="lb-opts">
        <span class="filter-label">Include</span>
        <label class="lb-opt">
          <input type="checkbox" id="lbInboxes" checked>
          Shared mailboxes <span id="lbInboxNote"></span>
        </label>
        <label class="lb-opt">
          <input type="checkbox" id="lbHeld" checked>
          Addresses the club asked us not to publish <span id="lbHeldNote"></span>
        </label>

      <div id="lbWarnings" hidden></div>

      <div class="table-wrap">
        <table class="table table--compact lb-table" id="lbTable"></table>
      </div>
    </div>

    <!-- =========================================================== DIRECTORY -->
    <div class="ov-pane" id="pane-directory">
      <div class="cd-pickbar">
        <select id="pick" aria-label="Choose a club"></select>
      </div>
      <div class="cd-search"><div class="cd-search__box">
        <svg class="cd-search__icon" width="17" height="17" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
        <input class="cd-search__in" id="q" placeholder="Search clubs, people and job titles"
          aria-label="Search">
      </div></div>
      <div id="out"></div>
    </div>


    <!-- =============================================================== ADMIN -->
    <div class="ov-pane" id="pane-admin" hidden>
      <div class="stats" id="ovStats"></div>
      <div class="ov-filters filter-pill-row">
        <span class="filter-pill-row__label">Show</span>
        <button class="filter-pill active" data-ovf="todo">Something missing</button>
        <button class="filter-pill" data-ovf="all">All clubs</button>
      </div>
      <div class="table-wrap">
        <table class="table table--compact ov-table" id="ovTable"></table>
      </div>
    </div>

  </div>
</div>

<script>
window.TOOL = (function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var esc = NL.escHtml;
  var arr = function (v) { return NLDirectory.arr(v); };
  var ALL = {}, names = [], clubNames = [], AUDIT = {}, ADMIN = false;

  var LIST_ORDER = NLDirectory.LIST_ORDER;
  var LIST_LABEL = NLDirectory.LIST_LABEL;

  /* A club labels its own mailboxes in its own words — "Ticket office",
     "Press office", "Accounts". Placing one on a League list is therefore a
     text match, not a lookup, so it is kept small, explicit and visible:
     every inbox recipient is tagged on screen and can be dropped. An inbox
     whose label matches nothing is simply never offered, which is the right
     failure — an unplaced mailbox in an export is worse than a missing one. */
  var INBOX_MATCH = {
    secretary:  ['secretar', 'admin'],
    media:      ['media', 'press', 'communicat', 'marketing'],
    programme:  ['programme', 'program'],
    commercial: ['commercial', 'sponsor', 'partnership', 'hospitality'],
    finance:    ['finance', 'account', 'invoice', 'payment'],
    ticketing:  ['ticket', 'box office'],
    medical:    ['medical', 'physio'],
    safety:     ['safety', 'steward'],
    slo:        ['supporter liaison', 'fan liaison', 'supporter service'],
    dlo:        ['disability', 'disabled'],
    plo:        ['police']
  };
  /* Deliberately not in the table: "General Enquiries", "Club Office",
     "General Info". They are real addresses at real clubs and they belong to
     no list in particular, so placing them on one would be inventing an
     answer. Safeguarding is the same shape from the other end — the clubs
     have a safeguarding inbox and the League has no safeguarding list, so it
     stays unoffered rather than being folded into Safety officer, which is a
     different job. */

  function boot() {
    Promise.all([
      NL.clubs.load(),
      db.ref('app-data/ops-club-directory/clubs').once('value')
    ]).then(function (res) {
      ALL = res[1].val() || {};
      names = Object.keys(ALL).sort();
      /* The mailing-list builder and its warnings speak only to clubs — an
         org record (the League, the Trust) has no club-role lists to be on. */
      clubNames = names.filter(function (n) { return !NLDirectory.isOrg(ALL[n]); });
      if (!names.length) {
        $('pane-directory').innerHTML = '<p class="cd-empty">The directory has not been ' +
          'built yet. The admin team builds it from the club submissions in the editor.</p>';
        return;
      }
      names.forEach(function (n) { AUDIT[n] = auditClub(n); });

      /* Read the deep link BEFORE wiring the directory: drawing a club
         replaceState's its name into the hash, so asking afterwards is
         asking a question you have just answered yourself — which is how the
         overview opened on the directory tab every single time. */
      var deep = fromHash();
      var wantAdmin = location.hash === '#admin';

      /* Admin is the League's maintenance view — what is missing, club by
         club. A club user reads their own club only, so a 72-row table of
         other clubs' gaps is nothing they can see or act on. */
      ADMIN = NL.roles.realm((NL.session || {}).role) === 'league';
      $('tabAdmin').hidden = !ADMIN;

      wireTabs();
      if (ADMIN) { drawOverview(); }
      buildLists();
      /* A #mail?… link is read after buildLists (it needs the divisions)
         and before wireDirectory, which writes a club name over the hash. */
      var mail = readMailHash();
      wireDirectory();

      if (mail) { showPane('lists'); drawLists(); }
      else if (wantAdmin && ADMIN) { showPane('admin'); }
      else if (deep) { showPane('directory'); }
    }).catch(function (err) {
      $('pane-directory').innerHTML = '<p class="cd-empty">' +
        esc((err && err.message) || String(err)) + '</p>';
    });
  }

  /* --------------------------------------------------------------- panes */
  function wireTabs() {
    $('tabs').addEventListener('click', function (e) {
      var b = e.target.closest('[data-pane]');
      if (b) { showPane(b.dataset.pane); }
    });
  }
  function showPane(which) {
    if (which === 'admin' && !ADMIN) { which = 'directory'; }
    ['directory', 'lists', 'admin'].forEach(function (p) {
      $('pane-' + p).hidden = p !== which;
    });
    $('tabs').querySelectorAll('.tab').forEach(function (b) {
      b.classList.toggle('active', b.dataset.pane === which);
    });
    /* Each tab owns the address while it shows: the club being read, the
       mailing-list selection, or #admin — so a reload opens where you were. */
    if (which === 'lists') { writeMailHash(); }
    else if (which === 'directory' && $('pick').value) {
      history.replaceState(null, '', '#' + encodeURIComponent($('pick').value));
    } else if (which === 'admin') {
      history.replaceState(null, '', '#admin');
    }
  }

  /* ------------------------------------------------------------ the audit
     Derived live, never stored. A flag added to the tidier appears here on
     the next load with no rebake, which is the whole reason flagAttention is
     re-run rather than read back out of provenance. */
  function heldInfo(info) {
    info = info || {};
    return Object.keys(info).filter(function (k) {
      return k !== 'noSponsor' && String(info[k] == null ? '' : info[k]).trim() !== '';
    }).length;
  }

  /* A list or department is FILLED when somebody on it has an email. A
     named secretary with only a phone number is a list nobody can mail, and
     the mailing-list builder would export nothing for that club — so for
     the question this page asks ("what will go nowhere?") they are the same
     gap. Shared with the builder's coverage warnings so the two agree. */
  function hasEmail(p) { return NLDirectory.emailsOf(p).length > 0; }
  function filled(rec, k) { return membersOf(rec, k).some(hasEmail); }

  /* What is MISSING from a club's entry — the directory is built, so the
     question is no longer "has the admin team been through this one" but
     "what will fail when someone uses it". Ordered by how badly: people
     who cannot be reached, then mail that would go nowhere, then what is
     merely incomplete, then the tidier's things to double-check. */
  function auditClub(name) {
    var rec = ALL[name] || {};
    var org = NLDirectory.isOrg(rec);
    var people = arr(rec.people);
    var flags = window.NLTidy ? NLTidy.flagAttention(rec) : [];
    var noRoute = people.filter(function (p) { return !NLDirectory.reachable(p); }).length;
    var noEmail = people.filter(function (p) {
      return NLDirectory.reachable(p) && !hasEmail(p);
    }).length;
    var noTitle = people.filter(function (p) {
      return !NLDirectory.rolesOf(p).some(function (r) { return (r.title || '').trim(); });
    }).length;
    /* An org has no answer to the eleven club lists, or a club board;
       counting them would pin permanent gaps on every org row. */
    var gaps = org ? [] : LIST_ORDER.filter(function (k) { return !filled(rec, k); });
    var noBoard = !org && !filled(rec, DEPT + 'Leadership') && !filled(rec, DEPT + 'Executive');
    var details = heldInfo(rec.info);
    return {
      club: name, org: org, crest: NLDirectory.crestKeyOf(rec),
      people: people.length, noRoute: noRoute, noEmail: noEmail, noTitle: noTitle,
      gaps: gaps.length, gapKeys: gaps, noBoard: noBoard ? 1 : 0,
      details: details, noDetails: details ? 0 : 1,
      flags: flags.length, flagList: flags,
      todo: noRoute + noEmail + noTitle + gaps.length + (noBoard ? 1 : 0) +
            (details ? 0 : 1) + flags.length
    };
  }

  /* -------------------------------------------------------------- admin */
  var OV = { sort: 'todo', dir: -1, filter: 'todo' };

  /* Titles are what is wrong, in plain words; each carries a one-line
     tooltip saying what counts, because "No route" in v1.1 needed knowing
     the code to read. */
  var OV_COLS = [
    { key: 'club',      label: 'Club' },
    { key: 'noRoute',   label: 'No contact', num: true, tone: 'bad',
      tip: 'People with neither an email nor a phone number' },
    { key: 'noEmail',   label: 'No email',          num: true, tone: 'warn',
      tip: 'People with a phone number but no email — left out of every mailing list' },
    { key: 'gaps',      label: 'Lists unfilled',  num: true, tone: 'bad',
      tip: 'Mailing lists with nobody on them who has an email' },
    { key: 'noBoard',   label: 'No chair/CEO',   num: true, tone: 'warn',
      tip: 'Nobody with an email in Leadership or Executive — missing from Chairs & chief executives' },
    { key: 'noTitle',   label: 'No job title',      num: true, tone: 'warn',
      tip: 'People with no job title on any of their roles' },
    { key: 'noDetails', label: 'Club card',      num: true, tone: 'bad',
      tip: 'The club card (address, ground, website) is empty' },
    { key: 'flags',     label: 'Check',   num: true, tone: 'warn',
      tip: 'Likely typos: an email domain one letter off, a name and address that disagree, an undiallable number, a title entered twice' },
  ];
  /* No People or Total column: neither is something missing, and with them
     the table ran off a laptop screen before reaching Fix. Total still sets
     the opening order — worst first — and its sum is the last stat. */

  function drawOverview() {
    var rows = names.map(function (n) { return AUDIT[n]; });
    var totals = rows.reduce(function (a, r) {
      a.people += r.people; a.todo += r.todo;
      a.clean += r.todo ? 0 : 1;
      a.unreach += r.noRoute + r.noEmail;
      a.gaps += r.gaps;
      return a;
    }, { people: 0, todo: 0, clean: 0, unreach: 0, gaps: 0 });

    $('ovStats').innerHTML =
      stat(rows.length - totals.clean + ' / ' + rows.length, 'with something missing') +
      stat(totals.unreach, 'people we cannot email') +
      stat(totals.gaps, 'mailing lists unfilled') +
      stat(totals.todo, 'things to fix');

    if (OV.filter === 'todo') { rows = rows.filter(function (r) { return r.todo > 0; }); }

    rows.sort(function (a, b) {
      var k = OV.sort;
      var d = k === 'club' ? a.club.localeCompare(b.club) : a[k] - b[k];
      return (d || a.club.localeCompare(b.club)) * (k === 'club' ? 1 : OV.dir);
    });

    var head = OV_COLS.map(function (c) {
      var cls = (c.num ? 'ta-right' : '') + (OV.sort === c.key ? ' is-sorted' : '');
      return '<th data-sort="' + c.key + '"' + (cls.trim() ? ' class="' + cls.trim() + '"' : '') +
        (c.tip ? ' title="' + esc(c.tip) + '"' : '') + '>' +
        esc(c.label) + '<span class="ov-arrow">' +
        (OV.sort === c.key ? (OV.dir < 0 ? '▾' : '▴') : '') + '</span></th>';
    }).join('') + '<th></th>';

    var body = rows.length ? rows.map(function (r) {
      return '<tr>' +
        '<td><span class="ov-club"><img data-crest="' + esc(r.crest) + '" alt="">' +
          '<button type="button" data-goto="' + esc(r.club) + '">' + esc(r.club) +
          '</button></span></td>' +
        num(r.noRoute, 'bad') +
        num(r.noEmail, 'warn') +
        gapCell(r) +
        (r.org ? dash() : num(r.noBoard, 'warn', r.noBoard ? 'missing' : '')) +
        num(r.noTitle, 'warn') +
        (r.noDetails ? '<td class="ov-n ov-n--bad">empty</td>' : dash()) +
        flagCell(r) +
        '<td class="ta-right"><a class="btn btn--ghost btn--sm" href="/club-directory/editor/#' +
          encodeURIComponent(r.club) + '" target="_blank" rel="noopener">Fix</a></td>' +
      '</tr>';
    }).join('') : '<tr class="empty-row"><td colspan="' + (OV_COLS.length + 1) +
        '">Nothing missing anywhere.</td></tr>';

    $('ovTable').innerHTML = '<thead><tr>' + head + '</tr></thead><tbody>' + body + '</tbody>';
    wireCrests($('ovTable'));
  }

  function stat(n, label) {
    return '<div class="stat"><div class="stat__num">' + esc(String(n)) +
      '</div><div class="stat__label">' + esc(label) + '</div></div>';
  }
  function num(v, tone, text) {
    var cls = 'ov-n ' + (v ? (tone ? 'ov-n--' + tone : '') : 'ov-n--zero');
    return '<td class="' + cls + '">' + (v ? (text || v) : (tone ? '—' : v)) + '</td>';
  }
  function dash() { return '<td class="ov-n ov-n--zero">—</td>'; }
  function gapCell(r) {
    if (r.org) { return dash(); }
    if (!r.gaps) { return dash(); }
    return '<td class="ov-n ov-n--bad" title="' + esc(r.gapKeys.map(function (k) {
      return LIST_LABEL[k] || k;
    }).join(', ')) + '">' + r.gaps + ' / ' + LIST_ORDER.length + '</td>';
  }
  /* The tidier's checks are suggestions, not faults, so they are counted
     with what each one is in the tooltip rather than added to the alarm. */
  function flagCell(r) {
    if (!r.flags) { return dash(); }
    return '<td class="ov-n ov-n--warn" title="' + esc(r.flagList.map(function (f) {
      return f.label + (f.why ? ' — ' + f.why : '');
    }).join('\n')) + '">' + r.flags + '</td>';
  }

  $('ovTable').addEventListener('click', function (e) {
    var th = e.target.closest('th[data-sort]');
    if (th) {
      var k = th.dataset.sort;
      if (OV.sort === k) { OV.dir = -OV.dir; } else { OV.sort = k; OV.dir = k === 'club' ? 1 : -1; }
      drawOverview();
      return;
    }
    var go = e.target.closest('[data-goto]');
    if (go) { showPane('directory'); $('pick').value = go.dataset.goto; draw(go.dataset.goto); }
  });

  document.querySelector('.ov-filters').addEventListener('click', function (e) {
    var b = e.target.closest('[data-ovf]');
    if (!b) { return; }
    OV.filter = b.dataset.ovf;
    document.querySelectorAll('[data-ovf]').forEach(function (x) {
      x.classList.toggle('active', x === b);
    });
    drawOverview();
  });

  /* -------------------------------------------------------- list builder */
  /* scope is explicit. Until v1.11 "no clubs ticked" silently meant all 72,
     so unticking the last of two clubs turned a two-club mailer into a
     72-club one with nothing on screen to say so. Now All is a choice you
     make, and Choose with nothing ticked exports nothing. */
  var LB = { lists: {}, view: 'list', scope: 'all', clubs: {}, omit: {},
             inboxes: true, held: true };

  /* Departments as a second kind of pick (v1.9). "Every chair and chief
     executive" is a department question, not a list one — the eleven lists
     name one contact per job and the board is nobody's list. A department
     key is the section name behind a 'dept:' prefix so it can share LB.lists
     with the list keys and never collide with one. Other is left out: it is
     a shrug, and nobody mails a shrug. */
  var DEPTS = NLDirectory.ORDER.filter(function (s) { return s !== 'Other'; });
  var DEPT = 'dept:';
  function isDept(k) { return k.indexOf(DEPT) === 0; }
  function labelOf(k) { return isDept(k) ? k.slice(DEPT.length) : (LIST_LABEL[k] || k); }

  /* The department each list's job sits in, for reading which of a person's
     addresses is for that job. Only the plain ones: SLO, DLO and PLO have no
     department of their own, so they fall through to the mailbox-name match
     and then to the order the club gave. */
  var LIST_SECTION = {
    secretary: 'Club secretary', media: 'Media & marketing', programme: 'Programme',
    commercial: 'Commercial', finance: 'Finance', ticketing: 'Ticketing',
    medical: 'Medical', safety: 'Matchday & safety'
  };
  function sectionFor(k) { return isDept(k) ? k.slice(DEPT.length) : (LIST_SECTION[k] || ''); }

  /* Mailbox-name needles for a pick: a list's own INBOX_MATCH words, and for
     a department the words of every list that sits in it. Leadership,
     Directors and Executive have none, which is right — a chair's address
     for the chair's job is their own one. */
  function needlesFor(k) {
    if (!isDept(k)) { return INBOX_MATCH[k] || []; }
    var d = k.slice(DEPT.length);
    return LIST_ORDER.filter(function (l) { return LIST_SECTION[l] === d; })
      .reduce(function (a, l) { return a.concat(INBOX_MATCH[l] || []); }, []);
  }

  function membersOf(rec, k) {
    return isDept(k) ? NLDirectory.sectionPeople(rec, k.slice(DEPT.length))
                     : NLDirectory.listMembers(rec, k);
  }

  function pickedKeys() {
    return LIST_ORDER.concat(DEPTS.map(function (d) { return DEPT + d; }))
      .filter(function (k) { return LB.lists[k]; });
  }

  /* One person's addresses for the jobs they were picked for, best first.
     The case that prompted it: one person holding their own address,
     secretary@ and commercial@, exported as one cell of addresses run
     together. Which one is "for" the Commercial list is answered in order of how much we actually know:
       2  the editor scoped the address to that department — the club said so
       1  its mailbox name matches the job (commercial@ for Commercial)
      -1  its mailbox name matches a DIFFERENT list nobody picked — so a
          chair who is also secretary is written to as chair, not secretary@
       0  otherwise, in the order the club gave them
     Addresses scoped to some other job only are left out, which is what the
     scope means; if that leaves nothing, everything comes back rather than
     a person losing their only route because of a scope. */
  function routeFor(p, keys) {
    var secs = keys.map(sectionFor).filter(function (s, i, a) { return s && a.indexOf(s) === i; });
    var all = NLDirectory.contactsOf(p, '');
    function scoped(ch) {
      if (!secs.length) { return all[ch]; }
      var seen = {}, out = [];
      secs.forEach(function (s) {
        NLDirectory.contactsOf(p, s)[ch].forEach(function (x) {
          if (!seen[x.value.toLowerCase()]) { seen[x.value.toLowerCase()] = 1; out.push(x); }
        });
      });
      return out.length ? out : all[ch];
    }
    var mine = keys.reduce(function (a, k) { return a.concat(needlesFor(k)); }, []);
    var others = LIST_ORDER.filter(function (l) { return keys.indexOf(l) < 0; })
      .reduce(function (a, l) { return a.concat(INBOX_MATCH[l] || []); }, [])
      .filter(function (n) { return mine.indexOf(n) < 0; });
    function hit(local, needles) {
      return needles.some(function (n) { return local.indexOf(n.replace(/\s+/g, '')) > -1; });
    }
    function score(x) {
      if (x.sections.length && x.sections.some(function (s) { return secs.indexOf(s) > -1; })) { return 2; }
      var local = x.value.split('@')[0].toLowerCase().replace(/[^a-z]/g, '');
      if (hit(local, mine)) { return 1; }
      return hit(local, others) ? -1 : 0;
    }
    var em = scoped('emails').filter(function (x) { return LB.held || !x.hide; })
      .map(function (x, i) { return { v: x.value, s: score(x), i: i }; })
      .sort(function (a, b) { return (b.s - a.s) || (a.i - b.i); })
      .map(function (x) { return x.v; });
    var ph = scoped('phones').filter(function (x) { return LB.held || !x.hide; })
      .map(function (x) { return x.value; });
    return { emails: em, phones: ph };
  }

  /* Every candidate recipient for the current selection, before omissions.
     A person on two selected lists is ONE recipient carrying both list names
     — the old tool shipped a version that emailed them twice and it was the
     first thing anyone noticed. The same holds across a list and a
     department: the club secretary picked twice is still one row. */
  function recipients() {
    var picked = pickedKeys();
    if (!picked.length) { return []; }
    var clubs = clubNames.filter(function (n) {
      return inScope(n);
    });
    var out = [], index = {};

    clubs.forEach(function (club) {
      var rec = ALL[club] || {};
      picked.forEach(function (key) {
        membersOf(rec, key).forEach(function (p) {
          var id = club + '::' + (p.id || NLDirectory.fullName(p));
          var row = index[id];
          if (!row) {
            var c = NLDirectory.contactsOf(p, '');
            row = index[id] = {
              key: id, club: club, kind: 'person', person: p,
              name: NLDirectory.fullName(p) || 'Name not given',
              held: c.emails.concat(c.phones).some(function (x) { return x.hide; }),
              /* De-duplicated: a title entered twice is flagged on the
                 overview as something to fix, and repeating it here just
                 makes the export look wrong as well. */
              roles: NLDirectory.rolesOf(p).map(function (r) {
                return (r.title || '').trim();
              }).filter(function (t, i, a) { return t && a.indexOf(t) === i; }),
              emails: [], phones: [], lists: []
            };
            out.push(row);
          }
          if (row.lists.indexOf(key) < 0) { row.lists.push(key); }
        });
        if (LB.inboxes && !isDept(key)) {
          inboxesFor(rec, key).forEach(function (b) {
            var id = club + '::box::' + b.label;
            var row = index[id];
            if (!row) {
              row = index[id] = {
                key: id, club: club, kind: 'inbox', name: b.label, held: false,
                roles: [], emails: b.email ? [b.email] : [],
                phones: b.phone ? [b.phone] : [], lists: []
              };
              out.push(row);
            }
            if (row.lists.indexOf(key) < 0) { row.lists.push(key); }
          });
        }
      });
    });

    /* Routes are worked out once every key a person was picked for is known,
       because which address is theirs "for the job" depends on all of them.
       Per address and per number, not per person: somebody can publish their
       club address and keep their mobile back, so "leave out what is not for
       publication" drops the withheld LINES and keeps the person. Somebody
       left with nothing is dropped. */
    out = out.filter(function (r) {
      if (r.kind !== 'person') { return true; }
      var route = routeFor(r.person, r.lists);
      r.emails = route.emails;
      r.phones = route.phones;
      return LB.held || r.emails.length || r.phones.length;
    });

    out.sort(function (a, b) {
      return a.club.localeCompare(b.club) ||
        (a.kind === b.kind ? 0 : a.kind === 'inbox' ? 1 : -1) ||
        a.name.localeCompare(b.name);
    });
    return out;
  }

  function inScope(n) { return LB.scope === 'all' || !!LB.clubs[n]; }

  /* A club's shared mailboxes that belong on one League list, matched on the
     club's own label. Deliberately loose on the label and strict on the
     result: no email, no recipient. */
  function inboxesFor(rec, key) {
    var boxes = rec.inboxes || {};
    var needles = INBOX_MATCH[key] || [];
    return Object.keys(boxes).map(function (k) {
      var b = boxes[k] || {};
      var label = String(b.dept || k).trim();
      var hay = (label + ' ' + k).toLowerCase();
      if (!needles.some(function (n) { return hay.indexOf(n) > -1; })) { return null; }
      var email = (b.email || '').trim();
      if (!email) { return null; }
      return { label: label || k, email: email, phone: (b.phone || '').trim() };
    }).filter(Boolean);
  }

  var DIV_ORDER = ['National', 'North', 'South', 'Other'];
  var DIV_CLUBS = { National: [], North: [], South: [], Other: [] };
  function divOf(n) {
    var meta = NL.clubs.byName(n);
    var d = meta && meta.division;
    return DIV_CLUBS[d] ? d : 'Other';
  }

  /* One-click answers to the questions this page is actually asked. A preset
     REPLACES the who-selection rather than adding to it — "Chairs & chief
     executives" on top of whatever was there before is not what anyone means
     by pressing it. The clubs are left alone. Its pill is lit while the
     selection is exactly that preset, and pressing a lit one clears it, so
     it behaves like every other pill on the page. */
  var PRESETS = [
    { id: 'sec',   label: 'Club secretaries',          keys: ['secretary'] },
    { id: 'board', label: 'Chairs & chief executives', keys: [DEPT + 'Leadership', DEPT + 'Executive'] },
    { id: 'media', label: 'Media contacts',            keys: ['media'] }
  ];

  /* Which kind of answer each view gives. Said once, under the switch,
     because the two views carry names that overlap (Commercial is both) and
     mean different things. */
  var VIEW_HINT = {
    list: 'The one person each club named for the job.',
    dept: 'Everyone the club filed in that department.'
  };

  function pill(key, label) {
    return '<button class="filter-pill" data-list="' + esc(key) + '">' +
      esc(label) + '<em></em></button>';
  }

  /* ------------------------------------------------------------ the page
     Built once. Everything after this is a state change followed by
     drawLists(), which updates what is already on the page rather than
     rebuilding it — so an open division stays open, the picker keeps its
     place, and a checkbox does not lose focus under the keyboard. */
  function buildLists() {
    $('lbPresets').innerHTML = '<span class="filter-pill-row__label">Quick picks</span>' +
      PRESETS.map(function (p) {
        return '<button class="filter-pill" data-preset="' + p.id + '">' + esc(p.label) + '</button>';
      }).join('');
    $('lbLists').innerHTML = LIST_ORDER.map(function (k) {
      return pill(k, LIST_LABEL[k] || k);
    }).join('');
    $('lbDepts').innerHTML = DEPTS.filter(function (d) {
      return clubNames.some(function (c) { return NLDirectory.sectionPeople(ALL[c] || {}, d).length; });
    }).map(function (d) { return pill(DEPT + d, d); }).join('');

    clubNames.forEach(function (n) { DIV_CLUBS[divOf(n)].push(n); });
    $('lbScopeAll').textContent = 'All ' + clubNames.length + ' clubs';

    /* A division is a closed set of two dozen, so it may list its clubs —
       but folded, because the usual move is all of it or none of it. The
       fold is what lets you take ONE club out of a division, which the
       pill-per-division version could not do at all. */
    $('lbDivs').innerHTML = DIV_ORDER.filter(function (d) {
      return DIV_CLUBS[d].length;
    }).map(function (d) {
      return '<details class="disclosure lb-divrow" data-divrow="' + d + '">' +
        '<summary><span class="lb-divrow__name">' + esc(d) + '</span>' +
          '<span class="disclosure__meta" data-divmeta="' + d + '"></span>' +
          '<button type="button" class="btn btn--ghost btn--sm lb-divall" data-divall="' + d + '"></button>' +
        '</summary>' +
        '<div class="lb-clubgrid">' + DIV_CLUBS[d].map(function (n) {
          return '<label class="lb-clubopt"><input type="checkbox" data-club="' + esc(n) + '">' +
            '<img data-crest="' + esc(n) + '" alt="">' + esc(n) + '</label>';
        }).join('') + '</div></details>';
    }).join('');
    wireCrests($('lbDivs'));

    /* The canon picker is a way IN for someone who knows the club's name and
       not its division. It empties and lets go of focus after every pick, so
       it never looks like it is holding a selection — the ticks below are
       the selection. */
    var picker = NL.clubPicker($('lbPick'), {
      placeholder: 'Find a club…',
      clearable: false,
      onSelect: function (sel) {
        picker.clear();
        var input = $('lbPick').querySelector('input');
        if (input) { input.blur(); }
        if (clubNames.indexOf(sel.name) < 0) {
          NL.toast(sel.name + ' is not in the directory yet', 'info');
          return;
        }
        LB.clubs[sel.name] = true;
        drawLists();
      }
    });

    var pane = $('pane-lists');
    pane.addEventListener('click', function (e) {
      var t = e.target;
      var da = t.closest('[data-divall]');
      if (da) { e.preventDefault(); toggleDivision(da.dataset.divall); return drawLists(); }
      var l = t.closest('[data-list]');
      if (l) { flip(LB.lists, l.dataset.list); return drawLists(); }
      var pr = t.closest('[data-preset]');
      if (pr) { applyPreset(pr.dataset.preset); return drawLists(); }
      var v = t.closest('[data-view]');
      if (v) { LB.view = v.dataset.view; return drawLists(); }
      var sc = t.closest('[data-scope]');
      if (sc) { LB.scope = sc.dataset.scope; return drawLists(); }
      var cp = t.closest('[data-copy]');
      if (cp) { return doCopy(cp.dataset.copy, cp); }
      var om = t.closest('[data-omit]');
      if (om) {
        var k = om.dataset.omit;
        if (LB.omit[k]) { delete LB.omit[k]; } else { LB.omit[k] = true; }
        return drawLists();
      }
      if (t.id === 'lbPutBack') { LB.omit = {}; return drawLists(); }
      if (t.id === 'lbWhoAll') { return setView(true); }
      if (t.id === 'lbWhoNone') { return setView(false); }
      if (t.id === 'lbDownload') { return download(); }
    });
    pane.addEventListener('change', function (e) {
      var c = e.target.closest('[data-club]');
      if (c) {
        if (c.checked) { LB.clubs[c.dataset.club] = true; } else { delete LB.clubs[c.dataset.club]; }
        return drawLists();
      }
      if (e.target.id === 'lbInboxes') { LB.inboxes = e.target.checked; drawLists(); }
      if (e.target.id === 'lbHeld') { LB.held = e.target.checked; drawLists(); }
    });

    drawLists();
  }

  /* Hand-dropped rows are NOT cleared by any of these. Re-picking a list
     used to wipe every × you had made, so tidying fifteen people and then
     adding a club put all fifteen back. A drop is keyed by club and person,
     so it lies dormant while that person is out of the selection and
     applies again if they come back. "Put all back" is the only way to
     clear them, and it says how many it is putting back. */
  function flip(bag, key) {
    if (bag[key]) { delete bag[key]; } else { bag[key] = true; }
  }

  /* Select all and Clear act on the view you are looking at, both of them.
     In v1.9 "all" meant the eleven lists and "none" meant everything, from
     two buttons side by side. */
  function viewKeys() {
    return LB.view === 'dept'
      ? DEPTS.map(function (d) { return DEPT + d; }).filter(function (k) {
          return document.querySelector('[data-list="' + k + '"]');
        })
      : LIST_ORDER.slice();
  }
  function setView(on) {
    viewKeys().forEach(function (k) { if (on) { LB.lists[k] = true; } else { delete LB.lists[k]; } });
    drawLists();
  }

  function applyPreset(id) {
    var p = PRESETS.filter(function (x) { return x.id === id; })[0];
    if (!p) { return; }
    var lit = isPreset(p);
    LB.lists = {};
    if (lit) { return; }
    p.keys.forEach(function (k) { LB.lists[k] = true; });
    LB.view = isDept(p.keys[0]) ? 'dept' : 'list';
  }

  function isPreset(p) {
    var keys = pickedKeys();
    return keys.length === p.keys.length && p.keys.every(function (k) { return LB.lists[k]; });
  }

  /* All of a division in, or — when it is already all in — all of it out.
     A part-chosen division fills up rather than emptying, because "add the
     rest" is the commoner meaning of pressing it then. */
  function toggleDivision(d) {
    var pool = DIV_CLUBS[d] || [];
    var full = pool.every(function (n) { return LB.clubs[n]; });
    pool.forEach(function (n) { if (full) { delete LB.clubs[n]; } else { LB.clubs[n] = true; } });
  }

  function chosenIn(d) {
    return (DIV_CLUBS[d] || []).filter(function (n) { return LB.clubs[n]; }).length;
  }

  /* -------------------------------------------------------------- drawing */
  function syncControls() {
    /* Who. Each view's chip says how many it has picked, so a pick in the
       view you are not looking at is never invisible. */
    var nList = LIST_ORDER.filter(function (k) { return LB.lists[k]; }).length;
    var nDept = pickedKeys().length - nList;
    document.querySelectorAll('#lbView [data-view]').forEach(function (b) {
      var on = b.dataset.view === LB.view;
      var n = b.dataset.view === 'dept' ? nDept : nList;
      b.classList.toggle('active', on);
      b.setAttribute('aria-pressed', String(on));
      b.querySelector('.lb-n').textContent = n ? ' · ' + n : '';
    });
    $('lbLists').hidden = LB.view !== 'list';
    $('lbDepts').hidden = LB.view !== 'dept';
    $('lbViewHint').textContent = VIEW_HINT[LB.view];
    PRESETS.forEach(function (p) {
      var b = document.querySelector('[data-preset="' + p.id + '"]');
      var on = isPreset(p);
      b.classList.toggle('active', on);
      b.setAttribute('aria-pressed', String(on));
    });

    /* Counts are people at the clubs in scope, so they move with the club
       choice — "Club secretary 61" no longer reads 61 once you have
       narrowed to two clubs. */
    var pool = clubNames.filter(inScope);
    document.querySelectorAll('#pane-lists [data-list]').forEach(function (b) {
      var k = b.dataset.list;
      b.classList.toggle('active', !!LB.lists[k]);
      b.setAttribute('aria-pressed', String(!!LB.lists[k]));
      var n = pool.reduce(function (a, c) { return a + membersOf(ALL[c] || {}, k).length; }, 0);
      b.querySelector('em').textContent = n;
    });

    /* Which clubs. */
    document.querySelectorAll('#lbScope [data-scope]').forEach(function (b) {
      var on = b.dataset.scope === LB.scope;
      b.classList.toggle('active', on);
      b.setAttribute('aria-pressed', String(on));
    });
    $('lbChoose').hidden = LB.scope !== 'some';
    DIV_ORDER.forEach(function (d) {
      var meta = document.querySelector('[data-divmeta="' + d + '"]');
      if (!meta) { return; }
      var n = chosenIn(d), of = DIV_CLUBS[d].length;
      meta.textContent = n ? n + ' of ' + of + ' chosen' : 'none chosen';
      document.querySelector('[data-divall="' + d + '"]').textContent =
        n === of ? 'Remove all' : 'Add all ' + of;
    });
    document.querySelectorAll('#lbDivs input[data-club]').forEach(function (cb) {
      cb.checked = !!LB.clubs[cb.dataset.club];
    });
  }

  /* The selection in one sentence, which is what sits in the bar while you
     scroll — the controls that made it are a screen away by then. */
  function describe() {
    var lists = LIST_ORDER.filter(function (k) { return LB.lists[k]; }).map(labelOf);
    var depts = pickedKeys().filter(isDept).map(labelOf);
    var who = [];
    if (lists.length) {
      who.push(joinAnd(lists) + ' (named contact' + (lists.length > 1 ? 's' : '') + ')');
    }
    if (depts.length) { who.push('everyone in ' + joinAnd(depts)); }
    if (!who.length) { return ''; }
    return capital(who.join(', and ')) + ' — ' + describeClubs();
  }
  function describeClubs() {
    if (LB.scope === 'all') { return 'all ' + clubNames.length + ' clubs'; }
    var total = clubNames.filter(inScope).length;
    if (!total) { return 'no clubs chosen'; }
    /* Whole divisions by name, part ones by count ("South and 23 North
       clubs"), and one lone club by its own name. */
    var parts = [];
    DIV_ORDER.forEach(function (d) {
      var n = chosenIn(d);
      if (!n) { return; }
      if (n === DIV_CLUBS[d].length) { parts.push(d); return; }
      if (n === 1 && total === 1) {
        parts.push(DIV_CLUBS[d].filter(function (c) { return LB.clubs[c]; })[0]);
        return;
      }
      parts.push(n + ' ' + (d === 'Other' ? 'other' : d) + ' club' + (n === 1 ? '' : 's'));
    });
    /* The total only when the parts do not already say it — "23 North
       clubs (23 clubs)" says it twice. */
    var said = parts.length === 1 && /^\d/.test(parts[0]);
    return joinAnd(parts) + (total > 1 && !said ? ' (' + total + ' clubs)' : '');
  }
  function joinAnd(a) {
    return a.length < 2 ? a.join('') : a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1];
  }
  function capital(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

  function drawLists() {
    syncControls();
    writeMailHash();
    var rows = recipients();
    var kept = rows.filter(function (r) { return !LB.omit[r.key]; });
    var reach = kept.filter(function (r) { return r.emails.length; });
    var heldIn = rows.filter(function (r) { return r.held; }).length;
    var boxes = rows.filter(function (r) { return r.kind === 'inbox'; }).length;
    var dropped = rows.length - kept.length;

    $('lbInboxNote').textContent = boxes ? '(' + boxes + ' matched)' : '';
    $('lbHeldNote').textContent = heldIn ? '(' + heldIn + ' people)' : '';

    var picked = pickedKeys().length;
    var none = LB.scope === 'some' && !clubNames.some(inScope);
    $('lbCount').textContent = reach.length;
    $('lbSummary').textContent = describe() ||
      'Choose who to write to.';
    $('lbCountSub').innerHTML = !picked || none ? ''
      : (reach.length === 1 ? 'address' : 'addresses') +
        (kept.length - reach.length ? ' · ' + (kept.length - reach.length) + ' with no email' : '') +
        (dropped ? ' · ' + dropped + ' dropped <button type="button" class="btn btn--ghost btn--sm lb-putback" ' +
          'id="lbPutBack">Put ' + (dropped === 1 ? 'it' : 'all ' + dropped) + ' back</button>' : '');

    document.querySelectorAll('[data-copy], #lbDownload').forEach(function (b) {
      b.disabled = !reach.length;
    });

    drawWarnings();

    if (!picked || none) {
      $('lbTable').innerHTML = '<tbody><tr class="empty-row"><td>' +
        (!picked ? 'Choose who to write to.'
                 : 'No clubs chosen. Tick some, or switch to all clubs.') +
        '</td></tr></tbody>';
      return;
    }

    $('lbTable').innerHTML = '<thead><tr><th></th><th>Picked for</th><th>Name</th>' +
      '<th>Club</th><th>Email</th><th>Phone</th></tr></thead><tbody>' +
      rows.map(function (r) {
        var off = !!LB.omit[r.key];
        return '<tr class="' + (off ? 'is-omitted' : '') + '">' +
          '<td><button class="lb-omit" data-omit="' + esc(r.key) + '" aria-label="' +
            (off ? 'Put back ' : 'Drop ') + esc(r.name) + '" title="' +
            (off ? 'Put back' : 'Drop from this export') + '">' +
            (off ? '+' : '×') + '</button></td>' +
          '<td>' + esc(r.lists.map(labelOf).join(', ')) + '</td>' +
          '<td>' + esc(r.name) +
            (r.kind === 'inbox' ? ' <span class="pill pill--info">shared mailbox</span>' : '') +
            (r.held ? ' <span class="pill pill--pending">has withheld details</span>' : '') +
            (r.roles.length ? '<br><span class="cd-row__ext">' +
              esc(r.roles.join(' / ')) + '</span>' : '') + '</td>' +
          '<td><span class="lb-clubcell"><img data-crest="' + esc(r.club) + '" alt="">' +
            esc(r.club) + '</span></td>' +
          '<td>' + (r.emails.length
            ? '<a href="mailto:' + esc(r.emails[0]) + '">' + esc(r.emails[0]) + '</a>' +
              (r.emails.length > 1 ? '<br><span class="cd-row__ext">also ' +
                r.emails.slice(1).map(esc).join(', ') + '</span>' : '')
            : '<span class="lb-none">no email held</span>') + '</td>' +
          '<td>' + (r.phones.length ? esc(r.phones.join(', ')) : '') + '</td>' +
        '</tr>';
      }).join('') + '</tbody>';
    wireCrests($('lbTable'));
  }

  /* Which clubs have nobody for something you have picked. Folded, with the
     headline in the summary: open, it is one crest row per pick, and with
     several picked it pushed the recipients off the screen. Its open state
     is kept across redraws so reading it is not undone by the next tick. */
  function drawWarnings() {
    var pool = clubNames.filter(inScope);
    var gaps = pickedKeys().map(function (k) {
      return { k: k, missing: pool.filter(function (n) { return !filled(ALL[n] || {}, k); }) };
    }).filter(function (g) { return g.missing.length; });

    var box = $('lbWarnings');
    if (!gaps.length) { box.hidden = true; box.innerHTML = ''; return; }
    var clubs = {};
    gaps.forEach(function (g) { g.missing.forEach(function (n) { clubs[n] = 1; }); });
    var n = Object.keys(clubs).length;
    var open = box.querySelector('details[open]') ? ' open' : '';
    box.hidden = false;
    box.innerHTML = '<details class="disclosure lb-gaps"' + open + '><summary>Coverage gaps' +
      '<span class="disclosure__meta">' + n + ' club' + (n === 1 ? ' has' : 's have') +
      ' nobody we can email for ' + joinAnd(gaps.map(function (g) { return labelOf(g.k); })) +
      '</span></summary><div class="lb-gaps__body">' +
      gaps.map(function (g) {
        return '<div class="lb-warn__item"><b>' + g.missing.length + ' club' +
          (g.missing.length === 1 ? '' : 's') + '</b> with nobody we can email ' +
          (isDept(g.k) ? 'in' : 'on') + ' <b>' + esc(labelOf(g.k)) +
          '</b><div class="lb-warn__crests">' +
          g.missing.map(function (c) {
            return '<span class="lb-warn__crest"><img data-crest="' + esc(c) +
              '" alt="">' + esc(c) + '</span>';
          }).join('') + '</div></div>';
      }).join('') + '</div></details>';
    wireCrests(box);
  }

  /* ---------------------------------------------------------- the link
     The whole selection lives in the address, so a mailer you send every
     month is a bookmark, and "the list I used" can be sent to a colleague.
     #mail?… is a separate namespace from the directory's #<club name>, and
     is written only while this tab is showing. Hand-dropped rows are left
     out: they name people, and a link is the wrong place to keep that. */
  var MAIL = 'mail?';
  function writeMailHash() {
    if ($('pane-lists').hidden) { return; }
    var p = [];
    var keys = pickedKeys();
    if (keys.length) { p.push('who=' + keys.map(encodeURIComponent).join(',')); }
    if (LB.view === 'dept') { p.push('view=dept'); }
    if (LB.scope === 'some') {
      var parts = [];
      DIV_ORDER.forEach(function (d) {
        var pool = DIV_CLUBS[d];
        if (pool.length && pool.every(function (n) { return LB.clubs[n]; })) {
          parts.push('div:' + d);
        } else {
          pool.forEach(function (n) { if (LB.clubs[n]) { parts.push(n); } });
        }
      });
      p.push('clubs=' + parts.map(encodeURIComponent).join(','));
    }
    if (!LB.inboxes) { p.push('inboxes=0'); }
    if (!LB.held) { p.push('held=0'); }
    var h = '#' + MAIL + p.join('&');
    if (location.hash !== h) { history.replaceState(null, '', h); }
  }
  /* Returns true if the address carried a selection. Unknown keys and clubs
     no longer in the directory are skipped rather than trusted. */
  function readMailHash() {
    var h = (location.hash || '').replace(/^#/, '');
    if (h.indexOf(MAIL) !== 0) { return false; }
    var q = {};
    h.slice(MAIL.length).split('&').forEach(function (kv) {
      var i = kv.indexOf('=');
      if (i > 0) { q[kv.slice(0, i)] = kv.slice(i + 1); }
    });
    var valid = LIST_ORDER.concat(DEPTS.map(function (d) { return DEPT + d; }));
    LB.lists = {};
    (q.who || '').split(',').map(decodeURIComponent).forEach(function (k) {
      if (valid.indexOf(k) > -1) { LB.lists[k] = true; }
    });
    LB.view = q.view === 'dept' ? 'dept' : 'list';
    LB.clubs = {};
    LB.scope = q.clubs != null ? 'some' : 'all';
    (q.clubs || '').split(',').filter(Boolean).map(decodeURIComponent).forEach(function (c) {
      if (c.indexOf('div:') === 0) {
        (DIV_CLUBS[c.slice(4)] || []).forEach(function (n) { LB.clubs[n] = true; });
      } else if (clubNames.indexOf(c) > -1) { LB.clubs[c] = true; }
    });
    LB.inboxes = q.inboxes !== '0';
    LB.held = q.held !== '0';
    $('lbInboxes').checked = LB.inboxes;
    $('lbHeld').checked = LB.held;
    return true;
  }

  /* --------------------------------------------------------------- export */
  function exportRows() {
    return recipients().filter(function (r) {
      return !LB.omit[r.key] && r.emails.length;
    });
  }

  /* One address per person everywhere a message gets sent — emails[0], the
     one for the job they were picked for (routeFor). The rest stay in the
     CSV's Other emails column, "; "-separated so Excel and Outlook both read
     them as separate addresses.

     bom is for the downloaded file only — Excel needs it to read an accented
     name, and pasting one into the clipboard puts an invisible character at
     the front of whatever you paste it into. */
  function formatAs(fmt, bom) {
    var rows = exportRows();
    if (fmt === 'named') {
      /* Quoted display name because Outlook will otherwise treat a comma in
         a name as a recipient separator. */
      return rows.map(function (r) {
        return '"' + r.name.replace(/"/g, '') + '" <' + r.emails[0] + '>';
      }).join('; ');
    }
    if (fmt === 'plain') {
      var seen = {}, all = [];
      rows.forEach(function (r) {
        var lc = r.emails[0].toLowerCase();
        if (!seen[lc]) { seen[lc] = 1; all.push(r.emails[0]); }
      });
      return all.join('; ');
    }
    return NL.csv([['Name', 'Club', 'Division', 'Picked for', 'Job titles',
                    'Email', 'Other emails', 'Phones', 'Type', 'Published']].concat(
      rows.map(function (r) {
        var meta = NL.clubs.byName(r.club);
        return [r.name, r.club, (meta && meta.division) || '',
          r.lists.map(labelOf).join(' / '),
          r.roles.join(' / '), r.emails[0], r.emails.slice(1).join('; '),
          r.phones.join('; '),
          r.kind === 'inbox' ? 'Shared mailbox' : 'Person',
          r.held ? 'Some details withheld' : 'All published'];
      })), { bom: !!bom });
  }

  function doCopy(fmt, btn) {
    var text = formatAs(fmt);
    if (!text) { return; }
    var was = btn.textContent;
    NL.copy(text, { silent: true }).then(function (ok) {
      if (!ok) { NL.toast('Copy failed — try the CSV download instead', 'error'); return; }
      btn.textContent = '✓ Copied';
      setTimeout(function () { btn.textContent = was; }, 1600);
    });
  }

  function download() {
    var picked = pickedKeys();
    var stamp = new Date().toISOString().slice(0, 10);
    var one = picked.length === 1
      ? labelOf(picked[0]).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '')
      : picked.length + '-lists';
    NL.download('nl-mailing-list-' + one + '-' + stamp + '.csv',
      formatAs('csv', true), 'text/csv;charset=utf-8');
    NL.toast(exportRows().length + ' recipients downloaded', 'success');
  }

  /* ------------------------------------------------------------ directory */
  function wireDirectory() {
    /* Orgs above the clubs; `names` itself stays alphabetical for fromHash. */
    $('pick').innerHTML = NLDirectory.orgFirst(names, function (n) { return ALL[n]; })
      .map(function (n) {
      return '<option value="' + esc(n) + '">' + esc(n) + '</option>';
    }).join('');
    $('pick').addEventListener('change', function () { draw(this.value); });
    $('q').addEventListener('input', onSearch);
    var first = fromHash() || names[0];
    $('pick').value = first;
    draw(first);
    window.addEventListener('hashchange', function () {
      var n = fromHash();
      if (n) { showPane('directory'); $('pick').value = n; draw(n); return; }
      if (readMailHash()) { showPane('lists'); drawLists(); }
    });
  }

  function fromHash() {
    var h = decodeURIComponent((location.hash || '').replace(/^#/, ''));
    return names.indexOf(h) > -1 ? h : '';
  }

  function draw(name) {
    var rec = ALL[name];
    if (!rec) { return; }
    rec.club = rec.club || name;
    if (location.hash !== '#' + encodeURIComponent(name)) {
      history.replaceState(null, '', '#' + encodeURIComponent(name));
    }
    $('out').innerHTML = NLDirectory.renderClub(rec, { showGaps: true });
    var crest = document.getElementById('cdCrest');
    if (crest) {
      var ck = NLDirectory.bannerCrestOf(rec);
      crest.alt = name + ' crest';
      crest.hidden = false;
      NL.clubs.wireCrestImg(crest, ck, true);
      crest.src = NL.clubs.crestUrl(ck, 'medium');
    }
  }

  function onSearch(e) {
    var hits = NLDirectory.search(ALL, e.target.value);
    if (!hits) { draw($('pick').value); return; }
    if (!hits.length) { $('out').innerHTML = '<p class="cd-empty">Nothing matched that.</p>'; return; }
    var byClub = {};
    hits.forEach(function (h) { (byClub[h.club] = byClub[h.club] || []).push(h.person); });
    $('out').innerHTML = Object.keys(byClub).sort().map(function (c) {
      return '<div class="cd-dept"><h3 class="cd-dept__h">' + esc(c) + '</h3><ul class="cd-rows">' +
        byClub[c].map(function (p) {
          return NLDirectory.personRow(p, (NLDirectory.rolesOf(p)[0] || {}).section, {});
        }).join('') + '</ul></div>';
    }).join('');
  }

  /* Crests are wired after the HTML lands rather than built into it:
     wireCrestImg installs the fallback handler, and setting src first means a
     404 fires before anything is listening. */
  function wireCrests(root) {
    root.querySelectorAll('img[data-crest]').forEach(function (img) {
      var n = img.dataset.crest;
      img.alt = n + ' crest';
      NL.clubs.wireCrestImg(img, n, true);
      img.src = NL.clubs.crestUrl(n, 'thumb');
    });
  }

  return { boot: boot };
}());

if (window._toolDeferredSession) { window.TOOL.boot(window._toolDeferredSession); }
</script>
</body>
</html>
