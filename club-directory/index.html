      btn.textContent = '✓ Copied';
      setTimeout(function () { btn.textContent = was; }, 1600);
    });
  }

  function download() {
    var picked = pickedKeys();
    var stamp = new Date().toISOString().slice(0, 10);
    var one = picked.length === 1
      ? labelOf(picked[0]).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '')
      : picked.length + '-lists';
    NL.download('nl-mailing-list-' + one + '-' + stamp + '.csv',
      formatAs('csv', true), 'text/csv;charset=utf-8');
    NL.toast(exportRows().length + ' recipients downloaded', 'success');
  }

  /* ------------------------------------------------------------ directory */
  function wireDirectory() {
    /* Orgs above the clubs in the chooser; `names` itself stays alphabetical
       for fromHash. */
    PICK = NLDirectory.picker($('pick'), {
      names: function () { return names; }, recOf: function (n) { return ALL[n]; },
      onPick: function (n) { $('q').value = ''; draw(n); }
    });
    $('q').addEventListener('input', onSearch);
    $('editBtn').hidden = !canEdit();
    /* View / Edit, the directory's own two-way switch, the same one as
       List / Cards (v1.21): it says which mode you are in, where a lone Edit
       button only said what pressing it does. */
    $('editBtn').addEventListener('click', function (e) {
      var b = e.target.closest('[data-mode]');
      if (b && (b.dataset.mode === 'edit') !== EDITING) { setEdit(b.dataset.mode === 'edit'); }
    });
    $('allClubs').addEventListener('click', function () { $('q').value = ''; draw(''); });
    /* No club in the address: the badge wall, the same one clubs land on. */
    var first = fromHash();
    /* ?edit opens straight into editing — the old edit page forwards here
       with it, and a reload while editing keeps you editing. */
    if (/(^|[?&])edit(=|&|$)/.test(location.search.slice(1)) && canEdit()) { setEdit(true, first); }
    else { draw(first); }
    window.addEventListener('hashchange', function () {
      var n = fromHash();
      if (n) { showPane('directory'); draw(n); return; }
      if (readMailHash()) { showPane('lists'); drawLists(); }
    });
  }

  function fromHash() {
    var h = decodeURIComponent((location.hash || '').replace(/^#/, ''));
    return names.indexOf(h) > -1 ? h : '';
  }

  function draw(name) {
    if (!name) { return drawIndex(); }
    var rec = ALL[name];
    if (!rec) { return; }
    if (EDITING) { return NLEditor.draw(name); }
    drew(name);
    rec.club = rec.club || name;
    $('extra').innerHTML = '';
    /* Staff see everything the League holds, private details included,
       each one marked; the line says why. */
    $('out').innerHTML = staffNote() + NLDirectory.renderClub(rec, { showGaps: true, showHidden: true });
    var crest = document.getElementById('cdCrest');
    if (crest) {
      var ck = NLDirectory.bannerCrestOf(rec);
      crest.alt = name + ' crest';
      crest.hidden = false;
      NL.clubs.wireCrestImg(crest, ck, true);
      crest.src = NL.clubs.crestUrl(ck, 'medium');
    }
  }

  /* No club chosen: every club's badge, clubs and the League's own records,
     exactly as clubs see it at /club-directory/. Pick one to open it. */
  function drawIndex() {
    current = '';
    if (PICK) { PICK.set(''); }
    if (location.hash) { history.replaceState(null, '', location.pathname + location.search); }
    $('allClubs').hidden = true;
    $('extra').innerHTML = '';
    $('out').innerHTML = NLDirectory.renderIndex({
      roster: ROSTER,
      extra: names,
      isReady: function (n) { return !!ALL[n]; },
      orgs: names.filter(function (n) { return NLDirectory.isOrg(ALL[n]); })
        .map(function (n) { return { name: n, crestName: ALL[n].crestName }; })
    });
    NLDirectory.wireIndex($('out'), function (n) { draw(n); window.scrollTo(0, 0); });
  }

  function staffNote() {
    return '<p class="cd-staffnote"><svg class="icon icon--sm" aria-hidden="true"><use href="' +
      '/assets/icons/sprites.svg#icon-lock"></use></svg>As League staff, you can see private ' +
      'details for every club.</p>';
  }

  /* Whichever way a club was drawn — read or edited, from the picker, the
     address, the overview or an undo — the picker, the address and the
     overview row follow it. */
  function drew(name) {
    current = name;
    $('allClubs').hidden = false;
    if (PICK) { PICK.set(name); }
    if (location.hash !== '#' + encodeURIComponent(name)) {
      history.replaceState(null, '', '#' + encodeURIComponent(name));
    }
    /* An edit can change what is missing, so the overview row is re-read. */
    AUDIT[name] = auditClub(name);
  }

  /* ---------------------------------------------------------------- edit
     Editing lives here, behind a button, rather than on a page of its own
     (v1.18, Richard). Manage on Club Directory only — the same check the
     rules make on every write. Off, this is the reading view it always was;
     on, the editor (/club-directory/_editor.js) draws the club with its pens
     and shows Publish and Change log. The editor is started on first use,
     and shares this page's ALL, so the overview and the lists see an edit
     the moment it saves. ?edit in the address keeps editing across a
     reload. */
  function canEdit() {
    var ses = NL.session || {};
    return ses.role === 'superadmin' || ses.toolLevel === 'admin';
  }
  var EDIT_HOST = {
    all: null,
    names: function () { return names; },
    session: null,
    editing: function () { return EDITING; },
    onDraw: drew,
    draw: draw,
    failHost: function () { return $('pane-directory'); }
  };
  function setEdit(on, name) {
    var target = name || current;
    if (on && !canEdit()) { on = false; }
    if (!on) {
      EDITING = false;
      paintEdit();
      redraw(target);
      return;
    }
    EDIT_HOST.all = ALL;
    EDIT_HOST.session = NL.session || {};
    var btn = $('editBtn');
    btn.classList.add('is-busy');
    NLEditor.start(EDIT_HOST).then(function () {
      btn.classList.remove('is-busy');
      EDITING = true;
      paintEdit();
      redraw(target);
    }).catch(function (err) {
      btn.classList.remove('is-busy');
      NL.toast('Could not start editing: ' + ((err && err.message) || err), 'error');
    });
  }
  function paintEdit() {
    $('editBtn').querySelectorAll('[data-mode]').forEach(function (b) {
      var on = (b.dataset.mode === 'edit') === EDITING;
      b.classList.toggle('is-on', on);
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    $('changes').hidden = !EDITING;
    $('pane-directory').classList.toggle('ed-on', EDITING);
    var url = location.pathname + (EDITING ? '?edit' : '') + location.hash;
    history.replaceState(null, '', url);
  }
  function redraw(name) {
    var q = $('q').value;
    if (q.trim()) { onSearch({ target: { value: q } }); }
    else { draw(name); }
  }

  function onSearch(e) {
    if (EDITING) { return NLEditor.search(e.target.value); }
    $('extra').innerHTML = '';
    var hits = NLDirectory.search(ALL, e.target.value);
    if (!hits) { draw(current); return; }
    if (!hits.length) { $('out').innerHTML = '<p class="cd-empty">Nothing matched that.</p>'; return; }
    var byClub = {};
    hits.forEach(function (h) { (byClub[h.club] = byClub[h.club] || []).push(h.person); });
    $('out').innerHTML = Object.keys(byClub).sort().map(function (c) {
      return '<div class="cd-dept"><h3 class="cd-dept__h">' + esc(c) + '</h3><ul class="cd-rows">' +
        byClub[c].map(function (p) {
          /* Staff see private details here too, marked, as on the club page. */
          return NLDirectory.personRow(p, (NLDirectory.rolesOf(p)[0] || {}).section,
            { showHidden: true });
        }).join('') + '</ul></div>';
    }).join('');
  }

  /* Crests are wired after the HTML lands rather than built into it:
     wireCrestImg installs the fallback handler, and setting src first means a
     404 fires before anything is listening. */
  function wireCrests(root) {
    root.querySelectorAll('img[data-crest]').forEach(function (img) {
      var n = img.dataset.crest;
      img.alt = n + ' crest';
      NL.clubs.wireCrestImg(img, n, true);
      img.src = NL.clubs.crestUrl(n, 'thumb');
    });
  }

  return { boot: boot };
}());

</script>
</body>
</html>
