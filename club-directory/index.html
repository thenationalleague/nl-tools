      ? '<span class="pill pill--status pill--status-warn">vacant</span> ' + esc(r.vacantTitle)
      : esc(r.person.name);
    return '<tr class="' + (r.omitted ? 'lb-row-omitted' : '') + '" data-key="' + esc(r.key) + '">' +
      '<td class="lb-col-omit">' +
        '<button class="btn-icon" data-omit-key="' + esc(r.key) + '" aria-pressed="' + (r.omitted ? 'true' : 'false') + '" title="' + (r.omitted ? 'Include row' : 'Omit row') + '">' +
        (r.omitted ? '+' : '\u00d7') +
        '</button>' +
      '</td>' +
      '<td class="lb-col-role">' + esc(r.section) + (state.lb.mode === 'whole' || r.vacant ? ' \u00b7 ' + esc(r.roleTitles.join(' / ')) : '') + '</td>' +
      '<td class="lb-col-name">' + nameCell + '</td>' +
      '<td class="lb-col-club">' +
        '<div class="lb-club-cell">' +
          '<img src="' + crestUrl(r.club) + '" alt="" onerror="this.onerror=null;this.src=\'' + fallbackCrest() + '\'">' +
          '<span>' + esc(r.club) + '</span>' +
        '</div>' +
      '</td>' +
      '<td class="lb-col-email">' + emailCell + '</td>' +
      '<td class="lb-col-phone">' + esc(formatPhone(rc.phone || '')) + '</td>' +
    '</tr>';
  }).join('');

  resultsRoot.innerHTML = '<table class="lb-table">' +
    '<thead><tr><th></th><th>' + (byList ? 'Mailing list' : 'Department') + '</th><th>Name</th><th>Club</th><th>Email</th><th>Phone</th></tr></thead>' +
    '<tbody>' + rows + '</tbody></table>';
}

function formatForCopy(format) {
  var rows = lbDedupedRows(false);
  var withEmail = rows.filter(function(r){ return r.emails.length; });

  if (format === 'named') {
    /* one address per person — their preferred (first) email */
    return withEmail.map(function(r) {
      return '"' + (r.name||'').replace(/"/g,'') + '" <' + r.emails[0] + '>';
    }).join('; ');
  }
  if (format === 'plain') {
    /* every distinct email across the selection, de-duplicated */
    var seen = {}; var all = [];
    withEmail.forEach(function(r){ r.emails.forEach(function(e){ if(!seen[e]){seen[e]=1; all.push(e);} }); });
    return all.join('; ');
  }
  if (format === 'csv') {
    var header = 'Name,Club,Division,Roles,Emails,Phone';
    var lines = rows.map(function(r) {
      function q(s){ s = s == null ? '' : String(s); return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s; }
      return [q(r.name), q(r.club), q(r.division),
              q(r.roleLabels.join(' / ')),
              q(r.emails.join(' ')), q(r.phones.join(' '))].join(',');
    });
    return [header].concat(lines).join('\n');
  }
  return '';
}

function copyToClipboard(text, btn) {
  function flashCopied() {
    var original = btn.textContent;
    btn.classList.add('is-copied');
    btn.textContent = '✓ Copied';
    setTimeout(function() {
      btn.classList.remove('is-copied');
      btn.textContent = original;
    }, 1600);
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(flashCopied, function(err) {
      console.warn('clipboard write failed:', err);
      alert('Copy failed. Please copy manually from the list below.');
    });
  } else {
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); flashCopied(); }
    catch(err) { alert('Copy not supported in this browser.'); }
    document.body.removeChild(ta);
  }
}

/* ================================================================
   MANAGE CONTACTS (v0.9 — two-surface model)
   ================================================================ */

/* Stable IDs on people for referencing in edit state. */
var _nextPersonId = 1;
function ensurePersonIds() {
  window.CLUBS.forEach(function(c) {
    c.people.forEach(function(p) {
      if (!p._id) p._id = 'p' + (_nextPersonId++);
    });
  });
}

function renderManage() {
  ensurePersonIds();
  var root = document.getElementById('mc-root');
  if (state.persona === 'club-editor') {
    state.manage.editingClub = EDITOR_CLUB;
    renderEditor(root);
    return;
  }
  // Admin path
  if (!state.manage.editingClub) {
    renderClubPicker(root);
  } else {
    renderEditor(root);
  }
}

/* ---------- Club picker (unchanged from v0.8) ---------- */
function renderClubPicker(root) {
  var q = (state.manage.pickerSearch || '').toLowerCase();
  var divFilter = state.manage.pickerDivFilter;

  var clubs = window.CLUBS.filter(function(c) {
    if (divFilter && divisionOf(c.name) !== divFilter) return false;
    if (q && c.name.toLowerCase().indexOf(q) === -1) return false;
    return true;
  }).sort(function(a,b) { return a.name.localeCompare(b.name); });

  var rows = clubs.map(function(c) {
    var gaps = clubListGaps(c);
    var status = gaps.length === 0
      ? '<span class="pill pill--status pill--status-good">✓ all lists covered</span>'
      : '<span class="pill pill--status pill--status-warn" title="Nobody on: ' +
        esc(gaps.map(function(l){ return l.label; }).join(', ')) + '">⚠ ' + gaps.length + ' list gap' + (gaps.length===1?'':'s') + '</span>';
    return '<tr data-club="' + esc(c.name) + '">' +
      '<td><div class="mc-club-cell">' +
        '<img src="' + crestUrl(c.name) + '" alt="" onerror="this.onerror=null;this.src=\'' + fallbackCrest() + '\'">' +
        '<span>' + esc(c.name) + '</span>' +
      '</div></td>' +
      '<td><span class="pill pill--identifier">' + esc(DIVISION_FULL_NAMES[divisionOf(c.name)] || divisionOf(c.name)) + '</span></td>' +
      '<td>' + c.people.length + ' people</td>' +
      '<td>' + status + '</td>' +
      '<td class="mc-action-col"><button class="btn btn--ghost btn--sm" type="button">Edit</button></td>' +
    '</tr>';
  }).join('');

  root.innerHTML =
    '<div class="mc-picker-intro">' +
      '<h2>Manage contacts</h2>' +
      '<p>Pick a club to edit its directory entries.</p>' +
    '</div>' +
    '<div class="mc-demo-banner">' +
      '<b>Demo mode:</b> changes are in-memory only and reset on page reload.' +
    '</div>' +
    '<div class="mc-picker-filter">' +
      '<input type="search" placeholder="Search clubs..." id="mcPickerSearch" value="' + esc(state.manage.pickerSearch||'') + '">' +
      '<button class="btn btn--toggle btn--sm" data-div-filter=""' + (!divFilter ? ' aria-pressed="true"' : '') + '>All</button>' +
      '<button class="btn btn--toggle btn--sm" data-div-filter="National"' + (divFilter==='National' ? ' aria-pressed="true"' : '') + '>National</button>' +
      '<button class="btn btn--toggle btn--sm" data-div-filter="North"' + (divFilter==='North' ? ' aria-pressed="true"' : '') + '>North</button>' +
      '<button class="btn btn--toggle btn--sm" data-div-filter="South"' + (divFilter==='South' ? ' aria-pressed="true"' : '') + '>South</button>' +
    '</div>' +
    '<div class="mc-clubs-table">' +
      '<table>' +
        '<thead><tr>' +
          '<th>Club</th><th>Division</th><th>People</th><th>Status</th><th></th>' +
        '</tr></thead>' +
        '<tbody>' + (rows || '<tr><td colspan="5" style="padding:40px;text-align:center;color:var(--text-muted);">No clubs match</td></tr>') + '</tbody>' +
      '</table>' +
    '</div>';
  syncHistory();
}

/* ---------- Editor ---------- */
function renderEditor(root) {
  var club = window.CLUBS.filter(function(c){ return c.name === state.manage.editingClub; })[0];
  if (!club) { root.innerHTML = '<div>Club not found</div>'; return; }
  // The 'departments' surface was retired — fold any stale value (e.g. an old
  // bookmarked URL) back onto People so a surface is always active.
  if (state.manage.surface !== 'people' && state.manage.surface !== 'details') state.manage.surface = 'people';

  var backBar = state.persona === 'admin'
    ? '<div class="mc-back-bar"><button class="btn btn--ghost btn--sm" id="mcBackToPicker">← back to club list</button></div>'
    : '<div class="mc-back-bar"><button class="btn btn--ghost btn--sm" id="mcBackToDirectory">← back to directory</button></div>';

  var title = '<div class="mc-title">' +
    '<h2>' +
      '<img src="' + crestUrl(club.name) + '" alt="" onerror="this.onerror=null;this.src=\'' + fallbackCrest() + '\'">' +
      esc(club.name) +
    '</h2>' +
  '</div>';

  // Surface tabs — People / (Club details if admin)
  var canEditDetails = personaCan('editClubDetails');
  var tabs = '<div class="mc-surface-tabs">' +
    '<button class="mc-surface-tab" data-surface="people" aria-selected="' + (state.manage.surface === 'people' ? 'true' : 'false') + '">' +
      'People <span class="pill pill--count' + (state.manage.surface === 'people' ? ' is-active' : '') + '">' + club.people.length + '</span>' +
    '</button>' +
    (canEditDetails
      ? '<button class="mc-surface-tab" data-surface="details" aria-selected="' + (state.manage.surface === 'details' ? 'true' : 'false') + '">Club details</button>'
      : '') +
  '</div>';

  // Surface content
  var peopleHtml = '<div class="mc-surface' + (state.manage.surface === 'people' ? ' is-active' : '') + '" id="mcSurfacePeople">' + renderPeopleSurface(club) + '</div>';
  var detailsHtml = canEditDetails
    ? '<div class="mc-surface' + (state.manage.surface === 'details' ? ' is-active' : '') + '" id="mcSurfaceDetails">' + renderClubDetails(club) + '</div>'
    : '';

  // Person side-panel if editing
  var panelHtml = '';
  if (state.manage.editingPersonId) {
    panelHtml = renderPersonPanel(club);
  }

  // Confirm dialog
  var confirmHtml = '';
  if (state.manage.confirmDialog) {
    confirmHtml = renderConfirmDialog(state.manage.confirmDialog);
  }

  root.innerHTML =
    backBar + title +
    tabs +
    peopleHtml +
    detailsHtml +
    panelHtml +
    confirmHtml;
  syncHistory();
}

/* ---------- Surface 1: People ---------- */
function renderPeopleSurface(club) {
  var q = (state.manage.peopleSearch || '').toLowerCase().trim();
  var people = club.people.slice().sort(function(a, b) {
    return (a.name||'').localeCompare(b.name||'');
  });

  // Build the HTML for each person row
  var rowsHtml = people.map(function(p) {
    var nameLower = (p.name||'').toLowerCase();
    var emailLower = (p.email||'').toLowerCase();
    if (q && nameLower.indexOf(q) === -1 && emailLower.indexOf(q) === -1) return '';

    var contactParts = [];
    if (p.email) contactParts.push('<a href="mailto:' + esc(p.email) + '" onclick="event.stopPropagation();">' + esc(p.email) + '</a>');
    if (p.phone) contactParts.push('<span>' + esc(formatPhone(p.phone)) + '</span>');

    var nm = (p.name || '').trim();
    var initials = nm ? nm.split(/\s+/).map(function(w){ return w.charAt(0); }).slice(0, 2).join('').toUpperCase() : '?';

    // One pill per role — primary first and colour-filled, the rest outlined.
    var ordered = (p.roles || []).slice().sort(function(a, b){ return (b.main ? 1 : 0) - (a.main ? 1 : 0); });
    var roleTags = ordered.map(function(r) {
      return '<span class="mc-person-card__tag' + (r.main ? ' mc-person-card__tag--primary' : '') + '">' +
        '<b>' + esc(r.section) + '</b> · ' + esc(r.title || '') + '</span>';
    });
    var deptHtml = roleTags.length
      ? roleTags.join('')
      : '<span class="mc-person-card__tag mc-person-card__tag--none">No roles assigned</span>';

    var selectedClass = (state.manage.editingPersonId === p._id) ? ' is-selected' : '';

    return '<div class="mc-person-card' + selectedClass + '" data-person-id="' + esc(p._id) + '">' +
      '<div class="mc-person-card__avatar" aria-hidden="true">' + esc(initials) + '</div>' +
      '<div class="mc-person-card-main">' +
        '<div class="mc-person-card__top">' +
          '<span class="mc-person-card-name">' + esc(p.name||'(unnamed)') + '</span>' +
        '</div>' +
        (contactParts.length
          ? '<div class="mc-person-card-contact">' + contactParts.join('') + '</div>'
          : '<div class="mc-person-card-contact mc-person-card__nocontact">No contact details</div>') +
        '<div class="mc-person-card-depts">' + deptHtml + '</div>' +
      '</div>' +
      '<div class="mc-person-card-actions">' +
        '<button class="btn btn--ghost btn--sm" data-edit-person="' + esc(p._id) + '">Edit</button>' +
      '</div>' +
    '</div>';
  }).filter(Boolean).join('');

  if (!rowsHtml) {
    rowsHtml = '<div style="padding:40px;text-align:center;color:var(--text-muted);font-size:13px;">' +
      (q ? 'No people match "' + esc(q) + '"' : 'No people yet. Click Add Person to add the first.') +
    '</div>';
  }

  return '<div class="mc-people-actions">' +
    '<input type="search" class="mc-people-search" placeholder="Search people by name or email..." id="mcPeopleSearch" value="' + esc(state.manage.peopleSearch||'') + '">' +
    '<button class="btn btn--navy" id="mcAddPersonBtn">+ Add person</button>' +
  '</div>' +
  '<div class="mc-people-list">' + rowsHtml + '</div>';
}

/* ---------- Person side-panel ---------- */
/* Seed a person draft (roleRows + contactRows + name + note) from an
   existing person, or empty for a new one. The modal is now self-sufficient:
   roles and contacts are edited inline, no separate tab needed. */
function seedPersonDraft(person) {
  if (!person) {
    return {
      name: '', note: '',
      roleRows: [{ section: SECTION_ORDER[0], title: '', flags: {} }],
      primaryRoleIdx: 0,
      // New people start with a blank email + phone row already on show, so
      // contact details are encouraged rather than an afterthought. If a type
      // is genuinely unknown the editor ticks "No email/phone on file" — save
      // requires one or the other (no silent blanks).
      contactRows: [
        { type: 'email', value: '', label: '', preferred: true },
        { type: 'phone', value: '', label: '', preferred: true }
      ],
      noEmail: false, noPhone: false,
      listOverrides: {}
    };
  }
  ensureContacts(person);
  var roleRows = (person.roles || []).map(function(r) {
    return {
      section: r.section || SECTION_ORDER[0],
      title: r.title || '',
      flags: Object.assign({}, r.flags || {})
    };
  });
  if (!roleRows.length) roleRows = [{ section: SECTION_ORDER[0], title: '', flags: {} }];
  var primaryRoleIdx = (person.roles || []).findIndex(function(r){ return r.main; });
  if (primaryRoleIdx === -1) primaryRoleIdx = 0;
  var contactRows = (person.contacts || []).filter(function(c){ return c.type === 'email' || c.type === 'phone'; })
    .map(function(c) {
      return { type: c.type, value: c.value || '', label: c.label || '', preferred: !!c.preferred };
    });
  return { name: person.name || '', note: person.note || '',
           noEmail: !!person.noEmail, noPhone: !!person.noPhone,
           listOverrides: Object.assign({}, person.listOverrides || {}),
           roleRows: roleRows, primaryRoleIdx: primaryRoleIdx, contactRows: contactRows };
}

/* Guarantee the editor always shows at least one email row and one phone row.
   You can't delete the last of either — a genuine blank is recorded with the
   "No email/phone on file" checkbox instead. */
function ensureContactFloor(draft) {
  if (!Array.isArray(draft.contactRows)) draft.contactRows = [];
  if (!draft.contactRows.some(function(c){ return c.type === 'email'; })) {
    draft.contactRows.push({ type: 'email', value: '', label: '', preferred: true });
  }
  if (!draft.contactRows.some(function(c){ return c.type === 'phone'; })) {
    draft.contactRows.push({ type: 'phone', value: '', label: '', preferred: true });
  }
}

/* Render one editable role row in the person modal. */
function renderRoleRow(club, draft, r, i) {
  var meta = SECTIONS_BY_KEY[r.section] || {};
  var datalistId = 'mcRoleTitles_' + i;
  var suggestions = titleSuggestionsFor(r.section).map(function(s) {
    return '<option value="' + esc(s) + '"></option>';
  }).join('');

  var sectionOpts = SECTION_ORDER.map(function(key) {
    var label = (SECTIONS_BY_KEY[key] && SECTIONS_BY_KEY[key].key) || key;
    return '<option value="' + esc(key) + '"' + (key === r.section ? ' selected' : '') + '>' + esc(label) + '</option>';
  }).join('');

  // Section flag checkboxes (e.g. Media & marketing -> programmeEditor)
  var flagsHtml = '';
  if (meta.flagKeys && meta.flagKeys.length) {
    flagsHtml = '<div class="mc-role-row__flags">' + meta.flagKeys.map(function(fk) {
      var on = r.flags && r.flags[fk.key] ? ' checked' : '';
      return '<label class="mc-role-row__flag" title="' + esc(fk.description || '') + '">' +
        '<input type="checkbox" data-role-flag-idx="' + i + '" data-flag-key="' + esc(fk.key) + '"' + on + '> ' +
        esc(fk.label) + '</label>';
    }).join('') + '</div>';
  }

  var primaryChecked = (draft.primaryRoleIdx === i) ? ' checked' : '';

  return '<div class="mc-role-row" data-role-idx="' + i + '">' +
    '<div class="mc-role-row__main">' +
      '<select class="mc-role-row__section" data-role-section-idx="' + i + '">' + sectionOpts + '</select>' +
      '<input class="mc-role-row__title" type="text" list="' + datalistId + '" data-role-title-idx="' + i + '" ' +
        'value="' + esc(r.title) + '" placeholder="Role title">' +
      '<datalist id="' + datalistId + '">' + suggestions + '</datalist>' +
      (draft.roleRows.length > 1
        ? '<button class="btn-icon btn-icon--danger mc-role-row__remove" data-remove-role-idx="' + i + '" title="Remove role">×</button>'
        : '<span class="mc-role-row__remove-spacer"></span>') +
    '</div>' +
    '<div class="mc-role-row__opts">' +
      '<label class="mc-role-row__opt"><input type="radio" name="personPrimaryRole" data-primary-role-idx="' + i + '"' + primaryChecked + '> Primary role</label>' +
      flagsHtml +
    '</div>' +
  '</div>';
}

/* One contact entry — just the value plus a remove button. Type is implied by
   which column it lives in (email or phone); i stays the index into the flat
   draft.contactRows array so the value/remove handlers map straight through.
   The first entry of each type becomes the headline (person.email/.phone).
   removable is false for the sole row of a type — there's always at least one
   email row and one phone row; "No … on file" handles a genuine blank. */
function renderContactRow(draft, c, i, removable) {
  return '<div class="mc-contact-row" data-contact-idx="' + i + '">' +
    '<input class="mc-contact-row__value" type="' + (c.type === 'email' ? 'email' : 'tel') + '" ' +
      'data-contact-value-idx="' + i + '" value="' + esc(c.value) + '" ' +
      'placeholder="' + (c.type === 'email' ? 'Email address' : 'Phone number') + '">' +
    (removable
      ? '<button class="btn-icon btn-icon--danger" data-remove-contact-idx="' + i + '" title="Remove">×</button>'
      : '') +
  '</div>';
}

function renderPersonPanel(club) {
  return '<div class="mc-person-panel-overlay" id="mcPanelOverlay"></div>' +
    '<div class="mc-person-panel" id="mcPersonPanel">' +
      renderPersonPanelInner(club) +
    '</div>';
}

/* Re-render only the OPEN panel's inner content, not the overlay/panel
   wrapper — so adding or removing a row doesn't tear down and recreate the
   panel element, which replayed its slide-in animation (the "flash"). The
   draft is kept in sync live by the input/change handlers, so re-rendering
   from it loses nothing. Falls back to a full editor render if the panel
   isn't mounted. */
function refreshPersonPanel() {
  var panel = document.getElementById('mcPersonPanel');
  var club = window.CLUBS.filter(function(c){ return c.name === state.manage.editingClub; })[0];
  if (!panel || !club) { renderEditor(document.getElementById('mc-root')); return; }
  panel.innerHTML = renderPersonPanelInner(club);
}

/* The panel's inner HTML (header + body + footer). Split out from
   renderPersonPanel so refreshPersonPanel() can swap it in place. */
function renderPersonPanelInner(club) {
  var isNew = state.manage.editingPersonId === 'new';
  var person = isNew ? null : club.people.filter(function(p){ return p._id === state.manage.editingPersonId; })[0];
  if (!isNew && !person) return '';

  var draft = state.manage.personDraft;
  // Backstop: if a bare/legacy draft slipped through, rebuild a full one.
  if (!draft || !Array.isArray(draft.roleRows) || !Array.isArray(draft.contactRows)) {
    draft = seedPersonDraft(person);
    state.manage.personDraft = draft;
  }
  ensureContactFloor(draft);   // always at least one email row and one phone row

  var rolesHtml = draft.roleRows.map(function(r, i){ return renderRoleRow(club, draft, r, i); }).join('');
  // Contacts render in two columns by type; keep the flat-array index so the
  // value/remove handlers still line up. The sole row of a type isn't removable.
  var emailCount = draft.contactRows.filter(function(c){ return c.type === 'email'; }).length;
  var phoneCount = draft.contactRows.filter(function(c){ return c.type === 'phone'; }).length;
  var emailRows = draft.contactRows.map(function(c, i){ return c.type === 'email' ? renderContactRow(draft, c, i, emailCount > 1) : ''; }).join('');
  var phoneRows = draft.contactRows.map(function(c, i){ return c.type === 'phone' ? renderContactRow(draft, c, i, phoneCount > 1) : ''; }).join('');

  // Mailing lists — checked = effective membership (role-derived default, or
  // an explicit override). draftRoles drives the live default as roles change.
  var draftRoles = draft.roleRows.map(function(r){ return { section: r.section, title: r.title }; });
  if (!draft.listOverrides) draft.listOverrides = {};
  var mlistHtml = MAILING_LISTS.map(function(l) {
    var on = effectiveOnList(draftRoles, draft.listOverrides, l.key);
    var auto = listDerivedFromRoles(draftRoles, l.key);
    return '<label class="mc-mlist' + (on ? ' is-on' : '') + '">' +
      '<input type="checkbox" data-mlist="' + l.key + '"' + (on ? ' checked' : '') + '> ' +
      '<span>' + esc(l.label) + (l.required ? ' <span class="mc-mlist__req" title="League-required list">•</span>' : '') + '</span>' +
      (auto ? '<span class="mc-mlist__auto">auto</span>' : '') +
    '</label>';
  }).join('');

  return '<div class="mc-person-panel__hd">' +
        '<div>' +
          '<h3>' + (isNew ? 'Add new person' : 'Edit person') + '</h3>' +
          '<div class="mc-person-panel__hd-sub">' + esc(club.name) + '</div>' +
        '</div>' +
        '<button class="btn-icon" id="mcPanelClose">×</button>' +
      '</div>' +
      '<div class="mc-person-panel__body">' +
        '<div class="mc-person-panel__field">' +
          '<label>Full name</label>' +
          '<input type="text" id="mcPanelName" value="' + esc(draft.name) + '" placeholder="e.g. Jane Smith">' +
        '</div>' +

        '<div class="mc-person-panel__depts-section">' +
          '<h4>Roles</h4>' +
          '<div id="mcRoleRows">' + rolesHtml + '</div>' +
          '<button class="btn btn--ghost btn--sm" id="mcAddRoleRow" type="button">+ Add role</button>' +
          '<div class="mc-person-panel__help">The <b>primary</b> role represents this person on exports and business cards. <b>Dept head</b> is only available for sections that have a head. Liaison contacts (DLO/PLO/CSLO/SLO) are just roles in the <b>Liaison officers</b> section.</div>' +
        '</div>' +

        '<div class="mc-person-panel__depts-section">' +
          '<h4>Contacts</h4>' +
          '<div class="mc-contacts-cols">' +
            '<div class="mc-contacts-col">' +
              '<div class="mc-contacts-col__hd">Email</div>' +
              '<div id="mcEmailRows">' + emailRows + '</div>' +
              '<button class="btn btn--ghost btn--sm" id="mcAddEmailRow" type="button">+ Add email</button>' +
              '<label class="mc-person-panel__nonebox"><input type="checkbox" id="mcNoEmail"' + (draft.noEmail ? ' checked' : '') + '> No email on file</label>' +
            '</div>' +
            '<div class="mc-contacts-col">' +
              '<div class="mc-contacts-col__hd">Phone</div>' +
              '<div id="mcPhoneRows">' + phoneRows + '</div>' +
              '<button class="btn btn--ghost btn--sm" id="mcAddPhoneRow" type="button">+ Add phone</button>' +
              '<label class="mc-person-panel__nonebox"><input type="checkbox" id="mcNoPhone"' + (draft.noPhone ? ' checked' : '') + '> No phone on file</label>' +
            '</div>' +
          '</div>' +
        '</div>' +

        '<div class="mc-person-panel__depts-section">' +
          '<h4>Mailing lists</h4>' +
          '<div class="mc-mlists">' + mlistHtml + '</div>' +
          '<div class="mc-person-panel__help">Ticked lists are auto-set from this person\'s role(s); tick or untick to override — e.g. add a CEO to <b>Club secretaries</b>, or opt someone out.</div>' +
        '</div>' +
      '</div>' +
      '<div class="mc-person-panel__ftr">' +
        (isNew ? '<span></span>' : '<button class="btn btn--danger" id="mcPanelDelete">Delete person entirely</button>') +
        '<div style="display:flex;gap:8px;">' +
          '<button class="btn btn--ghost" id="mcPanelCancel">Cancel</button>' +
          '<button class="btn btn--navy" id="mcPanelSave">Save</button>' +
        '</div>' +
      '</div>';
}

/* ---------- Club details ----------
   Address + FA membership are sourced from clubs-meta and are read-only here
   — they're identity/handbook data and only NL admins/super admins update them.
   Phone, email, website are contact details on the club record itself and
   are editable. */
function renderClubDetails(club) {
  var isEditing = !!state.manage.editingDetails;
  var d = state.manage.editingDetails || {};

  function editableRow(label, key) {
    var val = club[key];
    if (isEditing) {
      return '<div class="mc-field-row">' +
        '<div class="mc-field-label">' + label + '</div>' +
        '<div><input class="mc-field-input" data-details-field="' + key + '" value="' + esc(d[key] != null ? d[key] : (val || '')) + '"></div>' +
      '</div>';
    }
    return '<div class="mc-field-row">' +
      '<div class="mc-field-label">' + label + '</div>' +
      '<div class="mc-field-value' + (val ? '' : ' mc-field-value--muted') + '">' + (val ? esc(val) : 'not set') + '</div>' +
    '</div>';
  }

  function readOnlyRow(label, val, hint) {
    return '<div class="mc-field-row">' +
      '<div class="mc-field-label">' + label + '</div>' +
      '<div class="mc-field-value' + (val ? '' : ' mc-field-value--muted') + '">' +
        (val ? esc(val) : 'not set') +
        (hint ? ' <span style="opacity:.55;font-size:.85em;">— ' + esc(hint) + '</span>' : '') +
      '</div>' +
    '</div>';
  }

  var actions = isEditing
    ? '<div class="mc-dept-footer" style="border-top:none;padding-top:0;margin-top:10px;">' +
        '<button class="btn btn--ghost" id="mcDetailsCancel">Cancel</button>' +
        '<button class="btn btn--navy" id="mcDetailsSave">Save</button>' +
      '</div>'
    : '<div style="margin-top:14px;text-align:right;"><button class="btn btn--ghost btn--sm" id="mcDetailsEdit">Edit contact details</button></div>';

  return '<div class="mc-details">' +
    readOnlyRow('Address', addressOf(club.name), 'League-managed') +
    editableRow('Phone', 'phone') +
    editableRow('Email', 'email') +
    editableRow('Website', 'website') +
    readOnlyRow('FA membership', faOf(club.name), 'League-managed') +
    '<div class="mc-details__note">Address and FA membership are maintained by the League. Spotted an error? ' +
      '<a href="' + correctionMailto(club.name) + '">Request a correction</a>.</div>' +
    actions +

}

/* ---------- Actions: People surface ---------- */

function openPersonPanel(personId) {
  state.manage.editingPersonId = personId;
  if (personId === 'new') {
    state.manage.personDraft = seedPersonDraft(null);
  } else {
    var club = window.CLUBS.filter(function(c){ return c.name === state.manage.editingClub; })[0];
    var p = club ? club.people.filter(function(x){ return x._id === personId; })[0] : null;
    state.manage.personDraft = seedPersonDraft(p || null);
  }
  renderEditor(document.getElementById('mc-root'));
}

function closePersonPanel() {
  state.manage.editingPersonId = null;
  state.manage.personDraft = null;
  renderEditor(document.getElementById('mc-root'));
}

function normaliseName(s) {
  return (s || '').trim().toLowerCase().replace(/\s+/g, ' ');
}

/* Find other people (any club) who already hold one of this draft's email or
   phone values. Emails matched case-insensitively; phones by normalised digits.
   Used for a soft "are you sure" warning — shared inboxes are legitimate. */
function findContactDuplicates(draft) {
  var editingId = state.manage.editingPersonId;
  var mine = (draft.contactRows || [])
    .filter(function(c){ return (c.value || '').trim(); })
    .map(function(c){
      return { type: c.type, raw: c.value.trim(),
               norm: c.type === 'phone' ? normalisePhone(c.value) : c.value.trim().toLowerCase() };
    });
  if (!mine.length) return [];
  var hits = [];
  (window.CLUBS || []).forEach(function(club) {
    (club.people || []).forEach(function(p) {
      if (p._id === editingId) return;
      (p.contacts || []).forEach(function(pc) {
        if (!pc.value) return;
        var pn = pc.type === 'phone' ? normalisePhone(pc.value) : String(pc.value).trim().toLowerCase();
        mine.forEach(function(m) {
          if (m.type === pc.type && m.norm && m.norm === pn) {
            hits.push({ type: m.type, value: m.raw, person: p.name || '(unnamed)', club: club.name });
          }
        });
      });
    });
  });
  return hits;
}

function savePersonPanel() {
  var club = window.CLUBS.filter(function(c){ return c.name === state.manage.editingClub; })[0];
  if (!club) return;
  var draft = state.manage.personDraft || {};
  var name = (draft.name || '').trim();
  if (!name) {
    alert('Please enter a name.');
    return;
  }

  // Contact details are encouraged: each type must either have a value or be
  // explicitly marked "none on file" — no silent blanks.
  var draftContacts = draft.contactRows || [];
  var hasEmail = draftContacts.some(function(c){ return c.type === 'email' && (c.value || '').trim(); });
  var hasPhone = draftContacts.some(function(c){ return c.type === 'phone' && (c.value || '').trim(); });
  if (!hasEmail && !draft.noEmail) {
    alert('Add an email address, or tick "No email on file".');
    return;
  }
  if (!hasPhone && !draft.noPhone) {
    alert('Add a phone number, or tick "No phone on file".');
    return;
  }

  // Soft duplicate-contact guard — warn (with who), but allow (shared inboxes
  // are legitimate). _dupConfirmed lets the "Save anyway" path through.
  if (!draft._dupConfirmed) {
    var dups = findContactDuplicates(draft);
    if (dups.length) {
      var lines = dups.map(function(h) {
        return (h.type === 'phone' ? 'Phone ' : 'Email ') + esc(h.value) +
          ' is already on <b>' + esc(h.person) + '</b> (' + esc(h.club) + ')';
      });
      state.manage.confirmDialog = {
        title: 'Possible duplicate contact',
        message: lines.join('<br>') + '<br><br>Save anyway?',
        confirmText: 'Save anyway',
        cancelText: 'Go back',
        variant: 'primary',
        onConfirm: function() { state.manage.confirmDialog = null; draft._dupConfirmed = true; savePersonPanel(); },
        onCancel: function() { state.manage.confirmDialog = null; renderEditor(document.getElementById('mc-root')); }
      };
      renderEditor(document.getElementById('mc-root'));
      return;
    }
  }

  var isNew = state.manage.editingPersonId === 'new';
  var normNew = normaliseName(name);

  // Look for collision (different person, same normalised name) at this club
  var collision = club.people.filter(function(p) {
    if (!isNew && p._id === state.manage.editingPersonId) return false;
    return normaliseName(p.name) === normNew;
  })[0];

  if (collision) {
    // Prompt for merge-or-keep-separate
    state.manage.confirmDialog = {
      title: 'Duplicate name detected',
      message: 'A person named <b>' + esc(collision.name) + '</b> already exists at this club. Do you want to <b>merge</b> the two records, or keep them as separate people?',
      sub: isNew
        ? 'Merging will discard this new record and keep the existing one.'
        : 'Merging will consolidate all department assignments onto one record and delete the other.',
      confirmText: 'Keep separate',
      cancelText: 'Merge with existing',
      variant: 'primary',
      onConfirm: function() {
        // User chose keep separate — proceed with save as-is
        state.manage.confirmDialog = null;
        commitPersonPanelSave(club, isNew, draft);
      },
      onCancel: function() {
        // User chose merge
        state.manage.confirmDialog = null;
        mergeIntoPerson(club, collision, isNew, draft);
      }
    };
    renderEditor(document.getElementById('mc-root'));
    return;
  }

  commitPersonPanelSave(club, isNew, draft);
}

/* Build the persisted roles[] from the modal's role rows. Drops empty
   rows (no title), recomputes function + liaison roleKey, sets exactly one
   primary, and carries section flags through. */
function buildRolesFromDraft(draft) {
  var rows = (draft.roleRows || []).filter(function(r){ return (r.title || '').trim(); });
  var primaryIdxAmongKept = -1;
  // Map the draft primaryRoleIdx (index into ALL rows) onto the kept rows.
  (draft.roleRows || []).forEach(function(r, allIdx) {
    if (!(r.title || '').trim()) return;
    var keptIdx = rows.indexOf(r);
    if (allIdx === draft.primaryRoleIdx) primaryIdxAmongKept = keptIdx;
  });
  return rows.map(function(r, i) {
    var title = (r.title || '').trim();
    var section = r.section || SECTION_ORDER[0];
    var role = {
      title: title,
      section: section,
      main: (i === primaryIdxAmongKept) || (primaryIdxAmongKept === -1 && i === 0),
      'function': functionForTitle(title, section)
    };
    // Keep only truthy flags.
    var flags = {};
    Object.keys(r.flags || {}).forEach(function(k){ if (r.flags[k]) flags[k] = true; });
    if (Object.keys(flags).length) role.flags = flags;
    var rk = roleKeyForRole(section, title);
    if (rk) role.roleKey = rk;
    return role;
  });
}

/* Build contacts[] from the modal's contact rows; returns { contacts, email, phone }
   where email/phone are the preferred (or first) mirror of each type. */
function buildContactsFromDraft(draft) {
  var contacts = (draft.contactRows || [])
    .filter(function(c){ return (c.value || '').trim(); })
    .map(function(c) {
      var type = c.type === 'phone' ? 'phone' : 'email';
      // Phones are stored normalised (bare 11 digits / verbatim +overseas).
      var value = type === 'phone' ? normalisePhone(c.value) : (c.value || '').trim();
      return { type: type, value: value, label: (c.label || '').trim(), preferred: !!c.preferred };
    });
  // Ensure exactly one preferred per type (default to the first of that type).
  ['email', 'phone'].forEach(function(type) {
    var cs = contacts.filter(function(c){ return c.type === type; });
    if (!cs.length) return;
    if (!cs.some(function(c){ return c.preferred; })) cs[0].preferred = true;
    var seen = false;
    cs.forEach(function(c){ if (c.preferred) { if (seen) c.preferred = false; else seen = true; } });
  });
  var email = (contacts.filter(function(c){ return c.type === 'email' && c.preferred; })[0] || {}).value || null;
  var phone = (contacts.filter(function(c){ return c.type === 'phone' && c.preferred; })[0] || {}).value || null;
  return { contacts: contacts, email: email, phone: phone };
}

function commitPersonPanelSave(club, isNew, draft) {
  var name = (draft.name || '').trim();
  var note = (draft.note || '').trim() || null;
  var roles = buildRolesFromDraft(draft);
  var cc = buildContactsFromDraft(draft);

  var person;
  var noEmail = !cc.email && !!draft.noEmail;
  var noPhone = !cc.phone && !!draft.noPhone;
  // Keep only mailing-list overrides that actually differ from the role-derived
  // default for the FINAL roles — so memberships stay live where possible.
  var listOverrides = {};
  Object.keys(draft.listOverrides || {}).forEach(function(key) {
    if (draft.listOverrides[key] !== listDerivedFromRoles(roles, key)) listOverrides[key] = draft.listOverrides[key];
  });
  if (isNew) {
    person = {
      _id: 'p' + (_nextPersonId++),
      name: name,
      email: cc.email,
      phone: cc.phone,
      note: note,
      contacts: cc.contacts,
      roles: roles,
      noEmail: noEmail,
      noPhone: noPhone,
      listOverrides: listOverrides,
    };
    club.people.push(person);
  } else {
    person = club.people.filter(function(p){ return p._id === state.manage.editingPersonId; })[0];
    if (person) {
      person.name = name;
      person.note = note;
      person.contacts = cc.contacts;
      person.email = cc.email;
      person.phone = cc.phone;
      person.roles = roles;
      person.noEmail = noEmail;
      person.noPhone = noPhone;
      person.listOverrides = listOverrides;
    }
  }
  persistClub(club, isNew ? 'person_add' : 'person_edit',
    (isNew ? 'Added ' : 'Updated ') + name + ' at ' + club.name);
  state.manage.editingPersonId = null;
  state.manage.personDraft = null;
  renderEditor(document.getElementById('mc-root'));
}

function mergeIntoPerson(club, existingPerson, isNew, draft) {
  // Merge: keep existingPerson. If not isNew, also consolidate the other person's
  // roles onto existingPerson and delete the other.
  if (isNew) {
    // No new record was created; fold the draft's roles + contacts into the
    // existing person (skip roles it already has; add only new contacts).
    ensureContacts(existingPerson);
    buildRolesFromDraft(draft).forEach(function(r) {
      var already = existingPerson.roles.some(function(er) {
        return er.section === r.section && er.title === r.title;
      });
      if (!already) { r.main = false; existingPerson.roles.push(r); }
    });
    buildContactsFromDraft(draft).contacts.forEach(function(c) {
      var already = existingPerson.contacts.some(function(ec) {
        return ec.type === c.type && ec.value === c.value;
      });
      if (!already) { c.preferred = false; existingPerson.contacts.push(c); }
    });
    syncMirrorsFromContacts(existingPerson);
    ensurePrimaryRole(existingPerson);
  } else {
    var duplicatePerson = club.people.filter(function(p){ return p._id === state.manage.editingPersonId; })[0];
    if (duplicatePerson && duplicatePerson !== existingPerson) {
      // Move roles across (skip any that would duplicate an existing role)
      duplicatePerson.roles.forEach(function(r) {
        var already = existingPerson.roles.some(function(er) {
          return er.section === r.section && er.title === r.title;
        });
        if (!already) existingPerson.roles.push(r);
      });
      // Fill in missing contact fields from dup if existing is blank
      if (!existingPerson.email && duplicatePerson.email) existingPerson.email = duplicatePerson.email;
      if (!existingPerson.phone && duplicatePerson.phone) existingPerson.phone = duplicatePerson.phone;
      // Remove duplicate
      club.people = club.people.filter(function(p){ return p !== duplicatePerson; });
      // Make sure the surviving person still has exactly one primary
      ensurePrimaryRole(existingPerson);
    }
  }
  persistClub(club, 'person_merge', 'Merged duplicate record into ' + existingPerson.name + ' at ' + club.name);
  state.manage.editingPersonId = null;
  state.manage.personDraft = null;
  renderEditor(document.getElementById('mc-root'));
}

function deletePersonWithConfirm() {
  var club = window.CLUBS.filter(function(c){ return c.name === state.manage.editingClub; })[0];
  if (!club) return;
  var person = club.people.filter(function(p){ return p._id === state.manage.editingPersonId; })[0];
  if (!person) return;

  var roleDesc = person.roles.length === 0
    ? 'They have no department assignments.'
    : 'This will also remove their ' + person.roles.length + ' department ' +
      (person.roles.length === 1 ? 'assignment' : 'assignments') + ': ' +
      person.roles.map(function(r){ return r.title + ' (' + r.section + ')'; }).join(', ') + '.';

  state.manage.confirmDialog = {
    title: 'Delete person?',
    message: 'Delete <b>' + esc(person.name) + '</b> from the directory entirely.',
    sub: roleDesc + ' This cannot be undone.',
    confirmText: 'Delete person',
    variant: 'danger',
    onConfirm: function() {
      club.people = club.people.filter(function(p){ return p._id !== person._id; });
      persistClub(club, 'person_delete', 'Deleted ' + person.name + ' from ' + club.name);
      state.manage.editingPersonId = null;
      state.manage.personDraft = null;
      state.manage.confirmDialog = null;
      renderEditor(document.getElementById('mc-root'));
    }
  };
  renderEditor(document.getElementById('mc-root'));
}

/* Ensure exactly one role has main=true (primary) per person.
   If none, promote the first role. If multiple, keep the first flagged. */
function ensurePrimaryRole(person) {
  if (!person.roles || !person.roles.length) return;
  var mainIdx = person.roles.findIndex(function(r){ return r.main; });
  if (mainIdx === -1) {
    person.roles[0].main = true;
    for (var i = 1; i < person.roles.length; i++) person.roles[i].main = false;
  } else {
    person.roles.forEach(function(r, i){ r.main = (i === mainIdx); });
  }
}

/* ================= BOOT + UI WIRING =================
   wireUI() binds all event listeners and renders the first scene. It is
   called exactly once, from TOOL.boot, after the session persona is set
   and live clubs-meta has been fetched. (Replaces the old DOMContentLoaded
   handler + demo persona bar.) */
function wireUI() {
  // --- One-off RTDB seed import button (superadmin banner, delegated
  //     because renderListing re-creates it) ---
  document.getElementById('listing-root').addEventListener('click', function(e) {
    if (e.target && e.target.id === 'cdSeedBtn') seedRTDBFromInline();
  });

  // --- Completion dashboard: click a league row to open that club ---
  document.getElementById('dashboard-root').addEventListener('click', function(e) {
    var row = e.target.closest('[data-club]');
    if (!row) return;
    state.viewing = row.getAttribute('data-club');
    state.viewMode = 'directory';
    showScene();
  });

  // --- Data cleanup controls (delegated — scene re-renders) ---
  document.getElementById('cleanup-root').addEventListener('click', function(e) {
    var t = e.target;
    if (t.id === 'clBackup') { cleanupDownloadBackup(); return; }
    if (t.id === 'clAnalyse') { CLEANUP.plan = analyseCleanup(); renderCleanupScene(); return; }
    if (t.id === 'clRun') {
      if (confirm('Run auto cleanup? ' + CLEANUP.plan.autoMerges.length + ' merges + ' +
        CLEANUP.plan.nameless.length + ' vacant conversions, and every club record is re-written in the v2 shape. Backup downloaded?')) {
        runAutoCleanup();
      }
      return;
    }
    if (t.hasAttribute('data-cl-merge')) { applyReviewMerge(parseInt(t.getAttribute('data-cl-merge'), 10), true); return; }
    if (t.hasAttribute('data-cl-keep'))  { applyReviewMerge(parseInt(t.getAttribute('data-cl-keep'), 10), false); return; }
  });

  // --- View toggle (Directory / List builder / Manage / Activity) ---
  var clubGroup = document.getElementById('clubStyleGroup');
  clubGroup.addEventListener('click', function(e) {
    var b = e.target.closest('[data-view-mode]');
    if (!b) return;
    var viewMode = b.getAttribute('data-view-mode') || 'directory';
    var cap = b.getAttribute('data-requires');
    if (cap && !personaCan(cap)) return; // safety net — shouldn't be clickable anyway
    state.viewMode = viewMode;
    state.viewing = null;
    // Reset manage sub-state when entering
    if (viewMode === 'manage') {
      state.manage.editingClub = null;
    }
    clubGroup.querySelectorAll('button').forEach(function(x) {
      x.setAttribute('aria-pressed', x === b ? 'true' : 'false');
    });
    showScene();
  });

  // --- Search box (only affects directory listing) ---
  var search = document.getElementById('searchBox');
  var searchTimer;
  search.addEventListener('input', function() {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function() {
      state.searchQuery = search.value;
      if (state.viewMode === 'directory' && !state.viewing) renderListing();
    }, 150);
  });

  // --- Back link ---
  document.getElementById('backLink').addEventListener('click', function(e) {
    e.preventDefault();
    state.viewing = null;
    showScene();
  });

  // --- "Manage my club" button on club page ---
  document.getElementById('manageMyClubBtn').addEventListener('click', function(e) {
    e.preventDefault();
    state.manage.editingClub = state.viewing;
    state.viewMode = 'manage';
    state.viewing = null;
    // deselect the dense/role-first buttons so no view toggle shows pressed
    clubGroup.querySelectorAll('button').forEach(function(x) { x.setAttribute('aria-pressed', 'false'); });
    showScene();
  });

  // --- List Builder interactions ---
  var builderScene = document.getElementById('scene-builder');
  builderScene.addEventListener('click', function(e) {
    var t = e.target;
    var modeBtn = t.closest('[data-lb-mode]');
    if (modeBtn) {
      state.lb.mode = modeBtn.getAttribute('data-lb-mode');
      document.querySelectorAll('#lbModeGroup [data-lb-mode]').forEach(function(b){
        b.setAttribute('aria-pressed', b === modeBtn ? 'true' : 'false');
      });
      state.lb.omittedKeys = {};
      renderBuilderWarnings();
      renderBuilderResults();
      return;
    }
    var contactBtn = t.closest('[data-lb-contact]');
    if (contactBtn) {
      state.lb.contactMode = contactBtn.getAttribute('data-lb-contact');
      document.querySelectorAll('#lbContactGroup [data-lb-contact]').forEach(function(b){
        b.setAttribute('aria-pressed', b === contactBtn ? 'true' : 'false');
      });
      renderBuilderResults();
      return;
    }
    if (t.closest('[data-division-toggle]')) {
      var div = t.closest('[data-division-toggle]').getAttribute('data-division-toggle');
      state.lb.collapsedDivisions[div] = !state.lb.collapsedDivisions[div];
      renderBuilderDivisions();
      return;
    }
    var omitBtn = t.closest('[data-omit-key]');
    if (omitBtn) {
      var key = omitBtn.getAttribute('data-omit-key');
      if (state.lb.omittedKeys[key]) delete state.lb.omittedKeys[key];
      else state.lb.omittedKeys[key] = true;
      renderBuilderResults();
      return;
    }
    var copyBtn = t.closest('.lb-copybtn');
    if (copyBtn) {
      var fmt = copyBtn.getAttribute('data-copy-fmt');
      var text = formatForCopy(fmt);
      if (text) copyToClipboard(text, copyBtn);
      return;
    }
    if (t.id === 'lbDeptsAll') {
      if (state.lb.buildBy === 'list') MAILING_LISTS.forEach(function(l){ state.lb.selectedLists[l.key] = true; });
      else SECTION_ORDER.forEach(function(s){ state.lb.selectedDepts[s] = true; });
      renderBuilderDepts(); renderBuilderWarnings(); renderBuilderResults(); return;
    }
    if (t.id === 'lbDeptsNone') {
      if (state.lb.buildBy === 'list') { state.lb.selectedLists = {}; }
      else { state.lb.selectedDepts = {}; state.lb.checklistRoleFilter = {}; state.lb.flagFilter = {}; }
      renderBuilderDepts(); renderBuilderWarnings(); renderBuilderResults(); return;
    }
    if (t.id === 'lbClubsAll') {
      window.CLUBS.forEach(function(c){ state.lb.selectedClubs[c.name] = true; });
      renderBuilderDivisions(); renderBuilderWarnings(); renderBuilderResults(); return;
    }
    if (t.id === 'lbClubsNone') {
      state.lb.selectedClubs = {};
      renderBuilderDivisions(); renderBuilderWarnings(); renderBuilderResults(); return;
    }
  });
  builderScene.addEventListener('change', function(e) {
    var t = e.target;
    if (t.hasAttribute('data-lb-list')) {
      var lk = t.getAttribute('data-lb-list');
      if (t.checked) state.lb.selectedLists[lk] = true;
      else delete state.lb.selectedLists[lk];
      renderBuilderWarnings(); renderBuilderResults();
      return;
    }
    if (t.hasAttribute('data-dept')) {
      var dept = t.getAttribute('data-dept');
      if (t.checked) state.lb.selectedDepts[dept] = true;
      else {
        delete state.lb.selectedDepts[dept];
        // Also clear any sub-filter so re-ticking later starts fresh (defaults)
        delete state.lb.checklistRoleFilter[dept];
        delete state.lb.flagFilter[dept];
      }
      renderBuilderDepts();   // re-render so sub-filters appear/disappear
      renderBuilderWarnings(); renderBuilderResults();
      return;
    }
    if (t.hasAttribute('data-checklist-section')) {
      var section = t.getAttribute('data-checklist-section');
      var roleKey = t.getAttribute('data-checklist-role');
      // First interaction seeds the filter with the current defaults, then applies the toggle
      var meta = SECTIONS_BY_KEY[section];
      if (!meta) return;
      if (!state.lb.checklistRoleFilter[section]) {
        // Seed from defaults: required + optional on, __other off
        var seed = {};
        (meta.requiredRoles||[]).forEach(function(k){ seed[k] = true; });
        (meta.optionalRoles||[]).forEach(function(k){ seed[k] = true; });
        seed.__other = false;
        state.lb.checklistRoleFilter[section] = seed;
      }
      state.lb.checklistRoleFilter[section][roleKey] = t.checked;
      renderBuilderWarnings(); renderBuilderResults();
      return;
    }
    if (t.hasAttribute('data-flag-section')) {
      var fsec = t.getAttribute('data-flag-section');
      var fkey = t.getAttribute('data-flag-key');
      if (!state.lb.flagFilter[fsec]) state.lb.flagFilter[fsec] = {};
      if (t.checked) state.lb.flagFilter[fsec][fkey] = true;
      else delete state.lb.flagFilter[fsec][fkey];
      renderBuilderResults();
      return;
    }
    if (t.classList.contains('lb-division-check')) {
      var divName = t.getAttribute('data-division');
      var divClubs = window.CLUBS.filter(function(c){ return divisionOf(c.name) === divName; });
      if (t.checked) divClubs.forEach(function(c){ state.lb.selectedClubs[c.name] = true; });
      else           divClubs.forEach(function(c){ delete state.lb.selectedClubs[c.name]; });
      renderBuilderDivisions(); renderBuilderWarnings(); renderBuilderResults();
      return;
    }
    if (t.hasAttribute('data-club')) {
      var clubName = t.getAttribute('data-club');
      if (t.checked) state.lb.selectedClubs[clubName] = true;
      else           delete state.lb.selectedClubs[clubName];
      renderBuilderDivisions(); renderBuilderWarnings(); renderBuilderResults();
      return;
    }
  });
  builderScene.addEventListener('input', function(e) {
    var t = e.target;
    if (t.hasAttribute('data-division-search')) {
      var div = t.getAttribute('data-division-search');
      state.lb.clubSearch[div] = t.value;
      var q = t.value.toLowerCase();
      var group = builderScene.querySelector('.lb-division-group[data-division="' + div + '"]');
      if (!group) return;
      group.querySelectorAll('.lb-club-row').forEach(function(row) {
        var label = row.querySelector('label');
        var name = label ? label.textContent.toLowerCase() : '';
