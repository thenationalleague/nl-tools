/* ---------- Actions: People surface ---------- */

function openPersonPanel(personId) {
  state.manage.editingPersonId = personId;
  if (personId === 'new') {
    state.manage.personDraft = seedPersonDraft(null);
  } else {
    var club = window.CLUBS.filter(function(c){ return c.name === state.manage.editingClub; })[0];
    var p = club ? club.people.filter(function(x){ return x._id === personId; })[0] : null;
    state.manage.personDraft = seedPersonDraft(p || null);
  }
  renderEditor(document.getElementById('mc-root'));
}

function closePersonPanel() {
  state.manage.editingPersonId = null;
  state.manage.personDraft = null;
  renderEditor(document.getElementById('mc-root'));
}

function normaliseName(s) {
  return (s || '').trim().toLowerCase().replace(/\s+/g, ' ');
}

function savePersonPanel() {
  var club = window.CLUBS.filter(function(c){ return c.name === state.manage.editingClub; })[0];
  if (!club) return;
  var draft = state.manage.personDraft || {};
  var name = (draft.name || '').trim();
  if (!name) {
    alert('Please enter a name.');
    return;
  }

  // Contact details are encouraged: each type must either have a value or be
  // explicitly marked "none on file" — no silent blanks.
  var draftContacts = draft.contactRows || [];
  var hasEmail = draftContacts.some(function(c){ return c.type === 'email' && (c.value || '').trim(); });
  var hasPhone = draftContacts.some(function(c){ return c.type === 'phone' && (c.value || '').trim(); });
  if (!hasEmail && !draft.noEmail) {
    alert('Add an email address, or tick "No email on file".');
    return;
  }
  if (!hasPhone && !draft.noPhone) {
    alert('Add a phone number, or tick "No phone on file".');
    return;
  }

  var isNew = state.manage.editingPersonId === 'new';
  var normNew = normaliseName(name);

  // Look for collision (different person, same normalised name) at this club
  var collision = club.people.filter(function(p) {
    if (!isNew && p._id === state.manage.editingPersonId) return false;
    return normaliseName(p.name) === normNew;
  })[0];

  if (collision) {
    // Prompt for merge-or-keep-separate
    state.manage.confirmDialog = {
      title: 'Duplicate name detected',
      message: 'A person named <b>' + esc(collision.name) + '</b> already exists at this club. Do you want to <b>merge</b> the two records, or keep them as separate people?',
      sub: isNew
        ? 'Merging will discard this new record and keep the existing one.'
        : 'Merging will consolidate all department assignments onto one record and delete the other.',
      confirmText: 'Keep separate',
      cancelText: 'Merge with existing',
      variant: 'primary',
      onConfirm: function() {
        // User chose keep separate — proceed with save as-is
        state.manage.confirmDialog = null;
        commitPersonPanelSave(club, isNew, draft);
      },
      onCancel: function() {
        // User chose merge
        state.manage.confirmDialog = null;
        mergeIntoPerson(club, collision, isNew, draft);
      }
    };
    renderEditor(document.getElementById('mc-root'));
    return;
  }

  commitPersonPanelSave(club, isNew, draft);
}

/* Build the persisted roles[] from the modal's role rows. Drops empty
   rows (no title), recomputes function + liaison roleKey, sets exactly one
   primary, and carries section flags through. */
function buildRolesFromDraft(draft) {
  var rows = (draft.roleRows || []).filter(function(r){ return (r.title || '').trim(); });
  var primaryIdxAmongKept = -1;
  // Map the draft primaryRoleIdx (index into ALL rows) onto the kept rows.
  (draft.roleRows || []).forEach(function(r, allIdx) {
    if (!(r.title || '').trim()) return;
    var keptIdx = rows.indexOf(r);
    if (allIdx === draft.primaryRoleIdx) primaryIdxAmongKept = keptIdx;
  });
  return rows.map(function(r, i) {
    var title = (r.title || '').trim();
    var section = r.section || SECTION_ORDER[0];
    var isHeadSection = HEAD_SECTIONS.indexOf(section) !== -1;
    var role = {
      title: title,
      section: section,
      main: (i === primaryIdxAmongKept) || (primaryIdxAmongKept === -1 && i === 0),
      deptHead: isHeadSection ? !!r.deptHead : false,
      'function': functionForTitle(title, section)
    };
    // Keep only truthy flags.
    var flags = {};
    Object.keys(r.flags || {}).forEach(function(k){ if (r.flags[k]) flags[k] = true; });
    if (Object.keys(flags).length) role.flags = flags;
    var rk = roleKeyForRole(section, title);
    if (rk) role.roleKey = rk;
    return role;
  });
}

/* Build contacts[] from the modal's contact rows; returns { contacts, email, phone }
   where email/phone are the preferred (or first) mirror of each type. */
function buildContactsFromDraft(draft) {
  var contacts = (draft.contactRows || [])
    .filter(function(c){ return (c.value || '').trim(); })
    .map(function(c) {
      var o = { type: c.type === 'phone' ? 'phone' : 'email', value: (c.value || '').trim(),
                label: (c.label || '').trim(), preferred: !!c.preferred };
      return o;
    });
  // Ensure exactly one preferred per type (default to the first of that type).
  ['email', 'phone'].forEach(function(type) {
    var cs = contacts.filter(function(c){ return c.type === type; });
    if (!cs.length) return;
    if (!cs.some(function(c){ return c.preferred; })) cs[0].preferred = true;
    var seen = false;
    cs.forEach(function(c){ if (c.preferred) { if (seen) c.preferred = false; else seen = true; } });
  });
  var email = (contacts.filter(function(c){ return c.type === 'email' && c.preferred; })[0] || {}).value || null;
  var phone = (contacts.filter(function(c){ return c.type === 'phone' && c.preferred; })[0] || {}).value || null;
  return { contacts: contacts, email: email, phone: phone };
}

/* When a role row marks someone as dept head, strip deptHead from whoever
   else currently holds that section's head (one head per section). */
function clearPreviousHeads(club, person, roles) {
  roles.forEach(function(r) {
    if (!r.deptHead) return;
    club.people.forEach(function(p) {
      if (p === person) return;
      (p.roles || []).forEach(function(pr) {
        if (pr.section === r.section && pr.deptHead) pr.deptHead = false;
      });
    });
  });
}

function commitPersonPanelSave(club, isNew, draft) {
  var name = (draft.name || '').trim();
  var note = (draft.note || '').trim() || null;
  var roles = buildRolesFromDraft(draft);
  var cc = buildContactsFromDraft(draft);

  var person;
  var visibility = (['public', 'staff', 'hidden'].indexOf(draft.visibility) !== -1) ? draft.visibility : 'staff';
  var noEmail = !cc.email && !!draft.noEmail;
  var noPhone = !cc.phone && !!draft.noPhone;
  if (isNew) {
    person = {
      _id: 'p' + (_nextPersonId++),
      name: name,
      email: cc.email,
      phone: cc.phone,
      note: note,
      contacts: cc.contacts,
      roles: roles,
      visibility: visibility,
      noEmail: noEmail,
      noPhone: noPhone,
    };
    club.people.push(person);
  } else {
    person = club.people.filter(function(p){ return p._id === state.manage.editingPersonId; })[0];
    if (person) {
      person.name = name;
      person.note = note;
      person.contacts = cc.contacts;
      person.email = cc.email;
      person.phone = cc.phone;
      person.roles = roles;
      person.visibility = visibility;
      person.noEmail = noEmail;
      person.noPhone = noPhone;
    }
  }
  if (person) clearPreviousHeads(club, person, roles);

  persistClub(club, isNew ? 'person_add' : 'person_edit',
    (isNew ? 'Added ' : 'Updated ') + name + ' at ' + club.name);
  state.manage.editingPersonId = null;
  state.manage.personDraft = null;
  renderEditor(document.getElementById('mc-root'));
}

function mergeIntoPerson(club, existingPerson, isNew, draft) {
  // Merge: keep existingPerson. If not isNew, also consolidate the other person's
  // roles onto existingPerson and delete the other.
  if (isNew) {
    // No new record was created; fold the draft's roles + contacts into the
    // existing person (skip roles it already has; add only new contacts).
    ensureContacts(existingPerson);
    buildRolesFromDraft(draft).forEach(function(r) {
      var already = existingPerson.roles.some(function(er) {
        return er.section === r.section && er.title === r.title;
      });
      if (!already) { r.main = false; existingPerson.roles.push(r); }
    });
    buildContactsFromDraft(draft).contacts.forEach(function(c) {
      var already = existingPerson.contacts.some(function(ec) {
        return ec.type === c.type && ec.value === c.value;
      });
      if (!already) { c.preferred = false; existingPerson.contacts.push(c); }
    });
    syncMirrorsFromContacts(existingPerson);
    ensurePrimaryRole(existingPerson);
  } else {
    var duplicatePerson = club.people.filter(function(p){ return p._id === state.manage.editingPersonId; })[0];
    if (duplicatePerson && duplicatePerson !== existingPerson) {
      // Move roles across (skip any that would duplicate an existing role)
      duplicatePerson.roles.forEach(function(r) {
        var already = existingPerson.roles.some(function(er) {
          return er.section === r.section && er.title === r.title;
        });
        if (!already) existingPerson.roles.push(r);
      });
      // Fill in missing contact fields from dup if existing is blank
      if (!existingPerson.email && duplicatePerson.email) existingPerson.email = duplicatePerson.email;
      if (!existingPerson.phone && duplicatePerson.phone) existingPerson.phone = duplicatePerson.phone;
      // Remove duplicate
      club.people = club.people.filter(function(p){ return p !== duplicatePerson; });
      // Make sure the surviving person still has exactly one primary
      ensurePrimaryRole(existingPerson);
    }
  }
  persistClub(club, 'person_merge', 'Merged duplicate record into ' + existingPerson.name + ' at ' + club.name);
  state.manage.editingPersonId = null;
  state.manage.personDraft = null;
  renderEditor(document.getElementById('mc-root'));
}

function deletePersonWithConfirm() {
  var club = window.CLUBS.filter(function(c){ return c.name === state.manage.editingClub; })[0];
  if (!club) return;
  var person = club.people.filter(function(p){ return p._id === state.manage.editingPersonId; })[0];
  if (!person) return;

  var roleDesc = person.roles.length === 0
    ? 'They have no department assignments.'
    : 'This will also remove their ' + person.roles.length + ' department ' +
      (person.roles.length === 1 ? 'assignment' : 'assignments') + ': ' +
      person.roles.map(function(r){ return r.title + ' (' + r.section + ')'; }).join(', ') + '.';

  state.manage.confirmDialog = {
    title: 'Delete person?',
    message: 'Delete <b>' + esc(person.name) + '</b> from the directory entirely.',
    sub: roleDesc + ' This cannot be undone.',
    confirmText: 'Delete person',
    variant: 'danger',
    onConfirm: function() {
      club.people = club.people.filter(function(p){ return p._id !== person._id; });
      persistClub(club, 'person_delete', 'Deleted ' + person.name + ' from ' + club.name);
      state.manage.editingPersonId = null;
      state.manage.personDraft = null;
      state.manage.confirmDialog = null;
      renderEditor(document.getElementById('mc-root'));
    }
  };
  renderEditor(document.getElementById('mc-root'));
}

/* Save checklist edits for a section.
   Walks the drafts: slot-draft-keys are 'slot|ROLEKEY' and point to a personId
   (possibly blank for unassigned); extra-draft-keys are 'extra|personId|title'
   for free-text extras. */
function saveChecklistEdit(section) {
  var club = window.CLUBS.filter(function(c){ return c.name === state.manage.editingClub; })[0];
  if (!club) return;
  var drafts = state.manage.checklistDrafts || {};

  Object.keys(drafts).forEach(function(key) {
    var d = drafts[key];
    if (d.isExtra) {
      // Extra (free-text) role — may have been moved to a different person or retitled
      var original = club.people.filter(function(p){ return p._id === d._originalPersonId; })[0];
      if (!original) return;
      var roleIdx = original.roles.findIndex(function(r){
        return r.section === section && !r.roleKey && r.title === d._originalTitle;
      });
      if (roleIdx === -1) return;
      if (d.personId && d.personId !== d._originalPersonId) {
        var target = club.people.filter(function(p){ return p._id === d.personId; })[0];
        if (target) {
          target.roles.push({
            title: (d.roleTitle||'').trim() || d._originalTitle,
            section: section,
            deptHead: false,
          });
        }
        original.roles.splice(roleIdx, 1);
      } else {
        original.roles[roleIdx].title = (d.roleTitle||'').trim() || original.roles[roleIdx].title;
      }
      return;
    }

    // Slot draft — roleKey: rk, personId: string
    var rk = d.roleKey;
    var meta = SECTIONS_BY_KEY[section];
    var label = (meta && meta.roleLabels && meta.roleLabels[rk]) || rk;

    // Find existing assignment for this slot (if any)
    var existing = null;
    var existingOwner = null;
    club.people.some(function(p) {
      return p.roles.some(function(r, i) {
        if (r.section === section && r.roleKey === rk) {
          existing = { role: r, index: i };
          existingOwner = p;
          return true;
        }
        return false;
      });
    });

    // Case 1: slot cleared
    if (!d.personId) {
      if (existing) existingOwner.roles.splice(existing.index, 1);
      return;
    }
    // Case 2: slot newly filled (no existing)
    if (!existing) {
      var newOwner = club.people.filter(function(p){ return p._id === d.personId; })[0];
      if (newOwner) {
        newOwner.roles.push({
          title: label,
          section: section,
          roleKey: rk,
          deptHead: false,
        });
      }
      return;
    }
    // Case 3: slot moved from existing owner to another person
    if (existingOwner._id !== d.personId) {
      var target = club.people.filter(function(p){ return p._id === d.personId; })[0];
      if (target) {
        target.roles.push({
          title: label,
          section: section,
          roleKey: rk,
          deptHead: false,
        });
      }
      existingOwner.roles.splice(existing.index, 1);
    }
    // Case 4: same owner, nothing to do
  });

  // Apply add-extra draft if present
  var add = state.manage.checklistAddDraft;
  if (add && add.section === section && add.personId && (add.roleTitle||'').trim()) {
    var target = club.people.filter(function(p){ return p._id === add.personId; })[0];
    if (target) {
      target.roles.push({
        title: add.roleTitle.trim(),
        section: section,
        deptHead: false,
      });
    }
  }

  // Ensure every person has exactly one primary role after mutations
  club.people.forEach(function(p){ ensurePrimaryRole(p); });

  persistClub(club, 'roles_edit', 'Updated ' + section + ' assignments for ' + club.name);
  state.manage.editingDeptSection = null;
  state.manage.checklistDrafts = null;
  state.manage.checklistAddDraft = null;
  renderEditor(document.getElementById('mc-root'));
}

function saveDeptEdit(section) {
  var club = window.CLUBS.filter(function(c){ return c.name === state.manage.editingClub; })[0];
  if (!club) return;

  // Pre-flight check on the add-draft: if the person being added already has
  // a role in this section, show a soft warning. User can confirm to continue
  // or cancel to amend. Does NOT apply to existing-row edits (those already
  // exist, so no duplication is being created).
  var add = state.manage.deptAddDraft;
  if (add && add.section === section && add.personId) {
    var target = club.people.filter(function(p){ return p._id === add.personId; })[0];
    if (target) {
      var existing = target.roles.filter(function(r){ return r.section === section; });
      if (existing.length && !state.manage._duplicateWarnAccepted) {
        var titles = existing.map(function(r){ return r.title; }).join(', ');
        state.manage.confirmDialog = {
          title: 'Already in this department?',
          message: '<b>' + esc(target.name) + '</b> already holds <b>' + esc(titles) + '</b> in <b>' + esc(section) + '</b>. Adding a second role here is uncommon — most roles can be captured in the title of the existing role.',
          sub: 'Continue anyway, or cancel to amend?',
          confirmText: 'Add second role anyway',
          variant: 'primary',
          onConfirm: function() {
            state.manage.confirmDialog = null;
            state.manage._duplicateWarnAccepted = true;
            saveDeptEdit(section);
            state.manage._duplicateWarnAccepted = false;
          },
          onCancel: function() {
            state.manage.confirmDialog = null;
            renderEditor(document.getElementById('mc-root'));
          }
        };
        renderEditor(document.getElementById('mc-root'));
        return;
      }
    }
  }

  var drafts = state.manage.deptDrafts || {};

  // Walk each draft; find the existing role entry and update it.
  Object.keys(drafts).forEach(function(key) {
    var d = drafts[key];
    var originalPersonId = key.split('|')[0];
    var originalTitle = d._originalTitle;

    var originalPerson = club.people.filter(function(p){ return p._id === originalPersonId; })[0];
    if (!originalPerson) return;

    var roleIdx = originalPerson.roles.findIndex(function(r) {
      return r.section === section && r.title === originalTitle;
    });
    if (roleIdx === -1) return;

    // If person changed: move role to new person with updated title/head/flags
    if (d.personId !== originalPersonId) {
      var newPerson = club.people.filter(function(p){ return p._id === d.personId; })[0];
      if (newPerson) {
        var newRole = {
          title: d.roleTitle.trim() || originalTitle,
          section: section,
          deptHead: !!d.deptHead,
        };
        if (d.flags && Object.keys(d.flags).some(function(k){ return d.flags[k]; })) {
          newRole.flags = {};
          Object.keys(d.flags).forEach(function(k){ if (d.flags[k]) newRole.flags[k] = true; });
        }
        newPerson.roles.push(newRole);
      }
      originalPerson.roles.splice(roleIdx, 1);
    } else {
      // Just update title / deptHead / flags
      originalPerson.roles[roleIdx].title = (d.roleTitle || '').trim() || originalTitle;
      originalPerson.roles[roleIdx].deptHead = !!d.deptHead;
      if (d.flags) {
        var activeFlags = {};
        var any = false;
        Object.keys(d.flags).forEach(function(k){
          if (d.flags[k]) { activeFlags[k] = true; any = true; }
        });
        if (any) originalPerson.roles[roleIdx].flags = activeFlags;
        else delete originalPerson.roles[roleIdx].flags;
      }
    }
  });

  // Apply add-draft now (warning has been accepted or wasn't needed)
  if (add && add.section === section && add.personId) {
    var addTarget = club.people.filter(function(p){ return p._id === add.personId; })[0];
    if (addTarget) {
      var addRole = {
        title: (add.roleTitle || '').trim() || 'Unspecified',
        section: section,
        deptHead: !!add.deptHead,
      };
      if (add.flags && Object.keys(add.flags).some(function(k){ return add.flags[k]; })) {
        addRole.flags = {};
        Object.keys(add.flags).forEach(function(k){ if (add.flags[k]) addRole.flags[k] = true; });
      }
      addTarget.roles.push(addRole);
    }
  }

  // Ensure every person has exactly one primary role (in case changes broke it)
  club.people.forEach(function(p){ ensurePrimaryRole(p); });

  persistClub(club, 'roles_edit', 'Updated ' + section + ' assignments for ' + club.name);
  state.manage.editingDeptSection = null;
  state.manage.deptDrafts = null;
  state.manage.deptAddDraft = null;
  renderEditor(document.getElementById('mc-root'));
}

/* Ensure exactly one role has main=true (primary) per person.
   If none, promote the first role. If multiple, keep the first flagged. */
function ensurePrimaryRole(person) {
  if (!person.roles || !person.roles.length) return;
  var mainIdx = person.roles.findIndex(function(r){ return r.main; });
  if (mainIdx === -1) {
    person.roles[0].main = true;
    for (var i = 1; i < person.roles.length; i++) person.roles[i].main = false;
  } else {
    person.roles.forEach(function(r, i){ r.main = (i === mainIdx); });
  }
}

function removeDeptDraft(key) {
  // Removing an assignment from the edit list.
  // Check if this would leave the person with 0 roles → warn about implicit deletion.
  var club = window.CLUBS.filter(function(c){ return c.name === state.manage.editingClub; })[0];
  if (!club) return;
  var d = state.manage.deptDrafts[key];
  if (!d) return;
  var originalPersonId = key.split('|')[0];
  var person = club.people.filter(function(p){ return p._id === originalPersonId; })[0];
  if (!person) return;

  // Count roles they still have in OTHER sections (not being removed here)
  var otherRoles = person.roles.filter(function(r, i) {
    return !(r.section === state.manage.editingDeptSection && r.title === d._originalTitle);
  });

  if (otherRoles.length === 0) {
    state.manage.confirmDialog = {
      title: 'Last assignment?',
      message: 'This is <b>' + esc(person.name) + '</b>\'s only department assignment. Removing it will leave them in the People list with no departments assigned. They will NOT be automatically deleted — you can remove them from the People tab if you want to.',
      sub: 'If you just want to move them to a different role or department, that\'s fine — they\'ll stay in the People list.',
      confirmText: 'Remove assignment',
      variant: 'danger',
      onConfirm: function() {
        // Actually remove the role from the person now, and drop draft
        var roleIdx = person.roles.findIndex(function(r) {
          return r.section === state.manage.editingDeptSection && r.title === d._originalTitle;
        });
        if (roleIdx !== -1) person.roles.splice(roleIdx, 1);
        delete state.manage.deptDrafts[key];
        state.manage.confirmDialog = null;
        renderEditor(document.getElementById('mc-root'));
      }
    };
    renderEditor(document.getElementById('mc-root'));
    return;
  }

  // Straightforward removal — just drop the role and the draft
  var remaining = otherRoles.map(function(r){ return r.title + ' (' + r.section + ')'; }).join(', ');
  state.manage.confirmDialog = {
    title: 'Remove assignment?',
    message: 'Remove <b>' + esc(person.name) + '</b> from this department. They will remain in the directory with: <b>' + esc(remaining) + '</b>.',
    confirmText: 'Remove',
    variant: 'danger',
    onConfirm: function() {
      var roleIdx = person.roles.findIndex(function(r) {
        return r.section === state.manage.editingDeptSection && r.title === d._originalTitle;
      });
      if (roleIdx !== -1) person.roles.splice(roleIdx, 1);
      delete state.manage.deptDrafts[key];
      state.manage.confirmDialog = null;
      renderEditor(document.getElementById('mc-root'));
    }
  };
  renderEditor(document.getElementById('mc-root'));
}

/* ================= BOOT + UI WIRING =================
   wireUI() binds all event listeners and renders the first scene. It is
   called exactly once, from TOOL.boot, after the session persona is set
   and live clubs-meta has been fetched. (Replaces the old DOMContentLoaded
   handler + demo persona bar.) */
function wireUI() {
  // --- One-off RTDB seed import button (superadmin banner, delegated
  //     because renderListing re-creates it) ---
  document.getElementById('listing-root').addEventListener('click', function(e) {
    if (e.target && e.target.id === 'cdSeedBtn') seedRTDBFromInline();
  });

  // --- Completion dashboard: click a league row to open that club ---
  document.getElementById('dashboard-root').addEventListener('click', function(e) {
    var row = e.target.closest('[data-club]');
    if (!row) return;
    state.viewing = row.getAttribute('data-club');
    state.viewMode = 'directory';
    showScene();
  });

  // --- Data cleanup controls (delegated — scene re-renders) ---
  document.getElementById('cleanup-root').addEventListener('click', function(e) {
    var t = e.target;
    if (t.id === 'clBackup') { cleanupDownloadBackup(); return; }
    if (t.id === 'clAnalyse') { CLEANUP.plan = analyseCleanup(); renderCleanupScene(); return; }
    if (t.id === 'clRun') {
      if (confirm('Run auto cleanup? ' + CLEANUP.plan.autoMerges.length + ' merges + ' +
        CLEANUP.plan.nameless.length + ' vacant conversions, and every club record is re-written in the v2 shape. Backup downloaded?')) {
        runAutoCleanup();
      }
      return;
    }
    if (t.hasAttribute('data-cl-merge')) { applyReviewMerge(parseInt(t.getAttribute('data-cl-merge'), 10), true); return; }
    if (t.hasAttribute('data-cl-keep'))  { applyReviewMerge(parseInt(t.getAttribute('data-cl-keep'), 10), false); return; }
  });

  // --- View toggle (Directory / List builder / Manage / Activity) ---
  var clubGroup = document.getElementById('clubStyleGroup');
  clubGroup.addEventListener('click', function(e) {
    var b = e.target.closest('[data-view-mode]');
    if (!b) return;
    var viewMode = b.getAttribute('data-view-mode') || 'directory';
    var cap = b.getAttribute('data-requires');
    if (cap && !personaCan(cap)) return; // safety net — shouldn't be clickable anyway
    state.viewMode = viewMode;
    state.viewing = null;
    // Reset manage sub-state when entering
    if (viewMode === 'manage') {
      state.manage.editingClub = null;
    }
    clubGroup.querySelectorAll('button').forEach(function(x) {
      x.setAttribute('aria-pressed', x === b ? 'true' : 'false');
    });
    showScene();
  });

  // --- Search box (only affects directory listing) ---
  var search = document.getElementById('searchBox');
  var searchTimer;
  search.addEventListener('input', function() {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function() {
      state.searchQuery = search.value;
      if (state.viewMode === 'directory' && !state.viewing) renderListing();
    }, 150);
  });

  // --- Back link ---
  document.getElementById('backLink').addEventListener('click', function(e) {
    e.preventDefault();
    state.viewing = null;
    showScene();
  });

  // --- "Manage my club" button on club page ---
  document.getElementById('manageMyClubBtn').addEventListener('click', function(e) {
    e.preventDefault();
    state.manage.editingClub = state.viewing;
    state.viewMode = 'manage';
    state.viewing = null;
    // deselect the dense/role-first buttons so no view toggle shows pressed
    clubGroup.querySelectorAll('button').forEach(function(x) { x.setAttribute('aria-pressed', 'false'); });
    showScene();
  });

  // --- List Builder interactions ---
  var builderScene = document.getElementById('scene-builder');
  builderScene.addEventListener('click', function(e) {
    var t = e.target;
    var modeBtn = t.closest('[data-lb-mode]');
    if (modeBtn) {
      state.lb.mode = modeBtn.getAttribute('data-lb-mode');
      document.querySelectorAll('#lbModeGroup [data-lb-mode]').forEach(function(b){

      var section = t.getAttribute('data-checklist-section');
      var roleKey = t.getAttribute('data-checklist-role');
      // First interaction seeds the filter with the current defaults, then applies the toggle
      var meta = SECTIONS_BY_KEY[section];
      if (!meta) return;
      if (!state.lb.checklistRoleFilter[section]) {
        // Seed from defaults: required + optional on, __other off
        var seed = {};
        (meta.requiredRoles||[]).forEach(function(k){ seed[k] = true; });
        (meta.optionalRoles||[]).forEach(function(k){ seed[k] = true; });
        seed.__other = false;
        state.lb.checklistRoleFilter[section] = seed;
      }
      state.lb.checklistRoleFilter[section][roleKey] = t.checked;
      renderBuilderWarnings(); renderBuilderResults();
      return;

    if (t.hasAttribute('data-flag-section')) {
      var fsec = t.getAttribute('data-flag-section');
      var fkey = t.getAttribute('data-flag-key');
      if (!state.lb.flagFilter[fsec]) state.lb.flagFilter[fsec] = {};
      if (t.checked) state.lb.flagFilter[fsec][fkey] = true;
      else delete state.lb.flagFilter[fsec][fkey];
      renderBuilderResults();
      return;

      var divName = t.getAttribute('data-division');
      var divClubs = window.CLUBS.filter(function(c){ return divisionOf(c.name) === divName; });

      renderBuilderDivisions(); renderBuilderWarnings(); renderBuilderResults();
      return;

    if (t.hasAttribute('data-club')) {
      var clubName = t.getAttribute('data-club');
      if (t.checked) state.lb.selectedClubs[clubName] = true;
      else           delete state.lb.selectedClubs[clubName];

  // --- MANAGE CONTACTS interactions (v0.9) ---
  var manageScene = document.getElementById('scene-manage');

  manageScene.addEventListener('click', function(e) {
    var t = e.target;

    /* --- Club picker --- */
    var clubRow = t.closest('[data-club]');
    if (clubRow && clubRow.tagName === 'TR') {
      state.manage.editingClub = clubRow.getAttribute('data-club');
      state.manage.surface = 'people';
      renderManage();
      return;
    }
    var filterPill = t.closest('[data-div-filter]');
    if (filterPill) {
      var f = filterPill.getAttribute('data-div-filter');
      state.manage.pickerDivFilter = f || null;
      renderManage();
      return;
    }

    /* --- Navigation --- */
    if (t.id === 'mcBackToPicker') {
      e.preventDefault();
      state.manage.editingClub = null;
      state.manage.surface = 'people';
      state.manage.editingPersonId = null;
      state.manage.personDraft = null;
      state.manage.editingDeptSection = null;
      state.manage.deptDrafts = null;
      state.manage.deptAddDraft = null;
      state.manage.editingDetails = null;
      renderManage();
      return;
    }
    if (t.id === 'mcBackToDirectory') {
      e.preventDefault();
      state.viewMode = 'directory';
      state.viewing = EDITOR_CLUB;
      showScene();
      return;
    }

    /* --- Surface tabs --- */
    var surfaceTab = t.closest('[data-surface]');
    if (surfaceTab) {
      state.manage.surface = surfaceTab.getAttribute('data-surface');
      // Leaving a surface with an open edit state is fine — drafts hold intact.
      // But close the person panel if moving away.
      if (state.manage.surface !== 'people') {
        state.manage.editingPersonId = null;
        state.manage.personDraft = null;
      }
      renderEditor(document.getElementById('mc-root'));
      return;
    }

    /* --- People surface --- */
    // Row click or edit button opens panel
    var editPersonBtn = t.closest('[data-edit-person]');
    if (editPersonBtn) {
      openPersonPanel(editPersonBtn.getAttribute('data-edit-person'));
      return;
    }
    var personCard = t.closest('[data-person-id]');
    if (personCard && !editPersonBtn) {
      openPersonPanel(personCard.getAttribute('data-person-id'));
      return;
    }
    if (t.id === 'mcAddPersonBtn') {
      openPersonPanel('new');
      return;
    }

    /* --- Person side-panel --- */
    if (t.id === 'mcPanelClose' || t.id === 'mcPanelOverlay' || t.id === 'mcPanelCancel') {
      closePersonPanel();
      return;
    }
    if (t.id === 'mcPanelSave') {
      savePersonPanel();
      return;
    }
    if (t.id === 'mcPanelDelete') {
      deletePersonWithConfirm();
      return;
    }
    // Role rows: add / remove
    if (t.id === 'mcAddRoleRow') {
      var d0 = state.manage.personDraft;
      if (d0 && Array.isArray(d0.roleRows)) {
        d0.roleRows.push({ section: SECTION_ORDER[0], title: '', deptHead: false, flags: {} });
        refreshPersonPanel();
      }
      return;
    }
    var remRoleBtn = t.closest('[data-remove-role-idx]');
    if (remRoleBtn) {
      var dR = state.manage.personDraft;
      var ri = parseInt(remRoleBtn.getAttribute('data-remove-role-idx'), 10);
      if (dR && Array.isArray(dR.roleRows)) {
        dR.roleRows.splice(ri, 1);
        if (dR.primaryRoleIdx >= dR.roleRows.length) dR.primaryRoleIdx = dR.roleRows.length - 1;
        if (dR.primaryRoleIdx < 0 && dR.roleRows.length) dR.primaryRoleIdx = 0;
        refreshPersonPanel();
      }
      return;
    }
    // Contact rows: add email / add phone / remove
    if (t.id === 'mcAddEmailRow' || t.id === 'mcAddPhoneRow') {
      var dC = state.manage.personDraft;
      if (dC && Array.isArray(dC.contactRows)) {
        var newType = (t.id === 'mcAddPhoneRow') ? 'phone' : 'email';
        var firstOfType = !dC.contactRows.some(function(c){ return c.type === newType; });
        dC.contactRows.push({ type: newType, value: '', label: '', preferred: firstOfType });
        refreshPersonPanel();
        // Drop focus straight into the new row so it can be filled in.
        var newIdx = dC.contactRows.length - 1;
        var newInput = document.querySelector('[data-contact-value-idx="' + newIdx + '"]');
        if (newInput) newInput.focus();
      }
      return;
    }
    var remContactBtn = t.closest('[data-remove-contact-idx]');
    if (remContactBtn) {
      var dRC = state.manage.personDraft;
      var ci = parseInt(remContactBtn.getAttribute('data-remove-contact-idx'), 10);
      if (dRC && Array.isArray(dRC.contactRows)) {
        dRC.contactRows.splice(ci, 1);
        refreshPersonPanel();
      }
      return;
    }

    /* --- Departments surface --- */
    var editDeptBtn = t.closest('[data-edit-dept-section]');
    if (editDeptBtn) {
      enterDeptEdit(editDeptBtn.getAttribute('data-edit-dept-section'));
      return;
    }
    var cancelDeptBtn = t.closest('[data-cancel-dept]');
    if (cancelDeptBtn) {
      cancelDeptEdit();
      return;
    }
    var saveDeptBtn = t.closest('[data-save-dept]');
    if (saveDeptBtn) {
      saveDeptEdit(saveDeptBtn.getAttribute('data-save-dept'));
      return;
    }
    var addToDeptBtn = t.closest('[data-add-to-dept]');
    if (addToDeptBtn) {
      startDeptAdd(addToDeptBtn.getAttribute('data-add-to-dept'));
      return;
    }
    if (t.id === 'mcAddDraftCancel') {
      cancelDeptAdd();
      return;
    }
    var removeDraftBtn = t.closest('[data-remove-draft-key]');
    if (removeDraftBtn) {
      removeDeptDraft(removeDraftBtn.getAttribute('data-remove-draft-key'));
      return;
    }

    /* --- Checklist dept handlers (Liaison officers) --- */
    var saveChecklistBtn = t.closest('[data-save-checklist]');
    if (saveChecklistBtn) {
      saveChecklistEdit(saveChecklistBtn.getAttribute('data-save-checklist'));
      return;
    }
    var addChecklistExtra = t.closest('[data-add-checklist-extra]');
    if (addChecklistExtra) {
      state.manage.checklistAddDraft = {
        section: addChecklistExtra.getAttribute('data-add-checklist-extra'),
        personId: '',
        roleTitle: '',
      };
      renderEditor(document.getElementById('mc-root'));
      return;
    }
    if (t.id === 'mcChecklistAddCancel') {
      state.manage.checklistAddDraft = null;
      renderEditor(document.getElementById('mc-root'));
      return;
    }
    var clearSlotBtn = t.closest('[data-clear-slot]');
    if (clearSlotBtn) {
      var slotKey = clearSlotBtn.getAttribute('data-clear-slot');
      if (state.manage.checklistDrafts && state.manage.checklistDrafts[slotKey]) {
        state.manage.checklistDrafts[slotKey].personId = '';
      }
      renderEditor(document.getElementById('mc-root'));
      return;
    }
    var removeExtraBtn = t.closest('[data-remove-extra]');
    if (removeExtraBtn) {
      var extraKey = removeExtraBtn.getAttribute('data-remove-extra');
      // Delete the draft AND mark the underlying role for removal by setting personId to ''
      // Since extras don't have a meaningful "slot" they just get removed at save time.
      // For simplicity: actually remove from the club right away, drop the draft.
      var d = state.manage.checklistDrafts[extraKey];
      if (d) {
        var club = window.CLUBS.filter(function(c){ return c.name === state.manage.editingClub; })[0];
        var original = club ? club.people.filter(function(p){ return p._id === d._originalPersonId; })[0] : null;
        if (original) {
          var idx = original.roles.findIndex(function(r){
            return r.section === state.manage.editingDeptSection && !r.roleKey && r.title === d._originalTitle;
          });
          if (idx !== -1) original.roles.splice(idx, 1);
        }
        delete state.manage.checklistDrafts[extraKey];
      }
      renderEditor(document.getElementById('mc-root'));
      return;
    }

    /* --- Club contact details edit (phone/email/website only) ---
       Address + FA membership now live in clubs-meta and are read-only here. */
    if (t.id === 'mcDetailsEdit') {
      var club = window.CLUBS.filter(function(c){ return c.name === state.manage.editingClub; })[0];
      state.manage.editingDetails = {
        phone: club.phone || '',
        email: club.email || '',
        website: club.website || '',
      };
      renderEditor(document.getElementById('mc-root'));
      return;
    }
    if (t.id === 'mcDetailsCancel') {
      state.manage.editingDetails = null;
      renderEditor(document.getElementById('mc-root'));
      return;
    }
    if (t.id === 'mcDetailsSave') {
      var c = window.CLUBS.filter(function(x){ return x.name === state.manage.editingClub; })[0];
      var d = state.manage.editingDetails;
      if (c && d) {
        c.phone = d.phone;
        c.email = d.email;
        c.website = d.website;
        persistClub(c, 'details_edit', 'Updated club contact details for ' + c.name);
      }
      state.manage.editingDetails = null;
      renderEditor(document.getElementById('mc-root'));
      return;
    }

    /* --- Confirm dialog --- */
    if (t.id === 'mcConfirmCancel') {
      var dlg = state.manage.confirmDialog;
      if (dlg && dlg.onCancel) dlg.onCancel();
      else { state.manage.confirmDialog = null; renderEditor(document.getElementById('mc-root')); }
      return;
    }
    if (t.id === 'mcConfirmOk') {
      var dlg2 = state.manage.confirmDialog;
      if (dlg2 && dlg2.onConfirm) dlg2.onConfirm();
      return;
    }
  });

  manageScene.addEventListener('input', function(e) {

    // Person modal role title (free text — no re-render so the field keeps focus)
    if (t.hasAttribute('data-role-title-idx')) {

  manageScene.addEventListener('change', function(e) {
    var t = e.target;

    /* --- Person modal: role rows --- */
    // Section select: changes flags + datalist + dept-head availability -> re-render.
    if (t.hasAttribute('data-role-section-idx')) {
      var si = parseInt(t.getAttribute('data-role-section-idx'), 10);
      var dS = state.manage.personDraft;
      if (dS && dS.roleRows && dS.roleRows[si]) {
        dS.roleRows[si].section = t.value;
        // Dept head only meaningful for head sections; clear if leaving one.
        if (HEAD_SECTIONS.indexOf(t.value) === -1) dS.roleRows[si].deptHead = false;
        refreshPersonPanel();
      }
      return;
    }
    // Primary role radio (one across all role rows).
    if (t.name === 'personPrimaryRole' && t.hasAttribute('data-primary-role-idx')) {
      if (state.manage.personDraft) {
        state.manage.personDraft.primaryRoleIdx = parseInt(t.getAttribute('data-primary-role-idx'), 10);
      }
      return;
    }
    // Dept-head checkbox -> re-render to show / clear clash warning.
    if (t.hasAttribute('data-role-head-idx')) {
      var hi = parseInt(t.getAttribute('data-role-head-idx'), 10);
      var dH = state.manage.personDraft;
      if (dH && dH.roleRows && dH.roleRows[hi]) {
        dH.roleRows[hi].deptHead = t.checked;
        refreshPersonPanel();
      }
      return;
    }
    // Section flag checkbox on a role row (e.g. Media -> Programme editor).
    if (t.hasAttribute('data-role-flag-idx')) {
      var rfi = parseInt(t.getAttribute('data-role-flag-idx'), 10);
      var rfk = t.getAttribute('data-flag-key');
      var dF = state.manage.personDraft;
      if (dF && dF.roleRows && dF.roleRows[rfi]) {
        if (!dF.roleRows[rfi].flags) dF.roleRows[rfi].flags = {};
        dF.roleRows[rfi].flags[rfk] = t.checked;
      }
      return;
    }

    /* --- Person modal: contact rows --- */
    if (t.hasAttribute('data-contact-type-idx')) {
      var cti = parseInt(t.getAttribute('data-contact-type-idx'), 10);
      var dCT = state.manage.personDraft;
      if (dCT && dCT.contactRows && dCT.contactRows[cti]) {
        dCT.contactRows[cti].type = t.value;
        // Preferred radios are per-type; re-render so the radio grouping is correct.
        refreshPersonPanel();
      }
      return;
    }
    if ((t.name === 'personPrefEmail' || t.name === 'personPrefPhone') && t.hasAttribute('data-contact-pref-idx')) {
      var pci = parseInt(t.getAttribute('data-contact-pref-idx'), 10);
      var dP = state.manage.personDraft;
      if (dP && dP.contactRows) {
        var chosen = dP.contactRows[pci];
        if (chosen) {
          dP.contactRows.forEach(function(c){ if (c.type === chosen.type) c.preferred = (c === chosen); });
        }
      }
      return;
    }
    // Directory visibility (Public / Staff only / Hidden) — no re-render needed.
    if (t.id === 'mcPanelVisibility') {
      if (state.manage.personDraft) state.manage.personDraft.visibility = t.value;
      return;
    }
    // "No email/phone on file" — records a deliberate blank so save doesn't block.
    if (t.id === 'mcNoEmail') { if (state.manage.personDraft) state.manage.personDraft.noEmail = t.checked; return; }
    if (t.id === 'mcNoPhone') { if (state.manage.personDraft) state.manage.personDraft.noPhone = t.checked; return; }

    // Flag tickbox on existing role draft (e.g. Media -> Programme editor)
    if (t.hasAttribute('data-draft-flag-key')) {
      var fkey = t.getAttribute('data-draft-flag-key');
      var flagName = t.getAttribute('data-flag-name');
      if (state.manage.deptDrafts && state.manage.deptDrafts[fkey]) {
        if (!state.manage.deptDrafts[fkey].flags) state.manage.deptDrafts[fkey].flags = {};
        state.manage.deptDrafts[fkey].flags[flagName] = t.checked;
      }
      return;
    }
    // Flag tickbox on add-new draft
    if (t.hasAttribute('data-add-flag')) {
      var addFlag = t.getAttribute('data-add-flag');
      if (state.manage.deptAddDraft) {
        if (!state.manage.deptAddDraft.flags) state.manage.deptAddDraft.flags = {};
        state.manage.deptAddDraft.flags[addFlag] = t.checked;
      }
      return;
    }
    if (t.hasAttribute('data-draft-key') && t.getAttribute('data-draft-field') === 'deptHead') {
      var key = t.getAttribute('data-draft-key');
      if (state.manage.deptDrafts && state.manage.deptDrafts[key]) {
        state.manage.deptDrafts[key].deptHead = t.checked;
      }
    }
    // Checklist selects (person picker for slots and extras)
    if (t.hasAttribute('data-checklist-draft-key')) {
      var ckey = t.getAttribute('data-checklist-draft-key');
      var cfield = t.getAttribute('data-draft-field') || 'personId';
      if (state.manage.checklistDrafts && state.manage.checklistDrafts[ckey]) {
        state.manage.checklistDrafts[ckey][cfield] = t.value;
      }
    }
    if (t.id === 'mcChecklistAddPerson') {
      if (state.manage.checklistAddDraft) state.manage.checklistAddDraft.personId = t.value;
    }
    if (t.id === 'mcAddDraftHead') {
      if (state.manage.deptAddDraft) state.manage.deptAddDraft.deptHead = t.checked;
    }
    if (t.id === 'mcAddDraftPerson') {
      if (state.manage.deptAddDraft) state.manage.deptAddDraft.personId = t.value;
    }
  });

  showScene();
}

/* ================= BOOT ================= */

/* Map the verified auth-guard session onto the tool's persona model. */
function personaFromSession(session) {
  var role = session && session.role;
  if (role === 'admin' || role === 'superadmin') return 'admin';
  if (role === 'staff') return 'staff';
  if (role === 'club' || role === 'club-admin') return 'club-editor';
  if (role === 'club-viewer') return 'club-viewer';
  return 'viewer';
}

/* Resolve session.club (display name, occasionally a slug — same tolerant
   convention as programme-packs) to a canonical clubs-meta name. */
function resolveOwnClub(session, metaClubs) {
  var raw = session && session.club;
  if (!raw) return null;
  var i, c;
  for (i = 0; i < metaClubs.length; i++) {
    if (metaClubs[i].name === raw) return metaClubs[i].name;
  }
  var slug = String(raw).toLowerCase().replace(/[^a-z0-9]+/g, '');
  for (i = 0; i < metaClubs.length; i++) {
    c = metaClubs[i].name.toLowerCase().replace(/[^a-z0-9]+/g, '');
    if (c === slug || c.indexOf(slug) !== -1) return metaClubs[i].name;
  }
  return null;
}

/* Build the working datasets from live clubs-meta + the inline seed:
   - window.CLUBS_META: name-keyed map of full meta records (current roster).
   - window.CLUBS: directory list = CURRENT SEASON clubs. Continuing clubs
     keep their seed people/contacts; new entrants get an empty record
     (people to be filled in by the club/staff). Departed clubs drop out. */
function buildWorkingData(meta) {
  var current = NL.season.clubsFor(meta);   // current season, division resolved
  var seedByName = {};
  (window.CLUBS || []).forEach(function(c) { seedByName[c.name] = c; });

  window.CLUBS_META = {};
  current.forEach(function(mc) { window.CLUBS_META[mc.name] = mc; });

  window.CLUBS = current.map(function(mc) {
    return seedByName[mc.name] || {
      name: mc.name,
      phone: null,
      email: null,
      website: mc.domain ? 'www.' + mc.domain : null,
      people: []
    };
  });
}

var CLUBS_META_URL = 'https://raw.githubusercontent.com/thenationalleague/tools/refs/heads/main/assets/data/clubs-meta.json';

/* ================= RTDB persistence (phase C) =================
   People + club contact details live in RTDB at
   app-data/ops-club-directory/clubs/<clubName>. Rules: any signed-in user
   reads; a club user writes their own club; admin/superadmin write any.
   Every save also lands a tool-local audit entry (admin-readable) plus
   the platform-wide admin/audit hook entry.
   Until the node is seeded (one-off superadmin import of the handbook
   corpus), the inline seed renders read-only and manage is disabled. */
/* ================= PEOPLE MODEL v2 =================
   Three concepts (assessment 10/06/2026):
   - Person: the human. Carries contacts[] — multiple emails/phones, each
     {type:'email'|'phone', value, label, preferred} (work/home etc).
     person.email / person.phone remain as MIRRORS of the preferred
     contact of each type, so every existing read site stays correct.
   - Assignment (the roles[] entries): a job at the club. Gains
     `function` — a closed, League-owned key for cross-club queries (the
     club's free-text `title` is untouched) — and may carry its own
     contacts[] (role inboxes like secretary@ that outlive the holder).
   - Vacant assignment: club.vacant[] — a role with a contact route but
     no named person (was modelled as nameless people). */

var FUNCTIONS = {
  chair: 'Chair', vicechair: 'Vice Chair', president: 'President', owner: 'Owner',
  director: 'Director', ceo: 'Chief Executive', gm: 'General Manager',
  secretary: 'Club Secretary', fixtures: 'Fixture Secretary', finance: 'Finance',
  commercial: 'Commercial', press: 'Press / Media', social: 'Website / Social',
  programme: 'Programme Editor', marketing: 'Marketing', safety: 'Safety Officer',
  operations: 'Operations', kit: 'Kit Manager', doctor: 'Club Doctor',
  physio: 'Physio / Therapist', community: 'Community',
  safeguarding: 'Safeguarding / Welfare',
  dlo: 'Disability Liaison Officer', plo: 'Police Liaison Officer',
  cslo: 'Competition Sponsorship Liaison Officer', slo: 'Supporter Liaison Officer',
  other: 'Other'
};

/* Best-effort title -> function mapping. Built from the title-variance
   analysis of the 2025 corpus; unmapped titles fall to 'other'. */
function functionForTitle(title, section) {
  var t = (title || '').toLowerCase();
  if (/disab/.test(t) && /liaison/.test(t)) return 'dlo';
  if (/police/.test(t) && /liaison/.test(t)) return 'plo';
  if (/(competition )?sponsorship liaison/.test(t)) return 'cslo';
  if (/supporter/.test(t) && /liaison/.test(t)) return 'slo';
  if (section === 'Directors') return 'director';
  if (/vice[- ]?chair/.test(t)) return 'vicechair';
  if (/chair/.test(t)) return 'chair';
  if (/president/.test(t)) return 'president';
  if (/owner/.test(t)) return 'owner';
  if (/chief exec|\bceo\b/.test(t)) return 'ceo';
  if (/general manager|managing director/.test(t)) return 'gm';
  if (/fixture/.test(t)) return 'fixtures';
  if (/secretar/.test(t)) return 'secretary';
  if (/financ|account|treasur/.test(t)) return 'finance';
  if (/commercial|sponsorship|sales/.test(t)) return 'commercial';
  if (/programme/.test(t)) return 'programme';
  if (/website|social/.test(t)) return 'social';
  if (/press|\bmedia\b/.test(t)) return 'press';
  if (/marketing|communications/.test(t)) return 'marketing';
  if (/safety/.test(t)) return 'safety';
  if (/operation/.test(t)) return 'operations';
  if (/\bkit\b/.test(t)) return 'kit';
  if (/doctor/.test(t)) return 'doctor';
  if (/physio|therapist|sports science/.test(t)) return 'physio';
  if (/community/.test(t)) return 'community';
  if (/welfare|safeguard/.test(t)) return 'safeguarding';
  if (/director/.test(t)) return 'director';
  return 'other';
}

/* ---- Contact helpers. The mirrors (person.email/.phone) always equal
   the preferred contact of each type; these keep both views in sync. ---- */

function ensureContacts(p) {
  if (!Array.isArray(p.contacts)) {
    p.contacts = [];
    if (p.email) p.contacts.push({ type: 'email', value: p.email, label: '', preferred: true });
    if (p.phone) p.contacts.push({ type: 'phone', value: p.phone, label: '', preferred: true });
  }
  return p.contacts;
}

function preferredContact(p, type) {
  var cs = (p.contacts || []).filter(function(c) { return c.type === type && c.value; });
  var pref = cs.filter(function(c) { return c.preferred; })[0];
  return (pref || cs[0] || {}).value || null;
}

/* All email values for a person, preferred first (display + list export). */
function personEmails(p) {
  if (!Array.isArray(p.contacts)) return p.email ? [p.email] : [];
  var cs = p.contacts.filter(function(c) { return c.type === 'email' && c.value; });
  cs.sort(function(a, b) { return (b.preferred ? 1 : 0) - (a.preferred ? 1 : 0); });
  return cs.map(function(c) { return c.value; });
}

/* Mirrors edited via the person panel -> write back into contacts[]
   (update the preferred entry's value, or create it). Secondary
   contacts are preserved untouched. */
function syncContactsFromMirrors(p) {
  ensureContacts(p);
  ['email', 'phone'].forEach(function(type) {
    var val = p[type] || null;
    var cs = p.contacts.filter(function(c) { return c.type === type; });
    var pref = cs.filter(function(c) { return c.preferred; })[0] || cs[0];
    if (val) {
      if (pref) { pref.value = val; pref.preferred = true; }
      else p.contacts.push({ type: type, value: val, label: '', preferred: true });
    } else if (pref) {
      p.contacts.splice(p.contacts.indexOf(pref), 1);
    }
  });
}

/* Recompute mirrors from contacts (after a merge or RTDB load). */
function syncMirrorsFromContacts(p) {
  p.email = preferredContact(p, 'email');
  p.phone = preferredContact(p, 'phone');
}

var RTDB_BASE = 'app-data/ops-club-directory';
var RTDB = { seeded: false };

/* Serialize a working club record for RTDB. People keyed by _id; roles
   stored as arrays (RTDB re-indexes them; normalised back on read).
   email_private/phone_private are deliberately dropped — the directory
   is behind login, there is no private tier (decision 10/06/2026). */
function clubToRTDB(club) {
  function packContacts(cs) {
    return (cs || []).filter(function(c) { return c && c.value; }).map(function(c) {
      var o = { type: c.type, value: c.value };
      if (c.label) o.label = c.label;
      if (c.preferred) o.preferred = true;
      return o;
    });
  }
  function packRole(r) {
    var o = { title: r.title || '', section: r.section || '', main: !!r.main, deptHead: !!r.deptHead };
    if (r.flags) o.flags = r.flags;
    o['function'] = r['function'] || functionForTitle(r.title, r.section);
    var rc = packContacts(r.contacts);
    if (rc.length) o.contacts = rc;
    return o;
  }
  var people = {};
  (club.people || []).forEach(function(p, i) {
    var id = p._id || ('p' + (i + 1));
    ensureContacts(p);
    people[id] = {
      name: p.name || '',
      email: preferredContact(p, 'email'),
      phone: preferredContact(p, 'phone'),
      note: p.note || null,
      visibility: (['public', 'staff', 'hidden'].indexOf(p.visibility) !== -1) ? p.visibility : 'staff',
      noEmail: !!p.noEmail || null,
      noPhone: !!p.noPhone || null,
      contacts: packContacts(p.contacts),
      roles: (p.roles || []).map(packRole)
    };
  });
  var out = {
    contact: { phone: club.phone || null, email: club.email || null, website: club.website || null },
    people: people
  };
  var vac = (club.vacant || []).map(function(v) {
    var o = { title: v.title || '', section: v.section || '' };
    o['function'] = v['function'] || functionForTitle(v.title, v.section);
    if (v.note) o.note = v.note;
    var vc = packContacts(v.contacts);
    if (vc.length) o.contacts = vc;
    return o;
  });
  if (vac.length) out.vacant = vac;
  return out;
}

/* Inflate an RTDB record back into the working shape. Tolerates RTDB's
   array→object coercion and missing nodes. People sorted by numeric _id
   suffix for stable ordering. */
function clubFromRTDB(name, val, fallbackWebsite) {
  var rec = { name: name, phone: null, email: null, website: fallbackWebsite || null, people: [], vacant: [] };
  if (!val) return rec;
  var c = val.contact || {};
  rec.phone = c.phone || null;
  rec.email = c.email || null;
  rec.website = c.website || fallbackWebsite || null;
  function arr(x) { return !x ? [] : (Array.isArray(x) ? x : Object.keys(x).map(function(k) { return x[k]; })); }
  function unpackContacts(cs) {
    return arr(cs).map(function(x) {
      return { type: x.type, value: x.value || '', label: x.label || '', preferred: !!x.preferred };
    });
  }
  function unpackRole(r) {
    var o = { title: r.title || '', section: r.section || '', main: !!r.main, deptHead: !!r.deptHead };
    if (r.flags) o.flags = r.flags;
    o['function'] = r['function'] || functionForTitle(r.title, r.section);
    o.contacts = unpackContacts(r.contacts);
    return o;
  }
  var people = val.people || {};
  Object.keys(people).forEach(function(id) {
    var p = people[id] || {};
    var person = {
      _id: id,
      name: p.name || '',
      email: p.email || null,
      phone: p.phone || null,
      note: p.note || null,
      visibility: (['public', 'staff', 'hidden'].indexOf(p.visibility) !== -1) ? p.visibility : 'staff',
      noEmail: !!p.noEmail,
      noPhone: !!p.noPhone,
      roles: arr(p.roles).map(unpackRole)
    };
    if (p.contacts) {
      person.contacts = unpackContacts(p.contacts);
      syncMirrorsFromContacts(person);
    } else {
      ensureContacts(person);   /* legacy record: derive contacts from mirrors */
    }
    rec.people.push(person);
  });
  rec.people.sort(function(a, b) {
    var na = parseInt((/^p(\d+)$/.exec(a._id) || [])[1] || '0', 10);
    var nb = parseInt((/^p(\d+)$/.exec(b._id) || [])[1] || '0', 10);
    return na - nb;
  });
  rec.vacant = arr(val.vacant).map(function(v) {
    return { title: v.title || '', section: v.section || '',
             'function': v['function'] || functionForTitle(v.title, v.section),
             note: v.note || null, contacts: unpackContacts(v.contacts) };
  });
  return rec;
}

/* Keep the runtime ID counter above every ID seen in RTDB so new people
   never collide with existing keys. */
function bumpPersonIdCounter() {
  var max = 0;
  window.CLUBS.forEach(function(c) {
    c.people.forEach(function(p) {
      var m = /^p(\d+)$/.exec(p._id || '');
      if (m) max = Math.max(max, parseInt(m[1], 10));
    });
  });
  if (max >= _nextPersonId) _nextPersonId = max + 1;
}

/* Read the RTDB corpus. If present it REPLACES the inline seed as the
   working data (roster still comes from clubs-meta — RTDB records for
   departed clubs are simply left untouched in the DB). If absent, the
   inline seed stays, read-only, awaiting the one-off import. */
function loadRTDBClubs() {
  return NL.ensureAuth()
    .then(function() {
      return firebase.database().ref(RTDB_BASE + '/clubs').once('value');
    })
    .then(function(snap) {
      var data = snap.val();
      if (!data) { RTDB.seeded = false; return; }
      RTDB.seeded = true;
      window.CLUBS = window.CLUBS.map(function(c) {
        var meta = window.CLUBS_META[c.name] || {};
        return clubFromRTDB(c.name, data[c.name], meta.domain ? 'www.' + meta.domain : null);
      });
      bumpPersonIdCounter();
    });
}

/* Persist one club's record after an in-memory mutation, with audit.
   NL.writeAudit first (rich admin/audit entry + suppresses the auto-hook
   for the writes below), then the tool-local audit push, then the data. */
function persistClub(club, action, detail) {
  if (!RTDB.seeded) return;   /* manage is hidden pre-seed; safety net */
  var session = (window.NL && NL.session) || {};
  if (NL.writeAudit) NL.writeAudit('directory_' + action, detail);
  var fdb = firebase.database();
  fdb.ref(RTDB_BASE + '/audit').push({
    ts: firebase.database.ServerValue.TIMESTAMP,
    uid: session.uid || null,
    email: session.email || null,
    club: club.name,
    action: action,
    detail: detail
  });
  fdb.ref(RTDB_BASE + '/clubs/' + club.name).set(clubToRTDB(club))
    .catch(function(err) {
      if (NL.toast) NL.toast('Save failed — ' + (err.message || String(err)) + '. Refresh to re-sync before editing further.', 'error');
    });
}

/* One-off superadmin import: writes the assembled working data (inline
   2025 handbook seed mapped onto the current roster) into RTDB. Refuses
   if the node already has data. */
function seedRTDBFromInline() {
  var btn = document.getElementById('cdSeedBtn');
  if (btn) { btn.disabled = true; btn.textContent = 'Importing…'; }
  NL.ensureAuth()
    .then(function() {
      return firebase.database().ref(RTDB_BASE + '/clubs').once('value');
    })
    .then(function(snap) {
      if (snap.val()) throw new Error('RTDB already has directory data — not overwriting.');
      ensurePersonIds();
      var payload = {};
      window.CLUBS.forEach(function(c) { payload[c.name] = clubToRTDB(c); });
      if (NL.writeAudit) NL.writeAudit('directory_seed', 'Imported handbook seed corpus: ' + window.CLUBS.length + ' clubs');
      return firebase.database().ref(RTDB_BASE + '/clubs').set(payload);
    })
    .then(function() { return loadRTDBClubs(); })
    .then(function() {
      if (NL.toast) NL.toast('Directory data imported — live editing is now enabled.', 'success');
      showScene();
    })
    .catch(function(err) {
      if (NL.toast) NL.toast('Import failed: ' + (err.message || String(err)), 'error');
      if (btn) { btn.disabled = false; btn.textContent = 'Import handbook seed data'; }
    });
}

/* ================= COMPLETION DASHBOARD =================
   Requirements come from the existing tool definitions, expressed via the
   v2 function keys so they're robust to title spelling:
   - a dept HEAD for each REQUIRED_HEAD_SECTIONS
   - the required liaison officers (DLO / PLO / CSLO; SLO optional)
   A vacant role with a contact route satisfies a liaison requirement
   (the function is covered + reachable); head requirements need a person. */

var REQUIRED_LIAISON = { dlo: 'Disability Liaison Officer', plo: 'Police Liaison Officer', cslo: 'Competition Sponsorship Liaison Officer' };

function clubCompliance(club) {
  var missingHeads = [];
  REQUIRED_HEAD_SECTIONS.forEach(function(section) {
    var hasHead = club.people.some(function(p) {
      return (p.roles || []).some(function(r) { return r.section === section && r.deptHead; });
    });
    if (!hasHead) missingHeads.push(section);
  });
  var missingLiaison = [];
  Object.keys(REQUIRED_LIAISON).forEach(function(fk) {
    var has = club.people.some(function(p) { return (p.roles||[]).some(function(r){ return r['function'] === fk; }); }) ||
              (club.vacant || []).some(function(v) { return v['function'] === fk; });
    if (!has) missingLiaison.push(fk);
  });
  var total = REQUIRED_HEAD_SECTIONS.length + Object.keys(REQUIRED_LIAISON).length;
  var missing = missingHeads.length + missingLiaison.length;
  return { missingHeads: missingHeads, missingLiaison: missingLiaison,
           total: total, filled: total - missing, missing: missing,
           complete: missing === 0, hasPeople: club.people.length > 0 };
}

function complianceMeter(c) {
  var pct = c.total ? Math.round((c.filled / c.total) * 100) : 0;
  var col = c.complete ? 'var(--green)' : (pct >= 60 ? 'var(--amber)' : 'var(--red)');
  return '<div class="cp-meter"><div class="cp-meter__bar" style="width:' + pct + '%;background:' + col + ';"></div></div>' +
         '<span class="cp-meter__label">' + c.filled + '/' + c.total + '</span>';
}

function renderDashboardScene() {
  var root = document.getElementById('dashboard-root');
  if (!root) return;
  if (isClubPersona()) { renderClubDashboard(root); return; }
  renderLeagueDashboard(root);
}

/* Club editor: their own checklist. */
function renderClubDashboard(root) {
  var club = window.CLUBS.filter(function(c){ return c.name === EDITOR_CLUB; })[0];
  if (!club) { root.innerHTML = '<div class="lb-empty">No club associated with your account.</div>'; return; }
  var c = clubCompliance(club);

  function item(ok, label, hint) {
    return '<div class="cp-check ' + (ok ? 'cp-check--ok' : 'cp-check--gap') + '">' +
      '<span class="cp-check__icon">' + (ok ? '\u2713' : '\u2715') + '</span>' +
      '<span class="cp-check__label">' + esc(label) + '</span>' +
      (!ok && hint ? '<span class="cp-check__hint">' + esc(hint) + '</span>' : '') +
    '</div>';
  }
  var heads = REQUIRED_HEAD_SECTIONS.map(function(s) {
    return item(c.missingHeads.indexOf(s) === -1, s + ' lead', 'No department head set');
  }).join('');
  var liaison = Object.keys(REQUIRED_LIAISON).map(function(fk) {
    return item(c.missingLiaison.indexOf(fk) === -1, REQUIRED_LIAISON[fk], 'Not appointed');
  }).join('');

  root.innerHTML =
    '<div class="lb-intro"><h2>' + esc(club.name) + ' — directory completion</h2>' +
      '<p>' + (c.complete
        ? 'All required roles are filled. Nice.'
        : c.missing + ' required role' + (c.missing === 1 ? '' : 's') + ' still to fill. Use <b>Manage my club</b> to add people.') +
      '</p></div>' +
    '<div class="cp-dash-meter">' + complianceMeter(c) + '</div>' +
    '<h3 class="cp-dash-h3">Department heads</h3><div class="cp-checks">' + heads + '</div>' +
    '<h3 class="cp-dash-h3">Liaison officers</h3><div class="cp-checks">' + liaison + '</div>';
}

/* Staff / admin: league-wide compliance — rollup + per-club table. */
function renderLeagueDashboard(root) {
  var clubs = window.CLUBS.slice().sort(function(a,b){ return a.name.localeCompare(b.name); });
  var rows = clubs.map(function(club) {
    return { name: club.name, division: divisionOf(club.name), c: clubCompliance(club) };
  });

  /* Requirement rollup: how many clubs miss each thing. */
  var rollup = {};
  REQUIRED_HEAD_SECTIONS.forEach(function(s){ rollup['head:' + s] = { label: s + ' head', n: 0 }; });
  Object.keys(REQUIRED_LIAISON).forEach(function(fk){ rollup['lia:' + fk] = { label: REQUIRED_LIAISON[fk], n: 0 }; });
  rows.forEach(function(r) {
    r.c.missingHeads.forEach(function(s){ rollup['head:' + s].n++; });
    r.c.missingLiaison.forEach(function(fk){ rollup['lia:' + fk].n++; });
  });
  var gaps = Object.keys(rollup).map(function(k){ return rollup[k]; })
    .filter(function(g){ return g.n > 0; }).sort(function(a,b){ return b.n - a.n; });

  var complete = rows.filter(function(r){ return r.c.complete; }).length;

  var rollupHtml = gaps.length
    ? '<div class="cp-rollup">' + gaps.map(function(g) {
        return '<div class="cp-rollup__item"><span class="cp-rollup__n">' + g.n + '</span>' +
          '<span class="cp-rollup__lbl">clubs missing ' + esc(g.label) + '</span></div>';
      }).join('') + '</div>'
    : '<p style="color:var(--green);">Every club has all required roles filled.</p>';

  var tableRows = rows.map(function(r) {
    var gapList = r.c.missingHeads.map(function(s){ return s + ' head'; })
      .concat(r.c.missingLiaison.map(function(fk){ return fk.toUpperCase(); }));
    return '<tr data-club="' + esc(r.name) + '" class="cp-dash-row">' +
      '<td><div class="lb-club-cell"><img src="' + crestUrl(r.name) + '" alt="" onerror="this.onerror=null;this.src=\'' + fallbackCrest() + '\'"><span>' + esc(r.name) + '</span></div></td>' +
      '<td class="cp-dash-meter-cell">' + complianceMeter(r.c) + '</td>' +
      '<td class="cp-dash-gaps">' + (gapList.length ? esc(gapList.join(', ')) : '<span style="color:var(--green);">complete</span>') + '</td>' +
    '</tr>';
  }).join('');

  root.innerHTML =
    '<div class="lb-intro"><h2>League directory completion</h2>' +
      '<p>' + complete + ' of ' + rows.length + ' clubs have every required role filled. Required = a head for each department plus DLO, PLO and CSLO.</p></div>' +
    rollupHtml +
    '<table class="cp-dash-table"><thead><tr><th>Club</th><th>Completion</th><th>Gaps</th></tr></thead>' +
    '<tbody>' + tableRows + '</tbody></table>';
}

/* ================= DATA CLEANUP (superadmin, one-off) =================
   Migrates the corpus to model v2 and fixes the seed's known data debt:
   - shape upgrade: email/phone -> contacts[] (handled lazily by
     ensureContacts; the persist also stamps `function` on every role)
   - AUTO merges: duplicate same-name records where at most one carries
     contact details (the 166 bare-Directors-row duplicates) or where
     contact details are identical
   - REVIEW merges: same name, DIFFERENT contact details (the work/home
     cases) — approved one by one, merging into multi-contact people
   - nameless role-holders -> club.vacant[] entries
   All writes audited; take the backup first. */

var CLEANUP = { plan: null, log: [], reviewed: {} };

function cleanupNameKey(name) { return (name || '').toLowerCase().replace(/[^a-z]/g, ''); }

function analyseCleanup() {
  var plan = { autoMerges: [], reviews: [], nameless: [], untagged: 0, legacyContacts: 0 };
  window.CLUBS.forEach(function(club) {
    var byName = {};
    club.people.forEach(function(p) {
      if (!Array.isArray(p.contacts)) plan.legacyContacts++;
      ensureContacts(p);
      (p.roles || []).forEach(function(r) { if (!r['function']) plan.untagged++; });
      if (!p.name) { plan.nameless.push({ club: club.name, id: p._id }); return; }
      var k = cleanupNameKey(p.name);
      (byName[k] = byName[k] || []).push(p);
    });
    Object.keys(byName).forEach(function(k) {
      var g = byName[k];
      if (g.length < 2) return;
      var withContact = g.filter(function(p) { return p.contacts.length > 0; });
      var valueSets = withContact.map(function(p) {
        return p.contacts.map(function(c) { return c.type + ':' + c.value.toLowerCase(); }).sort().join('|');
      });
      var distinct = {}; valueSets.forEach(function(v) { distinct[v] = 1; });
      if (withContact.length <= 1 || Object.keys(distinct).length === 1) {
        plan.autoMerges.push({ club: club.name, name: g[0].name, ids: g.map(function(p) { return p._id; }) });
      } else {
        plan.reviews.push({
          club: club.name, name: g[0].name,
          ids: g.map(function(p) { return p._id; }),
          summary: g.map(function(p) {
            return p.contacts.map(function(c) { return c.value; }).join(', ') || '(no contact)';
          })
        });
      }
    });
  });
  return plan;
}

/* Merge a group of same-name records on one club: survivor = first with
   contacts (else first). Roles moved (deduped on title+section), contacts
   unioned (deduped on type+value; survivor keeps its preferred flags). */
function cleanupMergeGroup(club, ids) {
  var group = club.people.filter(function(p) { return ids.indexOf(p._id) !== -1; });
  if (group.length < 2) return false;
  var survivor = group.filter(function(p) { return ensureContacts(p).length > 0; })[0] || group[0];
  group.forEach(function(p) {
    if (p === survivor) return;
    (p.roles || []).forEach(function(r) {
      var dup = survivor.roles.some(function(sr) { return sr.title === r.title && sr.section === r.section; });
      if (!dup) survivor.roles.push(r);
    });
    ensureContacts(p).forEach(function(c) {
      var dup = survivor.contacts.some(function(sc) {
        return sc.type === c.type && sc.value.toLowerCase() === c.value.toLowerCase();
      });
      if (!dup) survivor.contacts.push({ type: c.type, value: c.value, label: c.label || '', preferred: false });
    });
    if (!survivor.note && p.note) survivor.note = p.note;
  });
  club.people = club.people.filter(function(p) { return p === survivor || ids.indexOf(p._id) === -1; });
  syncMirrorsFromContacts(survivor);
  ensurePrimaryRole(survivor);
  return true;
}

function runAutoCleanup() {
  var plan = CLEANUP.plan;
  if (!plan) return;
  var touched = {};
  var clubsByName = {};
  window.CLUBS.forEach(function(c) { clubsByName[c.name] = c; });

  plan.autoMerges.forEach(function(g) {
    if (cleanupMergeGroup(clubsByName[g.club], g.ids)) {
      touched[g.club] = 1;
      CLEANUP.log.push('Merged ' + g.ids.length + ' records: ' + g.name + ' (' + g.club + ')');
    }
  });
  plan.nameless.forEach(function(n) {
    var club = clubsByName[n.club];
    var p = club.people.filter(function(x) { return x._id === n.id; })[0];
    if (!p) return;
    club.vacant = club.vacant || [];
    (p.roles || []).forEach(function(r) {
      club.vacant.push({ title: r.title, section: r.section,
        'function': r['function'] || functionForTitle(r.title, r.section),
        note: p.note || null, contacts: ensureContacts(p).slice() });
    });
    club.people = club.people.filter(function(x) { return x._id !== n.id; });
    touched[n.club] = 1;
    CLEANUP.log.push('Converted nameless role-holder to vacant role(s) at ' + n.club);
  });
  /* Persist every club so ALL records get the shape upgrade + function
     tagging stamped by clubToRTDB, not just the merged ones. */
  window.CLUBS.forEach(function(c) { touched[c.name] = 1; });
  cleanupPersist(Object.keys(touched),
    'Data cleanup: ' + plan.autoMerges.length + ' auto-merges, ' +
    plan.nameless.length + ' nameless->vacant, model v2 shape stamped on all clubs');
}

function applyReviewMerge(idx, doMerge) {
  var g = CLEANUP.plan.reviews[idx];
  if (!g || CLEANUP.reviewed[idx]) return;
  CLEANUP.reviewed[idx] = doMerge ? 'merged' : 'kept';
  if (doMerge) {
    var club = window.CLUBS.filter(function(c) { return c.name === g.club; })[0];
    if (cleanupMergeGroup(club, g.ids)) {
      cleanupPersist([g.club], 'Data cleanup review-merge: ' + g.name + ' at ' + g.club);
      CLEANUP.log.push('Review-merged ' + g.name + ' (' + g.club + ') into one person with combined contacts');
    }
  } else {
    CLEANUP.log.push('Kept separate: ' + g.name + ' (' + g.club + ')');
  }
  renderCleanupScene();
}

function cleanupPersist(clubNames, summary) {
  if (NL.writeAudit) NL.writeAudit('directory_cleanup', summary);
  var fdb = firebase.database();
  var session = (window.NL && NL.session) || {};
  fdb.ref(RTDB_BASE + '/audit').push({
    ts: firebase.database.ServerValue.TIMESTAMP,
    uid: session.uid || null, email: session.email || null,
    club: clubNames.length === 1 ? clubNames[0] : '(' + clubNames.length + ' clubs)',
    action: 'cleanup', detail: summary
  });
  var chain = Promise.resolve();
  clubNames.forEach(function(name) {
    var club = window.CLUBS.filter(function(c) { return c.name === name; })[0];
    if (!club) return;
    chain = chain.then(function() {
      return fdb.ref(RTDB_BASE + '/clubs/' + name).set(clubToRTDB(club));
    });
  });
  chain
    .then(function() {
      if (NL.toast) NL.toast('Cleanup written: ' + clubNames.length + ' club record(s) updated.', 'success');
      renderCleanupScene();
    })
    .catch(function(err) {
      if (NL.toast) NL.toast('Cleanup write failed: ' + (err.message || String(err)) + ' — refresh and re-run.', 'error');
    });
}

function cleanupDownloadBackup() {
  var payload = { exportedAt: new Date().toISOString(), clubs: {} };
  window.CLUBS.forEach(function(c) { payload.clubs[c.name] = clubToRTDB(c); });
  var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'ops-club-directory-backup-' + Date.now() + '.json';
  a.click();
  setTimeout(function() { URL.revokeObjectURL(a.href); }, 1000);
}

function renderCleanupScene() {
  var root = document.getElementById('cleanup-root');
  if (!root) return;
  var plan = CLEANUP.plan;
  var html = '<div class="lb-intro"><h2>Data cleanup</h2>' +
    '<p>One-off migration to the v2 people model (multi-contact people, role functions, vacant roles) plus dedupe of the handbook seed. Take the backup first.</p></div>';

  html += '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;">' +
    '<button class="btn btn--navy" id="clBackup">1 · Download backup</button>' +
    '<button class="btn btn--ghost" id="clAnalyse">2 · Analyse</button>' +
    (plan ? '<button class="btn btn--primary" id="clRun">3 · Run auto cleanup</button>' : '') +
  '</div>';

  if (plan) {
    html += '<div class="cp-facts" style="border:1px solid var(--border);margin-bottom:18px;">' +
      '<div class="cp-fact"><div class="cp-fact__label">Auto-merges</div><div class="cp-fact__value">' + plan.autoMerges.length + '</div><div class="cp-fact__sub">bare/identical duplicates</div></div>' +
      '<div class="cp-fact"><div class="cp-fact__label">Review merges</div><div class="cp-fact__value">' + plan.reviews.length + '</div><div class="cp-fact__sub">different contacts — your call</div></div>' +
      '<div class="cp-fact"><div class="cp-fact__label">Nameless &rarr; vacant</div><div class="cp-fact__value">' + plan.nameless.length + '</div></div>' +
      '<div class="cp-fact"><div class="cp-fact__label">Legacy-shape people</div><div class="cp-fact__value">' + plan.legacyContacts + '</div><div class="cp-fact__sub">upgraded on write</div></div>' +
    '</div>';

    if (plan.reviews.length) {
      html += '<h3 style="margin:18px 0 10px;">Review: same name, different contact details</h3>' +
        '<div style="display:grid;gap:8px;">';
      plan.reviews.forEach(function(g, i) {
        var state2 = CLEANUP.reviewed[i];
        html += '<div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 14px;background:var(--white);border:1px solid var(--border);border-radius:8px;">' +
          '<b>' + esc(g.name) + '</b><span class="pill pill--identifier">' + esc(g.club) + '</span>' +
          '<span style="flex:1;font-size:12px;color:var(--text-muted);">' + g.summary.map(esc).join(' &nbsp;vs&nbsp; ') + '</span>' +
          (state2
            ? '<span class="pill pill--status ' + (state2 === 'merged' ? 'pill--status-good' : '') + '">' + state2 + '</span>'
            : '<button class="btn btn--navy btn--sm" data-cl-merge="' + i + '">Merge</button>' +
              '<button class="btn btn--ghost btn--sm" data-cl-keep="' + i + '">Keep separate</button>') +
        '</div>';
      });
      html += '</div>';
    }
  }

  if (CLEANUP.log.length) {
    html += '<h3 style="margin:18px 0 10px;">Log</h3><div style="font-size:12px;color:var(--text-muted);display:grid;gap:3px;">' +
      CLEANUP.log.slice(-40).map(function(l) { return '<div>' + esc(l) + '</div>'; }).join('') + '</div>';
  }
  root.innerHTML = html;
}

window.TOOL = window.TOOL || {};
window.TOOL.boot = function (session) {
  state.persona = personaFromSession(session);

  fetch(CLUBS_META_URL + '?cb=' + Date.now())
    .then(function(r) {
      if (!r.ok) throw new Error('clubs-meta fetch failed (' + r.status + ')');
      return r.json();
    })
    .then(function(meta) {
      buildWorkingData(meta);
      if (isClubPersona()) {
        EDITOR_CLUB = resolveOwnClub(session, meta.clubs || []);
        if (!EDITOR_CLUB && NL.toast) {
          NL.toast('Your account’s club (“' + (session.club || 'not set') + '”) was not found in the current roster — contact NL staff.', 'error');
        }
      }
      return loadRTDBClubs();
    })
    .then(function() {
      wireUI();
    })
    .catch(function(err) {
      var root = document.getElementById('listing-root');
      if (root) {
        root.innerHTML = '<p style="color:var(--red);padding:24px 0;">Failed to load club data — ' +
          esc(err.message || String(err)) + '. Refresh to retry.</p>';
      }
    });
};

/* auth-guard may have verified the session before this script parsed. */
if (window._toolDeferredSession) {
  window.TOOL.boot(window._toolDeferredSession);
  window._toolDeferredSession = null;
}
</script>
