/* Map the verified auth-guard session onto the tool's persona model. */
function personaFromSession(session) {
  var role = session && session.role;
  if (role === 'admin' || role === 'superadmin') return 'admin';
  if (role === 'staff') return 'staff';
  if (role === 'club' || role === 'club-admin') return 'club-editor';
  if (role === 'club-viewer') return 'club-viewer';
  return 'viewer';
}

/* Resolve session.club (display name, occasionally a slug — same tolerant
   convention as programme-packs) to a canonical clubs-meta name. */
function resolveOwnClub(session, metaClubs) {
  var raw = session && session.club;
  if (!raw) return null;
  var i, c;
  for (i = 0; i < metaClubs.length; i++) {
    if (metaClubs[i].name === raw) return metaClubs[i].name;
  }
  var slug = String(raw).toLowerCase().replace(/[^a-z0-9]+/g, '');
  for (i = 0; i < metaClubs.length; i++) {
    c = metaClubs[i].name.toLowerCase().replace(/[^a-z0-9]+/g, '');
    if (c === slug || c.indexOf(slug) !== -1) return metaClubs[i].name;
  }
  return null;
}

/* Build the working datasets from live clubs-meta + the inline seed:
   - window.CLUBS_META: name-keyed map of full meta records (current roster).
   - window.CLUBS: directory list = CURRENT SEASON clubs. Continuing clubs
     keep their seed people/contacts; new entrants get an empty record
     (people to be filled in by the club/staff). Departed clubs drop out. */
function buildWorkingData(meta) {
  var current = NL.season.clubsFor(meta);   // current season, division resolved
  var seedByName = {};
  (window.CLUBS || []).forEach(function(c) { seedByName[c.name] = c; });

  window.CLUBS_META = {};
  current.forEach(function(mc) { window.CLUBS_META[mc.name] = mc; });

  window.CLUBS = current.map(function(mc) {
    return seedByName[mc.name] || {
      name: mc.name,
      phone: null,
      email: null,
      website: mc.domain ? 'www.' + mc.domain : null,
      people: []
    };
  });
  migrateSections();   // remap legacy Kit/Ticketing roles into their new departments
}

var CLUBS_META_URL = 'https://raw.githubusercontent.com/thenationalleague/tools/refs/heads/main/assets/data/clubs-meta.json';

/* ================= RTDB persistence (phase C) =================
   People + club contact details live in RTDB at
   app-data/ops-club-directory/clubs/<clubName>. Rules: any signed-in user
   reads; a club user writes their own club; admin/superadmin write any.
   Every save also lands a tool-local audit entry (admin-readable) plus
   the platform-wide admin/audit hook entry.
   Until the node is seeded (one-off superadmin import of the handbook
   corpus), the inline seed renders read-only and manage is disabled. */
/* ================= PEOPLE MODEL v2 =================
   Three concepts (assessment 10/06/2026):
   - Person: the human. Carries contacts[] — multiple emails/phones, each
     {type:'email'|'phone', value, label, preferred} (work/home etc).
     person.email / person.phone remain as MIRRORS of the preferred
     contact of each type, so every existing read site stays correct.
   - Assignment (the roles[] entries): a job at the club. Gains
     `function` — a closed, League-owned key for cross-club queries (the
     club's free-text `title` is untouched) — and may carry its own
     contacts[] (role inboxes like secretary@ that outlive the holder).
   - Vacant assignment: club.vacant[] — a role with a contact route but
     no named person (was modelled as nameless people). */

var FUNCTIONS = {
  chair: 'Chair', vicechair: 'Vice Chair', president: 'President', owner: 'Owner',
  director: 'Director', ceo: 'Chief Executive', gm: 'General Manager',
  secretary: 'Club Secretary', fixtures: 'Fixture Secretary', finance: 'Finance',
  commercial: 'Commercial', press: 'Press / Media', social: 'Website / Social',
  programme: 'Programme Editor', marketing: 'Marketing', safety: 'Safety Officer',
  operations: 'Operations', kit: 'Kit Manager', doctor: 'Club Doctor',
  physio: 'Physio / Therapist', community: 'Community',
  safeguarding: 'Safeguarding / Welfare',
  dlo: 'Disability Liaison Officer', plo: 'Police Liaison Officer',
  cslo: 'Competition Sponsorship Liaison Officer', slo: 'Supporter Liaison Officer',
  other: 'Other'
};

/* Best-effort title -> function mapping. Built from the title-variance
   analysis of the 2025 corpus; unmapped titles fall to 'other'. */
function functionForTitle(title, section) {
  var t = (title || '').toLowerCase();
  if (/disab/.test(t) && /liaison/.test(t)) return 'dlo';
  if (/police/.test(t) && /liaison/.test(t)) return 'plo';
  if (/(competition )?sponsorship liaison/.test(t)) return 'cslo';
  if (/supporter/.test(t) && /liaison/.test(t)) return 'slo';
  if (section === 'Directors') return 'director';
  if (/vice[- ]?chair/.test(t)) return 'vicechair';
  if (/chair/.test(t)) return 'chair';
  if (/president/.test(t)) return 'president';
  if (/owner/.test(t)) return 'owner';
  if (/chief exec|\bceo\b/.test(t)) return 'ceo';
  if (/general manager|managing director/.test(t)) return 'gm';
  if (/fixture/.test(t)) return 'fixtures';
  if (/secretar/.test(t)) return 'secretary';
  if (/financ|account|treasur/.test(t)) return 'finance';
  if (/ticket|box office/.test(t)) return 'ticketing';
  if (/commercial|sponsorship|sales|partnership|retail/.test(t)) return 'commercial';
  if (/programme/.test(t)) return 'programme';
  if (/website|social/.test(t)) return 'social';
  if (/press|\bmedia\b/.test(t)) return 'press';
  if (/marketing|communications/.test(t)) return 'marketing';
  if (/safety/.test(t)) return 'safety';
  if (/operation/.test(t)) return 'operations';
  if (/\bkit\b/.test(t)) return 'kit';
  if (/doctor/.test(t)) return 'doctor';
  if (/physio|therapist|sports science/.test(t)) return 'physio';
  if (/community/.test(t)) return 'community';
  if (/welfare|safeguard/.test(t)) return 'safeguarding';
  if (/director/.test(t)) return 'director';
  return 'other';
}

/* ---- Contact helpers. The mirrors (person.email/.phone) always equal
   the preferred contact of each type; these keep both views in sync. ---- */

function ensureContacts(p) {
  if (!Array.isArray(p.contacts)) {
    p.contacts = [];
    if (p.email) p.contacts.push({ type: 'email', value: p.email, label: '', preferred: true });
    if (p.phone) p.contacts.push({ type: 'phone', value: p.phone, label: '', preferred: true });
  }
  return p.contacts;
}

function preferredContact(p, type) {
  var cs = (p.contacts || []).filter(function(c) { return c.type === type && c.value; });
  var pref = cs.filter(function(c) { return c.preferred; })[0];
  return (pref || cs[0] || {}).value || null;
}

/* All email values for a person, preferred first (display + list export). */
function personEmails(p) {
  if (!Array.isArray(p.contacts)) return p.email ? [p.email] : [];
  var cs = p.contacts.filter(function(c) { return c.type === 'email' && c.value; });
  cs.sort(function(a, b) { return (b.preferred ? 1 : 0) - (a.preferred ? 1 : 0); });
  return cs.map(function(c) { return c.value; });
}

/* Mirrors edited via the person panel -> write back into contacts[]
   (update the preferred entry's value, or create it). Secondary
   contacts are preserved untouched. */
function syncContactsFromMirrors(p) {
  ensureContacts(p);
  ['email', 'phone'].forEach(function(type) {
    var val = p[type] || null;
    var cs = p.contacts.filter(function(c) { return c.type === type; });
    var pref = cs.filter(function(c) { return c.preferred; })[0] || cs[0];
    if (val) {
      if (pref) { pref.value = val; pref.preferred = true; }
      else p.contacts.push({ type: type, value: val, label: '', preferred: true });
    } else if (pref) {
      p.contacts.splice(p.contacts.indexOf(pref), 1);
    }
  });
}

/* Recompute mirrors from contacts (after a merge or RTDB load). */
function syncMirrorsFromContacts(p) {
  p.email = preferredContact(p, 'email');
  p.phone = preferredContact(p, 'phone');
}

var RTDB_BASE = 'app-data/ops-club-directory';
var RTDB = { seeded: false };

/* Serialize a working club record for RTDB. People keyed by _id; roles
   stored as arrays (RTDB re-indexes them; normalised back on read).
   email_private/phone_private are deliberately dropped — the directory
   is behind login, there is no private tier (decision 10/06/2026). */
function clubToRTDB(club) {
  function packContacts(cs) {
    return (cs || []).filter(function(c) { return c && c.value; }).map(function(c) {
      var o = { type: c.type, value: c.value };
      if (c.label) o.label = c.label;
      if (c.preferred) o.preferred = true;
      return o;
    });
  }
  function packRole(r) {
    var o = { title: r.title || '', section: r.section || '', main: !!r.main };
    if (r.flags) o.flags = r.flags;
    o['function'] = r['function'] || functionForTitle(r.title, r.section);
    var rc = packContacts(r.contacts);
    if (rc.length) o.contacts = rc;
    return o;
  }
  var people = {};
  (club.people || []).forEach(function(p, i) {
    var id = p._id || ('p' + (i + 1));
    ensureContacts(p);
    people[id] = {
      name: p.name || '',
      email: preferredContact(p, 'email'),
      phone: preferredContact(p, 'phone'),
      note: p.note || null,
      noEmail: !!p.noEmail || null,
      noPhone: !!p.noPhone || null,
      listOverrides: (p.listOverrides && Object.keys(p.listOverrides).length) ? p.listOverrides : null,
      contacts: packContacts(p.contacts),
      roles: (p.roles || []).map(packRole)
    };
  });
  var out = {
    contact: { phone: club.phone || null, email: club.email || null, website: club.website || null },
    people: people
  };
  var vac = (club.vacant || []).map(function(v) {
    var o = { title: v.title || '', section: v.section || '' };
    o['function'] = v['function'] || functionForTitle(v.title, v.section);
    if (v.note) o.note = v.note;
    var vc = packContacts(v.contacts);
    if (vc.length) o.contacts = vc;
    return o;
  });
  if (vac.length) out.vacant = vac;
  return out;
}

/* Inflate an RTDB record back into the working shape. Tolerates RTDB's
   array→object coercion and missing nodes. People sorted by numeric _id
   suffix for stable ordering. */
function clubFromRTDB(name, val, fallbackWebsite) {
  var rec = { name: name, phone: null, email: null, website: fallbackWebsite || null, people: [], vacant: [] };
  if (!val) return rec;
  var c = val.contact || {};
  rec.phone = c.phone || null;
  rec.email = c.email || null;
  rec.website = c.website || fallbackWebsite || null;
  function arr(x) { return !x ? [] : (Array.isArray(x) ? x : Object.keys(x).map(function(k) { return x[k]; })); }
  function unpackContacts(cs) {
    return arr(cs).map(function(x) {
      return { type: x.type, value: x.value || '', label: x.label || '', preferred: !!x.preferred };
    });
  }
  function unpackRole(r) {
    var section = remapSectionForRole(r.section || '', r.title || '');
    var o = { title: r.title || '', section: section, main: !!r.main };
    if (r.flags) o.flags = r.flags;
    o['function'] = r['function'] || functionForTitle(r.title, r.section);
    o.contacts = unpackContacts(r.contacts);
    return o;
  }
  var people = val.people || {};
  Object.keys(people).forEach(function(id) {
    var p = people[id] || {};
    var person = {
      _id: id,
      name: p.name || '',
      email: p.email || null,
      phone: p.phone || null,
      note: p.note || null,
      noEmail: !!p.noEmail,
      noPhone: !!p.noPhone,
      listOverrides: p.listOverrides || {},
      roles: arr(p.roles).map(unpackRole)
    };
    if (p.contacts) {
      person.contacts = unpackContacts(p.contacts);
      syncMirrorsFromContacts(person);
    } else {
      ensureContacts(person);   /* legacy record: derive contacts from mirrors */
    }
    rec.people.push(person);
  });
  rec.people.sort(function(a, b) {
    var na = parseInt((/^p(\d+)$/.exec(a._id) || [])[1] || '0', 10);
    var nb = parseInt((/^p(\d+)$/.exec(b._id) || [])[1] || '0', 10);
    return na - nb;
  });
  rec.vacant = arr(val.vacant).map(function(v) {
    return { title: v.title || '', section: v.section || '',
             'function': v['function'] || functionForTitle(v.title, v.section),
             note: v.note || null, contacts: unpackContacts(v.contacts) };
  });
  return rec;
}

/* Keep the runtime ID counter above every ID seen in RTDB so new people
   never collide with existing keys. */
function bumpPersonIdCounter() {
  var max = 0;
  window.CLUBS.forEach(function(c) {
    c.people.forEach(function(p) {
      var m = /^p(\d+)$/.exec(p._id || '');
      if (m) max = Math.max(max, parseInt(m[1], 10));
    });
  });
  if (max >= _nextPersonId) _nextPersonId = max + 1;
}

/* Read the RTDB corpus. If present it REPLACES the inline seed as the
   working data (roster still comes from clubs-meta — RTDB records for
   departed clubs are simply left untouched in the DB). If absent, the
   inline seed stays, read-only, awaiting the one-off import. */
function loadRTDBClubs() {
  return NL.ensureAuth()
    .then(function() {
      return firebase.database().ref(RTDB_BASE + '/clubs').once('value');
    })
    .then(function(snap) {
      var data = snap.val();
      if (!data) { RTDB.seeded = false; return; }
      RTDB.seeded = true;
      window.CLUBS = window.CLUBS.map(function(c) {
        var meta = window.CLUBS_META[c.name] || {};
        return clubFromRTDB(c.name, data[c.name], meta.domain ? 'www.' + meta.domain : null);
      });
      bumpPersonIdCounter();
    });
}

/* Persist one club's record after an in-memory mutation, with audit.
   NL.writeAudit first (rich admin/audit entry + suppresses the auto-hook
   for the writes below), then the tool-local audit push, then the data. */
function persistClub(club, action, detail) {
  if (!RTDB.seeded) return;   /* manage is hidden pre-seed; safety net */
  var session = (window.NL && NL.session) || {};
  if (NL.writeAudit) NL.writeAudit('directory_' + action, detail);
  var fdb = firebase.database();
  fdb.ref(RTDB_BASE + '/audit').push({
    ts: firebase.database.ServerValue.TIMESTAMP,
    uid: session.uid || null,
    email: session.email || null,
    club: club.name,
    action: action,
    detail: detail
  });
  fdb.ref(RTDB_BASE + '/clubs/' + club.name).set(clubToRTDB(club))
    .catch(function(err) {
      if (NL.toast) NL.toast('Save failed — ' + (err.message || String(err)) + '. Refresh to re-sync before editing further.', 'error');
    });
}

/* One-off superadmin import: writes the assembled working data (inline
   2025 handbook seed mapped onto the current roster) into RTDB. Refuses
   if the node already has data. */
function seedRTDBFromInline() {
  var btn = document.getElementById('cdSeedBtn');
  if (btn) { btn.disabled = true; btn.textContent = 'Importing…'; }
  NL.ensureAuth()
    .then(function() {
      return firebase.database().ref(RTDB_BASE + '/clubs').once('value');
    })
    .then(function(snap) {
      if (snap.val()) throw new Error('RTDB already has directory data — not overwriting.');
      ensurePersonIds();
      var payload = {};
      window.CLUBS.forEach(function(c) { payload[c.name] = clubToRTDB(c); });
      if (NL.writeAudit) NL.writeAudit('directory_seed', 'Imported handbook seed corpus: ' + window.CLUBS.length + ' clubs');
      return firebase.database().ref(RTDB_BASE + '/clubs').set(payload);
    })
    .then(function() { return loadRTDBClubs(); })
    .then(function() {
      if (NL.toast) NL.toast('Directory data imported — live editing is now enabled.', 'success');
      showScene();
    })
    .catch(function(err) {
      if (NL.toast) NL.toast('Import failed: ' + (err.message || String(err)), 'error');
      if (btn) { btn.disabled = false; btn.textContent = 'Import handbook seed data'; }
    });
}

/* ================= COMPLETION DASHBOARD =================
   "Complete" = the club has someone on every REQUIRED mailing list. The
   required lists (Secretaries, Safety, Safeguarding, DLO, PLO, CSLO) are the
   single League-owned definition of what every club must cover — the same one
   the list builder and the club picker read, so there is one source of truth. */

function requiredLists() {
  return MAILING_LISTS.filter(function(l){ return l.required; });
}

function clubCompliance(club) {
  var req = requiredLists();
  var missing = req.filter(function(l) {
    return !(club.people || []).some(function(p){ return personOnList(p, l.key); });
  });
  return { missing: missing, total: req.length, filled: req.length - missing.length,
           missingCount: missing.length, complete: missing.length === 0,
           hasPeople: club.people.length > 0 };
}

function complianceMeter(c) {
  var pct = c.total ? Math.round((c.filled / c.total) * 100) : 0;
  var col = c.complete ? 'var(--green)' : (pct >= 60 ? 'var(--amber)' : 'var(--red)');
  return '<div class="cp-meter"><div class="cp-meter__bar" style="width:' + pct + '%;background:' + col + ';"></div></div>' +
         '<span class="cp-meter__label">' + c.filled + '/' + c.total + '</span>';
}

function renderDashboardScene() {
  var root = document.getElementById('dashboard-root');
  if (!root) return;
  if (isClubPersona()) { renderClubDashboard(root); return; }
  renderLeagueDashboard(root);
}

/* Club editor: their own checklist. */
function renderClubDashboard(root) {
  var club = window.CLUBS.filter(function(c){ return c.name === EDITOR_CLUB; })[0];
  if (!club) { root.innerHTML = '<div class="lb-empty">No club associated with your account.</div>'; return; }
  var c = clubCompliance(club);
  var missingKeys = c.missing.map(function(l){ return l.key; });

  function item(ok, label) {
    return '<div class="cp-check ' + (ok ? 'cp-check--ok' : 'cp-check--gap') + '">' +
      '<span class="cp-check__icon">' + (ok ? '\u2713' : '\u2715') + '</span>' +
      '<span class="cp-check__label">' + esc(label) + '</span>' +
      (!ok ? '<span class="cp-check__hint">Nobody on this list yet</span>' : '') +
    '</div>';
  }
  var checks = requiredLists().map(function(l) {
    return item(missingKeys.indexOf(l.key) === -1, l.label);
  }).join('');

  root.innerHTML =
    '<div class="lb-intro"><h2>' + esc(club.name) + ' — directory completion</h2>' +
      '<p>' + (c.complete
        ? 'Every required mailing list has someone on it. Nice.'
        : c.missingCount + ' required list' + (c.missingCount === 1 ? '' : 's') + ' with nobody on them. Use <b>Manage my club</b> to add people.') +
      '</p></div>' +
    '<div class="cp-dash-meter">' + complianceMeter(c) + '</div>' +
    '<h3 class="cp-dash-h3">Required mailing lists</h3><div class="cp-checks">' + checks + '</div>';
}

/* Staff / admin: league-wide compliance — rollup + per-club table. */
function renderLeagueDashboard(root) {
  var clubs = window.CLUBS.slice().sort(function(a,b){ return a.name.localeCompare(b.name); });
  var rows = clubs.map(function(club) {
    return { name: club.name, division: divisionOf(club.name), c: clubCompliance(club) };
  });

  /* Requirement rollup: how many clubs miss each required list. */
  var rollup = {};
  requiredLists().forEach(function(l){ rollup[l.key] = { label: l.label, n: 0 }; });
  rows.forEach(function(r) {
    r.c.missing.forEach(function(l){ rollup[l.key].n++; });
  });
  var gaps = Object.keys(rollup).map(function(k){ return rollup[k]; })
    .filter(function(g){ return g.n > 0; }).sort(function(a,b){ return b.n - a.n; });

  var complete = rows.filter(function(r){ return r.c.complete; }).length;

  var rollupHtml = gaps.length
    ? '<div class="cp-rollup">' + gaps.map(function(g) {
        return '<div class="cp-rollup__item"><span class="cp-rollup__n">' + g.n + '</span>' +
          '<span class="cp-rollup__lbl">clubs missing ' + esc(g.label) + '</span></div>';
      }).join('') + '</div>'
    : '<p style="color:var(--green);">Every club has someone on every required list.</p>';

  var tableRows = rows.map(function(r) {
    var gapList = r.c.missing.map(function(l){ return l.label; });
    return '<tr data-club="' + esc(r.name) + '" class="cp-dash-row">' +
      '<td><div class="lb-club-cell"><img src="' + crestUrl(r.name) + '" alt="" onerror="this.onerror=null;this.src=\'' + fallbackCrest() + '\'"><span>' + esc(r.name) + '</span></div></td>' +
      '<td class="cp-dash-meter-cell">' + complianceMeter(r.c) + '</td>' +
      '<td class="cp-dash-gaps">' + (gapList.length ? esc(gapList.join(', ')) : '<span style="color:var(--green);">complete</span>') + '</td>' +
    '</tr>';
  }).join('');

  root.innerHTML =
    '<div class="lb-intro"><h2>League directory completion</h2>' +
      '<p>' + complete + ' of ' + rows.length + ' clubs have someone on every required mailing list (Secretaries, Safety, Safeguarding, DLO, PLO, CSLO).</p></div>' +
    rollupHtml +
    '<table class="cp-dash-table"><thead><tr><th>Club</th><th>Completion</th><th>Gaps</th></tr></thead>' +
    '<tbody>' + tableRows + '</tbody></table>';
}

/* ================= DATA CLEANUP (superadmin, one-off) =================
   Migrates the corpus to model v2 and fixes the seed's known data debt:
   - shape upgrade: email/phone -> contacts[] (handled lazily by
     ensureContacts; the persist also stamps `function` on every role)
   - AUTO merges: duplicate same-name records where at most one carries
     contact details (the 166 bare-Directors-row duplicates) or where
     contact details are identical
   - REVIEW merges: same name, DIFFERENT contact details (the work/home
     cases) — approved one by one, merging into multi-contact people
   - nameless role-holders -> club.vacant[] entries
   All writes audited; take the backup first. */

var CLEANUP = { plan: null, log: [], reviewed: {} };

function cleanupNameKey(name) { return (name || '').toLowerCase().replace(/[^a-z]/g, ''); }

function analyseCleanup() {
  var plan = { autoMerges: [], reviews: [], nameless: [], untagged: 0, legacyContacts: 0 };
  window.CLUBS.forEach(function(club) {
    var byName = {};
    club.people.forEach(function(p) {
      if (!Array.isArray(p.contacts)) plan.legacyContacts++;
      ensureContacts(p);
      (p.roles || []).forEach(function(r) { if (!r['function']) plan.untagged++; });
      if (!p.name) { plan.nameless.push({ club: club.name, id: p._id }); return; }
      var k = cleanupNameKey(p.name);
      (byName[k] = byName[k] || []).push(p);
    });
    Object.keys(byName).forEach(function(k) {
      var g = byName[k];
      if (g.length < 2) return;
      var withContact = g.filter(function(p) { return p.contacts.length > 0; });
      var valueSets = withContact.map(function(p) {
        return p.contacts.map(function(c) { return c.type + ':' + c.value.toLowerCase(); }).sort().join('|');
      });
      var distinct = {}; valueSets.forEach(function(v) { distinct[v] = 1; });
      if (withContact.length <= 1 || Object.keys(distinct).length === 1) {
        plan.autoMerges.push({ club: club.name, name: g[0].name, ids: g.map(function(p) { return p._id; }) });
      } else {
        plan.reviews.push({
          club: club.name, name: g[0].name,
          ids: g.map(function(p) { return p._id; }),
          summary: g.map(function(p) {
            return p.contacts.map(function(c) { return c.value; }).join(', ') || '(no contact)';
          })
        });
      }
    });
  });
  return plan;
}

/* Merge a group of same-name records on one club: survivor = first with
   contacts (else first). Roles moved (deduped on title+section), contacts
   unioned (deduped on type+value; survivor keeps its preferred flags). */
function cleanupMergeGroup(club, ids) {
  var group = club.people.filter(function(p) { return ids.indexOf(p._id) !== -1; });
  if (group.length < 2) return false;
  var survivor = group.filter(function(p) { return ensureContacts(p).length > 0; })[0] || group[0];
  group.forEach(function(p) {
    if (p === survivor) return;
    (p.roles || []).forEach(function(r) {
      var dup = survivor.roles.some(function(sr) { return sr.title === r.title && sr.section === r.section; });
      if (!dup) survivor.roles.push(r);
    });
    ensureContacts(p).forEach(function(c) {
      var dup = survivor.contacts.some(function(sc) {
        return sc.type === c.type && sc.value.toLowerCase() === c.value.toLowerCase();
      });
      if (!dup) survivor.contacts.push({ type: c.type, value: c.value, label: c.label || '', preferred: false });
    });
    if (!survivor.note && p.note) survivor.note = p.note;
  });
  club.people = club.people.filter(function(p) { return p === survivor || ids.indexOf(p._id) === -1; });
  syncMirrorsFromContacts(survivor);
  ensurePrimaryRole(survivor);
  return true;
}

function runAutoCleanup() {
  var plan = CLEANUP.plan;
  if (!plan) return;
  var touched = {};
  var clubsByName = {};
  window.CLUBS.forEach(function(c) { clubsByName[c.name] = c; });

  plan.autoMerges.forEach(function(g) {
    if (cleanupMergeGroup(clubsByName[g.club], g.ids)) {
      touched[g.club] = 1;
      CLEANUP.log.push('Merged ' + g.ids.length + ' records: ' + g.name + ' (' + g.club + ')');
    }
  });
  plan.nameless.forEach(function(n) {
    var club = clubsByName[n.club];
    var p = club.people.filter(function(x) { return x._id === n.id; })[0];
    if (!p) return;
    club.vacant = club.vacant || [];
    (p.roles || []).forEach(function(r) {
      club.vacant.push({ title: r.title, section: r.section,
        'function': r['function'] || functionForTitle(r.title, r.section),
        note: p.note || null, contacts: ensureContacts(p).slice() });
    });
    club.people = club.people.filter(function(x) { return x._id !== n.id; });
    touched[n.club] = 1;
    CLEANUP.log.push('Converted nameless role-holder to vacant role(s) at ' + n.club);
  });
  /* Persist every club so ALL records get the shape upgrade + function
     tagging stamped by clubToRTDB, not just the merged ones. */
  window.CLUBS.forEach(function(c) { touched[c.name] = 1; });
  cleanupPersist(Object.keys(touched),
    'Data cleanup: ' + plan.autoMerges.length + ' auto-merges, ' +
    plan.nameless.length + ' nameless->vacant, model v2 shape stamped on all clubs');
}

function applyReviewMerge(idx, doMerge) {
  var g = CLEANUP.plan.reviews[idx];
  if (!g || CLEANUP.reviewed[idx]) return;
  CLEANUP.reviewed[idx] = doMerge ? 'merged' : 'kept';
  if (doMerge) {
    var club = window.CLUBS.filter(function(c) { return c.name === g.club; })[0];
    if (cleanupMergeGroup(club, g.ids)) {
      cleanupPersist([g.club], 'Data cleanup review-merge: ' + g.name + ' at ' + g.club);
      CLEANUP.log.push('Review-merged ' + g.name + ' (' + g.club + ') into one person with combined contacts');
    }
  } else {
    CLEANUP.log.push('Kept separate: ' + g.name + ' (' + g.club + ')');
  }
  renderCleanupScene();
}

function cleanupPersist(clubNames, summary) {
  if (NL.writeAudit) NL.writeAudit('directory_cleanup', summary);
  var fdb = firebase.database();
  var session = (window.NL && NL.session) || {};
  fdb.ref(RTDB_BASE + '/audit').push({
    ts: firebase.database.ServerValue.TIMESTAMP,
    uid: session.uid || null, email: session.email || null,
    club: clubNames.length === 1 ? clubNames[0] : '(' + clubNames.length + ' clubs)',
    action: 'cleanup', detail: summary
  });
  var chain = Promise.resolve();
  clubNames.forEach(function(name) {
    var club = window.CLUBS.filter(function(c) { return c.name === name; })[0];
    if (!club) return;
    chain = chain.then(function() {
      return fdb.ref(RTDB_BASE + '/clubs/' + name).set(clubToRTDB(club));
    });
  });
  chain
    .then(function() {
      if (NL.toast) NL.toast('Cleanup written: ' + clubNames.length + ' club record(s) updated.', 'success');
      renderCleanupScene();
    })
    .catch(function(err) {
      if (NL.toast) NL.toast('Cleanup write failed: ' + (err.message || String(err)) + ' — refresh and re-run.', 'error');
    });
}

function cleanupDownloadBackup() {
  var payload = { exportedAt: new Date().toISOString(), clubs: {} };
  window.CLUBS.forEach(function(c) { payload.clubs[c.name] = clubToRTDB(c); });
  var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'ops-club-directory-backup-' + Date.now() + '.json';
  a.click();
  setTimeout(function() { URL.revokeObjectURL(a.href); }, 1000);
}

function renderCleanupScene() {
  var root = document.getElementById('cleanup-root');
  if (!root) return;
  var plan = CLEANUP.plan;
  var html = '<div class="lb-intro"><h2>Data cleanup</h2>' +
    '<p>One-off migration to the v2 people model (multi-contact people, role functions, vacant roles) plus dedupe of the handbook seed. Take the backup first.</p></div>';

  html += '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;">' +
    '<button class="btn btn--navy" id="clBackup">1 · Download backup</button>' +
    '<button class="btn btn--ghost" id="clAnalyse">2 · Analyse</button>' +
    (plan ? '<button class="btn btn--primary" id="clRun">3 · Run auto cleanup</button>' : '') +
  '</div>';

  if (plan) {
    html += '<div class="cp-facts" style="border:1px solid var(--border);margin-bottom:18px;">' +
      '<div class="cp-fact"><div class="cp-fact__label">Auto-merges</div><div class="cp-fact__value">' + plan.autoMerges.length + '</div><div class="cp-fact__sub">bare/identical duplicates</div></div>' +
      '<div class="cp-fact"><div class="cp-fact__label">Review merges</div><div class="cp-fact__value">' + plan.reviews.length + '</div><div class="cp-fact__sub">different contacts — your call</div></div>' +
      '<div class="cp-fact"><div class="cp-fact__label">Nameless &rarr; vacant</div><div class="cp-fact__value">' + plan.nameless.length + '</div></div>' +
      '<div class="cp-fact"><div class="cp-fact__label">Legacy-shape people</div><div class="cp-fact__value">' + plan.legacyContacts + '</div><div class="cp-fact__sub">upgraded on write</div></div>' +
    '</div>';

    if (plan.reviews.length) {
      html += '<h3 style="margin:18px 0 10px;">Review: same name, different contact details</h3>' +
        '<div style="display:grid;gap:8px;">';
      plan.reviews.forEach(function(g, i) {
        var state2 = CLEANUP.reviewed[i];
        html += '<div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 14px;background:var(--white);border:1px solid var(--border);border-radius:8px;">' +
          '<b>' + esc(g.name) + '</b><span class="pill pill--identifier">' + esc(g.club) + '</span>' +
          '<span style="flex:1;font-size:12px;color:var(--text-muted);">' + g.summary.map(esc).join(' &nbsp;vs&nbsp; ') + '</span>' +
          (state2
            ? '<span class="pill pill--status ' + (state2 === 'merged' ? 'pill--status-good' : '') + '">' + state2 + '</span>'
            : '<button class="btn btn--navy btn--sm" data-cl-merge="' + i + '">Merge</button>' +
              '<button class="btn btn--ghost btn--sm" data-cl-keep="' + i + '">Keep separate</button>') +
        '</div>';
      });
      html += '</div>';
    }
  }

  if (CLEANUP.log.length) {
    html += '<h3 style="margin:18px 0 10px;">Log</h3><div style="font-size:12px;color:var(--text-muted);display:grid;gap:3px;">' +
      CLEANUP.log.slice(-40).map(function(l) { return '<div>' + esc(l) + '</div>'; }).join('') + '</div>';
  }
  root.innerHTML = html;
}

window.TOOL = window.TOOL || {};
window.TOOL.boot = function (session) {
  state.persona = personaFromSession(session);

  fetch(CLUBS_META_URL + '?cb=' + Date.now())
    .then(function(r) {
      if (!r.ok) throw new Error('clubs-meta fetch failed (' + r.status + ')');
      return r.json();
    })
    .then(function(meta) {
      buildWorkingData(meta);
      if (isClubPersona()) {
        EDITOR_CLUB = resolveOwnClub(session, meta.clubs || []);
        if (!EDITOR_CLUB && NL.toast) {
          NL.toast('Your account’s club (“' + (session.club || 'not set') + '”) was not found in the current roster — contact NL staff.', 'error');
        }
      }
      return loadRTDBClubs();
    })
    .then(function() {
      wireUI();
    })
    .catch(function(err) {
      var root = document.getElementById('listing-root');
      if (root) {
        root.innerHTML = '<p style="color:var(--red);padding:24px 0;">Failed to load club data — ' +
          esc(err.message || String(err)) + '. Refresh to retry.</p>';
      }
    });
};

/* auth-guard may have verified the session before this script parsed. */
if (window._toolDeferredSession) {
  window.TOOL.boot(window._toolDeferredSession);
  window._toolDeferredSession = null;
}
