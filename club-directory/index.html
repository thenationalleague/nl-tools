<!--
  club-directory / index.html
  v0.25 — Per-person directory visibility, encouraged contacts, no-flash panel.

  Changelog:
  v0.25 — (15/06/2026) Person panel: in-place refresh + visibility + contact
          discipline.
          - FLASH FIX: adding/removing a role or contact row, and changing a
            role section / dept-head / contact type, called renderEditor()
            which rebuilt the whole editor INCLUDING the panel overlay, so the
            slide-in animation replayed ("flash out/in"). Split renderPersonPanel
            into a wrapper + renderPersonPanelInner(); new refreshPersonPanel()
            swaps only the open panel's innerHTML, leaving the overlay/panel
            element intact. Draft is already synced live by the input/change
            handlers so nothing is lost; +Add email/phone now focuses the new row.
          - VISIBILITY: each person carries visibility ∈ public|staff|hidden
            (default staff). Editor select + manage-list badge. lbResults()
            drops hidden people from generated lists/exports; the future public
            site will further restrict to 'public'. Persisted in clubToRTDB /
            inflated in clubFromRTDB; ensurePersonIds() defaults legacy records
            to 'staff'.
          - CONTACT DISCIPLINE: new people seed a blank email + phone row.
            Save requires an email and a phone OR the matching "No email/phone
            on file" checkbox (draft.noEmail/noPhone, persisted) — no silent
            blanks.
  v0.24 — (14/06/2026) Person modal redesign — the add/edit panel is now
          complete on its own; the separate Department assignments tab is
          no longer required (it still exists as a section-centric view).
          - renderPersonPanel rebuilt: inline ROLE ROWS (section <select>
            over SECTION_ORDER, free-text title with a per-section
            <datalist> from titleSuggestionsFor(), one primary radio
            across rows, dept-head checkbox enabled only on HEAD_SECTIONS,
            section flagKeys as checkboxes, +Add role / × remove).
          - Liaison unified: DLO/PLO/CSLO/SLO are ordinary role rows in
            the Liaison officers section. functionForTitle still maps them;
            roleKeyForRole() re-derives the legacy roleKey so the dept
            checklist + list-builder liaison filter keep matching.
          - CONTACT ROWS replace the single email/phone fields: repeatable
            type/value/label rows with a preferred radio per type;
            +Add email / +Add phone. Mirrors (person.email/.phone) are set
            from the preferred (or first) of each type on save.
          - Dept-head clash: an inline amber warning names the current
            head of a section; clearPreviousHeads() strips deptHead from
            the previous holder on save (one head per section).
          - buildRolesFromDraft / buildContactsFromDraft / seedPersonDraft
            added; commitPersonPanelSave + mergeIntoPerson updated to the
            new draft shape (roleRows[]/contactRows[]). Duplicate-name
            detection + merge and audit action names preserved.
          - Public club view: "Head" badge (pill--marker) next to the
            person leading each department (peopleBySection now carries
            isHead per section entry).
  v0.23 — (10/06/2026) The payoff phases on the v2 people model:
          - List builder: results now de-duplicate to one row per HUMAN
            (someone holding six roles appears once, roles unioned) — the
            CSV/email exports key on person, not person-per-section.
            New "Contact: the person / the role inbox" toggle picks which
            address wins when both exist (role inboxes like secretary@
            survive staff changes; personal addresses reach the individual).
            Vacant roles are included with their contact route, and people
            with no contact route show "no contact route" rather than
            being silently dropped. Multi-email people surface all their
            addresses. Fixed a latent bug: the Heads/Whole toggle handler
            queried a class the buttons never had, so it had been dead.
          - NEW Completion dashboard. Club editors get a checklist of
            their required roles (department heads + DLO/PLO/CSLO) with a
            fill meter; staff/admin get the league-wide view — a rollup
            ("14 clubs missing a DLO") plus a per-club completion table,
            click a row to open the club. Requirements read off the v2
            function keys so they're immune to title spelling.
  v0.22 — (10/06/2026) People data foundation (assessment follow-up):
          - Model v2: person.contacts[] (multiple emails/phones with
            label + preferred; person.email/.phone remain as preferred-
            value MIRRORS so every existing read site stays correct);
            roles gain `function` (closed League-owned key, free-text
            title untouched) and optional role-level contacts[]; new
            club.vacant[] for roles with a contact route but no named
            person. Serialization is back-compatible — legacy records
            load fine and are upgraded on write.
          - FUNCTIONS catalogue + functionForTitle() title mapping
            (reconciles Disabled/Disability Liaison Officer etc).
          - NEW Data cleanup scene (superadmin): backup -> analyse ->
            run. Auto-merges bare/identical same-name duplicates (the
            ~166 bare-Directors rows), converts the 12 nameless role-
            holders to vacant roles, stamps the v2 shape + function on
            every record. The ~18 same-name-different-contact groups
            (work/home email cases) are reviewed one-by-one and merge
            into single people with multiple labelled contacts. All
            writes audited.
          - Club page: people rows now list ALL of a person's emails;
            vacant roles render in their section with a "vacant" pill +
            contact route.
          Editor still edits the preferred email/phone (mirrors sync
          into contacts[]; extra contacts preserved). Full multi-contact
          editing UI lands with the list-builder rework.
  v0.21 — (10/06/2026) Club page data-surfacing pass ("feels buried —
          most of it should surface on first click into the club"):
          - Hero enriched: nickname, canonical stadium line
            (stadiumDisplay — traditional / sponsor), club contact chips
            (phone / email / website), full division name, and a club-
            colour accent bar (colors.primary from clubs-meta).
          - NEW facts grid under the hero: Stadium (traditional +
            "currently <sponsor>"), Capacity (+ seated), Pitch
            (dimensions · surface), Nearest station, Address (+
            postcode), FA membership. Empty fields omitted — ground-
            grading clubs simply show less.
          - NEW Kit panel (home / away / GK first+second choice) and
            Sponsors panel (main club / main shirt / left sleeve).
          - "Request a correction" line under the facts: prefilled
            mailto to CORRECTION_EMAIL (info@) with club/field/current/
            correct/source template — the agreed shortcut for locked
            clubs-meta fields.
          - Empty-people state: clubs with no contacts get a proper
            message (+ "Manage my club" pointer for their own editor)
            instead of a bare table header.
          On-navy muted text uses --navy-200 (no new rgba overlays).
  v0.20 — (10/06/2026) Quick-fix pass from the general tool assessment:
          - Nav bar now sticks at top:0. It previously stuck at top:72px
            assuming the brand topbar stayed pinned above it — but .topbar's
            own sticky is defeated by its #nlTopbar wrapper (a sticky
            element can't escape its parent's box), so the bar floated
            72px down with a content gap above. System-wide wrapper fix
            tracked separately.
          - Directory cards + club-editor hero now show the canonical
            stadium via stadiumOf() (sponsor name preferred, falls back
            to traditional name) instead of stadiumFromAddr()'s postal-
            address first-comma heuristic ("The High Street" etc). The
            heuristic predates clubs-meta carrying stadium fields for all
            72 clubs and is deleted, including its stadiumOf/
            stadiumDisplay fallbacks.
          - Club-editor hero division fixed — it read ownClub.division,
            a field working club records never carried (rendered blank);
            now divisionOf(name).
          - Clubs with no contacts yet (the ten 2026-27 entrants until
            they're filled in) get an "awaiting contacts" pill on their
            directory card.
          - Dead code purge: renderClubStyle4 + CLUB_STYLE_RENDERERS +
            state.clubStyle + all .s4-* CSS (leftovers of the demo's
            style switcher, unreachable since renderClub() began calling
            renderClubStyle2 directly).
  v0.19 — (10/06/2026) RTDB wiring, phase C:
          - People + club contact details now live at RTDB
            app-data/ops-club-directory/clubs/<clubName> ({contact, people}
            keyed by person id). Boot loads the corpus after clubs-meta;
            if the node is empty the inline 2025 seed renders READ-ONLY

            "Import handbook seed data" banner (idempotent — refuses to
            overwrite).
          - Every mutation funnel (person add/edit/merge/delete, dept +
            checklist saves, club contact details) persists the club's
            record via persistClub(): NL.writeAudit to admin/audit, a
            tool-local entry pushed to app-data/ops-club-directory/audit
            ({ts, uid, email, club, action, detail}), then the data set().
          - New Activity scene (admin/superadmin): last 200 directory
            changes, newest first, from the tool-local audit node.
          - email_private/phone_private dropped from the stored model —
            the directory sits behind login; no private tier (decision
            10/06/2026).
          - Rules: see system/rtdb/rules.snapshot.json — clubs node reads
            auth!=null, per-club write for own club/admin/superadmin,
            clubs-level write superadmin only (seed); audit readable by
            admin/superadmin, writable by any authed user.
  v0.18 — (10/06/2026) Production wiring, phase A+B:
          - Canonical system head: Firebase compat SDK + init, NL_TOOL /
            NL_TOOL_KEY ('ops-club-directory'), NL_CHANGELOG, nlAuthReady,
            nl-utils/nl-topbar/auth-guard at canonical ?v=. Local topbar
            markup replaced by #nlTopbar; content wrapped in #pageWrap.
          - Demo persona bar REMOVED. Persona now derives from the
            auth-guard session: club -> club-editor (scoped to their own
            club via session.club), staff -> staff, admin/superadmin ->
            admin, anything else -> viewer.
          - Stale inline window.CLUBS_META snapshot REMOVED. clubs-meta

            departed clubs drop out, the 10 new 2026-27 entrants appear
            with empty people sections awaiting contacts.
          - window.CLUBS inline seed (2025 handbook parse) retained as
            the people/contacts corpus until phase C moves it to RTDB
            (app-data/ops-club-directory). Manage-edits remain in-memory
            only until then.
  v0.17 — Brand-compliance sweep (post-v2.19 brand promotions):
          - Dropped the local .btn base + .btn--primary / .btn--secondary
            / .btn--danger / .btn--sm definitions. Brand canon handles
            these. Local-only extensions kept: .btn--link, .btn--toggle,
            .btn--toggle-dark, .btn--lg.
          - Renamed call sites: .btn--primary -> .btn--navy (navy was
            the local primary), .btn--secondary -> .btn--ghost.
          - .btn--danger call sites unchanged but now resolve to the
            brand variant (muted red-light bg with red text + border,

            once live data is wired and the destructive actions show up.
          - .btn--toggle-dark rgba(255,255,255,0.18) and rgba(0.4)
            replaced with solid --navy-200 / --navy-300 / --white

  v0.16 — Brand sweep + foundation migration:
          - Linked /tools/system/nl-brand.css. Deleted the duplicated local

            inherit from the brand source of truth.
          - Replaced the local :root block (which divergent from brand:

            --navy-mid, --navy-light via color-mix() against brand

          - Visible shifts to expect from the foundation migration:
              * Reds shift from carmine #c0392b → brand #d4380d (more

              * Greens / ambers shift very slightly toward brand values.
              * Body text scales fluidly with viewport (brand uses

          - Deleted a redundant local override of --amber-light (brand

          - Bulk-replaced ~50 stray hardcoded hexes throughout the CSS
            with brand tokens / color-mix derivations.
          - Tool is now ready for RTDB integration with a brand-conformant
            foundation. Live persona-bar (demo strip — to be removed in

  v0.15 — Complete UI consistency overhaul based on v0.14 feedback. No feature
          changes; all visual/structural cleanup.

          NEW COMPONENT LANGUAGE
          Five button variants defined at the top of the CSS:
          - .btn.btn--navy   — navy fill, main affirmative (Save, Copy, etc)
          - .btn.btn--ghost — outline, contextual (Cancel, Edit, Back)
          - .btn.btn--danger    — red fill, destructive (Delete)
          - .btn.btn--link      — text-only, low emphasis (all/none controls)
          - .btn.btn--toggle    — tab/state (Directory, People tab, heads mode)
          Plus .btn--toggle-dark (persona bar), .btn--sm / .btn--lg size mods,
          .btn-icon (round 26px structural), .btn-add (dashed-border creation).

          Four pill variants:
          - .pill.pill--count       — neutral metadata, goes coloured only when .is-active
          - .pill.pill--status[-good|-warn|-error] — meaning = colour
          - .pill.pill--marker      — meaningful flag (dept head badge)
          - .pill.pill--identifier  — neutral label (division, role key)

          MIGRATED CLASSES (old → new)
          .mc-save-btn, .mc-primary-btn, .lb-copybtn, .mc-add-person-btn → btn btn--navy
          .mc-cancel-btn, .mc-dept-edit-btn, .mc-person-card-btn → btn btn--ghost
          .mc-danger-btn, .mc-person-panel__danger → btn btn--danger
          .lb-linkbtn → btn btn--link
          .demo-bar__btn, .lb-mode-btn, .mc-picker-pill → btn btn--toggle
          .persona-btn → btn btn--toggle-dark
          .mc-dept-add-btn → btn-add
          .mc-assignment-remove, .mc-person-panel__close, .lb-omit-btn → btn-icon
          .mc-tab-count → pill pill--count (gains .is-active when tab is current)
          .mc-status-pill + modifiers → pill pill--status*
          .mc-person-panel__dept-head-pill, .mc-assignment-headpill → pill pill--marker
          .mc-checklist-roleKey → pill pill--identifier
          .mc-div-pill (division colour coding) → pill pill--identifier (neutral)
          .mc-dept-warning → pill pill--status pill--status-warn

          Old CSS rules for migrated classes are still in the file but unused —
          flagged for cleanup in a later pass.

          CONTENT CHANGES
          - Decorative ⚡ (List builder) and ✏ (Manage) symbols stripped from
            button labels — they rendered inconsistently across OSes and added

          - View-switcher bar hides entirely when persona has only Directory

          - "← back to directory" changed from inline link to proper

          - Tab count pills neutral grey by default, navy-highlighted only

          Stadium name derived from first comma-token of the raw address.

<style>
  /* --primary-dim, --navy-mid, --navy-light promoted to nl-brand.css v2.16. */

  /* Convenience link styling — brand doesn't style anchors. */
  a { color: var(--navy); text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* ====================================================
     Button system — brand canon (.btn / .btn--primary / .btn--navy /
     .btn--ghost / .btn--danger / .btn--sm) lives in nl-brand.css.
     Local-only extensions kept below: .btn--link (anchor-styled),
     .btn--toggle (aria-pressed segmented control), .btn--toggle-dark
     (on-navy variant), .btn--lg (oversize). v0.16 migration:
       local .btn base       dropped, brand .btn handles it
       local .btn--primary   was navy, call sites renamed to .btn--navy
       local .btn--secondary was ghost, call sites renamed to .btn--ghost
       local .btn--danger    dropped, brand .btn--danger now used
                             (visual change: solid red --> muted red)
       local .btn--sm        dropped, brand .btn--sm handles it
     ==================================================== */
  .btn--link {
    background: none; border: none; padding: 4px 6px;
    font-size: var(--text-sm); font-weight: 600; font-variation-settings: 'wght' 600;
    text-transform: none; letter-spacing: normal;
    color: var(--navy); text-decoration: underline;
    cursor: pointer; font-family: var(--font);
  }
  .btn--link:hover:not(:disabled) { color: var(--primary); }

  .btn--toggle {
    background: none; color: var(--text);
    border-color: transparent;
    font-weight: 600; font-variation-settings: 'wght' 600;
  }
  .btn--toggle:hover:not([aria-pressed="true"]) { background: var(--off-white); }
  .btn--toggle[aria-pressed="true"] { background: var(--navy); color: var(--white); }

  .btn--toggle-dark {
    background: none; color: var(--navy-200);
    border: 1px solid var(--navy-300);
    font-weight: 600; font-variation-settings: 'wght' 600;
    padding: 3px 10px; font-size: var(--text-xs);
  }
  .btn--toggle-dark:hover:not([aria-pressed="true"]) { border-color: var(--white); color: var(--white); }
  .btn--toggle-dark[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: var(--white); }

  .btn--lg { padding: 13px 24px; font-size: var(--text-sm); }

  /* Icon button — round, no text, structural */
  .btn-icon {
    background: none;
    border: 1px solid var(--border);
    width: 26px; height: 26px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 14px; line-height: 1;
    color: var(--text-muted);
    padding: 0;
    transition: all 0.12s;
    display: inline-flex; align-items: center; justify-content: center;
    font-family: var(--font);
  }
  .btn-icon:hover { border-color: var(--navy); color: var(--navy); }
  .btn-icon--danger:hover { border-color: var(--red); color: var(--red); }
  .btn-icon[aria-pressed="true"] {
    background: var(--red); border-color: var(--red); color: var(--white);
  }

  /* Add button — dashed border creation affordance */
  .btn-add {
    background: var(--white); border: 1px dashed var(--border);
    padding: 8px 14px; border-radius: var(--radius);
    font-family: var(--font); font-size: 12px;
    font-weight: 600; font-variation-settings: 'wght' 600;
    color: var(--navy);
    cursor: pointer; transition: all 0.12s;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .btn-add:hover { border-color: var(--navy); background: var(--off-white); }

  /* ====================================================
     v0.15 PILL SYSTEM
     4 variants: count, status, marker, identifier.
     ==================================================== */
  .pill {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 11px; padding: 2px 9px; border-radius: 3px;
    font-weight: 700; font-variation-settings: 'wght' 700;
    letter-spacing: 0.05em; line-height: 1.5;
  }

  .pill--count {
    background: var(--off-white); color: var(--text-muted);
    font-weight: 600; font-variation-settings: 'wght' 600;
    font-size: 10px;
    padding: 1px 8px; border-radius: 10px;
  }
  .pill--count.is-active { background: var(--navy); color: var(--white); }

  .pill--status { background: var(--off-white); color: var(--text-muted); }
  .pill--status-good  { background: var(--green-light); color: var(--green); }
  .pill--status-warn  { background: var(--amber-light); color: var(--amber-deep); }
  .pill--status-error { background: var(--red-light); color: var(--red); }

  .pill--marker {
    background: var(--amber); color: var(--white);
    font-size: 9px; text-transform: uppercase;
    letter-spacing: 0.1em; padding: 2px 7px;
  }
  .pill--marker-primary { background: var(--primary); color: var(--white); }

  .pill--identifier {
    background: var(--white); color: var(--text);
    border: 1px solid var(--border);
    font-size: 11px; font-weight: 700; font-variation-settings: 'wght' 700;
    letter-spacing: 0.08em; text-transform: uppercase;
    padding: 2px 9px;
  }

  .demo-bar {
    background: var(--white); border-bottom: 1px solid var(--border);
    padding: 10px 20px;
    display: flex; flex-wrap: wrap; gap: 16px; align-items: center;
    position: sticky; top: 0; z-index: 50;
  }
  .demo-bar__group { display: flex; gap: 2px; align-items: center; background: var(--off-white); padding: 4px; border-radius: 6px; }
  .demo-bar__label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em; font-weight: 800; font-variation-settings: 'wght' 800; color: var(--text-muted); padding: 0 8px 0 4px; }
  .demo-bar__btn { background: none; border: none; padding: 6px 12px; font-family: var(--font); font-size: 12px; font-weight: 600; font-variation-settings: 'wght' 600; color: var(--text); border-radius: 4px; cursor: pointer; transition: all 0.12s; }
  .demo-bar__btn:hover { background: rgba(0,0,0,0.04); }
  .demo-bar__btn[aria-pressed="true"] { background: var(--navy); color: var(--white); }
  .demo-bar__search { flex: 1; min-width: 200px; max-width: 360px; margin-left: auto; font-family: var(--font); font-size: 14px; border: 1px solid var(--border); border-radius: 6px; padding: 8px 12px; background: var(--white); color: var(--text); }
  .demo-bar__search:focus { outline: none; border-color: var(--navy); }

  .page { max-width: 1200px; margin: 0 auto; padding: 24px 20px 80px; }
  /* .back-link superseded by .btn.btn--ghost.btn--sm in v0.15 */

  .scene { display: none; }
  .scene--active { display: block; }

  /* ================================================================
     STYLE 2 — Dense Table
     Sections = navy uppercase text with a short red underline, generous
     whitespace. Joined rows (Directors / Co-Chairs) render like any other
     row — no tint, no colour signalling.
     ================================================================ */
  .s2-club { background: var(--white); border-radius: 8px; overflow: hidden; border: 1px solid var(--border); }
  .s2-header { padding: 24px 28px 22px; background: var(--navy); color: var(--white); display: flex; gap: 20px; align-items: flex-start; }
  .s2-crest { width: 56px; height: 56px; flex-shrink: 0; background: var(--white); border-radius: 4px; padding: 4px; object-fit: contain; }
  .s2-header h2 { margin: 0; font-size: 22px; display: flex; align-items: center; gap: 12px; font-weight: 900; font-variation-settings: 'wght' 900; }
  .s2-div { font-size: 10px; padding: 3px 10px; border-radius: 2px; background: rgba(255,255,255,0.2); font-weight: 700; font-variation-settings: 'wght' 700; letter-spacing: 0.1em; }
  .s2-addr { font-size: 12px; color: rgba(255,255,255,0.8); margin-top: 6px; }
  .s2-addr a { color: rgba(255,255,255,0.95); }
  .s2-table { width: 100%; border-collapse: collapse; font-size: 13px; }

  /* Column header strip — kept but made very quiet */
  .s2-table thead th {
    text-align: left; padding: 10px 20px 8px;
    background: transparent;
    font-weight: 700; font-variation-settings: 'wght' 700;
    font-size: 9px; text-transform: uppercase; letter-spacing: 0.14em;
    color: var(--text-muted);
    border-bottom: 1px solid var(--border);
  }

  /* Regular data rows */
  .s2-table td { padding: 10px 20px; border-bottom: 1px solid var(--border); vertical-align: top; }
  .s2-role { font-weight: 600; font-variation-settings: 'wght' 600; color: var(--text); width: 28%; }
  .s2-name { width: 22%; font-weight: 600; font-variation-settings: 'wght' 600; }
  .s2-phone { width: 18%; color: var(--text-muted); font-size: 12px; }
  .s2-email { width: 32%; font-size: 12px; }
  .s2-table tbody tr:not(.s2-sec-row):hover td { background: var(--off-white); }

  /* Section header row — typographic only. The td has no borders, no fill;
     the inner wrapper carries the navy text and the short red underline. */
  .s2-sec-row td {
    padding: 28px 20px 4px !important;
    border-bottom: none !important;
    background: transparent !important;
  }
  .s2-sec-row:first-child td { padding-top: 24px !important; }
  .s2-sec-hd {
    display: inline-block;
    font-weight: 700;
    font-variation-settings: 'wght' 700;
    font-size: 11px;
    color: var(--navy);
    text-transform: uppercase;
    letter-spacing: 0.22em;
    padding-bottom: 6px;
    border-bottom: 2px solid var(--primary);
    /* border-bottom acts as the short red underline — only as wide as the text */
  }

  /* Joined rows (Directors/Co-Chairs) — identical to regular rows, no special colour */
  .s2-joined-row td { /* no overrides — use regular row styling */ }

  /* ================================================================
     CLUB PAGE — handbook facts surfaced (v0.21)
     The s2-club card gains: club-colour accent bar (inline style), hero
     with nickname/stadium/contact chips, facts grid, kit + sponsors
     panels, correction line. People table unchanged below.
     ================================================================ */
  .s2-header__main { min-width: 0; flex: 1; }
  .cp-nickname { font-size: 12px; color: var(--navy-200); margin-top: 3px; font-style: italic; }
  .cp-stadium { font-size: 14px; font-variation-settings: 'wght' 700; margin-top: 8px; }
  .cp-contact { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .cp-chip {
    display: inline-flex; align-items: center; font-size: 12px;
    padding: 4px 11px; border-radius: 999px;
    background: var(--navy-600); color: var(--white); text-decoration: none;
  }
  a.cp-chip:hover { background: var(--navy-700); text-decoration: none; }
  .cp-facts {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    gap: 1px; background: var(--border); border-bottom: 1px solid var(--border);
  }
  .cp-fact { background: var(--white); padding: 14px 18px; }
  .cp-fact__label {
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em;
    font-variation-settings: 'wght' 800; color: var(--text-muted);
  }
  .cp-fact__value { font-size: 15px; font-variation-settings: 'wght' 700; margin-top: 4px; }
  .cp-fact__sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .cp-strips {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 1px; background: var(--border); border-bottom: 1px solid var(--border);
  }
  .cp-panel { background: var(--white); padding: 16px 18px; }
  .cp-panel__hd {
    display: inline-block; font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.18em; font-variation-settings: 'wght' 800;
    color: var(--navy); padding-bottom: 6px; margin-bottom: 10px;
    border-bottom: 2px solid var(--primary);
  }
  .cp-kit { display: flex; gap: 28px; flex-wrap: wrap; }
  .cp-kit__col { font-size: 13px; }
  .cp-kit__hd { font-variation-settings: 'wght' 800; font-size: 12px; margin-bottom: 6px; }
  .cp-kit__col div { padding: 2px 0; }
  .cp-kit__col div span, .cp-sponsors div span {
    display: inline-block; min-width: 72px; color: var(--text-muted);
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em;
  }
  .cp-sponsors div { font-size: 13px; padding: 3px 0; }
  .cp-sponsors div span { min-width: 150px; }
  .cp-correction {
    font-size: 12px; color: var(--text-muted);
    padding: 10px 18px; background: var(--off-white);
    border-bottom: 1px solid var(--border);
  }
  .cp-empty { padding: 36px 20px; text-align: center; color: var(--text-muted); font-size: 14px; }

  /* ---- Completion dashboard (v0.23) ---- */
  .cp-meter { display: inline-block; width: 90px; height: 8px; border-radius: 4px; background: var(--navy-100); overflow: hidden; vertical-align: middle; }
  .cp-meter__bar { height: 100%; border-radius: 4px; transition: width 0.2s; }
  .cp-meter__label { font-size: 12px; font-variation-settings: 'wght' 700; color: var(--text-muted); margin-left: 8px; vertical-align: middle; }
  .cp-dash-meter { margin: 4px 0 8px; }
  .cp-dash-h3 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.14em; color: var(--navy); margin: 22px 0 10px; }
  .cp-checks { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 6px; }
  .cp-check { display: flex; align-items: center; gap: 8px; padding: 9px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; background: var(--white); }
  .cp-check__icon { width: 18px; height: 18px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; color: var(--white); flex-shrink: 0; }
  .cp-check--ok  .cp-check__icon { background: var(--green); }
  .cp-check--gap .cp-check__icon { background: var(--red); }
  .cp-check--gap { border-color: var(--red); }
  .cp-check__label { font-variation-settings: 'wght' 600; }
  .cp-check__hint { font-size: 11px; color: var(--text-muted); margin-left: auto; }
  .cp-rollup { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
  .cp-rollup__item { display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: var(--amber-light); border: 1px solid var(--amber); border-radius: 8px; }
  .cp-rollup__n { font-size: 22px; font-variation-settings: 'wght' 900; color: var(--amber-deep); }
  .cp-rollup__lbl { font-size: 13px; }
  .cp-dash-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .cp-dash-table th { text-align: left; font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-muted); padding: 8px 12px; border-bottom: 2px solid var(--border); }
  .cp-dash-table td { padding: 9px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  .cp-dash-row { cursor: pointer; }
  .cp-dash-row:hover td { background: var(--off-white); }
  .cp-dash-meter-cell { white-space: nowrap; }
  .cp-dash-gaps { color: var(--text-muted); font-size: 12px; }

  /* ================================================================
     LISTING 1 — Card Grid
     ================================================================ */
  .l1-division { margin-bottom: 32px; }
  /* Division headers — navy uppercase with red underline, matches section-header language elsewhere */
  .l1-div-hd {
    font-size: 12px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    font-weight: 800;
    font-variation-settings: 'wght' 800;
    padding: 0 0 6px 0;
    display: inline-flex;
    align-items: baseline;
    gap: 10px;
    color: var(--navy);
    margin: 0 0 18px 0;
    border-bottom: 2px solid var(--primary);
  }
  .l1-div-hd .pill { vertical-align: baseline; }
  /* Club-editor "your club" hero — big full-width card on directory landing */
  .l1-hero {
    background: linear-gradient(135deg, var(--navy) 0%, var(--navy-600) 100%);
    color: var(--white);
    padding: 24px 28px;
    border-radius: 8px;
    margin-bottom: 24px;
    display: grid;
    grid-template-columns: 64px 1fr auto;
    gap: 18px;
    align-items: center;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .l1-hero:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(10,22,40,0.2); }
  .l1-hero__crest {
    width: 64px; height: 64px; background: var(--white);
    border-radius: 6px; padding: 6px;
    object-fit: contain;
  }
  .l1-hero__kicker {
    font-size: 10px; text-transform: uppercase;
    letter-spacing: 0.22em; opacity: 0.7;
    font-weight: 700; font-variation-settings: 'wght' 700;
  }
  .l1-hero__name {
    font-size: 22px;
    font-weight: 800; font-variation-settings: 'wght' 800;
    margin-top: 2px;
    letter-spacing: -0.01em;
  }
  .l1-hero__meta {
    font-size: 13px; opacity: 0.8; margin-top: 2px;
  }
  .l1-hero .btn--navy {
    background: var(--primary);
  }
  .l1-hero .btn--navy:hover { background: var(--primary-600); }
  @media (max-width: 700px) {
    .l1-hero {
      grid-template-columns: 56px 1fr;
      padding: 18px;
    }
    .l1-hero__crest { width: 56px; height: 56px; }
    .l1-hero .btn--navy {
      grid-column: 1 / -1;
      justify-content: center;
    }
    .l1-hero__name { font-size: 18px; }
  }

  .l1-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
  .l1-card {
    background: var(--white); border: 1px solid var(--border);
    border-radius: 6px; padding: 14px 16px;
    cursor: pointer; transition: all 0.15s;
    display: flex; gap: 12px; align-items: center;
    min-height: 72px;
  }
  .l1-card:hover { border-color: var(--navy); transform: translateY(-1px); box-shadow: 0 2px 8px rgba(10,22,40,0.08); }
  .l1-crest { width: 40px; height: 40px; flex-shrink: 0; object-fit: contain; }
  .l1-card-body { flex: 1; min-width: 0; }
  .l1-card h3 {
    margin: 0; font-size: 15px;
    font-weight: 700; font-variation-settings: 'wght' 700;
    letter-spacing: -0.01em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .l1-stadium {
    font-size: 12px; color: var(--text-muted);
    margin-top: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* ================================================================
     LIST BUILDER (staff view)
     ================================================================ */
  .demo-bar__btn--staff {
    background: var(--off-white);
    color: var(--primary) !important;
    font-weight: 700;
    font-variation-settings: 'wght' 700;
  }
  .demo-bar__btn--staff[aria-pressed="true"] {
    background: var(--primary) !important;
    color: var(--white) !important;
  }

  .lb-intro { margin-bottom: 20px; }
  .lb-intro h2 { margin: 0; font-size: 22px; font-weight: 900; font-variation-settings: 'wght' 900; letter-spacing: -0.01em; }
  .lb-intro p { margin: 4px 0 0 0; font-size: 14px; color: var(--text-muted); }

  .lb-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 20px;
  }
  .lb-panel {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px 18px;
    max-height: 480px;
    display: flex;
    flex-direction: column;
  }
  .lb-panel-hd {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 10px;
    border-bottom: 2px solid var(--primary);
    margin-bottom: 12px;
  }
  .lb-panel-hd h3 {
    margin: 0;
    font-size: 11px;
    font-weight: 700;
    font-variation-settings: 'wght' 700;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--navy);
  }
  .lb-panel-actions { display: flex; gap: 4px; }
  .lb-linkbtn {
    background: none; border: none; padding: 2px 6px;
    font-family: var(--font); font-size: 11px;
    color: var(--navy); cursor: pointer;
    text-decoration: underline;
    font-weight: 600;
    font-variation-settings: 'wght' 600;
  }
  .lb-linkbtn:hover { color: var(--primary); }

  .lb-panel > div:last-child { flex: 1; overflow-y: auto; padding-right: 4px; }

  /* Roles */
  .lb-section-group { margin-bottom: 10px; }
  .lb-section-row {
    display: flex; align-items: center; gap: 8px;
    padding: 4px 0;
    cursor: pointer;
    user-select: none;
  }
  .lb-section-row input[type="checkbox"] { margin: 0; cursor: pointer; }
  .lb-section-row label {
    font-size: 12px;
    font-weight: 700;
    font-variation-settings: 'wght' 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text);
    cursor: pointer;
    flex: 1;
  }
  .lb-section-count {
    font-size: 10px;
    color: var(--text-muted);
    font-weight: 600;
    font-variation-settings: 'wght' 600;
  }
  .lb-section-toggle {
    background: none; border: none; padding: 0;
    color: var(--text-muted); cursor: pointer;
    font-family: var(--font); font-size: 12px;
    width: 18px; text-align: center;
  }
  .lb-roles-in-section {
    margin-left: 22px;
    padding: 4px 0 2px;
    display: grid;
    gap: 2px;
  }
  .lb-role-row {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px;
    padding: 1px 0;
    cursor: pointer;
    user-select: none;
  }
  .lb-role-row input[type="checkbox"] { margin: 0; cursor: pointer; }
  .lb-role-row label { cursor: pointer; color: var(--text); flex: 1; }
  .lb-collapsed .lb-roles-in-section { display: none; }

  /* Divisions */
  .lb-division-group { margin-bottom: 14px; }
  .lb-division-row {
    display: flex; align-items: center; gap: 8px;
    padding: 4px 0;
    user-select: none;
  }
  .lb-division-row input[type="checkbox"] { margin: 0; cursor: pointer; }
  .lb-division-row label {
    font-size: 12px;
    font-weight: 700;
    font-variation-settings: 'wght' 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    cursor: pointer;
    flex: 1;
  }
  .lb-div-badge {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    margin-right: 6px;
    vertical-align: middle;
  }
  .lb-div-badge--national { background: var(--navy); }
  .lb-div-badge--north { background: var(--amber); }
  .lb-div-badge--south { background: var(--green); }
  .lb-division-stats {
    font-size: 10px; color: var(--text-muted);
    font-weight: 600; font-variation-settings: 'wght' 600;
  }
  .lb-clubs-in-div {
    margin-left: 22px;
    display: grid; gap: 2px;
  }
  .lb-club-search {
    margin: 4px 0 6px 22px;
    width: calc(100% - 22px);
    font-family: var(--font); font-size: 12px;
    padding: 5px 8px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--white);
  }
  .lb-club-search:focus { outline: none; border-color: var(--navy); }
  .lb-club-row {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px;
    padding: 1px 0;
    cursor: pointer;
    user-select: none;
  }
  .lb-club-row.is-hidden { display: none; }
  .lb-club-row label { cursor: pointer; flex: 1; }
  .lb-club-row input[type="checkbox"] { margin: 0; cursor: pointer; }
  .lb-division-div-collapsed .lb-clubs-in-div,
  .lb-division-div-collapsed .lb-club-search { display: none; }

  /* Results */
  .lb-results {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }

  /* Mode bar — heads-only vs whole dept */
  .lb-modebar {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 12px;
  }
  .lb-modebar__group {
    display: inline-flex;
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
    padding: 3px;
    gap: 2px;
  }
  .lb-mode-btn {
    background: none; border: none;
    padding: 7px 14px;
    font-family: var(--font);
    font-size: 12px;
    font-weight: 600;
    font-variation-settings: 'wght' 600;
    color: var(--text);
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.12s;
  }
  .lb-mode-btn:hover { background: var(--off-white); }
  .lb-mode-btn[aria-pressed="true"] {
    background: var(--navy);
    color: var(--white);
  }

  /* Warnings panel above results */
  .lb-warnings {
    background: var(--amber-light);
    border: 1px solid color-mix(in srgb, var(--amber) 35%, white);
    border-radius: 8px;
    padding: 14px 16px;
    margin-bottom: 12px;
  }
  .lb-warnings__hd {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    font-weight: 800;
    font-variation-settings: 'wght' 800;
    color: var(--amber-deep);
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .lb-warnings__item {
    font-size: 13px;
    color: var(--text);
    margin-bottom: 6px;
    line-height: 1.6;
  }
  .lb-warnings__item:last-child { margin-bottom: 0; }
  .lb-warnings__item b { color: var(--amber-deep); font-weight: 700; font-variation-settings: 'wght' 700; }
  .lb-warnings__crests {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-top: 6px;
  }
  .lb-warning-crest {
    display: inline-flex; align-items: center; gap: 5px;
    background: var(--white);
    border: 1px solid color-mix(in srgb, var(--amber) 35%, white);
    border-radius: 14px;
    padding: 2px 9px 2px 2px;
    font-size: 11px;
    color: var(--text);
    font-weight: 500;
    font-variation-settings: 'wght' 500;
  }
  .lb-warning-crest img { width: 20px; height: 20px; flex-shrink: 0; object-fit: contain; }

  /* Club crests in results */
  .lb-club-cell {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .lb-club-cell img { width: 22px; height: 22px; flex-shrink: 0; object-fit: contain; }

  /* Omit button + omitted row */
  .lb-col-omit { width: 36px; text-align: center; padding-right: 10px !important; }
  .lb-omit-btn {
    background: none;
    border: 1px solid var(--border);
    width: 22px; height: 22px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 12px;
    line-height: 1;
    color: var(--text-muted);
    padding: 0;
    transition: all 0.12s;
  }
  .lb-omit-btn:hover { border-color: var(--red); color: var(--red); }
  .lb-omit-btn[aria-pressed="true"] {
    background: var(--red);
    border-color: var(--red);
    color: var(--white);
  }
  .lb-row-omitted td {
    color: color-mix(in srgb, var(--text-muted) 50%, white) !important;
    text-decoration: line-through;
  }
  .lb-row-omitted .lb-club-cell img { opacity: 0.35; filter: grayscale(100%); }
  .lb-row-omitted td a { color: color-mix(in srgb, var(--text-muted) 50%, white) !important; pointer-events: none; }
  .lb-row-omitted .lb-omit-btn { text-decoration: none; }
  .lb-row-omitted .lb-no-email { color: color-mix(in srgb, var(--text-muted) 50%, white) !important; }

  .lb-results-hd {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px;
    background: var(--off-white);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
    gap: 10px;
  }
  .lb-results-stats { display: flex; align-items: baseline; gap: 8px; }
  .lb-count {
    font-size: 26px;
    font-weight: 900;
    font-variation-settings: 'wght' 900;
    color: var(--navy);
    line-height: 1;
  }
  .lb-count-sub { font-size: 12px; color: var(--text-muted); }

  .lb-results-actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .lb-copybtn {
    background: var(--navy);
    color: var(--white);
    border: none;
    padding: 7px 14px;
    border-radius: var(--radius);
    font-family: var(--font);
    font-size: 11px;
    font-weight: 700;
    font-variation-settings: 'wght' 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    cursor: pointer;
    transition: all 0.12s;
  }
  .lb-copybtn:hover { background: var(--navy-600); }
  .lb-copybtn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn.is-copied { background: var(--green) !important; }
  .btn.is-copied:hover { background: var(--green) !important; }

  .lb-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .lb-table th {
    text-align: left; padding: 10px 18px; background: transparent;
    font-size: 9px; font-weight: 700; font-variation-settings: 'wght' 700;
    text-transform: uppercase; letter-spacing: 0.14em;
    color: var(--text-muted);
    border-bottom: 1px solid var(--border);
  }
  .lb-table td { padding: 9px 18px; border-bottom: 1px solid var(--border); vertical-align: top; }
  .lb-table td a { color: var(--navy); }
  .lb-col-role { width: 22%; font-weight: 600; font-variation-settings: 'wght' 600; color: var(--text-muted); font-size: 12px; }
  .lb-col-name { width: 22%; font-weight: 700; font-variation-settings: 'wght' 700; }
  .lb-col-club { width: 20%; font-weight: 500; font-variation-settings: 'wght' 500; }
  .lb-col-email { width: 22%; font-size: 12px; }
  .lb-col-phone { width: 14%; font-size: 12px; color: var(--text-muted); }
  .lb-no-email { color: var(--red); font-style: italic; font-size: 11px; }

  .lb-empty {
    padding: 60px 20px;
    text-align: center;
    color: var(--text-muted);
    font-size: 14px;
  }

  @media (max-width: 800px) {
    .lb-grid { grid-template-columns: 1fr; }
    .lb-panel { max-height: 380px; }
    .lb-results-hd { flex-direction: column; align-items: stretch; }
    .lb-col-phone { display: none; }
  }

  /* ================================================================
     DEMO PERSONA BAR (top strip — removed in production)
     ================================================================ */
  .persona-bar {
    background: var(--text);
    color: var(--white);
    padding: 6px 16px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    flex-wrap: wrap;
  }
  .persona-bar__label {
    color: rgba(255,255,255,0.55);
    text-transform: uppercase;
    letter-spacing: 0.15em;
    font-weight: 700;
    font-variation-settings: 'wght' 700;
    font-size: 9px;
  }
  .persona-btn {
    background: none;
    border: 1px solid rgba(255,255,255,0.18);
    color: rgba(255,255,255,0.75);
    padding: 3px 10px;
    font-family: var(--font);
    font-size: 11px;
    font-weight: 600;
    font-variation-settings: 'wght' 600;
    border-radius: 3px;
    cursor: pointer;
    transition: all 0.12s;
  }
  .persona-btn:hover { border-color: rgba(255,255,255,0.4); color: var(--white); }
  .persona-btn[aria-pressed="true"] {
    background: var(--primary);
    border-color: var(--primary);
    color: var(--white);
  }
  .persona-btn span {
    color: rgba(255,255,255,0.5);
    font-size: 10px;
    font-weight: 400;
    font-variation-settings: 'wght' 400;
    margin-left: 3px;
  }
  .persona-btn[aria-pressed="true"] span { color: rgba(255,255,255,0.8); }

  /* Elements gated by persona — hidden by default, shown when enabled */
  .persona-gated { display: none; }
  .persona-gated.is-shown { display: inline-flex; }

  /* Club page topbar with back link + manage button */
  .club-topbar {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
  }
  .club-topbar #manageMyClubBtn {
    margin-left: auto;  /* when shown, pushes to right; when hidden, nothing to push */
    /* Use brand red for "Manage my club" to make it distinctive from the navy */
    background: var(--primary);
  }
  .club-topbar #manageMyClubBtn:hover { background: var(--primary-600); }

  /* ================================================================
     MANAGE CONTACTS (v0.9 — two-surface model)
     ================================================================ */

  /* Club picker table (admin-only landing) */
  .mc-picker-intro { margin-bottom: 20px; }
  .mc-picker-intro h2 { margin: 0; font-size: 22px; font-weight: 900; font-variation-settings: 'wght' 900; letter-spacing: -0.01em; }
  .mc-picker-intro p { margin: 4px 0 0 0; font-size: 14px; color: var(--text-muted); }

  .mc-picker-filter {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    display: flex;
    gap: 10px;
    align-items: center;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }
  .mc-picker-filter input {
    flex: 1; min-width: 180px;
    font-family: var(--font); font-size: 13px;
    padding: 6px 10px;
    border: 1px solid var(--border);
    border-radius: 4px;
  }
  .mc-picker-filter input:focus { outline: none; border-color: var(--navy); }
  .mc-picker-pill {
    font-size: 11px;
    font-weight: 700;
    font-variation-settings: 'wght' 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 5px 10px;
    border: 1px solid var(--border);
    background: var(--white);
    color: var(--text);
    border-radius: 3px;
    cursor: pointer;
    transition: all 0.12s;
  }
  .mc-picker-pill[aria-pressed="true"] {
    background: var(--navy);
    color: var(--white);
    border-color: var(--navy);
  }

  .mc-clubs-table {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  .mc-clubs-table table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .mc-clubs-table th {
    text-align: left; padding: 10px 14px; background: var(--off-white);
    font-size: 9px; font-weight: 700; font-variation-settings: 'wght' 700;
    text-transform: uppercase; letter-spacing: 0.14em;
    color: var(--text-muted);
    border-bottom: 1px solid var(--border);
  }
  .mc-clubs-table td { padding: 10px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  .mc-clubs-table tbody tr { cursor: pointer; transition: background 0.1s; }
  .mc-clubs-table tbody tr:hover { background: var(--off-white); }
  .mc-club-cell { display: flex; align-items: center; gap: 10px; }
  .mc-club-cell img { width: 22px; height: 22px; flex-shrink: 0; object-fit: contain; }
  .mc-club-cell span { font-weight: 700; font-variation-settings: 'wght' 700; }
  .mc-div-pill {
    font-size: 10px; padding: 2px 7px; border-radius: 2px; color: var(--white);
    font-weight: 700; font-variation-settings: 'wght' 700; letter-spacing: 0.1em;
  }
  .mc-div-pill--national { background: var(--navy); }
  .mc-div-pill--north { background: var(--amber); }
  .mc-div-pill--south { background: var(--green); }
  .mc-status-pill {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 11px; padding: 3px 8px; border-radius: 3px;
    background: var(--off-white); color: var(--text-muted);
  }
  .mc-status-pill--warn { background: var(--amber-light); color: var(--amber-deep); }
  .mc-status-pill--good { background: var(--green-light); color: var(--green); }
  .mc-action-col { text-align: right; }
  .mc-action-col a {
    font-size: 12px; color: var(--primary); font-weight: 700;
    font-variation-settings: 'wght' 700;
  }

  /* Editor header */
  .mc-back-bar {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 16px;
  }
  .mc-back-bar .btn { margin: 0; }
  .mc-title h2 {
    margin: 0; font-size: 20px;
    font-weight: 900; font-variation-settings: 'wght' 900;
    display: flex; align-items: center; gap: 10px;
  }
  .mc-title h2 img { width: 28px; height: 28px; object-fit: contain; }
  .mc-title .mc-title-sub { font-size: 13px; color: var(--text-muted); margin-top: 2px; }

  /* Demo banner */
  .mc-demo-banner {
    background: var(--amber-light);
    border: 1px solid color-mix(in srgb, var(--amber) 35%, white);
    border-radius: 6px;
    padding: 10px 14px;
    font-size: 12px;
    color: var(--amber-deep);
    margin-bottom: 16px;
    line-height: 1.5;
  }
  .mc-demo-banner b { font-weight: 700; font-variation-settings: 'wght' 700; }

  /* Two-surface tabbed layout */
  .mc-surface-tabs {
    display: flex;
    gap: 4px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 16px;
  }
  .mc-surface-tab {
    background: none;
    border: none;
    padding: 10px 18px;
    font-family: var(--font);
    font-size: 13px;
    font-weight: 700;
    font-variation-settings: 'wght' 700;
    color: var(--text-muted);
    cursor: pointer;
    position: relative;
    top: 1px;
    border-bottom: 2px solid transparent;
    transition: all 0.12s;
  }
  .mc-surface-tab:hover { color: var(--text); }
  .mc-surface-tab[aria-selected="true"] {
    color: var(--navy);
    border-bottom-color: var(--primary);
  }
  .mc-surface-tab .mc-tab-count {
    display: inline-block;
    font-size: 10px;
    background: var(--off-white);
    color: var(--text-muted);
    padding: 1px 7px;
    border-radius: 10px;
    margin-left: 6px;
    font-weight: 600;
    font-variation-settings: 'wght' 600;
  }
  .mc-surface-tab[aria-selected="true"] .mc-tab-count {
    background: var(--navy);
    color: var(--white);
  }

  /* Surface panels */
  .mc-surface { display: none; }
  .mc-surface.is-active { display: block; }

  /* ========== SURFACE 1: People list ========== */
  .mc-people-actions {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  .mc-people-search {
    flex: 1; min-width: 220px;
    font-family: var(--font); font-size: 13px;
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--white);
  }
  .mc-people-search:focus { outline: none; border-color: var(--navy); }

  .mc-add-person-btn {
    background: var(--navy);
    color: var(--white);
    border: none;
    padding: 8px 16px;
    border-radius: 4px;
    font-family: var(--font); font-size: 12px;
    font-weight: 700; font-variation-settings: 'wght' 700;
    text-transform: uppercase; letter-spacing: 0.08em;
    cursor: pointer;
    transition: background 0.12s;
  }
  .mc-add-person-btn:hover { background: var(--navy-600); }

  .mc-people-list {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  .mc-person-card {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 16px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    align-items: center;
    cursor: pointer;
    transition: background 0.1s;
  }
  .mc-person-card:last-child { border-bottom: none; }
  .mc-person-card:hover { background: var(--off-white); }
  .mc-person-card.is-selected {
    background: color-mix(in srgb, var(--navy) 8%, white);
    border-left: 3px solid var(--navy);
    padding-left: 13px;
  }
  .mc-person-card-main { min-width: 0; }
  .mc-person-card-name {
    font-weight: 700; font-variation-settings: 'wght' 700;
    font-size: 14px;
    color: var(--text);
  }
  .mc-person-card-contact {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 2px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .mc-person-card-contact a { color: var(--navy); }
  .mc-person-card-depts {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 4px;
    font-style: italic;
  }
  .mc-person-card-depts b {
    font-style: normal;
    font-weight: 600;
    font-variation-settings: 'wght' 600;
    color: var(--text);
  }
  .mc-person-card-actions {
    display: flex;
    gap: 6px;
  }
  .mc-person-card-btn {
    background: none;
    border: 1px solid var(--border);
    padding: 5px 11px;
    font-family: var(--font); font-size: 11px;
    font-weight: 600; font-variation-settings: 'wght' 600;
    color: var(--text);
    border-radius: 3px;
    cursor: pointer;
    transition: all 0.12s;
  }
  .mc-person-card-btn:hover { border-color: var(--navy); color: var(--navy); }
  .mc-person-card-btn--danger:hover { border-color: var(--red); color: var(--red); }

  /* Right-side slide-out panel for editing a person */
  .mc-person-panel-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.35);
    z-index: 150;
    animation: fadein 0.15s;
  }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slidein { from { transform: translateX(100%); } to { transform: translateX(0); } }
  .mc-person-panel {
    position: fixed;
    top: 0; right: 0;
    height: 100vh;
    width: 420px;
    max-width: 94vw;
    background: var(--white);
    box-shadow: -8px 0 40px rgba(0,0,0,0.15);
    z-index: 160;
    display: flex;
    flex-direction: column;
    animation: slidein 0.22s;
  }
  .mc-person-panel__hd {
    padding: 18px 22px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }
  .mc-person-panel__hd h3 {
    margin: 0;
    font-size: 16px;
    font-weight: 900; font-variation-settings: 'wght' 900;
  }
  .mc-person-panel__hd-sub {
    font-size: 11px; color: var(--text-muted);
    margin-top: 2px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-weight: 700;
    font-variation-settings: 'wght' 700;
  }
  .mc-person-panel__close {
    background: none; border: none;
    font-size: 20px; line-height: 1;
    color: var(--text-muted);
    cursor: pointer;
    padding: 0 6px;
  }
  .mc-person-panel__close:hover { color: var(--text); }

  .mc-person-panel__body {
    flex: 1;
    padding: 22px;
    overflow-y: auto;
  }
  .mc-person-panel__field { margin-bottom: 14px; }
  .mc-person-panel__field label {
    display: block;
    font-size: 11px;
    font-weight: 700; font-variation-settings: 'wght' 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-muted);
    margin-bottom: 5px;
  }
  .mc-person-panel__field input {
    width: 100%;
    font-family: var(--font); font-size: 14px;
    padding: 8px 11px;
    border: 1px solid var(--border);
    border-radius: 4px;
  }
  .mc-person-panel__field input:focus { outline: none; border-color: var(--navy); }

  .mc-person-panel__depts-section {
    margin-top: 22px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .mc-person-panel__depts-section h4 {
    margin: 0 0 10px 0;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--navy);
    font-weight: 700; font-variation-settings: 'wght' 700;
  }
  .mc-person-panel__dept {
    font-size: 13px;
    color: var(--text);
    padding: 8px 12px;
    background: var(--off-white);
    border-radius: 4px;
    margin-bottom: 5px;
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }
  .mc-person-panel__dept-info {
    flex: 1;
    min-width: 0;
    line-height: 1.4;
  }
  .mc-person-panel__dept b {
    color: var(--navy);
    font-weight: 700; font-variation-settings: 'wght' 700;
  }
  .mc-person-panel__dept-head-pill {
    font-size: 9px;
    background: var(--amber);
    color: var(--white);
    padding: 2px 6px;
    border-radius: 2px;
    font-weight: 700; font-variation-settings: 'wght' 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .mc-person-panel__depts-empty {
    font-size: 12px; color: var(--text-muted);
    font-style: italic;
    padding: 10px 0;
  }
  .mc-person-panel__help {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 8px;
    line-height: 1.5;
  }

  /* ---- Person modal: role rows ---- */
  .mc-role-row {
    background: var(--off-white);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 12px;
    margin-bottom: 8px;
  }
  .mc-role-row__main {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .mc-role-row__section { flex: 0 0 38%; }
  .mc-role-row__title { flex: 1; min-width: 0; }
  .mc-role-row__main select,
  .mc-role-row__main input[type="text"] {
    font-family: var(--font); font-size: 13px;
    padding: 7px 9px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--white);
  }
  .mc-role-row__main select:focus,
  .mc-role-row__main input:focus { outline: none; border-color: var(--navy); }
  .mc-role-row__remove-spacer { display: inline-block; width: 28px; }
  .mc-role-row__opts {
    display: flex;
    gap: 16px;
    align-items: center;
    flex-wrap: wrap;
    margin-top: 8px;
    font-size: 12px;
    color: var(--text);
  }
  .mc-role-row__opt { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; }
  .mc-role-row__opt.is-disabled { color: var(--text-muted); cursor: not-allowed; }
  .mc-role-row__flags { display: inline-flex; gap: 12px; flex-wrap: wrap; }
  .mc-role-row__flag { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; }
  .mc-role-row__warn {
    margin-top: 8px;
    font-size: 11px;
    color: var(--amber);
    font-weight: 600; font-variation-settings: 'wght' 600;
    line-height: 1.4;
  }

  /* ---- Person modal: contact rows ---- */
  .mc-contact-row {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 8px;
  }
  .mc-contact-row__type { flex: 0 0 90px; }
  .mc-contact-row__value { flex: 1; min-width: 0; }
  .mc-contact-row__label { flex: 0 0 30%; }
  .mc-contact-row select,
  .mc-contact-row input[type="email"],
  .mc-contact-row input[type="tel"],
  .mc-contact-row input[type="text"] {
    font-family: var(--font); font-size: 13px;
    padding: 7px 9px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--white);
  }
  .mc-contact-row select:focus,
  .mc-contact-row input:focus { outline: none; border-color: var(--navy); }
  .mc-contact-row__pref {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 11px; color: var(--text-muted);
    white-space: nowrap; cursor: pointer;
  }
  .mc-person-panel__addrow-btns { display: flex; gap: 8px; margin-top: 4px; }
  .mc-person-panel__noneboxes { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 10px; }
  .mc-person-panel__nonebox {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; color: var(--text-muted);
    cursor: pointer; white-space: nowrap;
  }
  /* Visibility badges on the manage people list. */
  .mc-vis-badge {
    display: inline-block; vertical-align: middle;
    margin-left: 8px; padding: 1px 7px; border-radius: 999px;
    font-size: 10px; font-variation-settings: 'wght' 700;
    text-transform: uppercase; letter-spacing: .04em;
  }
  .mc-vis-badge--public { color: #fff; background: var(--green); }
  .mc-vis-badge--hidden { color: var(--text-muted); background: var(--navy-100); border: 1px solid var(--border); }

  .mc-person-panel__ftr {
    padding: 14px 22px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    background: var(--off-white);
  }
  .mc-person-panel__danger {
    background: none; border: none;
    color: var(--red);
    font-family: var(--font); font-size: 12px;
    font-weight: 600; font-variation-settings: 'wght' 600;
    cursor: pointer;
    padding: 6px 8px;
    text-decoration: underline;
  }
  .mc-person-panel__danger:hover { color: var(--red-deep); }

  /* ========== SURFACE 2: Department assignments ========== */
  .mc-dept-card {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 18px 22px;
    margin-bottom: 10px;
  }
  .mc-dept-card.is-editing {
    border-color: var(--navy);
    box-shadow: 0 0 0 3px rgba(34,59,124,0.08);
  }
  .mc-dept-card.mc-dept-card--missing {
    border-left: 3px solid var(--amber);
  }
  .mc-dept-hd {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 10px;
    border-bottom: 2px solid var(--primary);
    margin-bottom: 12px;
  }
  .mc-dept-hd h3 {
    margin: 0;
    font-size: 11px;
    font-weight: 700; font-variation-settings: 'wght' 700;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--navy);
  }
  .mc-dept-warning {
    font-size: 11px;
    color: var(--amber-deep);
    font-weight: 600;
    font-variation-settings: 'wght' 600;
    background: var(--amber-light);
    padding: 3px 9px;
    border-radius: 3px;
    margin-left: 10px;
  }

  /* Section subtitle (small help text under the dept header in editor) */
  .mc-dept-subtitle {
    font-size: 12px;
    color: var(--text-muted);
    margin: -8px 0 12px 0;
    line-height: 1.5;
  }

  /* Primary-role radio in the person side-panel */
  .mc-person-panel__primary-radio {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    margin-right: 10px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .mc-person-panel__primary-radio input {
    margin: 0;
    cursor: pointer;
  }
  .mc-person-panel__primary-mark {
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-muted);
    font-weight: 700;
    font-variation-settings: 'wght' 700;
  }
  .mc-person-panel__primary-radio input:checked + .mc-person-panel__primary-mark {
    color: var(--primary);
  }

  /* Flag row inside a dept-edit assignment row (e.g. Media -> Programme editor) */
  .mc-flag-row {
    grid-column: 1 / -1;
    margin-top: 6px;
    padding-top: 6px;
    border-top: 1px dashed var(--border);
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    font-size: 12px;
  }
  .mc-flag-row .mc-assignment-edit-headcheck {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 3px 10px;
    font-size: 11px;
    color: var(--text);
  }
  .mc-flag-row .mc-assignment-edit-headcheck:hover {
    border-color: var(--navy);
  }

  /* Checklist slot rows — render with a fixed-width role key badge on the left */
  .mc-checklist-slot {
    border-left: 3px solid transparent;
    padding-left: 10px;
  }
  .mc-checklist-slot--missing {
    border-left-color: color-mix(in srgb, var(--amber) 55%, white);
    background: color-mix(in srgb, var(--amber) 6%, white);
  }
  .mc-checklist-slot--optional {
    border-left-color: var(--border);
    opacity: 0.75;
  }
  .mc-checklist-roleKey {
    display: inline-block;
    font-size: 10px;
    font-weight: 800;
    font-variation-settings: 'wght' 800;
    letter-spacing: 0.08em;
    background: var(--navy);
    color: var(--white);
    padding: 2px 7px;
    border-radius: 3px;
    margin-right: 8px;
    vertical-align: 1px;
    min-width: 38px;
    text-align: center;
  }
  .mc-checklist-extras-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--text-muted);
    font-weight: 700;
    font-variation-settings: 'wght' 700;
    margin: 16px 0 8px 0;
    padding-top: 12px;
    border-top: 1px dashed var(--border);
  }

  .mc-assignment-row {
    display: grid;
    grid-template-columns: 1.2fr 1fr auto auto;
    gap: 12px;
    padding: 9px 10px;
    align-items: center;
    border-radius: 5px;
    margin-bottom: 4px;
  }
  .mc-assignment-row:hover { background: var(--off-white); }
  .mc-assignment-row.is-head {
    background: color-mix(in srgb, var(--amber) 12%, white);
  }
  .mc-assignment-name {
    font-weight: 700; font-variation-settings: 'wght' 700;
    font-size: 14px;
  }
  .mc-assignment-role {
    font-size: 13px;
    color: var(--text-muted);
  }
  .mc-assignment-headpill {
    font-size: 9px;
    background: var(--amber);
    color: var(--white);
    padding: 2px 7px;
    border-radius: 2px;
    font-weight: 700; font-variation-settings: 'wght' 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    justify-self: start;
  }

  /* edit mode: assignment becomes a row of inputs */
  .mc-assignment-edit-row {
    display: grid;
    grid-template-columns: 1.3fr 1.3fr auto auto;
    gap: 8px;
    padding: 10px;
    background: var(--off-white);
    border-radius: 4px;
    margin-bottom: 4px;
    align-items: center;
  }
  .mc-assignment-edit-row select,
  .mc-assignment-edit-row input[type="text"] {
    font-family: var(--font); font-size: 13px;
    padding: 6px 9px;
    border: 1px solid var(--border);
    border-radius: 3px;
    width: 100%;
    background: var(--white);
  }
  .mc-assignment-edit-row select:focus,
  .mc-assignment-edit-row input[type="text"]:focus {
    outline: none; border-color: var(--navy);
  }
  .mc-assignment-edit-headcheck {
    display: flex; align-items: center; gap: 6px;
    font-size: 12px;
    white-space: nowrap;
  }
  .mc-assignment-edit-headcheck input { margin: 0; }

  .mc-assignment-remove {
    background: none;
    border: 1px solid var(--border);
    width: 26px; height: 26px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 14px;
    line-height: 1;
    color: var(--text-muted);
    padding: 0;
    transition: all 0.12s;
  }
  .mc-assignment-remove:hover { border-color: var(--red); color: var(--red); }

  .mc-dept-empty {
    font-size: 13px; color: var(--text-muted);
    font-style: italic;
    padding: 8px 0;
  }

  .mc-dept-add-btn {
    background: var(--white);
    border: 1px dashed var(--border);
    padding: 8px 14px;
    font-family: var(--font); font-size: 12px;
    font-weight: 600; font-variation-settings: 'wght' 600;
    color: var(--navy);
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.12s;
    margin-top: 6px;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .mc-dept-add-btn:hover { border-color: var(--navy); background: var(--off-white); }

  .mc-dept-edit-btn {
    background: none; border: 1px solid var(--border);
    padding: 5px 12px;
    font-family: var(--font); font-size: 11px;
    font-weight: 700; font-variation-settings: 'wght' 700;
    letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--navy); cursor: pointer;
    border-radius: 3px;
    transition: all 0.12s;
  }
  .mc-dept-edit-btn:hover { border-color: var(--navy); background: var(--off-white); }

  .mc-dept-footer {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
  }
  .mc-dept-footer .mc-save-btn,
  .mc-dept-footer .mc-cancel-btn,
  .mc-person-panel__ftr .mc-save-btn,
  .mc-person-panel__ftr .mc-cancel-btn {
    font-family: var(--font); font-size: 12px;
    font-weight: 700; font-variation-settings: 'wght' 700;
    text-transform: uppercase; letter-spacing: 0.08em;
    padding: 7px 16px; border-radius: 4px;
    cursor: pointer;
  }
  .mc-save-btn {
    background: var(--navy); color: var(--white); border: none;
  }
  .mc-save-btn:hover { background: var(--navy-600); }
  .mc-cancel-btn {
    background: none; color: var(--text-muted);
    border: 1px solid var(--border);
  }
  .mc-cancel-btn:hover { border-color: var(--text-muted); color: var(--text); }

  /* Club details card (admin only) */
  .mc-details {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px 24px;
    margin-bottom: 16px;
  }
  .mc-field-row {
    display: grid;
    grid-template-columns: 180px 1fr;
    gap: 16px;
    padding: 6px 0;
    align-items: baseline;
  }
  .mc-field-label {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--text-muted); font-weight: 700; font-variation-settings: 'wght' 700;
  }
  .mc-field-value { font-size: 14px; }
  .mc-field-value--muted { color: var(--text-muted); font-style: italic; }
  .mc-field-input {
    width: 100%; font-family: var(--font); font-size: 14px;
    padding: 7px 10px;
    border: 1px solid var(--border);
    border-radius: 4px;
  }
  .mc-field-input:focus { outline: none; border-color: var(--navy); }

  /* Confirm dialog (shared) */
  .mc-confirm-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 200;
    padding: 20px;
  }
  .mc-confirm-box {
    background: var(--white);
    border-radius: 8px;
    padding: 24px 28px;
    max-width: 460px;
    width: 100%;
    box-shadow: 0 12px 48px rgba(0,0,0,0.25);
  }
  .mc-confirm-box h4 {
    margin: 0 0 10px 0;
    font-size: 16px;
    font-weight: 900; font-variation-settings: 'wght' 900;
  }
  .mc-confirm-box p {
    margin: 0 0 14px 0;
    font-size: 14px;
    color: var(--text);
    line-height: 1.6;
  }
  .mc-confirm-box p.mc-confirm-sub {
    color: var(--text-muted);
    font-size: 13px;
  }
  .mc-confirm-box-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 16px;
  }
  .mc-confirm-box button {
    padding: 7px 16px; border-radius: 4px;
    font-family: var(--font); font-size: 12px;
    font-weight: 700; font-variation-settings: 'wght' 700;
    text-transform: uppercase; letter-spacing: 0.08em;
    cursor: pointer;
    border: none;
  }
  .mc-confirm-box .mc-cancel-btn {
    background: none; color: var(--text-muted);
    border: 1px solid var(--border);
  }
  .mc-confirm-box .mc-danger-btn {
    background: var(--red); color: var(--white);
  }

    background: var(--navy); color: var(--white);
  }
  .mc-confirm-box .mc-primary-btn:hover { background: var(--navy-600); }

    .page { padding: 16px 12px 60px; }

  }
  @media (max-width: 500px) {
    .s2-phone { display: none; }
  }

<div id="nlTopbar"></div>

<div id="pageWrap">

</div>

<div class="page">

    <div id="listing-root"></div>
  </div>

    <div id="club-root"></div>
  </div>
  <div class="scene" id="scene-builder">

    </div>

    <div class="lb-modebar">
      <div class="lb-modebar__group" id="lbModeGroup">
        <button class="btn btn--toggle btn--sm" data-lb-mode="heads" aria-pressed="true">Dept heads only</button>

        <span class="demo-bar__label">Contact</span>
        <button class="btn btn--toggle btn--sm" data-lb-contact="person" aria-pressed="true">The person</button>
        <button class="btn btn--toggle btn--sm" data-lb-contact="role">The role inbox</button>
      </div>
    </div>

    <div class="lb-grid">
      <section class="lb-panel">
        <div class="lb-panel-hd">
          <h3>Departments</h3>
          <div class="lb-panel-actions">
            <button class="btn btn--link" id="lbDeptsAll">all</button>
            <button class="btn btn--link" id="lbDeptsNone">none</button>
          </div>
        </div>
        <div id="lbDepts"></div>
      </section>

      <section class="lb-panel">
        <div class="lb-panel-hd">
          <h3>Divisions &amp; clubs</h3>
          <div class="lb-panel-actions">
            <button class="btn btn--link" id="lbClubsAll">all</button>
            <button class="btn btn--link" id="lbClubsNone">none</button>
          </div>
        </div>
        <div id="lbDivisions"></div>
      </section>
    </div>

    <div id="lbWarnings"></div>

    <section class="lb-results">
      <div class="lb-results-hd">
        <div class="lb-results-stats">
          <span class="lb-count" id="lbCount">0</span>
          <span class="lb-count-sub" id="lbCountSub">people match</span>
        </div>
        <div class="lb-results-actions">
          <button class="btn btn--navy" data-copy-fmt="named">Copy named emails</button>
          <button class="btn btn--navy" data-copy-fmt="plain">Copy plain emails</button>
          <button class="btn btn--navy" data-copy-fmt="csv">Copy as CSV</button>
        </div>
      </div>
      <div id="lbResults"></div>
    </section>
  </div>

  <!-- MANAGE CONTACTS SCENE (admin + club-editor) -->
  <div class="scene" id="scene-manage">
    <div class="mc-root" id="mc-root"></div>
  </div>

  <!-- ACTIVITY SCENE (admin/superadmin) — tool-local directory audit -->
  <div class="scene" id="scene-audit">
    <div id="audit-root"></div>
  </div>

  <!-- COMPLETION SCENE — club checklist (club-editor) / league compliance (staff+admin) -->
  <div class="scene" id="scene-dashboard">
    <div id="dashboard-root"></div>
  </div>

  <!-- DATA CLEANUP SCENE (superadmin) — one-off model-v2 migration + dedupe -->
  <div class="scene" id="scene-cleanup">
    <div id="cleanup-root"></div>
  </div>
</div>

</div><!-- /#pageWrap -->
