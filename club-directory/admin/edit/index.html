<!DOCTYPE html>
<!--
  NL Tools — redirect stub
  Version: v3.1 (14/11/2026)
  File: /club-directory/admin/edit/index.html

  The Club Directory editor was a page of its own here from 11/11/2026, and
  at /club-directory/editor/ before that. Editing now happens on the staff
  page itself, behind its Edit button (Richard, 11/11/2026); the code moved
  to /club-directory/_editor.js. This address forwards to /club-directory/
  (one page since 14/11/2026) with ?edit, which opens it in editing, and keeps any #club.
  GitHub Pages cannot send a 301, so this is a meta refresh plus a script,
  with a real link for a browser that ignores both. No stylesheet, no script
  from /system/: a redirect that waits on an asset can fail to happen.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Club Directory — The National League</title>
  <meta http-equiv="refresh" content="0; url=/club-directory/?edit">
  <link rel="canonical" href="https://nl.tools/club-directory/">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32x32.png">
  <script>location.replace('/club-directory/?edit' + location.hash);</script>
</head>
<body>
  <p>Editing has moved to <a href="/club-directory/?edit">nl.tools/club-directory/</a> – press Edit beside the club picker.</p>
</body>
</html>
