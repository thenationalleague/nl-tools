<!--
  club-directory / editor / index.html
  v1.4 — (05/08/2026) Add, remove and move — the three things the editor
         could not do, plus the trap that fell out of adding them.
         · Add someone: a button at the foot of the club, because a department
           with nobody in it is not rendered, so "add to Ticketing" cannot
           hang off a Ticketing heading that does not exist.
         · Remove: one button covering both of Richard's asks. Removing
           somebody's only role removes them; removing one of several leaves
           them where they still belong, and the confirm says which.
         · Move: a department picker on the row, live only while editing.
         · The rename trap. Josh Knowles is Head of Media AND programme
           editor. A new hire takes the programme, an editor types over the
           name in that row, and Josh becomes Jane in the media department
           too — carrying Josh's email into Jane's entry. That was always the
           behaviour; syncing sibling rows in v1.3 only made it visible.
           Renaming somebody with more than one role now asks which was meant.
           The replacement takes the job title and none of the contact
           details, because a new person wearing the old person's email looks
           correct and is wrong.
         · Anyone the League adds is stamped and carries an "Added by us"
           chip. The sign-off page shows clubs their own submission; quietly
           adding to it would be putting words in their mouth.
         All three are blocked on a signed-off club, and all three confirm,
         because nothing here has an undo — the amber chips can put a
         correction back, a removed person is gone.
  v1.3 — (05/08/2026) Editing the name of somebody who appears in two
         departments. The record was always right — one person, both roles,
         saved once — but the other row on screen kept the old name until a
         redraw, so an editor who renamed someone under Media scrolled to
         Programme, saw the name they had just changed, and either thought it
         had not saved or typed it again. Sibling rows now follow. Job titles
         deliberately do not: a title belongs to one role and is meant to
         differ between departments.
         Also: the name splitter took the first word as the first name, which
         made "Dr Daniel Palmer" a person whose first name is Dr — breaking
         the email-name check, sorting, and anything reading lastName. Twelve
         people across the 72 clubs carry a title or post-nominals. It now
         peels off what is already on the record plus the handful a club would
         actually type, and leaves everything else where the editor put it.
  v1.2 — (05/08/2026) Four fixes and a second door, all of them things that
         made the tool harder to use than the job it does.
         · Re-check all (master only). The bake is one-shot, correctly, which
           also means a fix to the tidier can never reach a directory that has
           already been built — and _tidy.js v1.1 turned out to have been
           missing "Director Of Football" all along. This runs only the two
           passes that are safe against edited data: minor-word casing, which
           is idempotent, and the attention scan, which writes nothing. The
           typo list, the compound split, the merge and the full recase all
           stay behind the bake, because against a record an editor has since
           corrected they would be judgements about the editor's work.
         · Hash routing. A club per URL, so an editor can send one to a
           colleague, reopen where they left off, and not lose their place on
           every refresh. The reader and the staff view already had it.
         · An empty job title renders "No job title" in italics, and editing
           it meant deleting those words first. The placeholder now clears on
           the way in and comes back if the cell is still empty on the way out.
         · Red chips for what _tidy.js v1.1 flags but will not fix: a mailbox
           that does not match the name, a phone number the wrong length, one
           title carried across two departments. The reason sits in the
           tooltip, not the chip.
         · The bake stores that flag list alongside the change log, and counts
           it in the audit entry and the master diagnostic line.
  v1.1 — (05/08/2026) The row pen is canon. .ed-pen was the third hand-rolled
         icon-only button in the repo and the reason .btn--icon was promoted
         into nl-brand.css v2.33; the local box/colour/size CSS is deleted and
         only its position survives. The glyph now comes from NL.icon() rather
         than the tool-local strokeGlyph(), which hardcodes fill/stroke onto
         the svg and so only ever renders the stroked half of the sprite.
  v1.0 — (04/08/2026) The directory, editable, behind per-person six-digit codes.

  What this is
  ------------
  Where the League's admin team keeps the directory right. Every edit writes
  straight to app-data/ops-club-directory/clubs and is attributable, because
  each editor holds their own code and therefore their own uid. A shared code
  would make the audit trail say nothing, and the audit trail is the reason
  this exists rather than people editing the database by hand.

  The margin markers
  ------------------
  Any field the bake changed carries a marker in the gutter. Click it and it
  says what the club actually sent, with one click to put it back. That is the
  difference between "we tidied your data" and "we changed something and you
  cannot see what" — and it is why _tidy.js threads a provenance log through
  every pass rather than just counting.

  The bake
  --------
  One-shot, master key only, and it refuses to run twice. It reads the raw
  submissions, runs the same tidier the sign-off pages promise clubs, and
  writes the result here with its provenance. After that the tidier never runs
  against this node again: re-running it would stomp on editor work.

  Not lint-covered: no auth-guard, by design.
-->

<style>
  .ed-top {
    position: sticky; top: 0; z-index: 50; background: var(--navy); color: var(--white);
    padding: 10px clamp(14px, 3vw, 28px);
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  .ed-top__t {
    font-size: var(--text-xs); text-transform: uppercase; letter-spacing: var(--tracking-wide);
    font-weight: 800; font-variation-settings: 'wght' 800;
  }
  /* Visible because a session is resumed silently now, and the claim it
     carries was minted when it started. Someone whose rights changed since
     needs a way to get a fresh token that is not "clear your site data". */
  .ed-out {
    font-family: var(--font); font-size: var(--text-xs);
    font-weight: 700; font-variation-settings: 'wght' 700;
    padding: 4px 10px; border-radius: var(--radius-sm);
    border: 1px solid var(--navy-300); background: none; color: var(--white);
    cursor: pointer;
  }
  .ed-out:hover { background: var(--navy-600); }
  .ed-top__who { margin-left: auto; font-size: var(--text-xs); color: var(--navy-200);
    font-weight: 600; font-variation-settings: 'wght' 600; }
  .ed-pick {
    font-family: var(--font); font-size: var(--text-sm);
    font-weight: 600; font-variation-settings: 'wght' 600;
    padding: 6px 10px; border: 0; border-radius: var(--radius);
    background: var(--white); color: var(--text); max-width: 240px;
  }
  .cd-search { top: 44px; }

  /* Nothing is editable until a pen is pressed. Making every field live on
     tap meant a scroll on a phone could land in a name and change it, and it
     gave no sign that editing was possible at all. */
  .cd-row { position: relative; padding-right: 42px; }
  /* The pen is canon .btn--icon (brand v2.33) — box, colours, hover and the
     centred glyph all come from there, and the editing state is a swap from
     .btn--ghost to .btn--primary in addPen/setEditing. All that is this
     tool's business is where it sits. */
  .ed-pen { position: absolute; top: 7px; right: 8px; }

  /* Move and remove appear only on the row being edited. Off the pen they
     would be three controls on every row of a hundred-row club, and the whole
     reason the pen exists is that a page where everything is live is a page
     where a scroll on a phone changes somebody's name. */
  .ed-acts { display: none; }
  .cd-row.is-editing .ed-acts {
    display: flex; align-items: center; gap: 6px;
    grid-column: 1 / -1; margin-top: 8px;
  }
  .ed-dept {
    font-family: var(--font); font-size: var(--text-xs);
    font-weight: 600; font-variation-settings: 'wght' 600;
    padding: 4px 8px; border: 1px solid var(--border);
    border-radius: var(--radius-sm); background: var(--white); color: var(--text);
    max-width: 200px;
  }
  .ed-dept:focus { outline: none; box-shadow: var(--focus-ring); border-color: var(--primary); }
  /* Removing is the one act here with no undo, so it reads as the danger it
     is rather than sitting quietly next to the department picker. */
  .ed-del { color: var(--red); }
  .ed-del:hover { background: var(--red-light); }

  .ed-add { margin: 6px 0 26px; }
  .ed-check label { display: flex; align-items: center; gap: 8px; font-weight: 600;
    font-variation-settings: 'wght' 600; }
  .ed-check input { width: auto; }

  .cd-row.is-editing [data-edit] {
    background: var(--white); border-bottom: 1px dashed var(--navy-300); cursor: text;
  }
  .cd-row.is-editing [data-edit]:focus {
    outline: none; box-shadow: var(--focus-ring); border-bottom-color: var(--primary);
  }

  /* Provenance sits in the margin, not in the row. A sentence under the field
     pushed every person apart and read as prose when all it needs to say is
     what the club sent. These are chips: two or three words, the original
     value, stacked in the order of the fields they refer to.

     Amber is a correction we made and can undo. Red is a gap the club left,
     which is not ours to undo and wants chasing instead. Both use the light
     tokens rather than solid fills — 21% of role entries have no job title
     and Chester alone has sixteen, so a saturated red would wall the page
     rather than flag anything. */
  .ed-pills { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
  .ed-pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 2px 9px; border-radius: var(--radius-pill);
    font-size: var(--text-xs); line-height: 1.5;
    font-weight: 700; font-variation-settings: 'wght' 700;
    max-width: 100%; overflow-wrap: anywhere;
  }
  .ed-pill--was { background: var(--amber-light); color: var(--amber-deep); }
  .ed-pill--gap { background: var(--red-light);   color: var(--red); }
  .ed-pill button {
    padding: 0; border: 0; background: none; cursor: pointer; color: inherit;
    font: inherit; text-decoration: underline; opacity: 0.75;
    /* The chip wraps on the value, which can be long. The action must not:
       overflow-wrap:anywhere broke "undo" across two lines as "und / o". */
    white-space: nowrap; flex: 0 0 auto;
  }
  .ed-pill button:hover { opacity: 1; }

  /* Wide: a fifth column in the gutter, so the chips annotate the row from
     outside it. Editor-only — the reader has nothing to put there. */
  @media (min-width: 861px) {
    .cd-row {
      grid-template-columns:
        minmax(140px, 1.05fr) minmax(120px, 1.05fr) minmax(180px, 1.5fr)
        minmax(105px, 0.65fr) minmax(150px, 1fr);
    }
    .ed-pills { grid-column: 5; grid-row: 1; padding-left: 4px; }
  }
  /* Narrow: beneath the whole entry rather than beside any one field. */
  @media (max-width: 860px) {
    .ed-pills { grid-column: 1 / -1; flex-direction: row; flex-wrap: wrap;
      align-items: center; margin-top: 6px; }
  }

  /* Sign-off, foot of the club. The whole point of the tool is that somebody
     has actually looked at a club, so the state has to be visible before you
     reach the button and honest about who and when. */
  .ed-signoff {
    margin: 26px 0 0; padding: 16px 18px; border-radius: var(--radius);
    border: 1px solid var(--border); background: var(--white);
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  }
  .ed-signoff.is-done { border-color: var(--green); background: var(--green-light); }
  .ed-signoff__t { min-width: 0; flex: 1 1 260px; }
  .ed-signoff__t h3 {
    margin: 0 0 3px; font-size: var(--text-base);
    font-weight: 800; font-variation-settings: 'wght' 800; color: var(--navy);
  }
  .ed-signoff.is-done .ed-signoff__t h3 { color: var(--green); }
  .ed-signoff__t p { margin: 0; font-size: var(--text-sm); color: var(--text-muted);
    line-height: 1.5; max-width: 62ch; }

  /* A locked club still reads normally; it just cannot be changed. The pen
     becomes an eye rather than disappearing — fixtures/index.html has done
     this for a while and it is the better idea: the icon states what you can
     do before you press it, where a missing control only raises the question.
     The undo on a correction chip goes, since that is an edit too. */
  .is-locked .ed-pill button { display: none; }

  /* Merge note, foot of the club. Context rather than alarm, so it is quiet. */
  .ed-merges {
    margin: 26px 0 0; padding: 14px 16px; border: 1px solid var(--border);
    border-radius: var(--radius); background: var(--white);
  }
  /* Master-only strip under the banner. "Where is the club data" could not be
     answered from the outside, because an empty facts grid renders as a rule
     and a gap rather than as nothing. This says what the record actually
     holds, so a missing field is visible instead of inferred. */
  .ed-diag {
    margin: 0 0 18px; padding: 8px 12px; border-radius: var(--radius-sm);
    background: var(--navy-50); color: var(--text-muted);
    font-size: var(--text-xs); line-height: 1.5;
  }
  .ed-diag b { color: var(--navy); font-weight: 800; font-variation-settings: 'wght' 800; }
  .ed-diag .bad { color: var(--red); font-weight: 800; font-variation-settings: 'wght' 800; }
  .ed-merges h3 {
    margin: 0 0 6px; font-size: var(--text-xs); text-transform: uppercase;
    letter-spacing: var(--tracking-wide);
    font-weight: 800; font-variation-settings: 'wght' 800; color: var(--text-muted);
  }
  .ed-merges p { margin: 0 0 8px; font-size: var(--text-sm); color: var(--text-muted);
    line-height: 1.55; max-width: 70ch; }
  .ed-merges ul { margin: 0; padding-left: 18px; font-size: var(--text-sm); line-height: 1.6; }

  .ed-bake { margin: 40px 0 0; padding: 18px; border: 1px solid var(--amber);
    border-radius: var(--radius); background: var(--amber-light); }
  .ed-bake p { margin: 0 0 10px; font-size: var(--text-sm); line-height: 1.55; max-width: 70ch; }
</style>

<body>

<div id="gateWrap"></div>

<div id="app" hidden>
  <div class="ed-top">
    <span class="ed-top__t">Directory Editor</span>
    <select class="ed-pick" id="pick" aria-label="Choose a club"></select>
    <span class="ed-top__who" id="who"></span>
    <button class="ed-out" id="recheck" type="button" hidden>Re-check all</button>
    <button class="ed-out" id="signOut" type="button">Sign out</button>
  </div>
  <div class="cd-wrap">
    <div class="cd-search"><div class="cd-search__box">
      <svg class="cd-search__icon" width="17" height="17" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
      <input class="cd-search__in" id="q" placeholder="Search clubs, people and job titles"
        aria-label="Search">
    </div></div>
    <div id="out"></div>
    <div id="extra"></div>
  </div>
</div>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var esc = NL.escHtml;
  var ROOT = NLGate.ROOT;
  var ALL = {}, PROV = {}, names = [], session = null, current = '';

  NLGate.ensure({
    title: 'Directory Editor',
    sub: 'Enter your six-digit editor code.',
    mount: $('gateWrap')
  }).then(function (s) {
    session = s;
    if (s.role !== 'editor' && s.role !== 'admin') {
      throw new Error('That code opens the reader, not the editor.');
    }
    $('gateWrap').hidden = true;
    $('who').textContent = (s.name || '') + (s.role === 'admin' ? ' (master)' : '');
    $('signOut').addEventListener('click', function () {
      NLGate.signOut().then(function () { location.reload(); });
    });
    return Promise.all([
      NL.clubs.load(),
      firebase.database().ref(ROOT + '/clubs').once('value'),
      firebase.database().ref(ROOT + '/provenance').once('value')
    ]);
  }).then(function (res) {
    ALL = res[1].val() || {};
    PROV = res[2].val() || {};
    names = Object.keys(ALL).sort();
    NL.installAuditHook();
    if (!names.length) { offerBake(); $('app').hidden = false; return; }
    offerRecheck();
    $('pick').innerHTML = names.map(function (n) {
      return '<option value="' + esc(n) + '">' + esc(n) + '</option>';
    }).join('');
    $('pick').addEventListener('change', function () { draw(this.value); });
    $('q').addEventListener('input', onSearch);
    $('app').hidden = false;
    /* A club per URL, same as the reader and the staff view. Without it an
       editor cannot send "look at this one" to a colleague, cannot reopen
       where they left off, and loses their place on every refresh — which on
       a 72-club job is the difference between a tool and a chore. */
    var first = fromHash() || names[0];
    $('pick').value = first;
    draw(first);
    window.addEventListener('hashchange', function () {
      var n = fromHash();
      if (n && n !== current) { $('pick').value = n; draw(n); }
    });
  }).catch(function (err) {
    $('out').innerHTML = '<p class="cd-empty">' + esc((err && err.message) || String(err)) + '</p>';
    $('app').hidden = false;
  });

  /* --------------------------------------------------------- the re-check
     The bake is one-shot by design: re-running it would overwrite whatever
     the editors have since put right. That is correct, and it also means a
     fix to the tidier can never reach a directory that has already been
     built — which is exactly what happened when _tidy.js v1.1 turned out to
     have been missing "Director Of Football" all along.

     So there is a second, much smaller door. It runs only the two passes
     that are safe to run against edited data:

       · minorCase, which lowercases interior minor words in a job title.
         Idempotent, and it cannot touch anything but the case of and/of/for.
       · flagAttention, which writes no data at all — it only reports.

     It does NOT re-run the typo list, the compound split, the merge or the
     full recase. Those make judgements about what the club originally sent,
     and against a record an editor has since corrected they would be
     judgements about the editor's work instead.

     Master key only, and it says what it did rather than reloading silently. */
  function offerRecheck() {
    if (session.role !== 'admin') { return; }
    $('recheck').hidden = false;
    $('recheck').addEventListener('click', runRecheck);
  }

  function runRecheck() {
    NL.confirm(
      'Re-check every club for minor-word capitalisation ("Director Of Football"), ' +
      'and re-scan for anything that needs an editor to look at it — a mailbox that ' +
      'does not match the name, a phone number the wrong length, one job title used ' +
      'in two departments.\n\n' +
      'Nothing else is touched. Corrections editors have already made stay exactly ' +
      'as they are.',
      { title: 'Re-check all clubs', confirmText: 'Re-check' }
    ).then(function (ok) {
      if (!ok) { return; }
      var btn = $('recheck');
      btn.disabled = true; btn.textContent = 'Checking…';
      var db = firebase.database(), updates = {}, cased = 0, flagged = 0, clubs = 0;
      Object.keys(ALL).forEach(function (club) {
        var rec = ALL[club], touched = false;
        var extra = [];
        NLTidy.arr(rec.people).forEach(function (p, pi) {
          NLTidy.arr(p.roles).forEach(function (r, ri) {
            var t = (r.title || '').trim();
            if (!t) { return; }
            var out = NLTidy.minorCase(t);
            if (out === t) { return; }
            r.title = out; touched = true; cased++;
            extra.push({ path: 'people/' + (p.id || ('i' + pi)) + '/roles/' + ri + '/title',
                         from: t, to: out, kind: 'case' });
          });
        });
        var att = NLTidy.flagAttention(rec);
        flagged += att.length;
        var prov = PROV[club] || {};
        var changes = NLTidy.arr(prov.changes).concat(extra);
        if (touched) { updates['clubs/' + club] = rec; clubs++; }
        updates['provenance/' + club] = { changes: changes,
          merges: NLTidy.arr(prov.merges), attention: att };
        PROV[club] = updates['provenance/' + club];
      });
      NL.writeAudit('directory_recheck',
        cased + ' title(s) recased across ' + clubs + ' club(s), ' +
        flagged + ' flagged for attention (' + (session.name || 'master') + ')');
      db.ref(ROOT).update(updates).then(function () {
        NL.toast(cased + ' title(s) corrected, ' + flagged + ' flagged for attention',
          'success');
        btn.disabled = false; btn.textContent = 'Re-check all';
        if (current) { draw(current); }
      }).catch(function (err) {
        NL.toast('Could not save: ' + ((err && err.message) || err), 'error');
        btn.disabled = false; btn.textContent = 'Re-check all';
      });
    });
  }

  /* ------------------------------------------------------------ the bake
     Only offered when the node is empty, only to the master key, and it
     re-checks emptiness at the moment of writing rather than trusting what
     the page loaded — two people pressing it at once should not both win. */
  function offerBake() {
    if (session.role !== 'admin') {
      $('out').innerHTML = '<p class="cd-empty">The directory has not been built yet.</p>';
      return;
    }
    $('out').innerHTML =
      '<div class="ed-bake">' +
      '<p><b>The directory is empty.</b> Building it reads every club’s submission, ' +
      'applies the same tidying the sign-off pages promised them — capitalisation, ' +
      'job-title typos, splitting a title that names two jobs, merging anyone entered ' +
      'twice — and writes the result here with a record of every change.</p>' +
      '<p>This runs once. Afterwards the tidier never touches this data again, because ' +
      're-running it would overwrite whatever the editors have since put right.</p>' +
      '<button class="btn btn--primary" id="bakeBtn">Build the directory</button>' +
      '</div>';
    $('bakeBtn').addEventListener('click', runBake);
  }

  function runBake() {
    var btn = $('bakeBtn');
    btn.disabled = true;
    btn.textContent = 'Building…';
    var db = firebase.database();
    db.ref(ROOT + '/clubs').once('value').then(function (snap) {
      if (snap.val()) { throw new Error('The directory already has data. Not overwriting it.'); }
      return db.ref('app-data/ops-club-contacts/submissions').once('value');
    }).then(function (snap) {
      var subs = snap.val() || {};
      var clubs = {}, prov = {}, changed = 0, flagged = 0;
      Object.keys(subs).forEach(function (token) {
        var rec = subs[token];
        if (!rec || !rec.club) { return; }
        var out = NLTidy.run(rec);
        out.rec.club = rec.club;
        clubs[rec.club] = out.rec;
        prov[rec.club] = { changes: out.changes, merges: out.merges,
                           attention: out.attention };
        changed += out.changes.length;
        flagged += (out.attention || []).length;
      });
      if (!Object.keys(clubs).length) { throw new Error('No submissions found to build from.'); }
      NL.writeAudit('directory_bake',
        'Built the directory from ' + Object.keys(clubs).length + ' submissions, ' +
        changed + ' changes recorded, ' + flagged + ' flagged for attention');
      return db.ref(ROOT).update({
        clubs: clubs,
        provenance: prov,
        bake: { at: firebase.database.ServerValue.TIMESTAMP,
                by: session.name || '', clubs: Object.keys(clubs).length,
                changes: changed, attention: flagged }
      });
    }).then(function () {
      NL.toast('Directory built. Reloading…', 'success');
      setTimeout(function () { location.reload(); }, 900);
    }).catch(function (err) {
      NL.toast((err && err.message) || String(err), 'error');
      btn.disabled = false;
      btn.textContent = 'Build the directory';
    });
  }

  /* ------------------------------------------------------------ render */
  function fromHash() {
    var h = decodeURIComponent((location.hash || '').replace(/^#/, ''));
    return names.indexOf(h) > -1 ? h : '';
  }

  function draw(name) {
    current = name;
    var rec = ALL[name];
    if (!rec) { return; }
    rec.club = rec.club || name;
    if (location.hash !== '#' + encodeURIComponent(name)) {
      history.replaceState(null, '', '#' + encodeURIComponent(name));
    }
    $('out').innerHTML = NLDirectory.renderClub(rec, { showHidden: true });
    var crest = document.getElementById('cdCrest');
    if (crest) {
      crest.alt = name + ' crest'; crest.hidden = false;
      NL.clubs.wireCrestImg(crest, name, true);
      crest.src = NL.clubs.crestUrl(name, 'medium');
    }
    wireEditing(name);
    markProvenance(name);
    markAttention(name);
    markAdded(name);
    markGaps(name, rec);
    showAdd(name, rec);
    showMerges(name);
    showSignoff(name, rec);
    if (session.role === 'admin') { diagnose(name, rec); }
  }

  /* What this record actually contains. Master only — it is a maintenance
     readout, not something an editor needs. */
  function diagnose(name, rec) {
    var people = NLDirectory.arr(rec.people);
    var info = rec.info || {};
    var infoFilled = Object.keys(info).filter(function (k) {
      return String(info[k] == null ? '' : info[k]).trim() !== '';
    }).length;
    var withEmail = people.filter(function (p) { return NLDirectory.arr(p.emails).length; }).length;
    var withPhone = people.filter(function (p) { return NLDirectory.arr(p.phones).length; }).length;
    var prov = (PROV[name] || {});
    var n = function (v, label) {
      return '<b class="' + (v ? '' : 'bad') + '">' + v + '</b> ' + label;
    };
    var el = document.createElement('div');
    el.className = 'ed-diag';
    el.innerHTML = 'This record holds ' + n(people.length, 'people') + ', ' +
      n(infoFilled, 'club detail fields') + ', ' + n(withEmail, 'with an email') +
      ', ' + n(withPhone, 'with a phone') + ', ' +
      n(NLDirectory.arr(prov.changes).length, 'recorded changes') + ', ' +
      n(NLDirectory.arr(prov.merges).length, 'merges') + ', ' +
      n(NLDirectory.arr(prov.attention).length, 'flagged for attention') + '.';
    var banner = $('out').querySelector('.cd-facts') || $('out').querySelector('.cd-banner');
    if (banner) { banner.parentNode.insertBefore(el, banner.nextSibling); }
  }

  /* Rows render from the shared module, so editability is attached afterwards
     rather than forking the presentation for one of the three doors. */
  function wireEditing(club) {
    var rec = ALL[club];
    var rows = $('out').querySelectorAll('.cd-row');
    var people = NLDirectory.arr(rec.people);
    var seen = {};
    rows.forEach(function (row) {
      var dept = row.closest('.cd-dept').querySelector('.cd-dept__h').textContent.trim();
      var idx = (seen[dept] = (seen[dept] || 0));
      seen[dept]++;
      var inDept = people.filter(function (p) {
        return NLDirectory.rolesOf(p).some(function (r) { return r.section === dept; });
      });
      var person = inDept[idx];
      if (!person) { return; }
      row.dataset.pid = person.id || '';
      editable(row.children[0], person, 'name', club);
      var roleIdx = NLDirectory.rolesOf(person).map(function (r, i) {
        return r.section === dept ? i : -1;
      }).filter(function (i) { return i > -1; })[0];
      /* Which of this person's roles this row is. Without it a marker for one
         role lands on every row the person appears in, so a title flagged in
         Programme also shows against their Media entry — twice the chips, half
         of them pointing at the wrong department. */
      if (roleIdx != null) {
        row.dataset.ridx = roleIdx;
        editable(row.children[1], person, 'roles/' + roleIdx + '/title', club);
      }
      addPen(row, !!signedOffBy(rec));
      if (!signedOffBy(rec) && roleIdx != null) { addRowActions(row, club, person, roleIdx); }
    });
  }

  /* ------------------------------------------------- structural changes
     Correcting a field and changing the shape of a club are different acts.
     A field edit rewrites one value in place and the row stays where it is;
     adding, removing or moving someone changes which rows exist and which
     department they sit under, so the club has to be redrawn afterwards.

     All three are blocked on a signed-off club, and all three confirm before
     they do anything — not because a misclick is catastrophic, but because
     nothing here has an undo. The amber chips can put a correction back; a
     removed person is gone. */
  function saveStructure(club, what) {
    NL.writeAudit('directory_structure',
      club + ' — ' + what + ' (' + (session.name || 'editor') + ')');
    return firebase.database().ref(ROOT + '/clubs/' + club).set(ALL[club])
      .then(function () { NL.toast(what, 'success'); draw(club); })
      .catch(function (err) {
        NL.toast('Could not save: ' + ((err && err.message) || err), 'error');
      });
  }

  /* Ids look like the ones the submission form mints — 'p' plus base-36 — so
     a person added here is indistinguishable from one that came through the
     form, which is what provenance and the sign-off links both key on. */
  function newId() {
    return 'p' + Math.random().toString(36).slice(2, 10) + Math.random().toString(36).slice(2, 5);
  }

  function deptSelect(value) {
    var s = document.createElement('select');
    s.className = 'ed-dept';
    NLDirectory.ORDER.forEach(function (name) {
      var o = document.createElement('option');
      o.value = name; o.textContent = name;
      if (name === value) { o.selected = true; }
      s.appendChild(o);
    });
    return s;
  }

  /* Move and remove, both live only while the row is being edited. Off the
     pen they would be five controls per row across a hundred rows, and the
     whole reason the pen exists is that a page where everything is live is a
     page where a scroll changes somebody's name. */
  function addRowActions(row, club, person, ridx) {
    var wrap = document.createElement('div');
    wrap.className = 'ed-acts';

    var move = deptSelect(NLDirectory.rolesOf(person)[ridx].section);
    move.title = 'Move this role to another department';
    move.setAttribute('aria-label', 'Department for this role');
    move.addEventListener('change', function () {
      var from = NLDirectory.rolesOf(person)[ridx].section, to = move.value;
      if (from === to) { return; }
      NLDirectory.rolesOf(person)[ridx].section = to;
      saveStructure(club, NLDirectory.fullName(person) + ' moved from ' + from + ' to ' + to);
    });

    var del = document.createElement('button');
    del.className = 'btn btn--icon btn--ghost ed-del';
    del.type = 'button';
    del.title = 'Remove this entry';
    del.setAttribute('aria-label', 'Remove this entry');
    del.appendChild(NL.icon('delete'));
    del.addEventListener('click', function (e) {
      e.stopPropagation();
      removeRole(club, person, ridx);
    });

    wrap.appendChild(move);
    wrap.appendChild(del);
    row.appendChild(wrap);
  }

  /* One button for both of the things Richard asked for. Removing somebody's
     only role removes them; removing one of several leaves them where they
     still belong. The message says which, so the difference is visible before
     the click rather than discovered after it. */
  function removeRole(club, person, ridx) {
    var roles = NLDirectory.rolesOf(person);
    var name = NLDirectory.fullName(person) || 'this person';
    var here = roles[ridx].section;
    var rest = roles.filter(function (r, i) { return i !== ridx; })
      .map(function (r) { return r.section; });
    var last = !rest.length;
    var msg = last
      ? 'Remove ' + name + ' from the directory entirely? This is their only role, so ' +
        'the whole entry goes — name, contact details and all.'
      : 'Remove ' + name + ' from ' + here + '? They stay in the directory under ' +
        rest.join(' and ') + '.';
    NL.confirm(msg + '\n\nThere is no undo on this one.', {
      title: last ? 'Remove person' : 'Remove role',
      variant: 'danger',
      confirmText: last ? 'Remove person' : 'Remove role'
    }).then(function (ok) {
      if (!ok) { return; }
      var people = NLDirectory.arr(ALL[club].people);
      if (last) {
        ALL[club].people = people.filter(function (p) { return p !== person; });
        saveStructure(club, name + ' removed from the directory');
      } else {
        person.roles = roles.filter(function (r, i) { return i !== ridx; });
        ALL[club].people = people;
        saveStructure(club, name + ' removed from ' + here);
      }
    });
  }

  /* Adding is the one action with no row to hang off, and the department it
     belongs to may not be on screen at all — renderClub skips a department
     with nobody in it, so "add to Ticketing" cannot be a button under a
     Ticketing heading that does not exist. Hence one button at the foot and a
     department picker in the form. */
  function addPerson(club) {
    var form = document.createElement('div');
    form.className = 'form-grid';
    form.innerHTML =
      '<div class="form-group span2"><label>Name <span class="req">*</span></label>' +
        '<input id="apName" autocomplete="off" placeholder="Jane Smith"></div>' +
      '<div class="form-group"><label>Department</label><span id="apDept"></span></div>' +
      '<div class="form-group"><label>Job title</label>' +
        '<input id="apTitle" autocomplete="off" placeholder="Ticketing Manager"></div>' +
      '<div class="form-group"><label>Email</label>' +
        '<input id="apEmail" type="email" autocomplete="off"></div>' +
      '<div class="form-group"><label>Phone</label>' +
        '<input id="apPhone" autocomplete="off"></div>' +
      '<div class="form-group span2 ed-check">' +
        '<label><input type="checkbox" id="apHide"> Keep their contact details out of the ' +
        'published directory</label>' +
        '<p class="form-hint">We still hold them; the reader shows "Not published".</p></div>';
    var sel = deptSelect('Other');
    sel.id = 'apDeptSel';
    form.querySelector('#apDept').appendChild(sel);

    var ctrl = NL.modal({
      title: 'Add someone to ' + club,
      body: form,
      buttons: [
        { label: 'Cancel', className: 'btn--ghost', onClick: function (c) { c.close(); } },
        { label: 'Add', className: 'btn--primary', onClick: function (c) {
          var name = form.querySelector('#apName').value.trim();
          if (!name) { NL.toast('A name is needed', 'error'); return; }
          var email = form.querySelector('#apEmail').value.trim();
          var phone = form.querySelector('#apPhone').value.trim();
          var person = { id: newId(), title: '', postNominals: '',
            firstName: '', lastName: '', name: name,
            emails: email ? [email] : [], phones: phone ? [{ number: phone }] : [],
            hideContact: !!form.querySelector('#apHide').checked,
            /* Stamped, because a person the League typed in is not a person
               the club submitted, and the difference has to survive. The
               sign-off page shows clubs what we hold; attributing our own
               addition to them would be putting words in their mouth. */
            added: { at: Date.now(), by: session.name || 'editor' },
            roles: [{ section: sel.value, title: form.querySelector('#apTitle').value.trim() }] };
          /* Through the same splitter the row edit uses, so an added "Dr Jane
             Smith" lands in the same fields as an edited one. */
          setAt(person, 'name', name);
          ALL[club].people = NLDirectory.arr(ALL[club].people).concat(person);
          c.close();
          saveStructure(club, name + ' added to ' + sel.value);
        } }
      ]
    });
    setTimeout(function () { form.querySelector('#apName').focus(); }, 30);
    return ctrl;
  }

  /* One pen per person. Pressing it turns that row's fields on and puts the
     cursor in the name; pressing it again, or clicking away, turns them off.
     Editing stays off until asked for, so a scroll on a phone cannot land in
     somebody's name and change it. */
  /* Pen when the club is open, eye when it is signed off. Same button, and the
     icon carries the permission before you press it — the pattern
     fixtures/index.html has used for a while, and better than a control that
     simply vanishes, which only raises the question. */
  function addPen(row, locked) {
    var b = document.createElement('button');
    /* Canon icon button. aria-label is load-bearing, not decoration: there is
       no text node in here, so without it the row announces "button". */
    b.className = 'btn btn--icon btn--ghost ed-pen';
    b.type = 'button';
    var label = locked ? 'View only \u2014 this club is marked complete' : 'Edit this entry';
    b.title = label;
    b.setAttribute('aria-label', label);
    b.appendChild(NL.icon(locked ? 'eye' : 'edit'));
    if (locked) { b.disabled = true; row.appendChild(b); return; }
    b.addEventListener('click', function (e) {
      e.stopPropagation();
      setEditing(row, !row.classList.contains('is-editing'));
    });
    row.appendChild(b);
  }

  function setEditing(row, on) {
    row.classList.toggle('is-editing', on);
    /* The pen fills in while the row is live. Swapping the canon colour
       variant rather than restating the colours locally — that restatement
       is what .btn--icon exists to stop. */
    var pen = row.querySelector('.ed-pen');
    if (pen) {
      pen.classList.toggle('btn--primary', on);
      pen.classList.toggle('btn--ghost', !on);
    }
    var cells = row.querySelectorAll('[data-edit]');
    cells.forEach(function (c) {
      if (on) { c.setAttribute('contenteditable', 'plaintext-only'); unplaceholder(c); }
      else { c.removeAttribute('contenteditable'); replaceholder(c); }
    });
    if (on && cells[0]) { cells[0].focus(); }
  }

  /* An empty title renders as "No job title" in italics, which is right for
     reading and wrong for editing: the words are ours, not the club's, and
     having to delete them before you can type is nonsense. So the placeholder
     comes out when the row goes live and back in if the cell is still empty
     when it closes. The record is unaffected either way — an empty cell is an
     empty title, not the string "No job title". */
  function placeholderText(cell) {
    var em = cell.querySelector('em');
    return (em && cell.textContent.trim() === em.textContent.trim()) ? em.textContent : '';
  }
  function unplaceholder(cell) {
    var t = placeholderText(cell);
    if (t) { cell.dataset.empty = t; cell.textContent = ''; }
  }
  function replaceholder(cell) {
    if (!cell.textContent.trim() && cell.dataset.empty) {
      cell.innerHTML = '<em>' + esc(cell.dataset.empty) + '</em>';
    }
  }

  function valueAt(person, path) {
    if (path === 'name') { return NLDirectory.fullName(person); }
    var parts = path.split('/'), cur = person;
    for (var i = 0; i < parts.length; i++) {
      if (cur == null) { return ''; }
      cur = cur[parts[i]];
    }
    return cur == null ? '' : String(cur);
  }
  /* A record holds title / firstName / lastName / postNominals separately, but
     the row shows one name and edits one name. Splitting on the first space
     alone made "Dr Daniel Palmer" a person whose first name is Dr, which then
     breaks the email-name check, sorting, and anything that reads lastName.
     Twelve people across the 72 clubs carry one of these.

     Only what is already on the record is peeled off, plus the handful of
     honorifics and post-nominals a club would actually type. Anything else
     stays in the name where the editor put it — this should not be a parser. */
  var HONORIFIC = /^(dr|mr|mrs|ms|miss|mx|sir|dame|prof|professor|rev|reverend|lord|lady|capt|major|col)\.?$/i;
  var POSTNOM  = /^(mbe|obe|cbe|kbe|dbe|bem|dl|jp|kc|qc|md|phd|frcs|mrcgp|bsc|msc|ba|ma)\.?$/i;

  function setAt(person, path, v) {
    if (path === 'name') {
      var bits = v.trim().split(/\s+/).filter(Boolean);
      var had = function (field, re) {
        var cur = (person[field] || '').trim();
        return function (w) { return (cur && w.toLowerCase() === cur.toLowerCase()) || re.test(w); };
      };
      var isTitle = had('title', HONORIFIC), isPost = had('postNominals', POSTNOM);
      var title = [], post = [];
      while (bits.length > 1 && isTitle(bits[0])) { title.push(bits.shift()); }
      while (bits.length > 1 && isPost(bits[bits.length - 1])) { post.unshift(bits.pop()); }
      person.title = title.join(' ');
      person.postNominals = post.join(' ');
      person.firstName = bits.shift() || '';
      person.lastName = bits.join(' ');
      person.name = v.trim();
      return;
    }
    var parts = path.split('/'), cur = person;
    for (var i = 0; i < parts.length - 1; i++) {
      if (cur[parts[i]] == null) { cur[parts[i]] = {}; }
      cur = cur[parts[i]];
    }
    cur[parts[parts.length - 1]] = v;
  }

  function editable(cell, person, path, club) {
    if (!cell) { return; }
    cell.setAttribute('data-edit', path);
    cell.setAttribute('spellcheck', 'false');
    var before = valueAt(person, path);
    cell.addEventListener('focus', function () { before = cell.textContent.trim(); });
    cell.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); cell.blur(); }
      if (e.key === 'Escape') { cell.textContent = before; cell.blur(); }
    });
    cell.addEventListener('blur', function () { commit(cell); });
    /* Stored on the node so the put-back button can commit the same way the
       blur handler does, rather than faking a blur event at it. */
    cell._commit = function () {
      var now = cell.textContent.trim();
      if (now === before) { return; }
      /* Renaming somebody who holds more than one role is genuinely
         ambiguous, and getting it wrong is the worst thing this tool can do.
         See resolveRename. */
      if (path === 'name' && NLDirectory.rolesOf(person).length > 1) {
        var was = before;
        resolveRename(cell, club, person, was, now).then(function (kept) {
          if (kept) { before = now; } else { cell.textContent = was; }
        });
        return;
      }
      setAt(person, path, now);
      if (path === 'name') { syncName(cell, now); }
      save(club, person, path, before, now);
      before = now;
    };
  }

  /* ------------------------------------------------------ the rename trap
     Josh Knowles is Head of Media and also the programme editor: one record,
     two rows. A new hire takes over the programme, an editor opens that row
     and types "Jane Smith" over the name — and Josh becomes Jane in the media
     department too, carrying Josh's email address into Jane's entry.

     That was always the behaviour. What changed is that syncing sibling rows
     made it visible; before, the record was corrupted exactly the same way
     and the other row went on displaying the old name until a redraw, so it
     looked like it had worked.

     The fix is not to pick a side. Both readings are ordinary:
       · same human, spelling corrected  -> rename everywhere
       · different human in this job     -> the name belongs to this role only

     So ask, once, at the moment it becomes ambiguous — which is only ever a
     name, only ever on somebody with more than one role. A single-role person
     has no other entry to damage and is left alone.

     The replacement deliberately does NOT inherit the contact details. A new
     person wearing the old person's email is worse than the rename it was
     meant to fix: it looks correct and it is wrong. They arrive with nothing
     held, which the existing red chips already flag for chasing. */
  function resolveRename(cell, club, person, from, to) {
    var row = cell.closest('.cd-row');
    var ridx = row && row.dataset.ridx ? Number(row.dataset.ridx) : 0;
    var roles = NLDirectory.rolesOf(person);
    var here = (roles[ridx] || {}).section || '';
    var others = roles.filter(function (r, i) { return i !== ridx; })
      .map(function (r) { return r.section; });

    return new Promise(function (resolve) {
      var settled = false;
      var done = function (v) { if (!settled) { settled = true; resolve(v); } };

      NL.modal({
        title: 'Which did you mean?',
        size: 'sm',
        body: '<p class="confirm-text">' + esc(from) + ' is listed under ' +
          esc(here) + ' and ' + esc(others.join(' and ')) + '.</p>' +
          '<p class="confirm-text">Is <b>' + esc(to) + '</b> the same person under a ' +
          'corrected name, or somebody new who has taken over ' + esc(here) + '?</p>' +
          '<p class="form-hint">Somebody new takes the job title but none of the contact ' +
          'details — those belong to ' + esc(from) + '. Worth checking the title still ' +
          'fits once they are in.</p>',
        onClose: function () { done(false); },
        buttons: [
          { label: 'Cancel', className: 'btn--ghost',
            onClick: function (c) { done(false); c.close(); } },
          { label: 'Same person', className: 'btn--ghost', onClick: function (c) {
            setAt(person, 'name', to);
            syncName(cell, to);
            save(club, person, 'name', from, to);
            done(true); c.close();
          } },
          { label: 'New in ' + here, className: 'btn--primary', onClick: function (c) {
            replaceInRole(club, person, ridx, to);
            done(true); c.close();
          } }
        ]
      });
    });
  }

  /* The new person takes the job — the role and its title — and nothing else.
     The old person keeps every other role and their own contact details. */
  function replaceInRole(club, person, ridx, name) {
    var roles = NLDirectory.rolesOf(person);
    var role = roles[ridx];
    var fresh = { id: newId(), title: '', postNominals: '', firstName: '', lastName: '',
      name: name, emails: [], phones: [], hideContact: !!person.hideContact,
      added: { at: Date.now(), by: session.name || 'editor',
               replacing: NLDirectory.fullName(person) },
      roles: [{ section: role.section, title: role.title || '' }] };
    setAt(fresh, 'name', name);
    person.roles = roles.filter(function (r, i) { return i !== ridx; });
    ALL[club].people = NLDirectory.arr(ALL[club].people).concat(fresh);
    saveStructure(club, name + ' replaces ' + NLDirectory.fullName(person) +
      ' in ' + role.section);
  }

  /* Somebody in two departments is one record and two rows. The record is
     updated once and correctly — but the other row keeps showing the old name
     until the page is redrawn, so an editor who renames someone under Media
     scrolls down to Programme, sees the name they just changed, and either
     thinks it did not save or types it again.

     Only the name does this. A job title belongs to one role and is meant to
     differ between departments — that is the whole point of the split rule. */
  function syncName(cell, value) {
    var row = cell.closest('.cd-row');
    if (!row || !row.dataset.pid) { return; }
    $('out').querySelectorAll('.cd-row').forEach(function (other) {
      if (other === row || other.dataset.pid !== row.dataset.pid) { return; }
      var c = other.children[0];
      if (!c || c.getAttribute('contenteditable')) { return; }   /* leave a live cell alone */
      c.textContent = value;
    });
  }

  function commit(cell) { if (cell && cell._commit) { cell._commit(); } }

  /* Straight to the database, as agreed. NL.writeAudit first so the entry
     names the editor and the field rather than just the path that changed. */
  function save(club, person, path, from, to) {
    var db = firebase.database();
    NL.writeAudit('directory_edit',
      club + ' — ' + (NLDirectory.fullName(person) || person.id) + ' ' + path +
      ': "' + from + '" → "' + to + '" (' + (session.name || 'editor') + ')');
    db.ref(ROOT + '/clubs/' + club).set(ALL[club])
      .then(function () { NL.toast('Saved', 'success'); })
      .catch(function (err) {
        NL.toast('Could not save: ' + ((err && err.message) || err), 'error');
      });
  }

  /* ------------------------------------------------------- provenance */
  /* "roles/2/title" -> "2", so a marker can be matched against the row's own
     role index. Anything that is not a role path returns null and falls
     through to the person-level branch. */
  function roleTail(tail) {
    var m = /^roles\/(\d+)(?:\/|$)/.exec(tail || '');
    return m ? m[1] : null;
  }

  var KIND = { case: 'capitalisation', typo: 'a typo', split: 'a title covering two jobs',
               merge: 'a duplicate entry' };

  function markProvenance(club) {
    var changes = NLDirectory.arr((PROV[club] || {}).changes);
    if (!changes.length) { return; }
    var byPerson = {};
    changes.forEach(function (c) {
      var m = /^people\/([^/]+)(?:\/(.*))?$/.exec(c.path);
      if (!m) { return; }
      (byPerson[m[1]] = byPerson[m[1]] || []).push({ tail: m[2] || '', c: c });
    });
    $('out').querySelectorAll('.cd-row').forEach(function (row) {
      var list = row.dataset.pid && byPerson[row.dataset.pid];
      if (!list) { return; }
      list.forEach(function (item) {
        var cell = null;
        if (item.tail === 'firstName' || item.tail === 'lastName') { cell = row.children[0]; }
        else if (roleTail(item.tail) === row.dataset.ridx) { cell = row.children[1]; }
        if (!cell) { return; }
        addNote(row, cell, item.c);
      });
    });
  }

  /* Two or three words. The original value is the explanation, so there is no
     sentence around it: "Was: dale vince" says everything "We corrected the
     capitalisation, the club sent dale vince" said, in a third of the room. */
  function pillsFor(row) {
    var box = row.querySelector('.ed-pills');
    if (!box) {
      box = document.createElement('div');
      box.className = 'ed-pills';
      row.appendChild(box);
    }
    return box;
  }

  function addNote(row, cell, change) {
    var pill = document.createElement('span');
    pill.className = 'ed-pill ed-pill--was';
    pill.innerHTML = 'Was: ' + esc(change.from || '(blank)') +
      ' <button type="button" title="Restore what the club sent">undo</button>';
    pill.querySelector('button').addEventListener('click', function () {
      cell.textContent = change.from || '';
      commit(cell);
      pill.remove();
    });
    pillsFor(row).appendChild(pill);
  }

  /* Things the tidier could see were wrong and deliberately did not touch — a
     mailbox that does not match the name on the record, a phone number that
     is the wrong length, one job title carried across two departments. Red,
     alongside the gaps, because both mean somebody has to do something; the
     amber "Was:" chips are the opposite, a record of something already done.

     No undo button: there is nothing to put back. The chip says what looks
     wrong and the row above it is already editable. */
  function markAttention(club) {
    var flags = NLDirectory.arr((PROV[club] || {}).attention);
    if (!flags.length) { return; }
    var byPerson = {};
    flags.forEach(function (f) {
      var m = /^people\/([^/]+)(?:\/(.*))?$/.exec(f.path || '');
      if (!m) { return; }
      (byPerson[m[1]] = byPerson[m[1]] || []).push(f);
    });
    $('out').querySelectorAll('.cd-row').forEach(function (row) {
      var list = row.dataset.pid && byPerson[row.dataset.pid];
      if (!list) { return; }
      list.forEach(function (f) {
        var m = /^people\/[^/]+\/(.*)$/.exec(f.path || '');
        var tail = m ? m[1] : '';
        /* A role-level flag belongs to one row; anything else (an address, a
           number) is about the person and belongs on all of them. */
        if (/^roles\//.test(tail) && roleTail(tail) !== row.dataset.ridx) { return; }
        addGap(row, f.label, f.why);
      });
    });
  }

  /* A person the League added, as opposed to one the club submitted. Amber,
     with the rest of "we did this" — but no undo button, because the way back
     is the delete button on the row, not a one-click revert that would leave
     an editor wondering where somebody went.

     This is the only marker whose absence means something: everyone without
     it came from the club's own submission, which is what the sign-off page
     is showing them and what the League should not quietly add to. */
  function markAdded(club) {
    var people = {};
    NLDirectory.arr((ALL[club] || {}).people).forEach(function (p) {
      if (p.id && p.added && p.added.at) { people[p.id] = p.added; }
    });
    $('out').querySelectorAll('.cd-row').forEach(function (row) {
      var a = row.dataset.pid && people[row.dataset.pid];
      if (!a) { return; }
      var pill = document.createElement('span');
      pill.className = 'ed-pill ed-pill--was';
      pill.textContent = 'Added by us';
      pill.title = 'Not in the club\u2019s submission. Added by ' + (a.by || 'an editor') +
        ' on ' + NL.formatDate(a.at) + (a.replacing ? ', replacing ' + a.replacing : '') + '.';
      pillsFor(row).appendChild(pill);
    });
  }

  /* Every role entry with no job title. 307 of 1,478 across the 72 clubs, so
     this is the most common thing the admin team has to chase. Read from the
     rendered row rather than the record, so it stays true after an edit. */
  function markGaps(name, rec) {
    $('out').querySelectorAll('.cd-row').forEach(function (row) {
      var role = row.children[1];
      if (role && role.querySelector('em')) { addGap(row, 'No role submitted'); }
    });
  }

  /* A gap the club left. Not ours to undo, so no action on it — it is there to
     be chased, which is what the admin team is for. */
  function addGap(row, text, why) {
    var pill = document.createElement('span');
    pill.className = 'ed-pill ed-pill--gap';
    pill.textContent = text;
    /* The reason goes in the tooltip rather than the chip. "Check spelling"
       is what an editor needs to see at a glance across a whole club; why we
       think so is a sentence, and a sentence in the margin of every row is
       the wall of text the chips replaced. */
    if (why) { pill.title = why; }
    pillsFor(row).appendChild(pill);
  }

  /* ---------------------------------------------------------- sign-off
     Completion lives on the club record itself rather than in a node of its
     own. Editors can already write clubs/$clubName and the reader can already
     read clubs, so this needs no rules change and no deploy — which matters
     more than tidiness tonight.

     Both directions confirm. Marking complete is a claim that somebody looked
     at the whole club, and reopening undoes that claim; neither should happen
     because a thumb landed on a button. NL.confirm, never the native one. */
  function signedOffBy(rec) {
    var s = rec && rec.signedOff;
    return s && s.at ? s : null;
  }

  function showSignoff(club, rec) {
    var done = signedOffBy(rec);
    var wrap = document.createElement('div');
    wrap.className = 'ed-signoff' + (done ? ' is-done' : '');
    wrap.innerHTML =
      '<div class="ed-signoff__t">' +
        '<h3>' + (done ? 'Marked complete' : 'Not yet checked') + '</h3>' +
        '<p>' + (done
          ? esc((done.by || 'Someone') + ' marked this complete on ' +
              NL.formatDate(done.at) + '. Editing is locked until it is reopened.')
          : 'When this club has been looked over and the edits are right, mark it ' +
            'complete. That locks it, and it is the only thing the reader will show.') +
        '</p>' +
      '</div>' +
      '<button class="btn ' + (done ? 'btn--ghost' : 'btn--primary') + '" id="signoffBtn" ' +
        'type="button">' + (done ? 'Reopen for editing' : 'Mark complete') + '</button>';
    $('extra').appendChild(wrap);
    $('out').classList.toggle('is-locked', !!done);
    wrap.querySelector('#signoffBtn').addEventListener('click', function () {
      done ? reopen(club, rec) : markComplete(club, rec);
    });
  }

  function markComplete(club, rec) {
    NL.confirm('Mark ' + club + ' as complete?', {
      title: 'Mark complete',
      detail: 'Editing will be locked, and this club becomes visible in the reader. ' +
              'You can reopen it at any time.',
      confirmText: 'Mark complete'
    }).then(function (ok) {
      if (!ok) { return; }
      rec.signedOff = { at: Date.now(), by: session.name || 'editor' };
      NL.writeAudit('directory_signoff', club + ' marked complete by ' +
        (session.name || 'editor'));
      persist(club, 'Marked complete');
    });
  }

  function reopen(club, rec) {
    NL.confirm('Reopen ' + club + ' for editing?', {
      title: 'Reopen',
      variant: 'danger',
      detail: 'It will no longer count as checked, and the reader will stop showing it ' +
              'until it is marked complete again.',
      confirmText: 'Reopen'
    }).then(function (ok) {
      if (!ok) { return; }
      /* null, not delete: an update() with undefined throws, and null is how
         RTDB removes a key. */
      rec.signedOff = null;
      NL.writeAudit('directory_signoff', club + ' reopened by ' + (session.name || 'editor'));
      persist(club, 'Reopened');
    });
  }

  function persist(club, what) {
    firebase.database().ref(ROOT + '/clubs/' + club).set(ALL[club])
      .then(function () { NL.toast(what, 'success'); draw(club); })
      .catch(function (err) {
        NL.toast('Could not save: ' + ((err && err.message) || err), 'error');
      });
  }

  /* The merge note, at the foot of the club. Two entries becoming one is the
     single change a person cannot see by looking at the page, because the
     evidence for it was deleted. */
  /* Sits directly under the last department, where "and one more person"
     belongs, rather than in the topbar with the club picker — that bar is
     about which club you are looking at, not what you are doing to it. */
  function showAdd(club, rec) {
    if (signedOffBy(rec)) { return; }
    var wrap = document.createElement('div');
    wrap.className = 'ed-add';
    var b = document.createElement('button');
    b.className = 'btn btn--ghost btn--sm';
    b.type = 'button';
    b.appendChild(NL.icon('add'));
    b.appendChild(document.createTextNode('Add someone'));
    b.addEventListener('click', function () { addPerson(club); });
    wrap.appendChild(b);
    $('out').appendChild(wrap);
  }

  function showMerges(club) {
    var merges = NLDirectory.arr((PROV[club] || {}).merges);
    /* Clears the pane, so this must run before showSignoff appends to it. */
    $('extra').innerHTML = !merges.length ? '' :
      '<div class="ed-merges"><h3>Entries we combined</h3>' +
      '<p>The form let a club add the same person once per job, so some people ' +
      'arrived several times. These were combined into one entry carrying all ' +
      'their roles. Nothing was discarded.</p><ul>' +
      merges.map(function (m) {
        var n = NLDirectory.arr(m.absorbed).length;
        return '<li><b>' + esc(m.kept) + '</b> — ' + n +
          (n === 1 ? ' duplicate entry' : ' duplicate entries') + ' merged in</li>';
      }).join('') + '</ul></div>';
  }

  function onSearch(e) {
    var hits = NLDirectory.search(ALL, e.target.value);
    if (!hits) { draw(current); return; }
    $('extra').innerHTML = '';
    if (!hits.length) { $('out').innerHTML = '<p class="cd-empty">Nothing matched that.</p>'; return; }
    var byClub = {};
    hits.forEach(function (h) { (byClub[h.club] = byClub[h.club] || []).push(h.person); });
    $('out').innerHTML = Object.keys(byClub).sort().map(function (c) {
      return '<div class="cd-dept"><h3 class="cd-dept__h">' + esc(c) + '</h3><ul class="cd-rows">' +
        byClub[c].map(function (p) {
          return NLDirectory.personRow(p, (NLDirectory.rolesOf(p)[0] || {}).section, { showHidden: true });
        }).join('') + '</ul></div>';
    }).join('');
  }
}());
</script>
</body>
</html>
