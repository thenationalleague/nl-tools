       would drop it the moment somebody set one. */
    if (ext) { row.dataset.ext = ext; }
    var input = document.createElement('input');
    input.className = 'ed-cval';
    input.value = value || '';
    input.setAttribute('autocomplete', 'off');
    input.placeholder = kind === 'email' ? 'name@club.co.uk' : '01234 567890';
    if (kind === 'email') { input.type = 'email'; }

    var pick = null;
    /* Only worth asking when there is a choice to make. */
    if (roles.length > 1) {
      pick = document.createElement('select');
      pick.className = 'ed-cfor';
      var all = document.createElement('option');
      all.value = ''; all.textContent = 'All roles';
      pick.appendChild(all);
      roles.forEach(function (sec) {
        var o = document.createElement('option');
        o.value = sec; o.textContent = sec;
        if (sec === section) { o.selected = true; }
        pick.appendChild(o);
      });
    }

    var del = document.createElement('button');
    del.className = 'btn btn--icon btn--ghost ed-del';
    del.type = 'button';
    del.title = 'Remove this ' + kind;
    del.setAttribute('aria-label', 'Remove this ' + kind);
    del.appendChild(NL.icon('delete'));
    del.addEventListener('click', function () { row.remove(); });

    row.appendChild(input);
    if (pick) { row.appendChild(pick); }
    row.appendChild(del);
    return row;
  }

  function updateDetails(club, person, ridx) {
    var rec = ALL[club];
    var roles = NLDirectory.rolesOf(person);
    var role = roles[ridx] || {};
    var here = role.section || '';
    var sections = roles.map(function (r) { return r.section; })
      .filter(function (sec, i, a) { return a.indexOf(sec) === i; });
    var others = roles.filter(function (r, i) { return i !== ridx; })
      .map(function (r) { return r.section; });
    var name0 = NLDirectory.fullName(person);

    var wrap = document.createElement('div');
    var group = function (title, hint) {
      var h = document.createElement('h4');
      h.className = 'ed-fgroup';
      h.textContent = title;
      wrap.appendChild(h);
      if (hint) {
        var p2 = document.createElement('p');
        p2.className = 'form-hint';
        p2.innerHTML = hint;
        wrap.appendChild(p2);
      }
    };
    var field = function (label, node) {
      var g = document.createElement('div');
      g.className = 'form-group';
      var l = document.createElement('label');
      l.textContent = label;
      g.appendChild(l); g.appendChild(node);
      return g;
    };
    var textbox = function (value, placeholder) {
      var i = document.createElement('input');
      i.value = value || '';
      i.setAttribute('autocomplete', 'off');
      if (placeholder) { i.placeholder = placeholder; }
      return i;
    };

    /* ---- who they are ---- */
    group('Person', others.length
      ? 'Also listed under <b>' + esc(others.join('</b>, <b>')) +
        '</b>. The name and contact details below are shared with those entries.'
      : '');
    var grid1 = document.createElement('div');
    grid1.className = 'form-grid';
    var nameIn = textbox(name0, 'Jane Smith');
    grid1.appendChild(field('Name', nameIn));
    wrap.appendChild(grid1);

    var pubWrap = document.createElement('div');
    pubWrap.className = 'form-group span2 ed-check';
    var pubLab = document.createElement('label');
    var pubBox = document.createElement('input');
    pubBox.type = 'checkbox';
    pubBox.checked = !!person.hideContact;
    pubLab.appendChild(pubBox);
    pubLab.appendChild(document.createTextNode(
      ' Keep their contact details out of the published directory'));
    pubWrap.appendChild(pubLab);
    var pubHint = document.createElement('p');
    pubHint.className = 'form-hint';
    pubHint.textContent = 'We still hold them; the reader shows "Not published".' +
      (sections.length > 1 ? ' This covers every department they appear in.' : '');
    pubWrap.appendChild(pubHint);
    wrap.appendChild(pubWrap);

    /* ---- how to reach them ---- */
    group('Email addresses', sections.length > 1
      ? 'Leave "All roles" unless an address is only for one of their jobs.' : '');
    var emailBox = document.createElement('div');
    emailBox.className = 'ed-clist';
    wrap.appendChild(emailBox);
    NLDirectory.arr(person.emails).forEach(function (e) {
      var addr = NLDirectory.addrOf(e);
      if (!addr) { return; }
      emailBox.appendChild(contactRow('email', addr,
        (typeof e === 'string') ? '' : (e.section || ''), sections));
    });
    var addEmail = document.createElement('button');
    addEmail.className = 'btn btn--sm btn--ghost';
    addEmail.type = 'button';
    addEmail.textContent = 'Add an email address';
    addEmail.addEventListener('click', function () {
      emailBox.appendChild(contactRow('email', '', '', sections));
    });
    wrap.appendChild(addEmail);

    group('Telephone numbers', '');
    var phoneBox = document.createElement('div');
    phoneBox.className = 'ed-clist';
    wrap.appendChild(phoneBox);
    NLDirectory.arr(person.phones).forEach(function (x) {
      if (!x || !(x.number || '').trim()) { return; }
      phoneBox.appendChild(contactRow('phone', x.number, x.section || '', sections, x.ext || ''));
    });
    var addPhone = document.createElement('button');
    addPhone.className = 'btn btn--sm btn--ghost';
    addPhone.type = 'button';
    addPhone.textContent = 'Add a telephone number';
    addPhone.addEventListener('click', function () {
      phoneBox.appendChild(contactRow('phone', '', '', sections));
    });
    wrap.appendChild(addPhone);

    /* ---- every job they do ---- */
    /* All of them, not just the row you came in from. The modal claims to be
       everything about this person, and showing one role while merely naming
       the others made a liar of it — an editor fixing two job titles had to
       close it, find the other row, and open it again. */
    group(roles.length > 1 ? 'Roles' : 'Role', roles.length > 1
      ? 'One entry per department. The row you opened is marked.' : '');
    var roleBox = document.createElement('div');
    roleBox.className = 'ed-roles';
    wrap.appendChild(roleBox);

    var roleRows = [];
    roles.forEach(function (r, i) {
      var card = document.createElement('div');
      card.className = 'ed-role' + (i === ridx ? ' is-here' : '');
      var grid = document.createElement('div');
      grid.className = 'form-grid';
      var t = textbox(r.title || '', 'Programme Editor');
      var d = deptSelect(r.section, 'ed-dept');
      grid.appendChild(field('Job title', t));
      grid.appendChild(field('Department', d));
      card.appendChild(grid);

      var drop = document.createElement('button');
      drop.className = 'btn btn--sm btn--ghost ed-del ed-roledel';
      drop.type = 'button';
      drop.textContent = 'Remove this role';
      drop.addEventListener('click', function () {
        /* Their only role is the whole person, so that question gets asked
           rather than answered by a button labelled something smaller. */
        if (roleRows.filter(function (x) { return !x.gone; }).length < 2) {
          ctrl.close();
          removeRole(club, person, i);
          return;
        }
        entry.gone = true;
        card.remove();
      });
      card.appendChild(drop);
      roleBox.appendChild(card);

      var entry = { i: i, title: t, dept: d, gone: false };
      roleRows.push(entry);
    });

    var extra = document.createElement('div');
    extra.className = 'ed-morebtns';
    var addRole = document.createElement('button');
    addRole.className = 'btn btn--sm btn--ghost';
    addRole.type = 'button';
    addRole.textContent = 'Add another role';
    var removeBtn = document.createElement('button');
    removeBtn.className = 'btn btn--sm btn--ghost ed-del';
    removeBtn.type = 'button';
    removeBtn.textContent = 'Remove this person…';
    extra.appendChild(addRole);
    extra.appendChild(removeBtn);
    wrap.appendChild(extra);

    var read = function (box) {
      return [].slice.call(box.querySelectorAll('.ed-crow')).map(function (r) {
        var f = r.querySelector('.ed-cfor');
        return { value: r.querySelector('.ed-cval').value.trim(),
                 section: f ? f.value : '',
                 ext: r.dataset.ext || '' };
      }).filter(function (x) { return x.value; });
    };

    var ctrl = NL.modal({
      title: 'Update details — ' + (name0 || 'this person'),
      body: wrap,
      buttons: [
        { label: 'Cancel', className: 'btn--ghost', onClick: function (c) { c.close(); } },
        { label: 'Save', className: 'btn--primary', onClick: function (c) {
          commitDetails(club, person, ridx, {
            name: nameIn.value.trim(),
            roles: roleRows.filter(function (x) { return !x.gone; }).map(function (x) {
              return { i: x.i, title: x.title.value.trim(), section: x.dept.value };
            }),
            hide: !!pubBox.checked,
            emails: read(emailBox),
            phones: read(phoneBox)
          }, c);
        } }
      ]
    });

    addRole.addEventListener('click', function () { ctrl.close(); addRoleTo(club, person); });
    removeBtn.addEventListener('click', function () { ctrl.close(); removeWholePerson(club, person); });
    setTimeout(function () { nameIn.focus(); }, 30);
  }

  /* Everything the form changed, in one write. The rename question is asked
     last and only when it is genuinely ambiguous, so an editor correcting a
     job title is never made to answer a question about identity. */
  /* Publishing somebody the club asked us to keep off is the one thing in this
     form that reaches outside the League. It puts a real person's work email
     and mobile in front of everyone who holds the reader code, and there is no
     taking that back — so it asks, and it asks in the direction that matters.

     Only that direction. Ticking the box hides somebody, which exposes nothing
     and needs no ceremony; a confirm on the safe half would just be noise that
     teaches people to click through the dangerous one.

     This existed before the form absorbed the publish toggle and was lost in
     the process — a regression, not an oversight of the original design. */
  function confirmPublish(person, hiding, sections) {
    if (hiding) { return Promise.resolve(true); }
    var name = NLDirectory.fullName(person) || 'this person';
    var where = sections.length > 1
      ? ' They appear under ' + sections.join(', ') + ', and this covers all of them.'
      : '';
    return NL.confirm(
      'Publish ' + name + '\u2019s contact details in the directory?' + where +
      '\n\nThe club asked for these to be kept off. Only do this if they have since ' +
      'said otherwise — everyone holding the reader code will be able to see them, ' +
      'and it cannot be taken back once it is out.',
      { title: 'Publish contact details', variant: 'danger', confirmText: 'Yes, publish them' }
    );
  }

  function commitDetails(club, person, ridx, next, ctrl) {
    var roles = NLDirectory.rolesOf(person);
    var role = roles[ridx] || {};
    var was = {
      name: NLDirectory.fullName(person),
      hide: !!person.hideContact,
      emails: NLDirectory.emailsOf(person).join(', '),
      phones: NLDirectory.phonesOf(person).map(function (x) { return x.number; }).join(', ')
    };
    var pid = 'people/' + (person.id || '');

    var applyRest = function () {
      /* Rebuilt from the form rather than patched in place: a role can have
         been retitled, moved, or taken off, and reading the survivors in order
         is the only version of that which cannot leave a stale one behind.
         Anything else on a role object is carried over untouched. */
      var rolesChanged = next.roles.length !== roles.length;
      person.roles = next.roles.map(function (r) {
        var orig = roles[r.i] || {};
        if (r.title !== (orig.title || '')) {
          logEdit(club, pid + '/roles/' + r.i + '/title', orig.title || '', r.title);
          rolesChanged = true;
        }
        if (r.section !== orig.section) { rolesChanged = true; }
        var out = {};
        for (var k in orig) { if (Object.prototype.hasOwnProperty.call(orig, k)) { out[k] = orig[k]; } }
        out.title = r.title;
        out.section = r.section;
        return out;
      });
      if (next.hide !== was.hide) { person.hideContact = next.hide; }
      /* A plain string when it applies everywhere, an object only when it does
         not — so a record that gains nothing keeps the shape it had. */
      person.emails = next.emails.map(function (x) {
        return x.section ? { address: x.value, section: x.section } : x.value;
      });
      person.phones = next.phones.map(function (x) {
        var out = { number: x.value, ext: x.ext || '' };
        if (x.section) { out.section = x.section; }
        return out;
      });
      var nowEm = NLDirectory.emailsOf(person).join(', ');
      var nowPh = NLDirectory.phonesOf(person).map(function (x) { return x.number; }).join(', ');
      if (nowEm !== was.emails) { logEdit(club, pid + '/emails', was.emails, nowEm); }
      if (nowPh !== was.phones) { logEdit(club, pid + '/phones', was.phones, nowPh); }

      var changed = rolesChanged || next.hide !== was.hide ||
        nowEm !== was.emails || nowPh !== was.phones ||
        NLDirectory.fullName(person) !== was.name;
      ctrl.close();
      if (!changed) { return; }
      saveStructure(club, 'Details updated for ' +
        (NLDirectory.fullName(person) || 'a person'));
    };

    /* The gate runs before anything is written, so answering No leaves the
       record exactly as it was and the form still open on the tick. */
    var proceed = function () {
      if (!next.name || next.name === was.name) { applyRest(); return; }
      renameThen();
    };

    if (next.hide !== was.hide) {
      var sections = roles.map(function (r) { return r.section; })
        .filter(function (sec, i, a) { return a.indexOf(sec) === i; });
      confirmPublish(person, next.hide, sections).then(function (ok) {
        if (!ok) { next.hide = was.hide; return; }   /* stay open, nothing written */
        proceed();
      });
      return;
    }
    proceed();

    /* Renaming somebody who holds more than one role is genuinely ambiguous,
       and getting it wrong is the worst thing this tool can do. See the note
       on resolveRename. Hoisted, so proceed() above can call it. */
    function renameThen() {
      if (roles.length > 1) {
        resolveRename(club, person, ridx, was.name, next.name).then(function (how) {
          if (!how) { return; }                     /* cancelled: change nothing */
          if (how === 'same') {
            setAt(person, 'name', next.name);
            logEdit(club, pid + '/name', was.name, next.name);
            applyRest();
          } else {
            ctrl.close();
            var mine = next.roles.filter(function (r) { return r.i === ridx; })[0];
            replaceInRole(club, person, ridx, next.name, mine);
          }
        });
        return;
      }
      setAt(person, 'name', next.name);
      logEdit(club, pid + '/name', was.name, next.name);
      applyRest();
    }
  }

  /* The whole entry, from the foot of the update form. Removing one role is
     now a button on that role, so this no longer has to ask which was meant —
     pressing this one IS the answer. */
  function removeWholePerson(club, person) {
    var name = NLDirectory.fullName(person) || 'this person';
    var sections = NLDirectory.rolesOf(person).map(function (r) { return r.section; });
    NL.confirm('Remove ' + name + ' from the directory entirely?' +
      (sections.length > 1 ? ' That is all ' + sections.length + ' of their entries — ' +
        sections.join(', ') + '.' : '') +
      '\n\nName, contact details and all. \u201cMy changes\u201d at the top of ' +
      'the page will put just this person back, whenever you need it.',
      { title: 'Remove person', variant: 'danger', confirmText: 'Remove person' }
    ).then(function (ok) {
      if (!ok) { return; }
      ALL[club].people = NLDirectory.arr(ALL[club].people)
        .filter(function (p) { return p !== person; });
      saveStructure(club, name + ' removed from the directory');
    });
  }

  /* Somebody already in the directory who also does something else. Distinct
     from "Add someone" at the foot, which mints a new person — this hangs a
     second role on the person whose row you are on. */
  function addRoleTo(club, person) {
    var name = NLDirectory.fullName(person) || 'this person';
    var held = NLDirectory.rolesOf(person).map(function (r) { return r.section; });
    var form = document.createElement('div');
    form.className = 'form-grid';
    form.innerHTML =
      '<div class="form-group"><label>Department</label><span id="arDept"></span></div>' +
      '<div class="form-group"><label>Job title</label>' +
        '<input id="arTitle" autocomplete="off" placeholder="Programme Editor"></div>' +
      '<div class="form-group span2"><p class="form-hint">' +
        esc(name) + ' is already listed under ' + esc(held.join(', ')) +
        '. Their contact details carry across — this is one person, not a copy.</p></div>';
    var sel = deptSelect(NLDirectory.ORDER.filter(function (d) {
      return held.indexOf(d) < 0;
    })[0] || 'Other');
    sel.id = 'arDeptSel';
    form.querySelector('#arDept').appendChild(sel);

    NL.modal({
      title: 'Add a role for ' + name,
      body: form,
      buttons: [
        { label: 'Cancel', className: 'btn--ghost', onClick: function (c) { c.close(); } },
        { label: 'Add role', className: 'btn--primary', onClick: function (c) {
          var dept = sel.value;
          person.roles = NLDirectory.rolesOf(person).concat(
            { section: dept, title: form.querySelector('#arTitle').value.trim() });
          c.close();
          saveStructure(club, name + ' added to ' + dept);
        } }
      ]
    });
  }

  function removeRole(club, person, ridx) {
    var roles = NLDirectory.rolesOf(person);
    var name = NLDirectory.fullName(person) || 'this person';
    var here = roles[ridx].section;
    var rest = roles.filter(function (r, i) { return i !== ridx; })
      .map(function (r) { return r.section; });

    var dropRole = function () {
      person.roles = roles.filter(function (r, i) { return i !== ridx; });
      ALL[club].people = NLDirectory.arr(ALL[club].people);
      saveStructure(club, name + ' removed from ' + here);
    };
    var dropPerson = function () {
      ALL[club].people = NLDirectory.arr(ALL[club].people)
        .filter(function (p) { return p !== person; });
      saveStructure(club, name + ' removed from the directory');
    };

    /* One role: one outcome, and it is the whole entry. */
    if (!rest.length) {
      NL.confirm('Remove ' + name + ' from the directory entirely? This is their only ' +
        'role, so the whole entry goes — name, contact details and all.' +
        '\n\n\u201cMy changes\u201d at the top of the page will put it back.',
        { title: 'Remove person', variant: 'danger', confirmText: 'Remove person' }
      ).then(function (ok) { if (ok) { dropPerson(); } });
      return;
    }

    /* More than one, and the two outcomes are genuinely different: they have
       stopped doing this job, or they have left the club. Deciding on their
       behalf from the role count was wrong — it meant deleting somebody with
       three roles took three separate removals, each one asking a question
       that was not the one being answered. */
    NL.modal({
      title: 'Remove ' + name,
      size: 'sm',
      body: '<p class="confirm-text">' + esc(name) + ' is listed under ' +
        esc([here].concat(rest).join(', ')) + '.</p>' +
        '<p class="confirm-text">Have they stopped doing the ' + esc(here) +
        ' job, or have they left the club altogether?</p>' +
        '<p class="form-hint">Either way, “My changes” at the top of the page ' +
        'will put it back.</p>',
      buttons: [
        { label: 'Cancel', className: 'btn--ghost', onClick: function (c) { c.close(); } },
        { label: 'Remove from ' + here, className: 'btn--ghost',
          onClick: function (c) { c.close(); dropRole(); } },
        { label: 'Delete entirely', className: 'btn--danger',
          onClick: function (c) { c.close(); dropPerson(); } }
      ]
    });
  }

  /* Adding is the one action with no row to hang off, and the department it
     belongs to may not be on screen at all — renderClub skips a department
     with nobody in it, so "add to Ticketing" cannot be a button under a
     Ticketing heading that does not exist. Hence one button at the foot and a
     department picker in the form. */
  function addPerson(club) {
    var form = document.createElement('div');
    form.className = 'form-grid';
    form.innerHTML =
      '<div class="form-group span2"><label>Name <span class="req">*</span></label>' +
        '<input id="apName" autocomplete="off" placeholder="Jane Smith"></div>' +
      '<div class="form-group"><label>Department</label><span id="apDept"></span></div>' +
      '<div class="form-group"><label>Job title</label>' +
        '<input id="apTitle" autocomplete="off" placeholder="Ticketing Manager"></div>' +
      '<div class="form-group"><label>Email</label>' +
        '<input id="apEmail" type="email" autocomplete="off"></div>' +
      '<div class="form-group"><label>Phone</label>' +
        '<input id="apPhone" autocomplete="off"></div>' +
      '<div class="form-group span2 ed-check">' +
        '<label><input type="checkbox" id="apHide"> Keep their contact details out of the ' +
        'published directory</label>' +
        '<p class="form-hint">We still hold them; the reader shows "Not published".</p></div>';
    var sel = deptSelect('Other');
    sel.id = 'apDeptSel';
    form.querySelector('#apDept').appendChild(sel);

    var ctrl = NL.modal({
      title: 'Add someone to ' + club,
      body: form,
      buttons: [
        { label: 'Cancel', className: 'btn--ghost', onClick: function (c) { c.close(); } },
        { label: 'Add', className: 'btn--primary', onClick: function (c) {
          var name = form.querySelector('#apName').value.trim();
          if (!name) { NL.toast('A name is needed', 'error'); return; }
          var email = form.querySelector('#apEmail').value.trim();
          var phone = form.querySelector('#apPhone').value.trim();
          var person = { id: newId(), title: '', postNominals: '',
            firstName: '', lastName: '', name: name,
            emails: email ? [email] : [], phones: phone ? [{ number: phone }] : [],
            hideContact: !!form.querySelector('#apHide').checked,
            /* Stamped, because a person the League typed in is not a person
               the club submitted, and the difference has to survive. The
               sign-off page shows clubs what we hold; attributing our own
               addition to them would be putting words in their mouth. */
            added: { at: Date.now(), by: session.name || 'editor' },
            roles: [{ section: sel.value, title: form.querySelector('#apTitle').value.trim() }] };
          /* Through the same splitter the row edit uses, so an added "Dr Jane
             Smith" lands in the same fields as an edited one. */
          setAt(person, 'name', name);
          ALL[club].people = NLDirectory.arr(ALL[club].people).concat(person);
          c.close();
          saveStructure(club, name + ' added to ' + sel.value);
        } }
      ]
    });
    setTimeout(function () { form.querySelector('#apName').focus(); }, 30);
    return ctrl;
  }

  /* One pen per person. Pressing it turns that row's fields on and puts the
     cursor in the name; pressing it again, or clicking away, turns them off.
     Editing stays off until asked for, so a scroll on a phone cannot land in
     somebody's name and change it. */
  /* Pen when the club is open, eye when it is signed off. Same button, and the
     icon carries the permission before you press it — the pattern
     fixtures/index.html has used for a while, and better than a control that
     simply vanishes, which only raises the question. */
  function addPen(row, locked, club, person, ridx) {
    var b = document.createElement('button');
    /* Canon icon button. aria-label is load-bearing, not decoration: there is
       no text node in here, so without it the row announces "button". */
    b.className = 'btn btn--icon btn--ghost ed-pen';
    b.type = 'button';
    var label = locked ? 'View only \u2014 this club is marked complete' : 'Update details';
    b.title = label;
    b.setAttribute('aria-label', label + (person ? ' for ' +
      (NLDirectory.fullName(person) || 'this person') : ''));
    b.appendChild(NL.icon(locked ? 'eye' : 'edit'));
    if (locked || ridx == null) { b.disabled = true; row.appendChild(b); return; }
    b.addEventListener('click', function (e) {
      e.stopPropagation();
      updateDetails(club, person, ridx);
    });
    row.appendChild(b);
  }



  /* A record holds title / firstName / lastName / postNominals separately, but
     the row shows one name and edits one name. Splitting on the first space
     alone made "Dr Daniel Palmer" a person whose first name is Dr, which then
     breaks the email-name check, sorting, and anything that reads lastName.
     Twelve people across the 72 clubs carry one of these.

     Only what is already on the record is peeled off, plus the handful of
     honorifics and post-nominals a club would actually type. Anything else
     stays in the name where the editor put it — this should not be a parser. */
  var HONORIFIC = /^(dr|mr|mrs|ms|miss|mx|sir|dame|prof|professor|rev|reverend|lord|lady|capt|major|col)\.?$/i;
  var POSTNOM  = /^(mbe|obe|cbe|kbe|dbe|bem|dl|jp|kc|qc|md|phd|frcs|mrcgp|bsc|msc|ba|ma)\.?$/i;

  function setAt(person, path, v) {
    if (path === 'name') {
      var bits = v.trim().split(/\s+/).filter(Boolean);
      var had = function (field, re) {
        var cur = (person[field] || '').trim();
        return function (w) { return (cur && w.toLowerCase() === cur.toLowerCase()) || re.test(w); };
      };
      var isTitle = had('title', HONORIFIC), isPost = had('postNominals', POSTNOM);
      var title = [], post = [];
      while (bits.length > 1 && isTitle(bits[0])) { title.push(bits.shift()); }
      while (bits.length > 1 && isPost(bits[bits.length - 1])) { post.unshift(bits.pop()); }
      person.title = title.join(' ');
      person.postNominals = post.join(' ');
      person.firstName = bits.shift() || '';
      person.lastName = bits.join(' ');
      person.name = v.trim();
      return;
    }
    var parts = path.split('/'), cur = person;
    for (var i = 0; i < parts.length - 1; i++) {
      if (cur[parts[i]] == null) { cur[parts[i]] = {}; }
      cur = cur[parts[i]];
    }
    cur[parts[parts.length - 1]] = v;
  }


  /* ------------------------------------------------------ the rename trap
     Josh Knowles is Head of Media and also the programme editor: one record,
     two rows. A new hire takes over the programme, an editor opens that row
     and types "Jane Smith" over the name — and Josh becomes Jane in the media
     department too, carrying Josh's email address into Jane's entry.

     That was always the behaviour. What changed is that syncing sibling rows
     made it visible; before, the record was corrupted exactly the same way
     and the other row went on displaying the old name until a redraw, so it
     looked like it had worked.

     The fix is not to pick a side. Both readings are ordinary:
       · same human, spelling corrected  -> rename everywhere
       · different human in this job     -> the name belongs to this role only

     So ask, once, at the moment it becomes ambiguous — which is only ever a
     name, only ever on somebody with more than one role. A single-role person
     has no other entry to damage and is left alone.

     The replacement deliberately does NOT inherit the contact details. A new
     person wearing the old person's email is worse than the rename it was
     meant to fix: it looks correct and it is wrong. They arrive with nothing
     held, which the existing red chips already flag for chasing. */
  function resolveRename(club, person, ridx, from, to) {
    var roles = NLDirectory.rolesOf(person);
    var here = (roles[ridx] || {}).section || '';
    var others = roles.filter(function (r, i) { return i !== ridx; })
      .map(function (r) { return r.section; });

    return new Promise(function (resolve) {
      var settled = false;
      var done = function (v) { if (!settled) { settled = true; resolve(v); } };
      NL.modal({
        title: 'Which did you mean?',
        size: 'sm',
        body: '<p class="confirm-text">' + esc(from) + ' is listed under ' +
          esc(here) + ' and ' + esc(others.join(' and ')) + '.</p>' +
          '<p class="confirm-text">Is <b>' + esc(to) + '</b> the same person under a ' +
          'corrected name, or somebody new who has taken over ' + esc(here) + '?</p>' +
          '<p class="form-hint">Somebody new takes the job title but none of the contact ' +
          'details — those belong to ' + esc(from) + '. Worth checking the title still ' +
          'fits once they are in.</p>',
        onClose: function () { done(false); },
        buttons: [
          { label: 'Cancel', className: 'btn--ghost',
            onClick: function (c) { done(false); c.close(); } },
          { label: 'Same person', className: 'btn--ghost',
            onClick: function (c) { done('same'); c.close(); } },
          { label: 'New in ' + here, className: 'btn--primary',
            onClick: function (c) { done('new'); c.close(); } }
        ]
      });
    });
  }

  /* The new person takes the job — the role and its title — and nothing else.
     The old person keeps every other role and their own contact details. */
  function replaceInRole(club, person, ridx, name, next) {
    var roles = NLDirectory.rolesOf(person);
    var role = roles[ridx];
    var fresh = { id: newId(), title: '', postNominals: '', firstName: '', lastName: '',
      name: name, emails: [], phones: [], hideContact: !!person.hideContact,
      added: { at: Date.now(), by: session.name || 'editor',
               replacing: NLDirectory.fullName(person) },
      roles: [{ section: (next && next.section) || role.section,
                title: (next && next.title) || role.title || '' }] };
    setAt(fresh, 'name', name);
    person.roles = roles.filter(function (r, i) { return i !== ridx; });
    ALL[club].people = NLDirectory.arr(ALL[club].people).concat(fresh);
    saveStructure(club, name + ' replaces ' + NLDirectory.fullName(person) +
      ' in ' + role.section);
  }




  /* ------------------------------------------------------------- hand edits
     Three things can be true of a field, and until now only two of them were
     visible. The tidier changed it (amber, undoable). Something is wrong with
     it (red, needs a person). Or somebody on the admin team typed over it —
     which is the one that matters most when two editors are working the same
     club, and it left no mark at all.

     Green, because it is the only one of the three that is a person doing
     their job rather than a machine or a problem. The row carries a tint as
     well as a chip: at a glance down a club you want to see WHERE the work
     has been done, and reading chips one at a time does not give you that.

     Kept alongside the bake's own log rather than inside it. The bake's
     entries can be put back; these are the deliberate ones and there is
     nothing to revert to. */
  function editList(club) {
    return NLDirectory.arr((PROV[club] || {}).edits);
  }

  /* One entry per field, and `from` is the value before ANY hand edit — not
     before the latest one. Keeping the latest meant typing something and then
     typing it back left a record saying the field had changed from the wrong
     thing to the right thing, and the row stayed green forever. Returning a
     field to where it started now removes the entry, because nothing has
     changed and the marker should say so. */
  function logEdit(club, path, from, to) {
    var prov = PROV[club] || (PROV[club] = {});
    var all = editList(club);
    var had = all.filter(function (e) { return e.path === path; })[0];
    /* Never undefined. RTDB rejects an undefined value by THROWING, not by
       rejecting a promise, so one of these in the object took the whole click
       handler down with it — after the marker had been set in memory and
       before the save ran. The result was a green "edited by hand" line over a
       record that had not changed, no journal entry, and no way back. An
       entry whose `from` was absent (a null dropped by RTDB on write) was
       enough to trigger it on the NEXT edit of the same field. */
    var str = function (v) { return String(v == null ? '' : v); };
    var base = str(had ? had.from : from);
    from = str(from); to = str(to);
    var edits = all.filter(function (e) { return e.path !== path; });
    if (to.trim() !== base.trim()) {
      edits.push({ path: path, from: base, to: to,
        by: session.name || 'editor', at: Date.now() });
    }
    prov.edits = edits;
    firebase.database().ref(ROOT + '/provenance/' + club + '/edits').set(edits)
      .catch(function (err) {
        NL.toast('Could not record that edit: ' + ((err && err.message) || err), 'error');
      });
  }

  /* ------------------------------------------------------- provenance */
  /* "roles/2/title" -> "2", so a marker can be matched against the row's own
     role index. Anything that is not a role path returns null and falls
     through to the person-level branch. */
  function roleTail(tail) {
    var m = /^roles\/(\d+)(?:\/|$)/.exec(tail || '');
    return m ? m[1] : null;
  }

  var KIND = { case: 'capitalisation', typo: 'a typo', split: 'a title covering two jobs',
               merge: 'a duplicate entry' };

  function markProvenance(club) {
    var changes = NLDirectory.arr((PROV[club] || {}).changes);
    if (!changes.length) { return; }
    var byPerson = {};
    changes.forEach(function (c) {
      var m = /^people\/([^/]+)(?:\/(.*))?$/.exec(c.path);
      if (!m) { return; }
      (byPerson[m[1]] = byPerson[m[1]] || []).push({ tail: m[2] || '', c: c });
    });
    $('out').querySelectorAll('.cd-row').forEach(function (row) {
      var list = row.dataset.pid && byPerson[row.dataset.pid];
      if (!list) { return; }
      list.forEach(function (item) {
        var isName = item.tail === 'firstName' || item.tail === 'lastName';
        if (!isName && roleTail(item.tail) !== row.dataset.ridx) { return; }
        addNote(row, club, item.c);
      });
    });
  }

  /* Two or three words. The original value is the explanation, so there is no
     sentence around it: "Was: dale vince" says everything "We corrected the
     capitalisation, the club sent dale vince" said, in a third of the room. */
  function pillsFor(row) {
    var box = row.querySelector('.ed-pills');
    if (!box) {
      box = document.createElement('div');
      box.className = 'ed-pills';
      row.appendChild(box);
    }
    return box;
  }

  /* Puts back exactly what the club sent. It used to write through the
     contenteditable cell and let the blur handler save; with typing-in-the-row
     gone it writes to the record directly, the way the club-detail undo
     already did — and drops the marker with it, so the row cannot go on
     claiming a correction that is no longer there. */
  function addNote(row, club, change) {
    var pill = document.createElement('span');
    pill.className = 'ed-pill ed-pill--was';
    pill.innerHTML = 'Was: ' + esc(change.from || '(blank)') +
      ' <button type="button" title="Restore what the club sent">undo</button>';
    if (signedOffBy(ALL[club])) { pill.querySelector('button').remove(); }
    else {
      pill.querySelector('button').addEventListener('click', function () {
        undoChange(club, change);
      });
    }
    pillsFor(row).appendChild(pill);
  }

  function undoChange(club, change) {
    var m = /^people\/([^/]+)\/(.*)$/.exec(change.path || '');
    if (!m) { return; }
    var person = NLDirectory.arr(ALL[club].people).filter(function (p) {
      return p.id === m[1];
    })[0];
    if (!person) { return; }
    setAt(person, m[2], change.from);
    if (m[2] === 'firstName' || m[2] === 'lastName') {
      person.name = [person.title, person.firstName, person.lastName, person.postNominals]
        .map(function (x) { return (x || '').trim(); }).filter(Boolean).join(' ');
    }
    dropChange(club, change);
    saveStructure(club, 'Put back what the club sent');
  }

  /* The changes child only. This used to rewrite the whole provenance node
     from four named keys, which was fine until there was a fifth — the
     journal would have been wiped by the first amber undo of the session. */
  function dropChange(club, change) {
    var prov = PROV[club] || (PROV[club] = {});
    prov.changes = NLDirectory.arr(prov.changes).filter(function (c) { return c !== change; });
    firebase.database().ref(ROOT + '/provenance/' + club + '/changes').set(prov.changes);
  }

  /* Green markers for what a person changed by hand — on the rows, and on the
     card for the club's own details. The row tint is the part that answers
     "how far have I got with this club", which a chip cannot. */
  function markEdits(club) {
    var edits = editList(club);
    if (!edits.length) { return; }
    var byPerson = {}, info = [];
    edits.forEach(function (e) {
      var m = /^people\/([^/]+)\/(.*)$/.exec(e.path || '');
      if (m) { (byPerson[m[1]] = byPerson[m[1]] || []).push({ tail: m[2], e: e }); }
      else if (/^info\//.test(e.path || '')) { info.push(e); }
    });

    $('out').querySelectorAll('.cd-row').forEach(function (row) {
      var list = row.dataset.pid && byPerson[row.dataset.pid];
      if (!list) { return; }
      list.forEach(function (item) {
        /* A name belongs to the person and so to every row they appear in; a
           role title belongs to one row. Same split as the amber markers. */
        var isRole = /^roles\//.test(item.tail);
        if (isRole && roleTail(item.tail) !== row.dataset.ridx) { return; }
        row.classList.add('is-edited');
        addEditChip(row, item.e, item.tail === 'emails' ? 'Email'
          : item.tail === 'phones' ? 'Phone'
          : isRole ? 'Job title' : 'Name');
      });
    });

    if (info.length) { markInfoEdits(club, info); }
  }

  function addEditChip(row, e, what) {
    var pill = document.createElement('span');
    pill.className = 'ed-pill ed-pill--edit';
    pill.textContent = what + ' edited';
    pill.title = (String(e.from || '').trim() ? 'Was "' + e.from + '". ' : 'Was blank. ') +
      'Changed by ' + (e.by || 'an editor') + ' on ' + NL.formatDate(e.at) + '.';
    pillsFor(row).appendChild(pill);
  }

  function markInfoEdits(club, info) {
    var card = document.getElementById('cdCard');
    if (!card) { return; }
    var box = document.createElement('div');
    box.className = 'ed-infoedits';
    box.innerHTML = '<b>' + info.length +
      (info.length === 1 ? ' detail' : ' details') + ' edited by hand</b>';
    var ul = document.createElement('ul');
    info.forEach(function (e) {
      var key = e.path.replace(/^info\//, '');
      var li = document.createElement('li');
      li.innerHTML = '<span class="ed-pill ed-pill--edit">' + esc(infoLabel(key)) +
        '</span> ' + (String(e.from || '').trim()
          ? 'was <b>' + esc(e.from) + '</b>' : 'was <i>blank</i>') +
        ' &mdash; ' + esc(e.by || 'an editor') + ', ' + esc(NL.formatDate(e.at));
      ul.appendChild(li);
    });
    box.appendChild(ul);
    card.insertBefore(box, card.firstChild);
  }

  /* A correction to a club detail was being logged and never shown. The tool's
     whole promise is that anything the League changed carries a marker saying
     what the club actually sent — markProvenance delivers that for people, but
     it matches people/<id>/... paths, so every info/<key> change went into the
     record invisibly. Telford's main email was lower-cased and nobody was told.

     Same amber as the row markers, same undo. It sits on the card because a
     club detail has no row, and it names the field because "Was:
     ENQUIRIES@AFCTU.CO.UK" on its own does not say which box it came out of. */
  /* Built on first use, not at load. INFO_FIELDS is declared further down the
     file, so computing this at its own source position read a hoisted but
     unassigned var and threw — which killed the whole boot and, from the
     outside, looked exactly like "the corrections list does not work". */
  var _infoLabel = null;
  function infoLabel(key) {
    if (!_infoLabel) {
      _infoLabel = { seated: 'Of which seated' };
      INFO_FIELDS.forEach(function (g) {
        g[1].forEach(function (f) { _infoLabel[f[0]] = f[1]; });
      });
    }
    return _infoLabel[key] || key;
  }

  function markInfoChanges(club, rec) {
    var changes = NLDirectory.arr((PROV[club] || {}).changes)
      .filter(function (c) { return /^info\//.test(c.path || ''); });
    var card = document.getElementById('cdCard');
    if (!changes.length || !card) { return; }
    var box = document.createElement('div');
    box.className = 'ed-infochanges';
    box.innerHTML = '<b>' + changes.length +
      (changes.length === 1 ? ' correction' : ' corrections') + ' to these details</b>';
    var ul = document.createElement('ul');
    changes.forEach(function (c) {
      var key = c.path.replace(/^info\//, '');
      var li = document.createElement('li');
      li.innerHTML = '<span class="ed-pill ed-pill--was">' +
        esc(infoLabel(key)) + '</span> was ' +
        (String(c.from || '').trim() ? '<b>' + esc(c.from) + '</b>' : '<i>blank</i>');
      if (!signedOffBy(rec)) {
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'ed-undo';
        b.textContent = 'put it back';
        b.addEventListener('click', function () { undoInfo(club, rec, c); });
        li.appendChild(b);
      }
      ul.appendChild(li);
    });
    box.appendChild(ul);
    card.insertBefore(box, card.firstChild);
  }

  /* Restores the value AND drops the marker, so the record and what it says
     about itself stay in step. Leaving the marker behind would have the card
     claiming a correction that is no longer there. */
  function undoInfo(club, rec, change) {
    var key = change.path.replace(/^info\//, '');
    rec.info = rec.info || {};
    rec.info[key] = change.from;
    dropChange(club, change);
    saveStructure(club, infoLabel(key) + ' put back to what the club sent');
  }

  /* The club's own block has no row to hang a chip on, and a flagged social
     is precisely the one that will not render as a link, so these go at the
     head of the card as a short list. The pen underneath opens the form where
     each one is fixed. */
  /* An empty card used to render as an empty card — no facts, no explanation,
     and the flag and correction boxes above it still describing fields that
     were no longer there. Saying it plainly is the difference between "this
     club has not sent us much" and "something has gone wrong here". */
  function markInfoMissing(club, rec) {
    var card = document.getElementById('cdCard');
    if (!card || Object.keys((rec && rec.info) || {}).length) { return; }
    var box = document.createElement('div');
    box.className = 'ed-infoflags';
    box.innerHTML = '<b>No club details are held for ' + esc(club) + '</b>' +
      '<p style="margin:6px 0 0">No ground, address, contact or social accounts \u2014 ' +
      'the whole card is empty. Do not re-type them from memory: what the club ' +
      'sent is still held separately and can be rebuilt from it.</p>';
    /* The recovery goes where the problem is announced. An editor seeing this
       cannot press it — the rules refuse them the submissions node — so they
       get the explanation and a reason not to start typing. */
    if (session.role === 'admin' && !signedOffBy(rec)) {
      var btn = document.createElement('button');
      btn.className = 'btn btn--sm btn--primary';
      btn.type = 'button';
      btn.style.marginTop = '9px';
      btn.textContent = 'Rebuild from the club\u2019s submission\u2026';
      btn.addEventListener('click', function () { rebuildInfo(club); });
      box.appendChild(btn);
    }
    card.insertBefore(box, card.firstChild);
  }

  function markInfoFlags(club, rec) {
    var state = flagState(club).filter(function (i) { return i.f.field === 'info'; });
    var settled = state.filter(function (i) { return i.settled; });
    var flags = state.filter(function (i) { return !i.settled; }).map(function (i) { return i.f; });
    if (settled.length) { showSettledInfo(club, settled); }
    var card = document.getElementById('cdCard');
    if (!flags.length || !card) { return; }
    var box = document.createElement('div');
    box.className = 'ed-infoflags';
    box.innerHTML = '<b>' + flags.length +
      (flags.length === 1 ? ' thing' : ' things') + ' to check in these details</b>';
    var ul = document.createElement('ul');
    flags.forEach(function (f) {
      var li = document.createElement('li');
      li.innerHTML = '<span class="ed-pill ed-pill--gap">' + esc(f.label) +
        '<span class="ed-i" aria-hidden="true">i</span></span> ' + esc(f.why);
      ul.appendChild(li);
    });
    box.appendChild(ul);
    card.insertBefore(box, card.firstChild);
  }

  function showSettledInfo(club, settled) {
    var card = document.getElementById('cdCard');
    if (!card) { return; }
    var box = document.createElement('div');
    box.className = 'ed-infosettled';
    /* "Changed", not "sorted". All the tool knows is that the flag has
       stopped firing, which a wrong value can do as easily as a right one —
       claiming it is solved would be the page asserting something it cannot
       see. The editor's name is next to it; they are the judgement. */
    box.innerHTML = '<b>' + settled.length +
      (settled.length === 1 ? ' flagged detail has' : ' flagged details have') +
      ' since been changed</b>';
    var ul = document.createElement('ul');
    settled.forEach(function (item) {
      var edit = whoFixed(club, item.f.path);
      var li = document.createElement('li');
      li.innerHTML = '<span class="ed-pill ed-pill--fixed">' +
        '<span class="ed-was">' + esc(item.f.label) + '</span>' +
        '<span class="ed-now">Changed</span></span> ' + esc(item.f.why || '') +

        (edit ? ' &mdash; ' + esc(edit.by || 'an editor') + ', ' +
          esc(NL.formatDate(edit.at)) : '');
      ul.appendChild(li);
    });
    box.appendChild(ul);
    card.insertBefore(box, card.firstChild);
  }

  /* Things the tidier could see were wrong and deliberately did not touch — a
     mailbox that does not match the name on the record, a phone number that
     is the wrong length, one job title carried across two departments. Red,
     alongside the gaps, because both mean somebody has to do something; the
     amber "Was:" chips are the opposite, a record of something already done.

     No undo button: there is nothing to put back. The chip says what looks
     wrong and the row above it is already editable. */
  /* --------------------------------------------------- flags, and their fate
     A red flag and a green edit sitting side by side told you two facts and
     left you to join them. The useful thing is the pairing: here was the
     problem, and here is what happened to it.

     It is worked out rather than assumed. The tidier is already loaded, so
     the club is re-scanned on every draw and the answer compared with what
     the bake stored:

       stored, still found   -> open. Red, as before.
       stored, no longer     -> settled. Red and green in one chip.
       not stored, found now -> new. Red, and it appears immediately rather
                                than waiting for the next Re-check — an editor
                                who types a nine-digit phone number finds out
                                now, not in a week.

     That last one is why this is a live scan and not a stored flag with a
     "resolved" bit set on it: a bit can only ever describe the thing that set
     it, and an editor's typing is not that thing. */
  function flagKey(f) { return (f.path || '') + '|' + (f.label || ''); }

  function flagState(club) {
    var rec = ALL[club];
    var stored = NLDirectory.arr((PROV[club] || {}).attention);
    var live = [];
    try { live = window.NLTidy ? NLTidy.flagAttention(rec) : stored; }
    catch (e) { live = stored; }
    var liveKeys = {};
    live.forEach(function (f) { liveKeys[flagKey(f)] = f; });
    var storedKeys = {};
    stored.forEach(function (f) { storedKeys[flagKey(f)] = f; });

    var out = [];
    stored.forEach(function (f) {
      out.push({ f: f, settled: !liveKeys[flagKey(f)] });
    });
    live.forEach(function (f) {
      if (!storedKeys[flagKey(f)]) { out.push({ f: f, settled: false, fresh: true }); }
    });
    return out;
  }

  /* Who dealt with it, if anybody did. An edit whose path covers the flagged
     field is the one that answered it — people/x/emails covers
     people/x/emails/0. */
  function whoFixed(club, path) {
    return editList(club).filter(function (e) {
      return path === e.path || path.indexOf(e.path + '/') === 0;
    })[0];
  }

  function markAttention(club) {
    var all = flagState(club);
    if (!all.length) { return; }
    var byPerson = {};
    all.forEach(function (item) {
      if (item.f.field === 'info') { return; }    /* the card's, not a row's */
      var m = /^people\/([^/]+)(?:\/(.*))?$/.exec(item.f.path || '');
      if (!m) { return; }
      (byPerson[m[1]] = byPerson[m[1]] || []).push(item);
    });
    $('out').querySelectorAll('.cd-row').forEach(function (row) {
      var list = row.dataset.pid && byPerson[row.dataset.pid];
      if (!list) { return; }
      list.forEach(function (item) {
        var m = /^people\/[^/]+\/(.*)$/.exec(item.f.path || '');
        var tail = m ? m[1] : '';
        /* A role-level flag belongs to one row; anything else (an address, a
           number) is about the person and belongs on all of them. */
        if (/^roles\//.test(tail) && roleTail(tail) !== row.dataset.ridx) { return; }
        if (item.settled) { addSettled(row, item.f, whoFixed(club, item.f.path)); }
        else { addGap(row, item.f.label, item.f.why); }
      });
    });
  }

  /* One chip, two halves: what was flagged, and that somebody has since
     changed it. Kept as a pair rather than simply dropping the flag, because
     "there was an issue here and somebody touched it" is worth more to a
     reviewer than a row that looks like it never had one.

     The second half says "Changed" and not "Sorted" on purpose. All this can
     observe is that the flag no longer fires, and a value typed wrong will
     silence a flag exactly as well as a value typed right — a chip claiming
     the problem is solved would be asserting something nobody checked. Who
     changed it and what it used to say are in the tooltip, which is the part
     a reviewer can actually judge. */
  function addSettled(row, f, edit) {
    var pill = document.createElement('span');
    pill.className = 'ed-pill ed-pill--fixed';
    pill.innerHTML = '<span class="ed-was">' + esc(f.label) +
      '<span class="ed-i" aria-hidden="true">i</span></span>' +
      '<span class="ed-now">Changed</span>';
    pill.title = f.why
      ? 'Was flagged: ' + f.why + '.' + (edit
          ? ' Changed by ' + (edit.by || 'an editor') + ' on ' + NL.formatDate(edit.at) +
            (String(edit.from || '').trim() ? ' — was "' + edit.from + '".' : '.')
          : ' It no longer trips the check \u2014 but nothing here says who ' +
            'looked at it.')
      : 'This no longer trips the check.';
    pillsFor(row).appendChild(pill);
  }

  /* A person the League added, as opposed to one the club submitted. Amber,
     with the rest of "we did this" — but no undo button, because the way back
     is the delete button on the row, not a one-click revert that would leave
     an editor wondering where somebody went.

     This is the only marker whose absence means something: everyone without
     it came from the club's own submission, which is what the sign-off page
     is showing them and what the League should not quietly add to. */
  function markAdded(club) {
    var people = {};
    NLDirectory.arr((ALL[club] || {}).people).forEach(function (p) {
      if (p.id && p.added && p.added.at) { people[p.id] = p.added; }
    });
    $('out').querySelectorAll('.cd-row').forEach(function (row) {
      var a = row.dataset.pid && people[row.dataset.pid];
      if (!a) { return; }
      var pill = document.createElement('span');
      pill.className = 'ed-pill ed-pill--edit';
      pill.textContent = 'Added by us';
      row.classList.add('is-edited');
      pill.title = 'Not in the club\u2019s submission. Added by ' + (a.by || 'an editor') +
        ' on ' + NL.formatDate(a.at) + (a.replacing ? ', replacing ' + a.replacing : '') + '.';
      pillsFor(row).appendChild(pill);
    });
  }

  /* Every role entry with no job title. 307 of 1,478 across the 72 clubs, so
     this is the most common thing the admin team has to chase. Read from the
     rendered row rather than the record, so it stays true after an edit. */
  function markGaps(name, rec) {
    $('out').querySelectorAll('.cd-row').forEach(function (row) {
      var role = row.children[1];
      if (role && role.querySelector('em')) { addGap(row, 'No role submitted'); }
    });
  }

  /* A gap the club left. Not ours to undo, so no action on it — it is there to
     be chased, which is what the admin team is for. */
  function addGap(row, text, why) {
    var pill = document.createElement('span');
    pill.className = 'ed-pill ed-pill--gap';
    pill.textContent = text;
    /* An (i) so the tooltip is discoverable. The reason is the useful half of
       a red flag and it was hidden behind a hover nothing advertised. */
    if (why) {
      var i = document.createElement('span');
      i.className = 'ed-i';
      i.textContent = 'i';
      i.setAttribute('aria-hidden', 'true');
      pill.appendChild(i);
    }
    /* The reason goes in the tooltip rather than the chip. "Check spelling"
       is what an editor needs to see at a glance across a whole club; why we
       think so is a sentence, and a sentence in the margin of every row is
       the wall of text the chips replaced. */
    if (why) { pill.title = why; }
    pillsFor(row).appendChild(pill);
  }

  /* ---------------------------------------------------------- sign-off
     Completion lives on the club record itself rather than in a node of its
     own. Editors can already write clubs/$clubName and the reader can already
     read clubs, so this needs no rules change and no deploy — which matters
     more than tidiness tonight.

     Both directions confirm. Marking complete is a claim that somebody looked
     at the whole club, and reopening undoes that claim; neither should happen
     because a thumb landed on a button. NL.confirm, never the native one. */
  function signedOffBy(rec) {
    var s = rec && rec.signedOff;
    return s && s.at ? s : null;
  }

  function showSignoff(club, rec) {
    var done = signedOffBy(rec);
    var wrap = document.createElement('div');
    wrap.className = 'ed-signoff' + (done ? ' is-done' : '');
    wrap.innerHTML =
      '<div class="ed-signoff__t">' +
        '<h3>' + (done ? 'Marked complete' : 'Not yet checked') + '</h3>' +
        '<p>' + (done
          ? esc((done.by || 'Someone') + ' marked this complete on ' +
              NL.formatDate(done.at) + '. Editing is locked until it is reopened.') +
            /* Complete means publishABLE, not published. Two different facts,
               and saying only the first left an editor waiting for a change
               that nobody had released yet. */
            (PUBLISHED_AT >= done.at
              ? ' It is in the published directory.'
              : ' <b>Not published yet</b> \u2014 press Publish at the top when ' +
                'you are ready for readers to see it.')
          : 'When this club has been looked over and the edits are right, mark it ' +
            'complete. That makes it publishable; pressing Publish at the top is ' +
            'what puts it in front of readers.') +
        '</p>' +
      '</div>' +
      '<button class="btn ' + (done ? 'btn--ghost' : 'btn--primary') + '" id="signoffBtn" ' +
        'type="button">' + (done ? 'Reopen for editing' : 'Mark complete') + '</button>';
    $('extra').appendChild(wrap);
    $('out').classList.toggle('is-locked', !!done);
    wrap.querySelector('#signoffBtn').addEventListener('click', function () {
      done ? reopen(club, rec) : markComplete(club, rec);
    });
  }

  function markComplete(club, rec) {
    NL.confirm('Mark ' + club + ' as complete?', {
      title: 'Mark complete',
      detail: 'Editing will be locked and the club becomes publishable. It does ' +
              'not reach readers until somebody presses Publish. You can reopen ' +
              'it at any time.',
      confirmText: 'Mark complete'
    }).then(function (ok) {
      if (!ok) { return; }
      rec.signedOff = { at: Date.now(), by: session.name || 'editor' };
      NL.writeAudit('directory_signoff', club + ' marked complete by ' +
        (session.name || 'editor'));
      persist(club, 'Marked complete');
    });
  }

  function reopen(club, rec) {
    NL.confirm('Reopen ' + club + ' for editing?', {
      title: 'Reopen',
      variant: 'danger',
      detail: 'It will no longer count as checked, and it drops out of the ' +
              'directory at the next publish. Readers keep seeing the version ' +
              'already published until then.',
      confirmText: 'Reopen'
    }).then(function (ok) {
      if (!ok) { return; }
      /* null, not delete: an update() with undefined throws, and null is how
         RTDB removes a key. */
      rec.signedOff = null;
      NL.writeAudit('directory_signoff', club + ' reopened by ' + (session.name || 'editor'));
      persist(club, 'Reopened');
    });
  }

  function persist(club, what, undoOf) {
    logJournal(club, what, undoOf);
    firebase.database().ref(ROOT + '/clubs/' + club).set(ALL[club])
      .then(function () { NL.toast(what, 'success'); fillPicker(); draw(club); })
      .catch(function (err) {
        NL.toast('Could not save: ' + ((err && err.message) || err), 'error');
      });
  }

  /* The merge note, at the foot of the club. Two entries becoming one is the
     single change a person cannot see by looking at the page, because the
     evidence for it was deleted. */
  /* ----------------------------------------------------- the club's details
     The half of the record that is not people, and until now the half nobody
     could correct: a wrong capacity, a stadium under its old name, a social
     account we hold at the wrong URL — all of it read-only, in a tool whose
     entire job is putting the record right.

     A modal rather than the contenteditable cells the rows use. Half these
     facts are composites — the address is five fields, capacity is two, the
     station is two — so editing them in place means either editing a rendered
     sentence or splitting the display, and both are worse than a form. */
  /* Placeholders are examples of SHAPE, never of content, and they say so.
     These used to be Brackley Town's actual ground, town, county, postcode,
     nearest station and switchboard — a real club's real details sitting in
     the empty boxes of every other club's form, where they read as entered
     data rather than as a hint. On a form somebody opens precisely because
     they are unsure what is held, that is the worst possible thing to show.
     Every one now starts "e.g." and none of them is a real club. */
  var INFO_FIELDS = [
    ['Ground', [
      ['stadium', 'Stadium (official)', 'e.g. Riverside Park'],
      ['stadiumSponsor', 'Stadium (sponsored)', 'Leave blank if there is no sponsor'],
      ['capacity', 'Capacity', 'e.g. 3500'],
      ['seated', 'Of which seated', 'e.g. 669'],
      ['pitchDims', 'Pitch dimensions', 'e.g. 101m x 70m'],
      ['pitchType', 'Pitch type', 'e.g. Grass']
    ]],
    ['Address', [
      ['addr1', 'Address line 1', 'e.g. Stadium Way'],
      ['addr2', 'Address line 2', ''],
      ['town', 'Town', 'e.g. Anytown'],
      ['county', 'County', 'e.g. Blankshire'],
      ['postcode', 'Postcode', 'e.g. AB1 2CD'],
      ['countyFA', 'County FA', 'e.g. Blankshire FA'],
      ['station', 'Nearest station', 'e.g. Anytown Central'],
      ['stationDistance', 'Distance (miles)', 'e.g. 1.5']
    ]],
    ['Contact', [
      ['phone', 'Switchboard', 'e.g. 01234 567890'],
      ['mainEmail', 'Main email', 'e.g. secretary@example.co.uk']
    ]],
    ['Sponsors', [
      ['spClub', 'Club sponsor', ''],
      ['spFront', 'Shirt front', ''],
      ['spBack', 'Shirt back', ''],
      ['spSleeve', 'Sleeve', ''],
      ['spShorts', 'Shorts', ''],
      ['spExtra', 'Other', '']
    ]],
    ['Website and social', [
      ['website', 'Website', 'e.g. www.example.co.uk'],
      ['x', 'X', 'https://x.com/...'],
      ['facebook', 'Facebook', 'https://www.facebook.com/...'],
      ['instagram', 'Instagram', 'https://www.instagram.com/...'],
      ['tiktok', 'TikTok', 'https://www.tiktok.com/@...'],
      ['linkedin', 'LinkedIn', 'https://uk.linkedin.com/company/...'],
      ['youtube', 'YouTube', 'https://www.youtube.com/@...']
    ]]
  ];

  function showClubEdit(club, rec) {
    var card = document.getElementById('cdCard');
    if (!card || signedOffBy(rec)) { return; }
    var b = document.createElement('button');
    b.className = 'btn btn--icon btn--ghost ed-cardpen';
    b.type = 'button';
    b.title = 'Edit the club\u2019s details';
    b.setAttribute('aria-label', 'Edit the club\u2019s details');
    b.appendChild(NL.icon('edit'));
    b.addEventListener('click', function () { editClubInfo(club, rec); });
    card.appendChild(b);
  }

  function editClubInfo(club, rec) {
    /* Read through ALL[club] at save time rather than through the rec this
       closure captured. Belt to the braces above: even if something does
       replace the club object mid-session, the save lands on the record the
       rest of the tool is using. */
    var info = rec.info || {};
    var wrap = document.createElement('div');
    INFO_FIELDS.forEach(function (group) {
      var h = document.createElement('h4');
      h.className = 'ed-fgroup';
      h.textContent = group[0];
      wrap.appendChild(h);
      var grid = document.createElement('div');
      grid.className = 'form-grid';
      group[1].forEach(function (f) {
        var g = document.createElement('div');
        g.className = 'form-group';
        var lab = document.createElement('label');
        lab.textContent = f[1];
        var inp = document.createElement('input');
        inp.value = info[f[0]] == null ? '' : String(info[f[0]]);
        inp.setAttribute('data-info', f[0]);
        inp.setAttribute('autocomplete', 'off');
        if (f[2]) { inp.placeholder = f[2]; }
        g.appendChild(lab); g.appendChild(inp); grid.appendChild(g);
      });
      wrap.appendChild(grid);
    });

    NL.modal({
      title: club + ' \u2014 club details',
      width: 'wide',
      body: wrap,
      buttons: [
        { label: 'Cancel', className: 'btn--ghost', onClick: function (c) { c.close(); } },
        /* Not only for an empty card. A field quietly lost, or a tidier fix
           that landed after the build, both want the same three steps. */
        (session.role === 'admin' ? { label: 'Rebuild from submission\u2026',
          className: 'btn--ghost',
          onClick: function (c) { c.close(); rebuildInfo(club); } } : null),
        { label: 'Save details', className: 'btn--primary', onClick: function (c) {
          var next = {}, changed = [];
          for (var k in info) { if (Object.prototype.hasOwnProperty.call(info, k)) { next[k] = info[k]; } }
          wrap.querySelectorAll('[data-info]').forEach(function (inp) {
            var key = inp.getAttribute('data-info');
            var was = info[key] == null ? '' : String(info[key]);
            var now = inp.value.trim();
            if (now === was) { return; }
            next[key] = now;
            changed.push(key);
            logEdit(club, 'info/' + key, was, now);
          });
          /* One flag, one meaning. The submissions carry a noSponsor boolean
             that disagrees with the sponsored name on five clubs, so it is
             derived from the name here rather than edited alongside it. */
          next.noSponsor = !((next.stadiumSponsor || '').trim());
          if (!changed.length) { c.close(); return; }
          (ALL[club] || rec).info = next;
          c.close();
          saveStructure(club, changed.length + ' club detail' +
            (changed.length === 1 ? '' : 's') + ' updated (' + changed.join(', ') + ')');
        } }
      ].filter(Boolean)
    });
  }

  /* Sits directly under the last department, where "and one more person"
     belongs, rather than in the topbar with the club picker — that bar is
     about which club you are looking at, not what you are doing to it. */
  function showAdd(club, rec) {
    if (signedOffBy(rec)) { return; }
    var wrap = document.createElement('div');
    wrap.className = 'ed-add';
    var b = document.createElement('button');
    b.className = 'btn btn--ghost btn--sm';
    b.type = 'button';
    b.appendChild(NL.icon('add'));
    b.appendChild(document.createTextNode('Add someone'));
    b.addEventListener('click', function () { addPerson(club); });
    wrap.appendChild(b);
    $('out').appendChild(wrap);
  }

  function showMerges(club) {
    var merges = NLDirectory.arr((PROV[club] || {}).merges);
    /* Clears the pane, so this must run before showSignoff appends to it. */
    $('extra').innerHTML = !merges.length ? '' :
      '<div class="ed-merges"><h3>Entries we combined</h3>' +
      '<p>The form let a club add the same person once per job, so some people ' +
      'arrived several times. These were combined into one entry carrying all ' +
      'their roles. Nothing was discarded.</p><ul>' +
      merges.map(function (m) {
        var n = NLDirectory.arr(m.absorbed).length;
        return '<li><b>' + esc(m.kept) + '</b> — ' + n +
          (n === 1 ? ' duplicate entry' : ' duplicate entries') + ' merged in</li>';
      }).join('') + '</ul></div>';
  }

  function onSearch(e) {
    var hits = NLDirectory.search(ALL, e.target.value);
    if (!hits) { draw(current); return; }
    $('extra').innerHTML = '';
    if (!hits.length) { $('out').innerHTML = '<p class="cd-empty">Nothing matched that.</p>'; return; }
    var byClub = {};
    hits.forEach(function (h) { (byClub[h.club] = byClub[h.club] || []).push(h.person); });
    $('out').innerHTML = Object.keys(byClub).sort().map(function (c) {
      return '<div class="cd-dept"><h3 class="cd-dept__h">' + esc(c) + '</h3><ul class="cd-rows">' +
        byClub[c].map(function (p) {
          return NLDirectory.personRow(p, (NLDirectory.rolesOf(p)[0] || {}).section, { showHidden: true });
        }).join('') + '</ul></div>';
    }).join('');
  }
}());
</script>
</body>
</html>
