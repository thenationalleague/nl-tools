  v1.25 — (06/08/2026) THE club-card bug, found properly this time.
         Editing a club-card field produced the green "edited by hand" line and
         saved nothing: card unchanged, record unchanged, nothing in My
         changes, no way back. People edits worked throughout.
         RTDB rejects an undefined value by THROWING, synchronously, not by
         rejecting a promise. logEdit built its entry from the `from` of any
         previous edit to the same field, and an entry whose `from` had been
         dropped on write made that undefined — so the second edit of a field
         threw, taking the record write, the journal entry and the modal close
         with it, having already set the marker in memory. Every value is
         coerced now, and the write reports a failure rather than swallowing
         it.
         And the reason this took hours rather than minutes: nothing in a
         browser tells you a click handler died. Uncaught errors and unhandled
         rejections now surface as a message naming the fault and pointing at
         My changes. It cannot make the tool correct; it can stop it being
         quietly wrong, which is the difference between a bug reported
         accurately and one reported as "something's broken".

         column people read character by character. 1180px was a measure for
         prose and this is four columns of data; the wrap goes to 1480 on wide
         screens and the email column takes the width the name and phone
         columns did not need. The longest address in the directory, 44
         characters, now sits on one line at 1280.
         And a "hotnail.com" that nothing had ever flagged. A well-formed
         address, no mismatch with the name, and mail to it goes nowhere. The
         tidier now checks the domain against the mailbox providers a person
         is likely to have and flags anything one or two letters off — paired
         with a rule that costs nothing and removes the false positives: a
         domain more than one person at the club uses is that club's domain,
         and a typo is typed once. Plus endings that are never right at all.
         Retrospective without a rebuild, because flags are re-derived on
         every draw. Three across 870 addresses: hotnail.com at Hebburn Town,
         chorleyfc.ocm at Chorley, email.com at Merthyr Town.

  v1.22 — (06/08/2026) Club details can be rebuilt from the club's own
         submission, per club, master only. Not a backup being restored — the
         same three steps run again: what the club sent (which nothing in this
         tool can write to, so it is still their text whatever has happened
         since), through the same deterministic tidier the bake used, with
         every recorded hand edit replayed on top. A backup can be missing;
         this cannot be, unless the submission is.

  v1.21 — (06/08/2026) Two fixes after Billericay Town's club card came back
         empty — every ground, address, contact and social field gone, while
         the people on the same club were untouched.

         silent. A save that would take a club from five or more held details

         snapshot, and the message names the action that tried it — which is
         the thing that was missing while working out what had happened. It

  v1.20 — (06/08/2026) Frozen versions. Undo protects a change; this protects
         the project. A master can freeze the whole directory — every club,
         every person, and the provenance explaining how it got that way — and
         restore a club from it later.
         Two guarantees, both in the rules rather than here, because a safety
         net a page can decide to ignore is not one. Only a master may create
         one, so an editor cannot touch the thing that exists to survive an
         editor. And it is write-once: there is no parent write grant, only a
         per-edition rule requiring the key to be empty, so nobody — master
         included — can overwrite or delete one. You supersede an edition by
         taking another.
         Restoring is per club and loud about what it discards. Putting all 72
         back with one button is the footgun already removed from undo, and
         the realistic recovery is one club anyway. A restore goes through
         saveStructure, so it lands in the journal and can itself be undone.

         right and both were made after the record had already been sent.
         Behind a six-digit code that was survivable; it is not something to
         carry into a public page, and a public page is where this is going.
         Publish now builds a second copy at published/: signed-off clubs
         only, and for anyone the club asked us to keep back the contact
         details are absent rather than blanked. The person stays listed,
         because a directory that silently omits the safeguarding officer

         Complete and published are now two facts, and the sign-off box says

         six job titles fixed at eleven. It now reverses only what its own act
         touched — the people it changed, the club-detail fields it changed —
         and leaves the rest of the club exactly where it is. The unit is the
         person rather than the field, because the acts here are person-shaped;
         the one case it cannot isolate is two changes to the SAME person, and

  What this is
  ------------
  Where the League's admin team keeps the directory right. Every edit writes
  straight to app-data/ops-club-directory/clubs and is attributable, because
  each editor holds their own code and therefore their own uid. A shared code
  would make the audit trail say nothing, and the audit trail is the reason
  this exists rather than people editing the database by hand.

  The margin markers
  ------------------
  Any field the bake changed carries a marker in the gutter. Click it and it
  says what the club actually sent, with one click to put it back. That is the
  difference between "we tidied your data" and "we changed something and you
  cannot see what" — and it is why _tidy.js threads a provenance log through
  every pass rather than just counting.

  The bake
  --------
  One-shot, master key only, and it refuses to run twice. It reads the raw
  submissions, runs the same tidier the sign-off pages promise clubs, and
  writes the result here with its provenance. After that the tidier never runs
  against this node again: re-running it would stomp on editor work.

  Not lint-covered: no auth-guard, by design.

    overflow-wrap: anywhere;
  }
  .ed-jrnl__meta { font-size: var(--text-xs); color: var(--text-muted); }
  .ed-jrnl__no {
    font-size: var(--text-xs); color: var(--text-muted); flex: 0 0 auto;
    font-weight: 600; font-variation-settings: 'wght' 600;
  }
  /* An undone act and the undo itself both stay in the master's list, quieter
     than the things that still stand — the pair is the point, but it is
     history rather than state. */
  .ed-jrnl__row.is-undone .ed-jrnl__what { text-decoration: line-through; color: var(--text-muted); }
  .ed-jrnl__row.is-undo .ed-jrnl__what { color: var(--green); }
  .ed-pick {
    font-family: var(--font); font-size: var(--text-sm);
    font-weight: 600; font-variation-settings: 'wght' 600;
    padding: 6px 10px; border: 0; border-radius: var(--radius);
    background: var(--white); color: var(--text); max-width: 240px;
  }
  .cd-search { top: 44px; }

  /* Nothing is editable until a pen is pressed. Making every field live on
     tap meant a scroll on a phone could land in a name and change it, and it
     gave no sign that editing was possible at all. */
  .cd-row { position: relative; padding-right: 42px; }
  /* The pen is canon .btn--icon (brand v2.33) — box, colours, hover and the
     centred glyph all come from there, and the editing state is a swap from
     .btn--ghost to .btn--primary while a row was live. All that is this
     tool's business is where it sits. */
  .ed-pen { position: absolute; top: 7px; right: 8px; }

  /* The department picker, in the update-details form. */
  .ed-dept {
    font-family: var(--font); font-size: var(--text-xs);
    font-weight: 600; font-variation-settings: 'wght' 600;
    padding: 4px 8px; border: 1px solid var(--border);
    border-radius: var(--radius-sm); background: var(--white); color: var(--text);
    max-width: 200px;
  }
  .ed-dept:focus { outline: none; box-shadow: var(--focus-ring); border-color: var(--primary); }
  /* Removing is the one act whose cost is on screen in front of you, so it
     reads as the danger it is rather than sitting quietly next to the
     department picker. It is recoverable from "My changes" now, and only that
     person comes back \u2014 not the club as it was. */
  .ed-del { color: var(--red); border-color: var(--red-light); }
  .ed-del:hover { background: var(--red-light); }

  /* The tint, not just the chip. Reading down a club you want to see where
     the work has already been done, and one chip at a time does not give you
     that. Kept faint — 20-odd edited rows should read as progress, not as an
     alarm. The left edge carries the weight. */
  .cd-row.is-edited { background: var(--green-light); box-shadow: inset 3px 0 0 var(--green); }

  /* The club's own details are a card now, so the pen goes in its corner —
     same affordance as a person row, same canon button. */
  .ed-cardpen { position: absolute; top: 10px; right: 10px; }

  /* The club's own block has no row to hang a chip on, so its flags sit at
     the head of the card as a short list. Same red as the row chips: both
     mean somebody has to do something. */
  .ed-infoflags {
    margin: 0 0 16px; padding: 11px 14px;
    background: var(--red-light); border-radius: var(--radius);
    font-size: var(--text-sm); color: var(--text);
  }
  .ed-infoflags b { font-variation-settings: 'wght' 800; color: var(--red); }
  .ed-infoflags ul { margin: 7px 0 0; padding: 0; list-style: none;
    display: flex; flex-direction: column; gap: 5px; }
  .ed-infoflags li { display: flex; align-items: baseline; gap: 8px; line-height: 1.45; }
  .ed-infoflags .ed-pill { flex: 0 0 auto; }

  /* Corrections we made to the club's details. Amber with the rest of "we did
     this", and each one can be put back. */
  .ed-infochanges {
    margin: 0 0 16px; padding: 11px 14px;
    background: var(--amber-light); border-radius: var(--radius);
    font-size: var(--text-sm); color: var(--text);
  }
  .ed-infochanges b { font-variation-settings: 'wght' 800; color: var(--amber-deep); }
  .ed-infochanges ul { margin: 7px 0 0; padding: 0; list-style: none;
    display: flex; flex-direction: column; gap: 5px; }
  .ed-infochanges li { display: flex; align-items: baseline; gap: 8px;
    flex-wrap: wrap; line-height: 1.45; }
  .ed-infochanges .ed-pill { flex: 0 0 auto; }
  /* Hand edits to the club's own details, same green. */
  .ed-infoedits {
    margin: 0 0 16px; padding: 11px 14px;
    background: var(--green-light); border-radius: var(--radius);
    font-size: var(--text-sm); color: var(--text);
  }
  .ed-infoedits b { font-variation-settings: 'wght' 800; color: var(--green); }
  .ed-infoedits ul { margin: 7px 0 0; padding: 0; list-style: none;
    display: flex; flex-direction: column; gap: 5px; }
  .ed-infoedits li { display: flex; align-items: baseline; gap: 8px;
    flex-wrap: wrap; line-height: 1.45; }
  .ed-infoedits .ed-pill { flex: 0 0 auto; }

  /* Flags that have been dealt with. Green box, because the news is that the
     work is done — but each line keeps the red half of the chip, so it reads
     "here is what was wrong, here is what we did about it" rather than losing
     the problem the moment somebody solves it. */
  .ed-infosettled {
    margin: 0 0 16px; padding: 11px 14px;
    background: var(--green-light); border-radius: var(--radius);
    font-size: var(--text-sm); color: var(--text);
  }
  .ed-infosettled b { font-variation-settings: 'wght' 800; color: var(--green); }
  .ed-infosettled ul { margin: 7px 0 0; padding: 0; list-style: none;
    display: flex; flex-direction: column; gap: 5px; }
  .ed-infosettled li { display: flex; align-items: baseline; gap: 8px;
    flex-wrap: wrap; line-height: 1.45; }
  .ed-infosettled .ed-pill { flex: 0 0 auto; }

  .ed-undo {
    padding: 0; border: 0; background: none; cursor: pointer; color: var(--amber-deep);
    font: inherit; text-decoration: underline; opacity: 0.8; white-space: nowrap;
  }
  .ed-undo:hover { opacity: 1; }
  .ed-fgroup {
    margin: 18px 0 8px; font-size: var(--text-xs);
    text-transform: uppercase; letter-spacing: var(--tracking-wide);
    font-weight: 800; font-variation-settings: 'wght' 800; color: var(--primary);
  }
  .ed-fgroup:first-child { margin-top: 0; }

  /* Everything about a person now lives behind one button, so the modal
     carries the layout the row used to. One line per address or number: the
     value, who it is for, and a way to take it off. */
  .ed-morebtns { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }

  /* One boxed card per job, so two roles cannot be misread as one long form.
     The row you came in from is marked, because on somebody with four roles
     "which one was I looking at" is a real question. */
  .ed-roles { display: flex; flex-direction: column; gap: 10px; }
  .ed-role {
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: 12px 13px 13px; position: relative;
  }
  .ed-role.is-here { border-color: var(--navy-300); background: var(--navy-50); }
  .ed-roledel { margin-top: 10px; }
  .ed-clist { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
  .ed-crow { display: flex; align-items: center; gap: 8px; }
  .ed-cval {
    flex: 1 1 auto; min-width: 0;
    font-family: var(--font); font-size: var(--text-sm);
    padding: 8px 11px; border: 1px solid var(--border);
    border-radius: var(--radius); background: var(--white); color: var(--text);
  }
  .ed-cval:focus { outline: none; box-shadow: var(--focus-ring); border-color: var(--primary); }
  .ed-cfor {
    flex: 0 1 190px; min-width: 0;
    font-family: var(--font); font-size: var(--text-xs);
    font-weight: 600; font-variation-settings: 'wght' 600;
    padding: 8px 9px; border: 1px solid var(--border);
    border-radius: var(--radius); background: var(--white); color: var(--text-muted);
  }
  .ed-crow .ed-del { flex: 0 0 auto; }

  /* The reason is the useful half of a red flag, and it sat behind a hover
     with nothing to say it was there. */
  .ed-i {
    display: inline-flex; align-items: center; justify-content: center;
    width: 13px; height: 13px; margin-left: 5px; border-radius: 50%;
    background: var(--red); color: var(--white);
    font-size: 9px; font-weight: 800; font-variation-settings: 'wght' 800;
    font-style: italic; line-height: 1; flex: 0 0 auto;
  }

  .ed-add { margin: 6px 0 26px; }
  .ed-check label { display: flex; align-items: center; gap: 8px; font-weight: 600;
    font-variation-settings: 'wght' 600; }
  .ed-check input { width: auto; }

  /* Provenance sits in the margin, not in the row. A sentence under the field
     pushed every person apart and read as prose when all it needs to say is
     what the club sent. These are chips: two or three words, the original
     value, stacked in the order of the fields they refer to.

     Amber is a correction we made and can undo. Red is a gap the club left,
     which is not ours to undo and wants chasing instead. Both use the light
     tokens rather than solid fills — 21% of role entries have no job title
     and Chester alone has sixteen, so a saturated red would wall the page
     rather than flag anything. */
  .ed-pills { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
  .ed-pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 2px 9px; border-radius: var(--radius-pill);
    font-size: var(--text-xs); line-height: 1.5;
    font-weight: 700; font-variation-settings: 'wght' 700;
    max-width: 100%; overflow-wrap: anywhere;
  }
  .ed-pill--was  { background: var(--amber-light); color: var(--amber-deep); }
  .ed-pill--gap  { background: var(--red-light);   color: var(--red); }
  /* Green is the third state and the only one that is a person doing their
     job: the admin team typed over this. Amber is the tidier's automatic
     correction, red is a problem waiting for somebody. */
  .ed-pill--edit { background: var(--green-light); color: var(--green); }
  /* Red and green in one chip, for a flag somebody has since fixed. Two
     segments rather than two chips: "this was wrong" and "this was the
     resolution" are one fact, and showing them apart leaves the reader to pair
     them up by eye. The red stays full strength — the point is that you can
     still see what the problem was. */
  .ed-pill--fixed { padding: 0; gap: 0; align-items: stretch; overflow: hidden; }
  .ed-was, .ed-now { display: inline-flex; align-items: center; padding: 2px 9px; }
  .ed-was { background: var(--red-light); color: var(--red); }
  /* Solid green rather than green-light: the row this chip sits on has already
     gone green-light, because fixing the flag is itself a hand edit, and a
     green-light half on a green-light row is an invisible half. The word must
     not wrap either — the chips live in a narrow gutter column, and it broke
     as "Sorte / d". */
  .ed-now {
    background: var(--green); color: var(--white); white-space: nowrap; flex: 0 0 auto;
  }
  .ed-now::before { content: '\2192'; margin-right: 5px; opacity: 0.7; }
  .ed-pill button {
    padding: 0; border: 0; background: none; cursor: pointer; color: inherit;
    font: inherit; text-decoration: underline; opacity: 0.75;
    /* The chip wraps on the value, which can be long. The action must not:
       overflow-wrap:anywhere broke "undo" across two lines as "und / o". */
    white-space: nowrap; flex: 0 0 auto;
  }
  .ed-pill button:hover { opacity: 1; }

  /* Wide: a fifth column in the gutter, so the chips annotate the row from
     outside it. Editor-only — the reader has nothing to put there. */
  @media (min-width: 861px) {
    .cd-row {
      grid-template-columns:
        minmax(130px, 0.95fr) minmax(115px, 0.95fr) minmax(250px, 2.1fr)
        minmax(110px, 0.65fr) minmax(140px, 0.9fr);
    }
    .ed-pills { grid-column: 5; grid-row: 1; padding-left: 4px; }
  }
  /* Narrow: beneath the whole entry rather than beside any one field. */
  @media (max-width: 860px) {
    .ed-pills { grid-column: 1 / -1; flex-direction: row; flex-wrap: wrap;
      align-items: center; margin-top: 6px; }
  }

  /* Sign-off, foot of the club. The whole point of the tool is that somebody
     has actually looked at a club, so the state has to be visible before you
     reach the button and honest about who and when. */
  .ed-signoff {
    margin: 26px 0 0; padding: 16px 18px; border-radius: var(--radius);
    border: 1px solid var(--border); background: var(--white);
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  }
  .ed-signoff.is-done { border-color: var(--green); background: var(--green-light); }
  .ed-signoff__t { min-width: 0; flex: 1 1 260px; }
  .ed-signoff__t h3 {
    margin: 0 0 3px; font-size: var(--text-base);
    font-weight: 800; font-variation-settings: 'wght' 800; color: var(--navy);
  }
  .ed-signoff.is-done .ed-signoff__t h3 { color: var(--green); }
  .ed-signoff__t p { margin: 0; font-size: var(--text-sm); color: var(--text-muted);
    line-height: 1.5; max-width: 62ch; }

  /* A locked club still reads normally; it just cannot be changed. The pen
     becomes an eye rather than disappearing — fixtures/index.html has done
     this for a while and it is the better idea: the icon states what you can
     do before you press it, where a missing control only raises the question.
     The undo on a correction chip goes, since that is an edit too. */
  .is-locked .ed-pill button { display: none; }

  /* Merge note, foot of the club. Context rather than alarm, so it is quiet. */
  .ed-merges {
    margin: 26px 0 0; padding: 14px 16px; border: 1px solid var(--border);
    border-radius: var(--radius); background: var(--white);
  }
  /* Master-only strip under the banner. "Where is the club data" could not be
     answered from the outside, because an empty facts grid renders as a rule
     and a gap rather than as nothing. This says what the record actually
     holds, so a missing field is visible instead of inferred. */
  .ed-diag {
    margin: 0 0 18px; padding: 8px 12px; border-radius: var(--radius-sm);
    background: var(--navy-50); color: var(--text-muted);
    font-size: var(--text-xs); line-height: 1.5;
  }
  .ed-diag b { color: var(--navy); font-weight: 800; font-variation-settings: 'wght' 800; }
  .ed-diag .bad { color: var(--red); font-weight: 800; font-variation-settings: 'wght' 800; }
  .ed-merges h3 {
    margin: 0 0 6px; font-size: var(--text-xs); text-transform: uppercase;
    letter-spacing: var(--tracking-wide);
    font-weight: 800; font-variation-settings: 'wght' 800; color: var(--text-muted);
  }
  .ed-merges p { margin: 0 0 8px; font-size: var(--text-sm); color: var(--text-muted);
    line-height: 1.55; max-width: 70ch; }
  .ed-merges ul { margin: 0; padding-left: 18px; font-size: var(--text-sm); line-height: 1.6; }

  .ed-bake { margin: 40px 0 0; padding: 18px; border: 1px solid var(--amber);
    border-radius: var(--radius); background: var(--amber-light); }
  .ed-bake p { margin: 0 0 10px; font-size: var(--text-sm); line-height: 1.55; max-width: 70ch; }
</style>
</head>
<body>

<div id="gateWrap"></div>

<div id="app" hidden>
  <div class="ed-top">
    <span class="ed-top__t">Directory Editor</span>
    <select class="ed-pick" id="pick" aria-label="Choose a club"></select>
    <span class="ed-top__who" id="who"></span>
    <button class="ed-out" id="editions" type="button" hidden>Versions</button>
    <button class="ed-out ed-out--go" id="publish" type="button">Publish</button>
    <button class="ed-out" id="changes" type="button">My changes</button>
    <button class="ed-out" id="recheck" type="button" hidden>Re-check all</button>
    <button class="ed-out" id="signOut" type="button">Sign out</button>
  </div>
  <div class="cd-wrap">
    <div class="cd-search"><div class="cd-search__box">
      <svg class="cd-search__icon" width="17" height="17" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
      <input class="cd-search__in" id="q" placeholder="Search clubs, people and job titles"
        aria-label="Search">
    </div></div>
    <div id="out"></div>
    <div id="extra"></div>
  </div>
</div>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var esc = NL.escHtml;
  var ROOT = NLGate.ROOT;
  var ALL = {}, PROV = {}, names = [], session = null, current = '';
  var PUBLISHED_AT = 0;

  /* Nothing in a browser tells you a click handler died. Today an exception
     inside the club-details save took everything after it with it — the
     record write, the journal entry, the modal closing — and the only sign
     was a marker for a change that had not happened. The tool looked like it
     had a data bug for several hours because a fault had no way of reaching
     the person in front of it.

     So every uncaught error and every unhandled rejection says so. It cannot
     make the tool correct, but it can stop it being quietly wrong, which is
     the difference between a bug that gets reported accurately and one that
     gets reported as "something's broken". */
  window.addEventListener('error', function (e) {
    reportFault(e && e.error && e.error.message ? e.error.message : (e && e.message));
  });
  window.addEventListener('unhandledrejection', function (e) {
    var r = e && e.reason;
    reportFault(r && r.message ? r.message : String(r));
  });

  var lastFault = 0;
  function reportFault(msg) {
    if (!msg) { return; }
    var now = Date.now();
    if (now - lastFault < 4000) { return; }   /* one message, not a cascade */
    lastFault = now;
    try {
      NL.toast('Something went wrong and your last action may not have saved: ' +
        msg + ' \u2014 check "My changes" before carrying on.', 'error');
    } catch (x) { /* the reporter must never be the thing that fails */ }
  }

  NLGate.ensure({
    title: 'Directory Editor',
    sub: 'Enter your six-digit editor code.',
    mount: $('gateWrap')
  }).then(function (s) {
    session = s;
    if (s.role !== 'editor' && s.role !== 'admin') {
      throw new Error('That code opens the reader, not the editor.');
    }
    $('gateWrap').hidden = true;
    $('who').textContent = (s.name || '') + (s.role === 'admin' ? ' (master)' : '');
    $('signOut').addEventListener('click', function () {
      NLGate.signOut().then(function () { location.reload(); });
    });
    return Promise.all([
      NL.clubs.load(),
      firebase.database().ref(ROOT + '/clubs').once('value'),
      firebase.database().ref(ROOT + '/provenance').once('value'),
      /* Only the stamp, not the payload — the editor never needs the published
         copy, it needs to know when it was last made. */
      firebase.database().ref(ROOT + '/published/at').once('value')
    ]);
  }).then(function (res) {
    ALL = res[1].val() || {};
    PROV = res[2].val() || {};
    PUBLISHED_AT = res[3].val() || 0;
    names = Object.keys(ALL).sort();
    NL.installAuditHook();
    if (!names.length) { offerBake(); $('app').hidden = false; return; }
    offerRecheck();
    $('changes').addEventListener('click', showChanges);
    $('publish').addEventListener('click', publishNow);
    fillPicker();
    $('pick').addEventListener('change', function () { draw(this.value); });
    $('q').addEventListener('input', onSearch);
    $('app').hidden = false;
    /* A club per URL, same as the reader and the staff view. Without it an
       editor cannot send "look at this one" to a colleague, cannot reopen
       where they left off, and loses their place on every refresh — which on
       a 72-club job is the difference between a tool and a chore. */
    var first = fromHash() || names[0];
    $('pick').value = first;
    draw(first);
    window.addEventListener('hashchange', function () {
      var n = fromHash();
      if (n && n !== current) { $('pick').value = n; draw(n); }
    });
  }).catch(function (err) {
    $('out').innerHTML = '<p class="cd-empty">' + esc((err && err.message) || String(err)) + '</p>';
    $('app').hidden = false;
  });

  /* --------------------------------------------------------- the re-check
     The bake is one-shot by design: re-running it would overwrite whatever
     the editors have since put right. That is correct, and it also means a
     fix to the tidier can never reach a directory that has already been
     built — which is exactly what happened when _tidy.js v1.1 turned out to
     have been missing "Director Of Football" all along.

     So there is a second, much smaller door. It runs only the two passes
     that are safe to run against edited data:

       · minorCase, which lowercases interior minor words in a job title.
         Idempotent, and it cannot touch anything but the case of and/of/for.
       · flagAttention, which writes no data at all — it only reports.

     It does NOT re-run the typo list, the compound split, the merge or the
     full recase. Those make judgements about what the club originally sent,
     and against a record an editor has since corrected they would be
     judgements about the editor's work instead.

     Master key only, and it says what it did rather than reloading silently. */
  function offerRecheck() {
    if (session.role !== 'admin') { return; }
    $('recheck').hidden = false;
    $('recheck').addEventListener('click', runRecheck);
    /* Master only, and enforced in the rules as well as here — an editor must
       not be able to touch the thing that exists to survive an editor. */
    $('editions').hidden = false;
    $('editions').addEventListener('click', showEditions);
  }

  function runRecheck() {
    NL.confirm(
      'Re-check every club for minor-word capitalisation ("Director Of Football"), ' +
      'and re-scan for anything that needs an editor to look at it — a mailbox that ' +
      'does not match the name, a phone number the wrong length, one job title used ' +
      'in two departments.\n\n' +
      'Nothing else is touched. Corrections editors have already made stay exactly ' +
      'as they are.',
      { title: 'Re-check all clubs', confirmText: 'Re-check' }
    ).then(function (ok) {
      if (!ok) { return; }
      var btn = $('recheck');
      btn.disabled = true; btn.textContent = 'Checking…';
      var db = firebase.database(), updates = {};
      var cased = 0, infoFixed = 0, flagged = 0, clubs = 0;
      Object.keys(ALL).forEach(function (club) {
        var rec = ALL[club], touched = false;
        var extra = [];
        NLTidy.arr(rec.people).forEach(function (p, pi) {
          NLTidy.arr(p.roles).forEach(function (r, ri) {
            var t = (r.title || '').trim();
            if (!t) { return; }
            var out = NLTidy.minorCase(t);
            if (out === t) { return; }
            r.title = out; touched = true; cased++;
            extra.push({ path: 'people/' + (p.id || ('i' + pi)) + '/roles/' + ri + '/title',
                         from: t, to: out, kind: 'case' });
          });
        });
        /* Idempotent, and verified so across all 72: a second pass makes no
           further info changes. Safe to run against edited data. */
        var infoLog = [];
        var hits = NLTidy.tidyInfo(rec, function (path, from, to, kind) {
          infoLog.push({ path: path, from: from, to: to, kind: kind });
        });
        if (hits) { touched = true; infoFixed += hits; extra = extra.concat(infoLog); }
        var att = NLTidy.flagAttention(rec);
        flagged += att.length;
        var prov = PROV[club] || {};
        var changes = NLTidy.arr(prov.changes).concat(extra);
        if (touched) { updates['clubs/' + club] = rec; clubs++; }
        updates['provenance/' + club] = { changes: changes,
          merges: NLTidy.arr(prov.merges), attention: att,
          edits: NLTidy.arr(prov.edits),
          /* An update() at this path replaces the whole child, so anything
             not named here is deleted. The journal is not the re-check's to
             throw away — it is the only record of who did what. */
          journal: prov.journal || null };
        PROV[club] = updates['provenance/' + club];
      });
      NL.writeAudit('directory_recheck',
        cased + ' title(s) recased and ' + infoFixed + ' club detail(s) corrected across ' +
        clubs + ' club(s), ' + flagged + ' flagged for attention (' +
        (session.name || 'master') + ')');
      db.ref(ROOT).update(updates).then(function () {
        NL.toast(cased + ' job title(s) and ' + infoFixed + ' club detail(s) corrected, ' +
          flagged + ' flagged for attention', 'success');
        btn.disabled = false; btn.textContent = 'Re-check all';
        if (current) { draw(current); }
      }).catch(function (err) {
        NL.toast('Could not save: ' + ((err && err.message) || err), 'error');
        btn.disabled = false; btn.textContent = 'Re-check all';
      });
    });
  }

  /* ------------------------------------------------------------ the bake
     Only offered when the node is empty, only to the master key, and it
     re-checks emptiness at the moment of writing rather than trusting what
     the page loaded — two people pressing it at once should not both win. */
  function offerBake() {
    if (session.role !== 'admin') {
      $('out').innerHTML = '<p class="cd-empty">The directory has not been built yet.</p>';
      return;
    }
    $('out').innerHTML =
      '<div class="ed-bake">' +
      '<p><b>The directory is empty.</b> Building it reads every club’s submission, ' +
      'applies the same tidying the sign-off pages promised them — capitalisation, ' +
      'job-title typos, splitting a title that names two jobs, merging anyone entered ' +
      'twice — and writes the result here with a record of every change.</p>' +
      '<p>This runs once. Afterwards the tidier never touches this data again, because ' +
      're-running it would overwrite whatever the editors have since put right.</p>' +
      '<button class="btn btn--primary" id="bakeBtn">Build the directory</button>' +
      '</div>';
    $('bakeBtn').addEventListener('click', runBake);
  }

  function runBake() {
    var btn = $('bakeBtn');
    btn.disabled = true;
    btn.textContent = 'Building…';
    var db = firebase.database();
    db.ref(ROOT + '/clubs').once('value').then(function (snap) {
      if (snap.val()) { throw new Error('The directory already has data. Not overwriting it.'); }
      return db.ref('app-data/ops-club-contacts/submissions').once('value');
    }).then(function (snap) {
      var subs = snap.val() || {};
      var clubs = {}, prov = {}, changed = 0, flagged = 0;
      Object.keys(subs).forEach(function (token) {
        var rec = subs[token];
        if (!rec || !rec.club) { return; }
        var out = NLTidy.run(rec);
        out.rec.club = rec.club;
        clubs[rec.club] = out.rec;
        prov[rec.club] = { changes: out.changes, merges: out.merges,
                           attention: out.attention };
        changed += out.changes.length;
        flagged += (out.attention || []).length;
      });
      if (!Object.keys(clubs).length) { throw new Error('No submissions found to build from.'); }
      NL.writeAudit('directory_bake',
        'Built the directory from ' + Object.keys(clubs).length + ' submissions, ' +
        changed + ' changes recorded, ' + flagged + ' flagged for attention');
      return db.ref(ROOT).update({
        clubs: clubs,
        provenance: prov,
        bake: { at: firebase.database.ServerValue.TIMESTAMP,
                by: session.name || '', clubs: Object.keys(clubs).length,
                changes: changed, attention: flagged }
      });
    }).then(function () {
      NL.toast('Directory built. Reloading…', 'success');
      setTimeout(function () { location.reload(); }, 900);
    }).catch(function (err) {
      NL.toast((err && err.message) || String(err), 'error');
      btn.disabled = false;
      btn.textContent = 'Build the directory';
    });
  }

  /* ------------------------------------------------------------ render */
  /* Which clubs are done, in the list you pick from. Working through 72 of
     them, the question "have I already been through this one" comes up before
     the club is even open — and the answer was two clicks away on the club
     itself.

     Rebuilt rather than patched, and called again after every sign-off and
     reopen: a label that is right at boot and stale by the third club is
     worse than no label. The selection is put back afterwards because
     replacing the options clears it. */
  function fillPicker() {
    var was = $('pick').value;
    $('pick').innerHTML = names.map(function (n) {
      var done = signedOffBy(ALL[n]);
      return '<option value="' + esc(n) + '">' + esc(n) +
        (done ? ' \u2014 COMPLETE' : '') + '</option>';
    }).join('');
    if (was) { $('pick').value = was; }
  }

  function fromHash() {
    var h = decodeURIComponent((location.hash || '').replace(/^#/, ''));
    return names.indexOf(h) > -1 ? h : '';
  }

  function draw(name) {
    current = name;
    var rec = ALL[name];
    if (!rec) { return; }
    rec.club = rec.club || name;
    /* The baseline the next act will be journalled against. Taken here rather
       than threaded through each mutation because every path into a change
       starts from a drawn club and ends in a save that redraws it, so "the
       state at the last draw" and "the state before this act" are the same
       thing — and this way a mutation added later gets its undo for free. */
    BEFORE[name] = snapshot(name);
    if (location.hash !== '#' + encodeURIComponent(name)) {
      history.replaceState(null, '', '#' + encodeURIComponent(name));
    }
    $('out').innerHTML = NLDirectory.renderClub(rec, { showHidden: true });
    var crest = document.getElementById('cdCrest');
    if (crest) {
      crest.alt = name + ' crest'; crest.hidden = false;
      NL.clubs.wireCrestImg(crest, name, true);
      crest.src = NL.clubs.crestUrl(name, 'medium');
    }
    wireEditing(name);
    markProvenance(name);
    markAttention(name);
    markInfoMissing(name, rec);
    markInfoFlags(name, rec);
    markInfoChanges(name, rec);
    markEdits(name);
    markAdded(name);
    markGaps(name, rec);
    showClubEdit(name, rec);
    showAdd(name, rec);
    showMerges(name);
    showSignoff(name, rec);
    if (session.role === 'admin') { diagnose(name, rec); }
  }

  /* What this record actually contains. Master only — it is a maintenance
     readout, not something an editor needs. */
  function diagnose(name, rec) {
    var people = NLDirectory.arr(rec.people);
    var info = rec.info || {};
    var infoFilled = Object.keys(info).filter(function (k) {
      return String(info[k] == null ? '' : info[k]).trim() !== '';
    }).length;
    var withEmail = people.filter(function (p) { return NLDirectory.arr(p.emails).length; }).length;
    var withPhone = people.filter(function (p) { return NLDirectory.arr(p.phones).length; }).length;
    var prov = (PROV[name] || {});
    var n = function (v, label) {
      return '<b class="' + (v ? '' : 'bad') + '">' + v + '</b> ' + label;
    };
    var el = document.createElement('div');
    el.className = 'ed-diag';
    el.innerHTML = 'This record holds ' + n(people.length, 'people') + ', ' +
      n(infoFilled, 'club detail fields') + ', ' + n(withEmail, 'with an email') +
      ', ' + n(withPhone, 'with a phone') + ', ' +
      n(NLDirectory.arr(prov.changes).length, 'recorded changes') + ', ' +
      n(NLDirectory.arr(prov.merges).length, 'merges') + ', ' +
      n(NLDirectory.arr(prov.attention).length, 'flagged for attention') + '.';
    var banner = $('out').querySelector('.cd-facts') || $('out').querySelector('.cd-banner');
    if (banner) { banner.parentNode.insertBefore(el, banner.nextSibling); }
  }

  /* Rows render from the shared module, so editability is attached afterwards
     rather than forking the presentation for one of the three doors. */
  function wireEditing(club) {
    var rec = ALL[club];
    var locked = !!signedOffBy(rec);
    var people = NLDirectory.arr(rec.people);
    var seen = {};
    $('out').querySelectorAll('.cd-row').forEach(function (row) {
      var dept = row.closest('.cd-dept').querySelector('.cd-dept__h').textContent.trim();
      var idx = (seen[dept] = (seen[dept] || 0));
      seen[dept]++;
      var inDept = people.filter(function (p) {
        return NLDirectory.rolesOf(p).some(function (r) { return r.section === dept; });
      });
      var person = inDept[idx];
      if (!person) { return; }
      row.dataset.pid = person.id || '';
      /* Which of this person's roles this row is. Without it a marker for one
         role lands on every row the person appears in, so a title flagged in
         Programme also shows against their Media entry. */
      var roleIdx = NLDirectory.rolesOf(person).map(function (r, i) {
        return r.section === dept ? i : -1;
      }).filter(function (i) { return i > -1; })[0];
      if (roleIdx != null) { row.dataset.ridx = roleIdx; }
      addPen(row, locked, club, person, roleIdx);
    });
  }

  /* ------------------------------------------------- rebuild from source
     The club details, reconstructed rather than remembered.

     Every ingredient survives independently of the directory, which is what
     makes this possible at all:

       · the club's own submission, at ops-club-contacts/submissions. Nothing
         in this tool can write to it — the rules refuse — so it is the same
         text the club typed, whatever has happened since.
       · the tidier, which is deterministic. Running tidyInfo over that
         submission produces exactly the corrections the original bake made,
         because it is the same function over the same input.
       · the hand edits, recorded in provenance with the value each one set.
         Replaying them puts the League's own corrections back on top.

     So "the original, with the changes applied" is not a backup being
     restored, it is the same three steps run again. A backup can be missing;
     this cannot be, unless the submission itself is.

     Only the details. The people are not touched — they carry the admin
     team's work, and there is no version of this worth trading that for.

     Master only, and not merely by preference: reading the submissions node
     needs the master claim since #738, so an editor's token would be refused
     by the rules even if the button were there. */
  var SUBS = null;

  function loadSubs() {
    if (SUBS) { return Promise.resolve(SUBS); }
    return firebase.database().ref('app-data/ops-club-contacts/submissions')
      .once('value').then(function (s) { SUBS = s.val() || {}; return SUBS; });
  }

  function submissionFor(club) {
    var found = null;
    Object.keys(SUBS || {}).forEach(function (t) {
      var r = SUBS[t];
      if (r && r.club === club) { found = r; }
    });
    return found;
  }

  function rebuildInfo(club) {
    var rec = ALL[club];
    if (!rec) { return; }
    loadSubs().then(function () {
      var sub = submissionFor(club);
      if (!sub || !sub.info || !Object.keys(sub.info).length) {
        NL.alert('No submission holding club details could be found for ' + club +
          '. There is nothing to rebuild from \u2014 the details will have to be ' +
          'asked for again.', { title: 'Nothing to rebuild from' });
        return;
      }
      /* Step one and two: what they sent, through the same tidier the bake
         used. The log is kept so the amber markers describe this rebuild
         rather than the bake that is being replaced. */
      var shim = { info: clone(sub.info) };
      var fresh = [];
      try {
        NLTidy.tidyInfo(shim, function (path, from, to, kind) {
          fresh.push({ path: path, from: from, to: to, kind: kind || 'case' });
        });
      } catch (e) { /* a tidier fault must not block a recovery */ }

      /* Step three: the League's own corrections, back on top. */
      var hand = editList(club).filter(function (e) {
        return /^info\//.test(e.path || '');
      });
      hand.forEach(function (e) {
        shim.info[e.path.replace(/^info\//, '')] = e.to;
      });
      shim.info.noSponsor = !((shim.info.stadiumSponsor || '').trim());

      var heldNow = Object.keys(rec.info || {}).filter(function (k) {
        return k !== 'noSponsor' && String((rec.info || {})[k] || '').trim() !== '';
      }).length;
      var heldAfter = Object.keys(shim.info).filter(function (k) {
        return k !== 'noSponsor' && String(shim.info[k] || '').trim() !== '';
      }).length;

      NL.confirm('Rebuild the club details for ' + club + '?', {
        title: 'Rebuild from the submission',
        variant: heldNow > heldAfter ? 'danger' : undefined,
        detail: 'Takes what ' + club + ' sent us, applies the same automatic ' +
          'corrections as the original build, then replays the ' + hand.length +
          ' hand ' + (hand.length === 1 ? 'edit' : 'edits') + ' recorded against ' +
          'these details.\n\n' +
          club + ' currently holds ' + heldNow + ' details. The rebuild holds ' +
          heldAfter + '.\n\n' +
          'Only the club\u2019s own details change. Nobody on the club is touched, ' +
          'and this goes in the journal like any other change, so it can be undone.' +
          (heldNow > heldAfter
            ? '\n\nNote this is FEWER than it holds now, so something currently ' +
              'there is not in the submission. Check before you accept it.'
            : ''),
        confirmText: 'Rebuild ' + club
      }).then(function (ok) {
        if (!ok) { return; }
        rec.info = shim.info;
        /* The amber markers belong to the values on screen, so the info ones
           are replaced wholesale while every people marker is left alone. */
        var prov = PROV[club] || (PROV[club] = {});
        prov.changes = NLDirectory.arr(prov.changes).filter(function (c) {
          return !/^info\//.test(c.path || '');
        }).concat(fresh);
        firebase.database().ref(ROOT + '/provenance/' + club + '/changes')
          .set(prov.changes);
        saveStructure(club, 'Club details rebuilt from the submission (' +
          heldAfter + ' fields)', null, true);
      });
    }).catch(function (err) {
      NL.toast('Could not read the submissions: ' + ((err && err.message) || err), 'error');
    });
  }

  /* -------------------------------------------------------------- editions
     Undo protects a change. This protects the project.

     An edition is the whole directory, frozen: every club, every person, and
     the provenance that explains how it got that way. Taken before handing
     the tool to somebody new, and again when the League agrees a version is
     the version. It is the answer to "what did this look like in August",
     which is a question nobody asks until they very much need to.

     Two rules do the work, and both are in the rules file rather than here,
     because a safety net a page can decide to ignore is not one:

       · Only a master may create one. An editor must not be able to touch the
         thing that exists to survive an editor.
       · Write-once. There is no parent write grant, only a per-edition rule
         requiring the key to be empty — so nobody, master included, can
         overwrite or delete an edition. You supersede one by making another.

     Restoring is per club. Putting all 72 back at once is available and loud,
     but the realistic recovery is "Chester has gone wrong, put Chester back",
     and a single button that silently discards a fortnight is the footgun we
     already took out of undo. A restore goes through saveStructure like any
     other change, so it lands in the journal and can itself be undone. */
  function editionsList() {
    return firebase.database().ref(ROOT + '/editions').once('value').then(function (s) {
      var v = s.val() || {};
      return Object.keys(v).map(function (k) {
        var e = v[k] || {};
        return { id: k, at: e.at || 0, by: e.by || 'unknown', label: e.label || '',
                 clubs: Object.keys(e.clubs || {}).length };
      }).sort(function (a, b) { return b.at - a.at; });
    });
  }

  function takeEdition() {
    NL.prompt('Copies all ' + names.length + ' clubs exactly as they stand, with ' +
      'their history. It cannot be changed or deleted afterwards \u2014 by anyone, ' +
      'including you. Supersede it by taking another.\n\nGive it a name you will ' +
      'recognise in six months.', {
      title: 'Freeze the directory',
      placeholder: 'e.g. Before the admin team started',
      confirmText: 'Freeze it'
    }).then(function (label) {
      if (label === null) { return; }
      var ref = firebase.database().ref(ROOT + '/editions').push();
      var payload = { at: Date.now(), by: session.name || 'editor',
        label: String(label || '').trim() || 'Untitled',
        clubs: clone(ALL) || {}, provenance: clone(PROV) || {} };
      NL.writeAudit('directory_edition', 'Froze ' + names.length + ' clubs as "' +
        payload.label + '" (' + payload.by + ')');
      return ref.set(payload).then(function () {
        NL.toast('Frozen \u2014 ' + names.length + ' clubs', 'success');
      });
    }).catch(function (err) {
      NL.toast('Could not freeze: ' + ((err && err.message) || err), 'error');
    });
  }

  function showEditions() {
    var body = document.createElement('div');
    body.className = 'ed-jrnl';
    body.innerHTML = '<p class="form-hint">Loading\u2026</p>';
    var ctrl = NL.modal({
      title: 'Frozen versions',
      size: 'lg',
      body: body,
      buttons: [
        { label: 'Close', className: 'btn--ghost', onClick: function (c) { c.close(); } },
        { label: 'Freeze the directory now', className: 'btn--primary',
          onClick: function (c) { c.close(); takeEdition(); } }
      ]
    });
    editionsList().then(function (list) {
      if (!list.length) {
        body.innerHTML = '<p class="cd-empty">Nothing has been frozen yet. ' +
          'Freezing takes a copy of all ' + names.length + ' clubs that nobody ' +
          'can change afterwards \u2014 worth doing before anyone new starts editing.</p>';
        return;
      }
      body.innerHTML = '<p class="form-hint">Each of these is the whole directory as ' +
        'it stood at that moment. None of them can be altered. Restoring puts one ' +
        'club back to how it was then, and lands in the journal like any other ' +
        'change.</p><ul class="ed-jrnl__list">' + list.map(function (e) {
        return '<li class="ed-jrnl__row">' +
          '<div class="ed-jrnl__main">' +
            '<span class="ed-jrnl__what">' + esc(e.label) + '</span>' +
            '<span class="ed-jrnl__meta">' + esc(NL.formatDateTime(e.at)) + ' \u00b7 ' +
              esc(e.by) + ' \u00b7 ' + e.clubs + ' clubs</span>' +
          '</div>' +
          '<button class="btn btn--sm btn--ghost" type="button" data-ed="' +
            esc(e.id) + '">Restore\u2026</button>' +
        '</li>';
      }).join('') + '</ul>';
      body.querySelectorAll('button[data-ed]').forEach(function (b) {
        b.addEventListener('click', function () { restoreFrom(b.dataset.ed, ctrl); });
      });
    }).catch(function (err) {
      body.innerHTML = '<p class="cd-empty">' + esc((err && err.message) || err) + '</p>';
    });
  }

  function restoreFrom(id, ctrl) {
    var club = current;
    if (!club) { NL.toast('Open a club first', 'error'); return; }
    firebase.database().ref(ROOT + '/editions/' + id).once('value').then(function (s) {
      var ed = s.val();
      if (!ed) { NL.toast('That version could not be read', 'error'); return; }
      var was = (ed.clubs || {})[club];
      if (!was) {
        NL.alert(club + ' was not in that version, so there is nothing to put ' +
          'back. Pick a club that existed when it was frozen.', { title: 'Not in that version' });
        return;
      }
      var now = NLDirectory.arr((ALL[club] || {}).people).length;
      var then = NLDirectory.arr(was.people).length;
      NL.confirm('Put ' + club + ' back to "' + (ed.label || 'that version') + '"?', {
        title: 'Restore ' + club,
        variant: 'danger',
        detail: 'It goes back to exactly how it stood on ' + NL.formatDate(ed.at) +
          ' \u2014 ' + then + ' people, where it now has ' + now + '. Everything done ' +
          'to this club since is discarded.\n\nOnly this club. The other ' +
          (names.length - 1) + ' are untouched, and this lands in the journal so it ' +
          'can itself be undone.',
        confirmText: 'Restore ' + club
      }).then(function (ok) {
        if (!ok) { return; }
        if (ctrl && ctrl.close) { ctrl.close(); }
        /* Mutated, never replaced. Replacing it orphans every closure the
           current render is holding — the card pen among them — so the page
           carries on editing an object nothing will ever save. That is what
           made a club-card edit write its green marker and change nothing
           else. */
        var live = ALL[club] || (ALL[club] = {});
        Object.keys(live).forEach(function (k) { delete live[k]; });
        var back = clone(was) || {};
        Object.keys(back).forEach(function (k) { live[k] = back[k]; });
        live.club = club;
        var prov = clone((ed.provenance || {})[club]) || {};
        var cur = PROV[club] || (PROV[club] = {});
        /* The journal is the one thing a restore must not roll back: it is the
           record that the restore happened, and of everything before it. */
        cur.edits = NLDirectory.arr(prov.edits);
        cur.changes = NLDirectory.arr(prov.changes);
        cur.attention = NLDirectory.arr(prov.attention);
        cur.merges = NLDirectory.arr(prov.merges);
        var db = firebase.database();
        ['edits', 'changes', 'attention', 'merges'].forEach(function (k) {
          db.ref(ROOT + '/provenance/' + club + '/' + k).set(cur[k]);
        });
        saveStructure(club, 'Restored to \u201c' + (ed.label || 'a frozen version') +
          '\u201d', null, true);
      });
    }).catch(function (err) {
      NL.toast('Could not restore: ' + ((err && err.message) || err), 'error');
    });
  }

  /* --------------------------------------------------------------- publish
     The reader used to read the directory itself and decide, in the browser,
     what not to show: unsigned clubs greyed out, a not-for-publication
     person's address replaced with "Not published". Both decisions were
     correct and both were made far too late — the record had already been
     sent. Behind a six-digit code that was survivable. It is not a thing to
     carry into a public page, and a public page is where this is going.

     So publishing builds a SECOND copy that is already safe to hand over.
     Signed-off clubs only, and for anyone the club asked us to keep back the
     contact details are absent rather than flagged: the person is still
     listed, because a directory that silently omits the safeguarding officer
     reads as a club without one, but there is nothing in the file to hide.

     The point is that no rule has to be clever about this node, and no page
     built against it later can leak something by asking for too much. There
     is nothing in it that is not meant to be read.

     It is a button and not a trigger on sign-off because publishing is when
     the League stands behind the whole thing at once, and somebody should
     have chosen the moment. Who and when are recorded with it. */
  var PUB_PERSON = ['id', 'title', 'firstName', 'lastName', 'postNominals',
                    'name', 'roles', 'hideContact'];

  function publishablePerson(p) {
    var out = {};
    PUB_PERSON.forEach(function (k) {
      if (p[k] !== undefined && p[k] !== null) { out[k] = clone(p[k]); }
    });
    /* The whole point. Not blanked, not flagged — not there. `added` goes too:
       whether the League typed somebody in or the club did is our business. */
    if (!p.hideContact) {
      out.emails = clone(NLDirectory.arr(p.emails)) || [];
      out.phones = clone(NLDirectory.arr(p.phones)) || [];
    }
    return out;
  }

  function buildPublished() {
    var clubs = {}, pending = [], people = 0, held = 0;
    Object.keys(ALL).sort().forEach(function (name) {
      var rec = ALL[name] || {};
      if (!signedOffBy(rec)) { pending.push(name); return; }
      var list = NLDirectory.arr(rec.people);
      list.forEach(function (p) { people++; if (p.hideContact) { held++; } });
      clubs[name] = {
        club: name,
        info: clone(rec.info || {}),
        people: list.map(publishablePerson)
      };
    });
    return { clubs: clubs, pending: pending,
             count: Object.keys(clubs).length, people: people, held: held };
  }

  function publishNow() {
    var built = buildPublished();
    if (!built.count) {
      NL.alert('No club has been marked complete yet, so there is nothing to ' +
        'publish. Mark a club complete and it becomes publishable.',
        { title: 'Nothing to publish' });
      return;
    }
    var prev = PUBLISHED_AT;
    NL.confirm('Publish ' + built.count + ' club' + (built.count === 1 ? '' : 's') +
      ' to the directory?', {
      title: 'Publish',
      detail: 'This replaces what readers see with the ' + built.count +
        ' club' + (built.count === 1 ? '' : 's') + ' marked complete right now — ' +
        built.people + ' people, of whom ' + built.held + ' asked us to keep their ' +
        'contact details back. Those details are left out of the published copy ' +
        'entirely; the person is still listed.\n\n' +
        (built.pending.length
          ? built.pending.length + ' club' + (built.pending.length === 1 ? '' : 's') +
            ' not yet marked complete will not appear.\n\n'
          : '') +
        (prev ? 'Last published ' + NL.formatDateTime(prev) + '.'
              : 'Nothing has been published before.'),
      confirmText: 'Publish'
    }).then(function (ok) {
      if (!ok) { return; }
      var btn = $('publish');
      btn.disabled = true; btn.textContent = 'Publishing\u2026';
      var payload = { at: Date.now(), by: session.name || 'editor',
        count: built.count, people: built.people,
        clubs: built.clubs, pending: built.pending };
      NL.writeAudit('directory_publish', built.count + ' club(s), ' + built.people +
        ' people published by ' + (session.name || 'editor'));
      firebase.database().ref(ROOT + '/published').set(payload).then(function () {
        PUBLISHED_AT = payload.at;
        btn.disabled = false; btn.textContent = 'Publish';
        NL.toast(built.count + ' club' + (built.count === 1 ? '' : 's') +
          ' published', 'success');
        if (current) { draw(current); }
      }).catch(function (err) {
        btn.disabled = false; btn.textContent = 'Publish';
        NL.toast('Could not publish: ' + ((err && err.message) || err), 'error');
      });
    });
  }

  /* --------------------------------------------------------- the journal
     Every save leaves two records, and they are deliberately not the same
     record.

     The JOURNAL is append-only. Nothing is ever edited or deleted in it, and
     an undo does not remove the thing it undoes — it appends an entry that
     points at it. So a master looking at a club sees both halves: an editor
     removed a club's whole board, and then that editor put it back. That is
     the honest account, and it is the one worth keeping.

     The WORKING LIST is derived from the journal, not stored: your own
     entries, most recent first, with anything you have since undone filtered
     out. An undone change is not work you did; it is work you did and then
     un-did, and a to-do list that keeps showing it is lying to you.

     The body at .../undo/<club>/<id> is a PATCH, not a snapshot, and that
     distinction is the whole design. The first cut stored the club as it was
     and put the whole thing back, which meant undoing a mistake made at ten
     silently threw away the six job titles fixed at eleven. Undo now reverses
     only what its own act touched — the people it changed, the club-detail
     fields it changed — and leaves everything else exactly where it is.

     The unit of isolation is the person, not the field, because the acts this
     tool performs are person-shaped: "update details for X" changes a name, a
     title, three addresses and a publish flag as one decision, and unpicking
     it field by field would let you land halfway through somebody's move to a
     new job. The one case it does not isolate is two acts on the SAME person —
     undoing the earlier one takes the later one with it, for that person only.
     The journal entry carries the ids it touched so the confirm can say so
     before you press it.

     It lives at a separate path rather than in the journal because the editor
     loads every club's provenance at boot; the journal entry is a line of
     text, a timestamp and a short list of ids.
     Nothing is pruned. The first cut kept twenty per club, which was sized
     for whole-club snapshots at twenty-odd kilobytes each; a patch is a few
     hundred bytes and lives in a node the editor never loads at boot, so a
     cap would be throwing away the one thing this exists to keep. */
  var BEFORE = {};

  function clone(v) { return v == null ? null : JSON.parse(JSON.stringify(v)); }
  function same(a, b) { return JSON.stringify(a === undefined ? null : a) ===
                               JSON.stringify(b === undefined ? null : b); }

  function snapshot(club) {
    var rec = ALL[club] || {}, prov = PROV[club] || {};
    return {
      people:    clone(NLDirectory.arr(rec.people)) || [],
      info:      clone(rec.info || {}),
      signedOff: rec.signedOff || null,
      edits:     clone(NLDirectory.arr(prov.edits)) || [],
      changes:   clone(NLDirectory.arr(prov.changes)) || []
    };
  }

  function byId(list) {
    var m = {};
    (list || []).forEach(function (p, i) { m[(p && p.id) || ('#' + i)] = { p: p, i: i }; });
    return m;
  }
  function byPath(list) {
    var m = {};
    (list || []).forEach(function (e) { if (e && e.path) { m[e.path] = e; } });
    return m;
  }
  function keysOf() {
    var out = {};
    for (var i = 0; i < arguments.length; i++) {
      Object.keys(arguments[i] || {}).forEach(function (k) { out[k] = 1; });
    }
    return Object.keys(out);
  }

  /* before -> after, as the smallest thing that can put before back. */
  function diffClub(a, b) {
    var A = byId(a.people), B = byId(b.people), out = {}, people = {};
    keysOf(A, B).forEach(function (id) {
      var x = A[id] || null, y = B[id] || null;
      if (same(x && x.p, y && y.p)) { return; }
      people[id] = { before: x ? clone(x.p) : null, after: y ? clone(y.p) : null };
      if (x) { people[id].at = x.i; }        /* so a restored person lands back
                                                 where they were, not at the end */
    });
    if (keysOf(people).length) { out.people = people; }

    var info = {};
    keysOf(a.info, b.info).forEach(function (k) {
      if (same((a.info || {})[k], (b.info || {})[k])) { return; }
      info[k] = { before: (a.info || {})[k] == null ? null : (a.info || {})[k],
                  after:  (b.info || {})[k] == null ? null : (b.info || {})[k] };
    });
    if (keysOf(info).length) { out.info = info; }

    if (!same(a.signedOff, b.signedOff)) {
      out.signedOff = { before: a.signedOff || null, after: b.signedOff || null };
    }
    /* The markers move with the thing they describe, or an undone edit leaves
       a green chip behind claiming a change that is no longer there. Keyed by
       path so one row's marker can go back without disturbing another's. */
    ['edits', 'changes'].forEach(function (kind) {
      var X = byPath(a[kind]), Y = byPath(b[kind]), d = {};
      keysOf(X, Y).forEach(function (path) {
        if (same(X[path], Y[path])) { return; }
        d[path] = { before: X[path] || null, after: Y[path] || null };
      });
      if (keysOf(d).length) { out[kind] = d; }
    });
    return out;
  }

  /* Applies the `before` side, and only where this act actually changed
     something. Everything the act did not name is left alone. */
  function applyPatch(club, patch) {
    var rec = ALL[club] || (ALL[club] = {});
    var list = NLDirectory.arr(rec.people).slice();
    Object.keys(patch.people || {}).forEach(function (id) {
      var d = patch.people[id], i = -1;
      for (var k = 0; k < list.length; k++) {
        if (list[k] && list[k].id === id) { i = k; break; }
      }
      if (d.before == null) { if (i > -1) { list.splice(i, 1); } return; }
      if (i > -1) { list[i] = clone(d.before); return; }
      var at = typeof d.at === 'number' ? Math.min(d.at, list.length) : list.length;
      list.splice(at, 0, clone(d.before));
    });
    rec.people = list;

    if (patch.info) {
      rec.info = rec.info || {};
      Object.keys(patch.info).forEach(function (k) {
        var v = patch.info[k].before;
        if (v == null) { delete rec.info[k]; } else { rec.info[k] = clone(v); }
      });
    }
    if (patch.signedOff) { rec.signedOff = clone(patch.signedOff.before); }

    var prov = PROV[club] || (PROV[club] = {});
    var db = firebase.database();
    ['edits', 'changes'].forEach(function (kind) {
      if (!patch[kind]) { return; }
      var cur = NLDirectory.arr(prov[kind]).slice();
      Object.keys(patch[kind]).forEach(function (path) {
        var d = patch[kind][path];
        cur = cur.filter(function (e) { return e.path !== path; });
        if (d.before) { cur.push(clone(d.before)); }
      });
      prov[kind] = cur;
      db.ref(ROOT + '/provenance/' + club + '/' + kind).set(cur);
    });
  }

  /* A short, human list of what this act touched, for the confirm and for
     spotting the one case undo cannot isolate: two acts on one person. */
  function touchedBy(club, patch) {
    var names = [];
    Object.keys(patch.people || {}).forEach(function (id) {
      var d = patch.people[id];
      var p = d.before || d.after;
      names.push(NLDirectory.fullName(p) || 'someone');
    });
    return { ids: keysOf(patch.people), names: names,
             info: !!patch.info, signedOff: !!patch.signedOff };
  }

  /* undoOf turns this into the second half of a pair rather than a new act of
     its own, which is what keeps an undo out of the working list while
     leaving it in the record. */
  function logJournal(club, what, undoOf) {
    var db = firebase.database();
    var now = snapshot(club);
    var patch = BEFORE[club] ? diffClub(BEFORE[club], now) : null;
    var ref = db.ref(ROOT + '/provenance/' + club + '/journal').push();
    var e = { id: ref.key, at: Date.now(), by: session.name || 'editor', what: what };
    if (undoOf) { e.undoOf = undoOf; }
    var prov = PROV[club] || (PROV[club] = {});
    prov.journal = prov.journal || {};
    prov.journal[ref.key] = e;
    /* Only for acts that could be undone. An undo of an undo is done by
       pressing Undo on the original again, not by stacking them. And an act
       that changed nothing measurable gets a journal line but no button —
       there would be nothing for it to put back. */
    if (!undoOf && patch && keysOf(patch).length) {
      e.undoable = true;
      e.touched = touchedBy(club, patch);
      db.ref(ROOT + '/undo/' + club + '/' + ref.key).set(patch);
    }
    ref.set(e);
    BEFORE[club] = now;
    return e;
  }

  /* Every club's journal, newest first, with each entry told whether it has
     since been undone. Flattened across clubs on purpose: the mistake you
     want back is rarely on the club you are looking at — you noticed it two
     clubs later, which is why you are opening this at all. */
  function journalAll() {
    var out = [];
    Object.keys(PROV).forEach(function (club) {
      var j = (PROV[club] || {}).journal;
      if (!j || typeof j !== 'object') { return; }
      Object.keys(j).forEach(function (k) {
        var e = j[k];
        if (e && e.at) { out.push({ club: club, e: e }); }
      });
    });
    var undone = {};
    out.forEach(function (x) { if (x.e.undoOf) { undone[x.e.undoOf] = x.e; } });
    out.forEach(function (x) { x.undone = undone[x.e.id] || null; });
    return out.sort(function (a, b) { return (b.e.at || 0) - (a.e.at || 0); });
  }

  function myName() { return session.name || 'editor'; }

  function showChanges() {
    var everyone = false;
    var body = document.createElement('div');
    body.className = 'ed-jrnl';

    var render = function () {
      var all = journalAll();
      var list = everyone ? all : all.filter(function (x) {
        /* Yours, still standing, and an act rather than the undo of one. */
        return x.e.by === myName() && !x.undone && !x.e.undoOf;
      });
      var head = everyone
        ? '<p class="form-hint">Everything every editor has done, including undos. ' +
          'Nothing is ever removed from this list.</p>'
        : '<p class="form-hint">What you have changed, most recent first, across ' +
          'every club. Undoing one puts back only what that change touched and takes ' +
          'it off this list — the record of both still stands.</p>';
      if (!list.length) {
        body.innerHTML = head + '<p class="cd-empty">' +
          (everyone ? 'Nothing has been changed yet.'
                    : 'You have not changed anything yet.') + '</p>';
        return void mountToggle();
      }
      /* The list runs across every club, so the club is the thing the eye
         needs first — and a crest finds it faster than reading 72 names. */
      /* Nothing is deleted, so a master's view across 72 clubs can run long.
         The list is capped for rendering only, and says what it is not
         showing rather than trailing off. */
      var SHOW = 100, hidden = Math.max(0, list.length - SHOW);
      body.innerHTML = head + '<ul class="ed-jrnl__list">' + list.slice(0, SHOW).map(function (x) {
        var e = x.e;
        var when = NL.formatDateTime ? NL.formatDateTime(e.at) : NL.formatDate(e.at);
        return '<li class="ed-jrnl__row' + (x.undone ? ' is-undone' : '') +
            (e.undoOf ? ' is-undo' : '') + '">' +
          '<img class="ed-jrnl__crest" alt="" data-crest="' + esc(x.club) + '">' +
          '<div class="ed-jrnl__main">' +
            '<span class="ed-jrnl__what">' + esc(e.what || 'Changed') + '</span>' +
            '<span class="ed-jrnl__meta">' + esc(x.club) + ' · ' + esc(when) +
              (everyone ? ' · ' + esc(e.by || 'editor') : '') +
              (x.undone ? ' · undone by ' + esc(x.undone.by || 'editor') : '') +
            '</span>' +
          '</div>' +
          (!x.undone && !e.undoOf && e.undoable
            ? '<button class="btn btn--sm btn--ghost" type="button" data-club="' +
              esc(x.club) + '" data-id="' + esc(e.id) + '">Undo</button>'
            : '<span class="ed-jrnl__no">' +
              (x.undone ? 'Undone' : e.undoOf ? 'Reversal' : 'Nothing to put back') +
              '</span>') +
          '</li>';
      }).join('') + '</ul>' + (hidden
        ? '<p class="form-hint">' + hidden + ' older ' +
          (hidden === 1 ? 'change is' : 'changes are') + ' not shown here. ' +
          'Nothing has been deleted \u2014 they are still on the record.</p>'
        : '');
      body.querySelectorAll('img[data-crest]').forEach(function (img) {
        var n = img.dataset.crest;
        img.alt = n + ' crest';
        NL.clubs.wireCrestImg(img, n, true);
        img.src = NL.clubs.crestUrl(n, 'thumb');
      });
      body.querySelectorAll('button[data-id]').forEach(function (b) {
        b.addEventListener('click', function () {
          undoJournal(b.dataset.club, b.dataset.id, ctrl);
        });
      });
      mountToggle();
    };

    /* Master only. An editor seeing everyone's work would be fine; an editor
       seeing an Undo button against a colleague's work would not, and the two
       are hard to separate once the list is shared. */
    var mountToggle = function () {
      if (session.role !== 'admin') { return; }
      var bar = document.createElement('div');
      bar.className = 'ed-jrnl__tabs';
      bar.innerHTML = '<button class="btn btn--sm ' + (everyone ? 'btn--ghost' : 'btn--primary') +
          '" type="button" data-all="0">Mine</button>' +
        '<button class="btn btn--sm ' + (everyone ? 'btn--primary' : 'btn--ghost') +
          '" type="button" data-all="1">Everyone</button>';
      body.insertBefore(bar, body.firstChild);
      bar.querySelectorAll('button').forEach(function (b) {
        b.addEventListener('click', function () {
          everyone = b.dataset.all === '1'; render();
        });
      });
    };

    render();
    var ctrl = NL.modal({
      title: 'Recent changes',
      size: 'lg',
      body: body,
      buttons: [{ label: 'Close', className: 'btn--ghost',
        onClick: function (c) { c.close(); } }]
    });
    return ctrl;
  }

  /* Somebody else may have touched the same person since. That is the one
     thing undo cannot isolate, so it is named before you press rather than
     discovered afterwards. */
  function laterOn(club, entry) {
    var mine = (entry.touched || {}).ids || [];
    if (!mine.length) { return []; }
    var j = (PROV[club] || {}).journal || {};
    var undone = {};
    Object.keys(j).forEach(function (k) { if (j[k].undoOf) { undone[j[k].undoOf] = 1; } });
    return Object.keys(j).map(function (k) { return j[k]; })
      .filter(function (e) {
        if (e.id === entry.id || e.undoOf || undone[e.id]) { return false; }
        if ((e.at || 0) <= (entry.at || 0)) { return false; }
        return ((e.touched || {}).ids || []).some(function (id) {
          return mine.indexOf(id) > -1;
        });
      }).sort(function (a, b) { return (a.at || 0) - (b.at || 0); });
  }

  /* The patch is fetched now rather than held in memory: almost none of them
     are ever wanted, and the editor already loads all 72 clubs' provenance at
     boot without them. */
  function undoJournal(club, id, ctrl) {
    var j = ((PROV[club] || {}).journal || {})[id];
    if (!j) { return; }
    var who = (j.touched || {}).names || [];
    var scope = who.length ? (who.length === 1 ? who[0] : who.length + ' people')
      : ((j.touched || {}).signedOff ? 'the sign-off' : 'the club\u2019s own details');
    var clash = laterOn(club, j);
    var detail = '\u201c' + (j.what || 'Change') + '\u201d. This puts ' + scope +
      ' back as they were before it, at ' + club + '. Nothing else on the club is ' +
      'touched \u2014 anything you have changed since, anywhere else, stays as it is.';
    if (clash.length) {
      detail += '\n\nBut ' + (who.length === 1 ? who[0] : 'somebody here') +
        ' has been changed again since, by ' + (clash[0].by || 'an editor') +
        ' \u2014 \u201c' + (clash[0].what || 'a change') + '\u201d. That will go back too.';
    }
    NL.confirm('Undo this change to ' + club + '?', {
      title: 'Undo',
      variant: clash.length ? 'danger' : undefined,
      detail: detail,
      confirmText: 'Undo it'
    }).then(function (ok) {
      if (!ok) { return; }
      return firebase.database().ref(ROOT + '/undo/' + club + '/' + id).once('value')
        .then(function (snap) {
          var patch = snap.val();
          if (!patch) {
            NL.toast('There is nothing held for that change, so it cannot be put ' +
              'back. The record of it stands.', 'error');
            return;
          }
          if (ctrl && ctrl.close) { ctrl.close(); }
          applyPatch(club, patch);
          if ($('pick')) { $('pick').value = club; }
          return saveStructure(club, 'Undid: ' + (j.what || 'a change'), id);
        });
    }).catch(function (err) {
      NL.toast('Could not undo: ' + ((err && err.message) || err), 'error');
    });
  }

  /* ------------------------------------------------- structural changes
     Correcting a field and changing the shape of a club are different acts.
     A field edit rewrites one value in place; adding, removing or moving
     somebody changes which rows exist and which department they sit under, so
     the club has to be redrawn afterwards.

     Everything here is blocked on a signed-off club, and the destructive parts
     still confirm — a removal is the one act where the thing you are about to
     lose is on screen in front of you, and a confirm is cheaper than finding
     the undo afterwards. */
  /* A club that held a stadium, an address and six social accounts does not
     legitimately end up holding none of them. Nothing in this tool is
     supposed to be able to do that, and yet Billericay Town's card emptied
     itself. Until the cause is found this refuses the write and says so,
     which turns a silent loss into a visible one — and names the action that
     tried it, which is the thing that was missing while working out what had
     happened. It restores from the pre-change snapshot rather than just
     declining, so the record in memory matches the record on the server. */
  function guardInfo(club, what, expected) {
    /* A restore or a rebuild is entitled to replace the details wholesale,
       including with fewer than there were — that is the point of it, and the
       confirm has already said so. Blocking those was the guard firing on the
       one action brought in to recover from the thing it guards against. */
    if (expected) { return true; }
    var was = (BEFORE[club] || {}).info || {};
    var now = (ALL[club] || {}).info || {};
    /* Counting keys is not enough. Thirty keys all holding an empty string
       renders exactly the same blank card as thirty keys that have gone, and
       the first version of this guard waved that straight through. What
       matters is how much is actually held. noSponsor is excluded because it
       is a derived boolean and is always present. */
    var held = function (o) {
      return Object.keys(o).filter(function (k) {
        return k !== 'noSponsor' && String(o[k] == null ? '' : o[k]).trim() !== '';
      }).length;
    };
    if (held(was) < 5 || held(now) > 0) { return true; }
    ALL[club].info = clone(was);
    /* Redraw, always. A block that leaves the page showing what it tried to
       do is worse than no block: the next edit is made against a record that
       is not the one on screen. */
    draw(club);
    NL.alert('That would have wiped every club detail for ' + club + ' — ' +
      held(was) + ' fields down to none. It has been stopped and ' +
      'nothing was saved.\n\nThe action was: "' + what + '". Please tell Richard ' +
      'exactly what you had just done, because this should not be possible.',
      { title: 'Stopped — that would have emptied the club details' });
    NL.writeAudit('directory_guard', club + ' — blocked an info wipe during: ' + what);
    return false;
  }

  function saveStructure(club, what, undoOf, expected) {
    if (!guardInfo(club, what, expected)) { return Promise.resolve(); }
    NL.writeAudit('directory_structure',
      club + ' — ' + what + ' (' + (session.name || 'editor') + ')');
    logJournal(club, what, undoOf);
    return firebase.database().ref(ROOT + '/clubs/' + club).set(ALL[club])
      .then(function () { NL.toast(what, 'success'); draw(club); })
      .catch(function (err) {
        NL.toast('Could not save: ' + ((err && err.message) || err), 'error');
      });
  }

  /* Ids look like the ones the submission form mints — 'p' plus base-36 — so
     a person added here is indistinguishable from one that came through the
     form, which is what provenance and the sign-off links both key on. */
  function newId() {
    return 'p' + Math.random().toString(36).slice(2, 10) + Math.random().toString(36).slice(2, 5);
  }

  function deptSelect(value, cls) {
    var s = document.createElement('select');
    s.className = cls || 'ed-dept';
    NLDirectory.ORDER.forEach(function (name) {
      var o = document.createElement('option');
      o.value = name; o.textContent = name;
      if (name === value) { o.selected = true; }
      s.appendChild(o);
    });
    return s;
  }

  /* ------------------------------------------------------- update details
     One button per row, one screen behind it, everything about the person on
     it. It replaces four separate ways in — typing into the row itself, a
     contact-details modal, a publish toggle and a department dropdown — which
     between them had drawn an arbitrary line: an address counted as "their
     details" and their name did not.

     Typing into the row is gone with them. Two ways to change the same field
     is worse than one even when both work, and this is the one that can show
     a job title and the address that goes with it at the same time. */
  function contactRow(kind, value, section, roles, ext) {
    var row = document.createElement('div');
    row.className = 'ed-crow';
    /* Every phone record carries an ext field. All 563 are empty today and
       there is no box to type one into, but rebuilding the list from the form
