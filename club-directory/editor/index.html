<!DOCTYPE html>
<!--
  NL Tools — redirect stub
  Version: v2.0 (11/11/2026)
  File: /club-directory/editor/index.html

  The Club Directory editor was here, entered with an editor code, until
  11/11/2026. Editing now happens behind the staff login at
  /club-directory/admin/edit/ (Manage on Club Directory), so this address
  forwards there and keeps any #club. The editor codes stop being needed;
  switching them off is a separate, later step.
  GitHub Pages cannot send a 301, so this is a meta refresh plus a script,
  with a real link for a browser that ignores both. No stylesheet, no script
  from /system/: a redirect that waits on an asset can fail to happen.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Club Directory — The National League</title>
  <meta http-equiv="refresh" content="0; url=/club-directory/admin/edit/">
  <link rel="canonical" href="https://nl.tools/club-directory/admin/edit/">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32x32.png">
  <script>location.replace('/club-directory/admin/edit/' + location.search + location.hash);</script>
</head>
<body>
  <p>Editing has moved to <a href="/club-directory/admin/edit/">nl.tools/club-directory/admin/edit/</a>. Sign in with your NL Tools account.</p>
</body>
</html>
