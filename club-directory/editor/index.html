<!DOCTYPE html>
<!--
  NL Tools — redirect stub
  Version: v2.1 (14/11/2026)
  File: /club-directory/editor/index.html

  The Club Directory editor was here, entered with an editor code, until
  11/11/2026. Editing now happens behind the staff login at
  /club-directory/ (Manage on Club Directory, the Edit button; the staff
  page was at /admin/ until 14/11/2026), so this address forwards there in editing (?edit) and keeps any #club. The editor codes stop being needed;
  switching them off is a separate, later step.
  GitHub Pages cannot send a 301, so this is a meta refresh plus a script,
  with a real link for a browser that ignores both. No stylesheet, no script
  from /system/: a redirect that waits on an asset can fail to happen.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Club Directory — The National League</title>
  <meta http-equiv="refresh" content="0; url=/club-directory/?edit">
  <link rel="canonical" href="https://nl.tools/club-directory/">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32x32.png">
  <script>location.replace('/club-directory/?edit' + location.hash);</script>
</head>
<body>
  <p>Editing has moved to <a href="/club-directory/?edit">nl.tools/club-directory/</a>. Sign in with your NL Tools account.</p>
</body>
</html>
