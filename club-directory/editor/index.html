  v1.26 — (06/08/2026) THE club-card bug, actually found. Every explanation
         before this was wrong.
         The undo patch keyed its edits and changes diff BY PATH — and a path
         is "info/stadium" or "people/p3k9/roles/0/title". RTDB refuses a key
         containing a slash and refuses it by THROWING, synchronously, inside
         logJournal, which runs before the record is written. logEdit had
         already fired. So: a green "edited by hand" marker, a record that
         never changed, no journal entry to undo from, and nothing on screen
         to say why. It affected every save that touched a marker, which is
         every save.
         The diff is a list carrying the path as a field now. A person with no
         id also fell back to "#" + index, and # is illegal in a key too.
         The harness stub did not validate keys, which is exactly how a diff
         keyed on "info/stadium" passed every test here while failing on every
         save in production. It validates now.
         And a save that fails is no longer a three-second toast. It is a
         sticky red banner naming the fault and saying the screen no longer
         matches the database — because "it didn't save" is not a report
         anybody can act on.
  v1.25 — (06/08/2026) An earlier attempt at the same bug.
         Editing a club-card field produced the green "edited by hand" line and
         saved nothing: card unchanged, record unchanged, nothing in My
         changes, no way back. People edits worked throughout.
         RTDB rejects an undefined value by THROWING, synchronously, not by
         rejecting a promise. logEdit built its entry from the `from` of any
         previous edit to the same field, and an entry whose `from` had been
         dropped on write made that undefined — so the second edit of a field
         threw, taking the record write, the journal entry and the modal close
         with it, having already set the marker in memory. Every value is
         coerced now, and the write reports a failure rather than swallowing
         it.

         rejections now surface as a message naming the fault and pointing at

         quietly wrong, which is the difference between a bug reported
         accurately and one reported as "something's broken".

  v1.20 — (06/08/2026) Frozen versions. Undo protects a change; this protects
         the project. A master can freeze the whole directory — every club,
         every person, and the provenance explaining how it got that way — and
         restore a club from it later.
         Two guarantees, both in the rules rather than here, because a safety
         net a page can decide to ignore is not one. Only a master may create
         one, so an editor cannot touch the thing that exists to survive an
         editor. And it is write-once: there is no parent write grant, only a
         per-edition rule requiring the key to be empty, so nobody — master
         included — can overwrite or delete one. You supersede an edition by
         taking another.
         Restoring is per club and loud about what it discards. Putting all 72
         back with one button is the footgun already removed from undo, and
         the realistic recovery is one club anyway. A restore goes through
         saveStructure, so it lands in the journal and can itself be undone.

  v1.0 — (04/08/2026) The directory, editable, behind per-person six-digit codes.

  What this is
  ------------
  Where the League's admin team keeps the directory right. Every edit writes
  straight to app-data/ops-club-directory/clubs and is attributable, because
  each editor holds their own code and therefore their own uid. A shared code
  would make the audit trail say nothing, and the audit trail is the reason
  this exists rather than people editing the database by hand.

  The margin markers
  ------------------
  Any field the bake changed carries a marker in the gutter. Click it and it
  says what the club actually sent, with one click to put it back. That is the
  difference between "we tidied your data" and "we changed something and you
  cannot see what" — and it is why _tidy.js threads a provenance log through
  every pass rather than just counting.

  The bake
  --------
  One-shot, master key only, and it refuses to run twice. It reads the raw
  submissions, runs the same tidier the sign-off pages promise clubs, and
  writes the result here with its provenance. After that the tidier never runs
  against this node again: re-running it would stomp on editor work.

  Not lint-covered: no auth-guard, by design.

    padding: 12px 13px 13px; position: relative;
  }
  .ed-role.is-here { border-color: var(--navy-300); background: var(--navy-50); }
  .ed-roledel { margin-top: 10px; }
  .ed-clist { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
  .ed-crow { display: flex; flex-direction: column; gap: 6px; }
  .ed-crow__top { display: flex; align-items: center; gap: 8px; }
  /* Laid out, not furled behind a menu. The whole reason the old control was
     never used once in 914 addresses is that it looked like a label. */
  .ed-cscope { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; padding-left: 2px; }
  .ed-cscope__l {
    font-size: var(--text-xs); text-transform: uppercase; letter-spacing: 0.07em;
    font-variation-settings: 'wght' 800; color: var(--text-muted); margin-right: 3px;
  }
  .ed-cscope .filter-pill { font-size: var(--text-xs); padding: 3px 9px; }
  /* On because "all" is on, rather than because it was picked. Reads as
     active without claiming to be a choice somebody made. */
  .ed-cscope .filter-pill.is-implied {
    background: var(--navy-100); color: var(--navy-600); border-color: var(--navy-100);
  }
  .ed-cval {
    flex: 1 1 auto; min-width: 0;
    font-family: var(--font); font-size: var(--text-sm);
    padding: 8px 11px; border: 1px solid var(--border);
    border-radius: var(--radius); background: var(--white); color: var(--text);
  }
  .ed-cval:focus { outline: none; box-shadow: var(--focus-ring); border-color: var(--primary); }
  .ed-crow .ed-del { flex: 0 0 auto; }
  /* The publish tick sits on the line it governs, not in a legend somewhere
     else — the question is "this address?", so it is asked next to it. */
  .ed-chide {
    display: inline-flex; align-items: center; gap: 6px; flex: 0 0 auto;
    font-size: var(--text-xs); color: var(--text-muted); white-space: nowrap;
    cursor: pointer;
  }
  .ed-chide__box { width: 14px; height: 14px; accent-color: var(--primary); }
  .ed-chide:has(.ed-chide__box:checked) {
    color: var(--primary); font-variation-settings: 'wght' 700;
  }
  @media (max-width: 620px) {
    .ed-crow { flex-wrap: wrap; }
    .ed-cval { flex: 1 1 100%; }
  }

  /* The reason is the useful half of a red flag, and it sat behind a hover
     with nothing to say it was there. */
  .ed-i {
    display: inline-flex; align-items: center; justify-content: center;
    width: 13px; height: 13px; margin-left: 5px; border-radius: 50%;
    background: var(--red); color: var(--white);
    font-size: var(--text-xs); font-weight: 800; font-variation-settings: 'wght' 800;
    font-style: italic; line-height: 1; flex: 0 0 auto;
  }

  .ed-add { margin: 6px 0 26px; }
  .ed-check label { display: flex; align-items: center; gap: 8px; font-weight: 600;
    font-variation-settings: 'wght' 600; }
  .ed-check input { width: auto; }

  /* Provenance sits in the margin, not in the row. A sentence under the field
     pushed every person apart and read as prose when all it needs to say is
     what the club sent. These are chips: two or three words, the original
     value, stacked in the order of the fields they refer to.

     Amber is a correction we made and can undo. Red is a gap the club left,
     which is not ours to undo and wants chasing instead. Both use the light
     tokens rather than solid fills — 21% of role entries have no job title
     and Chester alone has sixteen, so a saturated red would wall the page
     rather than flag anything. */
  .ed-pills { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
  .ed-pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 2px 9px; border-radius: var(--radius-pill);
    font-size: var(--text-xs); line-height: 1.5;
    font-weight: 700; font-variation-settings: 'wght' 700;
    max-width: 100%; overflow-wrap: anywhere;
  }
  .ed-pill--was  { background: var(--amber-light); color: var(--amber-deep); }
  .ed-pill--gap  { background: var(--red-light);   color: var(--red); }
  /* Green is the third state and the only one that is a person doing their
     job: the admin team typed over this. Amber is the tidier's automatic
     correction, red is a problem waiting for somebody. */
  .ed-pill--edit { background: var(--green-light); color: var(--green); }
  /* Red and green in one chip, for a flag somebody has since fixed. Two
     segments rather than two chips: "this was wrong" and "this was the
     resolution" are one fact, and showing them apart leaves the reader to pair
     them up by eye. The red stays full strength — the point is that you can
     still see what the problem was. */
  .ed-pill--fixed { padding: 0; gap: 0; align-items: stretch; overflow: hidden; }
  .ed-was, .ed-now { display: inline-flex; align-items: center; padding: 2px 9px; }
  .ed-was { background: var(--red-light); color: var(--red); }
  /* Solid green rather than green-light: the row this chip sits on has already
     gone green-light, because fixing the flag is itself a hand edit, and a
     green-light half on a green-light row is an invisible half. The word must
     not wrap either — the chips live in a narrow gutter column, and it broke
     as "Sorte / d". */
  .ed-now {
    background: var(--green); color: var(--white); white-space: nowrap; flex: 0 0 auto;
  }
  .ed-now::before { content: '\2192'; margin-right: 5px; opacity: 0.7; }
  .ed-pill button {
    padding: 0; border: 0; background: none; cursor: pointer; color: inherit;
    font: inherit; text-decoration: underline; opacity: 0.75;
    /* The chip wraps on the value, which can be long. The action must not:
       overflow-wrap:anywhere broke "undo" across two lines as "und / o". */
    white-space: nowrap; flex: 0 0 auto;
  }
  .ed-pill button:hover { opacity: 1; }

  /* Wide: a fifth column in the gutter, so the chips annotate the row from
     outside it. Editor-only — the reader has nothing to put there. */
  @media (min-width: 861px) {
    .cd-row {
      grid-template-columns:
        minmax(130px, 0.95fr) minmax(115px, 0.95fr) minmax(250px, 2.1fr)
        minmax(110px, 0.65fr) minmax(140px, 0.9fr);
    }
    .ed-pills { grid-column: 5; grid-row: 1; padding-left: 4px; }
  }
  /* Narrow: beneath the whole entry rather than beside any one field. */
  @media (max-width: 860px) {
    .ed-pills { grid-column: 1 / -1; flex-direction: row; flex-wrap: wrap;
      align-items: center; margin-top: 6px; }
  }

  /* Sign-off, foot of the club. The whole point of the tool is that somebody
     has actually looked at a club, so the state has to be visible before you
     reach the button and honest about who and when. */
  .ed-signoff {
    margin: 26px 0 0; padding: 16px 18px; border-radius: var(--radius);
    border: 1px solid var(--border); background: var(--white);
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  }
  .ed-signoff.is-done { border-color: var(--green); background: var(--green-light); }
  .ed-signoff__t { min-width: 0; flex: 1 1 260px; }
  .ed-signoff__t h3 {
    margin: 0 0 3px; font-size: var(--text-base);
    font-weight: 800; font-variation-settings: 'wght' 800; color: var(--navy);
  }
  .ed-signoff.is-done .ed-signoff__t h3 { color: var(--green); }
  .ed-signoff__t p { margin: 0; font-size: var(--text-sm); color: var(--text-muted);
    line-height: 1.5; max-width: 62ch; }

  /* A locked club still reads normally; it just cannot be changed. The pen
     becomes an eye rather than disappearing — fixtures/index.html has done
     this for a while and it is the better idea: the icon states what you can
     do before you press it, where a missing control only raises the question.
     The undo on a correction chip goes, since that is an edit too. */
  .is-locked .ed-pill button { display: none; }

  /* Merge note, foot of the club. Context rather than alarm, so it is quiet. */
  .ed-merges {
    margin: 26px 0 0; padding: 14px 16px; border: 1px solid var(--border);
    border-radius: var(--radius); background: var(--white);
  }
  /* Master-only strip under the banner. "Where is the club data" could not be
     answered from the outside, because an empty facts grid renders as a rule
     and a gap rather than as nothing. This says what the record actually
     holds, so a missing field is visible instead of inferred. */
  .ed-diag {
    margin: 0 0 18px; padding: 8px 12px; border-radius: var(--radius-sm);
    background: var(--navy-50); color: var(--text-muted);
    font-size: var(--text-xs); line-height: 1.5;
  }
  .ed-diag b { color: var(--navy); font-weight: 800; font-variation-settings: 'wght' 800; }
  .ed-diag .bad { color: var(--red); font-weight: 800; font-variation-settings: 'wght' 800; }
  .ed-merges h3 {
    margin: 0 0 6px; font-size: var(--text-xs); text-transform: uppercase;
    letter-spacing: var(--tracking-wide);
    font-weight: 800; font-variation-settings: 'wght' 800; color: var(--text-muted);
  }
  .ed-merges p { margin: 0 0 8px; font-size: var(--text-sm); color: var(--text-muted);
    line-height: 1.55; max-width: 70ch; }
  .ed-merges ul { margin: 0; padding-left: 18px; font-size: var(--text-sm); line-height: 1.6; }

  .ed-bake { margin: 40px 0 0; padding: 18px; border: 1px solid var(--amber);
    border-radius: var(--radius); background: var(--amber-light); }
  .ed-bake p { margin: 0 0 10px; font-size: var(--text-sm); line-height: 1.55; max-width: 70ch; }
</style>
</head>
<body>

<div id="gateWrap"></div>

<div id="app" hidden>
  <div class="nl-idbar">
    <div class="nl-idbar__id">
      <div class="nl-idbar__title">Directory Editor</div>
      <div class="nl-idbar__sub" id="who"></div>
    </div>
    <div class="nl-idbar__actions">
      <select class="ed-pick" id="pick" aria-label="Choose a club"></select>
      <button class="nl-idbar__btn" id="editions" type="button" hidden>Versions</button>
      <button class="nl-idbar__btn ed-out--go" id="publish" type="button" hidden>Publish</button>
      <button class="nl-idbar__btn" id="changes" type="button">My changes</button>
      <button class="nl-idbar__btn" id="recheck" type="button" hidden>Re-check all</button>
      <button class="nl-idbar__btn" id="addOrg" type="button" hidden>Add organisation</button>
      <button class="nl-idbar__btn" id="signOut" type="button">Sign out</button>
    </div>
  </div>
  <div class="cd-wrap">
    <div class="cd-search"><div class="cd-search__box">
      <svg class="cd-search__icon" width="17" height="17" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
      <input class="cd-search__in" id="q" placeholder="Search clubs, people and job titles"
        aria-label="Search">
    </div></div>
    <div id="out"></div>
    <div id="extra"></div>
  </div>
</div>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var esc = NL.escHtml;
  var ROOT = NLGate.ROOT;
  var ALL = {}, PROV = {}, names = [], session = null, current = '';

  /* Remembered per person, not per club — otherwise it is chosen again on
     every one of 72. The list stays the default here: an editor's job is
     reading down a column of addresses looking for the wrong one, and a
     column is what a list is for. */
  var VIEW = 'list';
  try { VIEW = localStorage.getItem('nlcd-view') || 'list'; } catch (e) {}

  function viewOpts(extra) {
    var o = { showHidden: true, showGaps: true,
              cards: VIEW === 'cards', viewSwitch: true };
    for (var k in (extra || {})) { o[k] = extra[k]; }
    return o;
  }

  /* Drawn by renderClub above the people it applies to, and rebuilt on every
     draw — so this listens on the container rather than on buttons that do
     not exist yet. Search results build their own list without renderClub, so
     they get their own switcher below. */
  function wireView() {
    var host = $('out');
    if (!host) { return; }
    host.addEventListener('click', function (e) {
      var b = e.target.closest('[data-view-switch] button');
      if (!b) { return; }
      VIEW = b.dataset.v;
      try { localStorage.setItem('nlcd-view', VIEW); } catch (e2) {}
      var q = $('q').value;
      if (q.trim()) { onSearch({ target: { value: q } }); }
      else if (current) { draw(current); }
    });
  }
  var PUBLISHED_AT = 0;

  /* Nothing in a browser tells you a click handler died. Today an exception
     inside the club-details save took everything after it with it — the
     record write, the journal entry, the modal closing — and the only sign
     was a marker for a change that had not happened. The tool looked like it
     had a data bug for several hours because a fault had no way of reaching
     the person in front of it.

     So every uncaught error and every unhandled rejection says so. It cannot
     make the tool correct, but it can stop it being quietly wrong, which is
     the difference between a bug that gets reported accurately and one that
     gets reported as "something's broken". */
  window.addEventListener('error', function (e) {
    reportFault(e && e.error && e.error.message ? e.error.message : (e && e.message));
  });
  window.addEventListener('unhandledrejection', function (e) {
    var r = e && e.reason;
    reportFault(r && r.message ? r.message : String(r));
  });

  var lastFault = 0;
  function reportFault(msg) {
    if (!msg) { return; }
    var now = Date.now();
    if (now - lastFault < 4000) { return; }   /* one message, not a cascade */
    lastFault = now;
    try {
      NL.toast('Something went wrong and your last action may not have saved: ' +
        msg + ' \u2014 check "My changes" before carrying on.', 'error');
    } catch (x) { /* the reporter must never be the thing that fails */ }
  }

  NLGate.ensure({
    title: 'Directory Editor',
    /* An editor code IS six digits — functions/club-directory.js normalises
       to digits only, so nothing else can ever match — and this said the
       opposite until 26/08/2026. Left as "editor code" rather than
       "six-digit" all the same: the shape is not what someone needs told,
       and a card that names the credential is a card that reads the same
       whether or not the shape changes. What the wording must not do is
       claim a shape the lock does not accept, in either direction. */
    sub: 'Enter your editor code.',
    mount: $('gateWrap')
  }).then(function (s) {
    session = s;
    if (s.role !== 'editor' && s.role !== 'admin') {
      throw new Error('That code opens the reader, not the editor.');
    }
    $('gateWrap').hidden = true;
    $('who').textContent = (s.name || '') + (s.role === 'admin' ? ' (master)' : '');
    $('signOut').addEventListener('click', function () {
      NLGate.signOut().then(function () { location.reload(); });
    });
    return Promise.all([
      NL.clubs.load(),
      firebase.database().ref(ROOT + '/clubs').once('value'),
      firebase.database().ref(ROOT + '/provenance').once('value'),
      /* Only the stamp, not the payload — the editor never needs the published
         copy, it needs to know when it was last made. */
      firebase.database().ref(ROOT + '/published/at').once('value')
    ]);
  }).then(function (res) {
    ALL = res[1].val() || {};
    PROV = res[2].val() || {};
    PUBLISHED_AT = res[3].val() || 0;
    names = Object.keys(ALL).sort();
    NL.installAuditHook();
    if (!names.length) { offerBake(); $('app').hidden = false; return; }
    offerRecheck();
    $('changes').addEventListener('click', showChanges);
    /* Master only. It writes an edition, and the rules make an edition
       writable by a master alone — an editor pressing this would be refused by
       the database, which is a worse way to find out than not seeing the
       button. It is the right rule on its own terms too: the reader is 72
       clubs, and releasing to them is a decision rather than a step. */
    if (session.role === 'admin') {
      $('publish').hidden = false;
      $('publish').addEventListener('click', publishNow);
      /* Master too, though the rules would let an editor: creating a record
         puts a new page on every surface, and that is a release decision
         like Publish, not a routine edit. */
      $('addOrg').hidden = false;
      $('addOrg').addEventListener('click', addOrganisation);
    }
    wireView();
    fillPicker();
    $('pick').addEventListener('change', function () { draw(this.value); });
    $('q').addEventListener('input', onSearch);
    $('app').hidden = false;
    /* A club per URL, same as the reader and the staff view. Without it an
       editor cannot send "look at this one" to a colleague, cannot reopen
       where they left off, and loses their place on every refresh — which on
       a 72-club job is the difference between a tool and a chore. */
    var first = fromHash() || names[0];
    $('pick').value = first;
    draw(first);
    window.addEventListener('hashchange', function () {
      var n = fromHash();
      if (n && n !== current) { $('pick').value = n; draw(n); }
    });
  }).catch(function (err) {
    $('out').innerHTML = '<p class="cd-empty">' + esc((err && err.message) || String(err)) + '</p>';
    $('app').hidden = false;
  });

  /* --------------------------------------------------------- the re-check
     The bake is one-shot by design: re-running it would overwrite whatever
     the editors have since put right. That is correct, and it also means a
     fix to the tidier can never reach a directory that has already been
     built — which is exactly what happened when _tidy.js v1.1 turned out to
     have been missing "Director Of Football" all along.

     So there is a second, much smaller door. It runs only the two passes
     that are safe to run against edited data:

       · minorCase, which lowercases interior minor words in a job title.
         Idempotent, and it cannot touch anything but the case of and/of/for.
       · flagAttention, which writes no data at all — it only reports.

     It does NOT re-run the typo list, the compound split, the merge or the
     full recase. Those make judgements about what the club originally sent,
     and against a record an editor has since corrected they would be
     judgements about the editor's work instead.

     Master key only, and it says what it did rather than reloading silently. */
  function offerRecheck() {
    if (session.role !== 'admin') { return; }
    $('recheck').hidden = false;
    $('recheck').addEventListener('click', runRecheck);
    /* Master only, and enforced in the rules as well as here — an editor must
       not be able to touch the thing that exists to survive an editor. */
    $('editions').hidden = false;
    $('editions').addEventListener('click', showEditions);
  }

  function runRecheck() {
    NL.confirm(
      'Re-check every club for minor-word capitalisation ("Director Of Football"), ' +
      'and re-scan for anything that needs an editor to look at it — a mailbox that ' +
      'does not match the name, a phone number the wrong length, one job title used ' +
      'in two departments.\n\n' +
      'Nothing else is touched. Corrections editors have already made stay exactly ' +
      'as they are.',
      { title: 'Re-check all clubs', confirmText: 'Re-check' }
    ).then(function (ok) {
      if (!ok) { return; }
      var btn = $('recheck');
      btn.disabled = true; btn.textContent = 'Checking…';
      var db = firebase.database(), updates = {};
      var cased = 0, infoFixed = 0, flagged = 0, clubs = 0;
      Object.keys(ALL).forEach(function (club) {
        var rec = ALL[club], touched = false;
        var extra = [];
        NLTidy.arr(rec.people).forEach(function (p, pi) {
          NLTidy.arr(p.roles).forEach(function (r, ri) {
            var t = (r.title || '').trim();
            if (!t) { return; }
            var out = NLTidy.minorCase(t);
            if (out === t) { return; }
            r.title = out; touched = true; cased++;
            extra.push({ path: 'people/' + (p.id || ('i' + pi)) + '/roles/' + ri + '/title',
                         from: t, to: out, kind: 'case' });
          });
        });
        /* Idempotent, and verified so across all 72: a second pass makes no
           further info changes. Safe to run against edited data. */
        var infoLog = [];
        var hits = NLTidy.tidyInfo(rec, function (path, from, to, kind) {
          infoLog.push({ path: path, from: from, to: to, kind: kind });
        });
        if (hits) { touched = true; infoFixed += hits; extra = extra.concat(infoLog); }
        var att = NLTidy.flagAttention(rec);
        flagged += att.length;
        var prov = PROV[club] || {};
        var changes = NLTidy.arr(prov.changes).concat(extra);
        if (touched) { updates['clubs/' + club] = rec; clubs++; }
        updates['provenance/' + club] = { changes: changes,
          merges: NLTidy.arr(prov.merges), attention: att,
          edits: NLTidy.arr(prov.edits),
          /* An update() at this path replaces the whole child, so anything
             not named here is deleted. The journal is not the re-check's to
             throw away — it is the only record of who did what. */
          journal: prov.journal || null };
        PROV[club] = updates['provenance/' + club];
      });
      NL.writeAudit('directory_recheck',
        cased + ' title(s) recased and ' + infoFixed + ' club detail(s) corrected across ' +
        clubs + ' club(s), ' + flagged + ' flagged for attention (' +
        (session.name || 'master') + ')');
      db.ref(ROOT).update(updates).then(function () {
        NL.toast(cased + ' job title(s) and ' + infoFixed + ' club detail(s) corrected, ' +
          flagged + ' flagged for attention', 'success');
        btn.disabled = false; btn.textContent = 'Re-check all';
        if (current) { draw(current); }
      }).catch(function (err) {
        NL.toast('Could not save: ' + ((err && err.message) || err), 'error');
        btn.disabled = false; btn.textContent = 'Re-check all';
      });
    });
  }

  /* ------------------------------------------------------------ the bake
     Only offered when the node is empty, only to the master key, and it
     re-checks emptiness at the moment of writing rather than trusting what
     the page loaded — two people pressing it at once should not both win. */
  function offerBake() {
    if (session.role !== 'admin') {
      $('out').innerHTML = '<p class="cd-empty">The directory has not been built yet.</p>';
      return;
    }
    $('out').innerHTML =
      '<div class="ed-bake">' +
      '<p><b>The directory is empty.</b> Building it reads every club’s submission, ' +
      'applies the same tidying the sign-off pages promised them — capitalisation, ' +
      'job-title typos, splitting a title that names two jobs, merging anyone entered ' +
      'twice — and writes the result here with a record of every change.</p>' +
      '<p>This runs once. Afterwards the tidier never touches this data again, because ' +
      're-running it would overwrite whatever the editors have since put right.</p>' +
      '<button class="btn btn--primary" id="bakeBtn">Build the directory</button>' +
      '</div>';
    $('bakeBtn').addEventListener('click', runBake);
  }

  function runBake() {
    var btn = $('bakeBtn');
    btn.disabled = true;
    btn.textContent = 'Building…';
    var db = firebase.database();
    db.ref(ROOT + '/clubs').once('value').then(function (snap) {
      if (snap.val()) { throw new Error('The directory already has data. Not overwriting it.'); }
      return db.ref('app-data/ops-club-contacts/submissions').once('value');
    }).then(function (snap) {
      var subs = snap.val() || {};
      var clubs = {}, prov = {}, changed = 0, flagged = 0;
      Object.keys(subs).forEach(function (token) {
        var rec = subs[token];
        if (!rec || !rec.club) { return; }
        var out = NLTidy.run(rec);
        out.rec.club = rec.club;
        clubs[rec.club] = out.rec;
        prov[rec.club] = { changes: out.changes, merges: out.merges,
                           attention: out.attention };
        changed += out.changes.length;
        flagged += (out.attention || []).length;
      });
      if (!Object.keys(clubs).length) { throw new Error('No submissions found to build from.'); }
      NL.writeAudit('directory_bake',
        'Built the directory from ' + Object.keys(clubs).length + ' submissions, ' +
        changed + ' changes recorded, ' + flagged + ' flagged for attention');
      return db.ref(ROOT).update({
        clubs: clubs,
        provenance: prov,
        bake: { at: firebase.database.ServerValue.TIMESTAMP,
                by: session.name || '', clubs: Object.keys(clubs).length,
                changes: changed, attention: flagged }
      });
    }).then(function () {
      NL.toast('Directory built. Reloading…', 'success');
      setTimeout(function () { location.reload(); }, 900);
    }).catch(function (err) {
      NL.toast((err && err.message) || String(err), 'error');
      btn.disabled = false;
      btn.textContent = 'Build the directory';
    });
  }

  /* ------------------------------------------------------------ render */
  /* Which clubs are done, in the list you pick from. Working through 72 of
     them, the question "have I already been through this one" comes up before
     the club is even open — and the answer was two clicks away on the club
     itself.

     Rebuilt rather than patched, and called again after every sign-off and
     reopen: a label that is right at boot and stale by the third club is
     worse than no label. The selection is put back afterwards because
     replacing the options clears it. */
  function fillPicker() {
    var was = $('pick').value;
    /* Orgs above the clubs; `names` itself stays alphabetical because
       fromHash and the search grouping walk it. */
    var order = NLDirectory.orgFirst(names, function (n) { return ALL[n]; });
    $('pick').innerHTML = order.map(function (n) {
      var done = signedOffBy(ALL[n]);
      return '<option value="' + esc(n) + '">' + esc(n) +
        (done ? ' \u2014 COMPLETE' : '') + '</option>';
    }).join('');
    if (was) { $('pick').value = was; }
  }

  function fromHash() {
    var h = decodeURIComponent((location.hash || '').replace(/^#/, ''));
    return names.indexOf(h) > -1 ? h : '';
  }

  function draw(name) {
    current = name;
    var rec = ALL[name];
    if (!rec) { return; }
    rec.club = rec.club || name;
    /* The baseline the next act will be journalled against. Taken here rather
       than threaded through each mutation because every path into a change
       starts from a drawn club and ends in a save that redraws it, so "the
       state at the last draw" and "the state before this act" are the same
       thing — and this way a mutation added later gets its undo for free. */
    BEFORE[name] = snapshot(name);
    if (location.hash !== '#' + encodeURIComponent(name)) {
      history.replaceState(null, '', '#' + encodeURIComponent(name));
    }
    $('out').innerHTML = NLDirectory.renderClub(rec, viewOpts());
    var crest = document.getElementById('cdCrest');
    if (crest) {
      var ck = NLDirectory.bannerCrestOf(rec);
      crest.alt = name + ' crest'; crest.hidden = false;
      NL.clubs.wireCrestImg(crest, ck, true);
      crest.src = NL.clubs.crestUrl(ck, 'medium');
    }
    wireEditing(name);
    wireReorder(name, rec);
    markProvenance(name);
    markAttention(name);
    markInfoMissing(name, rec);
    markInfoFlags(name, rec);
    markInfoChanges(name, rec);
    markAdded(name);
    markGaps(name, rec);
    showClubEdit(name, rec);
    showAdd(name, rec);
    showMerges(name);
    showInboxes(name, rec);
    showLists(name, rec);
    /* After showLists, which builds the element the mailing-list marks mount
       into. Markers can only annotate what has already been drawn. */
    markEdits(name);
    showSignoff(name, rec);
    if (session.role === 'admin') { diagnose(name, rec); }
  }

  /* What this record actually contains. Master only — it is a maintenance
     readout, not something an editor needs. */
  function diagnose(name, rec) {
    var people = NLDirectory.arr(rec.people);
    var info = rec.info || {};
    var infoFilled = Object.keys(info).filter(function (k) {
      return String(info[k] == null ? '' : info[k]).trim() !== '';
    }).length;
    var withEmail = people.filter(function (p) { return NLDirectory.arr(p.emails).length; }).length;
    var withPhone = people.filter(function (p) { return NLDirectory.arr(p.phones).length; }).length;
    var prov = (PROV[name] || {});
    var n = function (v, label) {
      return '<b class="' + (v ? '' : 'bad') + '">' + v + '</b> ' + label;
    };
    var el = document.createElement('div');
    el.className = 'ed-diag';
    el.innerHTML = 'This record holds ' + n(people.length, 'people') + ', ' +
      n(infoFilled, 'club detail fields') + ', ' + n(withEmail, 'with an email') +
      ', ' + n(withPhone, 'with a phone') + ', ' +
      n(NLDirectory.arr(prov.changes).length, 'recorded changes') + ', ' +
      n(NLDirectory.arr(prov.merges).length, 'merges') + ', ' +
      n(NLDirectory.arr(prov.attention).length, 'flagged for attention') + '.';
    var banner = $('out').querySelector('.cd-facts') || $('out').querySelector('.cd-banner');
    if (banner) { banner.parentNode.insertBefore(el, banner.nextSibling); }
  }

  /* Rows render from the shared module, so editability is attached afterwards
     rather than forking the presentation for one of the three doors. */
  function wireEditing(club) {
    var rec = ALL[club];
    var locked = !!signedOffBy(rec);
    var people = NLDirectory.arr(rec.people);
    var byId = {};
    people.forEach(function (p) { if (p.id) { byId[p.id] = p; } });

    /* Cards and rows both carry the person's id, so there is no counting to
       do. There used to be — the row's person was worked out from its
       position within its department — and it held only while the render
       order matched the array order. A surname sort in sectionPeople broke
       that without a word: pens opened the wrong person's form and every
       marker landed on the wrong row. Nothing is inferred from position now. */
    $('out').querySelectorAll('.cd-pc[data-pid]').forEach(function (card) {
      var person = byId[card.dataset.pid];
      if (person) { addPen(card, locked, club, person, 0); }
    });

    $('out').querySelectorAll('.cd-row[data-pid]').forEach(function (row) {
      var person = byId[row.dataset.pid];
      if (!person) { return; }
      var ridx = row.dataset.ridx;
      addPen(row, locked, club, person, ridx == null ? 0 : +ridx);
    });

  }

  /* ------------------------------------------- inboxes and mailing lists
     Two things every club sent us that nothing has ever put on screen.

     INBOXES are the club's shared mailboxes — club secretary, commercial,
     ticketing, safeguarding — with a phone and extension. 34 clubs sent them.

     MAILING LISTS are the League's own eleven questions: who is your
     secretary, your media contact, your safety officer, your SLO. All 72
     answered, naming actual people. This is the answer to "who do I write to
     at Chester about X", straight from the club, and it has been sitting in
     the database unread since the build.

     Nobody can correct what they cannot see, so until now none of it could be
     checked. A list with nobody on it is flagged rather than left blank: an
     unassigned mailing list is a message that goes nowhere. */
  /* The taxonomy itself lives in _directory.js as of v1.3 — the staff
     overview builds exports from the same eleven lists, and two copies is
     one too many the day a list is added. */
  var LIST_LABEL = NLDirectory.LIST_LABEL;
  var LIST_ORDER = NLDirectory.LIST_ORDER;
  var listMembers = NLDirectory.listMembers;

  /* Rendered whether or not the club sent any. The first cut returned early
     on an empty set, so at the 38 clubs that sent none the block did not
     exist \u2014 and with no block there was no way in, which is how a whole
     field ended up read-only by accident. An empty state that says so is
     the only version of this that can be added to. */
  function showInboxes(club, rec) {
    var boxes = rec.inboxes || {};
    var keys = Object.keys(boxes).filter(function (k) {
      var b = boxes[k] || {};
      return (b.email || '').trim() || (b.phone || '').trim();
    });
    var wrap = document.createElement('div');
    wrap.className = 'ed-block';
    var head = document.createElement('div');
    head.className = 'section-head';
    head.innerHTML = '<h2 class="ed-block__h">Shared mailboxes</h2>';
    wrap.appendChild(head);
    var hint = document.createElement('p');
    hint.className = 'form-hint';
    hint.textContent = 'Department addresses the club gave us, as opposed to ' +
      'a person\u2019s own.';
    wrap.appendChild(hint);

    if (!keys.length) {
      var none = document.createElement('p');
      none.className = 'cd-empty';
      none.textContent = 'None held for ' + club + '.';
      wrap.appendChild(none);
    }
    var ul = document.createElement('ul');
    ul.className = 'cd-cards';
    keys.sort().forEach(function (k) {
      var b = boxes[k] || {};
      var li = document.createElement('li');
      li.className = 'cd-pc';
      li.innerHTML = '<div class="cd-pc__top"><div class="cd-pc__id">' +
        '<div class="cd-pc__name">' + esc(b.dept || k) + '</div></div></div>' +
        '<div class="cd-pc__lines">' +
        ((b.email || '').trim()
          ? '<a class="cd-pc__line" href="mailto:' + esc(b.email) + '">' +
            '<span class="cd-pc__ic">' + NLDirectory.glyph('email') + '</span>' +
            esc(b.email) + '</a>' : '') +
        ((b.phone || '').trim()
          ? '<a class="cd-pc__line" href="tel:' + esc(b.phone) + '">' +
            '<span class="cd-pc__ic">' + NLDirectory.glyph('phone') + '</span>' +
            esc(b.phone) +
            ((b.ext || '').trim()
              ? ' <span class="cd-row__ext">ext ' + esc(b.ext) + '</span>' : '') +
            '</a>' : '') +
        '</div>';
      ul.appendChild(li);
    });
    wrap.appendChild(ul);
    var marks = document.createElement('div');
    marks.id = 'edBoxEdits';
    wrap.appendChild(marks);
    if (!signedOffBy(rec)) {
      var btn = document.createElement('button');
      btn.className = 'btn btn--sm btn--ghost';
      btn.type = 'button';
      btn.textContent = keys.length ? 'Edit shared mailboxes' : 'Add a shared mailbox';
      btn.addEventListener('click', function () { editInboxes(club, rec); });
      head.appendChild(btn);
    }
    $('extra').appendChild(wrap);
  }

  /* A club's departmental addresses — commercial@, tickets@ — which are
     frequently the address the club would rather you used. 34 of the 72 sent
     them and nothing could touch them afterwards.

     The department is picked from the League's own list rather than typed,
     because these get matched onto mailing lists by their label on the staff
     overview, and a free-typed "Comms" matches nothing. Anything genuinely
     outside the list goes under Other with a name of its own — which is what
     the clubs did themselves: Careers, Retail, Club Office. */
  function editInboxes(club, rec) {
    var boxes = rec.inboxes || {};
    var DEPTS = NLDirectory.isOrg(rec) ? NLDirectory.ORG_ORDER : NLDirectory.ORDER;
    var rows = Object.keys(boxes).sort().map(function (k) {
      var b = boxes[k] || {};
      return { key: k, dept: b.dept || k, email: b.email || '',
               phone: b.phone || '', ext: b.ext || '', gone: false };
    });

    var wrap = document.createElement('div');
    var paint = function () {
      wrap.innerHTML = '';
      var live = rows.filter(function (r) { return !r.gone; });
      if (!live.length) {
        var p0 = document.createElement('p');
        p0.className = 'form-hint';
        p0.textContent = 'None yet. Add one below.';
        wrap.appendChild(p0);
      }
      live.forEach(function (r) {
        var card = document.createElement('div');
        card.className = 'ed-role';
        var grid = document.createElement('div');
        grid.className = 'form-grid';

        var dept = document.createElement('select');
        dept.className = 'ed-dept';
        dept.innerHTML = DEPTS.map(function (sec) {
          return '<option value="' + esc(sec) + '"' +
            (sec === r.dept ? ' selected' : '') + '>' + esc(sec) + '</option>';
        }).join('') +
          '<option value="__other"' +
          (DEPTS.indexOf(r.dept) < 0 ? ' selected' : '') +
          '>Something else…</option>';

        var other = document.createElement('input');
        other.className = 'ed-cval';
        other.value = DEPTS.indexOf(r.dept) < 0 ? r.dept : '';
        other.placeholder = 'e.g. Retail';
        other.hidden = dept.value !== '__other';
        dept.addEventListener('change', function () {
          other.hidden = dept.value !== '__other';
          r.dept = dept.value === '__other' ? other.value.trim() : dept.value;
          if (dept.value === '__other') { other.focus(); }
        });
        other.addEventListener('input', function () { r.dept = other.value.trim(); });

        var deptWrap = document.createElement('div');
        deptWrap.appendChild(dept);
        deptWrap.appendChild(other);

        var em = document.createElement('input');
        em.className = 'ed-cval'; em.type = 'email'; em.value = r.email;
        em.placeholder = 'e.g. tickets@example.co.uk';
        em.addEventListener('input', function () { r.email = em.value.trim(); });

        var ph = document.createElement('input');
        ph.className = 'ed-cval'; ph.value = r.phone;
        ph.placeholder = 'e.g. 01234 567890';
        ph.addEventListener('input', function () { r.phone = ph.value.trim(); });

        var ex = document.createElement('input');
        ex.className = 'ed-cval'; ex.value = r.ext;
        ex.placeholder = 'e.g. 204';
        ex.addEventListener('input', function () { r.ext = ex.value.trim(); });

        grid.appendChild(formField('Department', deptWrap));
        grid.appendChild(formField('Email', em));
        grid.appendChild(formField('Phone', ph));
        grid.appendChild(formField('Extension', ex));
        card.appendChild(grid);

        var drop = document.createElement('button');
        drop.className = 'btn btn--sm btn--ghost ed-del';
        drop.type = 'button';
        drop.textContent = 'Remove this mailbox';
        drop.addEventListener('click', function () { r.gone = true; paint(); });
        card.appendChild(drop);
        wrap.appendChild(card);
      });

      var add = document.createElement('button');
      add.className = 'btn btn--sm btn--ghost';
      add.type = 'button';
      add.textContent = 'Add a shared mailbox';
      add.addEventListener('click', function () {
        rows.push({ key: '', dept: DEPTS[0], email: '', phone: '',
                    ext: '', gone: false });
        paint();
      });
      wrap.appendChild(add);
    };
    paint();

    NL.modal({
      title: club + ' — shared mailboxes',
      width: 'wide',
      body: wrap,
      buttons: [
        { label: 'Cancel', className: 'btn--ghost', onClick: function (c) { c.close(); } },
        { label: 'Save mailboxes', className: 'btn--primary', onClick: function (c) {
          var next = {}, used = {};
          rows.filter(function (r) { return !r.gone; }).forEach(function (r) {
            if (!r.dept || (!r.email && !r.phone)) { return; }
            /* A key already in the record keeps it, so an edit stays an edit
               rather than becoming a delete and an add. A new one is slugged
               from the department, and RTDB refuses . # $ / [ ] in a key —
               "Media & marketing" has to become media-marketing or the save
               throws synchronously and nothing is written. */
            var key = r.key || slugKey(r.dept, used);
            used[key] = true;
            next[key] = { dept: r.dept };
            if (r.email) { next[key].email = r.email; }
            if (r.phone) { next[key].phone = r.phone; }
            if (r.ext) { next[key].ext = r.ext; }
          });

          var was = rec.inboxes || {};
          var touched = [];
          keysOf(was, next).forEach(function (k) {
            if (JSON.stringify(was[k] || null) === JSON.stringify(next[k] || null)) { return; }
            var label = function (b) {
              if (!b) { return ''; }
              return [b.email, b.phone].filter(Boolean).join(', ');
            };
            touched.push((next[k] || was[k] || {}).dept || k);
            logEdit(club, 'inboxes/' + k, label(was[k]), label(next[k]));
          });
          if (!touched.length) { c.close(); return; }

          (ALL[club] || rec).inboxes = next;
          c.close();
          saveStructure(club, 'Shared mailboxes updated (' + touched.join(', ') + ')');
        } }
      ]
    });
  }

  /* RTDB refuses . # $ / [ ] in a key and throws synchronously when handed
     one, so this is not cosmetic. `used` keeps two mailboxes named the same
     thing from becoming one. */
  /* One labelled form control. Was a closure inside the person modal until
     the mailbox editor wanted the same thing — second use, so it moves out
     rather than being written twice. */
  function formField(label, node) {
    var g = document.createElement('div');
    g.className = 'form-group';
    var l = document.createElement('label');
    l.textContent = label;
    g.appendChild(l); g.appendChild(node);
    return g;
  }

  function slugKey(dept, used) {
    var base = String(dept || 'other').toLowerCase()
      .replace(/&/g, ' and ').replace(/[^a-z0-9]+/g, '-')
      .replace(/^-+|-+$/g, '') || 'other';
    var key = base, n = 2;
    while (used[key]) { key = base + '-' + (n++); }
    return key;
  }

  function showLists(club, rec) {
    /* Club-role lists — who is your secretary, your SLO. An organisation has
       no answer to any of the eleven, and drawing the block would announce
       "mail reaches nobody" eleven times over. */
    if (NLDirectory.isOrg(rec)) { return; }
    var wrap = document.createElement('div');
    wrap.className = 'ed-block';
    var head = document.createElement('div');
    head.className = 'section-head';
    head.innerHTML = '<h2 class="ed-block__h">Mailing lists</h2>';
    wrap.appendChild(head);
    var hint = document.createElement('p');
    hint.className = 'form-hint';
    hint.textContent = 'Who receives League mail on each subject. Everyone here ' +
      'is somebody already listed above — add the person first, then put them ' +
      'on the list.';
    wrap.appendChild(hint);

    var ul = document.createElement('ul');
    ul.className = 'ed-lists';
    var empty = 0;
    LIST_ORDER.forEach(function (key) {
      var who = listMembers(rec, key);
      if (!who.length) { empty++; }
      var li = document.createElement('li');
      li.className = 'ed-list' + (who.length ? '' : ' is-empty');
      li.innerHTML = '<span class="ed-list__k">' + esc(LIST_LABEL[key] || key) + '</span>' +
        /* Plain text, not a pill. A pill carries 9px of padding, which put
           "Nobody assigned" out of line with every name above it — in a
           two-column list the left edge is what the eye follows. */
        '<span class="ed-list__v' + (who.length ? '' : ' is-none') + '">' + (who.length
          ? who.map(function (p) { return esc(NLDirectory.fullName(p)); }).join(', ')
          : 'Nobody assigned') + '</span>';
      ul.appendChild(li);
    });
    wrap.appendChild(ul);
    var marks = document.createElement('div');
    marks.id = 'edListEdits';
    wrap.appendChild(marks);
    if (empty) {
      var n = document.createElement('p');
      n.className = 'form-hint';
      n.innerHTML = '<b>' + empty + ' list' + (empty === 1 ? ' has' : 's have') +
        ' nobody on ' + (empty === 1 ? 'it' : 'them') + '.</b> Mail on ' +
        (empty === 1 ? 'that subject' : 'those subjects') + ' reaches nobody at ' +
        esc(club) + '.';
      wrap.appendChild(n);
    }
    if (!signedOffBy(rec)) {
      var b = document.createElement('button');
      b.className = 'btn btn--sm btn--ghost';
      b.type = 'button';
      b.textContent = 'Change who is on these lists\u2026';
      b.addEventListener('click', function () { editLists(club, rec); });
      wrap.appendChild(b);
    }
    $('extra').appendChild(wrap);
  }

  /* Eleven lists times fourteen people was a hundred and fifty tick boxes to
     answer a question that is usually "one person, and it is that one". So
     the form shows what each list HAS and lets you take somebody off or put
     somebody on — the same shape as the page it edits, banner and all, rather
     than a wall of names repeated eleven times. */
  function editLists(club, rec) {
    var people = NLDirectory.arr(rec.people).filter(function (p) { return p.id; })
      .slice().sort(NLDirectory.bySurname);
    var byId = {};
    people.forEach(function (p) { byId[p.id] = p; });

    var state = {};
    LIST_ORDER.forEach(function (k) {
      state[k] = NLDirectory.arr((rec.leads || {})[k]).filter(function (id) {
        return byId[id];
      });
    });

    var wrap = document.createElement('div');
    var paint = function () {
      wrap.innerHTML = '';
      LIST_ORDER.forEach(function (key) {
        var box = document.createElement('div');
        box.className = 'ed-lg';
        var on = state[key];
        box.innerHTML = '<h4 class="cd-dept__h">' + esc(LIST_LABEL[key] || key) + '</h4>';
        var body = document.createElement('div');
        body.className = 'ed-lg__b';
        if (!on.length) {
          body.innerHTML = '<p class="ed-lg__none">Nobody assigned \u2014 ' +
            'mail on this reaches nobody.</p>';
        } else {
          on.forEach(function (id) {
            var chip = document.createElement('span');
            chip.className = 'ed-lg__who';
            chip.innerHTML = esc(NLDirectory.fullName(byId[id]));
            var x = document.createElement('button');
            x.type = 'button';
            x.className = 'ed-lg__x';
            x.setAttribute('aria-label', 'Take ' + NLDirectory.fullName(byId[id]) +
              ' off ' + (LIST_LABEL[key] || key));
            x.textContent = '\u00d7';
            x.addEventListener('click', function () {
              state[key] = state[key].filter(function (v) { return v !== id; });
              paint();
            });
            chip.appendChild(x);
            body.appendChild(chip);
          });
        }
        var left = people.filter(function (p) { return on.indexOf(p.id) < 0; });
        if (left.length) {
          var sel = document.createElement('select');
          sel.className = 'ed-lg__add';
          sel.innerHTML = '<option value="">Add someone\u2026</option>' +
            left.map(function (p) {
              return '<option value="' + esc(p.id) + '">' +
                esc(NLDirectory.fullName(p)) + '</option>';
            }).join('');
          sel.addEventListener('change', function () {
            if (!sel.value) { return; }
            state[key] = state[key].concat(sel.value);
            paint();
          });
          body.appendChild(sel);
        }
        box.appendChild(body);
        wrap.appendChild(box);
      });
    };
    paint();

    NL.modal({
      title: club + ' \u2014 mailing lists',
      width: 'wide',
      body: wrap,
      buttons: [
        { label: 'Cancel', className: 'btn--ghost', onClick: function (c) { c.close(); } },
        { label: 'Save lists', className: 'btn--primary', onClick: function (c) {
          var next = {}, changed = [];
          LIST_ORDER.forEach(function (key) {
            var was = NLDirectory.arr((rec.leads || {})[key]);
            if (state[key].join(',') !== was.join(',')) {
              changed.push(LIST_LABEL[key] || key);
            }
            if (state[key].length) { next[key] = state[key].slice(); }
          });
          if (!changed.length) { c.close(); return; }
          /* Logged per list, in names rather than ids, so the green marker
             says who was on it before rather than "p3k9tz2 -> pf81qq4". */
          var nameOf = function (ids) {
            return NLDirectory.arr(ids).map(function (id) {
              return byId[id] ? NLDirectory.fullName(byId[id]) : id;
            }).join(', ');
          };
          LIST_ORDER.forEach(function (key) {
            var was = NLDirectory.arr((rec.leads || {})[key]);
            if (state[key].join(',') === was.join(',')) { return; }
            logEdit(club, 'leads/' + key, nameOf(was), nameOf(state[key]));
          });
          (ALL[club] || rec).leads = next;
          c.close();
          saveStructure(club, 'Mailing lists updated (' + changed.join(', ') + ')');
        } }
      ]
    });
  }

  /* ------------------------------------------------- rebuild from source
     The club details, reconstructed rather than remembered.

     Every ingredient survives independently of the directory, which is what
     makes this possible at all:

       · the club's own submission, at ops-club-contacts/submissions. Nothing
         in this tool can write to it — the rules refuse — so it is the same
         text the club typed, whatever has happened since.
       · the tidier, which is deterministic. Running tidyInfo over that
         submission produces exactly the corrections the original bake made,
         because it is the same function over the same input.
       · the hand edits, recorded in provenance with the value each one set.
         Replaying them puts the League's own corrections back on top.

     So "the original, with the changes applied" is not a backup being
     restored, it is the same three steps run again. A backup can be missing;
     this cannot be, unless the submission itself is.

     Only the details. The people are not touched — they carry the admin
     team's work, and there is no version of this worth trading that for.

     Master only, and not merely by preference: reading the submissions node
     needs the master claim since #738, so an editor's token would be refused
     by the rules even if the button were there. */
  var SUBS = null;

  function loadSubs() {
    if (SUBS) { return Promise.resolve(SUBS); }
    return firebase.database().ref('app-data/ops-club-contacts/submissions')
      .once('value').then(function (s) { SUBS = s.val() || {}; return SUBS; });
  }

  function submissionFor(club) {
    var found = null;
    Object.keys(SUBS || {}).forEach(function (t) {
      var r = SUBS[t];
      if (r && r.club === club) { found = r; }
    });
    return found;
  }

  function rebuildInfo(club) {
    var rec = ALL[club];
    if (!rec) { return; }
    loadSubs().then(function () {
      var sub = submissionFor(club);
      if (!sub || !sub.info || !Object.keys(sub.info).length) {
        NL.alert('No submission holding club details could be found for ' + club +
          '. There is nothing to rebuild from \u2014 the details will have to be ' +
          'asked for again.', { title: 'Nothing to rebuild from' });
        return;
      }
      /* Step one and two: what they sent, through the same tidier the bake
         used. The log is kept so the amber markers describe this rebuild
         rather than the bake that is being replaced. */
      var shim = { info: clone(sub.info) };
      var fresh = [];
      try {
        NLTidy.tidyInfo(shim, function (path, from, to, kind) {
          fresh.push({ path: path, from: from, to: to, kind: kind || 'case' });
        });
      } catch (e) { /* a tidier fault must not block a recovery */ }

      /* Step three: the League's own corrections, back on top. */
      var hand = editList(club).filter(function (e) {
        return /^info\//.test(e.path || '');
      });
      hand.forEach(function (e) {
        shim.info[e.path.replace(/^info\//, '')] = e.to;
      });
      shim.info.noSponsor = !((shim.info.stadiumSponsor || '').trim());

      var heldNow = Object.keys(rec.info || {}).filter(function (k) {
        return k !== 'noSponsor' && String((rec.info || {})[k] || '').trim() !== '';
      }).length;
      var heldAfter = Object.keys(shim.info).filter(function (k) {
        return k !== 'noSponsor' && String(shim.info[k] || '').trim() !== '';
      }).length;

      NL.confirm('Rebuild the club details for ' + club + '?', {
        title: 'Rebuild from the submission',
        variant: heldNow > heldAfter ? 'danger' : undefined,
        detail: 'Takes what ' + club + ' sent us, applies the same automatic ' +
          'corrections as the original build, then replays the ' + hand.length +
          ' hand ' + (hand.length === 1 ? 'edit' : 'edits') + ' recorded against ' +
          'these details.\n\n' +
          club + ' currently holds ' + heldNow + ' details. The rebuild holds ' +
          heldAfter + '.\n\n' +
          'Only the club\u2019s own details change. Nobody on the club is touched, ' +
          'and this goes in the journal like any other change, so it can be undone.' +
          (heldNow > heldAfter
            ? '\n\nNote this is FEWER than it holds now, so something currently ' +
              'there is not in the submission. Check before you accept it.'
            : ''),
        confirmText: 'Rebuild ' + club
      }).then(function (ok) {
        if (!ok) { return; }
        rec.info = shim.info;
        /* The amber markers belong to the values on screen, so the info ones
           are replaced wholesale while every people marker is left alone. */
        var prov = PROV[club] || (PROV[club] = {});
        prov.changes = NLDirectory.arr(prov.changes).filter(function (c) {
          return !/^info\//.test(c.path || '');
        }).concat(fresh);
        firebase.database().ref(ROOT + '/provenance/' + club + '/changes')
          .set(prov.changes);
        saveStructure(club, 'Club details rebuilt from the submission (' +
          heldAfter + ' fields)', null, true);
      });
    }).catch(function (err) {
      NL.toast('Could not read the submissions: ' + ((err && err.message) || err), 'error');
    });
  }

  /* -------------------------------------------------------------- editions
     Undo protects a change. This protects the project.

     An edition is the whole directory, frozen: every club, every person, and
     the provenance that explains how it got that way. Taken before handing
     the tool to somebody new, and again when the League agrees a version is
     the version. It is the answer to "what did this look like in August",
     which is a question nobody asks until they very much need to.

     Two rules do the work, and both are in the rules file rather than here,
     because a safety net a page can decide to ignore is not one:

       · Only a master may create one. An editor must not be able to touch the
         thing that exists to survive an editor.
       · Write-once. There is no parent write grant, only a per-edition rule
         requiring the key to be empty — so nobody, master included, can
         overwrite or delete an edition. You supersede one by making another.

     Restoring is per club. Putting all 72 back at once is available and loud,
     but the realistic recovery is "Chester has gone wrong, put Chester back",
     and a single button that silently discards a fortnight is the footgun we
     already took out of undo. A restore goes through saveStructure like any
     other change, so it lands in the journal and can itself be undone. */
  function editionsList() {
    return firebase.database().ref(ROOT + '/editions').once('value').then(function (s) {
      var v = s.val() || {};
      return Object.keys(v).map(function (k) {
        var e = v[k] || {};
        return { id: k, at: e.at || 0, by: e.by || 'unknown', label: e.label || '',
                 clubs: Object.keys(e.clubs || {}).length };
      }).sort(function (a, b) { return b.at - a.at; });
    });
  }

  function showEditions() {
    var body = document.createElement('div');
    body.className = 'ed-jrnl';
    body.innerHTML = '<p class="form-hint">Loading\u2026</p>';
    var ctrl = NL.modal({
      title: 'Published versions',
      size: 'lg',
      body: body,
      buttons: [
        { label: 'Close', className: 'btn--ghost', onClick: function (c) { c.close(); } }
      ]
    });
    editionsList().then(function (list) {
      if (!list.length) {
        body.innerHTML = '<p class="cd-empty">Nothing has been published yet. ' +
          'Publishing freezes a copy of all ' + names.length + ' clubs at the same ' +
          'time, which nobody can alter afterwards \u2014 so every version readers ' +
          'have seen stays recoverable.</p>';
        return;
      }
      body.innerHTML = '<p class="form-hint">Every publication, newest first. Each is ' +
        'the whole directory as it stood when it went out, and none can be altered. ' +
        'Restoring puts one club back to how it was at that publication, and lands ' +
        'in the journal like any other change.</p><ul class="ed-jrnl__list">' + list.map(function (e) {
        return '<li class="ed-jrnl__row">' +
          '<div class="ed-jrnl__main">' +
            '<span class="ed-jrnl__what">' + esc(e.label) + '</span>' +
            '<span class="ed-jrnl__meta">' + esc(NL.formatDateTime(e.at)) + ' \u00b7 ' +
              esc(e.by) + ' \u00b7 ' + e.clubs + ' clubs</span>' +
          '</div>' +
          '<button class="btn btn--sm btn--ghost" type="button" data-ed="' +
            esc(e.id) + '">Restore\u2026</button>' +
        '</li>';
      }).join('') + '</ul>';
      body.querySelectorAll('button[data-ed]').forEach(function (b) {
        b.addEventListener('click', function () { restoreFrom(b.dataset.ed, ctrl); });
      });
    }).catch(function (err) {
      body.innerHTML = '<p class="cd-empty">' + esc((err && err.message) || err) + '</p>';
    });
  }

  function restoreFrom(id, ctrl) {
    var club = current;
    if (!club) { NL.toast('Open a club first', 'error'); return; }
    firebase.database().ref(ROOT + '/editions/' + id).once('value').then(function (s) {
      var ed = s.val();
      if (!ed) { NL.toast('That version could not be read', 'error'); return; }
      var was = (ed.clubs || {})[club];
      if (!was) {
        NL.alert(club + ' was not in that version, so there is nothing to put ' +
          'back. Pick a club that existed when it was frozen.', { title: 'Not in that version' });
        return;
      }
      var now = NLDirectory.arr((ALL[club] || {}).people).length;
      var then = NLDirectory.arr(was.people).length;
      NL.confirm('Put ' + club + ' back to "' + (ed.label || 'that version') + '"?', {
        title: 'Restore ' + club,
        variant: 'danger',
        detail: 'It goes back to exactly how it stood on ' + NL.formatDate(ed.at) +
          ' \u2014 ' + then + ' people, where it now has ' + now + '. Everything done ' +
          'to this club since is discarded.\n\nOnly this club. The other ' +
          (names.length - 1) + ' are untouched, and this lands in the journal so it ' +
          'can itself be undone.',
        confirmText: 'Restore ' + club
      }).then(function (ok) {
        if (!ok) { return; }
        if (ctrl && ctrl.close) { ctrl.close(); }
        /* Mutated, never replaced. Replacing it orphans every closure the
           current render is holding — the card pen among them — so the page
           carries on editing an object nothing will ever save. That is what
           made a club-card edit write its green marker and change nothing
           else. */
        var live = ALL[club] || (ALL[club] = {});
        Object.keys(live).forEach(function (k) { delete live[k]; });
        var back = clone(was) || {};
        Object.keys(back).forEach(function (k) { live[k] = back[k]; });
        live.club = club;
        var prov = clone((ed.provenance || {})[club]) || {};
        var cur = PROV[club] || (PROV[club] = {});
        /* The journal is the one thing a restore must not roll back: it is the
           record that the restore happened, and of everything before it. */
        cur.edits = NLDirectory.arr(prov.edits);
        cur.changes = NLDirectory.arr(prov.changes);
        cur.attention = NLDirectory.arr(prov.attention);
        cur.merges = NLDirectory.arr(prov.merges);
        var db = firebase.database();
        ['edits', 'changes', 'attention', 'merges'].forEach(function (k) {
          db.ref(ROOT + '/provenance/' + club + '/' + k).set(cur[k]);
        });
        saveStructure(club, 'Restored to \u201c' + (ed.label || 'a frozen version') +
          '\u201d', null, true);
      });
    }).catch(function (err) {
      NL.toast('Could not restore: ' + ((err && err.message) || err), 'error');
    });
  }

  /* --------------------------------------------------------------- publish
     The reader used to read the directory itself and decide, in the browser,
     what not to show: unsigned clubs greyed out, a not-for-publication
     person's address replaced with "Not published". Both decisions were
     correct and both were made far too late — the record had already been
     sent. Behind a six-digit code that was survivable. It is not a thing to
     carry into a public page, and a public page is where this is going.

     So publishing builds a SECOND copy that is already safe to hand over.
     Signed-off clubs only, and for anyone the club asked us to keep back the
     contact details are absent rather than flagged: the person is still
     listed, because a directory that silently omits the safeguarding officer
     reads as a club without one, but there is nothing in the file to hide.

     The point is that no rule has to be clever about this node, and no page
     built against it later can leak something by asking for too much. There
     is nothing in it that is not meant to be read.

     It is a button and not a trigger on sign-off because publishing is when
     the League stands behind the whole thing at once, and somebody should
     have chosen the moment. Who and when are recorded with it. */
  var PUB_PERSON = ['id', 'title', 'firstName', 'lastName', 'postNominals',
                    'name', 'roles', 'hideContact'];

  function publishablePerson(p) {
    var out = {};
    PUB_PERSON.forEach(function (k) {
      if (p[k] !== undefined && p[k] !== null) { out[k] = clone(p[k]); }
    });
    /* The whole point. Not blanked, not flagged — not there. `added` goes too:
       whether the League typed somebody in or the club did is our business.

       Per entry as of v1.32, so a person can publish their club address and
       keep their mobile back. Same guarantee either way: what is held back is
       removed from the published copy, so no rule has to be clever and no
       reader can ask for it. hideContact still means all of it. */
    if (!p.hideContact) {
      var em = NLDirectory.arr(p.emails).filter(function (e) {
        return NLDirectory.addrOf(e).trim();
      });
      var ph = NLDirectory.arr(p.phones).filter(function (x) {
        return x && (x.number || '').trim();
      });
      var keepEm = em.filter(function (e) { return !NLDirectory.ownHide(e); });
      var keepPh = ph.filter(function (x) { return !NLDirectory.ownHide(x); });
      out.emails = clone(keepEm) || [];
      out.phones = clone(keepPh) || [];
      /* Only when a channel is emptied ENTIRELY. It is how the reader tells
         "held back" from "we do not have one" — with one of three addresses
         withheld there is nothing to say, because the reader is not owed a
         count of what it is not getting. */
      if (em.length && !keepEm.length) { out.hideEmail = true; }
      if (ph.length && !keepPh.length) { out.hidePhone = true; }
    }
    return out;
  }

  /* Every club, checked or not. The first cut published only what had been
     marked complete, which is the right rule for a directory being built at
     leisure and the wrong one for getting a usable version in front of 72
     clubs now. Everything has been through the tidier — the capitalisation,
     the job titles naming two jobs, the club block — so an unchecked club is
     not raw, it is simply not yet read by a person.
     What does NOT relax is the contact suppression: somebody the club asked
     us to hold back is held back whether their club has been checked or not,
     because that is their decision and not a state of our work. */
  function buildPublished() {
    var clubs = {}, orgs = {}, pending = [], leaks = [], people = 0, held = 0, unchecked = 0;
    Object.keys(ALL).sort().forEach(function (name) {
      var rec = ALL[name] || {};
      if (!signedOffBy(rec)) { unchecked++; }
      var list = NLDirectory.arr(rec.people);
      /* People with ANYTHING kept back, not people with everything kept
         back — the count is there to say how much of the directory is not
         in the published copy, and a withheld mobile counts. */
      list.forEach(function (p) {
        people++;
        var c = NLDirectory.contactsOf(p, '');
        if (c.emails.concat(c.phones).some(function (x) { return x.hide; })) { held++; }
      });
      var out = list.map(publishablePerson);
      clubs[name] = { club: name, info: clone(rec.info || {}), people: out };
      /* The root markers survive publication: the reader pins organisations
         above the clubs and picks their crest by these. Org inboxes go too —
         renderClub puts them on an org's card, where a club's stay private
         to the editor and the staff list-builder. */
      if (rec.org) {
        clubs[name].org = true;
        if (rec.inboxes) { clubs[name].inboxes = clone(rec.inboxes); }
        if (rec.colors) { clubs[name].colors = clone(rec.colors); }
        if (rec.bannerCrestName) { clubs[name].bannerCrestName = rec.bannerCrestName; }
        if (rec.order) { clubs[name].order = clone(rec.order); }
        /* The wall's public leaf: names and crest keys only, no contacts.
           The doorless page cannot list published/clubs, so this is how it
           knows an org tile exists to draw. Always a truthy crest key —
           RTDB drops nulls, and a dropped value would drop the org. */
        orgs[name] = { crestName: rec.crestName || name };
      }
      if (rec.crestName) { clubs[name].crestName = rec.crestName; }
      leaks = leaks.concat(escaped(name, list, out));
    });
    return { clubs: clubs, orgs: orgs, pending: pending, unchecked: unchecked, leaks: leaks,
             count: Object.keys(clubs).length, people: people, held: held };
  }

  /* The one way a withheld detail can still go out, and it is not a fault in
     the stripping — it is the duplicates. 57 people across 26 clubs were
     entered twice, so marking a mobile not-for-publication on one record
     leaves the other record publishing the same number, and the club's
     request is defeated by a copy nobody remembered was there.

     Nothing here guesses which record is right; that is the editor's call and
     merging is a separate job. It just refuses to let it happen quietly. */
  function escaped(club, before, after) {
    var who = function (p) { return NLDirectory.fullName(p).trim().toLowerCase(); };
    /* Keyed by name AND value, not by value alone. The first cut keyed on the
       value and stopped a publish at Horsham because the club switchboard was
       withheld against one person and published against three others — which
       is not a leak, it is one public number that somebody did not want on
       their own card. The case worth stopping is the SAME PERSON twice. */
    var withheld = {};
    before.forEach(function (p) {
      var n = who(p);
      if (!n) { return; }
      var c = NLDirectory.contactsOf(p, '');
      c.emails.concat(c.phones).forEach(function (x) {
        if (x.hide) { withheld[n + '\u0000' + x.value.trim().toLowerCase()] = x.value; }
      });
    });
    if (!Object.keys(withheld).length) { return []; }
    var out = [];
    after.forEach(function (p) {
      var n = who(p);
      if (!n) { return; }
      NLDirectory.arr(p.emails).map(NLDirectory.addrOf)
        .concat(NLDirectory.arr(p.phones).map(function (x) { return x && x.number; }))
        .forEach(function (v) {
          var k = n + '\u0000' + String(v || '').trim().toLowerCase();
          if (!String(v || '').trim() || !withheld[k]) { return; }
          out.push({ club: club, value: withheld[k], on: NLDirectory.fullName(p) });
        });
    });
    return out;
  }

  /* Publishing and versioning are one act, because they were always one
     fact: "this is what the League is standing behind, as of now". Two
     buttons meant you could publish without a record of what you published,
     or freeze something nobody would ever see — and it meant remembering to
     do the second one, which is the kind of discipline that holds for about a
     fortnight.

     One press writes two things. The PUBLISHED copy is the stripped, handed-
     over version readers get. The EDITION is the full working state — people,
     club details, provenance — frozen and immutable, so any club can be put
     back to how it stood at any publication. The Versions list is therefore
     the publication history, and restoring means "back to how this club was
     when we published that".

     Master only, and not by preference: the rules make an edition writable by
     a master alone, deliberately, because an editor must not be able to touch
     the thing that exists to survive an editor. Publishing now writes one, so
     publishing inherits that. It is also the right answer on its own terms —
     the reader is 72 clubs, and releasing to them is a decision rather than a
     step. */
  function publishNow() {
    var built = buildPublished();
    if (!built.count) {
      NL.alert('There are no clubs in the directory to publish.',
        { title: 'Nothing to publish' });
      return;
    }
    /* Asked, not silently allowed. Two genuinely different people of the same
       name at one club sharing a number is possible, so this is not a wall —
       but it defaults to not publishing, because the thing on the other side
       of the button cannot be taken back. */
    if (built.leaks.length) {
      var lines = built.leaks.slice(0, 12).map(function (x) {
        return '  \u2022 ' + x.value + ' \u2014 still published on the other ' +
          x.on + ' record at ' + x.club;
      }).join('\n');
      NL.confirm(built.leaks.length + ' detail' + (built.leaks.length === 1 ? '' : 's') +
        ' marked not-for-publication would still go out, because the same ' +
        'person is in the directory twice and the second record still carries ' +
        'it:\n\n' + lines +
        (built.leaks.length > 12 ? '\n  \u2026and ' + (built.leaks.length - 12) + ' more' : '') +
        '\n\nThe fix is a minute: open the other record and tick it there too, ' +
        'or merge the duplicate. Publishing now sends it out anyway.',
        { title: 'A withheld detail would still be published', variant: 'danger',
          confirmText: 'Publish anyway', cancelText: 'Let me fix it' }
      ).then(function (ok) { if (ok) { publishConfirmed(built); } });
      return;
    }
    publishConfirmed(built);
  }

  function publishConfirmed(built) {
    var prev = PUBLISHED_AT;
    var when = NL.formatDate(Date.now());
    NL.prompt('This replaces what readers see with all ' + built.count +
      ' club' + (built.count === 1 ? '' : 's') + ' as they stand right now \u2014 ' +
      built.people + ' people, of whom ' + built.held + ' asked us to keep their ' +
      'contact details back. Those details are left out of the published copy ' +
      'entirely; the person is still listed.\n\n' +
      (built.unchecked
        ? built.unchecked + ' of them ' + (built.unchecked === 1 ? 'has' : 'have') +
          ' not been marked complete yet. They go out tidied but unread, which ' +
          'is the point of publishing now rather than waiting.\n\n'
        : '') +
      'It also freezes a copy of everything as it stands, which nobody can ' +
      'alter afterwards \u2014 so any club can be put back to how it is right ' +
      'now. Give it a name you will recognise in six months.\n\n' +
      (prev ? 'Last published ' + NL.formatDateTime(prev) + '.'
            : 'Nothing has been published before.'), {
      title: 'Publish',
      default: 'Published ' + when,
      placeholder: 'e.g. Published ' + when,
      confirmText: 'Publish'
    }).then(function (label) {
      if (label === null) { return; }
      var btn = $('publish');
      btn.disabled = true; btn.textContent = 'Publishing\u2026';
      var db = firebase.database();
      var at = Date.now();
      var by = session.name || 'editor';
      var name = String(label || '').trim() || ('Published ' + when);

      var edRef = db.ref(ROOT + '/editions').push();
      var edition = { at: at, by: by, label: name, published: true,
        clubs: clone(ALL) || {}, provenance: clone(PROV) || {} };
      var payload = { at: at, by: by, label: name, edition: edRef.key,
        count: built.count, people: built.people,
        clubs: built.clubs, orgs: built.orgs, pending: built.pending };

      NL.writeAudit('directory_publish', built.count + ' club(s), ' + built.people +
        ' people published as "' + name + '" by ' + by);

      /* The frozen copy first. Publishing without a record of what was
         published is the half of this worth not having. */
      edRef.set(edition)
        .then(function () { return db.ref(ROOT + '/published').set(payload); })
        .then(function () {
          PUBLISHED_AT = at;
          btn.disabled = false; btn.textContent = 'Publish';
          NL.toast(built.count + ' club' + (built.count === 1 ? '' : 's') +
            ' published and frozen as \u201c' + name + '\u201d', 'success');
          if (current) { draw(current); }
        })
        .catch(function (err) {
          btn.disabled = false; btn.textContent = 'Publish';
          showFail('The directory', 'Publish', (err && err.message) || String(err));
        });
    });
  }

  /* --------------------------------------------------------- the journal
     Every save leaves two records, and they are deliberately not the same
     record.

     The JOURNAL is append-only. Nothing is ever edited or deleted in it, and
     an undo does not remove the thing it undoes — it appends an entry that
     points at it. So a master looking at a club sees both halves: an editor
     removed a club's whole board, and then that editor put it back. That is
     the honest account, and it is the one worth keeping.

     The WORKING LIST is derived from the journal, not stored: your own
     entries, most recent first, with anything you have since undone filtered
     out. An undone change is not work you did; it is work you did and then
     un-did, and a to-do list that keeps showing it is lying to you.

     The body at .../undo/<club>/<id> is a PATCH, not a snapshot, and that
