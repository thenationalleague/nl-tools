<!--
  club-directory / reader / index.html
  v1.9 — (26/08/2026) THE INDEX IS A WALL OF CRESTS. It was 72 identical
         bordered boxes with the badge at 28px beside the name — too small to
         recognise and too big to be an icon, so the crest was decoration on
         what is really a badge-picker. Richard: "looks shit. all diff sizes
         etc." The sizes were literally different: nothing set a row height,
         so any club whose name ran to two lines made its own tile taller
         than the ones beside it. Five distinct heights in one view.
         Now: the crest at 56px on white, and the club name on a band in the
         club's OWN primary and tertiary, taken from NLDirectory.clubColours
         — the same function the club banner asks, so the wall and the entry
         it opens can never disagree. One tile height, one band height, one
         crest square (canon .nl-crest, fixed in both directions: the brand
         rule is that the area of the crest is identical each time).
         The band is 14px BOLD because that is where WCAG's large-text 3:1
         bar applies, and all 72 clear 3:1 on their own two colours. Smaller
         and ten of them would need overruling.
         Thirteen clubs play in white and keep it; their band takes a hairline
         so it still reads as a band.
         COLUMNS 6 / 4 / 3 / 2, all of which divide 24 so the last row of a
         division fills. Eight across was tried first and gave each tile about
         165px on a 1440 screen — not enough for a club name at a size anyone
         can read. Hampton & Richmond Borough and Hemel Hempstead Town both
         ran to three lines and were CLIPPED by the fixed band. Richard:
         "these are 8 abreast. surely way too small." Every one of the 72 now
         fits its band at every width, checked by measurement rather than by
         eye.
         Your club keeps its wide row above the divisions and now wears its
         own colours too — being the wrong SHAPE is what makes it findable,
         and it should not be the one card on the page in another club's red.
         A club not yet signed off FADES rather than desaturating: greyscale
         made Buxton, deep blue and white, look like a club that plays in
         grey, and its "Not yet checked" line moves to the title, that line
         being what made the rows uneven in the first place.
  v1.8 — (21/08/2026) The club grid holds a column count that divides 24.
         Every division has 24 clubs, so a count that divides it fills its
         last row and one that does not leaves an orphan row of stragglers
         under a full grid. auto-fill was picking whatever fitted — five on a
         laptop, which is 24 = four rows and four — and five is the one count
         in range that never comes out even. 6 / 4 / 3 / 2 now.
         The List/Cards switcher has gone from the top of the page; it is
         drawn above a club's people by renderClub, so the index no longer
         carries a control that does nothing there.
  v1.7 — (21/08/2026) It lands on the INDEX, with your club at the top of it,
         and the crests stop being a tax. Three things:
         · The landing page is the directory, not one entry. Opening straight
           on your own club made the other 71 look like they were not there —
           a directory that opens inside one record has hidden what it is.
           Nothing is lost: drawIndex puts your club above the divisions as a
           wide card, so it is still the first thing on the page and one press
           away, and a URL naming a club still opens that club.
         · Crests are square. The banner pinned the width and let the height
           follow; crest files are not square, so a tall badge drew bigger
           than a wide one and the banner's height moved with the club. Canon
           .nl-crest (brand v2.59) — the box is the constant.
         · 72 crests no longer load at once. NL.clubs.crestImgHtml defers by
           default (nl-utils v1.41), so the index requests what is on screen
           instead of all of it. Sizes were already right: thumb for tiles,
           medium for the banner, full-res nowhere.
  v1.6 — (21/08/2026) The bar names your club, and "Not published" / "None
         held" are yours alone. The bar said "Signed in by code" to someone
         who had just signed in by code — it stated the one thing they already
         knew and withheld the one thing they did not. It now names the club
         whose code opened the page, resolved through the roster so a resumed
         session (which carries the club KEY, not its name) says it too.
         And the withheld markers are loud only on your own entry
         (_directory.js v1.6, opts.showQuiet). On your own club they are a
         to-do list — what the League is holding back, what it was never
         given. On the other 71 they are a column of noise about a gap that is
         none of your business. Same markup, decided by who is looking; the
         editor is unchanged.
  v1.5 — (21/08/2026) It opens on YOUR club, and there is an index of all of
         them. The club code carries the club's key, so the page knows who is
         reading and can open on their entry — it used to open on Aldershot,
         because A sorts first, and every club that ever used this had to go
         and find itself. "All clubs" sits at the top of the picker and at
         #all: every club in the competition, grouped by division, crest-led,
         because a crest is how anyone actually recognises a club. Built from
         the roster rather than the directory, so a club nobody has checked yet
         is still there and still greyed — the picker's reasoning, applied to
         the grid. A reader code carries no club and lands on the index, which
         is right: they are not a club.
  v1.4 — (21/08/2026) A club opens this with the SAME six characters that open
         the Handbook and Programme Packs. One credential, three tools; the
         Directory's own reader codes keep working alongside it, for the people
         the League gives one to who are not a club.
         The gate is canon NL.codeGate rather than the local _gate.js card, and
         that is the fix as much as the credential is: _gate.js strips
         everything but digits, so a club code typed here silently lost most of
         itself and came back "not recognised". The code was right and the lock
         was wrong. The canon gate also submits on the last character instead of
         waiting for Enter, and the bar now names the club rather than saying
         "Signed in by code", which the person signing in already knew.
  v1.3 — (15/08/2026) The bar is white with a red underline, not red. Red is
         reserved for a signed-in NL account and this page is entered with a
         six-digit code — it was wearing the wrong colour, and the editor next
         door was wearing navy for the same door. Canon .nl-idbar, nl-brand.css
         v2.37. Full canon structure — __id / __title / __sub / __actions — so the
         controls sit right and the title is not left carrying the row's flex
         on its own. The club selector gains a border: white-on-red drew its
         own edge and white-on-white does not.

  v1.2 — (05/08/2026) Reads the published copy, not the directory. This page
         used to pull every club and decide in the browser what to leave out,
         which meant the records it decided against had already crossed the
         wire — including the contact details of the people who asked us not
         to publish them. The gate made that survivable rather than fine. It
         now reads app-data/ops-club-directory/published, which the editor
         builds to be handed over: published clubs only, and no contact fields
         at all for anyone held back. `pending` carries the names of clubs not
         yet released, so one can still be listed and greyed rather than
         looking like a club that does not exist.
  v1.1 — (05/08/2026) A deep link to a club nobody has checked yet is now
         honoured, and the page says so. It used to be refused and fall back
         to the first club in the list — which, with nothing signed off,
         meant every link anyone shared silently went somewhere else. The
         gate belongs on the contents, not the address.
  v1.0 — (04/08/2026) The directory, read-only, behind a shared six-digit code.

  What this is
  ------------
  The replacement for the printed handbook's club pages. Anyone the League
  gives the code to can read every club; nobody can change anything.

  Which code
  ----------
  Either of two, checked by two different triggers, on one card:
    · a CLUB code — app-data/club-codes, claim `club`, the estate's one club
      credential. Tried first, because it is the one being issued now.
    · a DIRECTORY reader code — app-data/ops-club-directory, claim `dir`, for
      readers who are not a club. Costs a second round trip, which is the right
      way round.
  Neither is checked in the browser. The rules on `published` accept a `club`
  claim, any `dir` claim, or an NL portal role.

  Why a code and not auth-guard
  -----------------------------
  The people who need this mostly have no portal account, and issuing 300
  accounts to solve a reading problem is the wrong trade. The code is a real
  boundary, not a screen: it is checked server-side by functions/club-directory
  .js and exchanged for a token the RTDB rules enforce, so this page cannot
  read a single record until that has happened. See functions/club-code.js and
  functions/club-directory.js; the card itself is canon NL.codeGate.

  It is noindex because the directory carries people's work contact details.
  That is a curtain rather than a door, and the code is the door.

  Not lint-covered: no auth-guard, by design.
-->

<style>
  /* The identity bar is canon (.nl-idbar). reader was red — the signed-in colour — on a page entered with a six-digit code.
     Same tool, same door, two different colours — which is exactly the
     confusion the entry-route rule in nl-brand.css v2.37 exists to stop.
     Both are white with a red underline now: you typed a code, and the page
     knows that and nothing more. */
  /* The club selector sits in the bar and needs a visible edge now the ground
     is white — it had none, because white-on-red drew its own. */
  .rd-pick {
    font-family: var(--font); font-size: var(--text-sm);
    font-weight: 600; font-variation-settings: 'wght' 600;
    padding: 6px 10px; border: 1px solid var(--border); border-radius: var(--radius);
    background: var(--white); color: var(--text); max-width: 260px;
  }
  /* The search bar clears the sticky bar above it rather than the 72px topbar
     this page does not have. */
  .cd-search { top: 46px; }
  .rd-hits { margin: 0 0 30px; }
  .rd-hit__club {
    font-size: var(--text-xs); text-transform: uppercase; letter-spacing: var(--tracking-tight);
    font-weight: 700; font-variation-settings: 'wght' 700; color: var(--primary);
  }
  @media (max-width: 560px) { .cd-search { top: 0; position: static; } }

  /* The all-clubs index. Crest-led, because a crest is how anyone actually
     recognises a club, and grouped by division because that is the shape the
     competition already has. Tool-local: a grid of club tiles is not a thing a
     second tool has asked for yet, and the policy block atop nl-brand.css says
     the first use stays here. If a second one wants it, promote it. */
  .rd-div { margin: 0 0 32px; }
  .rd-div__h {
    font-size: var(--text-xs); text-transform: uppercase;
    letter-spacing: var(--tracking-wide); font-weight: 700;
    font-variation-settings: 'wght' 700;
    color: var(--text-muted); margin: 0 0 12px;
    padding-bottom: 8px; border-bottom: 1px solid var(--border);
  }
  /* THE WALL. A club's crest on white, its name on a band in the club's own
     two colours. It replaced a grid of 72 identical bordered boxes with the
     crest at 28px beside the name — too small to recognise and too big to be
     an icon, so the badge was decoration on what is really a badge-picker.
     Richard: "looks shit. all diff sizes etc."

     THE SIZES WERE LITERALLY DIFFERENT: nothing set a row height, so any club
     whose name ran to two lines made its own tile taller than the ones beside
     it — five distinct heights in one view.

     SIX ACROSS AT THE WIDEST, not eight. Eight gave each tile about 165px on
     a 1440 screen, which is not enough for a club name at a size anyone can
     read: Hampton & Richmond Borough and Hemel Hempstead Town both ran to
     three lines and were CLIPPED by the fixed band. Richard: "these are 8
     abreast. surely way too small."

     FIXED COUNTS, AND ALL OF THEM DIVIDE 24. Every division has 24 clubs, so
     a column count that divides 24 fills its last row; one that does not
     leaves an orphan row of stragglers under a full grid. auto-fill was
     picking whatever fitted — five on a laptop, which is 24 = 4 rows + 4 —
     and five is the one count in range that never comes out even. The same
     lesson is written above .cd-facts in _directory.css, one file over.

     CANON CANDIDATE: a crest-and-name picker of the 72 is wanted by Programme
     Packs and club-codes as well. First use stays here per the promotion rule;
     when the second lands this is .nl-club-grid / .nl-club-tile. */
  .rd-grid {
    list-style: none; margin: 0; padding: 0;
    display: grid; gap: 10px;
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  @media (min-width: 560px)  { .rd-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (min-width: 800px)  { .rd-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  @media (min-width: 1180px) { .rd-grid { grid-template-columns: repeat(6, minmax(0, 1fr)); } }
  .rd-tile { margin: 0; }
  .rd-tile__go {
    display: flex; flex-direction: column; width: 100%; height: 100%;
    min-height: 140px; padding: 0; overflow: hidden; text-align: center;
    background: var(--white); color: var(--navy);
    border: 1px solid var(--border); border-radius: var(--radius);
    font-family: var(--font); cursor: pointer;
    transition: border-color .16s ease, transform .16s cubic-bezier(.22, 1, .36, 1);
  }
  .rd-tile__top { flex: 1 1 auto; display: grid; place-items: center; padding: 16px 8px 12px; }
  /* Square box, crest fitted inside — .nl-crest (nl-brand v2.59) carries the
     rule; only the size is local. The brand note at that rule is the reason
     the box is fixed in BOTH directions: "within a square shape so that the
     area of the crest is identical each time". Contained by max-width alone,
     a tall shield came out narrow and a wide one short, and no two badges on
     the wall occupied the same area. */
  .rd-tile__crest { --crest-size: 56px; }
  /* THE CLUB'S OWN PRIMARY AND TERTIARY, with nothing substituted — see
     bannerColours() in _directory.js, which this asks for the pair.

     14px BOLD IS LOAD-BEARING, not a taste call. At 14px and bold this is
     large text, where the contrast bar is 3:1 — and every one of the 72
     clears 3:1 on its own two colours. Set it smaller and ten clubs fall
     under the small-text bar and would need their colours overruled.

     A fixed height, so a two-line name and a one-line name still line up
     across the row. */
  .rd-tile__band {
    flex: none; display: grid; place-items: center; height: 50px;
    padding: 4px 7px; background: var(--tile-bg, var(--navy)); color: var(--tile-fg, var(--white));
    font-size: var(--text-sm); font-weight: 700; font-variation-settings: 'wght' 700;
    line-height: 1.2; overflow-wrap: break-word;
  }
  /* A white band on a white tile is not a band however well the ink reads.
     That is a LAYOUT problem and this is the layout fixing it — the thirteen
     clubs who play in white keep their white. */
  .rd-tile.is-white .rd-tile__band { box-shadow: inset 0 1px 0 var(--border); }
  button.rd-tile__go:hover { border-color: var(--tile-bg, var(--primary)); transform: translateY(-2px); }
  button.rd-tile__go:focus-visible { outline: 2px solid var(--tile-bg, var(--primary)); outline-offset: 2px; }

  /* Your club, above the divisions. Wide, because it is the one row most
     people opened the page for. */
  .rd-mine { margin: 0 0 32px; }
  .rd-mine__go {
    display: flex; align-items: center; gap: 16px; width: 100%;
    padding: 14px 16px; text-align: left;
    /* IN YOUR OWN COLOURS, like every tile on the wall below — the League's
       red would have been the one card on the page wearing somebody else's
       club colours. It stays a wide row rather than becoming a wall tile
       because being the wrong SHAPE is what makes it findable without
       hunting; being the wrong colour was never the point.

       Not tabbed. A thick accent stripe down one side of a card is the
       laziest way to say "this one is special" and it reads as template
       furniture; the heading above already says which one it is. */
    background: var(--tile-bg, var(--primary-50)); color: var(--tile-fg, var(--text));
    border: 1px solid var(--tile-bg, var(--primary-200)); border-radius: var(--radius);
    font-family: var(--font); font-size: var(--text-base);
    font-weight: 700; font-variation-settings: 'wght' 700;
    cursor: pointer;
    transition: transform .16s cubic-bezier(.22, 1, .36, 1), box-shadow .16s ease;
  }
  button.rd-mine__go:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
  button.rd-mine__go:focus-visible { outline: 2px solid var(--navy); outline-offset: 2px; }
  .rd-mine__go[aria-disabled] { cursor: default; opacity: .42; }
  /* A crest sits on the club's own ground here, and a badge with a white
     field on a white-playing club's card needs the same hairline the wall
     bands get. The chip is the tile's ink at a whisper, so it reads on any
     of the 72 grounds. */
  .rd-mine__crest {
    --crest-size: 56px; padding: 5px; border-radius: var(--radius-sm);
    background: color-mix(in srgb, var(--tile-fg, var(--white)) 12%, transparent);
  }
  .rd-mine__text { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .rd-mine__name { font-variation-settings: 'wght' 800; }
  .rd-mine__note {
    font-size: var(--text-xs); font-weight: 500;
    font-variation-settings: 'wght' 500; opacity: .78;
  }
  /* FADED AND UNCLICKABLE rather than absent: a club missing from this page
     reads as a club that does not exist. Same reasoning as the picker.

     IT FADES, IT DOES NOT DESATURATE. Greyscaling the band made Buxton —
     deep blue and white — look like a club that plays in grey: a statement
     about their colours, from a rule about their paperwork. Opacity keeps
     the hue. The state itself is in the title attribute rather than a third
     line of text, which is what made the old rows uneven. */
  .rd-tile.is-pending .rd-tile__go { cursor: default; opacity: .42; }
</style>
</head>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var esc = NL.escHtml;
  var ALL = {}, names = [], PENDING = [], PUBLISHED_AT = 0;
  var ROSTER = [], SESSION = null;

  /* The index is a club-shaped thing in the picker and the URL without being a
     club, so it needs a value no club can collide with. A leading '#' is
     already reserved by the hash it lives in. */
  var INDEX = '#all';

  /* Remembered per person, not per club. The alternative is choosing it again
     on every one of 72. */
  var VIEW = 'list';
  try { VIEW = localStorage.getItem('nlcd-view') || 'list'; } catch (e) {}

  /* The switcher is drawn by renderClub, above the people it applies to, and
     is rebuilt on every draw — so this listens on the container rather than on
     buttons that will not exist yet. */
  function wireView(redraw) {
    var host = $('out');
    if (!host) { return; }
    host.addEventListener('click', function (e) {
      var b = e.target.closest('[data-view-switch] button');
      if (!b) { return; }
      VIEW = b.dataset.v;
      try { localStorage.setItem('nlcd-view', VIEW); } catch (e2) {}
      redraw();
    });
  }

  /* `club` is the club being RENDERED, not the club reading. showQuiet is
     loud only where those are the same: "Not published" and "None held" are a
     to-do list on your own entry and a column of noise on the other 71. */
  function viewOpts(extra) {
    var o = { cards: VIEW === 'cards', viewSwitch: true };
    for (var k in (extra || {})) { o[k] = extra[k]; }
    if (o.club != null) { o.showQuiet = isOwn(o.club); delete o.club; }
    else { o.showQuiet = false; }
    return o;
  }

  /* Resolved once ROSTER and the directory are both in, so it is a name
     comparison rather than a guess. Empty for a Directory reader code, which
     carries no club — so nobody who is not a club sees any of it. */
  var OWN = '';
  function isOwn(name) { return !!OWN && name === OWN; }

  /* Two doors, one card. A club types the SAME six characters that open the
     Handbook and Programme Packs; anyone else the League has given a
     Directory reader code to keeps using it. Both are checked server-side by
     their own trigger, and the gate tries the club code first because that is
     the one being issued now — a Directory code costs a second round trip,
     which is the right way round.

     The letters are why this changed. _gate.js strips everything but digits,
     so a club code typed here silently lost most of itself and came back "not
     recognised" — the code was right and the lock was wrong. */
  /* The tool rides along with the code so the usage log can say which door
     a club came in by — see noteUse in functions/club-code.js. */
  var clubVerify = NL.codeGate.viaFunction('app-data/club-codes', { tool: 'directory' });
  var dirVerify = NL.codeGate.viaFunction(NLGate.ROOT);

  NL.codeGate.resume('club')
    .then(function (s) { return s || NLGate.resume(); })
    .then(function (s) {
      return s || NL.codeGate.open({
        mount: $('gateWrap'),
        title: 'Club Directory',
        /* ACCESS CODE, not club code. The same six characters are held by the
           72 clubs AND by named people at the League — and the League is not
           a club, so a card asking a colleague for their "club code" is
           asking them for something they do not have. Found the day a new NL
           holder was created (22/08/2026).

           And no "digit" anywhere: the codes are alphanumeric. Saying digit
           is the same wrongness that made the old _gate.js strip the letters
           out of a typed code — see the note above — and it sends someone
           looking for a number they were never given. */
        sub: 'Enter your access code.',
        numeric: false,
        verify: function (code) {
          return clubVerify(code)['catch'](function () { return dirVerify(code); });
        }
      });
    }).then(function (session) {
    /* codeGate does not take its own card down — the caller owns the mount and
       knows what replaces it. */
    $('gateWrap').hidden = true;
    $('signOut').addEventListener('click', function () {
      NL.codeGate.signOut().then(function () { location.reload(); });
    });
    SESSION = session || null;
    return Promise.all([
      NL.clubs.forSeason(),
      /* The published copy, not the directory. This page used to read the
         directory itself and decide in the browser what not to show — which
         meant every record it decided against had already been sent. It now
         reads a copy the editor built to be handed over: signed-off clubs
         only, and no contact details at all for anyone the club asked us to
         keep back. There is nothing here to hide, which is the point. */
      firebase.database().ref(NLGate.ROOT + '/published').once('value')
    ]);
  }).then(function (res) {
    ROSTER = res[0] || [];
    var pub = res[1].val() || {};
    ALL = pub.clubs || {};
    PENDING = pub.pending || [];
    PUBLISHED_AT = pub.at || 0;
    names = Object.keys(ALL).sort();
    /* Both of these need the roster AND the directory, so they happen here
       rather than at the gate: the bar was saying "Signed in by code" to
       someone who had just signed in by code, and a resumed session carries
       no name at all — the claim is the club KEY, and the name comes back
       through the roster. */
    OWN = ownClub();
    var sub = document.querySelector('.nl-idbar__sub');
    if (sub) sub.textContent = OWN || (SESSION && SESSION.name) || 'The National League';
    if (!names.length) {
      $('out').innerHTML = '<p class="cd-empty">The directory has not been published ' +
        'yet. The National League goes through each club\u2019s details before they ' +
        'appear here. Please check back.</p>';
      $('app').hidden = false;
      return;
    }
    /* Every club is listed, because a club missing from the list looks like a
       club that does not exist. The ones nobody has checked yet are disabled:
       visibly there, greyed, and unselectable — which says "not ready" rather
       than "not a club". */
    $('pick').innerHTML =
      '<option value="' + esc(INDEX) + '">All clubs</option>' +
      names.concat(PENDING).sort().map(function (n) {
        var ok = ready(n);
        return '<option value="' + esc(n) + '"' + (ok ? '' : ' disabled') + '>' +
          esc(n) + (ok ? '' : ' — not yet checked') + '</option>';
      }).join('');
    $('pick').addEventListener('change', function () { draw(this.value); });
    $('q').addEventListener('input', onSearch);
    wireView(function () {
      var q = $('q').value;
      if (q.trim()) { onSearch({ target: { value: q } }); } else { draw($('pick').value); }
    });
    $('app').hidden = false;
    /* THE INDEX FIRST — all 72 by crest and division, with your own club as a
       card at the top of it.

       It used to open straight on your own entry, on the reasoning that this
       is what a club came for. Half right: it IS what they came for, and
       landing on it made the other 71 look like they were not there. The page
       is a directory, and a directory that opens inside one entry has hidden
       what it is. Richard: "the landing page should be the place, not our own
       club — a much better presented index page."

       Nothing is lost: drawIndex puts your club above the divisions, so it is
       still the first thing on the page and one press away. And a URL that
       names a club still opens that club — fromHash wins, which is what makes
       a shared link a link to the thing it names. */
    if (!names.filter(ready).length) {
      $('pick').value = INDEX;
      $('out').innerHTML = '<p class="cd-empty">No club has been checked yet. ' +
        'They appear here once the National League has been through them.</p>';
      return;
    }
    var first = fromHash() || INDEX;
    $('pick').value = first;
    draw(first);
    window.addEventListener('hashchange', function () {
      var n = fromHash();
      if (n) { $('pick').value = n; draw(n); }
    });
  }).catch(function (err) {
    $('out').innerHTML = '<p class="cd-empty">' + esc((err && err.message) || String(err)) + '</p>';
    $('app').hidden = false;
  });

  /* Published means the League has been through it, said so, and released it.
     There is no half-state to test for any more: a club is either in the file
     this page was given or it is not, and the ones that are not were never
     sent. `pending` is a list of names only, so an unfinished club can still
     be named rather than looking like a club that does not exist. */
  function ready(n) {
    return Object.prototype.hasOwnProperty.call(ALL, n);
  }

  /* A club per URL, so a link to one club is a link to that club — including
     one nobody has checked yet. The first cut refused those and fell back to
     the first club in the list, which meant that until the first sign-off
     landed every link anyone shared went somewhere else without saying so.
     The gate belongs on the contents, not on the address: the club is
     honoured, and draw() says it is not ready rather than rendering it. */
  function fromHash() {
    var raw = (location.hash || '').replace(/^#/, '');
    if (raw === 'all') return INDEX;
    var h = decodeURIComponent(raw);
    return (names.indexOf(h) > -1 || PENDING.indexOf(h) > -1) ? h : '';
  }

  /* Which club is reading. A club code carries the club's key as its claim and
     the club's name alongside it, so this is a lookup rather than a guess —
     but the directory is keyed by NAME and the claim's name comes from the
     codes config, so match on the name first and fall back to resolving the
     key through the roster. A Directory reader code carries no club and lands
     on the index, which is correct: they are not a club. */
  function ownClub() {
    if (!SESSION) return '';
    var known = names.concat(PENDING);
    var want = String(SESSION.name || '').trim().toLowerCase();
    var byName = known.filter(function (n) { return n.toLowerCase() === want; })[0];
    if (byName) return byName;

    var rec = ROSTER.filter(function (c) { return c.code === SESSION.role; })[0];
    if (!rec) return '';
    return known.filter(function (n) { return n.toLowerCase() === rec.name.toLowerCase(); })[0] || '';
  }

  /* A club's own two colours, as custom properties for its tile. ONE source —
     NLDirectory.clubColours is the same function the club banner asks, so the
     wall and the entry it opens can never disagree about a club. */
  function tileStyle(name) {
    var pal = NLDirectory.clubColours && NLDirectory.clubColours(name);
    if (!pal) { return ''; }
    return ' style="--tile-bg:' + esc(pal.bg) + ';--tile-fg:' + esc(pal.fg) + '"';
  }
  /* Thirteen clubs play in white, and a white band on a white tile is not a
     band however well the ink reads. They keep their white — that is their
     kit — and the tile draws a hairline instead. The test is IS IT WHITE, not
     is it light: Harrogate's #FFF700 and Harborough's #FBF700 are lighter
     than most of the palette, and yellow is precisely what those two clubs
     are. What makes a band vanish is being colourless, so this asks for high
     in every channel AND almost no spread between them. */
  function isWhiteGround(name) {
    var pal = NLDirectory.clubColours && NLDirectory.clubColours(name);
    var h = String((pal && pal.bg) || '').replace('#', '');
    if (h.length === 3) { h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2]; }
    if (!/^[0-9a-f]{6}$/i.test(h)) { return false; }
    var ch = [0, 2, 4].map(function (i) { return parseInt(h.substr(i, 2), 16); });
    var lo = Math.min.apply(null, ch), hi = Math.max.apply(null, ch);
    return lo > 218 && (hi - lo) < 26;
  }

  /* The index: all 72, in divisions, by crest. Built from the ROSTER rather
     than from the directory, so a club nobody has checked yet is still shown
     and still greyed — a club missing from this page looks like a club that
     does not exist, which is the same reasoning the picker already follows.
     Clubs the roster does not carry but the directory does (a name change
     mid-season) are added at the end rather than dropped. */
  function drawIndex() {
    var seen = {}, groups = [], byDiv = {};
    ROSTER.forEach(function (c) {
      seen[c.name.toLowerCase()] = true;
      var d = c.division || 'National League';
      if (!byDiv[d]) { byDiv[d] = []; groups.push(d); }
      byDiv[d].push(c.name);
    });
    var strays = names.concat(PENDING).filter(function (n) { return !seen[n.toLowerCase()]; });
    if (strays.length) {
      var other = 'Also in the directory';
      byDiv[other] = strays;
      groups.push(other);
    }

    /* YOUR CLUB, FIRST. The index is the landing page now, so the club
       reading it has to find itself without hunting through 72 tiles for its
       own crest. One wide card above the divisions, not a thin banner: it is
       the single thing most readers came for, and it should look like it. */
    var mine = (OWN && (ready(OWN) || PENDING.indexOf(OWN) > -1))
      ? '<section class="rd-mine">' +
          '<h2 class="rd-div__h">Your club</h2>' +
          (ready(OWN)
            ? '<button type="button" class="rd-mine__go"' + tileStyle(OWN) +
              ' data-club="' + esc(OWN) + '">'
            : '<span class="rd-mine__go" aria-disabled="true"' + tileStyle(OWN) + '>') +
            NL.clubs.crestImgHtml(OWN, 'medium',
              { className: 'nl-crest rd-mine__crest', eager: true }) +
            '<span class="rd-mine__text">' +
              '<span class="rd-mine__name">' + esc(OWN) + '</span>' +
              '<span class="rd-mine__note">' +
                (ready(OWN) ? 'View your entry' : 'Not yet checked') +
              '</span>' +
            '</span>' +
          (ready(OWN) ? '</button>' : '</span>') +
        '</section>'
      : '';

    $('out').innerHTML = '<div class="rd-index">' + mine + groups.map(function (d) {
      return '<section class="rd-div">' +
        '<h2 class="rd-div__h">' + esc(d) + '</h2>' +
        '<ul class="rd-grid">' + byDiv[d].slice().sort().map(function (n) {
          var ok = ready(n);
          var inner =
            '<span class="rd-tile__top">' +
              NL.clubs.crestImgHtml(n, 'thumb', { className: 'nl-crest rd-tile__crest' }) +
            '</span>' +
            '<span class="rd-tile__band">' + esc(n) + '</span>';
          /* The state rides in the title, not in a third line. A line of text
             saying so is what made the old rows different heights. */
          var not = ok ? '' : ' title="Not yet checked"';
          return '<li class="rd-tile' + (ok ? '' : ' is-pending') +
              (isWhiteGround(n) ? ' is-white' : '') + '"' + tileStyle(n) + '>' +
            (ok ? '<button type="button" class="rd-tile__go" data-club="' + esc(n) + '">' +
                    inner + '</button>'
                : '<span class="rd-tile__go" aria-disabled="true"' + not + '>' + inner + '</span>') +
            '</li>';
        }).join('') + '</ul></section>';
    }).join('') + '</div>';

    NL.clubs.wireCrestImgs($('out'));
    Array.prototype.forEach.call($('out').querySelectorAll('[data-club]'), function (b) {
      b.addEventListener('click', function () {
        var n = b.getAttribute('data-club');
        $('pick').value = n;
        draw(n);
        window.scrollTo(0, 0);
      });
    });
  }

  function draw(name) {
    if (name === INDEX) {
      if (location.hash !== '#all') history.replaceState(null, '', '#all');
      drawIndex();
      return;
    }
    if (location.hash !== '#' + encodeURIComponent(name)) {
      history.replaceState(null, '', '#' + encodeURIComponent(name));
    }
    var rec = ALL[name];
    if (!rec) {
      $('out').innerHTML = '<p class="cd-empty"><b>' + esc(name) + '</b> is not in the ' +
        'directory yet. The National League goes through each club\'s details before ' +
        'they appear here, and this one has not been done. Please check back.</p>';
      return;
    }
    rec.club = rec.club || name;
    $('out').innerHTML = NLDirectory.renderClub(rec, viewOpts({ club: name }));
    var crest = document.getElementById('cdCrest');
    if (crest) {
      crest.alt = name + ' crest';
      crest.hidden = false;
      NL.clubs.wireCrestImg(crest, name, true);
      crest.src = NL.clubs.crestUrl(name, 'medium');
    }
  }

  function onSearch(e) {
    /* No filtering needed any more: everything this page holds is published.
       The old version searched the whole directory and excluded the unchecked
       clubs by hand, which worked but meant the back door was one forgotten
       filter away from being open. */
    var hits = NLDirectory.search(ALL, e.target.value);
    if (!hits) { draw($('pick').value); return; }
    if (!hits.length) {
      $('out').innerHTML = '<p class="cd-empty">Nothing matched that.</p>';
      return;
    }
    /* Grouped by club, because "which club is this person at" is half of what
       anyone types into this box. */
    var byClub = {};
    hits.forEach(function (h) { (byClub[h.club] = byClub[h.club] || []).push(h.person); });
    $('out').innerHTML = '<div class="rd-hits">' + Object.keys(byClub).sort().map(function (c) {
      var cards = VIEW === 'cards';
      return '<div class="cd-dept"><h3 class="cd-dept__h">' + esc(c) + '</h3>' +
        '<ul class="' + (cards ? 'cd-cards' : 'cd-rows') + '">' +
        byClub[c].sort(NLDirectory.bySurname).map(function (p) {
          return cards ? NLDirectory.personCard(p, viewOpts({ club: c }))
                       : NLDirectory.personRow(p, (NLDirectory.rolesOf(p)[0] || {}).section,
                           viewOpts({ club: c }));
        }).join('') + '</ul></div>';
    }).join('') + '</div>';
  }
}());
</script>
</body>
</html>
