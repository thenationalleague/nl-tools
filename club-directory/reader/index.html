  v1.0 — (04/08/2026) The directory, read-only, behind a shared six-digit code.

  What this is
  ------------
  The replacement for the printed handbook's club pages. Anyone the League
  gives the code to can read every club; nobody can change anything.

  Which code
  ----------
  Either of two, checked by two different triggers, on one card:
    · a CLUB code — app-data/club-codes, claim `club`, the estate's one club
      credential. Tried first, because it is the one being issued now.
    · a DIRECTORY reader code — app-data/ops-club-directory, claim `dir`, for
      readers who are not a club. Costs a second round trip, which is the right
      way round.
  Neither is checked in the browser. The rules on `published` accept a `club`
  claim, any `dir` claim, or an NL portal role.

  Why a code and not auth-guard
  -----------------------------
  The people who need this mostly have no portal account, and issuing 300
  accounts to solve a reading problem is the wrong trade. The code is a real
  boundary, not a screen: it is checked server-side by functions/club-directory
  .js and exchanged for a token the RTDB rules enforce, so this page cannot
  read a single record until that has happened. See functions/club-code.js and
  functions/club-directory.js; the card itself is canon NL.codeGate.

  It is noindex because the directory carries people's work contact details.
  That is a curtain rather than a door, and the code is the door.

  Not lint-covered: no auth-guard, by design.

<body>

<div id="gateWrap"></div>

<div id="app" hidden>
  <div class="nl-idbar">
    <div class="nl-idbar__id">
      <div class="nl-idbar__title">Club Directory</div>
      <div class="nl-idbar__sub">Signed in by code</div>
    </div>
    <div class="nl-idbar__actions">
      <select class="rd-pick" id="pick" aria-label="Choose a club"></select>
      <button class="nl-idbar__btn" id="signOut" type="button">Sign out</button>
    </div>
  </div>
  <div class="cd-wrap">
    <div class="cd-search"><div class="cd-search__box">
      <svg class="cd-search__icon" width="17" height="17" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
      <input class="cd-search__in" id="q" placeholder="Search clubs, people and job titles"
        aria-label="Search">
    </div></div>
    <div id="out"></div>
  </div>
</div>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var esc = NL.escHtml;
  var ALL = {}, names = [], PENDING = [], PUBLISHED_AT = 0;
  var ROSTER = [], SESSION = null;

  /* The index is a club-shaped thing in the picker and the URL without being a
     club, so it needs a value no club can collide with. A leading '#' is
     already reserved by the hash it lives in. */
  var INDEX = '#all';

  /* Remembered per person, not per club. The alternative is choosing it again
     on every one of 72. */
  var VIEW = 'list';
  try { VIEW = localStorage.getItem('nlcd-view') || 'list'; } catch (e) {}

  /* The switcher is drawn by renderClub, above the people it applies to, and
     is rebuilt on every draw — so this listens on the container rather than on
     buttons that will not exist yet. */
  function wireView(redraw) {
    var host = $('out');
    if (!host) { return; }
    host.addEventListener('click', function (e) {
      var b = e.target.closest('[data-view-switch] button');
      if (!b) { return; }
      VIEW = b.dataset.v;
      try { localStorage.setItem('nlcd-view', VIEW); } catch (e2) {}
      redraw();
    });
  }

  /* `club` is the club being RENDERED, not the club reading. showQuiet is
     loud only where those are the same: "Not published" and "None held" are a
     to-do list on your own entry and a column of noise on the other 71. */
  function viewOpts(extra) {
    var o = { cards: VIEW === 'cards', viewSwitch: true };
    for (var k in (extra || {})) { o[k] = extra[k]; }
    if (o.club != null) { o.showQuiet = isOwn(o.club); delete o.club; }
    else { o.showQuiet = false; }
    return o;
  }

  /* Resolved once ROSTER and the directory are both in, so it is a name
     comparison rather than a guess. Empty for a Directory reader code, which
     carries no club — so nobody who is not a club sees any of it. */
  var OWN = '';
  function isOwn(name) { return !!OWN && name === OWN; }

  /* Two doors, one card. A club types the SAME six characters that open the
     Handbook and Programme Packs; anyone else the League has given a
     Directory reader code to keeps using it. Both are checked server-side by
     their own trigger, and the gate tries the club code first because that is
     the one being issued now — a Directory code costs a second round trip,
     which is the right way round.

     The letters are why this changed. _gate.js strips everything but digits,
     so a club code typed here silently lost most of itself and came back "not
     recognised" — the code was right and the lock was wrong. */
  /* The tool rides along with the code so the usage log can say which door
     a club came in by — see noteUse in functions/club-code.js. */
  var clubVerify = NL.codeGate.viaFunction('app-data/club-codes', { tool: 'directory' });
  var dirVerify = NL.codeGate.viaFunction(NLGate.ROOT);

  NL.codeGate.resume('club')
    .then(function (s) { return s || NLGate.resume(); })
    .then(function (s) {
      return s || NL.codeGate.open({
        mount: $('gateWrap'),
        title: 'Club Directory',
        /* ACCESS CODE, not club code. The same six characters are held by the
           72 clubs AND by named people at the League — and the League is not
           a club, so a card asking a colleague for their "club code" is
           asking them for something they do not have. Found the day a new NL
           holder was created (22/08/2026).

           And no "digit" anywhere: the codes are alphanumeric. Saying digit
           is the same wrongness that made the old _gate.js strip the letters
           out of a typed code — see the note above — and it sends someone
           looking for a number they were never given. */
        sub: 'Enter your access code.',
        numeric: false,
        /* THE FIRST DOOR'S ANSWER IS THE ONE THAT GETS SHOWN.

           A rejected code fell through to the Directory door, and that door
           normalises to DIGITS ONLY — so an alphanumeric access code arrived
           there as the two or three digits it happened to contain, failed the
           length check, and the person was told "Enter your six-digit code."
           They had entered a code, it was six characters, and none of that
           was the reason it failed. Reported live, 26/08/2026.

           Fixing the string alone would leave the shape of the bug: whichever
           door is tried LAST writes the message, and the last door is the
           legacy one. So the fallback is allowed to succeed and never to
           speak — a failure reports what the club-code door said, which is
           the door the code was issued by. */
        verify: function (code) {
          return clubVerify(code)['catch'](function (first) {
            return dirVerify(code)['catch'](function () { throw first; });
          });
        }
      });
    }).then(function (session) {
    /* codeGate does not take its own card down — the caller owns the mount and
       knows what replaces it. */
    $('gateWrap').hidden = true;
    $('signOut').addEventListener('click', function () {
      NL.codeGate.signOut().then(function () { location.reload(); });
    });
    SESSION = session || null;
    return Promise.all([
      NL.clubs.forSeason(),
      /* The published copy, not the directory. This page used to read the
         directory itself and decide in the browser what not to show — which
         meant every record it decided against had already been sent. It now
         reads a copy the editor built to be handed over: signed-off clubs
         only, and no contact details at all for anyone the club asked us to
         keep back. There is nothing here to hide, which is the point. */
      firebase.database().ref(NLGate.ROOT + '/published').once('value')
    ]);
  }).then(function (res) {
    ROSTER = res[0] || [];
    var pub = res[1].val() || {};
    ALL = pub.clubs || {};
    PENDING = pub.pending || [];
    PUBLISHED_AT = pub.at || 0;
    names = Object.keys(ALL).sort();
    /* Both of these need the roster AND the directory, so they happen here
       rather than at the gate: the bar was saying "Signed in by code" to
       someone who had just signed in by code, and a resumed session carries
       no name at all — the claim is the club KEY, and the name comes back
       through the roster. */
    OWN = ownClub();
    var sub = document.querySelector('.nl-idbar__sub');
    if (sub) sub.textContent = OWN || (SESSION && SESSION.name) || 'The National League';
    if (!names.length) {
      $('out').innerHTML = '<p class="cd-empty">The directory has not been published ' +
        'yet. The National League goes through each club\u2019s details before they ' +
        'appear here. Please check back.</p>';
      $('app').hidden = false;
      return;
    }
    /* Every club is listed, because a club missing from the list looks like a
       club that does not exist. The ones nobody has checked yet are disabled:
       visibly there, greyed, and unselectable — which says "not ready" rather
       than "not a club". */
    $('pick').innerHTML =
      '<option value="' + esc(INDEX) + '">All clubs</option>' +
      NLDirectory.orgFirst(names.concat(PENDING), function (n) { return ALL[n]; })
        .map(function (n) {
        var ok = ready(n);
        return '<option value="' + esc(n) + '"' + (ok ? '' : ' disabled') + '>' +
          esc(n) + (ok ? '' : ' — not yet checked') + '</option>';
      }).join('');
    $('pick').addEventListener('change', function () { draw(this.value); });
    $('q').addEventListener('input', onSearch);
    wireView(function () {
      var q = $('q').value;
      if (q.trim()) { onSearch({ target: { value: q } }); } else { draw($('pick').value); }
    });
    $('app').hidden = false;
    /* THE INDEX FIRST — all 72 by crest and division, with your own club as a
       card at the top of it.

       It used to open straight on your own entry, on the reasoning that this
       is what a club came for. Half right: it IS what they came for, and
       landing on it made the other 71 look like they were not there. The page
       is a directory, and a directory that opens inside one entry has hidden
       what it is. Richard: "the landing page should be the place, not our own
       club — a much better presented index page."

       Nothing is lost: drawIndex puts your club above the divisions, so it is
       still the first thing on the page and one press away. And a URL that
       names a club still opens that club — fromHash wins, which is what makes
       a shared link a link to the thing it names. */
    if (!names.filter(ready).length) {
      $('pick').value = INDEX;
      $('out').innerHTML = '<p class="cd-empty">No club has been checked yet. ' +
        'They appear here once the National League has been through them.</p>';
      return;
    }
    var first = fromHash() || INDEX;
    $('pick').value = first;
    draw(first);
    window.addEventListener('hashchange', function () {
      var n = fromHash();
      if (n) { $('pick').value = n; draw(n); }
    });
  }).catch(function (err) {
    $('out').innerHTML = '<p class="cd-empty">' + esc((err && err.message) || String(err)) + '</p>';
    $('app').hidden = false;
  });

  /* Published means the League has been through it, said so, and released it.
     There is no half-state to test for any more: a club is either in the file
     this page was given or it is not, and the ones that are not were never
     sent. `pending` is a list of names only, so an unfinished club can still
     be named rather than looking like a club that does not exist. */
  function ready(n) {
    return Object.prototype.hasOwnProperty.call(ALL, n);
  }

  /* A club per URL, so a link to one club is a link to that club — including
     one nobody has checked yet. The first cut refused those and fell back to
     the first club in the list, which meant that until the first sign-off
     landed every link anyone shared went somewhere else without saying so.
     The gate belongs on the contents, not on the address: the club is
     honoured, and draw() says it is not ready rather than rendering it. */
  function fromHash() {
    var raw = (location.hash || '').replace(/^#/, '');
    if (raw === 'all') return INDEX;
    var h = decodeURIComponent(raw);
    return (names.indexOf(h) > -1 || PENDING.indexOf(h) > -1) ? h : '';
  }

  /* Which club is reading. A club code carries the club's key as its claim and
     the club's name alongside it, so this is a lookup rather than a guess —
     but the directory is keyed by NAME and the claim's name comes from the
     codes config, so match on the name first and fall back to resolving the
     key through the roster. A Directory reader code carries no club and lands
     on the index, which is correct: they are not a club. */
  function ownClub() {
    if (!SESSION) return '';
    var known = names.concat(PENDING);
    var want = String(SESSION.name || '').trim().toLowerCase();
    var byName = known.filter(function (n) { return n.toLowerCase() === want; })[0];
    if (byName) return byName;

    var rec = ROSTER.filter(function (c) { return c.code === SESSION.role; })[0];
    if (!rec) return '';
    return known.filter(function (n) { return n.toLowerCase() === rec.name.toLowerCase(); })[0] || '';
  }

  /* The wall, the tile colours and the white-ground test are all
     NLDirectory now (v1.10) — club-directory/public draws the same wall, and
     two copies of a club's colours is how Carlisle comes out readable in one
     place and 1.17:1 in the other. */
  function drawIndex() {
    $('out').innerHTML = NLDirectory.renderIndex({
      roster: ROSTER,
      extra: names.concat(PENDING),
      /* Published org records ride along by name + crest key; renderIndex
         pins them as their own first group and keeps them out of "Also in
         the directory". */
      orgs: names.filter(function (n) { return NLDirectory.isOrg(ALL[n]); })
        .map(function (n) { return { name: n, crestName: ALL[n].crestName }; }),
      isReady: ready,
      own: (OWN && (ready(OWN) || PENDING.indexOf(OWN) > -1)) ? OWN : ''
    });
    NLDirectory.wireIndex($('out'), function (n) {
      $('pick').value = n;
      draw(n);
      window.scrollTo(0, 0);
    });
  }

  function draw(name) {
    if (name === INDEX) {
      if (location.hash !== '#all') history.replaceState(null, '', '#all');
      drawIndex();
      return;
    }
    if (location.hash !== '#' + encodeURIComponent(name)) {
      history.replaceState(null, '', '#' + encodeURIComponent(name));
    }
    var rec = ALL[name];
    if (!rec) {
      $('out').innerHTML = '<p class="cd-empty"><b>' + esc(name) + '</b> is not in the ' +
        'directory yet. The National League goes through each club\'s details before ' +
        'they appear here, and this one has not been done. Please check back.</p>';
      return;
    }
    rec.club = rec.club || name;
    $('out').innerHTML = NLDirectory.renderClub(rec, viewOpts({ club: name }));
    var crest = document.getElementById('cdCrest');
    if (crest) {
      var ck = NLDirectory.bannerCrestOf(rec);
      crest.alt = name + ' crest';
      crest.hidden = false;
      NL.clubs.wireCrestImg(crest, ck, true);
      crest.src = NL.clubs.crestUrl(ck, 'medium');
    }
  }

  function onSearch(e) {
    /* No filtering needed any more: everything this page holds is published.
       The old version searched the whole directory and excluded the unchecked
       clubs by hand, which worked but meant the back door was one forgotten
       filter away from being open. */
    var hits = NLDirectory.search(ALL, e.target.value);
    if (!hits) { draw($('pick').value); return; }
    if (!hits.length) {
      $('out').innerHTML = '<p class="cd-empty">Nothing matched that.</p>';
      return;
    }
    /* Grouped by club, because "which club is this person at" is half of what
       anyone types into this box. */
    var byClub = {};
    hits.forEach(function (h) { (byClub[h.club] = byClub[h.club] || []).push(h.person); });
    $('out').innerHTML = '<div class="rd-hits">' + Object.keys(byClub).sort().map(function (c) {
      var cards = VIEW === 'cards';
      return '<div class="cd-dept"><h3 class="cd-dept__h">' + esc(c) + '</h3>' +
        '<ul class="' + (cards ? 'cd-cards' : 'cd-rows') + '">' +
        byClub[c].sort(NLDirectory.bySurname).map(function (p) {
          return cards ? NLDirectory.personCard(p, viewOpts({ club: c }))
                       : NLDirectory.personRow(p, (NLDirectory.rolesOf(p)[0] || {}).section,
                           viewOpts({ club: c }));
        }).join('') + '</ul></div>';
    }).join('') + '</div>';
  }
}());
</script>
</body>
</html>
