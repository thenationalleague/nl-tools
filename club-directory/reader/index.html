<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Club Directory — The National League</title>
  <!-- Favicons. Static, not injected: nl-topbar.js adds these too, but a
       standalone page never loads it, and an icon that arrives with the JS
       leaves the tab blank until it does. /favicon.ico at the root is the
       backstop every browser asks for without being told. -->
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/favicon-16x16.png">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
<!--
  club-directory / reader / index.html
  v1.3 — (15/08/2026) The bar is white with a red underline, not red. Red is
         reserved for a signed-in NL account and this page is entered with a
         six-digit code — it was wearing the wrong colour, and the editor next
         door was wearing navy for the same door. Canon .nl-idbar, nl-brand.css
         v2.37. Full canon structure — __id / __title / __sub / __actions — so the
         controls sit right and the title is not left carrying the row's flex
         on its own. The club selector gains a border: white-on-red drew its
         own edge and white-on-white does not.

  v1.2 — (05/08/2026) Reads the published copy, not the directory. This page
         used to pull every club and decide in the browser what to leave out,
         which meant the records it decided against had already crossed the
         wire — including the contact details of the people who asked us not
         to publish them. The gate made that survivable rather than fine. It
         now reads app-data/ops-club-directory/published, which the editor
         builds to be handed over: published clubs only, and no contact fields
         at all for anyone held back. `pending` carries the names of clubs not
         yet released, so one can still be listed and greyed rather than
         looking like a club that does not exist.
  v1.1 — (05/08/2026) A deep link to a club nobody has checked yet is now
         honoured, and the page says so. It used to be refused and fall back
         to the first club in the list — which, with nothing signed off,
         meant every link anyone shared silently went somewhere else. The
         gate belongs on the contents, not the address.
  v1.0 — (04/08/2026) The directory, read-only, behind a shared six-digit code.

  What this is
  ------------
  The replacement for the printed handbook's club pages. Anyone the League
  gives the code to can read every club; nobody can change anything.

  Why a code and not auth-guard
  -----------------------------
  The people who need this mostly have no portal account, and issuing 300
  accounts to solve a reading problem is the wrong trade. The code is a real
  boundary, not a screen: it is checked server-side by functions/club-directory
  .js and exchanged for a token the RTDB rules enforce, so this page cannot
  read a single record until that has happened. See _gate.js.

  It is noindex because the directory carries people's work contact details.
  That is a curtain rather than a door, and the code is the door.

  Not lint-covered: no auth-guard, by design.
-->
<link rel="stylesheet" href="/system/nl-brand.css?v=39">
<link rel="stylesheet" href="/club-directory/_directory.css?v=29">

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="/system/nl-utils.js?v=33"></script>
<script src="/club-directory/_gate.js?v=29"></script>
<script src="/club-directory/_directory.js?v=29"></script>
<script>
  firebase.initializeApp({
    apiKey:            "AIzaSyC3az3OMnU7TdqlaWp8yrO_EjgZ36l-mXU",
    authDomain:        "nl-tools.firebaseapp.com",
    databaseURL:       "https://nl-tools-default-rtdb.europe-west1.firebasedatabase.app",
    projectId:         "nl-tools",
    storageBucket:     "nl-tools.firebasestorage.app",
    messagingSenderId: "801354670005",

<style>
  /* The identity bar is canon (.nl-idbar). reader was red — the signed-in colour — on a page entered with a six-digit code.
     Same tool, same door, two different colours — which is exactly the
     confusion the entry-route rule in nl-brand.css v2.37 exists to stop.
     Both are white with a red underline now: you typed a code, and the page
     knows that and nothing more. */
  /* The club selector sits in the bar and needs a visible edge now the ground
     is white — it had none, because white-on-red drew its own. */
  .rd-pick {
    font-family: var(--font); font-size: var(--text-sm);
    font-weight: 600; font-variation-settings: 'wght' 600;
    padding: 6px 10px; border: 1px solid var(--border); border-radius: var(--radius);
    background: var(--white); color: var(--text); max-width: 260px;
  }
  /* The search bar clears the sticky bar above it rather than the 72px topbar
     this page does not have. */
  .cd-search { top: 46px; }
  .rd-hits { margin: 0 0 30px; }
  .rd-hit__club {
    font-size: var(--text-xs); text-transform: uppercase; letter-spacing: var(--tracking-tight);
    font-weight: 700; font-variation-settings: 'wght' 700; color: var(--primary);
  }
  @media (max-width: 560px) { .cd-search { top: 0; position: static; } }
</style>
</head>
<body>

<div id="gateWrap"></div>

<div id="app" hidden>
  <div class="nl-idbar">
    <div class="nl-idbar__id">
      <div class="nl-idbar__title">Club Directory</div>
      <div class="nl-idbar__sub">Signed in by code</div>
    </div>
    <div class="nl-idbar__actions">
      <select class="rd-pick" id="pick" aria-label="Choose a club"></select>
      <button class="nl-idbar__btn" id="signOut" type="button">Sign out</button>
    </div>
  </div>
  <div class="cd-wrap">
    <div class="cd-search"><div class="cd-search__box">
      <svg class="cd-search__icon" width="17" height="17" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
      <input class="cd-search__in" id="q" placeholder="Search clubs, people and job titles"
        aria-label="Search">
    </div></div>
    <div class="cd-vw" id="view" role="group" aria-label="How to show people">
      <button type="button" data-v="list">List</button>
      <button type="button" data-v="cards">Cards</button>
    </div>
    <div id="out"></div>
  </div>
</div>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var esc = NL.escHtml;
  var ALL = {}, names = [], PENDING = [], PUBLISHED_AT = 0;

  /* Remembered per person, not per club. The alternative is choosing it again
     on every one of 72. */
  var VIEW = 'list';
  try { VIEW = localStorage.getItem('nlcd-view') || 'list'; } catch (e) {}

  function wireView(redraw) {
    var box = $('view');
    if (!box) { return; }
    var paint = function () {
      box.querySelectorAll('button').forEach(function (b) {
        var on = b.dataset.v === VIEW;
        b.classList.toggle('is-on', on);
        b.setAttribute('aria-pressed', on ? 'true' : 'false');
      });
    };
    box.querySelectorAll('button').forEach(function (b) {
      b.addEventListener('click', function () {
        VIEW = b.dataset.v;
        try { localStorage.setItem('nlcd-view', VIEW); } catch (e) {}
        paint(); redraw();
      });
    });
    paint();
  }

  function viewOpts(extra) {
    var o = { cards: VIEW === 'cards', capsSurname: true };
    for (var k in (extra || {})) { o[k] = extra[k]; }
    return o;
  }

  NLGate.ensure({
    title: 'Club Directory',
    sub: 'Enter the six-digit code from the National League.',
    mount: $('gateWrap')
  }).then(function () {
    $('gateWrap').hidden = true;
    $('signOut').addEventListener('click', function () {
      NLGate.signOut().then(function () { location.reload(); });
    });
    return Promise.all([
      NL.clubs.load(),
      /* The published copy, not the directory. This page used to read the
         directory itself and decide in the browser what not to show — which
         meant every record it decided against had already been sent. It now
         reads a copy the editor built to be handed over: signed-off clubs
         only, and no contact details at all for anyone the club asked us to
         keep back. There is nothing here to hide, which is the point. */
      firebase.database().ref(NLGate.ROOT + '/published').once('value')
    ]);
  }).then(function (res) {
    var pub = res[1].val() || {};
    ALL = pub.clubs || {};
    PENDING = pub.pending || [];
    PUBLISHED_AT = pub.at || 0;
    names = Object.keys(ALL).sort();
    if (!names.length) {
      $('out').innerHTML = '<p class="cd-empty">The directory has not been published ' +
        'yet. The National League goes through each club\u2019s details before they ' +
        'appear here. Please check back.</p>';
      $('app').hidden = false;
      return;
    }
    /* Every club is listed, because a club missing from the list looks like a
       club that does not exist. The ones nobody has checked yet are disabled:
       visibly there, greyed, and unselectable — which says "not ready" rather
       than "not a club". */
    $('pick').innerHTML = names.concat(PENDING).sort().map(function (n) {
      var ok = ready(n);
      return '<option value="' + esc(n) + '"' + (ok ? '' : ' disabled') + '>' +
        esc(n) + (ok ? '' : ' — not yet checked') + '</option>';
    }).join('');
    $('pick').addEventListener('change', function () { draw(this.value); });
    $('q').addEventListener('input', onSearch);
    wireView(function () {
      var q = $('q').value;
      if (q.trim()) { onSearch({ target: { value: q } }); } else { draw($('pick').value); }
    });
    $('app').hidden = false;
    var first = fromHash() || names.filter(ready)[0];
    if (!first) {
      $('out').innerHTML = '<p class="cd-empty">No club has been checked yet. ' +
        'They appear here once the National League has been through them.</p>';
      return;
    }
    $('pick').value = first;
    draw(first);
    window.addEventListener('hashchange', function () {
      var n = fromHash();
      if (n) { $('pick').value = n; draw(n); }
    });
  }).catch(function (err) {
    $('out').innerHTML = '<p class="cd-empty">' + esc((err && err.message) || String(err)) + '</p>';
    $('app').hidden = false;
  });

  /* Published means the League has been through it, said so, and released it.
     There is no half-state to test for any more: a club is either in the file
     this page was given or it is not, and the ones that are not were never
     sent. `pending` is a list of names only, so an unfinished club can still
     be named rather than looking like a club that does not exist. */
  function ready(n) {
    return Object.prototype.hasOwnProperty.call(ALL, n);
  }

  /* A club per URL, so a link to one club is a link to that club — including
     one nobody has checked yet. The first cut refused those and fell back to
     the first club in the list, which meant that until the first sign-off
     landed every link anyone shared went somewhere else without saying so.
     The gate belongs on the contents, not on the address: the club is
     honoured, and draw() says it is not ready rather than rendering it. */
  function fromHash() {
    var h = decodeURIComponent((location.hash || '').replace(/^#/, ''));
    return (names.indexOf(h) > -1 || PENDING.indexOf(h) > -1) ? h : '';
  }

  function draw(name) {
    if (location.hash !== '#' + encodeURIComponent(name)) {
      history.replaceState(null, '', '#' + encodeURIComponent(name));
    }
    var rec = ALL[name];
    if (!rec) {
      $('out').innerHTML = '<p class="cd-empty"><b>' + esc(name) + '</b> is not in the ' +
        'directory yet. The National League goes through each club\'s details before ' +
        'they appear here, and this one has not been done. Please check back.</p>';
      return;
    }
    rec.club = rec.club || name;
    $('out').innerHTML = NLDirectory.renderClub(rec, viewOpts());
    var crest = document.getElementById('cdCrest');
    if (crest) {
      crest.alt = name + ' crest';
      crest.hidden = false;
      NL.clubs.wireCrestImg(crest, name, true);
      crest.src = NL.clubs.crestUrl(name, 'medium');
    }
  }

  function onSearch(e) {
    /* No filtering needed any more: everything this page holds is published.
       The old version searched the whole directory and excluded the unchecked
       clubs by hand, which worked but meant the back door was one forgotten
       filter away from being open. */
    var hits = NLDirectory.search(ALL, e.target.value);
    if (!hits) { draw($('pick').value); return; }
    if (!hits.length) {
      $('out').innerHTML = '<p class="cd-empty">Nothing matched that.</p>';
      return;
    }
    /* Grouped by club, because "which club is this person at" is half of what
       anyone types into this box. */
    var byClub = {};
    hits.forEach(function (h) { (byClub[h.club] = byClub[h.club] || []).push(h.person); });
    $('out').innerHTML = '<div class="rd-hits">' + Object.keys(byClub).sort().map(function (c) {
      var cards = VIEW === 'cards';
      return '<div class="cd-dept"><h3 class="cd-dept__h">' + esc(c) + '</h3>' +
        '<ul class="' + (cards ? 'cd-cards' : 'cd-rows') + '">' +
        byClub[c].sort(NLDirectory.bySurname).map(function (p) {
          return cards ? NLDirectory.personCard(p, viewOpts())
                       : NLDirectory.personRow(p, (NLDirectory.rolesOf(p)[0] || {}).section,
                           viewOpts());
        }).join('') + '</ul></div>';
    }).join('') + '</div>';
  }
}());
</script>
</body>
</html>
