<!DOCTYPE html>
<!--
  NL Tools — redirect stub
  Version: v2.0 (11/11/2026)
  File: /club-directory/reader/index.html

  The club-code page of the Club Directory was here until 11/11/2026, when it
  moved to /club-directory/ (the club's page at the tool's own address, staff
  at /club-directory/admin/). Clubs hold links to this address, so it stays.
  GitHub Pages cannot send a 301, so this is a meta refresh plus a script
  that keeps any query or hash (a #club link still opens that club), with a
  real link for a browser that ignores both. No stylesheet, no script from
  /system/: a redirect that waits on an asset can fail to happen.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Club Directory — The National League</title>
  <meta http-equiv="refresh" content="0; url=/club-directory/">
  <link rel="canonical" href="https://nl.tools/club-directory/">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32x32.png">
  <script>location.replace('/club-directory/' + location.search + location.hash);</script>
</head>
<body>
  <p>This page has moved to <a href="/club-directory/">nl.tools/club-directory/</a>.</p>
</body>
</html>
