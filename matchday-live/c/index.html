<!DOCTYPE html>
<!--
  NL Tools — Matchday Live: contributor capture page
  Version: v1.3 (15/10/2026)
  File: /matchday-live/c/index.html

  Public, no login. A contributor opens their personal link
  (https://nl.tools/matchday-live/c/#<token>), records a 30-second vertical
  clip, taps what it is about, and sends it to the staff feed at
  /matchday-live/.

  HOW IT GETS IN
    The token is in the fragment, so it never reaches a server log or a
    Referer. The page signs in anonymously and hands the token to the
    matchdayLiveAuth trigger through NL.codeGate.viaFunction — the same
    handshake as the club-code pages — and gets back a session carrying
    `mdl: <contributorId>` and `mdlGen` (the first 16 hex of the token's
    hash). The RTDB rules check both against the stored hash on every read
    and write, so a rotated or deactivated link stops working on its next
    read. On the next visit the session is reused if its mdlGen still
    matches this link; a different link on the same phone re-exchanges.

  WHAT IT WRITES (all enforced by the rules, not by this page)
    clips/<ymd>/<clipId>    created with status 'uploading', then 'new' once
                            the video is in Storage — the only change a
                            contributor may make to a clip
    pace/<id>, quota/<ymd>/<id>  in the SAME update as the clip: at most one
                            clip per 30 seconds and 20 a day
    consent/<id>            { version, at } on first send of each version
    Storage: matchday-live/<ymd>/<id>/<clipId>.<webm|mp4>, create only

  SURVIVING BAD SIGNAL
    A sent clip goes into IndexedDB first and leaves it only once the record
    is 'new'. Every step is resumable: a record that already exists is
    detected by reading it back, an upload refused because the object is
    already there counts as done. The queue drains on load, on 'online' and
    after every send.

  ADD TO HOME SCREEN
    The manifest deliberately has no start_url. With none, browsers install
    the URL the person is on — fragment and all — which is the only way the
    token comes along without putting it in a query string. The token is
    also kept in localStorage as a fallback. Needs confirming on a real
    iPhone and Android before the pilot (acceptance list in the PR).

  Technical changelog
    v1.0  15/10/2026  Initial build.
    v1.1  15/10/2026  A match stays open for 26 hours after kick-off, and a
                      clip files under its match's day. Test links pick any
                      match from the last 7 days and mark clips test. With no
                      match yet, the page listens for today's fixtures rather
                      than needing a reload; a page left open overnight
                      reloads itself when it comes back into view.
    v1.3  15/10/2026  Clips are drawn onto a fixed 1080×1920 (or 720×1280)
                      upright canvas and recorded from there, so the file
                      carries no rotation flag and cannot arrive sideways.
                      The camera is asked for its native wide 1080p, which
                      ends the cropped "zoomed" look. 30-second cap.
                      ?debug prints camera and file dimensions.
-->

<style>
  html, body { background: var(--off-white); }
  body { min-height: 100dvh; }
  .cap { max-width: 480px; margin: 0 auto; padding: 16px 16px calc(24px + env(safe-area-inset-bottom)); }
  .cap-screen[hidden] { display: none !important; }

  .cap-match {
    background: var(--white); border: 1px solid var(--border); border-radius: var(--radius-lg);
    padding: 20px 16px; text-align: center; margin: 16px 0;
  }
  .cap-match__teams { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
  .cap-match__side { display: flex; flex-direction: column; align-items: center; gap: 6px;

  .cap-match__side img { width: 48px; height: 48px; object-fit: contain; }
  .cap-match__score { font-size: var(--text-display); font-weight: 900; font-variation-settings: 'wght' 900; color: var(--navy); }
  .cap-match__state { margin-top: 12px; }

  .cap-big {
    width: 100%; padding: 22px; font-size: var(--text-lg); border-radius: var(--radius-lg);
  }
  .cap-note { color: var(--text-muted); font-size: var(--text-sm); text-align: center; margin-top: 12px; }
  .cap-list { display: flex; flex-direction: column; gap: 8px; margin: 12px 0; }
  .cap-opt {
    display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
    padding: 14px; border: 2px solid var(--border); border-radius: var(--radius);
    background: var(--white); font-family: var(--font); font-size: var(--text-base); color: var(--text);
  }
  .cap-opt[aria-pressed="true"] { border-color: var(--primary); background: var(--primary-50); }
  .cap-opt__min { min-width: 42px; font-weight: 800; font-variation-settings: 'wght' 800; color: var(--navy); }
  .cap-opt--minor { font-size: var(--text-sm); padding: 10px 14px; }
  .cap-sub { font-size: var(--text-xs); color: var(--text-muted); text-transform: uppercase;
    letter-spacing: 0.08em; font-weight: 800; font-variation-settings: 'wght' 800; margin-top: 16px; }

  /* ── camera ── */
  .cam { position: fixed; inset: 0; background: var(--navy-900); display: flex; flex-direction: column;
    align-items: center; justify-content: center; z-index: 1000; }
  .cam[hidden] { display: none; }
  .cam__frame { position: relative; height: min(100dvh - 140px, (100vw - 16px) * 16 / 9);
    aspect-ratio: 9 / 16; border-radius: var(--radius-lg); overflow: hidden; background: var(--navy-800); }
  .cam__frame video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cam__frame video.is-mirrored { transform: scaleX(-1); }
  /* Keep-clear guide: captions and logos sit in the top and bottom bands. */
  .cam__guide { position: absolute; inset: 14% 6% 20% 6%; border: 1px dashed var(--navy-200);
    border-radius: var(--radius); opacity: 0.45; pointer-events: none; }
  .cam__top { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; align-items: center; }
  .cam__time { background: var(--navy-900); color: var(--white); padding: 4px 10px; border-radius: var(--radius-pill);
    font-weight: 800; font-variation-settings: 'wght' 800; font-variant-numeric: tabular-nums; }
  .cam__bar { position: absolute; left: 0; right: 0; bottom: 0; height: 6px; background: var(--navy-700); }
  .cam__bar span { display: block; height: 100%; width: 0; background: var(--primary); }
  .cam__controls { display: flex; align-items: center; justify-content: space-around; width: 100%;

  .cam__rec { width: 72px; height: 72px; border-radius: 50%; border: 4px solid var(--white); background: var(--primary);
    cursor: pointer; }
  .cam__rec.is-on { border-radius: 16px; transform: scale(0.8); }
  .cam__side { color: var(--white); background: transparent; border: 1px solid var(--navy-400); }
  .cam__upright { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center;
    background: var(--navy-900); color: var(--white); font-size: var(--text-lg); padding: 24px;
    font-weight: 800; font-variation-settings: 'wght' 800; }
  .cam__upright[hidden] { display: none; }

  .cap-preview { display: block; margin: 0 auto; height: min(56dvh, 520px); aspect-ratio: 9 / 16;
    background: var(--navy-900); border-radius: var(--radius-lg); object-fit: cover; }
  .cap-row { display: flex; gap: 10px; margin-top: 16px; }
  .cap-row__btn { flex: 1 1 0; padding-top: 16px; padding-bottom: 16px; }

  .cap-consent__text { white-space: pre-line; max-height: 30dvh; overflow: auto; margin-bottom: 10px; }
  .cap-consent label { display: flex; gap: 10px; align-items: flex-start; font-weight: 700; font-variation-settings: 'wght' 700; }
  .cap-consent input { width: 22px; height: 22px; flex: 0 0 auto; }
  .cap-caption { width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: var(--radius);
    font-family: var(--font); font-size: var(--text-base); margin-top: 8px; }
  .cap-queue { margin-top: 12px; }

<body>

<header class="nl-idbar">
  <img class="nl-idbar__crest" id="idCrest" src="/assets/crests/National%20League%20rose.png" alt="">
  <div class="nl-idbar__id">
    <div class="nl-idbar__title">Matchday Live</div>
    <div class="nl-idbar__sub" id="idSub">The National League</div>
  </div>
</header>

<main class="cap">

  <section class="cap-screen" id="s-wait">
    <div class="empty-state"><div class="spinner"></div><div class="empty-state__msg" id="waitMsg">Checking your link…</div></div>
  </section>

  <section class="cap-screen" id="s-stop" hidden>
    <div class="empty-state">
      <div class="empty-state__icon">🔒</div>
      <div class="empty-state__msg" id="stopMsg"></div>
    </div>
  </section>

  <!-- Screen 1: today's match -->
  <section class="cap-screen" id="s-home" hidden>
    <div class="banner banner--info" id="testNote" hidden>Test link. Your clips are marked TEST and can't be published.</div>
    <div id="matchBox"></div>
    <button class="btn btn--primary cap-big" type="button" id="btnRecord">Record update</button>
    <div class="cap-note" id="sentToday"></div>
    <div class="banner banner--amber cap-queue" id="queueNote" hidden></div>
    <button class="btn btn--ghost btn--sm" type="button" id="btnChangeMatch" hidden style="margin-top:16px;">Change match</button>
  </section>

  <!-- Reporters with no fixed club pick a match -->
  <section class="cap-screen" id="s-pick" hidden>
    <div class="section-head"><h2>Which match?</h2></div>
    <div class="cap-list" id="pickList"></div>
  </section>

  <!-- Screen 3: preview + what's it about -->
  <section class="cap-screen" id="s-review" hidden>
    <video class="cap-preview" id="preview" playsinline controls loop></video>
    <div class="banner banner--error" id="sidewaysNote" hidden style="margin-top:12px;">This came out sideways. Retake it holding the phone upright.</div>
    <div class="cap-note" id="reviewDebug" hidden></div>

    <div class="cap-sub">What's it about?</div>
    <div class="cap-list" id="tagList"></div>

    <input class="cap-caption" id="caption" maxlength="80" placeholder="Caption (optional)" aria-label="Caption">

    <div class="cap-consent" id="consentBox" hidden>
      <div class="cap-consent__text" id="consentText"></div>
      <label><input type="checkbox" id="consentTick"> <span>I agree</span></label>
    </div>

    <div class="cap-row">
      <button class="btn btn--ghost cap-row__btn" type="button" id="btnRetake">Retake</button>
      <button class="btn btn--primary cap-row__btn" type="button" id="btnSend">Send</button>
    </div>
  </section>

</main>

<!-- Screen 2: recording -->
<div class="cam" id="cam" hidden>
  <div class="cam__frame">
    <video id="viewfinder" playsinline muted autoplay></video>
    <div class="cam__guide"></div>
    <div class="cam__top"><span class="cam__time" id="camTime">0:30</span><span class="cam__time" id="camDebug" hidden></span></div>
    <div class="cam__bar"><span id="camBar"></span></div>
    <div class="cam__upright" id="upright" hidden>Hold your phone upright</div>
  </div>
  <div class="cam__controls">
    <button class="btn cam__side" type="button" id="btnCamCancel">Cancel</button>
    <button class="cam__rec" type="button" id="btnRec" aria-label="Start recording"></button>
    <button class="btn cam__side" type="button" id="btnFlip">Flip</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  var ROOT = 'app-data/media-matchday-live';
  var MAX_MS = 30000;
  /* ?debug before the # prints the camera's real numbers on screen — the
     quickest way to see what a particular phone is handing us. */
  var DEBUG = /[?&]debug\b/.test(location.search);
  var KIND = { goal: '⚽ Goal', red: '🟥 Red card', yellow: '🟨 Yellow card' };
  var GENERAL = [['warmup', 'Warm-up'], ['teamnews', 'Team news'], ['halftime', 'Half-time'],
    ['atmosphere', 'Atmosphere'], ['fulltime', 'Full-time']];
  var TOKEN_RE = /^[A-Za-z0-9_-]{32}$/;
  var LS_TOKEN = 'mdl.token';

  var db = firebase.database();
  var me = { id: null, rec: null };
  /* The ingester files matches by UTC date, so "today" is the UTC day. A
     clip files under its MATCH's day, which may be yesterday's. */
  var today = new Date().toISOString().slice(0, 10);
  var LATE_MS = 26 * 3600 * 1000;   // keep in step with the clip-create rule
  var isTest = false;
  var matchId = null, matchYmd = null, match = null, matchRef = null;
  var consentCfg = null, myConsent = null;
  var take = null;          // { blob, mime, durationSec, minute, scoreAtTime }
  var tag = null;           // { eventId } | { pending: true } | { general: kind|null }

  function $(id) { return document.getElementById(id); }
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function show(id) {
    ['s-wait', 's-stop', 's-home', 's-pick', 's-review'].forEach(function (s) { $(s).hidden = s !== id; });
  }
  function stop(msg) { $('stopMsg').textContent = msg; show('s-stop'); }
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function minLabel(min, fm) {
    if (fm) return String(fm).replace("'", '′');
    return typeof min === 'number' ? min + '′' : '';
  }

  /* ── sign in ──────────────────────────────────────────────────────── */
  function sha256hex(text) {
    return crypto.subtle.digest('SHA-256', new TextEncoder().encode(text)).then(function (buf) {
      return Array.prototype.map.call(new Uint8Array(buf), function (x) { return ('0' + x.toString(16)).slice(-2); }).join('');
    });
  }

  function currentClaims() {
    return new Promise(function (resolve) {
      var off = firebase.auth().onAuthStateChanged(function (u) {
        off();
        if (!u || u.isAnonymous) { resolve(null); return; }
        u.getIdTokenResult().then(function (t) { resolve(t.claims); }, function () { resolve(null); });
      });
    });
  }

  function exchange(token) {
    $('waitMsg').textContent = 'Checking your link… the first time can take up to 20 seconds.';
    return NL.codeGate.viaFunction(ROOT)(token).then(currentClaims);
  }

  function signIn() {
    var fromHash = (location.hash || '').slice(1);
    var token = TOKEN_RE.test(fromHash) ? fromHash : lsGet(LS_TOKEN);
    if (!token || !TOKEN_RE.test(token)) {
      return Promise.reject(new Error('Open the personal link you were sent. If you no longer have it, ask the National League for a new one.'));
    }
    lsSet(LS_TOKEN, token);
    return sha256hex(token).then(function (hash) {
      var gen = hash.slice(0, 16);
      return currentClaims().then(function (c) {
        if (c && c.mdl && c.mdlGen === gen) return c;
        return firebase.auth().signOut().then(function () { return exchange(token); });
      }).then(function (c) {
        if (!c || !c.mdl) throw new Error('Something went wrong. Please try again.');
        me.id = c.mdl;
        return db.ref(ROOT + '/contributors/' + me.id).once('value')['catch'](function () {
          /* Refused: this session was minted from a link that has since been
             replaced. Try once more with the link in hand — if that link is
             the replacement, it works; if not, the trigger says so. */
          return firebase.auth().signOut().then(function () { return exchange(token); })
            .then(function (c2) {
              me.id = c2 && c2.mdl;
              return db.ref(ROOT + '/contributors/' + me.id).once('value');
            });
        });
      });
    }).then(function (snap) {
      me.rec = snap.val() || {};
    });
  }

  /* ── boot ─────────────────────────────────────────────────────────── */
  function boot() {
    signIn().then(function () {
      var club = me.rec.club;
      isTest = me.rec.test === true;
      $('idSub').textContent = 'Hi ' + String(me.rec.name || '').split(' ')[0] + (club ? ' · ' + club : '');
      $('testNote').hidden = !isTest;
      if (club) {
        var crest = $('idCrest');
        crest.src = NL.clubs.crestUrl(club, 'thumb');
        NL.clubs.wireCrestImg(crest, club, false);
      }
      return Promise.all([
        NL.clubs.load()['catch'](function () {}),
        db.ref(ROOT + '/config/consent').once('value').then(function (s) { consentCfg = s.val(); }),
        db.ref(ROOT + '/consent/' + me.id).once('value').then(function (s) { myConsent = s.val(); })
      ]);
    }).then(function () {
      if (!consentCfg || !consentCfg.text) {
        stop('Matchday Live is not switched on yet. The National League will let you know when it is.');
        return;
      }
      wireButtons();
      watchToday();
      choose();
      Queue.drain();
    })['catch'](function (e) {
      stop(e && e.message ? e.message : 'Something went wrong. Please try again.');
    });
  }

  function myClubOpta() {
    if (me.rec.clubOpta) return me.rec.clubOpta;
    var c = me.rec.club && NL.clubs.byName ? NL.clubs.byName(me.rec.club) : null;
    return c ? c.optaID : null;
  }

  function utcDay(offset) { return new Date(Date.now() - offset * 86400000).toISOString().slice(0, 10); }

  /* Which days to look in: today and yesterday for everyone (a match stays
     open until 26 hours after kick-off), the last week for a test link. */
  function loadDays() {
    var days = [];
    for (var i = 0; i <= (isTest ? 7 : 1); i++) days.push(utcDay(i));
    return Promise.all(days.map(function (d) {
      return db.ref(ROOT + '/matchdays/' + d).once('value').then(function (s) { return [d, s.val() || {}]; });
    }));
  }

  /* Same test as the clip-create rule (and matchday-live-core.js openForClips). */
  function openForClips(m) {
    if (isTest) return true;
    var ko = typeof m.koMs === 'number' ? m.koMs : Date.parse(m.ko);
    return !isNaN(ko) && Date.now() < ko + LATE_MS;
  }

  function isMine(m) {
    var opta = myClubOpta();
    return !!opta && (m.home.id === opta || m.away.id === opta);
  }

  function candidates(days) {
    var out = [];
    days.forEach(function (pair) {
      Object.keys(pair[1]).forEach(function (id) {
        var m = pair[1][id];
        if (m && m.home && m.away && openForClips(m)) out.push({ ymd: pair[0], id: id, m: m });
      });
    });
    return out;
  }

  /* A club contributor gets their club's match without being asked — today's
     if there is one, otherwise yesterday's while it is still open. A reporter,
     or anyone on a test link, picks. */
  function choose() {
    loadDays().then(function (days) {
      var list = candidates(days);
      if (myClubOpta() && !isTest) {
        var mine = list.filter(function (c) { return isMine(c.m); }).sort(function (x, y) {
          if ((x.ymd === today) !== (y.ymd === today)) return x.ymd === today ? -1 : 1;
          return (y.m.koMs || 0) - (x.m.koMs || 0);
        });
        $('btnChangeMatch').hidden = true;
        setMatch(mine[0] || null);
        return;
      }
      var saved = null;
      try { saved = sessionStorage.getItem('mdl.match'); } catch (e) {}
      var hit = list.filter(function (c) { return c.ymd + '|' + c.id === saved; })[0];
      if (hit) { $('btnChangeMatch').hidden = false; setMatch(hit); return; }
      if (!list.length) { setMatch(null); return; }
      renderPick(list);
    })['catch'](function (e) { stop('Could not load matches: ' + e.message); });
  }

  function dayLabel(d) {
    if (d === today) return 'Today';
    if (d === utcDay(1)) return 'Yesterday';
    return NL.formatDate(d);
  }

  function renderPick(list) {
    var box = $('pickList');
    box.textContent = '';
    list.sort(function (x, y) {
      if (x.ymd !== y.ymd) return x.ymd < y.ymd ? 1 : -1;
      if (x.m.live !== y.m.live) return x.m.live ? -1 : 1;
      return String(x.m.ko).localeCompare(String(y.m.ko)) || String(x.m.home.name).localeCompare(String(y.m.home.name));
    });
    var lastDay = null;
    list.forEach(function (c) {
      var m = c.m;
      if (c.ymd !== lastDay) { box.appendChild(el('div', 'cap-sub', dayLabel(c.ymd))); lastDay = c.ymd; }
      var b = el('button', 'cap-opt');
      b.type = 'button';
      b.appendChild(el('span', 'cap-opt__min', m.live ? minLabel(m.minute, m.fm) || 'Live'
        : m.finished ? 'FT' : m.postponed ? 'P–P' : NL.formatTime(m.ko)));
      var score = m.home.score != null && m.away.score != null ? ' ' + m.home.score + '–' + m.away.score + ' ' : ' v ';
      b.appendChild(el('span', null, m.home.name + score + m.away.name));
      b.addEventListener('click', function () {
        try { sessionStorage.setItem('mdl.match', c.ymd + '|' + c.id); } catch (e) {}
        $('btnChangeMatch').hidden = false;
        setMatch(c);
      });
      box.appendChild(b);
    });
    show('s-pick');
  }

  function setMatch(c) {
    if (matchRef) matchRef.off();
    matchRef = null;
    match = null;
    matchId = c ? c.id : null;
    matchYmd = c ? c.ymd : null;
    if (!c) { renderHome(); show('s-home'); waitForToday(); return; }

    if (dayRef) return;

    dayRef.on('value', function (s) {
      var day = s.val() || {};
      var useful = Object.keys(day).some(function (id) {
        var m = day[id];
        return m && m.home && m.away && openForClips(m) && (!myClubOpta() || isTest || isMine(m));

    if (!$('cam').hidden || !$('s-review').hidden) return;

    db.ref(ROOT + '/quota/' + today + '/' + me.id).on('value', function (s) {

    });

  /* ── Screen 1 ─────────────────────────────────────────────────────── */

      e.appendChild(el('div', 'empty-state__msg', myClubOpta() && !isTest

    function step(item) {
      if (item.stage === 'new') {
        return create(item).then(function (r) {
          if (r === 'created') { item.stage = 'created'; return put(item).then(function () { return step(item); }); }
          if (r === 'retry') return put(item).then(function () { return step(item); });
          if (r === 'full') {
            return remove(item.clipId).then(function () {
              NL.alert('That’s 20 clips today — the daily limit. This one was not sent.');
            });
          }
          later(30000);
          throw new Error('wait');
        });
      }
      if (item.stage === 'created') {
        return upload(item).then(function () {
          item.stage = 'uploaded';
          return put(item).then(function () { return step(item); });
        }, function (e) {
          if (e && e.fatal) {
            return remove(item.clipId).then(function () {
              NL.alert('A clip could not be sent — the upload was refused. If this keeps happening, tell the National League.');
            });
          }
          item.tries = (item.tries || 0) + 1;
          return put(item).then(function () { throw e; });
        });
      }
      if (item.stage === 'uploaded') {
        return finishOne(item).then(function () {
          return remove(item.clipId).then(function () { NL.toast('Sent – thanks', 'success'); });
        });
      }
      return remove(item.clipId);
    }

    function drain() {
      if (running) return;
      if (!navigator.onLine) { note(); return; }
      running = true;
      all().then(function (items) {
        note();
        items.sort(function (a, b) { return a.clipId < b.clipId ? -1 : 1; });
        return items.reduce(function (p, item) {
          return p.then(function () { return step(item); });
        }, Promise.resolve());
      }).then(function () {
        running = false;
        note();
      }, function (e) {
        running = false;
        note();
        if (!e || e.message !== 'wait') later(navigator.onLine ? 15000 : 60000);
      });
    }

    window.addEventListener('online', drain);
    window.addEventListener('offline', note);

    return {
      add: function (item) { put(item).then(function () { note(); drain(); }); },
      drain: drain
    };
  })();

  /* ── wiring ───────────────────────────────────────────────────────── */
  function wireButtons() {
    $('btnRecord').addEventListener('click', Cam.open);
    $('btnRec').addEventListener('click', Cam.toggle);
    $('btnFlip').addEventListener('click', Cam.flip);
    $('btnCamCancel').addEventListener('click', Cam.cancel);
    $('btnRetake').addEventListener('click', function () { take = null; Cam.open(); });
    $('btnSend').addEventListener('click', Review.send);
    $('btnChangeMatch').addEventListener('click', function () {
      try { sessionStorage.removeItem('mdl.match'); } catch (e) {}
      loadDays().then(function (days) { renderPick(candidates(days)); });
    });
  }

  boot();
})();
</script>
