<!DOCTYPE html>
<!--
  NL Tools — Club Codes
  Version: v0.6 (21/08/2026) — the activity panel says when the code was last
  changed. rotatedAt has been written on every reset since launch and shown
  nowhere, so "when did we last change this?" — the question asked
  immediately before every reset — was unanswerable from the page that does
  the resetting. Absent means never reset, and it says nothing rather than
  rendering a missing timestamp as 1970. Also swaps the local monospace
  stack for the new --font-mono token (nl-brand v2.61).
  Version: v0.5 (21/08/2026) — the row actions are canon icon buttons. Four
  words repeated 72 times — Activity, Add a person, Reset, Remove — was most
  of a row's width spent on labels, and on a phone it put two of them on a
  line and squeezed the club name between. Every action is now a .btn--icon
  with a title and an aria-label, which frees enough width for Activity to
  take a column of its own instead of riding in the name cell as a word.
  Also fixes the mobile crest: column one was widened to 104px so the code
  chip had room on line two, which left a 74px hole between a 30px crest and
  the club name on line one. The code spans the first two columns instead.
  Version: v0.4 (21/08/2026) — Activity per club and per person. The global
  Recent activity list answers "has anyone been in"; a row's own Activity
  toggle answers "has THIS club been in", which is the question actually
  asked about a code somebody is about to reset. Loaded on demand and cached
  per club, so 72 clubs cost nothing until one is opened and a person's
  history is filtered out of their club's rather than fetched again.
  Version: v0.3 (21/08/2026) — a LIST, not 72 cards. Each club was a bordered
  card holding a wrapped flex row with no layout of its own below the width
  that row needs, so on a phone all four children became their own band: one
  club was five stacked rows and about 400px, and "CLUB CODE" was printed 72
  times above the only code on the card. Rows in division groups now, with
  explicit grid areas at both widths. The code and action columns are FIXED so
  a club and the people under it line up down the page — they were separate
  grids sizing to their own content, and nothing agreed with anything.
  Version: v0.2 (21/08/2026) — Recent activity. Nothing recorded a club code
  being used until now: both doors minted a token and returned, so every
  sign-in since launch is unrecorded and cannot be recovered. This starts the
  record and does not backdate it.
  Version: v0.1 (21/08/2026)
  File: /club-codes/index.html

  Issue, reveal and reset the one code each club uses for every club-facing
  tool: Programme Packs, the Handbook, the Club Directory.

  ONE CREDENTIAL, TWO KINDS OF HOLDER
  -----------------------------------
  Each club has a MASTER code — the one the 72 already hold, issued for
  Programme Packs and relocated on 21/08/2026 when it became the estate's
  single club credential. It is shared, it is in the wild, and resetting it
  means telling a whole club.

  Alongside it, a club can have NAMED people, each with their own code. A
  named code grants exactly what the master grants — the claim carries the
  same club, so every rule and every permission is identical. What it adds is
  attribution: the audit trail names a person rather than a club, and the
  identity bar can say who is looking. Resetting one person's code costs one
  conversation instead of seventy-two.

  Both live on the same record. A named code is not a lesser code and not a
  role; if someone needs different PERMISSIONS they need an account, which is
  a different door (system/roles-and-access-plan.md).

  REVEALED, NOT SHOWN ONCE
  ------------------------
  The codes are readable here whenever an admin looks. A show-once flow would
  be security theatre over a credential that is emailed to clubs and printed
  on sheets, and it would mean reissuing a code every time someone mislaid the
  email — which is the reissue this page exists to make rare.

  RESETTING IS NOT INSTANT. A custom claim lives in the holder's token until
  it refreshes, up to an hour. A reset stops the NEXT sign-in, not the session
  already open. The confirmation says so.

  Storage (RTDB) — NOT under this tool's own key:
    app-data/club-codes/clubs/<KEY>          { name, passcode|code, users? }
    app-data/club-codes/clubs/<KEY>/users/*  { name, code, addedAt }
    app-data/club-codes/nl                   the shared National League code
    app-data/club-codes/usage/<pushId>       { club, at, tool, userId }
                                             one row per successful sign-in,
                                             written ONLY by the two functions.
                                             Indexed on `at` (the global list)
                                             and `club` (one club's history)
    tools/ops-club-codes                     tool registration

  The codes are shared property, not this tool's data, which is why they do
  not sit under a node named after this tool's key. This page is one of three
  writers —
  the Programme Packs console writes here too, and functions/club-code.js and
  functions/programme.js read it. Rules: a portal admin/superadmin, or a
  pClub '*' session. No client outside that can read a single code.

  Access (RTDB tools/ops-club-codes defaults):
    superadmin + admin → admin. Everyone else → off.
-->
<html lang="en">

  <!-- NL system scripts (lint canonical: ?v=39 / ?v=9 / ?v=12) -->

  <script src="/system/auth-guard.js?v=16"></script>

<style>
  /* #pageWrap default hide is in nl-brand.css; auth-guard reveals with
     style.display = 'block'. Don't clear with '' — would re-trigger the
     brand rule and re-hide the page. */

  /* Tool-local. A code list with people nested under clubs is not a shape a
     second tool has asked for, so the first use stays here — see the policy
     block atop nl-brand.css. Brand tokens throughout. */
  .cc-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .cc-find {
    font-family: var(--font); font-size: var(--text-sm);
    padding: 8px 12px; min-width: 240px;
    border: 1px solid var(--border); border-radius: var(--radius);
    background: var(--white); color: var(--text);
  }
  .cc-find:focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; }

  .cc-note { color: var(--text-muted); font-size: var(--text-sm); }
  .cc-use { margin-top: 4px; }
  .cc-use__row {
    display: grid; grid-template-columns: 30px minmax(0,1.4fr) minmax(0,1fr) auto auto;
    gap: 12px; align-items: center;
    padding: 8px 0; border-bottom: 1px solid var(--border);
    font-size: var(--text-sm);
  }
  .cc-use__club { color: var(--navy); font-variation-settings: 'wght' 700; }
  .cc-use__who { color: var(--text); min-width: 0; }
  .cc-use__who--master { color: var(--text-muted); font-style: italic; }
  .cc-use__tool {
    font-size: var(--text-xs); text-transform: uppercase;
    letter-spacing: var(--tracking-wide); color: var(--text-muted);
  }
  .cc-use__when { color: var(--text-muted); font-size: var(--text-xs); white-space: nowrap; }
  @media (max-width: 640px) {
    /* Two lines, both of them full: club and who, then the tool and when.
       Left to wrap, the timestamp orphaned onto a line of its own. */
    .cc-use__row {
      grid-template-columns: 24px minmax(0, 1fr) auto;
      grid-template-areas:
        "crest club who"
        ".     tool when";
      row-gap: 2px;
    }
    .cc-use__row > img { grid-area: crest; }
    .cc-use__club { grid-area: club; }
    .cc-use__who  { grid-area: who; text-align: right; }
    .cc-use__tool { grid-area: tool; }
    .cc-use__when { grid-area: when; }
  }
  .cc-note--bad { color: var(--red); }

  /* A LIST, NOT 72 CARDS. Each club was a bordered card holding a wrapped
     flex row — crest, name, code, actions — with no layout of its own below
     the width that row needs. On a phone all four children became their own
     band, so one club was five stacked rows and about 400px. Seventy-two of
     those is a scroll with no shape to it, and "CLUB CODE" printed 72 times
     above the only code on the card.

     Rows in division groups instead — the shape the Club Directory index
     already uses. Explicit grid areas at BOTH widths, so the layout is a
     decision rather than whatever wrapping happens to produce. */
  /* Capped as ONE column, heading included. Canon .page runs to 1700px; left
     to fill that, the name column absorbs every spare pixel and the code ends
     up a hand's width from the club it belongs to. The cap goes on a local
     wrapper rather than on .section-head, which is canon — otherwise the
     search row and the list it controls end at different places. */
  .cc-wrap { max-width: 900px; }
  .cc-div { margin: 0 0 26px; }
  .cc-div__h {
    font-size: var(--text-xs); text-transform: uppercase;
    letter-spacing: var(--tracking-wide);
    font-weight: 700; font-variation-settings: 'wght' 700;
    color: var(--text-muted); margin: 0 0 4px;
    padding-bottom: 6px; border-bottom: 1px solid var(--border);
  }
  /* FIXED code and action columns, shared by the club row and the person
     rows nested under it. With `auto` they are two separate grids sizing to
     their own content — "Add a person / Reset" and "Reset / Remove" are
     different widths — so nothing lined up down the page. Same complaint as
     the handbook's three left edges, one tool over. */
  /* SIX columns, and every action gets its own. Sharing a column meant the
     same button sat at two different x positions depending on whose row it
     was; one column per job is what makes a club row and the person rows
     nested under it read as one table.

       act1  Activity   — always
       act2  the other holder action (add one, remove one)
       act3  Reset      — always

     Fixed widths, because a club row and its people are separate grids and
     only a fixed track makes two grids agree. 32px is the canon .btn--icon
     (30px) with a hairline to spare. */
  .cc-row, .cc-user {
    display: grid; align-items: center;
    grid-template-columns: 30px minmax(0, 1fr) 104px 32px 32px 32px;
    gap: 8px 10px; padding: 9px 6px;
  }
  .cc-row { grid-template-areas: "crest name code act1 act2 act3"; }
  /* THE RULE GOES UNDER THE CLUB, NOT UNDER ITS ROW. On .cc-row the hairline
     landed between a club and its own people — so the divider said the
     people belonged to the club BELOW them, and the last person in a club
     ran straight into the next division heading with nothing between. */
  .cc-club { border-bottom: 1px solid var(--border); }
  .cc-row:hover { background: var(--navy-50); }
  /* A club with no code yet is the row you came to act on. */
  .cc-row.is-missing { background: var(--amber-light); }
  .cc-row__crest { grid-area: crest; --crest-size: 30px; }
  .cc-row__name {
    grid-area: name; min-width: 0; overflow-wrap: anywhere;
    color: var(--navy); font-variation-settings: 'wght' 700;
  }
  .cc-row__code { grid-area: code; }
  .cc-row__act1, .cc-user__act1 { grid-area: act1; }
  .cc-row__act2, .cc-user__act2 { grid-area: act2; }
  .cc-row__act3, .cc-user__act3 { grid-area: act3; }
  .cc-row__act1, .cc-row__act2, .cc-row__act3,
  .cc-user__act1, .cc-user__act2, .cc-user__act3 { display: flex; justify-content: flex-end; }
  /* The missing-code row has one action, and it is the point of the row, so
     it is the one that keeps its words. It runs from the code column to the
     end — the three icon tracks are 96px between them and this is a text
     button — and the row drops the "No code" chip rather than sitting a
     label next to a button that already says it. */
  .cc-row__issue { grid-area: code / code / act3 / act3; display: flex; justify-content: flex-end; }

  /* The code is a button because its first job is to be copied — reading it
     off the screen and retyping it into an email is how a digit gets dropped
     and a club is told their correct code is wrong. */
  .cc-code {
    font-family: var(--font-mono);
    font-size: var(--text-sm); letter-spacing: 0.08em; font-weight: 700;
    padding: 5px 10px; cursor: pointer;
    background: var(--navy-50); color: var(--navy);
    border: 1px solid var(--navy-100); border-radius: var(--radius-sm);
  }
  .cc-code:hover { border-color: var(--navy-300); background: var(--navy-100); }
  .cc-code:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  .cc-none { font-size: var(--text-sm); color: var(--text-muted); font-style: italic; white-space: nowrap; }

  /* THE ACTIONS ARE CANON BUTTONS. This page hand-rolled .cc-mini, and the
     first pass at fixing that hand-rolled .cc-act in its place — a control
     with a transparent border until hover, which on a still screen reads as
     text rather than as something you can press. Richard: "they are also just
     written and not buttons. Surely button for action is in our canon?"

     It is: .btn--ghost is the low-emphasis default the canon names for
     toolbar actions, and .btn--danger is the destructive one.

     DANGER IS FOR REMOVE ONLY. The first pass gave it to Reset as well, on
     the reasoning that resetting invalidates a live credential a whole club
     holds. The result was two identical buttons side by side on every person
     row — same ground, same text colour, same border — for two actions with
     very different consequences. That is worse than the flatness it was
     meant to fix: you cannot misread a button you can tell apart.

     Canon names danger for "deletes, rejections". Reset is neither; it
     re-issues, and the holder carries on with a new code. Remove deletes a
     person. Only one of them is a delete, so only one of them is red, and
     the confirmation dialog — which names the club and says the old code
     stops working — is what actually guards the reset.

     The buttons keep their own width and right-align in their fixed column.
     Stretching them to fill meant a `.cc-row .btn { width: 100% }` rule, and
     lint refused it — correctly: that is a page redefining a canon component,
     which is how a tool stops tracking the design system while still looking
     like it uses it. The right edge is what makes Reset line up anyway.

     AND THEY ARE GLYPHS. Four words down a row — Activity, Add a person,
     Reset, Remove — is most of the row's width spent on labels that repeat
     identically 72 times, and on a phone it was two of them per line with
     the club name squeezed between. .btn--icon is canon for exactly this
     (30px square, colour variant supplied separately) and the sprite already
     has every glyph this page needs.

     The trade is real and worth stating: an icon-only button has no hover
     tooltip on a touch screen, so on a phone Reset and Remove are a glyph
     and nothing else. What guards them is the confirmation — both name the
     club or the person and say what stops working — not the label. Every
     button carries title AND aria-label, so a mouse and a screen reader both
     get the words. */

  /* Named people sit UNDER their club, indented to the club's name column so
     the shape of the page says what the model is: one club, one shared code,
     and the people who have their own. */

  /* Loaded on demand, so 72 clubs cost nothing until one is opened.

     TINTED, because untinted it was a set of plain rows sitting directly
     above the club's PEOPLE — same indent, same type, same names — and there
     was no telling where the log ended and the list of people began. A panel
     that opens has to look like a panel. */
  .cc-log {
    margin: 2px 0 10px 44px; padding: 8px 12px;
    /* WHITE, not the navy tint — that is the row hover colour, so a tinted
       panel reads as a hovered row. White against the page's own ground, with
       a hairline, says "this opened" without borrowing another state. */
    background: var(--white); border: 1px solid var(--border);
    border-radius: var(--radius-sm);
  }
  .cc-log__cap {
    font-size: var(--text-xs); text-transform: uppercase;
    letter-spacing: var(--tracking-wide); font-weight: 700;
    font-variation-settings: 'wght' 700;
    color: var(--text-muted); margin: 0 0 4px;
    display: flex; gap: 10px; flex-wrap: wrap; align-items: baseline;
  }
  /* Sentence case against the caption's caps: it is a fact, not a heading,
     and it sits to the right so the caption still reads first. */
  .cc-log__rot {
    margin-left: auto; text-transform: none; letter-spacing: normal;
    font-weight: 600; font-variation-settings: 'wght' 600;
  }
  .cc-log__row {
    display: grid; grid-template-columns: minmax(0, 1fr) auto auto;
    gap: 6px 14px; padding: 4px 6px; align-items: baseline;
    font-size: var(--text-sm);
  }
  .cc-log__who { min-width: 0; overflow-wrap: anywhere; }
  .cc-log__who--master { color: var(--text-muted); font-style: italic; }
  .cc-log__tool {
    font-size: var(--text-xs); text-transform: uppercase;
    letter-spacing: var(--tracking-wide); color: var(--text-muted);
  }
  .cc-log__when { color: var(--text-muted); font-size: var(--text-xs); white-space: nowrap; }
  .cc-log__none { font-size: var(--text-sm); color: var(--text-muted); font-style: italic; padding: 4px 6px; }
  @media (max-width: 640px) {
    .cc-log { margin-left: 12px; }
    .cc-log__row { grid-template-columns: minmax(0, 1fr) auto; }
    .cc-log__tool { grid-row: 2; }
  }

  .cc-users { list-style: none; margin: 0; padding: 2px 0 10px; }
  .cc-user { grid-template-areas: ". name code act1 act2 act3"; padding: 5px 6px; }
  .cc-user__name {
    grid-area: name; min-width: 0; overflow-wrap: anywhere;
    font-size: var(--text-sm); padding-left: 14px;
  }
  .cc-user__code { grid-area: code; }


  @media (max-width: 640px) {
    /* Two deliberate lines: who it is, then the code and what you can do with
       it. Not four bands of wrapping.

       THE CREST SITS AGAINST THE NAME. The first version widened column one
       to 104px so the code chip on line two had room, which left a 74px hole
       between a 30px crest and the club name on line one — the misalignment
       in Richard's screenshot. The fix is to keep the crest column at its
       own 30px and let the CODE span the first two columns instead: the chip
       gets more room than it had, and line one closes up. */
    .cc-row, .cc-user { grid-template-columns: 30px minmax(0, 1fr) 32px 32px 32px; }
    .cc-row {
      grid-template-areas:
        "crest name name name name"
        "code  code act1 act2 act3";
      padding: 11px 6px;
    }
    /* The person's row is the same two lines, so a club and its people read
       the same way down a phone. */
    .cc-user {
      grid-template-areas:
        "name name name name name"
        "code code act1 act2 act3";
      padding: 8px 6px;
    }
    .cc-user__name { padding-left: 0; }
    .cc-row__issue { grid-area: code / code / act3 / act3; }
  }

</style>
</head>
<body>

<!-- Topbar — auto-rendered by /system/nl-topbar.js from window.NL_TOOL -->
<div id="nlTopbar"></div>

<div id="pageWrap">
  <div class="page">
   <div class="cc-wrap">

    <div class="section-head">
      <h2>Club codes</h2>
      <div class="cc-actions">
        <input class="cc-find" id="find" type="search" placeholder="Find a club or a person" aria-label="Find a club or a person">
        <button class="btn btn--secondary" id="issueAll" type="button">Issue any missing</button>
      </div>
    </div>

    <div id="out" class="cc-out"><p class="cc-note">Reading club codes…</p></div>

    <div class="section-head">
      <h2>Recent activity</h2>
    </div>
    <!-- Sign-ins, not attempts. A failed code is not a use, and mixing the two

    <div id="use" class="cc-use"><p class="cc-note">Reading recent sign-ins…</p></div>

   </div>
  </div>
</div>

<!-- Main app -->
<script>
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return NL.escHtml(s); };

  /* NL.icon() returns an element and every row here is built as a string, so
     this is the same sprite reference in the shape this page needs. .btn sizes
     the glyph itself (16px), so no size modifier. */
  function ico(name) {
    return '<svg class="icon" aria-hidden="true">' +
      '<use href="/assets/icons/sprites.svg#icon-' + name + '"></use></svg>';
  }

  /* One button, one job, one column. `label` is the words the glyph replaced:
     it becomes both the tooltip and the accessible name, so a mouse and a
     screen reader each get them even though the screen does not. */
  function iconBtn(icon, label, variant, attrs) {
    return '<button class="btn btn--icon btn--' + variant + '" type="button"' +
      ' title="' + esc(label) + '" aria-label="' + esc(label) + '" ' + attrs + '>' +
      ico(icon) + '</button>';
  }

  /* The codes are shared property, not this tool's own data — see the header.
     Written by this page and by the Programme Packs console; read by
     functions/club-code.js and functions/programme.js. */
  var ROOT = 'app-data/club-codes';

  /* Same alphabet the Programme console has always minted from: no O/0, no
     I/1/L, because these get read off a printed sheet and dictated down a
     phone. Changing it would make new codes look unlike the 72 in the wild. */
  var ALPHA = '23456789ABCDEFGHJKMNPQRSTUVWXYZ';
  var LEN = 6;

  var CLUBS = {}, NLREC = null, ROSTER = [], seen = { clubs: false, nl: false };
  var USES = [];
  /* Enough to answer "has anyone been in today" and "who was that", not a
     year's history. The whole log is kept; this is only what is drawn. */
  var USE_LIMIT = 200;
  /* Per-club history, fetched the first time a row is opened and kept for the
     session. OPEN survives render() because render() rebuilds the markup and
     would otherwise close every panel on any change anywhere on the page. */
  var ACT = {}, OPEN = {}, ACT_LIMIT = 25;
  var FIND = '';

  /* The stored field is `passcode` on everything the Programme console has
     ever written and `code` on anything minted since. Both functions read
     both; so does this page, and it writes whichever the record already uses
     so a club's record does not change shape under it. */
  function codeOf(rec) { return (rec && (rec.passcode || rec.code)) || ''; }
  function codeField(rec) { return (rec && rec.code && !rec.passcode) ? 'code' : 'passcode'; }

  function norm(s) {
    return String(s == null ? '' : s).toUpperCase().replace(/[^A-Z0-9]/g, '');
  }

  /* Every code in use, master and named alike. pickClub returns the FIRST
     match, so a collision would silently hand one club another's session —
     the console has refused to mint a duplicate since 04/08/2026 and this
     keeps that promise across the new named codes too. */
  function taken() {
    var out = {};
    Object.keys(CLUBS).forEach(function (k) {
      var rec = CLUBS[k] || {};
      if (codeOf(rec)) out[norm(codeOf(rec))] = true;
      var users = rec.users || {};
      Object.keys(users).forEach(function (id) {
        var c = codeOf(users[id]);
        if (c) out[norm(c)] = true;
      });
    });
    if (NLREC && codeOf(NLREC)) out[norm(codeOf(NLREC))] = true;
    return out;
  }

  function mint() {
    var used = taken();
    for (var i = 0; i < 200; i++) {
      var out = '';
      var buf = new Uint32Array(LEN);
      crypto.getRandomValues(buf);
      for (var j = 0; j < LEN; j++) { out += ALPHA[buf[j] % ALPHA.length]; }
      if (!used[out]) return out;
    }
    /* 31^6 is 887 million and there are fewer than a thousand codes in play,
       so two hundred consecutive collisions is not this world — but returning
       a known duplicate would be worse than throwing. */
    throw new Error('Could not find an unused code');
  }

  /* ── Reading ─────────────────────────────────────────────────────────── */

  function ref(path) { return firebase.database().ref(ROOT + (path ? '/' + path : '')); }

  function watch() {
    /* Per key, not on the parent: app-data/club-codes also holds the
       authRequests and authGrants every client writes during a sign-in, and a
       read on the parent would sweep those up. The rules are on each key by
       name for the same reason. */
    ref('clubs').on('value', function (snap) {
      CLUBS = snap.val() || {};
      seen.clubs = true;
      render();
    }, function (err) { fail('reading the club codes', err); });

    ref('nl').on('value', function (snap) {
      NLREC = snap.val() || null;
      seen.nl = true;
      render();
    }, function (err) { fail('reading the National League code', err); });

    /* Sign-ins, newest last out of RTDB. Bounded by the query rather than by
       the browser: the log is flat and indexed on `at` precisely so this stays
       one small read however many years accumulate under it. */
    ref('usage').orderByChild('at').limitToLast(USE_LIMIT).on('value', function (snap) {
      var v = snap.val() || {};
      USES = Object.keys(v).map(function (k) { return v[k]; })
        .filter(Boolean)
        .sort(function (a, b) { return (b.at || 0) - (a.at || 0); });
      renderUses();
    }, function (err) {
      /* Its own failure, not the page's. The codes are the job here; a
         missing usage rule must not black out the tool that manages them. */
      console.error('[club-codes] reading recent sign-ins', err);
      $('use').innerHTML = '<p class="cc-note cc-note--bad">Could not read recent ' +
        'sign-ins. The rules for app-data/club-codes/usage may not be deployed yet.</p>';
    });
  }

  /* The name is resolved HERE, not stored in the log. The log holds a userId,
     so a person renamed in the code list is renamed everywhere they appear —
     a copy written at sign-in time would be a second version going stale from
     the moment it landed. A userId nobody recognises any more (the person was
     removed) says so rather than showing a bare id. */
  function whoOf(u) {
    if (!u.userId) return { text: 'Master code', master: true };
    var rec = u.club === 'NL' ? NLREC : CLUBS[u.club];
    var person = rec && rec.users && rec.users[u.userId];
    if (person && person.name) return { text: person.name, master: false };
    return { text: 'Removed person', master: true };
  }

  function clubNameOf(key) {
    if (key === 'NL') return (NLREC && NLREC.name) || 'National League';
    var rec = CLUBS[key];
    return (rec && rec.name) || key;
  }

  var TOOL_LABEL = {
    handbook: 'Handbook',
    directory: 'Directory',
    programme: 'Programme',
  };

  function renderUses() {
    if (!seen.clubs || !seen.nl) return;
    if (!USES.length) {
      $('use').innerHTML = '<p class="cc-note">No sign-ins recorded yet. ' +
        'The log starts from when this was switched on — it does not go back.</p>';
      return;
    }
    $('use').innerHTML = USES.map(function (u) {
      var name = clubNameOf(u.club);
      var who = whoOf(u);
      return '<div class="cc-use__row">' +
        NL.clubs.crestImgHtml(name === 'National League' ? '' : name, 'thumb',
          { className: 'nl-crest', alt: '' }) +
        '<span class="cc-use__club">' + esc(name) + '</span>' +
        '<span class="cc-use__who' + (who.master ? ' cc-use__who--master' : '') + '">' +
          esc(who.text) + '</span>' +
        '<span class="cc-use__tool">' +
          esc(TOOL_LABEL[u.tool] || u.tool || '—') + '</span>' +
        '<span class="cc-use__when" title="' + esc(NL.formatDateTime(u.at) || '') + '">' +
          esc(NL.timeAgo(u.at) || '') + '</span>' +
      '</div>';
    }).join('');
    NL.clubs.wireCrestImgs($('use'));
  }

  function fail(what, err) {
    console.error('[club-codes] ' + what, err);
    $('out').innerHTML = '<p class="cc-note cc-note--bad">Could not read the codes (' +
      esc((err && err.message) || what) + '). This page needs a National League ' +
      'admin account, and the RTDB rules for app-data/club-codes must be deployed.</p>';
  }

  /* ── Rendering ───────────────────────────────────────────────────────── */

  function rows() {
    var out = [];
    if (NLREC) {
      out.push({ key: 'NL', name: NLREC.name || 'National League',
                 division: 'Shared', rec: NLREC, isNL: true });
    }
    ROSTER.forEach(function (c) {
      out.push({ key: c.code, name: c.name, division: c.division || '',
                 rec: CLUBS[c.code] || null, isNL: false });
    });
    /* A record whose club is not on this season's roster still belongs on the
       page — a relegated club with a live code is exactly the row someone
       needs to find in order to revoke it. */
    var onRoster = {};
    ROSTER.forEach(function (c) { onRoster[c.code] = true; });
    Object.keys(CLUBS).forEach(function (k) {
      if (onRoster[k]) return;
      out.push({ key: k, name: (CLUBS[k] || {}).name || k,
                 division: 'Not on this season’s roster', rec: CLUBS[k], isNL: false });
    });
    return out;
  }

  function matches(row) {
    if (!FIND) return true;
    var hay = [row.name, row.key];
    var users = (row.rec && row.rec.users) || {};
    Object.keys(users).forEach(function (id) { hay.push((users[id] || {}).name || ''); });
    return hay.join(' ').toLowerCase().indexOf(FIND) > -1;
  }

  function codeCell(code, label) {
    if (!code) return '<span class="cc-none">No code</span>';
    return '<button class="cc-code" type="button" data-copy="' + esc(code) + '" ' +
      'title="Copy ' + esc(label) + '">' + esc(code) + '</button>';
  }

  function userRow(clubKey, id, u) {
    var who = u.name || 'this person';
    var ref = ' data-id="' + esc(id) + '"';
    return '<li class="cc-user">' +
      '<span class="cc-user__name">' + esc(u.name || 'Unnamed') + '</span>' +
      '<span class="cc-user__code">' + codeCell(codeOf(u), u.name || 'this code') + '</span>' +
      /* Same three columns as the club row above, in the same order, so a
         column means one thing all the way down the page. */
      '<span class="cc-user__act1">' + actToggle('user', clubKey, id, who) + '</span>' +
      '<span class="cc-user__act2">' + iconBtn('delete', 'Remove ' + who, 'danger',
        'data-drop-user="' + esc(clubKey) + '"' + ref) + '</span>' +
      '<span class="cc-user__act3">' + iconBtn('refresh', 'Reset the code for ' + who, 'ghost',
        'data-reset-user="' + esc(clubKey) + '"' + ref) + '</span>' +
    '</li>' + logPanel('user', clubKey, id);
  }

  /* ── Activity, per club and per person ───────────────────────────────
     The global Recent activity list answers "has anyone been in". This
     answers "has THIS club been in", which is the question that gets asked
     about a code someone is about to reset.

     ON DEMAND, and cached for the session. A per-row query for 72 clubs on
     load would be 72 queries to show nothing anybody asked for; opening one
     row is one indexed query. A person's history is filtered out of their
     club's, so expanding three people at one club is still one read. */
  function actKey(kind, club, id) { return kind + ':' + club + (id ? ':' + id : ''); }

  /* A disclosure, so aria-expanded is the state and the OPEN state is drawn
     with a canon colour variant rather than a page rule: ghost while shut,
     filled while open. Nothing here redefines .btn. */
  function actToggle(kind, club, id, subject) {
    var open = !!OPEN[actKey(kind, club, id)];
    return iconBtn('eye', (open ? 'Hide' : 'Show') + ' recent activity for ' + subject,
      open ? 'navy' : 'ghost',
      'aria-expanded="' + (open ? 'true' : 'false') + '"' +
      ' data-act-kind="' + kind + '" data-act-club="' + esc(club) + '"' +
      (id ? ' data-act-id="' + esc(id) + '"' : ''));
  }

  /* WHEN THE CODE LAST CHANGED. rotatedAt has been written on every reset
     since launch and displayed nowhere, so "when did we last change this?"
     \u2014 the question asked immediately before every reset \u2014 was unanswerable
     from the page that does the resetting.

     It goes in the activity panel rather than on the row: it is the same
     question as "has anyone been in", it is only wanted occasionally, and
     the row has no width left. Absent means never reset, which is a
     different thing from never used, so it says so rather than guessing. */
  function rotatedLine(kind, club, id) {
    var rec = (club === 'NL') ? NLREC : (CLUBS[club] || null);
    var target = (kind === 'user') ? ((rec && rec.users && rec.users[id]) || null) : rec;
    if (!target || !target.rotatedAt) return '';
    return '<span class="cc-log__rot">Code last changed ' +
      esc(NL.timeAgo(target.rotatedAt) || '') + '</span>';
  }

  function logPanel(kind, club, id) {
    var k = actKey(kind, club, id);
    if (!OPEN[k]) return '';
    var all = ACT[club];
    var cap = '<p class="cc-log__cap">' +
      (kind === 'user' ? 'Their sign-ins' : 'Sign-ins with this club\u2019s codes') +
      rotatedLine(kind, club, id) + '</p>';
    if (!all) return '<div class="cc-log">' + cap + '<p class="cc-log__none">Loading\u2026</p></div>';
    var list = (kind === 'user') ? all.filter(function (u) { return u.userId === id; }) : all;
    if (!list.length) {
      return '<div class="cc-log">' + cap + '<p class="cc-log__none">' +
        (kind === 'user' ? 'This person has not signed in yet.'
                         : 'This code has not been used yet.') +
        ' The record starts from when it was switched on.</p></div>';
    }
    return '<div class="cc-log">' + cap + list.map(function (u) {
      var who = whoOf(u);
      return '<div class="cc-log__row">' +
        (kind === 'user' ? '' :
          '<span class="cc-log__who' + (who.master ? ' cc-log__who--master' : '') + '">' +
            esc(who.text) + '</span>') +
        (kind === 'user' ? '<span class="cc-log__who">' + esc(who.text) + '</span>' : '') +
        '<span class="cc-log__tool">' + esc(TOOL_LABEL[u.tool] || u.tool || '\u2014') + '</span>' +
        '<span class="cc-log__when" title="' + esc(NL.formatDateTime(u.at) || '') + '">' +
          esc(NL.timeAgo(u.at) || '') + '</span>' +
      '</div>';
    }).join('') + '</div>';
  }

  function toggleAct(kind, club, id) {
    var k = actKey(kind, club, id);
    if (OPEN[k]) { delete OPEN[k]; render(); return; }
    OPEN[k] = true;
    render();
    if (ACT[club]) return;
    /* Indexed on `club`, so this is a bounded read however long the log
       grows. Newest first, same order as the list above. */
    ref('usage').orderByChild('club').equalTo(club).limitToLast(ACT_LIMIT)
      .once('value').then(function (snap) {
        var v = snap.val() || {};
        ACT[club] = Object.keys(v).map(function (x) { return v[x]; })
          .filter(Boolean)
          .sort(function (a, b) { return (b.at || 0) - (a.at || 0); });
        render();
      })['catch'](function (err) {
        console.error('[club-codes] reading activity for ' + club, err);
        ACT[club] = [];
        render();
        NL.toast && NL.toast('Could not read the activity for this club', 'error');
      });
  }

  /* ONE ROW, not a card. The division is the group heading now, so it stops
     being a line of body text repeated down the page, and the "Club code"
     label goes with it — in a list of club codes, a monospace chip is
     self-evidently the code. */
  function clubRow(row) {
    var rec = row.rec, code = codeOf(rec);
    var users = (rec && rec.users) || {};
    var ids = Object.keys(users).sort(function (a, b) {
      return String((users[a] || {}).name || '').localeCompare(String((users[b] || {}).name || ''));
    });

    var crest = row.isNL
      ? '<img class="nl-crest cc-row__crest" src="/assets/crests/thumbs/National%20League%20rose.png" alt="" decoding="async">'
      : NL.clubs.crestImgHtml(row.name, 'thumb', { className: 'nl-crest cc-row__crest' });

    return '<div class="cc-club">' +
      '<div class="cc-row' + (rec ? '' : ' is-missing') + '">' +
        crest +
        '<div class="cc-row__name">' + esc(row.name) + '</div>' +
        (rec
          ? '<div class="cc-row__code">' + codeCell(code, row.name + '\u2019s club code') + '</div>' +
            '<div class="cc-row__act1">' + actToggle('club', row.key, '', row.name) + '</div>' +
            '<div class="cc-row__act2">' + iconBtn('add', 'Add a person at ' + row.name, 'ghost',
              'data-add="' + esc(row.key) + '"') + '</div>' +
            '<div class="cc-row__act3">' + iconBtn('refresh', 'Reset ' + row.name + '\u2019s club code', 'ghost',
              'data-reset="' + esc(row.key) + '"') + '</div>'
          /* No "No code" chip beside it: the row is amber and the button says
             what is missing. */
          : '<div class="cc-row__issue"><button class="btn btn--sm btn--navy" type="button" data-issue="' + esc(row.key) + '">Issue a code</button></div>') +
      '</div>' +
      logPanel('club', row.key, '') +
      (ids.length
        ? '<ul class="cc-users">' + ids.map(function (id) {
            return userRow(row.key, id, users[id] || {});
          }).join('') + '</ul>'
        : '') +
      '</div>';
  }

  function render() {
    if (!seen.clubs || !seen.nl || !ROSTER.length) return;
    var list = rows().filter(matches);
    if (!list.length) {
      $('out').innerHTML = '<p class="cc-note">Nothing matched that.</p>';
      return;
    }
    /* Grouped, in the roster's own order rather than alphabetically: the
       National League code first, then the divisions as the competition
       lists them, then anything off this season's roster. */
    var order = [], byDiv = {};
    list.forEach(function (r) {
      var d = r.division || 'Other';
      if (!byDiv[d]) { byDiv[d] = []; order.push(d); }
      byDiv[d].push(r);
    });
    $('out').innerHTML = order.map(function (d) {
      return '<section class="cc-div">' +
        '<h3 class="cc-div__h">' + esc(d) + '</h3>' +
        byDiv[d].map(clubRow).join('') +
      '</section>';
    }).join('');
    NL.clubs.wireCrestImgs($('out'));
    wireRows();
    /* The activity list resolves names out of CLUBS, so it can arrive before
       it can be read. Redraw it once the codes are in. */
    renderUses();
  }

  /* ── Writing ─────────────────────────────────────────────────────────── */

  /* Every reset says the same two things, because both are surprising: the
     old code stops working for everyone holding it, and it does NOT stop
     working immediately. A claim lives in a token until it refreshes. */
  var LAG = 'A session already open keeps working for up to an hour — the ' +
    'reset applies to the next sign-in.';

  function issue(key, name) {
    var code = mint();
    var path = key === 'NL' ? 'nl' : 'clubs/' + key;
    var payload = { name: name, passcode: code, addedAt: firebase.database.ServerValue.TIMESTAMP };
    return ref(path).update(payload).then(function () {
      NL.writeAudit('club-code-issue', { club: key, clubName: name });
      NL.toast('Code issued for ' + name, 'success');
    });
  }

  function resetClub(key) {
    var rec = key === 'NL' ? NLREC : CLUBS[key];
    if (!rec) return;
    var name = rec.name || key;
    NL.confirm('Reset <strong>' + esc(name) + '</strong>’s club code?<br><br>' +
      'Everyone at the club is using this one — Programme Packs, the Handbook and ' +
      'the Club Directory all open on it, so you will need to send the new code out. ' +
      LAG + '<br><br>Any named people at the club keep their own codes.',
      { title: 'Reset club code', html: true, confirmText: 'Reset', variant: 'danger' })
      .then(function (ok) {
        if (!ok) return;
        var path = key === 'NL' ? 'nl' : 'clubs/' + key;
        var patch = {};
        patch[codeField(rec)] = mint();
        patch.rotatedAt = firebase.database.ServerValue.TIMESTAMP;
        return ref(path).update(patch).then(function () {
          NL.writeAudit('club-code-reset', { club: key, clubName: name });
          NL.toast('New code issued for ' + name, 'success');
        });
      })['catch'](function (e) { NL.toast('Could not reset: ' + e.message, 'error'); });
  }

  function addUser(key) {
    var rec = key === 'NL' ? NLREC : CLUBS[key];
    if (!rec) return;
    NL.prompt('Their name, as it should appear in the audit trail and on their screen.',
      { title: 'Add a person at ' + (rec.name || key), confirmText: 'Add', placeholder: 'Name' })
      .then(function (name) {
        name = String(name || '').trim();
        if (!name) return;
        var path = (key === 'NL' ? 'nl' : 'clubs/' + key) + '/users';
        return ref(path).push({
          name: name, code: mint(),
          addedAt: firebase.database.ServerValue.TIMESTAMP
        }).then(function () {
          NL.writeAudit('club-code-add-person', { club: key, clubName: rec.name || key, person: name });
          NL.toast(name + ' added', 'success');
        });
      })['catch'](function (e) { NL.toast('Could not add: ' + e.message, 'error'); });
  }

  function userAt(key, id) {
    var rec = key === 'NL' ? NLREC : CLUBS[key];
    return ((rec && rec.users) || {})[id] || null;
  }

  function resetUser(key, id) {
    var u = userAt(key, id);
    if (!u) return;
    NL.confirm('Reset the code for <strong>' + esc(u.name || 'this person') + '</strong>?<br><br>' +
      LAG + '<br><br>Nobody else is affected — the club code and everyone else’s stay as they are.',
      { title: 'Reset code', html: true, confirmText: 'Reset', variant: 'danger' })
      .then(function (ok) {
        if (!ok) return;
        var path = (key === 'NL' ? 'nl' : 'clubs/' + key) + '/users/' + id;
        var patch = {};
        patch[codeField(u)] = mint();
        patch.rotatedAt = firebase.database.ServerValue.TIMESTAMP;
        return ref(path).update(patch).then(function () {
          NL.writeAudit('club-code-reset-person', { club: key, person: u.name || id });
          NL.toast('New code issued for ' + (u.name || 'them'), 'success');
        });
      })['catch'](function (e) { NL.toast('Could not reset: ' + e.message, 'error'); });
  }

  function dropUser(key, id) {
    var u = userAt(key, id);
    if (!u) return;
    NL.confirm('Remove <strong>' + esc(u.name || 'this person') + '</strong>?<br><br>' +
      'Their code stops opening anything. ' + LAG,
      { title: 'Remove person', html: true, confirmText: 'Remove', variant: 'danger' })
      .then(function (ok) {
        if (!ok) return;
        var path = (key === 'NL' ? 'nl' : 'clubs/' + key) + '/users/' + id;
        return ref(path).remove().then(function () {
          NL.writeAudit('club-code-remove-person', { club: key, person: u.name || id });
          NL.toast('Removed', 'success');
        });
      })['catch'](function (e) { NL.toast('Could not remove: ' + e.message, 'error'); });
  }

  function issueMissing() {
    var missing = rows().filter(function (r) { return !r.rec; });
    if (!missing.length) { NL.toast('Every club already has a code', 'info'); return; }
    NL.confirm('Issue a code to ' + missing.length + ' club' + (missing.length === 1 ? '' : 's') +
      ' that do not have one?<br><br>Nothing already issued is touched.',
      { title: 'Issue missing codes', html: true, confirmText: 'Issue' })
      .then(function (ok) {
        if (!ok) return;
        /* One at a time, because each mint has to see the codes the previous
           one just used — minting them all against the same snapshot is how
           two clubs end up sharing a code. */
        return missing.reduce(function (chain, r) {
          return chain.then(function () { return issue(r.key, r.name); });
        }, Promise.resolve());
      })['catch'](function (e) { NL.toast('Could not issue: ' + e.message, 'error'); });
  }

  /* ── Wiring ──────────────────────────────────────────────────────────── */

  function wireRows() {
    var root = $('out');
    root.querySelectorAll('[data-act-kind]').forEach(function (b) {
      b.addEventListener('click', function () {
        toggleAct(b.getAttribute('data-act-kind'), b.getAttribute('data-act-club'),
                  b.getAttribute('data-act-id') || '');
      });
    });
    root.querySelectorAll('[data-copy]').forEach(function (b) {
      b.addEventListener('click', function () { NL.copy(b.getAttribute('data-copy')); });
    });
    root.querySelectorAll('[data-reset]').forEach(function (b) {
      b.addEventListener('click', function () { resetClub(b.getAttribute('data-reset')); });
    });
    root.querySelectorAll('[data-add]').forEach(function (b) {
      b.addEventListener('click', function () { addUser(b.getAttribute('data-add')); });
    });
    root.querySelectorAll('[data-issue]').forEach(function (b) {
      var k = b.getAttribute('data-issue');
      b.addEventListener('click', function () {
        var r = rows().filter(function (x) { return x.key === k; })[0];
        if (r) issue(k, r.name)['catch'](function (e) { NL.toast('Could not issue: ' + e.message, 'error'); });
      });
    });
    root.querySelectorAll('[data-reset-user]').forEach(function (b) {
      b.addEventListener('click', function () {
        resetUser(b.getAttribute('data-reset-user'), b.getAttribute('data-id'));
      });
    });
    root.querySelectorAll('[data-drop-user]').forEach(function (b) {
      b.addEventListener('click', function () {
        dropUser(b.getAttribute('data-drop-user'), b.getAttribute('data-id'));
      });
    });
  }

  window.TOOL = window.TOOL || {};
  window.TOOL.boot = function () {
    $('find').addEventListener('input', function () {
      FIND = this.value.trim().toLowerCase();
      render();
    });
    $('issueAll').addEventListener('click', issueMissing);

    NL.ensureAuth().then(function () {
      return NL.clubs.forSeason();
    }).then(function (clubs) {
      ROSTER = clubs || [];
      render();
      watch();
    })['catch'](function (e) { fail('starting up', e); });
  };

  if (window._toolDeferredSession) {
    window.TOOL.boot(window._toolDeferredSession);
    delete window._toolDeferredSession;
  }
})();
</script>

</body>
</html>
