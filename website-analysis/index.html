<!DOCTYPE html>
<!--
  Website Analysis — NL Tools
  Version: v0.1 (skeleton)
  Date: 03/05/2026
  Description: Phase 1 skeleton. Sets up the agreed IA (Browse + Performance
  with Trends/Timing/Outliers sub-tabs), a page-level period selector, and a
  side-drawer for article detail. No business logic ported yet — subsequent
  commits port Browse from website-archive and Performance views from
  website-insights.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website Analysis — NL Tools</title>

  <!-- Brand stylesheet -->
  <link rel="stylesheet" href="/tools/system/nl-brand.css?v=14">

  <!-- Firebase 10.12.0 SDK (compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

  <!-- Firebase init (standard NL config) -->
  <script>
    var firebaseConfig = {
      apiKey: "AIzaSyC3az3OMnU7TdqlaWp8yrO_EjgZ36l-mXU",
      authDomain: "nl-tools.firebaseapp.com",
      databaseURL: "https://nl-tools-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "nl-tools",
      storageBucket: "nl-tools.firebasestorage.app",
      messagingSenderId: "801354670005",
      appId: "1:801354670005:web:05d8ebad3e7e63610d03fc"
    };
    firebase.initializeApp(firebaseConfig);
  </script>

  <!-- Tool identity + changelog -->
  <script>window.NL_TOOL = { title: 'Website Analysis', toolKey: 'staff-website-analysis' }; var NL_TOOL_KEY = 'staff-website-analysis'; window.NL_CHANGELOG = [{ date: '3 May 2026', version: 'v0.1', items: ['Initial skeleton — Phase 1 build in progress.'] }];</script>

  <!-- NL system scripts -->
  <script src="/tools/system/nl-utils.js?v=5"></script>
  <script src="/tools/system/nl-topbar.js?v=7"></script>
  <script src="/tools/system/auth-guard.js?v=4"></script>

  <style>
    /* ── Page header ─────────────────────────────────────────────────────
       Title block on the left, period selector on the right. Stacks on
       narrow viewports. */
    .wa-pageheader {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: var(--space-4, 16px);
      flex-wrap: wrap;
      padding: var(--space-5, 24px) 0 var(--space-4, 16px);
      border-bottom: 1px solid var(--border);
      margin-bottom: var(--space-5, 24px);
    }
    .wa-pageheader__titles { min-width: 0; flex: 1 1 320px; }
    .wa-pageheader__title {
      margin: 0 0 var(--space-1, 4px);
      font-size: var(--fs-h1, 28px);
      font-weight: var(--fw-bold, 700);
      color: var(--text);
      letter-spacing: -0.01em;
    }
    .wa-pageheader__sub {
      margin: 0;
      font-size: var(--fs-body, 14px);
      color: var(--text-muted);
    }

    /* ── Period selector (pill group) ────────────────────────────────────
       Segmented buttons; active state uses brand accent. */
    .period-toggle {
      display: inline-flex;
      align-items: center;
      gap: 0;
      padding: 4px;
      background: var(--off-white);
      border: 1px solid var(--border);
      border-radius: var(--radius-pill, 999px);
      flex: 0 0 auto;
    }
    .period-btn {
      appearance: none;
      border: 0;
      background: transparent;
      color: var(--text-muted);
      padding: 6px 14px;
      font: inherit;
      font-size: var(--fs-small, 13px);
      font-weight: var(--fw-medium, 500);
      border-radius: var(--radius-pill, 999px);
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .period-btn:hover { color: var(--text); }
    .period-btn.is-active {
      background: var(--white);
      color: var(--text);
      box-shadow: var(--shadow-sm, 0 1px 2px rgba(10, 22, 40, 0.08));
    }

    /* ── Top-level tabs (Browse / Performance) ───────────────────────────
       Mirrors the nl-brand .tabs / .tab pattern used by Insights' .ins-tabs:
       a row of underline-style buttons with an active accent underline. */
    .wa-tabs {
      display: flex;
      align-items: center;
      gap: var(--space-2, 8px);
      border-bottom: 1px solid var(--border);
      margin-bottom: var(--space-4, 16px);
    }
    .wa-tab {
      appearance: none;
      background: transparent;
      border: 0;
      border-bottom: 2px solid transparent;
      padding: var(--space-3, 12px) var(--space-4, 16px);
      font: inherit;
      font-size: var(--fs-body, 14px);
      font-weight: var(--fw-medium, 500);
      color: var(--text-muted);
      cursor: pointer;
      margin-bottom: -1px;
      transition: color 0.15s ease, border-color 0.15s ease;
    }
    .wa-tab:hover { color: var(--text); }
    .wa-tab.is-active {
      color: var(--primary);
      border-bottom-color: var(--primary);
      font-weight: var(--fw-semibold, 600);
    }

    /* ── Tab panes ───────────────────────────────────────────────────────*/
    .wa-pane { display: none; }
    .wa-pane.is-active { display: block; }

    /* ── Performance sub-tabs (Trends / Timing / Outliers) ───────────────
       Slightly lighter weight than top-level tabs; same underline pattern. */
    .wa-subtabs {
      display: flex;
      align-items: center;
      gap: var(--space-1, 4px);
      border-bottom: 1px solid var(--border);
      margin-bottom: var(--space-4, 16px);
    }
    .wa-subtab {
      appearance: none;
      background: transparent;
      border: 0;
      border-bottom: 2px solid transparent;
      padding: var(--space-2, 8px) var(--space-3, 12px);
      font: inherit;
      font-size: var(--fs-small, 13px);
      font-weight: var(--fw-medium, 500);
      color: var(--text-muted);
      cursor: pointer;
      margin-bottom: -1px;
      transition: color 0.15s ease, border-color 0.15s ease;
    }
    .wa-subtab:hover { color: var(--text); }
    .wa-subtab.is-active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }

    .wa-subpane { display: none; }
    .wa-subpane.is-active { display: block; }

    /* ── Side-drawer (slides in from right) ──────────────────────────────
       480px wide on desktop, full-width on mobile. Backdrop dims the page. */
    .drawer {
      position: fixed;
      top: 0;
      right: 0;
      height: 100vh;
      width: 480px;
      max-width: 100vw;
      transform: translateX(100%);
      transition: transform 0.25s ease;
      z-index: 200;
      background: var(--white);
      box-shadow: -8px 0 32px rgba(10, 22, 40, 0.18);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }
    .drawer.is-open { transform: translateX(0); }
    .drawer-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(10, 22, 40, 0.35);
      z-index: 199;
    }
    @media (max-width: 600px) {
      .drawer { width: 100vw; }
    }

    .drawer__head {
      display: flex;
      align-items: flex-start;
      gap: var(--space-3, 12px);
      padding: var(--space-4, 16px) var(--space-5, 24px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      background: var(--white);
      z-index: 1;
    }
    .drawer__close {
      appearance: none;
      background: transparent;
      border: 0;
      font-size: 24px;
      line-height: 1;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px 8px;
      border-radius: var(--radius-sm, 6px);
      flex: 0 0 auto;
    }
    .drawer__close:hover {
      color: var(--text);
      background: var(--off-white);
    }
    .drawer__title-wrap { min-width: 0; flex: 1 1 auto; }
    .drawer__title {
      margin: 0 0 var(--space-1, 4px);
      font-size: var(--fs-h3, 18px);
      font-weight: var(--fw-semibold, 600);
      color: var(--text);
      word-break: break-word;
    }
    .drawer__meta {
      font-size: var(--fs-small, 13px);
      color: var(--text-muted);
    }
    .drawer__body {
      padding: var(--space-4, 16px) var(--space-5, 24px);
      flex: 1 1 auto;
    }

    /* ── Browse view (ported from website-archive) ───────────────────────
       Search + filters + cards grid. Section headers below mirror the
       Archive structure for easy diffing during the Phase 1 review. */

    /* ============ FILTERS PANEL ============ */
    .filters {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      margin-bottom: 18px;
      box-shadow: var(--shadow);
    }
    .filters__row {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1fr 1fr;
      gap: 12px;
      align-items: end;
    }
    .filters__row + .filters__row { margin-top: 12px; }
    @media (max-width: 980px) { .filters__row { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 560px) { .filters__row { grid-template-columns: 1fr; } }

    .field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
    .field__label {
      font-size: var(--text-xs); font-weight: 800; font-variation-settings: 'wght' 800;
      text-transform: uppercase; letter-spacing: 0.1em;
      color: var(--text-muted);
    }
    .field input[type=text],
    .field input[type=date],
    .field input[type=search],
    .field select {
      font-family: var(--font);
      font-size: var(--text-sm);
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--white);
      color: var(--text);
      width: 100%;
      min-width: 0;
    }
    .field input:focus, .field select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: var(--focus-ring);
    }

    .scope {
      display: flex; align-items: center; gap: 12px;
      font-size: var(--text-sm); color: var(--text-muted);
      font-weight: 600; font-variation-settings: 'wght' 600;
    }
    .scope label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
    .scope input[type=checkbox] { accent-color: var(--primary); }

    /* TODO(phase-1-review): Archive's per-pane custom date filter is preserved
       here as a narrower override of the page-level period selector. If the
       page-period covers what users need, we may drop these date inputs in a
       later pass to declutter the filters row. */

    /* ============ CONTROL BAR ============ */
    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .controls__count {
      font-size: var(--text-sm);
      color: var(--text-muted);
      font-weight: 600; font-variation-settings: 'wght' 600;
    }
    .controls__count strong {
      color: var(--text);
      font-weight: 900; font-variation-settings: 'wght' 900;
    }
    .controls__spacer { flex: 1; }

    .sort-select {
      font-family: var(--font);
      font-size: var(--text-sm);
      padding: 6px 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--white);
      color: var(--text);
    }

    .view-toggle {
      display: inline-flex;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      background: var(--white);
    }
    .view-toggle button {
      background: none;
      border: none;
      padding: 7px 11px;
      font-family: var(--font);
      font-size: var(--text-xs); font-weight: 800; font-variation-settings: 'wght' 800;
      text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s;
    }
    .view-toggle button.active {
      background: var(--navy);
      color: var(--white);
    }

    /* ============ RESULTS — GRID MODE ============ */
    .results-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 14px;
    }
    .card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      cursor: pointer;
      display: flex; flex-direction: column;
      transition: transform 0.12s, box-shadow 0.12s;
    }
    .card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
    .card__img-wrap {
      aspect-ratio: 16 / 9;
      background: var(--off-white);
      overflow: hidden;
      position: relative;
    }
    .card__img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .card__img-placeholder {
      width: 100%; height: 100%;
      background: linear-gradient(135deg, var(--off-white) 0%, var(--border) 100%);
      display: flex; align-items: center; justify-content: center;
      color: var(--text-muted); font-size: 10px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.08em;
    }
    .card__body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
    .card__meta { display: flex; align-items: center; gap: 8px; font-size: 10px; }
    .card__pill {
      background: var(--navy);
      color: var(--white);
      padding: 2px 7px;
      border-radius: 10px;
      font-size: var(--text-xs); font-weight: 800; font-variation-settings: 'wght' 800;
      text-transform: uppercase; letter-spacing: 0.06em;
      white-space: nowrap;
    }
    .card__date {
      color: var(--text-muted);
      font-weight: 600; font-variation-settings: 'wght' 600;
    }
    .card__title {
      font-size: var(--text-md);
      font-weight: 700; font-variation-settings: 'wght' 700;
      color: var(--text);
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card__sub {
      font-size: var(--text-sm);
      color: var(--text-muted);
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card__footer {
      margin-top: auto;
      padding-top: 6px;
      font-size: var(--text-xs);
      color: var(--text-muted);
      font-weight: 600; font-variation-settings: 'wght' 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    /* ============ METRICS — SHARED ============ */
    /* Traffic light dot. Still used in list view (and later: drawer). */
    .tl-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-muted);
      flex-shrink: 0;
      vertical-align: middle;
    }
    .tl-dot--green  { background: var(--green); }
    .tl-dot--amber  { background: var(--amber); }
    .tl-dot--red    { background: var(--red); }
    .tl-dot--null   { background: transparent; border: 1px dashed var(--text-muted); }

    /* Card views badge — two-line stack (views on top, dwell underneath) */
    .card__views-badge {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(26, 42, 68, 0.90);
      color: var(--white);
      padding: 5px 9px;
      border-radius: 8px;
      line-height: 1.25;
      text-align: right;
      backdrop-filter: blur(4px);
    }
    .card__views-badge-line1 {
      font-size: var(--text-xs);
      font-weight: 800; font-variation-settings: 'wght' 800;
      letter-spacing: 0.02em;
    }
    .card__views-badge-line2 {
      font-size: var(--text-xs);
      font-weight: 600; font-variation-settings: 'wght' 600;
      opacity: 0.80;
      margin-top: 1px;
    }
    .card__views-badge--null {
      background: rgba(100, 100, 100, 0.75);
      font-style: italic;
    }
    .card__views-badge--null .card__views-badge-line1 {
      font-weight: 500; font-variation-settings: 'wght' 500;
    }

    /* Card footer — word count */
    .card__wordcount {
      font-size: var(--text-xs);
      color: var(--text-muted);
      font-weight: 600; font-variation-settings: 'wght' 600;
    }
    .card__wordcount--null { opacity: 0.5; }

    /* ============ LIST VIEW METRIC COLUMNS ============ */
    .row__metric {
      text-align: right;
      font-size: var(--text-sm);
      font-weight: 700; font-variation-settings: 'wght' 700;
    }
    .row__metric--green { color: var(--green); }
    .row__metric--amber { color: var(--amber); }
    .row__metric--red   { color: var(--red); }
    .row__metric--null  { color: var(--text-muted); font-weight: 500; font-variation-settings: 'wght' 500; }

    .row__header {
      display: grid;
      grid-template-columns: 70px 90px 1fr 130px 55px 55px 55px;
      gap: 10px;
      align-items: center;
      padding: 8px 16px;
      background: var(--off-white);
      border-bottom: 1px solid var(--border);
      font-size: var(--text-xs);
      font-weight: 800; font-variation-settings: 'wght' 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      cursor: default;
    }
    .row__header > span { min-width: 0; }
    .row__header-metric { text-align: right; }
    .row__header-sortable { cursor: pointer; user-select: none; }
    .row__header-sortable:hover { color: var(--text); }
    .row__header-sortable.active { color: var(--primary); }

    /* ============ RESULTS — LIST MODE ============ */
    .results-list {
      display: flex; flex-direction: column;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .row {
      display: grid;
      grid-template-columns: 70px 90px 1fr 130px 55px 55px 55px;
      gap: 10px;
      align-items: center;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.12s;
    }
    .row:last-child { border-bottom: none; }
    .row:hover { background: var(--off-white); }
    .row > div, .row > span { min-width: 0; }
    .row__img {
      width: 70px; height: 40px;
      background: var(--off-white);
      border-radius: 4px;
      overflow: hidden;
      flex-shrink: 0;
    }
    .row__img img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .row__date {
      font-size: var(--text-xs); color: var(--text-muted);
      font-weight: 600; font-variation-settings: 'wght' 600;
    }
    .row__title {
      font-size: var(--text-sm);
      font-weight: 700; font-variation-settings: 'wght' 700;
      color: var(--text);
      line-height: 1.3;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .row__sub {
      font-size: var(--text-xs); color: var(--text-muted); line-height: 1.3;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      margin-top: 2px;
    }
    .row__author {
      font-size: var(--text-sm); color: var(--text-muted);
      font-weight: 600; font-variation-settings: 'wght' 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    @media (max-width: 860px) {
      .row { grid-template-columns: 60px 1fr 55px; gap: 10px; }
      .row__header { grid-template-columns: 60px 1fr 55px; }
      .row__date, .row__author,
      .row__metric--time, .row__metric--eng,
      .row__header-metric-time, .row__header-metric-eng { display: none; }
      .row__img { width: 60px; height: 36px; }
    }

    /* ============ EMPTY STATES ============ */
    .empty {
      padding: 60px 20px;
      text-align: center;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }
    .empty__title {
      font-size: var(--text-md); font-weight: 900; font-variation-settings: 'wght' 900;
      color: var(--text); margin-bottom: 8px;
    }
    .empty__msg {
      font-size: var(--text-sm); color: var(--text-muted); line-height: 1.5;
      max-width: 440px; margin: 0 auto;
    }

    .loading {
      display: flex; align-items: center; justify-content: center;
      gap: 10px;
      padding: 40px 20px;
      color: var(--text-muted);
      font-size: var(--text-sm);
      font-weight: 600; font-variation-settings: 'wght' 600;
    }
    .spinner-inline {
      width: 20px; height: 20px;
      border: 2px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ============ EXPORT DROPDOWN (admin only) ============ */
    .export-wrap {
      position: relative;
    }
    .export-btn {
      font-size: var(--text-xs);
    }
    .export-menu {
      display: none;
      position: absolute;
      top: calc(100% + 4px);
      right: 0;
      min-width: 280px;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
      z-index: 50;
      overflow: hidden;
    }
    .export-menu.open { display: block; }
    .export-menu__item {
      display: block;
      width: 100%;
      text-align: left;
      padding: 12px 14px;
      border: none;
      background: none;
      cursor: pointer;
      font-family: var(--font);
      border-bottom: 1px solid var(--border);
      transition: background 0.12s;
    }
    .export-menu__item:last-child { border-bottom: none; }
    .export-menu__item:hover { background: var(--off-white); }
    .export-menu__item strong {
      display: block;
      font-size: var(--text-sm);
      font-weight: 800; font-variation-settings: 'wght' 800;
      color: var(--text);
      margin-bottom: 2px;
    }
    .export-menu__item span {
      display: block;
      font-size: var(--text-xs);
      color: var(--text-muted);
    }

    /* ============ EXPORT PROGRESS MODAL ============ */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(26, 42, 68, 0.72);
      z-index: 500;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      overscroll-behavior: contain;
    }
    .modal-backdrop.open { display: flex; }
    .export-modal {
      background: var(--white);
      border-radius: 10px;
      max-width: 520px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      overflow: hidden;
      animation: modalIn 0.18s ease-out;
    }
    @keyframes modalIn {
      from { transform: scale(0.96); opacity: 0; }
      to   { transform: scale(1); opacity: 1; }
    }
    .export-modal__head {
      background: var(--navy);
      color: var(--white);
      padding: 14px 20px;
      font-size: var(--text-sm);
      font-weight: 800; font-variation-settings: 'wght' 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .export-modal__body {
      padding: 20px;
    }
    .export-progress {
      width: 100%;
      height: 8px;
      background: var(--off-white);
      border-radius: 4px;
      overflow: hidden;
      margin: 14px 0;
    }
    .export-progress__fill {
      height: 100%;
      background: var(--primary);
      transition: width 0.2s;
    }
    .export-stats {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
      font-size: var(--text-sm);
    }
    .export-stats__item {
      text-align: center;
      padding: 10px;
      background: var(--off-white);
      border-radius: var(--radius);
    }
    .export-stats__num {
      display: block;
      font-size: var(--text-md);
      font-weight: 900; font-variation-settings: 'wght' 900;
      color: var(--navy);
    }
    .export-stats__label {
      display: block;
      font-size: var(--text-xs);
      font-weight: 800; font-variation-settings: 'wght' 800;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      margin-top: 4px;
    }
    .export-modal__foot {
      padding: 14px 20px;
      background: var(--off-white);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }
  </style>
</head>
<body>
  <div id="pageWrap" style="display:none;">
    <div id="nlTopbar"></div>
    <div class="main">
      <div class="wa-pageheader">
        <div class="wa-pageheader__titles">
          <h1 class="wa-pageheader__title">Website Analysis</h1>
          <p class="wa-pageheader__sub">Browse articles and analyse performance.</p>
        </div>
        <div class="period-toggle" id="periodToggle" role="group" aria-label="Period">
          <button class="period-btn" data-value="30">30d</button>
          <button class="period-btn is-active" data-value="90">90d</button>
          <button class="period-btn" data-value="all">All time</button>
        </div>
      </div>

      <div class="wa-tabs" id="waTabs">
        <button class="wa-tab is-active" data-tab="browse">Browse</button>
        <button class="wa-tab" data-tab="performance">Performance</button>
      </div>

      <div class="wa-pane is-active" data-pane="browse">
        <!-- FILTERS -->
        <div class="filters">
          <div class="filters__row">
            <div class="field">
              <label class="field__label" for="qInput">Search</label>
              <input type="search" id="qInput" placeholder="Type to search titles and sub-headers…" autocomplete="off">
            </div>
            <div class="field">
              <label class="field__label" for="fromInput">From</label>
              <input type="date" id="fromInput">
            </div>
            <div class="field">
              <label class="field__label" for="toInput">To</label>
              <input type="date" id="toInput">
            </div>
            <div class="field">
              <label class="field__label" for="authorInput">Author</label>
              <select id="authorInput">
                <option value="">Any author</option>
              </select>
            </div>
            <div class="field">
              <label class="field__label" for="catInput">Category</label>
              <select id="catInput">
                <option value="">Any category</option>
              </select>
            </div>
          </div>
          <div class="filters__row" style="grid-template-columns: 1fr auto; align-items: center;">
            <div class="scope">
              <label>
                <input type="checkbox" id="scopeBody">
                Include article body in search
              </label>
            </div>
            <button class="btn btn--ghost" id="resetBtn">Reset filters</button>
          </div>
        </div>

        <!-- CONTROLS -->
        <div class="controls">
          <div class="controls__count" id="countDisplay">Loading archive…</div>
          <div class="controls__spacer"></div>
          <div class="export-wrap" id="exportWrap" style="display:none;">
            <button class="btn btn--navy export-btn" id="exportBtn" type="button">
              Export <span id="exportCount">0</span> ▾
            </button>
            <div class="export-menu" id="exportMenu">
              <button class="export-menu__item" data-format="meta">
                <strong>Metadata only</strong>
                <span>Title, date, author, category, URL — instant</span>
              </button>
              <button class="export-menu__item" data-format="plaintext">
                <strong>With plaintext body</strong>
                <span>Full text, stripped of HTML — instant</span>
              </button>
              <button class="export-menu__item" data-format="html">
                <strong>With full HTML body</strong>
                <span>Full fidelity — fetches each article, rate-limited</span>
              </button>
            </div>
          </div>
          <select class="sort-select" id="sortSelect">
            <option value="newest">Newest first</option>
            <option value="oldest">Oldest first</option>
            <option value="views">Most viewed</option>
            <option value="engagement">Longest engagement</option>
            <option value="length">Longest read</option>
          </select>
          <div class="view-toggle">
            <button id="viewGrid" class="active" data-view="grid">Grid</button>
            <button id="viewList" data-view="list">List</button>
          </div>
        </div>

        <!-- RESULTS -->
        <div id="resultsRoot">
          <div class="loading">
            <div class="spinner-inline"></div>
            <div>Loading archive index…</div>
          </div>
        </div>
      </div>

      <div class="wa-pane" data-pane="performance">
        <div class="wa-subtabs" id="waSubtabs">
          <button class="wa-subtab is-active" data-subtab="trends">Trends</button>
          <button class="wa-subtab" data-subtab="timing">Timing</button>
          <button class="wa-subtab" data-subtab="outliers">Outliers</button>
        </div>
        <div class="wa-subpane is-active" data-subpane="trends">
          <p style="padding:60px 20px; text-align:center; color:var(--text-muted);">Trends — port pending.</p>
        </div>
        <div class="wa-subpane" data-subpane="timing">
          <p style="padding:60px 20px; text-align:center; color:var(--text-muted);">Timing — port pending.</p>
        </div>
        <div class="wa-subpane" data-subpane="outliers">
          <p style="padding:60px 20px; text-align:center; color:var(--text-muted);">Outliers — port pending.</p>
        </div>
      </div>
    </div>
  </div>

  <!-- EXPORT PROGRESS MODAL (admin-only, ported from website-archive) -->
  <div class="modal-backdrop" id="exportModalBackdrop" role="dialog" aria-modal="true" aria-labelledby="exportModalTitle" style="display:none;">
    <div class="export-modal">
      <div class="export-modal__head" id="exportModalTitle">Exporting articles</div>
      <div class="export-modal__body">
        <div id="exportStatus" style="font-size: var(--text-sm); color: var(--text-muted);">Preparing…</div>
        <div class="export-progress"><div class="export-progress__fill" id="exportProgressFill" style="width:0%"></div></div>
        <div class="export-stats">
          <div class="export-stats__item">
            <span class="export-stats__num" id="exportDone">0</span>
            <span class="export-stats__label">Done</span>
          </div>
          <div class="export-stats__item">
            <span class="export-stats__num" id="exportTotal">0</span>
            <span class="export-stats__label">Total</span>
          </div>
          <div class="export-stats__item">
            <span class="export-stats__num" id="exportFailed">0</span>
            <span class="export-stats__label">Failed</span>
          </div>
        </div>
      </div>
      <div class="export-modal__foot">
        <button class="btn btn--ghost" id="exportCancelBtn">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Side-drawer (slides in from right) -->
  <div class="drawer-backdrop" id="drawerBackdrop" hidden></div>
  <aside class="drawer" id="articleDrawer" aria-hidden="true">
    <header class="drawer__head">
      <button class="drawer__close" id="drawerClose" aria-label="Close">×</button>
      <div class="drawer__title-wrap">
        <h2 class="drawer__title" id="drawerTitle">—</h2>
        <div class="drawer__meta" id="drawerMeta"></div>
      </div>
    </header>
    <div class="drawer__body" id="drawerBody">
      <p style="padding:60px 20px; text-align:center; color:var(--text-muted);">Article detail — port pending.</p>
    </div>
  </aside>

  <script>
    /* ================================================================
       Website Analysis — main script
       Phase 1 step 2: Browse view ported from website-archive (v2.0).
       The Browse logic (data load, filter, render, export) is a near-
       verbatim port; the only behavioural divergences are noted in
       comments tagged TODO(phase-1-review) or BROWSE-PORT below.
       ================================================================ */

    /* ── Constants (Browse data sources, mirrors website-archive) ───── */
    var INDEX_URL = 'https://raw.githubusercontent.com/thenationalleague/tools/refs/heads/main/assets/data/articles-index.json';
    var BYSLUG_URL = 'https://news.cms.web.gc.nationalleagueservices.co.uk/v1/byslug';
    var SITE_BASE = 'https://www.thenationalleague.org.uk';
    var LS_KEY_VIEW = 'nl-wa-view';

    // ── State ────────────────────────────────────────────────────────────
    // Skeleton-level keys (tab, perfTab, period, openArticle, query) plus
    // the Browse keys ported from website-archive (articles, filtered,
    // view, isAdmin, export*). One STATE object — no parallel state.
    var STATE = {
      // Skeleton (page-level)
      tab: 'browse',           // 'browse' | 'performance'
      perfTab: 'trends',       // 'trends' | 'timing' | 'outliers'
      period: 90,              // 30 | 90 | 'all' — drives Browse date range
      openArticle: null,       // postID or null
      query: '',
      // Browse (ported from archive)
      articles: [],
      filtered: [],
      view: 'grid',
      searchTimer: null,
      isAdmin: false,
      exportRunning: false,
      exportCancelled: false
    };

    // ── URL state ────────────────────────────────────────────────────────
    function readStateFromUrl() {
      var p = new URLSearchParams(window.location.search);
      STATE.tab = p.get('tab') === 'performance' ? 'performance' : 'browse';
      STATE.perfTab = ['trends', 'timing', 'outliers'].indexOf(p.get('perfTab')) >= 0 ? p.get('perfTab') : 'trends';
      var per = p.get('period');
      STATE.period = per === 'all' ? 'all' : (per === '30' ? 30 : 90);
      STATE.openArticle = p.get('article') || null;
      STATE.query = p.get('q') || '';
    }
    function writeStateToUrl() {
      var p = new URLSearchParams();
      if (STATE.tab !== 'browse') p.set('tab', STATE.tab);
      if (STATE.perfTab !== 'trends' && STATE.tab === 'performance') p.set('perfTab', STATE.perfTab);
      if (STATE.period !== 90) p.set('period', String(STATE.period));
      if (STATE.openArticle) p.set('article', STATE.openArticle);
      if (STATE.query) p.set('q', STATE.query);
      var qs = p.toString();
      var url = window.location.pathname + (qs ? '?' + qs : '');
      history.replaceState(null, '', url);
    }

    // ── Tab switching ────────────────────────────────────────────────────
    function activateTab(name) {
      STATE.tab = name;
      Array.prototype.forEach.call(document.querySelectorAll('.wa-tab'), function(b) {
        b.classList.toggle('is-active', b.dataset.tab === name);
      });
      Array.prototype.forEach.call(document.querySelectorAll('.wa-pane'), function(p) {
        p.classList.toggle('is-active', p.dataset.pane === name);
      });
      writeStateToUrl();
    }
    function activateSubTab(name) {
      STATE.perfTab = name;
      Array.prototype.forEach.call(document.querySelectorAll('.wa-subtab'), function(b) {
        b.classList.toggle('is-active', b.dataset.subtab === name);
      });
      Array.prototype.forEach.call(document.querySelectorAll('.wa-subpane'), function(p) {
        p.classList.toggle('is-active', p.dataset.subpane === name);
      });
      writeStateToUrl();
    }

    // ── Period toggle ────────────────────────────────────────────────────
    function activatePeriod(v) {
      STATE.period = v === 'all' ? 'all' : parseInt(v, 10);
      Array.prototype.forEach.call(document.querySelectorAll('.period-btn'), function(b) {
        b.classList.toggle('is-active', b.dataset.value === String(v));
      });
      writeStateToUrl();
      window.dispatchEvent(new CustomEvent('nl:period-changed', { detail: { period: STATE.period } }));
    }

    // ── Drawer ───────────────────────────────────────────────────────────
    function openDrawer(postID) {
      STATE.openArticle = postID;
      document.getElementById('drawerBackdrop').hidden = false;
      var drawer = document.getElementById('articleDrawer');
      drawer.classList.add('is-open');
      drawer.setAttribute('aria-hidden', 'false');
      // Best-effort title / meta lookup so the drawer head reflects the
      // chosen article even before the body content is ported.
      var article = null;
      for (var i = 0; i < STATE.articles.length; i++) {
        if (STATE.articles[i].postID === postID || STATE.articles[i].postSlug === postID) {
          article = STATE.articles[i];
          break;
        }
      }
      if (article) {
        document.getElementById('drawerTitle').textContent = article.postTitle || '(untitled)';
        document.getElementById('drawerMeta').textContent =
          (article.newsCategory || '—') + ' · ' +
          formatDateLong(article.publishedDateTime) + ' · ' +
          ((article.postAuthor || '').trim() || '—');
      }
      writeStateToUrl();
      // TODO(phase-1-review): populate drawer body with article detail
      // (Phase 1 step 5 — full content port from archive's renderModalBody).
    }
    function closeDrawer() {
      STATE.openArticle = null;
      document.getElementById('drawerBackdrop').hidden = true;
      var drawer = document.getElementById('articleDrawer');
      drawer.classList.remove('is-open');
      drawer.setAttribute('aria-hidden', 'true');
      writeStateToUrl();
    }

    /* ================================================================
       BROWSE PORT — everything below is from website-archive v2.0.
       Differences from the original:
         * Card click handler calls openDrawer(postID), NOT openModal(idx).
         * Per-article "Analyse first 72 hours" cross-link is removed
           (drawer surfaces analytics inline in Phase 1 step 5).
         * Page-level period selector is layered ON TOP of Archive's
           per-pane From/To inputs. STATE.period sets a floor on the
           date range; user-supplied From narrower than the period
           still takes effect.
         * Article modal port is intentionally skipped.
       ================================================================ */

    function $(id) { return document.getElementById(id); }

    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function formatDate(iso) {
      if (!iso) return '';
      var d = new Date(iso);
      if (isNaN(d.getTime())) return '';
      var day = String(d.getDate()).padStart(2, '0');
      var mm = String(d.getMonth() + 1).padStart(2, '0');
      var yyyy = d.getFullYear();
      return day + '/' + mm + '/' + yyyy;
    }

    function formatDateLong(iso) {
      if (!iso) return '';
      var d = new Date(iso);
      if (isNaN(d.getTime())) return '';
      var months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
      return d.getDate() + ' ' + months[d.getMonth()] + ' ' + d.getFullYear();
    }

    function debounce(fn, ms) {
      return function() {
        var args = arguments;
        clearTimeout(STATE.searchTimer);
        STATE.searchTimer = setTimeout(function() { fn.apply(null, args); }, ms);
      };
    }

    /* ── Metric helpers (data-driven thresholds, see archive v1.4) ──── */
    var VIEWS_GREEN = 1000;
    var VIEWS_AMBER = 300;
    var DWELL_GREEN = 30;
    var DWELL_AMBER = 15;

    function formatCount(n) {
      if (n == null) return '—';
      n = Number(n);
      if (!isFinite(n)) return '—';
      if (n >= 1000000) return (n / 1000000).toFixed(1).replace(/\.0$/, '') + 'M';
      if (n >= 10000)   return Math.round(n / 1000) + 'k';
      if (n >= 1000)    return (n / 1000).toFixed(1).replace(/\.0$/, '') + 'k';
      return String(Math.round(n));
    }

    function formatDuration(secs) {
      if (secs == null) return '—';
      secs = Math.round(Number(secs));
      if (!isFinite(secs) || secs < 0) return '—';
      if (secs < 60) return secs + 's';
      var m = Math.floor(secs / 60);
      var s = secs % 60;
      return m + 'm ' + (s < 10 ? '0' : '') + s + 's';
    }

    function formatPct(rate) {
      if (rate == null) return '—';
      var n = Number(rate);
      if (!isFinite(n)) return '—';
      return Math.round(n * 100) + '%';
    }

    function viewsTier(v) {
      if (v == null) return 'null';
      if (v >= VIEWS_GREEN) return 'green';
      if (v >= VIEWS_AMBER) return 'amber';
      return 'red';
    }

    function dwellTier(d) {
      if (d == null) return 'null';
      if (d >= DWELL_GREEN) return 'green';
      if (d >= DWELL_AMBER) return 'amber';
      return 'red';
    }

    function wordCount(article) {
      if (article._wc != null) return article._wc;
      if (article.wordCount != null) { article._wc = article.wordCount; return article._wc; }
      if (!article.bodyText) { article._wc = 0; return 0; }
      var wc = article.bodyText.trim().split(/\s+/).filter(Boolean).length;
      article._wc = wc;
      return wc;
    }

    function readingTimeMins(article) {
      var wc = wordCount(article);
      if (!wc) return 0;
      return Math.max(1, Math.ceil(wc / 225));
    }

    /* ── Period → date floor ──────────────────────────────────────────
       Translate STATE.period into an ISO date string used as a lower
       bound on publishedDateTime. Returns '' for 'all'. */
    function periodFloorISO() {
      if (STATE.period === 'all') return '';
      var days = parseInt(STATE.period, 10);
      if (!isFinite(days)) return '';
      var d = new Date();
      d.setDate(d.getDate() - days);
      return d.toISOString().slice(0, 10);
    }

    /* ── Browse wiring ───────────────────────────────────────────────── */
    function wireBrowseControls() {
      var doFilter = debounce(applyFilters, 150);

      $('qInput').addEventListener('input', function() {
        STATE.query = $('qInput').value;
        writeStateToUrl();
        doFilter();
      });
      $('fromInput').addEventListener('change', applyFilters);
      $('toInput').addEventListener('change', applyFilters);
      $('authorInput').addEventListener('change', applyFilters);
      $('catInput').addEventListener('change', applyFilters);
      $('scopeBody').addEventListener('change', applyFilters);
      $('sortSelect').addEventListener('change', applyFilters);

      $('resetBtn').addEventListener('click', function() {
        $('qInput').value = '';
        $('fromInput').value = '';
        $('toInput').value = '';
        $('authorInput').value = '';
        $('catInput').value = '';
        $('scopeBody').checked = false;
        $('sortSelect').value = 'newest';
        STATE.query = '';
        writeStateToUrl();
        applyFilters();
      });

      $('viewGrid').addEventListener('click', function() { setView('grid'); });
      $('viewList').addEventListener('click', function() { setView('list'); });

      // Re-render Browse when the page-level period changes.
      window.addEventListener('nl:period-changed', function() {
        if (STATE.articles.length) applyFilters();
      });

      // Export dropdown (admin only)
      if (STATE.isAdmin) {
        $('exportWrap').style.display = 'inline-block';
        $('exportBtn').addEventListener('click', function(e) {
          e.stopPropagation();
          $('exportMenu').classList.toggle('open');
        });
        document.addEventListener('click', function(e) {
          if (!$('exportWrap').contains(e.target)) {
            $('exportMenu').classList.remove('open');
          }
        });
        var menuItems = document.querySelectorAll('.export-menu__item');
        menuItems.forEach(function(item) {
          item.addEventListener('click', function() {
            $('exportMenu').classList.remove('open');
            startExport(item.getAttribute('data-format'));
          });
        });
        $('exportCancelBtn').addEventListener('click', function() {
          if (STATE.exportRunning) {
            STATE.exportCancelled = true;
          } else {
            closeExportModal();
          }
        });
      }

      // Restore search query from URL
      if (STATE.query) $('qInput').value = STATE.query;

      // "/" focuses search (when not already in an input)
      document.addEventListener('keydown', function(e) {
        if (e.key === '/' && document.activeElement &&
            document.activeElement.tagName !== 'INPUT' &&
            document.activeElement.tagName !== 'SELECT' &&
            document.activeElement.tagName !== 'TEXTAREA') {
          e.preventDefault();
          $('qInput').focus();
        }
      });
    }

    /* ── Data load ──────────────────────────────────────────────────── */
    function loadIndex() {
      fetch(INDEX_URL, { cache: 'no-cache' })
        .then(function(r) {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.json();
        })
        .then(function(data) {
          STATE.articles = Array.isArray(data) ? data : (data.articles || []);
          if (!STATE.articles.length) {
            showEmpty('No articles in index', 'The archive index file exists but contains no articles. Trigger a rebuild to populate it.');
            return;
          }
          STATE.articles.sort(function(a, b) {
            return (b.publishedDateTime || '').localeCompare(a.publishedDateTime || '');
          });
          populateFilterDropdowns();
          applyFilters();
        })
        .catch(function(err) {
          showEmpty("Couldn't load archive",
            'The archive index could not be fetched. ' + (err && err.message ? err.message : '') +
            '. Check that articles-index.json exists in the tools repo.');
        });
    }

    function populateFilterDropdowns() {
      var authors = {};
      var cats = {};
      STATE.articles.forEach(function(a) {
        var au = (a.postAuthor || '').trim();
        var c = a.newsCategory || '';
        if (au) authors[au] = (authors[au] || 0) + 1;
        if (c) cats[c] = (cats[c] || 0) + 1;
      });

      var authorSel = $('authorInput');
      authorSel.innerHTML = '<option value="">Any author</option>';
      Object.keys(authors).sort(function(a, b) { return authors[b] - authors[a]; }).forEach(function(au) {
        var opt = document.createElement('option');
        opt.value = au; opt.textContent = au + ' (' + authors[au] + ')';
        authorSel.appendChild(opt);
      });

      var catSel = $('catInput');
      catSel.innerHTML = '<option value="">Any category</option>';
      Object.keys(cats).sort(function(a, b) { return cats[b] - cats[a]; }).forEach(function(c) {
        var opt = document.createElement('option');
        opt.value = c; opt.textContent = c + ' (' + cats[c] + ')';
        catSel.appendChild(opt);
      });
    }

    /* ── Filtering ──────────────────────────────────────────────────── */
    function applyFilters() {
      var q = $('qInput').value.trim().toLowerCase();
      var fromUser = $('fromInput').value || '';
      var to = $('toInput').value || '';
      var author = $('authorInput').value || '';
      var cat = $('catInput').value || '';
      var scopeBody = $('scopeBody').checked;
      var sort = $('sortSelect').value;

      // BROWSE-PORT: page-level period sets a floor on the From date.
      // User's per-pane From input can narrow further but cannot widen
      // beyond the page-level period.
      var floor = periodFloorISO();
      var from = fromUser;
      if (floor && (!from || from < floor)) from = floor;

      var out = STATE.articles.filter(function(a) {
        var date = (a.publishedDateTime || '').slice(0, 10);
        if (from && date < from) return false;
        if (to && date > to) return false;
        if (author && (a.postAuthor || '').trim() !== author) return false;
        if (cat && a.newsCategory !== cat) return false;

        if (q) {
          var hay = ((a.postTitle || '') + ' ' + (a.description || '')).toLowerCase();
          if (scopeBody && a.bodyText) hay += ' ' + a.bodyText.toLowerCase();
          if (hay.indexOf(q) === -1) return false;
        }
        return true;
      });

      if (sort === 'oldest') {
        out.sort(function(a, b) { return (a.publishedDateTime || '').localeCompare(b.publishedDateTime || ''); });
      } else if (sort === 'views') {
        out.sort(function(a, b) {
          var av = (a.metrics && a.metrics.pageViews != null) ? a.metrics.pageViews : -1;
          var bv = (b.metrics && b.metrics.pageViews != null) ? b.metrics.pageViews : -1;
          return bv - av;
        });
      } else if (sort === 'engagement') {
        out.sort(function(a, b) {
          var av = (a.metrics && a.metrics.avgEngagementTimeSecs != null) ? a.metrics.avgEngagementTimeSecs : -1;
          var bv = (b.metrics && b.metrics.avgEngagementTimeSecs != null) ? b.metrics.avgEngagementTimeSecs : -1;
          return bv - av;
        });
      } else if (sort === 'length') {
        out.sort(function(a, b) { return wordCount(b) - wordCount(a); });
      } else {
        out.sort(function(a, b) { return (b.publishedDateTime || '').localeCompare(a.publishedDateTime || ''); });
      }

      STATE.filtered = out;
      renderResults();
      updateExportCount();
    }

    /* ── Render results ─────────────────────────────────────────────── */
    function renderResults() {
      var root = $('resultsRoot');
      var n = STATE.filtered.length;
      var total = STATE.articles.length;

      $('countDisplay').innerHTML = '<strong>' + n.toLocaleString() + '</strong> of ' + total.toLocaleString() + ' articles';

      if (!n) {
        root.innerHTML = '<div class="empty"><div class="empty__title">No matches</div><div class="empty__msg">No articles match these filters. Try broadening the date range, clearing search terms, or picking "Any author/category".</div></div>';
        return;
      }

      var cap = 300;
      var toRender = STATE.filtered.slice(0, cap);

      if (STATE.view === 'grid') {
        root.innerHTML = '<div class="results-grid">' + toRender.map(cardHTML).join('') + '</div>';
      } else {
        root.innerHTML = '<div class="results-list">' + listHeaderHTML() + toRender.map(rowHTML).join('') + '</div>';
      }

      if (n > cap) {
        root.innerHTML += '<div class="empty" style="margin-top: 14px; padding: 20px;"><div class="empty__msg">Showing first ' + cap.toLocaleString() + ' of ' + n.toLocaleString() + ' matches. Narrow filters to see the rest.</div></div>';
      }

      // BROWSE-PORT: card / row click opens the side-drawer (NOT the
      // archive's article modal). Drawer body is a placeholder until
      // Phase 1 step 5.
      var clickable = root.querySelectorAll('[data-idx]');
      clickable.forEach(function(el) {
        el.addEventListener('click', function() {
          var idx = parseInt(el.getAttribute('data-idx'), 10);
          var article = STATE.filtered[idx];
          if (!article) return;
          openDrawer(article.postID || article.postSlug || String(idx));
        });
      });

      var sortableHeaders = root.querySelectorAll('.row__header-sortable');
      sortableHeaders.forEach(function(el) {
        el.addEventListener('click', function() {
          var sortKey = el.getAttribute('data-sort');
          if (!sortKey) return;
          $('sortSelect').value = sortKey;
          applyFilters();
        });
      });
    }

    function cardHTML(a, i) {
      var img = a.imageUrl || '';
      var imgMarkup = img
        ? '<img class="card__img" src="' + esc(img) + '" alt="" loading="lazy" onerror="this.style.display=\'none\';this.nextElementSibling&&(this.nextElementSibling.style.display=\'flex\')">'
        : '';
      var placeholderStyle = img ? 'display:none;' : '';

      var m = a.metrics;
      var viewsBadge;
      if (m && m.pageViews != null) {
        var line1 = formatCount(m.pageViews) + ' views';
        var line2Text = (m.avgEngagementTimeSecs != null) ? (formatDuration(m.avgEngagementTimeSecs) + ' avg') : '';
        viewsBadge =
          '<div class="card__views-badge" title="Page views and average engagement time since Nov 2024">' +
            '<div class="card__views-badge-line1">' + esc(line1) + '</div>' +
            (line2Text ? '<div class="card__views-badge-line2">' + esc(line2Text) + '</div>' : '') +
          '</div>';
      } else {
        viewsBadge =
          '<div class="card__views-badge card__views-badge--null" title="No analytics data for this article">' +
            '<div class="card__views-badge-line1">no data</div>' +
          '</div>';
      }

      var wc = wordCount(a);
      var wcMarkup = (wc > 0)
        ? '<span class="card__wordcount">' + esc(wc.toLocaleString() + ' words') + '</span>'
        : '<span class="card__wordcount card__wordcount--null">&mdash;</span>';

      // BROWSE-PORT: archive's "Analyse first 72 hours →" cross-link
      // is intentionally not rendered here. The side-drawer (Phase 1
      // step 5) surfaces analytics inline, so the per-card jump is
      // redundant.
      return '<div class="card" data-idx="' + i + '">' +
        '<div class="card__img-wrap">' +
          imgMarkup +
          '<div class="card__img-placeholder" style="' + placeholderStyle + '">National League</div>' +
          viewsBadge +
        '</div>' +
        '<div class="card__body">' +
          '<div class="card__meta">' +
            '<span class="card__pill">' + esc(a.newsCategory || '—') + '</span>' +
            '<span class="card__date">' + esc(formatDate(a.publishedDateTime)) + '</span>' +
          '</div>' +
          '<div class="card__title">' + esc(a.postTitle || '(untitled)') + '</div>' +
          (a.description ? '<div class="card__sub">' + esc(a.description) + '</div>' : '') +
          '<div class="card__footer">' +
            '<span>' + esc((a.postAuthor || '').trim() || '—') + '</span>' +
            wcMarkup +
          '</div>' +
        '</div>' +
      '</div>';
    }

    function rowHTML(a, i) {
      var img = a.imageUrl || '';
      var imgMarkup = img
        ? '<img src="' + esc(img) + '" alt="" loading="lazy" onerror="this.style.display=\'none\'">'
        : '';

      var m = a.metrics;
      var viewsVal, viewsTierClass, timeVal, timeTierClass, engVal, engTierClass;

      if (m && m.pageViews != null) {
        viewsVal = formatCount(m.pageViews);
        viewsTierClass = 'row__metric--' + viewsTier(m.pageViews);
      } else {
        viewsVal = '—';
        viewsTierClass = 'row__metric--null';
      }

      if (m && m.avgEngagementTimeSecs != null) {
        timeVal = formatDuration(m.avgEngagementTimeSecs);
        timeTierClass = 'row__metric--' + dwellTier(m.avgEngagementTimeSecs);
      } else {
        timeVal = '—';
        timeTierClass = 'row__metric--null';
      }

      if (m && m.engagementRate != null) {
        engVal = formatPct(m.engagementRate);
        var er = m.engagementRate;
        engTierClass = er >= 0.5 ? 'row__metric--green' : (er >= 0.3 ? 'row__metric--amber' : 'row__metric--red');
      } else {
        engVal = '—';
        engTierClass = 'row__metric--null';
      }

      return '<div class="row" data-idx="' + i + '">' +
        '<div class="row__img">' + imgMarkup + '</div>' +
        '<div class="row__date">' + esc(formatDate(a.publishedDateTime)) + '</div>' +
        '<div>' +
          '<div class="row__title">' + esc(a.postTitle || '(untitled)') + '</div>' +
          (a.description ? '<div class="row__sub">' + esc(a.description) + '</div>' : '') +
        '</div>' +
        '<div class="row__author">' + esc((a.postAuthor || '').trim() || '—') + '</div>' +
        '<span class="row__metric ' + viewsTierClass + '">' + esc(viewsVal) + '</span>' +
        '<span class="row__metric row__metric--time ' + timeTierClass + '">' + esc(timeVal) + '</span>' +
        '<span class="row__metric row__metric--eng ' + engTierClass + '">' + esc(engVal) + '</span>' +
      '</div>';
    }

    function listHeaderHTML() {
      var sortMap = { newest: '', oldest: '', views: 'views', engagement: 'engagement', length: 'length' };
      var currentSort = $('sortSelect').value;
      var active = sortMap[currentSort] || '';
      return '<div class="row__header">' +
        '<span></span>' +
        '<span>Date</span>' +
        '<span>Title</span>' +
        '<span>Author</span>' +
        '<span class="row__header-metric row__header-sortable' + (active === 'views' ? ' active' : '') + '" data-sort="views">Views</span>' +
        '<span class="row__header-metric row__header-sortable row__header-metric-time' + (active === 'engagement' ? ' active' : '') + '" data-sort="engagement">Time</span>' +
        '<span class="row__header-metric row__header-metric-eng">Eng.</span>' +
      '</div>';
    }

    function showEmpty(title, msg) {
      $('resultsRoot').innerHTML =
        '<div class="empty">' +
          '<div class="empty__title">' + esc(title) + '</div>' +
          '<div class="empty__msg">' + esc(msg) + '</div>' +
        '</div>';
      $('countDisplay').textContent = '';
    }

    /* ── View toggle ────────────────────────────────────────────────── */
    function setView(v) {
      STATE.view = v;
      try { localStorage.setItem(LS_KEY_VIEW, v); } catch (e) {}
      applyViewToggleUI();
      renderResults();
    }

    function applyViewToggleUI() {
      $('viewGrid').classList.toggle('active', STATE.view === 'grid');
      $('viewList').classList.toggle('active', STATE.view === 'list');
    }

    /* ── byslug fetch (used by HTML export only) ──────────────────── */
    function fetchArticleBody(slug) {
      if (!slug) return Promise.reject(new Error('no slug'));
      var url = BYSLUG_URL + '?slug=' + encodeURIComponent(slug);
      return fetch(url, { cache: 'no-cache' })
        .then(function(r) {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.json();
        })
        .then(function(data) {
          if (!data || !data.content) throw new Error('no content');
          return data.content;
        });
    }

    /* ── Export ─────────────────────────────────────────────────────── */
    function updateExportCount() {
      var el = $('exportCount');
      if (el) el.textContent = STATE.filtered.length.toLocaleString();
    }

    async function startExport(format) {
      if (!STATE.filtered.length) {
        alert('No articles to export. Adjust your filters first.');
        return;
      }

      var articles = STATE.filtered.slice();
      var needsFetch = format === 'html';

      if (needsFetch && articles.length > 50) {
        var mins = Math.ceil((articles.length * 500) / 60000);
        var go = confirm('Export ' + articles.length + ' articles with full HTML bodies?\n\n' +
                         'This will fetch each article individually (~' + mins + ' minutes).\n\n' +
                         'You can cancel mid-export to keep what\'s been fetched so far.');
        if (!go) return;
      }

      STATE.exportRunning = true;
      STATE.exportCancelled = false;
      openExportModal();

      $('exportTotal').textContent = articles.length;
      $('exportDone').textContent = '0';
      $('exportFailed').textContent = '0';
      $('exportProgressFill').style.width = '0%';
      $('exportStatus').textContent = needsFetch ? 'Fetching bodies…' : 'Building export…';

      var rows = [];
      var failed = 0;

      for (var i = 0; i < articles.length; i++) {
        if (STATE.exportCancelled) break;
        var a = articles[i];
        var m = a.metrics;
        var row = {
          headline:      a.postTitle || '',
          subheader:     a.description || '',
          timestamp:     a.publishedDateTime || '',
          author:        a.postAuthor || '',
          news_category: a.newsCategory || '',
          url:           SITE_BASE + (a.postSlug || ''),
          image_url:     a.imageUrl || '',
          body_text:     '',
          body_html:     '',
          word_count:    wordCount(a) || '',
          reading_time_mins: readingTimeMins(a) || '',
          page_views:    (m && m.pageViews != null) ? m.pageViews : '',
          users:         (m && m.users != null) ? m.users : '',
          avg_engagement_time_secs: (m && m.avgEngagementTimeSecs != null) ? m.avgEngagementTimeSecs : '',
          engagement_rate: (m && m.engagementRate != null) ? m.engagementRate : ''
        };

        if (format === 'plaintext') {
          row.body_text = a.bodyText || '';
        } else if (format === 'html') {
          try {
            var content = await fetchArticleBody(a.postSlug);
            var html = '';
            content.forEach(function(widgetRow) {
              if (!widgetRow || !widgetRow.rowData) return;
              var w = widgetRow.rowData;
              if (!w.widgetData) return;
              if (w.widgetType === 'TextBlockWidget' && w.widgetData.content) {
                html += w.widgetData.content;
              } else if (w.widgetType === 'ThirdPartyV2Widget' && w.widgetData.content) {
                html += '<div class="embed">' + w.widgetData.content + '</div>';
              }
            });
            row.body_html = html;
            row.body_text = a.bodyText || '';
          } catch (err) {
            failed++;
            row.body_html = '[FETCH FAILED: ' + (err && err.message || 'unknown') + ']';
          }
        }

        rows.push(row);

        var done = i + 1;
        $('exportDone').textContent = done;
        $('exportFailed').textContent = failed;
        $('exportProgressFill').style.width = (done / articles.length * 100) + '%';

        if (needsFetch && i < articles.length - 1 && !STATE.exportCancelled) {
          await sleep(500);
        }
      }

      $('exportStatus').textContent = 'Building CSV…';
      var csv = buildCSV(rows, format);
      downloadCSV(csv, format);

      var cancelled = STATE.exportCancelled;
      STATE.exportRunning = false;
      STATE.exportCancelled = false;
      $('exportStatus').textContent = cancelled
        ? 'Cancelled — downloaded ' + rows.length + ' of ' + articles.length + ' articles'
        : 'Complete — downloaded ' + rows.length + ' article' + (rows.length === 1 ? '' : 's');
      $('exportCancelBtn').textContent = 'Close';
    }

    function sleep(ms) { return new Promise(function(r) { setTimeout(r, ms); }); }

    function openExportModal() {
      $('exportModalBackdrop').classList.add('open');
      $('exportModalBackdrop').style.display = 'flex';
      $('exportCancelBtn').textContent = 'Cancel';
      document.body.style.overflow = 'hidden';
    }

    function closeExportModal() {
      $('exportModalBackdrop').classList.remove('open');
      $('exportModalBackdrop').style.display = 'none';
      document.body.style.overflow = '';
    }

    function csvEscape(s) {
      if (s == null) return '';
      var str = String(s);
      if (/[",\r\n]/.test(str)) return '"' + str.replace(/"/g, '""') + '"';
      return str;
    }

    function buildCSV(rows, format) {
      var metricCols = ['word_count', 'reading_time_mins', 'page_views', 'users', 'avg_engagement_time_secs', 'engagement_rate'];
      var headers;
      if (format === 'meta') {
        headers = ['headline', 'sub-header', 'timestamp', 'author', 'news_category']
          .concat(metricCols).concat(['image_url', 'url']);
      } else if (format === 'plaintext') {
        headers = ['headline', 'sub-header', 'timestamp', 'author', 'news_category']
          .concat(metricCols).concat(['body_text', 'image_url', 'url']);
      } else {
        headers = ['headline', 'sub-header', 'timestamp', 'author', 'news_category']
          .concat(metricCols).concat(['body_text', 'body_html', 'image_url', 'url']);
      }
      var lines = [headers.join(',')];
      rows.forEach(function(r) {
        var vals = headers.map(function(h) {
          var key = h === 'sub-header' ? 'subheader' : h;
          return csvEscape(r[key]);
        });
        lines.push(vals.join(','));
      });
      return '﻿' + lines.join('\r\n');
    }

    function downloadCSV(csv, format) {
      var now = new Date();
      var stamp = now.getFullYear() + '-' +
                  String(now.getMonth() + 1).padStart(2, '0') + '-' +
                  String(now.getDate()).padStart(2, '0') + '_' +
                  String(now.getHours()).padStart(2, '0') +
                  String(now.getMinutes()).padStart(2, '0');
      var filename = 'nl-archive_' + format + '_' + stamp + '.csv';
      var blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
    }

    /* ================================================================
       INIT — auth-guard entry point
       ================================================================ */
    window.nlAuthReady = function(session) {
      // Determine admin status (drives export button visibility)
      var toolPerms = (session && session.tools && session.tools[NL_TOOL_KEY]) || {};
      STATE.isAdmin = !!(toolPerms.admin || (session && session.role === 'nl-admin'));

      // Restore view preference
      try {
        var savedView = localStorage.getItem(LS_KEY_VIEW);
        if (savedView === 'list' || savedView === 'grid') STATE.view = savedView;
      } catch (e) {}

      init();
    };

    function init() {
      readStateFromUrl();

      // Skeleton tab / sub-tab / period / drawer wiring
      Array.prototype.forEach.call(document.querySelectorAll('.wa-tab'), function(b) {
        b.addEventListener('click', function() { activateTab(b.dataset.tab); });
      });
      Array.prototype.forEach.call(document.querySelectorAll('.wa-subtab'), function(b) {
        b.addEventListener('click', function() { activateSubTab(b.dataset.subtab); });
      });
      Array.prototype.forEach.call(document.querySelectorAll('.period-btn'), function(b) {
        b.addEventListener('click', function() { activatePeriod(b.dataset.value); });
      });
      document.getElementById('drawerClose').addEventListener('click', closeDrawer);
      document.getElementById('drawerBackdrop').addEventListener('click', closeDrawer);
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && document.getElementById('articleDrawer').classList.contains('is-open')) {
          closeDrawer();
        }
      });

      // Browse pane wiring + data load
      applyViewToggleUI();
      wireBrowseControls();
      loadIndex();

      // Restore initial state from URL
      activateTab(STATE.tab);
      activateSubTab(STATE.perfTab);
      activatePeriod(STATE.period);
      if (STATE.openArticle) openDrawer(STATE.openArticle);

      // Reveal page (auth-guard hides #pageWrap until auth resolves)
      document.getElementById('pageWrap').style.display = '';
    }
  </script>
</body>
</html>
