<!DOCTYPE html>
<!--
  Website Analysis — NL Tools
  Version: v0.1 (skeleton)
  Date: 03/05/2026
  Description: Phase 1 skeleton. Sets up the agreed IA (Browse + Performance
  with Trends/Timing/Outliers sub-tabs), a page-level period selector, and a
  side-drawer for article detail. No business logic ported yet — subsequent
  commits port Browse from website-archive and Performance views from
  website-insights.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website Analysis — NL Tools</title>

  <!-- Brand stylesheet -->
  <link rel="stylesheet" href="/tools/system/nl-brand.css?v=14">

  <!-- Firebase 10.12.0 SDK (compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

  <!-- Firebase init (standard NL config) -->
  <script>
    var firebaseConfig = {
      apiKey: "AIzaSyC3az3OMnU7TdqlaWp8yrO_EjgZ36l-mXU",
      authDomain: "nl-tools.firebaseapp.com",
      databaseURL: "https://nl-tools-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "nl-tools",
      storageBucket: "nl-tools.firebasestorage.app",
      messagingSenderId: "801354670005",
      appId: "1:801354670005:web:05d8ebad3e7e63610d03fc"
    };
    firebase.initializeApp(firebaseConfig);
  </script>

  <!-- Tool identity + changelog -->
  <script>window.NL_TOOL = { title: 'Website Analysis', toolKey: 'staff-website-analysis' }; var NL_TOOL_KEY = 'staff-website-analysis'; window.NL_CHANGELOG = [{ date: '3 May 2026', version: 'v0.1', items: ['Initial skeleton — Phase 1 build in progress.'] }];</script>

  <!-- NL system scripts -->
  <script src="/tools/system/nl-utils.js?v=5"></script>
  <script src="/tools/system/nl-topbar.js?v=7"></script>
  <script src="/tools/system/auth-guard.js?v=4"></script>

  <style>
    /* ── Page header ─────────────────────────────────────────────────────
       Title block on the left, period selector on the right. Stacks on
       narrow viewports. */
    .wa-pageheader {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: var(--space-4, 16px);
      flex-wrap: wrap;
      padding: var(--space-5, 24px) 0 var(--space-4, 16px);
      border-bottom: 1px solid var(--border);
      margin-bottom: var(--space-5, 24px);
    }
    .wa-pageheader__titles { min-width: 0; flex: 1 1 320px; }
    .wa-pageheader__title {
      margin: 0 0 var(--space-1, 4px);
      font-size: var(--fs-h1, 28px);
      font-weight: var(--fw-bold, 700);
      color: var(--text);
      letter-spacing: -0.01em;
    }
    .wa-pageheader__sub {
      margin: 0;
      font-size: var(--fs-body, 14px);
      color: var(--text-muted);
    }

    /* ── Period selector (pill group) ────────────────────────────────────
       Segmented buttons; active state uses brand accent. */
    .period-toggle {
      display: inline-flex;
      align-items: center;
      gap: 0;
      padding: 4px;
      background: var(--off-white);
      border: 1px solid var(--border);
      border-radius: var(--radius-pill, 999px);
      flex: 0 0 auto;
    }
    .period-btn {
      appearance: none;
      border: 0;
      background: transparent;
      color: var(--text-muted);
      padding: 6px 14px;
      font: inherit;
      font-size: var(--fs-small, 13px);
      font-weight: var(--fw-medium, 500);
      border-radius: var(--radius-pill, 999px);
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .period-btn:hover { color: var(--text); }
    .period-btn.is-active {
      background: var(--white);
      color: var(--text);
      box-shadow: var(--shadow-sm, 0 1px 2px rgba(10, 22, 40, 0.08));
    }

    /* ── Top-level tabs (Browse / Performance) ───────────────────────────
       Mirrors the nl-brand .tabs / .tab pattern used by Insights' .ins-tabs:
       a row of underline-style buttons with an active accent underline. */
    .wa-tabs {
      display: flex;
      align-items: center;
      gap: var(--space-2, 8px);
      border-bottom: 1px solid var(--border);
      margin-bottom: var(--space-4, 16px);
    }
    .wa-tab {
      appearance: none;
      background: transparent;
      border: 0;
      border-bottom: 2px solid transparent;
      padding: var(--space-3, 12px) var(--space-4, 16px);
      font: inherit;
      font-size: var(--fs-body, 14px);
      font-weight: var(--fw-medium, 500);
      color: var(--text-muted);
      cursor: pointer;
      margin-bottom: -1px;
      transition: color 0.15s ease, border-color 0.15s ease;
    }
    .wa-tab:hover { color: var(--text); }
    .wa-tab.is-active {
      color: var(--primary);
      border-bottom-color: var(--primary);
      font-weight: var(--fw-semibold, 600);
    }

    /* ── Tab panes ───────────────────────────────────────────────────────*/
    .wa-pane { display: none; }
    .wa-pane.is-active { display: block; }

    /* ── Performance sub-tabs (Trends / Timing / Outliers) ───────────────
       Slightly lighter weight than top-level tabs; same underline pattern. */
    .wa-subtabs {
      display: flex;
      align-items: center;
      gap: var(--space-1, 4px);
      border-bottom: 1px solid var(--border);
      margin-bottom: var(--space-4, 16px);
    }
    .wa-subtab {
      appearance: none;
      background: transparent;
      border: 0;
      border-bottom: 2px solid transparent;
      padding: var(--space-2, 8px) var(--space-3, 12px);
      font: inherit;
      font-size: var(--fs-small, 13px);
      font-weight: var(--fw-medium, 500);
      color: var(--text-muted);
      cursor: pointer;
      margin-bottom: -1px;
      transition: color 0.15s ease, border-color 0.15s ease;
    }
    .wa-subtab:hover { color: var(--text); }
    .wa-subtab.is-active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }

    .wa-subpane { display: none; }
    .wa-subpane.is-active { display: block; }

    /* ── Side-drawer (slides in from right) ──────────────────────────────
       480px wide on desktop, full-width on mobile. Backdrop dims the page. */
    .drawer {
      position: fixed;
      top: 0;
      right: 0;
      height: 100vh;
      width: 480px;
      max-width: 100vw;
      transform: translateX(100%);
      transition: transform 0.25s ease;
      z-index: 200;
      background: var(--white);
      box-shadow: -8px 0 32px rgba(10, 22, 40, 0.18);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }
    .drawer.is-open { transform: translateX(0); }
    .drawer-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(10, 22, 40, 0.35);
      z-index: 199;
    }
    @media (max-width: 600px) {
      .drawer { width: 100vw; }
    }

    .drawer__head {
      display: flex;
      align-items: flex-start;
      gap: var(--space-3, 12px);
      padding: var(--space-4, 16px) var(--space-5, 24px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      background: var(--white);
      z-index: 1;
    }
    .drawer__close {
      appearance: none;
      background: transparent;
      border: 0;
      font-size: 24px;
      line-height: 1;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px 8px;
      border-radius: var(--radius-sm, 6px);
      flex: 0 0 auto;
    }
    .drawer__close:hover {
      color: var(--text);
      background: var(--off-white);
    }
    .drawer__title-wrap { min-width: 0; flex: 1 1 auto; }
    .drawer__title {
      margin: 0 0 var(--space-1, 4px);
      font-size: var(--fs-h3, 18px);
      font-weight: var(--fw-semibold, 600);
      color: var(--text);
      word-break: break-word;
    }
    .drawer__meta {
      font-size: var(--fs-small, 13px);
      color: var(--text-muted);
    }
    .drawer__body {
      padding: var(--space-4, 16px) var(--space-5, 24px);
      flex: 1 1 auto;
    }

    /* ── Browse view (ported from website-archive) ───────────────────────
       Search + filters + cards grid. Section headers below mirror the
       Archive structure for easy diffing during the Phase 1 review. */

    /* ============ FILTERS PANEL ============ */
    .filters {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      margin-bottom: 18px;
      box-shadow: var(--shadow);
    }
    .filters__row {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1fr 1fr;
      gap: 12px;
      align-items: end;
    }
    .filters__row + .filters__row { margin-top: 12px; }
    @media (max-width: 980px) { .filters__row { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 560px) { .filters__row { grid-template-columns: 1fr; } }

    .field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
    .field__label {
      font-size: var(--text-xs); font-weight: 800; font-variation-settings: 'wght' 800;
      text-transform: uppercase; letter-spacing: 0.1em;
      color: var(--text-muted);
    }
    .field input[type=text],
    .field input[type=date],
    .field input[type=search],
    .field select {
      font-family: var(--font);
      font-size: var(--text-sm);
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--white);
      color: var(--text);
      width: 100%;
      min-width: 0;
    }
    .field input:focus, .field select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: var(--focus-ring);
    }

    .scope {
      display: flex; align-items: center; gap: 12px;
      font-size: var(--text-sm); color: var(--text-muted);
      font-weight: 600; font-variation-settings: 'wght' 600;
    }
    .scope label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
    .scope input[type=checkbox] { accent-color: var(--primary); }

    /* TODO(phase-1-review): Archive's per-pane custom date filter is preserved
       here as a narrower override of the page-level period selector. If the
       page-period covers what users need, we may drop these date inputs in a
       later pass to declutter the filters row. */

    /* ============ CONTROL BAR ============ */
    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .controls__count {
      font-size: var(--text-sm);
      color: var(--text-muted);
      font-weight: 600; font-variation-settings: 'wght' 600;
    }
    .controls__count strong {
      color: var(--text);
      font-weight: 900; font-variation-settings: 'wght' 900;
    }
    .controls__spacer { flex: 1; }

    .sort-select {
      font-family: var(--font);
      font-size: var(--text-sm);
      padding: 6px 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--white);
      color: var(--text);
    }

    .view-toggle {
      display: inline-flex;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      background: var(--white);
    }
    .view-toggle button {
      background: none;
      border: none;
      padding: 7px 11px;
      font-family: var(--font);
      font-size: var(--text-xs); font-weight: 800; font-variation-settings: 'wght' 800;
      text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s;
    }
    .view-toggle button.active {
      background: var(--navy);
      color: var(--white);
    }

    /* ============ RESULTS — GRID MODE ============ */
    .results-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 14px;
    }
    .card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      cursor: pointer;
      display: flex; flex-direction: column;
      transition: transform 0.12s, box-shadow 0.12s;
    }
    .card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
    .card__img-wrap {
      aspect-ratio: 16 / 9;
      background: var(--off-white);
      overflow: hidden;
      position: relative;
    }
    .card__img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .card__img-placeholder {
      width: 100%; height: 100%;
      background: linear-gradient(135deg, var(--off-white) 0%, var(--border) 100%);
      display: flex; align-items: center; justify-content: center;
      color: var(--text-muted); font-size: 10px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.08em;
    }
    .card__body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
    .card__meta { display: flex; align-items: center; gap: 8px; font-size: 10px; }
    .card__pill {
      background: var(--navy);
      color: var(--white);
      padding: 2px 7px;
      border-radius: 10px;
      font-size: var(--text-xs); font-weight: 800; font-variation-settings: 'wght' 800;
      text-transform: uppercase; letter-spacing: 0.06em;
      white-space: nowrap;
    }
    .card__date {
      color: var(--text-muted);
      font-weight: 600; font-variation-settings: 'wght' 600;
    }
    .card__title {
      font-size: var(--text-md);
      font-weight: 700; font-variation-settings: 'wght' 700;
      color: var(--text);
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card__sub {
      font-size: var(--text-sm);
      color: var(--text-muted);
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card__footer {
      margin-top: auto;
      padding-top: 6px;
      font-size: var(--text-xs);
      color: var(--text-muted);
      font-weight: 600; font-variation-settings: 'wght' 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    /* ============ METRICS — SHARED ============ */
    /* Traffic light dot. Still used in list view (and later: drawer). */
    .tl-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-muted);
      flex-shrink: 0;
      vertical-align: middle;
    }
    .tl-dot--green  { background: var(--green); }
    .tl-dot--amber  { background: var(--amber); }
    .tl-dot--red    { background: var(--red); }
    .tl-dot--null   { background: transparent; border: 1px dashed var(--text-muted); }

    /* Card views badge — two-line stack (views on top, dwell underneath) */
    .card__views-badge {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(26, 42, 68, 0.90);
      color: var(--white);
      padding: 5px 9px;
      border-radius: 8px;
      line-height: 1.25;
      text-align: right;
      backdrop-filter: blur(4px);
    }
    .card__views-badge-line1 {
      font-size: var(--text-xs);
      font-weight: 800; font-variation-settings: 'wght' 800;
      letter-spacing: 0.02em;
    }
    .card__views-badge-line2 {
      font-size: var(--text-xs);
      font-weight: 600; font-variation-settings: 'wght' 600;
      opacity: 0.80;
      margin-top: 1px;
    }
    .card__views-badge--null {
      background: rgba(100, 100, 100, 0.75);
      font-style: italic;
    }
    .card__views-badge--null .card__views-badge-line1 {
      font-weight: 500; font-variation-settings: 'wght' 500;
    }

    /* Card footer — word count */
    .card__wordcount {
      font-size: var(--text-xs);
      color: var(--text-muted);
      font-weight: 600; font-variation-settings: 'wght' 600;
    }
    .card__wordcount--null { opacity: 0.5; }

    /* ============ LIST VIEW METRIC COLUMNS ============ */
    .row__metric {
      text-align: right;
      font-size: var(--text-sm);
      font-weight: 700; font-variation-settings: 'wght' 700;
    }
    .row__metric--green { color: var(--green); }
    .row__metric--amber { color: var(--amber); }
    .row__metric--red   { color: var(--red); }
    .row__metric--null  { color: var(--text-muted); font-weight: 500; font-variation-settings: 'wght' 500; }

    .row__header {
      display: grid;
      grid-template-columns: 70px 90px 1fr 130px 55px 55px 55px;
      gap: 10px;
      align-items: center;
      padding: 8px 16px;
      background: var(--off-white);
      border-bottom: 1px solid var(--border);
      font-size: var(--text-xs);
      font-weight: 800; font-variation-settings: 'wght' 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      cursor: default;
    }
    .row__header > span { min-width: 0; }
    .row__header-metric { text-align: right; }
    .row__header-sortable { cursor: pointer; user-select: none; }
    .row__header-sortable:hover { color: var(--text); }
    .row__header-sortable.active { color: var(--primary); }

    /* ============ RESULTS — LIST MODE ============ */
    .results-list {
      display: flex; flex-direction: column;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .row {
      display: grid;
      grid-template-columns: 70px 90px 1fr 130px 55px 55px 55px;
      gap: 10px;
      align-items: center;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.12s;
    }
    .row:last-child { border-bottom: none; }
    .row:hover { background: var(--off-white); }
    .row > div, .row > span { min-width: 0; }
    .row__img {
      width: 70px; height: 40px;
      background: var(--off-white);
      border-radius: 4px;
      overflow: hidden;
      flex-shrink: 0;
    }
    .row__img img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .row__date {
      font-size: var(--text-xs); color: var(--text-muted);
      font-weight: 600; font-variation-settings: 'wght' 600;
    }
    .row__title {
      font-size: var(--text-sm);
      font-weight: 700; font-variation-settings: 'wght' 700;
      color: var(--text);
      line-height: 1.3;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .row__sub {
      font-size: var(--text-xs); color: var(--text-muted); line-height: 1.3;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      margin-top: 2px;
    }
    .row__author {
      font-size: var(--text-sm); color: var(--text-muted);
      font-weight: 600; font-variation-settings: 'wght' 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    @media (max-width: 860px) {
      .row { grid-template-columns: 60px 1fr 55px; gap: 10px; }
      .row__header { grid-template-columns: 60px 1fr 55px; }
      .row__date, .row__author,
      .row__metric--time, .row__metric--eng,
      .row__header-metric-time, .row__header-metric-eng { display: none; }
      .row__img { width: 60px; height: 36px; }
    }

    /* ============ EMPTY STATES ============ */
    .empty {
      padding: 60px 20px;
      text-align: center;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }
    .empty__title {
      font-size: var(--text-md); font-weight: 900; font-variation-settings: 'wght' 900;
      color: var(--text); margin-bottom: 8px;
    }
    .empty__msg {
      font-size: var(--text-sm); color: var(--text-muted); line-height: 1.5;
      max-width: 440px; margin: 0 auto;
    }

    .loading {
      display: flex; align-items: center; justify-content: center;
      gap: 10px;
      padding: 40px 20px;
      color: var(--text-muted);
      font-size: var(--text-sm);
      font-weight: 600; font-variation-settings: 'wght' 600;
    }
    .spinner-inline {
      width: 20px; height: 20px;
      border: 2px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ============ EXPORT DROPDOWN (admin only) ============ */
    .export-wrap {
      position: relative;
    }
    .export-btn {
      font-size: var(--text-xs);
    }
    .export-menu {
      display: none;
      position: absolute;
      top: calc(100% + 4px);
      right: 0;
      min-width: 280px;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
      z-index: 50;
      overflow: hidden;
    }
    .export-menu.open { display: block; }
    .export-menu__item {
      display: block;
      width: 100%;
      text-align: left;
      padding: 12px 14px;
      border: none;
      background: none;
      cursor: pointer;
      font-family: var(--font);
      border-bottom: 1px solid var(--border);
      transition: background 0.12s;
    }
    .export-menu__item:last-child { border-bottom: none; }
    .export-menu__item:hover { background: var(--off-white); }
    .export-menu__item strong {
      display: block;
      font-size: var(--text-sm);
      font-weight: 800; font-variation-settings: 'wght' 800;
      color: var(--text);
      margin-bottom: 2px;
    }
    .export-menu__item span {
      display: block;
      font-size: var(--text-xs);
      color: var(--text-muted);
    }

    /* ============ EXPORT PROGRESS MODAL ============ */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(26, 42, 68, 0.72);
      z-index: 500;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      overscroll-behavior: contain;
    }
    .modal-backdrop.open { display: flex; }
    .export-modal {
      background: var(--white);
      border-radius: 10px;
      max-width: 520px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      overflow: hidden;
      animation: modalIn 0.18s ease-out;
    }
    @keyframes modalIn {
      from { transform: scale(0.96); opacity: 0; }
      to   { transform: scale(1); opacity: 1; }
    }
    .export-modal__head {
      background: var(--navy);
      color: var(--white);
      padding: 14px 20px;
      font-size: var(--text-sm);
      font-weight: 800; font-variation-settings: 'wght' 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .export-modal__body {
      padding: 20px;
    }
    .export-progress {
      width: 100%;
      height: 8px;
      background: var(--off-white);
      border-radius: 4px;
      overflow: hidden;
      margin: 14px 0;
    }
    .export-progress__fill {
      height: 100%;
      background: var(--primary);
      transition: width 0.2s;
    }
    .export-stats {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
      font-size: var(--text-sm);
    }
    .export-stats__item {
      text-align: center;
      padding: 10px;
      background: var(--off-white);
      border-radius: var(--radius);
    }
    .export-stats__num {
      display: block;
      font-size: var(--text-md);
      font-weight: 900; font-variation-settings: 'wght' 900;
      color: var(--navy);
    }
    .export-stats__label {
      display: block;
      font-size: var(--text-xs);
      font-weight: 800; font-variation-settings: 'wght' 800;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      margin-top: 4px;
    }
    .export-modal__foot {
      padding: 14px 20px;
      background: var(--off-white);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }
  </style>
</head>
<body>
  <div id="pageWrap" style="display:none;">
    <div id="nlTopbar"></div>
    <div class="main">
      <div class="wa-pageheader">
        <div class="wa-pageheader__titles">
          <h1 class="wa-pageheader__title">Website Analysis</h1>
          <p class="wa-pageheader__sub">Browse articles and analyse performance.</p>
        </div>
        <div class="period-toggle" id="periodToggle" role="group" aria-label="Period">
          <button class="period-btn" data-value="30">30d</button>
          <button class="period-btn is-active" data-value="90">90d</button>
          <button class="period-btn" data-value="all">All time</button>
        </div>
      </div>

      <div class="wa-tabs" id="waTabs">
        <button class="wa-tab is-active" data-tab="browse">Browse</button>
        <button class="wa-tab" data-tab="performance">Performance</button>
      </div>

      <div class="wa-pane is-active" data-pane="browse">
        <!-- FILTERS -->
        <div class="filters">
          <div class="filters__row">
            <div class="field">
              <label class="field__label" for="qInput">Search</label>
              <input type="search" id="qInput" placeholder="Type to search titles and sub-headers…" autocomplete="off">
            </div>
            <div class="field">
              <label class="field__label" for="fromInput">From</label>
              <input type="date" id="fromInput">
            </div>
            <div class="field">
              <label class="field__label" for="toInput">To</label>
              <input type="date" id="toInput">
            </div>
            <div class="field">
              <label class="field__label" for="authorInput">Author</label>
              <select id="authorInput">
                <option value="">Any author</option>
              </select>
            </div>
            <div class="field">
              <label class="field__label" for="catInput">Category</label>
              <select id="catInput">
                <option value="">Any category</option>
              </select>
            </div>
          </div>
          <div class="filters__row" style="grid-template-columns: 1fr auto; align-items: center;">
            <div class="scope">
              <label>
                <input type="checkbox" id="scopeBody">
                Include article body in search
              </label>
            </div>
            <button class="btn btn--ghost" id="resetBtn">Reset filters</button>
          </div>
        </div>

        <!-- CONTROLS -->
        <div class="controls">
          <div class="controls__count" id="countDisplay">Loading archive…</div>
          <div class="controls__spacer"></div>
          <div class="export-wrap" id="exportWrap" style="display:none;">
            <button class="btn btn--navy export-btn" id="exportBtn" type="button">
              Export <span id="exportCount">0</span> ▾
            </button>
            <div class="export-menu" id="exportMenu">
              <button class="export-menu__item" data-format="meta">
                <strong>Metadata only</strong>
                <span>Title, date, author, category, URL — instant</span>
              </button>
              <button class="export-menu__item" data-format="plaintext">
                <strong>With plaintext body</strong>
                <span>Full text, stripped of HTML — instant</span>
              </button>
              <button class="export-menu__item" data-format="html">
                <strong>With full HTML body</strong>
                <span>Full fidelity — fetches each article, rate-limited</span>
              </button>
            </div>
          </div>
          <select class="sort-select" id="sortSelect">
            <option value="newest">Newest first</option>
            <option value="oldest">Oldest first</option>
            <option value="views">Most viewed</option>
            <option value="engagement">Longest engagement</option>
            <option value="length">Longest read</option>
          </select>
          <div class="view-toggle">
            <button id="viewGrid" class="active" data-view="grid">Grid</button>
            <button id="viewList" data-view="list">List</button>
          </div>
        </div>

        <!-- RESULTS -->
        <div id="resultsRoot">
          <div class="loading">
            <div class="spinner-inline"></div>
            <div>Loading archive index…</div>
          </div>
        </div>
      </div>

      <div class="wa-pane" data-pane="performance">
        <div class="wa-subtabs" id="waSubtabs">
          <button class="wa-subtab is-active" data-subtab="trends">Trends</button>
          <button class="wa-subtab" data-subtab="timing">Timing</button>
          <button class="wa-subtab" data-subtab="outliers">Outliers</button>
        </div>
        <div class="wa-subpane is-active" data-subpane="trends">
          <p style="padding:60px 20px; text-align:center; color:var(--text-muted);">Trends — port pending.</p>
        </div>
        <div class="wa-subpane" data-subpane="timing">
          <p style="padding:60px 20px; text-align:center; color:var(--text-muted);">Timing — port pending.</p>
        </div>
        <div class="wa-subpane" data-subpane="outliers">
          <p style="padding:60px 20px; text-align:center; color:var(--text-muted);">Outliers — port pending.</p>
        </div>
      </div>
    </div>
  </div>

  <!-- EXPORT PROGRESS MODAL (admin-only, ported from website-archive) -->
  <div class="modal-backdrop" id="exportModalBackdrop" role="dialog" aria-modal="true" aria-labelledby="exportModalTitle" style="display:none;">
    <div class="export-modal">
      <div class="export-modal__head" id="exportModalTitle">Exporting articles</div>
      <div class="export-modal__body">
        <div id="exportStatus" style="font-size: var(--text-sm); color: var(--text-muted);">Preparing…</div>
        <div class="export-progress"><div class="export-progress__fill" id="exportProgressFill" style="width:0%"></div></div>
        <div class="export-stats">
          <div class="export-stats__item">
            <span class="export-stats__num" id="exportDone">0</span>
            <span class="export-stats__label">Done</span>
          </div>
          <div class="export-stats__item">
            <span class="export-stats__num" id="exportTotal">0</span>
            <span class="export-stats__label">Total</span>
          </div>
          <div class="export-stats__item">
            <span class="export-stats__num" id="exportFailed">0</span>
            <span class="export-stats__label">Failed</span>
          </div>
        </div>
      </div>
      <div class="export-modal__foot">
        <button class="btn btn--ghost" id="exportCancelBtn">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Side-drawer (slides in from right) -->
  <div class="drawer-backdrop" id="drawerBackdrop" hidden></div>
  <aside class="drawer" id="articleDrawer" aria-hidden="true">
    <header class="drawer__head">
      <button class="drawer__close" id="drawerClose" aria-label="Close">×</button>
      <div class="drawer__title-wrap">
        <h2 class="drawer__title" id="drawerTitle">—</h2>
        <div class="drawer__meta" id="drawerMeta"></div>
      </div>
    </header>
    <div class="drawer__body" id="drawerBody">
      <p style="padding:60px 20px; text-align:center; color:var(--text-muted);">Article detail — port pending.</p>
    </div>
  </aside>

  <script>
    // ── State ────────────────────────────────────────────────────────────
    var STATE = {
      tab: 'browse',           // 'browse' | 'performance'
      perfTab: 'trends',       // 'trends' | 'timing' | 'outliers'
      period: 90,              // 30 | 90 | 'all'
      openArticle: null,       // postID or null
      query: ''
    };

    // ── URL state ────────────────────────────────────────────────────────
    function readStateFromUrl() {
      var p = new URLSearchParams(window.location.search);
      STATE.tab = p.get('tab') === 'performance' ? 'performance' : 'browse';
      STATE.perfTab = ['trends', 'timing', 'outliers'].indexOf(p.get('perfTab')) >= 0 ? p.get('perfTab') : 'trends';
      var per = p.get('period');
      STATE.period = per === 'all' ? 'all' : (per === '30' ? 30 : 90);
      STATE.openArticle = p.get('article') || null;
      STATE.query = p.get('q') || '';
    }
    function writeStateToUrl() {
      var p = new URLSearchParams();
      if (STATE.tab !== 'browse') p.set('tab', STATE.tab);
      if (STATE.perfTab !== 'trends' && STATE.tab === 'performance') p.set('perfTab', STATE.perfTab);
      if (STATE.period !== 90) p.set('period', String(STATE.period));
      if (STATE.openArticle) p.set('article', STATE.openArticle);
      if (STATE.query) p.set('q', STATE.query);
      var qs = p.toString();
      var url = window.location.pathname + (qs ? '?' + qs : '');
      history.replaceState(null, '', url);
    }

    // ── Tab switching ────────────────────────────────────────────────────
    function activateTab(name) {
      STATE.tab = name;
      Array.prototype.forEach.call(document.querySelectorAll('.wa-tab'), function(b) {
        b.classList.toggle('is-active', b.dataset.tab === name);
      });
      Array.prototype.forEach.call(document.querySelectorAll('.wa-pane'), function(p) {
        p.classList.toggle('is-active', p.dataset.pane === name);
      });
      writeStateToUrl();
    }
    function activateSubTab(name) {
      STATE.perfTab = name;
      Array.prototype.forEach.call(document.querySelectorAll('.wa-subtab'), function(b) {
        b.classList.toggle('is-active', b.dataset.subtab === name);
      });
      Array.prototype.forEach.call(document.querySelectorAll('.wa-subpane'), function(p) {
        p.classList.toggle('is-active', p.dataset.subpane === name);
      });
      writeStateToUrl();
    }

    // ── Period toggle ────────────────────────────────────────────────────
    function activatePeriod(v) {
      STATE.period = v === 'all' ? 'all' : parseInt(v, 10);
      Array.prototype.forEach.call(document.querySelectorAll('.period-btn'), function(b) {
        b.classList.toggle('is-active', b.dataset.value === String(v));
      });
      writeStateToUrl();
      window.dispatchEvent(new CustomEvent('nl:period-changed', { detail: { period: STATE.period } }));
    }

    // ── Drawer ───────────────────────────────────────────────────────────
    function openDrawer(postID) {
      STATE.openArticle = postID;
      document.getElementById('drawerBackdrop').hidden = false;
      var drawer = document.getElementById('articleDrawer');
      drawer.classList.add('is-open');
      drawer.setAttribute('aria-hidden', 'false');
      writeStateToUrl();
      // TODO(phase-1-review): populate drawer body with article detail
    }
    function closeDrawer() {
      STATE.openArticle = null;
      document.getElementById('drawerBackdrop').hidden = true;
      var drawer = document.getElementById('articleDrawer');
      drawer.classList.remove('is-open');
      drawer.setAttribute('aria-hidden', 'true');
      writeStateToUrl();
    }

    // ── Wiring ───────────────────────────────────────────────────────────
    function init() {
      readStateFromUrl();

      Array.prototype.forEach.call(document.querySelectorAll('.wa-tab'), function(b) {
        b.addEventListener('click', function() { activateTab(b.dataset.tab); });
      });
      Array.prototype.forEach.call(document.querySelectorAll('.wa-subtab'), function(b) {
        b.addEventListener('click', function() { activateSubTab(b.dataset.subtab); });
      });
      Array.prototype.forEach.call(document.querySelectorAll('.period-btn'), function(b) {
        b.addEventListener('click', function() { activatePeriod(b.dataset.value); });
      });
      document.getElementById('drawerClose').addEventListener('click', closeDrawer);
      document.getElementById('drawerBackdrop').addEventListener('click', closeDrawer);
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && document.getElementById('articleDrawer').classList.contains('is-open')) {
          closeDrawer();
        }
      });

      // Restore initial state from URL
      activateTab(STATE.tab);
      activateSubTab(STATE.perfTab);
      activatePeriod(STATE.period);
      if (STATE.openArticle) openDrawer(STATE.openArticle);

      // Reveal page (auth-guard hides #pageWrap until auth resolves)
      document.getElementById('pageWrap').style.display = '';
    }

    if (window.nlAuthReady) {
      window.nlAuthReady.then(init);
    } else {
      document.addEventListener('DOMContentLoaded', init);
    }
  </script>
</body>
</html>
