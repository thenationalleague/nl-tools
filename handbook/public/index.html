<!-- Same reasoning as club-directory/public: a meta noindex, not a robots.txt
     Disallow. Disallowing the path stops the crawler reading the noindex, and
     a disallowed URL can still be listed as a bare link. _headers carries an
     X-Robots-Tag for /handbook/* as well, which is the only way to mark the
     PDF itself — a file with no <head> to put a tag in. -->
<meta name="robots" content="noindex, nofollow">
<title>Handbook — The National League</title>

<!--
  handbook / public / index.html
  v2.0 — (26/08/2026) THE HANDBOOK ITSELF, not a link to a file. v1.0 offered
         the edition, the date and the PDF, which is what was asked for and
         is not what anyone wants: "handbook only has pdf, not searchable and
         web native version". It is now handbook/reader with no door on it —
         the five areas, the outline, the search, clause deep-links, the
         mobile drawer — and the PDF is still one press away in the bar,
         where the gated reader keeps it too.

  ONE READER, TWO DOORS
  ---------------------
  Everything below the markup is /handbook/_reader.js, shared with
  handbook/reader. The whole difference is the boot call at the foot of this
  file. Two copies of a rulebook reader is how the public handbook and the
  club handbook start saying different things, which is the one thing a
  rulebook must never do.

  WHAT THIS OPENED UP: NOTHING
  ----------------------------
  The handbook text was already public three ways over. handbook/handbook.pdf
  is served from a public repository; handbook/seed-*.json in that same
  repository carries the same text; and the repository is the site. The gated
  reader's own note says so and calls it a recorded choice — "a front door on
  a building with an open side gate ... never tell clubs otherwise".

  The rules were still tightened rather than loosened to suit this. Only the
  edition that is CURRENTLY PUBLISHED is world-readable, expressed as a rule
  that compares $edition against publishedEditionId — so when the next
  edition publishes, the previous one closes itself. The editions node stays
  shut, so the ids cannot be listed.

  Not lint-covered: no auth-guard, by design.
-->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <!-- No firebase-auth-compat. This page signs nobody in, and loading the auth
       SDK on a page with no account is how an "ungated" page quietly acquires
       an anonymous user per visitor. -->
