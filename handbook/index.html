    setTimeout(function () { _suppressHash = false; }, 0);
  }
  function parseHash() {
    var h = (location.hash || '').replace(/^#/, '');
    if (!h) return null;
    var i = h.indexOf('/'); if (i < 0) return null;
    var docId = h.slice(0, i), nodeId = h.slice(i + 1);
    if (!nodeId || !DOCS.some(function (d) { return d.id === docId; })) return null;
    return { docId: docId, nodeId: nodeId };
  }
  // Route to whatever the URL points at. Called on boot and on manual hash changes.
  function routeHash() {
    var t = parseHash(); if (!t) return false;
    S.selectedId = t.nodeId;
    if (t.docId === S.docId) { render(); scrollToNode(t.nodeId); refreshToc(); }
    else { S.docId = t.docId; S.mode = 'read'; load().then(function () { scrollToNode(t.nodeId); }); }
    return true;
  }
  // Copy a shareable link to a clause (read mode: click its number).
  function copyClauseLink(nodeId) {
    var url = location.origin + location.pathname + '#' + S.docId + '/' + nodeId;
    if (NL.copy) NL.copy(url);
    setHash(S.docId, nodeId);
    NL.toast && NL.toast('Link copied — opens the handbook at this clause', 'success');
  }

  function syncBar() {
    $('ceEditBtn').hidden = !canEdit() || !S.docId;
    syncUndoBtns();
    $('cePublish').hidden = !canEdit() || !S.docId || !Object.keys(S.nodes).length;
    /* Folding is an editing affordance: a reader who cannot see a clause
       cannot be bound by it. */
    var fold = $('ceFold');
    if (fold) fold.hidden = !(S.mode === 'edit' && canEdit() && Object.keys(S.nodes).length);
    syncFoldSeg();
    syncChanges();
    /* IMPORT IS RETIRED FROM THE EVERYDAY BAR (19/08/2026). Seeding was a
       one-time job and it is done; what is left is two buttons that overwrite
       committed text, sitting two along from Publish. Re-import in particular
       replaces a whole area with the seed file — months of colleagues' edits,
       gone, on a mis-click, on the tool that is about to go out to 72 clubs.

       Not deleted, because a future season needs this route and rebuilding an
       importer from nothing is a bad trade against typing seven characters.
       Add ?import=1 to the URL to bring both back. Superadmin still applies on
       top — the flag lowers a guard, it does not grant anything.

       The machinery (docx-import.js, importSeed, importUpload) is untouched. */
    var IMPORT_ON = /[?&]import=1\b/.test(location.search);
    $('ceReimport').hidden = !(IMPORT_ON && S.docId && canSeed() && SEEDS[S.docId] && Object.keys(S.nodes).length);
    $('ceImportDoc').hidden = !(IMPORT_ON && S.docId && canSeed());
    var note = $('ceModeNote');
    /* Say who is in there BEFORE Edit is pressed, not after. A button that
       looks available and then refuses is worse than one that explains. */
    var heldByOther = S.lock && !lockIsMine(S.lock) && !lockIsStale(S.lock);
    var eb = $('ceEditBtn');
    if (eb && !eb.hidden) {
      eb.classList.toggle('is-held', !!heldByOther);
      eb.title = heldByOther
        ? (S.lock.name || 'Someone else') + ' is editing this area — you can take over'
        : 'Edit this area';
    }
    /* THE NOTE SAYS NOTHING IN EDIT MODE, and that is the finished state.

       It said "Editing the draft · numbers recalculate live", then — once the
       first half was cut for repeating the lit Edit button — "Numbers
       recalculate as you edit". Both were waffle. A clause number is not
       editable text, so nobody can type one by hand and be corrected; and the
       first time anyone moves a clause the document renumbers in front of
       them. A permanent line explaining something the tool demonstrates on
       first use is reassurance holding a slot on the bar.

       What is left are the two states that answer a question the screen
       raises: why there is no Edit button, and why pressing it will take an
       area off somebody. */
    if (!canEdit()) note.textContent = 'Read-only access';
    else if (heldByOther) note.textContent = (S.lock.name || 'Someone else') + ' is editing this area';
    else note.textContent = '';
    [].forEach.call(document.querySelectorAll('#ceMode button'), function (b) {
      b.classList.toggle('is-on', b.dataset.mode === S.mode);
    });
    renderDocNav();
  }

  /* ================= Data layer ================= */
  function nodesRef() { return db.ref(BASE + '/draft/docs/' + S.docId + '/nodes'); }
  function metaRef()  { return db.ref(BASE + '/draft/docs/' + S.docId + '/meta'); }

  /* Entering edit is a claim on the area, not just a mode change. */
  function enterEdit() {
    claimLock(false).then(function (r) {
      if (r.ok) {
        if (r.degraded) {
          NL.toast && NL.toast('Could not check the edit lock — carry on, but ' +
            'check nobody else is in this area.', 'info');
        }
        S.mode = 'edit'; render();
        return;
      }
      var who = (r.held && r.held.name) || 'Someone else';
      var mins = Math.max(1, Math.round((Date.now() - ((r.held && r.held.at) || Date.now())) / 60000));
      NL.confirm(
        '<strong>' + esc(who) + '</strong> is editing this area — they started ' +
        mins + ' minute' + (mins === 1 ? '' : 's') + ' ago.' +
        '<p>Two people editing one area is the one thing this tool handles badly: ' +
        'the last save wins, silently, and an undo can reverse the other person\u2019s ' +
        'work without either of you seeing it.</p>' +
        '<p style="margin:0">Taking over puts them back into Read. Anything they have ' +
        'already typed is saved.</p>',
        { title: 'Already being edited', html: true,
          confirmText: 'Take over', cancelText: 'Stay in Read', variant: 'danger' }
      ).then(function (ok) {
        if (!ok) return;
        claimLock(true).then(function (r2) {
          if (!r2.ok) { NL.toast && NL.toast('Could not take over — try again', 'error'); return; }
          NL.writeAudit && NL.writeAudit('edit-lock-takeover',
            'Took over editing ' + S.docId + ' from ' + who);
          S.mode = 'edit'; render();
        });
      });
    });
  }

  /* A clause with nothing in it. Richard: "what happens to clauses left
     empty? In my mind they're simply erased on exit if empty."

     Deliberately narrow. It must never take anything a person could have
     meant to keep, so a clause survives if it has ANY of: text, a heading,
     a table, or sub-clauses — a parent whose own line is blank is a real
     shape in a legal document and its children are the content. Articles are
     out entirely: an empty section is a section someone made on purpose and
     is about to fill, and losing it would take its place in the numbering
     with it. */
  function isEmptyClause(n, hasKids) {
    if (!n || n.parentId == null) return false;          // never an article
    if (hasKids) return false;
    if (n.kind === 'table' || n.table) return false;
    if ((n.title || '').trim()) return false;
    return !(n.body || '').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
  }

  /* Sweep them on the way out of edit mode — NOT on blur. Blur fires when you
     click a button, so a blur-time sweep would delete the clause you had just
     added on your way to typing in it. */
  function pruneEmptyClauses() {
    var kids = {};
    Object.keys(S.nodes).forEach(function (id) {
      var p = S.nodes[id].parentId; if (p != null) kids[p] = true;
    });
    var gone = Object.keys(S.nodes).filter(function (id) {
      return isEmptyClause(S.nodes[id], kids[id]);
    });
    if (!gone.length) return Promise.resolve();
    var c = JSON.parse(JSON.stringify(S.nodes));
    gone.forEach(function (id) { delete c[id]; });
    if (S.selectedId && !c[S.selectedId]) S.selectedId = null;
    /* Say so, and only once it has actually happened. Silent deletion in a
       legal document is worse than the clutter, and undo is the way back —
       which is why this goes through commit() rather than writing direct. */
    var what = gone.length + ' empty clause' + (gone.length === 1 ? '' : 's');
    return Promise.resolve(commit(c, 'Removed ' + what)).then(function () {
      NL.toast && NL.toast('Removed ' + what + ' — undo if that was wrong', 'info');
    });
  }

  /* A clause added and never typed in, dropped the moment focus leaves it.

     Richard: "if I added a clause and then didn't type anything and I click
     away, I want it simply to be removed, as though I never clicked. Otherwise
     I'm accidentally setting up loads of blank clauses and I've completely
     destroyed the document with loads of gaps."

     This is a strictly narrower thing than the sweep on leaving edit mode, and
     narrower on purpose: it only ever touches a clause created seconds ago in
     this session that has had nothing typed into it. It cannot reach existing
     content, whatever state that content is in.

     Two exemptions, both for focus that is not "clicking away":
       · the action bar — a bar press blurs the clause it is about to act on,
         so sweeping here would delete the clause on the way to indenting it.
       · anywhere still inside the same clause: a heading field and a body
         field are two focus stops in one clause. */
  function sweepVirgin(id, now) {
    /* The id is passed in, not read off S.virgin — by the time this runs a
       tick later, pressing the insert strip may already have added ANOTHER
       clause and moved the flag onto it, and this would sweep the new one. */
    if (!id || S.mode !== 'edit') return;
    var inside = now && now.closest;
    if (inside && (now.closest('#ceActs') || now.closest('#c-' + id))) return;
    var n = S.nodes[id];
    if (S.virgin === id) S.virgin = null;
    if (!n || !isEmptyClause(n, childrenOf(S.nodes, id).length > 0)) return;

    /* Where the caret was heading. commit() re-renders, which would otherwise
       drop it — you would click into clause 9 and land nowhere. */
    var landing = inside && now.closest('[data-id]');
    var landingId = landing ? landing.dataset.id : null;

    var c = JSON.parse(JSON.stringify(S.nodes));
    delete c[id];
    if (S.selectedId === id) S.selectedId = landingId || null;
    Promise.resolve(commit(c, 'Removed an untouched new clause')).then(function () {
      if (landingId && S.nodes[landingId]) focusNode(landingId);
    });
  }

  function leaveEdit() {
    var was = S.mode;
    if (was !== 'edit') { S.mode = 'read'; render(); return; }
    /* Wait for the save the outgoing blur just started, or the sweep clones a
       stale S.nodes and erases what was typed into the clause being left. */
    afterPendingSave(function () {
      pruneEmptyClauses().then(function () {
        S.mode = 'read';
        render();
        releaseLock();
      });
    });
  }

  /* ================= The edit lock =================
     One editor per area at a time. Two people in the same area is the one
     situation this tool handles badly and cannot detect: the last save wins,
     silently, and undo makes it worse — one person's undo restores a snapshot
     that predates the other's change and quietly reverses it.

     A SOFT lock, deliberately. It is enforced here, not in the rules, and it
     can always be taken over. A hard lock on a shared legal document is one
     closed laptop away from nobody being able to edit the handbook, and the
     person who could fix that is the person who has gone home.

     onDisconnect().remove() is why this can be soft and still work: Firebase
     drops the lock server-side when the tab closes, the network goes, or the
     laptop sleeps — no timeout to wait out in the ordinary case. The staleness
     window below is only for the case onDisconnect cannot cover (a wedged
     socket that the server still believes in). It lives under draft/, so the
     existing admin-only write rule already covers it. */
  var LOCK_STALE_MS = 3 * 60 * 1000;
  var LOCK_BEAT_MS = 45 * 1000;

  function lockRef(id) { return db.ref(BASE + '/draft/locks/' + (id || S.docId)); }
  function myUid() { return (firebase.auth().currentUser || {}).uid || ''; }
  function myName() {
    return (S.session && (S.session.name || S.session.email)) || 'Someone';
  }
  function lockIsMine(v) { return !!v && v.uid === myUid(); }
  function lockIsStale(v) { return !v || (Date.now() - (v.at || 0)) > LOCK_STALE_MS; }

  /* Claim it, or report who has it. A transaction rather than a read-then-write
     because two people pressing Edit at the same moment is precisely the case
     this exists for, and a read-then-write would hand it to both. */
  function claimLock(force) {
    var id = S.docId, uid = myUid();
    if (!id || !uid) return Promise.resolve({ ok: false });
    return lockRef(id).transaction(function (cur) {
      if (cur && !lockIsMine(cur) && !lockIsStale(cur) && !force) return;  // abort
      return { uid: uid, name: myName(), at: firebase.database.ServerValue.TIMESTAMP };
    }).then(function (res) {
      if (!res.committed) return { ok: false, held: res.snapshot.val() };
      /* Let it go by itself when the tab does. */
      lockRef(id).onDisconnect().remove();
      startLockBeat();
      return { ok: true };
    }).catch(function () {
      /* A lock we cannot write must not stop the work — that would be a hard
         lock arrived at by accident, which is the thing being avoided. */
      return { ok: true, degraded: true };
    });
  }

  function releaseLock(id) {
    stopLockBeat();
    var ref = lockRef(id || S.docId);
    ref.onDisconnect().cancel();
    return ref.transaction(function (cur) {
      /* Never remove someone else's — a take-over means the lock is theirs. */
      return (cur && cur.uid !== myUid()) ? undefined : null;
    }).catch(function () {});
  }

  /* Keep it warm so the staleness window never opens under a live editor. */
  var lockBeat = null;
  function startLockBeat() {
    stopLockBeat();
    lockBeat = setInterval(function () {
      if (S.mode !== 'edit' || !S.docId) return;
      lockRef().transaction(function (cur) {
        if (cur && !lockIsMine(cur)) return;   // taken over: stop touching it
        return { uid: myUid(), name: myName(), at: firebase.database.ServerValue.TIMESTAMP };
      }).catch(function () {});
    }, LOCK_BEAT_MS);
  }
  function stopLockBeat() { if (lockBeat) { clearInterval(lockBeat); lockBeat = null; } }

  /* Watch the area's lock so the Edit button can say who has it, and so an
     editor whose lock is taken from them finds out rather than typing into a
     document somebody else is also typing into. */
  var lockOff = null;
  function watchLock() {
    if (lockOff) { lockOff(); lockOff = null; }
    if (!S.docId) return;
    var ref = lockRef(), id = S.docId;
    var cb = ref.on('value', function (snap) {
      S.lock = snap.val();
      if (S.mode === 'edit' && S.lock && !lockIsMine(S.lock)) {
        /* Someone took it. Drop to Read rather than let two people save over
           each other — the alternative is losing work quietly. */
        S.mode = 'read';
        stopLockBeat();
        NL.alert && NL.alert(esc(S.lock.name || 'Someone else') +
          ' has taken over editing this area. Your changes so far are saved; ' +
          'you are back in Read.', { title: 'Editing taken over' });
        render();
        return;
      }
      syncBar();
    });
    lockOff = function () { ref.off('value', cb); };
  }

  function switchDoc(id) {
    if (id === '__cover') { if (S.docId !== null) showCover(); return; }
    if (id === S.docId) return;
    /* Leaving an area gives its lock straight back — a lock held by someone
       who has wandered off to another section is a lock nobody meant to take. */
    if (S.mode === 'edit' && S.docId && S.docId !== id) releaseLock(S.docId);
    /* Folds are ids from the area being left; they would not resolve in the
       next one, and a stale entry would fold whatever happened to share a key. */
    S.docId = id; S.selectedId = null; S.mode = 'read'; S.lock = null; S.collapsed = {}; S.foldLevel = null;
    /* The stacks hold node ids from the area being left. Carrying them across
       would offer an undo that restores another area's clauses into this one. */
    S.undo.length = 0; S.redo.length = 0; S.showTitleFor = null;
    if ($('ceSearch')) $('ceSearch').value = '';   // manual switch shows that area's outline
    closeDrawer();
    load();
  }

  function load() {
    if (!S.docId) { render(); return Promise.resolve(); }   // cover — nothing to fetch
    // Reset to the area's fallback identity so an un-imported area still shows
    // its proper name (meta, if present, overrides below).
    var reqDoc = S.docId;
    S.doc = { id: S.docId, title: docTitle(S.docId), subtitle: '', season: '' };
    S.nodes = {};
    render(); // show the area heading / empty state immediately while data loads
    return NL.ensureAuth().then(function () {
      /* Start watching this area's lock as soon as we are authenticated, so
         the Edit button already knows whether anyone is in there. */
      if (canEdit()) watchLock();
      return Promise.all([metaRef().once('value'), nodesRef().once('value')]);
    }).then(function (res) {
      if (reqDoc !== S.docId) return; // user switched area before this resolved
      var meta = res[0].val(), nodes = res[1].val() || {};
      if (meta) S.doc = Object.assign(S.doc, meta);
      // Restore fields Firebase drops/coerces (null parentId, sparse table arrays).
      Object.keys(nodes).forEach(function (id) { normNode(nodes[id], id); });
      S.nodes = nodes;
      render();
    }).catch(function (e) {
      console.error('[handbook] load failed', e);
      NL.toast && NL.toast('Could not load the draft: ' + (e && e.message || e), 'error');
    });
  }

  function importSeed() {
    var file = SEEDS[S.docId], title = docTitle(S.docId), target = S.docId;
    if (!file) { NL.alert('There’s no import file for ' + title + ' yet. Start it by hand in Edit mode, or send the source document to seed it.', { title: 'No source yet' }); return; }
    var hasContent = Object.keys(S.nodes).length > 0;
    var msg = hasContent
      ? 'Re-import ' + title + ' from the source? This replaces everything currently in the ' + title + ' area with a fresh import — any edits you have made here will be lost. (Other areas are unaffected.)'
      : 'Import ' + title + ' into the draft? This is a best-effort parse from the source — you’ll refine it here.';
    NL.confirm(msg, { confirmText: hasContent ? 'Replace with fresh import' : 'Import', title: (hasContent ? 'Re-import ' : 'Import ') + title, variant: hasContent ? 'danger' : 'primary' })
      .then(function (ok) {
        if (!ok) return;
        return fetch(file).then(function (r) {
          if (!r.ok) throw new Error(file + ' not found (' + r.status + ')');
          return r.json();
        });
      }).then(function (seed) { return applySeed(seed, target); })
      .catch(function (e) {
        NL.toast && NL.toast('Import failed: ' + (e && e.message || e), 'error');
      });
  }

  // Shared writer for both import routes: the committed seed-*.json fetch
  // above, and the .docx the user picks off their own machine below.
  function applySeed(seed, target) {
    if (seed && target !== S.docId) { NL.toast && NL.toast('Area changed — import cancelled', 'info'); return; }
    if (!seed) return;
    var map = {}, now = Date.now();
    seed.nodes.forEach(function (n) {
      map[n.id] = {
        id: n.id, parentId: n.parentId, order: n.order || 0, kind: n.kind || 'clause',
        numStyle: n.numStyle || 'decimal', numberOverride: n.numberOverride || null,
        title: n.title || null, body: n.body || null, table: n.table || null,
        updatedAt: now, updatedBy: 'import'
      };
    });
    return NL.ensureAuth().then(function () {
      return Promise.all([
        metaRef().set({ title: seed.doc.title, subtitle: seed.doc.subtitle || '', season: seed.doc.season || '' }),
        nodesRef().set(map)
      ]);
    }).then(function () {
      S.doc = Object.assign(S.doc, seed.doc);
      S.nodes = map;
      S.index = null; // search index is now stale
      NL.writeAudit && NL.writeAudit('import', 'Imported ' + seed.nodes.length + ' nodes into ' + S.docId);
      NL.toast && NL.toast('Imported ' + seed.nodes.length + ' clauses', 'success');
      render();
    });
  }

  // Import straight from a .docx on the user's machine. Nothing is uploaded
  // anywhere and nothing is committed — the file is parsed in the browser
  // and written to RTDB, which is the only place this content should live.
  function importUpload(files) {
    var title = docTitle(S.docId), target = S.docId;
    if (!files || !files.length) return;
    var bad = files.filter(function (f) { return !/\.docx?$/i.test(f.name); });
    if (bad.length) {
      NL.alert('Only Word documents (.doc or .docx) can be imported. Not a Word file: ' +
        bad.map(function (f) { return f.name; }).join(', '), { title: 'Wrong file type' });
      return;
    }
    if (!global_HB_ready()) { NL.alert('The document importer failed to load — try a hard refresh.', { title: 'Importer unavailable' }); return; }

    // Several documents share one area (the appendices are 15 files), so
    // they must be imported in one go — importing them one at a time would
    // mean each replaced the last. Sort by filename so Appendix A lands
    // before B regardless of the order they were picked in.
    files = files.slice().sort(function (a, b) { return a.name.localeCompare(b.name, 'en', { numeric: true }); });

    var many = files.length > 1;
    var what = many ? files.length + ' documents' : '“' + files[0].name + '”';
    var hasContent = Object.keys(S.nodes).length > 0;
    NL.confirm(
      (hasContent
        ? 'Replace everything in the ' + title + ' area with a fresh parse of ' + what + '? Anything currently in this area is discarded. (Other areas are unaffected.)'
        : 'Import ' + what + ' into ' + title + '? This is a best-effort parse — you’ll refine it here.') +
      (many ? '\n\nIn order: ' + files.map(function (f) { return f.name; }).join(', ') : ''),
      { confirmText: hasContent ? 'Replace with these documents' : 'Import', title: 'Import ' + title, variant: hasContent ? 'danger' : 'primary' }
    ).then(function (ok) {
      if (!ok) return;
      NL.toast && NL.toast('Reading ' + (many ? files.length + ' documents' : files[0].name) + '…', 'info');
      return Promise.all(files.map(function (f) {
        return f.arrayBuffer()
          .then(function (buf) { return window.HB_DOCX.parse(buf); })
          .then(function (seed) { return { name: f.name, seed: seed }; })
          .catch(function (e) { throw new Error(f.name + ': ' + (e && e.message || e)); });
      })).then(function (parsed) {
        var seed = many ? window.HB_DOCX.merge(parsed, docTitle(target)) : parsed[0].seed;
        // The parser names the doc from the source; keep the area's own
        // title so an import cannot rename the area out from under us.
        seed.doc = Object.assign({}, seed.doc, { id: target, title: docTitle(target) });
        return applySeed(seed, target);
      });
    }).catch(function (e) {
      NL.toast && NL.toast('Import failed: ' + (e && e.message || e), 'error');
    });
  }

  function global_HB_ready() { return !!(window.HB_DOCX && window.HB_DOCX.parse); }

  // Persist a clone as the new draft: diff against S.nodes, write changed + null-out removed.
  var UNDO_MAX = 20;

  /* Remember where we were, so it can be got back to. Called by commit() for
     every change, which is the point: one stack on the single write path
     covers structural ops and typing alike, and nothing can be added later
     that quietly escapes it.

     An undo is itself a commit, so it must not push its own before-state onto
     the stack — S.timeTravel says "this commit IS the time travel". */
  function pushUndo(label) {
    if (S.timeTravel) return;
    S.undo.push({ nodes: JSON.parse(JSON.stringify(S.nodes)), label: label || 'change' });
    if (S.undo.length > UNDO_MAX) S.undo.shift();
    /* A new change after undoing abandons the redo branch, as everywhere. */
    S.redo.length = 0;
  }

  function timeTravel(from, to, verb) {
    var step = from.pop();
    if (!step) { NL.toast && NL.toast('Nothing to ' + verb, 'info'); return; }
    to.push({ nodes: JSON.parse(JSON.stringify(S.nodes)), label: step.label });
    S.timeTravel = true;
    /* commit(), not previewThenCommit(): this is a restore, and a renumber
       preview asking whether you meant to undo is the opposite of an undo. */
    /* keepStamps: this is a restoration, not an edit. The clause goes back to
       exactly what it was — including who last changed it and when — so
       undoing an accidental edit leaves no trace of the edit OR of the undo
       on the clause itself. */
    var done = commit(step.nodes, verb + ': ' + step.label, { keepStamps: true });
    Promise.resolve(done).then(function () {
      S.timeTravel = false;
      /* The selected clause may have been what was undone. */
      if (S.selectedId && !S.nodes[S.selectedId]) S.selectedId = null;
      syncUndoBtns(); syncActionBar();
      NL.toast && NL.toast(verb === 'Undo' ? 'Undone: ' + step.label : 'Redone: ' + step.label, 'success');
    });
  }
  function doUndo() { timeTravel(S.undo, S.redo, 'Undo'); }
  function doRedo() { timeTravel(S.redo, S.undo, 'Redo'); }

  function syncUndoBtns() {
    var u = $('ceUndo'), r = $('ceRedo'), g = $('ceUndoGrp');
    var on = (S.mode === 'edit' && canEdit() && !!S.docId);
    /* The group carries the rule that separates it from Read/Edit, so it is
       the group that hides — otherwise read mode shows a divider with nothing
       after it. */
    if (g) g.hidden = !on;
    if (u) { u.disabled = !S.undo.length; u.title = S.undo.length ? 'Undo ' + S.undo[S.undo.length - 1].label + ' (Ctrl+Z)' : 'Nothing to undo'; }
    if (r) { r.disabled = !S.redo.length; r.title = S.redo.length ? 'Redo ' + S.redo[S.redo.length - 1].label + ' (Ctrl+Shift+Z)' : 'Nothing to redo'; }
  }

  /* opts.keepStamps — a RESTORE puts back what was there, stamps included.
     Without it, undo wrote the old text back and stamped it as edited just
     now, by you: the clause read "changed a moment ago" when what actually
     happened was that a change was taken away. An undo that leaves its own
     fingerprints has not stepped back, it has stepped forward into a state
     that looks like the old one. */
  function commit(clone, label, opts) {
    opts = opts || {};
    pushUndo(label);
    var updates = {}, now = Date.now();
    var who = (S.session && (S.session.name || S.session.email)) || null;
    Object.keys(clone).forEach(function (id) {
      var a = clone[id], b = S.nodes[id];
      if (!b || JSON.stringify(strip(a)) !== JSON.stringify(strip(b))) {
        if (!opts.keepStamps) { a.updatedAt = now; a.updatedBy = who; }
        updates[id] = a;
      }
    });
    Object.keys(S.nodes).forEach(function (id) { if (!clone[id]) updates[id] = null; });
    if (!Object.keys(updates).length) return Promise.resolve();
    return NL.ensureAuth().then(function () { return nodesRef().update(updates); }).then(function () {
      S.nodes = clone;
      S.index = null; // search index is now stale
      /* After writeAudit, not before: writeAudit suppresses the automatic
         audit hook for 500ms, and inside that window this timestamp does not
         earn an audit line of its own on every keystroke-save. */
      NL.writeAudit && NL.writeAudit('edit', label);
      touchDraft();
      render();
      syncUndoBtns();
      if (S.focusNew) {
        focusNode(S.focusNew);
        /* A new clause is empty, so the only marks of its arrival are a number
           and a grey placeholder in a wall of text. Flash it, briefly, so "did
           that do anything" is not a question anyone has to ask. */
        flash(S.focusNew);
        S.focusNew = null;
      }
    }).catch(function (e) {
      NL.toast && NL.toast('Save failed: ' + (e && e.message || e), 'error');
      load();
    });
  }
  function strip(n) { return { parentId: n.parentId, order: n.order, kind: n.kind, numStyle: n.numStyle, numberOverride: n.numberOverride, title: n.title, body: n.body, table: n.table || null }; }
  /* Firebase returns arrays as objects when sparse — coerce a node's table back
     to arrays. Also stamps the id.

     THE ID IS THE KEY, and storing a second copy of it inside the value was
     always the fragile half of that. computeNumbers writes map[k.id] and
     renderNode reads numMap[node.id]: both use the PROPERTY, so a node whose
     stored value happens not to carry one collapses the whole area onto
     map[undefined] — every clause shows the same number and no child renders
     at all, because walk() recurses on childrenOf(nodes, undefined).

     That is not hypothetical. "Discard all changes" (v0.59) wrote its clauses
     through strip(), which does not include the id, and did it to all five
     areas at once. Every writer before it had passed whole node objects
     through, so nothing had ever exercised the gap.

     Stamping here fixes the draft on the next load with no database write and
     no migration: the keys were never damaged, only the copy. */
  function normNode(n, id) {
    if (id !== undefined) n.id = id;
    if (n.parentId === undefined) n.parentId = null;
    if (n.order === undefined) n.order = 0;
    if (n.table) {
      var t = n.table;
      t.header = Array.isArray(t.header) ? t.header : (t.header ? Object.values(t.header) : []);
      t.rows = Array.isArray(t.rows) ? t.rows : (t.rows ? Object.values(t.rows) : []);
      t.rows = t.rows.map(function (r) { return Array.isArray(r) ? r : (r ? Object.values(r) : []); });
    }
    return n;
  }
  function clone() { return JSON.parse(JSON.stringify(S.nodes)); }
  function uid() { return 'n' + Date.now().toString(36) + Math.floor(Math.random() * 1e4).toString(36); }
  function reindex(nodes, pid) { childrenOf(nodes, pid).forEach(function (n, i) { n.order = i; }); }

  /* A renumber preview is worth a dialog when the renumber is a SURPRISE —
     indenting, moving, changing a numbering style. It is not worth one when
     the user has just been told the number and pressed a button that said it:
     "Add 1.3 here" followed by "this will renumber 1.3 to 1.4, apply?" asks
     someone to confirm the thing they just chose, and a second dialog on a
     correct action is how a correct action comes to feel broken.

     So adds and deletes commit straight through — the insert strip announced
     the number, and delete has its own confirmation naming the clause. Only
     the surprising renumbers keep the preview. */
  function commitAdd(c, label, newId) {
    /* Every add comes through here, which is why the flag is set here and not
       at the three call sites — the fourth one added later would not have it. */
    S.virgin = newId || null;
    var done = commit(c, label);
    var num = newId ? computeNumbers(c)[newId] : '';
    NL.toast && NL.toast(num ? 'Added ' + num : 'Added', 'success');
    return done;
  }

  // Show a renumber preview when a structural change moves numbers, then commit.
  function previewThenCommit(c, label) {
    var before = computeNumbers(S.nodes), after = computeNumbers(c);
    var changes = [];
    Object.keys(after).forEach(function (id) {
      if (before[id] != null && before[id] !== after[id] && S.nodes[id]) changes.push([before[id], after[id]]);
    });
    var added = Object.keys(c).filter(function (id) { return !S.nodes[id]; }).length;
    var removed = Object.keys(S.nodes).filter(function (id) { return !c[id]; }).length;
    if (!changes.length) return commit(c, label);
    var rows = changes.slice(0, 40).map(function (p) {
      return '<tr><td class="from">' + esc(p[0]) + '</td><td class="arrow">→</td><td class="to">' + esc(p[1]) + '</td></tr>';
    }).join('');
    var extra = changes.length > 40 ? '<p style="color:var(--text-muted);font-size:var(--text-xs)">…and ' + (changes.length - 40) + ' more.</p>' : '';
    var body = document.createElement('div');
    body.innerHTML = '<p>This change will renumber <b>' + changes.length + '</b> clause' + (changes.length === 1 ? '' : 's') +
      (added ? ' · <b>' + added + '</b> added' : '') + (removed ? ' · <b>' + removed + '</b> removed' : '') + ':</p>' +
      '<table class="ce-diff">' + rows + '</table>' + extra;
    NL.modal({
      title: 'Confirm renumber', body: body, width: 'wide',
      buttons: [
        { label: 'Cancel', onClick: function (ctrl) { ctrl.close(false); } },
        { label: 'Apply', className: 'btn--primary', autofocus: true, onClick: function (ctrl) { ctrl.close(true); } }
      ],
      onClose: function (ok) { if (ok) commit(c, label); else S.focusNew = null; }
    });
  }

  // Drop the caret into a clause's body (used after adding a clause).
  function focusNode(id) {
    var el = document.querySelector('#c-' + id + ' .nl-clause__text[contenteditable]');
    if (!el) return;
    el.focus();
    try {
      var r = document.createRange(); r.selectNodeContents(el); r.collapse(true);
      var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
    } catch (e) {}
    el.scrollIntoView({ block: 'center' });
  }

  /* Drop the caret into a clause's heading (used after "+ heading"). An
     ARTICLE's heading is .nl-art__title, not .nl-clause__title — and since
     articles stopped drawing an empty title row, "+ heading" is the only way
     to give one a title, so missing it here would leave the caret nowhere. */
  function focusTitle(id) {
    var el = document.querySelector('#c-' + id + ' .nl-clause__title[contenteditable]') ||
             document.querySelector('#c-' + id + ' .nl-art__title[contenteditable]');
    if (!el) return;
    el.focus();
    try {
      var r = document.createRange(); r.selectNodeContents(el); r.collapse(true);
      var s2 = window.getSelection(); s2.removeAllRanges(); s2.addRange(r);
    } catch (e) {}
  }

  /* ================= Where a new clause will land =================
     Richard: "it's almost impossible to know where I'm placing a new item."
     He was right — "+ clause" adds after whatever happens to be selected, and
     nothing on screen said which that was or where the result would appear.

     So: hovering the document draws a line at the boundary a new clause would
     land on, at the depth it would land at. The line IS the answer — it sits
     between the two clauses it would sit between. Click the + to take it.

     One element, moved. A drop zone rendered between every pair of clauses
     would be 1,203 of them, which is the per-clause toolbar mistake again. */
  /* el/side: what the pointer is over, which is what opens the gap.
     refId/where: where the clause actually goes, after canonicalising. */
  /* Pressing a control blurs the clause being typed in, and that blur is what
     SAVES it. The save is async, so an op that ran immediately would clone a
     stale S.nodes and commit the text away again. Everything the bar and the
     insert strip do therefore waits on the save the click itself triggered.

     Not solved by preventing the blur: then the typing is never saved at all,
     and the op commits a clone that has never seen it. The blur has to happen;
     the op has to wait.

     TOP LEVEL, not inside wire(). It was declared in there, and takeInsert —
     which lives out here — called it. Valid syntax, so node --check passed;
     a ReferenceError at click time, so the insert strip did nothing at all
     and did it silently. Guarded now in tests/handbook-scope.test.mjs. */
  function afterPendingSave(fn) {
    Promise.resolve(S.pendingSave).catch(function () {}).then(function () {
      S.pendingSave = null;
      fn();
    });
  }

  var INS = { refId: null, where: null, el: null, side: null };
  var GAP = 30;   // must match .hb-gap-before / .hb-gap-after in the CSS

  /* Close the gap and put the strip away. */
  function hideInsert() {
    if (INS.el) {
      INS.el.classList.remove('hb-gap-before', 'hb-gap-after');
      INS.el = null;
    }
    INS.refId = null; INS.where = null; INS.side = null;
    var el = $('ceIns'); if (el) el.hidden = true;
  }

  function showInsertFor(clauseEl, clientY) {
    var el = $('ceIns'); if (!el) return;
    var r = clauseEl.getBoundingClientRect();

    /* Measure against the CONTENT edges, not the padded box. When the gap is
       already open on this clause its own padding has moved the bottom edge
       30px further down, and testing against that moved edge would put the
       pointer outside the band that opened it — the gap would shut, which
       would move the edge back, which would reopen it. */
    var openBefore = clauseEl.classList.contains('hb-gap-before');
    var openAfter = clauseEl.classList.contains('hb-gap-after');
    var top = r.top + (openBefore ? GAP : 0);
    var bottom = r.bottom - (openAfter ? GAP : 0);

    /* Only near an edge. In the middle of a clause the pointer is over text
       someone is reading, and a line through it is noise — the gap between
       two clauses is the gesture, so the gap has to be what offers it.
       Generous once open, so a slow hand does not lose it on the way. */
    var reach = Math.min(16, Math.max(6, (bottom - top) / 3));
    var where = null;
    if (clientY <= top + reach) where = 'before';
    else if (clientY >= bottom - reach) where = 'after';
    if (!where) { hideInsert(); return; }

    /* CANONICALISE THE GESTURE, NOT ONLY THE TARGET.

       v0.42 canonicalised where the clause would LAND, so both hovers on one
       boundary already produced the same insertion. What it did not do was
       move the gap: hovering the bottom of 2 opened a gap under 2, hovering
       the top of 3 opened a different gap above 3, and the two sat 30px apart
       on screen. Identical outcome, two visibly separate offers — which is
       the thing that was complained about, and it survived the fix aimed at
       it. Richard, again: "I'm being offered that in two different areas."

       So redirect the gap as well. A hover that resolves to somebody else's
       boundary opens THAT clause's gap instead of its own.

       This settles rather than oscillates: opening 2's gap pushes 3 down by
       exactly the gap height, so the pointer — which has not moved — is now
       inside 2's padding, where the next mousemove finds 2 directly and
       canonicalises to itself. One redirect, then stable. */
    var canon = canonicalBoundary(clauseEl.dataset.id, where);
    if (canon.refId !== clauseEl.dataset.id || canon.where !== where) {
      var alt = $('c-' + canon.refId);
      if (alt) { clauseEl = alt; where = canon.where; }
    }

    if (INS.el !== clauseEl || INS.side !== where) {
      if (INS.el) INS.el.classList.remove('hb-gap-before', 'hb-gap-after');
      clauseEl.classList.add(where === 'before' ? 'hb-gap-before' : 'hb-gap-after');
      INS.el = clauseEl;
      INS.side = where;

      INS.refId = clauseEl.dataset.id;
      INS.where = where;

      var num = previewNumber(INS.refId, INS.where);
      var hint = el.querySelector('.hb-ins__hint');
      if (hint) hint.textContent = num ? 'Add ' + num + ' here' : 'Add a clause here';
      el.setAttribute('aria-label', num ? 'Add clause ' + num + ' here' : 'Add a clause here');
    }

    /* Re-measure: adding the padding has just moved things. */
    var r2 = clauseEl.getBoundingClientRect();
    el.hidden = false;
    el.style.left = r2.left + 'px';
    el.style.width = r2.width + 'px';
    /* Centre of the gap the clause has just opened. */
    el.style.top = (where === 'before' ? r2.top + GAP / 2 : r2.bottom - GAP / 2) + 'px';
  }

  /* ONE GAP, ONE MEANING.
     Between two clauses at the same level, "after the one above" and "before
     the one below" are the same insertion — same parent, same position, same
     resulting number. Offering both made every gap look like two choices that
     were somehow different. Canonicalise to "after the one above".

     "Before" survives only where it is genuinely distinct: a clause with no
     previous sibling, i.e. the first child of its parent. There the boundary
     really does host two different insertions — one beside the parent, one
     inside it — which is the case Richard identified as the one that makes
     sense. They are drawn at different indents, so the strip shows which. */
  function canonicalBoundary(refId, where) {
    if (where !== 'before') return { refId: refId, where: where };
    var t = S.nodes[refId];
    if (!t) return { refId: refId, where: where };
    var sibs = childrenOf(S.nodes, t.parentId);
    var i = sibs.map(function (x) { return x.id; }).indexOf(refId);
    return i > 0
      ? { refId: sibs[i - 1].id, where: 'after' }
      : { refId: refId, where: 'before' };
  }

  /* The shape a new clause takes at a boundary. Shared by the preview and the
     insert itself, so the number offered is the number delivered — a preview
     computed from a second guess at the same rules is a preview that will
     eventually lie. */
  function newSpecAt(t, where) {
    var bullet = t.kind === 'bullet';
    return {
      parentId: t.parentId,
      order: (t.order || 0) + (where === 'before' ? -0.5 : 0.5),
      kind: bullet ? 'bullet' : 'clause',
      numStyle: bullet ? 'bullet' : (t.numStyle || 'decimal')
    };
  }

  /* What number would it get? computeNumbers is pure, so this is just a walk
     over a hypothetical tree.

     A LIGHT clone, not JSON.parse(JSON.stringify(S.nodes)): numbering reads
     only parentId, order, kind, numStyle and numberOverride, and League Rules
     is 560 clauses of body text that would be copied for nothing. Recomputed
     on a boundary CHANGE, never per mousemove. */
  function previewNumber(refId, where) {
    var t = S.nodes[refId];
    if (!t) return '';
    var shadow = {};
    Object.keys(S.nodes).forEach(function (id) {
      var n = S.nodes[id];
      shadow[id] = { id: id, parentId: n.parentId, order: n.order,
        kind: n.kind, numStyle: n.numStyle, numberOverride: n.numberOverride };
    });
    var spec = newSpecAt(t, where);
    shadow.__preview__ = {
      id: '__preview__', parentId: spec.parentId, order: spec.order,
      kind: spec.kind, numStyle: spec.numStyle, numberOverride: null
    };
    try { return computeNumbers(shadow).__preview__ || ''; }
    catch (e) { return ''; }
  }

  function takeInsert() {
    var ref = INS.refId, where = INS.where;
    if (!ref) return;
    hideInsert();
    afterPendingSave(function () {
      if (S.nodes[ref]) OPS[where === 'before' ? 'insertBefore' : 'insertAfter'](ref);
    });
  }

  /* ================= Structural operations ================= */
  function newNode(parentId, numStyle, kind) {
    return { id: uid(), parentId: parentId, order: 0, kind: kind || 'clause', numStyle: numStyle || 'decimal', numberOverride: null, title: null, body: '' };
  }
  // Structural ops use fractional orders + reindex() so a node lands exactly
  // where intended, then orders are normalised to 0..n within each parent.
  var OPS = {
    addAfter: function (id) {
      var c = clone(), t = c[id];
      var n = newNode(t.parentId, t.kind === 'bullet' ? 'bullet' : t.numStyle, t.kind);
      n.order = (t.order || 0) + 0.5; c[n.id] = n;
      reindex(c, t.parentId);
      S.selectedId = n.id; S.focusNew = n.id;
      commitAdd(c, 'Add clause after ' + id, n.id);
    },
    /* Insert at a boundary the user pointed at, at that clause's own depth —
       so the line they saw is where it goes. addAfter is the same thing with
       the reference chosen for you. */
    insertBefore: function (id) { insertRelative(id, 'before'); },
    insertAfter: function (id) { insertRelative(id, 'after'); },
    addTable: function (id) {
      var c = clone(), t = c[id];
      var n = {
        id: uid(), parentId: t.parentId, order: (t.order || 0) + 0.5, kind: 'table',
        numStyle: 'none', numberOverride: null, title: null, body: null,
        table: { header: ['Column 1', 'Column 2'], rows: [['', ''], ['', '']] }
      };
      c[n.id] = n; reindex(c, t.parentId);
      S.selectedId = n.id;
      commitAdd(c, 'Add table after ' + id, n.id);
    },
    addSub: function (id) {
      var c = clone(), t = c[id];
      var childHas = childrenOf(c, id)[0];
      var style = childHas ? childHas.numStyle
        : (t.numStyle === 'decimal' ? 'decimal' : (t.numStyle === 'lower-alpha' ? 'lower-roman' : 'lower-alpha'));
      var n = newNode(id, style, 'clause');
      n.order = 1e6; c[n.id] = n;
      reindex(c, id);
      S.selectedId = n.id; S.focusNew = n.id;
      commitAdd(c, 'Add sub-clause under ' + id, n.id);
    },
    indent: function (id) {
      var c = clone(), t = c[id];
      var sibs = childrenOf(c, t.parentId);
      var i = sibs.map(function (x) { return x.id; }).indexOf(id);
      if (i <= 0) { NL.toast && NL.toast('Nothing above to nest under', 'info'); return; }
      var prev = sibs[i - 1], oldParent = t.parentId;
      t.parentId = prev.id; t.order = 1e6;
      reindex(c, oldParent); reindex(c, prev.id);
      previewThenCommit(c, 'Indent ' + id);
    },
    outdent: function (id) {
      var c = clone(), t = c[id];
      if (t.parentId == null) { NL.toast && NL.toast('Already at the top level', 'info'); return; }
      var parent = c[t.parentId], grand = parent.parentId, oldParent = t.parentId;
      t.parentId = grand; t.order = (parent.order || 0) + 0.5;
      reindex(c, grand); reindex(c, oldParent);
      previewThenCommit(c, 'Outdent ' + id);
    },
    up:   function (id) { move(id, -1); },
    down: function (id) { move(id, 1); },
    style: function (id, val) {
      var c = clone(); c[id].numStyle = val;
      if (val === 'bullet') c[id].kind = 'bullet'; else if (c[id].kind === 'bullet') c[id].kind = 'clause';
      previewThenCommit(c, 'Change style of ' + id + ' to ' + val);
    },
    override: function (id) {
      NL.prompt('Pin an exact number for this clause (e.g. 13.B). Leave blank to clear and use the computed number.', {
        title: 'Fixed number', default: S.nodes[id].numberOverride || ''
      }).then(function (v) {
        if (v === null) return;
        var c = clone(); c[id].numberOverride = v.trim() || null;
        previewThenCommit(c, 'Set fixed number on ' + id);
      });
    },
    delete: function (id) {
      var n = S.nodes[id];
      var kids = childrenOf(S.nodes, id).length;
      /* Say WHICH clause, and show its opening words. The action bar is no
         longer beside what it acts on, so "this clause" is a question rather
         than a statement — and on a 560-clause document, deleting the wrong
         one is easy and quiet. */
      var num = (S.numMap && S.numMap[id]) || '';
      var gist = (n.title || String(n.body || '').replace(/<[^>]+>/g, ' ')).replace(/\s+/g, ' ').trim();
      if (gist.length > 90) gist = gist.slice(0, 89) + '\u2026';
      NL.confirm(
        'Delete <strong>' + esc(num || 'this clause') + '</strong>' +
        (kids ? ' and its ' + kids + ' sub-clause' + (kids === 1 ? '' : 's') : '') + '?' +
        (gist ? '<blockquote style="margin:10px 0;padding-left:10px;border-left:3px solid var(--border);color:var(--text-muted)">' + esc(gist) + '</blockquote>' : '') +
        '<p style="margin:0">Undo will bring it back.</p>',
        { confirmText: 'Delete', variant: 'danger', html: true })
        .then(function (ok) {
          if (!ok) return;
          var c = clone();
          (function rm(x) { childrenOf(c, x).forEach(function (k) { rm(k.id); }); delete c[x]; })(id);
          reindex(c, n.parentId);
          if (S.selectedId === id) S.selectedId = null;
          commit(c, 'Delete ' + id);
        });
    }
  };
  function insertRelative(refId, where) {
    var c = clone(), t = c[refId];
    if (!t) return;
    /* Same spec the preview used, so the number shown is the number given. */
    var spec = newSpecAt(t, where);
    var n = newNode(spec.parentId, spec.numStyle, spec.kind);
    n.order = spec.order;
    c[n.id] = n;
    reindex(c, t.parentId);
    S.selectedId = n.id; S.focusNew = n.id;
    commitAdd(c, 'Add clause ' + where + ' ' + refId, n.id);
  }

  function move(id, dir) {
    var c = clone(), t = c[id];
    var sibs = childrenOf(c, t.parentId);
    var i = sibs.map(function (x) { return x.id; }).indexOf(id);
    var j = i + dir;
    if (j < 0 || j >= sibs.length) return;
    t.order = (sibs[j].order || 0) + (dir < 0 ? -0.5 : 0.5);
    reindex(c, t.parentId);
    previewThenCommit(c, 'Move ' + id);
  }

  // Add/remove table rows and columns (structural — re-renders).
  function tableOp(id, op) {
    var node = S.nodes[id]; if (!node || !node.table) return;
    var c = clone(), t = c[id].table;
    if (!Array.isArray(t.header)) t.header = [];
    if (!Array.isArray(t.rows)) t.rows = [];
    var cols = t.header.length || (t.rows[0] ? t.rows[0].length : 1);
    if (op === 'addRow') { var r = []; for (var i = 0; i < cols; i++) r.push(''); t.rows.push(r); }
    else if (op === 'delRow') { if (t.rows.length) t.rows.pop(); }
    else if (op === 'addCol') { if (t.header.length) t.header.push(''); t.rows.forEach(function (r) { r.push(''); }); }
    else if (op === 'delCol') { if (t.header.length > 1) t.header.pop(); t.rows.forEach(function (r) { if (r.length > 1) r.pop(); }); }
    commit(c, 'Edit table ' + id);
  }

  // Persist a single table cell without re-rendering (keeps focus while tabbing).
  function saveTableCell(cell) {
    var host = cell.closest('[data-id]'); if (!host) return;
    var id = host.dataset.id, node = S.nodes[id]; if (!node || !node.table) return;
    /* NOT textContent. It drops a <br> without leaving so much as a space, so
       every line typed into a fee tariff was concatenated back into one the
       moment the cell was left. See cellText. */
    var val = cellText(cell);
    if (cell.hasAttribute('data-th')) {
      var ci = +cell.getAttribute('data-th');
      if ((node.table.header[ci] || '') === val) return;
      node.table.header[ci] = val;
    } else {
      var ri = +cell.getAttribute('data-tr'), cc = +cell.getAttribute('data-tc');
      if (!node.table.rows[ri]) return;
      if ((node.table.rows[ri][cc] || '') === val) return;
      node.table.rows[ri][cc] = val;
    }
    NL.ensureAuth().then(function () {
      return nodesRef().child(id).update({ table: node.table, updatedAt: Date.now(), updatedBy: (S.session && (S.session.name || S.session.email)) || null });
    }).then(function () { S.index = null; }).catch(function (e) { NL.toast && NL.toast('Save failed: ' + (e && e.message || e), 'error'); });
  }

  // The label a node is known by when it has no title of its own — the
  // Memorandum and the Board Directives are body-only throughout. Mirrors
  // textOf() in reader.html so the editor and the reader name a clause
  // identically; they showed different things for the same node otherwise.
  function nodeText(n) {
    if (!n) return '';
    if (n.title) return n.title;
    if (n.body) return n.body.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
    if (n.table) return tableText(n).replace(/\s+/g, ' ').trim();
    return '';
  }

  function tableText(n) {
    if (!n.table) return '';
    var s = (n.table.header || []).join(' ');
    (n.table.rows || []).forEach(function (r) { s += ' ' + (r || []).join(' '); });
    /* Cells hold newlines now, and a search phrase that runs across a line
       break inside one cell should still find it. */
    return s.replace(/\s+/g, ' ');
  }

  /* ================= Publish + export ================= */
  function staticDocHtml(forExport) {
    var numMap = computeNumbers(S.nodes);
    var save = S.mode; S.mode = 'read';
    var roots = childrenOf(S.nodes, null);
    var inner = '<div class="nl-doc"><div class="nl-doc__head"><div class="nl-doc__title">' + esc(S.doc.title) + '</div>' +
      (S.doc.subtitle ? '<div class="nl-doc__sub">' + esc(S.doc.subtitle) + '</div>' : '') +
      '</div>';
    roots.forEach(function (r) { inner += renderNode(r, numMap); });
    inner += '</div>';
    S.mode = save;
    return inner;
  }
  // Bake a given area's nodes to static reader HTML (renderNode reads S.nodes, so we
  // swap it in briefly). Used when freezing a whole-handbook edition.
  function bakeDoc(nodes, meta) {
    var sv = { nodes: S.nodes, doc: S.doc, mode: S.mode };
    S.nodes = nodes; S.mode = 'read';
    S.doc = { id: '', title: (meta && meta.title) || '', subtitle: (meta && meta.subtitle) || '', season: (meta && meta.season) || '' };
    var html = staticDocHtml();
    S.nodes = sv.nodes; S.doc = sv.doc; S.mode = sv.mode;
    return html;
  }
  // Editing the live handbook draft is consequential and attributed — make the first
  // edit of a session a deliberate, acknowledged, audited action.
  function confirmEditEntry() {
    var who = (S.session && (S.session.name || S.session.email)) || 'your account';
    NL.confirm(
      'You are about to edit the live handbook draft. Every change saves immediately and is recorded against ' + who + ' in the audit log. Only continue if you mean to amend the official text.',
      { title: 'Edit the live draft?', confirmText: 'I understand — start editing', variant: 'danger' }
    ).then(function (ok) {
      if (!ok) return;
      S.editConfirmed = true;
      S.mode = 'edit';
      NL.writeAudit && NL.writeAudit('edit-mode', 'Entered edit mode on ' + docTitle(S.docId));
      render();
    });
  }

  /* ================= Unpublished changes =================
     Richard: "you edit… because eventually you want to publish a new
     document… it needs to be clear that you have done it, but you haven't
     published the changes yet… very similar to having a diff where we can
     see what changes have been made, but which aren't yet live prior to
     pressing publish edition. The plus minus green and red, same as a git
     diff — less for coders, and more for people like our admin team."

     TWO COSTS, TWO ANSWERS. Knowing WHETHER anything is unpublished has to
     be cheap: it is on every page load, for every admin. Knowing WHAT
     changed can be expensive, because it happens when somebody asks.

     So the bar reads one timestamp, and the review reads the documents. */

  var PUB = { checked: false, id: null, publishedAt: 0, label: '', draftAt: 0, count: null };
  /* Both sides of the last review, per area, so a single row can be put back
     without going to the database again. Rebuilt on every loadForReview. */
  var REV = {};

  /* Written by commit() — the single write path — so nothing can change the
     draft without moving it. The alternative is reading every clause in all
     five areas on every load to answer a yes/no question. */
  function touchDraft() {
    PUB.draftAt = Date.now();
    /* A count from before this edit is now a lie, and a stale number on the
       bar is worse than no number: it is the one thing somebody would trust
       without opening the review. */
    PUB.count = null;
    syncChanges();
    db.ref(BASE + '/draft/lastEditedAt').set(PUB.draftAt)['catch'](function () {});
  }

  /* Two small reads: the pointer's edition stamp, and the draft's. Never the
     documents. */
  function checkPublished() {
    if (!canEdit()) return Promise.resolve();
    /* Cleared on every run, or a denial before the rules landed sticks for
       the life of the page and keeps reporting itself after it is fixed. */
    PUB.error = false;
    return NL.ensureAuth().then(function () {
      return Promise.all([
        db.ref(BASE + '/publishedEditionId').once('value'),
        db.ref(BASE + '/draft/lastEditedAt').once('value')
      ]);
    }).then(function (r) {
      PUB.id = r[0].val() || null;
      PUB.draftAt = r[1].val() || 0;
      if (!PUB.id) { PUB.checked = true; syncChanges(); return; }
      return db.ref(BASE + '/editions/' + PUB.id + '/publishedAt').once('value')
        .then(function (s) {
          PUB.publishedAt = s.val() || 0;
          PUB.checked = true;
          syncChanges();
        });
    })['catch'](function (e) {
      /* The rule on editions/ wants either a club token or an admin — see
         the note in the PR. A denial here must not take the editor down
         with it; the bar simply cannot promise a state it could not read. */
      console.warn('[handbook] could not check the published edition', e);
      PUB.checked = true; PUB.error = true; syncChanges();
    });
  }

  function syncChanges() {
    var btn = $('ceChanges'), pill = $('ceChangesPill'), lbl = $('ceChangesLbl');
    if (!btn) return;
    if (!canEdit() || !PUB.checked) { btn.hidden = true; return; }
    btn.hidden = false;
    var state;
    if (PUB.error) state = { pill: '', lbl: 'Review changes' };
    else if (!PUB.id) state = { pill: 'Never published', lbl: 'Review the first edition' };
    else if (PUB.count != null) state = PUB.count
      ? { pill: String(PUB.count), lbl: PUB.count === 1 ? 'change to publish' : 'changes to publish' }
      : { pill: '', lbl: 'No changes since the last edition' };
    /* No timestamp on the draft means nobody has saved since this was added,
       NOT that nothing has changed — those are different answers and only
       one of them is safe to assert. */
    else if (!PUB.draftAt) state = { pill: '', lbl: 'Review changes' };
    else if (PUB.draftAt > PUB.publishedAt) state = { pill: 'Not published', lbl: 'Review changes' };
    else state = { pill: '', lbl: 'No changes since the last edition' };

    pill.hidden = !state.pill;
    pill.textContent = state.pill;
    lbl.textContent = state.lbl;
  }

  /* The documents, both sides. Five areas of draft in one read (the same one
     publish() makes), and the edition's clause snapshots WITHOUT its baked
     html — that html is the bulk of an edition and the diff never looks at
     it. */
  function loadForReview() {
    return NL.ensureAuth().then(function () {
      var reads = [db.ref(BASE + '/draft/docs').once('value')];
      DOCS.forEach(function (d) {
        reads.push(PUB.id
          ? db.ref(BASE + '/editions/' + PUB.id + '/docs/' + d.id + '/nodes').once('value')
          : Promise.resolve(null));
      });
      return Promise.all(reads);
    }).then(function (r) {
      var draft = r[0].val() || {};
      var areas = {};
      DOCS.forEach(function (d, i) {
        var drfNodes = (draft[d.id] && draft[d.id].nodes) || {};
        var drf = {}, pub = {}, pubNum = {};
        Object.keys(drfNodes).forEach(function (id) {
          drf[id] = normNode(Object.assign({}, drfNodes[id]), id);
        });
        var snap = r[i + 1] && r[i + 1].val();
        /* An edition stores its clauses as an array; Firebase hands a sparse
           one back as an object. Both shapes, one loop. */
        (snap ? (Array.isArray(snap) ? snap : Object.keys(snap).map(function (k) { return snap[k]; })) : [])
          .forEach(function (nd) {
            if (!nd || !nd.id) return;
            pub[nd.id] = normNode(Object.assign({}, nd), nd.id);
            pubNum[nd.id] = nd.number || '';
          });
        /* Kept so a single clause can be put back without reading the
           edition again — the row on screen already knows both versions,
           and the revert needs the DRAFT side too, to see whether an added
           clause has children under it. */
        REV[d.id] = { drf: drf, pub: pub };
        areas[d.id] = HB_DIFF.diffArea(pub, pubNum, drf, computeNumbers(drf));
      });
      return areas;
    });
  }

  /* ---- Put one clause back -------------------------------------------
     The review already shows both versions of a clause side by side, so the
     obvious next gesture is "just this one" — and without it the only
     remedy for one bad edit among forty good ones is to throw away all
     forty.

     IT DOES NOT JOIN THE UNDO STACK, deliberately. That stack is per-area
     and holds snapshots of the OPEN area; the review is cross-area, so half
     these reverts happen to documents the stack knows nothing about, and
     the other half would leave it holding a state that no longer exists.
     Rather than work for some rows and quietly corrupt others, it works the
     same everywhere and clears the stack when it touches the open area. The
     safety net is the restore point above, not undo. */
  function revertOne(docId, kind, entry) {
    var area = REV[docId];
    if (!area) return Promise.reject(new Error('that area is no longer loaded'));
    var updates = {}, id = entry.id;

    if (kind === 'added') {
      /* A clause added since publish, with clauses of its own added under
         it: deleting it alone orphans them — they keep a parentId pointing
         at nothing and vanish from the tree without being deleted. */
      var kids = Object.keys(area.drf).filter(function (k) {
        var p = area.drf[k].parentId; return (p === undefined ? null : p) === id;
      });
      if (kids.length) {
        return Promise.reject(new Error(
          'this clause has ' + kids.length + (kids.length === 1 ? ' clause' : ' clauses') +
          ' under it — put those back first'));
      }
      updates[id] = null;
    } else {
      var was = area.pub[id];
      if (!was) return Promise.reject(new Error('the published version of that clause is missing'));
      /* A clause whose parent was itself removed since publish has nowhere
         to go back to; restoring it would hang it off an id that is not
         there. */
      var wasParent = was.parentId === undefined ? null : was.parentId;
      if (wasParent !== null && !area.drf[wasParent]) {
        return Promise.reject(new Error('the clause this sat under is no longer in the draft — put that back first'));
      }
      var v = strip(normNode(Object.assign({}, was), id));
      v.id = id;   // see discardAll — strip() does not carry it
      Object.keys(v).forEach(function (k) { if (v[k] == null) delete v[k]; });
      updates[id] = v;
    }

    return NL.ensureAuth()
      .then(function () { return db.ref(BASE + '/draft/docs/' + docId + '/nodes').update(updates); })
      .then(function () {
        /* Keep the cached draft honest, or a second revert in the same
           sitting reasons about a document that has already moved. */
        if (kind === 'added') delete area.drf[id];
        else area.drf[id] = normNode(Object.assign({}, area.pub[id]));
        NL.writeAudit && NL.writeAudit('revert',
          'Put ' + docTitle(docId) + ' ' + (entry.number || entry.id) + ' back to the published version');
        touchDraft();
        if (docId === S.docId) {
          S.undo.length = 0; S.redo.length = 0;
          return load().then(function () { syncUndoBtns(); });
        }
      });
  }

  /* ---- rendering the review ---------------------------------------- */

  function diffHtml(before, after) {
    var ops = HB_DIFF.diffWords(HB_DIFF.htmlToText(before), HB_DIFF.htmlToText(after));
    if (!ops.length) return '';
    return ops.map(function (o) {
      var t = esc(o.s).replace(/\n/g, '<br>');
      if (o.t === '-') return '<del>' + t + '</del>';
      if (o.t === '+') return '<ins>' + t + '</ins>';
      return '<span>' + t + '</span>';
    }).join(' ');
  }

  function whole(node, cls) {
    var t = HB_DIFF.htmlToText(node.title);
    var b = HB_DIFF.htmlToText(node.body);
    var s = (t ? t + (b ? '\n' : '') : '') + b;
    if (!s && node.table) s = 'Table';
    if (!s) return '';
    if (s.length > 600) s = s.slice(0, 599) + '…';
    return '<' + cls + '>' + esc(s).replace(/\n/g, '<br>') + '</' + cls + '>';
  }

  function item(kind, what, entry, bodyHtml, docId) {
    /* One row, one way out. Without it the only remedy for one bad edit
       among forty good ones is Discard all changes. */
    var back = '<button class="btn btn--icon btn--ghost hb-rev__back" type="button"' +
      ' title="Put this clause back to the published version"' +
      ' aria-label="Put this clause back to the published version"' +
      ' data-back-doc="' + esc(docId) + '" data-back-kind="' + esc(kind) + '"' +
      ' data-back-id="' + esc(entry.id) + '">' +
      '<svg class="icon" aria-hidden="true"><use href="/assets/icons/sprites.svg#icon-refresh"></use></svg>' +
      '</button>';
    return '<div class="hb-rev__item hb-rev__item--' + kind + '" data-row="' + esc(entry.id) + '">' +
      '<p class="hb-rev__head">' +
        '<span class="hb-rev__what">' + esc(what) + '</span>' +
        (entry.number ? '<span class="hb-rev__num">' + esc(entry.number) + '</span>' : '') +
        '<span class="hb-rev__lbl">' + esc(entry.label) + '</span>' +
        back +
      '</p>' + (bodyHtml || '') + '</div>';
  }

  /* A cap, said out loud. A silent top-N reads as "that is everything",
     which on a publish review is the one thing it must never do. */
  var REV_MAX = 300;

  function reviewHtml(areas, snap) {
    var n = HB_DIFF.total(areas);
    var renum = DOCS.reduce(function (a, d) { return a + areas[d.id].renumbered; }, 0);
    var when = PUB.publishedAt ? NL.formatDate(PUB.publishedAt) : '';
    var out = [];

    out.push('<p class="hb-rev__sum">' + (
      /* A DENIED READ IS NOT AN EMPTY ONE, and this told the wrong story
         once already: before the rules widened, checkPublished could not
         read publishedEditionId, PUB.id stayed null, and the review
         announced "nothing has been published yet" over a handbook with
         previous editions behind it. Not knowing and knowing there is
         nothing are different answers. */
      PUB.error
        ? 'Could not read the published edition, so there is nothing to compare the draft against. This is usually the RTDB rules — ask for the “Deploy RTDB rules” workflow to be run for nl-tools.'
        : !PUB.id
        ? 'Nothing has been published yet. Publishing now creates the first edition, containing everything in the draft.'
        : (n === 0
            ? 'The draft matches the published edition' + (when ? ' of ' + esc(when) : '') + '. There is nothing to publish.'
            : '<strong>' + n + (n === 1 ? ' change' : ' changes') + '</strong> to the draft since the edition published' +
              (when ? ' on ' + esc(when) : '') + '.')
    ) + '</p>');

    if (renum) {
      out.push('<p class="hb-rev__renum">' + renum +
        (renum === 1 ? ' clause was renumbered' : ' clauses were renumbered') +
        ' as a result. Their wording has not changed, so they are not listed.</p>');
    }

    /* The way back from the way out. A discard that cannot be taken back is
       the one irreversible act in a tool where everything else can be
       reconsidered, and a restore point nobody can find is not a restore
       point — so it says so here, dated, at the top of the screen where the
       discard was pressed. */
    if (snap && snap.at) {
      out.push('<div class="hb-rev__restore"><span>' +
        '<b>' + (snap.count ? esc(String(snap.count)) + (snap.count === 1 ? ' change was' : ' changes were') : 'Changes were') +
        ' discarded</b> ' + esc(NL.timeAgo(snap.at) || '') +
        (snap.by ? ' by ' + esc(snap.by) : '') +
        '. Putting them back replaces the whole draft with how it stood before ' +
        'that, in every area — anything edited since would go.</span>' +
        '<button class="btn btn--sm btn--ghost" type="button" id="hbRestore" data-snap="' + esc(snap.id) + '">Put them back</button>' +
        '<button class="hb-rev__dismiss" type="button" id="hbSnapNo" data-snap="' + esc(snap.id) + '"' +
        ' aria-label="Stop offering this">&times;</button>' +
      '</div>');
    }

    if (PUB.error || !PUB.id) return out.join('');

    var shown = 0;
    DOCS.forEach(function (d) {
      var a = areas[d.id], count = HB_DIFF.areaTotal(a);
      if (!count) return;
      var rows = [];
      a.removed.forEach(function (e) { rows.push(item('removed', 'Removed', e, whole(e.before, 'del'), d.id)); });
      a.added.forEach(function (e) { rows.push(item('added', 'New', e, whole(e.after, 'ins'), d.id)); });
      a.edited.forEach(function (e) {
        var body;
        if (e.styleOnly) body = '<p class="hb-rev__note">Formatting or numbering style only — the wording is unchanged.</p>';
        else if (e.tableChanged && !e.textChanged) body = '<p class="hb-rev__note">The table in this clause changed.</p>';
        else body = '<p class="hb-rev__diff">' + diffHtml(
          (e.before.title ? e.before.title + ' ' : '') + (e.before.body || ''),
          (e.after.title ? e.after.title + ' ' : '') + (e.after.body || '')) + '</p>';
        if (e.alsoMoved) body += '<p class="hb-rev__note">Also moved' +
          (e.wasNumber && e.wasNumber !== e.number ? ' — was ' + esc(e.wasNumber) : '') + '.</p>';
        rows.push(item('edited', 'Edited', e, body, d.id));
      });
      a.moved.forEach(function (e) {
        rows.push(item('moved', 'Moved', e, '<p class="hb-rev__note">' +
          (e.toParent ? 'Moved to a different article' : 'Moved among its neighbours') +
          (e.wasNumber && e.wasNumber !== e.number ? ' — was ' + esc(e.wasNumber) : '') +
          '. The wording is unchanged.</p>', d.id));
      });
      var room = Math.max(0, REV_MAX - shown);
      var cut = rows.length - room;
      shown += Math.min(rows.length, room);
      out.push('<section class="hb-rev__area">' +
        '<h4 class="hb-rev__h">' + esc(d.title) + '<span class="pill pill--info">' + count + '</span></h4>' +
        rows.slice(0, room).join('') +
        (cut > 0 ? '<p class="hb-rev__note">' + cut + ' more in this area are not shown — the review lists the first ' +
          REV_MAX + '.</p>' : '') +
      '</section>');
    });

    /* The way out, at the bottom of the list rather than in the footer beside
       Publish. Same reasoning as the glyph buttons one tool over: two
       consequential actions sitting next to each other are two actions you
       can confuse. You read what changed, and then at the foot of it there
       is the other answer. */
    if (n) {
      out.push('<div class="hb-rev__discard">' +
        '<p>Not right? Put the draft back to the published edition' +
          (when ? ' of ' + esc(when) : '') + '. All ' + n +
          (n === 1 ? ' change goes' : ' changes go') + ', in every area, and undo will not bring them back.</p>' +
        '<button class="btn btn--sm btn--danger" type="button" id="hbDiscard">Discard all changes</button>' +
      '</div>');
    }
    return out.join('');
  }

  /* ---- Restore points ------------------------------------------------
     THE MISSING MIDDLE. Undo is twenty deep, per-area and gone on reload;
     the only other restore points were publishes. So a bad edit made three
     weeks ago had exactly one remedy — throw away everything since — and
     the discard below was itself the one irreversible act in the tool.

     A snapshot before every discard closes both. It costs one write of
     something already in memory, and it turns "gone" into "gone unless you
     say otherwise".

     TWO NODES, ON PURPOSE. The snapshot itself is the whole handbook, a
     megabyte or two; the index beside it is three fields. Listing what
     restore points exist has to read the index, or opening the review
     downloads every snapshot ever taken to show three dates.

     Under draft/ rather than a node of its own, so no rules change ships
     with this: draft is already "signed in can read, admin can write",
     which is exactly what a snapshot of the draft wants. Nothing reads
     draft wholesale — only draft/docs, draft/locks and draft/lastEditedAt
     — so the weight sits out of everyone's way. */
  var SNAP_KEEP = 5;

  function takeSnapshot(reason, count) {
    return db.ref(BASE + '/draft/docs').once('value').then(function (snap) {
      var ref = db.ref(BASE + '/draft/snapshots').push();
      return ref.set({ docs: snap.val() || {} }).then(function () {
        return db.ref(BASE + '/draft/snapshotIndex/' + ref.key).set({
          at: Date.now(),
          by: (S.session && (S.session.name || S.session.email)) || null,
          reason: reason || 'discard',
          count: count || 0
        });
      }).then(function () { return pruneSnapshots(); });
    });
  }

  function pruneSnapshots() {
    return db.ref(BASE + '/draft/snapshotIndex').once('value').then(function (snap) {
      var idx = snap.val() || {};
      var ids = Object.keys(idx).sort(function (a, b) { return (idx[b].at || 0) - (idx[a].at || 0); });
      var drop = ids.slice(SNAP_KEEP);
      if (!drop.length) return;
      var updates = {};
      drop.forEach(function (id) {
        updates['snapshots/' + id] = null;
        updates['snapshotIndex/' + id] = null;
      });
      return db.ref(BASE + '/draft').update(updates);
    })['catch'](function (e) {
      /* A snapshot that could not be pruned is clutter, not a failure. */
      console.warn('[handbook] could not prune snapshots', e);
    });
  }

  /* A RESTORE POINT IS AN UNDO, NOT AN ARCHIVE, and the first cut did not
     know the difference: it offered the most recent one whenever the review
     was opened, with no expiry, no dismissal and no test of whether it still
     meant anything. One discard therefore pinned an amber bar to the top of
     that screen for the life of the tool. Richard: "I am getting restore
     option on loop. Don't know what it is supposed to do and can't see why
     I'd be repeatedly offered it."

     Three tests, and a restore point has to pass all of them to be offered:

       FRESH     — regret about a discard arrives in minutes or hours, not
                   days. After that it is not an undo any more.
       UNSETTLED — a publish settles the question. The discarded changes are
                   definitively not in the handbook, and putting them back
                   into a draft that has since gone out is a new decision
                   rather than a correction.
       UNSEEN    — dismissed once is dismissed. Per snapshot, so the next
                   discard offers itself normally.

     The points themselves are still kept and still restorable; what is
     bounded is how long one nags. */
  var SNAP_OFFER_MS = 24 * 60 * 60 * 1000;
  var SNAP_SEEN_KEY = 'nl_hb_snapshot_dismissed';

  function snapDismissed(id) {
    try { return localStorage.getItem(SNAP_SEEN_KEY) === id; } catch (e) { return false; }
  }
  function dismissSnap(id) {
    try { localStorage.setItem(SNAP_SEEN_KEY, id); } catch (e) { /* private window */ }
  }

  function latestSnapshot() {
    return db.ref(BASE + '/draft/snapshotIndex').once('value').then(function (snap) {
      var idx = snap.val() || {};
      var ids = Object.keys(idx).sort(function (a, b) { return (idx[b].at || 0) - (idx[a].at || 0); });
      if (!ids.length) return null;
      var top = Object.assign({ id: ids[0] }, idx[ids[0]]);
      if (!top.at) return null;
      if (Date.now() - top.at > SNAP_OFFER_MS) return null;          // stale
      if (PUB.publishedAt && PUB.publishedAt > top.at) return null;  // settled
      if (snapDismissed(top.id)) return null;                        // seen
      return top;
    })['catch'](function () { return null; });
  }

  function restoreSnapshot(id) {
    return NL.prompt(
      'This puts the draft back to how it was before those changes were discarded, in every area. ' +
      'Anything edited since goes.\n\nType RESTORE to confirm.',
      { title: 'Restore the discarded changes', confirmText: 'Restore' }
    ).then(function (word) {
      if ((word || '').trim().toUpperCase() !== 'RESTORE') { NL.toast && NL.toast('Nothing restored', 'info'); return; }
      return NL.ensureAuth()
        .then(function () { return db.ref(BASE + '/draft/snapshots/' + id + '/docs').once('value'); })
        .then(function (snap) {
          var docs = snap.val();
          if (!docs) throw new Error('that restore point is no longer there');
          /* set(), not update(): the snapshot IS the draft as it was, so
             anything added since has to go rather than survive alongside. */
          return db.ref(BASE + '/draft/docs').set(docs);
        })
        .then(function () {
          S.undo.length = 0; S.redo.length = 0; S.index = null;
          touchDraft();
          NL.writeAudit && NL.writeAudit('restore', 'Restored the draft from a restore point');
          return load().then(checkPublished).then(function () {
            PUB.count = null; syncChanges(); syncUndoBtns();
            NL.toast && NL.toast('The draft is back to before the discard', 'success');
          });
        })['catch'](function (e) {
          NL.toast && NL.toast('Could not restore: ' + ((e && e.message) || e), 'error');
        });
    });
  }

  /* ---- Discard: put the draft back to the published edition ----------
     The counterpart to Publish, and the reason it lives inside the review
     rather than on the bar: the button that throws the changes away belongs
     beside the list of what they are, not two along from the one that sends
     them to 72 clubs.

     It restores, it does not "undo". The undo stack is 20 deep and per-area;
     this is every area, however long ago, and it is exact — the draft comes
     back byte-identical to the edition, so the review afterwards reports
     nothing to publish rather than "nearly nothing". */
  function discardAll() {
    if (!PUB.id) return Promise.resolve();
    /* SOMEONE ELSE MAY BE IN THERE. This rewrites all five areas, so an
       area another admin has open is their work being deleted from under
       them — the one case the edit lock exists for, and the one place that
       had no check because nothing before this wrote outside the open
       area. */
    return NL.ensureAuth()
      .then(function () { return db.ref(BASE + '/draft/locks').once('value'); })
      .then(function (snap) {
        var locks = snap.val() || {};
        var held = Object.keys(locks).filter(function (k) {
          return !lockIsMine(locks[k]) && !lockIsStale(locks[k]);
        });
        if (held.length) {
          var who = held.map(function (k) { return (locks[k].name || 'Someone') + ' (' + docTitle(k) + ')'; });
          NL.alert && NL.alert(who.join(', ') + ' is editing right now. Discarding would delete their work as well as yours.',
            { title: 'Someone else is in the handbook' });
          return null;
        }
        return NL.prompt(
          'This puts the whole handbook draft — all five areas — back to the published edition, exactly as it stands. ' +
          'Every change made since is gone, and undo will not bring it back.\n\nType DISCARD to confirm.',
          { title: 'Discard all unpublished changes', confirmText: 'Discard changes' }
        );
      })
      .then(function (word) {
        if (word === null || word === undefined) return null;
        if ((word || '').trim().toUpperCase() !== 'DISCARD') {
          NL.toast && NL.toast('Nothing discarded', 'info');
          return null;
        }
        /* BEFORE anything is written. A discard that fails halfway leaves a
           snapshot that is merely redundant; a discard that succeeds without
           one is unrecoverable. */
        return takeSnapshot('discard', PUB.count || 0).then(function () { return true; });
      })
      .then(function (go) {
        if (!go) return null;
        var reads = [];
        DOCS.forEach(function (d) {
          var base = BASE + '/editions/' + PUB.id + '/docs/' + d.id;
          reads.push(Promise.all([
            db.ref(base + '/nodes').once('value'),
            db.ref(base + '/title').once('value'),
            db.ref(base + '/subtitle').once('value'),
            db.ref(base + '/season').once('value')
          ]));
        });
        return Promise.all(reads);
      })
      .then(function (all) {
