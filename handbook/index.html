<!DOCTYPE html>
<!--
  NL Tools — Handbook
  handbook / index.html
  v0.11 — Block editor (text/cards/table), list type control + adjacent-ol
          merge, TOC collapsed by default, nesting cap, clean directory
          cards, read-as-one-page, link-to-section picker.
  v0.10 — Selective re-import. Import/re-import now works PER SECTION:
          only seed/import-authored (or empty) sections are replaced,
          hand-edited sections are always preserved, and import-authored
          sections superseded by the carve are removed. Safe to run
          repeatedly as the carve improves (e.g. the two-column re-extract
          fixing the 'DONT DEAD OPEN INSIDE' interleaving on Safeguarding
          etc). Re-import button now always visible to superadmin; confirm
          shows replace/preserve/remove counts.
  v0.9 — Contacts node type (Phase 2). A node's Layout can be 'Contact
         cards': structured records (name / role / org / email / phone /
         note) edited as cards, rendered as a linked card grid — for League
         officials, office staff, officers, associated leagues. Stored as
         node.type='contacts' + node.contacts[]. Not imported (those PDF
         pages are column-interleaved and unsalvageable by parse — entered
         by hand from the editor).
         - Fix: Cancel (and navigating away mid-edit) threw a ReferenceError
           on a leftover TUI.instance from the dropped Toast UI editor, so
           the buttons appeared dead. References removed.
  v0.8 — Structure: bodies-on-any-node + directory reader + legal nesting.
         - Any chapter/section can hold an intro body AND children; the
           reader shows the body then a directory of sub-sections (cards).
           Chapters are navigable landing pages; the rules/articles preamble
           has a home (the chapter's own body).
         - Re-carve collapses redundant single-section chapters (Memorandum,
           Board Directives) so the body sits on the chapter, not a same-
           named child.
         - Nested ordered lists render as the legal hierarchy 1 -> a -> i
           (decimal / lower-alpha / lower-roman) in reader + editor; Tab to
           indent in the editor.
  v0.7 — Editor moved to platform canon + reading-view polish:
         - Toast UI dropped. Editing is now the same pattern as
           graphics/article-composer: contenteditable + the brand
           .fmt-toolbar (style select, B/I/U, lists, link, 3x3 table
           insert, undo/redo, clear formatting). No external library.
         - Storage moves to SANITIZED HTML (whitelist tags, href
           http/https/mailto/# only, all other attributes stripped).
           Legacy Markdown bodies still render (bodyToHtml dual-mode) and
           convert to HTML on first save; the importer converts the carve
           at write time.
         - Breadcrumb is now navigation: pill links with a visible ›
           separator (was border-grey ::before — invisible).
         - 'Last updated' moved below the content; seed/import provenance
           no longer shown on the page (audit trail keeps it).
         - Editor meta row no longer misaligns (shorter label, hint moved
           to placeholder, align-items:end).
  v0.6 — Content quality + editing overhaul:
         - handbook-content.json re-carved with paragraph reflow (PDF print
           line-wraps joined back into real paragraphs; numbered clauses get
           their own paragraphs) and duplicated heading lines stripped.
         - Re-import: superadmin toolbar button, available while every
           section is still seed/import-authored (one hand-edit anywhere
           protects content from replacement).
         - WYSIWYG editing (Toast UI via CDN, lazy-loaded) — visual editing
           incl. a table tool, but reads/writes MARKDOWN so storage, audit
           and the read renderer are unchanged. Textarea+preview fallback
           when the CDN is unreachable.
         - Bare emails / URLs auto-link in the read view (linkify, skips
           existing tags); league contact pages become tappable.
         - Structure UX: '+ New chapter' at the bottom of the contents tree;
           toolbar relabelled (+ Inside / + After) with tooltips.
  v0.5 — Detect 'no content yet' by empty bodies (not seed-author), so the
         import stays reachable even after a section was opened.
  v0.4 — Surface the import on the empty-skeleton state (button was hidden).
  v0.3 — Import can replace an empty skeleton (not just a virgin DB).
  v0.2 — One-click import of the carved 2025/26 handbook content.
  v0.1 — Book-like, editable online edition of the NL handbook (rulebook,
         articles, tariffs, appendices). Framework + skeleton.

  What this is:
    The governance half of the printed National League booklet (everything
    that isn't the club directory) brought online as a navigable, editable
    "book": a contents tree of chapters -> sections -> appendices, each a
    Markdown document, deep-linkable and searchable.

  Storage (RTDB):
    app-data/ops-handbook/nodes/<id>  { parentId, order, kind, number,
                                        title, body(markdown), updatedAt,
                                        updatedBy }
    app-data/ops-handbook/audit/<k>   { ts, uid, email, action, detail }
    tools/ops-handbook                tool registration (label/url/defaults)

  Access:
    read  — any signed-in user (clubs + staff)
    write — admin / superadmin only (the League's governing text)

  Content authored as Markdown (textarea + live preview); stored as text so
  it audits as clean diffs and stays re-exportable (e.g. to regenerate the
  printed handbook from this data later).
-->

  .hb-body ol ol:not([type]) { list-style-type: lower-alpha; }
  .hb-body ol ol ol:not([type]) { list-style-type: lower-roman; }

<div id="nlTopbar"></div>

<div id="pageWrap">

<script>
(function () {
  'use strict';

  var BASE = 'app-data/ops-handbook';

  var S = {
    session: null,
    role: 'viewer',
    nodes: {},          // id -> node
    currentId: null,
    search: '',
    collapsed: {},      // id -> true (collapsed in toc)
    editing: null,      // node id being edited, or '__new__'
    draft: null,
    seeded: false
  };

  function canEdit() { return S.role === 'admin' || S.role === 'superadmin'; }
  function esc(s) {
    if (s === null || s === undefined) return '';
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  /* ============ Minimal, safe Markdown -> HTML ============
     Supports: # headings, **bold**, *italic*, `code`, [links](url),
     - / 1. lists, > blockquote, --- rule, | pipe tables |, paragraphs.
     Input is escaped first, so no raw HTML passes through. */
  function mdInline(t) {
    t = esc(t);
    t = t.replace(/`([^`]+)`/g, '<code>$1</code>');
    t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
    t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+|mailto:[^)\s]+|#[^)\s]+)\)/g,
      '<a href="$2">$1</a>');
    return linkify(t);
  }

  /* Auto-link bare emails and URLs in already-escaped inline HTML, skipping
     anything inside existing tags/anchors. The handbook text is full of
     plain addresses (league contacts, club emails) that should be tappable. */
  function linkify(html) {
    return html.split(/(<a\b[^>]*>[\s\S]*?<\/a>|<[^>]+>)/g).map(function (part) {
      if (!part || part.charAt(0) === '<') return part;
      part = part.replace(/([A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,})/g,
        '<a href="mailto:$1">$1</a>');
      part = part.replace(/(https?:\/\/[^\s<]+[^\s<.,;:)])/g,
        '<a href="$1" target="_blank" rel="noopener">$1</a>');
      part = part.replace(/(^|[\s(])(www\.[^\s<]+[^\s<.,;:)])/g,
        '$1<a href="https://$2" target="_blank" rel="noopener">$2</a>');
      return part;
    }).join('');
  }
  function mdToHtml(md) {
    if (!md || !md.trim()) return '<p class="hb-empty">No content yet.</p>';
    var lines = md.replace(/\r\n/g, '\n').split('\n');
    var html = [], i = 0;
    function isTableSep(s) { return /^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(s) && s.indexOf('-') !== -1; }
    function splitRow(s) {
      s = s.trim().replace(/^\|/, '').replace(/\|$/, '');
      return s.split('|').map(function (c) { return c.trim(); });
    }
    while (i < lines.length) {
      var line = lines[i];
      if (!line.trim()) { i++; continue; }
      // table
      if (line.indexOf('|') !== -1 && i + 1 < lines.length && isTableSep(lines[i + 1])) {
        var headers = splitRow(line); i += 2;
        var body = [];
        while (i < lines.length && lines[i].indexOf('|') !== -1 && lines[i].trim()) { body.push(splitRow(lines[i])); i++; }
        html.push('<table><thead><tr>' + headers.map(function (h) { return '<th>' + mdInline(h) + '</th>'; }).join('') + '</tr></thead><tbody>' +
          body.map(function (r) { return '<tr>' + r.map(function (c) { return '<td>' + mdInline(c) + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table>');
        continue;
      }
      var h = /^(#{2,4})\s+(.*)$/.exec(line);
      if (h) { var lvl = h[1].length; html.push('<h' + lvl + '>' + mdInline(h[2]) + '</h' + lvl + '>'); i++; continue; }
      if (/^\s*(-{3,}|\*{3,})\s*$/.test(line)) { html.push('<hr>'); i++; continue; }
      if (/^\s*>/.test(line)) {
        var q = [];
        while (i < lines.length && /^\s*>/.test(lines[i])) { q.push(lines[i].replace(/^\s*>\s?/, '')); i++; }
        html.push('<blockquote>' + q.map(mdInline).join('<br>') + '</blockquote>'); continue;
      }
      if (/^\s*[-*]\s+/.test(line)) {
        var ul = [];
        while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) { ul.push('<li>' + mdInline(lines[i].replace(/^\s*[-*]\s+/, '')) + '</li>'); i++; }
        html.push('<ul>' + ul.join('') + '</ul>'); continue;
      }
      if (/^\s*\d+\.\s+/.test(line)) {
        var ol = [];
        while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) { ol.push('<li>' + mdInline(lines[i].replace(/^\s*\d+\.\s+/, '')) + '</li>'); i++; }
        html.push('<ol>' + ol.join('') + '</ol>'); continue;
      }
      // paragraph (gather until blank)
      var para = [];
      while (i < lines.length && lines[i].trim() && !/^(#{2,4}\s|>|\s*[-*]\s|\s*\d+\.\s)/.test(lines[i]) && !/^\s*(-{3,}|\*{3,})\s*$/.test(lines[i])) {
        para.push(lines[i]); i++;
      }
      html.push('<p>' + para.map(mdInline).join('<br>') + '</p>');
    }
    return html.join('\n');
  }

  /* ============ Tree helpers ============ */
  function childrenOf(parentId) {
    var out = [];
    for (var id in S.nodes) if (S.nodes[id].parentId === parentId) out.push(S.nodes[id]);
    out.sort(function (a, b) { return (a.order || 0) - (b.order || 0); });
    return out;
  }
  function flatten() {
    // depth-first reading order
    var out = [];
    (function walk(pid) {
      childrenOf(pid).forEach(function (n) { out.push(n); walk(n.id); });
    })(null);
    return out;
  }
  function breadcrumb(node) {
    var chain = [], n = node;
    while (n) { chain.unshift(n); n = n.parentId ? S.nodes[n.parentId] : null; }
    return chain;
  }

  /* The DB has structure but no actual content written yet (e.g. the empty
     seed skeleton — even if a section was opened/saved without text, which
     changes its updatedBy). The signal is simply: not one node has a real
     body. Treated like an empty DB so the import is still offered. */
  function isEmptySkeleton() {
    var ids = Object.keys(S.nodes);
    return ids.length > 0 && ids.every(function (id) {
      var n = S.nodes[id];
      return !(n.body && n.body.trim());
    });
  }

  /* ============ Rendering ============ */
  function render() {
    if (!S.seeded || isEmptySkeleton()) { renderSeedPrompt(); return; }
    renderToc();
    renderMain();
  }

  function renderSeedPrompt() {
    var side = document.getElementById('hbSide');
    if (side) side.style.display = 'none';
    var main = document.getElementById('hbMain');
    var canSeed = S.role === 'superadmin';
    var skeleton = isEmptySkeleton();
    main.innerHTML = '<div class="hb-seed"><div class="hb-seed__card">' +
      '<h2 style="margin-top:0;color:var(--navy);">' + (skeleton ? 'Ready to import' : 'The handbook is empty') + '</h2>' +
      '<p style="color:var(--text-muted);">' +
        (canSeed
          ? (skeleton
              ? 'The empty chapter structure is in place. Import the full 2025/26 handbook (rules, articles, appendices and league information, carved from the printed booklet) to fill it in.'
              : 'Import the full 2025/26 handbook (rules, articles, appendices and league information, carved from the printed booklet) — or just create the empty chapter structure to fill in by hand.')
          : 'It hasn’t been set up yet. A League administrator needs to initialise it.') +
      '</p>' +
      (canSeed
        ? '<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">' +
            '<button class="btn btn--navy" id="hbImportBtn">Import 2025/26 handbook</button>' +
            (skeleton ? '' : '<button class="btn btn--ghost" id="hbSeedBtn">Create empty structure</button>') +
          '</div>' +
          '<p style="color:var(--text-muted);font-size:12px;margin:14px 0 0;">' +
            (skeleton
              ? 'Import will replace the empty structure (it won’t touch real content). Imported text is fully editable afterwards.'
              : 'Either is a one-off and refuses to overwrite existing content. Imported text is fully editable afterwards.') +
          '</p>'
        : '') +
    '</div></div>';
  }

  function tocItem(node) {
    var kids = childrenOf(node.id);
    var hasKids = kids.length > 0;
    var collapsed = S.collapsed[node.id];
    var cls = 'hb-toc__link' + (node.id === S.currentId ? ' is-current' : '');
    var caret = hasKids
      ? '<button class="hb-toc__caret" data-toc-caret="' + esc(node.id) + '">' + (collapsed ? '▸' : '▾') + '</button>'
      : '<span class="hb-toc__caret hb-toc__caret--spacer"></span>';
    var li = '<li class="' + (node.parentId === null ? 'hb-toc__chapter' : '') + '">' +
      '<div class="hb-toc__row">' + caret +
        '<a class="' + cls + '" data-toc="' + esc(node.id) + '">' +
          (node.number ? '<span class="hb-toc__num">' + esc(node.number) + '</span>' : '') +
          esc(node.title) +
        '</a>' +
      '</div>';
    if (hasKids && !collapsed) li += '<ul>' + kids.map(tocItem).join('') + '</ul>';
    return li + '</li>';
  }
  function renderToc() {
    var side = document.getElementById('hbSide');
    if (side) side.style.display = '';
    var toc = document.getElementById('hbToc');
    if (S.search) { renderSearchResults(toc); return; }
    toc.innerHTML = childrenOf(null).map(tocItem).join('') +
      (canEdit()
        ? '<li style="margin-top:14px;"><button class="btn btn--ghost btn--sm" id="hbAddChapter" style="width:100%;">+ New chapter</button></li>'
        : '');
  }
  function renderSearchResults(toc) {
    var q = S.search.toLowerCase();
    var hits = Object.keys(S.nodes).map(function (id) { return S.nodes[id]; }).filter(function (n) {
      return (n.title || '').toLowerCase().indexOf(q) !== -1 ||
             (n.number || '').toLowerCase().indexOf(q) !== -1 ||
             (n.body || '').toLowerCase().indexOf(q) !== -1;
    }).sort(function (a, b) { return (a.number || a.title).localeCompare(b.number || b.title); });
    if (!hits.length) { toc.innerHTML = '<li style="padding:8px;color:var(--text-muted);font-size:13px;">No matches.</li>'; return; }
    toc.innerHTML = hits.map(function (n) {
      return '<li><div class="hb-toc__row"><span class="hb-toc__caret hb-toc__caret--spacer"></span>' +
        '<a class="hb-toc__link' + (n.id === S.currentId ? ' is-current' : '') + '" data-toc="' + esc(n.id) + '">' +
        (n.number ? '<span class="hb-toc__num">' + esc(n.number) + '</span>' : '') + esc(n.title) + '</a></div></li>';
    }).join('');
  }

  function renderMain() {
    var main = document.getElementById('hbMain');
    if (S.editing) { renderEditor(main); return; }
    var node = S.nodes[S.currentId];
    if (!node) {
      // default to first chapter
      var first = childrenOf(null)[0];
      if (first) { S.currentId = first.id; node = first; }
    }
    if (!node) { main.innerHTML = '<p class="hb-empty">Nothing here yet.</p>'; return; }

    var crumb = breadcrumb(node).map(function (n) {
      return '<a class="hb-crumb__pill" data-toc="' + esc(n.id) + '">' + esc(n.title) + '</a>';
    }).join('<span class="hb-crumb__sep">›</span>');

    var flat = flatten();
    var idx = flat.findIndex(function (n) { return n.id === node.id; });
    var prev = idx > 0 ? flat[idx - 1] : null;
    var next = idx >= 0 && idx < flat.length - 1 ? flat[idx + 1] : null;

    var editBar = canEdit()
      ? '<div class="hb-toolbar">' +
          '<button class="btn btn--navy btn--sm" id="hbEdit">Edit</button>' +
          (breadcrumb(node).length < 3
            ? '<button class="btn btn--ghost btn--sm" id="hbAddChild" title="New section inside this one">+ Inside</button>'
            : '') +
          '<button class="btn btn--ghost btn--sm" id="hbAddSibling" title="New section at the same level, after this one">+ After</button>' +
          '<button class="btn btn--ghost btn--sm" id="hbMoveUp" title="Move up among its siblings">↑</button>' +
          '<button class="btn btn--ghost btn--sm" id="hbMoveDown" title="Move down among its siblings">↓</button>' +
          (S.role === 'superadmin'
            ? '<button class="btn btn--ghost btn--sm" id="hbReimport" title="Re-import the carved booklet — only replaces sections nobody has edited">Re-import</button>'
            : '') +
          '<button class="btn btn--danger btn--sm" id="hbDelete" style="margin-left:auto;">Delete</button>' +
        '</div>'
      : '';

    /* Attribution only for human edits — seed/import provenance stays out
       of the page (it's in the audit trail). Meta sits at the base. */
    var isMachine = node.updatedBy === 'seed' || node.updatedBy === 'import 2025/26';
    var metaLine = node.updatedAt
      ? '<div class="hb-doc__meta">Last updated ' + esc(fmtDate(node.updatedAt)) + (!isMachine && node.updatedBy ? ' · ' + esc(node.updatedBy) : '') + '</div>'
      : '';

    /* A node can carry both an intro body AND children. The reader shows the
       body (if any), then a directory of its sub-sections — so a chapter is a
       navigable landing page, and a single-section chapter (Memorandum) just
       holds its own body with no redundant child. */
    var kids = childrenOf(node.id);
    var blocks = deriveBlocks(node);
    var bodyHtml = blocks.length
      ? '<div class="hb-body">' + blocksToHtml(blocks) + '</div>'
      : (kids.length ? '' : '<div class="hb-body"><p class="hb-empty">No content yet.</p></div>');

    var dirHtml = '';
    if (kids.length && S.inlineView === node.id) {
      /* "Read as one page": every descendant inline, anchored. */
      var flatKids = [];
      (function gather(pid) { childrenOf(pid).forEach(function (k) { flatKids.push(k); gather(k.id); }); })(node.id);
      dirHtml = '<p><a class="hb-crumb__pill" id="hbInlineOff">Show as section list</a></p>' +
        flatKids.map(function (k) {
          return '<div class="hb-inline-sec" id="' + esc(k.id) + '">' +
            (k.number ? '<div class="hb-doc__num">' + esc(k.number) + '</div>' : '') +
            '<h2 class="hb-doc__title" style="font-size:22px;">' + esc(k.title) + '</h2>' +
            '<div class="hb-body">' + blocksToHtml(deriveBlocks(k)) + '</div>' +
          '</div>';
        }).join('');
    } else if (kids.length) {
      dirHtml = '<div class="hb-dir">' + kids.map(function (k) {
        var sub = childrenOf(k.id).length;
        return '<a class="hb-dir__item" data-toc="' + esc(k.id) + '">' +
          '<div class="hb-dir__t">' +
            (k.number ? '<span class="hb-dir__num">' + esc(k.number) + '</span>' : '') + esc(k.title) +
          '</div>' +
          (sub ? '<div class="hb-dir__s">' + sub + ' section' + (sub === 1 ? '' : 's') + '</div>' : '') +
        '</a>';
      }).join('') + '</div>' +
      '<p style="margin-top:14px;"><a class="hb-crumb__pill" id="hbInlineOn">Read as one page</a></p>';
    }

    main.innerHTML = editBar +
      '<div class="hb-crumb">' + crumb + '</div>' +
      (node.number ? '<div class="hb-doc__num">' + esc(node.number) + '</div>' : '') +
      '<h1 class="hb-doc__title">' + esc(node.title) + '</h1>' +
      bodyHtml +
      dirHtml +
      metaLine +
      '<div class="hb-prevnext">' +
        (prev ? '<a data-toc="' + esc(prev.id) + '"><span>← Previous</span>' + esc(prev.title) + '</a>' : '<span></span>') +
        (next ? '<a data-toc="' + esc(next.id) + '" style="text-align:right;"><span>Next →</span>' + esc(next.title) + '</a>' : '<span></span>') +
      '</div>';
  }

  /* Plain-text preview of a body (HTML or markdown) for directory cards. */
  function textSnippet(body, max) {
    if (!body || !body.trim()) return '';
    var tmp = document.createElement('div');
    tmp.innerHTML = bodyIsHtml(body) ? body : mdToHtml(body);
    var txt = (tmp.textContent || '').replace(/\s+/g, ' ').trim();
    return txt.length > max ? txt.slice(0, max - 1) + '…' : txt;
  }

  /* ============ Editor — platform canon ============
     Same pattern as graphics/article-composer: a contenteditable pane with
     the brand .fmt-toolbar component (nl-brand.css v2.19). No external
     library. Bodies are stored as SANITIZED HTML; legacy Markdown bodies
     (the original carve) still render via mdToHtml and are converted to
     HTML the first time they're saved. */

  var ALLOWED_TAGS = { P:1, H2:1, H3:1, H4:1, STRONG:1, B:1, EM:1, I:1, U:1,
    UL:1, OL:1, LI:1, A:1, TABLE:1, THEAD:1, TBODY:1, TR:1, TH:1, TD:1,
    BR:1, BLOCKQUOTE:1, HR:1, CODE:1, DIV:1, SPAN:1 };

  function sanitizeHtml(html) {
    var tpl = document.createElement('template');
    tpl.innerHTML = html || '';
    (function walk(node) {
      var kids = Array.prototype.slice.call(node.childNodes);
      kids.forEach(function (child) {
        if (child.nodeType === 8) { child.parentNode.removeChild(child); return; }
        if (child.nodeType !== 1) return;
        var tag = child.tagName;
        if (tag === 'SCRIPT' || tag === 'STYLE' || tag === 'IFRAME' || tag === 'OBJECT' || tag === 'EMBED' || tag === 'FORM' || tag === 'INPUT') {
          child.parentNode.removeChild(child); return;
        }
        walk(child);
        if (!ALLOWED_TAGS[tag]) {
          while (child.firstChild) child.parentNode.insertBefore(child.firstChild, child);
          child.parentNode.removeChild(child); return;
        }
        Array.prototype.slice.call(child.attributes).forEach(function (a) {
          var n = a.name.toLowerCase();
          if (tag === 'A' && n === 'href') {
            if (!/^(https?:|mailto:|#)/i.test(a.value.trim())) child.removeAttribute(a.name);
            return;
          }
          if (tag === 'OL' && n === 'type' && /^[1aAiI]$/.test(a.value)) return;
          if (tag === 'OL' && n === 'start' && /^\d+$/.test(a.value)) return;
          child.removeAttribute(a.name);
        });
        if (tag === 'A') {
          child.setAttribute('rel', 'noopener');
          if (/^https?:/i.test(child.getAttribute('href') || '')) child.setAttribute('target', '_blank');
        }
      });
    })(tpl.content);
    /* Merge adjacent sibling <ol>s of the same declared type — fixes the
       1. 1. 1. effect from single-item lists created per paragraph. */
    (function mergeOls(node) {
      var c = node.firstChild;
      while (c) {
        var nx = c.nextSibling;
        if (c.nodeType === 1) {
          mergeOls(c);
          if (c.tagName === 'OL') {
            while (nx && nx.nodeType === 3 && !nx.textContent.trim()) nx = nx.nextSibling;
            if (nx && nx.nodeType === 1 && nx.tagName === 'OL' &&
                (c.getAttribute('type') || '') === (nx.getAttribute('type') || '')) {
              while (nx.firstChild) c.appendChild(nx.firstChild);
              var dead = nx; nx = c; dead.parentNode.removeChild(dead);
            }
          }
        }
        c = (nx === c) ? c.nextSibling : nx;
      }
    })(tpl.content);
    return tpl.innerHTML;
  }

  function bodyIsHtml(body) {
    return /<(p|h[1-6]|ul|ol|table|div|blockquote|br)\b/i.test(body || '');
  }
  /* Render a stored body (HTML or legacy Markdown) to safe display HTML. */
  function bodyToHtml(body) {
    if (!body || !body.trim()) return '<p class="hb-empty">No content yet.</p>';
    return bodyIsHtml(body) ? linkify(sanitizeHtml(body)) : mdToHtml(body);
  }

  function renderEditor(main) {
    var isNew = S.editing === '__new__';

    var linkOpts = flatten().map(function (n) {

    }).join('');

      '<div class="hb-edit-meta">' +
        '<div class="hb-field"><label>Number (optional)</label><input id="hbfNum" value="' + esc(d.number) + '" placeholder="e.g. 4.2 or Appendix F"></div>' +
        '<div class="hb-field"><label>Title</label><input id="hbfTitle" value="' + esc(d.title) + '"></div>' +
        '<div class="hb-field"><label>Kind</label><select id="hbfKind">' +
          ['chapter','section','appendix'].map(function (k) { return '<option value="' + k + '"' + (d.kind === k ? ' selected' : '') + '>' + k + '</option>'; }).join('') +
        '</select></div>' +

        '</select>' +
        '<span class="sep"></span>' +
        '<button type="button" data-cmd="bold" class="fmt-icon" title="Bold">B</button>' +

        '<button type="button" data-cmd="underline" class="fmt-icon" title="Underline"><u>U</u></button>' +
        '<span class="sep"></span>' +
        '<button type="button" data-cmd="insertUnorderedList" class="fmt-icon" title="Bulleted list">• list</button>' +
        '<button type="button" data-cmd="insertOrderedList" class="fmt-icon" title="Numbered list">1. list</button>' +
        '<select id="hbListType" title="Numbering style for the list under the cursor">' +
          '<option value="">List: auto</option><option value="1">1, 2, 3</option>' +

      '</div>' +

      '<div class="hb-addblock">' +
        '<button class="btn btn--ghost btn--sm" data-addblock="text">+ Text</button>' +
        '<button class="btn btn--ghost btn--sm" data-addblock="cards">+ Contact cards</button>' +
        '<button class="btn btn--ghost btn--sm" data-addblock="table">+ Table</button>' +
      '</div>';

    document.getElementById('hbfTitle').addEventListener('input', function (e) { S.draft.title = e.target.value; });
    document.getElementById('hbfNum').addEventListener('input', function (e) { S.draft.number = e.target.value; });
    document.getElementById('hbfKind').addEventListener('change', function (e) { S.draft.kind = e.target.value; });
    try { document.execCommand && document.execCommand('defaultParagraphSeparator', false, 'p'); } catch (e) {}
    wireEditorChrome();
  }

  function blockEditorHtml(b, i) {
    var bar = '<div class="hb-block__bar"><span class="hb-block__kind">' +
      (b.t === 'cards' ? 'Contact cards' : b.t === 'table' ? 'Table' : 'Text') + '</span>' +
      '<button class="btn-icon" data-bmove="-1" title="Move up">↑</button>' +
      '<button class="btn-icon" data-bmove="1" title="Move down">↓</button>' +
      '<button class="btn-icon" data-bdel title="Remove block">×</button></div>';
    var inner;
    if (b.t === 'cards') {
      inner = '<div class="hb-block__body"><div class="hb-cards-ed">' +
        (b.cards.length ? b.cards : [{}]).map(contactRow).join('') + '</div>' +
        '<button class="btn btn--ghost btn--sm" data-addcard style="margin-top:10px;">+ Add person / organisation</button></div>';
    } else if (b.t === 'table') {
      var cols = Math.max(b.head.length, (b.rows[0] || []).length, 2);
      while (b.head.length < cols) b.head.push('');
      var headHtml = '<thead><tr>' + b.head.map(function (h) { return '<th><input data-th value="' + esc(h) + '" placeholder="Header"></th>'; }).join('') + '</tr></thead>';
      var rowsHtml = (b.rows.length ? b.rows : [Array(cols).join(' ').split(' ')]).map(function (r) {
        while (r.length < cols) r.push('');
        return '<tr>' + r.map(function (c) { return '<td><input data-td value="' + esc(c) + '"></td>'; }).join('') + '</tr>';
      }).join('');
      inner = '<div class="hb-block__body hb-tbl-ed"><table>' + headHtml + '<tbody>' + rowsHtml + '</tbody></table>' +
        '<div class="hb-tbl-ed__controls">' +
          '<button class="btn btn--ghost btn--sm" data-trow="1">+ Row</button>' +
          '<button class="btn btn--ghost btn--sm" data-trow="-1">− Row</button>' +
          '<button class="btn btn--ghost btn--sm" data-tcol="1">+ Column</button>' +
          '<button class="btn btn--ghost btn--sm" data-tcol="-1">− Column</button>' +
        '</div></div>';
    } else {
      var initial = (b.html && b.html.trim()) ? (bodyIsHtml(b.html) ? sanitizeHtml(b.html) : mdToHtml(b.html)) : '<p><br></p>';
      inner = '<div class="hb-ed hb-body" contenteditable="true">' + initial + '</div>';
    }
    return '<div class="hb-block" data-bt="' + b.t + '">' + bar + inner + '</div>';
  }

  /* Serialize the block stack back into draft.blocks. */
  function readDraftBlocks() {
    return Array.prototype.map.call(document.querySelectorAll('#hbBlocks .hb-block'), function (el) {
      var t = el.getAttribute('data-bt');
      if (t === 'cards') {
        var cards = Array.prototype.map.call(el.querySelectorAll('.hb-card-ed'), function (row) {
          var c = {};
          Array.prototype.forEach.call(row.querySelectorAll('[data-cf]'), function (inp) { c[inp.getAttribute('data-cf')] = inp.value.trim(); });
          return c;
        }).filter(function (c) { return c.name || c.role || c.org || c.email || c.phone || c.note; });
        return { t: 'cards', cards: cards };
      }
      if (t === 'table') {
        var head = Array.prototype.map.call(el.querySelectorAll('[data-th]'), function (i) { return i.value; });
        var rows = Array.prototype.map.call(el.querySelectorAll('tbody tr'), function (tr) {
          return Array.prototype.map.call(tr.querySelectorAll('[data-td]'), function (i) { return i.value; });
        }).filter(function (r) { return r.some(function (c) { return c.trim(); }); });
        return { t: 'table', head: head, rows: rows };
      }
      var ed = el.querySelector('.hb-ed');
      var html = sanitizeHtml(ed ? ed.innerHTML : '');
      var probe = html.replace(/<[^>]+>|&nbsp;|\s/g, '');
      return { t: 'text', html: probe ? html : '' };
    }).filter(function (b) {
      return (b.t === 'text' && b.html) || (b.t === 'cards' && b.cards.length) || (b.t === 'table' && b.rows.length);
    });
  }

  function refreshBlocksFromDom() { S.draft.blocks = readDraftBlocks(); }

  function wireEditorChrome() {
    var bar = document.getElementById('hbFmtBar');
    bar.addEventListener('click', function (e) {
      var b = e.target.closest('button');
      if (!b) return;
      var cmd = b.getAttribute('data-cmd');
      if (cmd) { document.execCommand && document.execCommand(cmd, false, null); return; }
      if (b.id === 'hbLinkBtn') {
        var url = prompt('Link to (https://…, mailto:… )');
        if (url) { if (!/^(https?:|mailto:|#)/i.test(url)) url = 'https://' + url;
          document.execCommand && document.execCommand('createLink', false, url); }
        return;
      }
      if (b.id === 'hbClearFmt') {
        document.execCommand && document.execCommand('removeFormat', false, null);
        document.execCommand && document.execCommand('formatBlock', false, 'P');
      }
    });
    document.getElementById('hbStyleSel').addEventListener('change', function (e) {
      document.execCommand && document.execCommand('formatBlock', false, e.target.value.toUpperCase());
      e.target.value = 'p';
    });
    document.getElementById('hbListType').addEventListener('change', function (e) {
      var sel = window.getSelection();
      var n = sel && sel.anchorNode;
      while (n && n.nodeName !== 'OL') n = n.parentNode;
      if (n) { if (e.target.value) n.setAttribute('type', e.target.value); else n.removeAttribute('type'); }
      else NL.toast && NL.toast('Put the cursor inside a numbered list first.', 'info');
      e.target.value = '';
    });
    document.getElementById('hbSecLink').addEventListener('change', function (e) {
      var id = e.target.value;
      if (id) document.execCommand && document.execCommand('createLink', false, '#' + id);
      e.target.value = '';
    });

    var host = document.getElementById('hbBlocks');
    host.addEventListener('click', function (e) {
      var blockEl = e.target.closest('.hb-block');
      if (e.target.closest('[data-addcard]')) {
        refreshBlocksFromDom();
        var idx = Array.prototype.indexOf.call(host.children, blockEl);
        if (S.draft.blocks[idx]) S.draft.blocks[idx].cards.push({});
        else S.draft.blocks.push({ t: 'cards', cards: [{}] });
        rerenderBlocks(); return;
      }
      if (e.target.closest('.hb-card-ed__del')) {
        e.target.closest('.hb-card-ed').remove();
        return;
      }
      var mv = e.target.closest('[data-bmove]');
      if (mv && blockEl) {
        refreshBlocksFromDom();
        var i = Array.prototype.indexOf.call(host.children, blockEl);
        var j = i + parseInt(mv.getAttribute('data-bmove'), 10);
        if (j >= 0 && j < S.draft.blocks.length) {
          var t = S.draft.blocks[i]; S.draft.blocks[i] = S.draft.blocks[j]; S.draft.blocks[j] = t;
          rerenderBlocks();
        }
        return;
      }
      if (e.target.closest('[data-bdel]') && blockEl) {
        if (!confirm('Remove this block?')) return;
        blockEl.remove(); return;
      }
      var tr = e.target.closest('[data-trow]');
      if (tr && blockEl) {
        refreshBlocksFromDom();
        var bi = Array.prototype.indexOf.call(host.children, blockEl);
        var blk = S.draft.blocks[bi];
        if (blk && blk.t === 'table') {
          if (tr.getAttribute('data-trow') === '1') blk.rows.push(blk.head.map(function () { return ''; }));
          else if (blk.rows.length > 1) blk.rows.pop();
          rerenderBlocks();
        }
        return;
      }
      var tc = e.target.closest('[data-tcol]');
      if (tc && blockEl) {
        refreshBlocksFromDom();
        var ci = Array.prototype.indexOf.call(host.children, blockEl);
        var blk2 = S.draft.blocks[ci];
        if (blk2 && blk2.t === 'table') {
          if (tc.getAttribute('data-tcol') === '1') { blk2.head.push(''); blk2.rows.forEach(function (r) { r.push(''); }); }
          else if (blk2.head.length > 1) { blk2.head.pop(); blk2.rows.forEach(function (r) { r.pop(); }); }
          rerenderBlocks();
        }
        return;
      }
    });
    document.querySelector('.hb-addblock').addEventListener('click', function (e) {
      var b = e.target.closest('[data-addblock]');
      if (!b) return;
      refreshBlocksFromDom();
      var t = b.getAttribute('data-addblock');
      S.draft.blocks.push(t === 'cards' ? { t: 'cards', cards: [{}] } :
        t === 'table' ? { t: 'table', head: ['', ''], rows: [['', '']] } : { t: 'text', html: '' });
      rerenderBlocks();
    });
  }
  function rerenderBlocks() {
    document.getElementById('hbBlocks').innerHTML = S.draft.blocks.map(blockEditorHtml).join('');
  }

  /* ---- Contact cards editor (for type:'contacts' nodes) ---- */  /* ---- Contact cards editor (for type:'contacts' nodes) ---- */
  function contactRow(c) {
    c = c || {};
    function f(k, ph) { return '<input data-cf="' + k + '" value="' + esc(c[k] || '') + '" placeholder="' + ph + '">'; }
    return '<div class="hb-card-ed">' +
      '<div class="hb-card-ed__grid">' +
        f('name', 'Name') + f('role', 'Role / title') + f('org', 'Organisation (optional)') +
        f('email', 'Email') + f('phone', 'Phone') + f('note', 'Note (optional)') +
      '</div>' +
      '<button class="btn-icon hb-card-ed__del" title="Remove">×</button>' +
    '</div>';
  }

  /* ============ Blocks model (v0.11) ============
     A section's content is a stack of blocks: text / cards / table.
     Legacy nodes (body and/or contacts fields) derive their blocks on the
     fly; saving writes blocks[] plus body/contacts mirrors (the public
     flipbook and search read the body mirror). */
  function arr(x) { return !x ? [] : (Array.isArray(x) ? x : Object.keys(x).map(function (k) { return x[k]; })); }

  function deriveBlocks(node) {
    if (node.blocks) {
      return arr(node.blocks).map(function (b) {
        if (b.t === 'cards') return { t: 'cards', cards: arr(b.cards) };
        if (b.t === 'table') return { t: 'table', head: arr(b.head), rows: arr(b.rows).map(arr) };
        return { t: 'text', html: b.html || '' };
      });
    }
    var out = [];
    if (node.body && node.body.trim()) out.push({ t: 'text', html: node.body });
    if (node.contacts && arr(node.contacts).length) out.push({ t: 'cards', cards: arr(node.contacts) });
    return out;
  }

  function tableToHtml(b) {
    var head = (b.head || []).some(function (h) { return h && h.trim(); })
      ? '<thead><tr>' + b.head.map(function (h) { return '<th>' + esc(h) + '</th>'; }).join('') + '</tr></thead>'
      : '';
    return '<table>' + head + '<tbody>' +
      (b.rows || []).map(function (r) { return '<tr>' + r.map(function (c) { return '<td>' + linkify(esc(c)) + '</td>'; }).join('') + '</tr>'; }).join('') +
    '</tbody></table>';
  }

  function blocksToHtml(blocks) {
    return blocks.map(function (b) {
      if (b.t === 'cards') return contactsToHtml(b.cards);
      if (b.t === 'table') return tableToHtml(b);
      return bodyIsHtml(b.html) ? linkify(sanitizeHtml(b.html)) : mdToHtml(b.html);
    }).join('');
  }

  /* Read-view render of a contacts node as a card grid. */
  function contactsToHtml(contacts) {
    if (!contacts || !contacts.length) return '';
    return '<div class="hb-contacts">' + contacts.map(function (c) {
      var lines = [];
      if (c.email) lines.push('<a href="mailto:' + esc(c.email) + '">' + esc(c.email) + '</a>');
      if (c.phone) lines.push('<span>' + esc(c.phone) + '</span>');
      var sub = [c.role, c.org].filter(Boolean).map(esc).join(' · ');
      return '<div class="hb-contact">' +
        (c.name ? '<div class="hb-contact__name">' + esc(c.name) + '</div>' : '') +
        (sub ? '<div class="hb-contact__role">' + sub + '</div>' : '') +
        (lines.length ? '<div class="hb-contact__c">' + lines.join('<br>') + '</div>' : '') +
        (c.note ? '<div class="hb-contact__note">' + esc(c.note) + '</div>' : '') +
      '</div>';
    }).join('') + '</div>';
  }


  function fmtDate(ts) {
    try { return new Date(ts).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }); }
    catch (e) { return ''; }
  }

  /* ============ Mutations (admin/superadmin) ============ */
  function genId() { return 'n' + Date.now().toString(36) + Math.floor(Math.random() * 1e4).toString(36); }

  function persistNode(node, action, detail) {
    node.updatedAt = Date.now();
    node.updatedBy = (S.session && (S.session.name || S.session.email)) || null;
    var fdb = firebase.database();
    if (NL.writeAudit) NL.writeAudit('handbook_' + action, detail);
    fdb.ref(BASE + '/audit').push({
      ts: firebase.database.ServerValue.TIMESTAMP,
      uid: (S.session && S.session.uid) || null,
      email: (S.session && S.session.email) || null,
      action: action, detail: detail
    });
    /* blocks[] is canonical; body is a rendered MIRROR for the public
       flipbook + search; contacts mirror = first cards block (legacy). */
    var blocks = node.blocks ? deriveBlocks(node) : deriveBlocks(node);
    node.blocks = blocks;
    node.body = blocks.length ? blocksToHtml(blocks) : '';
    var firstCards = blocks.filter(function (b) { return b.t === 'cards'; })[0];
    var rec = {
      parentId: node.parentId, order: node.order, kind: node.kind || 'section',
      type: firstCards ? 'contacts' : 'prose',
      number: node.number || null, title: node.title || '', body: node.body,
      blocks: blocks,
      updatedAt: node.updatedAt, updatedBy: node.updatedBy
    };
    if (firstCards) rec.contacts = firstCards.cards;
    return fdb.ref(BASE + '/nodes/' + node.id).set(rec).catch(function (err) {
      NL.toast && NL.toast('Save failed: ' + (err.message || err) + ' — refresh before editing further.', 'error');
    });
  }

  function startEdit(node) {
    S.editing = node.id;
    var blocks = deriveBlocks(node);
    if (!blocks.length) blocks = [{ t: 'text', html: '' }];
    S.draft = { number: node.number || '', title: node.title || '', kind: node.kind || 'section', blocks: blocks };
    render();
  }
  function startAdd(parentId, afterOrder) {
    S.editing = '__new__';
    S.draft = { number: '', title: 'Untitled', kind: parentId === null ? 'chapter' : 'section',
      blocks: [{ t: 'text', html: '' }], parentId: parentId, order: afterOrder };
    render();
  }
  function saveDraft() {
    var d = S.draft;
    d.blocks = readDraftBlocks();
    if (!d.title.trim()) { NL.toast && NL.toast('A title is required.', 'info'); return; }
    if (S.editing === '__new__') {
      var node = { id: genId(), parentId: d.parentId, order: d.order, kind: d.kind,
        number: d.number.trim(), title: d.title.trim(), blocks: d.blocks };
      S.nodes[node.id] = node;
      S.currentId = node.id;
      persistNode(node, 'add', 'Added "' + node.title + '"');
    } else {
      var n = S.nodes[S.editing];
      n.number = d.number.trim(); n.title = d.title.trim(); n.kind = d.kind;
      n.blocks = d.blocks;
      persistNode(n, 'edit', 'Edited "' + n.title + '"');
    }
    S.editing = null; S.draft = null; render();
  }
  function deleteNode(node) {
    if (childrenOf(node.id).length) { NL.toast && NL.toast('Delete or move its sub-sections first.', 'info'); return; }
    if (!confirm('Delete "' + node.title + '"? This cannot be undone.')) return;
    delete S.nodes[node.id];
    var sib = childrenOf(node.parentId)[0];
    S.currentId = sib ? sib.id : (childrenOf(null)[0] || {}).id;
    if (NL.writeAudit) NL.writeAudit('handbook_delete', 'Deleted "' + node.title + '"');
    firebase.database().ref(BASE + '/audit').push({ ts: firebase.database.ServerValue.TIMESTAMP, uid: (S.session && S.session.uid) || null, email: (S.session && S.session.email) || null, action: 'delete', detail: 'Deleted "' + node.title + '"' });
    firebase.database().ref(BASE + '/nodes/' + node.id).remove();
    render();
  }
  function moveNode(node, dir) {
    var sibs = childrenOf(node.parentId);
    var i = sibs.findIndex(function (n) { return n.id === node.id; });
    var j = i + dir;
    if (j < 0 || j >= sibs.length) return;
    var a = sibs[i], b = sibs[j];
    var ao = a.order, bo = b.order;
    a.order = bo; b.order = ao;
    persistNode(a, 'reorder', 'Reordered "' + a.title + '"');
    persistNode(b, 'reorder', 'Reordered "' + b.title + '"');
    render();
  }

  /* ============ Skeleton seed (superadmin one-off) ============ */
  /* One-off: import the carved 2025/26 handbook content (handbook-content.json,
     governance core only — club pages live in the directory). Idempotent. */
  /* Import / re-import the carved 2025/26 content — SELECTIVE: only
     sections still authored by seed/import (or empty) are replaced;
     anything a person has edited is preserved. Import-authored sections
     that no longer exist in the carve are removed (structure changes).
     Safe to run repeatedly as the carve improves. */
  function importContent() {
    var btn = document.getElementById('hbImportBtn') || document.getElementById('hbReimport');
    if (btn) { btn.disabled = true; btn.textContent = 'Importing…'; }
    function restore() { if (btn) { btn.disabled = false; btn.textContent = 'Re-import'; } }
    var carve;
    NL.ensureAuth()
      .then(function () { return fetch('/tools/handbook/handbook-content.json?cb=' + Date.now()); })
      .then(function (r) { if (!r.ok) throw new Error('content file not found (' + r.status + ')'); return r.json(); })
      .then(function (list) {
        carve = list;
        return firebase.database().ref(BASE + '/nodes').once('value');
      })
      .then(function (snap) {
        var existing = snap.val() || {};
        function machine(n) { return !(n.body && n.body.trim()) && !(n.contacts && Object.keys(n.contacts).length) || n.updatedBy === 'seed' || n.updatedBy === 'import 2025/26'; }
        var preserved = 0, replaced = 0, removed = 0;
        var updates = {};
        var now = Date.now();
        var carveIds = {};
        carve.forEach(function (n) { carveIds[n.id] = true; });
        carve.forEach(function (n) {
          var ex = existing[n.id];
          if (ex && !machine(ex)) { preserved++; return; }
          replaced++;
          updates[n.id] = {
            parentId: n.parentId || null, order: n.order || 0, kind: n.kind || 'section',
            type: 'prose',
            number: n.number || null, title: n.title || '',
            body: (n.body && n.body.trim()) ? mdToHtml(n.body) : '',
            updatedAt: now, updatedBy: 'import 2025/26'
          };
        });
        Object.keys(existing).forEach(function (id) {
          if (!carveIds[id] && machine(existing[id])) { updates[id] = null; removed++; }
        });
        if (!replaced && !removed) throw new Error('Nothing to import — every section has been hand-edited.');
        var msg = 'Import will replace ' + replaced + ' section' + (replaced === 1 ? '' : 's') +
          (preserved ? ', preserve ' + preserved + ' hand-edited' : '') +
          (removed ? ', remove ' + removed + ' superseded' : '') + '. Continue?';
        if (!confirm(msg)) throw new Error('__cancelled__');
        if (NL.writeAudit) NL.writeAudit('handbook_import', 'Imported 2025/26 content: ' + replaced + ' replaced, ' + preserved + ' preserved, ' + removed + ' removed');
        return firebase.database().ref(BASE + '/nodes').update(updates);
      })
      .then(function () { return loadNodes(); })
      .then(function () {
        S.seeded = true;
        if (!S.nodes[S.currentId]) S.currentId = (childrenOf(null)[0] || {}).id;
        render();
        NL.toast && NL.toast('Import complete.', 'success');
        restore();
      })
      .catch(function (err) {
        if ((err && err.message) !== '__cancelled__') {
          NL.toast && NL.toast('Import failed: ' + (err.message || err), 'error');
        }
        restore();
      });
  }

  function seedSkeleton() {
    var btn = document.getElementById('hbSeedBtn');
    if (btn) { btn.disabled = true; btn.textContent = 'Creating…'; }
    var spec = [
      ['Front matter', null, [
        ['League officials & board', null], ['League contacts', null], ['Sponsors & partners', null],
        ['Associated leagues & associations', null]
      ]],
      ['Articles of Association', null, []],
      ['Standardised Membership Rules', null, [
        ['Membership & subscriptions', null], ['Admission charges', null],
        ['Arrangement of fixtures', null], ['General meetings & AGM', null],
        ['Board directives', null], ['Alterations to rules', null]
      ]],
      ['Tariffs', null, [['Fees tariff', null], ['Fines tariff', null]]],
      ['Appendices', null, [
        ['Disciplinary procedures', 'Appendix A'],
        ['The National League Play-Off Competition', 'Appendix B'],
        ['The National League North & South Play-Off Competitions', 'Appendix C'],
        ['Financial regulations', 'Appendix D'],
        ['Budget monitoring scheme', 'Appendix E'],
        ['Televising of matches', 'Appendix F'],
        ['National League System', 'Appendix G'],
        ['Embargo', 'Appendix H'],
        ['Match delegate', 'Appendix I'],
        ['Standing orders', 'Appendix J'],
        ['Kicks from the penalty mark', 'Appendix K'],
        ['Standardised ground criteria', 'Appendix M'],
        ['Standardised ground grading', 'Appendix N'],
        ['League Cup', 'Appendix P'],
        ['The licensing system', 'Appendix Q'],
        ['Acquisition materials', 'Appendix R']
      ]],
      ['Reference', null, [['Average attendances', null], ['Admission charges (reference)', null]]]
    ];
    var payload = {};
    var co = 0;
    spec.forEach(function (chap) {
      var cid = genId();
      payload[cid] = { parentId: null, order: co++, kind: 'chapter', number: null, title: chap[0], body: '', updatedAt: Date.now(), updatedBy: 'seed' };
      var so = 0;
      chap[2].forEach(function (child) {
        var sid = genId();
        payload[sid] = {
          parentId: cid, order: so++, kind: chap[0] === 'Appendices' ? 'appendix' : 'section',
          number: child[1] || null, title: child[0], body: '', updatedAt: Date.now(), updatedBy: 'seed'
        };
      });
    });
    NL.ensureAuth()
      .then(function () { return firebase.database().ref(BASE + '/nodes').once('value'); })
      .then(function (snap) {
        if (snap.val()) throw new Error('Handbook already has content — not overwriting.');
        if (NL.writeAudit) NL.writeAudit('handbook_seed', 'Seeded handbook skeleton (' + Object.keys(payload).length + ' nodes)');
        return firebase.database().ref(BASE + '/nodes').set(payload);
      })
      .then(function () { return loadNodes(); })
      .then(function () { S.seeded = true; S.currentId = childrenOf(null)[0].id; render(); NL.toast && NL.toast('Structure created — start filling in sections.', 'success'); })
      .catch(function (err) {
        NL.toast && NL.toast('Seed failed: ' + (err.message || err), 'error');
        if (btn) { btn.disabled = false; btn.textContent = 'Create handbook structure'; }
      });
  }

  /* ============ Load + boot ============ */
  function loadNodes() {
    return NL.ensureAuth()
      .then(function () { return firebase.database().ref(BASE + '/nodes').once('value'); })
      .then(function (snap) {
        var val = snap.val() || {};
        S.nodes = {};
        Object.keys(val).forEach(function (id) {
          var n = val[id];
          var contacts = [];
          if (n.contacts) {
            var carr = Array.isArray(n.contacts) ? n.contacts : Object.keys(n.contacts).map(function (k) { return n.contacts[k]; });
            contacts = carr.map(function (c) {
              return { name: c.name || '', role: c.role || '', org: c.org || '', email: c.email || '', phone: c.phone || '', note: c.note || '' };
            });
          }
          S.nodes[id] = { id: id, parentId: n.parentId || null, order: n.order || 0, kind: n.kind || 'section',
            type: n.type === 'contacts' ? 'contacts' : 'prose', number: n.number || '', title: n.title || '',
            body: n.body || '', contacts: contacts, updatedAt: n.updatedAt || null, updatedBy: n.updatedBy || null };
        });
        S.seeded = Object.keys(S.nodes).length > 0;
        /* Chapters load collapsed; the current page's path expands. */
        Object.keys(S.nodes).forEach(function (id) {
          if (S.nodes[id].parentId === null && S.collapsed[id] === undefined) S.collapsed[id] = true;
        });
      });
  }

  function expandPathTo(id) {
    var n = S.nodes[id];
    while (n && n.parentId) { S.collapsed[n.parentId] = false; n = S.nodes[n.parentId]; }
    if (n) S.collapsed[n.id] = false;
  }

  function openFromHash() {
    var h = (location.hash || '').replace(/^#/, '');
    if (h && S.nodes[h]) { S.currentId = h; expandPathTo(h); }
  }

  function wire() {
    // Sidebar nav + carets (delegated)
    document.getElementById('hbSide').addEventListener('click', function (e) {
      if (e.target && e.target.id === 'hbAddChapter') { startAdd(null, childrenOf(null).length); return; }
      var caret = e.target.closest('[data-toc-caret]');
      if (caret) { var cid = caret.getAttribute('data-toc-caret'); S.collapsed[cid] = !S.collapsed[cid]; renderToc(); return; }
      var link = e.target.closest('[data-toc]');
      if (link) { e.preventDefault(); navigate(link.getAttribute('data-toc')); }
    });
    document.getElementById('hbSearch').addEventListener('input', function (e) {
      S.search = e.target.value.trim(); renderToc();
    });
    // Main pane (delegated: nav links + editor buttons + seed)
    document.getElementById('hbMain').addEventListener('click', function (e) {
      var t = e.target;
      if (t.id === 'hbImportBtn') { importContent(); return; }
      if (t.id === 'hbSeedBtn') { seedSkeleton(); return; }
      if (t.id === 'hbInlineOn') { S.inlineView = S.currentId; render(); return; }
      if (t.id === 'hbInlineOff') { S.inlineView = null; render(); return; }
      var link = t.closest('[data-toc]');
      if (link) { e.preventDefault(); navigate(link.getAttribute('data-toc')); return; }
      if (!canEdit()) return;
      var node = S.nodes[S.currentId];
      if (t.id === 'hbReimport') { importContent(); return; }
      if (t.id === 'hbEdit' && node) startEdit(node);
      else if (t.id === 'hbAddChild' && node) startAdd(node.id, childrenOf(node.id).length);
      else if (t.id === 'hbAddSibling' && node) startAdd(node.parentId, (node.order || 0) + 0.5);
      else if (t.id === 'hbMoveUp' && node) moveNode(node, -1);
      else if (t.id === 'hbMoveDown' && node) moveNode(node, 1);
      else if (t.id === 'hbDelete' && node) deleteNode(node);
      else if (t.id === 'hbSave') saveDraft();
      else if (t.id === 'hbCancel') { S.editing = null; S.draft = null; render(); }
    });
    window.addEventListener('hashchange', function () { openFromHash(); render(); });
  }

  function navigate(id) {
    if (S.editing) { S.editing = null; S.draft = null; }
    expandPathTo(id);
    S.currentId = id;
    S.search = ''; var sb = document.getElementById('hbSearch'); if (sb) sb.value = '';
    if (history.replaceState) history.replaceState(null, '', '#' + id); else location.hash = id;
    render();
  }

  window.TOOL = window.TOOL || {};
  window.TOOL.boot = function (session) {
    S.session = session;
    S.role = (session && session.role) || 'viewer';
    wire();
    loadNodes()
      .then(function () { openFromHash(); render(); })
      .catch(function (err) {
        document.getElementById('hbMain').innerHTML = '<p style="color:var(--red);padding:24px;">Failed to load the handbook — ' + esc(err.message || String(err)) + '</p>';
      });
  };

  if (window._toolDeferredSession) { window.TOOL.boot(window._toolDeferredSession); window._toolDeferredSession = null; }
})();
</script>
