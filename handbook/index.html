  Version: v0.61 (21/08/2026) — URGENT FIX. Reported from the live site:

    styles were all intact — only the redundant copy of the key inside the
    value. normNode now stamps the id from the key on the way in, so the
    draft repairs itself on the next load with no database write and no
    migration, and the two writers that store a stripped clause put the id
    back as well.

  Version: v0.46 (21/08/2026) — one editing bar, not two at opposite ends.

    Richard: "why two diff editing areas here?" Because they were built at
    different times for different jobs — text formatting (B/I/U, lists, clear)
    in a strip at the TOP of the pane, structure (+ clause, indent, numbering,
    delete) in the bar at the bottom. A split along a line that means
    something to the code and nothing to the person using it, with the two
    halves as far apart as the layout allows.

    One bar now, at the foot: everything that acts on the CLAUSE YOU ARE IN.
    The top bar keeps what acts on the DOCUMENT — Read/Edit, undo, publish.

    The merge is not just markup. Formatting and structure want opposite
    things from the same press: formatting needs the caret and selection left
    alone, so its mousedown is prevented; structure needs the blur to fire,
    because the blur is what saves what was just typed. The rule is chosen by
    which kind of button was hit.

    Also, the clause name in the bar is now a button back to it. The bar is
    pinned to the foot, so the clause it names can be scrolled well off screen

  Version: v0.45 (21/08/2026) — one gap, one meaning, and it names the number.

    Richard: "when I'm floating between two clauses within the same
    subsection, it looks like I'm invited to either add a new clause after the
    previous one or before the next one. So each gap has two entry points."
    Correct, and they were the same insertion — same parent, same position,
    same resulting number — offered as if they were a choice.

    Boundaries canonicalise to "after the one above". "Before" survives only
    where it is genuinely distinct: a clause with no previous sibling, where
    the boundary really does host two insertions — one beside the parent, one
    inside it. That is the case he identified as the one that makes sense, and
    the two are drawn at different indents.

    The strip now says "Add 1.1.4 here". computeNumbers is pure, so the
    preview is a walk over a hypothetical tree — built from the SAME spec
    insertRelative uses, because a preview computed from a second guess at the
    numbering rules is one that will eventually lie, and a lying preview is
    worse than none because it is trusted. A light shadow of the tree, not a
    deep clone: numbering reads five fields, and League Rules is 560 clauses
    of body text that would be copied for nothing. Recomputed when the
    boundary changes, never per mouse movement.

    tests/handbook-insert.test.mjs lifts the functions out of this file and
    pins both promises, including that the preview never touches the real tree.
  Version: v0.44 (21/08/2026) — the insert affordance opens a real gap, and
    the whole strip is the target.

    Richard: "this should move the below clause down to make space… whole line
    needs to be clickable. atm i can't even reach the + without floating off."
    Both right, and the second was the worse bug: the strip is a fixed overlay
    and therefore NOT a descendant of #ceDoc, so reaching for the + fired
    #ceDoc's mouseleave and took the thing away before it could be pressed.

    The gap is PADDING on the clause, not margin. Margin sits outside the
    element's box, so the pointer would land on the parent the moment the gap
    opened — clause un-hovered, gap shut, gap reopened, flicker. Padding keeps
    the gap inside the clause that owns it. The edge test measures against the
    CONTENT edges rather than the padded box for the same reason: an open gap
    moves the bottom edge 30px down, and testing the moved edge would put the
    pointer outside the band that opened it.
  Version: v0.43 (21/08/2026) — one editor per area at a time.

    Two people in the same area is the one situation this tool handled badly
    and could not detect: the last save wins, silently, and undo makes it
    worse — one person's undo restores a snapshot that predates the other's
    change and quietly reverses it.

    Pressing Edit now claims draft/locks/<areaId>. Anyone else sees "· in use"
    on the Edit button and who has it, BEFORE they press — a button that looks
    available and then refuses is worse than one that explains.

    A SOFT lock, deliberately, and it can always be taken over. A hard lock on
    a shared legal document is one closed laptop away from nobody being able
    to edit the handbook, and the person who could fix that has gone home.
    Taking over is a confirmation that names the holder, and is audited.

    onDisconnect().remove() is what makes soft enough: Firebase drops the lock
    server-side when the tab closes, the network goes or the laptop sleeps, so
    in the ordinary case there is no timeout to wait out. The three-minute
    staleness window only covers what onDisconnect cannot — a wedged socket
    the server still believes in. A 45-second heartbeat keeps a live editor
    from ever going stale.

    Claimed with a transaction, not a read-then-write: two people pressing
    Edit at the same moment is exactly the case this exists for, and
    read-then-write would hand it to both. Released on Read, on leaving the
    area, and on returning to the cover. Someone whose lock is taken is told
    and dropped to Read rather than left typing into a document two people are
    saving over.

    No rules change: draft/locks sits under draft/, which is already
    admin-and-superadmin-write.
  Version: v0.42 (21/08/2026) — you can see where a clause will land, and
    take it back.

    Richard: "it's almost impossible to know where I'm placing a new item…
    there's also not really an undo function… feels like you could quite
    easily make some serious issues and not know how to fix them."

    UNDO. Every change goes through commit() — structural ops and typing
    alike — so one stack on that single write path covers everything, and
    nothing added later can quietly escape it. Ctrl+Z / Ctrl+Shift+Z, and
    buttons in the TOP bar rather than the action bar, because the action bar
    only appears once a clause is selected and the moment undo is wanted most
    is right after something went wrong. Snapshots rather than inverse diffs:
    a diff has to be RIGHT about what it reverses, a snapshot only has to be a
    copy, and commit() already diffs to work out its writes. Capped at 20 and
    cleared when the area changes, since the ids would not resolve.
    Ctrl+Z is intercepted inside contenteditable too — the browser's own undo
    buffer knows nothing about the clause tree and would leave the two
    disagreeing.

    WHERE IT LANDS. Hovering the document draws a line at the boundary a new
    clause would take, at the depth it would take, with a + to accept it. The
    line IS the answer: it sits between the two clauses it would sit between.
    One element moved under the pointer — a drop zone rendered between every
    pair would be 1,203 of them, which is the per-clause toolbar mistake
    again. Only near an edge, because a line through the middle of a
    paragraph someone is reading is noise.

    DELETING. The confirmation names the clause and quotes its opening words.
    The action bar is no longer beside what it acts on, so "this clause" was a
    question rather than a statement.

  Version: v0.39 (28/07/2026)
  File: /handbook/index.html

  Structured editor for the League's governing documents — computed clause
  numbering, draft and published editions.

  Storage (RTDB):
    app-data/ops-handbook/draft/docs/<docId>/meta        doc metadata
    app-data/ops-handbook/draft/docs/<docId>/nodes/<id>  clause tree (flat map)
    app-data/ops-handbook/editions/<editionId>           frozen published snapshots
    app-data/ops-handbook/publishedEditionId             pointer read by public surfaces
    app-data/ops-handbook/audit                          write log
    tools/ops-handbook                                   tool registration (label, defaults)

  Data model — every node can carry ANY combination of a computed number, an
  optional title, body prose, and children. That single rule handles all the
  documentary irregularity (heading-only articles, straight-to-.1 articles,
  clause + sub-clauses, deep nesting, fixed-exception overrides like 13.B.4).
  numStyle sets how a node's number renders; numberOverride pins an exact label.
  The displayed number is NEVER stored on the draft — it is computed from tree
  position each render by computeNumbers().

  CANON NOTE: the `.nl-doc` document-presentation block below (number gutter +
  legal clause hierarchy + reading typography) is a strong candidate to promote
  into system/nl-brand.css — the handbook already hand-rolls the 1→a→i list CSS
  locally, so this is the second use. Kept tool-local for its first outing here;
  promote in lockstep (?v= bump + Style Guide) once its shape has settled.

  Access (auth-guard registry — see system/auth-guard.js):
    superadmin/admin → edit + publish; staff/club → read the draft.
-->

  .ce-side__search {
    width: 100%; font-family: var(--font); font-size: var(--text-sm); box-sizing: border-box;
    border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; margin-bottom: 12px;
    background: var(--white); color: var(--text);
  }
  .ce-toc { list-style: none; margin: 0; padding: 0; }
  .ce-toc__item {
    display: flex; gap: 6px; padding: 6px 8px; border-radius: 6px; cursor: pointer;
    font-size: var(--text-sm); color: var(--text); line-height: 1.35; text-decoration: none;
  }
  .ce-toc__item:hover { background: var(--navy-50); }
  .ce-toc__item.is-current { background: var(--navy); color: var(--white); }
  .ce-toc__num { color: var(--primary); font-variation-settings: 'wght' 800; flex-shrink: 0; min-width: 20px; }
  .ce-toc__item.is-current .ce-toc__num { color: var(--navy-100); }
  .ce-toc__t { font-variation-settings: 'wght' 600; }
  /* Headingless clauses (e.g. the Memorandum) show a body preview in a
     secondary weight/colour. It wraps rather than truncating — the reader
     rail does the same, and one ellipsised line of "The name of the
     Company is “The …" identifies nothing. */
  .ce-toc__t--preview {
    flex: 1; min-width: 0; overflow-wrap: anywhere;
    font-variation-settings: 'wght' 400; color: var(--text-muted);
  }
  .ce-toc__item.is-current .ce-toc__t--preview { color: var(--navy-100); }
  .ce-toc__result { font-size: var(--text-xs); color: var(--text-muted); margin-bottom: 8px; }
  .ce-toc__result b { color: var(--primary); font-variation-settings: 'wght' 800; }
  .ce-toc__group {
    font-size: var(--text-xs); text-transform: uppercase; letter-spacing: 0.06em;
    font-variation-settings: 'wght' 800; color: var(--navy); margin: 12px 0 4px;
  }

  /* ---- Main / toolbar ----

     ONE CONTROL SIZE, TWO BARS. The document bar had four button idioms in a
     single row — a segmented Read/Edit at one size, a bordered mini-button
     for Undo/Redo at another, canon .btn at a third, and the four fold levels
     at none at all: .ce-fold button set padding and nothing else, so those
     four rendered as raw browser buttons, grey and system-font, in the middle
     of a brand toolbar. Nothing lined up with anything.

     Richard: "generally very confusing toolbar ... plus alignment of top
     buttons etc. needs to be neat, aligned, graceful, userfriendly, clear."

     So every control in either bar is --tool-h tall and shares one idiom,
     including canon .btn, which is height-matched rather than left at its own
     padding. Emphasis is carried by COLOUR — Publish is the one filled red
     thing on the bar — instead of by being taller than its neighbours.

     CANON CANDIDATE: this is a dense toolbar-control size, and .btn is a CTA
     size. Every tool with a toolbar has wanted one; three have hand-rolled it.
     Promoting it wants its own PR and a Style Guide entry, so it is flagged
     here rather than done in passing. */
  .ce-main { min-width: 0; display: flex; flex-direction: column; overflow: hidden; }
  .ce-bar, .hb-bar { --tool-h: 30px; }
  .ce-bar {
    flex: 0 0 auto; display: flex; align-items: center; gap: 6px 16px; flex-wrap: wrap;
    padding: 10px 28px; border-bottom: 1px solid var(--border); background: var(--white);
  }
  #ceDoc { flex: 1 1 auto; overflow-y: auto; min-height: 0; }
  /* Breadcrumb "you are here" (.nl-crumb) comes from nl-brand.css v2.25. */
  /* Wraps INSIDE itself on a phone rather than running off the edge —
     "Publish edition" and "Review changes" side by side are wider than a
     390px screen. */
  .ce-acts {
    display: inline-flex; align-items: center; gap: 6px;
    margin-left: auto; flex-wrap: wrap; justify-content: flex-end;
  }
  .ce-menu-btn { display: none; }
  .ce-scrim { display: none; }
  .ce-tool, .hb-bar button, .hb-bar select {
    height: var(--tool-h);
    font-family: var(--font); font-size: var(--text-xs);
    font-weight: 600; font-variation-settings: 'wght' 600;
    padding: 0 9px; cursor: pointer;
    background: var(--white); color: var(--text);
    border: 1px solid var(--border); border-radius: var(--radius-sm);
  }
  .ce-tool:hover:not(:disabled) { border-color: var(--navy); background: var(--navy-50); }
  .ce-tool:disabled { opacity: .4; cursor: default; }
  .ce-tool:focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; }
  /* Canon .btn, held to the bar's height. Its own padding makes it the
     tallest thing in the row, which is right for a page's CTA and wrong for
     a toolbar where four other kinds of control sit beside it. */
  .ce-bar .btn { height: var(--tool-h); padding: 0 13px; }
  /* A run of controls that belong together: mode, then undo, then how much of
     the area you can see — three groups instead of eight things in a row.

     GROUPED BY SPACE, NOT BY A RULED LINE. A divider drawn as a group's
     ::before is correct until the bar wraps, and then it opens a row — a
     vertical line hanging in the margin with nothing to its left. The same
     went for the .sep elements in the clause bar, which stranded one at the
     end of a row and led the next with another. Tight inside a group, loose
     between them; a wrap can land anywhere and still look deliberate. */
  .ce-grp { display: inline-flex; align-items: center; gap: 5px; }
  .ce-grp__lbl {
    font-size: var(--text-xs); text-transform: uppercase;
    letter-spacing: var(--tracking-wide); color: var(--text-muted);
    font-weight: 700; font-variation-settings: 'wght' 700;
  }
  /* Segments are joined, so the border belongs to the group and the divider
     between two buttons is one line rather than two touching ones. */
  .ce-seg {
    display: inline-flex; height: var(--tool-h);
    border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden;
  }
  .ce-seg button {
    border: 0; border-left: 1px solid var(--border); border-radius: 0;
    background: var(--white); color: var(--text); font-family: var(--font);
    font-size: var(--text-xs); padding: 0 12px; cursor: pointer;
    font-weight: 600; font-variation-settings: 'wght' 600;
  }
  .ce-seg button:first-child { border-left: 0; }
  .ce-seg button:hover:not(.is-on) { background: var(--navy-50); }
  .ce-seg button.is-on { background: var(--navy); color: var(--white); }
  .ce-seg button:focus-visible { outline: 2px solid var(--primary); outline-offset: -2px; }
  /* The note SHRINKS before the buttons wrap. The media query below hides it
     on a narrow window, but the editing pane is narrow long before the window
     is — a sidebar open on one side and the contents on the other — and a run
     of text that will not give way is what pushed Publish onto a third ragged
     row in the first place. */
  .ce-mode-note {
    font-size: var(--text-xs); color: var(--text-muted);
    flex: 0 1 auto; min-width: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  /* ---- The publish review ----
     Green and red mean the same here as anywhere: struck red is what the
     published edition says, green is what the draft says instead. Both from
     brand tokens — the -light grounds are the same pairing .pill uses. */
  .hb-rev { font-size: var(--text-sm); line-height: 1.6; }
  .hb-rev__sum { margin: 0 0 10px; color: var(--text); }
  .hb-rev__renum {
    margin: 0 0 16px; padding: 8px 12px; border-radius: var(--radius-sm);
    background: var(--off-white); color: var(--text-muted); font-size: var(--text-xs);
  }
  .hb-rev__area { margin: 0 0 20px; }
  .hb-rev__h {
    display: flex; align-items: center; gap: 8px; margin: 0 0 8px;
    font-size: var(--text-xs); text-transform: uppercase; letter-spacing: var(--tracking-wide);
    color: var(--navy); font-variation-settings: 'wght' 800;
  }
  .hb-rev__item {
    padding: 8px 0 8px 12px; border-left: 3px solid var(--border);
    margin-bottom: 8px;
  }
  .hb-rev__item--added   { border-left-color: var(--green); }
  .hb-rev__item--removed { border-left-color: var(--red); }
  .hb-rev__item--edited  { border-left-color: var(--amber); }
  .hb-rev__item--moved   { border-left-color: var(--blue); }
  .hb-rev__head { margin: 0 0 4px; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .hb-rev__what {
    font-size: var(--text-xs); text-transform: uppercase; letter-spacing: var(--tracking-wide);
    font-variation-settings: 'wght' 800; color: var(--text-muted);
  }
  .hb-rev__num { font-variation-settings: 'wght' 800; color: var(--navy); }
  .hb-rev__lbl { color: var(--text); min-width: 0; overflow-wrap: anywhere; }
  .hb-rev__diff, .hb-rev__note { margin: 0; }
  /* Pushed to the right of its row and quiet until wanted: a revert button
     shouting on every one of forty rows competes with the change it is
     offering to undo.
     A CIRCULAR ARROW, not the back chevron the first cut used — a chevron on
     the right of a row reads as "previous" or "collapse", and this is the
     one control here that must not be pressed by accident or missed when
     wanted.
     Never dimmed on a touch screen: there is no hover there, so the dim
     would be permanent and the button would simply look disabled. */
  .hb-rev__back { margin-left: auto; opacity: 0.55; }
  .hb-rev__item:hover .hb-rev__back, .hb-rev__back:focus-visible { opacity: 1; }
  @media (hover: none) { .hb-rev__back { opacity: 1; } }
  .hb-rev__item--done { opacity: 0.55; }
  .hb-rev__restore {
    margin: 0 0 14px; padding: 10px 12px; border-radius: var(--radius-sm);
    background: var(--amber-light); color: var(--text);
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    font-size: var(--text-xs);
  }
  .hb-rev__restore span { flex: 1 1 220px; min-width: 0; }
  .hb-rev__dismiss {
    flex: none; border: 0; background: none; cursor: pointer;
    color: var(--text-muted); font-size: 18px; line-height: 1;
    padding: 2px 6px; border-radius: var(--radius-sm);
  }
  .hb-rev__dismiss:hover { color: var(--text); background: var(--amber-light); }
  .hb-rev__dismiss:focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; }
  .hb-rev__discard {
    margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--border);
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  }
  .hb-rev__discard p {
    flex: 1 1 220px; min-width: 0; margin: 0;
    font-size: var(--text-xs); color: var(--text-muted);
  }
  .hb-rev__note { color: var(--text-muted); font-size: var(--text-xs); }
  .hb-rev ins, .hb-rev del { text-decoration: none; border-radius: 3px; padding: 0 2px; }
  .hb-rev ins { background: var(--green-light); color: var(--green); }
  .hb-rev del { background: var(--red-light); color: var(--red); text-decoration: line-through; }

  /* ---- Mobile: side rail becomes a slide-in drawer; document goes full width ---- */
  @media (max-width: 860px) {
    .ce-layout { grid-template-columns: 1fr; }
    .ce-bar { padding: 10px 14px; }
    .ce-mode-note { display: none; }
    /* Everything a touch grows by 4px on a phone, the hamburger included —
       it was 38px square beside 30px controls, which is the one button on the
       bar that is obviously not lined up with the rest. */
    .ce-bar, .hb-bar { --tool-h: 34px; }
    .ce-menu-btn {
      display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto;
      width: var(--tool-h); height: var(--tool-h);
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      background: var(--white); color: var(--navy); font-size: var(--text-base); cursor: pointer;
    }
    .ce-side {
      position: fixed; top: var(--ce-top, 60px); left: 0; bottom: 0; width: 84%; max-width: 330px;
      z-index: 60; transform: translateX(-100%); transition: transform .24s ease;
      border-right: 1px solid var(--border);   /* crisp edge — no glow bleeding onto the topbar */
    }
    .ce-side.is-open { transform: none; }
    .ce-scrim {
      display: block; position: fixed; inset: var(--ce-top, 60px) 0 0 0; background: var(--navy-900);
      opacity: 0; pointer-events: none; transition: opacity .24s ease; z-index: 55;
    }
    .ce-scrim.is-open { opacity: 0.42; pointer-events: auto; }
  }

  /* Title page (.nl-cover), reading presentation (.nl-doc) and document
     tables (.nl-tbl) come from nl-brand.css v2.25 — only the editing chrome
     below is tool-local. */
  .nl-doc.is-editing .nl-tbl [contenteditable]:focus { box-shadow: inset 0 0 0 2px var(--primary); outline: none; }
  .nl-tbl-ctrl { display: flex; gap: 6px; margin: 0 0 12px; }
  .nl-tbl-ctrl button {
    font-family: var(--font); font-size: var(--text-xs); padding: 3px 8px; border: 1px solid var(--border);
    background: var(--white); color: var(--text); border-radius: 5px; cursor: pointer;
  }
  .nl-tbl-ctrl button:hover { border-color: var(--navy); background: var(--navy-50); }

  /* ---- Editing chrome (only in edit mode) ---- */
  .nl-doc.is-editing .nl-clause__text,
  .nl-doc.is-editing .nl-clause__title,
  .nl-doc.is-editing .nl-art__title { border-radius: 5px; }
  .nl-doc.is-editing [contenteditable]:hover { box-shadow: 0 0 0 1px var(--border); }
  .nl-doc.is-editing [contenteditable]:focus { box-shadow: var(--focus-ring); outline: none; background: var(--white); }
  .nl-doc.is-editing [contenteditable] { padding: 2px 4px; min-height: 1.2em; }
  /* Placeholder shown in an empty editable slot so it's clear where to type.

     It must not inherit the SLOT's type. A section title is 18px at weight
     800, so recolouring alone gave a big bold grey line that read as an
     actual heading — Richard: "it's not clear enough to the naked eye that
     that isn't the actual title." The placeholder is now small, light and
     italic whatever it sits in, which is the whole job of a placeholder. */
  .nl-doc.is-editing [contenteditable][data-ph]:empty::before {
    content: attr(data-ph); color: var(--text-muted); font-style: italic; pointer-events: none;
    font-size: var(--text-sm); font-variation-settings: 'wght' 400;
    letter-spacing: normal; text-transform: none;
  }

  /* ---- Formatting toolbar (edit mode) ---- */
  /* No in-document selection marker — the breadcrumb + contents highlight say where you are. */

  /* The Edit button when someone else is in there. Not disabled — taking over
     is allowed and sometimes necessary — but it should not look like an
     ordinary press. */
  #ceEditBtn.is-held::after {
    content: ' \00B7 in use';
    font-weight: 500; font-variation-settings: 'wght' 500;
    opacity: .75;
  }

  /* The insert affordance. Two things it has to do that a line drawn over the
     text does not: OPEN A GAP, so the space it would occupy is the space you
     can see, and be clickable along its whole length, so reaching it does not
     mean travelling to a 22px target and losing the hover on the way.

     The gap is PADDING on the clause, not margin, deliberately. Margin sits
     outside the element's box, so the pointer would end up over the parent
     the moment the gap opened, the clause would stop being hovered, the gap
     would close, and it would reopen — a flicker loop. Padding keeps the gap
     inside the clause that owns it.

     Named WITHOUT the canon class in front (.hb-gap-*, not
     .nl-clause.hb-gap-*), so this stays a page-local modifier rather than a
     redefinition of a shared component. lint-tools --strict refuses the
     latter and is right to: .nl-clause belongs to the canon, and a page that
     qualifies it is a page that will disagree with the canon later. The
     selector reads better for losing it, and the class is only ever put on a
     clause or an article by the code below. */
  /* A clause that has just arrived, or one just jumped to. Fades on its own —
     a marker needing dismissal would be a second thing to do afterwards.

     Distinct from .is-sel (nl-brand.css), which is the standing "this is the
     clause the bar acts on". This is the transient "it is over here". */
  .hb-flash { animation: hb-flash-fade 1.4s ease-out; }
  @keyframes hb-flash-fade {
    0%   { background: var(--amber-light); }
    100% { background: transparent; }
  }
  @media (prefers-reduced-motion: reduce) { .hb-flash { animation: none; } }

  .hb-gap-before { padding-top: 30px; }
  .hb-gap-after  { padding-bottom: 30px; }

  /* Exactly as tall as the gap it sits in, so the whole opened space is the
     target and the cursor turns to a hand across all of it — a 24px strip in
     a 30px gap leaves a 3px band either side that still shows a text caret,
     which reads as "not clickable here" at precisely the moment it is. */
  .hb-ins {
    position: fixed; z-index: 40; cursor: pointer;
    display: flex; align-items: center; gap: 8px;
    height: 30px; margin-top: -15px;   /* GAP, centred on the boundary */
  }
  .hb-ins__line {
    flex: 1 1 auto; height: 2px; border-radius: 2px;
    background: var(--primary); opacity: .55;
  }
  .hb-ins:hover .hb-ins__line { opacity: 1; }
  .hb-ins__go {
    flex: none; pointer-events: none;   /* the whole strip is the button */
    width: 22px; height: 22px; line-height: 20px; padding: 0; text-align: center;
    font-family: var(--font); font-size: var(--text-sm); font-weight: 700;
    color: var(--white); background: var(--primary);
    border: 0; border-radius: 50%; opacity: .75;
  }
  .hb-ins:hover .hb-ins__go { opacity: 1; }
  .hb-ins__hint {
    flex: none; pointer-events: none;
    font-size: var(--text-xs); font-weight: 600;
    font-variation-settings: 'wght' 600;
    /* Visible whenever the strip is, not only on hover: the number IS the
       information — "Add 1.1.4 here" answers the question the gap raises. */
    color: var(--primary); opacity: .8;
  }
  .hb-ins:hover .hb-ins__hint { opacity: 1; }

  /* The action bar. One of these, at the foot of the editing pane.
     It replaced a per-clause toolbar: eleven controls on each of 1,203 nodes,
     which drew 6,160 buttons in League Rules alone and left two of every three
     rows on screen as furniture. See system/handbook-editor-plan.md. */
  /* Second in a stack of two bars: the document bar above acts on the whole
     area, this one on the selected clause. */
  .hb-bar {
    flex: none; display: flex; align-items: center; gap: 10px;
    padding: 8px 12px; border-bottom: 2px solid var(--primary);
    background: var(--white); flex-wrap: wrap;
  }
  .hb-bar__where { display: flex; align-items: baseline; gap: 6px; flex: none; }
  .hb-bar__lbl {
    font-size: var(--text-xs); text-transform: uppercase;
    letter-spacing: var(--tracking-wide); color: var(--text-muted);
    font-weight: 700; font-variation-settings: 'wght' 700;
  }
  /* Which clause the bar acts on. The bar is not beside the clause any more,
     so it has to say — otherwise "Delete" is a question rather than a button.

     IT IS THE CLAUSE, NOT A CONTROL, so it is red text rather than another
     bordered box in a row of them. Written as .hb-bar__num it lost every one
     of those declarations to .hb-bar button, which is the same specificity
     plus an element — so the rule said "red, borderless" and the bar drew a
     grey-bordered button in body colour. Qualified, it wins. */
  .hb-bar button.hb-bar__num {
    font-family: var(--font); font-weight: 700;
    font-variation-settings: 'wght' 700;
    color: var(--primary); font-size: var(--text-sm);
    background: none; border: 0; padding: 0; height: auto; cursor: pointer;
    text-align: left;
  }
  .hb-bar__num:hover { text-decoration: underline; }
  .hb-bar__num:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  /* Four groups — format, add, move, number — set apart by space. See the
     .ce-grp note: a drawn divider strands itself the moment a row wraps, and
     twenty controls in a strip wrap constantly. */
  .hb-bar__ops { display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: center; }
  .hb-grp { display: inline-flex; align-items: center; gap: 4px; flex-wrap: wrap; }
  .hb-bar button, .hb-bar select {
    font-family: var(--font); font-size: var(--text-xs);
    font-weight: 600; font-variation-settings: 'wght' 600;
    padding: 5px 9px; cursor: pointer;
    background: var(--white); color: var(--text);
    border: 1px solid var(--border); border-radius: var(--radius-sm);
  }
  .hb-bar button:hover { border-color: var(--navy); background: var(--navy-50); }
  .hb-bar button.is-bad:hover { border-color: var(--red); color: var(--red); background: var(--white); }
  .hb-bar button:focus-visible, .hb-bar select:focus-visible {
    outline: 2px solid var(--primary); outline-offset: 1px;
  }
  /* The four directional ops. Square and centred, because an icon on a text
     button's padding sits on a baseline and looks dropped — the same shape
     canon's .btn--icon gives, sized to this toolbar rather than to .btn.
     The GLYPH size comes from canon's .icon--sm, not a local rule — a local
     one redefines .icon, which is a page quietly stopping tracking the design
     system while still looking like it uses it. Lint refused it, correctly.
     Sets neither fill nor stroke: the sprite declares those per symbol, and a
     wrapper that states either one flattens the other kind. */
  .hb-bar button.hb-op {
    width: var(--tool-h); padding: 0;
    display: inline-flex; align-items: center; justify-content: center;
  }
  /* HOW DEEP, beside WHICH clause. The number answers this for 6.1.2 and not
     at all for (a), a bullet or an unnumbered heading — which is most of what
     is hard to place. */
  .hb-bar__lvl {
    font-size: var(--text-xs); font-weight: 700;
    font-variation-settings: 'wght' 700;
    background: var(--navy); color: var(--white);
    border-radius: 20px; padding: 2px 9px; white-space: nowrap;
  }
  /* Fold to a level. Sits with Undo/Redo on the DOCUMENT bar, because it acts
     on the document rather than on the selected clause. Tabular figures so
     1/2/3 are the same width and the segment does not jog. */
  #ceFoldSeg button { font-variant-numeric: tabular-nums; min-width: 30px; padding: 0 8px; }
  /* The label stays at every width. "1 2 3 All" on its own is four buttons
     with no subject — the label is the only thing that says what the numbers
     are counting, and it costs 55px. */
  /* Crumb segments are canon (.nl-crumb__sec, incl. the button form and the
     --up modifier this page uses for the ancestors) — nl-brand.css v2.62. */
  @media (max-width: 560px) {
    .hb-bar { gap: 6px; padding: 6px 8px; }
    .hb-bar__lbl { display: none; }
  }
  /* On a phone the bar belongs at the foot, where the thumb is — the one
     place the original position was right. .ce-main is a flex column, so
     order alone moves it; the DOM stays as written. */
  @media (max-width: 700px) {
    .hb-bar { order: 9; border-bottom: 0; border-top: 2px solid var(--primary); }
  }


  .ce-empty { max-width: 560px; margin: 60px auto; text-align: center; }
  .ce-empty__card { background: var(--off-white); border: 1px solid var(--border); border-radius: 12px; padding: 30px; }
  .ce-empty h2 { color: var(--navy); margin: 0 0 8px; }
  .ce-empty p { color: var(--text-muted); margin: 0 0 18px; line-height: 1.55; }

  .ce-preview-badge { display: inline-flex; align-items: center; gap: 6px; font-size: var(--text-xs); color: var(--navy); background: var(--navy-50); padding: 4px 10px; border-radius: 999px; font-variation-settings: 'wght' 700; }

  /* renumber-preview diff table inside NL.modal */
  .ce-diff { width: 100%; border-collapse: collapse; font-size: var(--text-sm); margin-top: 6px; }
  .ce-diff td { padding: 4px 8px; border-bottom: 1px solid var(--border); font-variant-numeric: tabular-nums; }
  .ce-diff .from { color: var(--text-muted); text-decoration: line-through; }
  .ce-diff .to { color: var(--primary); font-variation-settings: 'wght' 800; }
  .ce-diff .arrow { color: var(--text-muted); }
</style>
</head>
<body>

<!-- Topbar — auto-rendered by /system/nl-topbar.js from window.NL_TOOL -->
<div id="nlTopbar"></div>

<div id="pageWrap">
  <div class="ce-layout">
    <aside class="ce-side" id="ceSide">
      <div class="ce-side__head">
        <nav class="ce-nav" id="ceDocNav" aria-label="Document areas"></nav>
        <input type="search" class="ce-side__search" id="ceSearch" placeholder="Search the whole handbook…" autocomplete="off">
      </div>
      <div id="ceToc"></div>
    </aside>

    <main class="ce-main">
      <div class="ce-bar" id="ceBar">
        <button class="ce-menu-btn" id="ceMenu" type="button" aria-label="Show contents">☰</button>
        <div class="ce-seg" id="ceMode">
          <button data-mode="read" class="is-on">Read</button>
          <button data-mode="edit" id="ceEditBtn" hidden>Edit</button>
        </div>
        <!-- Undo lives up here, not on the action bar: the action bar only
             appears once a clause is selected, and the moment you most need
             undo is right after something went wrong.

             The words, not &#8630; and &#8631;. A text arrow is a glyph
             pretending to be an icon — it takes its size and weight from
             whatever font is loaded and sits on the baseline rather than
             centred — and "Undo" needs no picture. The sprite has no undo
             mark; adding one to say what the word already says would be
             work spent making the bar less clear. -->
        <span class="ce-grp" id="ceUndoGrp" hidden>
          <button class="ce-tool" id="ceUndo" type="button">Undo</button>
          <button class="ce-tool" id="ceRedo" type="button">Redo</button>
        </span>
        <!-- Fold to a level. The whole point of folding on a 560-clause area
             is to see its shape, and doing that a twisty at a time is not
             seeing it. Edit mode only — a reader who cannot see a clause
             cannot be bound by it.

             A segmented control, and it LIGHTS the level you folded to. As
             four loose buttons it said what it could do and never what it
             had done, so "am I looking at the whole area or at three levels
             of it" was a question the bar could have answered and didn't. -->
        <span class="ce-grp" id="ceFold" hidden>
          <span class="ce-grp__lbl">Fold to</span>
          <span class="ce-seg" id="ceFoldSeg">
            <button type="button" data-fold-level="1" title="Top-level clauses only">1</button>
            <button type="button" data-fold-level="2" title="Two levels deep">2</button>
            <button type="button" data-fold-level="3" title="Three levels deep">3</button>
            <button type="button" data-fold-level="0" title="Open everything">All</button>
          </span>
        </span>
        <span class="ce-mode-note" id="ceModeNote"></span>
        <!-- What you do to the AREA, held together as one run so that when
             the bar has to wrap, the two that belong side by side — see what
             changed, then publish — wrap together instead of one at a time
             onto rows of their own. -->
        <div class="ce-acts">
        <button class="btn btn--sm btn--ghost" id="ceImportDoc" type="button" hidden>Import documents…</button>
        <input type="file" id="ceDocFile" accept=".docx,.doc" multiple hidden>
        <button class="btn btn--sm btn--ghost" id="ceReimport" type="button" hidden>Re-import</button>
        <!-- "You have edited, and none of it is live yet." Sits BEFORE
             Publish because it is the thing to read first: the sequence is
             see what changed, then publish.
             A canon .pill inside a canon .btn — the pill is the state, the
             button is the action. Neither needed inventing. -->
        <button class="btn btn--sm btn--ghost" id="ceChanges" type="button" hidden>
          <span class="pill pill--pending" id="ceChangesPill" hidden></span>
          <span id="ceChangesLbl">Review changes</span>
        </button>
        <button class="btn btn--sm btn--primary" id="cePublish" type="button" hidden>Publish edition</button>
        </div>
      </div>
      <!-- ONE action bar, not one per clause.
           It lives OUTSIDE #ceDoc deliberately: render() rebuilds #ceDoc with
           innerHTML, and the document is contenteditable, so anything inside
           it is destroyed — and the caret with it — on every structural
           change. Out here it survives, which is what lets the toolbar follow
           the selection without a re-render.
           A strip in the layout rather than a popover pinned to the clause:
           no scroll maths and nothing overlapping the text being read.
           It sits directly under the Read/Edit bar, second in a stack of two:
           the top bar acts on the DOCUMENT, this one on the CLAUSE. It began
           at the foot for thumb reach, which is right on a phone and wrong on
           a desktop, where it put the controls — and the label naming the
           clause they act on — most of a screen away from the caret. Richard:
           "it's a very unnatural place." Below 700px it goes back to the
           bottom; see the .hb-bar order rule. -->
      <div class="hb-bar" id="ceActs" hidden>
        <div class="hb-bar__where">
          <span class="hb-bar__lbl">Editing</span>
          <!-- The clause the bar names can be scrolled off screen — which
               reads as the tool having lost track of itself. Press the name
               to go back to it. -->
          <button class="hb-bar__num" id="ceActsWhere" type="button"
                  title="Scroll back to this clause"></button>
          <span class="hb-bar__lvl" id="ceActsLevel"></span>
        </div>
        <div class="hb-bar__ops">
          <!-- Text formatting used to live in its own strip at the TOP of the
               pane while the structural controls sat at the bottom — two
               editing surfaces at opposite ends of the screen, split along a
               line that means something to the code and nothing to the person
               using it. One bar: this is what acts on the clause you are in.
               The top bar keeps what acts on the DOCUMENT — mode, undo,
               publish. -->
          <span class="hb-grp">
          <button type="button" data-cmd="bold" title="Bold (Ctrl+B)"><b>B</b></button>
          <button type="button" data-cmd="italic" title="Italic (Ctrl+I)"><i>I</i></button>
          <button type="button" data-cmd="underline" title="Underline (Ctrl+U)"><u>U</u></button>
          <button type="button" data-cmd="insertUnorderedList" title="Bullet list">&bull; List</button>
          <button type="button" data-cmd="insertOrderedList" title="Numbered list">1. List</button>
          <button type="button" data-cmd="removeFormat" title="Clear formatting">Clear</button>
          </span>
          <span class="hb-grp">
          <button type="button" data-op="addAfter" title="Add a clause after this one">+ clause</button>
          <button type="button" data-op="addSub" title="Add a sub-clause inside this one">+ sub</button>
          <button type="button" data-op="addTable" title="Add a table after this one">+ table</button>
          <button type="button" data-op="heading" id="ceActsHeading" title="Give this clause a heading">+ heading</button>
          </span>
          <span class="hb-grp">
          <!-- THE FOUR DIRECTIONAL OPS ARE ICONS FROM THE SPRITE, not the
               &larr; &rarr; &uarr; &darr; entities they were. A text arrow is
               a glyph pretending to be an icon: it takes its size and weight
               from whatever font is loaded, sits on a text baseline rather
               than centred, and renders differently on every platform.

               indent/outdent are their own icons (added to the sprite for
               this) rather than icon-back/icon-forward. Those are chevrons,
               and a chevron beside a clause reads as "previous" and "next" —
               a different promise from "make this a sub-clause of the one
               above". up/down ARE navigation, so they take the canon
               chevrons. -->
          <button class="hb-op" type="button" data-op="outdent" aria-label="Promote one level" title="Promote one level (Shift+Tab)"><svg class="icon icon--sm" aria-hidden="true"><use href="/assets/icons/sprites.svg#icon-outdent"></use></svg></button>
          <button class="hb-op" type="button" data-op="indent" aria-label="Demote one level" title="Demote one level (Tab)"><svg class="icon icon--sm" aria-hidden="true"><use href="/assets/icons/sprites.svg#icon-indent"></use></svg></button>
          <button class="hb-op" type="button" data-op="up" aria-label="Move up" title="Move up (Alt+Up)"><svg class="icon icon--sm" aria-hidden="true"><use href="/assets/icons/sprites.svg#icon-up"></use></svg></button>
          <button class="hb-op" type="button" data-op="down" aria-label="Move down" title="Move down (Alt+Down)"><svg class="icon icon--sm" aria-hidden="true"><use href="/assets/icons/sprites.svg#icon-down"></use></svg></button>
          </span>
          <span class="hb-grp">
          <select data-op="style" id="ceActsStyle" title="Numbering style"></select>
          <button type="button" data-op="override" title="Pin an exact number, e.g. 13.B">Number&hellip;</button>
          <button type="button" data-op="delete" class="is-bad" title="Delete this clause and its sub-clauses">Delete</button>
          </span>
        </div>
      </div>
      <div class="nl-crumb" id="ceCrumb" title="Where you are"></div>
      <div id="ceDoc"></div>
    </main>
    <!-- The insert line. ONE element, positioned under the pointer, rather
         than a drop zone rendered between every pair of clauses — 1,203 of
         those is the per-clause toolbar mistake again. Fixed positioning off
         getBoundingClientRect, so there is no offset-parent maths and no
         dependence on anything render() rebuilds. -->
    <div class="hb-ins" id="ceIns" hidden role="button" tabindex="-1"
         aria-label="Add a clause here">
      <span class="hb-ins__go" aria-hidden="true">+</span>
      <span class="hb-ins__hint">Add a clause here</span>
      <span class="hb-ins__line"></span>
    </div>
    <div class="ce-scrim" id="ceScrim"></div>
  </div>
</div>

<!-- Main app -->
<script>
(function () {
  'use strict';

  var BASE = 'app-data/ops-handbook';

  // The five governing-document areas, fixed order. Each is its own tree at
  // draft/docs/<id>/nodes. SEEDS maps an area to a best-effort import file where
  // one exists; areas without a seed are built by hand until a source arrives.
  var DOCS = [
    { id: 'memorandum',       title: 'Memorandum of Association' },
    { id: 'articles',         title: 'Articles of Association' },
    { id: 'league-rules',     title: 'League Rules' },
    { id: 'appendices',       title: 'Appendices' },
    { id: 'board-directives', title: 'Board Directives' }
  ];
  var SEEDS = { articles: 'seed-articles.json', memorandum: 'seed-memorandum.json', 'league-rules': 'seed-league-rules.json', appendices: 'seed-appendices.json', 'board-directives': 'seed-board-directives.json' };
  var SEASON = '2026-27';   // the season this handbook edition covers — stamps the title page
  function docTitle(id) { for (var i = 0; i < DOCS.length; i++) if (DOCS[i].id === id) return DOCS[i].title; return id; }

  var S = {
    session: null,
    role: 'viewer',
    docId: 'articles',   // current area
    doc: { id: 'articles', title: 'Articles of Association', subtitle: '', season: '' },
    nodes: {},           // id -> node  (flat; tree via parentId + order)
    mode: 'read',        // 'read' | 'edit'
    selectedId: null,
    /* The in-flight save from the last blur, so the action bar can wait for it
       rather than committing a clone that has not seen the last thing typed. */
    pendingSave: null,
    /* Undo. Every structural change and every text save goes through commit(),
       which is the only write path — so one stack there covers the lot.
       Snapshots of the whole area rather than inverse diffs: a diff has to be
       right about what it undoes, a snapshot only has to be a copy, and
       commit() already diffs a clone against S.nodes to work out the writes.
       Capped, because a snapshot of League Rules is 560 nodes. Per-area:
       cleared when the area changes, since the ids would not resolve. */
    undo: [], redo: [], timeTravel: false,
    /* Who holds this area's edit lock, or null. Watched live, so the Edit
       button can name them before it is pressed. */
    lock: null,
    /* Transient, never persisted: "draw an empty heading field on this clause
       because the user just asked for one". Cleared when the selection moves,
       so an abandoned empty heading does not follow you down the document. */
    showTitleFor: null,
    focusNew: null,      // node id to focus after the next commit (just-added clause)
    /* The clause added a moment ago that has not been typed in. It goes the
       instant focus leaves it — see sweepVirgin. Cleared by the first
       keystroke, NOT by the save: text is written on blur, so at the moment
       focus leaves, S.nodes still holds the empty body and a check against it
       would delete what had just been written. */
    virgin: null,
    /* Which clauses are folded, per area. A way of LOOKING, never stored and
       never published — cleared when the area changes, since the ids would
       not resolve. */
    collapsed: {},
    /* The level Fold-to last folded to, or null if the folds are hand-made.
       Only so the control can light the answer to "how much of this am I
       looking at" instead of only offering to change it. */
    foldLevel: null,
    index: null,         // cross-area search cache: { docId: {title,nodes,numMap} }
    editConfirmed: false // acknowledged the "you are editing the live draft" warning this session
  };

  function canEdit()  { return S.role === 'admin' || S.role === 'superadmin'; }
  function canSeed()  { return S.role === 'superadmin'; }
  var esc = (window.NL && NL.escHtml) ? NL.escHtml : function (s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  };
  function $(id) { return document.getElementById(id); }

  /* ================= Numbering engine (verified against source) ================= */
  function childrenOf(nodes, pid) {
    var a = [];
    // Firebase strips null values, so a root node reads back with parentId
    // missing — treat undefined as null so root detection survives a reload.
    for (var id in nodes) {
      var p = nodes[id].parentId; if (p === undefined) p = null;
      if (p === pid) a.push(nodes[id]);
    }
    a.sort(function (x, y) { return (x.order || 0) - (y.order || 0); });
    return a;
  }
  function alpha(i, up) { var s = ''; while (i > 0) { i--; s = String.fromCharCode(65 + (i % 26)) + s; i = Math.floor(i / 26); } return up ? s : s.toLowerCase(); }
  function roman(i, up) {
    var m = [[1000, 'm'], [900, 'cm'], [500, 'd'], [400, 'cd'], [100, 'c'], [90, 'xc'], [50, 'l'], [40, 'xl'], [10, 'x'], [9, 'ix'], [5, 'v'], [4, 'iv'], [1, 'i']], s = '';
    for (var k = 0; k < m.length; k++) { while (i >= m[k][0]) { s += m[k][1]; i -= m[k][0]; } }
    return up ? s.toUpperCase() : s;
  }
  // Pure: nodes map -> { id: displayNumber }
  function computeNumbers(nodes) {
    var map = {};
    (function walk(pid, base) {
      var kids = childrenOf(nodes, pid), c = {};
      kids.forEach(function (k) {
        if (k.kind === 'bullet') { map[k.id] = '•'; walk(k.id, base); return; }
        if (k.numStyle === 'none') { map[k.id] = ''; walk(k.id, base); return; }
        c[k.numStyle] = (c[k.numStyle] || 0) + 1;
        var idx = c[k.numStyle], disp;
        if (k.numberOverride) disp = k.numberOverride;
        else if (k.numStyle === 'decimal') disp = (base ? base + '.' : '') + idx;
        else if (k.numStyle === 'lower-alpha') disp = '(' + alpha(idx) + ')';
        else if (k.numStyle === 'upper-alpha') disp = '(' + alpha(idx, true) + ')';
        else if (k.numStyle === 'lower-roman') disp = '(' + roman(idx) + ')';
        else if (k.numStyle === 'upper-roman') disp = '(' + roman(idx, true) + ')';
        else disp = '' + idx;
        map[k.id] = disp;
        // decimal / upper-alpha carry their number down; lower-alpha & lower-roman reset
        // the decimal base so a number list nested under (a)/(i) restarts (1, 2), not 23.5.1
        var childBase = (k.numStyle === 'decimal' || k.numStyle === 'upper-alpha') ? (k.numberOverride || disp)
          : ((k.numStyle === 'lower-alpha' || k.numStyle === 'lower-roman') ? '' : base);
        walk(k.id, childBase);
      });
    })(null, '');
    return map;
  }
  function depthOf(node) { var d = 0, n = node; while (n && n.parentId != null) { n = S.nodes[n.parentId]; d++; } return d; }
  /* Ids from the root down to (but not including) this clause. Drives the lit
     guide line and the breadcrumb — one walk, two uses. */
  function ancestryOf(id) {
    var out = [], n = S.nodes[id];
    while (n && n.parentId != null) { out.unshift(n.parentId); n = S.nodes[n.parentId]; }
    return out;
  }
  function subtreeCount(id) {
    var n = 0;
    (function walk(p) { childrenOf(S.nodes, p).forEach(function (k) { n++; walk(k.id); }); })(id);
    return n;
  }

  /* ================= Rich-text sanitiser (edit -> stored body) ================= */
  var OK_TAGS = ['p', 'br', 'b', 'strong', 'i', 'em', 'u', 'ul', 'ol', 'li', 'a', 'span'];
  function sanitize(html) {
    var d = document.createElement('div'); d.innerHTML = html;
    (function clean(node) {
      [].slice.call(node.childNodes).forEach(function (c) {
        if (c.nodeType === 1) {
          var tag = c.tagName.toLowerCase();
          /* A DIV IS A LINE BREAK, NOT RUBBISH. Chrome wraps each new line in
             a <div> when Enter is pressed in a contenteditable that holds bare
             text. div is not an allowed tag, so this used to UNWRAP it — and
             the two lines silently became one.

             The old code did have a <div> -> <p> replacement, at the end, on
             the serialised string. It could never fire: by then clean() had
             already removed every div. Dead code sitting on top of the bug it
             was written to prevent, which is why it survived so long.

             Converted here instead, before anything can throw it away. */
          if (tag === 'div') {
            var p = document.createElement('p');
            while (c.firstChild) p.appendChild(c.firstChild);
            node.replaceChild(p, c);
            clean(p);
            return;
          }
          if (OK_TAGS.indexOf(tag) === -1) {
            while (c.firstChild) node.insertBefore(c.firstChild, c);
            node.removeChild(c);
          } else {
            [].slice.call(c.attributes).forEach(function (a) {
              if (!(tag === 'a' && a.name === 'href')) c.removeAttribute(a.name);
            });
            if (tag === 'a') { c.setAttribute('rel', 'noopener'); c.setAttribute('target', '_blank'); }
            clean(c);
          }
        } else if (c.nodeType === 8) { node.removeChild(c); }
      });
    })(d);
    /* The string replace that used to live here is gone: divs are converted in
       clean() now, so by this point there are none left — which was true
       before too, and is exactly why it never did anything. */
    return d.innerHTML;
  }

  /* ================= Render ================= */
  var STYLE_LABELS = {
    'decimal': '1, 2, 3', 'lower-alpha': '(a) (b)', 'upper-alpha': '(A) (B)',
    'lower-roman': '(i) (ii)', 'upper-roman': '(I) (II)', 'bullet': '• bullet', 'none': 'no number'
  };

  /* The per-clause toolbar is gone. There is ONE action bar, at the foot of
     the editing pane, and this points it at whatever is selected.

     Why not simply render the toolbar on the selected clause: render() does
     host.innerHTML = html, and the document is contenteditable, so a
     re-render throws away the caret. Selecting a clause by clicking into it
     would therefore destroy the cursor the click just placed. The bar lives
     outside #ceDoc and is updated in place — no re-render, no lost caret.

     See system/handbook-editor-plan.md for the measurements. */
  function syncActionBar() {
    var bar = $('ceActs'); if (!bar) return;
    var n = S.selectedId ? S.nodes[S.selectedId] : null;
    var on = (S.mode === 'edit' && canEdit() && !!n);
    bar.hidden = !on;
    if (!on) return;

    /* Name the clause. The bar is no longer beside what it acts on, so it has
       to say which one — otherwise Delete is a question rather than a button. */
    var num = (S.numMap && S.numMap[S.selectedId]) || '';
    var where = num || (n.title ? n.title : 'this clause');
    $('ceActsWhere').textContent = where.length > 48 ? where.slice(0, 47) + '\u2026' : where;

    var sel = $('ceActsStyle');
    if (sel) {
      if (!sel.options.length) {
        sel.innerHTML = Object.keys(STYLE_LABELS).map(function (v) {
          return '<option value="' + v + '">' + esc(STYLE_LABELS[v]) + '</option>';
        }).join('');
      }
      sel.value = n.numStyle || 'decimal';
    }
    /* Only offer a heading to a clause that has not got one. */
    var addH = $('ceActsHeading');
    if (addH) addH.hidden = !!(n.title || S.showTitleFor === S.selectedId);

    /* HOW DEEP. The number says it for a decimal clause — 6.1.2 has its depth
       written on it — and says nothing at all for (a), (i), a bullet or an
       unnumbered heading, which is most of what is hard to place. */
    var lvl = $('ceActsLevel');
    if (lvl) lvl.textContent = 'Level ' + (depthOf(n) + 1);

    /* ARROWS THAT GO GREY. Every one of these four could already refuse —
       "Nothing above to nest under", "Already at the top level" — but only
       after you had pressed it. A control that looks available and then
       explains why it was not is a control that made you do the work of
       finding out. */
    var sibs = childrenOf(S.nodes, n.parentId);
    var i = sibs.map(function (x) { return x.id; }).indexOf(S.selectedId);
    var can = {
      indent:  i > 0,
      outdent: n.parentId != null,
      up:      i > 0,
      down:    i > -1 && i < sibs.length - 1
    };
    [].forEach.call(bar.querySelectorAll('button.hb-op'), function (b) {
      var op = b.dataset.op;
      if (!(op in can)) return;
      b.disabled = !can[op];
    });
  }

  /* Selection moved. Clear the transient "show me an empty heading field"
     flag, or an abandoned empty heading follows you down the document. */
  function selectNode(id) {
    if (S.selectedId === id) { syncActionBar(); return; }
    var prev = S.selectedId;
    S.selectedId = id;
    if (S.showTitleFor && S.showTitleFor !== id) {
      S.showTitleFor = null;
      /* Only worth a repaint if the abandoned field is actually on screen. */
      if (prev && S.nodes[prev] && !S.nodes[prev].title) { render(); return; }
    }
    syncActionBar();
    paintSelection();
  }

  /* The selection highlight, moved in place rather than re-rendered.

     The LIT BRANCH moves with it. is-branch is written during render, and
     render is exactly what this function exists to avoid on every click — so
     without this the guide line would stay lit on whichever clause happened
     to be selected when the document was last rebuilt, which is worse than
     not lighting it at all. */
  function paintSelection() {
    var host = $('ceDoc'); if (!host) return;
    var was = host.querySelector('.is-sel');
    if (was) was.classList.remove('is-sel');
    [].forEach.call(host.querySelectorAll('.is-branch'), function (el) {
      el.classList.remove('is-branch');
    });
    BRANCH = {};
    updateCrumb();
    if (!S.selectedId) return;
    var now = host.querySelector('[data-id="' + S.selectedId + '"]');
    if (now) now.classList.add('is-sel');
    ancestryOf(S.selectedId).forEach(function (id) {
      BRANCH[id] = true;
      var el = host.querySelector('[data-id="' + id + '"]');
      if (el) el.classList.add('is-branch');
    });
    updateCrumb();
  }

  /* Ancestors of the selected clause, rebuilt on every render. */
  var BRANCH = {};
  var FOLD_ICON = '<svg class="icon" aria-hidden="true"><use href="/assets/icons/sprites.svg#icon-down"></use></svg>';

  /* The twisty, or nothing. contenteditable="false" is load-bearing: the
     document is editable, so without it the button becomes text you can type
     into and backspace away. tabindex -1 keeps it out of the tab order, which
     otherwise puts a stop between every clause and the next. */
  function foldBtn(node, kids) {
    if (!kids.length) return '';
    var folded = !!S.collapsed[node.id];
    return '<button class="nl-fold" type="button" contenteditable="false" tabindex="-1"' +
      ' data-fold-id="' + node.id + '"' +
      ' aria-expanded="' + (folded ? 'false' : 'true') + '"' +
      ' aria-label="' + (folded ? 'Show' : 'Hide') + ' the clauses under this one"' +
      ' title="' + (folded ? 'Show' : 'Hide') + ' the clauses under this one">' + FOLD_ICON + '</button>';
  }
  function foldNote(node) {
    var n = subtreeCount(node.id);
    return '<p class="nl-fold-note" contenteditable="false">' + n +
      (n === 1 ? ' clause folded' : ' clauses folded') + '</p>';
  }

  function renderNode(node, numMap) {
    var kids = childrenOf(S.nodes, node.id);
    var sel = (node.id === S.selectedId) ? ' is-sel' : '';
    var editing = (S.mode === 'edit' && canEdit());
    /* Folding is an editing affordance. In read mode the document is the
       document — a reader who cannot see a clause cannot be bound by it. */
    var folded = editing && !!S.collapsed[node.id] && kids.length > 0;
    var branch = (editing && BRANCH[node.id]) ? ' is-branch' : '';
    var num = numMap[node.id] || '';
    if (node.parentId == null) {
      // Article (top level)
      /* A title row ONLY where there is a title — or where one has just been
         asked for, exactly as clause headings work. 23 of 107 articles carry
         a number and no title (all of Board Directives), and drawing the row
         anyway left a blank line where a heading would go and pushed the
         directive's first line underneath it. */
      var hasTitle = !!(node.title || '').trim();
      var showTitle = hasTitle || (editing && S.showTitleFor === node.id);
      var wantBody = !!node.body || editing;
      function artBody(inHead) {
        return '<div class="nl-clause__text" data-ph="Write the text…"' +
          (inHead ? '' : ' style="margin-top:6px"') + editable('body') + '>' +
          (node.body || '') + '</div>';
      }
      var h = '<section class="nl-art' + (num ? '' : ' nl-art--nonum') + sel + branch +
        (folded ? ' is-folded' : '') + '" id="c-' + node.id + '" data-id="' + node.id + '">' +
        '<div class="nl-art__head">' +
        (editing ? foldBtn(node, kids) : '') +
        '<span class="nl-art__num">' + esc(num) + '</span>' +
        (showTitle
          ? '<span class="nl-art__title" data-ph="Section title — optional"' + editable('title') + '>' + esc(node.title || '') + '</span>'
          : '') +
        /* No title: the body goes INSIDE the head, so the gutter the head
           already has puts the prose beside the number rather than below a
           blank row. See .nl-art__head > .nl-clause__text in nl-brand.css. */
        (!showTitle && wantBody ? artBody(true) : '') +
        '</div>';
      if (showTitle && wantBody) h += artBody(false);
      if (folded) return h + foldNote(node) + '</section>';
      kids.forEach(function (c) { h += renderNode(c, numMap); });
      return h + '</section>';
    }
    var depth = depthOf(node);
    var noNum = !num && node.kind !== 'bullet';
    var cls = node.kind === 'bullet' ? ' nl-clause--bullet' : (noNum ? ' nl-clause--nonum' : '');
    /* data-num carries the numbering style so the stylesheet can tell a
       SELF-DESCRIBING number from a relative one. "6.4.7" says where it lives;
       "(a)" only means something next to its parent. See the hanging rule in
       nl-brand.css. */
    var out = '<div class="nl-clause' + cls + sel + branch + (folded ? ' is-folded' : '') +
      '" id="c-' + node.id + '" data-id="' + node.id +
      '" data-depth="' + depth + '" data-num="' + esc(node.numStyle || 'decimal') + '">' +
      (editing ? foldBtn(node, kids) : '') +
      '<div class="nl-clause__num">' + esc(num) + '</div>' +
      '<div class="nl-clause__body">';
    /* A heading field ONLY where there is a heading — or where one has just
       been asked for. 129 of 1,203 clauses have a title; drawing an empty
       "Heading (optional)" row on the other 1,074 is most of what made this
       page unreadable. The bar offers "+ heading" for the selected clause. */
    if (node.title || (editing && S.showTitleFor === node.id)) {
      out += '<div class="nl-clause__title" data-ph="Heading (optional)"' + editable('title') + '>' + esc(node.title || '') + '</div>';
    }
    if (node.kind === 'table') {
      out += renderTable(node, editing);
    } else {
      out += '<div class="nl-clause__text" data-ph="Write the clause text…"' + editable('body') + '>' + (node.body || '') + '</div>';
    }
    if (folded) return out + foldNote(node) + '</div></div>';
    kids.forEach(function (c) { out += renderNode(c, numMap); });
    return out + '</div></div>';
  }

  /* A cell is PLAIN TEXT that may contain newlines, and a newline is drawn as
     a line break. Cells are stored as strings, not markup — allowing HTML in
     them would need a sanitiser they have never had, and esc() below means
     anything stored would be shown to a club as literal angle brackets. Text
     with newlines gives the fee tariffs the lines they need and nothing else. */
  function cellHtml(c) {
    return esc(String(c == null ? '' : c)).replace(/\n/g, '<br>');
  }

  /* The inverse, read off the live cell. textContent — which this used —
     drops a <br> entirely, not even leaving a space, so every line the editor
     typed was concatenated into one on save and the breaks appeared to be
     "taken away" on leaving edit mode. */
  function cellText(el) {
    var out = '';
    (function walk(n) {
      for (var c = n.firstChild; c; c = c.nextSibling) {
        if (c.nodeType === 3) { out += c.nodeValue; continue; }
        if (c.nodeType !== 1) continue;
        var tag = c.tagName.toLowerCase();
        if (tag === 'br') { out += '\n'; continue; }
        /* Chrome wraps each new line in a div; Firefox splits paragraphs. */
        var block = (tag === 'div' || tag === 'p' || tag === 'li');
        if (block && out && out.slice(-1) !== '\n') out += '\n';
        walk(c);
      }
    })(el);
    /* contenteditable litters non-breaking spaces; they look identical to a
       normal space and wrap, search and sort differently. */
    return out.replace(/\u00a0/g, ' ').replace(/\n+$/, '');
  }

  function renderTable(node, editing) {
    var t = node.table || { header: [], rows: [] };
    var head = Array.isArray(t.header) ? t.header : [];
    var rows = Array.isArray(t.rows) ? t.rows : [];
    var h = '<div class="nl-tbl-wrap"><table class="nl-tbl">';
    if (head.length) {
      h += '<thead><tr>' + head.map(function (c, ci) {
        return '<th' + (editing ? ' contenteditable="true" data-th="' + ci + '"' : '') + '>' + cellHtml(c) + '</th>';
      }).join('') + '</tr></thead>';
    }
    h += '<tbody>' + rows.map(function (row, ri) {
      row = Array.isArray(row) ? row : [];
      return '<tr>' + row.map(function (c, ci) {
        return '<td' + (editing ? ' contenteditable="true" data-tr="' + ri + '" data-tc="' + ci + '"' : '') + '>' + cellHtml(c) + '</td>';
      }).join('') + '</tr>';
    }).join('') + '</tbody></table></div>';
    if (editing) {
      h += '<div class="nl-tbl-ctrl" contenteditable="false">' +
        '<button type="button" data-tblop="addRow">+ row</button>' +
        '<button type="button" data-tblop="addCol">+ col</button>' +
        '<button type="button" data-tblop="delRow">− row</button>' +
        '<button type="button" data-tblop="delCol">− col</button>' +
        '</div>';
    }
    return h;
  }
  function editable(field) {
    return (S.mode === 'edit' && canEdit()) ? ' contenteditable="true" data-field="' + field + '"' : '';
  }

  function render() {
    /* The gap is a class on a clause element that is about to be replaced, and
       INS.el would be left pointing at a detached node. Clear it first. */
    hideInsert();
    var host = $('ceDoc');
    if (!S.docId) { S.numMap = {}; renderCover(); $('ceToc').innerHTML = ''; syncBar(); updateCrumb(); return; }
    var ids = Object.keys(S.nodes);
    if (!ids.length) { S.numMap = {}; renderEmpty(); syncBar(); updateCrumb(); return; }
    var numMap = computeNumbers(S.nodes);
    S.numMap = numMap;
    /* Computed once here, not per clause: renderNode runs 1,203 times on
       League Rules, and walking to the root from each of them is the sort of
       quadratic that only shows up on the biggest area. */
    BRANCH = {};
    if (S.selectedId && S.nodes[S.selectedId]) {
      ancestryOf(S.selectedId).forEach(function (id) { BRANCH[id] = true; });
    }
    var roots = childrenOf(S.nodes, null);
    var html = '<div class="nl-doc' + (S.mode === 'edit' ? ' is-editing' : '') + '" id="ceDocInner">';
    var metaEditing = (S.mode === 'edit' && canEdit());
    html += '<div class="nl-doc__head">' +
      '<div class="nl-doc__title">' + esc(S.doc.title) + '</div>' +
      // Subtitle is area metadata (seeded from the source doc); editable in edit
      // mode so wording/casing can be managed — it feeds the reader and the PDF
      // section title pages on the next publish.
      ((S.doc.subtitle || metaEditing)
        ? '<div class="nl-doc__sub"' + (metaEditing ? ' contenteditable="true" data-meta="subtitle" data-ph="Area subtitle (optional)"' : '') + '>' + esc(S.doc.subtitle || '') + '</div>'
        : '') +
      '</div>';
    roots.forEach(function (r) { html += renderNode(r, numMap); });
    html += '</div>';
    host.innerHTML = html;
    refreshToc();
    syncBar();
    syncActionBar();
    updateCrumb();
  }

  // "You are here": breadcrumb of the current area + the top-level section
  // (article/appendix/directive) at the top of the viewport, kept in sync on scroll.
  var spyLock = null;   // {secId, until} — pins the highlight on a jump target mid-scroll
  function currentSectionEl() {
    var host = $('ceDoc'); if (!host) return null;
    // The active line must sit BELOW .nl-art's scroll-margin-top (14px), otherwise a
    // section you just jumped to lands above the line and the previous one wins.
    var line = host.getBoundingClientRect().top + 28;
    var arts = host.querySelectorAll('.nl-art'), cur = arts[0] || null;
    for (var i = 0; i < arts.length; i++) {
      if (arts[i].getBoundingClientRect().top <= line) cur = arts[i]; else break;
    }
    return cur;
  }
  function updateCrumb() {
    var crumb = $('ceCrumb'); if (!crumb) return;
    if (!S.docId) { crumb.innerHTML = '<span class="nl-crumb__area">Handbook ' + esc(SEASON) + '</span>'; return; }
    if (!Object.keys(S.nodes).length) {
      crumb.innerHTML = '<span class="nl-crumb__area">' + esc(S.doc.title || docTitle(S.docId)) + '</span>';
      return;
    }
    /* EDITING: the crumb says what you are INSIDE, not what you have scrolled
       past. Those are different questions, and while restructuring only the
       first one matters — the scroll-spy answer was the tool telling you
       where your eyes were when you had asked where your caret was.

       Reading keeps the spy: there is no selection to report, and "which
       section am I looking at" is exactly right for a document you are
       moving through. */
    if (S.mode === 'edit' && canEdit() && S.selectedId && S.nodes[S.selectedId]) {
      var trail = ancestryOf(S.selectedId).concat([S.selectedId]);
      var parts = ['<span class="nl-crumb__area">' + esc(S.doc.title || docTitle(S.docId)) + '</span>'];
      trail.forEach(function (id, i) {
        var nd = S.nodes[id];
        if (!nd) return;
        var nnum = (S.numMap && S.numMap[id]) || '';
        var label = nd.title || nodeText(nd).slice(0, 44);
        /* The last one is where you are; the rest are the way in. */
        var cls = (i === trail.length - 1) ? 'nl-crumb__sec' : 'nl-crumb__sec nl-crumb__sec--up';
        parts.push('<span class="nl-crumb__sep">\u203a</span>' +
          '<button class="' + cls + '" type="button" data-crumb="' + esc(id) + '">' +
          (nnum ? '<b>' + esc(nnum) + '</b> ' : '') + esc(label) + '</button>');
      });
      crumb.innerHTML = parts.join('');
      return;
    }

    // While a jump's smooth scroll is in flight, keep the highlight pinned on the
    // target; release once it arrives (or on timeout for safety).
    if (spyLock) {
      var curEl = currentSectionEl();
      if ((curEl && curEl.dataset.id) === spyLock.secId || Date.now() > spyLock.until) spyLock = null;
    }
    var secId;
    if (spyLock) { secId = spyLock.secId; }
    else { var el = currentSectionEl(); secId = el && el.dataset.id; }
    var node = secId && S.nodes[secId];
    var num = (S.numMap && secId && S.numMap[secId]) || '';
    // Untitled clauses fall back to their body text — without this the
    // crumb read "1 ·" and stopped, while the reader showed the clause.
    var sec = node ? ((num ? esc(num) + ' · ' : '') + esc(node.title || nodeText(node).slice(0, 60))) : '';
    crumb.innerHTML = '<span class="nl-crumb__area">' + esc(S.doc.title || docTitle(S.docId)) + '</span>' +
      (sec ? '<span class="nl-crumb__sep">›</span><span class="nl-crumb__sec">' + sec + '</span>' : '');
    // reflect the current section in the contents rail (only when showing the outline)
    if (secId && !($('ceSearch').value || '').trim()) {
      [].forEach.call($('ceToc').querySelectorAll('.ce-toc__item'), function (a) {
        a.classList.toggle('is-current', a.dataset.goto === secId);
      });
    }
  }

  // Title page — the handbook's front cover. Landing view; also via "Title page" in the nav.
  function renderCover() {
    $('ceDoc').innerHTML =
      '<div class="nl-cover">' +
        '<img class="nl-cover__lockup" src="/assets/divisions/The National League.png" alt="The National League">' +
        '<h1 class="nl-cover__title">Handbook</h1>' +
        '<div class="nl-cover__season">' + esc(SEASON) + '</div>' +
        '<div class="nl-cover__rule"></div>' +
        '<div class="nl-cover__divs">' + ['National', 'North', 'South'].map(function (n) {
          return '<img src="/assets/divisions/' + n + '.png" alt="National League ' + n + '">';
        }).join('') + '</div>' +
        // The single, quiet status line — bottom of the title page.
        '<div class="nl-cover__meta">Working draft' + (canEdit() ? ' · your edits are recorded' : ' · read-only') + '</div>' +
      '</div>';
  }
  function showCover() {
    /* Going back to the cover leaves the area too — hand the lock back. */
    if (S.mode === 'edit' && S.docId) releaseLock(S.docId);
    if (lockOff) { lockOff(); lockOff = null; }
    stopLockBeat();
    S.docId = null; S.selectedId = null; S.mode = 'read'; S.lock = null;
    S.doc = { id: null, title: 'Handbook', subtitle: '', season: '' };
    S.nodes = {};
    if ($('ceSearch')) $('ceSearch').value = '';
    closeDrawer();
    render();
  }

  function renderEmpty() {
    var title = docTitle(S.docId), hasSeed = !!SEEDS[S.docId], btn = '', msg;
    var upload = canSeed()
      ? '<button class="btn btn--ghost" id="ceImportDoc2" type="button">Import from documents…</button>' : '';
    if (canSeed() && hasSeed) {
      msg = 'This area is empty. Import ' + esc(title) + ' to seed the clause tree, then refine it here.';
      btn = '<button class="btn btn--primary" id="ceImport" type="button">Import ' + esc(title) + '</button>' + upload;
    } else if (canSeed()) {
      msg = esc(title) + ' is empty. Import the source document to build the clause tree, then refine it here.';
      btn = upload;
    } else if (canEdit()) {
      msg = esc(title) + ' is empty. Add the first clause in Edit mode.';
    } else {
      msg = 'This area has no content yet.';
    }
    $('ceDoc').innerHTML =
      '<div class="ce-empty"><div class="ce-empty__card"><h2>' + esc(title) + '</h2><p>' + msg + '</p>' + btn + '</div></div>';
    if ($('ceImport')) $('ceImport').addEventListener('click', importSeed);
    if ($('ceImportDoc2')) $('ceImportDoc2').addEventListener('click', function () { $('ceDocFile').click(); });
  }

  // Contents rail: shows the current area's outline, or — when searching —
  // matches from across ALL areas. The search index is built once from
  // draft/docs and invalidated on any write (see commit/importSeed).
  function refreshToc() {
    if (($('ceSearch').value || '').trim()) doSearch();
    else renderTocRoots();
  }

  function renderDocNav() {
    $('ceDocNav').innerHTML =
      '<button type="button" class="ce-nav__item' + (S.docId ? '' : ' is-active') + '" data-doc="__cover">Title page</button>' +
      DOCS.map(function (d) {
        return '<button type="button" class="ce-nav__item' + (d.id === S.docId ? ' is-active' : '') +
          '" data-doc="' + d.id + '">' + esc(d.title) + '</button>';
      }).join('');
  }

  function renderTocRoots() {
    var numMap = computeNumbers(S.nodes);
    var host = $('ceToc');
    var roots = childrenOf(S.nodes, null);
    host.innerHTML = '<div class="ce-toc">' + roots.map(function (r) {
      var cur = (r.id === S.selectedId) ? ' is-current' : '';
      var hasTitle = !!r.title;
      var label = hasTitle ? r.title : nodeText(r).slice(0, 70);
      var tcls = 'ce-toc__t' + (hasTitle ? '' : ' ce-toc__t--preview');
      return '<a class="ce-toc__item' + cur + '" data-goto="' + r.id + '"><span class="ce-toc__num">' + esc(numMap[r.id] || '') + '</span><span class="' + tcls + '">' + esc(label) + '</span></a>';
    }).join('') + '</div>';
  }

  // Read every area once so search can span the whole handbook.
  function buildIndex() {
    return NL.ensureAuth().then(function () {
      return db.ref(BASE + '/draft/docs').once('value');
    }).then(function (snap) {
      var all = snap.val() || {}, idx = {};
      DOCS.forEach(function (d) {
        var doc = all[d.id]; if (!doc || !doc.nodes) return;
        var nodes = doc.nodes;
        Object.keys(nodes).forEach(function (id) { normNode(nodes[id], id); });
        idx[d.id] = { title: (doc.meta && doc.meta.title) || docTitle(d.id), nodes: nodes, numMap: computeNumbers(nodes) };
      });
      S.index = idx;
      return idx;
    });
  }

  function doSearch() {
    var q = ($('ceSearch').value || '').trim();
    if (!q) { renderTocRoots(); return; }
    if (!S.index) {
      $('ceToc').innerHTML = '<div class="ce-toc__result">Searching…</div>';
      buildIndex().then(function () { renderSearch(q); }).catch(function () { renderSearch(q); });
    } else {
      renderSearch(q);
    }
  }

  function renderSearch(q) {
    var ql = q.toLowerCase(), host = $('ceToc'), out = [], total = 0;
    DOCS.forEach(function (d) {
      var nodes, numMap, title;
      if (d.id === S.docId) { nodes = S.nodes; numMap = computeNumbers(S.nodes); title = S.doc.title; }      // freshest
      else if (S.index && S.index[d.id]) { nodes = S.index[d.id].nodes; numMap = S.index[d.id].numMap; title = S.index[d.id].title; }
      else return;
      var hits = [];
      Object.keys(nodes).forEach(function (id) {
        var n = nodes[id];
        var text = ((n.title || '') + ' ' + (n.body || '').replace(/<[^>]+>/g, ' ') + ' ' + tableText(n)).toLowerCase();
        if (text.indexOf(ql) !== -1 || (numMap[id] || '').toLowerCase().indexOf(ql) !== -1) hits.push(n);
      });
      if (!hits.length) return;
      total += hits.length;
      out.push('<div class="ce-toc__group">' + esc(title) + ' · ' + hits.length + '</div>');
      hits.slice(0, 40).forEach(function (n) {
        var hasTitle = !!n.title;
        var snip = hasTitle ? n.title : ((n.kind === 'table' ? '▦ ' : '') + nodeText(n).slice(0, 70));
        var tcls = 'ce-toc__t' + (hasTitle ? '' : ' ce-toc__t--preview');
        out.push('<a class="ce-toc__item" data-goto="' + n.id + '" data-doc="' + d.id + '"><span class="ce-toc__num">' + esc(numMap[n.id] || '') + '</span><span class="' + tcls + '">' + esc(snip) + '</span></a>');
      });
    });
    host.innerHTML = '<div class="ce-toc__result">' + total + ' match' + (total === 1 ? '' : 'es') + ' across the handbook</div>' +
      (out.join('') || '<div class="ce-toc__result">No matches</div>');
  }

  /* Briefly mark a clause. Used for one that has just arrived — a new clause
     is empty, so its only marks are a number and a grey placeholder in a wall
     of text — and for one just scrolled to, where the question is the same
     one: which of these did I land on. */
  function flash(id) {
    var el = $('c-' + id); if (!el) return;
    el.classList.remove('hb-flash');
    void el.offsetWidth;              // restart the animation on a repeat jump
    el.classList.add('hb-flash');
    setTimeout(function () { el.classList.remove('hb-flash'); }, 1400);
  }

  function scrollToNode(id) {
    var el = $('c-' + id); if (!el) return;
    flash(id);
    // Lock the scroll-spy on the tapped section while the smooth scroll is in
    // flight — otherwise the nav highlight snaps back to the current section and
    // rattles through every one in between until the scroll arrives.
    var art = el.closest('.nl-art') || el;
    spyLock = { secId: art.dataset.id, until: Date.now() + 2500 };
    el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    updateCrumb();
  }

  // Jump to a clause, switching area first if the match is in another document.
  function goto(docId, nodeId) {
    closeDrawer();
    S.selectedId = nodeId;
    setHash(docId, nodeId);
    if (docId === S.docId) { scrollToNode(nodeId); refreshToc(); return; }
    S.docId = docId; S.mode = 'read';
    load().then(function () { scrollToNode(nodeId); });
  }

  /* ---- Deep links: #<area>/<nodeId> opens the handbook at a specific clause ---- */
  var _suppressHash = false;
  function setHash(docId, nodeId) {
    _suppressHash = true;
    try { location.hash = '#' + docId + '/' + nodeId; } catch (_) {}
