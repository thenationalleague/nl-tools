        if (!all) return null;
        var writes = [];
        DOCS.forEach(function (d, i) {
          var snap = all[i][0].val();
          var list = snap ? (Array.isArray(snap) ? snap : Object.keys(snap).map(function (k) { return snap[k]; })) : [];
          /* An area with no clauses in the edition is left ALONE rather than
             emptied. The publish loop skips an area with no nodes, so an
             empty snapshot means "this was never published", not "this was
             published empty" — and wiping a draft on that reading would
             delete an area nobody had got round to publishing yet. */
          if (!list.length) return;
          var updates = {}, keep = {};
          list.forEach(function (nd) {
            if (!nd || !nd.id) return;
            keep[nd.id] = true;
            /* strip() is what the edition was built with, so this puts back
               exactly the stored fields and no others. No updatedAt: the
               edition carries none, and stamping every clause as edited
               today by whoever pressed the button would be a lie told 560
               times. */
            var v = strip(normNode(Object.assign({}, nd), nd.id));
            /* strip() drops the id, and this is the one writer that does not
               pass a whole node through. Put it back: a stored clause with no
               id property is what collapsed every area onto one number. */
            v.id = nd.id;
            Object.keys(v).forEach(function (k) { if (v[k] == null) delete v[k]; });
            updates[nd.id] = v;
          });
          writes.push(
            db.ref(BASE + '/draft/docs/' + d.id + '/nodes').once('value').then(function (cur) {
              Object.keys(cur.val() || {}).forEach(function (id) { if (!keep[id]) updates[id] = null; });
              return db.ref(BASE + '/draft/docs/' + d.id + '/nodes').update(updates);
            }).then(function () {
              return db.ref(BASE + '/draft/docs/' + d.id + '/meta').update({
                title: all[i][1].val() || docTitle(d.id),
                subtitle: all[i][2].val() || '',
                season: all[i][3].val() || ''
              });
            })
          );
        });
        return Promise.all(writes).then(function () { return true; });
      })
      .then(function (ok) {
        if (!ok) return;
        /* The stack refers to states that no longer exist anywhere. Keeping
           it would offer to "undo" the discard and silently reinstate half
           of one area. */
        S.undo.length = 0; S.redo.length = 0;
        S.index = null;
        touchDraft();
        NL.writeAudit && NL.writeAudit('discard', 'Discarded all unpublished changes');
        return load().then(function () {
          return checkPublished();
        }).then(function () {
          PUB.count = 0; syncChanges(); syncUndoBtns();
          NL.toast && NL.toast('The draft is back to the published edition', 'success');
        });
      })['catch'](function (e) {
        NL.toast && NL.toast('Could not discard: ' + ((e && e.message) || e), 'error');
      });
  }

  function reviewChanges() {
    var body = document.createElement('div');
    body.className = 'hb-rev';
    body.innerHTML = '<p class="hb-rev__sum">Reading the draft and the published edition…</p>';
    var ctrl = NL.modal({
      title: 'Changes not yet published',
      width: 'wide',
      body: body,
      buttons: [
        { label: 'Close', className: 'btn--ghost', onClick: function (c) { c.close(); } },
        { label: 'Publish edition', className: 'btn--primary',
          onClick: function (c) { c.close(); publish(); } }
      ]
    });
    /* Re-check first. The boot check may have run before the rules were
       deployed, or before a colleague published; a review that reports the
       state of the page load rather than of now is worth nothing. */
    Promise.resolve(checkPublished())
      .then(function () { return Promise.all([loadForReview(), latestSnapshot()]); })
      .then(function (r) {
      var areas = r[0], snap = r[1];
      PUB.count = HB_DIFF.total(areas);
      syncChanges();
      body.innerHTML = reviewHtml(areas, snap);
      var kill = body.querySelector('#hbDiscard');
      if (kill) kill.addEventListener('click', function () {
        /* Close first. The discard reloads the area underneath and its own
           confirmation is the guard — leaving a list of changes on screen
           that no longer exist is the worse end state. */
        ctrl.close();
        discardAll();
      });
      var back = body.querySelector('#hbRestore');
      if (back) back.addEventListener('click', function () {
        ctrl.close();
        restoreSnapshot(back.getAttribute('data-snap'));
      });
      var no = body.querySelector('#hbSnapNo');
      if (no) no.addEventListener('click', function () {
        dismissSnap(no.getAttribute('data-snap'));
        var box = no.closest('.hb-rev__restore');
        if (box) box.remove();
      });
      /* One row at a time. The modal stays open — reverting three clauses
         should not be three trips through the same screen — and each row
         reports its own outcome in place rather than the list silently
         re-flowing under the cursor. */
      [].forEach.call(body.querySelectorAll('.hb-rev__back'), function (b) {
        b.addEventListener('click', function () {
          var row = b.closest('.hb-rev__item');
          b.disabled = true;
          revertOne(b.getAttribute('data-back-doc'), b.getAttribute('data-back-kind'),
                    { id: b.getAttribute('data-back-id'),
                      number: (row.querySelector('.hb-rev__num') || {}).textContent || '' })
            .then(function () {
              row.classList.add('hb-rev__item--done');
              var note = document.createElement('p');
              note.className = 'hb-rev__note';
              note.textContent = 'Put back to the published version.';
              row.appendChild(note);
              b.remove();
              if (PUB.count) { PUB.count--; syncChanges(); }
            })['catch'](function (e) {
              b.disabled = false;
              NL.toast && NL.toast('Could not put that back: ' + ((e && e.message) || e), 'error');
            });
        });
      });
    })['catch'](function (e) {
      body.innerHTML = '<p class="hb-rev__sum">Could not read the published edition: ' +
        esc((e && e.message) || e) + '</p>';
    });
    return ctrl;
  }

  function publish() {
    /* NO VERSION NUMBER. The label is the season and nothing else; the DATE is
       the version, and it is already recorded as publishedAt on every edition.

       Ruling 19/08/2026. A hand-typed revision note used to land after the
       season — "2026-27 v2" — and it earned its retirement twice over. It was
       free text before the season was locked, which is how an edition came to
       be named "v2" and put that on the cover where the season belongs. And
       even done right it was a second, weaker answer to a question publishedAt
       already answers exactly: v3 tells a club nothing, "Last updated 19 August
       2026" tells them whether to re-read it.

       Publishing twice in one day therefore produces two editions with the same
       label, which is correct — they are the same handbook, and the timestamp
       separates them. Nothing overwrites: every publish push()es a new edition
       and only moves the publishedEditionId pointer. */
    var lbl = SEASON;
    // Type-to-confirm: publishing freezes the WHOLE handbook and changes what the public sees.
    NL.prompt(
      'Publishing freezes the whole handbook draft — all five areas — as “' + lbl + '”, stamped with today’s date, and updates what public surfaces show. This cannot be edited afterwards; you publish again instead.\n\nType PUBLISH to confirm.',
      { title: 'Confirm publish', confirmText: 'Publish edition' }
    ).then(function (word) {
          if ((word || '').trim().toUpperCase() !== 'PUBLISH') { NL.toast && NL.toast('Publish cancelled', 'info'); return; }
          NL.ensureAuth().then(function () {
            return db.ref(BASE + '/draft/docs').once('value');   // snapshot every area, not just the open one
          }).then(function (snap) {
            var all = snap.val() || {};
            var edition = {
              /* SEASON AS A FIELD, not a substring of a display label. The
                 editor's cover reads the SEASON constant and the reader used to
                 parse it out of the front of `label`, which is two sources for
                 one fact — so the two pages disagreed the moment a label did not
                 start with a season, and one showed 2026-27 while the other
                 showed nothing. One source now: this. `label` stays, equal to
                 the season, for older readers and the PDF filename. */
              season: SEASON,
              label: lbl, status: 'published',
              publishedAt: Date.now(), publishedBy: (S.session && (S.session.name || S.session.email)) || null,
              docs: {}
            };
            var count = 0;
            DOCS.forEach(function (d) {
              var doc = all[d.id]; if (!doc || !doc.nodes) return;
              var nodes = doc.nodes;
              Object.keys(nodes).forEach(function (id) { normNode(nodes[id], id); });
              var numMap = computeNumbers(nodes);
              var meta = doc.meta || { title: docTitle(d.id) };
              var snapshot = Object.keys(nodes).map(function (id) {
                var s = Object.assign({}, strip(nodes[id]), { id: id, number: numMap[id] || '' });
                // Firebase rejects undefined and silently drops null — strip both so
                // set() succeeds (loaded nodes are missing their null fields already).
                Object.keys(s).forEach(function (k) { if (s[k] == null) delete s[k]; });
                return s;
              });
              edition.docs[d.id] = {
                title: meta.title || docTitle(d.id), subtitle: meta.subtitle || '', season: meta.season || '',
                html: bakeDoc(nodes, meta), nodes: snapshot
              };
              count++;
            });
            if (!count) { NL.toast && NL.toast('Nothing to publish yet — import or add content first', 'info'); return; }
            var ref = db.ref(BASE + '/editions').push();
            return ref.set(edition)
              .then(function () { return db.ref(BASE + '/publishedEditionId').set(ref.key); })
              .then(function () {
                /* The count stays in the AUDIT line, where it is evidence, and
                   leaves the toast, where it was noise: "5 areas" is the normal
                   case and a toast that reports the normal case teaches you to
                   stop reading toasts.

                   It still speaks up when the number is wrong. An area with no
                   nodes is skipped silently by the loop above, so a short count
                   means part of the handbook is not in the edition and the
                   reader will show "no published content" for it — worth
                   catching before a link goes to 72 clubs, and worth naming
                   WHICH, since "4 of 5" leaves you hunting. */
                var missing = DOCS.filter(function (d) { return !edition.docs[d.id]; });
                /* The draft and the edition now agree, and the bar has to
                   say so — a badge still reading "not published" after a
                   successful publish is how somebody publishes twice. */
                PUB.id = ref.key; PUB.publishedAt = edition.publishedAt;
                PUB.count = 0; syncChanges();
                NL.writeAudit && NL.writeAudit('publish', 'Published "' + lbl + '" (' + count + ' of ' + DOCS.length + ' areas)');
                if (missing.length) {
                  NL.toast && NL.toast('Published the handbook — but ' +
                    missing.map(function (d) { return d.title; }).join(', ') +
                    ' had no content and is not in this edition', 'error');
                } else {
                  NL.toast && NL.toast('Published the handbook', 'success');
                }
              });
          }).catch(function (e) { NL.toast && NL.toast('Publish failed: ' + (e && e.message || e), 'error'); });
    });
  }
  /* ================= Events ================= */
  function closeDrawer() {
    var side = $('ceSide'), scrim = $('ceScrim');
    if (side) side.classList.remove('is-open');
    if (scrim) scrim.classList.remove('is-open');
  }
  function wire() {
    // Measure the (sticky) topbar so the shell fills the viewport exactly.

      var t = document.getElementById('nlTopbar');
      document.documentElement.style.setProperty('--ce-top', ((t && t.offsetHeight) || 72) + 'px');
    }
    setTopVar();

    // Mobile contents drawer

    });

    // Scroll-spy breadcrumb: update "you are here" as the document scrolls.

    $('ceDoc').addEventListener('scroll', function () {
      if (crumbRaf) return;

    });
    // On mobile the breadcrumb is the quickest way back to the contents.
    $('ceCrumb').addEventListener('click', function () {

      }
    });

    document.querySelector('#ceMode').addEventListener('click', function (e) {
      var b = e.target.closest('button[data-mode]'); if (!b) return;
      if (b.dataset.mode === 'edit') {
        if (!canEdit()) return;

        enterEdit();
        return;
      }
      leaveEdit();
    });
    $('ceReimport').addEventListener('click', importSeed);
    $('ceImportDoc').addEventListener('click', function () { $('ceDocFile').click(); });
    $('ceDocFile').addEventListener('change', function (e) {
      var list = Array.prototype.slice.call(e.target.files || []);
      e.target.value = ''; // so picking the same files twice still fires
      importUpload(list);
    });
    $('ceFold').addEventListener('click', function (e) {
      var b = e.target.closest('[data-fold-level]');
      if (b) foldToLevel(+b.getAttribute('data-fold-level'));
    });
    /* The crumb is a route back up, not a label. Restructuring means moving
       between a clause and the one it sits inside, and without this that is a
       scroll and a hunt. */
    $('ceCrumb').addEventListener('click', function (e) {
      var b = e.target.closest('[data-crumb]');
      if (!b) return;
      var id = b.getAttribute('data-crumb');
      /* A clause folded away cannot be scrolled to. */
      ancestryOf(id).forEach(function (a) { delete S.collapsed[a]; });
      S.foldLevel = null; syncFoldSeg();
      selectNode(id);
      scrollToNode(id);
    });
    $('cePublish').addEventListener('click', publish);
    $('ceChanges').addEventListener('click', reviewChanges);
    $('ceDocNav').addEventListener('click', function (e) {
      var b = e.target.closest('[data-doc]'); if (b) switchDoc(b.dataset.doc);
    });
    $('ceSearch').addEventListener('input', doSearch);


    $('ceToc').addEventListener('click', function (e) {
      var a = e.target.closest('[data-goto]'); if (!a) return;
      goto(a.dataset.doc || S.docId, a.dataset.goto);
    });

    var doc = $('ceDoc');
    // structural op buttons + table row/col controls + select
    doc.addEventListener('click', function (e) {
      // Read mode: clicking a clause number copies a shareable deep link to it.
      if (S.mode !== 'edit') {
        var numEl = e.target.closest('.nl-clause__num, .nl-art__num');
        if (numEl) { var nh = numEl.closest('[data-id]'); if (nh) { copyClauseLink(nh.dataset.id); return; } }
      }
      var tb = e.target.closest('[data-tblop]');
      if (tb) { var th = tb.closest('[data-id]'); if (th) tableOp(th.dataset.id, tb.dataset.tblop); return; }
      var el = e.target.closest('[data-op]'); if (!el || el.tagName === 'SELECT') return;
      var host = el.closest('[data-id]'); if (!host) return;
      var op = el.dataset.op; if (OPS[op]) OPS[op](host.dataset.id);
    });
    doc.addEventListener('change', function (e) {
      var sel = e.target.closest('select[data-op="style"]'); if (!sel) return;
      var host = sel.closest('[data-id]'); OPS.style(host.dataset.id, sel.value);
    });

    /* The action bar. It sits outside #ceDoc, so it needs its own listeners —
       and it reads S.selectedId rather than walking up to a [data-id], because
       there is no clause above it in the DOM to walk to. */
    var bar = $('ceActs');
    /* FORMATTING and STRUCTURE want opposite things from the same press.
       Formatting needs the caret and the selection left alone, so its
       mousedown is prevented. Structure needs the blur to fire, because the
       blur is what saves what was just typed. Same bar, two rules, and the
       rule is chosen by which kind of button was hit. */
    bar.addEventListener('mousedown', function (e) {
      if (e.target.closest('button[data-cmd]')) e.preventDefault();
    });
    bar.addEventListener('click', function (e) {
      var cmd = e.target.closest('button[data-cmd]');
      if (cmd) {
        var ed = document.activeElement;
        if (!ed || !ed.getAttribute || ed.getAttribute('contenteditable') !== 'true') {
          NL.toast && NL.toast('Click into a clause first, then format', 'info');
          return;
        }
        try { document.execCommand('styleWithCSS', false, false); } catch (_) {}
        document.execCommand(cmd.dataset.cmd, false, null);
        return;
      }
      var b = e.target.closest('[data-op]');
      if (!b || b.tagName === 'SELECT') return;
      var id = S.selectedId;
      if (!id) return;
      afterPendingSave(function () {
        if (!S.nodes[id]) return;   // deleted while the save was in flight
        var op = b.dataset.op;
        if (op === 'heading') {
          S.showTitleFor = id;
          render();
          focusTitle(id);
          return;
        }
        if (OPS[op]) OPS[op](id);
      });
    });
    bar.addEventListener('change', function (e) {
      var sel = e.target.closest('select[data-op="style"]');
      var id = S.selectedId, val = sel && sel.value;
      if (!sel || !id) return;
      afterPendingSave(function () { if (S.nodes[id]) OPS.style(id, val); });
    });

    /* The insert line follows the pointer down the document. */
    doc.addEventListener('mousemove', function (e) {
      if (S.mode !== 'edit' || !canEdit()) { hideInsert(); return; }
      var cl = e.target.closest('.nl-clause, .nl-art');
      if (!cl || !cl.dataset.id) { hideInsert(); return; }
      showInsertFor(cl, e.clientY);
    });
    /* Moving onto the strip counts as staying, not leaving. The strip is a
       fixed overlay and therefore NOT a descendant of #ceDoc, so without this
       reaching for it fires mouseleave and takes it away — which is exactly
       what "I can't even reach the + without floating off" was. */
    doc.addEventListener('mouseleave', function (e) {
      var to = e.relatedTarget;
      if (to && to.closest && to.closest('#ceIns')) return;
      hideInsert();
    });
    /* Scrolling moves the document under a strip pinned to the viewport. */
    doc.addEventListener('scroll', hideInsert);

    var ins = $('ceIns');
    /* The whole strip is the target, not the 22px circle on the end. */
    ins.addEventListener('click', takeInsert);
    ins.addEventListener('mouseleave', function (e) {
      var to = e.relatedTarget;
      if (to && to.closest && to.closest('#ceDoc')) return;  // back to the document
      hideInsert();
    });

    $('ceActsWhere').addEventListener('click', function () {
      if (S.selectedId && S.nodes[S.selectedId]) scrollToNode(S.selectedId);
    });

    $('ceUndo').addEventListener('click', function () { afterPendingSave(doUndo); });
    $('ceRedo').addEventListener('click', function () { afterPendingSave(doRedo); });

    /* Undo has to reach the whole page, not only the document: the moment it
       is wanted most is right after a structural change, when focus may be
       anywhere or nowhere. */
    document.addEventListener('keydown', function (e) {
      if (S.mode !== 'edit' || !canEdit()) return;
      if (!(e.ctrlKey || e.metaKey) || e.altKey) return;
      var k = (e.key || '').toLowerCase();
      if (k !== 'z' && k !== 'y') return;
      e.preventDefault();

         the browser's own buffer, which knows nothing about the clause tree
         and would leave the two disagreeing. One undo, one meaning. */
      afterPendingSave(k === 'y' || e.shiftKey ? doRedo : doUndo);
    });

    /* Keyboard for the four arrows. These are the bindings every outliner
       uses, and they take four controls off the surface without taking away
       the ability — the bar keeps them for anyone who does not know them.

       Tab is deliberately NOT touched inside a table: cells use it to move
       between themselves, and that path saves without re-rendering, which is
       the only reason table editing keeps its place. */
    doc.addEventListener('keydown', function (e) {
      if (S.mode !== 'edit' || !canEdit() || !S.selectedId) return;
      if (e.target.closest('[data-th],[data-tr]')) return;
      if (e.key === 'Tab') {
        e.preventDefault();
        OPS[e.shiftKey ? 'outdent' : 'indent'](S.selectedId);
        return;
      }
      if (e.altKey && (e.key === 'ArrowUp' || e.key === 'ArrowDown')) {
        e.preventDefault();
        OPS[e.key === 'ArrowUp' ? 'up' : 'down'](S.selectedId);
      }
    });
    // table cell editing — quiet save on blur (no re-render, so Tab keeps working)
    doc.addEventListener('blur', function (e) {
      var cell = e.target.closest && e.target.closest('[contenteditable][data-th], [contenteditable][data-tr]');
      if (cell) saveTableCell(cell);
    }, true);
    // area metadata (subtitle) — save on blur to draft/docs/<id>/meta
    doc.addEventListener('blur', function (e) {
      var m = e.target.closest && e.target.closest('[contenteditable][data-meta]'); if (!m) return;
      var field = m.dataset.meta, val = (m.textContent || '').trim();
      if ((S.doc[field] || '') === val) return;
      S.doc[field] = val;
      var patch = {}; patch[field] = val;
      NL.ensureAuth().then(function () { return metaRef().update(patch); }).then(function () {
        S.index = null;
        NL.writeAudit && NL.writeAudit('edit', 'Edited area ' + field + ' (' + S.docId + ')');
        NL.toast && NL.toast('Saved', 'success');
      }).catch(function (err) {
        NL.toast && NL.toast('Save failed: ' + (err && err.message || err), 'error');
      });
    }, true);
    // inline text editing — save on blur
    doc.addEventListener('blur', function (e) {
      var ed = e.target.closest('[contenteditable][data-field]'); if (!ed) return;
      var host = ed.closest('[data-id]'); if (!host) return;
      var id = host.dataset.id, field = ed.dataset.field, node = S.nodes[id];
      if (!node) return;
      var val = field === 'title' ? ed.textContent.trim() : sanitize(ed.innerHTML);
      var current = field === 'title' ? (node.title || '') : (node.body || '');
      if (val === current) return;
      var c = clone(); c[id][field] = (field === 'title' ? (val || null) : (val || null));
      /* Held so the action bar can wait for it — a bar press blurs this field
         and would otherwise race the save it just caused. */
      S.pendingSave = commit(c, 'Edit ' + field + ' of ' + id);
    }, true);
    /* A keystroke is what makes a new clause real. Deliberately `input` and
       not the save: text is written on blur, so at the moment focus leaves,
       S.nodes still holds the empty body — sweeping against that would delete
       exactly what had just been typed. */
    doc.addEventListener('input', function (e) {
      if (!S.virgin) return;
      var host = e.target.closest && e.target.closest('[data-id]');
      if (host && host.dataset.id === S.virgin) S.virgin = null;
    });
    /* Deferred a tick so document.activeElement is the element that TOOK
       focus rather than the one losing it — relatedTarget is null for a click
       on anything unfocusable, which is most of the page. */
    doc.addEventListener('focusout', function () {
      var id = S.virgin;
      if (!id) return;
      setTimeout(function () { sweepVirgin(id, document.activeElement); }, 0);
    });
    // select clause on focus
    doc.addEventListener('focusin', function (e) {
      var host = e.target.closest('[data-id]'); if (host) selectNode(host.dataset.id);
    });
    /* Clicking a clause selects it even where there is nothing focusable under
       the pointer — the number, the padding, a table. Without this the bar
       would only follow the caret, and a table has no caret of its own. */
    doc.addEventListener('click', function (e) {
      if (S.mode !== 'edit' || !canEdit()) return;
      if (e.target.closest('[data-op],[data-tblop]')) return;
      /* The twisty first, and it does NOT select. Folding is a way of looking;
         moving the selection as a side effect of it would take the action bar
         off the clause you were working on. */
      var tw = e.target.closest('[data-fold-id]');
      if (tw) {
        e.preventDefault();
        var fid = tw.getAttribute('data-fold-id');
        if (S.collapsed[fid]) delete S.collapsed[fid]; else S.collapsed[fid] = true;
        S.foldLevel = null; syncFoldSeg();
        render();
        return;
      }
      var host = e.target.closest('[data-id]'); if (host) selectNode(host.dataset.id);
    });
  }

  /* Fold every clause at or below a level, or open everything. */
  function foldToLevel(lvl) {
    S.collapsed = {};
    if (lvl > 0) {
      Object.keys(S.nodes).forEach(function (id) {
        if (!childrenOf(S.nodes, id).length) return;
        if (depthOf(S.nodes[id]) + 1 >= lvl) S.collapsed[id] = true;
      });
    }
    S.foldLevel = lvl;
    syncFoldSeg();
    render();
  }

  /* Which level the document is folded to, on the control that folded it.
     S.foldLevel is cleared by any individual twisty, because after that the
     document is not at a level any more and a lit 2 would be the bar stating
     something untrue. */
  function syncFoldSeg() {
    var seg = $('ceFoldSeg'); if (!seg) return;
    [].forEach.call(seg.querySelectorAll('button'), function (b) {
      var on = S.foldLevel != null && +b.getAttribute('data-fold-level') === S.foldLevel;
      b.classList.toggle('is-on', on);
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
  }

  /* ================= Boot ================= */
  window.TOOL = window.TOOL || {};
  window.TOOL.boot = function (session) {
    S.session = session;
    S.role = (session && session.role) || 'viewer';
    if (!window.NL || !NL.ensureAuth) { console.warn('[handbook] NL.ensureAuth missing'); return; }
    renderDocNav();
    wire();
    syncBar();
    /* Two small reads, not the documents — see checkPublished. Deliberately
       not awaited: the bar fills in a moment later and nothing else waits
       on it. */
    checkPublished();
    // Deep link in the URL? Open there; otherwise land on the title page.
    var t = parseHash();
    if (t) { S.docId = t.docId; S.selectedId = t.nodeId; load().then(function () { scrollToNode(t.nodeId); refreshToc(); }); }
    else { showCover(); }
    window.addEventListener('hashchange', function () { if (!_suppressHash) routeHash(); });
  };
  if (window._toolDeferredSession) { window.TOOL.boot(window._toolDeferredSession); delete window._toolDeferredSession; }
})();
</script>

</body>
