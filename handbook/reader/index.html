<!DOCTYPE html>
<!--
  NL Tools — Handbook reader, trailing-slash redirect
  Version: v1.0 (22/08/2026)
  File: /handbook/reader/index.html

  THE READER IS A FILE, NOT A DIRECTORY. /handbook/reader.html is the page;
  GitHub Pages also serves it at /handbook/reader, because it resolves an
  extensionless path to the .html beside it. What it does NOT do is resolve a
  trailing slash: /handbook/reader/ asks for a directory index, and there was
  none, so the one URL form a person is most likely to type or a mail client
  most likely to linkify returned a 404 on a page that is handed out to 72
  clubs. Reported 22/08/2026, live.

  This file is that directory index, and all it does is send you next door.
  The alternative — moving reader.html to reader/index.html — is tidier and
  matches club-directory/reader/, but it would change the canonical URL that
  clubs already hold, and with both a reader.html and a reader/ present the
  extensionless /handbook/reader becomes ambiguous. Not a thing to gamble on
  while fixing a live 404.

  IT MUST CARRY THE HASH. The reader deep-links clauses as
  #<area>/<nodeId> — that is how a colleague sends someone a rule — so a
  redirect that dropped the fragment would land every shared clause link on
  the cover and look like a second, subtler bug. location.replace keeps the
  fragment and the query, and leaves no entry in the back history, so Back
  goes where the reader came from rather than bouncing through here.

  The <meta refresh> is the no-JS fallback and cannot carry either; the link
  in the body is the fallback to the fallback. Nothing else belongs on this
  page — it is a signpost, and no one should ever see it.
-->
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>National League Handbook</title>
<link rel="canonical" href="https://nl.tools/handbook/reader.html">
<meta name="robots" content="noindex, follow">
<script>
  /* Before the meta refresh, and before anything paints. */
  location.replace('/handbook/reader.html' + location.search + location.hash);
</script>
<meta http-equiv="refresh" content="0; url=/handbook/reader.html">
<style>
  body {
    margin: 0; padding: 48px 24px;
    font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    text-align: center; color: #1b2a4a; background: #fff;
  }
  a { color: #9e0000; }
</style>
</head>
<body>
  <p><a href="/handbook/reader.html">National League Handbook</a></p>
</body>
</html>
