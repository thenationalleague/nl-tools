<!DOCTYPE html>
<!--
  NL Tools — Handbook 2026-27 (public reader)
  Version: v0.13 (22/08/2026)
  File: /handbook/reader/index.html

  v0.13 — MOVED HERE from /handbook/reader.html, which is now a redirect. As
    a loose .html it had no directory index, so /handbook/reader/ — a
    trailing slash, the form a person types and a mail client linkifies —
    returned a 404 on the page handed to 72 clubs. Every other page in the
    estate is a directory with an index; this was the exception. The old URL
    keeps working, fragment and all, because clubs hold it in emails and
    bookmarks. Nothing on this page changed.

  v0.12 — The club-code gate. See the block below the changelog for the
    mechanism and, more importantly, for what it does and does not promise.

  v0.11 — Canon chrome, and a cover that stops lying about which handbook it is.

    The header was .rd-top, a hand-rolled navy bar. nl-brand.css's own
    .nl-idbar note lists ".rd-top (twice, on two unrelated pages)" among the
    eight bars it entered canon to replace; this was one of the two nobody
    converted. Now .nl-idbar — WHITE, because the bar states whether an NL
    account is behind the page (nl-brand v2.51) and none is. The local header
    CSS is gone; only the phone contents-toggle stays, being this page's own
    affordance.

    Changing area now plays .nl-enter, canon's view-entrance and the same
    movement Programme Packs uses when you open a club. Canon already had it —
    nothing promoted, nothing cache-busted; this is its third consumer. Per
    canon's rule it fires on a view CHANGE only, so picking a clause out of the
    contents does not replay it.

    The cover said "v2", and the editor's cover said 2026-27, because the season
    had TWO sources: a constant in the editor, and a parse off the front of the
    edition label here. Two sources for one fact disagree the moment anything is
    irregular, and an edition named "v2" is exactly that. The season is a FIELD
    on the edition now, written at publish and read by everything; the label
    parse survives only for editions published before the field existed, and
    neither resolving yields nothing rather than a wrong thing.

    V-NUMBERS ARE RETIRED (ruling 19/08/2026). The date is the version: the
    season says which handbook, publishedAt says how current, and there is
    nothing left for "v3" to add that "Last updated 19 August 2026" does not say
    better. So the imprint drops "Edition <label>" and reads "Last updated
    <date>", and publishing no longer asks for a revision note.

    The version does still travel on the downloaded FILE — season plus publish
    date — because two copies a month apart have to be tellable apart in a
    downloads folder, and the same filename twice is not.

  v0.10 (22/07/2026) — Download PDF serves the pre-rendered static
  handbook.pdf when current (instant file download); print view is the fallback

  CLUB-CODE GATED reader of the PUBLISHED handbook edition. Reads
  app-data/ops-handbook/publishedEditionId -> editions/<id> and renders the
  frozen, baked document. Standalone page — NOT iframe-embeddable any more:
  the gate needs its own top-level context to sign in.

  THE GATE. One club code covers every club-facing gated tool
  (system/club-code-plan.md). NL.codeGate.viaFunction posts the typed code to
  a trigger under app-data/club-codes, which validates it SERVER-SIDE and
  mints a token carrying `club: '<key>'`; the rules on editions/ read that
  claim. The gate is the screen, the rules are the boundary — and a verify
  that compared the code in this file would be neither.

  WHAT THE GATE DOES NOT DO is make the handbook confidential. The seed JSON
  in this repo carries the same text and the repo is public (plan §1.0, route
  three, a recorded choice). A front door on a building with an open side
  gate. Never tell a club otherwise.

  It deliberately does NOT use auth-guard — that is for NL accounts, and this
  page is entered by code — and never reads the draft.
  Presentation comes from the .nl-doc / .nl-cover / .nl-crumb canon in
  nl-brand.css (promoted v2.25); helpers come from nl-utils.js.
-->
