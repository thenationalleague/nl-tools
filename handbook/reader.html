<!DOCTYPE html>
<!--
  NL Tools — old handbook reader URL
  Version: v1.0 (22/08/2026)
  File: /handbook/reader.html

  THE READER MOVED TO /handbook/reader/ AND THIS IS THE OLD DOOR.

  It was a loose .html beside the editor, which meant /handbook/reader/ — a
  trailing slash, the form a person types and a mail client linkifies — asked
  for a directory index that did not exist and returned a 404 on a page
  handed to 72 clubs. Reported live, 22/08/2026. Every other page in this
  estate is a directory with an index; this one was the exception.

  So the page is reader/index.html now and this file is a signpost. It stays
  because clubs already hold /handbook/reader.html: in emails, in bookmarks,
  in whatever they have pasted into their own systems. A tidy-up that breaks
  the URL people have is not a tidy-up.

  Three doors, one room:
    /handbook/reader.html   this file, redirects
    /handbook/reader        Pages resolves it to one of the two, both arrive
    /handbook/reader/       the page

  IT CARRIES THE FRAGMENT. The reader deep-links clauses as #<area>/<nodeId>,
  which is how one person sends another a rule — so dropping the fragment
  would land every shared clause link on the cover. That is not a smaller
  bug than the 404, only a quieter one. location.replace, so Back goes where
  the reader came from rather than bouncing through here.

  The <meta refresh> is the no-JS fallback and cannot carry a fragment; the
  link in the body is the fallback to that. No one should ever see either.
-->
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>National League Handbook</title>
<link rel="canonical" href="https://nl.tools/handbook/reader/">
<meta name="robots" content="noindex, follow">
<script>
  location.replace('/handbook/reader/' + location.search + location.hash);
</script>
<meta http-equiv="refresh" content="0; url=/handbook/reader/">
<link rel="stylesheet" href="/system/nl-brand.css?v=61">
<style>
  body { padding: 48px 24px; text-align: center; background: var(--white); }
</style>
</head>
<body>
  <p><a href="/handbook/reader/">National League Handbook</a></p>
</body>
</html>
