<!DOCTYPE html>
<!--
  NL Tools — Handbook 2026-27 (public reader)
  Version: v0.9 (22/07/2026) — Download PDF serves the pre-rendered static
  handbook.pdf when current (instant file download); print view is the fallback
  File: /handbook/reader.html

  Public, no-login reader of the PUBLISHED handbook edition. Reads
  app-data/ops-handbook/publishedEditionId -> editions/<id> (both world-readable
  per the rules snapshot) and renders the frozen, baked document. Standalone page;
  also fine to iframe-embed on the public site.

  It deliberately does NOT use auth-guard (public) and never reads the draft.
  Presentation comes from the .nl-doc / .nl-cover / .nl-crumb canon in
  nl-brand.css (promoted v2.25); helpers come from nl-utils.js.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The National League Handbook 2026-27</title>
  <!-- Favicons. Static, not injected: nl-topbar.js adds these too, but a
       standalone page never loads it, and an icon that arrives with the JS
       leaves the tab blank until it does. /favicon.ico at the root is the
       backstop every browser asks for without being told. -->
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/favicon-16x16.png">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/system/nl-brand.css?v=45">
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <script>
    firebase.initializeApp({
      apiKey:            "AIzaSyC3az3OMnU7TdqlaWp8yrO_EjgZ36l-mXU",
      authDomain:        "nl-tools.firebaseapp.com",
      databaseURL:       "https://nl-tools-default-rtdb.europe-west1.firebasedatabase.app",
      projectId:         "nl-tools",
      storageBucket:     "nl-tools.firebasestorage.app",
      messagingSenderId: "801354670005",
      appId:             "1:801354670005:web:05d8ebad3e7e63610d03fc"
    });
  </script>
  <!-- Canon helpers (escHtml, formatDate, copy, toast). No auth-guard — this page is public. -->
  <script src="/system/nl-utils.js?v=39"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { font-family: var(--font); background: var(--off-white); color: var(--text); }

    /* ---- Header ---- */
    .rd-top {
      position: sticky; top: 0; z-index: 40; display: flex; align-items: center; gap: 14px;
      padding: 12px 20px; background: var(--navy); color: var(--white);
    }
    .rd-top__brand { font-size: 16px; font-variation-settings: 'wght' 900; letter-spacing: .01em; }
    .rd-top__brand span { color: var(--primary-100); }
    .rd-pdf {
      margin-left: auto; font-size: 12.5px; font-variation-settings: 'wght' 700; color: var(--white);
      text-decoration: none; border: 1px solid var(--navy-600); background: var(--navy-600);
      padding: 7px 12px; border-radius: 7px;
    }
    .rd-pdf:hover { background: var(--navy-700); border-color: var(--navy-700); }
    .rd-menu {
      display: none; flex: 0 0 auto; width: 36px; height: 36px; border: 1px solid var(--navy-600);
      border-radius: 8px; background: var(--navy-600); color: var(--white); font-size: 16px; cursor: pointer;
    }

    /* ---- Shell: mirrors the editor — the window itself never scrolls; the side
       rail and the document each scroll independently (--rd-top = header height,
       measured from JS). ---- */
    .rd-shell { display: grid; grid-template-columns: 320px 1fr; height: calc(100dvh - var(--rd-top, 61px)); overflow: hidden; }
    .rd-side {
      border-right: 1px solid var(--border); background: var(--white);
      overflow-y: auto; min-height: 0; padding: 0 12px 40px;
    }
    /* Sticky head: search + the five areas stay pinned while the outline scrolls. */
    .rd-side__head {
      position: sticky; top: 0; z-index: 2; background: var(--white);
      margin: 0 -12px 8px; padding: 14px 12px 10px; border-bottom: 1px solid var(--border);
    }
    .rd-main { min-width: 0; display: flex; flex-direction: column; overflow: hidden; }
    #rdDoc { flex: 1 1 auto; overflow-y: auto; min-height: 0; }
    /* Breadcrumb (.nl-crumb) comes from nl-brand.css v2.25. */
    .rd-search {
      width: 100%; box-sizing: border-box; padding: 9px 12px; border: 1px solid var(--border); border-radius: 8px;
      font-family: var(--font); font-size: 14px; margin-bottom: 12px; background: var(--off-white);
    }
    .rd-search:focus { outline: none; border-color: var(--navy); background: var(--white); }
    .rd-nav { display: flex; flex-direction: column; gap: 2px; }
    .rd-nav__item {
      text-align: left; padding: 8px 10px; border: 0; border-radius: 7px; background: transparent;
      font-family: var(--font); font-size: 13.5px; font-variation-settings: 'wght' 700; color: var(--navy);
      cursor: pointer;
    }
    .rd-nav__item:hover { background: var(--navy-50); }
    .rd-nav__item.is-active { background: var(--navy); color: var(--white); }
    .rd-toc { padding-top: 2px; }
    .rd-toc__item {
      display: flex; gap: 8px; padding: 5px 8px; border-radius: 6px; cursor: pointer; text-decoration: none;
      color: var(--text); font-size: 13px; line-height: 1.4;
    }
    .rd-toc__item:hover { background: var(--navy-50); }
    .rd-toc__item.is-current { background: var(--navy); color: var(--white); }
    .rd-toc__num { flex: 0 0 auto; color: var(--primary); font-variation-settings: 'wght' 800; min-width: 34px; font-variant-numeric: tabular-nums; }
    .rd-toc__item.is-current .rd-toc__num { color: var(--primary-100); }
    .rd-toc__group { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-muted); margin: 10px 8px 4px; font-variation-settings: 'wght' 700; }

    .rd-state { max-width: 620px; margin: 12vh auto; padding: 0 24px; text-align: center; color: var(--text-muted); }
    .rd-state h1 { color: var(--navy); font-size: 22px; }
    .rd-top__brand { cursor: pointer; }

    /* Reading presentation (.nl-doc), title page (.nl-cover), breadcrumb
       (.nl-crumb) and document tables (.nl-tbl) come from nl-brand.css v2.25. */
    /* Editor-only chrome that may be present in baked html — hide it in the reader. */
    .nl-tools, .nl-tbl-ctrl { display: none !important; }

    /* ---- Mobile ---- */
    @media (max-width: 820px) {
      .rd-shell { grid-template-columns: 1fr; }
      .rd-menu { display: inline-flex; align-items: center; justify-content: center; }
      .rd-side {
        position: fixed; top: var(--rd-top, 61px); left: 0; bottom: 0; width: 86%; max-width: 340px; z-index: 60;
        transform: translateX(-100%); transition: transform .24s ease;
        border-right: 1px solid var(--border);   /* crisp edge — no glow bleeding onto the header */
      }
      .rd-side.is-open { transform: none; }
      .rd-scrim { position: fixed; inset: var(--rd-top, 61px) 0 0 0; background: var(--navy-900); opacity: 0; pointer-events: none; transition: opacity .24s; z-index: 55; }
      .rd-scrim.is-open { opacity: .42; pointer-events: auto; }
    }
  </style>
</head>
<body>
  <header class="rd-top">
    <button class="rd-menu" id="rdMenu" type="button" aria-label="Contents">☰</button>
    <div class="rd-top__brand">The National League <span>Handbook</span></div>
    <a class="rd-pdf" href="/handbook/print.html?print=1" target="_blank" rel="noopener">Download PDF</a>
  </header>

  <div class="rd-shell">
    <aside class="rd-side" id="rdSide">
      <div class="rd-side__head">
        <input class="rd-search" id="rdSearch" type="search" placeholder="Search the handbook…" aria-label="Search the handbook">
        <nav class="rd-nav" id="rdNav"></nav>
      </div>
      <div class="rd-toc" id="rdToc"></div>
    </aside>
    <main class="rd-main">
      <div class="nl-crumb" id="rdCrumb" title="Where you are"></div>
      <div id="rdDoc"></div>
    </main>
    <div class="rd-scrim" id="rdScrim"></div>
  </div>

<script>
(function () {
  'use strict';
  var BASE = 'app-data/ops-handbook';
  var db = firebase.database();
  var $ = function (id) { return document.getElementById(id); };
  var esc = NL.escHtml;

  // Fixed area order (matches the editor).
  var AREAS = [
    { id: 'memorandum', title: 'Memorandum of Association' },
    { id: 'articles', title: 'Articles of Association' },
    { id: 'league-rules', title: 'League Rules' },
    { id: 'appendices', title: 'Appendices' },
    { id: 'board-directives', title: 'Board Directives' }
  ];
  var S = { edition: null, area: null, selected: null, nodeById: {} };

  var fmtDate = NL.formatDate;   // canon: '14 July 2026' (handles epoch ms via NL.parseDate)
  function areaTitle(id) { for (var i = 0; i < AREAS.length; i++) if (AREAS[i].id === id) return AREAS[i].title; return id; }
  function docOf(id) { return S.edition && S.edition.docs && S.edition.docs[id]; }
  function nodesOf(id) {
    var d = docOf(id); if (!d) return [];
    // editions store nodes as an array; be tolerant of an object map too.
    return Array.isArray(d.nodes) ? d.nodes : (d.nodes ? Object.keys(d.nodes).map(function (k) { return d.nodes[k]; }) : []);
  }

  function state(title, msg) {
    $('rdDoc').innerHTML = '<div class="rd-state"><h1>' + esc(title) + '</h1><p>' + esc(msg) + '</p></div>';
  }

  /* ---------- load ---------- */
  db.ref(BASE + '/publishedEditionId').once('value').then(function (snap) {
    var id = snap.val();
    if (!id) { state('Not published yet', 'The handbook has not been published. Please check back soon.'); return null; }
    wirePdfButton(id);
    return db.ref(BASE + '/editions/' + id).once('value').then(function (s2) { return s2.val(); });
  }).then(function (ed) {
    if (!ed) return;
    S.edition = ed;
    renderNav();
    var t = parseHash();
    if (t && docOf(t.area)) { showArea(t.area, t.nodeId); }
    else { showCover(); }
  }).catch(function (e) {
    state('Unavailable', 'Sorry — the handbook could not be loaded. ' + (e && e.message || ''));
  });

  // Download PDF: serve the pre-rendered static file when it matches the live
  // edition (instant, CDN-style); otherwise fall back to the print view — e.g.
  // in the window between a publish and the render workflow catching up.
  function wirePdfButton(editionId) {
    fetch('/handbook/pdf-meta.json', { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (meta) {
        if (!meta || meta.editionId !== editionId) return;   // keep print fallback
        var a = document.querySelector('.rd-pdf'); if (!a) return;
        a.href = '/handbook/handbook.pdf?e=' + encodeURIComponent(editionId);
        a.removeAttribute('target');
        a.setAttribute('download', 'The National League Handbook' + (meta.label ? ' ' + meta.label : '') + '.pdf');
      })
      .catch(function () { /* print fallback stands */ });
  }

  /* ---------- render ---------- */
  // Title page — the handbook's front cover, stamped with the published edition label.
  function showCover() {
    S.area = null; S.selected = null;
    closeDrawer();
    [].forEach.call($('rdNav').children, function (b) { b.classList.remove('is-active'); });
    var ed = S.edition || {};
    // The big line is the season (from the edition label); the full label — the locked
    // version — appears small with the published date, not massive.
    var season = seasonOf();
    $('rdDoc').innerHTML =
      '<div class="nl-cover">' +
        '<img class="nl-cover__lockup" src="/assets/divisions/The National League.png" alt="The National League">' +
        '<h1 class="nl-cover__title">Handbook</h1>' +
        '<div class="nl-cover__season">' + esc(season) + '</div>' +
        '<div class="nl-cover__rule"></div>' +
        '<div class="nl-cover__divs">' + ['National', 'North', 'South'].map(function (n) {
          return '<img src="/assets/divisions/' + n + '.png" alt="National League ' + n + '">';
        }).join('') + '</div>' +
        // The document's single, quiet edition statement — bottom of the title page.
        '<div class="nl-cover__meta">Edition ' + esc(ed.label || '') +
          (ed.publishedAt ? ' · Published ' + esc(fmtDate(ed.publishedAt)) : '') + '</div>' +
      '</div>';
    $('rdToc').innerHTML = '';
    $('rdDoc').scrollTop = 0;
    updateCrumb();
    try { history.replaceState(null, '', location.pathname + location.search); } catch (_) {}
  }
  function seasonOf() {
    var label = String((S.edition && S.edition.label) || '');
    var m = label.match(/^\s*(\d{4}\s*[-\/]\s*\d{2,4})/);
    return m ? m[1] : label;
  }

  function renderNav() {
    $('rdNav').innerHTML = AREAS.map(function (a) {
      var has = !!docOf(a.id);
      return '<button class="rd-nav__item" data-area="' + a.id + '"' + (has ? '' : ' disabled style="opacity:.4;cursor:default"') + '>' + esc(a.title) + '</button>';
    }).join('');
  }

  function showArea(area, nodeId) {
    S.area = area; S.selected = nodeId || null;
    closeDrawer();
    [].forEach.call($('rdNav').children, function (b) { b.classList.toggle('is-active', b.dataset.area === area); });
    var d = docOf(area);
    $('rdDoc').innerHTML = (d && d.html) || '<div class="rd-state"><p>This area has no published content.</p></div>';
    S.nodeById = {};
    nodesOf(area).forEach(function (n) { S.nodeById[n.id] = n; });
    applySelection();
    renderToc();
    if (nodeId) scrollTo(nodeId);
    else $('rdDoc').scrollTop = 0;
    updateCrumb();
    setHash(area, nodeId);
  }

  /* ---------- "you are here" breadcrumb (mirrors the editor's scroll-spy) ---------- */
  var spyLock = null;   // {secId, until} — pins the highlight on a jump target mid-scroll
  function currentSectionEl() {
    var host = $('rdDoc');
    // The active line must sit BELOW .nl-art's scroll-margin-top (14px), otherwise a
    // section you just jumped to lands above the line and the previous one wins.
    var line = host.getBoundingClientRect().top + 28;
    var arts = host.querySelectorAll('.nl-art'), cur = arts[0] || null;
    for (var i = 0; i < arts.length; i++) {
      if (arts[i].getBoundingClientRect().top <= line) cur = arts[i]; else break;
    }
    return cur;
  }
  function updateCrumb() {
    var crumb = $('rdCrumb'); if (!crumb) return;
    if (!S.area) { crumb.innerHTML = '<span class="nl-crumb__area">Handbook' + (seasonOf() ? ' ' + esc(seasonOf()) : '') + '</span>'; return; }
    // While a jump's smooth scroll is in flight, keep the highlight pinned on the
    // target; release once it arrives (or on timeout for safety).
    if (spyLock) {
      var curEl = currentSectionEl();
      if ((curEl && curEl.getAttribute('data-id')) === spyLock.secId || Date.now() > spyLock.until) spyLock = null;
    }
    var secId;
    if (spyLock) { secId = spyLock.secId; }
    else { var el = currentSectionEl(); secId = el && el.getAttribute('data-id'); }
    var node = secId && S.nodeById[secId];
    var sec = node ? ((node.number ? esc(node.number) + ' · ' : '') + esc(node.title || textOf(node).slice(0, 60))) : '';
    crumb.innerHTML = '<span class="nl-crumb__area">' + esc(areaTitle(S.area)) + '</span>' +
      (sec ? '<span class="nl-crumb__sep">›</span><span class="nl-crumb__sec">' + sec + '</span>' : '');
    // reflect the current section in the contents rail (only when showing the outline)
    if (secId && !($('rdSearch').value || '').trim()) {
      [].forEach.call($('rdToc').querySelectorAll('.rd-toc__item'), function (a) {
        a.classList.toggle('is-current', a.getAttribute('data-goto') === secId);
      });
    }
  }

  function renderToc() {
    var q = ($('rdSearch').value || '').trim();
    if (q) { renderSearch(q); return; }
    var roots = nodesOf(S.area).filter(function (n) { return n.parentId == null; })
      .sort(function (a, b) { return (a.order || 0) - (b.order || 0); });
    $('rdToc').innerHTML = roots.map(function (n) {
      var label = n.title || textOf(n).slice(0, 70) || '(untitled)';
      var cur = (n.id === S.selected) ? ' is-current' : '';
      return '<a class="rd-toc__item' + cur + '" data-goto="' + n.id + '"><span class="rd-toc__num">' + esc(n.number || '') + '</span><span>' + esc(label) + '</span></a>';
    }).join('') || '<p style="color:var(--text-muted);font-size:13px;padding:6px 8px">No sections.</p>';
  }

  function textOf(n) {
    if (n.title) return n.title;
    if (n.body) return n.body.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
    if (n.table) return tableText(n);
    return '';
  }
  function tableText(n) {
    if (!n.table) return '';
    var s = (n.table.header || []).join(' ');
    (n.table.rows || []).forEach(function (r) { s += ' ' + (Array.isArray(r) ? r.join(' ') : ''); });
    return s;
  }

  function renderSearch(q) {
    var ql = q.toLowerCase(), out = [], total = 0;
    AREAS.forEach(function (a) {
      var ns = nodesOf(a.id); if (!ns.length) return;
      var hits = ns.filter(function (n) {
        var t = ((n.title || '') + ' ' + (n.body || '').replace(/<[^>]+>/g, ' ') + ' ' + tableText(n) + ' ' + (n.number || '')).toLowerCase();
        return t.indexOf(ql) !== -1;
      });
      if (!hits.length) return;
      total += hits.length;
      out.push('<div class="rd-toc__group">' + esc(a.title) + ' · ' + hits.length + '</div>');
      hits.slice(0, 40).forEach(function (n) {
        var label = n.title || textOf(n).slice(0, 80) || '(untitled)';
        out.push('<a class="rd-toc__item" data-goto="' + n.id + '" data-area="' + a.id + '"><span class="rd-toc__num">' + esc(n.number || '') + '</span><span>' + esc(label) + '</span></a>');
      });
    });
    $('rdToc').innerHTML = total ? out.join('') : '<p style="color:var(--text-muted);font-size:13px;padding:6px 8px">No matches.</p>';
  }

  function applySelection() {
    var host = $('rdDoc');
    [].forEach.call(host.querySelectorAll('.is-sel'), function (el) { el.classList.remove('is-sel'); });
    if (!S.selected) return;
    var el = document.getElementById('c-' + S.selected);
    if (el) el.classList.add('is-sel');
  }
  function scrollTo(nodeId) {
    var el = document.getElementById('c-' + nodeId);
    if (!el) return;
    // Lock the scroll-spy on the tapped section while the smooth scroll is in
    // flight — otherwise the nav highlight snaps back to the current section and
    // rattles through every one in between until the scroll arrives.
    var art = el.closest('.nl-art') || el;
    spyLock = { secId: art.getAttribute('data-id'), until: Date.now() + 2500 };
    el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    updateCrumb();
  }

  /* ---------- deep links ---------- */
  var _suppress = false;
  function setHash(area, nodeId) {
    _suppress = true;
    try { location.hash = '#' + area + (nodeId ? '/' + nodeId : ''); } catch (_) {}
    setTimeout(function () { _suppress = false; }, 0);
  }
  function parseHash() {
    var h = (location.hash || '').replace(/^#/, ''); if (!h) return null;
    var i = h.indexOf('/'); var area = i < 0 ? h : h.slice(0, i); var nodeId = i < 0 ? null : h.slice(i + 1);
    if (!AREAS.some(function (a) { return a.id === area; })) return null;
    return { area: area, nodeId: nodeId };
  }
  function goto(area, nodeId) {
    if (area && area !== S.area) { showArea(area, nodeId); return; }
    S.selected = nodeId; applySelection(); renderToc(); if (nodeId) scrollTo(nodeId); setHash(S.area, nodeId);
  }
  function copyLink(nodeId) {
    var url = location.origin + location.pathname + '#' + S.area + '/' + nodeId;
    NL.copy(url);
    setHash(S.area, nodeId);
    NL.toast && NL.toast('Link copied — opens the handbook at this clause', 'success');
  }

  /* ---------- events ---------- */
  $('rdNav').addEventListener('click', function (e) {
    var b = e.target.closest('[data-area]'); if (b && !b.disabled) showArea(b.dataset.area, null);
  });
  $('rdToc').addEventListener('click', function (e) {
    var a = e.target.closest('[data-goto]'); if (!a) return;
    e.preventDefault(); goto(a.dataset.area || S.area, a.dataset.goto);
  });
  $('rdSearch').addEventListener('input', renderToc);
  $('rdDoc').addEventListener('click', function (e) {
    var num = e.target.closest('.nl-clause__num, .nl-art__num'); if (!num) return;
    var host = num.closest('[data-id]'); if (host) copyLink(host.dataset.id);
  });
  document.querySelector('.rd-top__brand').addEventListener('click', function () { if (S.edition) showCover(); });
  window.addEventListener('hashchange', function () {
    if (_suppress) return;
    var t = parseHash();
    if (t) goto(t.area, t.nodeId);
    else if (S.edition) showCover();
  });

  // Header height feeds the shell (--rd-top) so both panes fill the viewport exactly.
  function setTopVar() {
    var t = document.querySelector('.rd-top');
    document.documentElement.style.setProperty('--rd-top', ((t && t.offsetHeight) || 61) + 'px');
  }
  setTopVar();
  window.addEventListener('resize', setTopVar);
  setTimeout(setTopVar, 300);

  // Scroll-spy breadcrumb: update "you are here" as the document scrolls.
  var crumbRaf = null;
  $('rdDoc').addEventListener('scroll', function () {
    if (crumbRaf) return;
    crumbRaf = requestAnimationFrame(function () { crumbRaf = null; updateCrumb(); });
  });
  // On mobile the breadcrumb is the quickest way back to the contents.
  $('rdCrumb').addEventListener('click', function () {
    var menu = $('rdMenu');
    if (menu && getComputedStyle(menu).display !== 'none') {
      $('rdSide').classList.add('is-open'); $('rdScrim').classList.add('is-open');
    }
  });

  // Mobile drawer
  function closeDrawer() { $('rdSide').classList.remove('is-open'); $('rdScrim').classList.remove('is-open'); }
  $('rdMenu').addEventListener('click', function () {
    var open = !$('rdSide').classList.contains('is-open');
    $('rdSide').classList.toggle('is-open', open); $('rdScrim').classList.toggle('is-open', open);
  });
  $('rdScrim').addEventListener('click', closeDrawer);
})();
</script>
</body>
</html>
