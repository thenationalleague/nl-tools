<!DOCTYPE html>
<html lang="en">
<head>
<!--
  Programme Packs — club library (standalone, passcode; ?master=1 for admins)
  Version: v1.19 (17/08/2026) — the eye reaches video, audio and Word.
           Video/audio go to the browser's native players (streamed on play,
           metadata only until then). Word documents render CLIENT-SIDE via
           vendored docx-preview + JSZip (programme/_vendor/, lazy-loaded on
           first use) — never an embedded Microsoft/Google viewer, which
           would hand a club's file URL to a third party. .docx only; the
           2003 binary .doc stays download-only.
  Version: v1.18 (17/08/2026) — the master door (?master=1, _shared.js v1.3):
           an NL admin gets the console's '*' session on this page, browsing
           and managing all 73 folders in one place — canWrite() and the
           rules already understood '*', so this is an entry path, not a
           permission change. Empty clubs open for a master session (an
           admin fills them). ?embed=1 drops the idbar and replaces history
           steps for the console's Library tab. "Not you?" reads Console on
           a master session and goes there.
  Version: v1.17 (17/08/2026) — images carry three sizes (_shared.js v1.2):
           tiles draw a 360px thumb, the eye shows a 1600px medium, Download
           stays the untouched original. Both are rendered in the browser at
           upload and their URLs stored on the record, so a folder of twenty
           20MB photos no longer pulls 400MB to draw a grid. Files uploaded
           before this get theirs from the console's Generate previews
           button. A type no browser renders (PSD, TIFF) now shows its kind
           icon instead of a broken image.
  Version: v1.16 (16/08/2026) — crest strings come from canon
           NL.clubs.crestImgHtml('thumb', {className}) with a
           NL.clubs.wireCrestImgs sweep after each render (PP.crestImgHtml is
           gone — _shared.js v1.1). Drops the '<img ' string-replace class
           hack; sizing was already on .own__crest / .dir__crest /
           .pack__crest. Same thumb → full → rose degrade, no inline onerror.
  Version: v1.15 (15/08/2026) — the context header bar is canon now (.nl-idbar, nl-brand.css v2.37).
           Pure rename — the local .hbar was the same rules under a different
           name, and .hbar already meant a histogram bar in
           commercial-benchmarking. Nothing renders differently.
  Version: v1.14 (04/08/2026) - the PDF preview shows the document, not the
           browser's reader furniture, which read as a print dialog.
           v1.13 (04/08/2026) - opening a folder settles rather than snapping,
           via the canon .nl-enter (nl-brand v36).
           v1.12 (04/08/2026) - file tiles carry the size, and Preview and
           Download became the canon eye and down-arrow: two words did not fit
           a tile and the buttons overlapped.
           v1.11 (04/08/2026) - a dropped tree keeps its shape (six levels, not
           three) and a .zip uploads: the content type is canonicalised rather
           than taken from a Windows registry lookup.
           v1.10 (04/08/2026) - making a folder no longer moves you into it,
           which was silently nesting the next one; a folder holding no files
           can be deleted, from its own menu, taking empty subfolders with it.
           v1.9 (04/08/2026) - a dropped folder arrives as a folder: the tree
           is walked and recreated, not uploaded as a 0-byte asset. Uploads
           queue four at a time.
           v1.8 (04/08/2026) - a folder you can only read says so, and names
           the session, instead of silently dropping every write control.
           v1.7 (04/08/2026) - aimed drag-and-drop: the folder surface takes a
           drop, and a subfolder tile takes one straight into itself.
           v1.6 (04/08/2026) — the ?c= link token is gone; the passcode is the
           whole credential and a club link never goes stale.
           v1.5 (04/08/2026) — the top of a club's library is named after the
           club, not "Top level"; one clubName() behind head, Move and zips.
           v1.4 (04/08/2026) — folders can be multi-selected and moved, same
           as files. Cycle- and depth-guarded in the picker.
           v1.3 (04/08/2026) — the folder you are in is a surface, not a run
           of loose sections; its name and actions sit in the head.
           v1.2 (04/08/2026) — the club root is a folder: files can be dropped
           and listed there, not only inside one you made first.
           v1.1 (04/08/2026) — stop auditing folder opens: in a read-all
           library, browsing is the intended behaviour, so the entries only
           buried the ones that answer a real question.
           v1.0 (03/08/2026) — initial build. Replaces /programme-packs/
           (Google Drive via Apps Script), which is retired: the Drive proxy
           was the source of the ghost-file drift, the manual redeploy dance
           and the GAS quota ceilings. Bytes now live in Firebase Storage.
  File: /programme/index.html

  Standalone (NO auth-guard) — named Firebase app + a passcode-minted custom
  token, via _shared.js. The club's 6-character passcode is the whole
  credential; ?club=<CODE> only brands the gate. NL console: /programme/admin/.

  What this page is
  -----------------
  A 73-folder asset library for match-day programme production. Read-all,
  write-own: any club can browse and download every other club's assets
  (the home editor needs the AWAY club's crest on Tuesday), but can only
  upload into its own folder. The National League's own folder is pinned above
  everything in every view. Expiry of league adverts is managed by hand — a
  used-from/used-until field existed and was removed as more bookkeeping than
  it saved.

  Write-own is enforced by Storage + RTDB rules against the `pClub` claim that
  the programmeAuth trigger puts in the token — not by this file. Nothing here
  is load-bearing for access control.

  Storage (RTDB app-data/media-programme/):
    folders/<CODE>/<folderId>  { name, parentId?, createdAt }   parentId = subfolder
    files/<CODE>/<fileId>      { name, folderId, size, contentType, storagePath,
                                 url, uploadedAt }
                               folderId '_root' = loose at the top of the club
    trash/<CODE>/<fileId>      { ...file, deletedAt }
    audit/<pushId>             append-only
  Bytes: Storage programme/<CODE>/<folderId>/<fileId>-<name>
  <CODE> = clubs-meta 3-letter code, or NL. Same key the portal will use.
-->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Programme Packs — National League</title>
  <!-- Favicons. Static, not injected: nl-topbar.js adds these too, but a
       standalone page never loads it, and an icon that arrives with the JS
       leaves the tab blank until it does. /favicon.ico at the root is the
       backstop every browser asks for without being told. -->
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/favicon-16x16.png">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
<link rel="stylesheet" href="/system/nl-brand.css?v=57">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
<script src="/programme/_zip.js?v=5"></script>
<script src="/programme/_shared.js?v=5"></script>
<script src="/system/nl-utils.js?v=44"></script>
<link rel="stylesheet" href="/programme/_shared.css?v=5">
</head>
<body>

<!-- Passcode gate -->
<div class="gate" id="gate">
  <div class="gate__card">
    <img class="gate__logo" id="gateLogo" src="/assets/crests/National%20League%20rose.png" alt="National League">
    <div class="gate__title" id="gateTitle">Programme Packs</div>
    <div class="gate__sub" id="gateSub">Loading…</div>
    <div id="gateForm" style="display:none">
      <input class="gate__input" id="gateInput" maxlength="8" placeholder="••••••" autocomplete="off"
             autocapitalize="characters" spellcheck="false" aria-label="Club passcode">
      <div class="gate__err" id="gateErr" role="alert"></div>
      <button class="btn btn--primary" id="gateBtn" style="width:100%;justify-content:center;">Open</button>
    </div>
  </div>
</div>

<!-- Library -->
<div id="app" style="display:none">
  <div class="nl-idbar">
    <span id="idbarCrest"></span>
    <div class="nl-idbar__id">
      <div class="nl-idbar__title" id="idbarClub"></div>
      <div class="nl-idbar__sub">Programme Packs</div>
    </div>
    <button class="nl-idbar__btn" id="signout">Not you?</button>
  </div>

  <div class="wrap">
    <!-- Shown only when an NL admin opened this tab as a club, so nobody
         mistakes an admin's session for the club's own. -->
    <div id="asBanner" class="as-banner" style="display:none"></div>

    <!-- The National League panel. Rendered above every view, always. -->
    <div id="nlPanel"></div>

    <div id="viewDir"></div>
    <div id="viewClub" style="display:none"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';

  var FOLDERS = {};      // <CODE> → { <folderId>: {name, parentId?, createdAt} }
  var FILES = {};        // <CODE> → { <fileId>:  {...} }
  var ROSTER = [];       // current-season clubs from clubs-meta
  var BY_CODE = {};      // <CODE> → roster entry
  var loaded = { folders: false, files: false, roster: false };
  var view = { club: null, folderId: null };   // club === null → directory
  var sel = {};                                // fileId → true, current folder only
  var selDir = {};                             // folderId → true, ditto

  /* Selection is per-folder and never survives navigation. Carrying ticks
     between folders is how people end up moving or deleting something they
     forgot was selected two screens ago. */

  /* Location is the hash — #/FYL/-Nabc — so browser back and forward move
     through the library, links to a folder can be pasted to someone, and a
     refresh lands where you were. Every navigation goes through here; nothing
     sets view.* directly, or the two would drift apart. */
  function readHash() {
    var raw = (location.hash || '').replace(/^#\/?/, '');
    var bits = raw.split('/').filter(Boolean).map(decodeURIComponent);
    return { club: bits[0] || null, folderId: bits[1] || null };
  }
  function hashFor(club, folderId) {
    if (!club) return '#/';
    return '#/' + encodeURIComponent(club) + (folderId ? '/' + encodeURIComponent(folderId) : '');
  }
  function navigate(club, folderId) {
    var next = hashFor(club, folderId);
    if (location.hash === next) { applyHash(); return; }
    /* Embedded, each step REPLACES: an iframe shares the parent's session
       history, so stacking entries would turn the console's Back button into
       an unwind of this folder walk. The breadcrumb is the way back here. */
    if (EMBED) { location.replace(location.pathname + location.search + next); return; }
    location.hash = next;                 // hashchange applies it
  }
  function applyHash() {
    var h = readHash();
    if (h.club !== view.club || h.folderId !== view.folderId) { sel = {}; selDir = {}; }
    view.club = h.club;
    view.folderId = h.folderId;
    /* Opening a folder is deliberately NOT audited. The whole library is
       read-all, so browsing is the intended behaviour and logging it says
       nothing — it just buries the entries that matter (who signed in, who
       took a file out of someone else's folder) under navigation noise.
       Sign-in answers "who was in", downloads answer "what left". */
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  window.addEventListener('hashchange', applyHash);

  var esc = function (s) { return NL.escHtml(s); };
  function el(id) { return document.getElementById(id); }

  /* ── Gate ─────────────────────────────────────────────────────────────── */

  var params = (function () {
    try { return new URLSearchParams(location.search); }
    catch (e) { return new URLSearchParams(''); }
  })();
  var linkClub = params.get('club') || '';

  /* ?master=1 — the admin door. Asks _shared for the console's '*' session
     instead of a passcode, so an NL admin browses and manages all 73 folders
     right here. The flag itself grants nothing: PP.enterMaster needs a live
     portal sign-in and the role check happens server-side, so a club (or
     anyone) adding it to the URL just meets a sign-in message.
     ?embed=1 — the page is inside the console's Library tab: the console
     already says who you are, so the idbar comes off, and in-library
     navigation replaces history entries rather than stacking them (browser
     Back in the console should leave the console, not unwind a folder walk). */
  var MASTER = params.get('master') === '1';
  var EMBED = params.get('embed') === '1';

  /* Badge the gate with the club from the link, so Yeovil's people meet
     Yeovil's crest rather than a generic rose. clubs-meta is a public static
     file, so this needs no auth and no lookup against anything private —
     which is the point: config (and every passcode in it) stays closed.
     Cosmetic only; the passcode decides everything, and ?club= is now the
     whole of the link — see PP.clubLink for why the ?c= token went. */
  function brandGate() {
    if (!linkClub) return;
    if (linkClub === 'NL') {
      el('gateTitle').textContent = 'National League';
      return;
    }
    NL.clubs.forSeason().then(function (clubs) {
      var c = clubs.filter(function (x) { return x.code === linkClub; })[0];
      if (!c) return;
      var logo = el('gateLogo');
      logo.src = NL.clubs.crestUrl(c.name, 'medium');
      NL.clubs.wireCrestImg(logo, c.name);
      el('gateTitle').textContent = c.name;
    }).catch(function () { /* keep the rose */ });
  }

  /* Try a remembered device first, so a weekly user isn't retyping a card
     every Tuesday. PP.resume() resolves null (never rejects) if nothing is
     stored or the passcode has since been regenerated in the console.
     ?master=1 takes its own door instead — deliberately never falling back
     to a remembered club passcode, so an admin is always who the audit says
     they are. */
  if (MASTER) {
    el('gateSub').textContent = 'Confirming your National League access…';
    /* First visit in a browser is a full Eventarc exchange — seconds, not
       milliseconds. Same courtesy as the passcode path: say so before a
       working gate starts reading as a hung one. */
    var masterSlow = setTimeout(function () {
      el('gateSub').textContent = 'Still confirming — this can take a few seconds.';
    }, 4000);
    PP.enterMaster().then(function (s) {
      clearTimeout(masterSlow);
      enter(s);
    }).catch(function (e) {
      clearTimeout(masterSlow);
      if (e && e.code === 'pp/no-portal') {
        el('gateSub').innerHTML =
          'The master view needs a National League portal sign-in.<br>' +
          '<a href="/programme/admin/">Open the admin console</a> · ' +
          '<a href="' + esc(location.pathname) + '">enter a passcode instead</a>';
        return;
      }
      /* The trigger's own message covers the refused-role case
         ("administration is admin-only") and the timeout alike. */
      el('gateSub').textContent = (e && e.message) || 'Something went wrong. Please try again.';
    });
  } else {
    PP.resume().then(function (s) {
      if (s) { enter(s); return; }
      showGate();
    }).catch(showGate);
  }

  function showGate() {
    brandGate();
    el('gateSub').textContent = 'Enter your club passcode.';
    el('gateForm').style.display = 'block';
    var inp = el('gateInput'), err = el('gateErr'), btn = el('gateBtn');
    inp.focus();

    function submit() {
      var code = PP.normCode(inp.value);
      if (code.length < 4) { err.textContent = 'Enter your full passcode.'; return; }
      err.textContent = '';
      btn.disabled = true; btn.textContent = 'Checking…';
      /* The check is an RTDB round-trip to the programmeAuth trigger, and
         Eventarc delivery is measured in seconds, not milliseconds. Say so
         rather than letting a slow gate read as a broken one. */
      var slow = setTimeout(function () {
        el('gateSub').textContent = 'Still checking — this can take a few seconds.';
      }, 3000);
      PP.enter(code).then(function (s) {
        clearTimeout(slow);
        enter(s);
      }).catch(function (e) {
        clearTimeout(slow);
        el('gateSub').textContent = 'Enter your club passcode.';
        btn.disabled = false; btn.textContent = 'Open';
        /* programmeAuth returns a plain message for wrong passcode, throttling
           and timeout alike — surface it as-is rather than inventing wording. */
        err.textContent = (e && e.message) || 'Passcode not recognised.';
        inp.select();
      });
    }
    btn.onclick = submit;
    inp.onkeydown = function (e) { if (e.key === 'Enter') submit(); };
  }

  el('signout').addEventListener('click', function () {
    /* A master session has no passcode to forget, and forgetting would only
       bounce to a gate that signs straight back in — the useful exit is the
       console. Clubs keep the original meaning. */
    if ((PP.session || {}).isAdmin) { location.href = '/programme/admin/'; return; }
    PP.forget();
    location.href = location.pathname;
  });

  /* ── Enter ────────────────────────────────────────────────────────────── */

  function enter(session) {
    el('gate').style.display = 'none';
    el('app').style.display = 'block';

    var crest = document.createElement('img');
    crest.className = 'nl-idbar__crest';
    crest.alt = '';
    if (session.isNL) {
      crest.src = PP.ROSE;
    } else {
      crest.src = NL.clubs.crestUrl(session.name, 'medium');
      NL.clubs.wireCrestImg(crest, session.name);
    }
    el('idbarCrest').replaceChildren(crest);
    el('idbarClub').textContent = session.name;
    if (session.isAdmin) el('signout').textContent = 'Console';
    /* Inside the console's Library tab the page around this one already
       carries the identity and the way out — a second bar is furniture. */
    if (EMBED) document.querySelector('.nl-idbar').style.display = 'none';

    if (session.viaAdmin) {
      var b = el('asBanner');
      b.style.display = '';
      b.textContent = 'You opened this as ' + session.name +
        '. Anything you do here is recorded against them, marked as opened by the National League.';
    }

    NL.clubs.forSeason().then(function (clubs) {
      ROSTER = clubs;
      BY_CODE = {};
      clubs.forEach(function (c) { BY_CODE[c.code] = c; });
      loaded.roster = true;
      render();
    }).catch(function () {
      loaded.roster = true;
      render();
    });

    /* Both listeners carry an error callback. Without one a denied read is
       silent, and because render() waits for every source to land the page
       would sit empty forever with nothing in the console. */
    function readFail(what, err) {
      console.error('[programme] reading ' + what, err);
      el('viewDir').innerHTML =
        '<div class="empty-state"><div class="empty-state__title">Couldn’t load the library</div>' +
        '<div class="empty-state__text">' + esc(what) + ' — ' + esc((err && (err.message || err.code)) || String(err)) +
        '<br>Try refreshing. If it keeps happening, contact the National League.</div></div>';
    }

    PP.ref('folders').on('value', function (s) {
      FOLDERS = s.val() || {}; loaded.folders = true; render();
    }, function (e) { readFail('folders', e); });
    PP.ref('files').on('value', function (s) {
      FILES = s.val() || {}; loaded.files = true; render();
    }, function (e) { readFail('files', e); });

    applyHash();
  }

  /* Nothing is pre-created. Seeding three folders into 72 clubs meant most of
     the library was empty folders nobody asked for, and an empty folder reads
     as neglect rather than as a blank page. Clubs make what they need. */

  /* ── Data helpers ─────────────────────────────────────────────────────── */

  /* Six, not three. Three was "deep enough for Photos › 2026-27 › Away", which
     is true of a folder someone builds here by hand and quite wrong for one
     dragged in off a desktop — a real working folder is routinely four or five
     deep, and everything past the ceiling gets flattened into one heap. That
     happened on a drop of four folders and some loose files on 04/08/2026: the
     structure the club had was exactly the structure they wanted, and the tool
     threw it away. A cap still exists, because the breadcrumb and the Move
     picker both have to stay readable, but it is now past where real folders
     live rather than under it. */
  var MAX_DEPTH = 6;

  /* Folders are a tree via parentId (absent = top level) and always render
     alphabetically within their parent. Ordering is deliberately not editable:
     a manual sortOrder is hidden state that nobody maintains, and across 72
     clubs it would mean 72 different arrangements of the same three folders.
     Alphabetical is predictable from the outside, which is what matters when
     71 other clubs have to find something in here.

     Cycle-guarded: a corrupt parentId that points at a descendant would
     otherwise recurse until the stack gives out. */
  function foldersFor(code) {
    var obj = FOLDERS[code] || {};
    var all = Object.keys(obj).map(function (id) {
      var f = obj[id];
      return { id: id, name: f.name || 'Untitled', parentId: f.parentId || null, createdAt: f.createdAt };
    });

    var byParent = {};
    all.forEach(function (f) {
      var key = f.parentId || '';
      (byParent[key] = byParent[key] || []).push(f);
    });
    Object.keys(byParent).forEach(function (k) {
      byParent[k].sort(function (a, b) { return a.name.localeCompare(b.name); });
    });

    var out = [], seen = {};
    (function walk(parent, depth) {
      (byParent[parent] || []).forEach(function (f) {
        if (seen[f.id]) return;        // cycle or duplicate parent — drop it
        seen[f.id] = true;
        f.depth = depth;
        out.push(f);
        if (depth < MAX_DEPTH - 1) walk(f.id, depth + 1);
      });
    })('', 0);

    /* Anything orphaned (its parent was deleted) still has to appear, or a
       club's files would vanish from the UI while remaining in the bucket. */
    all.forEach(function (f) {
      if (!seen[f.id]) { f.depth = 0; seen[f.id] = true; out.push(f); }
    });
    return out;
  }

  function childrenOf(code, folderId) {
    return foldersFor(code).filter(function (f) { return (f.parentId || null) === (folderId || null); });
  }

  function folderById(code, id) {
    return foldersFor(code).filter(function (f) { return f.id === id; })[0] || null;
  }

  /* Chain from the club root down to `id`, for the breadcrumb and for the
     folder paths written into a zip. */
  function trail(code, id) {
    var out = [], guard = 0, f = id ? folderById(code, id) : null;
    while (f && guard++ < 10) { out.unshift(f); f = f.parentId ? folderById(code, f.parentId) : null; }
    return out;
  }

  /* Every file at or below `folderId` (null = the whole club), each paired with
     the folder path it should occupy inside the archive. */
  function collectFiles(code, folderId, prefix) {
    var out = [];
    filesFor(code, folderId).forEach(function (f) {
      out.push({ file: f, path: prefix });
    });
    childrenOf(code, folderId).forEach(function (child) {
      out = out.concat(collectFiles(code, child.id, prefix + PP.safeName(child.name) + '/'));
    });
    return out;
  }

  /* Every folder at or below `id`, itself included. A folder cannot be moved
     into its own subtree: that detaches the whole branch from the root, and
     foldersFor's cycle guard would then drop it from the UI while its files
     sat on in the bucket. */
  function subtree(code, id) {
    var out = [id];
    childrenOf(code, id).forEach(function (c) { out = out.concat(subtree(code, c.id)); });
    return out;
  }

  /* How many levels a folder carries below itself — 0 for a leaf. A move has
     to leave room for all of them inside MAX_DEPTH, or the deepest ones fall
     off the walk and reappear as orphans at the top. */
  function subtreeHeight(code, id) {
    var kids = childrenOf(code, id);
    if (!kids.length) return 0;
    return 1 + Math.max.apply(null, kids.map(function (c) { return subtreeHeight(code, c.id); }));
  }

  function totalBytes(list) {
    return list.reduce(function (t, e) { return t + (Number(e.file.size) || 0); }, 0);
  }

  function filesFor(code, folderId) {
    var obj = FILES[code] || {};
    return Object.keys(obj).map(function (id) {
      var f = obj[id]; f = Object.assign({}, f); f.id = id; return f;
    }).filter(function (f) {
        return (f.folderId || PP.ROOT_FOLDER) === (folderId || PP.ROOT_FOLDER);
      })
      .sort(function (a, b) { return String(a.name).localeCompare(String(b.name)); });
  }

  function fileCount(code) { return Object.keys(FILES[code] || {}).length; }

  function lastUpload(code) {
    var obj = FILES[code] || {}, max = 0;
    Object.keys(obj).forEach(function (k) { if ((obj[k].uploadedAt || 0) > max) max = obj[k].uploadedAt; });
    return max;
  }

  /* One place that turns a club code into what a person calls it. The head of
     the club's own folder, the root option in Move and the name on a zip all
     have to agree, and three copies of the same ternary is how they stop. */
  function clubName(code) {
    if (code === PP.NL_KEY) return 'National League';
    return (BY_CODE[code] || {}).name || code;
  }

  function canWrite(code) {
    var s = PP.session || {};
    return s.isAdmin || s.code === code;
  }

  /* ── Render ───────────────────────────────────────────────────────────── */

  /* True the first time a given view is drawn, false for every re-render that
     follows — an RTDB update, a checkbox tick, a selection change. The
     entrance is for arriving somewhere, and replaying it on each redraw would
     make ticking a box flash the whole page. */
  var drawn = '';
  function arriving() {
    var key = (view.club || '~directory') + '|' + (view.folderId || '');
    if (key === drawn) return false;
    drawn = key;
    return true;
  }
  var entering = false;

  function render() {
    if (!loaded.folders || !loaded.files || !loaded.roster) return;
    entering = arriving();
    renderNLPanel();
    if (view.club) { renderClub(view.club); }
    else { renderDirectory(); }
  }

  /* The NL panel. Pinned above every view — it is the reason most clubs open
     the tool, so it never scrolls away behind a directory of 72 crests. Live
     adverts (inside their used-from/used-until window) are listed first and
     stated plainly; undated NL assets are evergreen and just get a count. */
  function renderNLPanel() {
    el('nlPanel').innerHTML =
      '<div class="nl-card">' +
        '<img class="nl-card__rose" src="' + PP.ROSE + '" alt="">' +
        '<div class="nl-card__id"><div class="nl-card__title">National League<br>assets</div></div>' +
        '<button class="btn nl-card__btn" id="nlOpen">Open</button>' +
      '</div>';
    el('nlOpen').onclick = function () { navigate(PP.NL_KEY, null); };
  }

  /* Club colours come from clubs-meta. Validate before they go anywhere near an
     inline style — the data is ours, but a colour field is one bad edit away
     from being an attribute-escape, and the cost of checking is nil. */
  function hex(v, fallback) {
    return /^#[0-9a-fA-F]{3,8}$/.test(String(v || '')) ? v : fallback;
  }
  function bandsHtml(club, cls) {
    var c = (club && club.colors) || {};
    return '<span class="' + cls + '">' +
      '<i style="background:' + hex(c.primary, 'var(--navy)') + '"></i>' +
      '<i style="background:' + hex(c.secondary, 'var(--primary)') + '"></i></span>';
  }

  function renderDirectory() {
    el('viewClub').style.display = 'none';
    el('viewDir').style.display = 'block';

    var s = PP.session || {};
    var own = !s.isAdmin && !s.isNL ? BY_CODE[s.code] : null;
    var html = '';

    /* Your own club is the one card you act on rather than browse, so it gets
       the room and the only primary button on the page. */
    if (own) {
      html += '<div class="sec-head">Your folder' +
        '<span class="sec-head__note">Only your club can upload here \u00b7 every other club can see it</span></div>' +
        '<div class="own">' +
          NL.clubs.crestImgHtml(own.name, 'thumb', { className: 'own__crest' }) +
          '<div class="own__id"><div class="own__name">' + esc(own.name) + '</div></div>' +
          '<button class="btn btn--primary" data-club="' + esc(s.code) + '">Manage my files</button>' +
          bandsHtml(own, 'own__bands') +
        '</div>';
    }

    html += '<div class="sec-head">All clubs</div>';

    /* An empty club can't be opened — there is nothing behind it, and letting
       someone click into a blank folder is a worse answer than not letting them
       click at all. It stays listed and greyed, and says why on hover. Your own
       club is always enterable: that is where you go to fix being empty — and
       a master session can enter anywhere for the same reason, because for an
       admin every empty folder is one they might be about to fill. */
    html += '<div class="dir' + (entering ? ' nl-enter' : '') + '">' + ROSTER.map(function (c) {
      var n = fileCount(c.code), last = lastUpload(c.code);
      var mine = c.code === s.code;
      var open = n > 0 || mine || s.isAdmin;
      var state = n ? (n + ' file' + (n === 1 ? '' : 's') + ', last added ' + PP.ago(last))
                    : (mine ? 'your club — nothing uploaded yet' : 'nothing uploaded yet');
      return '<button class="dir__card' + (n ? '' : ' is-empty') + '"' +
        (open ? ' data-club="' + esc(c.code) + '"' : ' disabled') +
        ' title="' + esc(c.name + ' — ' + state) + '"' +
        ' aria-label="' + esc(c.name + ' — ' + state) + '">' +
        NL.clubs.crestImgHtml(c.name, 'thumb', { className: 'dir__crest' }) +
        '<span class="dir__id">' +
          '<span class="dir__name">' + esc(c.name) + '</span>' +
          (!n && mine ? '<span class="dir__meta">Add your files</span>' : '') +
        '</span>' +
        bandsHtml(c, 'dir__bands') +
        '</button>';
    }).join('') + '</div>';

    el('viewDir').innerHTML = html;
    NL.clubs.wireCrestImgs(el('viewDir'));   // thumb → full → rose, same tick as insertion
    Array.prototype.forEach.call(el('viewDir').querySelectorAll('[data-club]'), function (b) {
      b.onclick = function () { navigate(b.getAttribute('data-club'), null); };
    });
  }

  function openClub(code) { navigate(code, null); }

  function renderClub(code) {
    el('viewDir').style.display = 'none';
    el('viewClub').style.display = 'block';

    var isNL = code === PP.NL_KEY;
    var name = clubName(code);
    var writable = canWrite(code);
    var here = view.folderId ? folderById(code, view.folderId) : null;
    var path = trail(code, view.folderId);
    var subs = childrenOf(code, view.folderId);
    /* No ternary on view.folderId: the club root is a folder like any other,
       it just has no id. filesFor() reads null as PP.ROOT_FOLDER. */
    var files = filesFor(code, view.folderId);
    var picked = files.filter(function (f) { return sel[f.id]; });
    var pickedSubs = subs.filter(function (f) { return selDir[f.id]; });
    var packCount = collectFiles(code, null, '').length;

    var html = '<div class="crumb">' +
      '<button class="btn btn--ghost btn--sm" data-go="dir">All clubs</button>' +
      '<span class="crumb__sep">/</span>' +
      (view.folderId ? '<button class="crumb__link" data-go="root">' + esc(name) + '</button>'
                     : '<span class="crumb__here">' + esc(name) + '</span>');
    path.forEach(function (f, i) {
      html += '<span class="crumb__sep">/</span>' +
        (i === path.length - 1
          ? '<span class="crumb__here">' + esc(f.name) + '</span>'
          : '<button class="crumb__link" data-crumb="' + esc(f.id) + '">' + esc(f.name) + '</button>');
    });
    html += '</div>';

    /* Clubs only. "Download everything the League has ever published" is not
       a thing anyone wants, and offering it invites a 144-file zip by
       accident. Individual NL folders still download from their own button. */
    if (packCount && !isNL) {
      html += '<div class="pack">' +
        (isNL ? '<img class="pack__crest" src="' + PP.ROSE + '" alt="">'
              : NL.clubs.crestImgHtml(name, 'thumb', { className: 'pack__crest' })) +
        '<div class="pack__id"><div class="pack__title">' +
          esc(isNL ? 'National League assets' : name + '\u2019s programme pack') + '</div></div>' +
        '<button class="btn btn--primary pack__btn" data-zip="__club">' +
          esc(isNL ? 'Download all' : 'Download pack') + '</button>' +
      '</div>';
    }

    /* One surface for whatever folder you are in, root included, so its
       contents are visibly inside something. The root is named after the club
       that owns it — the top of Sutton's library is "Sutton United", not a
       generic "Top level", and the Move dialog and a zip's name say the same
       thing (clubName, one place). No file count in the head: the grid below
       is the count. */
    var leftBtns = '', rightBtns = '';
    if (writable) {
      leftBtns += '<button class="btn btn--ghost btn--sm" id="addFolder" title="' +
        (here ? 'Add a folder inside ' + esc(here.name) : 'Add a folder') + '">+ Folder</button>';
      if (here) {
        leftBtns += '<button class="btn btn--ghost btn--sm" id="renameFolder">Rename</button>';
        /* Empty subfolders no longer hide this - they are deleted with it. */
        if (!collectFiles(code, here.id, '').length) {
          leftBtns += '<button class="btn btn--ghost btn--sm" id="deleteFolder">Delete</button>';
        }
      }
    }
    if (view.folderId && collectFiles(code, view.folderId, '').length) {
      rightBtns += '<button class="btn btn--primary btn--sm" data-zip="' + esc(view.folderId) + '">Download folder</button>';
    }

    /* Say why the write controls are missing. In another club's folder there is
       no + Folder, no drop zone, no Move and no Remove — which is correct, and
       reads exactly like a broken page if nothing accounts for it. Naming the
       session answers the real question, which is usually "am I signed in as
       who I think I am". */
    var mine = (PP.session || {}).name || '';
    var tail = (writable ? '' :
        '<span class="fold__note">Read-only' + (mine ? ' \u00b7 signed in as ' + esc(mine) : '') +
        '</span>') +
      (rightBtns ? '<span class="fold__acts">' + rightBtns + '</span>' : '');

    html += '<div class="fold' + (entering ? ' nl-enter' : '') + '"><div class="fold__head">' +
      '<span class="fold__icon" aria-hidden="true">📂</span>' +
      '<span class="fold__name">' + esc(here ? here.name : name) + '</span>' +
      (leftBtns ? '<span class="fold__acts">' + leftBtns + '</span>' : '') +
      (tail ? '<span class="fold__tail">' + tail + '</span>' : '') +
      '</div><div class="fold__body">';

    /* Above both grids, because it governs both. It is always here once the
       folder holds anything, with its buttons disabled until something is
       ticked — rendering it only on selection meant ticking one box shoved
       the whole grid down the page. It carries every bulk action, so nothing
       is offered that cannot be done: Remove greys out on a folders-only
       selection, because a folder is deleted from its own ⋯ menu and only
       when it is empty. */
    if (files.length || subs.length) {
      var n = picked.length + pickedSubs.length;
      var dis = n ? '' : ' disabled';
      html += '<div class="sel-bar">' +
        '<label class="sel-bar__all"><input type="checkbox" class="tile__check" id="selAll"' +
          (n && n === files.length + subs.length ? ' checked' : '') +
          ' style="position:static"> Select all</label>' +
        '<span class="sel-bar__count">' + (n ? n + ' selected' : '') + '</span>' +
        '<button class="btn btn--primary btn--sm" id="selZip"' + dis + '>Download</button>' +
        (writable ? '<button class="btn btn--ghost btn--sm" id="selMove"' + dis + '>Move…</button>' +
                    '<button class="btn btn--danger btn--sm" id="selRemove"' +
                      (picked.length ? '' : ' disabled') + '>Remove</button>' : '') +
        '<span class="sel-bar__spacer"></span>' +
        '<button class="btn btn--ghost btn--sm" id="selClear"' + dis + '>Clear</button>' +
      '</div>';
    }

    if (subs.length) {
      html += '<div class="folders">' + subs.map(function (f) {
        var inside = collectFiles(code, f.id, '').length;
        /* The tick is its own control rather than the tile: clicking a folder
           opens it, which is what a folder is for. Files are the other way
           round \u2014 clicking a file tile picks it, because opening one is what
           the Download and Preview buttons are there for. */
        return '<div class="folder' + (inside ? '' : ' is-empty') +
          (selDir[f.id] ? ' is-picked' : '') + '" tabindex="0" role="button"' +
          ' data-open="' + esc(f.id) + '" aria-label="' + esc(f.name) + '">' +
          '<input type="checkbox" class="tile__check folder__check" data-pickdir="' + esc(f.id) + '"' +
            (selDir[f.id] ? ' checked' : '') + ' aria-label="Select ' + esc(f.name) + '">' +
          '<span class="folder__icon" aria-hidden="true">' + (inside ? '\ud83d\udcc1' : '\ud83d\uddc2\ufe0f') + '</span>' +
          '<span class="folder__id"><span class="folder__name">' + esc(f.name) + '</span></span>' +
          '<button class="folder__more" data-menu="' + esc(f.id) + '" aria-label="Folder actions">\u22ef</button>' +
          '</div>';
      }).join('') + '</div>';
    }

    /* Everything below is folder-agnostic. The club root used to render only
       its subfolders, so a club could not drop a file at the top of its own
       pack without inventing a folder to put it in \u2014 and the root files the
       data model already allowed had nowhere to appear. */
    if (writable) {
      /* Kept deliberately, unlike the other notices that went: a club has to
         know at the point of upload that this folder is readable by all 72.
         One quiet line rather than a bordered callout. */
      html += '<div class="drop" id="drop" tabindex="0" role="button">' +
        '<strong>Drop files or a folder here</strong> or click to choose' +
        '<div class="drop__hint">' + (subs.length ? 'or drop onto a folder above \u00b7 ' : '') +
        'visible to all 72 clubs \u00b7 nothing confidential</div></div>' +
        '<input type="file" id="fileInput" multiple style="display:none">' +
        '<div id="uploads"></div>';
    }

    if (files.length) {
      html += '<div class="tiles">' + files.map(function (f) { return fileTile(f, code, writable, isNL); }).join('') + '</div>';
    } else if (!subs.length && !writable) {
      /* Only for a visitor. For the club itself the drop zone above already
         says the place is empty, and says what to do about it. */
      html += '<div class="empty-state"><div class="empty-state__title">Nothing here yet</div></div>';
    }

    html += '</div></div>';   // .fold__body, .fold

    el('viewClub').innerHTML = html;
    NL.clubs.wireCrestImgs(el('viewClub'));   // thumb → full → rose, same tick as insertion
    wireClub(code, writable);
  }

  /* The eye reaches what can be shown without anyone else involved: images,
     PDFs, video and audio are the browser's own abilities; Word is rendered
     by vendored code below. Spreadsheets and the rest download instead. */
  /* Word previews render CLIENT-SIDE (programme/_vendor/ — docx-preview +
     its JSZip dependency), because the zero-effort routes are Microsoft's
     and Google's embedded viewers, which work by handing the file's URL to a
     third party to fetch — a club's material shipped to someone else for a
     convenience. Rendering here, the bytes never leave Firebase. The two
     scripts load lazily on the first Word preview, never on page load.
     Only .docx: the 2003 binary .doc format needs Word itself. */
  function isDocx(f) {
    return String(f.contentType || '').toLowerCase() ===
      'application/vnd.openxmlformats-officedocument.wordprocessingml.document' ||
      /\.docx$/i.test(String(f.name || ''));
  }

  var docxVendor = null;
  function loadDocxVendor() {
    if (docxVendor) return docxVendor;
    docxVendor = ['/programme/_vendor/jszip.min.js', '/programme/_vendor/docx-preview.min.js']
      .reduce(function (chain, src) {
        return chain.then(function () {
          return new Promise(function (resolve, reject) {
            var s = document.createElement('script');
            s.src = src;
            s.onload = resolve;
            s.onerror = function () { reject(new Error('The document viewer did not load.')); };
            document.head.appendChild(s);
          });
        });
      }, Promise.resolve())
      .catch(function (e) {
        docxVendor = null;   // a network blip must not wedge every later preview
        throw e;
      });
    return docxVendor;
  }

  function canPreview(f) {
    var kind = PP.fileKind(f.contentType, f.name);
    if (!f.url) return false;
    if (kind === 'pdf' || kind === 'video' || kind === 'audio') return true;
    if (kind === 'doc') return isDocx(f);
    /* An image needs a source the browser can actually show — a rendered
       medium, a renderable original, or a legacy record with no stored type
       (the old benefit of the doubt). A PSD's eye used to open a modal with
       a broken image in it; now it simply offers Download instead. */
    return kind === 'image' &&
      !!(f.mediumUrl || PP.previews.renderable(f.contentType) || !f.contentType);
  }

  function preview(code, fileId) {
    var f = (FILES[code] || {})[fileId];
    if (!f || !canPreview(f)) return;
    var kind = PP.fileKind(f.contentType, f.name);

    var body, surface = ' prev--doc';
    if (kind === 'image') {
      /* The medium tier (1600px long edge), not the original: a preview's job
         is "is this the one?", which a 20MB file answers no better than a
         400KB one. Download below is the untouched original. Files without a
         medium (small enough not to need one, or uploaded before previews
         existed) show the original, which is what this always did. */
      body = '<img src="' + esc(f.mediumUrl || f.url) + '" alt="' + esc(f.name) + '" class="prev__img">';
      surface = '';
    } else if (kind === 'video') {
      /* The browser's own player. preload="metadata" fetches the header and
         a first frame, not the file — bytes stream only when someone presses
         play. A codec the browser can't play shows its native failure state,
         and Download is right below either way. */
      body = '<video class="prev__video" controls preload="metadata" src="' + esc(f.url) + '"></video>';
      surface = '';
    } else if (kind === 'audio') {
      body = '<audio class="prev__audio" controls preload="metadata" src="' + esc(f.url) + '"></audio>';
    } else if (kind === 'doc') {
      /* Rendered into this node after the modal opens — see below. */
      body = '<div class="prev__docx" id="prevDocx">Preparing the document…</div>';
    } else {
      /* An <iframe> hands the PDF to the browser's own viewer. Some mobile
         browsers have none and will offer a download instead — which is the
         same thing the Download button does, so the fallback is harmless.

         The fragment is what stops it looking like a print dialog. Left alone,
         Chrome and Edge wrap the page in their reader: a floating toolbar, page
         controls and a dark grey surround, which is the exact furniture of a
         print preview and reads as one. toolbar/navpanes/scrollbar strip it,
         FitH sizes the page to the width it has been given, so what is left is
         the document. These are Adobe's open parameters — Chrome and Edge
         honour them, Firefox and Safari largely ignore them and show their own
         viewer, which is no worse than today. The download URL already carries
         a query string, so this has to be a fragment and not another param. */
      body = '<iframe src="' + esc(f.url) + '#toolbar=0&navpanes=0&scrollbar=0&view=FitH"' +
        ' class="prev__frame" title="' + esc(f.name) + '"></iframe>';
    }

    NL.modal({
      title: f.name,
      width: 'wide',
      body: '<div class="prev' + surface + '">' + body + '</div>',
      buttons: [
        { label: 'Close', className: 'btn--ghost', onClick: function (c) { c.close(); } },
        { label: 'Download', className: 'btn--primary', autofocus: true, onClick: function () {
            /* The file already lives at a URL, so this opens it rather than
               rebuilding it as a Blob — and it is audited like any other
               download, because it is one. */
            PP.audit('download', { club: code, detail: f.name });
            window.open(f.url, '_blank');
          } }
      ]
    });

    if (kind === 'doc') {
      /* Viewer scripts, then bytes, then render — all after the modal is up,
         so the wait happens behind "Preparing" rather than a dead eye
         button. Every failure lands in the same place: the modal stays
         useful because Download is already there. */
      loadDocxVendor()
        .then(function () { return fetch(f.url); })
        .then(function (r) {
          if (!r.ok) throw new Error('fetch ' + r.status);
          return r.blob();
        })
        .then(function (blob) {
          var host = el('prevDocx');
          if (!host || !document.body.contains(host)) return;   // modal already closed
          host.textContent = '';
          return window.docx.renderAsync(blob, host);
        })
        .catch(function () {
          var host = el('prevDocx');
          if (host && document.body.contains(host)) {
            host.textContent = 'This document couldn’t be previewed here — Download opens it in Word.';
          }
        });
    }
  }

  /* A picture library shown as pictures. Clicking a tile selects it — the file
     manager convention — and downloading is an explicit button, so a stray
     click never starts one. */
  /* The canon sprite, as markup rather than an element. NL.icon() returns a
     built SVG node, which is no use inside a string of HTML — the Style Guide
     documents this exact <use> form as the other way to reach the same sheet,
     so this is the shared icon set, not a local one. */
  function iconHtml(name) {
    return '<svg class="icon icon--sm" aria-hidden="true">' +
      '<use href="/assets/icons/sprites.svg#icon-' + name + '"></use></svg>';
  }

  function fileTile(f, code, writable, isNL) {
    var kind = PP.fileKind(f.contentType, f.name);
    /* Thumb first — a 170px tile must not cost a 20MB download. Without one
       (uploaded before previews existed, or generation failed) fall back to
       the original, but only when an <img> can actually show it: a PSD or
       TIFF used to sit here as a broken image. A record with no stored type
       predates canonicalisation — give it the old benefit of the doubt. */
    var artSrc = null;
    if (kind === 'image' && f.url) {
      artSrc = f.thumbUrl ||
        ((PP.previews.renderable(f.contentType) || !f.contentType) ? f.url : null);
    }
    var art = artSrc
      ? '<img src="' + esc(artSrc) + '" alt="" loading="lazy">'
      : '<span class="tile__icon" aria-hidden="true">' + PP.kindIcon(kind) + '</span>';
    return '<div class="tile' + (sel[f.id] ? ' is-picked' : '') + '" tabindex="0" role="button"' +
      ' data-pick="' + esc(f.id) + '" aria-pressed="' + (sel[f.id] ? 'true' : 'false') + '"' +
      ' title="' + esc(f.name + ' \u00b7 ' + PP.humanSize(f.size)) + '">' +
      '<input type="checkbox" class="tile__check" tabindex="-1" aria-hidden="true"' +
        (sel[f.id] ? ' checked' : '') + '>' +
      '<div class="tile__art">' + art + '</div>' +
      '<div class="tile__body">' +
        '<div class="tile__name">' + esc(f.name) + '</div>' +
        /* Icons, not words. Two labelled buttons did not fit a 170px tile and
           overlapped each other; the eye and the down-arrow are the canon
           sprite's own and read at a glance. Both keep a title and an
           aria-label, so nothing is lost to anyone reading the page rather
           than looking at it. The size takes the space the words were
           wasting — it is the first thing anyone asks of a file they are
           about to pull down. */
        '<div class="tile__acts">' +
          '<span class="tile__size">' + esc(PP.humanSize(f.size)) + '</span>' +
          (canPreview(f)
            ? '<button class="tile__act" data-prev="' + esc(f.id) + '"' +
                ' title="Preview" aria-label="Preview ' + esc(f.name) + '">' +
                iconHtml('eye') + '</button>'
            : '') +
          '<a class="tile__act" href="' + esc(f.url || '#') + '" download target="_blank" rel="noopener"' +
            ' data-dl="' + esc(f.id) + '" title="Download" aria-label="Download ' + esc(f.name) + '">' +
            iconHtml('download') + '</a>' +
        '</div>' +
      '</div></div>';
  }

  /* ── Wiring ───────────────────────────────────────────────────────────── */

  function wireClub(code, writable) {
    var root = el('viewClub');

    Array.prototype.forEach.call(root.querySelectorAll('[data-go]'), function (b) {
      b.onclick = function () {
        if (b.getAttribute('data-go') === 'dir') navigate(null, null);
        else navigate(code, null);
      };
    });
    Array.prototype.forEach.call(root.querySelectorAll('[data-crumb]'), function (b) {
      b.onclick = function () { navigate(code, b.getAttribute('data-crumb')); };
    });
    Array.prototype.forEach.call(root.querySelectorAll('[data-open]'), function (b) {
      b.onclick = function (e) {
        /* The ⋯ button and the select tick both live inside the folder and
           both handle themselves — opening on top of either would make the
           folder impossible to tick without leaving the page you ticked from. */
        if (e.target.closest('[data-menu], [data-pickdir]')) return;
        navigate(code, b.getAttribute('data-open'));
      };
      if (b.classList.contains('folder')) {
        b.onkeydown = function (e) {
          if (e.target.closest('[data-menu], [data-pickdir]')) return;
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); b.onclick(e); }
        };
        b.oncontextmenu = function (e) {
          e.preventDefault();
          openMenu(code, b.getAttribute('data-open'), e.clientX, e.clientY);
        };
      }
    });
    Array.prototype.forEach.call(root.querySelectorAll('[data-menu]'), function (b) {
      b.onclick = function (e) {
        e.stopPropagation();
        var r = b.getBoundingClientRect();
        openMenu(code, b.getAttribute('data-menu'), r.left, r.bottom + 4);
      };
    });
    Array.prototype.forEach.call(root.querySelectorAll('[data-zip]'), function (b) {
      b.onclick = function () {
        /* __club = this club's whole pack. There is deliberately no way to
           zip more than one club: the directory has no bulk action at all. */
        var id = b.getAttribute('data-zip');
        downloadZip(code, id === '__club' ? null : id);
      };
    });

    /* Everything above and below this point works on ANY club's folder.
       Selecting, downloading and auditing a download are things a visitor
       does — which is the whole product — so none of it may sit behind the
       write check. It did, which meant selection was dead on 72 of the 73
       folders anyone can open. */
    Array.prototype.forEach.call(root.querySelectorAll('[data-pick]'), function (b) {
      function toggle(e) {
        /* The Download link lives inside the tile — a click on it must not
           also flip the selection. */
        if (e.target.closest('a, button')) return;
        var id = b.getAttribute('data-pick');
        if (sel[id]) delete sel[id]; else sel[id] = true;
        render();
      }
      b.onclick = toggle;
      b.onkeydown = function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(e); }
      };
    });
    Array.prototype.forEach.call(root.querySelectorAll('[data-pickdir]'), function (b) {
      /* stopPropagation, not just a guard on the tile handler: the checkbox
         sits inside the folder, and without this a tick would also open it. */
      b.onclick = function (e) { e.stopPropagation(); };
      b.onchange = function (e) {
        e.stopPropagation();
        var id = b.getAttribute('data-pickdir');
        if (selDir[id]) delete selDir[id]; else selDir[id] = true;
        render();
      };
    });
    var all = el('selAll');
    if (all) all.onchange = function () {
      var want = all.checked;
      sel = {}; selDir = {};
      if (want) {
        filesFor(code, view.folderId).forEach(function (f) { sel[f.id] = true; });
        childrenOf(code, view.folderId).forEach(function (f) { selDir[f.id] = true; });
      }
      render();
    };
    var clear = el('selClear');
    if (clear) clear.onclick = function () { sel = {}; selDir = {}; render(); };
    var zipSel = el('selZip'); if (zipSel) zipSel.onclick = function () { downloadSelected(code); };

    /* A single-file download is a plain <a download>, so it never passed
       through JS and never appeared in the audit — the most common action in
       the tool was the one action nobody could see. The link still does the
       downloading; this only records it, and deliberately does not
       preventDefault so a failed write can never block the download. */
    Array.prototype.forEach.call(root.querySelectorAll('[data-prev]'), function (b) {
      b.onclick = function (e) { e.stopPropagation(); preview(code, b.getAttribute('data-prev')); };
    });
    Array.prototype.forEach.call(root.querySelectorAll('[data-dl]'), function (a) {
      a.addEventListener('click', function () {
        var f = (FILES[code] || {})[a.getAttribute('data-dl')];
        if (f) PP.audit('download', { club: code, detail: f.name });
      });
    });

    var add = el('addFolder');
    if (add) add.onclick = function () { newFolder(code, view.folderId); };

    /* ---- Owner-only from here ---- */
    if (!writable) return;

    var ren = el('renameFolder'); if (ren) ren.onclick = function () { renameFolder(code); };
    var del = el('deleteFolder'); if (del) del.onclick = function () { deleteFolder(code, view.folderId); };
    var moveSel = el('selMove'); if (moveSel) moveSel.onclick = function () { moveSelected(code); };
    var rmSel = el('selRemove'); if (rmSel) rmSel.onclick = function () { removeSelected(code); };

    Array.prototype.forEach.call(root.querySelectorAll('[data-del]'), function (b) {
      b.onclick = function () { removeFile(code, b.getAttribute('data-del')); };
    });

    var drop = el('drop'), input = el('fileInput');
    if (drop) {
      drop.onclick = function () { input.click(); };
      drop.onkeydown = function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); input.click(); } };
      input.onchange = function () { uploadAll(code, input.files); input.value = ''; };
    }
    wireDrag(root, code);
  }

  /* Drag-and-drop, aimed. The whole folder surface takes a drop, and every
     subfolder tile on it takes one more precisely - so a batch of stills goes
     straight into Squad Photos without opening it first, the way a desktop
     file manager behaves. Whichever target the pointer is over is the one
     highlighted, so there is never a question of where the files will land.

     One listener on the surface rather than one per tile: dragleave fires
     again for every child element the pointer crosses, and per-tile listeners
     turn that into a counter nobody can keep balanced. Here the target is read
     off the event, and the surface has genuinely been left only when the
     pointer's destination is outside it. */
  function wireDrag(root, code) {
    var body = root.querySelector('.fold__body');
    if (!body || !canWrite(code)) return;   // a club you can only read takes no drops
    var over = null;

    /* Ignore drags carrying no files - a text selection, an image dragged from
       another tab - so the surface never lights up for something it cannot
       accept. */
    function hasFiles(e) {
      var t = (e.dataTransfer || {}).types || [];
      return Array.prototype.indexOf.call(t, 'Files') !== -1;
    }
    function tileFor(e) {
      return e.target && e.target.closest ? e.target.closest('[data-open]') : null;
    }
    function mark(e) {
      var tile = tileFor(e);
      if (tile === over) return;
      if (over) over.classList.remove('is-over');
      over = tile;
      if (over) over.classList.add('is-over');
      body.classList.toggle('is-over', !over);
    }
    function clear() {
      if (over) over.classList.remove('is-over');
      over = null;
      body.classList.remove('is-over');
    }

    body.addEventListener('dragover', function (e) {
      if (!hasFiles(e)) return;
      e.preventDefault();                       // without this the drop never fires
      e.dataTransfer.dropEffect = 'copy';
      mark(e);
    });
    body.addEventListener('dragleave', function (e) {
      if (!body.contains(e.relatedTarget)) clear();   // null when leaving the window
    });
    body.addEventListener('drop', function (e) {
      if (!hasFiles(e)) return;
      e.preventDefault();
      var tile = tileFor(e);
      clear();
      var into = tile ? tile.getAttribute('data-open') : (view.folderId || PP.ROOT_FOLDER);
      /* webkitGetAsEntry has to be called while the drop event is still live —
         dataTransfer.items are emptied the moment it returns — so the entries
         are collected here, synchronously, and walked afterwards. */
      var entries = entriesFrom(e.dataTransfer);
      if (!entries.length) { uploadAll(code, e.dataTransfer.files, into); return; }
      /* The level a folder created by this drop would occupy. trail() is empty
         at the club root, so that is level 0; dropping onto a subfolder tile is
         one deeper than the folder being looked at. */
      var base = trail(code, view.folderId).length;
      ingestDrop(code, entries, into, tile ? base + 1 : base);
    });
  }

  /* ── Dropping a folder ────────────────────────────────────────────────
     dataTransfer.files reports a dropped directory as a zero-byte File with no
     type, so the obvious code uploads a useless 0-byte "asset" named after the
     folder and throws its contents away. The entry API is the only way to see
     that an item is a directory and walk into it, so a dropped tree arrives as
     a tree: folders created, files filed inside them.

     A folder whose name already exists at that level is reused rather than
     duplicated, the way copying into a folder on a desktop merges. */
  function entriesFrom(dt) {
    var items = dt && dt.items ? Array.prototype.slice.call(dt.items) : [];
    var out = [];
    items.forEach(function (it) {
      var entry = it.webkitGetAsEntry ? it.webkitGetAsEntry() : null;
      if (entry) out.push(entry);
    });
    /* No entry API (or nothing resolved): the caller falls back to .files,
       which is right for loose files and is the best available for a folder. */
    return out.some(function (e) { return e.isDirectory; }) ? out : [];
  }

  /* readEntries returns at most 100 at a time and signals the end with an
     empty batch. Calling it once silently truncates a folder of 150 stills. */
  function readAll(reader) {
    return new Promise(function (resolve, reject) {
      var all = [];
      (function next() {
        reader.readEntries(function (batch) {
          if (!batch.length) return resolve(all);
          all = all.concat(Array.prototype.slice.call(batch));
          next();
        }, reject);
      })();
    });
  }

  function fileOf(entry) {
    return new Promise(function (resolve, reject) { entry.file(resolve, reject); });
  }

  function ingestDrop(code, entries, into, level) {
    /* Folders created during this walk are not in FOLDERS yet — the RTDB
       listener has not fired — so the run keeps its own index, or two
       subfolders of the same name would each create a folder. */
    var made = {}, counts = { files: 0, folders: 0, flattened: 0 };

    function folderFor(parentId, name) {
      name = String(name || 'Folder').slice(0, 60);
      var key = parentId + '/' + name.toLowerCase();
      if (made[key]) return Promise.resolve(made[key]);

      var existing = childrenOf(code, parentId === PP.ROOT_FOLDER ? null : parentId)
        .filter(function (f) { return f.name.toLowerCase() === name.toLowerCase(); })[0];
      if (existing) { made[key] = existing.id; return Promise.resolve(existing.id); }

      var rec = { name: name, createdAt: PP.TS() };
      if (parentId !== PP.ROOT_FOLDER) rec.parentId = parentId;
      var id = PP.ref('folders/' + code).push().key;
      made[key] = id;
      counts.folders++;
      return PP.ref('folders/' + code + '/' + id).set(rec).then(function () { return id; });
    }

    /* `level` is the depth index a folder created here would occupy, and the
       library allows 0..MAX_DEPTH-1. Past that the tree is flattened into the
       deepest folder that fits rather than the drop being refused — the club
       would otherwise have to reorganise on their own machine and try again —
       and the toast admits it happened. */
    function walk(list, parentId, level) {
      return list.reduce(function (chain, entry) {
        return chain.then(function () {
          if (entry.isFile) {
            return fileOf(entry).then(function (f) {
              counts.files++;
              enqueueUpload(code, parentId, f);
            }).catch(function () { /* unreadable entry — skip it, not the batch */ });
          }
          if (!entry.isDirectory) return null;
          if (level >= MAX_DEPTH) {
            counts.flattened++;
            return readAll(entry.createReader()).then(function (kids) {
              return walk(kids, parentId, level);      // same place, no new folder
            });
          }
          return folderFor(parentId, entry.name).then(function (id) {
            return readAll(entry.createReader()).then(function (kids) {
              return walk(kids, id, level + 1);
            });
          });
        });
      }, Promise.resolve());
    }

    NL.toast('Reading folder\u2026', 'info');
    walk(entries, into, level)
      .then(function () {
        if (!counts.files && !counts.folders) { NL.toast('Nothing to upload in there', 'info'); return; }
        NL.toast(counts.files + ' file' + (counts.files === 1 ? '' : 's') +
          (counts.folders ? ' into ' + counts.folders + ' folder' + (counts.folders === 1 ? '' : 's') : ''),
          'success');
        /* Its own toast, and not a success one. Flattening loses the structure
           the club built, so it cannot ride along as a clause at the end of a
           green message nobody reads to the end. */
        if (counts.flattened) {
          NL.toast(counts.flattened + ' folder' + (counts.flattened === 1 ? ' was' : 's were') +
            ' deeper than ' + MAX_DEPTH + ' levels \u2014 their files came in flat', 'error');
        }
        PP.audit('upload-folder', { club: code,
          detail: counts.files + ' file(s), ' + counts.folders + ' folder(s)' });
      })
      .catch(function (e) { NL.toast('Could not read that folder: ' + e.message, 'error'); });
  }

  /* ── Bulk actions on a selection ──────────────────────────────────────── */

  function pickedFiles(code) {
    return filesFor(code, view.folderId).filter(function (f) { return sel[f.id]; });
  }

  function pickedDirs(code) {
    return childrenOf(code, view.folderId).filter(function (f) { return selDir[f.id]; });
  }

  /* A picked folder brings everything under it, filed under its own name, the
     way dragging a folder onto a desktop does. Picked loose files sit at the
     top of the archive. */
  function downloadSelected(code) {
    var list = pickedFiles(code).map(function (f) { return { file: f, path: '' }; });
    pickedDirs(code).forEach(function (d) {
      list = list.concat(collectFiles(code, d.id, PP.safeName(d.name) + '/'));
    });
    if (!list.length) return;
    var here = folderById(code, view.folderId);
    zipFrom(list, (here ? here.name : code) + ' selection');
  }

  /* Moving is a metadata change only — the file record's folderId. The bytes
     stay exactly where they are, because the Storage path is keyed on the
     folder the file was uploaded to and re-pathing would mean a copy, a delete
     and a window where the file is in neither place. Nothing in the UI reads
     the folder out of the storage path, so they are free to disagree. */
  function moveSelected(code) {
    var picked = pickedFiles(code);
    var dirs = pickedDirs(code);
    if (!picked.length && !dirs.length) return;
    var here = view.folderId || PP.ROOT_FOLDER;

    /* A folder cannot land inside itself or anything under it, and whatever it
       carries has to still fit inside MAX_DEPTH — a branch pushed past the
       limit falls off foldersFor's walk and resurfaces as an orphan at the top,
       which reads to the club as "my folder moved somewhere random". Both are
       settled by removing those targets from the list, so the dialog cannot
       offer a move it would then have to refuse. */
    var barred = {}, headroom = 0;
    dirs.forEach(function (d) {
      subtree(code, d.id).forEach(function (id) { barred[id] = true; });
      headroom = Math.max(headroom, subtreeHeight(code, d.id));
    });

    var options = [{ id: PP.ROOT_FOLDER, name: clubName(code), depth: -1 }]
      .concat(foldersFor(code))
      .filter(function (f) {
        if (f.id === here || barred[f.id]) return false;
        return !dirs.length || f.depth + 1 + headroom <= MAX_DEPTH - 1;
      });
    if (!options.length) { NL.toast('There is nowhere else to move them yet', 'info'); return; }

    var what = [
      dirs.length ? dirs.length + ' folder' + (dirs.length === 1 ? '' : 's') : '',
      picked.length ? picked.length + ' file' + (picked.length === 1 ? '' : 's') : ''
    ].filter(Boolean).join(' and ');

    NL.modal({
      title: 'Move ' + what,
      size: 'sm',
      body: '<div class="form-group"><label for="mvTo">Move to</label><select id="mvTo">' +
        options.map(function (f) {
          /* Non-breaking spaces so the tree shape survives inside <option>. */
          var pad = new Array(f.depth + 2).join('\u00a0\u00a0\u00a0');
          return '<option value="' + esc(f.id) + '">' + pad + esc(f.name) + '</option>';
        }).join('') + '</select></div>',
      buttons: [
        { label: 'Cancel', className: 'btn--ghost', onClick: function (c) { c.close(); } },
        { label: 'Move', className: 'btn--primary', autofocus: true, onClick: function (c) {
            var to = document.getElementById('mvTo').value;
            var where = to === PP.ROOT_FOLDER ? clubName(code)
                                              : ((folderById(code, to) || {}).name || to);
            /* Files carry folderId, folders carry parentId — and a folder at
               the top has no parentId at all rather than the '_root' sentinel.
               That key belongs to files, whose records would otherwise need a
               null that every read has to special-case. */
            var fileUpdates = {}, dirUpdates = {};
            picked.forEach(function (f) { fileUpdates[f.id + '/folderId'] = to; });
            dirs.forEach(function (d) {
              dirUpdates[d.id + '/parentId'] = to === PP.ROOT_FOLDER ? null : to;
            });

            var jobs = [];
            if (picked.length) jobs.push(PP.ref('files/' + code).update(fileUpdates));
            if (dirs.length) jobs.push(PP.ref('folders/' + code).update(dirUpdates));

            Promise.all(jobs).then(function () {
              PP.audit('move', { club: code, detail: what + ' → ' + where });
              NL.toast('Moved ' + what, 'success');
              sel = {}; selDir = {};
              c.close();
            }).catch(function (e) { NL.toast('Could not move: ' + e.message, 'error'); });
          } }
      ]
    });
  }

  function removeSelected(code) {
    var picked = pickedFiles(code);
    if (!picked.length) return;
    NL.confirm('Remove ' + picked.length + ' file' + (picked.length === 1 ? '' : 's') +
      '? Other clubs will no longer see ' + (picked.length === 1 ? 'it' : 'them') + '.',
      { title: 'Remove files', confirmText: 'Remove', variant: 'danger' }).then(function (ok) {
        if (!ok) return;
        /* Trash first, then drop the live records — a failure part-way leaves a
           recoverable copy rather than nothing. */
        var trash = {}, live = {};
        picked.forEach(function (f) {
          var rec = {}; for (var k in f) if (k !== 'id') rec[k] = f[k];
          rec.deletedAt = PP.TS();
          trash[f.id] = rec;
          live[f.id] = null;
        });
        return PP.ref('trash/' + code).update(trash)
          .then(function () { return PP.ref('files/' + code).update(live); })
          .then(function () {
            PP.audit('remove', { club: code, detail: picked.length + ' file(s)' });
            NL.toast('Removed ' + picked.length + ' file' + (picked.length === 1 ? '' : 's'), 'success');
            sel = {}; selDir = {};
          });
      }).catch(function (e) { NL.toast('Could not remove: ' + e.message, 'error'); });
  }

  /* ── Folder context menu ──────────────────────────────────────────────── */

  var menuEl = null;
  function closeMenu() { if (menuEl) { menuEl.remove(); menuEl = null; } }
  document.addEventListener('click', closeMenu);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeMenu(); });
  window.addEventListener('resize', closeMenu);

  function openMenu(code, folderId, x, y) {
    closeMenu();
    var f = folderById(code, folderId);
    if (!f) return;
    var inside = collectFiles(code, folderId, '');

    menuEl = document.createElement('div');
    menuEl.className = 'ctx';
    /* Delete lives here as well as in the folder's own head. Requiring someone
       to open a folder before they can remove it is a step for no reason, and
       it was the only route in — which is half of why folders felt
       undeletable. */
    menuEl.innerHTML =
      '<button class="ctx__item" data-act="open">Open</button>' +
      '<button class="ctx__item" data-act="zip"' + (inside.length ? '' : ' disabled') + '>' +
        (inside.length ? 'Download folder (' + inside.length + ' file' + (inside.length === 1 ? '' : 's') +
                         ', ' + PP.humanSize(totalBytes(inside)) + ')'
                       : 'Download folder — it\u2019s empty') + '</button>' +
      (canWrite(code)
        ? '<button class="ctx__item" data-act="del"' + (inside.length ? ' disabled' : '') + '>' +
            (inside.length ? 'Delete — empty it first' : 'Delete folder') + '</button>'
        : '');
    document.body.appendChild(menuEl);

    /* Keep it on screen when the click lands near an edge. */
    var r = menuEl.getBoundingClientRect();
    menuEl.style.left = Math.min(x, window.innerWidth - r.width - 8) + 'px';
    menuEl.style.top = Math.min(y, window.innerHeight - r.height - 8) + 'px';

    menuEl.addEventListener('click', function (e) { e.stopPropagation(); });
    menuEl.querySelector('[data-act="open"]').onclick = function () {
      closeMenu(); navigate(code, folderId);
    };
    var zip = menuEl.querySelector('[data-act="zip"]');
    if (inside.length) zip.onclick = function () { closeMenu(); downloadZip(code, folderId); };
    var del = menuEl.querySelector('[data-act="del"]');
    if (del && !inside.length) del.onclick = function () { closeMenu(); deleteFolder(code, folderId); };
  }

  /* ── Zip download ─────────────────────────────────────────────────────
     Everything at or below a folder, or the whole club pack. Files are fetched
     from their Storage download URLs and assembled in the tab — see _zip.js for
     why the archive is stored rather than deflated.

     The one thing that can stop this is CORS: a browser may only read bytes
     cross-origin if the bucket allows it. Downloading a single file never hits
     that (the browser saves it directly, the page never sees it), so the
     failure is specific to bulk download and the message says so rather than
     reporting a generic network error. */
  var ZIP_WARN_BYTES = 300 * 1024 * 1024;

  function downloadZip(code, folderId) {
    var list = collectFiles(code, folderId, '');
    var label = folderId ? (folderById(code, folderId) || {}).name : clubName(code);
    zipFrom(list, label);
  }

  /* list: [{ file, path }] — path is the folder prefix inside the archive. */
  function zipFrom(list, label) {
    if (!list.length) { NL.toast('Nothing to download', 'info'); return; }
    var bytes = totalBytes(list);

    var go = bytes < ZIP_WARN_BYTES ? Promise.resolve(true) : NL.confirm(
      'That\u2019s ' + PP.humanSize(bytes) + ' across ' + list.length + ' files. It has to download ' +
      'to this tab before the zip is built, which will take a while and use that much memory. Carry on?',
      { title: 'Large download', confirmText: 'Download' });

    go.then(function (ok) {
      if (!ok) return;
      NL.toast('Preparing ' + list.length + ' file' + (list.length === 1 ? '' : 's') + '\u2026', 'info');
      var taken = {}, entries = [];

      /* Sequential rather than parallel: sixty concurrent requests to Storage
         is a good way to get throttled, and the wait is dominated by bytes
         rather than round trips. */
      var chain = list.reduce(function (p, item) {
        return p.then(function () {
          return fetch(item.file.url).then(function (r) {
            if (!r.ok) throw new Error('HTTP ' + r.status + ' fetching ' + item.file.name);
            return r.arrayBuffer();
          }).then(function (buf) {
            entries.push({
              name: PPZip.uniqueName(item.path + PP.safeName(item.file.name), taken),
              data: new Uint8Array(buf),
              date: item.file.uploadedAt
            });
          });
        });
      }, Promise.resolve());

      return chain.then(function () {
        NL.download(PP.safeName(label) + '.zip', PPZip.build(entries), 'application/zip');
        NL.toast('Downloaded ' + entries.length + ' file' + (entries.length === 1 ? '' : 's'), 'success');
        PP.audit('download-zip', { club: view.club, detail: label + ' (' + entries.length + ' files)' });
      });
    }).catch(function (e) {
      console.error('[programme] zip', e);
      var cors = e instanceof TypeError;   // fetch rejects with TypeError on a CORS block
      NL.alert(cors
        ? 'Bulk download is blocked by the storage bucket\u2019s CORS settings, which have to allow ' +
          'nl.tools to read files. Downloading files one at a time still works. Please tell the ' +
          'National League \u2014 it is a one-off setting, not a problem with your club\u2019s files.'
        : 'Could not build the download: ' + (e.message || e),
        { title: 'Download failed' });
    });
  }

  /* ── Folder actions ───────────────────────────────────────────────────── */

  function newFolder(code, parentId) {
    var inside = parentId ? (foldersFor(code).filter(function (f) { return f.id === parentId; })[0] || {}).name : '';
    NL.prompt('Folder name', {
      title: inside ? 'New folder inside ' + inside : 'New folder',
      placeholder: 'e.g. Action Images'
    }).then(function (name) {
      name = (name || '').trim();
      if (!name) return;
      var rec = { name: name.slice(0, 60), createdAt: PP.TS() };
      if (parentId) rec.parentId = parentId;
      var id = PP.ref('folders/' + code).push().key;
      return PP.ref('folders/' + code + '/' + id).set(rec).then(function () {
        /* Deliberately does NOT move you into the new folder. It used to set
           view.folderId directly, which is the one thing this file says nothing
           may do: navigate() owns the view, and assigning behind its back left
           the hash and the breadcrumb still reading "root" while view.folderId
           had become the new folder. The next New folder then landed inside the
           last one - Adverts, then Crests, and Crests came out inside Adverts.
           Making a folder is not the same as opening it, here or on a desktop. */
        PP.audit('folder-create', { club: code, detail: (inside ? inside + ' › ' : '') + rec.name });
        NL.toast('Folder added', 'success');
      });
    }).catch(function (e) { NL.toast('Could not add folder: ' + e.message, 'error'); });
  }

  function renameFolder(code) {
    var f = foldersFor(code).filter(function (x) { return x.id === view.folderId; })[0];
    if (!f) return;
    NL.prompt('Folder name', { title: 'Rename folder', default: f.name }).then(function (name) {
      if (!name || name === f.name) return;
      return PP.ref('folders/' + code + '/' + f.id + '/name').set(String(name).slice(0, 60))
        .then(function () {
          PP.audit('folder-rename', { club: code, detail: f.name + ' → ' + name });
          NL.toast('Folder renamed', 'success');
        });
    }).catch(function (e) { NL.toast('Could not rename: ' + e.message, 'error'); });
  }

  /* A folder can go when nothing would be lost with it - no files anywhere at
     or below it. Empty subfolders go too, rather than "delete the folders
     inside it first", a chore the tool can perfectly well do itself and which
     left folders undeletable for a reason the page never showed. Only files
     block a delete, because only files are something to lose. */
  function blockedBy(code, id) {
    var n = collectFiles(code, id, '').length;
    return n ? n + ' file' + (n === 1 ? '' : 's') + ' inside' : null;
  }

  function deleteFolder(code, folderId) {
    var f = folderById(code, folderId);
    if (!f) return;
    var why = blockedBy(code, folderId);
    /* Name the obstacle: "Empty the folder first" does not say where to look
       when the files are two folders further down. */
    if (why) { NL.toast('“' + f.name + '” still has ' + why, 'error'); return; }

    var tree = subtree(code, folderId);          // itself, plus every folder under it
    var extra = tree.length - 1;
    NL.confirm('Delete the folder “' + esc(f.name) + '”' +
      (extra ? ' and ' + extra + ' empty folder' + (extra === 1 ? '' : 's') + ' inside it' : '') + '?',
      { title: 'Delete folder', html: true, confirmText: 'Delete', variant: 'danger' })
      .then(function (ok) {
        if (!ok) return;
        var updates = {};
        tree.forEach(function (id) { updates[id] = null; });
        return PP.ref('folders/' + code).update(updates).then(function () {
