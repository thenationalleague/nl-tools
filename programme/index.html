          /* Move only if the folder you were standing in has just gone, and
             then to its parent rather than the club root. Deleting a subfolder
             from its menu while standing above it should not move you at all. */
          if (tree.indexOf(view.folderId) !== -1) navigate(code, f.parentId || null);
          PP.audit('folder-delete', { club: code,
            detail: f.name + (extra ? ' (+' + extra + ' empty)' : '') });
          NL.toast('Folder deleted', 'success');
        });
      }).catch(function (e) { NL.toast('Could not delete: ' + e.message, 'error'); });
  }

  /* ── Upload ───────────────────────────────────────────────────────────── */

  /* folderId is explicit because a drop can be aimed at a subfolder the club is
     only looking at rather than standing in. Absent, it means here. */
  function uploadAll(code, fileList, folderId) {
    var target = folderId || view.folderId || PP.ROOT_FOLDER;
    var elsewhere = target !== (view.folderId || PP.ROOT_FOLDER)
      ? (folderById(code, target) || {}).name : null;
    Array.prototype.forEach.call(fileList, function (file) { enqueueUpload(code, target, file); });
    /* Progress rows appear under the drop zone, not inside the folder the files
       are heading for, so say where they are going. */
    if (elsewhere) NL.toast('Uploading to ' + elsewhere, 'info');
  }

  function uploadOne(code, folderId, file) {
    if (file.size > PP.MAX_BYTES) {
      NL.toast(file.name + ' is over ' + PP.humanSize(PP.MAX_BYTES), 'error');
      return Promise.resolve();
    }
    var settle;
    var done = new Promise(function (r) { settle = r; });
    var fileId = PP.ref('files/' + code).push().key;
    var path = PP.storagePath(code, folderId, fileId, file.name);

    var row = document.createElement('div');
    row.className = 'up-row';
    row.innerHTML = '<span class="up-row__name">' + esc(file.name) + '</span>' +
      '<span class="up-row__bar"><span class="up-row__fill"></span></span>';
    var uploads = el('uploads');
    if (uploads) uploads.appendChild(row);
    var fill = row.querySelector('.up-row__fill');

    /* Not file.type: on Windows a .zip arrives as application/x-zip-compressed,
       which the Storage rule refused. PP.uploadType canonicalises by extension
       so the rule sees application/zip and the download behaves later. */
    var type = PP.uploadType(file);
    var task = PP.storageRef(path).put(file, {
      contentType: type,
      cacheControl: 'public,max-age=3600'
    });

    /* Previews render while the original uploads, so the record lands already
       carrying its thumb/medium URLs and a tile never has to pull the full
       file. A hung decode must not hang the upload: 20s and it ships without
       previews, which the console's Generate previews button can add later. */
    var madePreviews = Promise.race([
      PP.previews.make(file, type),
      new Promise(function (r) { setTimeout(function () { r(null); }, 20000); })
    ]).catch(function () { return null; });

    task.on('state_changed', function (snap) {
      var pct = snap.totalBytes ? snap.bytesTransferred / snap.totalBytes : 0;
      fill.style.transform = 'scaleX(' + pct + ')';
    }, function (err) {
      row.remove();
      /* storage/unauthorized is almost never "you are not signed in" here — the
         session got this far. It is the rule refusing the file, and the caller
         deserves to know which of its terms it fell foul of. */
      NL.toast(err && err.code === 'storage/unauthorized'
        ? file.name + ' was refused (' + type + ', ' + PP.humanSize(file.size) + ')'
        : 'Upload failed: ' + err.message, 'error');
      settle();
    }, function () {
      /* Store the download URL on the record at upload time. Rendering a
         folder otherwise means one getDownloadURL round-trip per file, which
         is what makes a 60-file folder feel broken. Preview URLs are stored
         alongside for the same reason. Their upload waits here so the record
         is written once, complete — never a flash of 20MB tile art. */
      var previewFields = madePreviews.then(function (made) {
        if (!made) return {};
        return PP.previews.store(code, fileId, made).catch(function () { return {}; });
      });
      Promise.all([task.snapshot.ref.getDownloadURL(), previewFields]).then(function (got) {
        return PP.ref('files/' + code + '/' + fileId).set(Object.assign({
          name: file.name.slice(0, 160),
          folderId: folderId,
          size: file.size,
          contentType: type,
          storagePath: path,
          url: got[0],
          uploadedAt: PP.TS()
        }, got[1]));
      }).then(function () {
        row.remove();
        PP.audit('upload', { club: code, detail: file.name });
        settle();
      }).catch(function (err) {
        row.remove();
        NL.toast('Could not save ' + file.name + ': ' + err.message, 'error');
        settle();
      });
    });
    return done;
  }

  /* ── Upload queue ─────────────────────────────────────────────────────
     A dropped folder can be two hundred stills. Firing two hundred
     simultaneous Storage puts gets every one of them slower and the browser's
     own connection limit turns the progress list into a wall of stalled bars.
     Four at a time finishes sooner and looks like it is working. */
  var UP_MAX = 4;
  var upQueue = [], upActive = 0;

  function upPump() {
    while (upActive < UP_MAX && upQueue.length) {
      upActive++;
      upQueue.shift()().then(upNext, upNext);
    }
  }
  function upNext() { upActive--; upPump(); }
  function enqueueUpload(code, folderId, file) {
    upQueue.push(function () { return uploadOne(code, folderId, file); });
    upPump();
  }

  /* ── Remove (soft) ────────────────────────────────────────────────────
     Clubs cannot delete bytes — Storage rules deny delete to anything but a
     '*' session. Removing moves the RTDB record into trash/<CODE>/, so the
     file leaves every view immediately and the NL console can restore it.
     That matters most in exactly this pre-portal window, where a passcode is
     shared and nothing is attributable to a named person. */
  function removeFile(code, fileId) {
    var rec = (FILES[code] || {})[fileId];
    if (!rec) return;
    NL.confirm('Remove “' + esc(rec.name) + '”? Other clubs will no longer see it.',
      { title: 'Remove file', html: true, confirmText: 'Remove', variant: 'danger' }).then(function (ok) {
        if (!ok) return;
        var copy = Object.assign({}, rec, { deletedAt: PP.TS() });
        return PP.ref('trash/' + code + '/' + fileId).set(copy)
          .then(function () { return PP.ref('files/' + code + '/' + fileId).remove(); })
          .then(function () {
            PP.audit('remove', { club: code, detail: rec.name });
            NL.toast('File removed', 'success');
          });
      }).catch(function (e) { NL.toast('Could not remove: ' + e.message, 'error'); });
  }

})();
</script>
</body>
</html>
