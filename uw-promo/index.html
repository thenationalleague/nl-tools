<!DOCTYPE html>
<html lang="en">
<head>
<!--
  UW Promo Codes — Utility Warehouse partner page
  Version: v7.5 (09/09/2026) — canon pass (audit + owner). Phone blowout
           fixed at the ROOT: canon .toolbar__right now wraps (nl-brand
           v2.67, ?v=64 lockstep) — this page's five-action strip was
           propping the page open sideways, sliding the content out from
           under the sticky idbar. Dead local .toolbar media patch and the
           stale wordmark comment deleted; sign-out wrapped in
           .nl-idbar__actions; action cells use canon .ta-right; the
           chip-group drops its width:max-content so it can shrink in a
           phone modal. .alloc-row/.byclub CSS deduped into _shared.css,
           gate button width becomes .gate__btn, method editor becomes the
           shared UWP.editMethodModal, date stamp UWP.dateStamp.
  Version: v7.4 (09/09/2026) — add-codes offers IN-STORE clubs only (owner
           ruling: an online club's codes come from its own uploads, an
           unassigned club has nowhere to redeem — the v42 "NL may have
           reasons" marking is overruled). The method picker becomes the
           canon chip-group segmented control — its old row class only
           existed on the club page, so the buttons here had no spacing.
  Version: v7.3 (09/09/2026) — the resume path can no longer strand the
           gate: any failure (including a cached _shared.js that predates
           UWP.resume) falls back to the passcode form. /uw-promo/* joins
           _headers no-cache — the same lesson /programme/* recorded.
  Version: v7.2 (09/09/2026) — the dashboard remembers its session: the
           gate resumes from a stored credential on load ("Signing you back
           in…"), and Sign out forgets it. Till behaviour unchanged — this
           page never had one.
  Version: v7.1 (09/09/2026) — methods editor redesigned (owner feedback,
           mid-walkthrough): the method reads as a semantic pill, Edit is
           the standard glyph, and picking a different method lays out the
           consequences (shared UWP.methodConsequences) in an amber banner
           with the single danger button beneath — the inline row editor
           and the thin confirm are gone.
  Version: v7.0 (09/09/2026) — the two redemption methods part ways (owner
           feedback round 2). The code list splits into In-store / Online
           tabs — stats, breakdown, filters and export all follow, and each
           tab carries only its own verbs (Add codes is central, Requests
           chase online clubs, Revoke never appears on a club-uploaded
           code). "Mark fulfilled" is gone: request state is derived from
           the uploads answering it (UWP.reqFace). Batches and labels are
           gone everywhere — codes added together share one server
           timestamp, and that date stamp is the grouping. "Club routes"
           becomes "Redemption methods" with ceremony: read-only until
           Edit, explicit choices, and a warning confirm before a change.
  Version: v6.1 (09/09/2026) — the requests list shows upload progress
           ("3 of 5 uploaded"): club uploads now carry the id of the request
           they answer, so Lucy can see how a request is going before
           deciding it is fulfilled.
  Version: v6.0 (09/09/2026) — spec v43.0: the request/dispatch lifecycle.
           New Requests modal (raise against online-route clubs, qty + due
           date prefilled a week out, mark fulfilled by hand — a human
           closing the loop beats a heuristic) and a bulk Dispatch flow: tick
           active undispatched codes, confirm, and dispatchedAt/dispatchedBy
           land in one multi-update with an audit entry. Pills show the
           issued/dispatched faces. Club routes modal can now change a set
           route (spec §4: reversal is an NL/UW admin act; existing codes are
           never touched).
  Version: v5.0 (03/09/2026) — routes (spec v42.0): the club dropdown marks
           online and not-activated clubs so a central batch lands on the
           in-store route it belongs to, and central codes past 12 months
           show a derived Expired state in the pills, filter and count cards.
  Version: v4.5 (16/08/2026) — crest strings come from canon
           NL.clubs.crestImgHtml('thumb') with a NL.clubs.wireCrestImgs sweep
           after each render (UWP.crestImgHtml is gone — _shared.js v3.3).
           Sizing moved to CSS (.byclub__item img here, .club-cell img in
           _shared.css). Same thumb → full → rose degrade, no inline onerror.
  Version: v4.2 (15/08/2026) — the context header bar is canon now (.nl-idbar, nl-brand.css v2.37).
           Pure rename — the local .hbar was the same rules under a different
           name, and .hbar already meant a histogram bar in
           commercial-benchmarking. Nothing renders differently.
           The partner wordmark moves onto the canon .gate__lockup /
           .nl-idbar__lockup, so the two local size overrides go.
  Version: v4.0 (10/08/2026) — the partner passcode is checked server-side by
           the uwPromoAuth trigger, not in this browser, and config is no
           longer readable here: the club dropdown arrives in the grant with
           names and divisions only. The ?u= link no longer skips the gate —
           it never granted anything, and there is nothing left client-side to
           check it against.
  Version: v3.0 (06/08/2026) — registered-to-a-club model. Every code is now
           created against exactly one club — chosen from a required dropdown,
           one club per batch — and can only ever be redeemed there. "Paste a
           list of codes" is the default entry method (generating is the
           fallback) and generated codes are plain 6-character, no hyphen. The
           big count cards obey the club filter, so picking a club shows that
           club's pool, redeemed and revoked totals. The "Redeemed at" column
           is now simply "Club" — it is the registered club, redeemed or not.
  Version: v2.2 (23/07/2026) — UW wordmark properly sized on the gate
           (~280px, was the shared 64px logo slot) and header (36px tall,
           natural width); "Redeemed by" → "Redeemed at" in column/filter/
           prompts.
  Version: v2.1 (23/07/2026) — codes are now 8 characters, grouped XXXX-XXXX
           (norm matching means the dash never has to be typed). Gate + header
           show the Utility Warehouse wordmark (assets/partners/Utility
           Warehouse.png, NL rose fallback).
  Version: v2.0 (23/07/2026) — pool model rebuild. Codes are no longer
           allocated to clubs: UW adds codes to a central pool (generate
           6-char or paste their own list, optional batch label) and issues
           them to customers; a club claims a code by redeeming it at the
           till. This panel shows every code with which club redeemed it and
           when, a redemptions-by-club breakdown, revoke (unredeemed only)
           and release-back-to-pool (redeemed, requires a reason). Sandbox
           mode via ?env=test.
  Version: v1.0 (23/07/2026) — initial build (allocate-to-club model).
  File: /uw-promo/index.html

  Standalone (NO auth-guard) — external-partner page on the footage-CDN model:
  named Firebase app + anonymous auth (see _shared.js), trust-level passcode
  gate validated against RTDB app-data/uw-promo/config. NL master console is
  at /uw-promo/admin/, the club till page at /uw-promo/club/.
-->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NL × Utility Warehouse — Promo Codes</title>
  <!-- Favicons. Static, not injected: nl-topbar.js adds these too, but a
       standalone page never loads it, and an icon that arrives with the JS
       leaves the tab blank until it does. /favicon.ico at the root is the
       backstop every browser asks for without being told. -->
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/favicon-16x16.png">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
<link rel="stylesheet" href="/system/nl-brand.css?v=64">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="/uw-promo/_shared.js"></script>
<!-- Canon helpers (NL.toast/confirm/modal/csv/clubs…). Loaded after the named
     app so the nl-utils audit hook self-skips (no default app on this page). -->
<script src="/system/nl-utils.js?v=47"></script>
<link rel="stylesheet" href="/uw-promo/_shared.css">
<style>
  /* .alloc-row / .byclub live in _shared.css — both consoles render them. */
</style>
</head>
<body>

<!-- Loading / passcode gate -->
<div class="gate" id="gate">
  <div class="gate__card" id="gateCard">
    <img class="gate__lockup" src="/assets/partners/Utility%20Warehouse.png" alt="Utility Warehouse"
         onerror="this.onerror=null;this.src='/assets/crests/National%20League%20rose.png';">
    <div class="gate__title">Promo Codes</div>
    <div class="gate__sub" id="gateSub">Loading…</div>
    <div id="gateForm" style="display:none">
      <input class="gate__input" id="gateInput" maxlength="6" placeholder="••••••" autocomplete="off" aria-label="Partner passcode">
      <div class="gate__err" id="gateErr" role="alert"></div>
      <button class="btn btn--primary gate__btn" id="gateBtn">Open dashboard</button>
    </div>
  </div>
</div>

<!-- UW dashboard -->
<div id="app" style="display:none">
  <div class="nl-idbar">
    <img class="nl-idbar__lockup" src="/assets/partners/Utility%20Warehouse.png" alt="Utility Warehouse"
         onerror="this.onerror=null;this.src='/assets/crests/National%20League%20rose.png';">
    <div class="nl-idbar__id">
      <div class="nl-idbar__title">Promo Codes</div>
      <div class="nl-idbar__sub">Utility Warehouse partner dashboard</div>
    </div>
    <div class="nl-idbar__actions"><button class="nl-idbar__btn" id="signout">Sign out</button></div>
  </div>

  <div class="wrap">
    <div class="tabs" id="methodTabs">
      <button class="tab active" data-mtab="instore">In-store codes</button>
      <button class="tab" data-mtab="online">Online codes</button>
    </div>

    <div class="stats" id="stats"></div>

    <div class="byclub">
      <div class="byclub__title">Redeemed by club <span class="byclub__note">(redeemed / registered)</span></div>
      <div id="byClubBody" class="byclub__grid"></div>
    </div>

    <div class="toolbar">
      <div class="toolbar__left">
        <select class="toolbar__filter" id="fClub" aria-label="Filter by club"></select>
        <select class="toolbar__filter" id="fStatus" aria-label="Filter by status">
          <option value="">All statuses</option>
          <option value="active">Unredeemed</option>
          <option value="redeemed">Redeemed</option>
          <option value="revoked">Revoked</option>
          <option value="expired">Expired</option>
        </select>
        <input class="toolbar__search" id="fSearch" type="search" placeholder="Search codes…" aria-label="Search codes">
      </div>
      <div class="toolbar__right">
        <button class="btn btn--ghost" id="btnRequests" hidden>Requests</button>
        <button class="btn btn--ghost" id="btnRoutes">Redemption methods</button>
        <button class="btn btn--navy" id="btnDispatch" hidden>Mark dispatched (<span id="dispN">0</span>)</button>
        <button class="btn btn--ghost" id="btnExport">Export CSV</button>
        <button class="btn btn--primary" id="btnAdd">Add codes</button>
      </div>
    </div>

    <div class="table-wrap">
      <table class="table">
        <thead><tr>
          <th></th><th>Code</th><th>Status</th><th>Club</th><th>Redeemed</th><th>Added</th><th></th>
        </tr></thead>
        <tbody id="rows"><tr class="loading-row"><td colspan="7">Loading codes…</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';

  var ACTOR = 'uw', ACTOR_LABEL = 'Utility Warehouse';
  var SS_KEY = 'uwPromoUwPass' + (UWP.isTest ? ':test' : '');

  var CLUBS = [];             // from the grant — code/name/division/route, no credentials
  var REQS = {};              // code requests (spec v43 §5.1)
  var CODES = {};             // id -> record
  var codesLoaded = false, unlocked = false;

  function esc(s) { return NL.escHtml(s); }
  function toast(m, t) { NL.toast(m, t || 'info'); }

  /* ── Gate ───────────────────────────────────────────────────────────
     The passcode is no longer compared here — it goes to the uwPromoAuth
     trigger, which checks it server-side and returns a scoped token. `config`
     is not readable by this page any more, so the club list for the dropdown
     comes back in the grant (names and divisions only; UW never needs a
     credential and must not be handed 72 of them).

     The ?u= link no longer opens the dashboard on its own — it never granted
     anything, but it used to skip the gate, and there is nothing client-side
     left to check it against. It still works as a bookmark. */
  function boot() {
    /* A remembered credential signs itself back in (owner ruling: the till
       asks every visit, the laptop consoles do not). The gate only renders
       once resume has come back empty. */
    document.getElementById('gateSub').textContent = 'Signing you back in…';
    /* Whatever resume does — including not existing, when a cached copy of
       _shared.js predates it — the worst case must be the gate, never a
       page stuck mid-sentence. */
    Promise.resolve().then(function () { return UWP.resume('uw'); })
      .then(function (session) {
        if (session && session.role === 'uw') {
          CLUBS = session.clubs || [];
          unlock();
          return;
        }
        showGate();
      })
      .catch(function () { showGate(); });
  }

  function showGate() {
    document.getElementById('gateSub').textContent =
      'Enter the partner passcode provided by the National League.';
    document.getElementById('gateForm').style.display = 'block';
    var inp = document.getElementById('gateInput'), err = document.getElementById('gateErr'),
        btn = document.getElementById('gateBtn');
    inp.focus();

    var busyGate = false;
    function submit() {
      if (busyGate) return;
      var typed = (inp.value || '').trim();
      if (!typed) { err.textContent = 'Enter the passcode.'; return; }
      busyGate = true;
      err.textContent = '';
      btn.disabled = true;
      btn.textContent = 'Checking…';       // Eventarc — seconds, not instant
      UWP.signIn(typed).then(function (session) {
        if (session.role !== 'uw') {
          busyGate = false; btn.disabled = false; btn.textContent = 'Open dashboard';
          err.textContent = 'That passcode is not for this dashboard.';
          return;
        }
        if (UWP.remember) UWP.remember('uw', typed);
        CLUBS = session.clubs || [];
        unlock();
      }).catch(function (e) {
        busyGate = false;
        btn.disabled = false;
        btn.textContent = 'Open dashboard';
        err.textContent = e.message || 'Passcode not recognised.';
      });
    }
    btn.onclick = submit;
    inp.onkeydown = function (e) { if (e.key === 'Enter') submit(); };
  }
  boot();

  function unlock() {
    unlocked = true;
    document.getElementById('gate').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    /* Codes are only readable once the session exists, so subscribe now
       rather than at page load. */
    UWP.ref('codes').on('value', function (s) {
      CODES = s.val() || {};
      codesLoaded = true;
      render();
    });
    UWP.ref('requests').on('value', function (s) { REQS = s.val() || {}; });
    buildClubFilter();
    render();
  }

  document.getElementById('signout').addEventListener('click', function () {
    if (UWP.forget) UWP.forget('uw');
    location.reload();
  });

  /* ── Clubs helper (the grant's list drives the filter and the dropdown) ─ */
  function clubList() {
    return CLUBS.slice().sort(function (a, b) {
      return (a.division || '').localeCompare(b.division || '') || a.name.localeCompare(b.name);
    });
  }

  function buildClubFilter() {
    var sel = document.getElementById('fClub');
    var prev = sel.value;
    var byDiv = {}, order = [];
    clubList().forEach(function (c) {
      if (!byDiv[c.division]) { byDiv[c.division] = []; order.push(c.division); }
      byDiv[c.division].push(c);
    });
    var html = '<option value="">All clubs</option>' +
      // Codes created before v3.0 carry no club — findable, so NL can register
      // them to one retrospectively from the master console.
      '<option value="__none">Not yet registered to a club</option>';
    order.forEach(function (d) {
      html += '<optgroup label="' + esc(d || 'Clubs') + '">';
      byDiv[d].forEach(function (c) { html += '<option value="' + esc(c.code) + '">' + esc(c.name) + '</option>'; });
      html += '</optgroup>';
    });
    sel.innerHTML = html;
    sel.value = prev || '';
  }

  /* The club filter is the one filter the big count cards also obey: every
     code belongs to a club now, so "in pool / redeemed / revoked" is only a
     meaningful number once you've said whose pool you mean. Status and search
     stay table-only — they'd make the per-status cards self-referential. */
  function clubFiltered() {
    var club = document.getElementById('fClub').value;
    return codeRows().filter(function (r) { return matchesClub(r, club); });
  }
  function matchesClub(r, club) {
    if (!club) return true;
    if (club === '__none') return !r.club;
    return r.club === club;
  }
  function clubFilterLabel() {
    var sel = document.getElementById('fClub');
    if (!sel.value) return '';
    return sel.options[sel.selectedIndex] ? sel.options[sel.selectedIndex].text : '';
  }

  /* ── Render ─────────────────────────────────────────────────────────── */
  /* Which redemption method a code belongs to falls out of who made it:
     clubs upload their own (online), UW/NL create centrally (in-store).
     The whole page views the pool through one method tab at a time — mixed
     rows meant mixed verbs (revoke exists for central codes only, "issued"
     is a club act) and nobody could read the table cleanly. */
  var TAB = 'instore';
  function isOnlineCode(r) { return String((r && r.createdBy) || '').indexOf('club:') === 0; }

  function codeRows() {
    return Object.keys(CODES).map(function (k) {
      var r = CODES[k]; r._id = k; return r;
    }).filter(function (r) { return isOnlineCode(r) === (TAB === 'online'); })
      .sort(function (a, b) { return (b.createdAt || 0) - (a.createdAt || 0); });
  }

  function filtered() {
    var club = document.getElementById('fClub').value;
    var status = document.getElementById('fStatus').value;
    var q = (document.getElementById('fSearch').value || '').toUpperCase().trim();
    return codeRows().filter(function (r) {
      if (!matchesClub(r, club)) return false;
      if (status && UWP.statusOf(r) !== status) return false;
      if (q && (r.code || '').toUpperCase().indexOf(q) === -1) return false;
      return true;
    });
  }

  /* Every code belongs to a club now, so this reads redeemed-out-of-issued
     per club rather than a bare redemption tally. Deliberately NOT club-
     filtered — it's the cross-club view you use to decide what to filter to. */
  function renderByClub(all) {
    var by = {}, order = [];
    all.forEach(function (r) {
      if (!r.clubName) return;
      if (!by[r.clubName]) { by[r.clubName] = { total: 0, redeemed: 0 }; order.push(r.clubName); }
      by[r.clubName].total++;
      if (r.status === 'redeemed') by[r.clubName].redeemed++;
    });
    order.sort(function (a, b) { return by[b].redeemed - by[a].redeemed || a.localeCompare(b); });
    var el = document.getElementById('byClubBody');
    if (!order.length) {
      el.innerHTML = '<span class="byclub__empty">No codes registered to a club yet — use “Add codes”.</span>';
      return;
    }
    el.innerHTML = order.map(function (name) {
      return '<span class="byclub__item">' + NL.clubs.crestImgHtml(name, 'thumb') + esc(name) +
        ' <span class="byclub__count">' + by[name].redeemed + '</span>' +
        '<span class="byclub__of">/ ' + by[name].total + '</span></span>';
    }).join('');
    NL.clubs.wireCrestImgs(el);   // thumb → full → rose, same tick as insertion
  }

  function render() {
    if (!codesLoaded) return;
    var all = codeRows();
    var scope = clubFiltered(), label = clubFilterLabel();
    var counts = { total: scope.length, active: 0, redeemed: 0, revoked: 0, expired: 0 };
    scope.forEach(function (r) { var st = UWP.statusOf(r); if (counts[st] != null) counts[st]++; });
    var suffix = label ? ' · ' + esc(label) : '';
    document.getElementById('stats').innerHTML =
      '<div class="stat"><div class="stat__num">' + counts.total + '</div><div class="stat__label">Codes in pool' + suffix + '</div></div>' +
      '<div class="stat stat--info"><div class="stat__num">' + counts.active + '</div><div class="stat__label">Unredeemed</div></div>' +
      '<div class="stat stat--approved"><div class="stat__num">' + counts.redeemed + '</div><div class="stat__label">Redeemed</div></div>' +
      '<div class="stat stat--expired"><div class="stat__num">' + counts.revoked + '</div><div class="stat__label">Revoked</div></div>' +
      '<div class="stat stat--expired"><div class="stat__num">' + counts.expired + '</div><div class="stat__label">Expired</div></div>';

    renderByClub(all);

    var list = filtered();
    var tbody = document.getElementById('rows');
    if (!list.length) {
      tbody.innerHTML = '<tr class="empty-row"><td colspan="7">' +
        (all.length ? 'No codes match the current filters.' : TAB === 'online' ? 'No club-uploaded codes yet.' : 'No codes in the pool yet — use “Add codes” to get started.') + '</td></tr>';
      return;
    }
    tbody.innerHTML = list.map(function (r) {
      var acts = '';
      /* Club-uploaded codes are never revoked (owner ruling 09/09/2026):
         the club's own POS is the authority on whether they work. NL master
         keeps typed-DELETE for genuine mistakes; that is removal, not
         revocation. */
      if (r.status === 'active' && !isOnlineCode(r)) {
        acts = '<button class="btn btn--danger btn--sm" data-revoke="' + esc(r._id) + '">Revoke</button>';
      } else if (r.status === 'redeemed') {
        acts = '<button class="btn btn--restore btn--sm" data-release="' + esc(r._id) + '">Release</button>';
      }
      // The club a code is REGISTERED to — shown whether or not it's redeemed.
      // Blank only for codes created before v3.0, which belong to no club.
      var clubCell = r.clubName
        ? '<span class="club-cell">' + NL.clubs.crestImgHtml(r.clubName, 'thumb') +
          '<span class="club-cell__name">' + esc(r.clubName) + '</span></span>'
        : '<span class="code-note">Not registered</span>';
      /* §5.2: Lucy works a monthly batch — dispatch is a bulk tick, offered
         only where it means something (an undispatched, unredeemed code). */
      var canDispatch = r.status === 'active' && !r.dispatchedAt && !UWP.isExpired(r);
      return '<tr' + (r.status === 'revoked' ? ' class="is-revoked"' : '') + '>' +
        '<td>' + (canDispatch
          ? '<input type="checkbox" class="disp-tick" data-disp="' + esc(r._id) + '" aria-label="Select for dispatch">'
          : '') + '</td>' +
        '<td><span class="code-mono">' + esc(r.code) + '</span> ' +
          '<button class="code-copy" data-copy="' + esc(r.code) + '" title="Copy code" aria-label="Copy code">⧉</button></td>' +
        '<td' + (r.dispatchedAt ? ' title="Dispatched ' + esc(UWP.fmt(r.dispatchedAt)) + '"' : '') + '>' +
          UWP.pillFor(UWP.faceOf(r)) + '</td>' +
        '<td>' + clubCell + '</td>' +
        '<td>' + esc(r.status === 'redeemed' ? UWP.fmt(r.redeemedAt) : '—') + '</td>' +
        '<td title="' + esc(UWP.fmt(r.createdAt)) + '">' + esc(UWP.ago(r.createdAt)) + '</td>' +
        '<td class="ta-right">' + acts + '</td></tr>';
    }).join('');
    NL.clubs.wireCrestImgs(tbody);   // thumb → full → rose, same tick as insertion
  }

  /* Tab switch: Add codes is a central (in-store) act, Requests chase
     online clubs — each button lives on its own tab. */
  document.getElementById('methodTabs').addEventListener('click', function (e) {
    var b = e.target.closest('[data-mtab]');
    if (!b) return;
    TAB = b.getAttribute('data-mtab');
    Array.prototype.forEach.call(document.querySelectorAll('#methodTabs .tab'), function (t) {
      t.classList.toggle('active', t === b);
    });
    document.getElementById('btnAdd').hidden = TAB !== 'instore';
    document.getElementById('btnRequests').hidden = TAB !== 'online';
    render();
    refreshDispatchBtn();   // ticked rows left with the other tab's render
  });

  ['fClub', 'fStatus'].forEach(function (id) {
    document.getElementById(id).addEventListener('change', render);
  });
  document.getElementById('fSearch').addEventListener('input', render);
  // Browsers restore <select> values across reloads — start clean.
  document.getElementById('fStatus').value = '';
  document.getElementById('fSearch').value = '';

  /* ── Row actions (delegated — survives innerHTML re-renders) ────────── */
  document.getElementById('rows').addEventListener('click', function (e) {
    var cp = e.target.closest('[data-copy]');
    if (cp) { NL.copy(cp.getAttribute('data-copy')); return; }
    var rv = e.target.closest('[data-revoke]');
    if (rv) { revokeCode(rv.getAttribute('data-revoke')); return; }
    var rl = e.target.closest('[data-release]');
    if (rl) { releaseCode(rl.getAttribute('data-release')); }
  });

  function revokeCode(id) {
    var r = CODES[id];
    if (!r || r.status !== 'active') { toast('Only unredeemed codes can be revoked.', 'error'); return; }
    NL.confirm('Revoke ' + r.code + '?', {
      title: 'Revoke code',
      detail: 'The code becomes invalid — a club entering it at the till will be told it’s no longer valid.',
      variant: 'danger', confirmText: 'Revoke'
    }).then(function (ok) {
      if (!ok) return;
      UWP.ensureAuth().then(function () {
        return UWP.ref('codes/' + id).update({
          status: 'revoked', revokedAt: UWP.TS(), revokedBy: ACTOR
        });
      }).then(function () {
        UWP.audit(ACTOR, ACTOR_LABEL, 'revoke', { codes: r.code });
        toast('Code revoked', 'success');
      }).catch(function (err) { toast('Revoke failed: ' + err.message, 'error'); });
    });
  }

  /* Release a redeemed code — un-redeems it so the club can use it again
     (mistake at the till). It stays REGISTERED to the same club: as of v3.0
     the club a code belongs to is fixed at creation, so a release rewinds the
     redemption, not the registration. Requires a reason — recorded on the
     code and in the audit trail. */
  function releaseCode(id) {
    var r = CODES[id];
    if (!r || r.status !== 'redeemed') return;
    NL.prompt('Release ' + r.code + '? It was redeemed at ' +
      (r.clubName || 'a club') + ' on ' + UWP.fmt(r.redeemedAt) +
      '. It goes back to being unredeemed and stays registered to ' + (r.clubName || 'that club') +
      '. Reason (recorded in the audit trail):', {
      title: 'Release code', placeholder: 'e.g. Entered at the wrong till', multiline: true
    }).then(function (reason) {
      if (reason == null) return;
      reason = reason.trim();
      if (!reason) { toast('A reason is required.', 'error'); return; }
      UWP.ensureAuth().then(function () {
        return UWP.ref('codes/' + id).update({
          status: 'active', redeemedAt: null, redeemedBy: null,
          releasedAt: UWP.TS(), releasedBy: ACTOR, releaseReason: reason, releasedFrom: r.clubName || null
        });
      }).then(function () {
        UWP.audit(ACTOR, ACTOR_LABEL, 'release', { club: r.club, clubName: r.clubName, codes: r.code, detail: reason });
        toast('Code released — unredeemed, still registered to ' + (r.clubName || 'its club'), 'success');
      }).catch(function (err) { toast('Release failed: ' + err.message, 'error'); });
    });
  }

  /* ── Add codes to the pool ──────────────────────────────────────────── */
  document.getElementById('btnAdd').addEventListener('click', openAdd);

  /* Add codes — one club per batch, always. The club dropdown is required and
     there is deliberately no "all clubs" or multi-select option: a code is
     redeemable only at the club it is registered to, so registering a batch
     to two clubs would have no coherent meaning. Do 25 for Hartlepool, then
     25 for Sutton. Paste is the default; generating is the fallback. */
  function openAdd() {
    var clubs = clubList();
    if (!clubs.length) {
      toast('No clubs are set up yet — the National League needs to seed the roster first.', 'error');
      return;
    }
    /* Central codes are the in-store method's supply, full stop (owner
       ruling 09/09/2026 — "shouldn't be able to"): an online club's codes
       come from its own uploads against requests, and an unassigned club
       has nowhere to redeem anything, so neither is offered at all. */
    var instore = clubs.filter(function (c) { return c.route === 'instore'; });
    if (!instore.length) {
      toast('No club is on the in-store method yet — codes are added for in-store clubs only.', 'error');
      return;
    }
    var byDiv = {}, order = [];
    instore.forEach(function (c) {
      if (!byDiv[c.division]) { byDiv[c.division] = []; order.push(c.division); }
      byDiv[c.division].push(c);
    });
    var clubOpts = '<option value="">Choose a club…</option>' + order.map(function (d) {
      return '<optgroup label="' + esc(d || 'Clubs') + '">' + byDiv[d].map(function (c) {
        return '<option value="' + esc(c.code) + '">' + esc(c.name) + '</option>';
      }).join('') + '</optgroup>';
    }).join('');

    var wrap = document.createElement('div');
    wrap.innerHTML =
      '<div class="alloc-row"><label for="alClub">Club — required, one club per batch</label>' +
        '<select id="alClub">' + clubOpts + '</select></div>' +
      '<div class="alloc-row"><label for="alStyle">Codes</label><select id="alStyle">' +
        '<option value="paste">Paste a list of codes</option>' +
        '<option value="gen">Generate codes for me</option>' +
      '</select></div>' +
      '<div class="alloc-row" id="alPasteRow"><label for="alPaste">Codes — one per line</label>' +
        '<textarea id="alPaste" rows="6" placeholder="CODEONE&#10;CODETWO"></textarea></div>' +
      '<div class="alloc-row" id="alQtyRow" style="display:none"><label for="alQty">How many</label>' +
        '<input id="alQty" type="number" min="1" max="500" value="25"></div>' +
      '<div class="alloc-preview" id="alPreview"></div>';

    var ctrl = NL.modal({
      title: 'Add codes for a club',
      body: wrap,
      buttons: [
        { label: 'Cancel', className: 'btn--ghost', onClick: function (c) { c.close(); } },
        { label: 'Add codes', className: 'btn--primary', onClick: function () { doAdd(); } }
      ]
    });

    var elClub = wrap.querySelector('#alClub'), elStyle = wrap.querySelector('#alStyle'),
        elQty = wrap.querySelector('#alQty'), elPaste = wrap.querySelector('#alPaste');

    function refresh() {
      var paste = elStyle.value === 'paste';
      wrap.querySelector('#alQtyRow').style.display = paste ? 'none' : 'block';
      wrap.querySelector('#alPasteRow').style.display = paste ? 'block' : 'none';
      wrap.querySelector('#alPreview').innerHTML = paste
        ? 'Any format — codes are matched ignoring spaces, dashes and case. Up to 500 per batch.'
        : 'Generated codes are 6 characters, no dash — e.g. <span class="code-mono">7F3K9C</span>.';
    }
    elStyle.addEventListener('input', refresh);
    refresh();

    function doAdd() {
      var club = null;
      clubs.forEach(function (c) { if (c.code === elClub.value) club = c; });
      if (!club) { toast('Choose the club these codes are for.', 'error'); return; }

      var existing = {};
      Object.keys(CODES).forEach(function (k) {
        existing[CODES[k].norm || UWP.normCode(CODES[k].code)] = true;
      });

      var codes;
      if (elStyle.value === 'paste') {
        codes = (elPaste.value || '').split(/\r?\n/).map(function (l) { return l.trim().toUpperCase(); })
          .filter(function (l) { return l; })
          .filter(function (l, i, arr) { return arr.findIndex(function (x) { return UWP.normCode(x) === UWP.normCode(l); }) === i; });
        if (!codes.length) { toast('Paste at least one code.', 'error'); return; }
        if (codes.length > 500) { toast('Maximum 500 codes per batch.', 'error'); return; }
        var dupes = codes.filter(function (c) { return existing[UWP.normCode(c)]; });
        if (dupes.length) { toast('Already in the system: ' + dupes.slice(0, 3).join(', ') + (dupes.length > 3 ? '…' : ''), 'error'); return; }
      } else {
        var qty = parseInt(elQty.value, 10);
        if (!(qty >= 1 && qty <= 500)) { toast('Quantity must be between 1 and 500.', 'error'); return; }
        try { codes = UWP.genCodes(qty, '', existing); }
        catch (e) { toast(e.message, 'error'); return; }
      }
      NL.confirm('Add ' + codes.length + ' code' + (codes.length > 1 ? 's' : '') +
        ' for ' + club.name + '?\nThey can only be redeemed at ' + club.name + '.', {
        title: 'Confirm', confirmText: 'Add codes'
      }).then(function (ok) {
        if (!ok) return;
        /* No batch concept any more (owner ruling 09/09/2026): every code in
           one add shares an identical server createdAt, so the date stamp IS
           the grouping. */
        var updates = {};
        codes.forEach(function (code) {
          updates[UWP.ref('codes').push().key] = {
            code: code, norm: UWP.normCode(code), status: 'active',
            club: club.code, clubName: club.name,
            createdAt: UWP.TS(), createdBy: ACTOR
          };
        });
        UWP.ensureAuth().then(function () {
          return UWP.ref('codes').update(updates);
        }).then(function () {
          UWP.audit(ACTOR, ACTOR_LABEL, 'add-codes', {
            count: codes.length, club: club.code, clubName: club.name,
            codes: codes.slice(0, 10).join(', ') + (codes.length > 10 ? ' …' : '')
          });
          ctrl.close();
          showGenerated(codes, club);
        }).catch(function (err) { toast('Adding codes failed: ' + err.message, 'error'); });
      });
    }
  }

  function showGenerated(codes, club) {
    var body = '<p class="confirm-text">' + codes.length + ' code' + (codes.length > 1 ? 's' : '') +
      ' registered to <strong>' + esc(club.name) + '</strong>, ready to issue to customers. ' +
      'They will only work at ' + esc(club.name) + '.</p>' +
      '<div class="gen-list">' + codes.map(esc).join('\n') + '</div>';
    NL.modal({
      title: 'Codes added',
      body: body,
      buttons: [
        { label: 'Copy all', className: 'btn--ghost', onClick: function () { NL.copy(codes.join('\n'), { ok: 'Codes copied' }); } },
        { label: 'Done', className: 'btn--primary', autofocus: true, onClick: function (c) { c.close(); } }
      ]
    });
  }

  /* ── CSV export ─────────────────────────────────────────────────────── */
  document.getElementById('btnExport').addEventListener('click', function () {
    var list = filtered();
    if (!list.length) { toast('Nothing to export with the current filters.', 'error'); return; }
    var rows = [['Code', 'Status', 'Club', 'Redeemed', 'Added', 'Added by', 'Revoked']];
    list.forEach(function (r) {
      rows.push([r.code, (UWP.STATUS[r.status] || {}).label || r.status,
        r.clubName || r.club || '',
        r.redeemedAt ? UWP.fmt(r.redeemedAt) : '',
        UWP.fmt(r.createdAt), r.createdBy || '',
        r.revokedAt ? UWP.fmt(r.revokedAt) : '']);
    });
    NL.download('uw-promo-codes-' + UWP.dateStamp() + '.csv', NL.csv(rows, { bom: true }), 'text/csv;charset=utf-8');
    toast('CSV exported', 'success');
  });

  /* ── Requests (spec v43 §5.1) ───────────────────────────────────────
     Lucy raises an ask against a club — a quantity and a due date — and the
     club's dashboard shows it until fulfilled. Owner rulings 09/09/2026:
     Richard can raise them too (from the master console), the due date
     prefills a week out but is editable, and overdue chasing stays internal.
     Fulfilment is marked by hand: the upload-complete email is the prompt,
     and a human closing the loop beats a heuristic guessing that codes
     uploaded the same week were these codes. */
  var UW_ACTOR = { actor: 'uw', label: 'Utility Warehouse' };

  function reqList() {
    return Object.keys(REQS).map(function (k) { var r = REQS[k]; r._id = k; return r; })
      .sort(function (a, b) { return (b.raisedAt || 0) - (a.raisedAt || 0); });
  }
  function clubName(code) {
    var hit = CLUBS.filter(function (c) { return c.code === code; })[0];
    return hit ? hit.name : code;
  }

  document.getElementById('btnRequests').addEventListener('click', openRequests);

  /* Family-promotion candidate (09/09/2026, audit): this modal and admin's
     are sibling copies already drifting (admin grew a Raised-by column).
     Second divergence promotes it to _shared.js, like editMethodModal. */
  function openRequests() {
    var list = reqList();
    var wrap = document.createElement('div');
    wrap.innerHTML =
      '<div class="alloc-row"><label for="rqClub">Ask a club for codes</label>' +
        '<select id="rqClub"><option value="">Choose a club…</option>' +
        clubList().filter(function (c) { return c.route === 'online'; }).map(function (c) {
          return '<option value="' + esc(c.code) + '">' + esc(c.name) + '</option>';
        }).join('') + '</select></div>' +
      '<div class="alloc-row" style="display:flex;gap:10px">' +
        '<span style="flex:1"><label for="rqQty">How many</label><input id="rqQty" type="number" min="1" max="500" value="5"></span>' +
        '<span style="flex:1"><label for="rqDue">Due</label><input id="rqDue" type="date"></span></div>' +
      '<button class="btn btn--primary btn--sm" id="rqRaise">Raise request</button>' +
      '<div class="table-wrap" style="margin-top:16px"><table class="table">' +
      '<thead><tr><th>Club</th><th>Codes</th><th>Due</th><th>Status</th></tr></thead><tbody>' +
      (list.length ? list.map(function (r) {
        /* Nothing on a request is pressed after raising it: the state falls
           out of the uploads that answer it (they carry the request id) —
           waiting → overdue → fulfilled → dispatched. */
        var f = UWP.reqFace(r, CODES);
        return '<tr><td>' + esc(clubName(r.club)) + '</td>' +
          '<td>' + (f.got ? f.got + ' of ' + f.qty + ' uploaded' : esc(String(r.qty))) + '</td>' +
          '<td>' + (r.due ? esc(NL.formatDate(r.due)) : '—') + '</td>' +
          '<td>' + UWP.reqPill(f.key) + '</td></tr>';
      }).join('') : '<tr class="empty-row"><td colspan="4">No requests yet.</td></tr>') +
      '</tbody></table></div>';

    // Owner ruling: due date prefilled a week out, editable.
    var d = new Date(Date.now() + 7 * 864e5);
    wrap.querySelector('#rqDue').value = d.toISOString().slice(0, 10);

    var ctrl = NL.modal({
      title: 'Code requests', width: 'wide', body: wrap,
      buttons: [{ label: 'Close', className: 'btn--ghost', onClick: function (c) { c.close(); } }]
    });

    wrap.querySelector('#rqRaise').addEventListener('click', function () {
      var code = wrap.querySelector('#rqClub').value;
      var qty = parseInt(wrap.querySelector('#rqQty').value, 10);
      var dueRaw = wrap.querySelector('#rqDue').value;
      if (!code) { toast('Choose a club.', 'error'); return; }
      if (!(qty >= 1 && qty <= 500)) { toast('Quantity must be 1–500.', 'error'); return; }
      var due = dueRaw ? new Date(dueRaw + 'T23:59:59').getTime() : null;
      UWP.ensureAuth().then(function () {
        return UWP.ref('requests').push({
          club: code, qty: qty, due: due, status: 'open',
          raisedAt: UWP.TS(), raisedBy: UW_ACTOR.actor
        });
      }).then(function () {
        UWP.audit(UW_ACTOR.actor, UW_ACTOR.label, 'request', {
          club: code, clubName: clubName(code), count: qty,
          detail: 'Requested ' + qty + ' codes' + (dueRaw ? ', due ' + dueRaw : '')
        });
        toast('Request raised — ' + clubName(code) + ' will see it on their dashboard', 'success');
        ctrl.close();
      }).catch(function (err) { toast('Failed: ' + err.message, 'error'); });
    });

  }

  /* ── Bulk dispatch (spec v43 §5.2) ──────────────────────────────────
     Distinguishes a code sitting in stock from one already in a supporter's
     inbox, and settles "I never received it". Timestamp written on marking;
     nothing manual. */
  document.getElementById('rows').addEventListener('change', function (e) {
    if (e.target.classList.contains('disp-tick')) refreshDispatchBtn();
  });
  function selectedDispatch() {
    return Array.prototype.map.call(document.querySelectorAll('.disp-tick:checked'), function (el) {
      return el.getAttribute('data-disp');
    });
  }
  function refreshDispatchBtn() {
    var n = selectedDispatch().length;
    document.getElementById('dispN').textContent = n;
    document.getElementById('btnDispatch').hidden = !n;
  }
  document.getElementById('btnDispatch').addEventListener('click', function () {
    var ids = selectedDispatch();
    if (!ids.length) return;
    NL.confirm('Mark ' + ids.length + ' code' + (ids.length === 1 ? '' : 's') + ' as dispatched?', {
      title: 'Mark dispatched',
      detail: 'Records that these codes have gone out to supporters, with today’s date. This is the audit trail for “I never received it” — it doesn’t send anything.',
      confirmText: 'Mark dispatched'
    }).then(function (ok) {
      if (!ok) return;
      var updates = {};
      ids.forEach(function (id) {
        updates[id + '/dispatchedAt'] = Date.now();
        updates[id + '/dispatchedBy'] = UW_ACTOR.actor;
      });
      UWP.ensureAuth().then(function () {
        return UWP.ref('codes').update(updates);
      }).then(function () {
        UWP.audit(UW_ACTOR.actor, UW_ACTOR.label, 'dispatch', {
          count: ids.length, detail: 'Marked dispatched (bulk)'
        });
        toast(ids.length + ' marked dispatched', 'success');
        refreshDispatchBtn();
      }).catch(function (err) { toast('Failed: ' + err.message, 'error'); });
    });
  });

  /* ── Redemption methods (spec v43 §4: reversal is NL or UW admin) ────── */
  /* A method change is rare and consequential, so it gets ceremony instead
     of a live dropdown (owner ruling 09/09/2026): the method reads as text
     until Edit is pressed, the three states are explicit buttons, and a
     different choice must survive a warning confirm before anything is
     written. */

  function methodCellHtml(c) {
    return UWP.methodPill(c.route) +
      ' <button class="code-copy" data-medit="' + esc(c.code) + '" title="Change redemption method"' +
      ' aria-label="Change redemption method for ' + esc(c.name) + '">' +
      '<svg class="icon icon--sm"><use href="/assets/icons/sprites.svg#icon-edit"></use></svg></button>';
  }

  function editMethod(code, refreshCell) {
    var club = CLUBS.filter(function (c) { return c.code === code; })[0];
    if (!club) return;
    UWP.editMethodModal({
      code: code, name: club.name, route: club.route,
      actor: UW_ACTOR.actor, actorLabel: UW_ACTOR.label,
      onDone: function (route) { club.route = route; if (refreshCell) refreshCell(); }
    });
  }

  document.getElementById('btnRoutes').addEventListener('click', function () {
    var wrap = document.createElement('div');
    wrap.innerHTML = '<p class="alloc-preview" style="margin-bottom:12px">How each club redeems ' +
      'vouchers. Changing a method never touches existing codes.</p>' +
      '<div class="table-wrap"><table class="table"><thead><tr><th>Club</th><th>Method</th></tr></thead><tbody>' +
      clubList().map(function (c) {
        return '<tr><td>' + esc(c.name) + '</td><td data-mcell="' + esc(c.code) + '" style="white-space:nowrap">' +
          methodCellHtml(c) + '</td></tr>';
      }).join('') + '</tbody></table></div>';
    var ctrl = NL.modal({
      title: 'Redemption methods', width: 'wide', body: wrap,
      buttons: [{ label: 'Close', className: 'btn--ghost', onClick: function (c) { c.close(); } }]
    });
    ctrl.body.addEventListener('click', function (e) {
      var ed = e.target.closest('[data-medit]');
      if (!ed) return;
      var code = ed.getAttribute('data-medit');
      editMethod(code, function () {
        var club = CLUBS.filter(function (c) { return c.code === code; })[0];
        var cell = ctrl.body.querySelector('[data-mcell="' + code + '"]');
        if (club && cell) cell.innerHTML = methodCellHtml(club);
      });
    });
  });

})();
</script>
</body>
</html>
