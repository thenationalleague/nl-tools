<!DOCTYPE html>
<!--
  club-kits/admin.html  v1.1 (15/08/2026)

  v1.1 (15/08/2026) — Re-open keeps the club's answers.
    The button now sets `reopened: true` on the record instead of deleting it;
    the public form pre-fills from the record and the club edits. Copy updated
    to say so, and the confirm is no longer a danger action — nothing is lost.
  Superadmin console for the club KIT COLOUR collection.
  Sibling of club-contacts/admin.html — same job, different payload.

  Tracks the collection: who has come back and who has not, a review modal per
  submission, in-place EDITING of a submitted record, a Re-open action,
  per-club printable kit sheets, and CSV / Excel / JSON exports.

  EDIT vs RE-OPEN: edit corrects a record here and stamps editedAt/editedBy,
  so a League correction stays distinguishable from what the club actually
  submitted; re-open unlocks the record so the club edits their answers.
  The RTDB rule always allowed an admin to overwrite an existing submission —
  what was missing was a way to offer the same colour choices, which is why
  the taxonomy now lives in the shared kit-colours.js.

  CSV is one row per KIT (the unit you compare when checking a fixture), with
  each garment's dominant colour FAMILY as its own column so a sheet can pivot
  on "who else plays in red". Excel (.xls) is the same grid but with every
  colour cell FILLED with its actual colour. JSON keeps the full nested
  structure.

  KIT SHEETS render the submitted colours + pattern as an actual garment, one
  club per A4 page, downloaded as a PDF through the browser's own print-to-PDF
  (document.title is swapped first so the file lands with a sensible name). Note the deliberate contrast
  with the FORM, where the same outlines are never filled: there, colouring
  would imply we capture an exact design. Here the sheet is the output and
  showing the colour is the point. Every sheet says the graphic is indicative.

  There are no per-club links any more. The form is ONE public URL whose front
  page is a club selector, so this console hands out a single link and the
  "Copy email text" button produces one message for everyone.

  RE-OPEN matters more than it used to: with no gate on the form, a club can
  be filled in by mistake or by the wrong person, and submissions are
  write-once. Re-open flags the record; the form pre-fills and the club edits.

  The form collects no submitter name or email, so the export carries no
  personal data. It still must not be committed: it is club-confidential and
  this repo is public. (See CLAUDE.md.)

  EXPORT SAFETY: exportJson whitelists fields explicitly rather than spreading
  a record, so anything added to the submission shape later has to be opted in
  before it can leave in a file.

  Each club's block also carries `legacy` — the structured kit flattened back
  to the free-text shape clubs-meta `kit` uses today ("Red/White Stripes"), so
  a merge into clubs-meta is a copy rather than a rewrite.

  Gated: no tools/ registry record on purpose -> superadmin-only via
  auth-guard's default.
-->

<script>
(function () {
  'use strict';

  var BASE = 'app-data/ops-club-kits';
  /* One public URL for every club — the form's own front page is the club
     selector, so there is no per-club link to mint any more. */
  var FORM_URL = 'https://nl.tools/club-kits/';
  var S = { clubs: [], subs: {} };

  var TPL =
    'Dear {club},\n\n' +
    'Ahead of the 2026/27 season the League is rebuilding the kit records it holds for every club, so that fixture kit clashes can be checked properly. The details we hold at the moment are patchy and largely free text.\n\n' +
    'Please complete your club\u2019s kit colours here:\n\n' +
    '{link}\n\n' +
    'Choose your club on the first page, then tell us your outfield kits (home, away and a third if you have one) and your goalkeeper kits. It takes about five minutes. Once submitted the form locks \u2014 contact us if anything needs changing afterwards.\n\n' +
    'Many thanks,\nThe National League';

  function esc(s) { return (s == null ? '' : String(s)).replace(/[&<>"']/g, function (c) {
    return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]; }); }
  function el(id) { return document.getElementById(id); }

  /* Submissions are keyed by club name directly — all 72 are unique and free
     of RTDB-illegal characters, so no slug or token indirection is needed. */
  function subFor(club) { return S.subs[club] || null; }

  var GARMENTS = [['shirt','Shirt',true], ['shorts','Shorts',false], ['socks','Socks',false]];

  /* Records are self-describing (label + hex travel with each colour), so this
     console needs no copy of the form's taxonomy. */
  function patLabel(g) {
    if (!g) return '';
    /* The form stores the human label alongside the key. Older records (if any
       predate that) fall back to prettifying the key. */
    var lab = g.patternLabel || g.detailLabel;
    if (lab) return lab;
    var key = g.pattern || g.detail || '';
    if (!key) return '';
    if (key === 'other') return String(g.patternOther || g.detailOther || 'Other');
    return key.charAt(0).toUpperCase() + key.slice(1).replace(/-/g, ' ');
  }

  /* Flatten one garment back to the free-text shape clubs-meta uses today,
     e.g. "Red/White Stripes" — so an export can be merged without a rewrite. */
  function legacyGarment(g) {
    var cs = (g && g.colours) || [];
    if (!cs.length) return '';
    var names = cs.map(function (c) { return c.label || ''; }).filter(Boolean).join('/');
    var p = patLabel(g);
    return (p && p.toLowerCase() !== 'plain') ? names + ' ' + p : names;
  }

  /* ── Kit rendering ──────────────────────────────────────────────────────
     Draws the submitted colours + pattern as an actual garment. Two jobs: it
     shows the colours far better than a hex ever will, and it is the cheapest
     QA we have on 72 clubs of self-reported data — if the picture looks wrong,
     the submission is wrong.

     Note the deliberate contrast with the FORM, where the same outlines are
     never filled: there, colouring would imply we capture an exact design.
     Here the sheet is the output, and showing the colour is the entire point.

     Faithful: plain, stripes, pinstripes, hoops, halves, quarters, sash,
     chevrons, checks, sleeves, trim, gradient. Approximated: speckle, panels,
     print, other — every sheet says so in its footer. */
  var SHAPES = {
    shirt:  'M22 7 L27.5 5 a6 5.5 0 0 0 9 0 L42 7 L57 16 L50 28 L45.5 24.5 L45.5 58 L18.5 58 L18.5 24.5 L14 28 L7 16 Z',
    shorts: 'M12 11 H52 L56 51 H37 L32 30 L27 51 H8 Z',
    socks:  'M22 6 H40 V34 Q40 41 46 45 L52 49 Q56 52 53 56 Q49 59 44 57 L33 52 Q23 47 22 38 Z'
  };
  var _svgSeq = 0;

  function kitSvg(g, kind) {
    var cs = (g && g.colours) || [];
    if (!cs.length) return '';
    var c1 = cs[0].hex || '#FFFFFF';
    var c2 = (cs[1] && cs[1].hex) || null;
    var c3 = (cs[2] && cs[2].hex) || c2;
    var key = g.pattern || g.detail || 'plain';
    var path = SHAPES[kind], uid = 'ks' + (++_svgSeq);
    var defs = '', inner = '';
    var i;

    if (c2) {
      switch (key) {
        case 'plain':
          /* Shouldn't normally reach here — the form drops Plain once a
             garment has two colours — but an older or corrected record could,
             and falling through to `default` would invent an arrangement the
             club never described. Plain means plain: show the base colour. */
          break;
        case 'stripes':
          for (i = 0; i < 7; i++) inner += '<rect x="' + (i * 9 + 4) + '" y="0" width="4.5" height="64" fill="' + ((i % 2 || !cs[2]) ? c2 : c3) + '"/>';
          break;
        case 'pinstripes':
          for (i = 0; i < 8; i++) inner += '<rect x="' + (i * 8 + 3) + '" y="0" width="1.4" height="64" fill="' + c2 + '"/>';
          break;
        case 'hoops':
          for (i = 0; i < 7; i++) inner += '<rect x="0" y="' + (i * 9 + 4) + '" width="64" height="4.5" fill="' + ((i % 2 || !cs[2]) ? c2 : c3) + '"/>';
          break;
        case 'halves':
          inner = '<rect x="32" y="0" width="32" height="64" fill="' + c2 + '"/>';
          break;
        case 'quarters':
          inner = '<rect x="32" y="0" width="32" height="32" fill="' + c2 + '"/>' +
                  '<rect x="0" y="32" width="32" height="32" fill="' + c2 + '"/>';
          break;
        case 'sash':
          inner = '<path d="M64 4 L64 22 L14 64 L-4 64 Z" fill="' + c2 + '"/>';
          break;
        case 'chevrons':
          for (i = 0; i < 4; i++) inner += '<path d="M0 ' + (i * 16 + 6) + ' L32 ' + (i * 16 + 16) + ' L64 ' + (i * 16 + 6) +
                                           ' L64 ' + (i * 16 + 12) + ' L32 ' + (i * 16 + 22) + ' L0 ' + (i * 16 + 12) + ' Z" fill="' + c2 + '"/>';
          break;
        case 'checks':
          for (i = 0; i < 64; i++) {
            var cx = i % 8, cy = Math.floor(i / 8);
            if ((cx + cy) % 2) inner += '<rect x="' + (cx * 8) + '" y="' + (cy * 8) + '" width="8" height="8" fill="' + c2 + '"/>';
          }
          break;
        case 'gradient':
          defs = '<linearGradient id="' + uid + 'g" x1="0" y1="0" x2="0" y2="1">' +
                 '<stop offset="0%" stop-color="' + c1 + '"/><stop offset="100%" stop-color="' + c2 + '"/></linearGradient>';
          inner = '<rect x="0" y="0" width="64" height="64" fill="url(#' + uid + 'g)"/>';
          break;
        case 'sleeves':
          /* Sleeve boxes sit outside the shirt body; the clip keeps them shaped. */
          inner = '<rect x="0" y="0" width="18.5" height="64" fill="' + c2 + '"/>' +
                  '<rect x="45.5" y="0" width="18.5" height="64" fill="' + c2 + '"/>';
          break;
        case 'speckle':
          for (i = 0; i < 26; i++) inner += '<circle cx="' + ((i * 17) % 60 + 2) + '" cy="' + ((i * 29) % 60 + 2) + '" r="2" fill="' + c2 + '"/>';
          break;
        case 'panels':
          /* Shirt panel = the shoulder band: a yoke running across both
             shoulders and out along the tops of the sleeves. Stroking the
             shoulder line and letting the clip trim it gives that shape. */
          inner = '<path d="M7 16 L22 7 L27.5 5.5 L36.5 5.5 L42 7 L57 16" fill="none" stroke="' +
                  c2 + '" stroke-width="7.5" stroke-linejoin="round"/>';
          break;
        case 'stripe':
          /* "Stripe / panel" on SHORTS means a vertical block down each side,
             so it follows the two outer seams. On socks it reads as a single
             stripe down the leg. */
          inner = (kind === 'shorts')
            ? '<g fill="none" stroke="' + c2 + '" stroke-width="7"><path d="M12 11 L8 51"/><path d="M52 11 L56 51"/></g>'
            : '<rect x="26" y="0" width="8" height="64" fill="' + c2 + '"/>';
          break;
        case 'trim':
          /* Trim means specific EDGES, not a border round the whole garment:
             shirt = the sleeve cuffs (and the collar, trimmed with them),
             shorts = the hem of each leg opening, socks = the turnover at the
             top. The clip does the shaping — one full-width band across the
             shorts at hem height becomes two separate leg hems, because the
             gap between the legs is outside the shape. */
          if (kind === 'shirt') {
            inner = '<g fill="none" stroke="' + c2 + '" stroke-linecap="butt">' +
                      '<path d="M7 16 L14 28" stroke-width="5"/>' +
                      '<path d="M57 16 L50 28" stroke-width="5"/>' +
                      '<path d="M27.5 5 a6 5.5 0 0 0 9 0" stroke-width="3.5"/>' +
                    '</g>';
          } else if (kind === 'shorts') {
            inner = '<rect x="0" y="45" width="64" height="6" fill="' + c2 + '"/>';
          } else {
            inner = '<rect x="0" y="6" width="64" height="7" fill="' + c2 + '"/>';
          }
          break;
        default:         /* print / other / unrecognised — show both colours honestly */
          inner = '<path d="M64 26 L64 64 L26 64 Z" fill="' + c2 + '"/>';
      }
    }

    return '<svg viewBox="0 0 64 64" role="img" aria-hidden="true">' +
      '<defs><clipPath id="' + uid + '"><path d="' + path + '"/></clipPath>' + defs + '</defs>' +
      '<g clip-path="url(#' + uid + ')">' +
        '<rect x="0" y="0" width="64" height="64" fill="' + c1 + '"/>' + inner +
      '</g>' +
      /* Outline via style=, not stroke="var(--navy)" — var() in an SVG
         presentation attribute is a Chromium-ism and would drop the silhouette
         in Safari. As a CSS declaration it is supported everywhere. */
      '<path d="' + path + '" fill="none" style="stroke:var(--navy)" stroke-width="1.6" stroke-linejoin="round"/>' +
      '</svg>';
  }

  function garmentRow(g, name) {
    var cs = (g && g.colours) || [];
    if (!cs.length) return '';
    var sw = cs.map(function (c) {
      return '<span class="ck-sw" style="background:' + esc(c.hex || 'transparent') + '"></span>' +
             '<span' + (c.raw ? ' class="ck-raw"' : '') + '>' + esc(c.label) + (c.raw ? ' *' : '') + '</span>';
    }).join('<span style="color:var(--text-muted)">+</span> ');
    var p = patLabel(g);
    return '<div class="ck-g"><span class="ck-g__l">' + esc(name) + '</span>' + sw +
           (p ? '<span class="ck-pat">· ' + esc(p) + '</span>' : '') + '</div>';
  }

  function openSub(club, rec) {
    var kits = (rec.outfield || []).concat(rec.gk || []);
    var anyRaw = kits.some(function (k) {
      return GARMENTS.some(function (g) { return ((k[g[0]] || {}).colours || []).some(function (c) { return c.raw; }); });
    });
    var ctrl = NL.modal({
      title: club,
      body:
        '<div class="ck-sub"><img alt="" data-crest="' + esc(club) + '" src="' + esc(NL.clubs.crestUrl(club, 'thumb')) + '">' +
          '<p class="ck-meta" style="margin:0;">' +
          (rec.submittedAt ? 'Submitted ' + esc(NL.formatDateTime(rec.submittedAt)) : 'Submitted') +
          (rec.manufacturer ? '<br>Manufacturer: <b>' + esc(rec.manufacturer) + '</b>' : '') +
          (rec.editedAt ? '<br><span class="ck-edited">Edited by the League ' + esc(NL.formatDateTime(rec.editedAt)) +
                          (rec.editedBy ? ' · ' + esc(rec.editedBy) : '') + '</span>' : '') + '</p></div>' +
        kits.map(function (k) {
          return '<div class="ck-kit"><div class="ck-kit__n">' + esc(k.label || k.slot) + '</div>' +
            GARMENTS.map(function (g) { return garmentRow(k[g[0]], g[1]); }).join('') + '</div>';
        }).join('') +
        (anyRaw ? '<p class="ck-meta" style="margin-top:12px;">* typed in rather than picked from the list — worth a check.</p>' : ''),
      buttons: [
        { label: 'Close', className: 'btn--ghost', onClick: function (c) { c.close(); } },
        { label: 'Edit', className: 'btn--primary', autofocus: true, onClick: function (c) { c.close(); editSub(club, rec); } }
      ]
    });
    var img = ctrl.body.querySelector('[data-crest]');
    if (img) NL.clubs.wireCrestImg(img, club);
  }

  function render() {
    var back = S.clubs.filter(function (c) { return subFor(c.name); }).length;
    el('stats').innerHTML =
      '<div class="ck-stat"><b>' + S.clubs.length + '</b><span>Clubs</span></div>' +
      '<div class="ck-stat"><b>' + back + '</b><span>Submitted</span></div>' +
      '<div class="ck-stat"><b>' + (S.clubs.length - back) + '</b><span>Outstanding</span></div>';

    var order = ['National', 'North', 'South'];
    el('divs').innerHTML = order.map(function (d) {
      var list = S.clubs.filter(function (c) { return c.division === d; });
      var n = list.filter(function (c) { return subFor(c.name); }).length;
      return '<div class="ck-div"><h2>' + esc(d) + '<span>' + n + '/' + list.length + '</span></h2>' +
        list.map(function (c) {
          var sub = subFor(c.name);
          return '<div class="ck-row' + (sub ? ' is-in' : '') + '"' + (sub ? ' data-sub="' + esc(c.name) + '"' : '') + '>' +
            '<span class="dot"></span>' +
            '<img alt="" data-crest="' + esc(c.name) + '" src="' + esc(NL.clubs.crestUrl(c.name, 'thumb')) + '">' +
            '<span class="nm">' + esc(c.name) + '</span>' +
            (sub ? '<button type="button" class="lnk" data-reopen="' + esc(c.name) + '">Re-open</button>' : '') +
            '</div>';
        }).join('') + '</div>';
    }).join('');

    /* src is set inline above (so a row never paints as a broken box); this
       only attaches the thumb→full→rose fallback chain for crests whose thumb
       tier has not been built yet. */
    [].forEach.call(document.querySelectorAll('[data-crest]'), function (img) {
      NL.clubs.wireCrestImg(img, img.getAttribute('data-crest'));
    });
    el('jsonBtn').disabled = !back;
    el('csvBtn').disabled = !back;
    el('xlsBtn').disabled = !back;
    el('sheetBtn').disabled = !back;
  }

  /* EXPORT — keyed by club, fields whitelisted. The token is the secret that
     grants access to a club's form; it must never appear here. Never spread a
     submission record into the output. */
  function exportJson() {
    var out = { season: '2026', generatedAt: new Date().toISOString(), clubs: {}, outstanding: [] };
    S.clubs.slice().sort(function (a, b) { return a.name.localeCompare(b.name); }).forEach(function (c) {
      var rec = subFor(c.name);
      if (!rec) { out.outstanding.push(c.name); return; }
      function kit(k) {
        var o = { slot: k.slot || '', label: k.label || '' };
        GARMENTS.forEach(function (g) {
          var src = k[g[0]] || {};
          var item = { colours: ((src.colours) || []).map(function (col) {
            return { family: col.family || null, shade: col.shade || null,
                     label: col.label || '', hex: col.hex || null, raw: !!col.raw };
          }) };
          if (g[2]) {
            if (src.pattern) item.pattern = src.pattern;
            if (src.patternLabel) item.patternLabel = src.patternLabel;
            if (src.patternOther) item.patternOther = src.patternOther;
          } else {
            if (src.detail) item.detail = src.detail;
            if (src.detailLabel) item.detailLabel = src.detailLabel;
            if (src.detailOther) item.detailOther = src.detailOther;
          }
          o[g[0]] = item;
        });
        o.legacy = { shirts: legacyGarment(k.shirt), shorts: legacyGarment(k.shorts), socks: legacyGarment(k.socks) };
        return o;
      }
      out.clubs[c.name] = {
        division: c.division || '',
        submittedAt: rec.submittedAt || null,
        editedAt: rec.editedAt || null,
        editedBy: rec.editedBy || '',
        manufacturer: rec.manufacturer || '',
        outfield: (rec.outfield || []).map(kit),
        gk: (rec.gk || []).map(kit)
      };
    });
    NL.download('club-kits-2026-27.json', JSON.stringify(out, null, 2), 'application/json');
    NL.toast(Object.keys(out.clubs).length + ' submissions exported.', 'success');
  }

  /* CSV — one row per KIT, which is the unit you actually compare when
     checking a fixture for a clash. The per-colour columns are split out
     rather than jammed into one cell so a sheet can filter on them, and each
     garment carries its dominant colour FAMILY as its own column: that is the
     whole point of the family+shade taxonomy, and it is what you pivot on to
     ask "who else plays in red". Clubs still outstanding appear as a single
     row each so all 72 are accounted for in one file. */
  function exportCsv() {
    var rows = [[
      'Club', 'Division', 'Kit',
      'Shirt 1', 'Shirt 2', 'Shirt 3', 'Shirt pattern', 'Shirt family',
      'Shorts 1', 'Shorts 2', 'Shorts detail', 'Shorts family',
      'Socks 1', 'Socks 2', 'Socks detail', 'Socks family',
      'Manufacturer', 'Submitted', 'Edited by League', 'Typed in?'
    ]];

    function cols(g, n) {
      var cs = (g && g.colours) || [], out = [];
      for (var i = 0; i < n; i++) out.push(cs[i] ? (cs[i].label || '') : '');
      return out;
    }
    function family(g) {
      var c = ((g && g.colours) || [])[0];
      return c ? (c.family || 'other') : '';
    }
    function typedIn(k) {
      return GARMENTS.some(function (g) {
        return (((k[g[0]] || {}).colours) || []).some(function (c) { return c.raw; });
      }) ? 'yes' : '';
    }

    var n = 0;
    S.clubs.slice().sort(function (a, b) { return a.name.localeCompare(b.name); }).forEach(function (c) {
      var rec = subFor(c.name);
      if (!rec) {
        /* Padded to the full width — a ragged row is legal CSV but trips
           stricter parsers, and it keeps the sheet rectangular. */
        var blank = [c.name, c.division || '', '(not submitted)'];
        while (blank.length < rows[0].length) blank.push('');
        rows.push(blank);
        return;
      }
      var when = rec.submittedAt ? NL.formatDate(rec.submittedAt) : '';
      (rec.outfield || []).concat(rec.gk || []).forEach(function (k) {
        n++;
        rows.push([c.name, c.division || '', k.label || k.slot || '']
          .concat(cols(k.shirt, 3), [patLabel(k.shirt), family(k.shirt)])
          .concat(cols(k.shorts, 2), [patLabel(k.shorts), family(k.shorts)])
          .concat(cols(k.socks, 2), [patLabel(k.socks), family(k.socks)])
          .concat([rec.manufacturer || '', when,
                   rec.editedAt ? NL.formatDate(rec.editedAt) + (rec.editedBy ? ' (' + rec.editedBy + ')' : '') : '',
                   typedIn(k)]));
      });
    });

    if (!n) { NL.toast('No submissions yet — nothing to export.', 'info'); return; }
    /* BOM so Excel reads the accented club names correctly. */
    NL.download('club-kits-2026-27.csv', NL.csv(rows, { bom: true }), 'text/csv');
    NL.toast(n + ' kits exported.', 'success');
  }

  /* ── Edit a submission in place ─────────────────────────────────────────
     Corrections used to mean Re-open, which deletes the record and makes the
     club fill the whole form in again. This edits it directly. The RTDB rule
     already allowed an admin to overwrite an existing submission; what was
     missing was a way to OFFER the same colour choices, which is why the
     taxonomy moved into the shared kit-colours.js.

     A save stamps editedAt/editedBy so a League correction stays
     distinguishable from what the club actually submitted — NL.writeAudit
     records the write, but the record itself would otherwise look like the
     club's own answer. */
  function whoAmI() {
    var s = (window.NL && NL.session) || {};
    var u = (firebase.auth && firebase.auth().currentUser) || {};
    return s.email || s.name || u.email || 'unknown';
  }

  function garmentEditor(host, garment, kind, max, isShirt) {
    garment.colours = (garment.colours || []).slice();
    if (!garment.colours.length) garment.colours = [null];

    host.innerHTML =
      '<div class="ce-g__h">' + esc(kind) + '</div>' +
      '<div class="ce-g__cnt"><span>Colours</span><span class="ce-seg"></span></div>' +
      '<div class="ce-g__cols"></div><div class="ce-g__pat"></div>';
    var seg = host.querySelector('.ce-seg'),
        cols = host.querySelector('.ce-g__cols'),
        pat = host.querySelector('.ce-g__pat');

    function paintSeg() {
      var h = '';
      for (var i = 1; i <= max; i++) {
        h += '<button type="button" data-n="' + i + '"' +
             (i === garment.colours.length ? ' class="on"' : '') + '>' + i + '</button>';
      }
      seg.innerHTML = h;
    }
    function paintPat() {
      var multi = garment.colours.filter(Boolean).length > 1 || garment.colours.length > 1;
      if (!multi) {
        /* Mirrors the form: a single-colour shirt is locked to Plain and says
           so; shorts and socks have no arrangement at one colour. */
        if (isShirt) { garment.pattern = 'plain'; garment.patternLabel = 'Plain'; }
        else { delete garment.detail; delete garment.detailLabel; }
        pat.innerHTML = isShirt
          ? '<label class="ce-lbl">Arrangement</label><select class="ce-in" disabled><option>Plain</option></select>'
          : '';
        return;
      }
      var opts = isShirt ? NLKit.PATTERNS.filter(function (o) { return o[0] !== 'plain'; }) : NLKit.DETAILS;
      var val = isShirt ? (garment.pattern === 'plain' ? '' : garment.pattern) : garment.detail;
      var other = (isShirt ? garment.patternOther : garment.detailOther) || '';
      pat.innerHTML = '<label class="ce-lbl">Arrangement</label>' +
        '<select class="ce-in" data-sel><option value="">Please choose…</option>' +
        opts.map(function (o) {
          return '<option value="' + o[0] + '"' + (o[0] === val ? ' selected' : '') + '>' + esc(o[1]) + '</option>';
        }).join('') + '</select>' +
        (val === 'other' ? '<input class="ce-in" data-other style="margin-top:8px;" placeholder="Describe it" value="' + esc(other) + '">' : '');
      pat.querySelector('[data-sel]').addEventListener('change', function () {
        var k = this.value, lab = '';
        for (var i = 0; i < opts.length; i++) if (opts[i][0] === k) lab = opts[i][1];
        if (isShirt) { garment.pattern = k; garment.patternLabel = lab; }
        else { garment.detail = k; garment.detailLabel = lab; }
        paintPat();
      });
      var oth = pat.querySelector('[data-other]');
      if (oth) oth.addEventListener('input', function () {
        if (isShirt) { garment.patternOther = this.value; garment.patternLabel = this.value || 'Other'; }
        else { garment.detailOther = this.value; garment.detailLabel = this.value || 'Other'; }
      });
    }
    function paintCols() {
      cols.innerHTML = '';
      garment.colours.forEach(function (c, i) {
        var row = document.createElement('div');
        row.className = 'ce-col';
        row.innerHTML = '<label class="ce-lbl">Colour ' + (i + 1) +
          (garment.colours.length > 1 && i === 0 ? ' <span>most dominant</span>' : '') + '</label><div data-cb></div>';
        cols.appendChild(row);
        NLKit.colourField(row.querySelector('[data-cb]'), c, function (v) { garment.colours[i] = v; });
      });
    }
    seg.addEventListener('click', function (e) {
      var b = e.target.closest('button[data-n]'); if (!b) return;
      var n = +b.getAttribute('data-n');
      while (garment.colours.length < n) garment.colours.push(null);
      garment.colours.length = n;
      /* Same guard as the form: bumping 1 → 2 must clear the auto-'plain' so a
         real arrangement has to be chosen rather than silently accepted. */
      if (n > 1 && garment.pattern === 'plain') { garment.pattern = ''; garment.patternLabel = ''; }
      paintSeg(); paintCols(); paintPat();
    });
    paintSeg(); paintCols(); paintPat();
  }

  function editSub(club, rec) {
    /* Deep clone — nothing touches S.subs until the save succeeds. */
    var work = JSON.parse(JSON.stringify(rec));
    var kits = (work.outfield || []).map(function (k) { return { set: 'outfield', k: k }; })
      .concat((work.gk || []).map(function (k) { return { set: 'gk', k: k }; }));

    var wrap = document.createElement('div');
    wrap.innerHTML =
      '<p class="ck-meta" style="margin:0 0 10px;">Correcting <b>' + esc(club) + '</b>. Saving stamps this as a League edit, ' +
      'so the record still shows it was changed after the club submitted it.</p>' +
      '<div><label class="ce-lbl">Kit manufacturer</label>' +
      '<input class="ce-in" id="ceMan" value="' + esc(work.manufacturer || '') + '"></div>' +
      kits.map(function (x, i) {
        return '<div class="ce-kit"><div class="ce-kit__n">' + esc(x.k.label || x.k.slot) + '</div>' +
          '<div class="ce-gars" data-kit="' + i + '"></div></div>';
      }).join('') +
      '<p class="ce-err" id="ceErr"></p>';

    var ctrl = NL.modal({
      title: 'Edit ' + club, width: 'wide', body: wrap,
      buttons: [
        { label: 'Cancel', className: 'btn--ghost', onClick: function (c) { c.close(); } },
        { label: 'Save changes', className: 'btn--primary', onClick: function (c) { save(c); } }
      ]
    });

    kits.forEach(function (x, i) {
      var host = ctrl.body.querySelector('[data-kit="' + i + '"]');
      GARMENTS.forEach(function (g) {
        x.k[g[0]] = x.k[g[0]] || { colours: [] };
        var cell = document.createElement('div');
        cell.className = 'ce-g';
        host.appendChild(cell);
        garmentEditor(cell, x.k[g[0]], g[1], g[0] === 'shirt' ? 3 : 2, g[2]);
      });
    });

    function save(c) {
      var problems = [];
      kits.forEach(function (x) {
        GARMENTS.forEach(function (g) {
          var gar = x.k[g[0]], used = (gar.colours || []).filter(Boolean);
          var label = (x.k.label || x.k.slot) + ' — ' + g[1].toLowerCase();
          if (!used.length) { problems.push(label + ': needs at least one colour.'); return; }
          if (used.length < gar.colours.length) problems.push(label + ': every colour box needs a value.');
          if (used.length > 1) {
            var key = g[2] ? gar.pattern : gar.detail;
            if (!key) problems.push(label + ': choose how the colours are arranged.');
          }
          gar.colours = used;   /* drop the empties before saving */
        });
      });
      if (problems.length) {
        ctrl.body.querySelector('#ceErr').textContent = problems[0] +
          (problems.length > 1 ? '  (+' + (problems.length - 1) + ' more)' : '');
        return;
      }

      work.manufacturer = String(ctrl.body.querySelector('#ceMan').value || '').trim();
      work.editedAt = Date.now();
      work.editedBy = whoAmI();

      if (NL.writeAudit) NL.writeAudit('clubkits_edit', 'Edited kit submission for ' + club);
      db.ref(BASE + '/submissions/' + club).set(work).then(function () {
        S.subs[club] = work;
        c.close(); NL.toast(club + ' updated.', 'success'); render();
      }).catch(function (e) {
        ctrl.body.querySelector('#ceErr').textContent = 'Save failed: ' + (e.message || e);
      });
    }
  }

  /* ── Kit sheets (print → PDF) ───────────────────────────────────────────*/
  function garmentCell(g, name) {
    var cs = (g && g.colours) || [];
    if (!cs.length) return '<div class="ks-gar"><div class="ks-gar__t"><div class="ks-gar__k">' + esc(name) +
                           '</div><div class="ks-gar__v" style="color:var(--navy-300);">not given</div></div></div>';
    var names = cs.map(function (c) {
      return '<span' + (c.raw ? ' class="ks-gar__raw"' : '') + '>' + esc(c.label) + (c.raw ? '*' : '') + '</span>';
    }).join(' + ');
    var p = patLabel(g);
    return '<div class="ks-gar">' + kitSvg(g, name.toLowerCase()) +
      '<div class="ks-gar__t"><div class="ks-gar__k">' + esc(name) + '</div>' +
      '<div class="ks-gar__v">' + names + '</div>' +
      (p ? '<div class="ks-gar__p">' + esc(p) + '</div>' : '') + '</div></div>';
  }

  function sheetFor(club) {
    var c = S.clubs.filter(function (x) { return x.name === club; })[0] || {};
    var rec = subFor(club); if (!rec) return '';
    var kits = (rec.outfield || []).concat(rec.gk || []);
    var anyRaw = kits.some(function (k) {
      return GARMENTS.some(function (g) { return (((k[g[0]] || {}).colours) || []).some(function (x) { return x.raw; }); });
    });
    var meta = [c.division || '', rec.manufacturer ? 'Kit by ' + rec.manufacturer : '',
                rec.submittedAt ? 'Submitted ' + NL.formatDate(rec.submittedAt) : '',
                rec.editedAt ? 'Corrected by the League ' + NL.formatDate(rec.editedAt) : '']
               .filter(Boolean).join('  ·  ');
    return '<div class="ks-form">' +
      '<div class="ks-form__head">' +
        '<img alt="" data-crest="' + esc(club) + '" src="' + esc(NL.clubs.crestUrl(club, 'medium')) + '">' +
        '<div><div class="ks-form__t">' + esc(club) + '</div>' +
        '<div class="ks-form__m">2026/27 kit colours' + (meta ? '  ·  ' + esc(meta) : '') + '</div></div>' +
      '</div>' +
      kits.map(function (k) {
        return '<div class="ks-kit"><div class="ks-kit__n">' + esc(k.label || k.slot) + '</div>' +
          '<div class="ks-gars">' + GARMENTS.map(function (g) { return garmentCell(k[g[0]], g[1]); }).join('') + '</div></div>';
      }).join('') +
      '<p class="ks-foot">Kit graphics are an indicative rendering generated from what the club submitted — colours and arrangement only, not the actual kit design.' +
      (anyRaw ? ' Colours marked * were typed in rather than picked from the list.' : '') + '</p>' +
      '</div>';
  }

  function renderSheets(names) {
    var out = el('ksOut');
    out.innerHTML =
      '<div class="ks-bar"><button type="button" class="btn btn--primary btn--sm" id="ksPrint">Download PDF</button>' +
      '<button type="button" class="btn btn--ghost btn--sm" id="ksClose">Close</button>' +
      '<span class="ks-bar__n">' + names.length + ' club' + (names.length === 1 ? '' : 's') +
      ' — one per page. In the dialog set <b>Destination</b> to “Save as PDF”, and turn on ' +
      '<b>Background graphics</b> if the kit colours come out blank.</span></div>' +
      names.map(sheetFor).join('');
    out.style.display = '';
    [].forEach.call(out.querySelectorAll('[data-crest]'), function (img) {
      NL.clubs.wireCrestImg(img, img.getAttribute('data-crest'));
    });
    el('ksPrint').addEventListener('click', function () {
      /* Browsers seed the saved-PDF filename from document.title, so without
         this every download lands as "Club kits admin — NL Tools.pdf".
         Swapped for the duration of the dialog, then put back. */
      var prevTitle = document.title;
      document.title = names.length === 1
        ? 'Kit colours 2026-27 — ' + names[0]
        : 'Kit colours 2026-27 — ' + names.length + ' clubs';
      document.body.classList.add('ks-print');
      window.print();
      /* Restored on the next tick rather than in onafterprint, which does not
         fire consistently across browsers when the dialog is cancelled. The
         print dialog blocks window.print(), so this runs after it closes. */
      setTimeout(function () {
        document.body.classList.remove('ks-print');
        document.title = prevTitle;
      }, 0);
    });
    el('ksClose').addEventListener('click', function () { out.style.display = 'none'; out.innerHTML = ''; });
    out.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function openSheetPicker() {
    var order = ['National', 'North', 'South'];
    var body = '<p class="ck-meta" style="margin:0;">Pick the clubs you want a sheet for. Clubs that have not submitted are greyed out.</p>' +
      '<div class="ks-pick__divs">' + order.map(function (d) {
        var list = S.clubs.filter(function (c) { return c.division === d; });
        var n = list.filter(function (c) { return subFor(c.name); }).length;
        return '<div class="ks-pick__div"><div class="ks-pick__dh"><span>' + esc(d) + ' (' + n + ')</span>' +
          (n ? '<button type="button" class="ks-pick__all" data-all="' + esc(d) + '">all</button>' : '') + '</div>' +
          list.map(function (c) {
            var has = !!subFor(c.name);
            return '<label class="ks-pick__c' + (has ? '' : ' ks-pick__c--out') + '">' +
              '<input type="checkbox" value="' + esc(c.name) + '"' + (has ? '' : ' disabled') + '>' +
              esc(c.name) + '</label>';
          }).join('') + '</div>';
      }).join('') + '</div>';

    var ctrl = NL.modal({
      title: 'Kit sheets', width: 'wide', body: body,
      buttons: [
        { label: 'Cancel', className: 'btn--ghost', onClick: function (c) { c.close(); } },
        { label: 'Build sheets', className: 'btn--primary', autofocus: true, onClick: function (c) {
            var names = [].map.call(c.body.querySelectorAll('input:checked'), function (i) { return i.value; });
            if (!names.length) { NL.toast('Pick at least one club.', 'info'); return; }
            c.close(); renderSheets(names);
          } }
      ]
    });
    ctrl.body.addEventListener('click', function (e) {
      var a = e.target.closest('[data-all]'); if (!a) return;
      var col = a.closest('.ks-pick__div');
      var boxes = col.querySelectorAll('input:not([disabled])');
      var allOn = [].every.call(boxes, function (b) { return b.checked; });
      [].forEach.call(boxes, function (b) { b.checked = !allOn; });
    });
  }

  /* ── Excel export ───────────────────────────────────────────────────────
     SpreadsheetML 2003 (plain XML Excel opens directly) rather than a real
     .xlsx, because .xlsx is a ZIP of XML and would mean shipping SheetJS —
     a ~500KB dependency for one button, and the first of its kind in this
     repo. This is ~60 lines and no dependency. Excel may warn that the
     extension does not match the format; it opens correctly regardless.

     The point of this file over the CSV is that every colour cell is FILLED
     with its actual colour, with the text flipped to black or white for
     contrast so a navy cell stays readable. */
  function xmlEsc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&apos;' }[c];
    });
  }
  function readableOn(hex) {
    var h = String(hex || '').replace('#', '');
    if (h.length !== 6) return '#000000';
    var r = parseInt(h.slice(0, 2), 16), g = parseInt(h.slice(2, 4), 16), b = parseInt(h.slice(4, 6), 16);
    /* Rec. 709 luma — good enough to keep text off the same value as its fill. */
    return (0.2126 * r + 0.7152 * g + 0.0722 * b) > 150 ? '#000000' : '#FFFFFF';
  }

  function exportXls() {
    var HEAD = ['Club', 'Division', 'Kit',
      'Shirt 1', 'Shirt 2', 'Shirt 3', 'Shirt pattern', 'Shirt family',
      'Shorts 1', 'Shorts 2', 'Shorts detail', 'Shorts family',
      'Socks 1', 'Socks 2', 'Socks detail', 'Socks family',
      'Manufacturer', 'Submitted', 'Edited by League', 'Typed in?'];

    var styles = {};                       /* hex -> style id */
    function styleFor(hex) {
      if (!hex) return null;
      var id = 's' + hex.replace('#', '').toUpperCase();
      if (!styles[id]) styles[id] = { fill: hex, text: readableOn(hex) };
      return id;
    }
    function cell(v, styleId) {
      return '<Cell' + (styleId ? ' ss:StyleID="' + styleId + '"' : '') +
             '><Data ss:Type="String">' + xmlEsc(v) + '</Data></Cell>';
    }
    /* Colour cells carry their own fill; everything else is a plain cell. */
    function colourCells(g, n) {
      var cs = (g && g.colours) || [], out = '';
      for (var i = 0; i < n; i++) {
        var c = cs[i];
        out += c ? cell(c.label || '', styleFor(c.hex)) : cell('');
      }
      return out;
    }
    function family(g) { var c = ((g && g.colours) || [])[0]; return c ? (c.family || 'other') : ''; }
    function typedIn(k) {
      return GARMENTS.some(function (g) {
        return (((k[g[0]] || {}).colours) || []).some(function (c) { return c.raw; });
      }) ? 'yes' : '';
    }

    var rows = '', n = 0;
    S.clubs.slice().sort(function (a, b) { return a.name.localeCompare(b.name); }).forEach(function (c) {
      var rec = subFor(c.name);
      if (!rec) {
        var pad = '';
        for (var j = 3; j < HEAD.length; j++) pad += cell('');
        rows += '<Row>' + cell(c.name) + cell(c.division || '') + cell('(not submitted)') + pad + '</Row>';
        return;
      }
      var when = rec.submittedAt ? NL.formatDate(rec.submittedAt) : '';
      (rec.outfield || []).concat(rec.gk || []).forEach(function (k) {
        n++;
        rows += '<Row>' + cell(c.name) + cell(c.division || '') + cell(k.label || k.slot || '') +
          colourCells(k.shirt, 3) + cell(patLabel(k.shirt)) + cell(family(k.shirt)) +
          colourCells(k.shorts, 2) + cell(patLabel(k.shorts)) + cell(family(k.shorts)) +
          colourCells(k.socks, 2) + cell(patLabel(k.socks)) + cell(family(k.socks)) +
          cell(rec.manufacturer || '') + cell(when) +
          cell(rec.editedAt ? NL.formatDate(rec.editedAt) + (rec.editedBy ? ' (' + rec.editedBy + ')' : '') : '') +
          cell(typedIn(k)) + '</Row>';
      });
    });
    if (!n) { NL.toast('No submissions yet — nothing to export.', 'info'); return; }

    var styleXml = '<Style ss:ID="hdr"><Font ss:Bold="1" ss:Color="#FFFFFF"/>' +
      '<Interior ss:Color="#12284C" ss:Pattern="Solid"/></Style>';
    Object.keys(styles).forEach(function (id) {
      styleXml += '<Style ss:ID="' + id + '"><Font ss:Color="' + styles[id].text + '"/>' +
        '<Interior ss:Color="' + styles[id].fill + '" ss:Pattern="Solid"/></Style>';
    });

    var xml = '<?xml version="1.0"?>\n<?mso-application progid="Excel.Sheet"?>\n' +
      '<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet"' +
      ' xmlns:o="urn:schemas-microsoft-com:office:office"' +
      ' xmlns:x="urn:schemas-microsoft-com:office:excel"' +
      ' xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">' +
      '<Styles>' + styleXml + '</Styles>' +
      '<Worksheet ss:Name="Kit colours"><Table>' +
      '<Row>' + HEAD.map(function (h) { return cell(h, 'hdr'); }).join('') + '</Row>' +
      rows + '</Table>' +
      '<WorksheetOptions xmlns="urn:schemas-microsoft-com:office:excel"><FreezePanes/>' +
      '<SplitHorizontal>1</SplitHorizontal><TopRowBottomPane>1</TopRowBottomPane>' +
      '<ActivePane>2</ActivePane></WorksheetOptions>' +
      '</Worksheet></Workbook>';

    NL.download('club-kits-2026-27.xls', xml, 'application/vnd.ms-excel');
    NL.toast(n + ' kits exported with colour fills.', 'success');
  }

  window.TOOL = window.TOOL || {};
  window.TOOL.boot = function () {
    Promise.all([
      NL.clubs.load(),
      NL.ensureAuth().then(function () { return db.ref(BASE + '/submissions').once('value'); })
    ]).then(function (res) {
      S.clubs = NL.season.clubsFor(res[0]);
      S.subs = res[1].val() || {};
      render();
    }).catch(function (e) {
      el('divs').innerHTML = '<p style="color:var(--red);">' + esc(e.message || e) + '</p>';
    });

    db.ref(BASE + '/template').once('value').then(function (s) {
      var t = s.val(); if (t && t.body) TPL = t.body;
      el('tplBody').value = TPL;
    }).catch(function () { el('tplBody').value = TPL; });

    el('tplSave').addEventListener('click', function () {
      TPL = el('tplBody').value;
      if (NL.writeAudit) NL.writeAudit('clubkits_template', 'Updated club-kits standard message');
      db.ref(BASE + '/template').set({ body: TPL }).then(function () {
        el('tplStatus').textContent = 'Saved ✓';
        setTimeout(function () { el('tplStatus').textContent = ''; }, 2000);
      }).catch(function (e) { el('tplStatus').textContent = 'Save failed: ' + (e.message || e); });
    });

    el('linkBtn').addEventListener('click', function () {
      NL.copy(FORM_URL, { ok: 'Form link copied — the same link works for every club.' });
    });

    el('emailBtn').addEventListener('click', function () {
      /* One message for everyone now: {club} is left for a mail-merge field,
         {link} is the single public URL. */
      var body = (el('tplBody').value || TPL).split('{link}').join(FORM_URL);
      var ta = el('emails'); ta.style.display = ''; ta.value = body;
      NL.copy(body, { ok: 'Email text copied.' });
    });

    el('jsonBtn').addEventListener('click', exportJson);
    el('csvBtn').addEventListener('click', exportCsv);
    el('xlsBtn').addEventListener('click', exportXls);
    el('sheetBtn').addEventListener('click', openSheetPicker);

    el('divs').addEventListener('click', function (e) {
      /* Re-open deletes the submission so the club can fill the form again.
         With no login on the form, a mistaken or squatted entry is the likely
         reason someone is here — hence a first-class button, not console work. */
      var re = e.target.closest('[data-reopen]');
      if (re) {
        e.stopPropagation();
        var name = re.getAttribute('data-reopen');
        NL.confirm('Unlock ' + name + '\u2019s form so they can edit their submission? Their answers are kept and pre-filled \u2014 nothing is deleted.',
          { title: 'Re-open ' + name + '?', confirmText: 'Re-open' }).then(function (yes) {
          if (!yes) return;
          if (NL.writeAudit) NL.writeAudit('clubkits_reopen', 'Re-opened kit form for ' + name + ' (answers kept)');
          /* Flag, not delete. The public form sees `reopened` and loads the
             record back into the wizard; the rules accept the club's next
             write only while the flag is set, and the resubmission (which
             never carries the flag) locks it again. Deleting was the old
             behaviour, and it made fixing one sock colour cost a club the
             whole return. */
          db.ref(BASE + '/submissions/' + name).update({ reopened: true, reopenedAt: Date.now() }).then(function () {
            S.subs[name].reopened = true;
            NL.toast(name + ' re-opened for editing.', 'success'); render();
          }).catch(function (err) { NL.toast('Could not re-open: ' + (err.message || err), 'error'); });
        });
        return;
      }
      var row = e.target.closest('[data-sub]'); if (!row) return;
      var club = row.getAttribute('data-sub'), rec = subFor(club);
      if (rec) openSub(club, rec);
    });
  };

  if (window._toolDeferredSession) { window.TOOL.boot(window._toolDeferredSession); window._toolDeferredSession = null; }
})();
</script>

</body>
</html>
