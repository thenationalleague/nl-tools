<!DOCTYPE html>
<!--
  NL Tools — Buzz
  Version: v1.5 (18/11/2026)
  File: /buzz/index.html

  A NON-GATED public page for a live talk: someone in the room picks their name once,
  then presses BUZZ to say "I want to come back to this". The presenter's deck hears it.

  How it reaches the deck: the Firebase REST API on the nl-widgets database (anonymous,
  public traffic lives there, never in nl-tools). A buzz is one POST to buzz/q; the deck
  holds an EventSource on the same path. REST shapes from
  https://firebase.google.com/docs/reference/rest/database (POST pushes a child; the
  {".sv":"timestamp"} placeholder is the server time).

  No names in this file: the list of people is written into buzz/roster by the presenter's
  deck when it opens, so it never sits in this public repo. With no roster, everyone types
  their own name. Nothing is stored but the name chosen and any question typed.

  Changelog (last five)
  v1.5 18/11/2026 – Name and club as dropdowns.
  v1.4 18/11/2026 – Buzz in, and Ask a question for later (the only one with words); buzzing in can be switched off from the deck.
  v1.3 18/11/2026 – Two plain buttons instead of the dome.
  v1.2 18/11/2026 – The phone shows the screen's reply, so people know their buzz arrived. No vibration.
  v1.1 18/11/2026 – Two buttons: BUZZ (question now) and Come back to this later.
-->
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Got a question? – The National League</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32x32.png">
  <link rel="stylesheet" href="/system/nl-brand.css?v=81">
  <script src="/system/nl-utils.js?v=77"></script>
  <style>
    html, body { margin: 0; min-height: 100%; background: var(--navy-700); }
    body { color: var(--navy-50); font-family: var(--font); -webkit-tap-highlight-color: transparent; }
    .bz { max-width: 520px; margin: 0 auto; padding: 22px 18px 40px; box-sizing: border-box; min-height: 100vh; display: flex; flex-direction: column; gap: 18px; }
    .bz-top { display: flex; align-items: center; gap: 12px; }
    .bz-top img { width: 38px; height: 38px; }
    .bz-top b { font-size: 20px; font-weight: 800; color: var(--navy-50); }
    .bz h2 { margin: 6px 0 0; font-size: 24px; font-weight: 800; color: var(--navy-50); }
    .bz-list { display: flex; flex-direction: column; gap: 8px; }
    .bz-p { all: unset; box-sizing: border-box; display: flex; align-items: center; gap: 14px; width: 100%; padding: 12px 14px; border-radius: 14px; background: var(--navy-600); cursor: pointer; }
    .bz-p:active, .bz-p:focus-visible { background: var(--navy-500); }
    .bz-p img { width: 40px; height: 40px; object-fit: contain; flex: none; border-radius: 8px; background: var(--navy-50); padding: 3px; box-sizing: border-box; }
    .bz-p b { display: block; font-size: 17px; color: var(--navy-50); } .bz-p small { display: block; font-size: 13px; color: var(--navy-200); }
    .bz-g { margin: 12px 0 2px; font-size: 13px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--navy-200); }
    .bz-own { display: flex; gap: 8px; }
    .bz-own input, .bz-q { flex: 1; font: 500 17px var(--font); padding: 13px 14px; border-radius: 12px; border: 0; background: var(--navy-50); color: var(--navy); min-width: 0; box-sizing: border-box; }
    .bz-own button, .bz-change { font: 800 16px var(--font); border: 0; border-radius: 12px; padding: 0 18px; background: var(--primary); color: var(--navy-50); }
    .bz-me { display: flex; align-items: center; gap: 12px; }
    .bz-me img { width: 46px; height: 46px; object-fit: contain; border-radius: 10px; background: var(--navy-50); padding: 4px; box-sizing: border-box; }
    .bz-me b { font-size: 19px; color: var(--navy-50); display: block; } .bz-me small { color: var(--navy-200); font-size: 14px; }
    .bz-change { margin-left: auto; background: var(--navy-600); padding: 10px 14px; font-size: 14px; }
    /* two plain buttons, the full width of the phone: one for now, one for later */
    .bz-now, .bz-later { all: unset; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; gap: 4px; width: 100%; min-height: 120px; padding: 20px 22px; border-radius: 18px;
      cursor: pointer; user-select: none; -webkit-user-select: none; color: var(--navy-50); transition: transform 60ms, box-shadow 60ms; }
    .bz-now { background: var(--primary); box-shadow: 0 6px 0 var(--primary-800); }
    .bz-later { background: var(--navy-600); box-shadow: 0 6px 0 var(--navy-800); }
    .bz-now b, .bz-later b { font: 800 28px var(--font); } .bz-now span, .bz-later span { font: 600 15px var(--font); opacity: .85; }
    .bz-now:active, .bz-now.hit, .bz-later:active, .bz-later.hit { transform: translateY(6px); box-shadow: 0 0 0 transparent; }
    .bz-now[disabled] { background: var(--navy-600); box-shadow: 0 6px 0 var(--navy-800); opacity: .55; cursor: default; }
    .bz-ask { display: flex; flex-direction: column; gap: 10px; } .bz-ask[hidden] { display: none; }
    .bz-send { all: unset; align-self: flex-end; padding: 14px 28px; border-radius: 14px; background: var(--primary); color: var(--navy-50); font: 800 18px var(--font); box-shadow: 0 4px 0 var(--primary-800); cursor: pointer; }
    .bz-send:active { transform: translateY(4px); box-shadow: none; }
    .bz-now.done, .bz-later.done { background: var(--green); box-shadow: 0 6px 0 var(--navy-800); }
    .bz-q { width: 100%; min-height: 80px; resize: vertical; }
    .bz-msg { min-height: 22px; text-align: center; font-size: 16px; color: var(--navy-100); }
    .bz-msg.bad { color: var(--primary-200); }
    #buzz, .bz-pick { display: flex; flex-direction: column; gap: 14px; }
    .bz-l { display: flex; flex-direction: column; gap: 6px; font: 700 14px var(--font); color: var(--navy-200); letter-spacing: .02em; }
    .bz-l[hidden] { display: none; }
    .bz-l select, .bz-l input { font: 600 18px var(--font); padding: 14px; border-radius: 12px; border: 0; background: var(--navy-50); color: var(--navy); width: 100%; box-sizing: border-box; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main class="bz">
    <div class="bz-top"><img src="/assets/crests/thumbs/National%20League%20rose%20white.png" alt="" onerror="this.remove()"><b>Got a question?</b></div>

    <form id="pick" class="bz-pick">
      <h2>Who are you?</h2>
      <label class="bz-l">Your name<select id="nameSel"><option value="">Choose your name</option></select></label>
      <label class="bz-l" id="ownBox" hidden>Type your name<input id="ownName" maxlength="60" autocomplete="name"></label>
      <label class="bz-l">Your club<select id="clubSel"><option value="">The National League</option></select></label>
      <button class="bz-send" id="ok">Continue</button>
    </form>

    <section id="buzz" hidden>
      <div class="bz-me"><img id="meImg" alt=""><div><b id="meName"></b><small id="meSub"></small></div><button class="bz-change" id="change" type="button">Change</button></div>
      <button class="bz-now" id="go" type="button"><b>Buzz in</b><span id="goSub">Pops up on Richard’s screen</span></button>
      <button class="bz-later" id="later" type="button"><b>Ask a question for later</b><span>Goes on his list for the end</span></button>
      <div class="bz-ask" id="ask" hidden><textarea class="bz-q" id="q" maxlength="280" placeholder="Your question (optional)"></textarea><button class="bz-send" id="send" type="button">Send</button></div>
      <p class="bz-msg" id="msg"></p>
    </section>
  </main>
<script>
(function () {
  var DB = 'https://nl-widgets-default-rtdb.europe-west1.firebasedatabase.app/buzz';
  var LS = 'nl-buzz-me-v1', me = null;
  var $ = function (id) { return document.getElementById(id); };
  var ROSE = (window.NL && NL.clubs && NL.clubs.crestUrl) ? NL.clubs.crestUrl('') : '';
  function crest(img, club) {
    if (club && window.NL && NL.clubs) { img.src = NL.clubs.crestUrl(club, 'thumb'); NL.clubs.wireCrestImg(img, club); }
    else img.src = ROSE;
  }
  function choose(p) {
    me = p; try { localStorage.setItem(LS, JSON.stringify(p)); } catch (e) {}
    $('meName').textContent = p.n; $('meSub').textContent = p.c || p.r || '';
    crest($('meImg'), p.c); $('pick').hidden = true; $('buzz').hidden = false;
  }
  /* name: the room's list (written by the deck), or Someone else; club: every club, preset from the list */
  var ROSTER = [], nameSel = $('nameSel'), clubSel = $('clubSel');
  function draw(roster) {
    ROSTER = roster || []; var groups = {};
    ROSTER.forEach(function (p, i) {
      var g = p.g || 'Names'; if (!groups[g]) { groups[g] = document.createElement('optgroup'); groups[g].label = g; nameSel.appendChild(groups[g]); }
      var o = document.createElement('option'); o.value = String(i); o.textContent = p.n + (p.r ? ' – ' + p.r : ''); groups[g].appendChild(o);
    });
    var other = document.createElement('option'); other.value = 'own'; other.textContent = 'Someone else'; nameSel.appendChild(other);
    if (!ROSTER.length) { nameSel.value = 'own'; $('ownBox').hidden = false; }
  }
  if (window.NL && NL.clubs && NL.clubs.all) NL.clubs.all().then(function (list) {
    list.forEach(function (c) { var o = document.createElement('option'); o.value = c.name; o.textContent = c.name; clubSel.appendChild(o); });
  }).catch(function () {});
  nameSel.addEventListener('change', function () {
    var own = nameSel.value === 'own'; $('ownBox').hidden = !own; if (own) { $('ownName').focus(); return; }
    var p = ROSTER[+nameSel.value]; if (p) clubSel.value = p.c || '';
  });
  fetch(DB + '/roster.json').then(function (r) { return r.ok ? r.json() : null; }).then(function (v) {
    var list = null; try { list = typeof v === 'string' ? JSON.parse(v) : null; } catch (e) {}
    draw(Array.isArray(list) ? list : []);
  }).catch(function () { draw([]); });
  $('pick').addEventListener('submit', function (e) {
    e.preventDefault();
    var p = nameSel.value === 'own' ? { n: $('ownName').value.trim(), r: '' } : ROSTER[+nameSel.value];
    if (!p || !p.n) { (nameSel.value === 'own' ? $('ownName') : nameSel).focus(); return; }
    choose({ n: p.n, r: p.r || '', c: clubSel.value });
  });
  $('change').addEventListener('click', function () { $('buzz').hidden = true; $('pick').hidden = false; });
  try { var saved = JSON.parse(localStorage.getItem(LS) || 'null'); if (saved && saved.n) choose(saved); } catch (e) {}

  var go = $('go'), later = $('later'), msg = $('msg'), busy = false;
  var GO = go.innerHTML, LATER = later.innerHTML;
  function send(kind, btn) {
    if (busy || !me) return; busy = true; msg.classList.remove('bad'); msg.textContent = '';
    btn.classList.add('hit'); setTimeout(function () { btn.classList.remove('hit'); }, 160);
    var body = { n: me.n.slice(0, 60), c: (me.c || '').slice(0, 60), k: kind, t: { '.sv': 'timestamp' } }, x = kind === 'later' ? $('q').value.trim() : '';
    if (x) body.x = x.slice(0, 280);
    fetch(DB + '/q.json', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (res) {
        $('q').value = ''; btn.classList.add('done');
        btn.innerHTML = '<b>Sent</b>';
        msg.textContent = 'Waiting for the screen…';
        waitAck(res && res.name);
        setTimeout(function () { btn.classList.remove('done'); go.innerHTML = GO; later.innerHTML = LATER; setOpen(isOpen); busy = false; }, 5000);
      })
      .catch(function () { busy = false; msg.classList.add('bad'); msg.textContent = 'That didn’t send. Check your signal and press again.'; });
  }
  /* the deck writes buzz/ack/<id> when it shows the buzz; that is what the phone reports back */
  var es = null, ackT = 0;
  function waitAck(id) {
    if (es) { es.close(); es = null; } clearTimeout(ackT); if (!id || !window.EventSource) { msg.textContent = 'Sent.'; return; }
    es = new EventSource(DB + '/ack/' + id + '.json');
    es.addEventListener('put', function (e) {
      var m; try { m = JSON.parse(e.data); } catch (x) { return; }
      if (m && typeof m.data === 'string') { msg.textContent = m.data; clearTimeout(ackT); es.close(); es = null; }
    });
    ackT = setTimeout(function () { if (es) { es.close(); es = null; } msg.textContent = 'Sent, but the screen hasn’t picked it up yet. It will when it reconnects.'; }, 9000);
  }
  go.addEventListener('click', function () { if (!go.disabled) send('now', go); });
  /* later: the one place to write a question; empty is fine, it still marks the slide */
  later.addEventListener('click', function () { var a = $('ask'); a.hidden = !a.hidden; if (!a.hidden) $('q').focus(); });
  $('send').addEventListener('click', function () { send('later', later); $('ask').hidden = true; });
  /* Richard can switch buzzing in off from the deck; the phone follows */
  var isOpen = true;
  function setOpen(on) { isOpen = on; go.disabled = !on; var sub = $('goSub'); if (sub) sub.textContent = on ? 'Pops up on Richard’s screen' : 'Off for now – ask for later instead'; }
  if (window.EventSource) { var os = new EventSource(DB + '/open.json'); os.addEventListener('put', function (e) { try { var m = JSON.parse(e.data); if (m && m.path === '/') setOpen(m.data !== false); } catch (x) {} }); }
})();
</script>
</body>
</html>
