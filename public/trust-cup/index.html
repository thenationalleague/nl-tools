<!DOCTYPE html>
<!--
  National League Trust Cup — photo frame
  Version: v1.6 (21/10/2026)
  File: /public/trust-cup/index.html

  An open page for clubs taking part in the Enterprise-sponsored National
  League Trust Cup (under-11s) to drop a team photo into a branded frame and
  download it for social media. Built at the National League Trust's request.

  THE PHOTO NEVER LEAVES THE DEVICE. It is read with an object URL, drawn
  onto a <canvas> and exported with canvas.toBlob — there is no upload, no
  Firebase and no storage. These are photos of children, and keeping them
  off our infrastructure is what removes the safeguarding and retention
  questions entirely (decided with Richard, 21/10/2026). Anyone changing this
  page to send the image anywhere is reopening that decision; do not.

  Open page, so it carries only what an open page may:
    - no Firebase SDKs, no auth-guard.js, no nl-topbar.js, no #pageWrap
    - the white .nl-idbar instead of the red topbar (nl-brand.css v2.37)
  Everything it reads is already public: clubs-meta, crests, the NL rose
  and the Enterprise logo. Not linked from anywhere and not indexed.

  Why canvas, not DOM + html-to-image: the output is exactly the pixels on
  screen, so what the coach frames is what downloads — no export-time font
  or image-decoding races, which html-to-image has on iOS Safari.

  The participating teams are a CLOSED list the Trust has not confirmed yet;
  until it does, the picker offers the current season's member clubs.
  When the list lands, swap the picker's roster for it (see TEAMS below).

  CHANGELOG
  v1.6 (21/10/2026) — Story: panel anchored to the bottom edge with the photo
                      above it only. The reply-bar zone becomes the panel's
                      own bottom padding instead of a strip of photo.
  v1.5 (21/10/2026) — No blank space: zoom, pan and rotate are constrained so
                      the photo always covers the frame. Tilting zooms in
                      just enough to fill the corners; dragging stops at the
                      photo's edge. Rotation kept.
  v1.4 (21/10/2026) — Rose drawn 4% over the text height (optical overshoot)
                      so it reads as the same height as the two text rows.
  v1.3 (21/10/2026) — The red NL rose returns, inside the cup lockup: beside
                      NATIONAL LEAGUE / TRUST CUP, as tall as the two rows.
                      Name wrapping prefers two lines and never strands a
                      short word ("&", "FC") on a line of its own. The two
                      text rows sit closer than the logo/rose spacing.
  v1.2 (21/10/2026) — Trust logo removed (its PFA and Premier League marks
                      beside Enterprise implied a link that does not exist);
                      the panel is now club | cup lockup. Nothing is ever
                      truncated: names and the season line shrink or wrap.
  v1.1 (21/10/2026) — Cup lockup: Enterprise logo, NATIONAL LEAGUE, TRUST CUP
                      justified to one width, in black and Enterprise green
                      (no red). Panel re-laid out per size: club | cup in one
                      row for Square and Portrait (same panel, same on-screen
                      size in feeds); club above cup for Story. Logos trimmed
                      to their visible edges; long names wrap to two lines.
  v1.0 (21/10/2026) — First build. Square / Portrait / Story sizes; drag,
                      pinch, wheel and slider zoom; two-finger and slider
                      rotate; recentre/reset; club crest and colour from
                      clubs-meta; download PNG, plus share sheet on phones.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>National League Trust Cup — Photo Frame</title>
  <meta name="robots" content="noindex,nofollow">

  <!-- Favicons. Static, not injected: nl-topbar.js adds these on gated pages
       and this page never loads it. -->
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/favicon-16x16.png">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">

  <!-- No Firebase, no auth-guard, no nl-topbar: this page is open. -->
  <link rel="stylesheet" href="/system/nl-brand.css?v=69">
  <script src="/system/nl-utils.js?v=49"></script>
  <!-- GA4 for nl.tools — cookieless, no banner, no identity. See system/nl-analytics.js -->
  <script src="/system/nl-analytics.js?v=1"></script>

  <style>
    .tc-wrap {
      max-width: 1100px; margin: 0 auto; padding: 20px 16px 48px;
      display: grid; gap: 20px;
      grid-template-columns: minmax(0, 1fr) 340px;
      align-items: start;
    }
    @media (max-width: 820px) {
      .tc-wrap { grid-template-columns: minmax(0, 1fr); }
    }

    .tc-stage {
      background: var(--off-white);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      display: flex; flex-direction: column; align-items: center; gap: 10px;
    }
    #tcCanvas {
      display: block;
      max-width: 100%;
      max-height: 72vh;
      width: auto; height: auto;
      box-shadow: var(--shadow);
      touch-action: none;          /* we own every gesture on the canvas */
      cursor: grab;
      background: var(--white);
    }
    #tcCanvas.is-empty { cursor: pointer; }
    #tcCanvas.is-dragging { cursor: grabbing; }
    #tcCanvas:focus-visible { outline: 3px solid var(--navy); outline-offset: 3px; }
    .tc-hint { font-size: var(--text-xs); color: var(--text-muted); text-align: center; }

    .tc-field { margin-bottom: 16px; }
    .tc-field:last-child { margin-bottom: 0; }
    .tc-formats { width: 100%; }
    .tc-format { flex: 1; }
    .tc-file { display: none; }
    .tc-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .tc-grow { flex: 1; }
    .tc-range { display: flex; align-items: center; gap: 10px; }
    .tc-range input[type="range"] { flex: 1; accent-color: var(--navy); }
    .tc-range output {
      min-width: 48px; text-align: right;
      font-size: var(--text-sm); color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }
    .tc-actions { display: grid; gap: 8px; }
    .tc-wide { width: 100%; }
    .tc-note { font-size: var(--text-xs); color: var(--text-muted); margin-top: 10px; }
  </style>
</head>
<body>

  <div class="nl-idbar">
    <img class="nl-idbar__crest" src="/assets/crests/National%20League%20rose.png"
         alt="" width="42" height="42">
    <div class="nl-idbar__id">
      <div class="nl-idbar__title">National League Trust Cup</div>
      <div class="nl-idbar__sub">Photo frame</div>
    </div>
  </div>

  <main class="tc-wrap">
    <section class="tc-stage" aria-label="Preview">
      <canvas id="tcCanvas" class="is-empty" tabindex="0"
              aria-label="Framed photo preview. Arrow keys move the photo, plus and minus zoom."></canvas>
      <div class="tc-hint">Drag to move · pinch or scroll to zoom · two fingers to rotate</div>
    </section>

    <aside class="form-panel tc-controls">
      <div class="form-panel__body">
        <div class="form-group tc-field">
          <label for="tcClub">Club</label>
          <div id="tcClub"></div>
        </div>

        <div class="form-group tc-field">
          <label for="tcName">Name on the frame</label>
          <input id="tcName" type="text" maxlength="40" autocomplete="off">
        </div>

        <div class="form-group tc-field">
          <label>Photo</label>
          <input id="tcFile" class="tc-file" type="file" accept="image/*">
          <button id="tcPick" type="button" class="btn btn--navy tc-wide">Choose photo</button>
        </div>

        <div class="form-group tc-field">
          <label>Size</label>
          <div class="chip-group tc-formats" role="radiogroup" id="tcFormats"></div>
        </div>

        <div class="form-group tc-field">
          <label for="tcZoom">Zoom</label>
          <div class="tc-range">
            <input id="tcZoom" type="range" min="0" max="1000" value="0">
            <output id="tcZoomOut" for="tcZoom">100%</output>
          </div>
        </div>

        <div class="form-group tc-field">
          <label for="tcRot">Rotate</label>
          <div class="tc-range">
            <input id="tcRot" type="range" min="-180" max="180" step="1" value="0">
            <output id="tcRotOut" for="tcRot">0°</output>
          </div>
        </div>

        <div class="form-group tc-field">
          <div class="tc-row">
            <button id="tcRot90" type="button" class="btn btn--ghost btn--sm tc-grow">Rotate 90°</button>
            <button id="tcCentre" type="button" class="btn btn--ghost btn--sm tc-grow">Recentre</button>
            <button id="tcReset" type="button" class="btn btn--ghost btn--sm tc-grow">Reset</button>
          </div>
        </div>
      </div>
      <div class="form-panel__foot" style="display:block">
        <div class="tc-actions">
          <button id="tcDownload" type="button" class="btn btn--primary tc-wide" disabled>Download PNG</button>
          <button id="tcShare" type="button" class="btn btn--ghost tc-wide" hidden disabled>Share or save to Photos</button>
        </div>
        <div class="tc-note">Your photo stays on this device. Nothing is uploaded.</div>
      </div>
    </aside>
  </main>

<script>
var NL_CHANGELOG = [
  { version: 'v1.6', date: '21/10/2026', changes: [
    'Story: panel anchored to the bottom, photo above it only — no strip of photo beneath'
  ]},
  { version: 'v1.5', date: '21/10/2026', changes: [
    'Photo always covers the frame: tilting zooms in to fill the corners, dragging stops at the edge'
  ]},
  { version: 'v1.4', date: '21/10/2026', changes: [
    'Rose given 4% optical overshoot so it reads as the same height as the text'
  ]},
  { version: 'v1.3', date: '21/10/2026', changes: [
    'Red NL rose added to the cup lockup, beside NATIONAL LEAGUE / TRUST CUP',
    'Name wrapping prefers two lines and never strands a short word on its own line'
  ]},
  { version: 'v1.2', date: '21/10/2026', changes: [
    'Trust logo removed from the panel; club and cup lockup only',
    'No truncation anywhere: team name and season line shrink or wrap to fit'
  ]},
  { version: 'v1.1', date: '21/10/2026', changes: [
    'Cup lockup: Enterprise logo, NATIONAL LEAGUE, TRUST CUP justified to one width; black and Enterprise green, no red',
    'Panel re-laid out per size: one row for Square and Portrait, club above cup for Story',
    'Long team names wrap to two lines; logos trimmed to their visible edges'
  ]},
  { version: 'v1.0', date: '21/10/2026', changes: [
    'First build: Square, Portrait and Story frames for the National League Trust Cup',
    'Drag, pinch, wheel and slider zoom; two-finger and slider rotate; recentre and reset',
    'Club crest and accent colour from clubs-meta; PNG download, share sheet on phones',
    'Photo is processed entirely in the browser — never uploaded'
  ]}
];

(function () {
  'use strict';

  /* ── Output sizes ─────────────────────────────────────────────────────────
     A closed set of three, hence chips. `band` is the white brand panel,
     always flush with the bottom edge; `safe` is extra padding at its foot;
     `rows` is 1 (club and cup side by
     side) or 2 (club above cup). Every format is 1080 wide, so a taller
     panel cannot simply be scaled up — it runs out of width — which is why
     Story stacks instead. Square and Portrait share one panel on purpose:
     feeds show both at the same width, so the same pixels are the same
     size on screen, and Portrait's extra height all goes to the photo.
     Story: Instagram and Facebook lay the reply bar over the bottom of the
     frame, so the panel's `safe` padding sits under it and its content
     stays clear. Until v1.6 the panel floated 250px up with the photo
     running on beneath it, which split the photo in two and made framing
     awkward (dropped 21/10/2026). */
  var FORMATS = [
    { key: 'square',   label: 'Square',   w: 1080, h: 1080, band: 290, safe: 0,   rows: 1 },
    { key: 'portrait', label: 'Portrait', w: 1080, h: 1350, band: 290, safe: 0,   rows: 1 },
    { key: 'story',    label: 'Story',    w: 1080, h: 1920, band: 720, safe: 200, rows: 2 }
  ];

  /* ── Teams ────────────────────────────────────────────────────────────────
     Placeholder: the current season's member clubs. When the Trust confirms
     the entrants, pass them to NL.clubPicker as a fixed roster instead. */
  var TEAMS = null;

  var LOCKUP = ['NATIONAL LEAGUE', 'TRUST CUP'];
  var SUB    = 'UNDER-11s · ' + NL.season.label(null, String(NL.season.fromDate()));
  var LOGO_ENTERPRISE = '/assets/partners/Enterprise.png';
  var LOGO_ROSE       = '/assets/crests/National%20League%20rose.png';
  var ROSE_OVERSHOOT  = 0.04;   // see drawLockup
  var FONT_DIR = '/graphics/_shared/fonts/';
  var MAX_SRC = 3000;           // long-edge cap for the working copy of the photo
  var Z_MIN = 1, Z_MAX = 6;     // zoom is relative to "just covers the photo area";
                                // rotation can raise the floor (see constrain)

  /* Brand colours come from the token sheet — canvas cannot read var(), so
     resolve once. Club colours come from clubs-meta at selection time. */
  var css = getComputedStyle(document.documentElement);
  function tok(name) { return css.getPropertyValue(name).trim(); }
  var C = {
    ink:   tok('--navy-900'),
    rule:  tok('--border'),
    muted: tok('--text-muted'),
    white: tok('--white'),
    empty: tok('--navy-100'),
    emptyInk: tok('--navy-400'),
    /* Enterprise green, sampled from assets/partners/Enterprise.png. A
       sponsor's identity colour, so tool-local per the nl-brand.css policy
       — but the MOTM embed carries its own, slightly different, copy
       (#34ab56): a canon candidate if a third consumer appears. */
    ent:   '#34b56a'
  };

  var canvas = document.getElementById('tcCanvas');
  var ctx = canvas.getContext('2d');
  var els = {
    name: document.getElementById('tcName'),
    file: document.getElementById('tcFile'),
    pick: document.getElementById('tcPick'),
    formats: document.getElementById('tcFormats'),
    zoom: document.getElementById('tcZoom'),
    zoomOut: document.getElementById('tcZoomOut'),
    rot: document.getElementById('tcRot'),
    rotOut: document.getElementById('tcRotOut'),
    rot90: document.getElementById('tcRot90'),
    centre: document.getElementById('tcCentre'),
    reset: document.getElementById('tcReset'),
    download: document.getElementById('tcDownload'),
    share: document.getElementById('tcShare')
  };

  var S = {
    fmt: FORMATS[0],
    photo: null,                // working-copy canvas of the user's photo
    club: null,                 // clubs-meta record
    crest: null,                // loaded crest image
    accent: C.ent,
    name: '',
    // Framing, in units that survive a format change: zoom relative to
    // cover-fit, rotation in degrees, offset as a fraction of area width.
    z: 1, rot: 0, ox: 0, oy: 0
  };
  var logos = { ent: null, rose: null };

  /* ── Loading ─────────────────────────────────────────────────────────── */
  function loadImg(src) {
    return new Promise(function (res, rej) {
      var i = new Image();
      i.onload = function () { res(i); };
      i.onerror = rej;
      i.src = src;
    });
  }

  function loadFonts() {
    if (!window.FontFace) return Promise.resolve();
    var faces = [['Carbona-Black', 'Carbona-Black.otf'], ['Carbona-Bold', 'Carbona-Bold.otf']];
    return Promise.all(faces.map(function (f) {
      var ff = new FontFace(f[0], 'url(' + FONT_DIR + f[1] + ')');
      return ff.load().then(function (l) { document.fonts.add(l); }, function () {});
    }));
  }

  /* Crop a logo to its visible pixels. The Enterprise file carries a white
     margin, which throws off any alignment measured from the image edge. Same-origin, so readable. */
  function trimmed(img) {
    var c = document.createElement('canvas');
    c.width = img.naturalWidth; c.height = img.naturalHeight;
    var g = c.getContext('2d'); g.drawImage(img, 0, 0);
    var d = g.getImageData(0, 0, c.width, c.height).data;
    var x0 = c.width, y0 = c.height, x1 = -1, y1 = -1;
    for (var y = 0; y < c.height; y++) {
      for (var x = 0; x < c.width; x++) {
        var i = (y * c.width + x) * 4;
        if (d[i + 3] > 16 && (d[i] < 240 || d[i + 1] < 240 || d[i + 2] < 240)) {
          if (x < x0) x0 = x; if (x > x1) x1 = x;
          if (y < y0) y0 = y; if (y > y1) y1 = y;
        }
      }
    }
    if (x1 < 0) return c;
    var out = document.createElement('canvas');
    out.width = x1 - x0 + 1; out.height = y1 - y0 + 1;
    out.getContext('2d').drawImage(c, x0, y0, out.width, out.height, 0, 0, out.width, out.height);
    return out;
  }

  /* Copy the photo into a canvas capped at MAX_SRC on its long edge. Phones
     shoot 12–48MP; redrawing that on every pointer move stutters, and the
     output is only 1080 wide, so 3000px leaves headroom for close zooms.
     EXIF orientation is applied by the browser when the <img> decodes. */
  function workingCopy(img) {
    var iw = img.naturalWidth, ih = img.naturalHeight;
    var k = Math.min(1, MAX_SRC / Math.max(iw, ih));
    var c = document.createElement('canvas');
    c.width = Math.round(iw * k); c.height = Math.round(ih * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return c;
  }

  function usePhoto(file) {
    if (!file || !/^image\//.test(file.type)) { NL.toast('That file is not an image', 'error'); return; }
    var url = URL.createObjectURL(file);
    loadImg(url).then(function (img) {
      S.photo = workingCopy(img);
      URL.revokeObjectURL(url);
      resetFraming();
      canvas.classList.remove('is-empty');
      els.pick.textContent = 'Change photo';
      update();
    }, function () {
      URL.revokeObjectURL(url);
      NL.toast('Could not open that photo — try a JPEG or PNG', 'error');
    });
  }

  /* ── Geometry ────────────────────────────────────────────────────────── */
  function photoArea(f) { return { x: 0, y: 0, w: f.w, h: f.h - f.band }; }
  function coverScale(area) {
    return Math.max(area.w / S.photo.width, area.h / S.photo.height);
  }

  /* ── Drawing ─────────────────────────────────────────────────────────── */
  function containIn(img, x, y, w, h) {
    var iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
    var k = Math.min(w / iw, h / ih);
    var dw = iw * k, dh = ih * k;
    ctx.drawImage(img, x + (w - dw) / 2, y + (h - dh) / 2, dw, dh);
  }

  function setFont(size, family) { ctx.font = size + 'px "' + family + '"'; }

  // Ink extent of a string at `size` — tighter than measureText().width,
  // which includes side bearings and would misalign a justified lockup.
  function ink(text, size, family) {
    setFont(size, family);
    var m = ctx.measureText(text);
    return { left: m.actualBoundingBoxLeft, w: m.actualBoundingBoxLeft + m.actualBoundingBoxRight,
             asc: m.actualBoundingBoxAscent };
  }

  /* Team name: one line at a decent size, else the most even two- then
     three-line split, shrinking until one fits. Never truncated — a club's
     name cut short on its own graphic is not acceptable (ruling,
     21/10/2026). The 40-character input cap keeps the last resort legible. */
  function splits(words, n) {
    if (n === 1) return [[words.join(' ')]];
    var out = [];
    for (var i = 1; i <= words.length - n + 1; i++) {
      splits(words.slice(i), n - 1).forEach(function (rest) {
        out.push([words.slice(0, i).join(' ')].concat(rest));
      });
    }
    return out;
  }
  // A split that strands "&" or "FC" on a line of its own reads badly.
  function goodSplit(ls) { return ls.every(function (l) { return l.length > 2; }); }
  function bestSplit(words, n, maxW, size) {
    var best = null;
    splits(words, n).filter(goodSplit).forEach(function (ls) {
      var w = Math.max.apply(null, ls.map(function (l) { return ctx.measureText(l).width; }));
      if (w <= maxW && (!best || w < best.w)) best = { lines: ls, size: size, w: w };
    });
    return best;
  }
  /* Fewer lines win: two lines are tried down to just over half size before
     three are allowed, and one line shrinks without limit as the floor. */
  function nameLines(name, max, maxW) {
    var words = name.split(/\s+/), size, hit;
    for (size = max; size >= Math.round(max * 0.55); size -= 1) {
      setFont(size, 'Carbona-Black');
      if (ctx.measureText(name).width <= maxW && size >= max * 0.72) return { lines: [name], size: size };
      if (words.length > 1 && (hit = bestSplit(words, 2, maxW, size))) return hit;
    }
    for (size = max; size > 1; size -= 1) {
      setFont(size, 'Carbona-Black');
      if (words.length > 2 && (hit = bestSplit(words, 3, maxW, size))) return hit;
      if (words.length > 1 && (hit = bestSplit(words, 2, maxW, size))) return hit;
      if (ctx.measureText(name).width <= maxW) return { lines: [name], size: size };
    }
    return { lines: [name], size: 1 };
  }

  function drawPhoto(f) {
    var a = photoArea(f);
    ctx.save();
    ctx.beginPath(); ctx.rect(a.x, a.y, a.w, a.h); ctx.clip();
    if (!S.photo) {
      ctx.fillStyle = C.empty; ctx.fillRect(a.x, a.y, a.w, a.h);
      ctx.fillStyle = C.emptyInk; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = '44px "Carbona-Black", sans-serif';
      ctx.fillText('ADD YOUR TEAM PHOTO', a.w / 2, a.h / 2 - 22);
      ctx.font = '28px "Carbona-Bold", sans-serif';
      ctx.fillText('Tap or click here, or drop a photo', a.w / 2, a.h / 2 + 30);
    } else {
      ctx.fillStyle = C.ink; ctx.fillRect(a.x, a.y, a.w, a.h);
      var s = coverScale(a) * S.z;
      ctx.translate(a.x + a.w / 2 + S.ox * a.w, a.y + a.h / 2 + S.oy * a.w);
      ctx.rotate(S.rot * Math.PI / 180);
      ctx.drawImage(S.photo, -S.photo.width * s / 2, -S.photo.height * s / 2,
                    S.photo.width * s, S.photo.height * s);
    }
    ctx.restore();
  }

  /* ── The cup lockup ──────────────────────────────────────────────────────
     Enterprise logo across the full width L; beneath it the NL rose beside
     NATIONAL LEAGUE / TRUST CUP, the rose as tall as the two text rows and
     the text rows justified to the space left. One mark, not a title with
     logos near it. The rose is the League's own symbol and the heart of the
     Trust's logo — it carries their identity without the partner marks
     that got the full Trust logo dropped (v1.2). Every dimension is
     proportional to L, so measure once and size to whatever box it has. */
  function lockupMetrics(L) {
    // `gap` separates the logo, rose and text; `lead` is the tighter space
    // between the two text rows, which read as one name.
    var gap = L * 0.05, lead = L * 0.022, ent = logos.ent, entH = ent ? L * ent.height / ent.width : 0;
    var unit = LOCKUP.map(function (t) {
      var at100 = ink(t, 100, 'Carbona-Black');
      return { text: t, w: at100.w, k: at100.asc / at100.w };
    });
    // L = rose + gap + T, and rose = text height = T·(k1 + k2) + lead.
    var T = (L - gap - lead) / (1 + unit[0].k + unit[1].k);
    var rows = unit.map(function (u) {
      return { text: u.text, size: 100 * T / u.w, asc: u.k * T };
    });
    var rose = rows[0].asc + lead + rows[1].asc;
    return { L: L, gap: gap, lead: lead, entH: entH, rows: rows, rose: rose, h: entH + gap + rose };
  }
  function fitLockup(maxW, maxH) {
    var unit = lockupMetrics(100);
    return lockupMetrics(Math.min(maxW, 100 * maxH / unit.h));
  }
  function drawLockup(m, x, y) {
    if (logos.ent) ctx.drawImage(logos.ent, x, y, m.L, m.entH);
    y += m.entH + m.gap;
    /* Optical overshoot: a round mark sized exactly to the cap height
       touches the guides at one point each and reads small beside flat-
       topped letters, so the rose is drawn ROSE_OVERSHOOT larger, centred
       vertically on the text, left edge kept flush with the logo above. */
    if (logos.rose) {
      var o = m.rose * ROSE_OVERSHOOT / 2;
      containIn(logos.rose, x, y - o, m.rose + 2 * o, m.rose + 2 * o);
    }
    var tx = x + m.rose + m.gap;
    m.rows.forEach(function (r, i) {
      y += (i ? m.lead : 0) + r.asc;
      var e = ink(r.text, r.size, 'Carbona-Black');
      ctx.fillStyle = i === 0 ? C.ink : C.ent;
      ctx.fillText(r.text, tx + e.left, y);
    });
  }

  /* ── The club block: crest, team name, age group and season ──────────── */
  function drawClub(x, y, w, H) {
    var crest = Math.round(H * 0.84), gap = Math.round(H * 0.12);
    if (S.crest) containIn(S.crest, x, y + (H - crest) / 2, crest, crest);
    var tx = x + crest + gap, tw = w - crest - gap;
    var nm = (S.name || '').trim().toUpperCase();
    var subSize = Math.round(H * 0.11);
    for (; subSize > 1; subSize--) {
      setFont(subSize, 'Carbona-Bold');
      if (ctx.measureText(SUB).width <= tw) break;
    }
    var n = nm ? nameLines(nm, Math.round(H * 0.25), tw) : { lines: [], size: 0 };
    var cap = n.size * 0.74, lead = n.size * 0.18, subCap = subSize * 0.74, subGap = H * 0.08;
    var blockH = n.lines.length * cap + Math.max(0, n.lines.length - 1) * lead + (n.lines.length ? subGap : 0) + subCap;
    var by = y + (H - blockH) / 2;
    ctx.fillStyle = C.ink;
    setFont(n.size, 'Carbona-Black');
    n.lines.forEach(function (line, i) {
      ctx.fillText(line, tx, by + cap + i * (cap + lead));
    });
    setFont(subSize, 'Carbona-Bold'); ctx.fillStyle = C.muted;
    ctx.fillText(SUB, tx, by + blockH);
  }

  /* ── The cup block: the lockup alone. The Trust's own logo was dropped
     (21/10/2026): it carries the PFA and Premier League marks, and setting
     those beside Enterprise implied a relationship that does not exist. ─ */
  function cupBlock(maxW, H) {
    var m = fitLockup(maxW, H * 0.86);
    return { m: m, w: m.L };
  }
  function drawCup(b, x, y, H) {
    drawLockup(b.m, x, y + (H - b.m.h) / 2);
  }

  /* The brand panel. One row: club on the left, a hairline, the cup on the
     right. Two rows (Story): club above, cup centred below. */
  function drawBand(f) {
    var top = f.h - f.band;
    var stripe = 12, padX = 44, padY = f.rows === 1 ? Math.round(f.band * 0.12) : 48, gap = 36;
    ctx.fillStyle = C.white; ctx.fillRect(0, top, f.w, f.band);
    ctx.fillStyle = S.accent; ctx.fillRect(0, top, f.w, stripe);
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = C.rule;

    if (f.rows === 1) {
      var H = f.band - stripe - padY * 2, y = top + stripe + padY;
      var cup = cupBlock(f.w * 0.36, H);
      var cx = f.w - padX - cup.w, rx = cx - gap;
      ctx.fillRect(rx, y + H * 0.08, 2, H * 0.84);
      drawCup(cup, cx, y, H);
      drawClub(padX, y, rx - gap - padX, H);
    } else {
      var rowH = (f.band - f.safe - stripe - padY * 2) / 2;
      var y1 = top + stripe + padY, y2 = y1 + rowH + padY;
      drawClub(padX, y1, f.w - padX * 2, rowH);
      ctx.fillStyle = C.rule; ctx.fillRect(padX, y2 - padY / 2 - 1, f.w - padX * 2, 2);
      var c2 = cupBlock(f.w * 0.6, rowH);
      drawCup(c2, (f.w - c2.w) / 2, y2, rowH);
    }
  }

  var raf = 0;
  function draw() {
    raf = 0;
    var f = S.fmt;
    if (canvas.width !== f.w || canvas.height !== f.h) { canvas.width = f.w; canvas.height = f.h; }
    ctx.clearRect(0, 0, f.w, f.h);
    drawPhoto(f);
    drawBand(f);
  }
  function update() {
    constrain();
    syncControls();
    if (!raf) raf = requestAnimationFrame(draw);
  }

  /* ── Framing state ───────────────────────────────────────────────────── */
  function clampZ(z) { return Math.min(Z_MAX, Math.max(Z_MIN, z)); }
  function normRot(r) { r = ((r + 180) % 360 + 360) % 360 - 180; return Math.round(r * 10) / 10; }
  function resetFraming() { S.z = 1; S.rot = 0; S.ox = 0; S.oy = 0; }

  /* ── No blank space, ever ─────────────────────────────────────────────────
     Runs before every redraw, so no gesture, slider or size change can
     expose the backing colour. Worked in the photo's own (rotated)
     coordinates, where the question is simple: does the frame's area fit
     inside the image rectangle? The area rotated by -θ has a bounding box
     of half-size ex × ey, and because a rectangle is centrally symmetric,
     its four corners fit exactly when that box does. So:
       1. the scale must be at least big enough for the box to fit at all
          (a tilted photo has to zoom in to fill the corners), and
       2. the area's centre may only wander as far as leaves the box inside
          the image — clamp it there, then rotate back to canvas offsets. */
  function constrain() {
    if (!S.photo) return;
    var a = photoArea(S.fmt), iw = S.photo.width, ih = S.photo.height;
    var cover = coverScale(a), th = S.rot * Math.PI / 180;
    var cs = Math.cos(th), sn = Math.sin(th), ac = Math.abs(cs), as = Math.abs(sn);
    var ex = (a.w * ac + a.h * as) / 2, ey = (a.w * as + a.h * ac) / 2;

    var zMin = Math.max(2 * ex / iw, 2 * ey / ih) / cover;
    S.z = Math.max(zMin, Math.min(Math.max(Z_MAX, zMin), S.z));
    var s = cover * S.z;

    // Area centre relative to the image centre, in canvas pixels, then in
    // the image's unrotated, unscaled frame.
    var dx = -S.ox * a.w, dy = -S.oy * a.w;
    var ux = ( cs * dx + sn * dy) / s, uy = (-sn * dx + cs * dy) / s;
    var mx = Math.max(0, iw / 2 - ex / s), my = Math.max(0, ih / 2 - ey / s);
    ux = Math.max(-mx, Math.min(mx, ux));
    uy = Math.max(-my, Math.min(my, uy));
    dx = (cs * ux - sn * uy) * s; dy = (sn * ux + cs * uy) * s;
    S.ox = -dx / a.w; S.oy = -dy / a.w;
  }

  // Slider runs 0–1000 on a log scale so the first doublings get the travel.
  function zToSlider(z) { return Math.round(1000 * Math.log(z / Z_MIN) / Math.log(Z_MAX / Z_MIN)); }
  function sliderToZ(v) { return Z_MIN * Math.pow(Z_MAX / Z_MIN, v / 1000); }

  function syncControls() {
    els.zoom.value = zToSlider(S.z);
    els.zoomOut.textContent = Math.round(S.z * 100) + '%';
    els.rot.value = Math.round(S.rot);
    els.rotOut.textContent = Math.round(S.rot) + '°';
    var ready = !!(S.photo && S.club);
    var noPhoto = !S.photo;
    [els.zoom, els.rot, els.rot90, els.centre, els.reset].forEach(function (b) { b.disabled = noPhoto; });
    els.download.disabled = !ready;
    els.share.disabled = !ready;
    els.download.title = ready ? '' : (S.club ? 'Add a photo first' : 'Choose a club first');
  }

  /* ── Gestures ────────────────────────────────────────────────────────────
     Pointer Events cover mouse, pen and touch with one code path. One
     pointer pans; two pinch-zoom and twist-rotate around their midpoint.
     Deltas are measured in CSS pixels, so convert to canvas pixels. */
  var pointers = new Map();
  var pinch = null;

  function toCanvasScale() { return canvas.width / canvas.getBoundingClientRect().width; }
  function pairInfo() {
    var p = Array.from(pointers.values());
    var dx = p[1].x - p[0].x, dy = p[1].y - p[0].y;
    return { d: Math.hypot(dx, dy), a: Math.atan2(dy, dx), mx: (p[0].x + p[1].x) / 2, my: (p[0].y + p[1].y) / 2 };
  }

  canvas.addEventListener('pointerdown', function (e) {
    if (!S.photo) return;
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    canvas.classList.add('is-dragging');
    if (pointers.size === 2) pinch = pairInfo();
  });

  canvas.addEventListener('pointermove', function (e) {
    var p = pointers.get(e.pointerId);
    if (!p) return;
    var k = toCanvasScale(), aw = photoArea(S.fmt).w;
    if (pointers.size === 1) {
      S.ox += (e.clientX - p.x) * k / aw;
      S.oy += (e.clientY - p.y) * k / aw;
      p.x = e.clientX; p.y = e.clientY;
    } else if (pointers.size === 2 && pinch) {
      p.x = e.clientX; p.y = e.clientY;
      var now = pairInfo();
      if (pinch.d > 0) S.z = clampZ(S.z * now.d / pinch.d);
      S.rot = normRot(S.rot + (now.a - pinch.a) * 180 / Math.PI);
      S.ox += (now.mx - pinch.mx) * k / aw;
      S.oy += (now.my - pinch.my) * k / aw;
      pinch = now;
    }
    update();
  });

  function endPointer(e) {
    pointers.delete(e.pointerId);
    pinch = pointers.size === 2 ? pairInfo() : null;
    if (!pointers.size) canvas.classList.remove('is-dragging');
  }
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);

  // Wheel and trackpad pinch (which arrives as ctrl+wheel) both zoom.
  canvas.addEventListener('wheel', function (e) {
    if (!S.photo) return;
    e.preventDefault();
    S.z = clampZ(S.z * Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0015)));
    update();
  }, { passive: false });

  canvas.addEventListener('keydown', function (e) {
    if (!S.photo) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); els.file.click(); }
      return;
    }
    var step = e.shiftKey ? 0.05 : 0.01, handled = true;
    switch (e.key) {
      case 'ArrowLeft':  S.ox -= step; break;
      case 'ArrowRight': S.ox += step; break;
      case 'ArrowUp':    S.oy -= step; break;
      case 'ArrowDown':  S.oy += step; break;
      case '+': case '=': S.z = clampZ(S.z * 1.05); break;
      case '-': case '_': S.z = clampZ(S.z / 1.05); break;
      default: handled = false;
    }
    if (handled) { e.preventDefault(); update(); }
  });

  canvas.addEventListener('click', function () { if (!S.photo) els.file.click(); });

  // Drag-and-drop a file anywhere on the page.
  document.addEventListener('dragover', function (e) { e.preventDefault(); });
  document.addEventListener('drop', function (e) {
    e.preventDefault();
    var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) usePhoto(f);
  });

  /* ── Controls ────────────────────────────────────────────────────────── */
  els.pick.addEventListener('click', function () { els.file.click(); });
  els.file.addEventListener('change', function () {
    usePhoto(els.file.files[0]);
    els.file.value = '';        // so picking the same file again still fires
  });
  els.zoom.addEventListener('input', function () { S.z = clampZ(sliderToZ(+els.zoom.value)); update(); });
  els.rot.addEventListener('input', function () { S.rot = +els.rot.value; update(); });
  els.rot90.addEventListener('click', function () { S.rot = normRot(Math.round(S.rot / 90) * 90 + 90); update(); });
  els.centre.addEventListener('click', function () { S.ox = 0; S.oy = 0; update(); });
  els.reset.addEventListener('click', function () { resetFraming(); update(); });
  els.name.addEventListener('input', function () { S.name = els.name.value; update(); });

  FORMATS.forEach(function (f) {
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'chip tc-format' + (f === S.fmt ? ' active' : '');
    b.setAttribute('role', 'radio'); b.setAttribute('aria-checked', String(f === S.fmt));
    b.textContent = f.label;
    b.addEventListener('click', function () {
      S.fmt = f;
      Array.prototype.forEach.call(els.formats.children, function (c) {
        var on = c === b;
        c.classList.toggle('active', on); c.setAttribute('aria-checked', String(on));
      });
      update();
    });
    els.formats.appendChild(b);
  });

  /* Accent: the club's first listed colour that reads against white. Many
     clubs list white as primary (it is their home shirt), and a white stripe
     on a white panel is invisible. Falls back to Enterprise green. */
  function luminance(hex) {
    var m = /^#?([0-9a-f]{6})$/i.exec(hex || '');
    if (!m) return null;
    var n = parseInt(m[1], 16);
    var ch = [n >> 16, (n >> 8) & 255, n & 255].map(function (v) {
      v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
    });
    return 0.2126 * ch[0] + 0.7152 * ch[1] + 0.0722 * ch[2];
  }
  function accentFor(club) {
    var c = (club && club.colors) || {};
    var picks = [c.primary, c.secondary, c.tertiary];
    for (var i = 0; i < picks.length; i++) {
      var L = luminance(picks[i]);
      if (L !== null && L < 0.6) return picks[i];
    }
    return C.ent;
  }

  NL.clubPicker('#tcClub', {
    mode: 'search',
    season: 'current',
    placeholder: 'Search your club…',
    extraClubs: TEAMS || [],
    onSelect: function (sel) {
      S.club = sel && sel.club ? sel.club : null;
      S.accent = accentFor(S.club);
      S.crest = null;
      if (S.club) {
        S.name = S.club.name;
        els.name.value = S.name;
        loadImg(sel.crestUrl).then(function (img) { S.crest = img; update(); },
          function () { NL.toast('Crest not found for ' + S.club.name, 'info'); });
      }
      update();
    }
  });

  /* ── Export ──────────────────────────────────────────────────────────── */
  function slug(s) { return String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''); }
  function fileName() { return 'nl-trust-cup-' + slug(S.club && S.club.name) + '-' + S.fmt.key + '.png'; }
  function toBlob() {
    if (raf) { cancelAnimationFrame(raf); draw(); }
    return new Promise(function (res) { canvas.toBlob(res, 'image/png'); });
  }

  els.download.addEventListener('click', function () {
    toBlob().then(function (blob) {
      if (!blob) { NL.toast('Could not create the image', 'error'); return; }
      NL.download(fileName(), blob);
    });
  });

  // Phones: the share sheet is how a photo reaches the camera roll.
  if (navigator.canShare && navigator.canShare({ files: [new File([''], 'x.png', { type: 'image/png' })] })) {
    els.share.hidden = false;
    els.share.addEventListener('click', function () {
      toBlob().then(function (blob) {
        var file = new File([blob], fileName(), { type: 'image/png' });
        return navigator.share({ files: [file] });
      }).catch(function (err) {
        if (err && err.name !== 'AbortError') NL.toast('Sharing failed — use Download instead', 'error');
      });
    });
  }

  /* ── Boot ────────────────────────────────────────────────────────────── */
  update();
  Promise.all([
    loadFonts(),
    loadImg(LOGO_ENTERPRISE).then(function (i) { logos.ent = trimmed(i); }, function () {}),
    loadImg(LOGO_ROSE).then(function (i) { logos.rose = trimmed(i); }, function () {})
  ]).then(update);
})();
</script>
</body>
</html>
