<!DOCTYPE html>
<!--
  Fixtures & Results Graphic — public edition
  Version: v2.0 (09/10/2026)
  File: /public/fixtures-graphic/index.html

  The open door to the Fixtures & Results Graphic, for people without an NL
  Tools account — freelancers making the cards (decided with Richard,
  09/10/2026, so Sam can rebuild a card around a late postponement). The
  gated door is /graphics/fixtures-graphic/.

  THE TOOL IS NOT IN THIS FILE. Both doors load
  /graphics/fixtures-graphic/fixtures-app.js, which builds its own controls
  into #fxTool, and the same stylesheets — so the two editions cannot drift.
  (The Article Composer keeps two full copies in step by hand; its public
  copy fell four versions behind before anyone noticed.) This page carries
  only what the missing login forces:

    - no Firebase SDKs, no auth-guard.js, no nl-topbar.js, no #pageWrap
    - the white .nl-idbar instead of the red topbar (nl-brand.css v2.37:
      a page never looks more trusted than the route that opened it)

  Everything the tool reads is already public: clubs-meta, crests, the
  rounds file and the NLS API. It writes nothing anywhere except the
  downloaded PNGs and three choices in localStorage.

  Not linked from anywhere and not indexed. Anyone with the link can make a
  card — the same exposure the public Article Composer has.

  CHANGELOG
  v2.0 (09/10/2026) — First public edition, opened alongside the tool's v2.0.
-->

  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32x32.png">

  <link rel="stylesheet" href="/graphics/fixtures-graphic/fixtures-styles.css">
