<!DOCTYPE html>
<!--
  NL Tools — Clause Editor
  Version: v0.17 (22/07/2026)
  File: /tools/clause-editor/index.html

  Structured editor for the League's governing documents — computed clause
  numbering, draft and published editions.

  Storage (RTDB):
    app-data/ops-clause-editor/draft/docs/<docId>/meta        doc metadata
    app-data/ops-clause-editor/draft/docs/<docId>/nodes/<id>  clause tree (flat map)
    app-data/ops-clause-editor/editions/<editionId>           frozen published snapshots
    app-data/ops-clause-editor/publishedEditionId             pointer read by public surfaces
    app-data/ops-clause-editor/audit                          write log
    tools/ops-clause-editor                                   tool registration (label, defaults)

  Data model — every node can carry ANY combination of a computed number, an
  optional title, body prose, and children. That single rule handles all the
  documentary irregularity (heading-only articles, straight-to-.1 articles,
  clause + sub-clauses, deep nesting, fixed-exception overrides like 13.B.4).
  numStyle sets how a node's number renders; numberOverride pins an exact label.
  The displayed number is NEVER stored on the draft — it is computed from tree
  position each render by computeNumbers().

  CANON NOTE: the `.nl-doc` document-presentation block below (number gutter +
  legal clause hierarchy + reading typography) is a strong candidate to promote
  into system/nl-brand.css — the handbook already hand-rolls the 1→a→i list CSS
  locally, so this is the second use. Kept tool-local for its first outing here;
  promote in lockstep (?v= bump + Style Guide) once its shape has settled.

  Access (auth-guard registry — see system/auth-guard.js):
    superadmin/admin → edit + publish; staff/club → read the draft.
-->

    /* auth-guard fires this once the session is verified + pageWrap is

       live auth token. Do NOT read RTDB before this fires. */

      window.NL = window.NL || {};
      window.NL.session = userData;
      if (window.TOOL && window.TOOL.boot) {

  <!-- NL system scripts (lint canonical: ?v=9 / ?v=7 / ?v=8) -->
  <script src="/tools/system/nl-utils.js?v=24"></script>
  <script src="/tools/system/nl-topbar.js?v=7"></script>
  <script src="/tools/system/auth-guard.js?v=9"></script>

<style>
  /* #pageWrap default hide is in nl-brand.css; auth-guard reveals it. */

  /* Full-height shell: the side rail and the document each scroll independently,
     and the window itself does not scroll. --ce-top is the topbar height, set
     from JS (it is position:sticky and ~72px, but measured to stay exact). */
  .ce-layout { display: grid; grid-template-columns: 300px 1fr; gap: 0;
    height: calc(100dvh - var(--ce-top, 72px)); overflow: hidden; }

  /* ---- Sidebar / contents ---- */
  .ce-side {
    border-right: 1px solid var(--border); background: var(--off-white);
    padding: 0 14px 40px; overflow-y: auto; min-height: 0;
  }
  /* Sticky header: the five areas + search stay pinned while the outline scrolls. */
  .ce-side__head {
    position: sticky; top: 0; z-index: 2; background: var(--off-white);
    margin: 0 -14px 8px; padding: 16px 14px 10px; border-bottom: 1px solid var(--border);
  }
  .ce-nav { display: flex; flex-direction: column; gap: 2px; margin-bottom: 10px; }
  .ce-nav__item {
    display: block; width: 100%; text-align: left; font-family: var(--font); font-size: 13px;
    font-variation-settings: 'wght' 700; color: var(--text); background: none; border: none;
    padding: 7px 9px; border-radius: 7px; cursor: pointer;
  }
  .ce-nav__item:hover { background: var(--navy-50); }
  .ce-nav__item.is-active { background: var(--navy); color: var(--white); }
  .ce-side__season { font-size: 12px; color: var(--text-muted); margin: 0 0 10px; }
  .ce-side__search {
    width: 100%; font-family: var(--font); font-size: 13px; box-sizing: border-box;
    border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; margin-bottom: 12px;
    background: var(--white); color: var(--text);
  }
  .ce-toc { list-style: none; margin: 0; padding: 0; }
  .ce-toc__item {
    display: flex; gap: 6px; padding: 6px 8px; border-radius: 6px; cursor: pointer;
    font-size: 13px; color: var(--text); line-height: 1.35; text-decoration: none;
  }
  .ce-toc__item:hover { background: var(--navy-50); }
  .ce-toc__item.is-current { background: var(--navy); color: var(--white); }
  .ce-toc__num { color: var(--primary); font-variation-settings: 'wght' 800; flex-shrink: 0; min-width: 20px; }
  .ce-toc__item.is-current .ce-toc__num { color: var(--navy-100); }
  .ce-toc__t { font-variation-settings: 'wght' 600; }
  /* Headingless clauses (e.g. the Memorandum) show a body preview: secondary
     weight/colour, truncated to one line with an ellipsis. */
  .ce-toc__t--preview {
    flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    font-variation-settings: 'wght' 400; color: var(--text-muted);
  }
  .ce-toc__item.is-current .ce-toc__t--preview { color: var(--navy-100); }
  .ce-toc__result { font-size: 12px; color: var(--text-muted); margin-bottom: 8px; }
  .ce-toc__result b { color: var(--primary); font-variation-settings: 'wght' 800; }
  .ce-toc__group {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em;
    font-variation-settings: 'wght' 800; color: var(--navy); margin: 12px 0 4px;
  }

  /* ---- Main / toolbar ---- */
  .ce-main { min-width: 0; display: flex; flex-direction: column; overflow: hidden; }
  .ce-bar {
    flex: 0 0 auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 12px 28px; border-bottom: 1px solid var(--border); background: var(--white);
  }
  #ceDoc { flex: 1 1 auto; overflow-y: auto; min-height: 0; }
  /* Breadcrumb "you are here" — sits above the scrolling document, updates on scroll */
  .ce-crumb {
    flex: 0 0 auto; display: flex; align-items: center; gap: 8px;
    padding: 8px 28px; border-bottom: 1px solid var(--border); background: var(--off-white);
    font-size: 13px; color: var(--text-muted); min-height: 18px;
  }
  .ce-crumb:empty { display: none; }
  .ce-crumb__area { font-variation-settings: 'wght' 700; color: var(--navy); flex: 0 0 auto; }
  .ce-crumb__sep { color: var(--text-muted); flex: 0 0 auto; }
  .ce-crumb__sec { font-variation-settings: 'wght' 700; color: var(--primary); flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  @media (max-width: 860px) { .ce-crumb { padding: 8px 14px; cursor: pointer; } }
  .ce-bar__spacer { flex: 1; }
  .ce-menu-btn { display: none; }
  .ce-scrim { display: none; }
  .ce-seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .ce-seg button {
    border: none; background: var(--white); color: var(--text); font-family: var(--font);
    font-size: 13px; padding: 7px 14px; cursor: pointer; font-variation-settings: 'wght' 600;
  }
  .ce-seg button.is-on { background: var(--navy); color: var(--white); }
  .ce-mode-note { font-size: 12px; color: var(--text-muted); }

  /* ---- Mobile: side rail becomes a slide-in drawer; document goes full width ---- */
  @media (max-width: 860px) {
    .ce-layout { grid-template-columns: 1fr; }
    .ce-bar { padding: 10px 14px; }
    .ce-mode-note { display: none; }
    .ce-menu-btn {
      display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto;
      width: 38px; height: 38px; border: 1px solid var(--border); border-radius: 8px;
      background: var(--white); color: var(--navy); font-size: 17px; cursor: pointer;
    }
    .ce-side {
      position: fixed; top: var(--ce-top, 60px); left: 0; bottom: 0; width: 84%; max-width: 330px;
      z-index: 60; transform: translateX(-100%); transition: transform .24s ease;
      box-shadow: 8px 0 26px var(--navy-100);
    }
    .ce-side.is-open { transform: none; }
    .ce-scrim {
      display: block; position: fixed; inset: var(--ce-top, 60px) 0 0 0; background: var(--navy-900);
      opacity: 0; pointer-events: none; transition: opacity .24s ease; z-index: 55;
    }
    .ce-scrim.is-open { opacity: 0.42; pointer-events: auto; }
  }

  /* =====================================================================
     .nl-doc — document presentation (CANON PROMOTION CANDIDATE)
     Renders identically for editor, draft preview, published edition and
     (once repointed) the flipbook. Number lives in a gutter, never in text.
     ===================================================================== */
  .nl-doc { max-width: 820px; margin: 0 auto; padding: 30px 28px 100px; color: var(--text); font-size: 15px; line-height: 1.62; }
  @media (max-width: 860px) { .nl-doc { padding: 22px 16px 70px; } }
  .nl-doc__head { margin-bottom: 26px; padding-bottom: 18px; border-bottom: 2px solid var(--navy); }
  .nl-doc__title { font-size: 27px; font-variation-settings: 'wght' 900; color: var(--navy); line-height: 1.15; }
  .nl-doc__sub { font-size: 14px; color: var(--text-muted); margin-top: 4px; }
  .nl-doc__season { display: inline-block; margin-top: 10px; font-size: 12px; padding: 3px 10px; border-radius: 999px; background: var(--navy-50); color: var(--navy); font-variation-settings: 'wght' 700; }

  /* Article (top-level node) */
  .nl-art { margin: 30px 0 6px; scroll-margin-top: 14px; }
  .nl-art__head { display: flex; gap: 12px; align-items: baseline; }
  .nl-art__num { font-size: 18px; font-variation-settings: 'wght' 900; color: var(--primary); flex-shrink: 0; min-width: 30px; }
  .nl-art__title { font-size: 18px; font-variation-settings: 'wght' 800; color: var(--navy); letter-spacing: 0.01em; }

  /* Clause row: number gutter + body; children nest inside body → auto-indent */
  .nl-clause { display: flex; gap: 12px; margin: 9px 0; scroll-margin-top: 14px; }
  .nl-clause__num { flex-shrink: 0; min-width: 46px; text-align: left; color: var(--primary); font-variation-settings: 'wght' 800; font-size: 13px; padding-top: 1px; font-variant-numeric: tabular-nums; }
  .nl-clause__body { flex: 1; min-width: 0; }
  .nl-clause__title { font-variation-settings: 'wght' 800; color: var(--navy); }
  .nl-clause__text > p { margin: 0 0 8px; }
  .nl-clause__text > p:last-child { margin-bottom: 0; }
  /* Lists inside a clause body (imported, or made with the formatting toolbar) */
  .nl-clause__text ul, .nl-clause__text ol { margin: 6px 0 8px; padding-left: 26px; }
  .nl-clause__text ul { list-style: disc; }
  .nl-clause__text ol { list-style: decimal; }
  .nl-clause__text ol ol { list-style: lower-alpha; }
  .nl-clause__text ol ol ol { list-style: lower-roman; }
  .nl-clause__text li { margin: 2px 0; }
  .nl-clause--bullet .nl-clause__num { color: var(--text-muted); min-width: 20px; }
  /* Unnumbered nodes: collapse the empty gutter so content sits flush. */
  .nl-clause--nonum > .nl-clause__num { display: none; }
  .nl-art--nonum .nl-art__num { display: none; }
  .nl-clause__text a { color: var(--navy); }
  .nl-clause__title { margin-bottom: 2px; }

  /* ---- Tables ---- */
  .nl-tbl-wrap { overflow-x: auto; margin: 6px 0 10px; }
  .nl-tbl { border-collapse: collapse; width: 100%; font-size: 14px; }
  .nl-tbl th, .nl-tbl td { border: 1px solid var(--border); padding: 7px 10px; text-align: left; vertical-align: top; }
  .nl-tbl th { background: var(--navy-50); font-variation-settings: 'wght' 800; color: var(--navy); }
  .nl-doc.is-editing .nl-tbl [contenteditable]:focus { box-shadow: inset 0 0 0 2px var(--primary); outline: none; }
  .nl-tbl-ctrl { display: flex; gap: 6px; margin: 0 0 12px; }
  .nl-tbl-ctrl button {
    font-family: var(--font); font-size: 11px; padding: 3px 8px; border: 1px solid var(--border);
    background: var(--white); color: var(--text); border-radius: 5px; cursor: pointer;
  }
  .nl-tbl-ctrl button:hover { border-color: var(--navy); background: var(--navy-50); }

  /* Depth tints for the gutter number (subtle legal hierarchy cue) */
  .nl-clause[data-depth="2"] .nl-clause__num { color: var(--navy); }
  .nl-clause[data-depth="3"] .nl-clause__num,
  .nl-clause[data-depth="4"] .nl-clause__num { color: var(--navy-600); font-variation-settings: 'wght' 700; }

  /* ---- Editing chrome (only in edit mode) ---- */
  .nl-doc.is-editing .nl-clause__text,
  .nl-doc.is-editing .nl-clause__title,
  .nl-doc.is-editing .nl-art__title { border-radius: 5px; }
  .nl-doc.is-editing [contenteditable]:hover { box-shadow: 0 0 0 1px var(--border); }
  .nl-doc.is-editing [contenteditable]:focus { box-shadow: var(--focus-ring); outline: none; background: var(--white); }
  .nl-doc.is-editing [contenteditable] { padding: 2px 4px; min-height: 1.2em; }
  /* Placeholder shown in an empty editable slot so it's clear where to type. */
  .nl-doc.is-editing [contenteditable][data-ph]:empty::before {
    content: attr(data-ph); color: var(--text-muted); font-style: italic; pointer-events: none;
  }

  /* ---- Formatting toolbar (edit mode) ---- */
  .ce-fmt {
    flex: 0 0 auto; display: flex; align-items: center; gap: 4px; flex-wrap: wrap;
    padding: 6px 28px; border-bottom: 1px solid var(--border); background: var(--off-white);
  }
  .ce-fmt[hidden] { display: none; }
  .ce-fmt button {
    font-family: var(--font); font-size: 13px; min-width: 30px; padding: 4px 9px;
    border: 1px solid var(--border); background: var(--white); color: var(--text); border-radius: 6px; cursor: pointer;
  }
  .ce-fmt button:hover { border-color: var(--navy); background: var(--navy-50); }
  .ce-fmt__sep { width: 1px; align-self: stretch; background: var(--border); margin: 2px 4px; }
  @media (max-width: 860px) { .ce-fmt { padding: 6px 14px; } }
  .nl-clause.is-sel > .nl-clause__body { box-shadow: -3px 0 0 var(--primary); padding-left: 8px; margin-left: -11px; }
  .nl-art.is-sel { box-shadow: -3px 0 0 var(--primary); padding-left: 8px; margin-left: -11px; }

  .nl-tools { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0 2px; }
  .nl-tools button {
    font-family: var(--font); font-size: 11px; padding: 3px 8px; cursor: pointer;
    border: 1px solid var(--border); background: var(--white); color: var(--text); border-radius: 5px;
    font-variation-settings: 'wght' 600;
  }
  .nl-tools button:hover { border-color: var(--navy); background: var(--navy-50); }
  .nl-tools select {
    font-family: var(--font); font-size: 11px; padding: 2px 6px; border: 1px solid var(--border);
    border-radius: 5px; background: var(--white); color: var(--text);
  }
  .nl-tools .sep { width: 1px; align-self: stretch; background: var(--border); margin: 2px 3px; }

  .ce-empty { max-width: 560px; margin: 60px auto; text-align: center; }
  .ce-empty__card { background: var(--off-white); border: 1px solid var(--border); border-radius: 12px; padding: 30px; }
  .ce-empty h2 { color: var(--navy); margin: 0 0 8px; }
  .ce-empty p { color: var(--text-muted); margin: 0 0 18px; line-height: 1.55; }

  .ce-preview-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--navy); background: var(--navy-50); padding: 4px 10px; border-radius: 999px; font-variation-settings: 'wght' 700; }

  /* renumber-preview diff table inside NL.modal */
  .ce-diff { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 6px; }
  .ce-diff td { padding: 4px 8px; border-bottom: 1px solid var(--border); font-variant-numeric: tabular-nums; }
  .ce-diff .from { color: var(--text-muted); text-decoration: line-through; }
  .ce-diff .to { color: var(--primary); font-variation-settings: 'wght' 800; }
  .ce-diff .arrow { color: var(--text-muted); }
</style>
</head>
<body>

<!-- Topbar — auto-rendered by /tools/system/nl-topbar.js from window.NL_TOOL -->
<div id="nlTopbar"></div>

<div id="pageWrap">
  <div class="ce-layout">
    <aside class="ce-side" id="ceSide">
      <div class="ce-side__head">
        <nav class="ce-nav" id="ceDocNav" aria-label="Document areas"></nav>
        <div class="ce-side__season" id="ceDocSeason"></div>
        <input type="search" class="ce-side__search" id="ceSearch" placeholder="Search the whole handbook…" autocomplete="off">
      </div>
      <div id="ceToc"></div>
    </aside>

    <main class="ce-main">
      <div class="ce-bar" id="ceBar">
        <button class="ce-menu-btn" id="ceMenu" type="button" aria-label="Show contents">☰</button>
        <div class="ce-seg" id="ceMode">
          <button data-mode="read" class="is-on">Read</button>
          <button data-mode="edit" id="ceEditBtn" hidden>Edit</button>
        </div>
        <span class="ce-mode-note" id="ceModeNote"></span>
        <div class="ce-bar__spacer"></div>
        <button class="btn btn--ghost" id="ceReimport" type="button" hidden>Re-import</button>
        <button class="btn btn--ghost" id="ceDownload" type="button">Download HTML</button>
        <button class="btn btn--primary" id="cePublish" type="button" hidden>Publish edition</button>
      </div>
      <div class="ce-fmt" id="ceFmt" hidden>
        <button type="button" data-cmd="bold" title="Bold (Ctrl+B)"><b>B</b></button>
        <button type="button" data-cmd="italic" title="Italic (Ctrl+I)"><i>I</i></button>
        <button type="button" data-cmd="underline" title="Underline (Ctrl+U)"><u>U</u></button>
        <span class="ce-fmt__sep"></span>
        <button type="button" data-cmd="insertUnorderedList" title="Bullet list">• List</button>
        <button type="button" data-cmd="insertOrderedList" title="Numbered list">1. List</button>
        <span class="ce-fmt__sep"></span>
        <button type="button" data-cmd="removeFormat" title="Clear formatting">Clear</button>
      </div>
      <div class="ce-crumb" id="ceCrumb" title="Where you are"></div>
      <div id="ceDoc"></div>
    </main>
    <div class="ce-scrim" id="ceScrim"></div>
  </div>
</div>

<!-- Main app -->
<script>
(function () {
  'use strict';

  var BASE = 'app-data/ops-clause-editor';

  // The five governing-document areas, fixed order. Each is its own tree at
  // draft/docs/<id>/nodes. SEEDS maps an area to a best-effort import file where
  // one exists; areas without a seed are built by hand until a source arrives.
  var DOCS = [
    { id: 'memorandum',       title: 'Memorandum of Association' },
    { id: 'articles',         title: 'Articles of Association' },
    { id: 'league-rules',     title: 'League Rules' },
    { id: 'appendices',       title: 'Appendices' },
    { id: 'board-directives', title: 'Board Directives' }
  ];
  var SEEDS = { articles: 'seed-articles.json', memorandum: 'seed-memorandum.json', 'league-rules': 'seed-league-rules.json', appendices: 'seed-appendices.json', 'board-directives': 'seed-board-directives.json' };
  function docTitle(id) { for (var i = 0; i < DOCS.length; i++) if (DOCS[i].id === id) return DOCS[i].title; return id; }

  var S = {
    session: null,
    role: 'viewer',
    docId: 'articles',   // current area
    doc: { id: 'articles', title: 'Articles of Association', subtitle: '', season: '' },
    nodes: {},           // id -> node  (flat; tree via parentId + order)
    mode: 'read',        // 'read' | 'edit'
    selectedId: null,
    focusNew: null,      // node id to focus after the next commit (just-added clause)
    index: null          // cross-area search cache: { docId: {title,nodes,numMap} }
  };

  function canEdit()  { return S.role === 'admin' || S.role === 'superadmin'; }
  function canSeed()  { return S.role === 'superadmin'; }
  var esc = (window.NL && NL.escHtml) ? NL.escHtml : function (s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  };
  function $(id) { return document.getElementById(id); }

  /* ================= Numbering engine (verified against source) ================= */
  function childrenOf(nodes, pid) {
    var a = [];
    // Firebase strips null values, so a root node reads back with parentId
    // missing — treat undefined as null so root detection survives a reload.
    for (var id in nodes) {
      var p = nodes[id].parentId; if (p === undefined) p = null;
      if (p === pid) a.push(nodes[id]);
    }
    a.sort(function (x, y) { return (x.order || 0) - (y.order || 0); });
    return a;
  }
  function alpha(i, up) { var s = ''; while (i > 0) { i--; s = String.fromCharCode(65 + (i % 26)) + s; i = Math.floor(i / 26); } return up ? s : s.toLowerCase(); }
  function roman(i, up) {
    var m = [[1000, 'm'], [900, 'cm'], [500, 'd'], [400, 'cd'], [100, 'c'], [90, 'xc'], [50, 'l'], [40, 'xl'], [10, 'x'], [9, 'ix'], [5, 'v'], [4, 'iv'], [1, 'i']], s = '';
    for (var k = 0; k < m.length; k++) { while (i >= m[k][0]) { s += m[k][1]; i -= m[k][0]; } }
    return up ? s.toUpperCase() : s;
  }
  // Pure: nodes map -> { id: displayNumber }
  function computeNumbers(nodes) {
    var map = {};
    (function walk(pid, base) {
      var kids = childrenOf(nodes, pid), c = {};
      kids.forEach(function (k) {
        if (k.kind === 'bullet') { map[k.id] = '•'; walk(k.id, base); return; }
        if (k.numStyle === 'none') { map[k.id] = ''; walk(k.id, base); return; }
        c[k.numStyle] = (c[k.numStyle] || 0) + 1;
        var idx = c[k.numStyle], disp;
        if (k.numberOverride) disp = k.numberOverride;
        else if (k.numStyle === 'decimal') disp = (base ? base + '.' : '') + idx;
        else if (k.numStyle === 'lower-alpha') disp = '(' + alpha(idx) + ')';
        else if (k.numStyle === 'upper-alpha') disp = '(' + alpha(idx, true) + ')';
        else if (k.numStyle === 'lower-roman') disp = '(' + roman(idx) + ')';
        else if (k.numStyle === 'upper-roman') disp = '(' + roman(idx, true) + ')';
        else disp = '' + idx;
        map[k.id] = disp;
        // decimal / upper-alpha carry their number down; lower-alpha & lower-roman reset
        // the decimal base so a number list nested under (a)/(i) restarts (1, 2), not 23.5.1
        var childBase = (k.numStyle === 'decimal' || k.numStyle === 'upper-alpha') ? (k.numberOverride || disp)
          : ((k.numStyle === 'lower-alpha' || k.numStyle === 'lower-roman') ? '' : base);
        walk(k.id, childBase);
      });
    })(null, '');
    return map;
  }
  function depthOf(node) { var d = 0, n = node; while (n && n.parentId != null) { n = S.nodes[n.parentId]; d++; } return d; }

  /* ================= Rich-text sanitiser (edit -> stored body) ================= */
  var OK_TAGS = ['p', 'br', 'b', 'strong', 'i', 'em', 'u', 'ul', 'ol', 'li', 'a', 'span'];
  function sanitize(html) {
    var d = document.createElement('div'); d.innerHTML = html;
    (function clean(node) {
      [].slice.call(node.childNodes).forEach(function (c) {
        if (c.nodeType === 1) {
          var tag = c.tagName.toLowerCase();
          if (OK_TAGS.indexOf(tag) === -1) {
            while (c.firstChild) node.insertBefore(c.firstChild, c);
            node.removeChild(c);
          } else {
            [].slice.call(c.attributes).forEach(function (a) {
              if (!(tag === 'a' && a.name === 'href')) c.removeAttribute(a.name);
            });
            if (tag === 'a') { c.setAttribute('rel', 'noopener'); c.setAttribute('target', '_blank'); }
            clean(c);
          }
        } else if (c.nodeType === 8) { node.removeChild(c); }
      });
    })(d);
    return d.innerHTML.replace(/<div>/gi, '<p>').replace(/<\/div>/gi, '</p>');
  }

  /* ================= Render ================= */
  var STYLE_LABELS = {
    'decimal': '1, 2, 3', 'lower-alpha': '(a) (b)', 'upper-alpha': '(A) (B)',
    'lower-roman': '(i) (ii)', 'upper-roman': '(I) (II)', 'bullet': '• bullet', 'none': 'no number'
  };

  function toolbar(node) {
    if (S.mode !== 'edit' || !canEdit()) return '';
    var opts = Object.keys(STYLE_LABELS).map(function (v) {
      return '<option value="' + v + '"' + (node.numStyle === v ? ' selected' : '') + '>' + esc(STYLE_LABELS[v]) + '</option>';
    }).join('');
    return '<div class="nl-tools" contenteditable="false">' +
      '<button data-op="addAfter" title="Add a clause after this one">+ clause</button>' +
      '<button data-op="addSub" title="Add a sub-clause inside this one">+ sub</button>' +
      '<button data-op="addTable" title="Add a table after this one">+ table</button>' +
      '<span class="sep"></span>' +
      '<button data-op="outdent" title="Promote one level">← outdent</button>' +
      '<button data-op="indent" title="Demote one level">indent →</button>' +
      '<button data-op="up" title="Move up">↑</button>' +
      '<button data-op="down" title="Move down">↓</button>' +
      '<span class="sep"></span>' +
      '<select data-op="style" title="Numbering style">' + opts + '</select>' +
      '<button data-op="override" title="Pin an exact number (e.g. 13.B)">¹₂ fix…</button>' +
      '<button data-op="delete" title="Delete this clause and its children">✕</button>' +
      '</div>';
  }

  function renderNode(node, numMap) {
    var kids = childrenOf(S.nodes, node.id);
    var sel = (node.id === S.selectedId) ? ' is-sel' : '';
    var editing = (S.mode === 'edit' && canEdit());
    var num = numMap[node.id] || '';
    if (node.parentId == null) {
      // Article (top level)
      var h = '<section class="nl-art' + (num ? '' : ' nl-art--nonum') + sel + '" id="c-' + node.id + '" data-id="' + node.id + '">' +
        '<div class="nl-art__head">' +
        '<span class="nl-art__num">' + esc(num) + '</span>' +
        '<span class="nl-art__title" data-ph="Section title"' + editable('title') + '>' + esc(node.title || '') + '</span>' +
        '</div>' + toolbar(node);
      if (node.body) h += '<div class="nl-clause__text" data-ph="Write the text…" style="margin-top:6px"' + editable('body') + '>' + node.body + '</div>';
      else if (editing) h += '<div class="nl-clause__text" data-ph="Write the text…" style="margin-top:6px"' + editable('body') + '></div>';
      kids.forEach(function (c) { h += renderNode(c, numMap); });
      return h + '</section>';
    }
    var depth = depthOf(node);
    var noNum = !num && node.kind !== 'bullet';
    var cls = node.kind === 'bullet' ? ' nl-clause--bullet' : (noNum ? ' nl-clause--nonum' : '');
    var out = '<div class="nl-clause' + cls + sel + '" id="c-' + node.id + '" data-id="' + node.id + '" data-depth="' + depth + '">' +
      '<div class="nl-clause__num">' + esc(num) + '</div>' +
      '<div class="nl-clause__body">';
    if (node.title || editing) out += '<div class="nl-clause__title" data-ph="Heading (optional)"' + editable('title') + '>' + esc(node.title || '') + '</div>';
    if (node.kind === 'table') {
      out += renderTable(node, editing);
    } else {
      out += '<div class="nl-clause__text" data-ph="Write the clause text…"' + editable('body') + '>' + (node.body || '') + '</div>';
    }
    out += toolbar(node);
    kids.forEach(function (c) { out += renderNode(c, numMap); });
    return out + '</div></div>';
  }

  function renderTable(node, editing) {
    var t = node.table || { header: [], rows: [] };
    var head = Array.isArray(t.header) ? t.header : [];
    var rows = Array.isArray(t.rows) ? t.rows : [];
    var h = '<div class="nl-tbl-wrap"><table class="nl-tbl">';
    if (head.length) {
      h += '<thead><tr>' + head.map(function (c, ci) {
        return '<th' + (editing ? ' contenteditable="true" data-th="' + ci + '"' : '') + '>' + esc(c || '') + '</th>';
      }).join('') + '</tr></thead>';
    }
    h += '<tbody>' + rows.map(function (row, ri) {
      row = Array.isArray(row) ? row : [];
      return '<tr>' + row.map(function (c, ci) {
        return '<td' + (editing ? ' contenteditable="true" data-tr="' + ri + '" data-tc="' + ci + '"' : '') + '>' + esc(c || '') + '</td>';
      }).join('') + '</tr>';
    }).join('') + '</tbody></table></div>';
    if (editing) {
      h += '<div class="nl-tbl-ctrl" contenteditable="false">' +
        '<button type="button" data-tblop="addRow">+ row</button>' +
        '<button type="button" data-tblop="addCol">+ col</button>' +
        '<button type="button" data-tblop="delRow">− row</button>' +
        '<button type="button" data-tblop="delCol">− col</button>' +
        '</div>';
    }
    return h;
  }
  function editable(field) {
    return (S.mode === 'edit' && canEdit()) ? ' contenteditable="true" data-field="' + field + '"' : '';
  }

  function render() {
    var host = $('ceDoc');
    var ids = Object.keys(S.nodes);
    if (!ids.length) { S.numMap = {}; renderEmpty(); syncBar(); updateCrumb(); return; }
    var numMap = computeNumbers(S.nodes);
    S.numMap = numMap;
    var roots = childrenOf(S.nodes, null);
    var html = '<div class="nl-doc' + (S.mode === 'edit' ? ' is-editing' : '') + '" id="ceDocInner">';
    html += '<div class="nl-doc__head">' +
      '<div class="nl-doc__title">' + esc(S.doc.title) + '</div>' +
      (S.doc.subtitle ? '<div class="nl-doc__sub">' + esc(S.doc.subtitle) + '</div>' : '') +
      (S.doc.season ? '<span class="nl-doc__season">' + esc(S.doc.season) + ' edition · draft</span>' : '') +
      '</div>';
    roots.forEach(function (r) { html += renderNode(r, numMap); });
    html += '</div>';
    host.innerHTML = html;
    refreshToc();
    syncBar();
    updateCrumb();
  }

  // "You are here": breadcrumb of the current area + the top-level section
  // (article/appendix/directive) at the top of the viewport, kept in sync on scroll.
  function currentSectionEl() {
    var host = $('ceDoc'); if (!host) return null;
    // The active line must sit BELOW .nl-art's scroll-margin-top (14px), otherwise a
    // section you just jumped to lands above the line and the previous one wins.
    var line = host.getBoundingClientRect().top + 28;
    var arts = host.querySelectorAll('.nl-art'), cur = arts[0] || null;
    for (var i = 0; i < arts.length; i++) {
      if (arts[i].getBoundingClientRect().top <= line) cur = arts[i]; else break;
    }
    return cur;
  }
  function updateCrumb() {
    var crumb = $('ceCrumb'); if (!crumb) return;
    if (!Object.keys(S.nodes).length) {
      crumb.innerHTML = '<span class="ce-crumb__area">' + esc(S.doc.title || docTitle(S.docId)) + '</span>';
      return;
    }
    var el = currentSectionEl();
    var secId = el && el.dataset.id, node = secId && S.nodes[secId];
    var num = (S.numMap && secId && S.numMap[secId]) || '';
    var sec = node ? ((num ? esc(num) + ' · ' : '') + esc(node.title || '')) : '';
    crumb.innerHTML = '<span class="ce-crumb__area">' + esc(S.doc.title || docTitle(S.docId)) + '</span>' +
      (sec ? '<span class="ce-crumb__sep">›</span><span class="ce-crumb__sec">' + sec + '</span>' : '');
    // reflect the current section in the contents rail (only when showing the outline)
    if (secId && !($('ceSearch').value || '').trim()) {
      [].forEach.call($('ceToc').querySelectorAll('.ce-toc__item'), function (a) {
        a.classList.toggle('is-current', a.dataset.goto === secId);
      });
    }
  }

  function renderEmpty() {
    var title = docTitle(S.docId), hasSeed = !!SEEDS[S.docId], btn = '', msg;
    if (canSeed() && hasSeed) {
      msg = 'This area is empty. Import ' + esc(title) + ' to seed the clause tree, then refine it here.';
      btn = '<button class="btn btn--primary" id="ceImport" type="button">Import ' + esc(title) + '</button>';
    } else if (canEdit()) {
      msg = esc(title) + ' is empty. Add the first clause in Edit mode' +
        (canSeed() ? ', or send the source document and I can seed it automatically.' : '.');
    } else {
      msg = 'This area has no content yet.';
    }
    $('ceDoc').innerHTML =
      '<div class="ce-empty"><div class="ce-empty__card"><h2>' + esc(title) + '</h2><p>' + msg + '</p>' + btn + '</div></div>';
    if (btn) $('ceImport').addEventListener('click', importSeed);
  }

  // Contents rail: shows the current area's outline, or — when searching —
  // matches from across ALL areas. The search index is built once from
  // draft/docs and invalidated on any write (see commit/importSeed).
  function refreshToc() {
    if (($('ceSearch').value || '').trim()) doSearch();
    else renderTocRoots();
  }

  function renderDocNav() {
    $('ceDocNav').innerHTML = DOCS.map(function (d) {
      return '<button type="button" class="ce-nav__item' + (d.id === S.docId ? ' is-active' : '') +
        '" data-doc="' + d.id + '">' + esc(d.title) + '</button>';
    }).join('');
  }

  function renderTocRoots() {
    var numMap = computeNumbers(S.nodes);
    var host = $('ceToc');
    var roots = childrenOf(S.nodes, null);
    host.innerHTML = '<div class="ce-toc">' + roots.map(function (r) {
      var cur = (r.id === S.selectedId) ? ' is-current' : '';
      var hasTitle = !!r.title;
      var label = hasTitle ? r.title : (r.body || '').replace(/<[^>]+>/g, ' ').trim();
      var tcls = 'ce-toc__t' + (hasTitle ? '' : ' ce-toc__t--preview');
      return '<a class="ce-toc__item' + cur + '" data-goto="' + r.id + '"><span class="ce-toc__num">' + esc(numMap[r.id] || '') + '</span><span class="' + tcls + '">' + esc(label) + '</span></a>';
    }).join('') + '</div>';
  }

  // Read every area once so search can span the whole handbook.
  function buildIndex() {
    return NL.ensureAuth().then(function () {
      return db.ref(BASE + '/draft/docs').once('value');
    }).then(function (snap) {
      var all = snap.val() || {}, idx = {};
      DOCS.forEach(function (d) {
        var doc = all[d.id]; if (!doc || !doc.nodes) return;
        var nodes = doc.nodes;
        Object.keys(nodes).forEach(function (id) { normNode(nodes[id]); });
        idx[d.id] = { title: (doc.meta && doc.meta.title) || docTitle(d.id), nodes: nodes, numMap: computeNumbers(nodes) };
      });
      S.index = idx;
      return idx;
    });
  }

  function doSearch() {
    var q = ($('ceSearch').value || '').trim();
    if (!q) { renderTocRoots(); return; }
    if (!S.index) {
      $('ceToc').innerHTML = '<div class="ce-toc__result">Searching…</div>';
      buildIndex().then(function () { renderSearch(q); }).catch(function () { renderSearch(q); });
    } else {
      renderSearch(q);
    }
  }

  function renderSearch(q) {
    var ql = q.toLowerCase(), host = $('ceToc'), out = [], total = 0;
    DOCS.forEach(function (d) {
      var nodes, numMap, title;
      if (d.id === S.docId) { nodes = S.nodes; numMap = computeNumbers(S.nodes); title = S.doc.title; }      // freshest
      else if (S.index && S.index[d.id]) { nodes = S.index[d.id].nodes; numMap = S.index[d.id].numMap; title = S.index[d.id].title; }
      else return;
      var hits = [];
      Object.keys(nodes).forEach(function (id) {
        var n = nodes[id];
        var text = ((n.title || '') + ' ' + (n.body || '').replace(/<[^>]+>/g, ' ') + ' ' + tableText(n)).toLowerCase();
        if (text.indexOf(ql) !== -1 || (numMap[id] || '').toLowerCase().indexOf(ql) !== -1) hits.push(n);
      });
      if (!hits.length) return;
      total += hits.length;
      out.push('<div class="ce-toc__group">' + esc(title) + ' · ' + hits.length + '</div>');
      hits.slice(0, 40).forEach(function (n) {
        var hasTitle = !!n.title;
        var snip = hasTitle ? n.title : ((n.body || '').replace(/<[^>]+>/g, ' ').trim() || (n.kind === 'table' ? '▦ ' + tableText(n).trim() : ''));
        var tcls = 'ce-toc__t' + (hasTitle ? '' : ' ce-toc__t--preview');
        out.push('<a class="ce-toc__item" data-goto="' + n.id + '" data-doc="' + d.id + '"><span class="ce-toc__num">' + esc(numMap[n.id] || '') + '</span><span class="' + tcls + '">' + esc(snip) + '</span></a>');
      });
    });
    host.innerHTML = '<div class="ce-toc__result">' + total + ' match' + (total === 1 ? '' : 'es') + ' across the handbook</div>' +
      (out.join('') || '<div class="ce-toc__result">No matches</div>');
  }

  function scrollToNode(id) { var el = $('c-' + id); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }

  // Jump to a clause, switching area first if the match is in another document.
  function goto(docId, nodeId) {
    closeDrawer();
    S.selectedId = nodeId;
    if (docId === S.docId) { scrollToNode(nodeId); refreshToc(); return; }
    S.docId = docId; S.mode = 'read';
    load().then(function () { scrollToNode(nodeId); });
  }

  function syncBar() {
    $('ceEditBtn').hidden = !canEdit();
    $('cePublish').hidden = !canEdit() || !Object.keys(S.nodes).length;
    $('ceReimport').hidden = !(canSeed() && SEEDS[S.docId] && Object.keys(S.nodes).length);
    $('ceFmt').hidden = !(S.mode === 'edit' && canEdit());
    var note = $('ceModeNote');
    if (!canEdit()) note.textContent = 'Read-only access';
    else if (S.mode === 'edit') note.textContent = 'Editing the draft · numbers recalculate live';
    else note.textContent = '';
    [].forEach.call(document.querySelectorAll('#ceMode button'), function (b) {
      b.classList.toggle('is-on', b.dataset.mode === S.mode);
    });
    renderDocNav();
    $('ceDocSeason').textContent = S.doc.season ? S.doc.season + ' edition (draft)' : '';
  }

  /* ================= Data layer ================= */
  function nodesRef() { return db.ref(BASE + '/draft/docs/' + S.docId + '/nodes'); }
  function metaRef()  { return db.ref(BASE + '/draft/docs/' + S.docId + '/meta'); }

  function switchDoc(id) {
    if (id === S.docId) return;
    S.docId = id; S.selectedId = null; S.mode = 'read';
    if ($('ceSearch')) $('ceSearch').value = '';   // manual switch shows that area's outline
    closeDrawer();
    load();
  }

  function load() {
    // Reset to the area's fallback identity so an un-imported area still shows
    // its proper name (meta, if present, overrides below).
    var reqDoc = S.docId;
    S.doc = { id: S.docId, title: docTitle(S.docId), subtitle: '', season: '' };
    S.nodes = {};
    render(); // show the area heading / empty state immediately while data loads
    return NL.ensureAuth().then(function () {
      return Promise.all([metaRef().once('value'), nodesRef().once('value')]);
    }).then(function (res) {
      if (reqDoc !== S.docId) return; // user switched area before this resolved
      var meta = res[0].val(), nodes = res[1].val() || {};
      if (meta) S.doc = Object.assign(S.doc, meta);
      // Restore fields Firebase drops/coerces (null parentId, sparse table arrays).
      Object.keys(nodes).forEach(function (id) { normNode(nodes[id]); });
      S.nodes = nodes;
      render();
    }).catch(function (e) {
      console.error('[clause-editor] load failed', e);
      NL.toast && NL.toast('Could not load the draft: ' + (e && e.message || e), 'error');
    });
  }

  function importSeed() {
    var file = SEEDS[S.docId], title = docTitle(S.docId), target = S.docId;
    if (!file) { NL.alert('There’s no import file for ' + title + ' yet. Start it by hand in Edit mode, or send the source document to seed it.', { title: 'No source yet' }); return; }
    var hasContent = Object.keys(S.nodes).length > 0;
    var msg = hasContent
      ? 'Re-import ' + title + ' from the source? This replaces everything currently in the ' + title + ' area with a fresh import — any edits you have made here will be lost. (Other areas are unaffected.)'
      : 'Import ' + title + ' into the draft? This is a best-effort parse from the source — you’ll refine it here.';
    NL.confirm(msg, { confirmText: hasContent ? 'Replace with fresh import' : 'Import', title: (hasContent ? 'Re-import ' : 'Import ') + title, variant: hasContent ? 'danger' : 'primary' })
      .then(function (ok) {
        if (!ok) return;
        return fetch(file).then(function (r) {
          if (!r.ok) throw new Error(file + ' not found (' + r.status + ')');
          return r.json();
        });
      }).then(function (seed) {
        if (seed && target !== S.docId) { NL.toast && NL.toast('Area changed — import cancelled', 'info'); return; }
        if (!seed) return;
        var map = {}, now = Date.now();
        seed.nodes.forEach(function (n) {
          map[n.id] = {
            id: n.id, parentId: n.parentId, order: n.order || 0, kind: n.kind || 'clause',
            numStyle: n.numStyle || 'decimal', numberOverride: n.numberOverride || null,
            title: n.title || null, body: n.body || null, table: n.table || null,
            updatedAt: now, updatedBy: 'import'
          };
        });
        return NL.ensureAuth().then(function () {
          return Promise.all([
            metaRef().set({ title: seed.doc.title, subtitle: seed.doc.subtitle || '', season: seed.doc.season || '' }),
            nodesRef().set(map)
          ]);
        }).then(function () {
          S.doc = Object.assign(S.doc, seed.doc);
          S.nodes = map;
          S.index = null; // search index is now stale
          NL.writeAudit && NL.writeAudit('import', 'Imported ' + seed.nodes.length + ' nodes into ' + S.docId);
          NL.toast && NL.toast('Imported ' + seed.nodes.length + ' clauses', 'success');
          render();
        });
      }).catch(function (e) {
        NL.toast && NL.toast('Import failed: ' + (e && e.message || e), 'error');
      });
  }

  // Persist a clone as the new draft: diff against S.nodes, write changed + null-out removed.
  function commit(clone, label) {
    var updates = {}, now = Date.now();
    var who = (S.session && (S.session.name || S.session.email)) || null;
    Object.keys(clone).forEach(function (id) {
      var a = clone[id], b = S.nodes[id];
      if (!b || JSON.stringify(strip(a)) !== JSON.stringify(strip(b))) {
        a.updatedAt = now; a.updatedBy = who; updates[id] = a;
      }
    });
    Object.keys(S.nodes).forEach(function (id) { if (!clone[id]) updates[id] = null; });
    if (!Object.keys(updates).length) return Promise.resolve();
    return NL.ensureAuth().then(function () { return nodesRef().update(updates); }).then(function () {
      S.nodes = clone;
      S.index = null; // search index is now stale
      NL.writeAudit && NL.writeAudit('edit', label);
      render();
      if (S.focusNew) { focusNode(S.focusNew); S.focusNew = null; }  // drop the cursor into a just-added clause
    }).catch(function (e) {
      NL.toast && NL.toast('Save failed: ' + (e && e.message || e), 'error');
      load();
    });
  }
  function strip(n) { return { parentId: n.parentId, order: n.order, kind: n.kind, numStyle: n.numStyle, numberOverride: n.numberOverride, title: n.title, body: n.body, table: n.table || null }; }
  // Firebase returns arrays as objects when sparse — coerce a node's table back to arrays.
  function normNode(n) {
    if (n.parentId === undefined) n.parentId = null;
    if (n.order === undefined) n.order = 0;
    if (n.table) {
      var t = n.table;
      t.header = Array.isArray(t.header) ? t.header : (t.header ? Object.values(t.header) : []);
      t.rows = Array.isArray(t.rows) ? t.rows : (t.rows ? Object.values(t.rows) : []);
      t.rows = t.rows.map(function (r) { return Array.isArray(r) ? r : (r ? Object.values(r) : []); });
    }
    return n;
  }
  function clone() { return JSON.parse(JSON.stringify(S.nodes)); }
  function uid() { return 'n' + Date.now().toString(36) + Math.floor(Math.random() * 1e4).toString(36); }
  function reindex(nodes, pid) { childrenOf(nodes, pid).forEach(function (n, i) { n.order = i; }); }

  // Show a renumber preview when a structural change moves numbers, then commit.
  function previewThenCommit(c, label) {
    var before = computeNumbers(S.nodes), after = computeNumbers(c);
    var changes = [];
    Object.keys(after).forEach(function (id) {
      if (before[id] != null && before[id] !== after[id] && S.nodes[id]) changes.push([before[id], after[id]]);
    });
    var added = Object.keys(c).filter(function (id) { return !S.nodes[id]; }).length;
    var removed = Object.keys(S.nodes).filter(function (id) { return !c[id]; }).length;
    if (!changes.length) return commit(c, label);
    var rows = changes.slice(0, 40).map(function (p) {
      return '<tr><td class="from">' + esc(p[0]) + '</td><td class="arrow">→</td><td class="to">' + esc(p[1]) + '</td></tr>';
    }).join('');
    var extra = changes.length > 40 ? '<p style="color:var(--text-muted);font-size:12px">…and ' + (changes.length - 40) + ' more.</p>' : '';
    var body = document.createElement('div');
    body.innerHTML = '<p>This change will renumber <b>' + changes.length + '</b> clause' + (changes.length === 1 ? '' : 's') +
      (added ? ' · <b>' + added + '</b> added' : '') + (removed ? ' · <b>' + removed + '</b> removed' : '') + ':</p>' +
      '<table class="ce-diff">' + rows + '</table>' + extra;
    NL.modal({
      title: 'Confirm renumber', body: body, width: 'wide',
      buttons: [
        { label: 'Cancel', onClick: function (ctrl) { ctrl.close(false); } },
        { label: 'Apply', className: 'btn--primary', autofocus: true, onClick: function (ctrl) { ctrl.close(true); } }
      ],
      onClose: function (ok) { if (ok) commit(c, label); else S.focusNew = null; }
    });
  }

  // Drop the caret into a clause's body (used after adding a clause).
  function focusNode(id) {
    var el = document.querySelector('#c-' + id + ' .nl-clause__text[contenteditable]');
    if (!el) return;
    el.focus();
    try {
      var r = document.createRange(); r.selectNodeContents(el); r.collapse(true);
      var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
    } catch (e) {}
    el.scrollIntoView({ block: 'center' });
  }

  /* ================= Structural operations ================= */
  function newNode(parentId, numStyle, kind) {
    return { id: uid(), parentId: parentId, order: 0, kind: kind || 'clause', numStyle: numStyle || 'decimal', numberOverride: null, title: null, body: '' };
  }
  // Structural ops use fractional orders + reindex() so a node lands exactly
  // where intended, then orders are normalised to 0..n within each parent.
  var OPS = {
    addAfter: function (id) {
      var c = clone(), t = c[id];
      var n = newNode(t.parentId, t.kind === 'bullet' ? 'bullet' : t.numStyle, t.kind);
      n.order = (t.order || 0) + 0.5; c[n.id] = n;
      reindex(c, t.parentId);
      S.selectedId = n.id; S.focusNew = n.id;
      previewThenCommit(c, 'Add clause after ' + id);
    },
    addTable: function (id) {
      var c = clone(), t = c[id];
      var n = {
        id: uid(), parentId: t.parentId, order: (t.order || 0) + 0.5, kind: 'table',
        numStyle: 'none', numberOverride: null, title: null, body: null,
        table: { header: ['Column 1', 'Column 2'], rows: [['', ''], ['', '']] }
      };
      c[n.id] = n; reindex(c, t.parentId);
      S.selectedId = n.id;
      previewThenCommit(c, 'Add table after ' + id);
    },
    addSub: function (id) {
      var c = clone(), t = c[id];
      var childHas = childrenOf(c, id)[0];
      var style = childHas ? childHas.numStyle
        : (t.numStyle === 'decimal' ? 'decimal' : (t.numStyle === 'lower-alpha' ? 'lower-roman' : 'lower-alpha'));
      var n = newNode(id, style, 'clause');
      n.order = 1e6; c[n.id] = n;
      reindex(c, id);
      S.selectedId = n.id; S.focusNew = n.id;
      previewThenCommit(c, 'Add sub-clause under ' + id);
    },
    indent: function (id) {
      var c = clone(), t = c[id];
      var sibs = childrenOf(c, t.parentId);
      var i = sibs.map(function (x) { return x.id; }).indexOf(id);
      if (i <= 0) { NL.toast && NL.toast('Nothing above to nest under', 'info'); return; }
      var prev = sibs[i - 1], oldParent = t.parentId;
      t.parentId = prev.id; t.order = 1e6;
      reindex(c, oldParent); reindex(c, prev.id);
      previewThenCommit(c, 'Indent ' + id);
    },
    outdent: function (id) {
      var c = clone(), t = c[id];
      if (t.parentId == null) { NL.toast && NL.toast('Already at the top level', 'info'); return; }
      var parent = c[t.parentId], grand = parent.parentId, oldParent = t.parentId;
      t.parentId = grand; t.order = (parent.order || 0) + 0.5;
      reindex(c, grand); reindex(c, oldParent);
      previewThenCommit(c, 'Outdent ' + id);
    },
    up:   function (id) { move(id, -1); },
    down: function (id) { move(id, 1); },
    style: function (id, val) {
      var c = clone(); c[id].numStyle = val;
      if (val === 'bullet') c[id].kind = 'bullet'; else if (c[id].kind === 'bullet') c[id].kind = 'clause';
      previewThenCommit(c, 'Change style of ' + id + ' to ' + val);
    },
    override: function (id) {
      NL.prompt('Pin an exact number for this clause (e.g. 13.B). Leave blank to clear and use the computed number.', {
        title: 'Fixed number', default: S.nodes[id].numberOverride || ''
      }).then(function (v) {
        if (v === null) return;
        var c = clone(); c[id].numberOverride = v.trim() || null;
        previewThenCommit(c, 'Set fixed number on ' + id);
      });
    },
    delete: function (id) {
      var n = S.nodes[id];
      var kids = childrenOf(S.nodes, id).length;
      NL.confirm('Delete this clause' + (kids ? ' and its ' + kids + ' sub-clause' + (kids === 1 ? '' : 's') : '') + '? This cannot be undone.', { confirmText: 'Delete', variant: 'danger' })
        .then(function (ok) {
          if (!ok) return;
          var c = clone();
          (function rm(x) { childrenOf(c, x).forEach(function (k) { rm(k.id); }); delete c[x]; })(id);
          reindex(c, n.parentId);
          if (S.selectedId === id) S.selectedId = null;
          previewThenCommit(c, 'Delete ' + id);
        });
    }
  };
  function move(id, dir) {
    var c = clone(), t = c[id];
    var sibs = childrenOf(c, t.parentId);
    var i = sibs.map(function (x) { return x.id; }).indexOf(id);
    var j = i + dir;
    if (j < 0 || j >= sibs.length) return;
    t.order = (sibs[j].order || 0) + (dir < 0 ? -0.5 : 0.5);
    reindex(c, t.parentId);
    previewThenCommit(c, 'Move ' + id);
  }

  // Add/remove table rows and columns (structural — re-renders).
  function tableOp(id, op) {
    var node = S.nodes[id]; if (!node || !node.table) return;
    var c = clone(), t = c[id].table;
    if (!Array.isArray(t.header)) t.header = [];
    if (!Array.isArray(t.rows)) t.rows = [];
    var cols = t.header.length || (t.rows[0] ? t.rows[0].length : 1);
    if (op === 'addRow') { var r = []; for (var i = 0; i < cols; i++) r.push(''); t.rows.push(r); }
    else if (op === 'delRow') { if (t.rows.length) t.rows.pop(); }
    else if (op === 'addCol') { if (t.header.length) t.header.push(''); t.rows.forEach(function (r) { r.push(''); }); }
    else if (op === 'delCol') { if (t.header.length > 1) t.header.pop(); t.rows.forEach(function (r) { if (r.length > 1) r.pop(); }); }
    commit(c, 'Edit table ' + id);
  }

  // Persist a single table cell without re-rendering (keeps focus while tabbing).
  function saveTableCell(cell) {
    var host = cell.closest('[data-id]'); if (!host) return;
    var id = host.dataset.id, node = S.nodes[id]; if (!node || !node.table) return;
    var val = cell.textContent;
    if (cell.hasAttribute('data-th')) {
      var ci = +cell.getAttribute('data-th');
      if ((node.table.header[ci] || '') === val) return;
      node.table.header[ci] = val;
    } else {
      var ri = +cell.getAttribute('data-tr'), cc = +cell.getAttribute('data-tc');
      if (!node.table.rows[ri]) return;
      if ((node.table.rows[ri][cc] || '') === val) return;
      node.table.rows[ri][cc] = val;
    }
    NL.ensureAuth().then(function () {
      return nodesRef().child(id).update({ table: node.table, updatedAt: Date.now(), updatedBy: (S.session && (S.session.name || S.session.email)) || null });
    }).then(function () { S.index = null; }).catch(function (e) { NL.toast && NL.toast('Save failed: ' + (e && e.message || e), 'error'); });
  }

  function tableText(n) {
    if (!n.table) return '';
    var s = (n.table.header || []).join(' ');
    (n.table.rows || []).forEach(function (r) { s += ' ' + (r || []).join(' '); });
    return s;
  }

  /* ================= Publish + export ================= */
  function staticDocHtml(forExport) {
    var numMap = computeNumbers(S.nodes);
    var save = S.mode; S.mode = 'read';
    var roots = childrenOf(S.nodes, null);
    var inner = '<div class="nl-doc"><div class="nl-doc__head"><div class="nl-doc__title">' + esc(S.doc.title) + '</div>' +
      (S.doc.subtitle ? '<div class="nl-doc__sub">' + esc(S.doc.subtitle) + '</div>' : '') +
      (S.doc.season ? '<span class="nl-doc__season">' + esc(S.doc.season) + ' edition</span>' : '') + '</div>';
    roots.forEach(function (r) { inner += renderNode(r, numMap); });
    inner += '</div>';
    S.mode = save;
    return inner;
  }
  function publish() {
    NL.prompt('Name this edition (public surfaces will show this label):', { title: 'Publish edition', default: S.doc.season || '' })
      .then(function (label) {
        if (label === null) return;
        var numMap = computeNumbers(S.nodes);
        var snapshot = Object.keys(S.nodes).map(function (id) {
          return Object.assign({}, strip(S.nodes[id]), { id: id, number: numMap[id] || '' });
        });
        var edition = {
          label: label.trim() || (S.doc.season || 'Edition'), status: 'published',
          publishedAt: Date.now(), publishedBy: (S.session && (S.session.name || S.session.email)) || null,
          docs: {}
        };
        edition.docs[S.docId] = { title: S.doc.title, subtitle: S.doc.subtitle || '', html: staticDocHtml(), nodes: snapshot };
        NL.ensureAuth().then(function () {
          var ref = db.ref(BASE + '/editions').push();
          return ref.set(edition).then(function () { return db.ref(BASE + '/publishedEditionId').set(ref.key); });
        }).then(function () {
          NL.writeAudit && NL.writeAudit('publish', 'Published edition "' + edition.label + '"');
          NL.toast && NL.toast('Published edition “' + edition.label + '”', 'success');
        }).catch(function (e) { NL.toast && NL.toast('Publish failed: ' + (e && e.message || e), 'error'); });
      });
  }
  function downloadHtml() {
    var css = document.querySelector('style').textContent;
    var doc = '<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">' +
      '<title>' + esc(S.doc.title) + '</title>' +
      '<link rel="stylesheet" href="https://thenationalleague.org.uk/tools/system/nl-brand.css?v=22">' +
      '<style>body{background:var(--white)}' + css + '</style></head><body>' + staticDocHtml(true) + '</body></html>';
    NL.download(S.docId + '-' + (S.doc.season || 'draft').replace(/[^\w]+/g, '-') + '.html', doc, 'text/html');
    NL.toast && NL.toast('Downloaded', 'success');
  }

  /* ================= Events ================= */
  function closeDrawer() {
    var side = $('ceSide'), scrim = $('ceScrim');
    if (side) side.classList.remove('is-open');
    if (scrim) scrim.classList.remove('is-open');
  }
  function wire() {
    // Measure the (sticky) topbar so the shell fills the viewport exactly.
    function setTopVar() {
      var t = document.getElementById('nlTopbar');
      document.documentElement.style.setProperty('--ce-top', ((t && t.offsetHeight) || 72) + 'px');
    }
    setTopVar();
    window.addEventListener('resize', setTopVar);
    setTimeout(setTopVar, 300); setTimeout(setTopVar, 1200);

    // Mobile contents drawer
    var side = $('ceSide'), scrim = $('ceScrim'), menu = $('ceMenu');
    if (menu) menu.addEventListener('click', function () {
      var open = !side.classList.contains('is-open');
      side.classList.toggle('is-open', open);
      scrim.classList.toggle('is-open', open);
    });
    if (scrim) scrim.addEventListener('click', closeDrawer);

    // Scroll-spy breadcrumb: update "you are here" as the document scrolls.
    var crumbRaf = null;
    $('ceDoc').addEventListener('scroll', function () {
      if (crumbRaf) return;
      crumbRaf = requestAnimationFrame(function () { crumbRaf = null; updateCrumb(); });
    });
    // On mobile the breadcrumb is the quickest way back to the contents.
    $('ceCrumb').addEventListener('click', function () {
      if (menu && getComputedStyle(menu).display !== 'none') {
        side.classList.add('is-open'); scrim.classList.add('is-open');
      }
    });

    document.querySelector('#ceMode').addEventListener('click', function (e) {
      var b = e.target.closest('button[data-mode]'); if (!b) return;
      if (b.dataset.mode === 'edit' && !canEdit()) return;
      S.mode = b.dataset.mode; render();
    });
    $('ceDownload').addEventListener('click', downloadHtml);
    $('ceReimport').addEventListener('click', importSeed);
    $('cePublish').addEventListener('click', publish);
    $('ceDocNav').addEventListener('click', function (e) {
      var b = e.target.closest('[data-doc]'); if (b) switchDoc(b.dataset.doc);
    });
    $('ceSearch').addEventListener('input', doSearch);

    // Formatting toolbar: keep the editable's selection (mousedown preventDefault),
    // then apply the command to the focused clause body. The edit saves on blur.
    var fmt = $('ceFmt');
    fmt.addEventListener('mousedown', function (e) { if (e.target.closest('button')) e.preventDefault(); });
    fmt.addEventListener('click', function (e) {
      var b = e.target.closest('button[data-cmd]'); if (!b) return;
      var ed = document.activeElement;
      if (!ed || !ed.getAttribute || ed.getAttribute('contenteditable') !== 'true') {
        NL.toast && NL.toast('Click into a clause first, then format', 'info'); return;
      }
      try { document.execCommand('styleWithCSS', false, false); } catch (_) {}
      document.execCommand(b.dataset.cmd, false, null);
    });

    $('ceToc').addEventListener('click', function (e) {
      var a = e.target.closest('[data-goto]'); if (!a) return;
      goto(a.dataset.doc || S.docId, a.dataset.goto);
    });

    var doc = $('ceDoc');
    // structural op buttons + table row/col controls + select
    doc.addEventListener('click', function (e) {
      var tb = e.target.closest('[data-tblop]');
      if (tb) { var th = tb.closest('[data-id]'); if (th) tableOp(th.dataset.id, tb.dataset.tblop); return; }
      var el = e.target.closest('[data-op]'); if (!el || el.tagName === 'SELECT') return;
      var host = el.closest('[data-id]'); if (!host) return;
      var op = el.dataset.op; if (OPS[op]) OPS[op](host.dataset.id);
    });
    doc.addEventListener('change', function (e) {
      var sel = e.target.closest('select[data-op="style"]'); if (!sel) return;
      var host = sel.closest('[data-id]'); OPS.style(host.dataset.id, sel.value);
    });
    // table cell editing — quiet save on blur (no re-render, so Tab keeps working)
    doc.addEventListener('blur', function (e) {
      var cell = e.target.closest && e.target.closest('[contenteditable][data-th], [contenteditable][data-tr]');
      if (cell) saveTableCell(cell);
    }, true);
    // inline text editing — save on blur
    doc.addEventListener('blur', function (e) {
      var ed = e.target.closest('[contenteditable][data-field]'); if (!ed) return;
      var host = ed.closest('[data-id]'); if (!host) return;
      var id = host.dataset.id, field = ed.dataset.field, node = S.nodes[id];
      if (!node) return;
      var val = field === 'title' ? ed.textContent.trim() : sanitize(ed.innerHTML);
      var current = field === 'title' ? (node.title || '') : (node.body || '');
      if (val === current) return;
      var c = clone(); c[id][field] = (field === 'title' ? (val || null) : (val || null));
      commit(c, 'Edit ' + field + ' of ' + id);
    }, true);
    // select clause on focus
    doc.addEventListener('focusin', function (e) {
      var host = e.target.closest('[data-id]'); if (host) { S.selectedId = host.dataset.id; }
    });
  }

  /* ================= Boot ================= */
  window.TOOL = window.TOOL || {};
  window.TOOL.boot = function (session) {
    S.session = session;
    S.role = (session && session.role) || 'viewer';
    if (!window.NL || !NL.ensureAuth) { console.warn('[clause-editor] NL.ensureAuth missing'); return; }
    renderDocNav();
    wire();
    syncBar();
    load();
  };
  if (window._toolDeferredSession) { window.TOOL.boot(window._toolDeferredSession); delete window._toolDeferredSession; }
})();
</script>

</body>
</html>
